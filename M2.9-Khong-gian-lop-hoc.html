<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2.9 Danh sách lớp học — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.lockwrap{position:relative;display:inline-flex;align-items:center;gap:5px}
.lockwrap .lk{font-size:11px;color:var(--ink3)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover:not(:disabled){background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:7px 11px;border-radius:9px;font-size:12px;margin:0 0 10px;display:flex;gap:8px;align-items:flex-start}
.scopebar code{background:#e0e7ff;padding:0 4px;border-radius:3px;font-size:11.5px}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.roblk{background:#f8fafc;border:1px dashed var(--line2);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--ink2)}
/* huong dan dung: mot dong, LUON hien. Khac voi .dnote la ly do thiet ke, an duoc. */
.hint{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.55}
.hint b{color:var(--ink2)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink3);padding:8px 13px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:6px}
.rolnk:hover{background:#e0e7ff}
.oldwk{background:#fef3c7;border:1px solid var(--amber);color:#92400e;border-radius:9px;padding:9px 13px;font-size:12.5px;margin-bottom:11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.oldwk .sp{flex:1}

.navbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 10px}
.gsep{flex:1}
.tab1 .tsub{font-weight:400;color:var(--ink3);font-size:11px;margin-left:4px}
.tab1.on .tsub{color:var(--brand)}
.navbar .num{font-size:11.5px;color:var(--ink3)}
.navbar .num b{color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 13px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.sumbar{display:flex;gap:0;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.sumbar .it{padding:7px 15px;border-right:1px solid var(--line);font-size:12px;color:var(--ink2)}
.sumbar .it b{display:block;font-size:17px;color:var(--ink);font-weight:700;line-height:1.25}
.sumbar .it.w b{color:var(--amber)}.sumbar .it.r b{color:var(--red)}.sumbar .it.g b{color:var(--green)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage.open .listw{flex:1 1 0}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}

/* Header nhom Lop x Mon — bam de mo/thu. Khi THU van phai doc duoc con so,
   neu khong thi thu nhom = giau viec. */
.gh{display:flex;align-items:center;gap:9px;padding:9px 13px 9px 10px;background:#eef2f7;
    border-bottom:1px solid var(--line2);border-left:3px solid var(--brand);cursor:pointer;user-select:none}
.gh:hover{background:#e4ebf3}
.gh .gbtn{border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:7px;
    padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.gh .gbtn:hover{background:var(--brand);color:#fff}
.gh .num{font-size:11.5px;color:var(--ink3);white-space:nowrap}
/* Nhom rong: van co mat, nhung nhat di de khong tranh cho voi nhom co viec */
.gh.rong{background:#fbfcfe;border-left-color:var(--line2)}
.gh.rong .gt{color:var(--ink2);font-weight:700}
.gh.rong:hover{background:#f4f7fb}
.erow{padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink3);background:#fcfdff}
.gh .num b{color:var(--ink2)}
.gh .cv{flex:0 0 15px;font-size:10px;color:var(--ink3);transition:transform .12s}
.gh.on .cv{transform:rotate(90deg)}
.gh .gt{font-size:13px;font-weight:800;color:var(--ink)}
.gh .gt i{font-style:normal;font-weight:600;color:var(--ink2)}
.gh .gs{font-size:11.5px;color:var(--ink3)}
.gh .gb{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.gbar{display:flex;align-items:center;gap:8px;padding:7px 13px;background:#fff;
      border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.gbar b{color:var(--ink2)}
.brow{display:flex;gap:11px;padding:9px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.gh + .brow, .gh + .srow{background:#fcfdff}
.brow:hover{background:var(--brand-soft)}
.brow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.brow.huy{background:#fafafa;opacity:.72}
.brow.huy .bd b{text-decoration:line-through}
.brow .bd{flex:1;min-width:0}
.brow .bd b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bd .sub{font-size:11.5px;color:var(--ink3)}
/* <b> trong dong phu phai la inline: quy tac .brow .bd b{display:block} o tren
   danh cho TEN o dong tren, an nham xuong day thi dong phu bi vo lam nhieu dong */
.brow .bd .sub b{display:inline;font-size:11.5px}
.brow .pg{flex:0 0 138px}
.brow .pg .lb{font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;gap:9px}
.brow .pg .lb b{color:var(--ink);font-size:12.5px}
.brow .pg .bar{height:8px}
.bar{height:7px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:3px;display:flex}
.bar i{display:block;height:100%}
.brow .rt{flex:0 0 auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:230px}

.srow{display:flex;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.srow:hover{background:var(--brand-soft)}
.srow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.srow .ava{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.srow .bd{flex:1;min-width:0}
.srow .bd b{font-size:13px;display:block}
.srow .bd .sub{font-size:11.5px;color:var(--ink3)}
.srow .rt{flex:0 0 auto;display:flex;gap:5px;align-items:center}

.lrow{display:flex;gap:11px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.lrow:hover{background:var(--brand-soft)}
.lrow .lp{flex:0 0 160px}
.lrow .lp b{font-size:13.5px;display:block}
.lrow .lp span{font-size:11.5px;color:var(--ink3)}
.lrow .num{flex:0 0 80px;text-align:center;font-size:11px;color:var(--ink3)}
.lrow .num b{display:block;font-size:15px;color:var(--ink)}
.lrow .num.r b{color:var(--red)}.lrow .num.w b{color:var(--amber)}.lrow .num.g b{color:var(--green)}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph .n{flex:1;min-width:0}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pnav{display:flex;gap:6px;align-items:center;padding:8px 15px;border-bottom:1px solid var(--line);background:#fafbfc;font-size:12px;color:var(--ink2)}
.pnav .sp{flex:1;text-align:center}
.pbody{padding:14px 15px;max-height:calc(100vh - 260px);overflow-y:auto}
.f{display:grid;grid-template-columns:130px 1fr;gap:11px;align-items:start;padding:7px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.hl{border-color:#fde68a}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.card.hl .ch{background:var(--amber-soft);border-bottom-color:#fde68a;color:#92400e}
.ch .sp{flex:1}
.cb{padding:4px 12px}
.cb.p{padding:11px 12px}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

/* xem bai nop */
.viewer{display:grid;grid-template-columns:1fr 176px;gap:12px}
@media(max-width:760px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:230px;display:grid;place-items:center;color:#94a3b8;position:relative;overflow:hidden}
.vsheet{background:#fff;width:76%;height:86%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:12px 14px;font-size:9px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:10px;font-weight:800;margin-bottom:6px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0}
.vsheet .ln.s{width:60%}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.fld label .req{color:var(--red)}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff}
.fldi:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.fldi.err{border-color:var(--red);background:var(--red-soft)}
.mucs{display:flex;gap:6px;flex-wrap:wrap}
.muc{border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:6px 16px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.muc:hover:not(:disabled){background:var(--bg)}
.muc.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.muc.on.no{background:var(--red);border-color:var(--red)}
.muc.on.ok{background:var(--green);border-color:var(--green)}
.drop{border:1.5px dashed var(--line2);border-radius:9px;padding:14px;text-align:center;color:var(--ink3);font-size:12.5px}

table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
table.tb td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb tr:last-child td{border-bottom:none}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:200px;max-height:250px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
/* Ghi chu thiet ke: chung giai thich VI SAO, khong phai mot phan man hinh that.
   Mac dinh TAT de nhin dung giao dien nguoi dung se thay. */
body.nn .dnote{display:none!important}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:14px}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1;margin-left:auto}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:13px;font-size:11px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}

/* ===== BANG DIEM ===== */
.bd{width:100%;border-collapse:collapse;font-size:13px}

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== THOI GIAN =====
   D0 = thu Hai 17/8/2026. HOMNAY = 52 => thu Nam 8/10, tuan 8 cua hoc ky I.
   Can du lich su nhieu tuan de xem duoc khung thong ke 2 tuan / 4 tuan / hoc ky. */
const D0=new Date(2026,7,17), HOMNAY=52;
const DOWN=['CN','T2','T3','T4','T5','T6','T7'];
const dt=d=>{const x=new Date(D0);x.setDate(x.getDate()+d);return x};
const dstr=d=>{const x=dt(d);return x.getDate()+'/'+(x.getMonth()+1)};
const dow=d=>DOWN[dt(d).getDay()];
const dfull=d=>dow(d)+' '+dstr(d);
const laCN=d=>dow(d)==='CN';
/* Han nop bai khong bao gio roi vao Chu nhat — HS khong den truong de nop duoc,
   va GVBM khong co tiet de thu bai. Day khong phai chi tiet trang tri: mot han nop
   ngay nghi lam moi con so "nop dung han" sai theo. */
const ngayHocKe=d=>laCN(d)?d+1:d;
const tuanCua=d=>Math.floor(d/7)+1;
const dauTuan=t=>(t-1)*7;
const ngayHoc=t=>[0,1,2,3,4,5].map(i=>dauTuan(t)+i);   /* T2..T7 */
const TUAN_NAY=tuanCua(HOMNAY);
/* Khung thoi gian thong ke — dung chung o T4 va cac bang tong hop */
const KHUNG={hk:{t:'Cả học kỳ',n:TUAN_NAY},w4:{t:'4 tuần gần nhất',n:4},w2:{t:'2 tuần gần nhất',n:2}};
function tuanTrongKhung(k){
 const n=Math.min(KHUNG[k].n,TUAN_NAY), out=[];
 for(let t=TUAN_NAY-n+1;t<=TUAN_NAY;t++) if(t>=1) out.push(t);
 return out;
}
const ngayTrongKhung=k=>tuanTrongKhung(k).reduce((a,t)=>a.concat(ngayHoc(t).filter(d=>d<=HOMNAY)),[]);

/* ===== DANH MUC ===== */
const DT={A:'Điểm trường A — Nguyễn Tất Thành',B:'Điểm trường B — Lê Quý Đôn'};
const GV={
 lan :{n:'Trần Thị Lan',   cd:'GVCN 9A1'},
 chi :{n:'Bùi Linh Chi',   cd:'GVCN 9A2'},
 hung:{n:'Nguyễn Văn Hùng',cd:'GVCN 8A1'},
 son :{n:'Đỗ Hồng Sơn',    cd:'GVCN 8B1 · 6B1'},
 nga :{n:'Đặng Thu Nga',   cd:'GVCN 10A1'},
 hoa :{n:'Nguyễn Thị Hoa', cd:'GVCN 4A1'},
 tho :{n:'Nguyễn Thị Thơ', cd:'GVCN 5A1'},
 mai :{n:'Lê Thị Mai',     cd:'GV Toán'},
 ngan:{n:'Phạm Kim Ngân',  cd:'GV Tiếng Anh'},
 tuan:{n:'Vũ Anh Tuấn',    cd:'GV Sinh học'},
 khoa:{n:'Hoàng Văn Khoa', cd:'PHT chuyên môn'},
 dung:{n:'Ngô Tiến Dũng',  cd:'PHT đào tạo'},
 hanh:{n:'Phan Thị Bích Hạnh',cd:'Hiệu trưởng'},
 gth :{n:'Lý Văn Giám',    cd:'Giám thị'},
 vth :{n:'Lý Thanh Vân',   cd:'Văn thư'},
 qtri:{n:'Quản trị demo',  cd:'Đủ quyền (demo)'}};
const gvn=g=>(GV[g]||{n:g||'—'}).n;

const LOP={
 '9A1':{dt:'A',gvcn:'lan', hd:1},'9A2':{dt:'A',gvcn:'chi', hd:1},
 '8A1':{dt:'A',gvcn:'hung',hd:1},'8B1':{dt:'B',gvcn:'son', hd:1},
 '5A1':{dt:'A',gvcn:'tho', hd:1},'4A1':{dt:'A',gvcn:'hoa', hd:1},
 '9A9':{dt:'B',gvcn:'mai', hd:0},    /* lop da giai the — van tim lai duoc bang bo loc */
 /* Dot 1 (P7): 10A1 — lop cua vai GVCN 10A1, CHUA ghi ban can su (lop moi dau cap).
    6B1 — thay Son chu nhiem HAI lop (8B1 + 6B1) o diem truong nho. Dat CUOI de khong doi ten HS cac lop cu. */
 '10A1':{dt:'A',gvcn:'nga',hd:1},'6B1':{dt:'B',gvcn:'son',hd:1}};
const khoi=l=>+l.match(/^\d+/)[0];
const capHoc=l=>{const k=khoi(l); return k<=5?'TH':k<=9?'THCS':'THPT'};
const capTen=c=>c==='TH'?'Tiểu học':c;
const MON_THCS=['Toán','Ngữ văn','Tiếng Anh','Vật lí','Sinh học','Lịch sử'];
const MON_TH=['Tiếng Việt','Toán','Ngoại ngữ 1','Lịch sử và Địa lí','Khoa học','Tin học và Công nghệ'];
const monCua=l=>capHoc(l)==='TH'?MON_TH:MON_THCS;
const GVMON={'Toán':'mai','Ngữ văn':'lan','Tiếng Anh':'ngan','Vật lí':'khoa','Sinh học':'tuan','Lịch sử':'son',
 'Tiếng Việt':'hoa','Ngoại ngữ 1':'ngan','Lịch sử và Địa lí':'tho','Khoa học':'tuan','Tin học và Công nghệ':'tuan'};
/* Phan cong giang day — chieu tu M4.5. Don vi la cap LOP × MON (khung-menu §12), khong phai "GV day mon X".
   Mac dinh theo GVMON; ngoai le ghi rieng. Vu Anh Tuan day HAI mon o 4A1, 5A1 (Khoa hoc + Tin hoc va Cong nghe). */
const PC_RIENG={'10A1|Ngữ văn':'nga'};
const pc=(l,m)=>PC_RIENG[l+'|'+m]||GVMON[m]||'mai';

/* ===== HOC SINH ===== */
const HO=['Nguyễn','Trần','Lê','Phạm','Hoàng','Vũ','Đặng','Bùi','Đỗ','Hồ','Ngô','Dương','Lý','Đinh'];
const DEM=['Văn','Thị','Minh','Anh','Quốc','Thu','Hải','Ngọc','Gia','Khánh','Hoài','Bảo'];
const TENR=['An','Bình','Chi','Dũng','Giang','Hà','Hùng','Khoa','Linh','Mai','Nam','Oanh',
 'Phúc','Quân','Sơn','Trang','Uyên','Vy','Xuân','Yến','Đạt','Thảo','Nhi','Long'];
let _sd=20260817;
const rnd=()=>{_sd=(_sd*1103515245+12345)&0x7fffffff; return _sd/0x7fffffff};
const pick=a=>a[(rnd()*a.length)|0];
const HS={};
Object.keys(LOP).forEach(l=>{
 for(let i=1;i<=12;i++){
  const id=l+'-'+String(i).padStart(2,'0');
  const o={ho:pick(HO),dem:pick(DEM),ten:pick(TENR),lop:l,
   sdt:'09'+String(10000000+((rnd()*89999999)|0)),
   ph:pick(HO)+' '+pick(DEM)+' '+pick(TENR)};
  o.n=o.ho+' '+o.dem+' '+o.ten;
  HS[id]=o;
 }});
const NHAN={};
const dsL=l=>Object.keys(HS).filter(h=>HS[h].lop===l);
NHAN[dsL('9A1')[2]]=[['uu','Hộ nghèo — miễn giảm học phí']];
NHAN[dsL('9A1')[5]]=[['yt','Dị ứng hải sản'],['kl','Đang trong thời hiệu kỷ luật đến 15/11']];
NHAN[dsL('9A1')[8]]=[['yt','Hen suyễn — có thuốc tại phòng y tế']];
NHAN[dsL('4A1')[1]]=[['uu','Con thương binh']];
NHAN[dsL('8A1')[4]]=[['kl','Đang trong thời hiệu kỷ luật đến 30/10']];
const NHANM={uu:{t:'Ưu tiên',c:'b'},yt:{t:'Sức khỏe',c:'r'},kl:{t:'Kỷ luật',c:'v'}};
const sapTen=(a,b)=>HS[a].ten.localeCompare(HS[b].ten,'vi')||HS[a].dem.localeCompare(HS[b].dem,'vi')
 ||HS[a].ho.localeCompare(HS[b].ho,'vi')||a.localeCompare(b);
const hsLop=l=>dsL(l).sort(sapTen);
const siSo=l=>dsL(l).length;

/* ===== DIEM DANH (T2 — M2.9 la chu so huu) ===== */
const TTDD={
 cm :{t:'Có mặt',        c:'o', k:'✓'},
 vcp:{t:'Vắng có phép',  c:'b', k:'P'},
 vkp:{t:'Vắng không phép',c:'r',k:'K'},
 vcr:{t:'Vắng chưa rõ lý do',c:'w',k:'?'},
 dm :{t:'Đi muộn',       c:'v', k:'M'}};
/* GY18-H1 — hai nhan nguon moi. 'goiy' KHONG phai ban ghi: no la tang ②, hien o o con trong.
   'doichieu' la ket luan CUA GVCN sinh tu goi y — truy duoc ca nguoi chot lan nguon goi y. */
const NGUON={gvcn:'GVCN chấm',don:'Từ đơn xin nghỉ (M2.4)',gvbm:'GVBM ghi biến động trong tiết (M2.2)',
 cam:'Camera cổng',goiy:'⧉ Gợi ý từ sổ đầu bài',doichieu:'GVCN đã đối chiếu'};
const DD={};
const ddk=(l,d,h)=>l+'|'+d+'|'+h;
const ddGet=(l,d,h)=>DD[ddk(l,d,h)]||null;
function ddSet(l,d,h,o){DD[ddk(l,d,h)]=Object.assign({at:HOMNAY},o)}
const CHOT_TUAN={};
const chotTuan=t=>!!CHOT_TUAN[t];

Object.keys(LOP).filter(l=>LOP[l].hd).forEach(l=>{
 const hs=hsLop(l);
 for(let d=0;d<=HOMNAY;d++){
  if(laCN(d)) continue;
  if(d===HOMNAY&&(l==='9A2'||l==='8B1')) continue;   /* hai lop chua diem danh hom nay */
  /* 9A1 la lop cua vai GVCN mac dinh — de chua cham vai em de thao tac
     "Diem danh nhanh" nhin thay duoc ngay o vai mac dinh, khong phai doi vai moi thay */
  hs.forEach(h=>{
   const r=rnd();
   let o={tt:'cm',ng:'gvcn',by:LOP[l].gvcn};
   if(r<0.028) o={tt:'vcp',ly:'Ốm — có đơn của gia đình',ng:'don',by:'sys'};
   else if(r<0.042) o={tt:'vkp',ng:'gvcn',by:LOP[l].gvcn};
   else if(r<0.053) o={tt:'vcr',ng:'gvcn',by:LOP[l].gvcn};
   else if(r<0.070) o={tt:'dm',gio:'07:'+String(15+((rnd()*25)|0)),ng:'gvcn',by:LOP[l].gvcn};
   if(d===HOMNAY&&l==='9A1'&&hs.indexOf(h)%4===1) return;   /* 3 em chua cham */
   ddSet(l,d,h,o);
  });
 }
});
/* Bien dong Lop 3 do GVBM ghi trong tiet */
const LYDO_TIET=['Lên phòng y tế','Tham dự hoạt động chung của trường','Tham dự cuộc thi / sự kiện',
 'Được gọi lên BGH / phòng giáo vụ','Chưa rõ lý do'];
const BD=[];
Object.keys(LOP).filter(l=>LOP[l].hd).forEach(l=>{
 const hs=hsLop(l), ms=monCua(l);
 for(let d=Math.max(0,HOMNAY-30);d<=HOMNAY;d++){ if(laCN(d)) continue;
  if(rnd()<0.22){const t=1+((rnd()*5)|0), m=ms[(d*5+t)%ms.length];
   BD.push({l:l,d:d,h:pick(hs),tiet:t,mon:m,ly:pick(LYDO_TIET),gv:pc(l,m)})}
 }});

/* ===== GY18-H1 · TANG ① — XAC NHAN SI SO CUA TIET (du lieu cua M2.2, M2.9 chi DOC) =====
   s.xn = null (chua nhap) | {du:1} (xac nhan lop du) | {du:0,ds:[hs]} (xac nhan co vang, KEM TEN).
   Khac biet giua "chua nhap" va "xac nhan lop du" chinh la thu ma M2.9 can de biet co nen tin hay khong. */
function tietDau(l,d,b){const ts=tietCua(l).filter(t=>BUOI(t)===b&&SDB[sdbk(l,d,t)]); return ts.length?ts[0]:null}
const buoiCo=(l,d)=>['sang','chieu'].filter(b=>tietDau(l,d,b)!=null);

/* Ngay da qua: xac nhan cua tiet dau KHOP voi ban chot cua GVCN — khong de goi y cu lam nhieu man hinh.

Object.keys(LOP).filter(l=>LOP[l].hd).forEach(l=>{

  buoiCo(l,d).forEach(b=>{
   const t=tietDau(l,d,b), s=SDB[sdbk(l,d,t)]; if(!s) return;
   const vang=hsLop(l).filter(h=>{const r=ddGet(l,d,h); return r&&r.tt!=='cm'&&r.tt!=='dm'});
   s.xn=vang.length?{du:0,ds:vang,luc:'07:0'+(1+(t%8))}:{du:1,luc:'07:0'+(1+(t%8))};

 }});

/* ===== TANG ② — GOI Y CUA MAY =====
   Cung khuon ba tang da dung o YK-01 (cham cong tiet · M4.9 §4f.2) va diem danh KTX (M6.10 §2.1):
   ① nguon ghi nhan -> ② may ghep thanh GOI Y -> ③ NGUOI KET LUAN. O day tang ③ la GVCN.
   Goi y la DAN XUAT: sinh lai bat cu luc nao, KHONG luu thanh ban ghi, va KHONG chay ra ngoai man hinh nay
   (khong sang bang tuan, khong vao bao cao chuyen can, khong gui thong bao cho phu huynh). */
function goiY(l,d){
 const out={};
 if(laCN(d)) return out;
 buoiCo(l,d).forEach(b=>{
  const t=tietDau(l,d,b), s=SDB[sdbk(l,d,t)];
  if(!s||!s.xn) return;
  const ng={b:b,t:t,mon:s.mon,gv:s.gv,luc:s.xn.luc};
  if(s.xn.du) hsLop(l).forEach(h=>{(out[h]=out[h]||[]).push(Object.assign({tt:'cm'},ng))});
  /* xac nhan "co em vang" chi noi ve DUNG NHUNG EM DUOC NEU TEN — cac o con lai VAN TRONG (H1-2).
     Nguoi thay chi khang dinh phan ho thay thieu; "ca lop du" la mot khang dinh KHAC, co nut rieng. */
  else s.xn.ds.forEach(h=>{(out[h]=out[h]||[]).push(Object.assign({tt:'vcr'},ng))});
 });
 return out;
}
const nhomTT=tt=>(tt==='cm'||tt==='dm')?'co':'vang';
/* Nguon goi y theo buoi — ve ca khi KHONG co goi y nao, de man hinh noi ro vi sao (H1-5) */
const nguonGY=(l,d)=>buoiCo(l,d).map(b=>{const t=tietDau(l,d,b), s=SDB[sdbk(l,d,t)];
 return {b:b,t:t,mon:s.mon,gv:s.gv,ghi:!!s.ky,xn:s.xn||null}});
/* O con trong + co goi y => tu dien (hien o chinh o do, nhan nguon di kem) */
const oTrongCoGY=(l,d)=>{const g=goiY(l,d); return hsLop(l).filter(h=>!ddGet(l,d,h)&&g[h])};
/* O da co trang thai do GVCN dat, goi y noi KHAC NHOM => de nghi dinh chinh, KHONG de */
function lechGY(l,d){
 const g=goiY(l,d);
 return hsLop(l).filter(h=>{const r=ddGet(l,d,h);
  return r&&!r.dc&&g[h]&&g[h].some(z=>nhomTT(z.tt)!==nhomTT(r.tt))});
}

/* ===== VIEC CAN LAM CUA MOT LOP ===== */
function viecLop(l){
 const v=[];
 if(LOP[l].hd){
  const chua=hsLop(l).filter(h=>!ddGet(l,HOMNAY,h)).length;
  if(!laCN(HOMNAY)&&chua) v.push({k:'dd',t:'Chưa điểm danh hôm nay',n:chua+' HS',tab:'T2'});
  const b=bcGet(l,TUAN_NAY-1);
  if(b.tt==='cho') v.push({k:'bc',t:'Báo cáo tuần '+(TUAN_NAY-1)+' chờ nhận xét',n:'',tab:'T6'});
  /* GVCN: de nghi CUA MINH dang cho PHT_DT. BGH: moi viec cho chinh ho gom vao mot badge -> tab ✅ (P7B) */
  const yc=YCDD.filter(x=>x.l===l&&x.tt==='cho').length;
  if(yc&&lens(l)==='cn') v.push({k:'yc',t:'Đề nghị sửa điểm danh chờ PHT duyệt',n:yc+' đề nghị',tab:'T2'});
  const cd=tkLop(l,'cho').length;
  if(cd) v.unshift({k:'cd',t:'✅ Chờ bạn duyệt',n:cd+' việc',tab:'CD'});
  /* Moc ky chot dau tien: THCS-THPT la HK I; tieu hoc la CUOI HK I (§7.4.1 — hai moc giua ky khong ky) */
  const kMoc=kyMac(l);
  if(!(KYTK[l+'|'+kMoc]||{}).ky) v.push({k:'tk',t:'Chưa ký chốt đánh giá '+KY[kMoc],n:'',tab:'T7'});
  const kh=bcsKhuyet(l);
  if(kh.length) v.push({k:'bcs',t:bcsDang(l).length?'Ban cán sự khuyết':'Chưa ghi ban cán sự lớp',
   n:bcsDang(l).length?kh.join(', '):'',tab:'T1'});
 }
 return v;
}
/* Viec ton cua GVBM tren mot lop — CHI dem viec cua mon minh (tiet chua GHI so tuan nay, nguon M2.2).
   YK-01: so dau bai khong con 'ky'; truong du lieu s.ky giu ten cu = 'da ghi xong'. KHONG chieu cham cong vao day (YK01-Z1-1). */
function viecBM(l){
 const v=[]; if(!LOP[l].hd) return v;
 const ms=monToi(l); let n=0;
 ngayHoc(TUAN_NAY).filter(d=>d<=HOMNAY).forEach(d=>{for(const t of tietCua(l)){const s=SDB[sdbk(l,d,t)];
  if(s&&!s.ky&&ms.indexOf(s.mon)>=0)n++}});
 if(n) v.push({k:'ky',t:'Tiết '+ms.join(' · ')+' chưa ghi sổ',n:n+' tiết',tab:'T3'});
 return v;
}
const viecCua=l=>lens(l)==='bm'?viecBM(l):viecLop(l);

function tabsCho(){
 if(R().chiT1) return ['T1'];
 if(laBM()) return TAB_BM;
 const t=TABS.map(x=>x[0]).filter(k=>k!=='CD');
 /* Tab cho duyet chi co mat khi vai CO VIEC o lop nay; dang dung o tab thi giu toi khi roi lop (het viec khong mat tab duoi tay) */
 if(role==='FULL'||tkLop(cur,'cho').length||mo.cdGiu===cur) t.push('CD');
 return t;
}
function tabsHTML(){
 const cho=tabsCho();
 if(cho.indexOf(tab)<0) tab=cho[0];
 return TABS.filter(t=>cho.indexOf(t[0])>=0).map(([k,t,own])=>{
  if(k==='CD'){const n=tkLop(cur,'cho').length;
   return '<button class="tab1'+(tab===k?' on':'')+'" data-a="tab" data-v="CD">'+t+'<span class="tsub">🔒 · ticket M0.2</span>'

/* ---------- TIER 1: DANH SACH LOP ---------- */
function viewDS(){
 mo.hd=mo.hd===undefined?'1':mo.hd;
 const ls=lopTrongScope().filter(l=>mo.hd==='*'||String(LOP[l].hd)===mo.hd)
  .filter(l=>!mo.q||l.toLowerCase().indexOf(mo.q.toLowerCase())>=0
    ||gvn(LOP[l].gvcn).toLowerCase().indexOf(mo.q.toLowerCase())>=0)
  .sort();
 /* User chi co 1 lop thi vao thang — nhung van cho duong quay lai danh sach */
 const bar='<div class="navbar">'
  +'<input class="fldi" style="width:230px" placeholder="Tìm lớp hoặc GVCN…" data-ch="q" value="'+esc(mo.q||'')+'">'
  +'<div class="seg">'+[['1','Đang hoạt động'],['0','Không hoạt động'],['*','Tất cả']]
    .map(([k,t])=>'<button class="'+(mo.hd===k?'on':'')+'" data-a="hd" data-v="'+k+'">'+t+'</button>').join('')+'</div>'
  +'<div class="gsep"></div><span class="num"><b>'+ls.length+'</b> lớp</span></div>';
 if(!ls.length) return bar+'<div class="listw"><div class="empty">Không có lớp nào khớp bộ lọc.'
  +'<div class="hint" style="margin-top:8px">Lớp đã giải thể <b>không bị xoá</b> — chuyển bộ lọc sang '
  +'<b>Không hoạt động</b> hoặc <b>Tất cả</b> để tìm lại.</div></div></div>';
 const nhom={};
 ls.forEach(l=>{(nhom[LOP[l].dt]=nhom[LOP[l].dt]||[]).push(l)});
 return bar+'<div class="stage"><div class="listw">'
  +Object.keys(nhom).sort().map(d=>'<div class="grow">🏫 '+esc(DT[d])
   +'<span class="ct">'+nhom[d].length+' lớp</span></div>'
   +nhom[d].map(l=>{const v=viecCua(l), ln=lens(l);
    return '<div class="brow'+(LOP[l].hd?'':' huy')+'" data-a="mo" data-v="'+l+'">'
     +'<div class="bd"><b>Lớp '+l+'</b>'
     +(ln==='cn'?' <span class="st2 o">Chủ nhiệm</span>':'')
     +(ln==='bm'?' <span class="st2 b">Bạn dạy: '+esc(monToi(l).join(' · '))+'</span>':'')
     +'<div class="sub">'+capTen(capHoc(l))+' · GVCN <b>'
     +esc(gvn(LOP[l].gvcn))+'</b> · '+siSo(l)+' học sinh</div></div>'
     +'<div class="rt">'+(LOP[l].hd
       ?(v.length?v.map(x=>x.k==='cd'?'<span class="st2 b" style="cursor:pointer" data-a="moCD" data-v="'+l+'" '
           +'title="Mở thẳng tab Nội dung chờ duyệt của lớp này">'+x.t+' — '+x.n+'</span>'
         :'<span class="st2 '+(x.k==='dd'?'r':'w')+'">'+x.t+(x.n?' — '+x.n:'')+'</span>').join('')
         :'<span class="st2 o">✓ không có việc tồn'+(ln==='bm'?' của môn bạn dạy':'')+'</span>')
       :'<span class="st2 n">Không hoạt động</span>')+'</div></div>'}).join('')).join('')
  +'<div class="lgd dnote">Danh sách dựng từ <b>phạm vi của vai</b>, không dựng từ dữ liệu — '
  +'lớp chưa có hoạt động nào vẫn phải có mặt. Lớp giải thể <b>không xoá</b>, chỉ đổi trạng thái và '
  +'có bộ lọc tìm lại.'+(R().gvr?' Vai giáo viên: phạm vi = lớp <b>chủ nhiệm</b> ∪ lớp <b>được phân công dạy</b> '
   +'<i>(M4.5)</i>; ở lớp chỉ dạy, badge <b>chỉ đếm việc của môn mình</b>.':'')+'</div></div></div>';
}

  +'🔗 chiếu từ <b>M1.1 Hồ sơ học sinh</b> <i>(chỉ đọc)</i> · <b>ban cán sự lớp và chia tổ</b> 🔒 do <b>menu này</b> '
  +'sở hữu <i>(TT 15/2026 Điều 16)</i>. <button class="rolnk" data-a="dl" data-v="M1.1 Hồ sơ học sinh">↗ Mở M1.1</button></div>';

  +'Ghi và sửa đều làm ở menu chủ — ở đây gộp lại theo lớp để giáo viên chủ nhiệm nhìn một chỗ. '
  +'<button class="rolnk" data-a="dl" data-v="'+esc(CHU[k])+'">↗ Mở '+esc(CHU[k].split(' ')[0])+'</button></div>';
}

     +'phụ huynh, nên người bấm phải <b>nhìn thấy mình đang xác nhận cho những em nào</b>.</div>',
     [['Huỷ','',closeM],['Xác nhận — đặt Có mặt cho '+chua.length+' em','p',()=>{
       chua.forEach(h=>ddSet(cur,ngay,h,{tt:'cm',ng:'gvcn',by:toiLa()}));
       closeM(); render();
       toast('⚡ Đã điểm danh nhanh <b>'+chua.length+' học sinh</b> là <b>Có mặt</b>. '
        +'Bản ghi mang nguồn <b>GVCN chấm</b> và ghi audit.')}]]); return}
  case 'cam': {modal('📷 Ảnh cổng trường — '+dfull(ngay),
    '<div class="ro">Chế độ điểm danh <b>Camera cổng chụp ảnh</b>: camera tự chụp mỗi 1–2 phút trong khung '
    +'6:30–8:00, hệ thống lưu ảnh kèm giờ. <b>Không có nhận diện AI</b> — đây là công cụ để giáo viên chủ nhiệm '
    +'<b>đối chiếu mắt thường</b> khi nghi ngờ, không phải điểm danh tự động.</div>'
    +'<div class="empty" style="padding:34px"><b>Chưa nối camera cổng của trường.</b>'
    +'<div class="hint" style="margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto">'
    +'Giao diện đã sẵn sàng. Khi trường lắp camera IP ở cổng và chạy script upload ảnh, mục này hiển thị ngay. '
    +'Bản demo <b>không dựng ảnh giả</b>: dựng ảnh giả sẽ khiến người xem tin rằng chức năng đã chạy được.</div></div>',
    [['Đóng','',closeM]]); return}
  case 'ycMoi': {const hs=hsLop(cur);
    modal('Gửi đề nghị sửa điểm danh',
     '<div class="ro">Dùng khi tuần <b>đã chốt</b>. PHT đào tạo là người duyệt.</div>'
     +'<div class="fld"><label>Học sinh</label><select class="fldi" id="ycHS">'
     +hs.map(h=>'<option value="'+h+'">'+esc(HS[h].n)+'</option>').join('')+'</select></div>'
     +'<div class="fld"><label>Ngày</label><select class="fldi" id="ycD">'
     +Array.from({length:HOMNAY+1},(_,i)=>i).filter(d=>!laCN(d)&&chotTuan(tuanCua(d))).slice(-25)
       .map(d=>'<option value="'+d+'">'+dfull(d)+' (tuần '+tuanCua(d)+')</option>').join('')+'</select></div>'
     +'<div class="fld"><label>Sửa thành</label><select class="fldi" id="ycM">'
     +Object.keys(TTDD).map(k=>'<option value="'+k+'">'+TTDD[k].t+'</option>').join('')+'</select></div>'
     +'<div class="fld"><label>Lý do <span class="req">*</span></label>'
     +'<input class="fldi" id="ycL" placeholder="Vì sao con số cũ sai?"></div>',
     [['Huỷ','',closeM],['Gửi đề nghị','p',()=>{
       const l=$('#ycL').value.trim(); if(!l){toast('⛔ <b>Lý do là bắt buộc</b> — người duyệt không có gì để cân nhắc.'); return}
       const hh=$('#ycHS').value, dd=+$('#ycD').value, r=ddGet(cur,dd,hh);
       YCDD.push({id:'YC-'+(++YCSEQ),l:cur,d:dd,h:hh,cu:r?r.tt:'cm',moi:$('#ycM').value,ly:l,
        by:toiLa(),at:HOMNAY,tt:'cho'});
       closeM(); mo.t2='yc'; render(); toast('✉ Đã gửi đề nghị cho <b>PHT đào tạo</b>.')}]]); return}
  /* --- ✅ Noi dung cho duyet (P7B) --- */
  case 'moCD': cur=v; tab='CD'; mo={t2:'ngay',k4:'w4',cdGiu:v}; ngay=HOMNAY; tuan=TUAN_NAY-1; kytk='hk1'; render(); return;
  case 'cdMo': tab='CD'; mo.cdF='cho'; mo.cd=v; mo.cdGiu=cur; render(); return;
  case 'cdSel': mo.cd=v||null; render(); return;
  case 'cdF': mo.cdF=v; mo.cd=undefined; render(); return;
  case 'cdDL': {const t=tkId(v); toast('🔗 Deep-link <code>/'+t.src+'?ctx='+t.id+'&amp;action=duyet&amp;return=M2.9</code> — '
    +'mở sẵn ticket ở menu chủ; duyệt xong quay về lớp '+esc(t.l)+'.'); return}
  case 'cdOK': {const t=tkId(v);
    if(t.own==='dd'){const y=t.ref; y.tt='duyet'; y.xl='dung'; y.xat=HOMNAY; y.nd=toiLa();
      ddSet(y.l,y.d,y.h,Object.assign({},ddGet(y.l,y.d,y.h)||{},{tt:y.moi,ng:'gvcn',by:y.by,ly:y.ly}));
      mo.cd=undefined; render(); toast('✓ Đã duyệt — điểm danh đã sửa, <b>ghi audit</b> kèm giá trị cũ và người duyệt. '
       +'Ticket rời hàng đợi M0.2.'); return}
    if(t.own==='mk'){const xong=cach=>{const y=t.ref; y.tt='ok'; y.xat=HOMNAY; y.nd=toiLa(); y.kyso=cach;
       delete KYTK[y.l+'|'+y.k]; closeM(); mo.cd=undefined; render();
       toast('🔓 Đã mở khoá — <b>'+KY[y.k]+'</b> lớp '+esc(y.l)+' về <b>chưa chốt</b>; M3.1 <b>mất hiệu lực</b> tới khi ký lại.'
        +(cach==='bo'?' Bỏ qua ký số — <b>ghi audit</b>, đồng bộ M4.3.':''))};
      if(!t.ks){xong(''); return}
      modal('🔏 Ký số — đồng ý mở khoá '+KY[t.ref.k]+' lớp '+esc(t.l),
       '<div class="ro">Học bạ đã qua tầng 3 nên quyết định này cần <b>chữ ký số Nhóm A</b> của Hiệu trưởng '
       +'<i>(Ký số Option — Nhóm A được bỏ qua, có ghi audit)</i>.</div>',
       [['Huỷ','',closeM],['Bỏ qua ký số','',()=>xong('bo')],['Ký bằng USB Token / SmartCA','g',()=>xong('ky')]]); return}
    t.tt='ok'; t.nd=toiLa(); t.xat=HOMNAY; mo.cd=undefined; render();
    toast('✓ Đã duyệt qua <b>API của '+t.src+'</b> · audit <code>nguon_thao_tac = "M2.9"</code> · ticket rời M0.2.'
     +(t.src==='M2.4'?' Các ngày nghỉ sẽ ghi <b>Vắng có phép — từ đơn</b> ở T2.':'')); return}
  case 'cdNo': case 'cdBS': {const t=tkId(v), no=a==='cdNo';
    modal((no?'✕ Từ chối — ':'↩ Yêu cầu bổ sung — ')+esc(t.loai),
     '<div class="fld"><label>'+(no?'Lý do từ chối':'Nội dung cần bổ sung')+' <span class="req">*</span></label>'
     +'<textarea class="fldi" id="cdLy" rows="3" placeholder="Ít nhất 10 ký tự — người gửi đọc câu này"></textarea></div>',
     [['Huỷ','',closeM],[no?'Từ chối':'Gửi yêu cầu','p',()=>{const l=$('#cdLy').value.trim();
       if(l.length<10){toast('⛔ Cần <b>ít nhất 10 ký tự</b> — người gửi không có gì để sửa theo.'); return}
       if(t.own==='dd'){const y=t.ref; y.tt='duyet'; y.xl='tuchoi'; y.xat=HOMNAY; y.nd=toiLa(); y.gc=l}
       else if(t.own==='mk'){const y=t.ref; y.tt='no'; y.xat=HOMNAY; y.nd=toiLa(); y.gc=l}
       else {t.tt=no?'no':'bs'; t.nd=toiLa(); t.xat=HOMNAY; t.gc=l}
       closeM(); mo.cd=undefined; render();
       toast(no?'✕ Đã từ chối — dữ liệu <b>giữ nguyên</b>, người gửi nhận thông báo kèm lý do.'
        :'↩ Ticket về <b>chờ bổ sung</b> — tra lại ở bộ lọc <b>Đã xử lý</b>.')}]]); return}

  /* --- T6 --- */
  case 'rlt': {rltSet(cur,tuan,el.dataset.h,v); render(); return}
  case 'bcPub': {const b=bcGet(cur,tuan);
    if(!b.nx.trim()){toast('⛔ <b>Nhận xét chung là bắt buộc.</b>'); return}
    modal('Publish báo cáo tuần '+tuan+' — lớp '+esc(cur),
     '<div class="warn">Sau khi publish, <b>phụ huynh đọc được ngay</b> và báo cáo <b>không sửa được nữa</b> — '
     +'muốn nói thêm thì tạo <b>bản bổ sung</b>, bản gốc vẫn giữ. Không có bước duyệt của Ban giám hiệu.</div>'
     +'<div class="roblk">Phụ huynh sẽ thấy: nhận xét chung · số liệu <b>của cả lớp</b> ở dạng tổng hợp · '
     +'số liệu <b>riêng con mình</b> · <b>nhận xét riêng của con</b> nếu có · kế hoạch tuần tới.<br>'
     +'<b>Không thấy</b>: nguyên văn lời phê bình trong sổ đầu bài · nhận xét riêng của bạn khác · xếp hạng.</div>',
     [['Huỷ','',closeM],['Publish','p',()=>{b.tt='pub'; b.by=toiLa(); b.at=HOMNAY;
       closeM(); render(); toast('📨 Đã publish báo cáo tuần '+tuan+' — <b>'+siSo(cur)
        +' phụ huynh</b> nhận thông báo.')}]]); return}
  case 'bcBS': {modal('Thêm bản bổ sung — tuần '+tuan,
     '<div class="ro">Bản gốc <b>giữ nguyên</b>. Bản bổ sung hiện <b>bên dưới bản gốc</b> trên App, có ngày và tên '
     +'người viết.</div>'
     +'<div class="fld"><label>Nội dung bổ sung</label><textarea class="fldi" rows="3" id="bsIn"></textarea></div>',
     [['Huỷ','',closeM],['Đăng bổ sung','p',()=>{const t=$('#bsIn').value.trim();
       if(!t){toast('⛔ Chưa nhập nội dung.'); return}
       bcGet(cur,tuan).bs.push({nd:t,by:toiLa(),at:HOMNAY});
       closeM(); render(); toast('✓ Đã đăng bản bổ sung.')}]]); return}
  case 'xemApp': {const b=bcGet(cur,tuan), hs=hsLop(cur), x=mo.hs||hs[0];
    const ds=ngayHoc(tuan).filter(d=>d<=HOMNAY), ng=nghiTrong(cur,x,ds), bt=btvnHS(cur,x,'w2');
    const dm=diemTuan(cur,x,tuan), kk=ktklHS(cur,x,ds);
    modal('📱 App phụ huynh — báo cáo tuần '+tuan+' của <b>'+esc(HS[x].n)+'</b>',
     '<div class="ro">Phụ huynh <b>không thấy tên học sinh khác</b>. Số liệu lớp ở dạng tổng hợp; '
     +'phần chi tiết <b>lọc theo đúng con mình</b>.</div>'
     +(b.tt==='pub'
       ?'<div class="card hl"><div class="ch">Nhận xét của giáo viên chủ nhiệm '+esc(gvn(b.by))+'</div>'
        +'<div class="cb p"><div>'+esc(b.nx)+'</div>'
        +(b.nxhs[x]?'<div class="info" style="margin-top:9px"><b>Riêng về con:</b> '+esc(b.nxhs[x])+'</div>':'')
        +(b.kh?'<div class="hint" style="margin-top:8px"><b>Tuần tới:</b> '+esc(b.kh)+'</div>':'')+'</div></div>'
       :'<div class="warn">Báo cáo <b>chưa publish</b> — phụ huynh <b>chưa thấy gì</b>, kể cả phần số liệu tự động. '
        +'Số liệu không kèm lời của giáo viên thì chỉ là bảng thống kê.</div>')
     +'<div class="card"><div class="ch">Của lớp '+esc(cur)+'</div><div class="cb p">'
     +'<div class="hint">Sĩ số '+siSo(cur)+' · nền nếp hạng '+(SAODO[cur+'|'+tuan]||{h:'—'}).h
     +' · tỷ lệ nộp bài của lớp '+(function(){const bs=BTVN.filter(y=>y.l===cur&&y.tuan===tuan);
       if(!bs.length)return '—'; let n=0,t=0; bs.forEach(bb=>hsLop(cur).forEach(y=>{t++; if(bb.nop[y])n++}));
       return Math.round(n/t*100)+'%'})()+'</div></div></div>'
     +'<div class="card"><div class="ch">Riêng '+esc(HS[x].n)+'</div><div class="cb p">'
     +'<table class="tb"><tr><td style="width:170px">Chuyên cần</td><td>'
      +(ng.tong?'vắng <b>'+ng.tong+'</b> buổi'+(ng.vkp?' (<b style="color:var(--red)">'+ng.vkp+' không phép</b>)':'')
        :'đi học đầy đủ')+(ng.dm?' · đi muộn '+ng.dm+' lượt':'')+'</td></tr>'
     +'<tr><td>Bài tập về nhà</td><td>'+(bt.tong?'<b>'+bt.nop+'/'+bt.tong+'</b> bài đã nộp':'không có bài giao')+'</td></tr>'
     +'<tr><td>Điểm mới trong tuần</td><td>'+(dm.length?dm.map(o=>esc(o.mon)+' <b>'+o.d.v+'</b>').join(' · ')
        :'chưa có')+'</td></tr>'
     +'<tr><td>Khen thưởng · Kỷ luật</td><td>'+(kk.length?kk.map(k=>esc(k.hinh)).join(', '):'không có')+'</td></tr>'
     +'</table></div></div>'
     +'<div class="roblk">⛔ <b>Không hiện cho phụ huynh:</b> nguyên văn lời phê bình trong sổ đầu bài · '
     +'nhận xét riêng của học sinh khác · xếp hạng của con trong lớp.</div>',
     [['Đóng','',closeM]]); return}

  /* --- T7 --- */
  case 'rl': {rlSet(cur,kytk,el.dataset.h,v); render(); return}
  case 'pcnl': {const o=pcnlGet(cur,kytk,el.dataset.h), g=el.dataset.g;
    const ks=Object.keys(MUC3), cu=o[g][v];
    o[g][v]=ks[(ks.indexOf(cu)+1)%ks.length]; render(); return}
  case 'kyChot': {
    modal('Ký chốt '+KY[kytk]+' — lớp '+esc(cur),
     '<div class="ro">Bạn ký xác nhận đánh giá của <b>'+siSo(cur)+' học sinh</b> lớp '+esc(cur)+' cho '
     +'<b>'+KY[kytk]+'</b>. Đây là <b>tầng 2</b> của chuỗi ký học bạ.</div>'
     +'<div class="warn">Sau khi ký, dữ liệu <b>khoá</b>. Sửa được nhưng phải <b>gửi yêu cầu mở khoá</b> và '
     +'Ban giám hiệu đồng ý. Chữ ký này là <b>điều kiện</b> để M3.1 chạy tính tổng kết lớp.</div>',
     [['Huỷ','',closeM],['Ký chốt','g',()=>{KYTK[kyKey()]={ky:{gv:toiLa(),at:HOMNAY}};
       closeM(); render(); toast('⚖ Đã ký chốt <b>'+KY[kytk]+'</b> lớp '+esc(cur)+'.')}]]); return}
  case 'mkGui': {modal('Gửi yêu cầu mở khoá — '+KY[kytk],
     '<div class="ro">Yêu cầu gửi tới <b>Ban giám hiệu</b>. Học bạ chưa vào Phiên ký thì <b>PHT</b> xử lý; '
     +'đã qua tầng 3 hoặc 4 thì <b>Hiệu trưởng</b>, ký số.</div>'
     +'<div class="fld"><label>Lý do <span class="req">*</span></label>'
     +'<input class="fldi" id="mkL" placeholder="Sai ở chỗ nào, của em nào"></div>',
     [['Huỷ','',closeM],['Gửi yêu cầu','p',()=>{const l=$('#mkL').value.trim();
       if(!l){toast('⛔ <b>Lý do là bắt buộc.</b>'); return}
       YCMK.push({id:'MK-'+(YCMK.length+1),l:cur,k:kytk,ly:l,by:toiLa(),at:HOMNAY,tt:'cho',
        cap:HB_TANG3[cur+'|'+kytk]?'HT':'PHT'});
       closeM(); render(); toast('🔓 Đã gửi yêu cầu mở khoá — <b>ghi audit</b>.')}]]); return}
  case 'renhe': {const hs=hsLop(cur).filter(x=>rlNam(cur,x)==='CD');
    modal('Rèn luyện trong kì nghỉ hè — TT 22/2021 Điều 13',
     '<div class="ro"><b>Không phải lưu ban.</b> Học sinh có kết quả rèn luyện cả năm <b>Chưa đạt</b> '
     +'<b>phải rèn luyện trong kì nghỉ hè</b>. Hình thức do <b>Hiệu trưởng quy định</b>; '
     +'GVCN <b>giao nhiệm vụ và thông báo đến cha mẹ</b>. Cuối hè, nếu GVCN đánh giá đã hoàn thành '
     +'<i>(có báo cáo cha mẹ ký xác nhận)</i> thì GVCN <b>đề nghị Hiệu trưởng đánh giá lại</b>.</div>'
     +(hs.length?'<table class="tb"><tr><th>Học sinh</th><th>Rèn luyện cả năm</th><th>Nhiệm vụ hè</th></tr>'
       +hs.map(x=>'<tr><td><b>'+esc(HS[x].n)+'</b></td><td><span class="st2 r">Chưa đạt</span></td>'
        +'<td><input class="fldi" placeholder="Nhiệm vụ Hiệu trưởng giao"></td></tr>').join('')+'</table>'
      :'<div class="empty">Không có học sinh nào ở mức Chưa đạt.</div>'),
     [['Đóng','',closeM]].concat(hs.length?[['Giao nhiệm vụ &amp; báo cha mẹ','p',()=>{closeM();
       toast('☀ Đã giao nhiệm vụ hè cho <b>'+hs.length+' học sinh</b> và gửi thông báo tới cha mẹ.')}]]:[])); return}

  case 'xuat': {modal('Xuất dữ liệu — bắt buộc chọn mục đích',
    '<div class="warn">Tệp chứa <b>dữ liệu cá nhân của trẻ em</b> (Luật BVDLCN 91/2025). Mọi lượt xuất <b>ghi audit</b> '
    +'kèm người xuất, thời điểm và mục đích.</div>'
    +'<div class="fld"><label>Mục đích sử dụng <span class="req">*</span></label>'
    +'<select class="fldi"><option>Phục vụ công tác chủ nhiệm</option>'
    +'<option>Báo cáo Ban giám hiệu</option><option>Báo cáo Phòng/Sở GDĐT</option>'
    +'<option>Lưu hồ sơ lớp cuối năm</option></select></div>',
    [['Huỷ','',closeM],['Xuất tệp','p',()=>{closeM(); toast('⬇ Đã xuất · <b>đã ghi audit</b> kèm mục đích.')}]]); return}
 }
}

/* ===== WIRE ===== */
document.addEventListener('click',e=>{
 const mb=e.target.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 /* Doi vai GIU che do lop chu nhiem va tab cua loi tat — de thu cung mot loi tat voi nhieu vai */
 const rb=e.target.closest('.rb'); if(rb){role=rb.dataset.r; cur=null; if(!cn) tab='T1'; t1v='lop'; mo={t2:'ngay',k4:'w4'};
  $$('.rb').forEach(x=>x.classList.toggle('on',x===rb)); render(); return}
 if(e.target.id==='btnNote'){const on=document.body.classList.toggle('nn');
  e.target.classList.toggle('on',!on); e.target.textContent='💡 Ghi chú thiết kế: '+(on?'TẮT':'BẬT'); return}
 const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
 act(el.dataset.a,el.dataset.v,el);
});
document.addEventListener('change',e=>{
 const el=e.target.closest('[data-ch]'); if(!el) return;
 const f=el.dataset.ch, v=el.value;
 if(f==='q'){mo.q=v; render(); return}
 if(f==='bcNx'&&cur){bcGet(cur,tuan).nx=v; return}
 if(f==='bcKh'&&cur){bcGet(cur,tuan).kh=v; return}
 if(f==='bcHS'&&cur){bcGet(cur,tuan).nxhs[el.dataset.h]=v; return}
});
document.addEventListener('input',e=>{
 const el=e.target.closest('[data-ch]'); if(!el||!cur) return;
 const f=el.dataset.ch;
 if(f==='bcNx') bcGet(cur,tuan).nx=el.value;
 if(f==='bcKh') bcGet(cur,tuan).kh=el.value;
 if(f==='bcHS') bcGet(cur,tuan).nxhs[el.dataset.h]=el.value;
});

render();

</script>
