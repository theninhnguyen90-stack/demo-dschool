      + 'Bảng này thêm vế ấy và ghi vào mục H của phiếu để <code>Z</code> sửa danh mục.');
}

/* ══════════════ TAB 3 · BẢNG CÔNG THÁNG ═══════════════════════════════
   Khuôn K4 — lưới người, có HỌ TÊN ⇒ xuất là xuất dữ liệu cá nhân.
   Báo cáo loại **C**: khớp tới TỪNG Ô CÔNG, ⛔ không làm tròn.
   🛑 CHỈ ĐỌC TẦNG ③ của hợp đồng ba tầng. «Thiếu dữ liệu thiết bị» ⛔ KHÔNG
   phải vắng; «Thiếu chấm công» ⛔ KHÔNG phải «Vắng không phép».          */
function veTab3() {
  const t = ST.thangCong;
  const ds = nsTrongKy();
  let h = daiPV('nhân sự', ds.length, NSL.length)
    + daiChon('📅 Tháng công', 'thcong', t, THANG_CONG.map(x => [x, tenThang(x)]),
      '');

  /* ---------- dải SNAPSHOT / đã chuyển sang M7.6 ---------- */
  const ch = DA_CHUYEN[t];
  if (ch) {
    const dc = DINH_CHINH_SAU_CHUYEN.filter(x => x.thang === t && x.luc > ch.luc);
    h += '<div class="canh w">📤 <b>Bảng công tháng này đã chuyển sang M7.6 ngày ' + k2s(ch.luc) + '</b> (bởi ' + esc(ch.boi) + '). '
      + (dc.length
        ? '⚠ <b>Đã đính chính ' + dc.length + ' ô kể từ khi chuyển</b> — ⛔ hệ thống <b>không tính lại im lặng</b>: '
        + dc.map(x => esc(x.ai) + ' ' + k2s(x.ngay) + ' «' + esc(x.tu) + '» → «' + esc(x.den) + '»').join(' · ') + '. '
        : 'Chưa có ô nào đính chính kể từ khi chuyển. ')
      + '<button class="btn xs" data-dl="M7.6" data-dlq="thang=' + t + '&return=' + MENU_NAY + '">↗ M7.6</button></div>';
  }

  /* ---------- K4 · lưới người ---------- */
  const cot = [
    { khoa: 'congChuan', ten: 'Công chuẩn', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.9.bang_cong_thang', khongCong: true },
    { khoa: 'congThuc', ten: 'Công thực', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.9.bang_cong_thang' },
    { khoa: 'coPhep', ten: 'Vắng có phép', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.8.tong_hop_don_nghi' },
    { khoa: 'khongPhep', ten: 'Vắng không phép', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.9.bang_cong_thang', canhBao: k => k.giaTri > 0 },
    { khoa: 'congTac', ten: 'Đi công tác', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.9.bang_cong_thang' },
    { khoa: 'thieu', ten: 'Thiếu chấm công', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.9.bang_cong_thang', canhBao: k => k.giaTri > 0 },
    { khoa: 'tietKetLuan', ten: 'Tiết ③ đã kết luận', donVi: 'tiết', kieu: 'so', nguon: 'm4.9.cham_cong_tiet_day' },
    { khoa: 'tietMuon', ten: 'Trong đó: Muộn', donVi: 'tiết', kieu: 'so', nguon: 'm4.9.cham_cong_tiet_day', canhBao: k => k.giaTri > 0 },
    { khoa: 'tietChuaKetLuan', ten: 'Tiết chưa kết luận được', donVi: 'tiết', kieu: 'so', nguon: 'm4.9.cham_cong_tiet_day' }
  ];
  h += KB.K4({
    id: 'bc', tieuDe: 'Bảng công ' + tenThang(t) + ' — tầng ③ (kết luận của người)', ma: 'NS.05', chip: 'PS',
    moTaKy: 'Tháng ' + t.slice(5) + '/' + t.slice(0, 4) + ' · tính tới ' + k2s(HOMNAY),
    tenCotDau: 'Họ và tên', tong: true, gomNhom: true,
    dong: xepTheoDT(ds.map(p => ({ id: p.id, ten: p.n, nhom: p.dt, phu: p.to + (p.vt ? ' · ' + p.vt : ''), p }))),
    link: d => ({ menu: 'M4.9', ctx: 'tab=bangcong&thang=' + t + '&ns=' + d.id, nhan: 'Bảng công tháng' }),
    cot,
    o: (d, c) => CT.doc('NS.05', PV.thamSoPS({ nguoi: d.p, thang: t }), c.khoa),
    tongRieng: c => c.khoa === 'congChuan'
      ? CT.doc('NS.05', PV.thamSoPS({ nguoi: ds[0], thang: t }), 'congChuan') : null,
    duoiBang: '<div class="canh b">🛑 <b>Chỉ tầng ③</b> · <b>Thiếu chấm công ≠ Vắng không phép</b>. '
      + '<button class="btn xs" data-dl="M4.9" data-dlq="tab=viec&return=' + MENU_NAY + '">↗ M4.9</button></div>'
  });

  /* ---------- 🛑 ngày thiếu dữ liệu thiết bị — ⛔ KHÔNG phải vắng ---------- */
  const tbn = THIETBI_NGUNG.filter(x => thangCua(x.ngay) === t);
  if (tbn.length) {
    h += KB.bang({
      id: 'tb', tieuDe: 'Ngày thiếu dữ liệu thiết bị — ⛔ không sinh hệ quả bất lợi', chip: 'PS',
      moTaKy: PV.moTaKhoang(), tenCotDau: 'Ngày', tong: false,
      dong: tbn.map(x => ({ id: x.ngay, ten: kThu(x.ngay) + ' ' + k2s(x.ngay), phu: 'phòng ' + x.phong + ' · ' + x.ly })),
      link: d => ({ menu: 'M4.9', ctx: 'tab=tietday&ngay=' + d.id, nhan: 'Chấm công tiết dạy' }),
      cot: [
        { khoa: 'nguoi', ten: 'Giáo viên có tiết ở phòng đó', kieu: 'so', nguon: 'm4.9.cham_cong_tiet_day' },
        { khoa: 'ngaycong', ten: 'Kết luận NGÀY CÔNG', kieu: 'chu', nguon: 'm4.9.bang_cong_thang', khongCong: true },
        { khoa: 'tiet', ten: 'Kết luận TIẾT', kieu: 'chu', nguon: 'm4.9.cham_cong_tiet_day', khongCong: true }
      ],
      o: (d, c) => {
        const ng = AI_O_PHONG_NGUNG.map(nsByTen).filter(p => p && trongPV(p));
        if (c.khoa === 'nguoi') return { ma: 'NS.05', ten: 'Giáo viên có tiết ở phòng thiết bị ngừng', giaTri: ng.length, donVi: 'người', loaiSo: 'PS', nguon: ['M4.9'], chieuHopLe: [], quyTacDem: { tinhVao: ['Giáo viên có tiết ở phòng mà thiết bị chấm công ngừng trong khung giờ đó.'], khongTinh: ['Phòng chưa lắp điểm chấm công — tiết ở đó là «Ngoài phạm vi», khác hẳn «Thiết bị ngừng».'] }, banGhiGoc: ng.map(p => ({ id: p.id, ten: p.n, phu: p.to, so: '' })) };
        const chu = c.khoa === 'ngaycong' ? 'Đủ công' : '— chưa kết luận';
        return { ma: 'NS.05', ten: c.ten, giaTri: chu, donVi: '', loaiSo: 'PS', nguon: ['M4.9'], chieuHopLe: [], banGhiGoc: [], quyTacDem: { tinhVao: [c.khoa === 'ngaycong' ? 'Ngày công GIỮ NGUYÊN «Đủ công» — người lao động có mặt, chỉ máy không ghi được.' : 'Tiết để «— chưa kết luận», vào hàng đợi ngoại lệ của M4.9 để người phụ trách kết luận.'], khongTinh: ['🛑 ⛔ KHÔNG ghi vắng. «Thiết bị ngừng không sinh hệ quả bất lợi cho người lao động» — đó là lỗi của trường, không phải của giáo viên (HD3T luật cứng 2).'] } };
      },
      duoiBang: '<div class="canh o">🛑 <b>Thiếu dữ liệu thiết bị ≠ vắng.</b></div>'
    });
  }

  /* ---------- kết luận Vắng không phép — THỦ CÔNG, có audit đặc biệt ---------- */
  const vkp = VANG_KHONG_PHEP.filter(x => thangCua(x.ngay) === t && (nsByTen(x.ai) ? trongPV(nsByTen(x.ai)) : true));
  if (vkp.length) h += KB.K5({
    tieuDe: 'Kết luận «Vắng không phép» trong tháng — THỦ CÔNG, audit đặc biệt', chip: 'PS', moTaKy: tenThang(t),
    kiemSoHieu: false,
    banGhi: vkp.map((x, i) => ({ so: 'VKP-' + p2(i + 1), ngay: k2s(x.ngay), noiDung: x.ai + ' — ' + x.ly, nguoiLap: x.boi, nguoiKy: '—', tt: 'Đã kết luận' })),
    duoiBang: '<div class="ro">🛑 Máy ⛔ <b>không được tự kết luận</b>.</div>'
  });

  return h + dnote('Tầng ① (sự kiện thiết bị) và tầng ② (gợi ý ghép tiết của máy) ⛔ <b>không được đọc ở menu khác</b>. '
    + '«Thiếu chấm công» là <i>máy không có dữ liệu</i>; «Vắng không phép» là <i>người đã xác minh và kết luận</i> — '
    + 'bốn nguyên nhân của ô thứ sáu có hệ quả khác hẳn nhau với người lao động. '
    + '«Thiết bị ngừng không sinh hệ quả bất lợi» là lỗi của trường, ⛔ không phải của giáo viên. '
    + 'Tab này là báo cáo <b>loại C</b> — nó phải khớp <b>từng ô</b> với <code>M4.9</code>, nên ⛔ không '
    + 'làm tròn và ⛔ không gộp cột. Snapshot chưa dựng ở MVP: thay bằng <b>đóng dấu ngày chốt</b> trong tệp xuất và '
    + 'dải <i>«đã đính chính N ô kể từ khi chuyển»</i> — ⛔ <b>không tính lại im lặng</b>, vì bảng lương đã chi theo số cũ.');
}

/* ══════════════ TAB 4 · NGHỈ PHÉP & QUỸ PHÉP ══════════════════════════
   Khuôn K2 — dòng là NGƯỜI, nên mang dải ⚖ của Luật BVDLCN 91/2025.
   🛑 Đọc `coHieuLuc(đơn, ngày)` theo NGÀY, ⛔ KHÔNG đọc «đã duyệt»: `M4.8`
   v2.0 đã bỏ hẳn bước duyệt, chữ ấy không còn trong hợp đồng `HDNP`.     */
const NGHI_HE_TUAN = 8;                  /* 🔗 M10.1 — số tuần nghỉ hè thực hưởng */
const namCongTac = p => Math.floor(soNgay(p.tuNgay, HOMNAY) / 365);
const quyPhep = p => Math.max(0, 12 + Math.floor(namCongTac(p) / 5) - (p.nh === 2 ? NGHI_HE_TUAN * 5 : 0));
function ngayNghiCua(p, loai) {
  let n = 0;
  DONNGHI.filter(d => d.ai === p.n && (!loai || d.loai === loai)).forEach(d => {
    d.ngay.forEach(x => {
      if (!coHieuLuc(d, x.ngay)) return;
      if (x.ngay < PV.st.tuNgay || x.ngay > PV.st.denNgay) return;
      n += x.buoi === 'ca_ngay' ? 1 : 0.5;
    });
  });
  return Math.round(n * 10) / 10;
}
const daDungQuy = p => Math.max(0, ngayNghiCua(p, 'phep_nam') - (HOAN_QUY[p.n] || 0));

function veTab4() {
  const ds = nsTrongKy();
  const loai = Object.keys(LOAI_NGHI);
  let h = daiPV('nhân sự', ds.length, NSL.length) + PV.khoang();

  h += '<div class="bvdl">⚖ Bảng có <b>họ tên</b> — xuất là <b>xuất dữ liệu cá nhân</b> <i>(Luật BVDLCN 91/2025)</i>.</div>';

  const oNghi = (p, l) => {
    const n = l ? ngayNghiCua(p, l) : ngayNghiCua(p);
    return {
      ma: 'NS.05', o: l || null, ten: l ? LOAI_NGHI[l].ten : 'Tổng ngày nghỉ có hiệu lực',
      giaTri: n, donVi: 'ngày', loaiSo: 'PS', nguon: ['M4.8'], chieuHopLe: ['loai_nghi'],
      quyTacDem: {
        tinhVao: ['Ngày mà <code>coHieuLuc(đơn, ngày)</code> đúng: đơn ở trạng thái CÓ HIỆU LỰC, ngày thuộc đơn, và ngày đó CHƯA RÚT.', 'Nghỉ nửa ngày tính 0,5.'],
        khongTinh: ['⛔ KHÔNG đọc chữ «đã duyệt» — M4.8 v2.0 đã bỏ hẳn bước duyệt.', 'Đơn Nháp · Chờ đồng ý · Không đồng ý · Đã rút.', 'Ngày đã rút khỏi đơn, kể cả rút có tick «Giữ nguyên người dạy thay» — người đó đi làm.']
      },
      banGhiGoc: DONNGHI.filter(d => d.ai === p.n && (!l || d.loai === l)).map(d => ({
        id: d.id, ten: LOAI_NGHI[d.loai].ten,
        phu: TT_DON[d.trang_thai][0] + ' · ' + d.ngay.map(x => k2s(x.ngay) + (x.da_rut ? ' (đã rút)' : x.buoi !== 'ca_ngay' ? ' (nửa ngày)' : '')).join(', ')
          + (d.nhan.length ? ' · nhãn: ' + d.nhan.join(', ') : '') + (d.nguoi_nhap_ho ? ' · nhập hộ bởi ' + d.nguoi_nhap_ho : ''),
        so: String(d.ngay.filter(x => coHieuLuc(d, x.ngay)).length) + ' ngày hiệu lực'
      }))
    };
  };
  const oSo = (p, khoa) => {
    const q = quyPhep(p), dung = daDungQuy(p), hoan = HOAN_QUY[p.n] || 0;
    const rut = DONNGHI.filter(d => d.ai === p.n).reduce((a, d) => a + soNgayRut(d), 0);
    const v = khoa === 'quy' ? q : khoa === 'daDung' ? dung : khoa === 'conLai' ? Math.max(0, q - dung) : rut;
    return {
      ma: 'NS.05', o: khoa, ten: { quy: 'Quỹ phép năm', daDung: 'Đã dùng', conLai: 'Còn lại', rut: 'Số ngày đã thu hồi' }[khoa],
      giaTri: v, donVi: 'ngày', loaiSo: khoa === 'rut' ? 'PS' : 'TON', nguon: ['M4.8'], chieuHopLe: [],
      ghiChu: khoa === 'quy'
        ? 'Công thức chung: <code>max(0, ngày theo BLLĐ − ngày nghỉ hè thực hưởng)</code>. '
        + 'Người này: <b>' + (12 + Math.floor(namCongTac(p) / 5)) + '</b> ngày theo BLLĐ Đ.113-114 − <b>'
        + (p.nh === 2 ? NGHI_HE_TUAN * 5 : 0) + '</b> ngày nghỉ hè (🔗 M10.1: ' + (p.nh === 2 ? NGHI_HE_TUAN + ' tuần' : 'không nghỉ hè') + ').'
        : khoa === 'daDung' && hoan ? '<b>Hoàn ' + hoan + ' ngày</b> — đính chính «Vắng có phép» ở M4.9 (ngày 🔴).' : null,
      quyTacDem: {
        tinhVao: khoa === 'quy'
          ? ['Quỹ nghỉ hằng năm = max(0, ngày theo BLLĐ 2019 Đ.113-114 − ngày nghỉ hè thực hưởng).', 'Số tuần nghỉ hè khai ở M10.1, M4.8 chỉ đọc.']
          : khoa === 'rut' ? ['Ngày người xin nghỉ đã thu hồi khỏi đơn (vùng ⚪ và 🟡 của HDNP ④).'] : ['Ngày nghỉ của loại có cờ «trừ quỹ».'],
        khongTinh: khoa === 'quy'
          ? ['🛑 ⛔ KHÔNG khóa cứng theo tư cách: nhà giáo thường hết quỹ là HỆ QUẢ CỦA CON SỐ, không phải một điều luật riêng. Trường bố trí nghỉ hè ngắn hơn 8 tuần thì quỹ lớn hơn 0.']
          : khoa === 'daDung' ? ['Ngày người phụ trách chấm công đã đính chính «Vắng có phép» ở M4.9 — người đó thực ra đi làm, quỹ được hoàn.', 'Loại nghỉ không có cờ «trừ quỹ».']
            : khoa === 'conLai' ? ['—'] : ['Ngày của đơn Không đồng ý — đơn ấy chưa bao giờ có hiệu lực, nên không có gì để thu hồi.']
      },
      banGhiGoc: khoa === 'rut'
        ? DONNGHI.filter(d => d.ai === p.n).reduce((a, d) => a.concat(d.ngay.filter(x => x.da_rut).map(x => ({ id: d.id + '·' + x.ngay, ten: k2s(x.ngay), phu: LOAI_NGHI[d.loai].ten + ' · ' + (x.ly_do_rut || 'không ghi lý do'), so: 'đã rút' }))), [])
        : []
    };
  };

  h += KB.K2({
    id: 'np', tieuDe: 'Nghỉ phép theo loại và quỹ phép còn lại', ma: 'NS.05', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Họ và tên', gomNhom: true,
    dong: xepTheoDT(ds.map(p => ({ id: p.id, ten: p.n, nhom: p.dt, phu: p.to + (p.vt ? ' · ' + p.vt : ''), p }))),
    link: d => ({ menu: 'M4.8', ctx: 'tab=tonghop&ns=' + d.id, nhan: 'Tổng hợp đơn nghỉ' }),
    cot: loai.map(l => ({ khoa: l, ten: LOAI_NGHI[l].ten, donVi: 'ngày', kieu: 'ngay', nguon: 'm4.8.tong_hop_don_nghi' }))
      .concat([
        { khoa: '_tong', ten: 'Tổng ngày nghỉ', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.8.tong_hop_don_nghi' },
        { khoa: 'quy', ten: 'Quỹ phép năm', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.8.tong_hop_don_nghi' },
        { khoa: 'daDung', ten: 'Đã dùng', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.8.tong_hop_don_nghi' },
        { khoa: 'conLai', ten: 'Còn lại', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.8.tong_hop_don_nghi' },
        { khoa: 'rut', ten: 'Số ngày đã thu hồi', donVi: 'ngày', kieu: 'ngay', nguon: 'm4.8.tong_hop_don_nghi' }
      ]),
    o: (d, c) => ['quy', 'daDung', 'conLai', 'rut'].includes(c.khoa) ? oSo(d.p, c.khoa)
      : oNghi(d.p, c.khoa === '_tong' ? null : c.khoa),
    duoiBang: '<div class="canh b">🛑 <b>Số ngày đã thu hồi</b> tách riêng, ⛔ không trừ vào cột nào.</div>'
  });

  /* ---------- đơn CHƯA / KHÔNG có hiệu lực — nêu ra, ⛔ không đếm vào bảng ---------- */
  const khac = DONNGHI.filter(d => d.trang_thai !== 'co_hieu_luc')
    .filter(d => { const p = nsByTen(d.ai); return !p || trongPV(p) });
  if (khac.length) h += KB.K5({
    tieuDe: 'Đơn KHÔNG có hiệu lực trong kỳ — nêu ra, ⛔ không vào bảng trên', chip: 'PS', moTaKy: PV.moTaKhoang(),
    kiemSoHieu: false,
    banGhi: khac.map(d => ({
      so: d.id, ngay: k2s(d.ngay[0].ngay), noiDung: d.ai + ' — ' + LOAI_NGHI[d.loai].ten + ' (' + d.ngay.length + ' ngày)',
      nguoiLap: d.nguoi_nhap_ho || d.ai, nguoiKy: LOAI_NGHI[d.loai].coChe === 'can_thoa_thuan' ? 'cần một người đồng ý' : '—',
      tt: TT_DON[d.trang_thai][0]
    })),
    duoiBang: '<div class="ro">Năm trạng thái <code>HDNP</code> ② — ⛔ <b>không có «đã duyệt»</b>.</div>'
  });

  return h + '<div class="ro">Quỹ = <code>max(0, ngày theo BLLĐ − nghỉ hè thực hưởng)</code>.</div>'
    + dnote('Quỹ phép là <b>một công thức chung</b>, ⛔ không phải luật riêng theo tư cách. Nhà giáo thường ra <b>0</b> vì nghỉ hè '
      + NGHI_HE_TUAN + ' tuần — đó là <b>hệ quả của con số</b>, ⛔ không phải một điều luật riêng; trường bố trí nghỉ hè ngắn hơn '
      + 'thì quỹ lớn hơn 0. Hết quỹ <b>không còn chặn gửi đơn</b> (<code>M4.8</code> v2.0): đơn vẫn nhận, gắn nhãn '
      + '<code>vượt quỹ</code> — công thức quyết định <b>nhãn</b>, ⛔ không quyết định <b>cửa</b>. '
      + 'Lý do nghỉ ốm là <b>dữ liệu sức khỏe</b>, ⛔ không lên bảng. '
      + 'Thu hồi là <b>một sự kiện</b> trên từng NGÀY của đơn (ba vùng ⚪ 🟡 🔴 của <code>HDNP</code> ④), ⛔ không phải một trạng thái đơn.');
}

/* ══════════════ TAB 5 · KHEN THƯỞNG & KỶ LUẬT ═════════════════════════
   K5 (sổ quyết định) + K1 (tổng hợp theo hình thức).
   🛑 Bộ hình thức kỷ luật đọc theo `Diện làm việc`: viên chức áp NĐ 234/2026,
   người làm HĐLĐ áp BLLĐ Đ.124 — HAI BỘ KHÁC NHAU, ⛔ không gộp.          */
function veTab5() {
  const la = ST.mucKTKL;
  let h = daiPV('nhân sự', nsPV().length, NSL.length) + PV.chotNgay() + PV.daiCanhBao() + PV.khoang()
    + daiChon('📋 Khối', 'ktkl', la, [['khen', '🏅 Khen thưởng'], ['ky_luat', '⚖ Kỷ luật']],
      'Kỷ luật là dữ liệu <b>nhạy cảm</b>.');

  const ht = la === 'khen' ? HT_KHEN : [...new Set(HT_KY_LUAT_VC.concat(HT_KY_LUAT_HD))];
  const nguon = la === 'khen' ? 'm4.10.khen_thuong' : 'm4.10.ky_luat';
  const oPhu = la === 'khen' ? 'khen' : 'kyLuat';

  /* ---------- K1 · tổng hợp theo hình thức ---------- */
  h += KB.K1({
    id: 'th', tieuDe: (la === 'khen' ? 'Khen thưởng' : 'Kỷ luật') + ' theo hình thức', ma: 'NS.11', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Hình thức', donVi: 'lượt', nguon,
    dong: ht.map(x => ({ id: x, ten: x, loc: r => r.ht === x })),
    link: d => ({ menu: 'M4.10', ctx: 'tab=' + (la === 'khen' ? 'khenthuong' : 'kyluat') + '&ht=' + encodeURIComponent(d.id), nhan: la === 'khen' ? 'Khen thưởng' : 'Kỷ luật' }),
    oSo: d => CT.doc('NS.11', PV.thamSoPS({ loc: d.loc }), oPhu)
  });

  if (la === 'ky_luat') {
    const con = CT.doc('NS.11', PV.thamSo(), 'conHieuLuc');
    const ah = CT.doc('NS.11', PV.thamSo(), 'anhHuongXepLoai');
    h += KB.bang({
      id: 'kl2', tieuDe: 'Kỷ luật đang còn hiệu lực tại ngày chốt', ma: 'NS.11', chip: 'TON',
      moTaKy: PV.moTaChot(), tenCotDau: 'Chỉ tiêu', tong: false,
      dong: [{ id: 'con', ten: 'Đang còn hiệu lực', phu: 'hiệu lực 12 tháng tự hết' },
      { id: 'ah', ten: 'Có cờ «Ảnh hưởng xếp loại chất lượng»', phu: 'cờ do M4.10 bật trên TỪNG vụ việc' }],
      link: () => ({ menu: 'M4.10', ctx: 'tab=kyluat&loc=conhieuluc', nhan: 'Kỷ luật' }),
      cot: [{ khoa: null, ten: 'Số người', kieu: 'so', nguon: 'm4.10.ky_luat', canhBao: k => k.giaTri > 0 }],
      o: d => d.id === 'con' ? con : ah,
      duoiBang: '<div class="canh b">🛑 <b>Kỷ luật KHÔNG tự ép mức xếp loại xuống «Không hoàn thành nhiệm vụ»</b> — '
        + 'nó chỉ là <b>cờ cảnh báo</b>, và cờ ấy do <code>M4.10</code> bật/tắt trên <b>từng vụ việc</b>; mức vẫn do Hội đồng quyết '
        + '<i>(M4.12 §4.2)</i>. <button class="btn xs" data-dl="M4.12" data-dlq="tab=dot&return=' + MENU_NAY + '">↗ M4.12</button></div>'
    });
  }

  /* ---------- K5 · sổ quyết định ---------- */
  const tu = PV.st.tuNgay, den = PV.st.denNgay;
  const ds = KTKL.filter(x => x.kieu === (la === 'khen' ? 'khen' : 'ky_luat') && x.ngay >= tu && x.ngay <= den)
    .filter(x => { const p = nsByTen(x.ai); return !p || trongPV(p) })
    .sort((a, b) => a.ngay < b.ngay ? -1 : 1);
  if (!coXD(nguon)) {
    const m = NGUON[nguon];
    h += '<div class="bg"><div class="bgh"><b>Sổ quyết định ' + (la === 'khen' ? 'khen thưởng' : 'kỷ luật') + '</b></div>'
      + '<div class="noaccbox">🔒 <b>Khối này bị ẩn.</b> Vai <b>' + esc(R().cd) + '</b> không có quyền '
      + '<b>Xuất dữ liệu (XD)</b> ở <b>' + esc(m.ten) + ' — ' + m.menu + '</b>. Có <b>' + ds.length + ' quyết định</b> '
      + 'trong khoảng đang xem, không hiện ở đây.</div></div>';
  } else {
    h += KB.K5({
      tieuDe: 'Sổ quyết định ' + (la === 'khen' ? 'khen thưởng' : 'kỷ luật') + ' — theo hình thức và CẤP quyết định',
      chip: 'PS', moTaKy: PV.moTaKhoang(), kiemSoHieu: false,
      cot: [{ khoa: 'so', ten: 'Số quyết định' }, { khoa: 'ngay', ten: 'Ngày' }, { khoa: 'noiDung', ten: 'Người · hình thức' },
      { khoa: 'nguoiLap', ten: 'Cấp quyết định' }, { khoa: 'nguoiKy', ten: 'Căn cứ áp dụng' }, { khoa: 'tt', ten: 'Lý do' }],
      banGhi: ds.map(x => ({
        so: x.so, ngay: k2s(x.ngay), noiDung: x.ai + ' — ' + x.ht, nguoiLap: x.cap,
        nguoiKy: x.bo || '—', tt: x.ly
      })),
      chuoiTrong: 'Không có quyết định nào trong khoảng đang xem.',
      duoiBang: la === 'ky_luat'
        ? '<div class="canh w">🛑 <b>Hai bộ hình thức, đọc theo <code>Diện làm việc</code>:</b> viên chức áp '
        + '<b>NĐ 234/2026</b> <i>(' + HT_KY_LUAT_VC.join(' · ') + ')</i>; người làm HĐLĐ áp <b>BLLĐ Đ.124</b> '
        + '<i>(' + HT_KY_LUAT_HD.join(' · ') + ')</i>. ⛔ <b>KHÔNG có «Hạ bậc lương» và «Giáng chức»</b> — hai hình thức đó '
        + 'thuộc kỷ luật <b>công chức</b>.</div>'
        : '<div class="ro">⛔ Hệ thống <b>không ghi giá trị và nội dung phần quà</b> (<code>M4.10</code> §6.4) — '
        + 'chỉ ghi nhận <i>ai được khen, hình thức gì, vì lý do gì, theo quyết định số mấy</i>.</div>'
    });
  }

  return h + dnote('Hai khối tách bằng <b>bộ chọn</b> chứ không bày cạnh nhau, vì chúng khác <b>người đọc</b>: '
    + 'khen thưởng đọc rộng, còn kỷ luật là <b>dữ liệu nhạy cảm</b> mà <code>M4.10</code> §4 cố ý không mở cho cả trường. '
    + 'Ma trận quyền của tab này vì vậy chỉ có <b>HT</b> và <b>TCNS</b>.');
}

/* ══════════════ TAB 6 · XẾP LOẠI CHẤT LƯỢNG VIÊN CHỨC ═════════════════
   Khuôn K6 — biểu CỐ ĐỊNH, loại A (nội bộ), có khối chữ ký.
   🛑 Dải chống bẫy #4 LUÔN HIỆN: đây là XẾP LOẠI VIÊN CHỨC theo NĐ 233/2026
   (`M4.12`), ⛔ KHÔNG phải KPI giáo viên (`CM.04`, `M5.5`, báo cáo ở `M9.5`).
   🛑 `K6` KHÔNG kéo theo quyền ký — người ký ký ở menu chủ.               */
function veTab6() {
  const d = DOT_XL.find(x => x.id === ST.dotXL) || DOT_XL[0];
  let h = daiPV('nhân sự', nsPV().length, NSL.length) + PV.chotNgay() + PV.daiCanhBao();

  /* ---------- dải chống bẫy #4 — LUÔN HIỆN, không thu gọn ---------- */
  h += '<div class="canh r">🛑 <b>XẾP LOẠI VIÊN CHỨC</b> <i>(NĐ 233/2026 · <code>NS.07</code> · M4.12)</i> — '
    + '<b>KHÔNG phải KPI giáo viên</b> <i>(<code>CM.04</code> · M5.5)</i>. '
    + '<button class="btn xs" data-dl="M9.5" data-dlq="tab=kpi&return=' + MENU_NAY + '">↗ M9.5 · KPI giáo viên</button></div>';

  h += daiChon('📋 Đợt xếp loại', 'dotxl', d.id,
    DOT_XL.map(x => [x.id, x.id + ' · ' + (x.tt === 'daky' ? 'đã ký' : 'đang mở')]),
    '«chưa chốt» ≠ 0.');

  const ct = ST.chieuNS;
  const khoa = ct === 'to' ? (p => p.to) : (p => p.dtm);
  const dsKhoa = ct === 'to' ? NSTO.filter(t => nsPV().some(p => p.to === t)) : Object.keys(DT).filter(x => nsPV().some(p => p.dtm === x));
  const dong = dsKhoa.map(k => ({ id: k, ten: ct === 'to' ? k : DT[k], loc: p => khoa(p) === k }));

  const khoiMuc = {
    id: 'xl', tieuDe: 'Biểu kết quả xếp loại — ' + d.ten, ma: 'NS.07', chip: 'TON',
    moTaKy: d.tt === 'daky' ? 'Chốt đợt ' + k2s(d.chot) + ' · ' + (d.qd ? 'QĐ ' + d.qd.so + ' ngày ' + k2s(d.qd.ngay) : '') : 'Đợt đang mở, chốt dự kiến ' + k2s(d.chot),
    tenCotDau: ct === 'to' ? 'Tổ' : 'Điểm trường', dong,
    link: x => ({ menu: 'M4.12', ctx: 'tab=dot&dot=' + d.id + '&' + (ct === 'to' ? 'to=' : 'dt=') + x.id, nhan: 'Đợt xếp loại' }),
    cot: MUC_XL.map(m => ({ khoa: m[0], ten: m[1], kieu: 'so', nguon: 'm4.12.dot_xep_loai', canhBao: m[0] === 'khtnv' ? (k => k.giaTri > 0) : null }))
      .concat([
        { khoa: 'boTrong', ten: 'Bỏ trống, không xếp loại', kieu: 'so', nguon: 'm4.12.dot_xep_loai' },
        { khoa: 'chuaXet', ten: '— chưa xét —', kieu: 'so', nguon: 'm4.12.dot_xep_loai', canhBao: k => k.giaTri > 0 }
      ]),
    o: (x, c) => CT.doc('NS.07', PV.thamSo({ dot: d.id, loc: x.loc }), c.khoa)
  };

  /* ---------- khối trần HTXSNV — mẫu số ⛔ KHÔNG phải tổng viên chức ---------- */
  const nhomTran = ['bgh', 'gv', 'nv'];
  const mauSo = k => CT.doc('NS.07', PV.thamSo({ dot: d.id, loc: p => NHOM_VT(p) === k }), 'mauSoTran');
  const daDung = k => CT.doc('NS.07', PV.thamSo({ dot: d.id, loc: p => NHOM_VT(p) === k && dlvOf(p.dlv)[2] }), 'htxsnv');
  const tyLeTran = d.donViXuatSac ? 0.25 : 0.20;
  const khoiTran = {
    id: 'tr', tieuDe: 'Trần «Hoàn thành xuất sắc nhiệm vụ» theo nhóm nhiệm vụ tương đồng', ma: 'NS.07', chip: 'TON',
    moTaKy: 'Trần ' + Math.round(tyLeTran * 100) + '% · đơn vị ' + (d.donViXuatSac ? 'được công nhận xuất sắc' : 'chưa được công nhận xuất sắc'),
    tenCotDau: 'Nhóm nhiệm vụ tương đồng', tong: false,
    dong: nhomTran.map(k => ({ id: k, ten: TEN_NHOM_VT[k] })),
    link: x => ({ menu: 'M4.12', ctx: 'tab=dot&dot=' + d.id + '&nhom=' + x.id, nhan: 'Đợt xếp loại' }),
    cot: [
      { khoa: 'mau', ten: 'Mẫu số — HTTNV trở lên', donVi: 'viên chức', kieu: 'so', nguon: 'm4.12.dot_xep_loai' },
      { khoa: 'suat', ten: 'Số suất (làm tròn LÊN)', kieu: 'so', nguon: 'm4.12.dot_xep_loai', khongCong: true },
      { khoa: 'dung', ten: 'Đã dùng', kieu: 'so', nguon: 'm4.12.dot_xep_loai' },
      { khoa: 'tile', ten: 'Tỉ lệ thực tế', kieu: 'tile', nguon: 'm4.12.dot_xep_loai', canhBao: k => k.giaTri != null && k.giaTri > tyLeTran * 100 + 0.05 }
    ],
    o: (x, c) => {
      const m = mauSo(x.id), u = daDung(x.id);
      if (m.canhBao) return m;
      if (c.khoa === 'mau') return m;
      const suat = Math.ceil((m.giaTri || 0) * tyLeTran);
      const nen = {
        ma: 'NS.07', o: c.khoa, ten: c.ten, donVi: c.donVi || '', loaiSo: 'TON',
        nguon: ['M4.12'], chieuHopLe: [], banGhiGoc: u.banGhiGoc || []
      };
      if (c.khoa === 'suat') return Object.assign(nen, {
        giaTri: suat, banGhiGoc: [],
        ghiChu: 'Làm tròn <b>LÊN</b> <i>(M4.12 §5.6 — cấu hình đổi được)</i>: ⌈' + (m.giaTri || 0) + ' × ' + Math.round(tyLeTran * 100) + '%⌉ = <b>' + suat + '</b>.',
        quyTacDem: { tinhVao: ['Số suất = trần × mẫu số, LÀM TRÒN LÊN.'], khongTinh: ['⚠ Làm tròn lên có thể VƯỢT chính mức ' + Math.round(tyLeTran * 100) + '% của Điều 12 — giao diện bắt buộc hiện tỉ lệ thực tế và cảnh báo trên đúng nhóm bị vượt (cảnh báo, ⛔ không chặn).'] }
      });
      if (c.khoa === 'dung') return Object.assign(nen, { giaTri: u.giaTri, quyTacDem: u.quyTacDem });
      return Object.assign(nen, {
        giaTri: m.giaTri ? Math.round((u.giaTri || 0) * 1000 / m.giaTri) / 10 : null,
        veTrai: (u.giaTri || 0) + ' người HTXSNV', vePhai: m.giaTri + ' người HTTNV trở lên',
        quyTacDem: { tinhVao: ['Tỉ lệ thực tế = số HTXSNV / mẫu số.'], khongTinh: ['—'] }
      });
    },
    duoiBang: '<div class="canh w">⚠ <b>Làm tròn LÊN vượt mức ' + Math.round(tyLeTran * 100) + '%</b> — cảnh báo, ⛔ không chặn.</div>'
  };

  /* ---------- khối chữ ký hội đồng ---------- */
  const chuKy = '<div class="ky"><div class="kyh">Hội đồng xếp loại — ' + esc(d.ten) + '</div><div class="kyds">'
    + d.hoiDong.map(x => '<div class="kyo"><span class="kyl"></span>' + esc(x) + '</div>').join('')
    + '</div><div class="kytt">'
    + (d.tt === 'daky'
      ? '✅ <b>Đã ký</b> — quyết định ' + esc(d.qd.so) + ' ngày ' + k2s(d.qd.ngay) + ', người ký <b>' + esc(d.qd.boi) + '</b>.'
      : '🕐 <b>Đợt đang mở</b>, chốt dự kiến ' + k2s(d.chot) + '. '
      + '<button class="btn xs" data-dl="M4.12" data-dlq="tab=dot&dot=' + d.id + '&return=' + MENU_NAY + '">↗ Bàn xếp loại tại M4.12</button>')
    + '</div>'
    + '<div class="kyro">🛑 Ký và chốt đợt thuộc <b>M4.12</b>.</div></div>';

  h += KB.K6({
    khoi: [khoiMuc, khoiTran],
    oChuaAnhXa: DOT_XL.find(x => x.id === ST.dotXL).tt === 'daky' ? [] : [
      { o: 'Toàn bộ cột kết quả', ly: 'đợt chưa chốt — «chưa có dữ liệu» ⛔ không phải 0' }
    ],
    chuKy
  });

  /* ---------- «bỏ trống» ≠ «chưa xét» ---------- */
  h += '<div class="canh b">🛑 <b>«Bỏ trống» ≠ «— chưa xét —»</b> — chỉ cột sau <b>chặn chốt đợt</b>.</div>';

  return h + dnote('Hai chỉ tiêu <code>NS.07</code> và <code>CM.04</code> có <b>hai nguồn</b> và <b>không thay thế nhau</b> '
    + '<i>(nh9 §2.9 bẫy #4)</i>. «Bỏ trống» là <b>người đã quyết định</b> (có lý do, có audit, chính chủ đọc được); '
    + '«— chưa xét —» là <b>máy chưa biết</b>. Mẫu số đang chạy là <b>HTTNV trở lên</b> — đổi ở <code>M4.12</code>, ⛔ không đổi ở đây. '
    + 'Tệp xuất có đóng dấu ngày chốt, ⛔ không thay chữ ký. '
    + 'Trần lấy được <b>25%</b> chỉ khi <b>đơn vị</b> đã được xếp loại xuất sắc trước <i>(NĐ 233/2026 Đ.15 k1)</i>; '
    + '<code>M4.12</code> §5.2 có <b>hai cách hiểu mẫu số</b> và cho trường chọn. ⛔ <b>Không được ký lẻ từng người</b> <i>(§5.4)</i>. '
    + 'Đợt <b>không lọc trước</b> theo <code>Diện làm việc</code>: mọi nhân sự đều có mặt, ai không thuộc phạm vi '
    + 'xếp loại thì <b>bỏ trống kèm lý do</b>. Lọc sẵn cho gọn thì người bị loại <b>biến mất trong im lặng</b> — không ai kiểm '
    + 'được là họ bị loại đúng hay bị bỏ quên <i>(M4.12 §3.1)</i>.');
}

/* ══════════════ TAB 7 · CHỨNG THƯ SỐ & TUÂN THỦ KÝ SỐ ═════════════════
   Khuôn K1 · loại D (tra cứu nhanh) · CẢ HAI loài số, hai bộ điều khiển.
   🛑 Hai loại «chưa ký» khác hẳn nhau (`M4.11` §5.1): «đã ban hành, thiếu
   chữ ký» (Nhóm A · C — bỏ qua được, in ra ký tay) và «đang kẹt, chưa ban
   hành được» (Nhóm B — KHÔNG có nút bỏ qua). ⛔ Không gộp một danh sách.  */
function veTab7() {
  const ngay = PV.st.chotNgay > HOMNAY ? HOMNAY : PV.st.chotNgay;
  const can = NSL.filter(p => trongPV(p) && canCTS(p));
  let h = daiPV('người cần chứng thư', can.length, NSL.filter(canCTS).length)
    + PV.chotNgay() + PV.daiCanhBao();

  /* ---------- khối TỒN · chứng thư theo hạn ---------- */
  h += KB.K1({
    id: 'ct', tieuDe: 'A · Chứng thư số theo hạn — người CẦN chứng thư', ma: 'QT.11', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Trạng thái', donVi: 'người', nguon: 'm4.11.so_dang_ky_chung_thu',
    dong: ['con_han', 'sap_het', 'het', 'chua_khai'].map(k => ({ id: k, ten: TEN_TT_CTS[k], loc: null, k })),
    link: d => ({ menu: 'M4.11', ctx: 'tab=sodangky&tt=' + d.k, nhan: 'Sổ đăng ký chứng thư' }),

  if (x) { ST.dotXL = x.getAttribute('data-dotxl'); ve(); return }

function toast(h) {
  const t = $('#toast'); t.innerHTML = h; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 4200);
}

/* ── công cụ nghiệm thu: đo MẬT ĐỘ CHỮ GIẢI THÍCH (`nh9` §9.1, ≤ 20%) ── */
function doMatDoChu() {
  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(n => { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = { tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
window.doMatDoChu = doMatDoChu;
