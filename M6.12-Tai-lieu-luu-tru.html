      · việc 3 — câu mức 1 sửa lại cho đúng; đứng trên lưới có họ tên (`K4`)
        thì nút mức 1 ĐI CỔNG MỨC 2. Bối cảnh `coHoTen: true | false` ép tay.

   🛑 CHÉP NGUYÊN BYTE sang mọi demo M9.x. Lệch một byte = DỪNG, báo người dùng.

   ── Vì sao phải là nền chung ─────────────────────────────────────────────
   Xuất dữ liệu cá nhân sai chế độ là RỦI RO PHÁP LÝ, không phải lỗi giao diện.
   Để mỗi phiên tự dựng nút xuất thì sớm muộn có một demo cho tải thẳng một
   danh sách có họ tên mà không hỏi mục đích — và cái đó không sửa lại được
   sau khi tệp đã rời khỏi máy.

   ── Hai mức, hai chế độ pháp lý — KHÔNG ĐƯỢC GỘP ─────────────────────────
   │ Mức 1 · Bảng tổng hợp   │ chỉ có SỐ         │ số liệu thống kê │ tự do   │
   │ Mức 2 · Danh sách chi tiết │ có HỌ TÊN      │ dữ liệu cá nhân  │ Luật    │
   │                          │                   │                  │ 91/2025 │
   Hai nút **khác chữ, khác màu, khác popup** — người dùng phải THẤY được
   mình đang làm cái nào, không phải đọc tài liệu mới biết.

   ── Đầu trang và cuối trang mọi tệp xuất (sổ §3) ─────────────────────────
   Đầu trang BỐN dòng: tên trường · tên báo cáo · Chốt tại ngày hoặc Từ → đến
   · phạm vi (và tổng toàn trường nếu phạm vi bị cắt).
   Cuối trang: quy tắc đếm bằng tiếng Việt · người xuất · thời điểm · mã audit.
   Thiếu một dòng là tệp đó ra khỏi trường mà không ai biết nó nói về cái gì.
   ══════════════════════════════════════════════════════════════════════════ */

const XU = (function () {

  /* bối cảnh do `app.20` nối vào: tên trường · người đang xem · tên báo cáo */
  let boiCanh = () => ({
    truong: 'Trường học', baoCao: 'Báo cáo', menu: 'M9.x',
    nguoi: 'Người dùng', chucDanh: '', ky: '', phamVi: '', toanTruong: null,
    quyTac: [], banGhiCaNhan: false, truong_du_lieu: []
  });
  const noiBoiCanh = fn => { boiCanh = fn };

  /* ───────────────────── SỔ AUDIT — mọi lượt xuất ─────────────────────
     Ở MVP sổ nằm trong bộ nhớ trang; bản thật ghi vào `M10.7` Nhật ký hệ
     thống. Mã audit in vào CHÍNH TỆP XUẤT — tệp in ra giấy rồi vẫn tra
     ngược được ai xuất, lúc nào, với mục đích gì.                        */
  const AUDIT = [];
  let seqA = 0;

  /* ── v2 · việc 1 — SỔ CHUNG: bản mô phỏng của «ghi vào `M10.7`» ─────────
     Mười tám demo là mười tám tệp riêng, cùng một nguồn gốc trình duyệt, nên
     sổ chung nằm ở `localStorage` dưới một khóa. Đọc/ghi hỏng (chế độ ẩn danh,
     trình duyệt chặn) thì vẫn xuất được — sổ trong trang `AUDIT` còn nguyên;
     chỉ mất phần chuyển sang `M10.7`, và đó là giới hạn của bản demo. */
  const KHOA_SO = 'dschool.bcm9.soAuditXU';
  function docSoChung() {
    try { const s = JSON.parse(localStorage.getItem(KHOA_SO) || '[]'); return Array.isArray(s) ? s : [] }
    catch (e) { return [] }
  }
  function ghiSoChung(dong) {
    try { const s = docSoChung(); s.push(dong); localStorage.setItem(KHOA_SO, JSON.stringify(s)) } catch (e) { }
  }
  /* mã audit duy nhất trên CẢ sổ chung — hai demo cùng ngày không cấp trùng số */
  const maAudit = () => {
    const dau = 'XU-' + HOMNAY.replace(/-/g, '') + '-';
    const daCo = docSoChung().filter(a => String(a.id || '').indexOf(dau) === 0).length;
    seqA = Math.max(seqA, daCo) + 1;
    return dau + p2(seqA);
  };
  const gioNay = () => { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()) };

  /* ── KHUÔN DÒNG của tab ③ `M10.7` (`KT-2`) — TÁM thứ, không thiếu thứ nào:
     ai · chức danh LÚC THAO TÁC · lúc nào · bao nhiêu bản ghi · trường nào ·
     mục đích · menu/tab nguồn · mã audit. Tên trường trùng tên cột của sổ
     `TCDL` ở `M10.7` (`id ngay gio nguoi cd mn ob hv bg tr md dau`) để một
     dòng mới và một dòng đã gieo đọc bằng cùng một hàm; thêm `muc` · `trTen`
     · `mdTen` · `tab` cho những gì sổ cũ không có. */
  function dongAudit(a, bc) {
    return {
      id: a.ma, ngay: a.luc, gio: a.gio, nguoi: a.nguoi, cd: a.chucDanh || '',
      mn: a.menu || '', tab: a.tab || '', ob: a.baoCao || '', hv: 'xuat', muc: a.muc,
      bg: a.soBanGhi == null ? null : a.soBanGhi,
      tr: (a.truong || []).slice(), trTen: (a.truongTen || []).slice(),
      md: a.mucDichMa || null, mdTen: a.mucDich || null, dau: 1
    };
  }
  function ghiAudit(a, bc) {
    AUDIT.push(a);
    ghiSoChung(dongAudit(a, bc));
  }

  /* ─────────── MỤC ĐÍCH XUẤT — Luật BVDLCN 91/2025 ────────────────────
     Danh sách đóng, không có ô «khác» tự do: một ô tự do thì trong ba
     tháng mọi lượt xuất đều ghi «công việc», và sổ audit thành vô dụng. */
  const MUC_DICH = [
    ['bao_cao_cap_tren', 'Lập báo cáo gửi cơ quan quản lý cấp trên'],
    ['doi_chieu_noi_bo', 'Đối chiếu số liệu nội bộ giữa các bộ phận'],
    ['ho_so_luu', 'Lập hồ sơ lưu trữ theo quy định'],
    ['kiem_tra_thanh_tra', 'Phục vụ đoàn kiểm tra · thanh tra'],
    ['xu_ly_su_vu', 'Xử lý một sự vụ cụ thể đang phát sinh']
  ];

  /* ═════════════════════ HAI NÚT — khác chữ, khác màu ═════════════════ */
  function veNut(opt) {
    opt = opt || {};
    let h = '<span class="xunut">'
      + '<button class="btn xu1" data-xu="tong">⬇ Xuất bảng số liệu</button>';
    if (opt.coChiTiet !== false)
      h += '<button class="btn xu2" data-xu="chitiet">⬇ Xuất danh sách chi tiết <i>(có dữ liệu cá nhân)</i></button>';
    return h + '</span>';
  }

  /* ═════════════════════ ĐẦU TRANG — bốn dòng ═════════════════════════ */
  function dauTrang(bc) {
    let h = '<div class="xdau">'
      + '<div class="xd1">' + esc(bc.truong) + '</div>'
      + '<div class="xd2">' + esc(bc.baoCao) + '</div>'
      + '<div class="xd3">' + esc(bc.ky) + '</div>'
      + '<div class="xd4">Phạm vi: <b>' + esc(bc.phamVi) + '</b>';
    if (bc.toanTruong != null && bc.tongPhamVi != null && bc.tongPhamVi !== bc.toanTruong)
      h += ' — <b>' + vn(bc.tongPhamVi) + '</b> ' + esc(bc.donVi || '') + ' trong phạm vi, toàn trường <b>' + vn(bc.toanTruong) + '</b>';
    return h + '</div></div>';
  }

  /* ═════════════════════ CUỐI TRANG ═══════════════════════════════════ */
  function cuoiTrang(bc, ma, mucDich) {
    let h = '<div class="xcuoi"><div class="xqt"><b>Quy tắc đếm</b><ul>';
    (bc.quyTac || []).forEach(q => h += '<li>' + esc(q) + '</li>');
    if (!(bc.quyTac || []).length) h += '<li>—</li>';
    h += '</ul></div><div class="xvet">Người xuất: <b>' + esc(bc.nguoi) + '</b>'
      + (bc.chucDanh ? ' <i>(' + esc(bc.chucDanh) + ')</i>' : '')
      + ' · Thời điểm: <b>' + k2s(HOMNAY) + '</b>'
      + (mucDich ? ' · Mục đích: <b>' + esc(mucDich) + '</b>' : '')
      + ' · Mã audit: <b>' + esc(ma) + '</b></div></div>';
    return h;
  }

  /* ═════════════ MỨC 1 · BẢNG TỔNG HỢP — xuất thẳng ═══════════════════
     Chỉ có số ⇒ không phải dữ liệu cá nhân ⇒ không có cổng. Vẫn ghi audit
     đơn giản, vì «ai lấy con số nào đi đâu» là câu hỏi sẽ được hỏi lại.  */
  /* v2 · việc 3 — màn hình đang bày một lưới CÓ HỌ TÊN (`K4`) không?
     Đọc dải `data-kbk4` mà `KB.K4` gắn, và chỉ tính dải ĐANG HIỆN (tab ẩn
     thì không). Bối cảnh `coHoTen` ép tay được: `true` — bảng có tên dù
     không dựng bằng `K4`; `false` — tệp mức 1 của tab là bản GỘP đã bỏ cột
     họ tên, để nút mức 1 xuất tự do như v1. */
  function dangCoHoTen(bc) {
    if (bc.coHoTen === true || bc.coHoTen === false) return bc.coHoTen;
    return $$('[data-kbk4]').some(n => n.offsetParent !== null);
  }

  function tongHop(themVaoBoiCanh) {
    const bc = Object.assign({}, boiCanh(), themVaoBoiCanh || {});
    /* 🛑 lưới người × ngày có họ tên: «chỉ có số» là câu SAI — mỗi ô là số của
       MỘT NGƯỜI có tên. Không cho đi đường tự do; chuyển sang cổng mức 2. */
    if (dangCoHoTen(bc)) { chiTiet(themVaoBoiCanh, { tuMuc1: true }); return; }
    const ma = maAudit();
    ghiAudit({
      ma, muc: 1, luc: HOMNAY, nguoi: bc.nguoi, baoCao: bc.baoCao, mucDich: null, truong: null,
      gio: gioNay(), chucDanh: bc.chucDanh || '', menu: bc.menu || '', tab: bc.tab || '',
      soBanGhi: bc.soDongTongHop == null ? null : bc.soDongTongHop, truongTen: [], mucDichMa: null
    }, bc);
    hopThoai('⬇ Xuất bảng số liệu — <span class="xtag t1">Mức 1 · chỉ có số</span>',
      '<div class="xok">Tệp <b>.xlsx</b> đã tạo. Tệp mức 1 <b>chỉ mang số tổng hợp</b>, không mang cột họ tên — '
      + 'là <b>số liệu thống kê</b>, xuất tự do. Lượt xuất vẫn ghi một dòng vào nhật ký hệ thống <b>(M10.7)</b>, nhãn «mức 1».</div>'
      + '<div class="xfile">' + dauTrang(bc) + '<div class="xbody">' + (bc.xemTruoc || '<i>(nội dung bảng đang xem)</i>') + '</div>'
      + cuoiTrang(bc, ma, null) + '</div>',
      '<button class="btn p" data-xdong="1">Đã hiểu</button>');
  }

  /* ═════════════ MỨC 2 · DANH SÁCH CHI TIẾT — có cổng ═════════════════
     Bốn việc bắt buộc, không bỏ việc nào:
       ① chọn MỤC ĐÍCH  ② chọn TRƯỜNG xuất  ③ ĐÓNG DẤU tệp  ④ ghi AUDIT đủ */
  function chiTiet(themVaoBoiCanh, opt) {
    const bc = Object.assign({}, boiCanh(), themVaoBoiCanh || {});
    const truongDL = bc.truong_du_lieu || [];
    let h = '';
    if (opt && opt.tuMuc1)
      h += '<div class="xcanh">↪ Anh/chị bấm <b>Xuất bảng số liệu</b>, nhưng bảng đang xem là <b>lưới có họ tên</b> — '
        + 'mỗi ô là số của <b>một người có tên</b>, nên tệp là <b>dữ liệu cá nhân</b> dù chỉ có số. Lượt này đi cổng mức 2.</div>';
    h += '<div class="xcanh">⚖ <b>Danh sách này có dữ liệu cá nhân.</b> Theo <b>Luật Bảo vệ dữ liệu cá nhân 91/2025</b>, '
      + 'mỗi lượt xuất phải <b>nêu mục đích</b>, <b>chỉ lấy trường cần dùng</b>, và <b>để lại vết</b>. '
      + 'Tệp tải về sẽ mang dấu của lượt xuất này.</div>';
    h += '<div class="xm"><b>① Mục đích xuất</b> <i>— bắt buộc chọn một</i><div class="xmd">'
      + MUC_DICH.map((m, i) => '<label class="xr"><input type="radio" name="xmd" value="' + m[0]
        + '"' + (i === 0 ? '' : '') + '> ' + esc(m[1]) + '</label>').join('') + '</div></div>';
    h += '<div class="xm"><b>② Trường dữ liệu đưa vào tệp</b> <i>— bỏ chọn trường không cần dùng</i><div class="xtr">'
      + (truongDL.length
        ? truongDL.map(t => '<label class="xc"><input type="checkbox" class="xtrc" value="' + esc(t.khoa) + '"'
          + (t.macDinh === false ? '' : ' checked') + (t.batBuoc ? ' disabled' : '') + '> ' + esc(t.ten)
          + (t.batBuoc ? ' <i>(bắt buộc)</i>' : '') + (t.nhay ? ' <b class="xnhay">nhạy cảm</b>' : '') + '</label>').join('')
        : '<i>(demo chưa khai danh sách trường — `app.20` truyền `truong_du_lieu`)</i>')
      + '</div></div>';
    h += '<div class="xm"><b>③ Tệp sẽ mang dấu</b><div class="xdau2">Tên người xuất · chức danh · thời điểm · mục đích · mã audit — '
      + 'in ở cuối mọi trang, không gỡ được khỏi tệp.</div></div>';
    hopThoai('⬇ Xuất danh sách chi tiết — <span class="xtag t2">Mức 2 · có dữ liệu cá nhân</span>', h,
      '<button class="btn" data-xdong="1">Hủy</button>'
      + '<button class="btn d" id="xuGo" disabled>⬇ Tôi xác nhận mục đích trên và tải tệp</button>');
    const ktra = () => {
      const r = document.querySelector('input[name="xmd"]:checked');
      const n = $$('.xtrc').filter(x => x.checked).length;
      const b = $('#xuGo'); if (!b) return;
      b.disabled = !(r && (n > 0 || !truongDL.length));
      b.textContent = r ? '⬇ Tôi xác nhận mục đích trên và tải tệp (' + n + ' trường)'
        : '⬇ Chọn mục đích trước';
    };
    $$('#xuMask input').forEach(i => i.addEventListener('change', ktra));
    ktra();
    $('#xuGo').addEventListener('click', () => {
      const r = document.querySelector('input[name="xmd"]:checked');
      const md = (MUC_DICH.find(m => m[0] === r.value) || [, ''])[1];
      const tr = $$('.xtrc').filter(x => x.checked).map(x => x.value);
      const ma = maAudit();
      ghiAudit({
        ma, muc: 2, luc: HOMNAY, nguoi: bc.nguoi, baoCao: bc.baoCao, mucDich: md, truong: tr,
        gio: gioNay(), chucDanh: bc.chucDanh || '', menu: bc.menu || '', tab: bc.tab || '',
        soBanGhi: bc.soDong == null ? null : bc.soDong,
        truongTen: tr.map(k => ((truongDL.find(t => t.khoa === k) || {}).ten) || k),
        mucDichMa: r.value
      }, bc);
      hopThoai('✅ Đã tạo tệp — <span class="xtag t2">Mức 2</span>',
        '<div class="xok">Tệp <b>.xlsx</b> đã tạo và <b>đã đóng dấu</b>. Một dòng audit đã ghi vào nhật ký hệ thống '
        + '<b>(M10.7)</b> — mã <b>' + esc(ma) + '</b>.</div>'
        + '<div class="xfile">' + dauTrang(bc)
        + '<div class="xbody"><i>' + tr.length + ' trường dữ liệu · ' + (bc.soDong || '—') + ' dòng có họ tên</i></div>'
        + cuoiTrang(bc, ma, md) + '</div>',
        '<button class="btn p" data-xdong="1">Đóng</button>');
    });
  }

  /* ─────────────── hộp thoại riêng của tệp nền (tự tạo DOM) ─────────── */
  function nodeMask() {
    let m = $('#xuMask');
    if (m) return m;
    m = document.createElement('div');
    m.id = 'xuMask'; m.className = 'xumask';
    m.innerHTML = '<div class="xumodal"><div class="xuh" id="xuH"></div><div class="xub" id="xuB"></div>'
      + '<div class="xuf" id="xuF"></div></div>';
    document.body.appendChild(m);
    m.addEventListener('click', e => {
      if (e.target === m || e.target.closest('[data-xdong]')) dong();
    });
    return m;
  }
  function hopThoai(tieuDe, than, chan) {
    nodeMask();
    $('#xuH').innerHTML = tieuDe; $('#xuB').innerHTML = than; $('#xuF').innerHTML = chan || '';
    $('#xuMask').classList.add('on');
  }
  const dong = () => { const m = $('#xuMask'); if (m) m.classList.remove('on') };

  /* sổ audit — bày ra được khi cần chứng minh «đã ghi vết» */
  function soAudit() {
    if (!AUDIT.length) return '<div class="empty">Chưa có lượt xuất nào trong phiên này.</div>';
    return '<div class="tbx"><table class="bgt"><thead><tr><th>Mã</th><th>Mức</th><th>Người xuất</th>'
      + '<th>Báo cáo</th><th>Mục đích</th></tr></thead><tbody>'
      + AUDIT.slice().reverse().map(a => '<tr><td>' + esc(a.ma) + '</td><td>'
        + (a.muc === 1 ? '<span class="xtag t1">1</span>' : '<span class="xtag t2">2</span>') + '</td><td>'
        + esc(a.nguoi) + '</td><td>' + esc(a.baoCao) + '</td><td>' + esc(a.mucDich || '—') + '</td></tr>').join('')
      + '</tbody></table></div>';
  }

  function gan() {
    if (gan._da) return; gan._da = true;
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-xu]');
      if (!b) return;
      if (b.getAttribute('data-xu') === 'tong') tongHop(XU.themBoiCanh ? XU.themBoiCanh() : null);
      else chiTiet(XU.themBoiCanh ? XU.themBoiCanh() : null);
    });
  }

  return {
    veNut, tongHop, chiTiet, dauTrang, cuoiTrang, soAudit, gan, noiBoiCanh, dong, MUC_DICH, AUDIT,
    /* v2 */ KHOA_SO, docSoChung, dongAudit
  };
})();


/* ══════════════════════════════════════════════════════════════════════════
   ĐÓNG KHUNG — `BCM9-3C` (20/9/2026). Cặp với `app.10-mo-khung-bao-cao.js`.

   Đưa bốn cổng của hợp đồng 🔒 HDBC ra ngoài khung dưới một cái tên duy nhất,

   Kèm theo là các tiện ích của nền mà tab báo cáo cần và menu chủ có thể đang
   hiểu khác: `HOMNAY` của nền là **28/12/2026** — mốc chung của cả nhóm 📊,
   ⛔ không phải "hôm nay" mô phỏng của menu chủ (`M6.12` 23/10 · `M8.1` và

   và NÓI RA mốc ấy trên màn hình thay vì để người đọc tự đoán.
   ══════════════════════════════════════════════════════════════════════════ */

  BCN = {
    CT: CT, KB: KB, PV: PV, XU: XU,
    CHIEU: CHIEU,
    HOMNAY: HOMNAY, NAMHOC: NAMHOC, NAMHOC_TU: NAMHOC_TU, NAMHOC_DEN: NAMHOC_DEN,
    esc: esc, vn: vn, vnd: vnd, trieu: trieu, tile: tile, kd: kd,
    d2k: d2k, k2d: k2d, d2s: d2s, k2s: k2s, kThu: kThu, p2: p2,
    themNgay: themNgay, soNgay: soNgay, thangCua: thangCua, tenThang: tenThang
  };

})();


/* ══════════════════════════════════════════════════════════════════════════
   PHẦN DÙNG CHUNG CỦA BỐN TAB BÁO CÁO TẠI MENU CHỦ — `BCM9-3C` (20/9/2026)
   Chép nguyên vào cả bốn demo `M6.9` · `M6.12` · `M8.1` · `M8.4`.

   ⚠ Tệp này KHÔNG thuộc hợp đồng 🔒 HDBC (hợp đồng chỉ có bốn tệp nền).
     Nó là phần dùng chung của riêng phiên `3C`; băm ghi ở mục G của phiếu để
     phiên sau biết bốn bản phải giống nhau.

   Bốn tab đều phải mang đúng những thứ này, nên chúng ở một chỗ:
     · `BC.batKhung()`  — bật/tắt lớp `bc9` (xem `style.30-bao-cao.css`)
     · `BC.daiLuat()`   — dải nói tab này chịu luật nhóm 📊 (`3C` §5)
     · `BC.daiRanh()`   — dải RANH GIỚI với tab tác nghiệp bên cạnh (`N7`)
     · `BC.daiMoc()`    — dải nói mốc "hôm nay" của nhóm 📊
     · `BC.daiNgoaiLe()`— dải nói vai đang đọc số qua ngoại lệ quyền khai tay
     · `BC.ghiChu()` · `BC.nutGhiChu()` — lý do thiết kế, ẩn sau nút 💡
     · `BC.nutXuat()`   — hai nút xuất, chỉ với vai có `XD` trên chính tab này
     · `BC.ganChung()`  — bắt nút deep-link, nối `KB` `PV` `XU`
   ══════════════════════════════════════════════════════════════════════════ */

var BC = (function () {

  /* ── lớp khung CSS ──────────────────────────────────────────────────────
     Chỉ bật khi tab báo cáo đang mở. Rời tab là tắt, và đóng luôn panel còn
     mở — panel sống ngoài `#content` nên nó không tự biến mất theo lần vẽ. */
  function batKhung(dangMo) {
    document.body.classList.toggle('bc9', !!dangMo);
    if (!dangMo && BCN) { BCN.KB.dong(); BCN.XU.dong(); }
  }

  /* ── dải LUẬT (`3C` §5) ─────────────────────────────────────────────────
     Bốn tab này nằm trong menu nghiệp vụ nhưng chịu luật của nhóm 📊. Viết ra
     để phiên sau không "dọn cho giống tab cũ" — thêm một nút `Tạo` vào đây là
     phá `N4`, không phải làm cho tiện. */
  function daiLuat() {
    return '<div class="ro">📊 <b>Tab báo cáo</b> — chỉ <code>X</code> <code>XD</code>, '
      + 'không nút ghi nào. Mọi ô số bấm được.</div>';
  }

  /* ── dải RANH GIỚI (`N7`) — 🛑 bắt buộc, không để trống ──────────────────
     Không nêu thì chắc chắn có người hỏi «sao hai chỗ ra hai số khác nhau» —
     và cả hai đều đúng, vì khác khoảng thời gian. */
  function daiRanh(tenTabCu, hoiCu, hoiMoi) {
    return '<div class="canh b">🧭 <b>' + BCN.esc(tenTabCu) + '</b>: <i>«' + BCN.esc(hoiCu)
      + '»</i> · <b>tab này</b>: <i>«' + BCN.esc(hoiMoi) + '»</i>.</div>';
  }

  /* ── dải MỐC — vì sao ngày chốt mặc định không phải "hôm nay" của menu chủ */
  function daiMoc(homNayMenu) {
    if (!homNayMenu || homNayMenu === BCN.k2s(BCN.HOMNAY)) return '';
    return '<div class="ro">🗓 Mốc chung của nhóm 📊: <b>' + BCN.k2s(BCN.HOMNAY)
      + '</b> — menu này mô phỏng hôm nay <b>' + BCN.esc(homNayMenu) + '</b>.</div>';
  }

  /* ── nối dây một lần ────────────────────────────────────────────────────
     `veLai` là hàm vẽ lại của MENU CHỦ: đổi ngày chốt, đổi khoảng, đổi phân tổ
     đều phải đi qua đúng một đường vẽ, không dựng đường thứ hai. */
  function ganChung(o) {
    if (ganChung._da) return; ganChung._da = true;
    BCN.KB.datMenu(o.menu);
    BCN.KB.noiQuyen(o.coXD, o.moTaNguon);
    BCN.PV.noiVeLai(o.veLai);
    BCN.XU.noiBoiCanh(o.boiCanh);
    BCN.KB.gan(); BCN.PV.gan(); BCN.XU.gan();

    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-bcnote]')) { NOTE = !NOTE; o.veLai(); return }
      var dl = e.target.closest('[data-dl]');
      if (!dl) return;
      var m = dl.getAttribute('data-dl'), q = dl.getAttribute('data-dlq') || '';
      /* ── deep-link VỀ CHÍNH MENU NÀY thì nhảy thật ──────────────────────
         Bốn tab của `3C` nằm ngay trong menu chủ, nên phần lớn ô số dẫn về
         một tab bên cạnh — cách một cú bấm, không cách một trang. Bày ra
         đường dẫn rồi bắt người dùng tự đi là bỏ phí đúng cái lợi thế mà
         `N11` đổi lấy khi đặt báo cáo tại menu chủ.                        */
      if (m === o.menu && typeof o.nhay === 'function') {
        BCN.KB.dong();
        o.nhay(q);
        return;
      }
      /* deep-link sang menu khác: demo là tệp rời, nên nói ra đường dẫn thật
         thay vì nhảy trang — nhảy sang một demo không đọc tham số thì người
         rà tưởng deep-link hỏng. */
      toast('↗ Deep-link sang <b>' + BCN.esc(m) + '</b> — <code>?' + BCN.esc(q) + '</code><br>'
        + '<i>Demo một tệp: không mở được menu khác, nhưng đường dẫn là đường dẫn thật.</i>');
    });
  }

  /* ── dải NGOẠI LỆ QUYỀN — `N5` nói «ẩn thì phải nói»; mở cũng phải nói ──
     Cổng `N5` đọc cột `XD` của bảng chuẩn. Có menu chủ **không có một ô `XD`
     nào** (`M6.9`), có chức danh chưa từng có mặt trong bảng của menu ấy
     (`TTVP`). Prompt `3C` §6 vẫn cấp `X XD` cho họ trên tab báo cáo — đó là
     ngoại lệ KHAI TAY mà sổ điều phối §5 cho phép, với điều kiện nêu lý do.
     Nêu ở phiếu thôi thì người đang đọc bảng không thấy; nên nêu luôn ở đây. */
  function daiNgoaiLe(ds) {
    if (!ds || !ds.length) return '';
    return '<div class="canh w">🔑 Bảng chuẩn quyền <b>chưa có ô <code>XD</code></b> ở '
      + ds.map(function (x) { return '<b>' + BCN.esc(x) + '</b>' }).join(' · ')
      + ' — đang đọc qua <b>ngoại lệ khai tay</b> <i>(phiếu 3C mục H)</i>.</div>';
  }

  /* ── GHI CHÚ THIẾT KẾ — ẩn mặc định ────────────────────────────────────
     Sổ điều phối §2: *«lý do thiết kế nằm sau nút `💡 Ghi chú thiết kế` ẩn
     mặc định»*. Ngưỡng mật độ chữ ≤ 20% không đòi bỏ lời giải thích — nó đòi
     lời giải thích **đừng chiếm màn hình mặc định**. Bốn menu chủ đều có sẵn
     công tắc ấy và đều dùng lớp `nn` trên `<body>` để tắt, nên hàm này chỉ
     hỏi đúng công tắc của menu chủ thay vì dựng một công tắc thứ hai. */
  var NOTE = false;
  var coCongTacChu = function () { return !!document.getElementById('btnNote') };

  function ghiChu(html) {
    /* menu chủ có công tắc riêng (`M6.9` · `M6.12` dùng lớp `nn`) thì nghe nó,
       ⛔ đừng dựng công tắc thứ hai cạnh một công tắc đã có. */
    if (coCongTacChu()) {
      if (document.body.classList.contains('nn')) return '';
    } else if (!NOTE) return '';
    return '<div class="dnote">💡 <b>Ghi chú thiết kế.</b> ' + html + '</div>';
  }

  /* ── HAI NÚT XUẤT chỉ hiện với vai có `XD` TRÊN CHÍNH TAB BÁO CÁO ──────
     Cổng `N5` quyết định **ô nào đọc được số**; còn **mang số ra khỏi màn
     hình** là việc của `XD` trên chính tab này — hai chuyện khác nhau, và
     prompt `3C` §6 cấp `X` cho vài vai mà không cấp `XD`.
     Vai không có `XD` thì ⛔ không thấy nút nào, và **được nói cho biết vì
     sao** — `N5` đòi «ẩn thì phải nói», kể cả khi thứ bị ẩn là một cái nút. */
  function nutXuat(coXD) {
    if (coXD) return BCN.XU.veNut();
    return '<span class="noacc" title="Tab này cấp cho vai của bạn quyền Xem (X), '
      + 'không cấp quyền Xuất dữ liệu (XD)">🔒 không có quyền Xuất</span>';
  }

  /* `M8.1` và `M8.4` KHÔNG có công tắc ghi chú — tab báo cáo tự mang một cái,
     và chỉ mang khi menu chủ chưa có. */
  function nutGhiChu() {
    if (coCongTacChu()) return '';
    return '<button class="btn xs" data-bcnote="1">💡 Ghi chú thiết kế: '
      + (NOTE ? 'BẬT' : 'TẮT') + '</button>';
  }

  /* ── đo mật độ chữ giải thích (`nh9` §9.1 — ngưỡng ≤ 20%) ───────────────
     Gọi `doMatDoChuBC()` trong console khi tab báo cáo đang mở. */
  function doMatDo() {
    /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
    var giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.pvcut';
    var goc = document.querySelector('#content');
    var tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
    var chu = 0;
    goc.querySelectorAll(giai).forEach(function (n) {
      chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length;
    });
    var r = { tong: tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
    console.log('Mật độ chữ giải thích —', r);
    return r;
  }

  return {
    batKhung: batKhung, daiLuat: daiLuat, daiRanh: daiRanh, daiMoc: daiMoc,
    daiNgoaiLe: daiNgoaiLe, ghiChu: ghiChu, nutGhiChu: nutGhiChu, nutXuat: nutXuat,
    ganChung: ganChung, doMatDo: doMatDo
  };
})();
function doMatDoChuBC() { return BC.doMatDo() }

function bcLTNoiNguon() {
  var CT = BCN.CT;

  /* tệp vai đang xem THẤY (điều kiện hiển thị folder — lớp ② của M6.12) */
  function tepThay(kemXoa) {

      return f && thay(f) && (kemXoa ? true : !t.xoa);
    });

  /* năm của tệp = năm của bản hiện hành; sàn của lớp đọc từ bản chiếu M10.11 */
  function namTep(t) { return Number(String(hienHanh(t).ngay).slice(0, 4)) }

  CT.nguonSo('LT.01', function (tham) {
    var loc = tham.loc || function () { return true };
    var ds = tepThay(false).filter(function (t) {
      var g = gocCuaTep(t); return g && loc(g);
    }).map(function (t) {
      return {
        id: t.id, ten: t.ten,
        phu: (gocCuaTep(t) || {}).ten + ' · ' + t.pb.length + ' phiên bản'
          + (t.dlcn ? ' · ⚖ có dữ liệu cá nhân' : '')
      };
    });
    return { giaTri: ds.length, banGhiGoc: ds };
  });

  CT.nguonSo('LT.02', function (tham) {
    var chot = tham.chotNgay, namChot = Number(chot.slice(0, 4));
    var kieu = (tham.kieu || 'kho');
    var ds = [];
    if (kieu === 'kho') {
      ds = tepThay(false).map(function (t) { return { id: t.id, ten: t.ten, phu: 'năm ' + namTep(t) } });
    } else if (kieu === 'rac') {
      ds = tepThay(true).filter(function (t) { return t.xoa }).map(function (t) {
        return { id: t.id, ten: t.ten, phu: 'xóa ' + String(t.xoa.ngay || '').slice(0, 10) };
      });
    } else if (kieu === 'giaiphong') {
      ds = HUY.map(function (x) {
        return { id: x.hash, ten: x.ten, phu: 'hủy ' + String(x.ngayHuy).slice(0, 10) + ' · ' + x.goc };
      });
    } else if (kieu === 'nam') {
      ds = tepThay(false).filter(function (t) { return namTep(t) === tham.nam })
        .map(function (t) {
          var qua = namTep(t) + BCLT_LOP.sanNam <= namChot;
          return {
            id: t.id, ten: t.ten,
            phu: 'năm ' + namTep(t) + ' + sàn ' + BCLT_LOP.sanNam + ' năm ⇒ '
              + (qua ? 'đã qua sàn' : 'còn ' + (namTep(t) + BCLT_LOP.sanNam - namChot) + ' năm')
          };
        });
    }
    return { giaTri: ds.length, banGhiGoc: ds };
  });

  CT.nguonSo('LT.03', function (tham) {
    var tu = tham.tuNgay, den = tham.denNgay;
    var ds = HUY.filter(function (x) {
      var n = String(x.ngayHuy).slice(0, 10);
      return n >= tu && n <= den;
    }).map(function (x) {
      return { id: x.hash, ten: x.ten, phu: String(x.ngayHuy).slice(0, 10) + ' · ' + tenNS(x.boiHuy) };
    });
    return { giaTri: ds.length, banGhiGoc: ds };
  });

  /* ★ CHƯA CÓ NGUỒN — trả cảnh báo có tên, ⛔ không trả 0 */
  CT.nguonSo('LT.04', function () {
    return {
      giaTri: null, banGhiGoc: [],
      canhBao: { ma: 'CHUA_CO_DU_LIEU', chu: 'chưa có menu chủ' }
    };
  });
}

/* ══════════════ CỔNG `N5` ═══════════════════════════════════════════════
   🛑 Đọc kỹ chỗ này — nó lệch một bước so với nguyên văn `N5`, có chủ ý và
      đã ghi thành điểm phải hỏi ở **mục H của phiếu 3C**.

   `N5` nguyên văn: ô chỉ hiện số nếu vai có **`XD`** trên feature nguồn.
   Đo bảng chuẩn ngày 20/9/2026 thì cột `XD` ở các menu nghiệp vụ **gần như

   hết mọi vai — một hệ thống báo cáo không đọc được gì.

   Cách đang chạy: cổng đọc **`X` trên feature nguồn**. Vai không thấy bản ghi
   ở menu chủ thì cũng không đếm được chúng ở đây — phần bảo vệ thật của `N5`

   báo cáo quyết định (hai nút xuất), đúng chỗ nó nên nằm.                    */
var BCLT_NGUON = {

};
/* `X` ở feature nguồn — chép từ `ma-tran-quyen-chuan-hoa.csv`, ⛔ không bịa */

  GVT: ['m6.12.kho_tai_lieu', 'm6.12.thung_rac'],
  GVV: ['m6.12.kho_tai_lieu', 'm6.12.thung_rac']
};
function bcLTCoXD(f) { return (BCLT_X[role] || []).indexOf(f) >= 0 }
function bcLTCoTab() { return ['FULL', 'HT', 'VT'].indexOf(role) >= 0 }
/* `XD` trên CHÍNH tab báo cáo. ✅ Anh Ninh chốt 21/9 (`H.2`): Văn thư phạm vi
   **School** — `M6.12` khóa cả bộ chọn năm học lẫn bộ chọn điểm trường, kho
   tổ chức theo folder nên ⛔ không có chiều điểm trường để mà cắt. */
function bcLTCoXuat() { return ['FULL', 'HT', 'VT'].indexOf(role) >= 0 }

/* ══════════════ VẼ TAB ══════════════════════════════════════════════════ */
function veBaoCaoLuuTru() {
  if (!BCN) return '<div class="empty">Đang nạp nền báo cáo…</div>';
  var PV = BCN.PV, KB = BCN.KB, CT = BCN.CT, esc = BCN.esc;
  KB.moi();

  /* Dải RANH GIỚI ở lại màn hình mặc định vì `N7` bắt buộc; ba lời giải
     thích còn lại về sau nút 💡 — chúng là LÝ DO, không phải thứ phải đọc
     mỗi lần mở bảng (ngưỡng mật độ chữ ≤ 20%). */
  var h = BC.daiRanh('Kho tài liệu', 'tài liệu X để ở đâu', 'kho giữ bao nhiêu, bao nhiêu tới hạn')

      + k2s(HOMNAY) + '</b>. <b>Bản năm</b> là <b>loại A</b> — HT ký, phát hành qua '
      + '<code>m9.9.so_phat_hanh</code> <i>(phiên 4A dựng)</i>.')
    + PV.daiMau() + PV.chotNgay() + PV.daiCanhBao() + PV.khoang();

  /* ── KHỐI A · TỒN — tệp theo nhóm hồ sơ ─────────────────────────────── */
  var goc = FD.filter(function (f) { return !f.cha && thay(f) });
  h += KB.K1({
    id: 'a', tieuDe: 'A · Tệp trong kho theo nhóm hồ sơ', ma: 'LT.01', chip: 'TON',
    moTaKy: PV.moTaChot(), donVi: 'tệp', nguon: 'm6.12.kho_tai_lieu',
    tenCotDau: 'Nhóm hồ sơ (folder gốc)', chieu: 'nhom_ho_so',
    dong: goc.map(function (f) {
      return {
        id: f.id, ten: f.ten, loc: function (g) { return g.id === f.id },
        link: { menu: 'M6.12', ctx: 'tab=kho&fd=' + f.id, nhan: f.ten }
      };
    }),
    oSo: function (d) { return CT.doc('LT.01', PV.thamSo({ loc: d.loc, phanTo: 'nhom_ho_so' })) },
    link: function (d) { return d.link }
  });

  /* ── KHỐI B · TỒN — trạng thái lưu trữ ──────────────────────────────── */
  h += KB.K1({
    id: 'b', tieuDe: 'B · Tệp theo trạng thái lưu trữ', ma: 'LT.02', chip: 'TON',
    moTaKy: PV.moTaChot(), donVi: 'tệp', nguon: 'm6.12.kho_tai_lieu',
    tenCotDau: 'Trạng thái', chieu: 'trang_thai_luu_tru',
    dong: [
      {
        id: 'kho', ten: 'Đang giữ trong kho', kieu: 'kho',
        link: { menu: 'M6.12', ctx: 'tab=kho', nhan: 'Kho tài liệu' }
      },
      {
        id: 'rac', ten: 'Trong thùng rác — còn khôi phục được', kieu: 'rac',
        link: { menu: 'M6.12', ctx: 'tab=rac', nhan: 'Thùng rác' }
      },
      {
        id: 'giaiphong', ten: '🗄 Nội dung đã giải phóng', kieu: 'giaiphong',
        phu: 'bản ghi ở lại, nội dung không còn',
        link: { menu: 'M10.11', ctx: 'tab=luot_giai_phong', nhan: 'Lượt giải phóng' }
      }
    ],
    oSo: function (d) {
      return CT.doc('LT.02', PV.thamSo({ kieu: d.kieu, phanTo: 'trang_thai_luu_tru' }));
    },
    link: function (d) { return d.link },
    duoiBang: '<div class="ro">⛔ Dung lượng theo lớp ở <b>M10.11</b>, không nhân bản. '
      + '<button class="btn xs" data-dl="M10.11" data-dlq="tab=tong_quan">↗ Mở</button></div>'
  });

  /* ── KHỐI C · TỒN — TUỔI TỆP so với sàn của lớp ──────────────────────
     Tách khỏi khối B có lý do số học: «đã qua sàn» là TẬP CON của «đang giữ
     trong kho», nên để chung một bảng thì cột Tỉ lệ cộng một dòng vào chính
     mẫu số của nó và ra một con số không có nghĩa nào.                      */
  h += KB.K1({
    id: 'c', tieuDe: 'C · Tuổi tệp trong kho so với sàn của lớp ' + BCLT_LOP.ma, ma: 'LT.02', chip: 'TON',
    moTaKy: PV.moTaChot(), donVi: 'tệp', nguon: 'm6.12.kho_tai_lieu',
    tenCotDau: 'Năm của tệp', dong: bcLTDongNam(),
    oSo: function (d) {
      return CT.doc('LT.02', PV.thamSo({ kieu: 'nam', nam: d.nam, phanTo: 'trang_thai_luu_tru' }));
    },
    link: { menu: 'M10.11', ctx: 'tab=cau_hinh&lop=' + BCLT_LOP.ma, nhan: '⚙ Chính sách lớp ' + BCLT_LOP.ma },
    duoiBang: '<div class="ro">⚙ Sàn <b>' + BCLT_LOP.sanNam + ' năm</b> — chính sách lớp '
      + BCLT_LOP.ma + ' ở M10.11. «Qua sàn» <b>≠ được hủy</b>: cần QĐ hủy + hội đồng ≥ 5.</div>'
  });

  /* ── KHỐI D · PS — sổ lượt hủy nội dung ─────────────────────────────── */
  h += bcLTSoHuy();

  /* ── KHỐI E · chưa có nguồn — nói ra, không ghi 0 ───────────────────── */
  h += KB.K1({
    id: 'e', tieuDe: 'E · Hồ sơ đã nộp lưu · chờ hội đồng xét hủy', ma: 'LT.04', chip: 'TON',
    moTaKy: PV.moTaChot(), donVi: 'hồ sơ', nguon: 'm6.12.kho_tai_lieu',
    tenCotDau: 'Nội dung', tong: false,
    dong: [
      { id: 'noplu', ten: 'Hồ sơ đã nộp lưu trong năm (có biên bản giao nhận)' },
      { id: 'hoidong', ten: 'Hồ sơ đang chờ hội đồng xét hủy' }
    ],
    oSo: function () { return CT.doc('LT.04', PV.thamSo({ phanTo: null })) },
    duoiBang: '<div class="canh w">🛑 <b>Lập hồ sơ · nộp lưu</b> <b>chưa có menu chủ</b> '
      + '<i>(M6.12 §1.1)</i> — ⛔ không ghi 0.</div>'
  });

  /* loại A — bản năm có Hiệu trưởng ký, phát hành qua sổ chung */
  return h;
}


/* dòng của khối C — mỗi năm có tệp một dòng, nhãn tự nói đã qua sàn hay chưa */
function bcLTDongNam() {
  var namChot = Number(BCN.PV.st.chotNgay.slice(0, 4));
  var m = {};
  TE.forEach(function (t) {
    var f = fdById(t.fd);
    if (!f || !thay(f) || t.xoa) return;
    m[Number(String(hienHanh(t).ngay).slice(0, 4))] = true;
  });
  return Object.keys(m).map(Number).sort(function (a, b) { return a - b }).map(function (n) {
    var con = n + BCLT_LOP.sanNam - namChot;
    return {
      id: 'n' + n, nam: n, ten: 'Năm ' + n,
      phu: con <= 0 ? '⚠ đã qua sàn ' + BCLT_LOP.sanNam + ' năm' : 'còn ' + con + ' năm nữa mới tới sàn'
    };
  });
}

/* ── KHỐI D · sổ lượt hủy nội dung (`K5`) ─────────────────────────────────
   `kiemSoHieu:false`: đây là **mã lượt**, không phải số hiệu văn bản — cùng
   lý do mà `M9.13` tab 2 đặt `false` cho dải `DC-nn`. Dò đứt số trên một dãy
   mã lượt là dò một quy tắc không tồn tại.                                 */
function bcLTSoHuy() {
  var PV = BCN.PV, KB = BCN.KB;
  var ds = HUY.filter(function (x) {
    var n = String(x.ngayHuy).slice(0, 10);
    return n >= PV.st.tuNgay && n <= PV.st.denNgay;
  }).map(function (x) {
    return {
      so: x.hash, ngay: String(x.ngayHuy).slice(0, 10).split('-').reverse().join('/'),
      ten: x.ten, goc: x.goc, ly: x.lyDo, nguoi: tenNS(x.boiHuy)
    };
  });
  return KB.K5({
    tieuDe: 'D · Sổ lượt hủy nội dung tệp', chip: 'PS', moTaKy: PV.moTaKhoang(),
    banGhi: ds, kiemSoHieu: false,
    cot: [
      { khoa: 'so', ten: 'Mã băm' }, { khoa: 'ngay', ten: 'Ngày hủy' },
      { khoa: 'ten', ten: 'Tệp' }, { khoa: 'goc', ten: 'Nơi chứa' },
      { khoa: 'ly', ten: 'Lý do' }, { khoa: 'nguoi', ten: 'Người hủy' }
    ],
    chuoiTrong: 'Không có lượt hủy nội dung nào trong khoảng đang xem.',
    duoiBang: '<div class="ro">📋 Hồ sơ hủy <b>7 thành phần</b> ở <b>M10.11</b>. '
      + '<button class="btn xs" data-dl="M10.11" data-dlq="tab=luot_giai_phong">↗ Mở</button></div>'
  });
}

/* ══════════════ HỘP THOẠI — điều kiện hiển thị · ai thấy · tạo · tải lên · xem · tải · xóa · đổi tên · di chuyển ══════════════ */

/* ---------- BỘ KHAI ĐIỀU KIỆN — đếm TRƯỚC số người sẽ thấy ---------- */
let DKT=null, DK_CTX=null;           /* bản nháp điều kiện đang khai · ngữ cảnh {cha, f (đang sửa), boi} */
function veBoDK(){
 const cha=DK_CTX.cha?fdById(DK_CTX.cha):null, hlCha=cha?dkHieuLuc(cha):null;
 let h='';
 DIM.forEach(([d,ten,ds])=>{
  const gioi=hlCha&&hlCha[d];
  const cu=(DKT[d]||[]).filter(v=>!ds[v]);         /* giá trị không còn tồn tại (tổ đã giải thể) */
  h+='<div class="dkrow"><div class="dkl">'+ten+'<div class="mu" style="font-weight:400;font-size:11px">'+((DKT[d]||[]).length?'chọn '+DKT[d].length+' — HOẶC':'để trống = mọi '+ten.toLowerCase())+'</div></div><div class="dkc">'
   +Object.keys(ds).map(v=>{const on=(DKT[d]||[]).includes(v), kh=gioi&&!gioi.includes(v);
    return '<button class="chip dkchip'+(on?' on':'')+(kh?' kh':'')+'" data-dkd="'+d+'" data-dkv="'+v+'"'+(kh?' disabled title="Folder cha đã giới hạn chiều này — folder con chỉ được thu hẹp"':'')+'>'+esc(ds[v])+'</button>'}).join('')
   +cu.map(v=>'<button class="chip dkchip on bad" data-dkd="'+d+'" data-dkv="'+v+'" title="Không còn tồn tại — bấm để bỏ">⚠ '+esc(tenGT(d,v))+' ✕</button>').join('')
   +(gioi?'<div class="mu" style="font-size:11px;width:100%">Folder cha giới hạn: '+gioi.map(v=>esc(tenGT(d,v))).join(', ')+' — chip ngoài tập này bị khóa.</div>':'')
   +'</div></div>';
 });
 return h;
}
function demDK(){
 const gia={id:'_nhap',ten:'',cha:DK_CTX.cha,dk:DKT,tao:{boi:DK_CTX.boi}};
 const sau=NS.filter(n=>!n.cd.includes('FULL')&&thayF(n,gia).ok);
 const taiDuoc=sau.filter(n=>quyenNS(n,'kho').includes('XD'));
 let h='<div class="dkcount"><div class="big">'+sau.length+'<span>/ '+soNS()+' nhân sự sẽ thấy</span></div>'
  +'<div class="mu">trong đó <b>'+taiDuoc.length+'</b> người tải được (có <b>XD</b> ở M10.4)'
  +(sau.length-taiDuoc.length?' · <b>'+(sau.length-taiDuoc.length)+'</b> chỉ xem được — chức danh không có XD':'')+'</div></div>';
 if(DK_CTX.f){
  const truoc=aiThay(DK_CTX.f), mat=truoc.filter(n=>!sau.includes(n)), them=sau.filter(n=>!truoc.includes(n));
  if(mat.length) h+='<div class="alert w" style="margin:8px 0 0"><span>−</span><span class="sp"><b>'+mat.length+' người đang thấy sẽ mất quyền xem:</b> '+mat.map(n=>esc(n.ten)).join(', ')+'</span></div>';
  if(them.length) h+='<div class="alert b" style="margin:8px 0 0"><span>＋</span><span class="sp"><b>'+them.length+' người sẽ thấy thêm:</b> '+them.map(n=>esc(n.ten)).join(', ')+'</span></div>';
  const thuHep=hauDue(DK_CTX.f.id).filter(c=>!c.xoa&&DIM.some(([d])=>(DKT[d]||[]).length&&(c.dk[d]||[]).some(v=>!DKT[d].includes(v))));
  if(thuHep.length) h+='<div class="alert w" style="margin:8px 0 0"><span>↳</span><span class="sp"><b>Folder con sẽ bị thu hẹp theo</b> (giá trị ngoài tập mới bị bỏ): '+thuHep.map(c=>esc(c.ten)).join(', ')+'</span></div>';
  if(!mat.length&&!them.length) h+='<div class="mu" style="margin-top:6px">Không ai được thêm hay mất quyền xem.</div>';
 }
 if(!sau.length) h+='<div class="alert r" style="margin:8px 0 0"><span>⚠</span><span class="sp">Không nhân sự nào khớp — folder sẽ <b>chỉ hiện với người tạo và quản trị kho</b>.</span></div>';
 return h;
}
function capNhatDK(){$('#dkbo').innerHTML=veBoDK();$('#dkdem').innerHTML=demDK()}

  +'Điều kiện là <b>quy tắc</b>, không phải danh sách người — ai đổi chức danh ở M4.3 hay đổi tổ ở M4.4 thì tự thấy / tự mất.</div></div></div>';
}

 const k=$('#dkKhoa'), f={id:moiId('f'),ten,cha:DK_CTX.cha,dk:saoDK(DKT),tao:{boi:ME().id,ngay:HOMNAY},khoaGhi:!!(k&&k.checked&&!k.disabled)};
 FD.push(f); ghiVet({t:'tao',fd:f.id,nd:'Tạo folder «'+ten+'» — hiện với: '+tomTatDK(f.dk).replace(/<[^>]+>/g,'')});
 if(f.cha) ST.moRong[f.cha]=true; ST.fd=f.id; ST.cur=null; closeM();
 toast('📁 Đã tạo <b>'+esc(ten)+'</b> — '+aiThay(f).length+' nhân sự thấy.'); render();

function giaiThich(n,f){

  h+='<table class="gtt"><tbody>'+chuoiCha(f).map(x=>DIM.map(([d,ten])=>{const can=x.dk[d]||[];

  if(!r.ok){const h0=r.hong[0];h+='<div class="no" style="margin-top:5px">Vì sao: <b>'+DIM.find(x=>x[0]===h0.d)[1]+'</b> ở folder «'+esc(h0.f.ten)+'» — '
   +(h0.co.length?'«'+h0.co.map(v=>esc(tenGT(h0.d,v))).join(', ')+'» không nằm trong tập cho phép':'người này <b>không có '+DIM.find(x=>x[0]===h0.d)[1].toLowerCase()+'</b> nào')+'.'
   +(h0.d==='to'&&!TO[h0.can[0]]?' Tập cho phép tham chiếu <b>tổ không còn tồn tại</b>.':'')+'</div>'}

 h+='</div><div class="gtl"><span class="gtn">① Quyền Feature (M10.4)</span> '+T7.filter(x=>x!=='D').map(x=>'<span class="qc'+(q.includes(x)?' on':'')+'">'+x+'</span>').join('')

function duKien(f,u){
 const d=duoi(u.ten), co=+u.co||0, trung=teTrong(f.id).find(t=>!t.lk&&t.ten.toLowerCase()===u.ten.trim().toLowerCase());
 if(!u.ten.trim()) return {ok:false,nhan:'<span class="st2 r">thiếu tên</span>',ly:'Thiếu tên tệp'};
 if(LOAI_TAT.includes(d)) return {ok:false,nhan:'<span class="st2 r">⛔ .'+d+' luôn bị chặn</span>',ly:'Tệp thực thi (.'+d+') không được lưu trong kho'};
 if(!CFG.loai.includes(d)) return {ok:false,nhan:'<span class="st2 r">⛔ loại .'+esc(d)+'</span>',ly:'Loại .'+d+' chưa bật ở ⚙ Cấu hình'};
 if(co>CFG.coToiDaMB) return {ok:false,nhan:'<span class="st2 r">⛔ '+co+' MB > '+CFG.coToiDaMB+' MB</span>',ly:'Vượt cỡ tối đa một tệp '+CFG.coToiDaMB+' MB (⚙ Cấu hình)'};
 if(co>O_CHUNG.tranTepMB) return {ok:false,nhan:'<span class="st2 r">⛔ vượt trần hệ thống</span>',ly:'Vượt trần cỡ một tệp toàn hệ thống '+O_CHUNG.tranTepMB+' MB (⚙ M10.11)'};
 if(co/1024>oConGB()) return {ok:false,nhan:'<span class="st2 r">⛔ ổ của trường không đủ chỗ</span>',ly:'Ổ chung của trường còn '+mb(oConGB()*1024)+' — báo Quản trị hệ thống giải phóng bớt (M10.11). Kho M6.12 không có hạn mức riêng.'};
 if(!trung) return {ok:true,nhan:'<span class="st2 o">tệp mới</span>'};
 /* phiên bản mới là SỬA tệp đã có ⇒ cần S trên chính tệp đó. Không có (bộ lọc «của tôi», tệp người khác) thì giữ cả hai. */
 if(!coGhi('S',trung.pb[0].boi,f.id)){
  const ten2=u.ten.trim().replace(/(\.[^.]+)?$/,' (2)$1');
  return {ok:true,nhan:'<span class="st2 w">tệp mới «'+esc(ten2)+'»</span>',ten2,ly2:'Trùng tên tệp của '+tenNS(trung.pb[0].boi)+' — bạn không có quyền sửa tệp đó nên tạo tệp riêng «'+ten2+'»'};
 }
 return {ok:true,nhan:'<span class="st2 b">phiên bản mới v'+(hienHanh(trung).v+1)+'</span>',trung};
}
mfns.bup=()=>{
 const f=fdById(ST.fd), gc=$('#upGc').value.trim(), kq=[];
 UP.filter(u=>u.chon).forEach(u=>{
  const k=duKien(f,u);
  if(!k.ok){kq.push({ten:u.ten,ok:false,ly:k.ly});return}
  const p=V(0,+u.co,ME().id,BAYGIO(),gc);
  if(k.trung){p.v=hienHanh(k.trung).v+1;k.trung.pb.push(p);if(u.dl)k.trung.dlcn=true;
   ghiVet({t:'up',te:k.trung.id,nd:'Tải lên phiên bản v'+p.v+(gc?' — '+gc:'')});kq.push({ten:u.ten,ok:true,ly:'Phiên bản mới v'+p.v+' — bản cũ giữ lại'})}
  else{p.v=1;const t={id:moiId('t'),fd:f.id,ten:k.ten2||u.ten.trim(),dlcn:u.dl,pb:[p]};TE.push(t);ghiVet({t:'up',te:t.id,nd:'Tải lên tệp mới'+(u.dl?' — đánh dấu có dữ liệu cá nhân':'')});kq.push({ten:u.ten,ok:true,ly:k.ly2||'Tệp mới'})}
 });
 if(!kq.length){toast('Chưa chọn tệp nào.');return}
 const ok=kq.filter(x=>x.ok).length;
 modal('Kết quả tải lên — «'+esc(f.ten)+'»',
  '<div class="'+(ok===kq.length?'okbox':'warn')+'"><b>'+ok+'</b> tệp tải lên · <b>'+(kq.length-ok)+'</b> tệp bị bỏ qua.</div>'
  +'<table><thead><tr><th>Tệp</th><th>Kết quả</th><th>Chi tiết</th></tr></thead><tbody>'
  +kq.map(x=>'<tr class="'+(x.ok?'okrow':'badrow')+'"><td>'+esc(x.ten)+'</td><td>'+(x.ok?'✓ thành công':'✗ bỏ qua')+'</td><td>'+esc(x.ly)+'</td></tr>').join('')+'</tbody></table>',
  '<button class="btn p" data-mb="close">Đóng</button>');
 render();
};

/* ══════════════ TAB 2 · THÙNG RÁC — đơn vị dòng: MỘT LƯỢT XÓA (folder kéo theo cả cụm) ══════════════
   Bản ghi không xóa: xóa = vào đây; xóa vĩnh viễn = hủy NỘI DUNG, dòng vết ở lại chip «✕ Đã xóa vĩnh viễn». */
function loRac(){
 const ds=[];
 FD.filter(f=>f.xoa&&!f.xoa.theo).forEach(f=>{
  const ids=[f.id,...hauDue(f.id).filter(x=>x.xoa&&x.xoa.lo===f.xoa.lo).map(x=>x.id)];
  const ts=TE.filter(t=>t.xoa&&t.xoa.lo===f.xoa.lo);
  ds.push({lo:f.xoa.lo,loai:'folder',x:f,soFd:ids.length-1,soTe:ts.length,co:ts.reduce((s,t)=>s+t.pb.reduce((a,p)=>a+p.co,0),0),
   goc:f.cha,boi:f.xoa.boi,ngay:f.xoa.ngay,lyDo:f.xoa.lyDo||'',thayDuoc:thayF(ME(),f).ok});

 let x;
 /* bộ khai điều kiện trong hộp thoại */
 if((x=g('data-dkd'))){if(x.disabled)return;const d=x.dataset.dkd,v=x.dataset.dkv;DKT[d]=DKT[d].includes(v)?DKT[d].filter(y=>y!==v):DKT[d].concat(v);capNhatDK();return}
 if(g('data-upadd')){UP.push({ten:'',co:0.5,dl:false,chon:true});veUp(fdById(ST.fd),false);return}
 /* kho */
 if((x=g('data-tg'))){ST.moRong[x.dataset.tg]=!ST.moRong[x.dataset.tg];render();return}
 if((x=g('data-xem'))){moXem(teById(x.dataset.xem),x.dataset.v);return}
 if((x=g('data-tai'))){moTai(teById(x.dataset.tai),x.dataset.v);return}
 if((x=g('data-lk'))){const k=teById(x.dataset.lk);ghiVet({t:'xem',te:k.id,nd:'Mở liên kết sang '+k.lk.menu});
  toast('↗ Mở <b>'+esc(k.lk.ma)+'</b> ở '+k.lk.menu+' — '+k.lk.menu+' tự kiểm quyền của bạn (kể cả che cột MẬT).');
  setTimeout(()=>{location.href='M6.9-Van-thu-Cong-van.html?ctx='+encodeURIComponent(k.lk.ma)+'&return=M6.12-Tai-lieu-luu-tru&vai='+role},900);return}
 if((x=g('data-khoiv'))){khoiPhucBan(teById(ST.cur),x.dataset.khoiv);return}
 if(g('data-close')){ST.cur=null;render();return}
 if((x=g('data-tb'))){const f=fdById(ST.fd);({taoF:moTaoF,up:()=>moUp(),taiF:moTaiF,dk:moDK,doiTenF:()=>moDoiTen('f',f),mvF:()=>moMv('f',f),
  xoaF:moXoaF,ai:moAiThay,nk:moNhatKy})[x.dataset.tb]();return}
 if((x=g('data-act'))){const te=teById(ST.cur);({pbMoi:()=>moUp(te.ten),doiTenT:()=>moDoiTen('t',te),mvT:()=>moMv('t',te),xoaT:()=>moXoaT(te)})[x.dataset.act]();return}
 if((x=g('data-x'))){ST[x.dataset.x]=false;render();return}
 if((x=g('data-te'))&&!t.closest('button')){ST.cur=ST.cur===x.dataset.te?null:x.dataset.te;render();return}
 if((x=g('data-fd'))&&!t.closest('button')){const id=x.dataset.fd||null;ST.fd=id;ST.cur=null;ST.q='';if(id)ST.moRong[id]=true;render();return}
 /* thùng rác */
 if((x=g('data-rl'))){ST.racLoc=x.dataset.rl;render();return}
 if((x=g('data-kp'))){khoiPhucLo(x.dataset.kp);return}
 if((x=g('data-huy'))){moHuy(x.dataset.huy);return}
 /* cấu hình */
 if((x=g('data-cl'))){if(x.disabled)return;const v=x.dataset.cl;CFGT.loai=CFGT.loai.includes(v)?CFGT.loai.filter(y=>y!==v):CFGT.loai.concat(v);render();return}
 if(g('data-boch')){CFGT=null;render();toast('Đã hoàn tác thay đổi chưa lưu.');return}
 if(g('data-luuch')){luuCH();return}
}
function luuCH(){
 const co=+CFGT.coToiDaMB;
 if(!(co>0)){toast('⛔ Giá trị không hợp lệ — cỡ tối đa một tệp phải là số dương.');return}
 if(co>O_CHUNG.tranTepMB){toast('⛔ Cỡ một tệp tối đa <b>'+O_CHUNG.tranTepMB+' MB</b> — đó là trần toàn hệ thống, đặt ở ⚙ M10.11. Menu con chỉ được đặt nhỏ hơn.');return}
 const cu=JSON.stringify(CFG);Object.assign(CFG,{coToiDaMB:co,loai:CFGT.loai.slice()});
 ghiVet({t:'dk',nd:'Đổi cấu hình kho: '+cu+' → '+JSON.stringify(CFG)});CFGT=null;toast('✓ Đã lưu cấu hình — áp ngay cho lượt tải lên kế tiếp.');render();
}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.cf!==undefined&&CFGT){CFGT[t.dataset.cf]=t.value;return}
 const i=t.dataset.upt!==undefined?t.dataset.upt:t.dataset.upz;
 if(i!==undefined){const u=UP[+i];if(t.dataset.upt!==undefined)u.ten=t.value;else u.co=t.value;const k=$('#upk'+i);if(k)k.innerHTML=duKien(fdById(ST.fd),u).nhan}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.upc!==undefined){UP[+t.dataset.upc].chon=t.checked;return}
 if(t.dataset.upd!==undefined){UP[+t.dataset.upd].dl=t.checked;return}
});
/* deep-link D3: ?fd=<folder>&tab=kho|rac|ch&return=<menu>&vai=… — folder không hiện với vai thì KHÔNG nói nó có tồn tại */
(function moTuLienKet(){
 if(['kho','rac','bc','ch'].includes(QS.get('tab'))) ST.tab=QS.get('tab');
 if(QS.get('return')) ST.ret=QS.get('return');
 const id=QS.get('fd');
 if(id){const f=fdById(id);if(f&&!f.xoa&&thay(f)){ST.fd=id;chuoiCha(f).forEach(x=>ST.moRong[x.id]=true)}else ST.anDL=true}
})();
render();

/* deep-link trong chính `M6.12` — mở đúng tab, đúng folder */
function bcLTNhay(q) {
  var p = {};
  (q || '').split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  if (p.tab) ST.tab = p.tab;
  ST.cur = null;
  if (p.fd) { ST.fd = p.fd; ST.moRong[p.fd] = true }
  render();
  toast('↗ Đã mở <b>' + esc(p.fd ? (fdById(p.fd) || {}).ten || 'folder' : 'danh sách')
    + '</b> — cùng bộ lọc với ô số bạn vừa bấm.');
}
