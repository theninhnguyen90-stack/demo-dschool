<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.12 Tài liệu lưu trữ — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.cell{width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;text-align:right;font:inherit;font-size:12.5px}
.cell:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:6px;border-radius:1px;display:block}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- phan duoi chep tu khung chung (M6.17) --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.mini{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:12px}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}

/* --- rieng M6.12 Tai lieu luu tru --- */
.mu{color:var(--ink3)}
.qwrap{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.qc{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:#f1f5f9;color:#cbd5e1;border:1px solid var(--line)}

.qc.vh{border-style:dashed}
.qc i{font-style:normal;font-weight:600;font-size:9px;color:var(--amber)}

.drive{display:grid;grid-template-columns:262px 1fr;gap:13px;margin-top:12px;align-items:start}
@media(max-width:900px){.drive{grid-template-columns:1fr}}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 4px;position:sticky;top:66px;max-height:calc(100vh - 80px);overflow-y:auto;min-height:280px}
.tn{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--ink2)}

.tn.on{background:var(--brand-soft);color:var(--brand);font-weight:600}

.tgi{font-size:9.5px;flex:0 0 auto}

.tgi.r{color:var(--red);font-weight:700}
.tleg{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--ink3);padding:9px 10px 4px;border-top:1px solid var(--line);margin-top:8px}

.dmain{min-width:0}
.dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bc{display:flex;align-items:center;gap:5px;font-size:13px;flex-wrap:wrap}
.bc a{color:var(--brand);cursor:pointer;font-weight:600}
.bc a:hover{text-decoration:underline}
.sepc{color:var(--ink3)}
.quota{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2)}
.quota .qb{width:110px;height:6px;border-radius:4px;background:var(--line);overflow:hidden;display:inline-block}
.quota .qb i{display:block;height:100%;background:var(--brand)}
.quota.w .qb i{background:var(--amber)}
.qbig{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.qbig i{display:block;height:100%;background:var(--brand)}
.qbig.w i{background:var(--amber)}

.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:10px}
.fch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fnm{font-weight:700;font-size:15px}
.fdk{margin-top:8px;font-size:12.5px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:7px 10px;line-height:1.7}

.ft{width:100%;border-collapse:collapse;font-size:13px}
.ft td{padding:8px 10px}
.ft tr.rw{cursor:pointer}
.ft tr.rw:hover{background:var(--brand-soft)}
.ft tr.rw.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.ft .ico{display:inline-block;width:22px}
.ft .acts{white-space:nowrap;text-align:right}
.ft .dks{font-size:11.5px;color:var(--ink2);max-width:260px}
.stage.open .ft .hcol,.stage.open th.hcol{display:none}
.sumline{font-size:12px;color:var(--ink2);padding:9px 12px;border-bottom:1px solid var(--line);background:#f8fafc}

.dkwrap{display:grid;grid-template-columns:1fr 250px;gap:14px;margin-top:6px}
@media(max-width:760px){.dkwrap{grid-template-columns:1fr}}
.dkrow{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.dkl{font-weight:700;font-size:12.5px}
.dkc{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dkchip{cursor:pointer}
.dkchip.kh{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.dkchip.bad{background:var(--red);border-color:var(--red)}
.dkside{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px;align-self:start;position:sticky;top:0}
.dkcount .big{font-size:30px;font-weight:800;color:var(--brand);line-height:1.1}
.dkcount .big span{font-size:12px;font-weight:600;color:var(--ink2);margin-left:6px}

.kiem{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gt{margin-top:6px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 11px;font-size:12.5px}
.gtl{margin-bottom:7px}
.gtn{display:inline-block;font-weight:700;font-size:11.5px;color:var(--ink2);margin-right:8px}
.gtt{margin-top:5px;font-size:12px}
.gtt td{padding:4px 7px}
.gt .ok{color:var(--green);font-weight:600}
.gt .no{color:var(--red)}
.gtk{border-top:1px solid var(--line);padding-top:7px;font-size:13px}

.uptab td{padding:5px 6px}
.viewer{background:#e2e8f0;border-radius:10px;padding:18px;display:flex;justify-content:center;min-height:300px}
.pg{background:#fff;width:420px;max-width:100%;padding:28px 34px;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:3px}
.pgh{font-size:10.5px;font-weight:700;text-align:center;color:var(--ink2)}
.pgt{font-size:14px;font-weight:700;text-align:center;margin:14px 0 18px;text-transform:uppercase}
.pg i{display:block;height:7px;background:#e2e8f0;border-radius:3px;margin-bottom:9px}
.pg i:nth-child(3n){width:78%}
.pg i:nth-child(5n){width:60%}
.xls{background:#fff;border-collapse:collapse;font-size:11.5px;width:100%;max-width:520px;align-self:flex-start}
.xls td{border:1px solid #cbd5e1;padding:5px 8px;min-width:50px}
.xls tr:first-child td{background:#f1f5f9;font-weight:700}
.xls i{display:block;height:6px;background:#e2e8f0;border-radius:3px}
.img{font-size:90px;align-self:center}
.chgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:900px){.chgrid{grid-template-columns:1fr}}

/* ══════════════════════════════════════════════════════════════════════════
   CSS CỦA BỐN TAB BÁO CÁO ĐẶT TẠI MENU CHỦ — `BCM9-3C` (20/9/2026)

   Trích từ `demo-src/M9.13-Bao-cao-CSVC-thiet-bi/style.css` (phần của nhóm 📊:
   dải giải thích · PV · KB · panel drill-down · XU), rồi ĐÓNG KHUNG mọi bộ chọn
   dưới `body.bc9`.

   Vì sao phải đóng khung — không phải để cho đẹp:
   menu chủ đã có sẵn `.ro` `.dnote` `.empty` `.toast` `.badrow` `.tbx` `.big`
   của riêng nó. Dán thẳng CSS của nhóm 📊 vào thì sáu tab cũ của `M6.9`, ba tab
   của `M6.12`, bốn tab của `M8.1`, hai tab của `M8.4` ĐỔI HÌNH mà không ai đụng
   vào chúng — đúng thứ prompt `3C` §1 cấm ("tab cũ giữ nguyên từng dòng").
   `body.bc9` chỉ được gắn khi tab báo cáo đang mở.

   Hai bộ chọn KHÔNG đóng khung, cố ý: panel `#kbMask` và hộp xuất `#xuMask` do
   tệp nền tự tạo và gắn thẳng vào `<body>`, nên chúng sống lâu hơn tab. Rời tab
   báo cáo là lớp `bc9` mất — nếu quy tắc ẩn cũng đóng khung theo thì hai nút đó
   thành hai khối trần hiện giữa màn hình của tab khác.
   ══════════════════════════════════════════════════════════════════════════ */
#kbMask,#xuMask{display:none}

/* ─────────── dải giải thích: giữ NGẮN, đếm vào 20% của nh9 §9.1 ─────────── */

body.bc9 .canh{padding:8px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin:9px 0;display:block}

body.bc9 .canh.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}

body.bc9 .canh.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}

body.bc9 .canh.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}

body.bc9 .ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:7px 11px;border-radius:9px;font-size:11.5px;margin:8px 0;line-height:1.55}

body.bc9 .dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin:9px 0}

body.bc9 .empty{padding:30px;text-align:center;color:var(--ink3);font-size:12.5px}

body.bc9 .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:90;transition:transform .22s;max-width:92vw;line-height:1.55}

body.bc9 .toast.on{transform:translateX(-50%)}

body.bc9 .toast code{background:#1e293b;color:#e2e8f0}
/* ═══════════ PV — phạm vi và thời gian ═══════════ */

body.bc9 .pvbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px 0}

body.bc9 .pvlb{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}

body.bc9 .pvd{border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12.5px;background:#fff}

body.bc9 .pvthu{font-size:11.5px;color:var(--ink3)}

body.bc9 .pvsep{color:var(--ink3)}

body.bc9 .pvky{display:flex;gap:4px;flex-wrap:wrap;margin-left:6px}

body.bc9 .pvk{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--ink2)}

body.bc9 .pvk:hover{background:var(--bg)}

body.bc9 .pvk.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

body.bc9 .pvk.cam{opacity:.42;cursor:not-allowed;border-style:dashed}

body.bc9 .pvk i{font-style:normal;color:var(--ink3);font-size:10.5px}

body.bc9 .pvk.on i{color:#dbeafe}

body.bc9 .pvcut{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--ink2);margin:8px 0}

body.bc9 .pvcut i{color:var(--ink3);font-size:11.5px}

body.bc9 .pvmau{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:6px 0 2px}

body.bc9 .pvm{border:1px dashed var(--line2);background:#fff;border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--ink2)}

body.bc9 .pvm.on{background:#eef2ff;border-color:#818cf8;border-style:solid;color:#3730a3;font-weight:700}

body.bc9 .pvm.x{color:var(--red);border-color:#fecaca}

body.bc9 .pvmc{font-size:11px;color:var(--ink3);margin-left:6px}

body.bc9 .pvcach{font-size:11.5px;color:var(--ink3);margin:14px 0 0;border-top:1px dashed var(--line2);padding-top:10px}
/* ═══════════ KB — bảng ═══════════ */

body.bc9 .bg{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0}

body.bc9 .bgh{display:flex;align-items:center;gap:9px;padding:10px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}

body.bc9 .bgky{font-size:11.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px}

body.bc9 .bgma{font-size:10.5px;font-weight:700;color:var(--violet);background:#f5f3ff;border:1px solid #ddd6fe;border-radius:5px;padding:1px 6px}

body.bc9 .lschip{font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px;white-space:nowrap}

body.bc9 .lschip.ton{background:#e0e7ff;color:#3730a3}

body.bc9 .lschip.ps{background:#fef3c7;color:#92400e}

body.bc9 .lschip.dx{background:#ecfdf5;color:#065f46}

body.bc9 .tbx{overflow-x:auto}

body.bc9 .bgt{width:100%;border-collapse:collapse;font-size:12.5px}

body.bc9 .bgt th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#fbfdff;white-space:nowrap;vertical-align:bottom}

body.bc9 .bgt th i{display:block;font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink3);font-size:9.5px}

body.bc9 .bgt td{padding:5px 9px;border-bottom:1px solid #f1f5f9;vertical-align:middle}

body.bc9 .bgt td.num, body.bc9 .bgt th.num{text-align:right;font-variant-numeric:tabular-nums}

body.bc9 .bgt tr:last-child td{border-bottom:none}

body.bc9 .dphu{display:block;font-size:10.5px;color:var(--ink3);font-weight:400}

body.bc9 .nhomrow td{background:#f1f5f9;font-size:10.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;padding:4px 9px}

body.bc9 .tongrow td{background:#f8fafc;font-weight:700;border-top:2px solid var(--line2)}

body.bc9 .tongtru{display:block;font-size:9.5px;font-weight:400;color:var(--amber)}

body.bc9 .dongmo td{opacity:.55}

body.bc9 .badrow td{background:var(--red-soft)}

body.bc9 .bgt.so td{font-size:12px}

body.bc9 .bgid{font-size:10.5px;color:var(--ink3);white-space:nowrap;width:70px}


body.bc9 .oso{border:1px solid transparent;border-radius:6px;padding:2px 7px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:underline dotted var(--line2) 1px;text-underline-offset:3px}

body.bc9 .oso:hover{background:var(--brand-soft);border-color:#bfdbfe;color:var(--brand)}

body.bc9 .oso.odx{color:#065f46}

body.bc9 .oso.ochieu{color:var(--ink2);text-decoration-style:dashed}

body.bc9 .oso.ochieu:hover{color:var(--brand)}

body.bc9 .oso.oxau{color:var(--red)}

body.bc9 .oso.ocb{font-size:10.5px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-color:#fde68a;text-decoration:none}

body.bc9 .oro{color:var(--ink3)}

body.bc9 .noacc{font-size:10.5px;font-weight:700;color:var(--ink3);background:#f1f5f9;border:1px dashed var(--line2);border-radius:6px;padding:2px 7px;display:inline-block}

body.bc9 .noaccbox{padding:12px 14px;background:#f8fafc;border-top:1px dashed var(--line2);font-size:12.5px;line-height:1.65;color:var(--ink2)}

body.bc9 .noaccbox.big{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 22px;margin-top:14px;font-size:13.5px}

body.bc9 .k3sep{font-size:11.5px;color:var(--ink2);background:#fffbeb;border:1px dashed #fbbf24;border-radius:8px;padding:7px 11px;margin:4px 0}

body.bc9 .bvdl{font-size:12px;color:#991b1b;background:var(--red-soft);border:1px solid #fecaca;border-radius:9px;padding:8px 11px;margin:9px 0;line-height:1.6}

body.bc9 .k8h{font-size:16px;font-weight:700;margin:12px 0 6px}

body.bc9 .k8m{margin:10px 0}

body.bc9 .k8nx{font-size:12.5px;line-height:1.7;color:var(--ink2)}
/* khối chữ ký + bản chiếu */

body.bc9 .ky{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0}

body.bc9 .kyh{font-size:13px;font-weight:700;margin-bottom:9px}

body.bc9 .kyds{display:flex;gap:16px;flex-wrap:wrap}

body.bc9 .kyo{font-size:12px;color:var(--ink2);min-width:200px}

body.bc9 .kyl{display:block;border-bottom:1px dotted var(--line2);height:26px;margin-bottom:3px}

body.bc9 .kytt{margin-top:10px;font-size:12.5px}

body.bc9 .kyro{margin-top:9px;font-size:11.5px;color:var(--ink3);line-height:1.55;border-top:1px dashed var(--line);padding-top:8px}

body.bc9 .chieu{border-style:dashed}

body.bc9 .chieuro{padding:9px 13px;font-size:11.5px;color:var(--ink2);background:#f8fafc;border-top:1px dashed var(--line2);line-height:1.6}
/* ═══════════ KB — panel drill-down ═══════════ */

body.bc9 .kbmask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:none;justify-content:flex-end}

body.bc9 .kbmask.on{display:flex}

body.bc9 .kbpanel{background:#fff;width:640px;max-width:96vw;height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(15,23,42,.18)}

body.bc9 .kbh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-size:14px;flex-wrap:wrap}

body.bc9 .kbdong{color:var(--ink2);font-weight:600}

body.bc9 .kbx{font-size:16px;color:var(--ink3);width:30px;height:30px;border-radius:8px}

body.bc9 .kbx:hover{background:var(--bg);color:var(--ink)}

body.bc9 .kbb{padding:14px 16px;overflow-y:auto;flex:1}

body.bc9 .kbso{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:10px}

body.bc9 .kbso i{font-size:12px;font-weight:400;color:var(--ink3);font-style:normal}

body.bc9 .kbcb{font-size:14px;color:var(--amber);font-weight:600}

body.bc9 .kbps{display:flex;align-items:center;gap:12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:10px}

body.bc9 .kbpsl{flex:1}

body.bc9 .kbpsl span{display:block;font-size:11px;color:var(--ink3)}

body.bc9 .kbpsl b{font-size:16px;font-variant-numeric:tabular-nums}

body.bc9 .kbpsc{font-size:11px;color:var(--ink3)}

body.bc9 .kbgc{font-size:12px;color:var(--ink2);background:var(--brand-soft);border:1px solid #bfdbfe;border-radius:8px;padding:7px 11px;margin-bottom:10px;line-height:1.6}

body.bc9 .kbqt{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}

body.bc9 .kbqth{background:#f8fafc;padding:7px 12px;font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}

body.bc9 .kbqtv, body.bc9 .kbqtx{padding:9px 12px;font-size:12px;line-height:1.6}

body.bc9 .kbqtv{background:#f6fefb}

body.bc9 .kbqtx{background:#fffafa;border-top:1px solid var(--line)}

body.bc9 .kbqtv b{color:var(--green)}

body.bc9 .kbqtx b{color:var(--red)}

body.bc9 .kbqtv ul, body.bc9 .kbqtx ul{margin:4px 0 0 17px}

body.bc9 .kbqtv li, body.bc9 .kbqtx li{margin-bottom:3px;color:var(--ink2)}

body.bc9 .kbcc{padding:7px 12px;font-size:11.5px;color:#92400e;background:var(--amber-soft);border-top:1px solid var(--line)}

body.bc9 .kbng{padding:7px 12px;font-size:11px;color:var(--ink3);border-top:1px solid var(--line);background:#fbfdff}

body.bc9 .kbbg{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}

body.bc9 .kblk{display:flex;flex-direction:column;gap:6px;padding-bottom:20px}

body.bc9 .kblkc{font-size:11px;color:var(--ink3);line-height:1.55}
/* ═══════════ XU — xuất hai mức ═══════════ */

body.bc9 .xunut{display:inline-flex;gap:7px;flex-wrap:wrap}

body.bc9 .xu1{background:#fff;border-color:var(--line2)}

body.bc9 .xu2{background:#fff5f5;border-color:#fecaca;color:#991b1b;font-weight:600}

body.bc9 .xu2 i{font-style:normal;font-weight:400;font-size:11px}

body.bc9 .xu2:hover{background:#fee2e2}

body.bc9 .xumask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:none;place-items:center}

body.bc9 .xumask.on{display:grid}

body.bc9 .xumodal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}

body.bc9 .xuh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:9px}

body.bc9 .xub{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}

body.bc9 .xuf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

body.bc9 .xtag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.04em}

/* ─────────────────── ③ TỪ ĐIỂN CHỈ TIÊU — bộ máy ─────────────────── */
const CT = (function () {
  const D = {};                                          /* mã → khai báo */

  /* ── khai một chỉ tiêu ──────────────────────────────────────────────
     {ma, ten, donVi, loaiSo:'TON'|'PS'|'DAN_XUAT', nguon:['M6.4'],
      chieuHopLe:[…], moc:'yyyy-mm-dd',
      quyTacDem:{tinhVao:[…tiếng Việt…], khongTinh:[…tiếng Việt…]},
      canCu:'…' (tùy chọn — văn bản pháp lý),
      oPhu:{ <khóa ô>: {ten, loaiSo, donVi, moc, quyTacDem} }  (tùy chọn)}

     ★ `oPhu` — vì sao có. Một BẢNG có nhiều cột mà cả bảng chỉ mang MỘT mã
     chỉ tiêu: `CS.05 Tỉ lệ khai thác` bày ra bốn cột (lượt mượn · tiết sử dụng ·
     tỉ lệ · lượt bị từ chối vì trùng). Nguyên tắc số 1 đòi MỌI ô bấm được và
     MỌI ô có quy tắc đếm riêng — nên từng ô con khai quy tắc của nó, thay vì
     đẻ thêm mã chỉ tiêu cho mỗi cột (mã chỉ tiêu là danh mục của cả hệ thống,
     không phải tên cột của một bảng).
     Ô con cũng có `moc` RIÊNG được: sổ mượn phòng bắt đầu chạy sau thời khóa
     biểu, nên «lượt mượn» chưa có dữ liệu trong quãng mà «tiết sử dụng» đã có. */
  function khai(o) {
    if (!o || !o.ma) throw new Error('CT.khai: thiếu mã');
    if (D[o.ma]) throw new Error('CT.khai: mã ' + o.ma + ' đã khai — không khai đè');
    if (!o.quyTacDem || !o.quyTacDem.tinhVao) throw new Error('CT.khai: ' + o.ma + ' thiếu quyTacDem.tinhVao');
    D[o.ma] = Object.assign({ chieuHopLe: [], nguon: [], oPhu: {} }, o, { tinh: null });
    return D[o.ma];
  }

  /* nối phần TÍNH — `app.20` của từng demo gọi, một lần cho mỗi mã.
     fn(thamSo, oPhu) → {giaTri, banGhiGoc:[…], ghiChu} */
  function nguonSo(ma, fn) {
    if (!D[ma]) throw new Error('CT.nguonSo: chưa khai mã ' + ma);
    D[ma].tinh = fn;
  }

  const co = ma => !!D[ma];
  const khaiBao = ma => D[ma] || null;
  const danhSach = () => Object.keys(D).sort();
  const ten = ma => (D[ma] || {}).ten || ma;

  /* chiều hợp lệ — bộ chọn phải hỏi hàm này TRƯỚC khi bày một chiều ra */
  const chieuOK = (ma, chieu) => !!D[ma] && D[ma].chieuHopLe.indexOf(chieu) >= 0;
  const chieuCua = ma => (D[ma] || { chieuHopLe: [] }).chieuHopLe.slice();

  /* mốc dữ liệu sớm nhất của một ô (ô con có mốc riêng thì lấy của ô con) */
  function mocCua(ma, o) {
    const d = D[ma]; if (!d) return null;
    if (o && d.oPhu[o] && d.oPhu[o].moc) return d.oPhu[o].moc;
    return d.moc || null;
  }

  /* ★ «CHƯA CÓ DỮ LIỆU» ≠ 0 ────────────────────────────────────────────
     Một báo cáo ghi 0 cho quãng nhà trường chưa dùng phần mềm là NÓI SAI VỀ
     NHÀ TRƯỜNG: người đọc hiểu là «kỳ đó không có việc gì xảy ra», trong khi
     sự thật là «hệ thống không biết». Hai câu đó khác nhau, và chỉ câu thứ hai
     là đúng. Nên ô ghi «dữ liệu có từ …», không ghi 0. */
  function thieuDuLieu(moc, tham) {
    if (!moc) return null;
    const dau = tham.cheDo === 'chot' ? tham.chotNgay : tham.tuNgay;
    if (!dau || dau >= moc) return null;
    return { ma: 'CHUA_CO_DU_LIEU', moc, chu: 'dữ liệu có từ ' + k2s(moc) };
  }

  /* ── CỔNG DUY NHẤT để một tab lấy một con số ────────────────────────
     CT.doc(ma, {cheDo, chotNgay, tuNgay, denNgay, phamVi, phanTo, loc}, oPhu?)
     → {ma, o, ten, giaTri, donVi, loaiSo, quyTacDem, nguon, chieuHopLe,
        banGhiGoc:[…], canhBao:null|{ma,chu}, ghiChu}                       */
  function doc(ma, tham, o) {
    const d = D[ma];
    if (!d) return loi(ma, o, 'KHONG_CO_MA', 'mã chỉ tiêu «' + ma + '» chưa có trong từ điển');
    const oKhai = o ? d.oPhu[o] : null;
    if (o && !oKhai) return loi(ma, o, 'KHONG_CO_O', 'mã ' + ma + ' không khai ô con «' + o + '»');
    tham = tham || {};
    if (tham.phanTo && !chieuOK(ma, tham.phanTo))
      return loi(ma, o, 'CHIEU_KHONG_HOP_LE',
        'không cắt được ' + ma + ' theo chiều «' + (CHIEU[tham.phanTo] || tham.phanTo) + '»');
    if (!d.tinh) return loi(ma, o, 'CHUA_NOI_NGUON',
      'mã ' + ma + ' đã khai nhưng app.20 chưa gọi CT.nguonSo()');

    const nen = {
      ma, o: o || null,
      ten: oKhai ? oKhai.ten : d.ten,
      donVi: (oKhai && oKhai.donVi) || d.donVi || '',
      loaiSo: (oKhai && oKhai.loaiSo) || d.loaiSo,
      quyTacDem: (oKhai && oKhai.quyTacDem) || d.quyTacDem,
      nguon: d.nguon.slice(), chieuHopLe: d.chieuHopLe.slice(),
      canCu: d.canCu || null
    };
    const thieu = thieuDuLieu(mocCua(ma, o), tham);
    if (thieu) return Object.assign(nen, { giaTri: null, banGhiGoc: [], canhBao: thieu });

    let kq;
    try { kq = d.tinh(tham, o) || {} }
    catch (e) { return loi(ma, o, 'LOI_TINH', String(e && e.message || e)) }
    return Object.assign(nen, {
      giaTri: kq.giaTri == null ? null : kq.giaTri,
      banGhiGoc: kq.banGhiGoc || [],
      ghiChu: kq.ghiChu || null,
      veTrai: kq.veTrai || null, vePhai: kq.vePhai || null,   /* ô dẫn xuất — hai vế của phân số */
      canhBao: kq.canhBao || null
    });
  }

  function loi(ma, o, maLoi, chu) {
    return {
      ma, o: o || null, ten: ten(ma), giaTri: null, donVi: '', loaiSo: 'TON',
      quyTacDem: { tinhVao: ['—'], khongTinh: ['—'] }, nguon: [], chieuHopLe: [],
      banGhiGoc: [], canhBao: { ma: maLoi, chu }
    };
  }

  return { khai, nguonSo, doc, co, khaiBao, danhSach, ten, chieuOK, chieuCua, mocCua, CHIEU };
})();

/* ══════════════════════════════════════════════════════════════════════════
   TỆP NỀN 2/4 CỦA NHÓM 📊 BÁO CÁO — `app.11-khuon-bang.js`  →  xuất ra `KB`
   Hợp đồng 🔒 HDBC · phiên `BCM9-0A` (20/9/2026)
   🔄 HDBC v2 · phiên `BCM9-V24` (21/9/2026) — CHỈ THÊM, mọi khai báo cũ chạy
      y như v1:
      · việc 2 — `dong[].nguonDong` · `dong[].linkDong`: một bảng lấy dòng từ
        nhiều menu nguồn thì MỖI DÒNG mang nguồn và deep-link của nó. Ưu tiên

      · việc 4 — cả bảng thiếu quyền nguồn ⇒ MỘT dải `.noaccbox` thay cho N ô
        `🔒 ẩn`. Tắt bằng `kb.daiKhoa: false` (trở về N ô như v1).
      · việc 3 (phần của `KB`) — dải BVDLCN của `K4` mang `data-kbk4`, để `XU`
        nhận ra đang đứng trên lưới có họ tên. Chữ không đổi.
      · chữ `title` của ô `🔒 ẩn` đọc «Xem (X)» thay «Xuất dữ liệu (XD)» — theo
        `CG-3` (21/9): cổng `N5` đọc `X` ở nguồn.

   🛑 CHÉP NGUYÊN BYTE sang mọi demo M9.x. Lệch một byte = DỪNG, báo người dùng.

   ── Việc của tệp này ─────────────────────────────────────────────────────
   Dựng CHÍN KHUÔN BIỂU MẪU `K1…K9` (tài liệu 18/9 §6) từ một khai báo, để một
   demo báo cáo chỉ phải viết «bảng này dòng là gì, cột là gì, ô lấy mã nào» —
   không vẽ lại bảng, không tự quyết cách bày chip, dòng Tổng, hay panel.

   ── Bốn thứ tệp này BẮT BUỘC mang, không tắt được ───────────────────────
   ① CHIP LOẠI SỐ cạnh tiêu đề bảng — TỒN (chốt tại ngày) / PHÁT SINH (từ → đến)
      / DẪN XUẤT. Loại số là một CHIP, không phải một đoạn văn (`nh9` §9.1).
   ② DÒNG TỔNG, và tổng NÓI RÕ đã trừ bao nhiêu ô vì thiếu quyền (`N5`).
   ③ `KB.drill()` — panel: danh sách bản ghi gốc + quy tắc đếm bằng tiếng Việt
      + deep-link về menu chủ. 🛑 KHÔNG Ô SỐ NÀO KHÔNG BẤM ĐƯỢC, kể cả ô dẫn
      xuất — ô dẫn xuất mở panel có HAI VẾ của phân số.
   ④ Khối `.noacc` — thiếu `XD` ở feature nguồn thì ô VẪN CHIẾM CHỖ và ghi rõ
      thiếu quyền gì trên menu nào. Ẩn mà im lặng là để người đọc tin vào một
      con số đã bị cắt mà không biết.

   ── Tệp nền tự dựng DOM của mình ────────────────────────────────────────
   Panel drill-down tự tạo node khi dùng lần đầu. `body.html` của từng demo
   KHÔNG phải khai gì cho `KB` — 16 demo không phải nhớ thêm một quy ước nào.
   ══════════════════════════════════════════════════════════════════════════ */

const KB = (function () {

  /* ── cổng quyền: `app.20` của từng demo nối vào ──────────────────────
     KB.quyenNguon(maFeature) → true nếu VAI ĐANG XEM có `XD` ở feature nguồn.
     KB.moTaNguon(maFeature)  → {menu:'M6.5', ten:'Lịch mượn phòng'}
     Chưa nối thì coi như có đủ quyền — để demo chưa khai quyền vẫn chạy. */
  let quyenNguon = () => true;
  let moTaNguon = ma => ({ menu: (ma || '').split('.')[0].toUpperCase().replace('M', 'M'), ten: ma });
  const noiQuyen = (fnQuyen, fnMoTa) => { if (fnQuyen) quyenNguon = fnQuyen; if (fnMoTa) moTaNguon = fnMoTa; };

  /* menu đang đứng — dùng cho `&return=` của mọi deep-link */
  let MENU_NAY = 'M9.x';
  const datMenu = m => { MENU_NAY = m };

  /* ── kho ô đã vẽ: khóa → {ket, cot, dong, kb} ───────────────────────── */
  const O = {};
  let seq = 0;

  /* ───────────────────────── chip loại số ───────────────────────────── */
  const TEN_LOAI = {
    TON: ['TỒN', 'đếm tại một thời điểm — Chốt tại ngày', 'ton'],
    PS: ['PHÁT SINH', 'đếm trong một khoảng — Từ → đến', 'ps'],
    DAN_XUAT: ['DẪN XUẤT', 'tính từ hai số khác — bấm vào ô để xem hai vế', 'dx']
  };
  function chip(loai) {
    const t = TEN_LOAI[loai] || TEN_LOAI.TON;
    return '<span class="lschip ' + t[2] + '" title="' + esc(t[1]) + '">' + t[0] + '</span>';
  }

  /* ───────────────────── định dạng một giá trị ──────────────────────── */
  function soRa(v, kieu) {
    if (v == null) return '—';
    if (kieu === 'tien') return trieu(v);
    if (kieu === 'nghin') return vn(Math.round(v / 1000));
    if (kieu === 'tile') return (Math.round(v * 10) / 10).toLocaleString('vi-VN') + '%';
    if (kieu === 'ngay') return (Math.round(v * 10) / 10).toLocaleString('vi-VN');
    if (kieu === 'chu') return esc(v);
    return vn(v);
  }

  /* ─────────────────────────── vẽ MỘT ô ──────────────────────────────
     Ba đường ra, theo đúng thứ tự ưu tiên:
       ① thiếu `XD` ở feature nguồn  → khối `.noacc`, ô vẫn chiếm chỗ
       ② chưa có dữ liệu cho quãng   → «dữ liệu có từ …», KHÔNG ghi 0
       ③ có số                        → nút bấm được                        */
  function veO(kb, dong, cot, ket) {
    /* v2 · việc 2 — nguồn THEO DÒNG đứng trước nguồn của cột và của bảng */
    const nguon = (dong && dong.nguonDong) || cot.nguon || (kb.nguon || null);
    if (nguon && !quyenNguon(nguon)) {
      const m = moTaNguon(nguon);
      return { html: '<span class="noacc" title="Thiếu quyền Xem (X) ở ' + esc(m.ten) + ' — ' + esc(m.menu) + '">🔒 ẩn</span>', tru: true, khoa: nguon };
    }
    if (!ket) return { html: '<span class="oro">—</span>', tru: false };
    if (ket.canhBao) {
      const cb = ket.canhBao;
      const k = 'o' + (++seq);
      O[k] = { ket, cot, dong, kb };
      const chu = cb.ma === 'CHUA_CO_DU_LIEU' ? cb.chu : cb.chu;
      return {
        html: '<button class="oso ocb" data-kbo="' + k + '">⚠ ' + esc(chu) + '</button>',
        tru: true, khongCo: true
      };
    }
    const k = 'o' + (++seq);
    O[k] = { ket, cot, dong, kb };
    const cls = 'oso' + (cot.kieu === 'tile' || ket.loaiSo === 'DAN_XUAT' ? ' odx' : '')
      + (cot.canhBao && cot.canhBao(ket, dong) ? ' oxau' : '');
    return { html: '<button class="' + cls + '" data-kbo="' + k + '">' + soRa(ket.giaTri, cot.kieu) + '</button>', tru: false };
  }

  /* ══════════════════════ LÕI — dựng một bảng ══════════════════════════
     kb = {khuon, tieuDe, ma, chip, moTaKy, ghiChuKy, cot:[…], dong:[…],
           o:(dong,cot)=>ket, tong:true|false, tongRieng:fn, gomNhom:bool,
           nguon:'m6.4.x', chuoiTrong:'…', duoiBang:'…html…'}              */
  function bang(kb) {
    const cot = kb.cot || [];
    const dong = kb.dong || [];
    const loai = kb.chip || (kb.ma && CT.khaiBao(kb.ma) ? CT.khaiBao(kb.ma).loaiSo : 'TON');
    let h = '<div class="bg" data-bg="' + esc(kb.id || '') + '">';

    /* đầu bảng — tiêu đề · chip loại số · nhãn kỳ */
    h += '<div class="bgh"><b>' + esc(kb.tieuDe || '') + '</b>' + chip(loai)
      + (kb.moTaKy ? '<span class="bgky">' + esc(kb.moTaKy) + '</span>' : '')
      + (kb.ma ? '<span class="bgma" title="' + esc(CT.ten(kb.ma)) + '">' + esc(kb.ma) + '</span>' : '')
      + '<span class="spacer"></span>' + (kb.nutPhai || '') + '</div>';

    if (!dong.length) {
      h += '<div class="empty">' + esc(kb.chuoiTrong || 'Không có dòng nào trong phạm vi đang xem.') + '</div></div>';
      return h;
    }

    const hDau = h.length;                 /* v2 · việc 4 — chỗ cắt nếu cả bảng bị khóa */
    let oKhoa = 0; const nguonKhoa = [];
    h += '<div class="tbx"><table class="bgt"><thead><tr><th>' + esc(kb.tenCotDau || 'Chỉ tiêu') + '</th>';
    cot.forEach(c => h += '<th class="num" title="' + esc(c.chuThich || '') + '">' + esc(c.ten)
      + (c.donVi ? '<i>' + esc(c.donVi) + '</i>' : '') + '</th>');
    h += '</tr></thead><tbody>';

    const tong = cot.map(() => ({ v: 0, co: false, tru: 0, khongCo: 0, gop: [], mau: null }));
    let nhomHienTai = null;

    dong.forEach(d => {
      if (kb.gomNhom && d.nhom && d.nhom !== nhomHienTai) {
        nhomHienTai = d.nhom;
        h += '<tr class="nhomrow"><td colspan="' + (cot.length + 1) + '">' + esc(d.nhom) + '</td></tr>';
      }
      h += '<tr' + (d.mo ? ' class="dongmo"' : '') + '>'
        + '<td>' + (d.bac ? '<span class="bac"></span>' : '') + '<b>' + esc(d.ten) + '</b>'
        + (d.phu ? '<span class="dphu">' + esc(d.phu) + '</span>' : '') + '</td>';
      cot.forEach((c, i) => {
        const ket = kb.o(d, c);
        const r = veO(kb, d, c, ket);
        h += '<td class="num">' + r.html + '</td>';
        if (r.khoa) { oKhoa++; if (nguonKhoa.indexOf(r.khoa) < 0) nguonKhoa.push(r.khoa); }
        if (r.tru) { tong[i].tru++; if (r.khongCo) tong[i].khongCo++; }
        else if (ket && ket.giaTri != null && c.kieu !== 'tile' && c.kieu !== 'ngay' && !c.khongCong) {
          tong[i].v += Number(ket.giaTri); tong[i].co = true;
          tong[i].mau = tong[i].mau || ket;
          tong[i].gop.push({ id: '', ten: d.ten, so: soRa(ket.giaTri, c.kieu) });
        }
      });
      h += '</tr>';
    });

    /* ── v2 · việc 4 — CẢ BẢNG thiếu quyền nguồn ⇒ MỘT dải thay cho N ô ────
       N ô `🔒 ẩn` lặp lại nói N lần cùng một câu, và dòng Tổng «đã trừ N dòng»
       thành một con số không còn gì để trừ. Một dải nói một lần: thiếu quyền
       gì, trên menu nào, và bảng có bao nhiêu dòng không hiện. Chỉ khi MỌI ô
       số của bảng đều bị khóa — khóa một phần thì vẫn là ô `🔒 ẩn` như v1.  */
    if (kb.daiKhoa !== false && cot.length && oKhoa === dong.length * cot.length) {
      h = h.slice(0, hDau) + '<div class="noaccbox kbdai">🔒 <b>Cả bảng bị ẩn</b> — vai đang xem không có quyền '
        + '<b>Xem (X)</b> ở ' + nguonKhoa.map(n => { const m = moTaNguon(n); return '<b>' + esc(m.ten) + ' — ' + esc(m.menu) + '</b>' }).join(' · ')
        + '. Bảng có <b>' + dong.length + ' dòng</b>, không hiện ở đây.</div>';
      if (kb.duoiBang) h += kb.duoiBang;
      return h + '</div>';
    }

    /* ── dòng Tổng — và NÓI RÕ đã trừ bao nhiêu (N5) ─────────────────── */
    if (kb.tong !== false) {
      h += '<tr class="tongrow"><td><b>' + esc(kb.tenTong || 'Tổng') + '</b></td>';
      cot.forEach((c, i) => {
        const t = tong[i];
        let o;
        if (kb.tongRieng && kb.tongRieng(c) != null) {
          const ket = kb.tongRieng(c);
          const r = veO(kb, { id: '_tong', ten: 'Tổng' }, c, ket);
          o = r.html;
        } else if (c.kieu === 'tile' || c.kieu === 'ngay' || c.khongCong) {
          o = '<span class="oro" title="Cột này không cộng dọc được — tỉ lệ và trung vị của cả bảng không phải tổng của các dòng">—</span>';
        } else if (t.co) {
          /* ★ Ô TỔNG CŨNG BẤM ĐƯỢC. Câu hỏi hay bị hỏi nhất về một bảng là
             «tổng này gồm những dòng nào», và nó chính là câu mà tổng phải trả
             lời được — nhất là khi tổng đã bị trừ bớt vì thiếu quyền (N5). */
          const ketT = Object.assign({}, t.mau, {
            ten: 'Tổng — ' + ((t.mau && t.mau.ten) || esc(c.ten)),
            giaTri: t.v, banGhiGoc: t.gop, veTrai: null, vePhai: null,
            ghiChu: 'Cộng <b>' + t.gop.length + ' dòng</b> của bảng'
              + (t.tru ? '; <b>đã trừ ' + t.tru + ' dòng</b> ('
                + (t.tru - t.khongCo ? (t.tru - t.khongCo) + ' thiếu quyền' : '')
                + (t.tru - t.khongCo && t.khongCo ? ' · ' : '')
                + (t.khongCo ? t.khongCo + ' chưa có dữ liệu' : '') + ')' : '') + '.'
          });
          o = veO(kb, { id: '_tong', ten: 'Tổng' }, Object.assign({}, c, { canhBao: null }), ketT).html;
        } else {
          o = '—';
        }
        const ghi = [];
        if (t.tru - t.khongCo > 0) ghi.push('đã trừ ' + (t.tru - t.khongCo) + ' dòng — thiếu quyền');
        if (t.khongCo > 0) ghi.push('đã trừ ' + t.khongCo + ' dòng — chưa có dữ liệu');
        h += '<td class="num">' + o + (ghi.length ? '<span class="tongtru">' + esc(ghi.join(' · ')) + '</span>' : '') + '</td>';
      });
      h += '</tr>';
    }
    h += '</tbody></table></div>';
    if (kb.duoiBang) h += kb.duoiBang;
    h += '</div>';
    return h;
  }

  /* ══════════════════════ CHÍN KHUÔN BIỂU MẪU ══════════════════════════
     Mỗi khuôn là một cách SẮP một bảng, không phải một bộ mã riêng. Chín
     khuôn phủ hết 81 báo cáo của tài liệu 18/9 — mẫu thứ mười chỉ tốn
     một dòng cấu hình (`N8`), không tốn một khuôn.                       */

  /* ── K1 · Bảng phân tổ MỘT chiều ─────────────────────────────────────
     Một chỉ tiêu, cắt theo một chiều. Dòng = giá trị của chiều;
     cột = Số lượng + Tỉ lệ + dòng Tổng.                                 */
  function K1(kb) {
    const tongSo = (kb.dong || []).reduce((a, d) => {
      const k = kb.oSo(d); return a + (k && k.giaTri != null ? Number(k.giaTri) : 0);
    }, 0);
    return bang(Object.assign({}, kb, {
      khuon: 'K1', tenCotDau: kb.tenCotDau || (CT.CHIEU[kb.chieu] || 'Chỉ tiêu'),
      cot: [
        { khoa: 'so', ten: 'Số lượng', donVi: kb.donVi || '', kieu: 'so', nguon: kb.nguon },
        { khoa: 'tl', ten: 'Tỉ lệ', kieu: 'tile', nguon: kb.nguon, khongCong: true }
      ],
      o: (d, c) => {
        const k = kb.oSo(d);
        if (c.khoa === 'so') return k;
        if (!k || k.giaTri == null) return k;
        return Object.assign({}, k, {
          ten: 'Tỉ lệ — ' + k.ten, loaiSo: 'DAN_XUAT', donVi: '%',
          giaTri: tile(Number(k.giaTri), tongSo),
          veTrai: { ten: k.ten + ' của dòng này', giaTri: Number(k.giaTri), donVi: kb.donVi || '' },
          vePhai: { ten: 'Tổng toàn bảng', giaTri: tongSo, donVi: kb.donVi || '' }
        });
      }
    }));
  }

  /* ── K2 · Bảng chéo HAI chiều ────────────────────────────────────────
     Dòng × cột, ô = số (và % nếu có mẫu số rõ). Gom nhóm Điểm trường →
     Khối → Lớp bằng `gomNhom:true` + `dong[].nhom`.                     */
  function K2(kb) { return bang(Object.assign({ gomNhom: true }, kb, { khuon: 'K2' })) }

  /* ── K3 · HAI KHỐI: TỒN + PHÁT SINH ──────────────────────────────────
     🛑 HAI BẢNG TÁCH HẲN, hai nhãn, hai bộ điều khiển thời gian.
     KHÔNG BAO GIỜ cộng chéo hai khối — đó là lỗi nghiệm thu, không phải
     chuyện thẩm mỹ: cộng một số tồn với một số phát sinh ra một con số
     không có nghĩa nào trong đời thật.                                   */
  function K3(kb) {
    return '<div class="k3">'
      + bang(Object.assign({}, kb.khoiTon, { khuon: 'K3', chip: 'TON' }))
      + '<div class="k3sep">🛑 Hai khối dưới đây <b>không cộng chéo</b> — khối trên đếm tại một thời điểm, khối dưới đếm trong một khoảng.</div>'
      + bang(Object.assign({}, kb.khoiPS, { khuon: 'K3', chip: 'PS' }))
      + '</div>';
  }

  /* ── K4 · Lưới người × ngày / danh sách chi tiết ──────────────────────
     Dòng = một người / một học sinh. Luôn kèm dải Luật BVDLCN 91/2025:
     bảng này có HỌ TÊN, nên xuất nó là xuất dữ liệu cá nhân.             */
  function K4(kb) {
    return '<div class="bvdl" data-kbk4="1">⚖ Bảng này có <b>họ tên</b> — xuất ra là <b>xuất dữ liệu cá nhân</b>. '
      + 'Nút <b>Danh sách chi tiết</b> bắt chọn mục đích, chọn trường, đóng dấu tệp và ghi audit '
      + '<i>(Luật BVDLCN 91/2025)</i>.</div>'
      + bang(Object.assign({ tong: false, tenCotDau: 'Họ và tên' }, kb, { khuon: 'K4' }));
  }

  /* ── K5 · Sổ / phiếu ─────────────────────────────────────────────────
     Một bản ghi một dòng, theo thời gian. Bắt buộc: SỐ HIỆU LIÊN TỤC,
     KHÔNG NHẢY SỐ — sổ nhảy số là sổ không dùng được làm căn cứ, nên
     khuôn tự dò và nói ra chỗ đứt.                                       */
  function K5(kb) {
    const ds = kb.banGhi || [];
    let canh = '';
    if (kb.kiemSoHieu !== false && ds.length > 1) {
      const so = ds.map(x => Number(String(x.so || '').replace(/\D/g, ''))).filter(n => !isNaN(n)).sort((a, b) => a - b);
      const dut = [];
      for (let i = 1; i < so.length; i++) if (so[i] - so[i - 1] > 1) dut.push(so[i - 1] + ' → ' + so[i]);
      if (dut.length) canh = '<div class="canh r">⚠ <b>Sổ nhảy số</b> ở ' + dut.length + ' chỗ: ' + esc(dut.join(' · '))
        + '. Sổ có số hiệu đứt quãng thì không dùng làm căn cứ được — kiểm lại ở menu chủ.</div>';
    }
    let h = '<div class="bg"><div class="bgh"><b>' + esc(kb.tieuDe || 'Sổ') + '</b>' + chip(kb.chip || 'PS')
      + (kb.moTaKy ? '<span class="bgky">' + esc(kb.moTaKy) + '</span>' : '') + '</div>' + canh;
    if (!ds.length) return h + '<div class="empty">' + esc(kb.chuoiTrong || 'Sổ chưa có dòng nào trong khoảng đang xem.') + '</div></div>';
    h += '<div class="tbx"><table class="bgt so"><thead><tr>'
      + (kb.cot || [{ khoa: 'so', ten: 'Số hiệu' }, { khoa: 'ngay', ten: 'Ngày' }, { khoa: 'noiDung', ten: 'Nội dung' },
      { khoa: 'nguoiLap', ten: 'Người lập' }, { khoa: 'nguoiKy', ten: 'Người ký' }, { khoa: 'tt', ten: 'Trạng thái' }])
        .map(c => '<th>' + esc(c.ten) + '</th>').join('') + '</tr></thead><tbody>';
    const cot = kb.cot || [{ khoa: 'so' }, { khoa: 'ngay' }, { khoa: 'noiDung' }, { khoa: 'nguoiLap' }, { khoa: 'nguoiKy' }, { khoa: 'tt' }];
    ds.forEach(x => {
      h += '<tr>' + cot.map(c => '<td>' + (c.ve ? c.ve(x) : esc(x[c.khoa] == null ? '—' : x[c.khoa])) + '</td>').join('') + '</tr>';
    });
    h += '</tbody></table></div>' + (kb.duoiBang || '') + '</div>';
    return h;
  }

  /* ── K6 · Biểu CỐ ĐỊNH (của Bộ hoặc của trường ban hành) ──────────────
     Loại A · C — cấu trúc KHÔNG ĐỔI ĐƯỢC. Mỗi ô của biểu phải ánh xạ tới
     một mã chỉ tiêu; ô CHƯA ánh xạ được thì NÊU ĐÍCH DANH, không để trống
     cho người đọc tự đoán. Kèm khối chữ ký + đóng dấu ngày chốt.         */
  function K6(kb) {
    let h = '<div class="k6">';
    (kb.khoi || []).forEach(kh => { h += bang(Object.assign({ khuon: 'K6' }, kh)) });
    const chua = (kb.oChuaAnhXa || []);
    if (chua.length) {
      h += '<div class="canh w"><b>' + chua.length + ' ô của biểu chưa ánh xạ được vào mã chỉ tiêu nào</b> — '
        + 'nêu đích danh ở đây thay vì để trống: ' + chua.map(x => '<b>' + esc(x.o) + '</b> <i>(' + esc(x.ly) + ')</i>').join(' · ')
        + '. Người ký phải biết mình đang ký một biểu còn ô do người điền tay.</div>';
    }
    if (kb.chuKy) h += kb.chuKy;
    h += '</div>';
    return h;
  }

  /* ── K7 · Tệp đối soát cho hệ thống ngoài ─────────────────────────────
     Cột do HỆ ĐÍCH quy định. Bắt buộc kèm BẢNG ĐỐI CHIẾU SỐ TỔNG hai
     chiều TRƯỚC khi tải — và không làm tròn: chênh một đồng vẫn là chênh. */
  function K7(kb) {
    let h = '<div class="k7"><div class="canh b">📤 Cột của bảng này do <b>' + esc(kb.heDich || 'hệ đích')
      + '</b> quy định — Dschool không đổi được. Đối chiếu số tổng trước khi tải.</div>';
    h += bang(Object.assign({ khuon: 'K7', tong: true }, kb));
    if (kb.doiChieu) {
      h += '<div class="bg"><div class="bgh"><b>Đối chiếu số tổng — hai chiều</b>' + chip('TON') + '</div><div class="tbx"><table class="bgt"><thead><tr>'
        + '<th>Chỉ tiêu đối chiếu</th><th class="num">Dschool</th><th class="num">' + esc(kb.heDich || 'Hệ đích') + '</th><th class="num">Chênh</th></tr></thead><tbody>';
      kb.doiChieu.forEach(r => {
        const ch = (r.a == null || r.b == null) ? null : r.a - r.b;
        h += '<tr' + (ch ? ' class="badrow"' : '') + '><td>' + esc(r.ten) + '</td><td class="num">' + vn(r.a)
          + '</td><td class="num">' + (r.b == null ? '—' : vn(r.b)) + '</td><td class="num">'
          + (ch == null ? '—' : (ch === 0 ? '0' : '<b>' + vn(ch) + '</b>')) + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }
    return h + '</div>';
  }

  /* ── K8 · Báo cáo VĂN BẢN (sơ kết · tổng kết · đột xuất) ──────────────
     Căn cứ → phần SỐ (nhúng K1/K2/K3) → nhận xét, phương hướng → chữ ký.
     🛑 Phần số SINH TỪ CHỈ TIÊU, không gõ tay: một báo cáo tổng kết có số
     gõ tay là một báo cáo không ai đối chiếu lại được.                    */
  function K8(kb) {
    let h = '<div class="k8"><div class="k8h">' + esc(kb.tieuDe || 'Báo cáo') + '</div>';
    if (kb.canCu) h += '<div class="k8m"><b>Căn cứ</b><ul>' + kb.canCu.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></div>';
    h += '<div class="k8m"><b>Phần số liệu</b> <i>— sinh từ từ điển chỉ tiêu, không gõ tay</i>' + (kb.phanSo || '') + '</div>';
    if (kb.nhanXet) h += '<div class="k8m"><b>Nhận xét và phương hướng</b><div class="k8nx">' + kb.nhanXet + '</div></div>';
    if (kb.chuKy) h += kb.chuKy;
    return h + '</div>';
  }

  /* ── K9 · Bảng TIẾN ĐỘ / TUÂN THỦ ────────────────────────────────────
     «Còn thiếu gì, ai chậm». Dòng = đối tượng phải làm; cột = mốc / trạng
     thái. 🛑 MỖI Ô HỎNG PHẢI BẤM ĐƯỢC VỀ CHỖ SỬA — một bảng nói «thiếu»
     mà không dẫn tới chỗ sửa chỉ tạo thêm việc đi tìm.                    */
  function K9(kb) {
    return bang(Object.assign({ gomNhom: false }, kb, { khuon: 'K9' }));
  }

  /* ════════════════════ PANEL DRILL-DOWN ════════════════════════════════
     Ba thứ bắt buộc, không thiếu thứ nào (`M9.1` §7):
       ① danh sách BẢN GHI GỐC — không phải lại một con số khác
       ② QUY TẮC ĐẾM bằng tiếng Việt — tính vào gì · KHÔNG tính gì
       ③ DEEP-LINK về menu chủ, mang theo bộ lọc, kèm `&return=`           */
  function nodePanel() {
    let m = $('#kbMask');
    if (m) return m;
    m = document.createElement('div');
    m.id = 'kbMask'; m.className = 'kbmask';
    m.innerHTML = '<div class="kbpanel"><div class="kbh"><b id="kbTen"></b>'
      + '<span class="spacer"></span><button class="kbx" id="kbDong">✕</button></div>'
      + '<div class="kbb" id="kbBody"></div></div>';
    document.body.appendChild(m);
    m.addEventListener('click', e => { if (e.target === m || e.target.id === 'kbDong') dong() });
    return m;
  }
  const dong = () => { const m = $('#kbMask'); if (m) m.classList.remove('on') };

  function drill(khoa) {
    const o = O[khoa]; if (!o) return;
    const { ket, cot, dong: d, kb } = o;
    nodePanel();
    $('#kbTen').innerHTML = esc(ket.ten) + ' — <span class="kbdong">' + esc(d.ten) + '</span>' + chip(ket.loaiSo);
    let h = '';

    /* giá trị + hai vế nếu là ô dẫn xuất */
    h += '<div class="kbso">' + (ket.canhBao ? '<span class="kbcb">⚠ ' + esc(ket.canhBao.chu) + '</span>'
      : '<b>' + soRa(ket.giaTri, cot.kieu) + '</b> <i>' + esc(ket.donVi || '') + '</i>') + '</div>';
    if (ket.veTrai && ket.vePhai) {
      h += '<div class="kbps"><div class="kbpsl"><span>' + esc(ket.veTrai.ten) + '</span><b>'
        + vn(ket.veTrai.giaTri) + ' ' + esc(ket.veTrai.donVi || '') + '</b></div>'
        + '<div class="kbpsc">chia cho</div>'
        + '<div class="kbpsl"><span>' + esc(ket.vePhai.ten) + '</span><b>'
        + vn(ket.vePhai.giaTri) + ' ' + esc(ket.vePhai.donVi || '') + '</b></div></div>';
    }
    if (ket.ghiChu) h += '<div class="kbgc">' + ket.ghiChu + '</div>';

    /* ② quy tắc đếm — nguyên văn từ từ điển */
    const q = ket.quyTacDem || { tinhVao: [], khongTinh: [] };
    h += '<div class="kbqt"><div class="kbqth">Quy tắc đếm</div>'
      + '<div class="kbqtv"><b>Tính vào</b><ul>' + (q.tinhVao || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>'
      + '<div class="kbqtx"><b>KHÔNG tính</b><ul>' + (q.khongTinh || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
    if (ket.canCu) h += '<div class="kbcc">⚖ Căn cứ: ' + esc(ket.canCu) + '</div>';
    h += '<div class="kbng">Mã chỉ tiêu <b>' + esc(ket.ma) + (ket.o ? ' · ô ' + esc(ket.o) : '') + '</b>'

    const lk = (d && (typeof d.linkDong === 'function' ? d.linkDong(d) : d.linkDong))

    hl_giao: { ten: 'Từ khi sổ giao bài chạy', chot: HOMNAY, tu: '2026-10-12', den: HOMNAY },

  const MAU = {

       chuyển tab KHÔNG được ghi đè lựa chọn ấy — đổi số dưới tay người đang
       đọc là cách nhanh nhất làm họ mất tin vào bảng. */
    tuTay: false
  };
  /* tab gọi khi mở: đặt khoảng theo kỳ chuẩn của tab, trừ khi người dùng đã tự đặt */
  function khoangMacDinh(maKy) {
    if (st.tuTay || !KY[maKy]) return;
    st.tuNgay = KY[maKy].tu; st.denNgay = KY[maKy].den;
  }
  let veLai = () => { };
  const noiVeLai = fn => { veLai = fn };

  /* tham số truyền cho `CT.doc()` */
  const thamSo = them => Object.assign({
    cheDo: 'chot', chotNgay: st.chotNgay, tuNgay: st.tuNgay, denNgay: st.denNgay,
    phamVi: st.phamVi, phanTo: st.phanTo
  }, them || {});
  const thamSoPS = them => thamSo(Object.assign({ cheDo: 'khoang' }, them || {}));

  const laHomNay = () => st.chotNgay === HOMNAY;
  const moTaChot = () => 'Chốt tại ngày ' + k2s(st.chotNgay);
  const moTaKhoang = () => 'Từ ' + k2s(st.tuNgay) + ' → ' + k2s(st.denNgay);

  /* ══════════════ ① CHỐT TẠI NGÀY — cho số TỒN ══════════════════════
     Lùi được MỌI ngày trong năm học. Nút lùi nhanh theo kỳ chuẩn.        */
  function chotNgay() {

      + '<span class="pvthu">' + kThu(st.chotNgay) + ' · <b>' + k2s(st.chotNgay) + '</b></span>'

     giấy nói cho người đọc biết đó là số của ba tháng trước.              */
  function daiCanhBao() {
    if (st.chotNgay > HOMNAY) {

        + '; phần sau đó <b>chưa xảy ra</b>, không phải bằng 0.</div>';
    }
    if (laHomNay()) return '';
    return '<div class="canh w">🕐 <b>Số liệu chốt tại ' + k2s(st.chotNgay) + ', không phải hôm nay</b> ('

      + '<button class="btn xs" data-pvky="_homnay">↩ Về hôm nay</button></div>';

  function khoang() {

  /* ══════════════ ③ DẢI PHẠM VI ════════════════════════════════════════

  function daiPhamVi(n, donVi, tongToanTruong, tenPhamVi) {
    if (tongToanTruong == null || n === tongToanTruong) return '';
    return '<div class="pvcut"><b>' + vn(n) + ' ' + esc(donVi) + '</b>'

  /* ══════════════ ④ MẪU BÁO CÁO ĐỊNH KỲ — một BỘ THAM SỐ ══════════════ */
  function daiMau() {
    return '<div class="pvmau"><span class="pvlb">Mẫu định kỳ</span>'

  function chonChieu(ma, dsChieu) {

    });
    return h + '</div>';
  }

  /* ─────────────────────────── gắn sự kiện ──────────────────────────── */
  function gan() {
    if (gan._da) return; gan._da = true;
    document.addEventListener('change', e => {
      if (e.target.id === 'pvChot') { st.chotNgay = e.target.value || HOMNAY; st.mauDangDung = null; veLai() }
      if (e.target.id === 'pvTu') { st.tuNgay = e.target.value; st.mauDangDung = null; veLai() }
      if (e.target.id === 'pvDen') { st.denNgay = e.target.value; st.mauDangDung = null; veLai() }
    });
    document.addEventListener('click', e => {
      const k = e.target.closest('[data-pvky]');
      if (k) {
        const v = k.getAttribute('data-pvky');
        st.chotNgay = v === '_homnay' ? HOMNAY : KY[v].chot;
        st.mauDangDung = null; veLai(); return;
      }
      const h = e.target.closest('[data-pvkh]');
      if (h) { const v = h.getAttribute('data-pvkh'); st.tuNgay = KY[v].tu; st.denNgay = KY[v].den; st.mauDangDung = null; st.tuTay = true; veLai(); return }
      const m = e.target.closest('[data-pvmau]');
      if (m) { napMau(m.getAttribute('data-pvmau')); veLai(); return }
      const c = e.target.closest('[data-pvct]');
      if (c) { st.phanTo = c.getAttribute('data-pvct') || null; veLai(); return }
    });
  }

  return {
    st, KY, MAU, themMau, napMau, gan, noiVeLai, khoangMacDinh,
    chotNgay, khoang, daiCanhBao, daiPhamVi, daiMau, chonChieu,
    thamSo, thamSoPS, moTaChot, moTaKhoang, laHomNay
  };
})();
