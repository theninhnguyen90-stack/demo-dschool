  };
});

/* ── NS.05 — ngày công và nghỉ phép ─────────────────────────────────── */
const nsTrongKy = () => NSL.filter(p => trongPV(p));
function oNgayCong(p, t, o) {
  const d = ngayCua(p, t);
  const nua = k => { const don = DONNGHI.find(x => x.ai === p.n && coHieuLuc(x, k)); const n = don && don.ngay.find(y => y.ngay === k); return n && n.buoi !== 'ca_ngay' ? 0.5 : 1 };
  if (o === 'congChuan') return congChuan(t);
  if (o === 'congThuc') return d.filter(x => ['du', 'muon'].includes(x.tt)).length
    + d.filter(x => x.tt === 'co_phep').reduce((a, x) => a + (1 - nua(x.k)), 0);
  if (o === 'coPhep') return d.filter(x => x.tt === 'co_phep').reduce((a, x) => a + nua(x.k), 0);
  if (o === 'khongPhep') return d.filter(x => x.tt === 'khong_phep').length;
  if (o === 'congTac') return d.filter(x => x.tt === 'cong_tac').length;
  if (o === 'thieu') return d.filter(x => x.tt === 'thieu').length;
  const tt = tietCua(p, t);
  if (o === 'tietKetLuan') return tt ? tt.dungGio + tt.muon : null;
  if (o === 'tietMuon') return tt ? tt.muon : null;
  if (o === 'tietChuaKetLuan') return tt ? tt.chuaKetLuan : null;
  return d.filter(x => ['du', 'muon'].includes(x.tt)).length;
}
CT.nguonSo('NS.05', (tham, o) => {
  const t = tham.thang || ST.thangCong;
  const ds = (tham.nguoi ? [tham.nguoi] : nsTrongKy()).filter(p => !tham.loc || tham.loc(p));
  if (!ds.length) return { giaTri: null, banGhiGoc: [] };
  /* ★ tiết dạy chỉ có ở nhóm 2 — nhóm 3 trả `null`, ⛔ không trả 0 */
  if (['tietKetLuan', 'tietMuon', 'tietChuaKetLuan'].includes(o) && ds.every(p => p.nh !== 2))
    return { giaTri: null, banGhiGoc: [], canhBao: { ma: 'KHONG_CO_TIET', chu: 'không giảng dạy' } };
  const v = ds.reduce((a, p) => { const x = oNgayCong(p, t, o); return a + (x == null ? 0 : x) }, 0);
  const bg = tham.nguoi
    ? ngayCua(tham.nguoi, t).map(x => ({ id: x.k, ten: kThu(x.k) + ' ' + k2s(x.k), phu: TT_NGAY[x.tt], so: '' }))
    : ds.map(p => ({ id: p.id, ten: p.n, phu: p.to + ' · ' + p.dt, so: String(oNgayCong(p, t, o) == null ? '—' : oNgayCong(p, t, o)) }));
  return { giaTri: Math.round(v * 10) / 10, banGhiGoc: bg };
});

/* ── NS.07 — xếp loại chất lượng viên chức ──────────────────────────── */
CT.nguonSo('NS.07', (tham, o) => {
  const dot = tham.dot || ST.dotXL;
  const d = DOT_XL.find(x => x.id === dot);
  if (!d) return { giaTri: null, banGhiGoc: [] };
  if (d.tt === 'dangmo') return { giaTri: null, banGhiGoc: [], canhBao: { ma: 'DOT_DANG_MO', chu: 'đợt đang mở — chưa chốt' } };
  const ds = NSL.filter(p => trongPV(p) && (!tham.loc || tham.loc(p)));
  const kq = p => xlCua(p.n, dot);
  let L;
  if (o === 'boTrong') L = ds.filter(p => (kq(p) || [])[0] === 'bo_trong');
  else if (o === 'chuaXet') L = ds.filter(p => !kq(p));
  else if (o === 'mauSoTran') L = ds.filter(p => dlvOf(p.dlv)[2] && ['htxsnv', 'httnv'].includes((kq(p) || [])[0]));
  else if (o) L = ds.filter(p => (kq(p) || [])[0] === o);
  else L = ds.filter(p => kq(p) && kq(p)[0] !== 'bo_trong');
  return {
    giaTri: L.length,
    banGhiGoc: L.map(p => {
      const k = kq(p) || [];
      return {
        id: p.id, ten: p.n, phu: p.to + ' · ' + p.dlv,
        so: k[0] === 'bo_trong' ? 'Bỏ trống — ' + (LY_BO_TRONG[k[1]] || '') : ((MUC_XL.find(m => m[0] === k[0]) || [])[1] || '—')
      };
    })
  };
});

/* ── NS.11 — khen thưởng · kỷ luật ──────────────────────────────────── */
CT.nguonSo('NS.11', (tham, o) => {
  const tu = tham.tuNgay, den = tham.denNgay > HOMNAY ? HOMNAY : tham.denNgay;
  const ngayChot = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  let ds = KTKL.filter(x => { const p = nsByTen(x.ai); return !p || trongPV(p) });
  if (o === 'conHieuLuc') ds = ds.filter(x => x.kieu === 'ky_luat' && x.ngay <= ngayChot && x.hetHieuLuc > ngayChot);
  else if (o === 'anhHuongXepLoai') ds = ds.filter(x => x.kieu === 'ky_luat' && x.anhHuongXepLoai && x.ngay <= ngayChot && x.hetHieuLuc > ngayChot);
  else {
    ds = ds.filter(x => x.ngay >= tu && x.ngay <= den);

  }
  if (tham.loc) ds = ds.filter(tham.loc);
  return {
    giaTri: ds.length,
    banGhiGoc: ds.map(x => ({ id: x.id, ten: x.ai, phu: x.ht + ' · ' + x.cap + ' · ' + k2s(x.ngay) + (x.bo ? ' · ' + x.bo : ''), so: x.so }))
  };
});

/* ── QT.11 — chứng thư số ───────────────────────────────────────────── */
CT.nguonSo('QT.11', (tham, o) => {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  /* khóa ô con (`conHan`…) ≠ giá trị của `ttCTS` (`con_han`…) — ánh xạ một chỗ */

  };
});

/* ── QT.07 — lượt bỏ qua ký số ──────────────────────────────────────── */
CT.nguonSo('QT.07', (tham, o) => {
  const tu = tham.tuNgay, den = tham.denNgay > HOMNAY ? HOMNAY : tham.denNgay;
  let ds = BOQUA.filter(x => x.ngay >= tu && x.ngay <= den && (!tham.loc || tham.loc(x)));
  if (o === 'chuaXuLy') ds = ds.filter(x => x.xuLy === 'chua');
  if (o === 'daIn') ds = ds.filter(x => x.xuLy === 'da_in');
  if (o === 'daKyTay') ds = ds.filter(x => x.xuLy === 'da_ky_tay');
  if (o === 'soNguoi') {
    const ng = [...new Set(ds.map(x => x.ai))];
    return { giaTri: ng.length, banGhiGoc: ng.map(n => ({ id: n, ten: n, phu: 'người lẽ ra ký', so: String(ds.filter(x => x.ai === n).length) + ' lượt' })) };
  }
  return {
    giaTri: ds.length,

   KPI từng người GIỮ NGUYÊN. Hai thứ đổi theo `DLC`, nêu đích danh:
     · CỜ CHỦ NHIỆM = người đứng tên GVCN một lớp của `DLC.lop` (vẫn đúng 10 người);
     · ĐIỂM TRƯỜNG: ba GVCN của ba lớp điểm trường B (`Hà Minh Đức` 7B1 ·
       `Trịnh Văn Sơn` 8B1 · `Dương Văn Thắng` 9B1) nay ở B, ĐỔI CHỖ với ba đồng
       nghiệp CÙNG TỔ (`Trịnh Thị Vân` · `Đặng Thị Quỳnh` · `Tạ Thị Bình` về A)
       để số giáo viên mỗi tổ ở mỗi điểm trường giữ nguyên; PHT Điểm trường ở B
       (`DLC.vai`). Hệ quả: phân công tự gieo (`seedPC`) đổi nhẹ ⇒ vài ô tab 5–8
       đổi — bảng trước / sau ở phiếu `V22` mục D.
   ⚠ Lớp của menu này (`LOP` mục ②, 15 lớp liên cấp) VẪN là dữ liệu riêng — chưa
   nối `DLC.lop` (10 lớp THCS). Ghi mục E của phiếu `V22`.
   Demo ⛔ không ghi vào `DLC` — mỗi dòng dưới đây là bản SAO CHÉP.             */
const DT = {}; DLC.diemTruong.forEach(d => { DT[d.ma] = d.ten });
const TO = ['Tổ Toán — Tin', 'Tổ Ngữ văn', 'Tổ Ngoại ngữ', 'Tổ Lý — Hóa — Sinh',
  'Tổ Sử — Địa — GDCD', 'Tổ Thể dục — Nghệ thuật'];
const saoNguoi = (x, id) => ({ id, ma: x.ma, ten: x.ten, to: x.to, hang: x.hang, cv: x.chucVu || '',
  gvcn: !!x.gvcnLop, dt: x.dt, cap: x.capDinhMuc });
/* ★ Hai cột `dt` và `cap` là của `M4.1` / `M4.4`; `M5.5` không cần. Ở đây bắt
   buộc phải có: báo cáo cắt theo Điểm trường, và định mức chuẩn đọc theo CẤP
   HỌC (`M4.4` §5.5.2 — trường liên cấp sau sáp nhập).
   Bộ KPI `B1` áp cho người có số chốt Quý I trong `DLC` — đúng 26 người.     */
const GV = DLC.nhanSu.filter(x => x.kpi).map((x, i) => saoNguoi(x, 'G' + (i + 1)));
const gvBy = id => GV.find(g => g.id === id);
const gvTen = t => GV.find(g => g.ten === t);

/* Ban giám hiệu — KHÔNG nằm trong 26 giáo viên trên. `M4.5` §7.4.2:
   «Ban giám hiệu không vào hai cảnh báo Vượt / Thiếu» — định mức 2 và 4 tiết,
   lệch MỘT tiết đã là 25–50%, áp ngưỡng phần trăm lên mẫu số đó chỉ sinh
   cảnh báo giả. Họ vẫn hiện đủ số liệu, chỉ không tô màu và không vào đếm. */
/* ── Một giáo viên MỚI TUYỂN giữa năm — `M4.5` §7.4.2 (anh Ninh chốt 18/9):
   «Người mới tuyển giữa năm KHÔNG bị loại khỏi bảng… Nhưng không đếm họ là
   thiếu định mức» — chưa gán `Môn được phép dạy` ở `M4.4` thì chưa suy được
   cấp học, chưa có ngưỡng nào để so ⇒ con số thứ ba «Chưa đo được».
   🛑 ĐỂ NGOÀI mảng `GV`: mảng ấy phải giữ ĐÚNG 26 người của demo `M5.5`, nếu
   không bộ sinh số giả ngẫu nhiên lệch pha và tab 4 hết đối chiếu được.
   ⚠ Giáo viên BIỆT PHÁI ĐI của `DLC` (`Lê Thị Tâm`) ⛔ không vào menu này: không
   dạy ở trường trong năm học, không có phân công, không vào bộ KPI.        */
const GV_MOI = DLC.nhanSu.filter(x => x.moiTuyen).map((x, i) => Object.assign(saoNguoi(x, 'N' + (i + 1)), { moiTuyen: x.moiTuyen }));
const BGH = DLC.nhanSu.filter(x => x.to === 'Ban giám hiệu')
  .map((x, i) => Object.assign(saoNguoi(x, 'H' + (i + 1)), { dmRieng: x.dinhMucRieng }));
const MOI_NGUOI = GV.concat(GV_MOI, BGH);
const nguoiBy = id => MOI_NGUOI.find(g => g.id === id);
const laBGH = g => g.to === 'Ban giám hiệu';
const chuaDoDuoc = g => !laBGH(g) && !g.cap;
const TO_MR = TO.concat(['Ban giám hiệu']);

/* ═══════════════ ② MÔN HỌC · LỚP — chiếu `M10.2` ② và `M10.1` ⑤ ⑥ ═════
   🔑 `HDPC` ① ② — mỗi môn có một PHƯƠNG THỨC TỔ CHỨC KIẾN THỨC; môn không
   chia phần mang `PT0 — Toàn môn` với đúng MỘT phần trùng tên môn. Đây là
   thứ giữ cho các môn còn lại chạy y hệt trước cụm `GDDP`.                */
const MON = [
  { ma: 'TOAN', ten: 'Toán', to: 'Tổ Toán — Tin', pt: 'PT0' },
  { ma: 'TIN', ten: 'Tin học', to: 'Tổ Toán — Tin', pt: 'PT0' },
  { ma: 'VAN', ten: 'Ngữ văn', to: 'Tổ Ngữ văn', pt: 'PT0' },
  { ma: 'ANH', ten: 'Tiếng Anh', to: 'Tổ Ngoại ngữ', pt: 'PT0' },
  { ma: 'KHTN', ten: 'Khoa học tự nhiên', to: 'Tổ Lý — Hóa — Sinh', pt: 'PT3', phan: ['Vật lí', 'Hóa học', 'Sinh học'] },
  { ma: 'LY', ten: 'Vật lí', to: 'Tổ Lý — Hóa — Sinh', pt: 'PT0' },
  { ma: 'HOA', ten: 'Hóa học', to: 'Tổ Lý — Hóa — Sinh', pt: 'PT0' },
  { ma: 'SINH', ten: 'Sinh học', to: 'Tổ Lý — Hóa — Sinh', pt: 'PT0' },
  { ma: 'LSDL', ten: 'Lịch sử & Địa lí', to: 'Tổ Sử — Địa — GDCD', pt: 'PT2', phan: ['Lịch sử', 'Địa lí'] },
  { ma: 'SU', ten: 'Lịch sử', to: 'Tổ Sử — Địa — GDCD', pt: 'PT0' },
  { ma: 'GDCD', ten: 'Giáo dục công dân', to: 'Tổ Sử — Địa — GDCD', pt: 'PT0' },
  { ma: 'GDDP', ten: 'Giáo dục địa phương', to: 'Tổ Sử — Địa — GDCD', pt: 'PT3', phan: ['Mạch Văn hóa — Lịch sử', 'Mạch Địa lí — Kinh tế', 'Mạch Môi trường — Hướng nghiệp'] },
  { ma: 'GDTC', ten: 'Giáo dục thể chất', to: 'Tổ Thể dục — Nghệ thuật', pt: 'PT0' },
  { ma: 'NT', ten: 'Nghệ thuật', to: 'Tổ Thể dục — Nghệ thuật', pt: 'PT0' },
  /* 🔑 `Hoạt động trải nghiệm` KHÔNG thuộc một tổ bộ môn nào. Bộ GD&ĐT nói phần
     này «không trùng với nhiệm vụ của giáo viên làm chủ nhiệm lớp» nhưng vẫn
     được tính giờ (`M4.4` §note) — thực tế trường giao cho giáo viên chủ nhiệm
     và rải khắp các tổ. Gán cả 105 tiết/năm × 15 lớp cho một tổ ba người là
     tạo ra một con số quá tải KHÔNG CÓ THẬT.                              */
  { ma: 'HDTN', ten: 'Hoạt động trải nghiệm', to: '*', pt: 'PT0' }
];
const monBy = ma => MON.find(m => m.ma === ma);
const phanCua = m => m.phan ? m.phan.slice() : [m.ten];

const LOP = [];
[['6A1', 6, 'A'], ['6A2', 6, 'A'], ['7A1', 7, 'A'], ['7A2', 7, 'A'], ['8A1', 8, 'A'], ['8A2', 8, 'A'],
['9A1', 9, 'A'], ['9A2', 9, 'A'], ['10A1', 10, 'A'], ['10A2', 10, 'A'], ['11A1', 11, 'A'],
['6B1', 6, 'B'], ['7B1', 7, 'B'], ['8B1', 8, 'B'], ['9B1', 9, 'B']].forEach(function (x) {
  LOP.push({ id: x[0], ten: x[0], khoi: x[1], dt: x[2], cap: x[1] <= 9 ? 'THCS' : 'THPT' });
});
const lopBy = id => LOP.find(l => l.id === id);

/* môn của từng khối — `M10.1` ⑥ `MON_CUA_LOP`. THCS theo CT GDPT 2018 học
   `Khoa học tự nhiên` và `Lịch sử & Địa lí` dạng môn tích hợp; THPT tách. */
const MON_KHOI = {
  6: ['TOAN', 'VAN', 'ANH', 'KHTN', 'LSDL', 'GDCD', 'TIN', 'GDDP', 'GDTC', 'NT', 'HDTN'],
  7: ['TOAN', 'VAN', 'ANH', 'KHTN', 'LSDL', 'GDCD', 'TIN', 'GDDP', 'GDTC', 'NT', 'HDTN'],
  8: ['TOAN', 'VAN', 'ANH', 'KHTN', 'LSDL', 'GDCD', 'TIN', 'GDDP', 'GDTC', 'NT', 'HDTN'],
  9: ['TOAN', 'VAN', 'ANH', 'KHTN', 'LSDL', 'GDCD', 'TIN', 'GDDP', 'GDTC', 'NT', 'HDTN'],
  10: ['TOAN', 'VAN', 'ANH', 'LY', 'HOA', 'SINH', 'SU', 'TIN', 'GDDP', 'GDTC', 'HDTN'],
  11: ['TOAN', 'VAN', 'ANH', 'LY', 'HOA', 'SINH', 'SU', 'TIN', 'GDDP', 'GDTC', 'HDTN']
};
/* 35 tuần thực học — `M5.1` §7.1, khớp khung QĐ 2308 (HK1 18 · HK2 17). */
const TUAN_NAM = 35;
const TIET_NAM = {
  TOAN: { 6: 140, 7: 140, 8: 140, 9: 140, 10: 105, 11: 105 },
  VAN: { 6: 140, 7: 140, 8: 140, 9: 140, 10: 105, 11: 105 },
  ANH: { 6: 105, 7: 105, 8: 105, 9: 105, 10: 105, 11: 105 },
  KHTN: { 6: 140, 7: 140, 8: 140, 9: 140 },
  LSDL: { 6: 105, 7: 105, 8: 105, 9: 105 },
  GDCD: { 6: 35, 7: 35, 8: 35, 9: 35 },
  TIN: { 6: 35, 7: 35, 8: 35, 9: 35, 10: 70, 11: 70 },
  GDDP: { 6: 35, 7: 35, 8: 35, 9: 35, 10: 35, 11: 35 },
  GDTC: { 6: 70, 7: 70, 8: 70, 9: 70, 10: 70, 11: 70 },
  NT: { 6: 70, 7: 70, 8: 70, 9: 70 },
  HDTN: { 6: 105, 7: 105, 8: 105, 9: 105, 10: 105, 11: 105 },
  LY: { 10: 70, 11: 70 }, HOA: { 10: 70, 11: 70 }, SINH: { 10: 70, 11: 70 }, SU: { 10: 70, 11: 70 }
};
const tietNam = (maMon, khoi) => (TIET_NAM[maMon] || {})[khoi] || 0;

/* ── chia số tiết theo PHẦN — `HDPC` ④, tầng ④ của `M5.1` §7b ──────────
   🛑 Bất biến: Σ số tiết các phần của một `Lớp × Môn` = số tiết của môn đó.
   Tỉ lệ thật KHÔNG chia hết — KHTN 140 tiết chia 45 · 45 · 50 (`GDDP-2A` B3).
   Số lẻ là CÓ THẬT, không phải lỗi làm tròn: 45 / 35 = 1,29 tiết/tuần. Tròn ở
   từng dòng thì TỔNG LỆCH, và tổng lệch chính là «thừa hoặc thiếu giờ của
   phân môn» mà góp ý `GY-L5ML` hỏi.                                       */
const TILE_PHAN = {
  KHTN: [45, 45, 50],      /* Vật lí · Hóa học · Sinh học — trên 140 */
  LSDL: [52, 53],          /* Lịch sử · Địa lí — trên 105 */
  GDDP: [12, 12, 11]       /* ba mạch Phú Thọ — trên 35. SỐ TẠM: QĐ 18/2026 cho
                              khung ba mạch · 35 tiết/năm nhưng KHÔNG chia tiết
                              từng mạch (`PHIEU-GDDP-1A` B11 — `GDĐP-6` đang chờ
                              trường trả lời). Báo cáo nói rõ trên màn hình. */
};
function chiaTiet(maMon, khoi) {
  const m = monBy(maMon), tong = tietNam(maMon, khoi);
  if (!m || !tong) return [];
  const ph = phanCua(m);
  if (m.pt === 'PT0') return [{ phan: ph[0], tiet: tong }];
  const t = TILE_PHAN[maMon] || ph.map(() => Math.round(tong / ph.length));
  return ph.map((p, i) => ({ phan: p, tiet: t[i] }));
}
/* mọi ô `Lớp × Môn × Phần` của trường — đơn vị nhỏ nhất mà cụm `GDDP` chốt */
const O_LMP = [];
LOP.forEach(function (l) {
  (MON_KHOI[l.khoi] || []).forEach(function (ma) {
    chiaTiet(ma, l.khoi).forEach(function (x) {
      O_LMP.push({ lop: l.id, dt: l.dt, khoi: l.khoi, mon: ma, phan: x.phan, tiet: x.tiet,
        tietTuan: Math.round(x.tiet / TUAN_NAM * 100) / 100 });
    });
  });
});

/* ═══════════ ③ `M4.4` — ĐỊNH MỨC GIẢNG DẠY (chiếu `m4.4.dinh_muc_giang_day`)
   Công thức của `M4.4` §5.5.1, KHÔNG viết lại:
       Định mức đề xuất = Khung chuẩn theo cấp
                        − Σ(giảm theo chức vụ đang giữ)
                        − Σ(giảm theo kiêm nhiệm đang giữ)
   Khung chuẩn TT 05/2025: Tiểu học 23 · THCS 19 · THPT 17 · HT 2 · PHT 4. */
const KHUNG_CHUAN = { 'Tiểu học': 23, THCS: 19, THPT: 17 };
const CHE_DO_GIAM = {
  'Tổ trưởng': 3, 'Tổ phó': 1, 'Chủ nhiệm lớp': 4, 'Chủ tịch Công đoàn': 2,
  'Tổng phụ trách Đội': 8
};
/* kiêm nhiệm ngoài chức vụ tổ — chiếu `M4.3` */
const KIEM_NHIEM = { 'Trần Văn Hải': ['Tổng phụ trách Đội'], 'Nguyễn Thị Hạnh': ['Chủ tịch Công đoàn'] };
/* ghi đè định mức — `M4.4` §5.5.1: «Ghi đè bắt buộc nêu lý do», cờ `Có ngoại lệ`,
   Hiệu trưởng duyệt. Đây là con số quyết định thù lao vượt giờ ở `M4.9`.     */
const NGOAI_LE_DM = {
  'Đỗ Thị Lan': { dm: 9, ly: 'Nghỉ ốm dài ngày 09/11/2026 → 15/12/2026 (M4.2) — giảm định mức nửa kỳ, Hiệu trưởng duyệt 12/11/2026' }
};
function giamCua(g) {
  const r = [];
  if (g.cv === 'Tổ trưởng') r.push(['Tổ trưởng', 3]);
  if (g.cv === 'Tổ phó') r.push(['Tổ phó', 1]);
  if (g.gvcn) r.push(['Chủ nhiệm lớp', 4]);
  (KIEM_NHIEM[g.ten] || []).forEach(k => r.push([k, CHE_DO_GIAM[k]]));
  return r;
}
/* Ngưỡng PHẢI ĐẠT — `M4.5` §7.4.2 sửa vế của `nh3.3.1` §5.1:
   Ngưỡng phải đạt = Định mức chuẩn − Giảm định mức.  Quy đổi hoạt động là
   CÔNG VIỆC ĐÃ LÀM, thuộc vế giáo viên — không cộng vào ngưỡng.             */
function nguongCua(g) {
  if (laBGH(g)) return g.dmRieng;
  /* 🛑 Chưa gán `Môn được phép dạy` ở `M4.4` ⇒ chưa suy được cấp học ⇒ KHÔNG
     CÓ NGƯỠNG NÀO ĐỂ SO. Trả `null`, ⛔ không rơi về một con số mặc định:
     mặc định 19 sẽ biến một việc chưa làm ở khâu hồ sơ thành «thiếu 19 tiết»
     của người lao động (`M4.5` §7.4.2).                                   */
  if (!g.cap) return null;
  const nl = NGOAI_LE_DM[g.ten];
  if (nl) return nl.dm;
  return Math.max(0, KHUNG_CHUAN[g.cap] - giamCua(g).reduce((a, x) => a + x[1], 0));
}
const chuanCua = g => laBGH(g) ? g.dmRieng : (g.cap ? KHUNG_CHUAN[g.cap] : null);
/* quy đổi hoạt động (dự giờ tập trung · coi chấm thi · bồi dưỡng HSG) — tiết/tuần */
const QUY_DOI = { 'Phạm Minh Tuấn': 2, 'Vũ Đình Khoa': 2, 'Trần Thị Bích': 1,
  'Nguyễn Thị Hạnh': 1, 'Bùi Thị Thu': 1, 'Đinh Văn Phúc': 1 };
const quyDoiCua = g => QUY_DOI[g.ten] || 0;

/* ═══════════ ④ `M4.5` — PHÂN CÔNG GIẢNG DẠY theo PHẦN ══════════════════
   🔑 `HDPC` ⑥ — khóa `(lop_id, mon_id, phan_ma) → giao_vien_id`, và
   **số tiết của một dòng = số tiết của PHẦN**, không phải của cả môn.
   `GDDP-2A` B2: số tiết/tuần của một dòng = số tiết/năm của phần ÷ 35, giữ
   số thực, hiện MỘT chữ số thập phân. ⛔ KHÔNG làm tròn ở từng dòng (B3).

   ⚠ Đây là chỗ cụm `GDDP` sửa một lỗi TIỀN: trước v3.0, người duy nhất đứng
   tên môn GDĐP của 3 lớp nhận 105 tiết/năm ẢO (17,6% định mức năm), bị đẩy
   sang phía «vượt» — mà vượt định mức là căn cứ trả thù lao dạy thêm giờ —
   còn ba đồng nghiệp thực dạy các mạch kia thì rơi vào «thiếu định mức».  */
const PC = []; let PCSEQ = 0;
/* ô CỐ Ý để trống — hai loại thiếu của `M4.5` §7.2 phải tách đôi */
const O_TRONG = {
  '9B1|NT|Nghệ thuật': 'nangluc',        /* 🔴 KHÔNG một giáo viên nào được gán phần này ở M4.4 */
  '8B1|TIN|Tin học': 'phancong',         /* 🟡 có người gán được ở M4.4 nhưng chưa ai nhận lớp */
  '11A1|GDDP|Mạch Môi trường — Hướng nghiệp': 'phancong'
};
(function seedPC() {
  /* ── Gán theo SỨC CHỨA CÒN LẠI, không gán vòng tròn ──────────────────
     Vòng tròn chia đều SỐ Ô, nhưng các ô không bằng nhau: một ô Toán là 4
     tiết/tuần, một ô Giáo dục công dân là 1. Chia đều số ô thì người nhận
     toàn ô nặng vọt lên 38 tiết/tuần trong khi đồng nghiệp còn 3 — và bảng
     cân đối của tab 6 báo một sự quá tải KHÔNG CÓ THẬT, do chính cách gieo
     dữ liệu đẻ ra chứ không phải do nhà trường.
     Trường thật phân công theo sức chứa: ai còn nhiều giờ trống nhất thì
     nhận ô tiếp theo. Ưu tiên cùng điểm trường và cùng cấp; hết thì MƯỢN
     người điểm trường khác — cross-branch hợp lệ (`M4.5` §7.1 khối ba). */
  const con = {};
  MOI_NGUOI.forEach(function (g) { con[g.id] = laBGH(g) || !g.cap ? -99 : nguongCua(g) });
  function chon(pool, o) {
    if (!pool.length) return null;
    /* ⛔ KHÔNG ưu tiên theo cấp học. Trường liên cấp sau sáp nhập thì một
       giáo viên dạy cả hai cấp; `cap` chỉ là **cấp học TÍNH ĐỊNH MỨC** đã
       khai ở `M4.4` §5.5.2, không phải giới hạn được dạy lớp nào. Ưu tiên
       theo cấp thì 6 người khai THPT chia nhau 3 lớp THPT và ai cũng hụt
       giờ — một con số «thiếu định mức» do cách gieo đẻ ra, không có thật. */
    const bo = [pool.filter(g => g.dt === o.dt), pool];
    for (const b of bo) {
      if (!b.length) continue;
      let best = null;
      b.forEach(function (g) { if (!best || con[g.id] > con[best.id]) best = g });
      if (best && con[best.id] > -99) return best;
    }
    return null;
  }
  /* ① môn CÓ TỔ — bể người là tổ sở hữu môn. Xếp ô NẶNG trước để ô nhẹ còn
     chỗ lấp vào chỗ trống, đúng cách người xếp lịch làm bằng tay.        */
  const coTo = O_LMP.filter(x => monBy(x.mon).to !== '*')
    .slice().sort((a, b) => b.tietTuan - a.tietTuan || (a.lop + a.mon + a.phan).localeCompare(b.lop + b.mon + b.phan, 'vi'));
  /* ② `Hoạt động trải nghiệm` — bể người là CẢ TRƯỜNG (§ MON, mã HDTN) */
  const moiTo = O_LMP.filter(x => monBy(x.mon).to === '*')
    .slice().sort((a, b) => (a.lop).localeCompare(b.lop, 'vi'));

  function gan(ds, poolCua) {
    ds.forEach(function (o) {
      const khoa = o.lop + '|' + o.mon + '|' + o.phan;
      if (O_TRONG[khoa]) return;
      const m = monBy(o.mon), g = chon(poolCua(m), o);
      if (!g) return;
      con[g.id] -= o.tietTuan;
      PC.push({
        id: 'PC' + (++PCSEQ), lop: o.lop, dt: o.dt, khoi: o.khoi, mon: o.mon, phan: o.phan,
        gv: g.id, to: g.to, tiet: o.tiet, tietTuan: o.tietTuan, tuanTu: 1, tuanDen: TUAN_NAM,
        loaiPhan: m.pt === 'PT0' ? 'Toàn môn' : 'Phân môn'
      });
    });
  }
  const daySong = GV.filter(g => g.cap);
  gan(coTo, m => daySong.filter(g => g.to === m.to));
  gan(moiTo, () => daySong);
  PC.sort((a, b) => a.id.localeCompare(b.id, 'en', { numeric: true }));

  /* ── Một ca BÀN GIAO thật — `HDPC` ⑥ `loai_phan = Bàn giao` ────────────
     Cô Lê Thị Mai nghỉ thai sản từ tuần 16. Phần Ngữ văn của lớp cô dạy được
     cắt tại tuần 16 (`✂ Cắt phần tại tuần…` ở `M5.1`): MỘT phần, HAI ĐOẠN,
     hai người. 🛑 Đoạn sau KHÔNG phải dạy thay (`M4.7` §4.6) — nó là giờ dạy
     theo kế hoạch của người nhận bàn giao, chảy vào ĐỊNH MỨC của chính họ.
     Cho nó thành dạy thay thì một người nghỉ thai sản cả học kỳ sinh ra hàng
     trăm bản ghi dạy thay, và người nhận được trả thù lao dạy thay thay vì
     được tính định mức.                                                   */
  const mai = gvTen('Lê Thị Mai'), hung = gvTen('Trần Quốc Hưng');
  const d = PC.find(x => x.gv === mai.id && x.mon === 'VAN');
  if (d) {
    const tongTiet = d.tiet;
    d.tuanDen = 15; d.tiet = Math.round(tongTiet * 15 / TUAN_NAM);
    d.tietTuan = Math.round(d.tiet / 15 * 100) / 100;
    PC.push({
      id: 'PC' + (++PCSEQ), lop: d.lop, dt: d.dt, khoi: d.khoi, mon: 'VAN', phan: d.phan,
      gv: hung.id, to: hung.to, tiet: tongTiet - d.tiet,
      tietTuan: Math.round((tongTiet - d.tiet) / (TUAN_NAM - 15) * 100) / 100,
      tuanTu: 16, tuanDen: TUAN_NAM, loaiPhan: 'Bàn giao',
      ghi: 'Cô Lê Thị Mai nghỉ thai sản từ tuần 16 — bàn giao đoạn sau của CÙNG MỘT phần'
    });
  }
})();
const pcCua = gid => PC.filter(p => p.gv === gid);
/* Tiết lên lớp của một người — Σ số tiết/tuần các DÒNG phân công người đó giữ.
   `M4.4` §0 · `HDPC` ⑥: định mức đọc số tiết của DÒNG, không của cả môn.   */
const tietLenLop = gid => Math.round(pcCua(gid).reduce((a, p) => a + p.tietTuan, 0) * 100) / 100;
/* ⚙ ngưỡng cảnh báo định mức — `M4.5` §7.4.2b (`GY18-I`, chốt 18/9/2026).
   MỘT ngưỡng chung cho cả trường, không tách theo cấp học (§10 #10).      */
const NGUONG_THIEU = 0.10;      /* 10% ngưỡng phải đạt — sửa được ở M4.5, 1–49% */
const TRAN_VUOT = 0.50;         /* 50% — TT 05/2025, số pháp lý, KHÔNG sửa được */
function canDoi(g) {
  const nguong = nguongCua(g), lam = tietLenLop(g.id) + quyDoiCua(g);
  const chenh = nguong == null ? null : Math.round((lam - nguong) * 100) / 100;
  let muc = 'trong';
  if (nguong == null) muc = 'chuado';
  else if (chenh > nguong * TRAN_VUOT) muc = 'vuot';
  else if (chenh < 0 && Math.abs(chenh) >= nguong * NGUONG_THIEU) muc = 'thieu';
  return { nguong, chuan: chuanCua(g), giam: giamCua(g), lenLop: tietLenLop(g.id),
    quyDoi: quyDoiCua(g), lam: Math.round(lam * 100) / 100, chenh, muc };
}

/* ═══════════ ⑤ `M4.6` — KHUNG TIẾT và THỜI KHÓA BIỂU ═══════════════════
   Ô khả dụng của một lớp = số ngày dạy × số tiết mỗi buổi (khung tiết của
   ĐIỂM TRƯỜNG — `M4.6` §8.1c.1: mọi bộ giờ cùng khung, chỉ khác GIỜ).     */
const KHUNG_TIET = {
  A: { ngay: 6, sang: 5, chieu: 2, ten: 'Điểm trường A — 6 ngày · sáng 5 · chiều 2' },
  B: { ngay: 5, sang: 5, chieu: 0, ten: 'Điểm trường B — 5 ngày · sáng 5, không học chiều' }
};
const oKhaDung = lop => { const k = KHUNG_TIET[lop.dt]; return k.ngay * (k.sang + k.chieu); };
/* tiết ĐÃ XẾP trong mẫu tuần — dẫn xuất từ phân công đang có hiệu lực ở
   tuần hiện tại. Ô chưa xếp = phần của môn mà bộ TKB đang áp dụng chưa đặt. */
const TUAN_HIEN_TAI = 16;       /* 28/12/2026 rơi vào tuần 16 của năm học */
const tuanTrong = (p, t) => t >= p.tuanTu && t <= p.tuanDen;
function tkbLop(lopId, tuan) {
  return PC.filter(p => p.lop === lopId && tuanTrong(p, tuan));
}
/* CỐ Ý chưa xếp — bộ TKB đang áp dụng còn ô trống (`M4.6` §5 bảng kết quả) */
const CHUA_XEP = { '9B1': 2, '8B1': 1, '11A1': 1 };
function tietDaXep(lopId, tuan) {
  const can = tkbLop(lopId, tuan).reduce((a, p) => a + p.tietTuan, 0);
  return Math.max(0, Math.round((can - (CHUA_XEP[lopId] || 0)) * 100) / 100);
}
/* «buổi trống chen giữa» — TK.02*: một BUỔI mà giáo viên có tiết ở buổi
   trước và buổi sau trong cùng ngày nhưng không có tiết ở buổi giữa. Đây là
   CHỈ SỐ CHẤT LƯỢNG THỜI KHÓA BIỂU, ⛔ KHÔNG phải chỉ tiêu đánh giá giáo
   viên: nó do người xếp lịch tạo ra, không do người dạy.                  */
const BUOI_TRONG = {
  'Trần Thị Bích': 1, 'Hoàng Văn Nam': 3, 'Vũ Thị Ngọc': 2, 'Trịnh Thị Vân': 3,
  'Đặng Thị Quỳnh': 2, 'Tạ Thị Bình': 2, 'Đỗ Văn Trung': 4, 'Lê Văn Dũng': 1,
  'Ngô Văn Kiên': 1, 'Dương Văn Thắng': 1
};
const buoiTrong = g => BUOI_TRONG[g.ten] || 0;

/* ═══════════ ⑥ LỊCH TUẦN CỦA NĂM HỌC — `M10.1` ① + `M10.9` ═════════════
   Tuần 1 bắt đầu thứ Hai 07/09/2026. `M5.1` §7.1: tuần NGHỈ TRỌN không đánh
   số và không tính vào 35 tuần thực học.                                  */
const TUAN1_T2 = '2026-09-07';
const tuanBatDau = t => themNgay(TUAN1_T2, (t - 1) * 7);
const tuanKetThuc = t => themNgay(TUAN1_T2, (t - 1) * 7 + 5);       /* thứ Bảy */
function tuanCua(ngay) {
  const n = Math.floor(soNgay(TUAN1_T2, ngay) / 7) + 1;
  return n < 1 ? 1 : (n > TUAN_NAM ? TUAN_NAM : n);
}
const TUAN = [];
for (let t = 1; t <= TUAN_NAM; t++) TUAN.push({ so: t, tu: tuanBatDau(t), den: tuanKetThuc(t) });

/* bộ sinh số giả ngẫu nhiên RIÊNG của phần chiếu (không đụng bộ của `M5.5`) */
let _r = 20260920;
const rnd5 = () => { _r = (_r * 1103515245 + 12345) & 0x7fffffff; return _r / 0x7fffffff; };

/* ═══════════ ⑦ `M5.1` — KHGD · THẺ BÀI · TIẾN ĐỘ ══════════════════════
   Chiếu `m5.1.ke_hoach_giang_day` + `m5.1.tien_do_theo_tuan`.
   🔑 `GDDP` hệ quả 2: tiến độ tính theo LƯỢT PHÂN CÔNG, ⛔ không theo cặp
   `Lớp × Môn` — một môn nay có nhiều giáo viên cùng dạy, mỗi người chạy một
   mạch riêng và có thể lệch tiến độ khác nhau.                            */
const KHGD = {};      /* khóa `mon|khoi` → {tt: 'ap'|'chuadu'|'khong', soBai} */
(function seedKHGD() {
  const cap = {};
  O_LMP.forEach(function (o) { cap[o.mon + '|' + o.khoi] = true; });
  Object.keys(cap).forEach(function (k) {
    const ma = k.split('|')[0], khoi = Number(k.split('|')[1]);
    KHGD[k] = { mon: ma, khoi, tt: 'ap', soBai: Math.max(1, Math.round(tietNam(ma, khoi) / 1.5)) };
  });
  /* ba ca CỐ Ý — bảng rà soát của `M5.1` tab 2 phải có dòng để bấm về */
  KHGD['NT|9'].tt = 'khong';        /* chưa có KHGD nào cho Nghệ thuật khối 9 */
  KHGD['TIN|8'].tt = 'chuadu';      /* có KHGD nhưng thiếu số tiết */
  KHGD['GDDP|11'].tt = 'chuadu';    /* ba mạch, mới khai hai */
})();
const khgdCua = (mon, khoi) => KHGD[mon + '|' + khoi] || { tt: 'khong', soBai: 0 };
/* số bài của một PHẦN — chia theo tỉ lệ tiết, giữ bất biến Σ = số bài của môn */
function soBaiPhan(p) {
  const k = khgdCua(p.mon, p.khoi);
  if (k.tt === 'khong') return 0;
  const tongTiet = tietNam(p.mon, p.khoi) || 1;
  return Math.max(1, Math.round(k.soBai * p.tiet / tongTiet));
}
/* Bài ĐÃ DẠY tính tới một ngày — dẫn xuất từ dòng sổ đầu bài `M2.2` của các
   tiết đã diễn ra. Ở bản chiếu, gieo một độ lệch ổn định theo dòng phân công. */
const LECH_PC = {};
PC.forEach(function (p) { LECH_PC[p.id] = Math.round((rnd5() * 3.6) - 1.2); });
function baiDaDay(p, ngay) {
  const t = Math.min(tuanCua(ngay), p.tuanDen) - p.tuanTu + 1;
  if (t <= 0) return 0;
  const tong = soBaiPhan(p), keHoach = tong * t / (p.tuanDen - p.tuanTu + 1);
  return Math.max(0, Math.min(tong, Math.round(keHoach + LECH_PC[p.id])));
}
function baiTheoKH(p, ngay) {
  const t = Math.min(tuanCua(ngay), p.tuanDen) - p.tuanTu + 1;
  if (t <= 0) return 0;
  return Math.round(soBaiPhan(p) * t / (p.tuanDen - p.tuanTu + 1));
}
/* «chậm» = lệch từ hơn MỘT TUẦN nội dung trở lên. Ngưỡng này là của `M5.1`
   tab Tiến độ (cảnh báo lệch tiến độ), ⛔ không phải một ngưỡng mới của báo cáo. */
function chamTuan(p, ngay) {
  const bai1Tuan = soBaiPhan(p) / (p.tuanDen - p.tuanTu + 1);
  if (!bai1Tuan) return 0;
  return Math.max(0, Math.round((baiTheoKH(p, ngay) - baiDaDay(p, ngay)) / bai1Tuan * 10) / 10);
}

/* ═══════════ ⑧ `M5.2` — GIÁO ÁN (hồ sơ bắt buộc DUY NHẤT của mọi GV) ═══
   🛑 TT 15/2026 Điều 21: hồ sơ bắt buộc của MỌI giáo viên là **kế hoạch bài
   dạy (giáo án)** — CHỈ MỘT LOẠI. Kế hoạch giảng dạy (`M5.1`) KHÔNG phải hồ
   sơ bắt buộc của giáo viên; nó là **kế hoạch dạy học của TỔ chuyên môn**
   theo CV 5512 Phụ lục I, và CV 2613 xác định phụ lục ấy chỉ để tham khảo.
   Vì vậy `CM.07*` đếm HAI VẾ Ở HAI CHỦ THỂ KHÁC NHAU, không gộp — xem
   khai báo mã ở §⑭ và mục C của phiếu.

   Hạn nộp (`M5.2` §5): dẫn xuất từ tuần dự kiến ở PPCT + chu kỳ cấu hình
   của tổ. Quá hạn KHÔNG chặn gì — chỉ hiện đỏ.                            */
const CHU_KY_GA = { 'Tổ Toán — Tin': 'tuan', 'Tổ Ngữ văn': 'tuan', 'Tổ Ngoại ngữ': 'tuan',
  'Tổ Lý — Hóa — Sinh': 'thang', 'Tổ Sử — Địa — GDCD': 'tuan', 'Tổ Thể dục — Nghệ thuật': 'thang' };
/* trạng thái giáo án của một dòng phân công tính tới ngày chốt */
const TL_GA = {};
PC.forEach(function (p) { TL_GA[p.id] = 0.72 + rnd5() * 0.3; });
function gaCua(p, ngay) {
  const phai = baiTheoKH(p, ngay) + 1;                 /* +1: bài của tuần tới đã tới hạn */
  if (phai <= 0) return { phai: 0, soan: 0, chua: 0, quaHan: 0 };
  const soan = Math.min(phai, Math.round(phai * Math.min(1, TL_GA[p.id])));
  const chua = phai - soan;
  /* quá hạn = bài chưa soạn mà hạn đã qua. Bài của tuần tới chưa quá hạn. */
  const quaHan = Math.max(0, chua - (chua > 0 ? 1 : 0));
  return { phai, soan, chua, quaHan };
}

/* ═══════════ ⑨ `M5.3` — DỰ GIỜ ════════════════════════════════════════
   🛑 `M5.3` §1: TT 15/2026 KHÔNG quy định giáo viên phải dự giờ, và đã BỎ sổ
   dự giờ khỏi hồ sơ bắt buộc; định mức cũ 8–10 tiết/năm ĐÃ BỎ. Vì vậy khối
   dự giờ của tab 3 ⛔ KHÔNG có cột định mức, không có chỉ tiêu, không xếp
   hạng, không tô đỏ người dự ít. Chỉ ba con số mô tả.                     */
const LOAI_DG = { danhgia: 'Dự giờ đánh giá', hochoi: 'Dự giờ học hỏi', chuyende: 'Dự giờ theo chuyên đề' };
const DUGIO = []; let DGSEQ = 0;
(function seedDG() {
  const loai = ['danhgia', 'hochoi', 'hochoi', 'chuyende', 'hochoi', 'danhgia'];
  for (let t = 2; t <= TUAN_HIEN_TAI; t++) {
    const n = t % 3 === 0 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const g = GV[Math.floor(rnd5() * GV.length)];
      const p = pcCua(g.id)[0];
      if (!p) continue;
      const nd = [];
      GV.filter(x => x.to === g.to && x.id !== g.id).forEach(function (x) { if (rnd5() < 0.4) nd.push(x.id) });
      DUGIO.push({
        id: 'DG-' + p2(++DGSEQ), tuan: t, ngay: themNgay(tuanBatDau(t), 1 + Math.floor(rnd5() * 4)),
        loai: loai[DGSEQ % loai.length], to: g.to, dt: g.dt,
        gvDay: g.id, lop: p.lop, mon: p.mon, nguoiDu: nd,
        bienBan: rnd5() < 0.82, xepLoai: null
      });
    }
  }
  DUGIO.forEach(function (d) {
    if (d.loai === 'danhgia' && d.bienBan) d.xepLoai = ['Tốt', 'Tốt', 'Khá', 'Đạt'][Math.floor(rnd5() * 4)];
  });
})();

/* ═══════════ ⑩ `M5.4` — SINH HOẠT CHUYÊN MÔN ══════════════════════════
   🔑 Ngược hẳn `M5.3`: ở đây LUẬT BẮT BUỘC. TT 15/2026 Đ.14 — tổ sinh hoạt
   **ít nhất 1 lần / 2 tuần**; Đ.21 k.2 — **Sổ ghi chép hoạt động của tổ là
   hồ sơ bắt buộc duy nhất của tổ chuyên môn**. Nên khối SHCM của tab 3 CÓ
   cột tuân thủ, còn khối dự giờ thì không. Bất đối xứng này là CỐ Ý.
   `M5.4` §4.2: MỌI buổi đã ghi vào sổ đều tính vào tần suất, kể cả đột xuất. */
const SHCM = []; let SHSEQ = 0;
(function seedSH() {
  /* mỗi tổ sinh hoạt 2 tuần/lần; hai tổ CỐ Ý bỏ nhịp để có ca vi phạm tần suất */
  const bo = { 'Tổ Thể dục — Nghệ thuật': [6, 8, 14], 'Tổ Sử — Địa — GDCD': [10] };
  TO.forEach(function (to) {
    for (let t = 2; t <= TUAN_HIEN_TAI; t += 2) {
      if ((bo[to] || []).indexOf(t) >= 0) continue;
      const cm = GV.filter(g => g.to === to && g.cv === 'Tổ trưởng')[0] || GV.filter(g => g.to === to)[0];
      const tk = GV.filter(g => g.to === to && g.cv === 'Tổ phó')[0] || cm;
      const co = GV.filter(g => g.to === to && rnd5() < 0.88).map(g => g.id);
      SHCM.push({
        id: 'SH-' + p2(++SHSEQ), to, tuan: t, ngay: themNgay(tuanBatDau(t), 3),
        hinhThuc: t % 6 === 0 ? 'Nghiên cứu bài học' : (t % 4 === 0 ? 'Chuyên đề' : 'Định kỳ'),
        chuTri: cm.id, thuKy: tk.id, coMat: co,
        daKy: t <= TUAN_HIEN_TAI - 1, daNop: t <= TUAN_HIEN_TAI - 2, daXem: t <= TUAN_HIEN_TAI - 4
      });
    }
  });
})();
/* chu trình Nghiên cứu bài học — `M5.4` §5. Chỉ tiêu 2 bài/môn/năm là GỢI Ý
   (CV 4069 dùng chữ «nên xây dựng»), ⛔ không phải định mức: màu trung tính. */
const NCBH = [

CT.nguonSo('CM.01', function (tham, o) {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  const ds = PC.filter(function (p) {
    return pvDong({ dt: p.dt, to: toCuaPC(p) }) && (!tham.loc || tham.loc(p))
      && tuanTrong(p, Math.min(tuanCua(ngay), TUAN_NAM));
  });
  if (o === 'khongKH') {
    const oc = [];
    LOP.forEach(function (l) {
      (MON_KHOI[l.khoi] || []).forEach(function (ma) {
        const k = khgdCua(ma, l.khoi);
        if (!pvDong({ dt: l.dt, to: monBy(ma).to })) return;
        if (tham.locLop && !tham.locLop(l, ma)) return;
        if (k.tt === 'khong' || k.tt === 'chuadu')
          oc.push({ id: l.id + ' · ' + monBy(ma).ten, ten: l.id + ' · ' + monBy(ma).ten,
            phu: k.tt === 'khong' ? 'Chưa có KHGD nào cho Môn × Khối này' : 'Có KHGD nhưng KHGD thiếu số tiết', so: '' });
      });
    });
    return { giaTri: oc.length, banGhiGoc: oc };
  }
  const ve = p => ({ id: p.id, ten: p.lop + ' · ' + monBy(p.mon).ten + (monBy(p.mon).pt === 'PT0' ? '' : ' — ' + p.phan),
    phu: (gvBy(p.gv) || { ten: '—' }).ten + ' · tuần ' + p.tuanTu + '–' + p.tuanDen
      + (p.loaiPhan === 'Bàn giao' ? ' · 🤝 bàn giao' : ''),
    so: baiDaDay(p, ngay) + '/' + baiTheoKH(p, ngay) + ' bài' });
  if (o === 'luot') return { giaTri: ds.length, banGhiGoc: ds.map(ve) };
  if (o === 'baiKH') return { giaTri: ds.reduce((a, p) => a + baiTheoKH(p, ngay), 0), banGhiGoc: ds.map(ve) };
  if (o === 'baiDay') return { giaTri: ds.reduce((a, p) => a + baiDaDay(p, ngay), 0), banGhiGoc: ds.map(ve) };
  if (o === 'cham') { const c = ds.filter(p => chamTuan(p, ngay) > 1); return { giaTri: c.length, banGhiGoc: c.map(ve) } }
  const kh = ds.reduce((a, p) => a + baiTheoKH(p, ngay), 0);
  const da = ds.reduce((a, p) => a + baiDaDay(p, ngay), 0);
  return { giaTri: tile(da, kh), banGhiGoc: ds.map(ve),
    veTrai: { ten: 'Số bài đã dạy', giaTri: da, donVi: 'bài' },
    vePhai: { ten: 'Số bài lẽ ra đã dạy tới ngày chốt', giaTri: kh, donVi: 'bài' } };
});

CT.nguonSo('CM.06', function (tham, o) {
  const tu = tham.tuNgay, den = tham.denNgay > HOMNAY ? HOMNAY : tham.denNgay;
  /* mẫu số dựng từ mẫu tuần: Σ tiết/tuần các dòng phân công có hiệu lực × số tuần */
  const ds = PC.filter(p => pvDong({ dt: p.dt, to: toCuaPC(p) }) && (!tham.loc || tham.loc(p)));
  let kh = 0;
  TUAN.forEach(function (t) {
    if (t.den < tu || t.tu > den) return;
    ds.forEach(function (p) { if (tuanTrong(p, t.so)) kh += p.tietTuan });
  });
  kh = Math.round(kh);
  const ah = ahTrongKhoang(tu, den, x => pvDong(x) && (!tham.locAH || tham.locAH(x)));
  const huy = ah.filter(x => x.tt === 'huy' && x.cachXL === 'Sẽ dạy bù');
  const khongDay = ah.filter(x => x.tt === 'huy').length + ah.filter(x => x.tt === 'chuaxep' && x.ngay < HOMNAY).length;
  const td = Math.max(0, kh - khongDay);
  if (o === 'keHoach') return { giaTri: kh, banGhiGoc: [] };
  if (o === 'thucDay') return { giaTri: td, banGhiGoc: [] };
  if (o === 'huyChuaBu') return { giaTri: huy.length,
    banGhiGoc: huy.map(x => ({ id: x.id, ten: x.lop + ' · ' + monBy(x.mon).ten, phu: k2s(x.ngay) + ' · ' + x.cachXL, so: '1 tiết' })) };
  return { giaTri: tile(td, kh), banGhiGoc: [],
    veTrai: { ten: 'Tiết thực dạy', giaTri: td, donVi: 'tiết' },
    vePhai: { ten: 'Tiết theo kế hoạch (đã qua giờ)', giaTri: kh, donVi: 'tiết' } };
});

CT.nguonSo('CM.04', function (tham, o) {

  const ngC = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  if (!kyDaChot(B1).some(k => CHOT[B1.id][k.ma].d <= ngC))
    return { giaTri: null, banGhiGoc: [], ghiChu: 'Tại ngày chốt ' + k2s(ngC) + ' chưa có kỳ KPI nào đã chốt — kỳ đầu tiên chốt ngày '

  const ds = GV.filter(g => pvNguoi(g) && (!tham.loc || tham.loc(g)));
  const nh = tham.nhom || null;              /* lọc theo một nhóm tiêu chí của bộ KPI */
  function diemNhom(g) {
    const k = DIEM_KPI[g.id];
    if (!nh) return k;
    let dat = 0, mauCo = 0, chua = 0;
    k.chiTiet.forEach(function (c) {
      if (!c.ap || c.n.ten !== nh) return;
      if (c.d == null) { chua++; return }
      dat += c.d; mauCo += c.t.ts;
    });
    return { diem: Math.round(dat * 10) / 10, mauCo, chuaCham: chua,

  }
  const ve = g => { const k = diemNhom(g);
    return { id: g.id, ten: g.ten, phu: g.to + ' · hạng ' + g.hang + (g.cv ? ' · ' + g.cv : '')
      + (DIEM_KPI[g.id].coSua ? ' · ✎ có ô đã sửa khác số máy' : ''),

      + kyDaChot(B1).map(k => k.t).join(' · ') + '</b> — kỳ duy nhất đã chốt tại ngày chốt của báo cáo.' };

    return {
      giaTri: Object.keys(em).length,

    };
  }
  if (o === 'chuaTungThamGia') {
    const hs = HS_NK.filter(x => trongPV(x) && (!tham.loc || tham.loc(x)));
    const daHoc = {};
    dks.forEach(d => { if (d.ngayDK <= chot) daHoc[d.hs] = 1 });
    const chua = hs.filter(x => !daHoc[x.id]);
    return {
      giaTri: chua.length,
      banGhiGoc: chua.slice(0, 60).map(x => ({
        id: x.id, ten: 'Lớp ' + x.lop + ' · em ' + x.id.split('#')[1],
        phu: DT[x.dt] + ' · khối ' + x.khoi, so: 'chưa có lượt nào'
      }))

    return { giaTri: ds.length, banGhiGoc: ds.slice(0, 60).map(veDK) };
  }
  if (o === 'khoaDaMo') {
    const ks = KHOA_NK.filter(k => !k.huy && trongPV(k) && k.tu <= den && k.den >= tu
      && (!tham.locKhoa || tham.locKhoa(k)));

/* suất ăn KTX — ba bữa ngày thường; Chủ nhật chỉ bữa Tối và CHỈ TỪ THÁNG 10
   (cấu hình bữa theo tuần có phiên bản — `M6.10` §10.4) */
function ktxSoBua(k) { return thuSo(k) === 1 ? (k >= '2026-10-01' ? 1 : 0) : 3 }
function ktxAn(k) {
  const bua = ktxSoBua(k);
  if (!bua || k < KTX_MOC || k > HOMNAY) return null;
  const em = PHONG_KTX.reduce((a, p) => a + ktxSoDangO(p, k), 0);
  const tong = em * bua;
  const coPhep = gieo(k + 'ap', Math.max(2, Math.round(tong / 12)));
  const khongPhep = gieo(k + 'ak', 4);
  const chuaDD = gieo(k + 'ad', 26) === 0 ? gieo(k + 'ad2', 7) + 1 : 0;
  return { tong, daAn: tong - coPhep - khongPhep - chuaDD, coPhep, khongPhep, chuaDD };
}

   trước ngày đó và ⛔ không tính vào số cuốn tối đa (`M6.19` §3.8). */
const LUOT_TV = [];
(function seedLuot() {
  chuoiNgay(TV_MOC, HOMNAY).filter(NGAY_HOC).forEach(k => {
    KHO_DT.forEach(kh => {
      const nam = k <= '2026-09-30' && kh.kho === 'SGK';
      const n = nam ? 12 + gieo(k + kh.id, 14) : kh.kho === 'SGK' ? 0 : 1 + gieo(k + kh.id, 4);
      for (let i = 0; i < n; i++) {
        const ns = gieo(k + kh.id + i + 'bd', 100) < (kh.kho === 'SNV' ? 92 : 11);
        const loaiMuon = (kh.kho === 'SGK' || kh.kho === 'SNV') ? 'nam' : 'thuong';
        const han = loaiMuon === 'nam' ? '2027-05-22' : themNgay(k, 14);
        const g = gieo(k + kh.id + i + 'tr', 100);
        /* lượt thường: phần lớn đã trả; một ít còn mở; rất ít báo mất */
        const traSau = 3 + gieo(k + kh.id + i + 'd', 18);
        const daTra = loaiMuon === 'thuong' && g < 88 && themNgay(k, traSau) <= HOMNAY;
        LUOT_TV.push({
          id: 'LM-' + p2(LUOT_TV.length + 1), kho: kh.id, dt: kh.dt, loaiKho: kh.kho,
          bd: ns ? 'ns' : 'hs', loaiMuon, ngay: k, han,
          ngayTra: daTra ? themNgay(k, traSau) : null,
          mat: !daTra && loaiMuon === 'thuong' && g >= 99
        });
      }
    });
  });
})();
const tvDangMuon = (l, ngay) => l.ngay <= ngay && (!l.ngayTra || l.ngayTra > ngay) && !l.mat;
const tvQuaHan = (l, ngay) => tvDangMuon(l, ngay)
  && themNgay(l.han, TV_NGUONG_QUAHAN.ngay) < ngay;

   «sao con tôi không được hưởng cái kia» (`M7.4` §4 quy tắc ②).            */
function mgCho(h, ma, goc, sl) {
  const ok = [];
  Object.keys(MG).forEach(k => {

    if (so > goc) so = goc;
    ok.push({ k, ten: m.ten, ns: m.ns, so });

  ok.sort((a, b) => b.so - a.so);

}

   không phải 0).                                                           */

const hatNS = (i, k) => ((i + 1) * 7919 + k * 104729) % 97;

  if (x.trangThai === 'biet_phai_di') return Object.assign(nen, { cd: cd + ' — biệt phái đi, chấm công ở nơi đến',

    ot: gv ? 0 : hatNS(i, 6) % 13, tietKH: tiet, tietGiao: giao, tietThuc: thuc,
    tietVuot: giao == null ? null : Math.max(0, giao - 72)
  });

/* ═══════════ ⑭ NỐI NGUỒN SỐ — phần TÍNH của bảy mã ═════════════════════ */

/* ── công cụ chung: hóa đơn tại ngày chốt ─────────────────────────────── */
const hdSong = o => o.tt !== 'huy';
function hdTaiNgay(tham, loc) {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  return HD.filter(o => hdSong(o) && trongPV(o) && daPhatHanh(o.th, ngay) && (!loc || loc(o)));
}
const hdConNo = o => !o.tuChoi && o.thu < o.phai;
const tuoiNo = (o, ngay) => Math.max(0, soNgay(o.han, ngay));
const daiCua = n => n <= 30 ? 'd0' : n <= 60 ? 'd31' : n <= 90 ? 'd61' : 'd90';
const tenHS = m => { const h = HSC(m); return h ? h.ten : m };
const veHD = o => ({
  id: o.id, ten: tenHS(o.hs) + ' · ' + o.lop,
  phu: (o.ma ? KD(o.ma).ten : 'Hóa đơn gộp — ' + o.dong.length + ' khoản') + ' · ' + o.th
    + ' · hạn ' + k2s(o.han) + (o.loai === 'phu' ? ' · HÓA ĐƠN PHỤ' : '') + (o.tuChoi ? ' · đã từ chối đóng (hợp lệ)' : ''),
  so: vnd(o.phai) + (o.thu < o.phai ? ' · đã thu ' + vnd(o.thu) : ' · đủ')
});

CT.nguonSo('TC.01', (tham, o) => {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  if (o === 'thuTrongKhoang' || o === 'gdTrongKhoang') {
    const tu = tham.tuNgay, den = tham.denNgay > HOMNAY ? HOMNAY : tham.denNgay;
    const g = GD.filter(x => x.hd && trongPV(gdPV(x)) && x.ngay >= tu && x.ngay <= den
      && (!tham.loc || tham.loc(x)));
    return {
      giaTri: o === 'gdTrongKhoang' ? g.length : g.reduce((a, x) => a + x.so, 0),
      banGhiGoc: g.map(veGD)
    };
  }
  const ds = hdTaiNgay(tham, tham.loc);
  if (o === 'soHoaDon') return { giaTri: ds.length, banGhiGoc: ds.map(veHD) };
  if (o === 'soChungTu') {
    const g = GD.filter(x => x.hd && ds.some(h => h.id === x.hd));
    return { giaTri: g.length, banGhiGoc: g.map(veGD) };
  }
  if (o === 'tienDaNhan') {
    const g = GD.filter(x => trongPV(gdPV(x)) && x.ngay <= ngay);
    return {
      giaTri: g.reduce((a, x) => a + x.so, 0), banGhiGoc: g.map(veGD),
      ghiChu: 'Gồm <b>' + g.filter(x => !x.hd).length + ' giao dịch chưa khớp</b> — chưa gắn được vào hóa đơn nào.'
    };
  }
  if (o === 'soEmConNo') {
    const em = {}; ds.filter(hdConNo).forEach(x => { em[x.hs] = (em[x.hs] || 0) + (x.phai - x.thu) });
    const ks = Object.keys(em);
    return {
      giaTri: ks.length,
      banGhiGoc: ks.map(k => ({ id: k, ten: tenHS(k), phu: (HSC(k) || {}).lop || '', so: vnd(em[k]) }))
    };
  }
  const v = o === 'daThu' ? ds.reduce((a, x) => a + x.thu, 0)
    : o === 'conNo' ? ds.filter(hdConNo).reduce((a, x) => a + (x.phai - x.thu), 0)
      : ds.reduce((a, x) => a + (x.tuChoi ? 0 : x.phai), 0);
  const ve = o === 'conNo' ? ds.filter(hdConNo) : ds;
  return { giaTri: v, banGhiGoc: ve.map(veHD) };
});
const gdPV = x => ({ dt: x.dt, lop: x.hs ? (HSC(x.hs) || {}).lop : null });
const veGD = x => ({
  id: x.id, ten: x.hd ? (tenHS(x.hs) + ' · ' + x.hd) : '⚠ CHƯA KHỚP — ' + x.noi,
  phu: k2s(x.ngay) + ' · ' + (x.pt === 'mat' ? 'tiền mặt' : 'SePay') + ' · ' + x.by + (x.ly ? ' · ' + x.ly : ''),
  so: vnd(x.so)
});

CT.nguonSo('TC.02', tham => {
  const ds = hdTaiNgay(tham, tham.loc).filter(x => !x.tuChoi);
  const phai = ds.reduce((a, x) => a + x.phai, 0), thu = ds.reduce((a, x) => a + x.thu, 0);
  return {
    giaTri: tile(thu, phai),
    veTrai: { ten: 'Đã thu', giaTri: thu, donVi: 'đồng' },
    vePhai: { ten: 'Phải thu', giaTri: phai, donVi: 'đồng' },
    ghiChu: 'Cộng <b>tử số</b> và <b>mẫu số</b> của ' + ds.length + ' hóa đơn rồi mới chia.',
    banGhiGoc: ds.filter(hdConNo).map(veHD)
  };
});

CT.nguonSo('TC.05', (tham, o) => {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  const ds = hdTaiNgay(tham, tham.loc).filter(hdConNo);
  if (o === 'soEm') {
    const em = {}; ds.forEach(x => { em[x.hs] = 1 });
    return { giaTri: Object.keys(em).length, banGhiGoc: ds.map(x => veTuoi(x, ngay)) };
  }
  if (o === 'tuoiLonNhat') {
    const t = ds.map(x => tuoiNo(x, ngay));
    return {
      giaTri: t.length ? Math.max.apply(null, t) : null,
      banGhiGoc: ds.slice().sort((a, b) => tuoiNo(b, ngay) - tuoiNo(a, ngay)).map(x => veTuoi(x, ngay))
    };
  }
  const loc = o ? ds.filter(x => daiCua(tuoiNo(x, ngay)) === o) : ds;
  return { giaTri: loc.reduce((a, x) => a + (x.phai - x.thu), 0), banGhiGoc: loc.map(x => veTuoi(x, ngay)) };
});
const veTuoi = (o, ngay) => ({
  id: o.id, ten: tenHS(o.hs) + ' · ' + o.lop,
  phu: (o.ma ? KD(o.ma).ten : 'Hóa đơn gộp') + ' · ' + o.th + ' · hạn ' + k2s(o.han)
    + ' · quá <b>' + tuoiNo(o, ngay) + ' ngày</b>',
  so: vnd(o.phai - o.thu)
});

CT.nguonSo('TC.03', (tham, o) => {
  const ds = hdTaiNgay(tham, tham.loc);
  const dong = ds.reduce((a, x) => a.concat(x.dong.filter(d => d.mg)), []);
  if (o === 'soEm') {
    const em = {}; dong.forEach(d => { em[d.hs] = 1 });
    const ks = Object.keys(em);
    return { giaTri: ks.length, banGhiGoc: ks.map(k => ({ id: k, ten: tenHS(k), phu: (HSC(k) || {}).lop + ' · ' + ((HSC(k) || {}).dien || []).join(', '), so: vnd(dong.filter(d => d.hs === k).reduce((a, d) => a + d.mgSo, 0)) })) };
  }
  if (o === 'soLuotDien') {
    const luot = [];
    dong.forEach(d => { const h = HSC(d.hs); (h.dien || []).forEach(x => luot.push({ hs: d.hs, dien: x })) });
    const u = {}; luot.forEach(x => { u[x.hs + '|' + x.dien] = x });
    const ks = Object.keys(u);
    return { giaTri: ks.length, banGhiGoc: ks.map(k => ({ id: k, ten: tenHS(u[k].hs), phu: u[k].dien, so: '1 lượt' })) };
  }
  if (o === 'soKepTran') {
    const kt = dong.filter(d => d.mg && MG[d.mg.k].kieu === 'ngay' && d.mg.so >= d.goc);
    return { giaTri: kt.length, banGhiGoc: kt.map(veMG) };
  }
  return { giaTri: dong.reduce((a, d) => a + d.mgSo, 0), banGhiGoc: dong.map(veMG) };
});
const veMG = d => ({
  id: d.hs + '|' + d.ma + '|' + d.th, ten: tenHS(d.hs) + ' · ' + d.lop,
  phu: KD(d.ma).ten + ' · ' + d.th + ' · ' + (d.mg ? d.mg.ten : '—')
    + (d.mgBo && d.mgBo.length ? ' · bỏ: ' + d.mgBo.map(x => x.ten + ' (' + vnd(x.so) + ')').join(', ') : ''),
  so: vnd(d.mgSo) + ' / gốc ' + vnd(d.goc)
});

/* 🔒 `HDDL` (`V22`) — `HS.06` đọc HỌC SINH của `M1.1` · `M1.2` trong `DLC`, CÙNG tập
   với `M9.8` tab 4: em đang học tại ngày chốt × diện ĐÃ xác nhận tới ngày ấy.
   ⚠ Sổ hóa đơn của tab 1–3 (`HS` mục ⑤, 30 em chép từ `M7.2`) CHƯA nối `DLC`
   — nên `TC.03` còn đếm trên 30 em ấy (mục E của phiếu `V22`).              */
const HS_DLC = DLC.hocSinh.map(x => ({ ma: x.ma, ten: x.ten, lop: x.lop || '', dt: x.dt, k: x.khoi,
  vaoNgay: x.vaoNgay, roiNgay: x.roiNgay, sk: x.suKien, dien: x.dien }));
const dangHocDLC = (h, ngay) => {
  if (!(h.vaoNgay <= ngay)) return false;
  if (h.roiNgay && h.roiNgay <= ngay) return false;
  const bl = h.sk.find(s => s[0] === 'baoluu');
  if (bl && bl[1] <= ngay) { const tn = h.sk.find(s => s[0] === 'tainhap'); if (!(tn && tn[1] <= ngay)) return false }
  return true;
};
CT.nguonSo('HS.06', (tham, o) => {
  const ng = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  const dienTai = h => h.dien.filter(d => d.xacNhan && d.xacNhan <= ng).map(d => d.ten);
  const ds = HS_DLC.filter(h => trongPV(h) && dangHocDLC(h, ng) && (!tham.loc || tham.loc(h)));
  /* V21 (21/9): giá trị chính = LƯỢT DIỆN (em × diện) · số em ở ô `soEm` — định nghĩa của M9.8 (nh9 §2.11) */
  if (o === 'soEm') {
    const co = ds.filter(h => dienTai(h).length);
    return { giaTri: co.length, banGhiGoc: co.map(h => ({ id: h.ma, ten: h.ten, phu: h.lop + ' · ' + dienTai(h).join(', '), so: dienTai(h).length + ' diện' })) };
  }
  const luot = [];
  ds.forEach(h => dienTai(h).forEach(d => { if (!tham.dien || d === tham.dien) luot.push({ h, d }) }));

    if (ng !== 'm112') return { giaTri: null, canhBao: { ma: 'KHONG_AP_DUNG', chu: 'cấp tỉnh — đã LÀ đội tuyển' } };

  if (ng === 'm111') {
    const ds = m111DsOn(mon);
    return {
      giaTri: ds.length,
      banGhiGoc: xemEm() ? ds.map(h => ({ id: h, ten: M111_HS[h][0], phu: M111_HS[h][1], so: '' })) : [],

CT.nguonSo('OL.04', (tham, o) => {

  const moc = tham.chotNgay;

  ls.forEach(l => {

    (l.buoi || []).forEach((b, i) => {
      const ngay = ng === 'm111' ? b[1] : b[0], dd = ng === 'm111' ? b[2] : b[1];
      const so = ng === 'm111' ? b[0] : i + 1;
      if (!ngay) { chuaXep++; return }
      if (dd) {

CT.nguonSo('OL.05', (tham, o) => {
  const ng = tham.ng, mon = tham.mon;

  if (o === 'dauVao') {
    if (ng !== 'm112') return { giaTri: null, canhBao: { ma: 'KHONG_AP_DUNG', chu: ng === 'm113' ? 'Sở triệu tập — không thi đầu vào' : 'không áp dụng' } };
    const ls = m112LopCua(tham.nam, mon).filter(l => l.vao === 'thi');
    if (!ls.length) return { giaTri: null, canhBao: { ma: 'KHONG_AP_DUNG', chu: 'GV thêm trực tiếp — không thi đầu vào' } };
    let du = 0, chon = 0, chuaChot = 0; const bg = [];
    ls.forEach(l => {

  if (o === 'dau' || o === 'cuoi') {

      const k = chenhGhepCap(A, B);

        const a = A[i], b = B[i], h = l.hs[i];
        if (a != null && b != null) { s += b - a; n++ }
        const ly = a == null && b != null ? '— chưa có điểm lần đầu'

/* ── `KQ.08` — thành tích, chỉ đếm ĐÃ ĐỐI CHIẾU ───────────────────────── */

   CÔNG THỨC CỦA MENU CHỦ trên DỮ LIỆU CỦA MENU CHỦ — cùng cơ chế `M0.1` (`5A`).
   Trước mỗi lần đọc: đặt vai + điểm trường của người đang xem vào mọi bản chép
   (`NGUON.datVai` — luật `noiVai()` của app.40: vai Điểm trường đọc bằng vai
   Đủ quyền của menu chủ, cắt đúng điểm trường ấy — y như `M0.1`).
   Bốn chỗ menu chủ KHÔNG trả lời được câu của thẻ ⇒ ô TRỐNG kèm lý do,
   ⛔ không tự viết lại công thức, ⛔ không lùi về số toàn trường:
     · menu chủ không khai phạm vi cho vai đang xem;
     · menu chủ không cắt theo điểm trường mà người xem đang ở một điểm trường;
     · menu chủ bắt buộc tham số mà thẻ không có (`KQ.08` cần cấp thi × môn);
     · menu chủ đếm theo THÁNG (`NS.05`) mà khoảng vắt qua hai tháng.        */
const THAM_BAT_BUOC = {
  'KQ.08': { can: ['cap', 'mon'], chu: 'M9.12 chỉ đếm theo cấp thi × môn',
    ghi: '<b>M9.12</b> đếm lượt đạt giải theo <b>từng cấp thi × từng môn</b> và ⛔ <b>không có tổng toàn trường</b> '
      + '(cộng giải cấp trường với giải cấp tỉnh là cộng hai thước đo khác nhau). Xem bảng đủ ở <b>M9.12</b> tab Thành tích HSG.' }
};
const DEM_THEO_THANG = { 'NS.05': 'M9.4' };
function docMa(ma, tham, o) {
  const menu = NGUON.menuCua(ma);
  if (!menu) return CT.doc(ma, tham, o);                  /* mã của chính M9.1 */
  const dt = dtHieuLuc();
  NGUON.datVai(role, dt, R().sc);
  const trong = (maCB, chu, ghi) => Object.assign(CT.doc(ma, tham, o), {
    giaTri: null, banGhiGoc: [], veTrai: null, vePhai: null, canhBao: { ma: maCB, chu: chu }, ghiChu: ghi
  });
  const p = NGUON.phamVi(menu);
  if (!p) return trong('MENU_CHU_KHONG_KHAI_VAI', menu + ' không khai phạm vi cho vai này',
    '<b>' + menu + '</b> không khai phạm vi cho vai đang xem — ô ⛔ không hiện số, ⛔ không lùi về số toàn trường.');
  if (!p.boChon && dt !== 'ALL') return trong('KHONG_CAT_THEO_DIEM_TRUONG', 'không cắt theo điểm trường',
    '<b>' + menu + '</b> không có chiều điểm trường — ⛔ không điền số toàn trường vào ô của một điểm trường.');
  const bb = THAM_BAT_BUOC[ma];
  if (bb && bb.can.some(k => tham[k] == null)) return trong('MENU_CHU_CAN_THAM_SO', bb.chu, bb.ghi);
  if (DEM_THEO_THANG[ma] && !tham.thang) {
    const a = tham.tuNgay.slice(0, 7), b = capNgay(tham.denNgay).slice(0, 7);
    if (a !== b) return trong('MENU_CHU_DEM_THEO_THANG', DEM_THEO_THANG[ma] + ' đếm theo tháng',
      '<b>' + DEM_THEO_THANG[ma] + '</b> đếm theo <b>tháng</b>; khoảng đang xem vắt qua hai tháng — chọn khoảng trong một tháng.');
    const r = CT.doc(ma, Object.assign({}, tham, { thang: a }), o);
    return Object.assign({}, r, { ghiChu: (r.ghiChu ? r.ghiChu + '<br>' : '') + '<b>' + DEM_THEO_THANG[ma]
      + '</b> đếm theo <b>tháng</b> — số của cả tháng <b>' + a.slice(5) + '/' + a.slice(0, 4) + '</b>.' });
  }
  return CT.doc(ma, tham, o);
}

function veThe(t) {
  const tham = t.ps ? PV.thamSoPS() : PV.thamSo();
  const thamT = t.ps ? thamSoTruocKhoang() : thamSoTruocChot();
  const cot = [
    { khoa: 'nay', ten: 'Kỳ này', kieu: t.kieu, nguon: t.nguon, donVi: t.kieu === 'tien' ? 'triệu đ' : '' },
    { khoa: 'truoc', ten: 'Kỳ trước', kieu: t.kieu, nguon: t.nguon, khongCong: true },
    {
      khoa: 'lech', ten: '± so kỳ trước', kieu: 'tile', nguon: t.nguon, khongCong: true,
      canhBao: k => k.giaTri != null && Math.abs(k.giaTri) > NGUONG_LECH
    }
  ];
  return KB.bang({
    id: 'the_' + t.id, tieuDe: t.ten, ma: t.ma, khuon: 'K1', tong: false,
    moTaKy: (t.ps ? PV.moTaKhoang() : PV.moTaChot()) + ' · ' + moTaTruoc(t.ps),
    tenCotDau: 'Phạm vi', cot: cot,
    dong: [{ id: t.id, ten: tenPhamVi() }],
    link: () => ({ menu: t.menu, ctx: t.ctx || '', nhan: (F_NGUON[t.nguon] || {}).ten }),
    o: (d, c) => {
      const nay = docMa(t.ma, tham, t.o);
      if (c.khoa === 'nay') return nay;
      /* ★ BẢN CHIẾU KHÔNG MANG CHIỀU THỜI GIAN thì ⛔ KHÔNG được in lại con
         số của kỳ này vào ô «kỳ trước». Ba chỉ tiêu mang cờ `khongLichSu` được menu
         chủ giữ ở dạng «tại lúc xem» — `M9.1` chiếu sang thì chỉ có MỘT mốc.
         🔄 V23: học phí (`TC.01`) và dạy thay (`TK.04`) BỎ cờ — công thức của
         menu chủ (bản chép `M9.7` · `M9.5`) có lịch sử theo ngày chốt / khoảng.
         In cùng một số vào hai cột rồi tính ±% = 0% là nói với người đọc
         rằng «tháng này y hệt tháng trước», trong khi sự thật là hệ thống
         KHÔNG BIẾT tháng trước. Đúng cái bệnh §1 của chính menu này.       */
      if (t.khongLichSu) {
        return Object.assign({}, nay, {
          ten: (c.khoa === 'truoc' ? 'Kỳ trước — ' : '± so kỳ trước — ') + nay.ten,
          giaTri: null, banGhiGoc: [], veTrai: null, vePhai: null,
          ghiChu: 'Bản chiếu của <b>' + t.khongLichSu + '</b> hiện chỉ có <b>một mốc</b> — '
            + 'nó trả lời «tại lúc xem», ⛔ không giữ lịch sử theo kỳ. '
            + '⛔ Chép lại số của kỳ này vào ô này là nói rằng kỳ trước cũng thế, '
            + 'trong khi hệ thống <b>không biết</b>.',
          canhBao: { ma: 'KHONG_CO_LICH_SU', chu: 'chưa có mốc kỳ trước' }
        });
      }
      const truoc = docMa(t.ma, thamT, t.o);
      if (c.khoa === 'truoc') return truoc;
      return oLech(nay, truoc, t);
    }
  });
}

function veTab1() {
  let h = veChiMuc();
  h += PV.chotNgay() + PV.khoang() + PV.daiCanhBao() + daiPV();
  h += '<div class="theluoi">' + THE.map(veThe).join('') + '</div>';
  return h + dnote('Mười hai thẻ này ⛔ <b>không cộng được với nhau</b> — mười hai đơn vị khác nhau, '
    + 'và ba trong số đó là tỉ lệ. Thẻ đặt cạnh nhau để đọc MỘT TRANG, ⛔ không phải để ghép thành một điểm số của trường. '
    + 'Mỗi thẻ mang <b>±% so kỳ trước</b> vì <i>«một con số trần trụi không giúp ra quyết định»</i> (<code>nh9</code> §9): '
    + '<b>412 học sinh</b> không nói gì, <b>412 · −3,1% so tháng trước</b> thì nói.<br>'
    + 'Cờ bất thường ⛔ <b>không phải lời phán</b>. Sự kiện đã tổ chức giảm 100% trong tháng thi cuối kỳ là <b>đúng lịch</b>, '
    + 'không phải một sự cố — cờ chỉ nói «chỗ này khác thường, hỏi thêm đi».');
}

/* ══════════════ TAB 2 · 🏫 SO SÁNH ĐIỂM TRƯỜNG ════════════════════════
   Khuôn K2 — dòng = điểm trường, cột = 10 chỉ tiêu cùng kỳ.
   🛑 HAI CỘT CUỐI là chỉ tiêu TOÀN TRƯỜNG (biên chế được giao · tỉ lệ
   GV/lớp). Chúng ⛔ KHÔNG cắt được theo điểm trường — «biên chế của Điểm
   trường A» là một con số không tồn tại. Ô để TRỐNG KÈM GHI CHÚ, ⛔ không
   điền số toàn trường vào ô của một điểm trường.                          */
const COT_SS = [
  { khoa: 'si_so', ten: 'Sĩ số', donVi: 'học sinh', kieu: 'so', ma: 'HS.01', ps: 0, nguon: 'm1.1.ho_so_hoc_sinh' },
  { khoa: 'chuyen_can', ten: 'Chuyên cần', kieu: 'tile', ma: 'CC.01', ps: 1, nguon: 'm2.9.diem_danh', khongCong: true },
  { khoa: 'so_dau_bai', ten: 'Ghi sổ đầu bài', kieu: 'tile', ma: 'CC.04', ps: 1, nguon: 'm2.2.so_dau_bai', khongCong: true },
  { khoa: 'day_thay', ten: 'Tiết chưa xếp dạy thay', donVi: 'tiết', kieu: 'so', ma: 'TK.04', o: 'chuaXep', ps: 1, nguon: 'm4.7.giao_vien_vang', canhBao: k => k.giaTri > 0 },
  { khoa: 'con_no', ten: 'Còn nợ khoản thu', donVi: 'triệu đ', kieu: 'tien', ma: 'TC.01', o: 'conNo', ps: 0, nguon: 'm7.2.so_khoan_thu' },
  { khoa: 'ho_so_thieu', ten: 'Hồ sơ thiếu giấy tờ', donVi: 'hồ sơ', kieu: 'so', ma: 'HS.15', ps: 0, nguon: 'm1.1.ho_so_hoc_sinh', canhBao: k => k.giaTri > 0 },
  { khoa: 'ma_tam', ten: 'Hồ sơ mã tạm', donVi: 'hồ sơ', kieu: 'so', ma: 'HS.16', ps: 0, nguon: 'm10.8.dong_bo_csdl', canhBao: k => k.giaTri > 0 },
  { khoa: 'su_kien', ten: 'Sự kiện đã tổ chức', donVi: 'sự kiện', kieu: 'so', ma: 'VH.06', ps: 1, nguon: 'm6.8.su_kien' },
  { khoa: 'bien_che', ten: 'Biên chế được giao', donVi: 'người', kieu: 'so', ma: 'NS.01', o: 'giao', ps: 0, nguon: 'm4.1.ho_so_nhan_su', toanTruong: true, khongCong: true },
  { khoa: 'gv_lop', ten: 'Tỉ lệ GV / lớp', kieu: 'ngay', ma: 'NS.03', ps: 0, nguon: 'm4.1.ho_so_nhan_su', toanTruong: true, khongCong: true }
];
const KHONG_CAT = {
  ma: 'KHONG_CAT_THEO_DIEM_TRUONG',
  chu: 'không cắt theo điểm trường'
};
function veTab2() {
  let h = PV.chotNgay() + PV.khoang() + PV.daiCanhBao() + daiPV();
  const dsDT = Object.keys(DT).filter(trongPVm);
  const dong = dsDT.map(m => ({ id: m, ten: DT[m] }));
  const docO = (m, c) => {
    const them = { loc: null };
    /* cắt theo điểm trường bằng cách đổi phạm vi hiệu lực của chính hàm TÍNH */
    const cu = ST.dt, cuR = R().dt;
    ST.dt = m; if (laBranch()) R().dt = m;
    let k;
    try { k = docMa(c.ma, c.ps ? PV.thamSoPS() : PV.thamSo(), c.o) }
    finally { ST.dt = cu; if (laBranch()) R().dt = cuR }
    return k;
  };
  h += KB.K2({
    id: 'ss', tieuDe: 'Mười chỉ tiêu × điểm trường — cùng một kỳ', chip: 'TON',
    moTaKy: PV.moTaChot() + ' · phát sinh ' + PV.moTaKhoang(),
    tenCotDau: 'Điểm trường', cot: COT_SS, dong: dong, gomNhom: false,
    link: d => ({ menu: 'M10.2', ctx: 'tab=diem_truong&dt=' + d.id, nhan: 'Thông tin trường' }),
    o: (d, c) => {
      if (c.toanTruong) return Object.assign(CT.doc(c.ma, PV.thamSo(), c.o), { giaTri: null, banGhiGoc: [], canhBao: KHONG_CAT });
      return docO(d.id, c);
    },
    tongRieng: c => {
      if (c.toanTruong) {
        if (laBranch()) return Object.assign(CT.doc(c.ma, PV.thamSo(), c.o), { giaTri: null, banGhiGoc: [], canhBao: KHONG_CAT });
        return CT.doc(c.ma, PV.thamSo(), c.o);
      }
      /* 🔄 V23: cột đọc bản chép ⇒ dòng Tổng = số của MENU CHỦ trên cả phạm vi, ⛔ không cộng hai dòng
         (sự kiện toàn trường nằm ở cả hai dòng điểm trường — cộng lại là đếm hai lần) */
      if (c.kieu === 'tile' || c.kieu === 'ngay' || NGUON.menuCua(c.ma)) {
        const cu = ST.dt; ST.dt = laBranch() ? R().dt : 'ALL';
        let k; try { k = docMa(c.ma, c.ps ? PV.thamSoPS() : PV.thamSo(), c.o) } finally { ST.dt = cu }
        return k;
      }
      return null;
    },
    duoiBang: '<div class="ro">Hai cột cuối là chỉ tiêu <b>toàn trường</b>, ⛔ không cắt theo điểm trường'
      + (laBranch() ? ' — kể cả dòng Tổng.' : '.') + '</div>'
  });
  return h + dnote('Hai cột cuối để trống vì <b>«biên chế của Điểm trường A» là một con số không tồn tại</b>: '
    + 'biên chế giao cho pháp nhân trường, và giáo viên dạy chéo điểm trường nên ⛔ không có cách chia nào đúng. '
    + 'Điền số toàn trường vào ô của một điểm trường thì người đọc cộng hai dòng lại và ra gấp đôi.<br>'
    + 'Bảng này so <b>các điểm trường với nhau</b>, ⛔ không xếp hạng chúng. '
    + 'Hai điểm trường khác nhau về quy mô, về cơ cấu lớp và về người — một cột «hạng» ở đây '
    + 'sẽ được đọc thành lời phán về người phụ trách, trong khi con số thật chỉ nói về hoàn cảnh.<br>'
    + 'Cột tỉ lệ ⛔ <b>không cộng dọc</b>: dòng Tổng của hai cột tỉ lệ tính lại trên <b>cả tập</b> '
    + '(cộng tử số và mẫu số rồi mới chia), ⛔ không lấy trung bình hai dòng.');
}

/* ══════════════ TAB 3 · 🛡 CHẤT LƯỢNG DỮ LIỆU TOÀN HỆ THỐNG ═══════════
   Khuôn K1 — dòng = MỘT LOẠI THIẾU SÓT. Đây là báo cáo về chính DỮ LIỆU,
   không phải về học sinh hay về người.
   ★ Tab này là NGUỒN VIỆC cho `M0.2`, nhưng ticket mang `feature` nguồn là
   MENU CHỦ, ⛔ không phải `M9.1` — vì `M9.1` không có một ô quyền nào để
   sửa. Vào tab con «Việc của tôi», ⛔ không phải «Chờ tôi duyệt»: không ai
   DUYỆT một hồ sơ thiếu giấy khai sinh. Đóng việc là DẪN XUẤT khi bản ghi
   hết thiếu sót, ⛔ không có nút «Hoàn thành».                            */
const LOAI_THIEU = [
  { id: 'hs_giay', ten: 'Hồ sơ học sinh thiếu giấy tờ bắt buộc', ma: 'HS.15', nguon: 'm1.1.ho_so_hoc_sinh', menu: 'M1.1', ai: 'Văn thư', ctx: 'loc=thieu_giay_to' },
  { id: 'hs_mdd', ten: 'Hồ sơ học sinh còn mã định danh tạm', ma: 'HS.16', nguon: 'm10.8.dong_bo_csdl', menu: 'M10.8', ai: 'Văn thư', ctx: 'tab=4' },
  { id: 'ns_thieu', ten: 'Hồ sơ nhân sự thiếu trường bắt buộc', ma: 'QT.10', o: 'nsThieu', nguon: 'm4.1.ho_so_nhan_su', menu: 'M4.1', ai: 'Tổ chức · Nhân sự' },
  { id: 'khgd', ten: 'Lớp · môn chưa có kế hoạch giáo dục', ma: 'QT.10', o: 'khgdThieu', nguon: 'm5.1.khgd', menu: 'M5.1', ai: 'Tổ trưởng chuyên môn' },
  { id: 'giao_an', ten: 'Tiết chưa có giáo án', ma: 'QT.10', o: 'giaoAnThieu', nguon: 'm5.2.giao_an', menu: 'M5.2', ai: 'Tổ trưởng chuyên môn' },

  { id: 'mat_chu', ten: 'Tệp lưu trữ mất chủ', ma: 'QT.10', o: 'tepMatChu', nguon: 'm10.11.luu_tru', menu: 'M10.11', ai: 'Quản trị hệ thống' }
];
function veTab3() {
  let h = PV.chotNgay() + PV.daiCanhBao() + daiPV();
  const hien = LOAI_THIEU.filter(x => coXD(x.nguon));
  const an = LOAI_THIEU.filter(x => !coXD(x.nguon)).map(x => ({ ten: x.ten, nguon: x.nguon }));
  if (hien.length) {
    h += KB.K1({
      id: 'cl', tieuDe: 'Bảy loại thiếu sót — mỗi dòng một loại, mỗi loại một người chịu trách nhiệm',

      moTaKy: PV.moTaChot(), tenCotDau: 'Loại thiếu sót',
      dong: hien.map(x => ({ id: x.id, ten: x.ten, phu: x.menu + ' · ' + x.ai })),
      oSo: d => { const x = LOAI_THIEU.find(y => y.id === d.id); return CT.doc(x.ma, PV.thamSo(), x.o) },

      duoiBang: '<div class="ro">Cột <b>Tỉ lệ</b> = phần của loại đó trong <b>tổng số thiếu sót</b>, '
        + '⛔ không phải «bao nhiêu phần trăm hồ sơ bị hỏng».</div>'
    });
  }
  h += khoiNoAcc(an, 'bảng thiếu sót');
  return h + dnote('Bảy loại có <b>bảy mẫu số khác nhau</b> (hồ sơ học sinh · hồ sơ nhân sự · tiết · ticket · tệp), '
    + 'nên ⛔ không có một mẫu số chung và ⛔ không có «tỉ lệ hồ sơ hỏng của trường».<br>'
    + 'Tab này trả lời <b>«trường đang có bao nhiêu hồ sơ hỏng, loại nào»</b> — đơn vị dòng là '
    + '<b>MỘT LOẠI THIẾU SÓT</b>. Nó ⛔ không thay <code>M0.2</code>, nơi đơn vị dòng là <b>một việc CỦA TÔI</b>, '

  const ve5 = { dieu_hanh_thang: veTab1, so_sanh_diem_truong: veTab2, chat_luong_du_lieu: veTab3, doi_chieu: veTabDC, hang_doi_duyet: veTab5 };
  $('#content').innerHTML = PV.daiMau() + (ve5[ST.tab] || veTab1)();
}

/* ══════════════════════════ NỐI DÂY ═══════════════════════════════════ */
KB.datMenu(MENU_NAY);
KB.noiQuyen(f => coXD(f), f => F_NGUON[f] || { menu: '?', ten: f });
PV.noiVeLai(ve);
PV.doiTab = t => { if (coTab(t)) ST.tab = t };

/* ── dải mẫu định kỳ CROSS-NHÓM (`N8`) — mẫu là một BỘ THAM SỐ ─────────
   Ba mẫu dùng chung đã có ở tệp nền (`dau_nam` · `cuoi_ky_1` · `cuoi_nam`).
   `M9.1` là nơi đặt dải mẫu cross-nhóm, nên thêm ba mẫu còn lại của `nh9` §4.
   🛑 Ngày cụ thể lấy từ `M10.9`, mốc kỳ từ `M10.1` — ⛔ không gõ cứng ở đây:
   hằng `PV.KY` của tệp nền chính là bản chiếu hai menu ấy.                */
PV.themMau('giua_ky_1', { ten: '📌 Giữa kỳ I', mo: 'Chốt mốc giữa kỳ I và phát sinh từ đầu năm', cheDo: 'ca_hai', ky: 'giua_ky_1' });
PV.themMau('giua_ky_2', { ten: '📌 Giữa kỳ II', mo: 'Chốt mốc giữa kỳ II và phát sinh từ đầu kỳ II', cheDo: 'ca_hai', ky: 'giua_ky_2' });
PV.themMau('he', { ten: '📌 Hè', mo: 'Chốt bế giảng — số tồn mang sang hè', cheDo: 'chot', ky: 'cuoi_nam', tab: 'chat_luong_du_lieu' });

/* ── danh sách trường của MỨC 2 — mỗi tab một bộ ──────────────────────
   Ba tab lấy ba loại bản ghi khác nhau, nên trường cá nhân cũng khác. Một
   danh sách dùng chung thì người xuất tab 🧾 vẫn phải bỏ chọn một trường
   không có trong bảng họ đang xem.
   🛑 Tab ⏳ Hàng đợi duyệt ⛔ KHÔNG có mức 2 — xem ghi chú cuối tab đó.   */
const TRUONG_XUAT = {
  dieu_hanh_thang: [
    { khoa: 'ma', ten: 'Mã học sinh', batBuoc: true },
    { khoa: 'ten', ten: 'Họ và tên', batBuoc: true },
    { khoa: 'lop', ten: 'Lớp' },
    { khoa: 'tt', ten: 'Trạng thái' },
    { khoa: 'sk', ten: 'Sự kiện biến động trong kỳ' },
    { khoa: 'lienHe', ten: 'Số lần đã liên hệ gia đình', nhay: true, macDinh: false }
  ],
  so_sanh_diem_truong: [
    { khoa: 'ma', ten: 'Mã học sinh', batBuoc: true },
    { khoa: 'ten', ten: 'Họ và tên', batBuoc: true },
    { khoa: 'dt', ten: 'Điểm trường' },
    { khoa: 'lop', ten: 'Lớp' },
    { khoa: 'tt', ten: 'Trạng thái' }
  ],
  chat_luong_du_lieu: [
    { khoa: 'loai', ten: 'Loại thiếu sót', batBuoc: true },
    { khoa: 'banGhi', ten: 'Bản ghi (mã · tên)', batBuoc: true },
    { khoa: 'menu', ten: 'Menu chủ · nơi sửa' },
    { khoa: 'ai', ten: 'Người chịu trách nhiệm', nhay: true, macDinh: false }
  ],
  doi_chieu: [
    { khoa: 'ma', ten: 'Mã học sinh · mã nhân sự', batBuoc: true },
    { khoa: 'ten', ten: 'Họ và tên', batBuoc: true },
    { khoa: 'lop', ten: 'Lớp · tổ' },
    { khoa: 'ly', ten: 'Lý do không đẩy được / ô nằm lại', batBuoc: true },
    { khoa: 'mdd', ten: 'Mã định danh Bộ GD&ĐT', nhay: true, macDinh: false }
  ]
};
const soDongChiTiet = () => ST.tab === 'chat_luong_du_lieu'
  ? LOAI_THIEU.filter(x => coXD(x.nguon)).length
  : ST.tab === 'doi_chieu' ? dcTapDay(PV.st.chotNgay).length
    : hsPV().filter(h => dangHoc(h, PV.st.chotNgay)).length;

KB.gan(); PV.gan(); XU.gan();
XU.noiBoiCanh(() => {
  const t = TAB.find(x => x.ma === ST.tab) || TAB[0];
  const ky = t.ma === 'hang_doi_duyet' ? 'Tại ' + k2s(HOMNAY)
    : t.ma === 'dieu_hanh_thang' || t.ma === 'so_sanh_diem_truong'
      ? PV.moTaChot() + ' · ' + PV.moTaKhoang() : PV.moTaChot();
  const maCT = { dieu_hanh_thang: 'HS.01', so_sanh_diem_truong: 'HS.01', chat_luong_du_lieu: 'QT.10', doi_chieu: 'DC.01', hang_doi_duyet: 'QT.09' }[t.ma];
  const kb = CT.khaiBao(maCT);
  return {
    truong: 'THCS & THPT Nguyễn Tất Thành',
    baoCao: 'Báo cáo điều hành tổng hợp — ' + t.nhan.replace(/^\d+ · /, '') + (t.bc === '—' ? '' : ' (' + t.bc + ')'),
    menu: MENU_NAY, nguoi: R().n, chucDanh: R().cd, ky,
    phamVi: tenPhamVi(),
    toanTruong: HS.filter(h => dangHoc(h, HOMNAY)).length,
    tongPhamVi: hsPV().filter(h => dangHoc(h, HOMNAY)).length,
    donVi: 'học sinh',
    quyTac: (kb.quyTacDem.tinhVao || []).concat((kb.quyTacDem.khongTinh || []).map(x => 'KHÔNG tính: ' + x)),
    truong_du_lieu: TRUONG_XUAT[ST.tab] || TRUONG_XUAT.dieu_hanh_thang,
    soDong: soDongChiTiet()
  };
});

document.addEventListener('click', e => {
  const r = e.target.closest('[data-r]');
  if (r) { role = r.getAttribute('data-r'); moTab(tabMacDinh()); ve(); return }
  const t = e.target.closest('[data-t]');
  if (t) { moTab(t.getAttribute('data-t')); ve(); return }
  const cl = e.target.closest('[data-cmloai]');
  if (cl) { ST.locNhom = cl.getAttribute('data-cmloai'); ve(); return }
  if (e.target.closest('#btnNote')) { ST.note = !ST.note; ve(); return }
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const m = dl.getAttribute('data-dl'), q = dl.getAttribute('data-dlq') || '';
    const cho = CHIMUC_DONG.find(x => x.menu === m && x.cho);
    toast('↗ Deep-link sang <b>' + esc(m) + '</b> — <code>?' + esc(q) + '</code>'
      + (cho ? '<br><b>⏳ Menu này chưa dựng</b> — phiên ' + esc(cho.phien) + ' còn chờ dữ kiện bên ngoài.' : '')
      + '<br><i>Demo một tệp: không mở được menu khác, nhưng đường dẫn là đường dẫn thật.</i>');
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'cmTim') {
    ST.timBC = e.target.value;
    const box = $('#cmTim');
    const pos = box ? box.selectionStart : null;
    ve();
    const box2 = $('#cmTim');
    if (box2) { box2.focus(); if (pos != null) box2.setSelectionRange(pos, pos) }
  }
});
$('#hdt').addEventListener('change', e => { ST.dt = e.target.value; ve() });

function toast(h) {
  const t = $('#toast'); t.innerHTML = h; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 4600);
}

/* ── công cụ nghiệm thu: đo MẬT ĐỘ CHỮ GIẢI THÍCH (`nh9` §9.1, ≤ 20%) ── */
function doMatDoChu() {
  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info,.dcsep,.cmchan';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(n => { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = { tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
window.doMatDoChu = doMatDoChu;

ST.tab = tabMacDinh();
moTab(ST.tab);
ve();
</script>
