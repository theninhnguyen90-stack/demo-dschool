<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4.2 Biến động nhân sự — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
mark{background:#fef08a;padding:0 1px;border-radius:2px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:240px}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:236px;max-height:270px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.alert{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.miss{color:var(--amber);font-weight:700}
.miss.r{color:var(--red)}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:2fr 1.5fr 1.15fr 1.3fr 1fr}
.stage.open .hrow{grid-template-columns:2fr 1.3fr}
.stage.open .hcol{display:none}
.stage.open .hcol.keep{display:block}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:26px}
.hrow.gone{opacity:.6}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.ava2.noimg{background:#fee2e2;color:#991b1b}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:2fr 1.5fr 1.15fr 1.3fr 1fr}
.stage.open .hdrow{grid-template-columns:2fr 1.3fr}
.stage.open .hdrow div{display:none}
.stage.open .hdrow div.kc{display:block}
.hrow input[type=checkbox],.hdrow input[type=checkbox]{width:15px;height:15px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ava3{width:50px;height:50px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 50px}
.ava3.noimg{background:#fee2e2;color:#991b1b;font-size:11px;text-align:center;line-height:1.15}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.ptabs{display:flex;gap:2px;padding:0 11px;border-bottom:1px solid var(--line);background:#fafbfc;overflow-x:auto}
.ptab{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand);background:#fff}
.pbody{padding:14px 15px;max-height:calc(100vh - 230px);overflow-y:auto}

.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.exp{border-color:#fecaca}
.card.rev{opacity:.72}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:172px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.f.t2{background:#fffdf5}
.f.t3{background:#f8fafc}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.mask-val{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.eye{font-size:11px;color:var(--brand);border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:1px 7px}
.eye:hover{background:#e0e7ff}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}

.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.r::before{background:var(--red)}
.logi.g::before{background:var(--green)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

.viewer{display:grid;grid-template-columns:1fr 200px;gap:13px}
@media(max-width:700px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:270px;display:grid;place-items:center;color:#94a3b8;position:relative;overflow:hidden}
.vsheet{background:#fff;width:80%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:14px 16px;font-size:9px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:10px;text-align:center;font-weight:800;margin-bottom:7px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.diff{display:grid;grid-template-columns:1fr 22px 1fr;gap:8px;align-items:center;font-size:12.5px;padding:7px 0}
.diff .old{background:var(--red-soft);border:1px solid #fecaca;border-radius:7px;padding:6px 9px;color:#991b1b}
.diff .new{background:var(--green-soft);border:1px solid #a7f3d0;border-radius:7px;padding:6px 9px;color:#065f46;font-weight:700}
.diff .ar{text-align:center;color:var(--ink3)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:700px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--ink3);font-size:12.5px;margin-top:5px;cursor:pointer}
.drop:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.drop.has{border-style:solid;border-color:var(--green);background:var(--green-soft);color:#065f46;font-weight:600}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.bulkbar{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#0f172a;color:#fff;font-size:12.5px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bulkbar .sp{flex:1}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}

/* --- rieng M4.2: thanh tien trinh doc + checklist doi soat --- */
.step{margin-left:6px;border-left:2px solid var(--line);padding-left:26px}
.sti{position:relative;padding:2px 0 16px}
.sti::before{content:"";position:absolute;left:-33px;top:2px;width:15px;height:15px;border-radius:50%;
 background:#fff;border:2px solid var(--line2)}
.sti.done::before{background:var(--green);border-color:var(--green);content:"¹3";color:#fff;font-size:9px;
 display:grid;place-items:center;line-height:1}
.sti.now::before{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.sti.skip::before{background:var(--bg);border-color:var(--line)}
.sti.bad::before{background:var(--red);border-color:var(--red)}
.sti b{display:block;font-size:13px;font-weight:600}
.sti.skip b{color:var(--ink3);font-weight:400}
.sti .mm{font-size:11.5px;color:var(--ink3)}
.sti .act{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.ck{display:flex;align-items:flex-start;gap:9px;padding:7px 12px;font-size:12.5px;border-top:1px solid #f1f5f9}
.ck .ico{flex:0 0 16px;font-size:12px;line-height:1.5}
.ck .tx{flex:1;min-width:0}
.ck .tx .sub{font-size:11.5px;color:var(--ink3)}
.ck.blk{background:var(--red-soft)}
.ck.okk{background:var(--green-soft)}
.ck input[type=checkbox]{width:15px;height:15px;margin-top:2px}
.hq{display:grid;grid-template-columns:1.7fr .95fr 1.5fr auto;gap:9px;align-items:center;
 padding:8px 12px;font-size:12.5px;border-top:1px solid #f1f5f9}
@media(max-width:820px){.hq{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="TCNS">TCNS</button>
  <button class="rb" data-r="HT">HT</button>
  <button class="rb" data-r="PHT_DT">PHT_DT</button>
  <button class="rb" data-r="PHT_CM">PHT_CM</button>
  <button class="rb" data-r="KT">KT</button>
  <button class="rb" data-r="NS">Nhân sự</button>
  <span class="note">Vai <b>Đủ quyền</b> làm được mọi thao tác nghiệp vụ của menu — dùng để rà luồng. Các vai còn lại để thử phân quyền.</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"><option>Toàn trường</option><option>Điểm trường A</option><option>Điểm trường B</option></select>

const byT=id=>TK.find(x=>x.id===id);

/* ================= TRẠNG THÁI ỨNG DỤNG ================= */
let role='FULL', tab='A', ptab='tien', cur=null, openG={};
let fDT=new Set();
let fTT=new Set(['nhap','doisoat','duyet','ky']);   /* mặc định bỏ Hoàn tất / Từ chối / Hủy */
let fGOM='Không gom';

/* ================= SUY DIỄN ================= */
const dsMode=t=>LOAI[t.l].ds||0;                       /* 'day' | 'nhe' | 0 */
const canhBao=t=>(t.hq||[]).filter(h=>h[3]==='loi').length;
/* Đối soát: đếm hạng mục chưa đạt, tách nhóm chặn cứng và nhóm ghi đè được */
function dsStat(t){
 const may=t.may||[], ng=t.nguoi||[];
 const mBlk=may.filter(m=>!m[1]&&m[3]).length;        /* chưa đạt + chặn cứng (học bạ, phân công) */
 const mSoft=may.filter(m=>!m[1]&&!m[3]).length;      /* chưa đạt + HT ghi đè được */
 const nCho=ng.filter(n=>!n[1]).length;
 return {mBlk,mSoft,nCho,tong:mBlk+mSoft+nCho,
         may:may.length,ng:ng.length,
         mOk:may.filter(m=>m[1]).length,nOk:ng.filter(n=>n[1]).length};
}
const dsDu=t=>dsStat(t).tong===0;
/* Bước kế tiếp — ai đang phải làm gì */
function keTiep(t){
 if(t.b==='tuchoi')return 'Đã đóng — bị từ chối';
 if(t.b==='huy')   return 'Đã đóng — đã hủy';
 if(t.b==='xong')  return canhBao(t)?'⛔ Còn hệ quả thất bại':'Đã hoàn tất';
 return {nhap:'Người tạo trình duyệt',doisoat:'Tổ chức nhân sự · Kế toán đối soát',
         duyet:NS[t.ns].nhom===2?'Phó HT Chuyên môn duyệt':'Phó HT Điểm trường duyệt',
         ky:'Hiệu trưởng ký quyết định'}[t.b];
}
/* Tuổi nghỉ hưu — lộ trình BLLĐ 2019 Điều 169.
   Từ 2021: nam 60t3th, nữ 55t4th; mỗi năm +3th (nam) và +4th (nữ),
   tới khi nam đủ 62 tuổi vào 2028 và nữ đủ 60 tuổi vào 2035.
   Bảng này là CẤU HÌNH MASTER tại M10.6 — ở đây sinh ra để mô phỏng, không viết cứng từng dòng. */
const HUU=(()=>{const o={};
 for(let y=2021;y<=2040;y++){
  const nam=Math.min(60*12+3+(y-2021)*3, 62*12);      /* chốt 62 tuổi từ 2028 */
  const nu =Math.min(55*12+4+(y-2021)*4, 60*12);      /* chốt 60 tuổi từ 2035 */
  o[y]=[nam,nu];
 } return o})();
const themTh=(d,th)=>new Date(d.getFullYear()+Math.floor(th/12), d.getMonth()+th%12, d.getDate());
function ngayHuu(p){
 const d=pd(p.sinh);
 /* nghỉ hưu tại năm mà người đó chạm đúng ngưỡng CỦA CHÍNH NĂM ĐÓ — điểm bất động */
 for(let y=2021;y<=2040;y++){
  const n=themTh(d,HUU[y][p.gt==='Nam'?0:1]);
  if(n.getFullYear()<=y) return n;
 }
 return themTh(d,HUU[2040][p.gt==='Nam'?0:1]);
}
const TAICHUC=['lamviec','tamnghi'];

/* ================= PHẠM VI ================= */
function base(){
 let r=TK.slice(); const R0=R();
 if(R0.own)     return r.filter(x=>x.ns===R0.own);        /* Nhân sự: authored */
 if(R0.scLock)  r=r.filter(x=>NS[x.ns].dt===R0.scLock||x.dtMoi===R0.scLock||x.dtCu===R0.scLock);
 else if(hdt()!=='Toàn trường') r=r.filter(x=>NS[x.ns].dt===hdt());
 if(R0.gvOnly)  r=r.filter(x=>NS[x.ns].nhom===2);
 if(R0.ktOnly)  r=r.filter(x=>['B2','D'].includes(x.l));
 return r.filter(x=>x.nam===hnam().replace('Năm học ',''));   /* Yearly */
}
function rows(){
 let r=base().filter(t=>tabLoai(tab).includes(t.l));
 const q=kd($('#q')?.value);
 if(q)r=r.filter(x=>kd(NS[x.ns].n).includes(q)||x.id.toLowerCase().includes(q)||(x.qd||'').toLowerCase().includes(q));
 if(fDT.size)  r=r.filter(x=>fDT.has(NS[x.ns].dt));
 if(fTT.size)  r=r.filter(x=>fTT.has(x.b));
 return r;
}
/* Deep-link chỉ hiện khi vai trò CÓ quyền ở menu chủ */
function dlink(menu,label,ctx){
 if(!R().mchu.includes(menu))
  return `<span class="rolnk off" title="Vai trò ${role} không có quyền tại ${menu}">🔗 ${menu}</span>`;
 return `<button class="rolnk" data-x="dl" data-m="${menu}" data-c="${ctx||''}">↗ ${label}</button>`;
}

/* ================= SÁU TAB NGHIỆP VỤ =================
 Mỗi loại biến động một tab; trọn vòng đời nằm trong tab đó.
 Không có tab inbox riêng — việc chờ vai trò hiện bằng BADGE trên từng tab,
 và gom xuyên module ở M0.2 Việc cần làm. */
const TAB=[['A','Tuyển dụng',['A']],['B2','Chuyển đi',['B2']],
           ['B3','Tiếp nhận',['B3']],['C','Tạm nghỉ & Trở lại',['C','CT']],['D','Nghỉ hẳn',['D']],
           ['E','Chuyển diện làm việc',['E']]];
const tabLoai=k=>(TAB.find(t=>t[0]===k)||TAB[0])[2];
/* Ticket của tab đang mở */
const tkTab=k=>base().filter(t=>tabLoai(k).includes(t.l));
/* Việc chờ CHÍNH vai trò đang đăng nhập, trong phạm vi một tab — dùng cho badge */
function choToi(list){
 const v=R().viec||[]; if(!v.length)return [];
 const f={
  doisoat: t=>t.b==='doisoat'||(t.b==='xong'&&canhBao(t)),
  ky:      t=>t.b==='ky',
  duyetnv: t=>t.b==='duyet'&&NS[t.ns].nhom===3,
  duyetgv: t=>t.b==='duyet'&&NS[t.ns].nhom===2,
  taichinh:t=>t.b==='doisoat'&&['B2','D'].includes(t.l),
 };
 return list.filter(t=>v.some(k=>f[k](t)));
}
const myQueue=()=>choToi(base());

/* ===== Việc CHƯA có ticket — phân về đúng tab của loại đó (§2.2) ===== */
function hanRows(k){
 const o=[], R0=R();
 if(R0.own)return o;
 Object.entries(NS).forEach(([id,p])=>{
  id=+id;
  if(!TAICHUC.includes(p.tt))return;
  if(R0.scLock&&p.dt!==R0.scLock)return;
  if(!R0.scLock&&hdt()!=='Toàn trường'&&p.dt!==hdt())return;
  if(R0.gvOnly&&p.nhom!==2)return;
  if(R0.ktOnly)return;
  /* đã có ticket đang chạy của đúng loại đó thì KHÔNG nhắc lại — tránh tạo trùng */
  const has=l=>TK.some(t=>t.ns===id&&t.l===l&&!['tuchoi','huy'].includes(t.b));
  if(k==='D'){
   const nh=ngayHuu(p), dn=days(nh);
   if(dn<=60&&!has('D'))
    o.push({ns:id,lb:dn<0?`Đã quá tuổi nghỉ hưu ${-dn} ngày`:`Đến tuổi nghỉ hưu còn ${dn} ngày`,
      cl:dn<0?'r':'w',why:`${p.gt} · đủ tuổi ${d2s(nh)} · ngưỡng 2026 là ${p.gt==='Nam'?'61 tuổi 6 tháng':'57 tuổi'}`,tao:'D'});
   if(p.hdHet&&dleft(p.hdHet)<0&&!has('D'))
    o.push({ns:id,lb:`Hợp đồng đã hết hạn ${-dleft(p.hdHet)} ngày`,cl:'r',
      why:`Hết hạn ${p.hdHet} — cần quyết định ký tiếp hay chấm dứt`,tao:'D'});
  }
  if(k==='C'){
   if(p.tt==='tamnghi'&&p.tnDen&&!has('CT')){const d=dleft(p.tnDen);
    o.push({ns:id,lb:d<0?`Quá hạn tạm nghỉ ${-d} ngày chưa đăng ký trở lại`:`Hết thời gian tạm nghỉ còn ${d} ngày`,
      cl:d<0?'r':'w',why:`Dự kiến trở lại ${p.tnDen}`,tao:'CT'});}
  }
 });
 return o;
}

function tabList(){
 let t=TAB;
 /* Kế toán chỉ dính tới hai loại có đối soát tài chính — ba tab kia không bao giờ có việc,
    hiện ra chỉ là nhiễu. Khác với tab rỗng của TCNS: rỗng ở đó có nghĩa "năm nay chưa có". */
 if(R().ktOnly) t=TAB.filter(([k,,ls])=>ls.some(l=>['B2','D'].includes(l)));
 return t.map(([k,n])=>{
  const list=tkTab(k), cho=choToi(list).length;
  return [k,n,cho,list.length];
 }).filter(x=>!R().own||x[3]);      /* vai trò Nhân sự chỉ thấy tab có đơn của mình */
}
function tabs(){
 const list=tabList();
 if(!list.length){$('#tabs').innerHTML='';return}
 if(!list.some(x=>x[0]===tab)) tab=list[0][0];
 $('#tabs').innerHTML=list.map(([k,n,cho,tong])=>
  `<button class="tab1 ${tab===k?'on':''}" data-tab="${k}">${n}
   <span class="b" title="${cho?'việc chờ chính bạn':'tổng số ticket'}">${cho||tong}</span></button>`).join('');
}
function sidebar(){
 const a=R().menu,full=a==='all';
 $('#side').innerHTML=NAV.map(([id,n,items])=>{const on=full||id===''||a.includes(id);
  return `<div class="sgrp">${n}</div>`+items.map(it=>{const cu=it[0]==='M4.2';
   /* Nhân sự KHÔNG có M4.2 trên sidebar — vào từ M0.4 */
   const off=!on||(cu&&R().own);
   return `<div class="snav ${cu&&!R().own?'on':''} ${off?'off':''}">
    <span style="font-size:10.5px;opacity:.55;min-width:28px">${it[0]}</span>
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it[1]}</span>
    ${cu&&myQueue().length?`<span class="nb">${myQueue().length}</span>`:''}</div>`}).join('')}).join('');
}

/* ================= DẢI PHẠM VI ================= */
function scopeBar(){
 const R0=R();
 let why = R0.own    ? `Vai trò <b>Nhân sự</b> — bộ lọc bản ghi <b>authored</b>, chỉ thấy đơn của chính mình.
                        <b>M4.2 không có trên sidebar</b>, vào từ M0.4`
        : R0.scLock  ? `Vai trò scope <b>Branch</b> — bộ chọn Điểm trường đã khóa về <b>${R0.scLock}</b>.
                        Ticket chuyển ĐT hiện cả khi ĐT này là <b>nơi đến</b>`
        : R0.gvOnly  ? `Phạm vi <b>School — chỉ giáo viên</b>`
        : R0.ktOnly  ? `Phạm vi <b>School</b> nhưng chỉ ticket <b>Chuyển đi</b> và <b>Nghỉ hẳn</b> — loại cần đối soát tài chính`
        :              `Phạm vi <b>School</b> — toàn bộ biến động của trường`;
 const yn=hnam().replace('Năm học ','');
 const note=`Ticket biến động là dữ liệu <b>Yearly</b> — tab này lọc theo <b>Năm học ${yn}</b>.
   Riêng <b>dải cảnh báo việc chưa có ticket</b> tính trên nhân sự đang tại chức, không lọc theo năm.`;
 const an=tkTab(tab).filter(t=>!fTT.has(t.b)).length;
 return `<div class="scope">▸ Đang xem <b>${rows().length}</b> ticket ${(TAB.find(t=>t[0]===tab)||['','?'])[1].toLowerCase()} · ${R0.sc}
   <span class="sp"></span><span>${why}</span></div>
  <div class="scope" style="border-left-color:var(--ink3);margin-top:6px">🗓 ${note}
   ${an?`<span class="sp"></span>
    <button class="btn xs" data-x="show-dong">Xem cả ${an} ticket đã đóng (hoàn tất / từ chối / hủy)</button>`:''}</div>`;
}

/* ================= BỘ LỌC ================= */
function msBtn(id,label,set,opts){
 return `<div class="ms"><button class="msb ${set.size?'act':''}" data-ms="${id}">${label}
   ${set.size?`<span class="cnt">${set.size}</span>`:'<span style="color:var(--ink3)">▾</span>'}</button>
  <div class="msp" id="msp-${id}">${opts.map(o=>
   `<label class="mso"><input type="checkbox" data-msv="${id}" value="${o}" ${set.has(o)?'checked':''}>${o}</label>`).join('')}</div></div>`;
}
function filters(){
 const ttOpts=[['nhap','Nháp'],['doisoat','Chờ đối soát'],['duyet','Chờ duyệt'],['ky','Chờ HT ký'],
               ['xong','Hoàn tất'],['tuchoi','Bị từ chối'],['huy','Đã hủy']];
 return `<div class="bar">
  <input class="inp" id="q" placeholder="🔍 Họ tên, mã ticket, số quyết định…" value="${$('#q')?.value||''}">
  <div class="ms"><button class="msb ${fTT.size!==5?'act':''}" data-ms="tt">Trạng thái
   <span class="cnt">${fTT.size}</span></button>
   <div class="msp" id="msp-tt">${ttOpts.map(([k,v])=>
    `<label class="mso"><input type="checkbox" data-msv="tt" value="${k}" ${fTT.has(k)?'checked':''}>${v}</label>`).join('')}</div></div>
  ${R().scLock||R().own?'':msBtn('dt','Điểm trường',fDT,['Điểm trường A','Điểm trường B'])}
  <select class="fs" id="fgom">${['Không gom','Theo điểm trường','Theo chức danh','Theo trạng thái']
   .map(o=>`<option${fGOM===o?' selected':''}>${o==='Không gom'?'Không gom nhóm':'Gom '+o.toLowerCase()}</option>`).join('')}</select>
  <div class="sum"><span>Ticket <b>${rows().length}</b></span></div></div>`;
}

/* ================= T1 — TẤT CẢ BIẾN ĐỘNG ================= */
function tkRow(t,sub){
 const p=NS[t.ns], [lb,cl]=TT[t.b];
 const d=dleft(t.hl), cb=canhBao(t);
 const q=($('#q')?.value||'').trim();
 const hi=x=>q?x.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):x;
 const hq=t.hq||[];
 const nOk=hq.filter(h=>h[3]==='ok').length, nCho=hq.filter(h=>h[3]==='cho').length;
 return `<div class="hrow ${sub?'sub':''} ${cur===t.id?'on':''} ${['tuchoi','huy'].includes(t.b)?'gone':''}"
   data-tk="${t.id}" style="grid-template-columns:2fr 1.5fr 1.1fr 1.25fr 1.5fr .9fr">
  <div class="who2"><div class="ava2">${p.i}</div><div class="i"><b>${hi(p.n)}</b>
   <span>${p.ma} · ${p.cd}</span></div></div>
  <div class="hcol">${t.lc||LOAI[t.l].t}${t.l==='CT'?'<br><span class="tg b">trở lại</span>':''}</div>
  <div class="hcol">${t.hl}<br><span style="font-size:11px;color:var(--ink3)">${
    d===0?'hôm nay':d>0?'còn '+d+' ngày':'đã qua '+(-d)+' ngày'}</span></div>
  <div class="hcol keep"><span class="st2 ${cl}">${lb}</span>
   ${t.qd?`<br><span style="font-size:11px;color:var(--ink3)">${t.qd}</span>`:''}</div>
  <div class="hcol" style="font-size:11.5px;color:var(--ink2)">${keTiep(t)}</div>
  <div class="hcol">${hq.length?(cb?`<span class="st2 r">⛔ ${cb} thất bại</span>`
    :nCho?`<span class="st2 b">⏳ ${nCho} chờ</span>`:`<span class="st2 o">✓ ${nOk}/${hq.length}</span>`):'—'}</div></div>`;
}
function listTab(){
 const r=rows(), q=($('#q')?.value||'').trim();
 const flat=fGOM==='Không gom'||!!q||!r.length;
 let body='';
 if(!r.length)body=`<div class="empty">Không có ticket nào khớp bộ lọc.<br>
   <span style="font-size:12px">Ticket <b>hoàn tất</b>, <b>bị từ chối</b> và <b>đã hủy</b> bị bộ lọc Trạng thái ẩn theo mặc định — bật lại để tra cứu.</span></div>`;
 else if(flat)body=r.map(x=>tkRow(x)).join('');
 else{
  const key=fGOM==='Theo trạng thái'?(x=>TT[x.b][0])
          :fGOM==='Theo điểm trường'?(x=>NS[x.ns].dt)
          :(x=>NS[x.ns].cd);
  const ks=[...new Set(r.map(key))];
  body=ks.map(k=>{const rk=r.filter(x=>key(x)===k), gk='g-'+k, op=openG[gk]!==false;
   const cb=rk.filter(canhBao).length;
   return `<div class="grow" data-g="${gk}"><span class="ar">${op?'▼':'▶'}</span>${k}
     <span class="ct"><span>${rk.length} ticket</span>
      ${cb?`<span class="miss r">${cb} có hệ quả thất bại</span>`:''}</span></div>
    ${op?rk.map(x=>tkRow(x,1)).join(''):''}`}).join('');
 }
 /* dải cảnh báo VIỆC CHƯA CÓ TICKET — của đúng loại thuộc tab này (§2.2) */
 const han=hanRows(tab);
 const hanAl=han.length?`<div class="alert ${han.some(h=>h.cl==='r')?'r':'w'}">${han.some(h=>h.cl==='r')?'⛔':'⏰'}
   <span class="sp"><b>${han.length}</b> việc <b>chưa có ticket</b> —
    ${han.slice(0,3).map(h=>NS[h.ns].n+' ('+h.lb.toLowerCase()+')').join(' · ')}
    ${han.length>3?` · và <b>${han.length-3}</b> người khác`:''}</span>
   ${R().tao?`<button class="btn xs p" data-x="tao-tu-han" data-ns="${han[0].ns}" data-l="${han[0].tao}">+ Tạo ticket</button>`:''}
   </div>`:'';
 /* dải cảnh báo hệ quả thất bại — tính trên TOÀN BỘ ticket, không phụ thuộc bộ lọc */
 const bad=tkTab(tab).filter(canhBao);
 const badAl=bad.length?`<div class="alert r">⛔
   <span class="sp"><b>${bad.length}</b> ticket đã ký nhưng còn <b>hệ quả chưa chạy được</b> —
    ${bad.slice(0,3).map(t=>NS[t.ns].n+' ('+LOAI[t.l].t.toLowerCase()+')').join(' · ')}
    ${bad.length>3?` · và <b>${bad.length-3}</b> ticket khác`:''}.
    Quyết định đã ký mà hệ quả không chạy thì hệ thống đang nói sai về thực tế.</span>
   <button class="btn xs" data-x="show-dong">Xem</button></div>`:'';
 const alert=(hanAl||badAl)?`<div class="alerts">${hanAl}${badAl}</div>`:'';
 /* bảng chi tiết việc chưa có ticket, ngay dưới dải cảnh báo */
 const hanBox=han.length?`<div class="listw" style="margin-bottom:12px">
   <div class="hdrow" style="grid-template-columns:2fr 1.9fr 2.4fr 1.1fr">
    <div class="kc">Nhân sự</div><div>Việc sắp đến</div><div>Căn cứ</div><div class="kc">Thao tác</div></div>
   ${han.map(h=>{const p=NS[h.ns];
    return `<div class="hrow" style="grid-template-columns:2fr 1.9fr 2.4fr 1.1fr;cursor:default">
     <div class="who2"><div class="ava2">${p.i}</div><div class="i"><b>${p.n}</b>
      <span>${p.ma} · ${p.cd} · ${p.dt}</span></div></div>
     <div><span class="st2 ${h.cl}">${h.lb}</span></div>
     <div style="font-size:11.5px;color:var(--ink2)">${h.why}</div>
     <div>${R().tao?`<button class="btn xs p" data-x="tao-tu-han" data-ns="${h.ns}" data-l="${h.tao}">+ Tạo ticket</button>`
       :'<span style="color:var(--ink3);font-size:11.5px">chỉ xem</span>'}</div></div>`}).join('')}
   <div class="lgd">Việc <b>chưa có ticket</b> — hiện ngay trên tab xử lý nó, bấm <b>+ Tạo ticket</b> là mở biểu mẫu tại chỗ.
    Người đã có ticket đang chạy của loại này <b>không hiện lại ở đây</b>.</div></div>`:'';
 return `${filters()}${alert}${hanBox}
  <div class="stage ${cur?'open':''}">
   <div class="listw">
    <div class="hdrow" style="grid-template-columns:2fr 1.5fr 1.1fr 1.25fr 1.5fr .9fr">
     <div class="kc">Nhân sự</div><div>Loại con</div><div>Ngày hiệu lực</div>
     <div class="kc">Trạng thái</div><div>Bước kế tiếp</div><div>Hệ quả</div></div>
    ${body}
    <div class="lgd">Một dòng = <b>một ticket biến động</b>. Bảy loại dùng chung một vòng đời — bước không áp dụng thì bỏ qua.</div>
   </div>
   <div class="panel">${cur?panel(cur):''}</div>
  </div>`;
}

/* ================= PANEL — TẦNG 2 ================= */
function panel(id){
 const t=byT(id); if(!t)return '';
 const p=NS[t.ns], [lb,cl]=TT[t.b];
 const co=dsMode(t);
 const pl=[['tien','Tiến trình']].concat(co?[['doisoat','Đối soát bàn giao']]:[])
   .concat([['hequa','Hệ quả'],['lichsu','Lịch sử']]);
 if(!pl.some(x=>x[0]===ptab))ptab='tien';
 return `<div class="ph"><div class="ava3">${p.i}</div>
   <div class="n"><h2>${p.n}</h2><div class="m">
    <span class="pill">${p.ma}</span><span class="pill">${p.cd}</span><span class="pill">${p.dt}</span>
    <span class="st2 ${cl}">${lb}</span>
    <span class="pill" style="color:var(--brand)">${LOAI[t.l].t}${t.lc?' · '+t.lc:''}</span>
    ${canhBao(t)?`<span class="st2 r">⛔ ${canhBao(t)} hệ quả thất bại</span>`:''}</div></div>
   <div class="spacer" style="flex:1"></div><button class="btn sm" data-x="close-panel">✕</button></div>
  <div class="ptabs">${pl.map(([k,n])=>`<button class="ptab ${ptab===k?'on':''}" data-ptab="${k}">${n}</button>`).join('')}</div>
  <div class="pbody">${ptab==='tien'?pTien(t):ptab==='doisoat'?pDoiSoat(t):ptab==='hequa'?pHeQua(t):pLichSu(t)}</div>`;
}

function pTien(t){
 const p=NS[t.ns], steps=BUOC[t.l], dong=['tuchoi','huy'].includes(t.b);
 const ix=steps.indexOf(t.b);
 const R0=R(), s=dsStat(t), co=dsMode(t);
 /* nút thao tác ĐỔI THEO TRẠNG THÁI — không để nút vô nghĩa */
 const act=b=>{
  if(dong)return '';
  if(b!==t.b)return '';
  if(b==='nhap'&&(R0.viec.includes('doisoat')||R0.own))
   return `<button class="btn sm p" data-x="trinh" data-tk="${t.id}">Trình duyệt →</button>
           <button class="btn sm" data-x="huy" data-tk="${t.id}">🚫 Hủy ticket</button>`;
  if(b==='doisoat'&&(R0.viec.includes('doisoat')||R0.viec.includes('taichinh')))
   return `<button class="btn sm p" data-x="trinh" data-tk="${t.id}" ${s.tong?'disabled':''}>Trình Hiệu trưởng ký →</button>
     ${s.tong?`<span style="font-size:11.5px;color:var(--red)">Còn ${s.tong} hạng mục đối soát — xem tab Đối soát bàn giao</span>`:''}`;
  if(b==='duyet'&&(R0.viec.includes('duyetnv')||R0.viec.includes('duyetgv')))
   return `<button class="btn sm p" data-x="duyet" data-tk="${t.id}">✓ Duyệt</button>
           <button class="btn sm d" data-x="tuchoi" data-tk="${t.id}">✕ Từ chối</button>`;
  if(b==='ky'&&R0.viec.includes('ky'))
   return `<button class="btn sm p" data-x="ky" data-tk="${t.id}">✍ Ký quyết định</button>
           <button class="btn sm" data-x="tralai" data-tk="${t.id}">↩ Trả lại</button>`;
  return '';
 };
 return `<div class="card"><div class="ch">Nội dung biến động<span class="sp"></span>
    <span class="tg c">${t.id}</span></div><div class="cb">
   <div class="f"><div class="k">Loại</div><div class="v">${LOAI[t.l].t}${t.lc?' · '+t.lc:''}</div></div>
   <div class="f"><div class="k">Nội dung</div><div class="v" style="font-weight:400">${t.ct}</div></div>
   <div class="f"><div class="k">Ngày hiệu lực</div><div class="v">${t.hl}
     <span style="font-weight:400;color:var(--ink3);font-size:11.5px">— trạng thái công tác ở M4.1 đổi tại ngày này, không phải ngày ký</span></div></div>
   ${t.den?`<div class="f"><div class="k">Trường đến</div><div class="v">${t.den}</div></div>`:''}
   ${t.dtCu?`<div class="f"><div class="k">Chuyển</div><div class="v">${t.dtCu} → ${t.dtMoi}</div></div>`:''}
   ${t.den2?`<div class="f"><div class="k">Dự kiến trở lại</div><div class="v">${t.den2}</div></div>`:''}
   ${t.maCu?`<div class="f"><div class="k">Mã định danh CSDL ngành</div><div class="v"><span class="mask-val">${t.maCu}</span>

 if(t.dataset.g){openG[t.dataset.g]=openG[t.dataset.g]===false;render();return}

   toast(m==='ky'?'✍ Đã ký số · số hiệu <b>'+tk.qd+'</b> · <b>'+TACDONG[tk.l].t+'</b> · hệ quả bắt đầu chạy'
     :'⚠ Đã ký, <b>bỏ qua ký số</b> — ghi audit và đồng bộ sang M4.11.'
      +(LOAI[tk.l].csdl?'<br>⛔ Bước đẩy CSDL ngành <b>không chạy được</b> vì thuộc Nhóm B':''));}break;

 case 'push': modal('⬆ Đẩy lên CSDL ngành',
   `<div class="warn"><b>Cần kết nối CSDL ngành — hoàn thiện ở giai đoạn 2.</b></div>
    <div class="ro">Ticket giữ nguyên ở <b>Chờ đồng bộ</b> và <b>vẫn nằm trong hàng đợi</b> để khi có tích hợp thì đẩy bù.
     Hệ thống <b>không đánh dấu là đã đẩy thành công</b>.</div>`,
   `<button class="btn" data-x="close">Đóng</button>`);break;

 case 'ghide': modal('⚠ Hiệu trưởng ghi đè hạng mục đối soát',
   `<div class="danger">Ghi đè chỉ áp dụng cho nhóm <b>tài sản, công văn, công nợ</b> —
     có ca thật không hoàn tất bàn giao được: người tử vong, hoặc bị kỷ luật buộc thôi việc và không hợp tác.<br>
     Nhóm <b>học bạ, phân công, lớp chủ nhiệm</b> không ghi đè được.</div>
    <div class="ro">Thao tác ghi <b>audit riêng</b> kèm lý do.</div>
    <label class="lbl">Lý do ghi đè <span style="color:var(--red)">*</span></label><textarea class="fldi" rows="3"></textarea>`,
   `<button class="btn" data-x="close">Hủy</button>
    <button class="btn d" data-x="ok-ghide" data-tk="${t.dataset.tk}" data-i="${t.dataset.i}">⚠ Ghi đè</button>`);break;
 case 'ok-ghide': {const k=byT(t.dataset.tk); k.may[+t.dataset.i][1]=1;
   k.lg.unshift([d2s(HOMNAY)+' 11:40','Trần Văn Hùng (HT)','⚠ Ghi đè hạng mục đối soát',k.may[+t.dataset.i][0]]);
   closeModal();render();toast('⚠ Đã ghi đè — <b>audit riêng</b> đã ghi kèm lý do');}break;

 case 'retry': {const k=byT(t.dataset.tk),h=k.hq[+t.dataset.i];
   h[3]='ok';h[4]='Đã chạy lại thành công '+d2s(HOMNAY);
   k.lg.unshift([d2s(HOMNAY)+' 11:55',R().n,'⟳ Chạy lại hệ quả',h[0]]);
   render();toast('⟳ Đã chạy lại <b>'+h[0]+'</b> — cảnh báo tương ứng ở <b>M4.1</b> sẽ hết');}break;

 case 'tao': taoModal(0,0);break;
 case 'tao-tu-han': taoModal(+t.dataset.ns,t.dataset.l);break;
 case 'xuat': modal('⬇ Xuất dữ liệu biến động',
   `<div class="warn">Mọi lượt xuất <b>ghi audit kèm mục đích</b> — NĐ 13/2023.</div>
    <label class="lbl">Bản xuất</label><select class="fldi">
     <option>Biến động theo kỳ</option><option>Danh sách tuyển mới trong năm</option>
     <option>Danh sách rời trường trong năm</option><option>Danh sách đang tạm nghỉ</option>
     <option>Danh sách theo bộ lọc hiện tại</option></select>
    <label class="lbl">Mục đích xuất <span style="color:var(--red)">*</span></label>
    <select class="fldi" id="mdx"><option value="">— Chọn mục đích —</option>
     <option>Báo cáo cấp trên</option><option>Đối chiếu nội bộ</option>
     <option>Lưu hồ sơ giấy</option><option>Khác (nêu rõ)</option></select>`,
   `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="do-xuat">⬇ Xuất</button>`);break;
 case 'do-xuat': {const md=$('#mdx')?.value;
   if(!md){toast('⛔ <b>Bắt buộc chọn mục đích xuất</b> — NĐ 13/2023');break}
   closeModal();toast('⬇ Đã xuất · mục đích <b>'+md+'</b> · đã ghi audit');}break;
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.msv){const k=el.dataset.msv,S={dt:fDT,tt:fTT}[k];
  el.checked?S.add(el.value):S.delete(el.value);render();
  setTimeout(()=>{const p=$('#msp-'+k);if(p)p.classList.add('on')},0);return}
 if(el.dataset.ck){const[id,i]=el.dataset.ck.split(':'),k=byT(id);
  k.nguoi[+i][1]=el.checked?1:0;
  k.nguoi[+i][2]=el.checked?R().n+' · '+d2s(HOMNAY):'';
  render();
  toast(el.checked?'✓ Đã xác nhận — ghi <b>'+R().n+'</b> và thời điểm':'Đã bỏ xác nhận');return}
 if(el.id==='fgom'){fGOM=['Không gom','Theo điểm trường','Theo chức danh','Theo trạng thái']
   .find(o=>(o==='Không gom'?'Không gom nhóm':'Gom '+o.toLowerCase())===el.value)||fGOM;render();return}
 if(el.id==='hdt'||el.id==='hnam'){cur=null;render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){const v=e.target.value;render();
 const q=$('#q');if(q){q.value=v;q.focus();q.setSelectionRange(v.length,v.length)}}});

/* ================= RENDER ================= */
function render(){
 sidebar();tabs();
 const a=[];
 if(R().tao) a.push('<button class="btn" data-x="tao">+ Tạo biến động</button>');
 if(!R().own) a.push('<button class="btn" data-x="xuat">⬇ Xuất</button>');
 $('#topact').innerHTML=a.join(' ');
 const n=myQueue().length;
 $('#ndot').textContent=n||''; $('#ndot').style.display=n?'grid':'none';
 $('#content').innerHTML=scopeBar()+listTab();
}
render();
</script>
</body>
</html>
