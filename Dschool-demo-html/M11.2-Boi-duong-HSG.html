/* ─────────── ỐNG KÍNH «THEO MÔN · THEO ĐỢT» (§9.1b) — trả lời «cả đợt này môn nào đang lên, môn nào đang chững».
   Dòng = MÔN (gộp mọi lớp của môn trong đợt), dưới là dòng lớp thụt vào. Cột = BÀI THỨ k. ─────────── */
function veBCMonDot(){
 const all=lopTrongPV().filter(l=>!l.huy), dots=[...new Set(all.map(l=>l.dot))];
 let h='<div class="alert b">🔒<span class="sp"><b>Điểm nội bộ</b> — chỉ thống kê, không vào M2.5 · M3.1 · học bạ · CSDL ngành. '
  +'Ống kính này đọc theo <b>môn</b> và <b>lớp</b>, <b>không xếp loại học sinh</b>.</span></div>';
 if(!dots.length) return h+'<div class="empty">Không có lớp bồi dưỡng nào trong phạm vi ở năm học này.</div>';
 if(!dots.includes(ST.bcDot)) ST.bcDot=dots.find(d=>BAI_KT.some(b=>all.some(l=>l.id===b.lop&&l.dot===d)))||dots[0];
 const ls=all.filter(l=>l.dot===ST.bcDot), nBai=Math.max(0,...ls.map(l=>baiCua(l.id).length));
 if(dots.length>1) h+='<div class="bar">'+dots.map(d=>'<button class="chip'+(d===ST.bcDot?' on':'')+'" data-a="bc.dot" data-v="'+d+'">'+esc(dotById(d).ten)+'</button>').join('')+'</div>';
 if(!nBai) return h+'<div class="empty">Đợt này chưa có bài kiểm tra nội bộ nào.</div>';
 const mons=[...new Set(ls.map(l=>l.mon))];
 h+='<div class="tbw tbx"><table><tr><th>Môn · lớp</th><th class="num">Lớp</th><th class="num">Đang học</th>'
  +Array.from({length:nBai},(_,i)=>'<th class="num">TB bài '+(i+1)+'</th>').join('')
  +(nBai>1?'<th class="num">Xu hướng bài 1 → bài '+nBai+'</th>':'')+'<th style="min-width:170px">Phân bố bài cuối</th></tr>';
 mons.forEach(m=>{
  const lm=ls.filter(l=>l.mon===m), hoc=lm.reduce((s,l)=>s+tvHoc(l.id).length,0), ch=nBai>1?chenhCap(lm):null;
  const oBai=i=>{const vs=[];lm.forEach(l=>{const x=baiCua(l.id)[i];if(x)vs.push(...diemBai(x))});return vs};
  /* «bài cuối» là bài cuối CỦA TỪNG LỚP — lớp ít bài hơn không bị đọc thành «chưa có điểm» */
  const oCuoi=()=>{const vs=[];lm.forEach(l=>{const bs=baiCua(l.id);if(bs.length)vs.push(...diemBai(bs[bs.length-1]))});return vs};
  h+='<tr class="grp"><td><b>'+esc(MON[m].ten)+'</b> <span class="mini">tổ '+esc(MON[m].to)+'</span></td>'
   +'<td class="num">'+lm.length+'</td><td class="num"><b>'+hoc+'</b></td>'
   +Array.from({length:nBai},(_,i)=>{const vs=oBai(i);return '<td class="num"><b>'+f1(tbc(vs))+'</b>'+(vs.length?'<div class="mini">'+vs.length+' điểm</div>':'')+'</td>'}).join('')
   +(nBai>1?'<td class="num">'+oChenh(ch)+'</td>':'')+'<td>'+oPB(oCuoi())+'</td></tr>';
  lm.forEach(l=>{const bs=baiCua(l.id), c2=bs.length>1?chenhCap([l]):null;
   h+='<tr><td style="padding-left:22px">'+esc(l.ten)+' <span class="mini">'+esc(tenGV(l.gv))+' · '+bs.length+' bài</span></td>'
    +'<td class="num"></td><td class="num">'+tvHoc(l.id).length+'</td>'
    +Array.from({length:nBai},(_,i)=>{const x=bs[i];
      return '<td class="num"'+(x?' title="'+esc(x.ten)+' · '+k2n(x.ngay)+'"':'')+'>'+(x?f1(tbBai(x)):'<span class="mini">—</span>')+'</td>'}).join('')
    +(nBai>1?'<td class="num">'+(c2?(c2.d>=0?'+':'')+f1(c2.d):'<span class="mini">—</span>')+'</td>':'')
    +'<td>'+oPB(bs.length?diemBai(bs[bs.length-1]):[])+'</td></tr>'});
 });
 return h+'</table><div class="lgd"><span><i class="lg a"></i>≥ 8</span><span><i class="lg b"></i>6,5 – dưới 8</span><span><i class="lg c"></i>dưới 6,5</span>'
  +'<span><b>Bài thứ k</b>, không phải một đề chung: mỗi lớp có bài kiểm tra riêng, xếp theo ngày — di chuột lên ô để xem tên bài</span>'
  +'<span>Lớp có ít bài hơn thì cột sau để <b>—</b>, <b>không tính là 0</b>; «bài cuối» là bài cuối <b>của từng lớp</b></span>'
  +'<span>Xu hướng = trung bình chênh <b>ghép cặp</b> của từng em trong <b>lớp của em</b></span></div></div>'
  +'<div class="dnote"><b>Vì sao ống kính này dừng ở mức môn và lớp.</b> Câu hỏi nó trả lời là «cả đợt này môn nào đang lên, môn nào đang chững» — '
  +'câu hỏi của người điều hành chuyên môn. Đọc xuống từng em thì bảng đổi nghĩa: nó thành bảng đánh giá học sinh, và gián tiếp là bảng đánh giá giáo viên phụ trách lớp (OL-5 · §2.6).</div>';
}

/* các tháng có buổi của năm đang xem */
function thangCuaNam(){
 const s=new Set(); lopTrongPV().forEach(l=>{let k=l.tu;while(k<=l.den){s.add(thang(k));k=addD(k,28)}s.add(thang(l.den))});
 return [...s].sort();
}

function soBuoiGV(ym){
 const out={};
 lopTrongPV().forEach(l=>buoiCua(l.id).forEach(b=>{
  if(!daDiemDanh(b)||(ym!=='all'&&thang(b.ngay)!==ym)) return;
  const o=out[b.gv]=out[b.gv]||{buoi:0,tiet:0,lop:{},thay:0};
  o.buoi++;o.tiet+=BXL.soTiet(b.tu,b.den);o.lop[l.id]=(o.lop[l.id]||0)+1;if(b.gv!==l.gv)o.thay++;
 }));
 return out;
}

  toast('⧉ Đã nhân bản dàn ý từ <b>'+esc(tenLop(s))+'</b>'+(src.length!==l.soBuoi?' — nguồn có '+src.length+' buổi, lớp này '+l.soBuoi+': '+(src.length>l.soBuoi?'bỏ phần thừa':'buổi thiếu để trống')+', <b>rà lại</b>':'')+'.')};
 modal('⧉ Nhân bản dàn ý vào '+esc(l.ten),nguon.length?'<div class="hint">Chép <b>tên nội dung từng buổi</b> từ một lớp cùng môn — kể cả lớp năm trước (khung-menu §19). Không chép thành viên, lịch, điểm.</div>'
  +'<label class="lbl">Lớp nguồn</label><select class="fldi" id="nbSrc">'+nguon.map(x=>'<option value="'+x.id+'">'+esc(x.ten)+' — '+esc(dotById(x.dot).ten)+' ('+DAN_Y[x.id].length+' buổi)</option>').join('')+'</select>'
  :'<div class="empty">Chưa có lớp cùng môn nào có dàn ý để nhân bản.</div>',
  '<button class="btn" data-mb="close">Hủy</button>'+(nguon.length?'<button class="btn p" data-mb="nb2">Nhân bản</button>':''));
};

/* ═══════════ M11.2 — KHUNG: vai · phạm vi · header · tab (RIÊNG của menu) ═══════════
   Cung cấp các hook mà tệp khuôn dùng: R() · can(q) · ST · lopTrongPV() · scopeBar() · nhanDuongVao() · crumb() */

const QALL=['vaoMenu','xem','lopTao','lopSua','lopHuy','tvThem','tvRoi','dangKy','nhap','nhapDiemThi','chotTDV',
 'xepLich','xepTay','diemDanh','diemNB','chotBuoi','danY','thamSo','xuat','xemEm'];
/* `xemEm` — OL-5 (§2.6): mức TỪNG HỌC SINH ở tab 4 Báo cáo. Ban giám hiệu (HT · PHT_CM) KHÔNG có —
   khi báo cáo có thêm so sánh giữa các bài kiểm tra, con số bắt đầu nói về giáo viên phụ trách lớp.
   `vaoMenu` — OL-6 (§2.7): Kế toán KHÔNG có Feature nào ở M11.2 ⇒ menu này không nằm trong danh sách menu
   của họ. Demo không có sidebar riêng nên dựng đúng hệ quả: không tab nào, chỉ một khối giải thích.
   Số buổi và số tiết đã CHỐT được ĐẨY sang M7.6 — Kế toán đọc ở đó, ở khối chỉ thống kê. */
const ROLES={
 FULL :{n:'Trần Minh Đức',cd:'🔓 Đủ quyền (demo)',sc:'School',q:QALL},
 PHTCM:{n:'Vũ Thị Lan',cd:'PHT chuyên môn',sc:'School',
        q:['vaoMenu','xem','lopTao','lopSua','lopHuy','tvThem','tvRoi','dangKy','nhap','nhapDiemThi','chotTDV','xepLich','xepTay','diemDanh','diemNB','chotBuoi','danY','thamSo','xuat']},
 TTCM :{n:'Nguyễn Đức Thắng',cd:'TTCM Toán – Tin',sc:'Group',to:'Toán – Tin',
        q:['vaoMenu','xem','lopTao','lopSua','tvThem','tvRoi','nhapDiemThi','chotTDV','xepLich','xepTay','danY','xuat','xemEm']},
 TTCMH:{n:'Đinh Thị Ngân',cd:'TTCM Hóa – Sinh',sc:'Group',to:'Hóa – Sinh',
        q:['vaoMenu','xem','lopTao','lopSua','tvThem','tvRoi','nhapDiemThi','chotTDV','xepLich','xepTay','danY','xuat','xemEm']},
 GVT  :{n:'Phạm Thị Hòa',cd:'GV phụ trách HSG Toán',sc:'Own',gv:'g_hoa',
        q:['vaoMenu','xem','tvThem','tvRoi','nhapDiemThi','chotTDV','xepLich','xepTay','diemDanh','diemNB','danY','xuat','xemEm']},
 GVH  :{n:'Lê Văn Minh',cd:'GV phụ trách HSG Hóa',sc:'Own',gv:'g_minh',
        q:['vaoMenu','xem','tvThem','tvRoi','nhapDiemThi','chotTDV','xepLich','xepTay','diemDanh','diemNB','danY','xuat','xemEm']},
 GVCN :{n:'Nguyễn Văn Hùng',cd:'GVCN 12A2',sc:'Class',lop:'12A2',q:['vaoMenu','xem','dangKy']},
 VT   :{n:'Phan Thị Thảo',cd:'Văn thư',sc:'Branch',dt:'A',q:['vaoMenu','xem','dangKy','nhap']},
 HT   :{n:'Nguyễn Quang Huy',cd:'Hiệu trưởng',sc:'School',q:['vaoMenu','xem','thamSo','xuat']},
 /* OL-6 (§2.7 · ràng buộc 41) — Kế toán KHÔNG còn Feature nào: không `vaoMenu`, nên không tab nào.
    Dòng `KT` ở tab 4 của §15 đã BỎ; đề nghị gỡ 2 ô ghi ở PHIEU-TKOL-1A mục Q. */
 KT   :{n:'Hoàng Thị Yến',cd:'Kế toán',sc:'School',q:[]}
};
let role='FULL';
const R=()=>ROLES[role];
const can=q=>R().q.includes(q);

const ST={tab:'lop',nam:NAM_HIEN,dt:'ALL',lop:null,lSub:'tv',lChip:'all',tvChip:'hoc',
 xDot:null,xLop:'all',xSel:null,tdvChip:'all',bcSub:'mon',bcLop:null,bcThang:null,bcDot:null};

/* SCOPE CỨNG — lớp ngoài phạm vi KHÔNG có trong dữ liệu trả về (không phải ẩn nút) */
function lopTrongPV(){
 const r=R();
 let ls=LOP.filter(l=>dotById(l.dot).nam===ST.nam);
 if(r.sc==='School'&&ST.dt!=='ALL') ls=ls.filter(l=>l.dt===ST.dt);
 if(r.sc==='Branch') ls=ls.filter(l=>l.dt===r.dt);
 if(r.sc==='Group') ls=ls.filter(l=>MON[l.mon].to===r.to);
 if(r.sc==='Own') ls=ls.filter(l=>l.gv===r.gv);
 if(r.sc==='Class') ls=ls.filter(l=>THANH_VIEN.some(t=>t.lop===l.id&&hsById(t.hs).lop===r.lop)
   ||DANG_KY.some(d=>hsById(d.hs).lop===r.lop&&KY_THI.find(k=>k.id===d.ky).lop===l.id));
 return ls;
}

function nhanDuongVao(t){
 if(t.nguon==='thi'){const k=KY_THI.find(x=>x.id===t.ky);return '<span class="tg a">Thi đầu vào</span> <span class="mini">'+(k?k2n(k.ngay):'')+(t.diem!=null?' · '+f1(t.diem):'')+'</span>'}
 return '<span class="tg c">GV thêm trực tiếp</span> <span class="mini">'+esc(t.boi)+'</span>';
}

function scopeBar(extra){
 const r=R(), ls=lopTrongPV(), nam=ST.nam!==NAM_HIEN?' · <b>năm học '+ST.nam+' — chỉ xem</b>':'';
 const pv={School:'School — '+(ST.dt==='ALL'?'toàn trường':DT[ST.dt]),Branch:'Branch — '+DT[r.dt],Group:'Group — tổ '+r.to,
  Own:'Lớp mình phụ trách',Class:'Class — học sinh lớp '+r.lop}[r.sc];
 return '<div class="scope"><b>👁 Phạm vi:</b> '+esc(pv)+' · <b>'+ls.length+'</b> lớp bồi dưỡng'+nam
  +(r.sc==='Class'?' · <b>chỉ đọc</b>':'')+'<span class="sp"></span>'+(extra||'')+'</div>';
}
function crumb(t){$('#crumb').innerHTML=t?'<div class="crumb">'+t+'</div>':''}

function rolebar(){
 $('#rolebar').innerHTML='<b>Chức danh:</b>'+Object.keys(ROLES).map(k=>
  '<button class="rb'+(k===role?' on':'')+'" data-r="'+k+'">'+esc(ROLES[k].cd)+'</button>').join('')
  +'<span class="simw">Hôm nay (mô phỏng): <b style="color:#fff">'+kThu(HOMNAY)+' '+k2s(HOMNAY)+'</b></span>'
  +'<button class="simtg'+(SIM.tkb2?'':' off')+'" data-a="sim.tkb">🔀 M4.6 bộ TKB 2 từ 02/11: '+(SIM.tkb2?'BẬT':'TẮT')+'</button>'
  +'<button class="ntg" id="btnNote">💡 Ghi chú thiết kế: TẮT</button>';
}

function header(){
 const r=R();
 $('#ava').textContent=r.n.split(' ').slice(-2).map(x=>x[0]).join('');
 const khoa=r.sc==='Branch'||r.sc==='Own'||r.sc==='Class'||r.sc==='Group';
 $('#hdt').innerHTML='<option value="ALL">Tất cả điểm trường</option>'+Object.keys(DT).map(d=>'<option value="'+d+'">'+DT[d]+'</option>').join('');
 $('#hdt').value=r.sc==='Branch'?r.dt:ST.dt; $('#hdt').disabled=khoa;
 $('#dtlock').textContent=khoa?'🔒 khóa theo phạm vi '+r.sc:'';
 $('#hnam').value=ST.nam;
 const n=lopTrongPV().reduce((s,l)=>s+viecLop(l).chuaDD.length+viecLop(l).trung.length,0);
 $('#ndot').textContent=n||''; $('#ndot').style.display=n?'grid':'none';
 $('#topact').innerHTML='<button class="btn sm" data-a="audit">🕘 Nhật ký thao tác</button>';
}

/* MỌI TAB HIỆN VỚI MỌI VAI — phạm vi dữ liệu mới theo vai (CLAUDE.md · khung-menu §14.4).
   NGOẠI LỆ DUY NHẤT: vai KHÔNG có Feature nào ở menu này thì menu không nằm trong danh sách menu của họ
   ⇒ không có tab nào để hiện. Đây không phải «ẩn nút theo quyền», mà là dựng đúng hệ quả của OL-6. */
function tabs(){
 if(!can('vaoMenu')){$('#tabs').innerHTML='';return}
 const ls=lopTrongPV(), v={dd:0,tr:0,cx:0};
 ls.filter(l=>!l.huy).forEach(l=>{const x=viecLop(l);v.dd+=x.chuaDD.length;v.tr+=x.trung.length;v.cx+=x.chuaXep.length});
 const cho=KY_THI.filter(k=>!k.chot&&k.ngay<=HOMNAY&&ls.some(l=>l.id===k.lop)).length;
 const T=[['lop','1 · Lớp bồi dưỡng',v.dd,'r'],['thi','2 · Thi đầu vào',cho,'r'],['xep','3 · Xếp lịch buổi học',v.tr+v.cx,v.tr?'r':''],
  ['baocao','4 · Báo cáo kết quả'],['cauhinh','5 · ⚙ Cấu hình']];
 $('#tabs').innerHTML=T.map(([k,n,b,c])=>'<button class="tab1'+(k===ST.tab?' on':'')+'" data-t="'+k+'">'+n
  +(b?'<span class="b '+(c||'')+'">'+b+'</span>':'')+'</button>').join('');
}

/* ═══════════ M11.2 — RENDER + SỰ KIỆN ═══════════ */

function sidebar(){}                                   /* sidebar thuộc demo-html/index.html */

/* ═══ OL-6 (§2.7 · ràng buộc 41) — vai KHÔNG có Feature nào ở M11.2 ═══
   Trên bản thật, menu này không nằm trong danh sách menu của họ nên không có đường vào.
   Demo chỉ có một menu nên dựng đúng HỆ QUẢ: không tab nào, một khối nói rõ số liệu đi đường nào. */
function veNgoaiMenu(){
 return '<div class="scope"><b>👁 Phạm vi:</b> <b>'+esc(R().cd)+'</b> — không có Feature nào ở menu này <span class="sp"></span>'
  +'<span class="tg r">OL-6 · ràng buộc 41</span></div>'
  +'<div class="alert r">🔐<span class="sp"><b>Menu «Bồi dưỡng học sinh giỏi» không nằm trong danh sách menu của '+esc(R().cd)+'.</b> '
  +'Trước 18/9/2026 vai này có một dòng quyền ở tab <b>Báo cáo kết quả</b> để đọc ống kính <b>Số buổi dạy của giáo viên</b>. '
  +'Dòng đó <b>đã bỏ</b> — vào được tab đó là <b>nhìn thấy điểm của học sinh</b>, thứ không liên quan gì đến việc trả tiền dạy '
  +'(dữ liệu cá nhân trẻ em — Luật BVDLCN 91/2025, nguyên tắc tối thiểu hóa).</span></div>'
  +'<div class="tbw"><div class="ch">Vậy số buổi dạy đến với kế toán bằng đường nào</div><div style="padding:13px 15px;font-size:12.5px;line-height:1.75">'
  +'<b>Số được ĐẨY sang, không phải được tra.</b> Người phụ trách chuyên môn bấm <b>🔒 Chốt &lt;tháng&gt; → M7.6</b> ở tab Báo cáo; '
  +'số buổi và số tiết của từng người thực dạy sang <b>cột riêng «buổi bồi dưỡng / ôn luyện (M11.x)»</b> của '
  +'<a class="lk" data-lnk="M7.6">M7.6 — KPI &amp; lương</a>, <b>chưa quy đổi</b>. Quy đổi và chi trả là việc của M7.6.'
  +'<div class="ln" style="margin-top:9px"><b>Phía nhận ở M7.6</b> là <b>một tab hoặc một khối riêng — chỉ thống kê, không có thao tác chỉnh sửa</b>: '
  +'tháng · người thực dạy · số buổi · số tiết · ai chốt · lúc nào · cảnh báo khi số liệu đổi sau khi chốt. '
  +'<span class="mini">Khối đó <b>chưa dựng</b> — thuộc M7.6, ghi ở §16 #20.</span></div>'
  +'<div class="ln"><b>Vì sao đẩy chứ không cho tra.</b> Tra trực tiếp thì kế toán đọc được cả con số <b>chưa chốt</b> — '
  +'con số này đổi theo từng buổi điểm danh, nên tiền có thể ra trước khi số ổn định. Đẩy sang buộc phải có <b>một thời điểm chốt rõ ràng</b>.</div>'
  +'<div class="ln" style="border-bottom:none"><b>Và kế toán có một mặt bàn duy nhất.</b> Mỗi lần một menu nghiệp vụ mở hé một ô cho kế toán vào tra '
  +'là một lần phải nhớ «số này tra ở đâu». Đúng chiều là: <b>menu nghiệp vụ chốt rồi đẩy; kế toán đọc ở chỗ của mình</b> '
  +'<span class="mini">(cùng ranh giới M6.1 §8.1 — nghiệp vụ sở hữu SỐ LƯỢNG, tài chính sở hữu TIỀN).</span></div>'
  +'</div></div>';
}

function render(){
 rolebar(); header(); tabs(); crumb('');
 const c=$('#content');
 c.innerHTML=can('vaoMenu')
  ?(ST.tab==='lop'?veLopList():ST.tab==='thi'?veThi():ST.tab==='xep'?veXepLich():ST.tab==='baocao'?veBaoCao():veCauHinh())
  :veNgoaiMenu();
 const nn=document.body.classList.contains('nn');
 $('#btnNote').classList.toggle('on',!nn);
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(nn?'TẮT':'BẬT');
}

ON['nav.tab']=v=>{closeM();ST.tab=v;ST.lop=null;ST.xSel=null;render()};
ON['sim.tkb']=()=>{SIM.tkb2=!SIM.tkb2;render();
 toast(SIM.tkb2?'🔀 <b>Bộ TKB 2</b> áp dụng từ 02/11: lớp <b>11A2</b> học thêm chiều T3. Các buổi Hóa đã xếp vào T3 <b>tự hiện ⛔</b> — không tự dời.'
  :'🔀 Tắt bộ TKB 2 — lịch chính khóa về bộ 1. Cảnh báo trên các buổi Hóa T3 <b>biến mất ngay</b>: trùng lịch là trạng thái dẫn xuất, không phải cờ lưu.')};
ON['audit']=()=>modal('🕘 Nhật ký thao tác — M11.2',AUDIT.length?'<table><tr><th>Lúc</th><th>Người</th><th>Việc</th><th>Chi tiết</th></tr>'
 +AUDIT.map(a=>'<tr><td class="nw">'+a.luc+'</td><td>'+esc(a.boi)+'<div class="mini">'+esc(a.vai)+'</div></td><td>'+esc(a.viec)+'</td><td class="mini">'+esc(a.chiTiet)+'</td></tr>').join('')+'</table>'
 :'<div class="empty">Chưa có thao tác nào trong phiên demo này.</div>','<button class="btn" data-mb="close">Đóng</button>');

document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 const a=t.closest('[data-a]'); if(a&&a.dataset.a&&ON[a.dataset.a]){ON[a.dataset.a](a.dataset.v,a);return}
 if(t===$('#mask')){closeM();return}
 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r;ST.lop=null;ST.xSel=null;ST.bcLop=null;if(R().sc==='Branch')ST.dt=R().dt;render();return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn');render();return}
 const tb=t.closest('[data-t]'); if(tb){ST.tab=tb.dataset.t;ST.lop=null;ST.xSel=null;render();return}
 const lk=t.closest('[data-lnk]'); if(lk){toast('🔗 Deep-link sang <b>'+esc(lk.dataset.lnk)+'</b> — mở sẵn đúng ngữ cảnh, quay lại được M11.2 (<code>D3</code>). M11.2 không ghi vào menu đó.');return}
});

/* ô nhập — điểm nội bộ · điểm thi · ngưỡng · tick chọn · lý do lệch */
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.diem){const[bai,hs]=t.dataset.diem.split('|'), v=t.value.trim();
  if(v===''){if(DIEM[bai])delete DIEM[bai][hs];render();return}
  const n=+v.replace(',','.');if(isNaN(n)||n<0||n>CFG.thang){toast('⛔ Điểm phải từ 0 đến '+CFG.thang+'.');render();return}
  (DIEM[bai]=DIEM[bai]||{})[hs]=n;ghiAudit('Nhập điểm nội bộ',bai+' · '+tenHS(hs)+' = '+n);render();return}
 if(t.dataset.tdv){const[id,j]=t.dataset.tdv.split('|'), d=DANG_KY.find(x=>x.id===id), v=t.value.trim();
  const n=v===''?null:+v.replace(',','.');if(n!=null&&(isNaN(n)||n<0||n>10)){toast('⛔ Điểm bài thi từ 0 đến 10.');render();return}
  d.d[+j]=n;ghiAudit('Nhập điểm thi đầu vào',tenHS(d.hs)+' bài '+(+j+1)+' = '+(n==null?'vắng':n));render();return}
 if(t.dataset.ng){const k=KY_THI.find(x=>x.id===t.dataset.ng), n=+t.value.replace(',','.');if(!isNaN(n)){k.nguong=n;ghiAudit('Đổi ngưỡng gợi ý',k.ten+' = '+n)}render();return}
 if(t.dataset.chon){const d=DANG_KY.find(x=>x.id===t.dataset.chon);d.chon=t.checked;render();return}
 if(t.dataset.lyd){DANG_KY.find(x=>x.id===t.dataset.lyd).lyDo=t.value;render();return}
 if(t.id==='hnam'){ST.nam=t.value;ST.lop=null;ST.xSel=null;ST.xDot=null;ST.bcThang=null;ST.bcLop=null;KQ_XEP=null;render();return}
 if(t.id==='hdt'){ST.dt=t.value;render();return}
});

render();
</script>
