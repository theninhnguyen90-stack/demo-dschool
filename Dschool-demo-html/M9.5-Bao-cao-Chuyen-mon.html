       (`DLC.vai`). Hệ quả: phân công tự gieo (`seedPC`) đổi nhẹ ⇒ vài ô tab 5–8
       đổi — bảng trước / sau ở phiếu `V22` mục D.
   ⚠ Lớp của menu này (`LOP` mục ②, 15 lớp liên cấp) VẪN là dữ liệu riêng — chưa
   nối `DLC.lop` (10 lớp THCS). Ghi mục E của phiếu `V22`.
   Demo ⛔ không ghi vào `DLC` — mỗi dòng dưới đây là bản SAO CHÉP.             */
const DT = {}; DLC.diemTruong.forEach(d => { DT[d.ma] = d.ten });
const TO = ['Tổ Toán — Tin', 'Tổ Ngữ văn', 'Tổ Ngoại ngữ', 'Tổ Lý — Hóa — Sinh',
  'Tổ Sử — Địa — GDCD', 'Tổ Thể dục — Nghệ thuật'];
const saoNguoi = (x, id) => ({ id, ma: x.ma, ten: x.ten, to: x.to, hang: x.hang, cv: x.chucVu || '',
  gvcn: !!x.gvcnLop, dt: x.dt, cap: x.capDinhMuc });
/* ★ Hai cột `dt` và `cap` là của `M4.1` / `M4.4`; `M5.5` không cần. Ở đây bắt
   buộc phải có: báo cáo cắt theo Điểm trường, và định mức chuẩn đọc theo CẤP
   HỌC (`M4.4` §5.5.2 — trường liên cấp sau sáp nhập).
   Bộ KPI `B1` áp cho người có số chốt Quý I trong `DLC` — đúng 26 người.     */
const GV = DLC.nhanSu.filter(x => x.kpi).map((x, i) => saoNguoi(x, 'G' + (i + 1)));
const gvBy = id => GV.find(g => g.id === id);
const gvTen = t => GV.find(g => g.ten === t);

/* Ban giám hiệu — KHÔNG nằm trong 26 giáo viên trên. `M4.5` §7.4.2:
   «Ban giám hiệu không vào hai cảnh báo Vượt / Thiếu» — định mức 2 và 4 tiết,
   lệch MỘT tiết đã là 25–50%, áp ngưỡng phần trăm lên mẫu số đó chỉ sinh
   cảnh báo giả. Họ vẫn hiện đủ số liệu, chỉ không tô màu và không vào đếm. */
/* ── Một giáo viên MỚI TUYỂN giữa năm — `M4.5` §7.4.2 (anh Ninh chốt 18/9):
   «Người mới tuyển giữa năm KHÔNG bị loại khỏi bảng… Nhưng không đếm họ là
   thiếu định mức» — chưa gán `Môn được phép dạy` ở `M4.4` thì chưa suy được
   cấp học, chưa có ngưỡng nào để so ⇒ con số thứ ba «Chưa đo được».
   🛑 ĐỂ NGOÀI mảng `GV`: mảng ấy phải giữ ĐÚNG 26 người của demo `M5.5`, nếu
   không bộ sinh số giả ngẫu nhiên lệch pha và tab 4 hết đối chiếu được.
   ⚠ Giáo viên BIỆT PHÁI ĐI của `DLC` (`Lê Thị Tâm`) ⛔ không vào menu này: không
   dạy ở trường trong năm học, không có phân công, không vào bộ KPI.        */
const GV_MOI = DLC.nhanSu.filter(x => x.moiTuyen).map((x, i) => Object.assign(saoNguoi(x, 'N' + (i + 1)), { moiTuyen: x.moiTuyen }));
const BGH = DLC.nhanSu.filter(x => x.to === 'Ban giám hiệu')
  .map((x, i) => Object.assign(saoNguoi(x, 'H' + (i + 1)), { dmRieng: x.dinhMucRieng }));
const MOI_NGUOI = GV.concat(GV_MOI, BGH);
const nguoiBy = id => MOI_NGUOI.find(g => g.id === id);
const laBGH = g => g.to === 'Ban giám hiệu';
const chuaDoDuoc = g => !laBGH(g) && !g.cap;
const TO_MR = TO.concat(['Ban giám hiệu']);

/* ═══════════════ ② MÔN HỌC · LỚP — chiếu `M10.2` ② và `M10.1` ⑤ ⑥ ═════
   🔑 `HDPC` ① ② — mỗi môn có một PHƯƠNG THỨC TỔ CHỨC KIẾN THỨC; môn không
   chia phần mang `PT0 — Toàn môn` với đúng MỘT phần trùng tên môn. Đây là
   thứ giữ cho các môn còn lại chạy y hệt trước cụm `GDDP`.                */
const MON = [
  { ma: 'TOAN', ten: 'Toán', to: 'Tổ Toán — Tin', pt: 'PT0' },
  { ma: 'TIN', ten: 'Tin học', to: 'Tổ Toán — Tin', pt: 'PT0' },
  { ma: 'VAN', ten: 'Ngữ văn', to: 'Tổ Ngữ văn', pt: 'PT0' },
  { ma: 'ANH', ten: 'Tiếng Anh', to: 'Tổ Ngoại ngữ', pt: 'PT0' },
  { ma: 'KHTN', ten: 'Khoa học tự nhiên', to: 'Tổ Lý — Hóa — Sinh', pt: 'PT3', phan: ['Vật lí', 'Hóa học', 'Sinh học'] },
  { ma: 'LY', ten: 'Vật lí', to: 'Tổ Lý — Hóa — Sinh', pt: 'PT0' },
  { ma: 'HOA', ten: 'Hóa học', to: 'Tổ Lý — Hóa — Sinh', pt: 'PT0' },
  { ma: 'SINH', ten: 'Sinh học', to: 'Tổ Lý — Hóa — Sinh', pt: 'PT0' },
  { ma: 'LSDL', ten: 'Lịch sử & Địa lí', to: 'Tổ Sử — Địa — GDCD', pt: 'PT2', phan: ['Lịch sử', 'Địa lí'] },
  { ma: 'SU', ten: 'Lịch sử', to: 'Tổ Sử — Địa — GDCD', pt: 'PT0' },
  { ma: 'GDCD', ten: 'Giáo dục công dân', to: 'Tổ Sử — Địa — GDCD', pt: 'PT0' },
  { ma: 'GDDP', ten: 'Giáo dục địa phương', to: 'Tổ Sử — Địa — GDCD', pt: 'PT3', phan: ['Mạch Văn hóa — Lịch sử', 'Mạch Địa lí — Kinh tế', 'Mạch Môi trường — Hướng nghiệp'] },
  { ma: 'GDTC', ten: 'Giáo dục thể chất', to: 'Tổ Thể dục — Nghệ thuật', pt: 'PT0' },
  { ma: 'NT', ten: 'Nghệ thuật', to: 'Tổ Thể dục — Nghệ thuật', pt: 'PT0' },
  /* 🔑 `Hoạt động trải nghiệm` KHÔNG thuộc một tổ bộ môn nào. Bộ GD&ĐT nói phần
     này «không trùng với nhiệm vụ của giáo viên làm chủ nhiệm lớp» nhưng vẫn
     được tính giờ (`M4.4` §note) — thực tế trường giao cho giáo viên chủ nhiệm
     và rải khắp các tổ. Gán cả 105 tiết/năm × 15 lớp cho một tổ ba người là
     tạo ra một con số quá tải KHÔNG CÓ THẬT.                              */
  { ma: 'HDTN', ten: 'Hoạt động trải nghiệm', to: '*', pt: 'PT0' }
];
const monBy = ma => MON.find(m => m.ma === ma);
const phanCua = m => m.phan ? m.phan.slice() : [m.ten];

const LOP = [];
[['6A1', 6, 'A'], ['6A2', 6, 'A'], ['7A1', 7, 'A'], ['7A2', 7, 'A'], ['8A1', 8, 'A'], ['8A2', 8, 'A'],
['9A1', 9, 'A'], ['9A2', 9, 'A'], ['10A1', 10, 'A'], ['10A2', 10, 'A'], ['11A1', 11, 'A'],
['6B1', 6, 'B'], ['7B1', 7, 'B'], ['8B1', 8, 'B'], ['9B1', 9, 'B']].forEach(function (x) {
  LOP.push({ id: x[0], ten: x[0], khoi: x[1], dt: x[2], cap: x[1] <= 9 ? 'THCS' : 'THPT' });
});
const lopBy = id => LOP.find(l => l.id === id);

/* môn của từng khối — `M10.1` ⑥ `MON_CUA_LOP`. THCS theo CT GDPT 2018 học
   `Khoa học tự nhiên` và `Lịch sử & Địa lí` dạng môn tích hợp; THPT tách. */
const MON_KHOI = {
  6: ['TOAN', 'VAN', 'ANH', 'KHTN', 'LSDL', 'GDCD', 'TIN', 'GDDP', 'GDTC', 'NT', 'HDTN'],
  7: ['TOAN', 'VAN', 'ANH', 'KHTN', 'LSDL', 'GDCD', 'TIN', 'GDDP', 'GDTC', 'NT', 'HDTN'],
  8: ['TOAN', 'VAN', 'ANH', 'KHTN', 'LSDL', 'GDCD', 'TIN', 'GDDP', 'GDTC', 'NT', 'HDTN'],
  9: ['TOAN', 'VAN', 'ANH', 'KHTN', 'LSDL', 'GDCD', 'TIN', 'GDDP', 'GDTC', 'NT', 'HDTN'],
  10: ['TOAN', 'VAN', 'ANH', 'LY', 'HOA', 'SINH', 'SU', 'TIN', 'GDDP', 'GDTC', 'HDTN'],
  11: ['TOAN', 'VAN', 'ANH', 'LY', 'HOA', 'SINH', 'SU', 'TIN', 'GDDP', 'GDTC', 'HDTN']
};
/* 35 tuần thực học — `M5.1` §7.1, khớp khung QĐ 2308 (HK1 18 · HK2 17). */
const TUAN_NAM = 35;
const TIET_NAM = {
  TOAN: { 6: 140, 7: 140, 8: 140, 9: 140, 10: 105, 11: 105 },
  VAN: { 6: 140, 7: 140, 8: 140, 9: 140, 10: 105, 11: 105 },
  ANH: { 6: 105, 7: 105, 8: 105, 9: 105, 10: 105, 11: 105 },
  KHTN: { 6: 140, 7: 140, 8: 140, 9: 140 },
  LSDL: { 6: 105, 7: 105, 8: 105, 9: 105 },
  GDCD: { 6: 35, 7: 35, 8: 35, 9: 35 },
  TIN: { 6: 35, 7: 35, 8: 35, 9: 35, 10: 70, 11: 70 },
  GDDP: { 6: 35, 7: 35, 8: 35, 9: 35, 10: 35, 11: 35 },
  GDTC: { 6: 70, 7: 70, 8: 70, 9: 70, 10: 70, 11: 70 },
  NT: { 6: 70, 7: 70, 8: 70, 9: 70 },
  HDTN: { 6: 105, 7: 105, 8: 105, 9: 105, 10: 105, 11: 105 },
  LY: { 10: 70, 11: 70 }, HOA: { 10: 70, 11: 70 }, SINH: { 10: 70, 11: 70 }, SU: { 10: 70, 11: 70 }
};
const tietNam = (maMon, khoi) => (TIET_NAM[maMon] || {})[khoi] || 0;

/* ── chia số tiết theo PHẦN — `HDPC` ④, tầng ④ của `M5.1` §7b ──────────
   🛑 Bất biến: Σ số tiết các phần của một `Lớp × Môn` = số tiết của môn đó.
   Tỉ lệ thật KHÔNG chia hết — KHTN 140 tiết chia 45 · 45 · 50 (`GDDP-2A` B3).
   Số lẻ là CÓ THẬT, không phải lỗi làm tròn: 45 / 35 = 1,29 tiết/tuần. Tròn ở
   từng dòng thì TỔNG LỆCH, và tổng lệch chính là «thừa hoặc thiếu giờ của
   phân môn» mà góp ý `GY-L5ML` hỏi.                                       */
const TILE_PHAN = {
  KHTN: [45, 45, 50],      /* Vật lí · Hóa học · Sinh học — trên 140 */
  LSDL: [52, 53],          /* Lịch sử · Địa lí — trên 105 */
  GDDP: [12, 12, 11]       /* ba mạch Phú Thọ — trên 35. SỐ TẠM: QĐ 18/2026 cho
                              khung ba mạch · 35 tiết/năm nhưng KHÔNG chia tiết
                              từng mạch (`PHIEU-GDDP-1A` B11 — `GDĐP-6` đang chờ
                              trường trả lời). Báo cáo nói rõ trên màn hình. */
};
function chiaTiet(maMon, khoi) {
  const m = monBy(maMon), tong = tietNam(maMon, khoi);
  if (!m || !tong) return [];
  const ph = phanCua(m);
  if (m.pt === 'PT0') return [{ phan: ph[0], tiet: tong }];
  const t = TILE_PHAN[maMon] || ph.map(() => Math.round(tong / ph.length));
  return ph.map((p, i) => ({ phan: p, tiet: t[i] }));
}
/* mọi ô `Lớp × Môn × Phần` của trường — đơn vị nhỏ nhất mà cụm `GDDP` chốt */
const O_LMP = [];
LOP.forEach(function (l) {
  (MON_KHOI[l.khoi] || []).forEach(function (ma) {
    chiaTiet(ma, l.khoi).forEach(function (x) {
      O_LMP.push({ lop: l.id, dt: l.dt, khoi: l.khoi, mon: ma, phan: x.phan, tiet: x.tiet,
        tietTuan: Math.round(x.tiet / TUAN_NAM * 100) / 100 });
    });
  });
});

/* ═══════════ ③ `M4.4` — ĐỊNH MỨC GIẢNG DẠY (chiếu `m4.4.dinh_muc_giang_day`)
   Công thức của `M4.4` §5.5.1, KHÔNG viết lại:
       Định mức đề xuất = Khung chuẩn theo cấp
                        − Σ(giảm theo chức vụ đang giữ)
                        − Σ(giảm theo kiêm nhiệm đang giữ)
   Khung chuẩn TT 05/2025: Tiểu học 23 · THCS 19 · THPT 17 · HT 2 · PHT 4. */
const KHUNG_CHUAN = { 'Tiểu học': 23, THCS: 19, THPT: 17 };
const CHE_DO_GIAM = {
  'Tổ trưởng': 3, 'Tổ phó': 1, 'Chủ nhiệm lớp': 4, 'Chủ tịch Công đoàn': 2,
  'Tổng phụ trách Đội': 8
};
/* kiêm nhiệm ngoài chức vụ tổ — chiếu `M4.3` */
const KIEM_NHIEM = { 'Trần Văn Hải': ['Tổng phụ trách Đội'], 'Nguyễn Thị Hạnh': ['Chủ tịch Công đoàn'] };
/* ghi đè định mức — `M4.4` §5.5.1: «Ghi đè bắt buộc nêu lý do», cờ `Có ngoại lệ`,
   Hiệu trưởng duyệt. Đây là con số quyết định thù lao vượt giờ ở `M4.9`.     */
const NGOAI_LE_DM = {
  'Đỗ Thị Lan': { dm: 9, ly: 'Nghỉ ốm dài ngày 09/11/2026 → 15/12/2026 (M4.2) — giảm định mức nửa kỳ, Hiệu trưởng duyệt 12/11/2026' }
};
function giamCua(g) {
  const r = [];
  if (g.cv === 'Tổ trưởng') r.push(['Tổ trưởng', 3]);
  if (g.cv === 'Tổ phó') r.push(['Tổ phó', 1]);
  if (g.gvcn) r.push(['Chủ nhiệm lớp', 4]);
  (KIEM_NHIEM[g.ten] || []).forEach(k => r.push([k, CHE_DO_GIAM[k]]));
  return r;
}
/* Ngưỡng PHẢI ĐẠT — `M4.5` §7.4.2 sửa vế của `nh3.3.1` §5.1:
   Ngưỡng phải đạt = Định mức chuẩn − Giảm định mức.  Quy đổi hoạt động là
   CÔNG VIỆC ĐÃ LÀM, thuộc vế giáo viên — không cộng vào ngưỡng.             */
function nguongCua(g) {
  if (laBGH(g)) return g.dmRieng;
  /* 🛑 Chưa gán `Môn được phép dạy` ở `M4.4` ⇒ chưa suy được cấp học ⇒ KHÔNG
     CÓ NGƯỠNG NÀO ĐỂ SO. Trả `null`, ⛔ không rơi về một con số mặc định:
     mặc định 19 sẽ biến một việc chưa làm ở khâu hồ sơ thành «thiếu 19 tiết»
     của người lao động (`M4.5` §7.4.2).                                   */
  if (!g.cap) return null;
  const nl = NGOAI_LE_DM[g.ten];
  if (nl) return nl.dm;
  return Math.max(0, KHUNG_CHUAN[g.cap] - giamCua(g).reduce((a, x) => a + x[1], 0));
}
const chuanCua = g => laBGH(g) ? g.dmRieng : (g.cap ? KHUNG_CHUAN[g.cap] : null);
/* quy đổi hoạt động (dự giờ tập trung · coi chấm thi · bồi dưỡng HSG) — tiết/tuần */
const QUY_DOI = { 'Phạm Minh Tuấn': 2, 'Vũ Đình Khoa': 2, 'Trần Thị Bích': 1,
  'Nguyễn Thị Hạnh': 1, 'Bùi Thị Thu': 1, 'Đinh Văn Phúc': 1 };
const quyDoiCua = g => QUY_DOI[g.ten] || 0;

/* ═══════════ ④ `M4.5` — PHÂN CÔNG GIẢNG DẠY theo PHẦN ══════════════════
   🔑 `HDPC` ⑥ — khóa `(lop_id, mon_id, phan_ma) → giao_vien_id`, và
   **số tiết của một dòng = số tiết của PHẦN**, không phải của cả môn.
   `GDDP-2A` B2: số tiết/tuần của một dòng = số tiết/năm của phần ÷ 35, giữ
   số thực, hiện MỘT chữ số thập phân. ⛔ KHÔNG làm tròn ở từng dòng (B3).

   ⚠ Đây là chỗ cụm `GDDP` sửa một lỗi TIỀN: trước v3.0, người duy nhất đứng
   tên môn GDĐP của 3 lớp nhận 105 tiết/năm ẢO (17,6% định mức năm), bị đẩy
   sang phía «vượt» — mà vượt định mức là căn cứ trả thù lao dạy thêm giờ —
   còn ba đồng nghiệp thực dạy các mạch kia thì rơi vào «thiếu định mức».  */
const PC = []; let PCSEQ = 0;
/* ô CỐ Ý để trống — hai loại thiếu của `M4.5` §7.2 phải tách đôi */
const O_TRONG = {
  '9B1|NT|Nghệ thuật': 'nangluc',        /* 🔴 KHÔNG một giáo viên nào được gán phần này ở M4.4 */
  '8B1|TIN|Tin học': 'phancong',         /* 🟡 có người gán được ở M4.4 nhưng chưa ai nhận lớp */
  '11A1|GDDP|Mạch Môi trường — Hướng nghiệp': 'phancong'
};
(function seedPC() {
  /* ── Gán theo SỨC CHỨA CÒN LẠI, không gán vòng tròn ──────────────────
     Vòng tròn chia đều SỐ Ô, nhưng các ô không bằng nhau: một ô Toán là 4
     tiết/tuần, một ô Giáo dục công dân là 1. Chia đều số ô thì người nhận
     toàn ô nặng vọt lên 38 tiết/tuần trong khi đồng nghiệp còn 3 — và bảng
     cân đối của tab 6 báo một sự quá tải KHÔNG CÓ THẬT, do chính cách gieo
     dữ liệu đẻ ra chứ không phải do nhà trường.
     Trường thật phân công theo sức chứa: ai còn nhiều giờ trống nhất thì
     nhận ô tiếp theo. Ưu tiên cùng điểm trường và cùng cấp; hết thì MƯỢN
     người điểm trường khác — cross-branch hợp lệ (`M4.5` §7.1 khối ba). */
  const con = {};
  MOI_NGUOI.forEach(function (g) { con[g.id] = laBGH(g) || !g.cap ? -99 : nguongCua(g) });
  function chon(pool, o) {
    if (!pool.length) return null;
    /* ⛔ KHÔNG ưu tiên theo cấp học. Trường liên cấp sau sáp nhập thì một
       giáo viên dạy cả hai cấp; `cap` chỉ là **cấp học TÍNH ĐỊNH MỨC** đã
       khai ở `M4.4` §5.5.2, không phải giới hạn được dạy lớp nào. Ưu tiên
       theo cấp thì 6 người khai THPT chia nhau 3 lớp THPT và ai cũng hụt
       giờ — một con số «thiếu định mức» do cách gieo đẻ ra, không có thật. */
    const bo = [pool.filter(g => g.dt === o.dt), pool];
    for (const b of bo) {
      if (!b.length) continue;
      let best = null;
      b.forEach(function (g) { if (!best || con[g.id] > con[best.id]) best = g });
      if (best && con[best.id] > -99) return best;
    }
    return null;
  }
  /* ① môn CÓ TỔ — bể người là tổ sở hữu môn. Xếp ô NẶNG trước để ô nhẹ còn
     chỗ lấp vào chỗ trống, đúng cách người xếp lịch làm bằng tay.        */
  const coTo = O_LMP.filter(x => monBy(x.mon).to !== '*')
    .slice().sort((a, b) => b.tietTuan - a.tietTuan || (a.lop + a.mon + a.phan).localeCompare(b.lop + b.mon + b.phan, 'vi'));
  /* ② `Hoạt động trải nghiệm` — bể người là CẢ TRƯỜNG (§ MON, mã HDTN) */
  const moiTo = O_LMP.filter(x => monBy(x.mon).to === '*')
    .slice().sort((a, b) => (a.lop).localeCompare(b.lop, 'vi'));

  function gan(ds, poolCua) {
    ds.forEach(function (o) {
      const khoa = o.lop + '|' + o.mon + '|' + o.phan;
      if (O_TRONG[khoa]) return;
      const m = monBy(o.mon), g = chon(poolCua(m), o);
      if (!g) return;
      con[g.id] -= o.tietTuan;
      PC.push({
        id: 'PC' + (++PCSEQ), lop: o.lop, dt: o.dt, khoi: o.khoi, mon: o.mon, phan: o.phan,
        gv: g.id, to: g.to, tiet: o.tiet, tietTuan: o.tietTuan, tuanTu: 1, tuanDen: TUAN_NAM,
        loaiPhan: m.pt === 'PT0' ? 'Toàn môn' : 'Phân môn'
      });
    });
  }
  const daySong = GV.filter(g => g.cap);
  gan(coTo, m => daySong.filter(g => g.to === m.to));
  gan(moiTo, () => daySong);
  PC.sort((a, b) => a.id.localeCompare(b.id, 'en', { numeric: true }));

  /* ── Một ca BÀN GIAO thật — `HDPC` ⑥ `loai_phan = Bàn giao` ────────────
     Cô Lê Thị Mai nghỉ thai sản từ tuần 16. Phần Ngữ văn của lớp cô dạy được
     cắt tại tuần 16 (`✂ Cắt phần tại tuần…` ở `M5.1`): MỘT phần, HAI ĐOẠN,
     hai người. 🛑 Đoạn sau KHÔNG phải dạy thay (`M4.7` §4.6) — nó là giờ dạy
     theo kế hoạch của người nhận bàn giao, chảy vào ĐỊNH MỨC của chính họ.
     Cho nó thành dạy thay thì một người nghỉ thai sản cả học kỳ sinh ra hàng
     trăm bản ghi dạy thay, và người nhận được trả thù lao dạy thay thay vì
     được tính định mức.                                                   */
  const mai = gvTen('Lê Thị Mai'), hung = gvTen('Trần Quốc Hưng');
  const d = PC.find(x => x.gv === mai.id && x.mon === 'VAN');
  if (d) {
    const tongTiet = d.tiet;
    d.tuanDen = 15; d.tiet = Math.round(tongTiet * 15 / TUAN_NAM);
    d.tietTuan = Math.round(d.tiet / 15 * 100) / 100;
    PC.push({
      id: 'PC' + (++PCSEQ), lop: d.lop, dt: d.dt, khoi: d.khoi, mon: 'VAN', phan: d.phan,
      gv: hung.id, to: hung.to, tiet: tongTiet - d.tiet,
      tietTuan: Math.round((tongTiet - d.tiet) / (TUAN_NAM - 15) * 100) / 100,
      tuanTu: 16, tuanDen: TUAN_NAM, loaiPhan: 'Bàn giao',
      ghi: 'Cô Lê Thị Mai nghỉ thai sản từ tuần 16 — bàn giao đoạn sau của CÙNG MỘT phần'
    });
  }
})();
const pcCua = gid => PC.filter(p => p.gv === gid);
/* Tiết lên lớp của một người — Σ số tiết/tuần các DÒNG phân công người đó giữ.
   `M4.4` §0 · `HDPC` ⑥: định mức đọc số tiết của DÒNG, không của cả môn.   */
const tietLenLop = gid => Math.round(pcCua(gid).reduce((a, p) => a + p.tietTuan, 0) * 100) / 100;
/* ⚙ ngưỡng cảnh báo định mức — `M4.5` §7.4.2b (`GY18-I`, chốt 18/9/2026).
   MỘT ngưỡng chung cho cả trường, không tách theo cấp học (§10 #10).      */
const NGUONG_THIEU = 0.10;      /* 10% ngưỡng phải đạt — sửa được ở M4.5, 1–49% */
const TRAN_VUOT = 0.50;         /* 50% — TT 05/2025, số pháp lý, KHÔNG sửa được */
function canDoi(g) {
  const nguong = nguongCua(g), lam = tietLenLop(g.id) + quyDoiCua(g);
  const chenh = nguong == null ? null : Math.round((lam - nguong) * 100) / 100;
  let muc = 'trong';
  if (nguong == null) muc = 'chuado';
  else if (chenh > nguong * TRAN_VUOT) muc = 'vuot';
  else if (chenh < 0 && Math.abs(chenh) >= nguong * NGUONG_THIEU) muc = 'thieu';
  return { nguong, chuan: chuanCua(g), giam: giamCua(g), lenLop: tietLenLop(g.id),
    quyDoi: quyDoiCua(g), lam: Math.round(lam * 100) / 100, chenh, muc };
}

/* ═══════════ ⑤ `M4.6` — KHUNG TIẾT và THỜI KHÓA BIỂU ═══════════════════
   Ô khả dụng của một lớp = số ngày dạy × số tiết mỗi buổi (khung tiết của
   ĐIỂM TRƯỜNG — `M4.6` §8.1c.1: mọi bộ giờ cùng khung, chỉ khác GIỜ).     */
const KHUNG_TIET = {
  A: { ngay: 6, sang: 5, chieu: 2, ten: 'Điểm trường A — 6 ngày · sáng 5 · chiều 2' },
  B: { ngay: 5, sang: 5, chieu: 0, ten: 'Điểm trường B — 5 ngày · sáng 5, không học chiều' }
};
const oKhaDung = lop => { const k = KHUNG_TIET[lop.dt]; return k.ngay * (k.sang + k.chieu); };
/* tiết ĐÃ XẾP trong mẫu tuần — dẫn xuất từ phân công đang có hiệu lực ở
   tuần hiện tại. Ô chưa xếp = phần của môn mà bộ TKB đang áp dụng chưa đặt. */
const TUAN_HIEN_TAI = 16;       /* 28/12/2026 rơi vào tuần 16 của năm học */
const tuanTrong = (p, t) => t >= p.tuanTu && t <= p.tuanDen;
function tkbLop(lopId, tuan) {
  return PC.filter(p => p.lop === lopId && tuanTrong(p, tuan));
}
/* CỐ Ý chưa xếp — bộ TKB đang áp dụng còn ô trống (`M4.6` §5 bảng kết quả) */
const CHUA_XEP = { '9B1': 2, '8B1': 1, '11A1': 1 };
function tietDaXep(lopId, tuan) {
  const can = tkbLop(lopId, tuan).reduce((a, p) => a + p.tietTuan, 0);
  return Math.max(0, Math.round((can - (CHUA_XEP[lopId] || 0)) * 100) / 100);
}
/* «buổi trống chen giữa» — TK.02*: một BUỔI mà giáo viên có tiết ở buổi
   trước và buổi sau trong cùng ngày nhưng không có tiết ở buổi giữa. Đây là
   CHỈ SỐ CHẤT LƯỢNG THỜI KHÓA BIỂU, ⛔ KHÔNG phải chỉ tiêu đánh giá giáo
   viên: nó do người xếp lịch tạo ra, không do người dạy.                  */
const BUOI_TRONG = {
  'Trần Thị Bích': 1, 'Hoàng Văn Nam': 3, 'Vũ Thị Ngọc': 2, 'Trịnh Thị Vân': 3,
  'Đặng Thị Quỳnh': 2, 'Tạ Thị Bình': 2, 'Đỗ Văn Trung': 4, 'Lê Văn Dũng': 1,
  'Ngô Văn Kiên': 1, 'Dương Văn Thắng': 1
};
const buoiTrong = g => BUOI_TRONG[g.ten] || 0;

/* ═══════════ ⑥ LỊCH TUẦN CỦA NĂM HỌC — `M10.1` ① + `M10.9` ═════════════
   Tuần 1 bắt đầu thứ Hai 07/09/2026. `M5.1` §7.1: tuần NGHỈ TRỌN không đánh
   số và không tính vào 35 tuần thực học.                                  */
const TUAN1_T2 = '2026-09-07';
const tuanBatDau = t => themNgay(TUAN1_T2, (t - 1) * 7);
const tuanKetThuc = t => themNgay(TUAN1_T2, (t - 1) * 7 + 5);       /* thứ Bảy */
function tuanCua(ngay) {
  const n = Math.floor(soNgay(TUAN1_T2, ngay) / 7) + 1;
  return n < 1 ? 1 : (n > TUAN_NAM ? TUAN_NAM : n);
}
const TUAN = [];
for (let t = 1; t <= TUAN_NAM; t++) TUAN.push({ so: t, tu: tuanBatDau(t), den: tuanKetThuc(t) });

/* bộ sinh số giả ngẫu nhiên RIÊNG của phần chiếu (không đụng bộ của `M5.5`) */
let _r = 20260920;
const rnd5 = () => { _r = (_r * 1103515245 + 12345) & 0x7fffffff; return _r / 0x7fffffff; };

/* ═══════════ ⑦ `M5.1` — KHGD · THẺ BÀI · TIẾN ĐỘ ══════════════════════
   Chiếu `m5.1.ke_hoach_giang_day` + `m5.1.tien_do_theo_tuan`.
   🔑 `GDDP` hệ quả 2: tiến độ tính theo LƯỢT PHÂN CÔNG, ⛔ không theo cặp
   `Lớp × Môn` — một môn nay có nhiều giáo viên cùng dạy, mỗi người chạy một
   mạch riêng và có thể lệch tiến độ khác nhau.                            */
const KHGD = {};      /* khóa `mon|khoi` → {tt: 'ap'|'chuadu'|'khong', soBai} */
(function seedKHGD() {
  const cap = {};
  O_LMP.forEach(function (o) { cap[o.mon + '|' + o.khoi] = true; });
  Object.keys(cap).forEach(function (k) {
    const ma = k.split('|')[0], khoi = Number(k.split('|')[1]);
    KHGD[k] = { mon: ma, khoi, tt: 'ap', soBai: Math.max(1, Math.round(tietNam(ma, khoi) / 1.5)) };
  });
  /* ba ca CỐ Ý — bảng rà soát của `M5.1` tab 2 phải có dòng để bấm về */
  KHGD['NT|9'].tt = 'khong';        /* chưa có KHGD nào cho Nghệ thuật khối 9 */
  KHGD['TIN|8'].tt = 'chuadu';      /* có KHGD nhưng thiếu số tiết */
  KHGD['GDDP|11'].tt = 'chuadu';    /* ba mạch, mới khai hai */
})();
const khgdCua = (mon, khoi) => KHGD[mon + '|' + khoi] || { tt: 'khong', soBai: 0 };
/* số bài của một PHẦN — chia theo tỉ lệ tiết, giữ bất biến Σ = số bài của môn */
function soBaiPhan(p) {
  const k = khgdCua(p.mon, p.khoi);
  if (k.tt === 'khong') return 0;
  const tongTiet = tietNam(p.mon, p.khoi) || 1;
  return Math.max(1, Math.round(k.soBai * p.tiet / tongTiet));
}
/* Bài ĐÃ DẠY tính tới một ngày — dẫn xuất từ dòng sổ đầu bài `M2.2` của các
   tiết đã diễn ra. Ở bản chiếu, gieo một độ lệch ổn định theo dòng phân công. */
const LECH_PC = {};
PC.forEach(function (p) { LECH_PC[p.id] = Math.round((rnd5() * 3.6) - 1.2); });
function baiDaDay(p, ngay) {
  const t = Math.min(tuanCua(ngay), p.tuanDen) - p.tuanTu + 1;
  if (t <= 0) return 0;
  const tong = soBaiPhan(p), keHoach = tong * t / (p.tuanDen - p.tuanTu + 1);
  return Math.max(0, Math.min(tong, Math.round(keHoach + LECH_PC[p.id])));
}
function baiTheoKH(p, ngay) {
  const t = Math.min(tuanCua(ngay), p.tuanDen) - p.tuanTu + 1;
  if (t <= 0) return 0;
  return Math.round(soBaiPhan(p) * t / (p.tuanDen - p.tuanTu + 1));
}
/* «chậm» = lệch từ hơn MỘT TUẦN nội dung trở lên. Ngưỡng này là của `M5.1`
   tab Tiến độ (cảnh báo lệch tiến độ), ⛔ không phải một ngưỡng mới của báo cáo. */
function chamTuan(p, ngay) {
  const bai1Tuan = soBaiPhan(p) / (p.tuanDen - p.tuanTu + 1);
  if (!bai1Tuan) return 0;
  return Math.max(0, Math.round((baiTheoKH(p, ngay) - baiDaDay(p, ngay)) / bai1Tuan * 10) / 10);
}

/* ═══════════ ⑧ `M5.2` — GIÁO ÁN (hồ sơ bắt buộc DUY NHẤT của mọi GV) ═══
   🛑 TT 15/2026 Điều 21: hồ sơ bắt buộc của MỌI giáo viên là **kế hoạch bài
   dạy (giáo án)** — CHỈ MỘT LOẠI. Kế hoạch giảng dạy (`M5.1`) KHÔNG phải hồ
   sơ bắt buộc của giáo viên; nó là **kế hoạch dạy học của TỔ chuyên môn**
   theo CV 5512 Phụ lục I, và CV 2613 xác định phụ lục ấy chỉ để tham khảo.
   Vì vậy `CM.07*` đếm HAI VẾ Ở HAI CHỦ THỂ KHÁC NHAU, không gộp — xem
   khai báo mã ở §⑭ và mục C của phiếu.

   Hạn nộp (`M5.2` §5): dẫn xuất từ tuần dự kiến ở PPCT + chu kỳ cấu hình
   của tổ. Quá hạn KHÔNG chặn gì — chỉ hiện đỏ.                            */
const CHU_KY_GA = { 'Tổ Toán — Tin': 'tuan', 'Tổ Ngữ văn': 'tuan', 'Tổ Ngoại ngữ': 'tuan',
  'Tổ Lý — Hóa — Sinh': 'thang', 'Tổ Sử — Địa — GDCD': 'tuan', 'Tổ Thể dục — Nghệ thuật': 'thang' };
/* trạng thái giáo án của một dòng phân công tính tới ngày chốt */
const TL_GA = {};
PC.forEach(function (p) { TL_GA[p.id] = 0.72 + rnd5() * 0.3; });
function gaCua(p, ngay) {
  const phai = baiTheoKH(p, ngay) + 1;                 /* +1: bài của tuần tới đã tới hạn */
  if (phai <= 0) return { phai: 0, soan: 0, chua: 0, quaHan: 0 };
  const soan = Math.min(phai, Math.round(phai * Math.min(1, TL_GA[p.id])));
  const chua = phai - soan;
  /* quá hạn = bài chưa soạn mà hạn đã qua. Bài của tuần tới chưa quá hạn. */
  const quaHan = Math.max(0, chua - (chua > 0 ? 1 : 0));
  return { phai, soan, chua, quaHan };
}

/* ═══════════ ⑨ `M5.3` — DỰ GIỜ ════════════════════════════════════════
   🛑 `M5.3` §1: TT 15/2026 KHÔNG quy định giáo viên phải dự giờ, và đã BỎ sổ
   dự giờ khỏi hồ sơ bắt buộc; định mức cũ 8–10 tiết/năm ĐÃ BỎ. Vì vậy khối
   dự giờ của tab 3 ⛔ KHÔNG có cột định mức, không có chỉ tiêu, không xếp
   hạng, không tô đỏ người dự ít. Chỉ ba con số mô tả.                     */
const LOAI_DG = { danhgia: 'Dự giờ đánh giá', hochoi: 'Dự giờ học hỏi', chuyende: 'Dự giờ theo chuyên đề' };
const DUGIO = []; let DGSEQ = 0;

      DUGIO.push({

        loai: loai[DGSEQ % loai.length], to: g.to, dt: g.dt,
        gvDay: g.id, lop: p.lop, mon: p.mon, nguoiDu: nd,
        bienBan: rnd5() < 0.82, xepLoai: null
      });

  DUGIO.forEach(function (d) {
    if (d.loai === 'danhgia' && d.bienBan) d.xepLoai = ['Tốt', 'Tốt', 'Khá', 'Đạt'][Math.floor(rnd5() * 4)];
  });
})();

/* ═══════════ ⑩ `M5.4` — SINH HOẠT CHUYÊN MÔN ══════════════════════════
   🔑 Ngược hẳn `M5.3`: ở đây LUẬT BẮT BUỘC. TT 15/2026 Đ.14 — tổ sinh hoạt

const SHCM = []; let SHSEQ = 0;

CT.nguonSo('CM.01', function (tham, o) {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  const ds = PC.filter(function (p) {
    return pvDong({ dt: p.dt, to: toCuaPC(p) }) && (!tham.loc || tham.loc(p))
      && tuanTrong(p, Math.min(tuanCua(ngay), TUAN_NAM));
  });
  if (o === 'khongKH') {
    const oc = [];
    LOP.forEach(function (l) {
      (MON_KHOI[l.khoi] || []).forEach(function (ma) {
        const k = khgdCua(ma, l.khoi);
        if (!pvDong({ dt: l.dt, to: monBy(ma).to })) return;
        if (tham.locLop && !tham.locLop(l, ma)) return;
        if (k.tt === 'khong' || k.tt === 'chuadu')
          oc.push({ id: l.id + ' · ' + monBy(ma).ten, ten: l.id + ' · ' + monBy(ma).ten,
            phu: k.tt === 'khong' ? 'Chưa có KHGD nào cho Môn × Khối này' : 'Có KHGD nhưng KHGD thiếu số tiết', so: '' });
      });
    });
    return { giaTri: oc.length, banGhiGoc: oc };
  }
  const ve = p => ({ id: p.id, ten: p.lop + ' · ' + monBy(p.mon).ten + (monBy(p.mon).pt === 'PT0' ? '' : ' — ' + p.phan),
    phu: (gvBy(p.gv) || { ten: '—' }).ten + ' · tuần ' + p.tuanTu + '–' + p.tuanDen
      + (p.loaiPhan === 'Bàn giao' ? ' · 🤝 bàn giao' : ''),
    so: baiDaDay(p, ngay) + '/' + baiTheoKH(p, ngay) + ' bài' });
  if (o === 'luot') return { giaTri: ds.length, banGhiGoc: ds.map(ve) };
  if (o === 'baiKH') return { giaTri: ds.reduce((a, p) => a + baiTheoKH(p, ngay), 0), banGhiGoc: ds.map(ve) };
  if (o === 'baiDay') return { giaTri: ds.reduce((a, p) => a + baiDaDay(p, ngay), 0), banGhiGoc: ds.map(ve) };
  if (o === 'cham') { const c = ds.filter(p => chamTuan(p, ngay) > 1); return { giaTri: c.length, banGhiGoc: c.map(ve) } }
  const kh = ds.reduce((a, p) => a + baiTheoKH(p, ngay), 0);
  const da = ds.reduce((a, p) => a + baiDaDay(p, ngay), 0);
  return { giaTri: tile(da, kh), banGhiGoc: ds.map(ve),
    veTrai: { ten: 'Số bài đã dạy', giaTri: da, donVi: 'bài' },
    vePhai: { ten: 'Số bài lẽ ra đã dạy tới ngày chốt', giaTri: kh, donVi: 'bài' } };
});

CT.nguonSo('CM.06', function (tham, o) {
  const tu = tham.tuNgay, den = tham.denNgay > HOMNAY ? HOMNAY : tham.denNgay;
  /* mẫu số dựng từ mẫu tuần: Σ tiết/tuần các dòng phân công có hiệu lực × số tuần */
  const ds = PC.filter(p => pvDong({ dt: p.dt, to: toCuaPC(p) }) && (!tham.loc || tham.loc(p)));
  let kh = 0;
  TUAN.forEach(function (t) {
    if (t.den < tu || t.tu > den) return;
    ds.forEach(function (p) { if (tuanTrong(p, t.so)) kh += p.tietTuan });
  });
  kh = Math.round(kh);
  const ah = ahTrongKhoang(tu, den, x => pvDong(x) && (!tham.locAH || tham.locAH(x)));
  const huy = ah.filter(x => x.tt === 'huy' && x.cachXL === 'Sẽ dạy bù');
  const khongDay = ah.filter(x => x.tt === 'huy').length + ah.filter(x => x.tt === 'chuaxep' && x.ngay < HOMNAY).length;
  const td = Math.max(0, kh - khongDay);
  if (o === 'keHoach') return { giaTri: kh, banGhiGoc: [] };
  if (o === 'thucDay') return { giaTri: td, banGhiGoc: [] };
  if (o === 'huyChuaBu') return { giaTri: huy.length,
    banGhiGoc: huy.map(x => ({ id: x.id, ten: x.lop + ' · ' + monBy(x.mon).ten, phu: k2s(x.ngay) + ' · ' + x.cachXL, so: '1 tiết' })) };
  return { giaTri: tile(td, kh), banGhiGoc: [],
    veTrai: { ten: 'Tiết thực dạy', giaTri: td, donVi: 'tiết' },
    vePhai: { ten: 'Tiết theo kế hoạch (đã qua giờ)', giaTri: kh, donVi: 'tiết' } };
});

CT.nguonSo('CM.04', function (tham, o) {

  if (!kyDaChot(B1).some(k => CHOT[B1.id][k.ma].d <= ngC))
    return { giaTri: null, banGhiGoc: [], ghiChu: 'Tại ngày chốt ' + k2s(ngC) + ' chưa có kỳ KPI nào đã chốt — kỳ đầu tiên chốt ngày '

  const ds = GV.filter(g => pvNguoi(g) && (!tham.loc || tham.loc(g)));
  const nh = tham.nhom || null;              /* lọc theo một nhóm tiêu chí của bộ KPI */
  function diemNhom(g) {
    const k = DIEM_KPI[g.id];
    if (!nh) return k;
    let dat = 0, mauCo = 0, chua = 0;
    k.chiTiet.forEach(function (c) {
      if (!c.ap || c.n.ten !== nh) return;

      dat += c.d; mauCo += c.t.ts;
    });
    return { diem: Math.round(dat * 10) / 10, mauCo, chuaCham: chua,

  }
  const ve = g => { const k = diemNhom(g);
    return { id: g.id, ten: g.ten, phu: g.to + ' · hạng ' + g.hang + (g.cv ? ' · ' + g.cv : '')
      + (DIEM_KPI[g.id].coSua ? ' · ✎ có ô đã sửa khác số máy' : ''),

      + kyDaChot(B1).map(k => k.t).join(' · ') + '</b> — kỳ duy nhất đã chốt tại ngày chốt của báo cáo.' };

CT.nguonSo('NS.04', function (tham, o) {
  const dsMon = MON.filter(m => !tham.mon || m.ma === tham.mon);
  const oc = O_LMP.filter(function (x) {
    const m = monBy(x.mon);
    return pvDong({ dt: x.dt, to: m.to }) && dsMon.some(y => y.ma === x.mon) && (!tham.loc || tham.loc(x));
  });
  const dmCua = x => KHUNG_CHUAN[x.khoi <= 9 ? 'THCS' : 'THPT'];
  const coNguoi = x => PC.some(p => p.lop === x.lop && p.mon === x.mon && p.phan === x.phan);
  const veO = x => ({ id: x.lop + '|' + x.mon + '|' + x.phan,
    ten: x.lop + ' · ' + monBy(x.mon).ten + (monBy(x.mon).pt === 'PT0' ? '' : ' — ' + x.phan),
    phu: DT[x.dt] + ' · khối ' + x.khoi + ' · ' + x.tiet + ' tiết/năm'
      + (coNguoi(x) ? ' · ' + PC.filter(p => p.lop === x.lop && p.mon === x.mon && p.phan === x.phan)
        .map(p => (gvBy(p.gv) || {}).ten + (p.loaiPhan === 'Bàn giao' ? ' 🤝' : '')).join(' · ')
        : ' · ⛔ CHƯA CÓ NGƯỜI'),
    so: vn(Math.round(x.tietTuan * 10) / 10) + ' tiết/tuần' });
  const tuTien = x => O_TRONG[x.lop + '|' + x.mon + '|' + x.phan];
  if (o === 'thieuPC') { const c = oc.filter(x => tuTien(x) === 'phancong'); return { giaTri: c.length, banGhiGoc: c.map(veO) } }
  if (o === 'thieuNL') { const c = oc.filter(x => tuTien(x) === 'nangluc'); return { giaTri: c.length, banGhiGoc: c.map(veO) } }
  if (o === 'soNguoi') {
    const s = {};
    PC.forEach(function (p) { if (dsMon.some(y => y.ma === p.mon) && pvDong({ dt: p.dt, to: toCuaPC(p) })) s[p.gv] = true });
    return { giaTri: Object.keys(s).length, banGhiGoc: Object.keys(s).map(function (k) { const g = gvBy(k);
      const n = PC.filter(p => p.gv === k && dsMon.some(y => y.ma === p.mon));
      return { id: k, ten: g.ten, phu: g.to + ' · ' + n.map(p => p.lop + (monBy(p.mon).pt === 'PT0' ? '' : ' ' + p.phan)).join(' · '),
        so: vn(Math.round(n.reduce((a, p) => a + p.tietTuan, 0) * 10) / 10) + ' tiết/tuần' } }) };
  }
  const can = oc.reduce((a, x) => a + x.tietTuan, 0);
  const co = oc.filter(coNguoi).reduce((a, x) => a + x.tietTuan, 0);
  const qdCan = oc.reduce((a, x) => a + x.tietTuan / dmCua(x), 0);
  const qdCo = oc.filter(coNguoi).reduce((a, x) => a + x.tietTuan / dmCua(x), 0);
  if (o === 'tietCan') return { giaTri: Math.round(can * 10) / 10, banGhiGoc: oc.map(veO) };
  if (o === 'gvCan') return { giaTri: Math.round(qdCan * 100) / 100, banGhiGoc: oc.map(veO),
    veTrai: { ten: 'Tổng tiết/tuần cần', giaTri: Math.round(can * 10) / 10, donVi: 'tiết/tuần' },
    vePhai: { ten: 'Định mức chuẩn theo cấp', giaTri: 'THCS 19 · THPT 17', donVi: '' } };
  if (o === 'gvCo') return { giaTri: Math.round(qdCo * 100) / 100, banGhiGoc: oc.filter(coNguoi).map(veO) };
  return { giaTri: Math.round((qdCo - qdCan) * 100) / 100, banGhiGoc: oc.map(veO),
    veTrai: { ten: 'Giáo viên quy đổi hiện có', giaTri: Math.round(qdCo * 100) / 100, donVi: 'người' },
    vePhai: { ten: 'Giáo viên quy đổi cần', giaTri: Math.round(qdCan * 100) / 100, donVi: 'người' } };
});

   Khuôn K9 — bảng tiến độ. HAI LOÀI SỐ nên HAI KHỐI, hai bộ điều khiển thời
   gian: khối A hỏi «tới ngày chốt chương trình chạy tới đâu», khối B hỏi
   «trong khoảng ấy dạy được bao nhiêu phần trăm số tiết theo kế hoạch».
   🔑 Đơn vị dòng của khối A là LƯỢT PHÂN CÔNG (`GDDP`) — một môn có nhiều
   giáo viên cùng dạy thì mỗi mạch chạy tiến độ riêng.                     */
function veTab1() {
  const ngay = PV.st.chotNgay > HOMNAY ? HOMNAY : PV.st.chotNgay;
  const pcPV = PC.filter(p => pvDong({ dt: p.dt, to: toCuaPC(p) }) && tuanTrong(p, tuanCua(ngay)));
  let h = daiPV('lượt phân công', pcPV.length, PC.filter(p => tuanTrong(p, tuanCua(ngay))).length)
    + barTo() + PV.chotNgay() + PV.daiCanhBao();

  /* ---------- khối A · TỒN — tiến độ theo lượt phân công ---------- */
  h += PV.chonChieu('CM.01', ['mon_hoc', 'to_chuyen_mon', 'khoi', 'diem_truong', 'phan_mon']);
  const ct = PV.st.phanTo || 'mon_hoc';
  let dongA;
  if (ct === 'to_chuyen_mon') dongA = dsTo().map(t => ({ id: t, ten: t, loc: p => toCuaPC(p) === t, locKH: (l, m) => monBy(m).to === t }));
  else if (ct === 'khoi') dongA = [6, 7, 8, 9, 10, 11].map(k => ({ id: k, ten: 'Khối ' + k, loc: p => p.khoi === k, locKH: l => l.khoi === k }));
  else if (ct === 'diem_truong') dongA = Object.keys(DT).map(d => ({ id: d, ten: DT[d], loc: p => p.dt === d, locKH: l => l.dt === d }));
  else if (ct === 'phan_mon') {
    const s = {}; pcPV.forEach(p => { if (monBy(p.mon).pt !== 'PT0') s[p.mon + '|' + p.phan] = true });
    dongA = Object.keys(s).map(function (k) { const a = k.split('|');
      return { id: k, nhom: monBy(a[0]).ten, ten: a[1], loc: p => p.mon === a[0] && p.phan === a[1], locKH: (l, m) => m === a[0] } });
  } else dongA = MON.filter(monHienPV)
    .map(m => ({ id: m.ma, ten: m.ten + (m.pt === 'PT0' ? '' : ' · ' + m.phan.length + ' phần'),
      nhom: m.to === '*' ? 'Không thuộc tổ bộ môn nào' : m.to,
      loc: p => p.mon === m.ma, locKH: (l, ma) => ma === m.ma }));
  dongA = dongA.filter(d => pcPV.some(d.loc) || d.id === 'khong');
  h += KB.K9({
    id: 'a', tieuDe: 'A · Tiến độ nội dung tại ngày chốt', ma: 'CM.01', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: CT.CHIEU[ct], dong: dongA, gomNhom: ct === 'mon_hoc' || ct === 'phan_mon',
    link: d => ({ menu: 'M5.1', ctx: 'tab=tiendo&' + ct + '=' + d.id, nhan: 'Tiến độ theo tuần' }),
    cot: [
      { khoa: 'luot', ten: 'Lượt phân công', donVi: 'Lớp × Môn × Phần', kieu: 'so', nguon: 'm5.1.ke_hoach_giang_day' },
      { khoa: 'baiKH', ten: 'Bài lẽ ra đã dạy', kieu: 'so', nguon: 'm5.1.tien_do_theo_tuan' },
      { khoa: 'baiDay', ten: 'Bài đã dạy', kieu: 'so', nguon: 'm5.1.tien_do_theo_tuan' },
      { khoa: null, ten: 'Tiến độ', kieu: 'tile', nguon: 'm5.1.tien_do_theo_tuan' },
      { khoa: 'cham', ten: 'Lượt chậm > 1 tuần', kieu: 'so', nguon: 'm5.1.tien_do_theo_tuan', canhBao: k => k.giaTri > 0 },
      { khoa: 'khongKH', ten: 'Ô chưa có kế hoạch', donVi: 'việc chặn', kieu: 'so', nguon: 'm5.1.ke_hoach_giang_day', canhBao: k => k.giaTri > 0 }
    ],
    o: (d, c) => CT.doc('CM.01', PV.thamSo({ loc: d.loc, locLop: d.locKH }), c.khoa || undefined),
    tongRieng: c => c.khoa ? null : CT.doc('CM.01', PV.thamSo()),
    duoiBang: '<div class="ro">Ô <b>chưa có kế hoạch</b> = việc chặn của M5.1, ⛔ không phải tiến độ 0%. '
      + '<button class="btn xs" data-dl="M5.1" data-dlq="tab=rasoat&return=' + MENU_NAY + '">↗ M5.1</button></div>'
  });

  /* ---------- khối B · PHÁT SINH — tỉ lệ tiết thực dạy ---------- */
  h += '<div class="pvcach">Bảng dưới đếm <b>trong khoảng</b> — không cộng với khối trên.</div>' + PV.khoang();
  const thang = [];
  { let t = thangCua(PV.st.tuNgay); const het = thangCua(PV.st.denNgay); let d = 0;
    while (t <= het && d++ < 24) { thang.push(t); const x = k2d(t + '-01'); x.setMonth(x.getMonth() + 1); t = thangCua(d2k(x)) } }
  const trongThang = t => x => thangCua(x.ngay) === t;
  h += KB.K9({
    id: 'b', tieuDe: 'B · Tiết thực dạy so với kế hoạch', ma: 'CM.06', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Tháng',
    dong: thang.map(t => ({ id: t, ten: tenThang(t) })),
    link: d => ({ menu: 'M4.7', ctx: 'tab=lich&thang=' + d.id, nhan: 'Lịch giảng dạy' }),
    cot: [
      { khoa: 'keHoach', ten: 'Tiết theo kế hoạch', donVi: 'đã qua giờ', kieu: 'so', nguon: 'm4.7.lich_giang_day' },
      { khoa: 'thucDay', ten: 'Tiết thực dạy', kieu: 'so', nguon: 'm4.7.lich_giang_day' },
      { khoa: null, ten: 'Tỉ lệ thực dạy', kieu: 'tile', nguon: 'm4.7.lich_giang_day' },
      { khoa: 'huyChuaBu', ten: 'Hủy chưa dạy bù', kieu: 'so', nguon: 'm4.7.lich_giang_day', canhBao: k => k.giaTri > 0 }
    ],
    o: function (d, c) {
      const a = d.id + '-01', b = k2d(a); b.setMonth(b.getMonth() + 1); b.setDate(0);
      const tu = a > PV.st.tuNgay ? a : PV.st.tuNgay, den = d2k(b) < PV.st.denNgay ? d2k(b) : PV.st.denNgay;
      return CT.doc('CM.06', PV.thamSoPS({ tuNgay: tu, denNgay: den, locAH: trongThang(d.id) }), c.khoa || undefined);
    },
    tongRieng: c => c.khoa ? null : CT.doc('CM.06', PV.thamSoPS()),
    duoiBang: '<div class="ro">Tiết dạy thay đã thực dạy <b>tính vào</b> tử số — chi tiết ở tab 7.</div>'
  });
  return h + dnote('Đơn vị dòng của khối A là <b>lượt phân công «Lớp × Môn × Phần»</b>, không phải cặp «Lớp × Môn». '
    + 'Sau cụm <b>GDDP</b>, một môn có nhiều giáo viên cùng dạy — Khoa học tự nhiên khối 8–9 chia ba mạch, '
    + 'Giáo dục địa phương chia ba mạch — và mỗi mạch chạy tiến độ riêng. Gom về cặp «Lớp × Môn» thì ba mạch '
    + 'lệch nhau 4 tuần hiện ra thành một con số trung bình trông vẫn đẹp.');
}

/* ══════════════ TAB 2 · 🛡 HỒ SƠ CHUYÊN MÔN CỦA GIÁO VIÊN ═════════════
   Khuôn K9 · loại D (tra cứu nhanh) · số TỒN.
   🛑 HAI KHỐI, HAI CHỦ THỂ, HAI CĂN CỨ — ⛔ không cộng vào một tỉ lệ:
     ① Giáo án — nghĩa vụ của TỪNG GIÁO VIÊN (TT 15/2026 Đ.21, bắt buộc)
     ② Kế hoạch giảng dạy — nghĩa vụ của TỔ (CV 5512, phụ lục chỉ tham khảo)
   🛑 Dòng là TỔ, ⛔ không phải một người — `M5.9` `TD-2` cấm đếm người theo
   cách gợi ý trách nhiệm cá nhân, và prompt §4 áp luật ấy cho tab này.
   Tên người có trong PANEL drill-down, đủ để tổ trưởng biết nhắc ai.      */
function veTab2() {
  const ngay = PV.st.chotNgay > HOMNAY ? HOMNAY : PV.st.chotNgay;
  let h = daiM59('cả kỳ hồ sơ đạt bao nhiêu phần trăm')

    .filter(d => PC.some(p => pvDong({ dt: p.dt, to: toCuaPC(p) }) && d.loc(p)));

  h += KB.K9({
    id: 'ga', tieuDe: '① Giáo án — hồ sơ bắt buộc của TỪNG GIÁO VIÊN (TT 15/2026 Đ.21)', ma: 'CM.07', chip: 'TON',
    moTaKy: PV.moTaChot() + ' · quá hạn không chặn', tenCotDau: 'Tổ chuyên môn', dong,
    link: d => ({ menu: 'M5.2', ctx: 'tab=theodoi&to=' + encodeURIComponent(d.id), nhan: 'Theo dõi giáo án của tổ' }),
    cot: [
      { khoa: 'gaPhai', ten: 'Bài phải có giáo án', kieu: 'so', nguon: 'm5.2.theo_doi_giao_an_to' },
      { khoa: 'gaSoan', ten: 'Đã soạn', kieu: 'so', nguon: 'm5.2.theo_doi_giao_an_to' },
      { khoa: 'gaChua', ten: 'Chưa soạn', kieu: 'so', nguon: 'm5.2.theo_doi_giao_an_to', canhBao: k => k.giaTri > 0 },
      { khoa: 'gaQuaHan', ten: 'Quá hạn nộp', kieu: 'so', nguon: 'm5.2.theo_doi_giao_an_to', canhBao: k => k.giaTri > 0 },
      { khoa: null, ten: 'Tỉ lệ đã soạn', kieu: 'tile', nguon: 'm5.2.theo_doi_giao_an_to' }
    ],
    o: (d, c) => CT.doc('CM.07', PV.thamSo({ loc: d.loc }), c.khoa || undefined),
    tongRieng: c => c.khoa ? null : CT.doc('CM.07', PV.thamSo()),
    tong: false
  });

  h += '<div class="k3sep">🛑 Hai khối <b>không cộng</b>: trên là nghĩa vụ của <b>người</b>, dưới của <b>tổ</b>.</div>';
  h += KB.K9({
    id: 'kh', tieuDe: '② Kế hoạch giảng dạy — hồ sơ của TỔ chuyên môn (CV 5512 PL I · CV 2613: chỉ tham khảo)', ma: 'CM.07', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Tổ chuyên môn', dong,
    link: d => ({ menu: 'M5.1', ctx: 'tab=rasoat&to=' + encodeURIComponent(d.id), nhan: 'Rà soát lớp thiếu kế hoạch' }),
    cot: [
      { khoa: 'khgdPhai', ten: 'Ô Lớp × Môn phải có', kieu: 'so', nguon: 'm5.1.ke_hoach_giang_day' },
      { khoa: 'khgdCo', ten: 'Đã có, đang áp dụng', kieu: 'so', nguon: 'm5.1.ke_hoach_giang_day' },
      { khoa: 'khgdThieu', ten: 'Chưa có hoặc thiếu số tiết', donVi: 'việc chặn', kieu: 'so', nguon: 'm5.1.ke_hoach_giang_day', canhBao: k => k.giaTri > 0 }
    ],
    o: (d, c) => CT.doc('CM.07', PV.thamSo({ locKH: d.locKH }), c.khoa), tong: false
  });
  return h + dnote('<b>Vì sao hai khối tách hẳn.</b> Prompt phiên này mô tả <code>CM.07*</code> là «hai hồ sơ bắt buộc theo '
    + 'TT 15/2026: KHGD và giáo án». Đọc thẳng văn bản qua hai tài liệu chủ thì khác: <b>M5.2 §1</b> — «giáo án là hồ sơ bắt buộc '
    + '<i>duy nhất</i> của mọi giáo viên»; <b>M5.1 §15</b> — «kế hoạch giáo dục của giáo viên <i>đã bỏ</i>». KHGD ở M5.1 là kế hoạch '
    + 'của <b>tổ</b> theo CV 5512, mà CV 2613 xác định phụ lục ấy chỉ để tham khảo. Cộng hai vế vào một tỉ lệ thì một tổ chưa khai '
    + 'KHGD sẽ làm xấu điểm hồ sơ của <b>mọi giáo viên trong tổ</b>, vì một việc họ không có quyền làm — đúng thứ '
    + '<b>Chỉ thị 138/CT-BGDĐT</b> cấm. Điểm này ghi ở mục H của phiếu để anh Ninh quyết.<br>'
    + '<b>Vì sao dòng là TỔ, không phải người.</b> M5.9 <code>TD-2</code>: không đếm người theo cách gợi ý trách nhiệm cá nhân. '
    + 'Tên người nằm trong panel drill-down — đủ để tổ trưởng biết nhắc ai, mà không biến màn hình thành bảng xếp hạng.');
}

/* ══════════════ TAB 3 · DỰ GIỜ & SINH HOẠT CHUYÊN MÔN ═════════════════
   Gom hai báo cáo vào một tab theo `N6` — cùng loại số (PHÁT SINH), cùng
   người đọc (tổ trưởng · PHT chuyên môn · hiệu trưởng). Hai khối, hai khuôn.

   🔑 BẤT ĐỐI XỨNG CỐ Ý giữa hai khối, và nó là điểm quan trọng nhất của tab:
     · Khối A DỰ GIỜ — TT 15/2026 KHÔNG bắt buộc, đã bỏ định mức 8–10 tiết/năm
       và bỏ sổ dự giờ khỏi hồ sơ ⇒ ⛔ KHÔNG cột định mức, KHÔNG chỉ tiêu,
       KHÔNG xếp hạng, KHÔNG tô đỏ người dự ít. Chỉ ba con số mô tả.
     · Khối B SINH HOẠT CHUYÊN MÔN — TT 15/2026 Đ.14 bắt tổ sinh hoạt ít nhất
       1 lần / 2 tuần, Đ.21 k.2 bắt có Sổ ghi chép ⇒ CÓ cột tuân thủ.
   Hai khối cùng một màn hình mà một bên có tuân thủ, một bên không — đó là
   vì LUẬT khác nhau, không phải vì thiết kế thiếu nhất quán.              */
function veTab3() {
  let h = barTo() + PV.khoang();
  const tu = PV.st.tuNgay, den = PV.st.denNgay > HOMNAY ? HOMNAY : PV.st.denNgay;

  /* ---------- khối A · K1 — DỰ GIỜ, không định mức ---------- */
  const dgPV = DUGIO.filter(d => d.ngay >= tu && d.ngay <= den && pvDong({ dt: d.dt, to: d.to }));
  h += daiPV('buổi dự giờ', dgPV.length, DUGIO.filter(d => d.ngay >= tu && d.ngay <= den).length);
  h += KB.K1({
    id: 'dg', tieuDe: 'A · Dự giờ theo loại', ma: 'CM.02', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Loại dự giờ', donVi: 'buổi',
    nguon: 'm5.3.thong_ke_du_gio',
    dong: Object.keys(LOAI_DG).map(k => ({ id: k, ten: LOAI_DG[k], loc: d => d.loai === k })),
    link: d => ({ menu: 'M5.3', ctx: 'tab=thongke&loai=' + d.id, nhan: 'Thống kê dự giờ' }),
    oSo: d => CT.doc('CM.02', PV.thamSoPS({ loc: d.loc }))
  });
  const kA = ['buoi', 'duocDu', 'chuaDuocDu', 'bienBan'].map(o => CT.doc('CM.02', PV.thamSoPS(), o));
  h += '<div class="bg"><div class="bgh"><b>Ba con số mô tả của dự giờ</b>' + KB.chip('PS') + '</div>'
    + '<div class="soro">' + kA.map(function (k) {
      return '<div class="so1"><div class="so1n">' + esc(k.ten) + '</div><div class="so1v">'
        + (k.canhBao ? '<span class="ocb">⚠ ' + esc(k.canhBao.chu) + '</span>' : vn(k.giaTri)) + '</div></div>';
    }).join('') + '</div>'
    + '<div class="ro">⚖ TT 15/2026 — dự giờ <b>không bắt buộc</b>, định mức đã bỏ ⇒ ⛔ không cột định mức, không xếp hạng.</div>'
    + '</div>';

  /* ---------- khối B · K9 — SINH HOẠT CHUYÊN MÔN, CÓ tuân thủ ---------- */
  const dongB = dsTo().map(t => ({ id: t, ten: t, loc: s => s.to === t }));
  h += KB.K9({
    id: 'sh', tieuDe: 'B · Sinh hoạt chuyên môn của tổ', ma: 'CM.03', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Tổ chuyên môn', dong: dongB,
    link: d => ({ menu: 'M5.4', ctx: 'tab=so&to=' + encodeURIComponent(d.id), nhan: 'Sổ ghi chép của tổ' }),
    cot: [
      { khoa: 'buoi', ten: 'Số buổi đã sinh hoạt', kieu: 'so', nguon: 'm5.4.so_ghi_chep_cua_to' },
      { khoa: 'cachMax', ten: 'Quãng dài nhất', donVi: 'tuần · ngưỡng 2', kieu: 'ngay', nguon: 'm5.4.so_ghi_chep_cua_to', canhBao: k => k.giaTri > 2 },
      { khoa: 'daKy', ten: 'Biên bản đã ký', kieu: 'so', nguon: 'm5.4.so_ghi_chep_cua_to' },
      { khoa: 'chuaXem', ten: 'Đã nộp · lãnh đạo chưa xem', kieu: 'so', nguon: 'm5.4.so_ghi_chep_cua_to', canhBao: k => k.giaTri > 0 },
      { khoa: 'ncbh', ten: 'Chu trình nghiên cứu bài học', donVi: 'gợi ý 2 bài/môn/năm', kieu: 'so', nguon: 'm5.4.so_ghi_chep_cua_to' }
    ],
    o: (d, c) => CT.doc('CM.03', PV.thamSoPS({ loc: c.khoa === 'ncbh' ? (n => n.to === d.id) : d.loc, to: d.id }), c.khoa),
    tongRieng: c => c.khoa === 'cachMax' ? CT.doc('CM.03', PV.thamSoPS(), 'viPham') : null,
    duoiBang: '<div class="ro">⚖ TT 15/2026 Đ.14 — <b>ít nhất 1 lần / 2 tuần</b> ⇒ khối này CÓ cột tuân thủ. '
      + '«Đã nộp · chưa xem» là <b>hai mốc</b>, ⛔ không phải bước duyệt.</div>'
  });
  return h + dnote('<b>Vì sao hai khối cùng tab mà chỉ một bên có cột tuân thủ.</b> Không phải bất nhất: dự giờ <b>không có căn cứ pháp lý nào bắt buộc</b> '
    + 'sau TT 15/2026, còn sinh hoạt chuyên môn thì có — Điều 14 dùng chữ «ít nhất». Dựng một cột «đạt / không đạt định mức» cho dự giờ là '
    + '<b>trường tự đặt ra một nghĩa vụ mà pháp luật không đặt</b>.<br>'
    + '<b>Vì sao đo «quãng dài nhất» chứ không đo tổng số buổi.</b> Một tổ họp 6 buổi dồn vào tháng 9 rồi nghỉ ba tháng vẫn vi phạm Điều 14, '
    + 'dù tổng số buổi trông đủ. Tổng số buổi trả lời sai câu hỏi mà Thông tư đặt ra.<br>'
    + '<b>Chu trình NCBH không có ngưỡng</b> — CV 4069 dùng chữ «nên xây dựng», nên cột này màu trung tính, không cảnh báo.');
}

/* ══════════════ TAB 4 · KPI GIÁO VIÊN ════════════════════════════════
   Khuôn K2 — bảng chéo Tổ × nhóm tiêu chí. Số TỒN (điểm tại ngày chốt).
   🔑 `R20` — ĐỌC GIÁ TRỊ CHỐT của `M5.5`, ⛔ không tự tính lại, ⛔ không quy
   về một điểm tổng khác với `M5.5`.
   🛑 Bẫy #4 — dải chống nhầm với Xếp loại chất lượng viên chức, ở ngay đầu tab.

  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info,.so1p';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(function (n) { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = { tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
function doMatDoChuMoiTab() {
  const cu = ST.tab, kq = {};
  TAB.filter(t => coTab(t.ma)).forEach(function (t) { moTab(t.ma); ve(); kq[t.ma] = doMatDoChu().tiLe });
  moTab(cu); ve(); console.table(kq); return kq;
}
window.doMatDoChu = doMatDoChu; window.doMatDoChuMoiTab = doMatDoChuMoiTab;

ST.tab = tabMacDinh();
ve();
</script>
