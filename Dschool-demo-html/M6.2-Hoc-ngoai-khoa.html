<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.2 Học ngoại khóa — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.mini{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:12px}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}
</style>
</head>
<body class="nn">
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>


<div class="rolebar" id="rolebar"></div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"></select>
  <span class="lockico" id="dtlock"></span>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot" id="ndot">3</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">TĐ</div>
</header>

<div class="wrap">
  <main class="main">
    <div id="crumb"></div>
    <div class="tophd"><h1 id="h1">Học ngoại khóa</h1><div class="spacer"></div><span id="topact"></span></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>

const SUABUOI={               /* ngoại lệ so với lịch chuẩn */
 'NK-01|2026-10-06':{tt:'hoan',ly:'Sân ngập sau mưa lớn'},

 'NK-02|2026-10-09':{tt:'hoan',ly:'Giáo viên báo bận đột xuất'}
};
function buoiCuaKhoa(k){
 const out=[]; const d=k2d(k.lich.tu), den=k2d(k.lich.den);
 while(d<=den){
  const key=d2k(d), gio=k.lich.buoi[d.getDay()+1];
  if(gio&&!SUABUOI[k.id+'|'+key]) out.push({ngay:key,gio,tt:key<=HOMNAY?'dienra':'sap'});
  d.setDate(d.getDate()+1);
 }
 Object.keys(SUABUOI).filter(x=>x.startsWith(k.id+'|')).forEach(x=>{
  const ngay=x.split('|')[1], s=SUABUOI[x];
  out.push({ngay,tt:s.tt==='bu'?(ngay<=HOMNAY?'bu':'sap'):'hoan',ly:s.ly,gio:s.gio});
 });
 return out.sort((a,b)=>a.ngay.localeCompare(b.ngay));
}
const buoiDaDienRa=k=>buoiCuaKhoa(k).filter(b=>['dienra','bu'].includes(b.tt));
/* buổi của MỘT ngày, mọi khóa trong phạm vi — cửa vào theo VIỆC */

  if(b&&b.tt!=='sap') out.push({khoa:k,buoi:b});
 });
 return out;
}

/* ========== BỘ MÁY PHÁT HIỆN TRÙNG LỊCH ==========
   Trùng lịch là TRẠNG THÁI DẪN XUẤT, không phải một cờ ghi vào bản ghi lúc đăng ký:
   thêm buổi bù, đổi thời khóa biểu, hay đăng ký thêm khóa khác đều làm nó thay đổi.
   Vì vậy mọi màn hình đều TÍNH LẠI khi vẽ, và có bộ lọc để rà lại các đăng ký cũ. */

/* Khung giờ ĐỊNH KỲ của một khóa trong tuần.
   ★ KHÔNG gộp buổi bù vào đây. Buổi bù là sự kiện MỘT LẦN, lệch giờ so với lịch chuẩn:
   lấy nó làm cổng xét đăng ký thì một buổi bù sáng Thứ Bảy đã diễn ra xong vẫn còn chặn
   mọi đăng ký về sau — sai bản chất. Buổi bù được kiểm riêng, đúng lúc nó được xếp,
   và kiểm với những em ĐÃ ở trong khóa (xungDotBu). */
function khungGio(k){
 return lThu(k).map(t=>{const [s,e]=kh2m(k.lich.buoi[t]);
  return {thu:t,s,e,dt:k.dt,kid:k.id,nhan:k.ten,bu:null}});
}
function khungBu(k,ngay){
 const sb=SUABUOI[k.id+'|'+ngay]; if(!sb||sb.tt!=='bu') return null;
 const [a,b]=kh2m(sb.gio||k.lich.buoi[thuSo(ngay)]||Object.values(k.lich.buoi)[0]);
 return {thu:thuSo(ngay),s:a,e:b,dt:k.dt,kid:k.id,nhan:k.ten+' — buổi bù '+k2s(ngay),bu:ngay};
}
/* 'trung' = đè giờ · 'sat' = không đè nhưng không đủ thời gian di chuyển */
function vaCham(a,b,buffer){
 if(a.s<b.e&&b.s<a.e) return 'trung';
 const gap=a.s>=b.e?a.s-b.e:b.s-a.e;
 return gap<buffer?'sat':null;
}
/* mọi va chạm của MỘT học sinh nếu em đó vào khóa kid */
/* boQua: khóa mà em SẮP RỜI ĐI khi chuyển lớp — không được tính là đang chiếm giờ nữa,
   nếu không hệ thống sẽ báo trùng với chính cái khóa em đang bỏ. */
function xungDot(hsId,kid,boQua){
 const hs=hsById(hsId), k=khoaById(kid), mine=khungGio(k), out=[];
 const t=TKB[hs.lop];
 if(t) mine.forEach(m=>(t.buoi[m.thu]||[]).forEach(g=>{
  const [s,e]=kh2m(g), o={thu:m.thu,s,e,dt:hs.dt,nhan:'Chính khóa lớp '+hs.lop};
  const v=vaCham(m,o,CFG.nghi);
  if(v) out.push({loai:'ck',muc:v,thu:m.thu,a:m,b:o,khacDT:false});
 }));
 DANGKY.filter(d=>d.hs===hsId&&d.tt==='xacnhan'&&d.khoa!==kid&&d.khoa!==boQua).forEach(d=>{
  const k2=khoaById(d.khoa);
  if(['huy','ketthuc'].includes(k2.tt)) return;              /* khóa đã hủy / đã xong không chiếm giờ nào nữa */
  if(k2.lich.den<k.lich.tu||k.lich.den<k2.lich.tu) return;   /* khác kỳ — không thể trùng */
  const khacDT=k2.dt!==k.dt, buf=khacDT?CFG.nghiKhacDT:CFG.nghi;
  khungGio(k2).forEach(o=>mine.forEach(m=>{
   if(m.thu!==o.thu) return;
   const v=vaCham(m,o,buf);
   if(v) out.push({loai:'nk',muc:v,thu:m.thu,a:m,b:o,khacDT});
  }));
 });
 return out;
}
const xdNang=xd=>{let n=xd.filter(x=>x.muc==='trung'||(CFG.satChan&&x.muc==='sat'));

/* ★ Đăng ký ĐÃ DUYỆT mà HIỆN TẠI đang trùng lịch.

   Cái phải moi ra là những đăng ký đã yên vị, không ai nhìn lại, mà nay đã trùng do lịch đổi. */
/* ★ Va chạm ngoại khóa × ngoại khóa là chuyện của MỘT CẶP, không phải của một dòng.
   Chấp nhận nó mà chỉ ghi vết một phía thì bản ghi bên kia vẫn bị đòi xử lại — cùng một sự việc, hỏi hai lần. */
function ghiDeCa(d,nang,ly){

 d.ghiDe=g;

  const doi=DANGKY.find(x=>x.hs===d.hs&&x.khoa===kid&&x.tt==='xacnhan');
  if(doi&&!doi.ghiDe) doi.ghiDe={...g,ly:ly+' (đối chiếu với «'+khoaById(d.khoa).ten+'»)'};
 });
}

const LYDO={tat:['Tự động xác nhận đang TẮT','n'],khoadong:['Khóa không nhận đăng ký','n'],
 doituong:['Sai khối lớp của khóa','r'],xettuyen:['Chờ kiểm tra xếp lớp','b'],
 day:['Khóa đã đủ sức chứa','w'],ck:['Trùng lịch chính khóa','r'],nk:['Trùng lịch ngoại khóa','w']};

/* ★ XÉT DUYỆT TỰ ĐỘNG — máy chỉ tự quyết khi KHÔNG CÒN GÌ PHẢI CÂN NHẮC.
   Mọi trường hợp còn lại rơi về hàng đợi người duyệt KÈM LÝ DO MÁY ĐÃ XÉT,
   nên "Chờ xác nhận" = đúng những việc cần đầu người, không phải cả đống. */
function xetTuDong(hsId,kid){
 const k=khoaById(kid), hs=hsById(hsId);
 if(!CFG.tuDong)                          return {ok:false,ma:'tat'};
 if(!['tuyensinh','dienra'].includes(k.tt))return {ok:false,ma:'khoadong'};
 if(!k.doituong.khoi.includes(hs.khoi))    return {ok:false,ma:'doituong'};
 if(k.xettuyen)                            return {ok:false,ma:'xettuyen'};
 if(conCho(k)<=0)                          return {ok:false,ma:'day'};
 const xd=xungDot(hsId,kid), nang=xdNang(xd);
 if(nang.length) return {ok:false,ma:nang.some(x=>x.loai==='ck')?'ck':'nk',xd};
 return {ok:true,xd};
}

/* ★ RÀ Ở TẦNG KHÓA, KHÔNG PHẢI 30 LẦN Ở TẦNG ĐĂNG KÝ.
   Lịch khóa đè lên ca học của cả một lớp là LỖI THIẾT KẾ LỊCH KHÓA —
   phải hiện cho người mở khóa thấy một lần, chứ không phải báo lại 33 lần khi 33 em đăng ký. */
function lopTrungKhoa(k){
 const mine=khungGio(k), out=[];
 LOP.filter(l=>l.dt===k.dt&&k.doituong.khoi.includes(l.khoi)).forEach(l=>{
  const t=TKB[l.id]; if(!t) return; const thu=[];
  mine.forEach(m=>(t.buoi[m.thu]||[]).forEach(g=>{
   const [s,e]=kh2m(g), v=vaCham(m,{s,e},CFG.nghi);
   if(v&&!thu.some(x=>x.thu===m.thu)) thu.push({thu:m.thu,muc:v});
  }));
  if(thu.length) out.push({lop:l.id,n:l.n,thu});
 });
 return out;
}
/* ★ BUỔI BÙ SINH TRÙNG LỊCH MỚI cho những em ĐÃ ở trong khóa.
   Xếp bù vào một khung giờ khác lịch chuẩn là tạo ra va chạm mà lúc đăng ký chưa hề có,
   nên phải kiểm lại tại chỗ — trùng lịch là trạng thái dẫn xuất, không phải cờ đóng băng. */
function xungDotBu(k,ngay){
 const m=khungBu(k,ngay); if(!m) return [];
 const out=[];
 hsChinhThuc(k.id).forEach(h=>{
  const li=[], t=TKB[h.lop];
  if(t) (t.buoi[m.thu]||[]).forEach(g=>{const [s,e]=kh2m(g);
   const v=vaCham(m,{s,e},CFG.nghi);
   if(v) li.push({loai:'ck',muc:v,nhan:'Chính khóa lớp '+h.lop+' '+g})});
  DANGKY.filter(d=>d.hs===h.id&&d.tt==='xacnhan'&&d.khoa!==k.id).forEach(d=>{
   const k2=khoaById(d.khoa); if(['huy','ketthuc'].includes(k2.tt)) return;
   const buf=k2.dt===k.dt?CFG.nghi:CFG.nghiKhacDT;
   khungGio(k2).filter(o=>o.thu===m.thu).forEach(o=>{const v=vaCham(m,o,buf);
    if(v) li.push({loai:'nk',muc:v,nhan:k2.ten+' '+m2hm(o.s)+' – '+m2hm(o.e)})});
  });
  if(li.length) out.push({hs:h,li});
 });
 return out;
}

   nên mỗi dòng "Chờ xác nhận" trong demo đều có lý do máy thật sự tính ra được. */
function seedDangKy(){
 const KEHOACH=[['NK-01',31,2],['NK-02',27,1],['NK-03',24,1],['NK-04',9,0],['NK-05',18,1],['NK-06',4,0]];
 KEHOACH.forEach(([kid,nUV,nHuy])=>{
  const k=khoaById(kid), pool=[];
  LOP.filter(l=>l.dt===k.dt&&k.doituong.khoi.includes(l.khoi)).forEach(l=>pool.push(...hsCuaLop(l.id)));
  const r=rng(kid.split('').reduce((a,c)=>a+c.charCodeAt(0),5)*131);
  let chon=pool.slice().sort(()=>r()-0.5);
  /* cố ý cho một số em đã học khóa khác đăng ký tiếp — để rà cơ chế trùng ngoại khóa × ngoại khóa */
  if(kid!=='NK-01'){
   const daCo=DANGKY.filter(d=>d.tt==='xacnhan').map(d=>d.hs);
   const them=chon.filter(h=>daCo.includes(h.id)).slice(0,5);
   chon=[...them,...chon.filter(h=>!them.includes(h))];
  }
  let i=0, stt=0, ngay=k2d(k.lich.tu); ngay.setDate(ngay.getDate()-20);
  const nextNgay=()=>{ngay.setDate(ngay.getDate()+1);return d2k(ngay)};
  const lichSu=!['tuyensinh','dienra'].includes(k.tt);   /* khóa đã kết thúc / đã hủy: dữ liệu quá khứ */
  for(let n=0;n<nUV;n++,i++){
   const hs=chon[i]; if(!hs) break;
   const d={id:'DK'+(++SEQ),khoa:kid,hs:hs.id,stt:++stt,ngay:nextNgay(),
    boi:r()<0.75?'App phụ huynh':'VT nhập hộ'};
   if(lichSu){d.tt='xacnhan'; DANGKY.push(d); continue}
   const x=xetTuDong(hs.id,kid);
   if(x.ok){d.tt='xacnhan';d.tuDong=true;d.xetLuc=k2s(d.ngay)+' 06:00'}
   else if(x.ma==='day') d.tt='dscho';
   else {d.tt='cho'; d.ly=x.ma}
   DANGKY.push(d);

  for(let n=0;n<nHuy;n++,i++){const hs=chon[i]; if(!hs) break;
   DANGKY.push({id:'DK'+(++SEQ),khoa:kid,hs:hs.id,stt:++stt,ngay:nextNgay(),boi:'App phụ huynh',
    tt:'huy',huyNgay:'2026-10-08',huyLy:'Gia đình đổi lịch đưa đón'})}
 });
}

/* chuyên cần của một HS — DẪN XUẤT từ điểm danh, không nhập tay */
function chuyenCan(kid,hsId){
 const k=khoaById(kid), bs=buoiDaDienRa(k);
 let comat=0,muon=0,vang=0;
 bs.forEach(b=>{const dd=DIEMDANH[dkey(kid,b.ngay)]; if(!dd)return;
  const m=mucCua(dd,hsId); if(m==='vang')vang++; else if(m==='muon'){muon++;comat++} else comat++});

 return {comat,muon,vang,tong,pct:tong?Math.round(comat/tong*100):0};
}

/* ========== TÌNH TRẠNG THU HỌC PHÍ — BẢN CHIẾU CHỈ ĐỌC TỪ M7.1 ==========
   M6.2 sở hữu SỐ LƯỢNG (đăng ký, số buổi đã diễn ra). M7.1 sở hữu TIỀN.
   Nguyên tắc này đã chốt ở M6.1 v2.2 và áp cho mọi menu nghiệp vụ có thu tiền. */
const TT_THU={du:['Đã đóng đủ','o'],thieu:['Đóng thiếu','w'],chua:['Chưa đóng','r'],mien:['Miễn giảm 100%','n']};
function thuHocPhi(kid,hsId){
 const k=khoaById(kid);
 const sobuoi=k.chuky==='khoa'?1:k.chuky==='thang'?2:buoiDaDienRa(k).length;
 const phaiDong=k.chuky==='khoa'?k.gia:k.gia*sobuoi*(k.chuky==='thang'?4:1);
 const r=rng(hsId.split('').reduce((a,c)=>a+c.charCodeAt(0),3)*(kid.length*31))();
 let daTT=phaiDong,tt='du';
 if(r>0.80&&r<0.92){daTT=Math.round(phaiDong*0.5/10000)*10000;tt='thieu'}
 else if(r>=0.92){daTT=0;tt='chua'}
 return {phaiDong,daTT,tt,con:Math.max(0,phaiDong-daTT)};
}
function tongThu(kid){
 const o={hs:0,phaiDong:0,daTT:0,con:0,n_du:0,n_thieu:0,n_chua:0,n_mien:0};
 hsChinhThuc(kid).forEach(h=>{const t=thuHocPhi(kid,h.id);
  o.hs++;o.phaiDong+=t.phaiDong;o.daTT+=t.daTT;o.con+=t.con;o['n_'+t.tt]++});
 return o;
}

function veLichTuan(hsId,themKid){
 const hs=hsById(hsId), t=TKB[hs.lop], bl={};
 for(let th=2;th<=7;th++) bl[th]=[];
 if(t) Object.keys(t.buoi).forEach(th=>t.buoi[th].forEach(g=>{const [a,b]=kh2m(g);
  bl[th].push({s:a,e:b,ten:'Chính khóa '+hs.lop,loai:'ck',dt:hs.dt})}));
 DANGKY.filter(d=>d.hs===hsId&&d.tt==='xacnhan'&&khoaSong(khoaById(d.khoa))).forEach(d=>{
  const k=khoaById(d.khoa);
  khungGio(k).forEach(m=>bl[m.thu].push({s:m.s,e:m.e,ten:k.ten,loai:'nk',dt:k.dt}))});
 const daO=themKid&&DANGKY.some(d=>d.hs===hsId&&d.khoa===themKid&&d.tt==='xacnhan');
 if(themKid&&!daO){const k=khoaById(themKid);
  khungGio(k).forEach(m=>bl[m.thu].push({s:m.s,e:m.e,ten:k.ten+' (đang xét)',loai:'moi',dt:k.dt}))}
 let h='<table class="lt"><tr><th class="d">Thứ</th><th>Lịch trong ngày</th></tr>';
 for(let th=2;th<=7;th++){
  const ds=bl[th].slice().sort((a,b)=>a.s-b.s);
  ds.forEach(x=>{x.va=null; ds.forEach(y=>{if(x===y)return;
   const buf=x.dt===y.dt?CFG.nghi:CFG.nghiKhacDT, v=vaCham(x,y,buf);
   if(v==='trung') x.va='x'; else if(v==='sat'&&x.va!=='x') x.va='s'})});
  h+='<tr><td class="d">'+TT2[th]+'</td><td>'+(ds.length?ds.map(x=>
   '<span class="blk '+(x.va||x.loai)+'">'+m2hm(x.s)+'–'+m2hm(x.e)+' · '+esc(x.ten)
   +(x.va==='x'?' ⛔':x.va==='s'?' ⚠':'')+'</span>').join(''):'<span style="color:var(--ink3)">—</span>')+'</td></tr>';
 }
 h+='</table><div class="lgd"><span class="blk ck">Chính khóa (M4.6)</span><span class="blk nk">Ngoại khóa đã học</span>'
  +'<span class="blk x">⛔ đè giờ</span><span class="blk s">⚠ không đủ giờ di chuyển</span></div>';
 return h;
}

/* lớp nào có giờ chính khóa va vào khung giờ này, trong đúng thứ đó */
function lopVaNgay(dt,khoi,thu,gio){
 const [s,e]=kh2m(gio), out=[];
 LOP.filter(l=>l.dt===dt&&khoi.includes(l.khoi)).forEach(l=>{
  const t=TKB[l.id]; if(!t) return;
  (t.buoi[thu]||[]).forEach(g=>{const [a,b]=kh2m(g), v=vaCham({s,e},{s:a,e:b},CFG.nghi);
   if(v&&!out.some(x=>x.lop===l.id)) out.push({lop:l.id,n:l.n,muc:v})});
 });
 return out;
}
/* ★ Cảnh báo NGAY TRONG LÚC NHẬP, ở đúng dòng đang gõ — chứ không phải sau khi bấm Lưu.
   Người xếp lịch cần biết mình đang chặn lớp nào trước khi khóa được mở cho phụ huynh đăng ký. */
function capNhatLich(){
 const buoi=docChonLich();
 const dt=$('#clDt')?$('#clDt').value:dtThuc();
 const khoi=[...document.querySelectorAll('.clkhoi:checked')].map(x=>+x.value);
 const tu=$('#clTu')?$('#clTu').value:'', den=$('#clDen')?$('#clDen').value:'';
 for(let t=2;t<=7;t++){
  const el=document.querySelector('.lpinfo[data-i="'+t+'"]'); if(!el) continue;
  el.className='lpinfo'; el.textContent='';
  if(!buoi[t]||!khoi.length) continue;
  const [a,b]=kh2m(buoi[t]);
  if(a>=b){el.className='lpinfo x'; el.textContent='⛔ giờ kết thúc phải sau giờ bắt đầu'; continue}
  const va=lopVaNgay(dt,khoi,t,buoi[t]);
  if(!va.length){el.className='lpinfo o'; el.textContent='✅ không va lớp nào'; continue}
  const nang=va.filter(x=>x.muc==='trung');
  el.className='lpinfo '+(nang.length?'x':'s');
  el.innerHTML=(nang.length?'⛔ đè giờ chính khóa: ':'⚠ sát giờ tan: ')
   +va.map(x=>x.lop+' ('+x.n+')').join(', ');
 }
 const sm=$('#clTom'); if(!sm) return;
 let n=0;
 if(tu&&den&&Object.keys(buoi).length){const d=k2d(tu), e2=k2d(den);
  while(d<=e2){if(buoi[d.getDay()+1])n++; d.setDate(d.getDate()+1)}}
 const nLop=[...new Set([].concat(...Object.keys(buoi).map(t=>lopVaNgay(dt,khoi,+t,buoi[t]).map(x=>x.lop))))];
 const hsVa=nLop.reduce((s2,l)=>s2+lopById(l).n,0);
 sm.innerHTML=!Object.keys(buoi).length?'<b style="color:var(--red)">Chưa chọn buổi nào</b> — khóa phải có ít nhất một buổi trong tuần.'
  :'Dự kiến <b>'+n+' buổi</b> từ '+(tu?k2s(tu):'…')+' đến '+(den?k2s(den):'…')+'.'
   +(nLop.length?' <b style="color:var(--red)">'+nLop.length+' lớp ('+hsVa+' học sinh) sẽ không được duyệt tự động</b> — '
     +nLop.join(', ')+'.':' <b style="color:var(--green)">Không lớp nào bị va lịch.</b>');
}
function ganChonLich(){

  const t=c.dataset.lt;
  c.closest('.lprow').classList.toggle('on',c.checked);
  document.querySelectorAll('.lpt[data-lt="'+t+'"]').forEach(x=>x.disabled=!c.checked);

 document.querySelectorAll('.lpt,.clkhoi,#clDt,#clTu,#clDen').forEach(x=>x.onchange=capNhatLich);

  capNhatLich();
 };

}

  +'với GVCN là <code>Học sinh</code>. Bắt GVCN duyệt qua danh sách khóa rồi tự tìm học sinh lớp mình là bắt họ làm việc của máy.');

/* Đóng vòng cho chip rà lại: người xem rồi phải để lại DẤU VẾT quyết định,
   nếu không thì lần sau mở ra vẫn thấy y nguyên và không ai biết đã xem hay chưa. */
/* ══════════════ SỬA ĐĂNG KÝ ══════════════
   ★ Việc sửa có thật nhất là CHUYỂN KHÓA: phụ huynh chọn nhầm, hoặc khóa này trùng lịch
   nên đổi sang khóa khác cùng môn khác giờ. Trước đây phải hủy rồi đăng ký lại —
   mà làm vậy là MẤT SỐ THỨ TỰ, tức là mất đúng cái căn cứ công bằng khi khóa đông.
   ★ Không sửa được: học sinh (đổi người là một đăng ký khác), STT, ngày gửi, nguồn —
   đó là dấu vết ai thao tác lúc nào, sửa được thì không còn là dấu vết. */
/* Chuyển NGAY được khi chưa có đồng nào phát sinh: đăng ký chưa xác nhận, hoặc khóa chưa khai giảng.
   Còn lại thì phải chờ mốc tháng — xem giải thích trong hộp thoại. */
function chuyenNgayDuoc(d){
 const k=khoaById(d.khoa);
 return d.tt!=='xacnhan'||k.lich.tu>HOMNAY;
}
/* ★ Khóa thu TRỌN KHÓA không chuyển giữa chừng được: tiền đã phát hành một cục,
   không có mốc tháng nào để cắt. Chặn ở đây và chỉ đường sang hủy + đăng ký lại,
   để M7.1 quyết toán phần đã học — thà chặn rõ còn hơn chuyển xong rồi kế toán không khớp. */
function chanTronKhoa(d,kMoi){
 if(d.tt!=='xacnhan') return null;
 const kCu=khoaById(d.khoa);
 if(kCu.chuky==='khoa') return 'Khóa hiện tại <b>'+esc(kCu.ten)+'</b> thu <b>trọn khóa</b>';
 if(kMoi&&kMoi.chuky==='khoa') return 'Khóa muốn chuyển sang <b>'+esc(kMoi.ten)+'</b> thu <b>trọn khóa</b>';
 return null;
}
/* ★ Một phép xét, hai lối vào: sửa từng dòng (✏️) và tạo yêu cầu chủ động.
   Viết hai lần thì sớm muộn hai lối vào sẽ cho hai kết luận khác nhau về cùng một ca. */
function xetChuyen(d,kid){
 const kCu=khoaById(d.khoa), k=khoaById(kid), hl=ngayHieuLuc(), ngay=chuyenNgayDuoc(d);
 const chan=chanTronKhoa(d,k);
 if(chan) return {ok:false,lop:'danger',nut:'Không chuyển được',
  html:'⛔ <b>Không chuyển lớp được.</b> '+chan+' — tiền đã phát hành một cục, không có mốc tháng nào để cắt.'
   +'<br><span style="font-size:11.5px">Cách xử: <b>hủy đăng ký</b> khóa cũ rồi <b>đăng ký mới</b>, '
   +'để <b>M7.1</b> quyết toán phần đã học và hoàn phần còn lại.</span>'};
 const con=conCho(k);
 if(con<=0) return {ok:false,lop:'danger',nut:'Khóa đã đầy',
  html:'<b>'+esc(k.ten)+'</b> — '+lichMotDong(k)+'<br>⛔ Khóa đã đủ <b>'+k.succhua+'/'+k.succhua
   +'</b> — <b>không nhận chuyển sang</b>. Chuyển lớp phải <b>giữ được chỗ</b>, mà giữ chỗ ở khóa đã đầy là hứa suông.'};
 const xd=xdNang(xungDot(d.hs,kid,d.khoa)), ck=xd.filter(x=>x.loai==='ck');
 return {ok:true,xd,ck,ngay,hl,lop:ck.length?'danger':xd.length?'warn':'okbox',
  nut:ngay?'Chuyển ngay':'Đặt lịch chuyển từ '+k2s(hl),
  html:'<b>'+esc(k.ten)+'</b> — '+lichMotDong(k)+'<br>Còn <b>'+con+' chỗ</b>'

 const [gl,gr,gm]=$('#clGv').value.split('|');
 const loi=[];
 if(!ten) loi.push('Chưa có tên khóa');
 if(!khoi.length) loi.push('Chưa chọn khối đối tượng');
 if(!Object.keys(buoi).length) loi.push('Chưa chọn buổi nào trong tuần');
 Object.keys(buoi).forEach(t=>{const [a,b]=kh2m(buoi[t]);
  if(a>=b) loi.push(THU[t-1]+': giờ kết thúc phải sau giờ bắt đầu')});
 if(!tu||!den||den<=tu) loi.push('Khoảng thời gian khóa không hợp lệ');
 if(+$('#clSc').value<1) loi.push('Sức chứa phải lớn hơn 0');
 return {loi,ten,mon:$('#clMon').value,gv:gl==='truong'?{loai:'truong',ref:gr,mon:gm}:{loai:'ngoai',ref:gr},
  dt:$('#clDt').value,phong:$('#clPhong').value.trim()||'Chưa xếp phòng',doituong:{khoi},
  lich:{buoi,tu,den},succhua:+$('#clSc').value,gia:+$('#clGia').value,chuky:$('#clCk').value,
  xettuyen:$('#clXt').checked,mota:$('#clMota').value.trim()};
}
function taoKhoa(){
 mfns.bTao=()=>{
  const f=docFormKhoa();
  if(f.loi.length){toast('⚠️ Chưa mở khóa được:<br>• '+f.loi.join('<br>• '));return}
  const id='NK-'+p2(KHOA.length+1);
  KHOA.push({id,ten:f.ten,mon:f.mon,dt:f.dt,phong:f.phong,gv:f.gv,lich:f.lich,succhua:f.succhua,
   gia:f.gia,chuky:f.chuky,doituong:f.doituong,tt:'tuyensinh',xettuyen:f.xettuyen,mota:f.mota,
   tao:{boi:R().n,ngay:HOMNAY}});
  closeM(); ST.tab='khoa'; ST.chipKhoa='dang'; ST.curKhoa=id; ST.sub='tt';
  const va=lopTrungKhoa(khoaById(id));
  toast('✅ Đã mở khóa <b>'+esc(f.ten)+'</b> — đang tuyển sinh, phụ huynh đăng ký được ngay.'
   +(va.length?' ⚠️ <b>'+va.length+' lớp bị va lịch</b> — xem cảnh báo ở đầu màn hình khóa.':''));
  render();
 };
 modal('➕ Mở khóa ngoại khóa mới',
  '<div class="info">Khóa mới ở trạng thái <b>Đang tuyển sinh</b>, phụ huynh đăng ký được ngay qua App. '
  +'Không có bước duyệt — HT/PHT chịu trách nhiệm nội dung khóa.</div>'
  +formKhoa(null)
  +'<div class="ro" style="margin-top:11px">Chọn <b>GV mời ngoài</b> thì hệ thống tự đặt người điểm danh là <b>Văn thư</b> — '
  +'GV không có tài khoản nên không tự nhập được, và mọi bản ghi sẽ mang nhãn «nhập thay».</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="Tao">Mở khóa</button>');
 ganChonLich();
}
function suaKhoa(){
 const k=khoaById(ST.curKhoa);
 const truoc={}; hsChinhThuc(k.id).forEach(h=>truoc[h.id]=xdNang(xungDot(h.id,k.id)).length>0);
 const lichCu=lichMotDong(k), scCu=k.succhua;
 mfns.bSua=()=>{
  const f=docFormKhoa();
  if(f.loi.length){toast('⚠️ Chưa lưu được:<br>• '+f.loi.join('<br>• '));return}
  const nXN=dkCuaKhoa(k.id,'xacnhan').length;
  if(f.succhua<nXN){toast('⛔ Sức chứa mới là <b>'+f.succhua+'</b> nhưng khóa đã có <b>'+nXN
   +' em đã xác nhận</b>. Hệ thống <b>không tự loại em nào</b> — phải hủy đăng ký trước rồi mới hạ sức chứa.');return}
  Object.assign(k,{ten:f.ten,mon:f.mon,phong:f.phong,gv:f.gv,lich:f.lich,succhua:f.succhua,
   gia:f.gia,chuky:f.chuky,doituong:f.doituong,xettuyen:f.xettuyen,mota:f.mota});
  (k.ls=k.ls||[]).push({luc:k2s(HOMNAY),boi:R().n,
   gi:(lichCu!==lichMotDong(k)?'lịch: '+lichCu+' → '+lichMotDong(k):'')
     +(scCu!==k.succhua?(lichCu!==lichMotDong(k)?'; ':'')+'sức chứa: '+scCu+' → '+k.succhua:'')||'thông tin khóa'});
  const moiVa=hsChinhThuc(k.id).filter(h=>!truoc[h.id]&&xdNang(xungDot(h.id,k.id)).length);
  closeM();
  modal('✅ Đã lưu thay đổi — '+esc(k.ten),
   '<div class="okbox">Lịch mới: <b>'+lichMotDong(k)+'</b>. Thay đổi được ghi vào <b>lịch sử khóa</b> kèm tên bạn.</div>'
   +(moiVa.length?'<div class="danger">⚠️ Đổi lịch làm <b>'+moiVa.length+' em đang học trở thành trùng lịch</b> — '
     +'các em này <b>đã ở trong khóa</b>, không phải đăng ký mới, nên hệ thống <b>không tự loại</b> ai.'
     +'<div style="margin-top:7px">'+moiVa.map(h=>'<div style="font-size:12px">⛔ <b>'+esc(h.ten)+'</b> — '+h.lop+'</div>').join('')+'</div>'
     +'<div style="font-size:11.5px;margin-top:6px">Tìm lại bằng chip <b>⚠ Đã duyệt nhưng đang trùng</b> ở tab Đăng ký để xử từng em.</div></div>'
     :'<div class="info">Không em nào đang học bị trùng lịch thêm vì thay đổi này.</div>')
   +'<div class="warn">Đổi lịch hoặc sức chứa sẽ <b>gửi thông báo cho phụ huynh đã đăng ký</b> và ghi audit. '
   +'Học phí do <b>M7.1</b> tính lại nếu chu kỳ thu hoặc số buổi thay đổi.</div>',
   '<button class="btn p" data-mb="close">Đóng</button>');
  render();
 };
 modal('✏️ Sửa khóa — '+esc(k.ten),
  (dkCuaKhoa(k.id,'xacnhan').length?'<div class="warn">Khóa đang có <b>'+dkCuaKhoa(k.id,'xacnhan').length
   +' em đã xác nhận</b>. Đổi lịch có thể làm các em trở thành trùng lịch — hệ thống sẽ <b>nêu đích danh</b> sau khi lưu, '
   +'và <b>không tự loại em nào</b>.</div>':'')
  +formKhoa(k)
  +(k.ls&&k.ls.length?'<label class="lbl">Lịch sử thay đổi</label><div class="tbw"><table>'
    +k.ls.map(x=>'<tr><td style="font-size:11.5px">'+x.luc+' · <b>'+esc(x.boi)+'</b></td>'
      +'<td style="font-size:11.5px">'+esc(x.gi)+'</td></tr>').join('')+'</table></div>':''),
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="Sua">Lưu thay đổi</button>');
 ganChonLich();
}
function huyKhoa(){
 const k=khoaById(ST.curKhoa), n=dkCuaKhoa(k.id,'xacnhan').length;
 mfns.bHK=()=>{const ly=$('#hkly').value.trim();
  if(!ly){toast('⚠️ Bắt buộc nêu lý do — phụ huynh sẽ nhận thông báo này.');return}
  k.tt='huy';k.huy={ngay:HOMNAY,boi:R().n,ly};closeM();
  toast('🚫 Đã hủy khóa <b>'+esc(k.ten)+'</b>. Bản ghi <b>giữ lại</b> cùng '+dkCuaKhoa(k.id).length
   +' đăng ký; học phí đã thu do <b>M7.1</b> xử lý hoàn.');render()};
 modal('Hủy khóa — '+esc(k.ten),
  (n?'<div class="danger">⚠️ Khóa đang có <b>'+n+' học sinh đã xác nhận</b>. Hủy sẽ gửi thông báo tới toàn bộ phụ huynh, '
   +'và <b>M7.1 phải xử lý hoàn học phí</b> nếu đã thu.</div>':'')
  +'<div class="info">Khóa <b>không xóa</b> — chuyển sang trạng thái <b>Đã hủy</b> và vẫn tra ra được bằng chip lọc, '
  +'kèm nguyên danh sách đăng ký làm căn cứ hoàn tiền.</div>'
  +'<label class="lbl">Lý do hủy <span style="color:var(--red)">*</span></label>'
  +'<select class="fldi"><option>Không đủ sĩ số tối thiểu</option><option>Giáo viên không tiếp tục được</option>'
  +'<option>Không bố trí được phòng / sân</option><option>Khác</option></select>'
  +'<label class="lbl">Ghi chú gửi phụ huynh <span style="color:var(--red)">*</span></label><textarea class="fldi" id="hkly" rows="3"></textarea>',
  '<button class="btn" data-mb="close">Đóng</button><button class="btn d" data-mb="HK">Hủy khóa</button>');
}
function themBu(){
 const k=khoaById(ST.curKhoa);
 modal('Thêm buổi bù — '+esc(k.ten),
  '<div class="info">Buổi bù <b>tính vào số buổi thực tế</b>. Với khóa thu <b>theo buổi</b> thì đó là tiền — '
  +'nên buổi bù phải ghi rõ bù cho buổi hoãn nào.</div>'
  +'<label class="lbl">Ngày bù</label><input class="fldi" type="date" value="'+HOMNAY+'">'
  +'<label class="lbl">Giờ <span style="color:var(--ink3);font-weight:400">— khác lịch chuẩn cũng được</span></label>'
  +'<input class="fldi" value="'+(lGio(k,thuSo(HOMNAY))||lichNhom(k)[0].gio)+'">'
  +'<label class="lbl">Bù cho buổi hoãn <span style="color:var(--red)">*</span></label><select class="fldi">'
  +buoiCuaKhoa(k).filter(b=>b.tt==='hoan').map(b=>'<option>'+k2s(b.ngay)+' — '+esc(b.ly)+'</option>').join('')
  +'<option>Không bù cho buổi nào (buổi tăng cường)</option></select>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="close">Thêm buổi bù</button>');
}
function themDK(){
 modal('➕ Thêm học sinh vào khóa',
  '<div class="info">Đăng ký nhập tại web mang nguồn <b>«VT nhập hộ»</b> để phân biệt với đăng ký phụ huynh tự gửi từ App — '
  +'khi có tranh chấp thì biết ai là người thao tác.</div>'
  +'<label class="lbl">Tìm học sinh</label><input class="inp" style="width:100%" placeholder="🔍 Tên hoặc mã học sinh…">'
  +'<div class="ro" style="margin-top:11px">Học sinh phải thuộc <b>khối đối tượng</b> của khóa. Ngoài khối thì hệ thống chặn và nêu rõ khối nào được nhận.</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="close">Thêm</button>');
}
function themGV(){
 modal('➕ Thêm giáo viên mời ngoài',
  '<div class="warn">Đây <b>không phải hồ sơ nhân sự</b> — chỉ là danh bạ để khỏi gõ lại tên và số điện thoại. '
  +'Người này <b>không có tài khoản</b>, không đăng nhập được, không chat qua M8.2, và không tự điểm danh được.<br>'
  +'Nếu là <b>nhân sự của trường</b> thì đừng thêm ở đây — chọn thẳng từ <b>M4.1</b> khi mở khóa.</div>'
  +'<label class="lbl">Họ tên <span style="color:var(--red)">*</span></label><input class="fldi">'
  +'<label class="lbl">Điện thoại <span style="color:var(--ink3);font-weight:400">— trường công bố cho phụ huynh liên hệ</span></label><input class="fldi">'
  +'<label class="lbl">Đơn vị công tác</label><input class="fldi">'
  +'<label class="lbl">Ghi chú</label><input class="fldi">',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="close">Lưu</button>');
}
function xuat(){
 modal('📤 Xuất dữ liệu — bắt buộc chọn mục đích',
  '<div class="warn">Dữ liệu chứa <b>họ tên học sinh</b> — NĐ 13/2023. Mọi lượt xuất <b>ghi audit</b> và <b>bắt buộc chọn mục đích</b>.</div>'
  +'<label class="lbl">Nội dung xuất</label><select class="fldi"><option>Danh sách khóa và sĩ số</option>'
  +'<option>Danh sách học sinh của một khóa</option><option>Bảng điểm danh theo khóa</option>'
  +'<option>Kết quả khóa học</option><option>Danh sách đăng ký chờ xác nhận</option></select>'
  +'<label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>'
  +'<select class="fldi"><option>Gửi giáo viên phụ trách khóa</option><option>Báo cáo nội bộ</option>'
  +'<option>Lưu trữ</option></select>'
  +'<label class="lbl">Định dạng</label><select class="fldi"><option>Excel (.xlsx)</option><option>PDF</option></select>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="close">Xuất và ghi audit</button>');
}

render();
</script>
</body>
