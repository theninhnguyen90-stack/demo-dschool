<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.10 Ký túc xá — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.mini{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:12px}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}

/* ═════════ M6.10 KÝ TÚC XÁ ═════════ */
.simtg{display:inline-flex;align-items:center;gap:6px;border:1px solid #475569;border-radius:8px;padding:3px 9px;font-size:11.5px;color:#cbd5e1;background:#1e293b}
.simtg.off{border-color:#b45309;color:#fcd34d}

/* thẻ phòng ở tab 1 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
.pcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer}
.pcard:hover{border-color:var(--brand);box-shadow:0 1px 6px rgba(29,78,216,.10)}
.pcard.sel{border-color:var(--brand);background:var(--brand-soft)}
.pcard.off{opacity:.62;cursor:default}
.pcard.off:hover{border-color:var(--line);box-shadow:none}
.pcard .pn{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px}
.pcard .pm{font-size:11.5px;color:var(--ink3);margin:2px 0 7px}
.bdg{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px;margin:2px 3px 0 0}
.bdg.r{background:var(--red-soft);color:var(--red)}
.bdg.a{background:var(--amber-soft);color:var(--amber)}
.bdg.g{background:var(--green-soft);color:var(--green)}
.bdg.n{background:#f1f5f9;color:var(--ink2)}
.bdg.v{background:#f5f3ff;color:var(--violet)}
.bdg.rr{background:var(--red);color:#fff}

/* cột gợi ý của máy — tầng 2 */
.hint2{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap}
.hint2.in{background:var(--green-soft);color:var(--green)}
.hint2.out{background:var(--red-soft);color:var(--red)}
.hint2.perm{background:var(--brand-soft);color:var(--brand)}
.hint2.none{background:#f1f5f9;color:#64748b}
.dev{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.dev.o{color:var(--red);font-weight:600}
.dev.i{color:var(--green);font-weight:600}
.dev.m{color:var(--ink3)}

/* năm nút trạng thái điểm danh — tô bằng chính màu trạng thái */
.dd{display:inline-flex;gap:3px}
.dd button{width:30px;height:27px;border:1px solid var(--line2);border-radius:7px;background:#fff;font-size:12px;font-weight:700;color:var(--ink2);display:grid;place-items:center}
.dd button:hover{border-color:var(--ink3)}
.dd button.on{color:#fff;border-color:transparent}
.dd button.on[data-s="cm"]{background:var(--green)}
.dd button.on[data-s="vp"]{background:var(--brand)}
.dd button.on[data-s="kp"]{background:var(--red)}
.dd button.on[data-s="vien"]{background:var(--violet)}
.dd button.on[data-s="nha"]{background:#0f766e}
.dd.lk button{opacity:.45;cursor:not-allowed}
.srcline{font-size:10.5px;color:var(--ink3);margin-top:2px}
tr.nocham td{background:#fffbeb}
tr.nocham td:first-child{font-weight:700}
tr.susp td{background:#fef2f2}

/* sơ đồ giường */
.khu{margin-bottom:16px}
.khu>h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px}
.rbox{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px}

/* Bốn mức. `Không có dữ liệu` TÁCH khỏi `Đã ra chưa về` — §2.1 của tài liệu. */
function suyRa(hsId,k,nowMin){
 const ev=cuaCua(hsId,k), d=donCua(hsId,k);
 const last=ev.length?ev[ev.length-1]:null;
 /* Không có thiết bị thì KHÔNG có dấu hiệu nào để nghi — vắng dữ liệu là mặc định,
    không phải tín hiệu. Chỉ khi thiết bị đang chạy mà riêng em này không có lượt nào
    thì đó mới là điều đáng rà. */
 if(!ev.length) return {m:'none',n:'Không có dữ liệu hôm nay',
   why:THIETBI_MP?'Thiết bị đang chạy nhưng KHÔNG bắt được lượt vào hay ra nào của em này trong ngày'
                 :'Chưa nối thiết bị cửa — không có nguồn nào để suy luận, và đó là trạng thái bình thường',
   nghi:THIETBI_MP,last:null};
 if(last.t==='in') return {m:'in',n:'Đang trong KTX',why:'Lượt cuối là VÀO lúc '+last.g,nghi:false,last};
 /* lượt cuối là RA */
 if(d){
  const hen=/^\d\d:\d\d$/.test(d.hen)?h2m(d.hen):null;
  if(hen===null||nowMin<=hen) return {m:'perm',n:'Ra ngoài có phép — hẹn về '+d.hen,
    why:'Đơn '+d.id+' đã duyệt, rời KTX lúc '+last.g,nghi:false,last,don:d};
  return {m:'out',n:'Đã ra chưa về',why:'Có đơn '+d.id+' nhưng đã QUÁ HẸN '+(nowMin-hen)+' phút (hẹn '+d.hen+', ra lúc '+last.g+')',
    nghi:true,last,don:d,quaHen:nowMin-hen};
 }
 return {m:'out',n:'Đã ra chưa về',why:'Ra lúc '+last.g+', chưa có lượt vào, và KHÔNG có đơn ra ngoài',nghi:true,last};
}

function giuongTrong(pid){
 const p=phongById(pid), da=new Set(hsCuaPhong(pid).map(h=>h.giuong));
 for(let i=1;i<=p.sc;i++) if(!da.has(i)) return i;
 return null;                                       /* hết chỗ — người gọi phải chặn trước */
}

 return null;
}

/* quyền GHI điểm danh cho một phòng trong một đêm — cơ chế Người chấm (khung-menu §8) */
function chamDuoc(pid,k){
 const r=R(), p=phongById(pid);
 if(!can('cham')) return {ok:false,ly:'Vai <b>'+esc(r.cd)+'</b> không có quyền ghi điểm danh nội trú.'};
 if(p.tt!=='dung') return {ok:false,ly:'Phòng đang ở trạng thái <b>'+TT_PHONG[p.tt]+'</b> — không có học sinh để chấm.'};
 if(can('chambu')) return {ok:true,bu:true};                       /* Quản lý KTX: chấm bù mọi phòng */
 if(r.khu) return r.khu===p.khu?{ok:true}:
   {ok:false,ly:'Phòng này thuộc <b>'+tenKhu(p.khu)+'</b>, ngoài khu bạn phụ trách.'};
 if(r.truc) return trucCua(k)===r.n?{ok:true,truc:true}:
   {ok:false,ly:'Đêm <b>'+k2s(k)+'</b> do <b>'+esc(trucCua(k))+'</b> trực, không phải bạn. Quyền ghi của quản sinh trực chỉ mở trong <b>đêm mình trực</b>.'};
 return {ok:true};
}

/* ═══════════ TAB 6 · THEO DÕI ĂN — F8 · v1.3 · 13/9/2026 ═══════════
   Bổ sung theo yêu cầu 13/9 — MÔ HÌNH TÍNH ĂN THỨ HAI của hệ thống, ĐỘC
   LẬP với bán trú M6.1 (chốt 13/9). Hai mô hình chạy song song, không phụ
   thuộc nhau; trường đăng ký em vào mô hình nào thì tính theo mô hình đó.
   Mô hình KTX tính tiền theo SỐ BUỔI ĐÃ ĂN — xem tài liệu §8b.

   Ba quyết định chi phối tệp này:
   ① Trạng thái `Không ăn có phép` SINH TỪ ĐƠN ĐÃ DUYỆT ở tab 2 — dẫn xuất,
      không nhập tay, khóa sửa tại đây (cùng quy tắc §5.3 của điểm danh tối).
      Muốn biết một đơn phủ bữa nào thì phải biết GIỜ của bữa ⇒ cấu hình có
      giờ bắt đầu từng bữa. Không có nó, đơn "ra ngoài 18:30" sẽ bị tính là
      phủ luôn bữa tối 17:30 mà em đã ăn.
   ② NGƯỜI THẤY THẮNG KẾ HOẠCH: ô đã ghi `Đã ăn` không bị đơn lật sang có
      phép. Đơn là dự định, quản sinh ghi là quan sát.
   ③ Cấu hình bữa KHÔNG HỒI TỐ — mỗi lần lưu là một PHIÊN BẢN có ngày hiệu lực.
      Đổi hồi tố thì "tổng số buổi cần điểm danh" của tháng đã bàn giao M7.2
      tự đổi theo, tức con số tiền đã phát hành thay đổi mà không ai sửa nó.
   ═══════════════════════════════════════════════════════════════════════ */

const BUA=[['sang','Sáng','S'],['trua','Trưa','Tr'],['toi','Tối','Tố']];
const tenBua=b=>(BUA.find(x=>x[0]===b)||[])[1];
const THU_CHU=['CN','T2','T3','T4','T5','T6','T7'];
const THU_DS=[1,2,3,4,5,6,0];                         /* thứ tự hiển thị T2 → CN */

/* ---------- cấu hình theo PHIÊN BẢN — không hồi tố ---------- */
const tuanDu=(cn)=>{const o={};[1,2,3,4,5,6].forEach(d=>o[d]={on:1,sang:1,trua:1,toi:1});o[0]=cn;return o};
const CFG_AN={ban:[
 {tu:'2026-09-05',boi:'Mai Thị Hạnh',luc:'01/09/2026 15:20',ghi:'Cấu hình đầu năm — Chủ nhật không tổ chức ăn',
  gio:{sang:'06:30',trua:'11:30',toi:'17:30'},tuan:tuanDu({on:0,sang:1,trua:1,toi:1})},
 {tu:'2026-10-04',boi:'Mai Thị Hạnh',luc:'02/10/2026 09:05',ghi:'Học sinh về lại KTX chiều Chủ nhật — mở bữa tối CN',
  gio:{sang:'06:30',trua:'11:30',toi:'17:30'},tuan:tuanDu({on:1,sang:0,trua:0,toi:1})}
]};
const banCua=k=>{let v=null;CFG_AN.ban.forEach(b=>{if(b.tu<=k)v=b});return v};
function buaBat(k,bua){
 const b=banCua(k); if(!b) return false;
 const d=b.tuan[k2d(k).getDay()];
 return !!(d.on&&d[bua]);
}
const buaCuaNgay=k=>BUA.filter(([b])=>buaBat(k,b)).map(x=>x[0]);

/* ---------- lưu trú — một HỌC SINH có thể có nhiều bản ghi chỗ ở ----------
   Chuyển phòng tạo bản ghi MỚI (RB15). Theo dõi ăn đi theo HỌC SINH, nên
   phải gộp mọi khoảng ở của cùng một mã học sinh — nếu không thì em chuyển
   phòng giữa tháng bị tính thiếu những ngày trước khi chuyển.            */
const TT_LUUTRU=['dangO','chuyenPhong','thoiO','traPhong'];
/* ⚠ CHỈ GỘP BẢN GHI LỊCH SỬ VÀO BẢN GHI ĐANG Ở — không bao giờ gộp hai bản
   ghi đang ở với nhau. Hai lần sửa trước khi ra được quy tắc này:
     · gộp theo MÃ HS trơn → bảng còn 84 dòng: bộ sinh dữ liệu mẫu (app.10)
       tạo mã ngẫu nhiên, hai em khác nhau trùng mã;
     · gộp theo MÃ + HỌ TÊN → còn 105 dòng: bộ sinh gieo hạt theo TỔNG mã ký
       tự của tên phòng, nên `A-102` và `A-201` sinh ra y hệt cùng danh sách
       em, cùng tên, cùng mã.
   Hệ thống thật gộp theo mã định danh duy nhất. Demo gộp đúng cái cần gộp:
   bản ghi `Đã chuyển phòng` / `Thôi ở` / `Đã trả phòng` về dưới bản ghi
   `Đang ở` cùng mã + tên; không có thì nó tự là một dòng.             */
const khoaHS=x=>x.ma+'|'+x.ten;
let _nhom=null, _dau=null;                          /* id đầu nhóm → [bản ghi]; id → id đầu nhóm */
function dungNhom(){
 _nhom={};_dau={};
 const dangOTheoKhoa={};
 HS.filter(x=>x.tt==='dangO').forEach(x=>{_nhom[x.id]=[x];_dau[x.id]=x.id;
  (dangOTheoKhoa[khoaHS(x)]=dangOTheoKhoa[khoaHS(x)]||[]).push(x)});
 HS.filter(x=>TT_LUUTRU.includes(x.tt)&&x.tt!=='dangO').forEach(y=>{
  const cands=dangOTheoKhoa[khoaHS(y)]||[];
  /* nhiều ứng viên cùng khóa (dữ liệu mẫu trùng) → lấy em đi tiếp từ đúng phòng cũ */
  const x=cands.find(c=>c.chuyenTu===y.phong)||(cands.length===1?cands[0]:null);
  if(x){_nhom[x.id].push(y);_dau[y.id]=x.id} else {_nhom[y.id]=[y];_dau[y.id]=y.id}
 });
}

/* ---------- ĐƠN ĐÃ DUYỆT phủ một bữa ----------
   Khoảng của đơn: [ngày đi + giờ rời, ngày về + giờ hẹn về). Bữa bị phủ khi
   GIỜ BẮT ĐẦU của bữa rơi vào khoảng đó. Đơn "Đi viện" chưa có ngày về thì
   phủ tới khi có bản ghi về.                                             */
function gioTrong(s){const m=String(s||'').match(/(\d\d:\d\d)(?!.*\d\d:\d\d)/);return m?m[1]:null}
function donPhuBua(ids,k,bua){
 const t=k+' '+gioBua(k,bua);
 return DON.find(d=>{
  if(d.tt!=='duyet'||!ids.includes(d.hs)) return false;
  const dau=d.tu+' '+(gioTrong(d.roi)||'00:00');
  const cuoi=(d.den||'9999-12-31')+' '+(gioTrong(d.hen)||'23:59');
  return t>=dau&&t<cuoi;
 })||null;
}

]);

const GHI_CP=[
 ['Đội tuyển HSG tập huấn tại Sở, ăn trưa tại điểm tập huấn','Giay-trieu-tap-doi-tuyen.pdf'],

/* hạt giống theo MÃ CŨ (hatGiong — app.10, PHKT): bữa ăn mẫu sinh y hệt trước khi đổi mã phòng */
function hashS(s){return hatGiong(s).split('').reduce((a,c)=>(a*31+c.charCodeAt(0))&0x7fffffff,7)}
function seedAn(id,k,bua){
 /* Hai ngày gần nhất KHÔNG sinh ngẫu nhiên "không phép" — danh sách cảnh
    báo lên Bảng điều khiển phải là danh sách đã chọn, để rà được đích danh. */
 if(k>=homQua) return {tt:'da',nguon:'qs',boi:'Quản sinh',luc:gioBua(k,bua)};
 const v=rng(hashS(id+k+bua))();
 if(v<0.986) return {tt:'da',nguon:'qs',boi:'Quản sinh',luc:gioBua(k,bua)};
 if(v<0.994) return {tt:'kp',nguon:'qs',boi:'Quản sinh',luc:gioBua(k,bua)};
 const g=GHI_CP[hashS(id+k)%GHI_CP.length];
 return {tt:'cp',nguon:'qs',boi:'Quản sinh',luc:gioBua(k,bua),ghi:g[0],tep:g[1]};
}

});

/* ★ Trạng thái của MỘT ô — thứ tự ưu tiên là quyết định thiết kế:
     ① ngoài thời gian ở → không áp dụng
     ② bữa không bật trong cấu hình → không có ô
     ③ người ghi `Đã ăn` → THẮNG đơn (người thấy thắng kế hoạch)
     ④ đơn đã duyệt phủ bữa → `Không ăn có phép`, KHÓA sửa
     ⑤ người ghi khác
     ⑥ bữa chưa tới → trống
     ⑦ chưa ai ghi → `Chưa điểm danh`                                  */
function anTT(h,k,bua){
 if(!apDung(h,k)) return {tt:'na'};
 if(!buaBat(k,bua)) return {tt:'off'};
 const key=h.id+'|'+k+'|'+bua, o=AN[key], don=donPhuBua(idsCua(h),k,bua);
 if(o&&o.tt==='da') return Object.assign({},o,don?{donTrung:don}:{});
 if(don) return {tt:'cp',nguon:'don',don,luc:'tự sinh'};
 if(o) return o;
 if(!quaBua(k,bua)) return {tt:'sau'};
 if(CHUA.has(key)) return {tt:'chua'};
 if(k===HOMNAY&&bua==='toi'&&TOI_CHUA_PHONG.includes(h.phong)) return {tt:'chua'};
 return seedAn(h.id,k,bua);
}

const tenThang=m=>'tháng '+(+m.slice(5))+'/'+m.slice(0,4);

function tongHS(h,m){
 const r={can:0,da:0,cp:0,kp:0,chua:0,o:0};
 ngayCuaThang(m).forEach(k=>{
  if(k>HOMNAY) return;
  if(apDung(h,k)) r.o++;
  BUA.forEach(([b])=>{
   const s=anTT(h,k,b);
   if(s.tt==='na'||s.tt==='off'||s.tt==='sau') return;
   r.can++; r[s.tt]++;
  });
 });
 return r;
}

/* ★ Cảnh báo lên Bảng điều khiển — DẪN XUẤT, không có nút "đã xử lý".
   "Hai ngày gần nhất" = HÔM QUA và HÔM NAY. Hết hai ngày thì tự rơi khỏi
   danh sách; muốn giữ lại một vết thì ghi vào Sổ sự kiện (tab 3).     */
function canhBaoAn(){

 hsHangAn().forEach(h=>{

 });
 return out;
}

function thangCua(k){return k.slice(0,7)}
function hopOAn(key){
 const [id,k,b]=key.split('|'), r=hsById(id), s=anTT(r,k,b);
 if(s.tt==='na'||s.tt==='off') return;
 const chot=CHOT_AN[thangCua(k)], sua=can('chamAn')&&!chot&&s.tt!=='sau';
 const donLk=s.nguon==='don';
 ST.anKey=key;
 let body='<div class="kv"><span>Học sinh</span><b>'+esc(r.ten)+' · '+r.phong+' · '+esc(r.lop)+'</b></div>'
  +'<div class="kv"><span>Bữa</span><b>'+tenBua(b)+' '+gioBua(k,b)+' · '+kThu(k)+' '+k2s(k)+'</b></div>'
  +'<div class="kv"><span>Hiện tại</span><b><i class="an-o '+s.tt+(donLk?' khoa':'')+'"></i> '
   +(TT_AN[s.tt]?TT_AN[s.tt].n:'Bữa chưa tới')+'</b></div>';
 if(s.nguon==='qs'&&s.tt!=='chua') body+='<div class="kv"><span>Người ghi</span><b>'+esc(s.boi)+' · '+esc(s.luc)+'</b></div>';
 if(s.tt==='cp'&&!donLk) body+='<div class="kv"><span>Thông tin xin phép</span><b>'+esc(s.ghi||'—')+'</b></div>'
  +(s.tep?'<div class="kv"><span>Tệp đính kèm</span><b>📎 '+esc(s.tep)+' <button class="btn xs" data-anxemtep="'+esc(s.tep)+'">👁 Xem</button>'
   +' <button class="btn xs" data-anxemtep="'+esc(s.tep)+'|tai">⬇ Tải</button></b></div>':'');
 if(donLk) body+='<div class="ro">🔒 <b>Tự sinh từ đơn '+s.don.id+'</b> — '+LOAI_DON[s.don.loai].n+', đã duyệt. '
  +'Đơn phủ bữa này vì giờ bắt đầu bữa ('+gioBua(k,b)+') nằm trong khoảng em rời KTX. '
  +'<button class="btn xs" data-goto="ranoai|don">🔗 Mở đơn ở tab 2</button></div>';
 if(s.donTrung) body+='<div class="warn">Có đơn <b>'+s.donTrung.id+'</b> phủ bữa này, nhưng quản sinh đã ghi <b>Đã ăn</b>. '
  +'Bản ghi của người thấy được <b>giữ nguyên</b> — đơn là dự định, ghi nhận là quan sát.</div>';
 if(chot) body+='<div class="alert g">🔒<span class="sp">'+tenThang(thangCua(k))+' đã chốt và bàn giao M7.2 — không sửa ở đây.</span></div>';
 else if(s.tt==='sau') body+='<div class="ro">Bữa này <b>chưa tới giờ</b> ('+gioBua(k,b)+') — chưa ghi được.</div>';
 else if(!can('chamAn')) body+='<div class="ro">Vai <b>'+esc(R().cd)+'</b> chỉ xem.</div>';

 let foot='<button class="btn" data-mb="close">Đóng</button>';
 if(sua&&donLk){
  body+='<label class="lbl">Ngoại lệ duy nhất với ô tự sinh</label>'
   +'<label class="cb"><input type="checkbox" id="anDaAnThat"> Em <b>có mặt và đã ăn</b> bữa này (quản sinh thấy tận mắt)</label>';
  foot+='<button class="btn p" data-mb="anluu">Lưu</button>';
 } else if(sua){
  const cur=s.tt==='chua'?'':s.tt;
  body+='<label class="lbl">Ghi trạng thái</label><div class="an-chon">'
   +['da','kp','cp'].map(t=>'<label class="an-r '+t+'"><input type="radio" name="anTT" value="'+t+'"'
    +(cur===t?' checked':'')+'> '+TT_AN[t].n+'</label>').join('')+'</div>'
   +'<div id="anCP"'+(cur==='cp'?'':' hidden')+'>'
   +'<label class="lbl">Thông tin xin phép <span style="color:var(--red)">*</span></label>'
   +'<textarea class="fldi" id="anGhi" rows="2" placeholder="Ai xin, xin qua đâu, vì sao — ví dụ: mẹ gọi điện 10:15 báo đón đi khám">'
    +esc(cur==='cp'?s.ghi||'':'')+'</textarea>'
   +'<label class="lbl">Tệp làm bằng chứng <span class="srcline">(tùy chọn)</span></label>'
   +'<input type="file" class="fldi" id="anTep">'

   +'<div id="anLoi"></div>';

 modal('🍽 Điểm danh ăn — '+esc(r.ten),body,foot);

mfns.banluu=()=>{

 if(s.nguon==='don'){

 closeM();
 toast('✍ '+esc(r.ten)+' · '+tenBua(b)+' '+k2s(k).slice(0,5)+' → <b>'+TT_AN[tt].n+'</b>. Ghi audit.'

 render();

/* ⚡ Đánh dấu cả bữa — liệt kê ĐÍCH DANH, như điểm danh nhanh §4.3 */
function hopCaBua(kb){
 const [k,b]=kb.split('|');
 const dat=[],giu=[],don=[];
 hsHangAn().filter(h=>apDung(h,k)).sort((a,c)=>(a.phong||'').localeCompare(c.phong||'')||a.giuong-c.giuong).forEach(h=>{
  const s=anTT(h,k,b);
  if(s.nguon==='don') don.push([h,s]); else if(s.tt==='chua') dat.push(h); else giu.push([h,s]);
 });
 ST.anCaBua={k,b,ids:dat.map(h=>h.id)};
 const ds=a=>a.length?a.map(x=>'<span class="pill">'+esc((x[0]||x).ten)+' · '+(x[0]||x).phong
   +(x[1]?' — '+(x[1].nguon==='don'?'đơn '+x[1].don.id:TT_AN[x[1].tt].n):'')+'</span>').join(' '):'<span class="srcline">không có</span>';
 modal('⚡ Đánh dấu Đã ăn — '+tenBua(b)+' '+kThu(k)+' '+k2s(k),
  '<div class="rbox"><b>Sẽ đặt «Đã ăn» — '+dat.length+' em</b><div>'+ds(dat)+'</div></div>'
  +'<div class="rbox"><b>Giữ nguyên — '+giu.length+' em đã có người ghi</b><div style="max-height:90px;overflow:auto">'+ds(giu)+'</div></div>'
  +'<div class="rbox"><b>Có phép từ đơn — KHÔNG đặt tự động — '+don.length+' em</b><div>'+ds(don)+'</div></div>'
  +'<div class="ro">Chỉ những ô <b>Chưa điểm danh</b> bị đặt. Ô đã có người ghi — kể cả «không phép» — <b>không bị ghi đè</b> '
  +'bằng một cú bấm hàng loạt.</div>',
  '<button class="btn" data-mb="close">Hủy</button>'
  +'<button class="btn p" data-mb="ancabua"'+(dat.length?'':' disabled')+'>Đặt «Đã ăn» cho '+dat.length+' em</button>');
}
mfns.bancabua=()=>{
 const {k,b,ids}=ST.anCaBua;
 ids.forEach(id=>AN[id+'|'+k+'|'+b]={tt:'da',nguon:'qs',boi:R().n,luc:simGio+' · hàng loạt'});
 closeM();toast('⚡ Đã đặt <b>Đã ăn</b> cho <b>'+ids.length+'</b> em — '+tenBua(b)+' '+k2s(k).slice(0,5)+'. Ghi audit từng em.');
 render();
};

mfns.banchot=()=>{
 const m=ST.anChot, rows=hsHangAn();
 let daAn=0,o=0; rows.forEach(r=>{const t=tongHS(r,m);daAn+=t.da;o+=t.o});
 CHOT_AN[m]={luc:k2s(HOMNAY)+' '+simGio,boi:R().n,n:rows.length,daAn,o};
 closeM();toast('🔒 Đã chốt <b>'+tenThang(m)+'</b> và bàn giao M7.2: <b>'+vn(daAn)+'</b> buổi đã ăn · <b>'+vn(o)+'</b> ngày ở của '
  +rows.length+' học sinh. M7.2 tạo khoản thu Ăn / Ở KTX — M6.10 dừng ở đây.');
 render();
};

/* ═══════════ SỰ KIỆN của tab này ═══════════ */
document.addEventListener('click',e=>{

 /* nút deep-link bên TRONG hộp thoại: bộ xử lý `data-goto` chung chỉ đổi tab,

/* ═══════ CHUYỂN CẢ PHÒNG — thao tác hàng loạt trên `Sơ đồ chỗ ở` ═══════
   Ca có thật: một phòng phải sửa chữa gấp giữa năm (thấm trần, hỏng điện,
   vỡ ống nước) và cả phòng phải dời đi trong ngày.

   ★ Vì sao KHÔNG phải "chuyển cả phòng sang MỘT phòng khác": ký túc xá
   gần như không bao giờ có sẵn một phòng trống đủ chỗ. Thực tế là RẢI
   các em vào những giường trống còn lại. Nên màn hình phải nhận được
   một PHÂN BỔ (em nào về phòng nào), không phải một phòng đích.        */

/* chỗ trống của từng phòng nhận được, cùng giới tính, trừ chính nó */
function chonhanCua(pid){
 const k=khuById(phongById(pid).khu);
 return phongKTX().filter(p=>p.tt==='dung'&&p.khu!==null&&khuById(p.khu).gt===k.gt
   &&p.id!==pid&&hsCuaPhong(p.id).length<p.sc)
  .map(p=>({p,trong:p.sc-hsCuaPhong(p.id).length}));
}

/* gợi ý phân bổ: lấp lần lượt các phòng còn chỗ */
function goiYPhanBo(pid){
 const ds=hsCuaPhong(pid), kho=chonhanCua(pid).map(x=>({id:x.p.id,con:x.trong})), ra={};
 ds.forEach(h=>{
  const o=kho.find(x=>x.con>0);
  if(o){ra[h.id]=o.id;o.con--} else ra[h.id]='';
 });
 return ra;
}

function hopChuyenCaPhong(pid){
 const p=phongById(pid), ds=hsCuaPhong(pid), kho=chonhanCua(pid);
 const tongTrong=kho.reduce((a,x)=>a+x.trong,0), gt=khuById(p.khu).gt==='nam'?'nam':'nữ';

 /* ── CHẶN CỨNG: không đủ chỗ cho cả phòng ── */
 if(tongTrong<ds.length){
  modal('🔀 Chuyển cả phòng '+pid+' — không đủ chỗ',
   '<div class="danger">⛔ <b>Cần '+ds.length+' chỗ, chỉ còn '+tongTrong+' — thiếu '+(ds.length-tongTrong)+'.</b><br>'
   +'Chỉ đếm giường ở <b>phòng '+gt+' đang dùng</b>: giới tính phòng là ràng buộc chặn cứng, '
   +'chỗ trống ở khu bên kia <b>không dùng được</b> cho các em này.</div>'
   +'<div class="tbw"><table><tr><th>Phòng nhận được</th><th>Còn trống</th></tr>'
   +(kho.length?kho.map(x=>'<tr><td>'+x.p.id+' · Tầng '+x.p.tang+'</td><td class="num">'+x.trong+'</td></tr>').join('')
     :'<tr><td colspan="2" style="color:var(--ink3)">Không có phòng nào còn chỗ</td></tr>')
   +'</table></div>'
   +'<div class="ro" style="margin-top:11px">Hai đường đi: <b>sửa sức chứa</b> một vài phòng '
   +'<i>(tab 5 · Danh mục phòng)</i>, hoặc <b>chuyển từng em</b> và chấp nhận phòng này còn người ở lại '
   +'cho tới khi có chỗ. ⛔ Hệ thống <b>không tự xếp vượt sức chứa</b>.</div>',
   '<button class="btn" data-mb="close">Đóng</button>'
   +'<button class="btn p" data-mb="close" data-sub="dm">↗ Sang Danh mục phòng</button>');
  return;
 }

 /* ── PHÂN BỔ ── */
 const pb=goiYPhanBo(pid);
 const opt=h=>chonhanCua(pid).map(x=>'<option value="'+x.p.id+'"'+(pb[h.id]===x.p.id?' selected':'')+'>'
   +x.p.id+' · Tầng '+x.p.tang+' · còn '+x.trong+' chỗ</option>').join('');

 mfns.bCCP=()=>{
  const ly=$('#ccply').value.trim();
  if(!ly){$('#ccperr').style.display='block';return}
  const dong=Object.fromEntries([...document.querySelectorAll('[data-ccprow]')]
    .map(s=>[s.dataset.ccprow,s.value]));
  /* đếm lại theo phân bổ thật — người dùng có thể dồn nhiều em vào một phòng */
  const con={}; chonhanCua(pid).forEach(x=>con[x.p.id]=x.trong);
  const ok=[], bo=[];
  hsCuaPhong(pid).forEach(h=>{
   const to=dong[h.id];
   if(!to){bo.push([h,'chưa chọn phòng đích']);return}
   if(!con[to]||con[to]<=0){bo.push([h,'phòng '+to+' đã hết chỗ trong chính lần phân bổ này']);return}
   const vm=vuongMac(to,h.id);
   if(vm){bo.push([h,vm.replace(/<[^>]+>/g,'')]);return}
   con[to]--; ok.push([h,to]);
  });
  /* thi hành */
  ok.forEach(([h,to])=>{
   const cu=h.phong, np=phongById(to);
   HS.push({...h,id:h.id+'~cc'+HOMNAY,tt:'chuyenPhong',den:HOMNAY,
     ly:'Chuyển cả phòng '+cu+' → '+to+' — '+ly});
   h.phong=to; h.khu=np.khu; h.giuong=giuongTrong(to); h.tu=HOMNAY;
   h.ly='Chuyển cả phòng từ '+cu+' — '+ly;
  });
  const dsua=$('#ccpsua')&&$('#ccpsua').checked;
  /* đổi trạng thái = GHI HỘ M6.4 (PHKT · PK-5); ghi chú vận hành ở lại M6.10 */
  if(dsua&&!bo.length){ghiHoM64(p.dd,'tt','sua','Chuyển cả phòng — '+ly);p.ghi=ly}
  closeM();
  /* BẢNG KẾT QUẢ — quy ước dự án: thao tác hàng loạt không được chỉ có một dòng toast */
  modal('Kết quả chuyển cả phòng '+pid,
   '<div class="okbox">✅ <b>Đã chuyển '+ok.length+' em</b></div>'
   +'<div class="tbw"><table><tr><th>Học sinh</th><th>Từ</th><th>Đến</th><th>Giường</th></tr>'
   +ok.map(([h,to])=>'<tr><td>'+esc(h.ten)+'</td><td>'+pid+'</td><td><b>'+to+'</b></td>'
     +'<td class="num">'+h.giuong+'</td></tr>').join('')+'</table></div>'
   +(bo.length?'<div class="danger" style="margin-top:11px">⛔ <b>Bỏ qua '+bo.length+' em</b></div>'
     +'<div class="tbw"><table><tr><th>Học sinh</th><th>Lý do bỏ qua</th></tr>'
     +bo.map(([h,r])=>'<tr class="badrow"><td>'+esc(h.ten)+'</td><td>'+esc(r)+'</td></tr>').join('')
     +'</table></div>'
     +'<div class="ro" style="margin-top:10px">Các em bị bỏ qua <b>vẫn ở phòng cũ</b>. '
     +(dsua?'Phòng <b>'+pid+'</b> <b>KHÔNG</b> chuyển sang <i>'+TT_PHONG.sua+'</i> vì còn người ở.':'')+'</div>'
     :(dsua?'<div class="ro" style="margin-top:11px">🚧 Phòng <b>'+pid+'</b> đã chuyển sang '
       +'<b>'+TT_PHONG.sua+'</b> <span class="tg a">ghi hộ M6.4</span> — không bố trí chỗ được, nhưng <b>vẫn hiện ở tab 1</b> kèm lời giải thích.</div>':''))
   +'<div class="ro">Mỗi em sinh <b>hai bản ghi</b>: bản cũ đóng ở '+k2s(HOMNAY)+', bản mới mở từ '+k2s(HOMNAY)
   +'. Số ngày ở mỗi phòng là căn cứ khác nhau khi bàn giao sang <b>M7.2</b>.</div>',
   '<button class="btn p" data-mb="close">Đóng</button>');
  render();
 };

 modal('🔀 Chuyển cả phòng '+pid+' — '+ds.length+' em',
  '<div class="ro">Ký túc xá gần như không bao giờ có sẵn một phòng trống đủ chỗ, nên màn hình này nhận '
  +'<b>một phân bổ</b> — em nào về phòng nào — chứ không nhận một phòng đích. Gợi ý bên dưới lấp lần lượt '
  +'các phòng còn chỗ; sửa được từng dòng.</div>'
  +'<div class="tbw"><div class="f"><span>Phòng chuyển đi</span><b>'+pid+' · '+tenKhu(p.khu)+' · Tầng '+p.tang+'</b></div>'
  +'<div class="f"><span>Số em</span><b>'+ds.length+'</b></div>'
  +'<div class="f"><span>Chỗ trống '+gt+' còn lại</span><b>'+tongTrong+'</b></div></div>'
  +'<div class="tbw" style="margin-top:11px"><table><tr><th>Học sinh</th><th>Giường cũ</th><th>Phòng đích</th></tr>'
  +ds.map(h=>'<tr><td><b>'+esc(h.ten)+'</b><div class="srcline">'+esc(h.lop)+'</div></td>'
    +'<td class="num">'+h.giuong+'</td>'
    +'<td><select class="fldi" style="margin:0" data-ccprow="'+h.id+'">'+opt(h)+'</select></td></tr>').join('')
  +'</table></div>'
  +'<label class="lbl">Lý do chuyển <span style="color:var(--red)">*</span></label>'
  +'<textarea class="fldi" id="ccply" rows="2" placeholder="Ví dụ: thấm trần nặng sau mưa, phải sửa gấp, dự kiến xong 05/11"></textarea>'
  +'<div class="danger" id="ccperr" style="display:none;margin-top:9px">⛔ <b>Chưa có lý do.</b> '
  +'Đây là thao tác đổi chỗ ở của '+ds.length+' đứa trẻ trong một cú bấm — bản ghi phải nói được vì sao.</div>'
  +'<label class="tick"><input type="checkbox" id="ccpsua">'
  +'<span>Sau khi chuyển, đổi <b>'+pid+'</b> sang <b>'+TT_PHONG.sua+'</b> <span class="srcline">'
  +'(chỉ áp dụng nếu chuyển được hết — phòng còn người ở thì không đổi · ghi hộ trạng thái địa điểm ở M6.4)</span></span></label>',
  '<button class="btn" data-mb="close">Hủy</button>'
  +'<button class="btn p" data-mb="CCP">Chuyển '+ds.length+' em</button>');
}

/* xếp chỗ — HAI RÀNG BUỘC CHẶN CỨNG */
function hopXepCho(pid,giuong){
 const p=phongById(pid), k=khuById(p.khu), ds=hsCuaPhong(pid);
 const chua=HS.filter(x=>x.tt==='choDuyet');
 const ung=chua.length?chua:[{id:'--',ten:'(không có em nào chờ xếp chỗ)',gt:k.gt,lop:''}];
 function ve(){
  const sel=$('#xcHs'), id=sel?sel.value:ung[0].id;
  const em=HS.find(x=>x.id===id)||ung[0];
  const loiGT=em.gt&&em.gt!==k.gt;
  const loiSC=ds.length>=p.sc;
  const canhKhoi=!loiGT&&!loiSC&&p.khoi!=='—'&&em.lop&&!em.lop.startsWith(p.khoi);
  let w='';
  if(loiGT) w+='<div class="danger">⛔ <b>Chặn cứng — lệch giới tính.</b> Em <b>'+esc(em.ten)+'</b> là '
   +(em.gt==='nam'?'<b>nam</b>':'<b>nữ</b>')+', phòng <b>'+pid+'</b> thuộc <b>'+tenKhu(p.khu)+'</b>. '
   +'Không có tình huống hợp lệ nào để xếp — đây là <b>ràng buộc toàn vẹn</b>, không phải quy định trường có quyền quyết.</div>';
  if(loiSC) w+='<div class="danger">⛔ <b>Chặn cứng — vượt sức chứa.</b> Phòng '+pid+' đã <b>'+ds.length+'/'+p.sc
   +' giường</b>. Phần mềm không kê được giường thứ '+(p.sc+1)+'.<br>'
   +'Đầu năm quá tải thì cách xử lý đúng là <b>sửa sức chứa của phòng</b> — một hành động cố ý, có lý do, có audit. '
   +'<button class="btn xs" data-sc="'+pid+'">↗ Sửa sức chứa phòng '+pid+'</button></div>';
  if(canhKhoi) w+='<div class="warn">⚠ <b>Cảnh báo mềm — khác khối.</b> Phòng ưu tiên khối <b>'+p.khoi
   +'</b>, em học <b>'+esc(em.lop)+'</b>. Vẫn xếp được — đây là gợi ý sắp xếp, không phải ràng buộc.</div>';
  $('#xcW').innerHTML=w;
  const btn=$('#xcOk'); if(btn) btn.disabled=loiGT||loiSC||id==='--';
 }
 mfns.bXC=()=>{
  const id=$('#xcHs').value, em=HS.find(x=>x.id===id);
  em.tt='dangO';em.phong=pid;em.khu=p.khu;em.giuong=giuong;em.tu=HOMNAY;
  p.o=hsCuaPhong(pid).length;
  closeM();toast('🛏 Đã xếp <b>'+esc(em.ten)+'</b> vào <b>'+pid+' · giường '+giuong+'</b>.');render();
 };
 modal('🛏 Xếp chỗ — '+pid+' · giường '+giuong,
  '<div class="tbw"><div class="f"><span>Phòng</span><b>'+pid+' · '+tenKhu(p.khu)+' · Tầng '+p.tang+'</b></div>'
  +'<div class="f"><span>Sức chứa</span><b>'+ds.length+'/'+p.sc+' giường</b></div>'
  +'<div class="f"><span>Khối ưu tiên</span><b>'+p.khoi+'</b></div></div>'
  +'<label class="lbl">Học sinh</label><select class="fldi" id="xcHs">'
  +ung.map(x=>'<option value="'+x.id+'">'+esc(x.ten)+(x.lop?' — '+esc(x.lop)+' · '+(x.gt==='nam'?'nam':'nữ'):'')+'</option>').join('')+'</select>'
  +'<div id="xcW" style="margin-top:11px"></div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" id="xcOk" data-mb="XC">Xếp chỗ</button>');
 $('#xcHs').addEventListener('change',ve); ve();
}

/* sửa sức chứa — Ô GHI HỘ M6.4 (PHKT · PK-3 · PK-5): bắt buộc lý do (rb 13 đi theo ô sang M6.4),
   ⛔ nhỏ hơn số em đang ở; bản ghi vẫn của M6.4, audit ghi cả hai phía */
function hopSucChua(pid){
 const p=phongById(pid);
 mfns.bSC=()=>{
  const ly=$('#scly').value.trim();
  if(!ly){$('#scerr').style.display='block';return}
  const v=Math.max(1,Math.min(12,+$('#scv').value||p.sc)), dang=hsCuaPhong(pid).length;
  if(v<dang){$('#scerr2').innerHTML='⛔ <b>Sức chứa '+v+' giường nhỏ hơn số em đang ở ('+dang+' em).</b> '
   +'Ràng buộc của M6.4 cho phòng nội trú — chuyển bớt em sang phòng khác trước (🔀 ở Sơ đồ chỗ ở), rồi mới giảm giường.';
   $('#scerr2').style.display='block';return}
  const cu=p.sc; ghiHoM64(p.dd,'succhua',v,ly); closeM();
  toast('⚙ Sức chứa <b>'+pid+'</b>: '+cu+' → <b>'+v+'</b> giường — <b>ghi hộ M6.4</b>. Nhật ký ghi ở cả M6.4 '
   +'(«ghi hộ từ M6.10») và M6.10, kèm lý do và tên người sửa.');render();
 };
 modal('⚙ Sửa sức chứa — phòng '+pid+' <span class="tg a">ghi hộ M6.4</span>',
  '<div class="ro">Sức chứa là <b>căn cứ của ràng buộc chặn cứng khi xếp chỗ</b>. Sửa được, nhưng phải là hành động '

function render(){
 rolebar(); header(); sidebar(); tabs();
 $('#crumb').innerHTML='';
 const c=$('#content');
 if(ST.tab==='diemdanh')      c.innerHTML=veDiemDanh();
 else if(ST.tab==='ranoai')   c.innerHTML=veRaNgoai();
 else if(ST.tab==='sukien')   c.innerHTML=veSuKien();
 else if(ST.tab==='dangky')   c.innerHTML=veDangKy();
 else if(ST.tab==='phong')    c.innerHTML=vePhong();
 else if(ST.tab==='an')       c.innerHTML=veTheoDoiAn();
 else if(ST.tab==='duyet')    c.innerHTML=veDuyet();
 else                         c.innerHTML=veCauHinh();
 const nn=document.body.classList.contains('nn');
 $('#btnNote').classList.toggle('on',!nn);
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(nn?'TẮT':'BẬT');
}
const SUBMAC={diemdanh:'chamtoinay',ranoai:'don',dangky:'ql',phong:'dm',an:'bang'};
function doiTab(t){
 ST.tab=t; ST.sub=SUBMAC[t]||'';
 ST.curPhong=null;ST.curDon=null;ST.curHS=null;ST.curViec=null;ST.curDot=null;ST.curYC=null;ST.buoc=1;ST.q='';
}

/* ---------- click ---------- */
mfns.bclose=()=>closeM();
document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 if(t===$('#mask')){closeM();return}

 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r;doiTab(ST.tab);if(R().sc!=='School')ST.dt=R().dt;render();return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn');render();return}
 if(t.id==='btnSim'){THIETBI_MP=!THIETBI_MP;
  toast(THIETBI_MP?'🔌 Mô phỏng thiết bị <b>BẬT</b>.'
   :'🔌 Mô phỏng thiết bị <b>TẮT</b> — cột <i>Gợi ý của máy</i> thành <b>Không có dữ liệu</b> cho mọi em. '
    +'Màn hình <b>vẫn dùng được</b>: chấm tay đủ 5 trạng thái.');render();return}

 const tb=t.closest('[data-t]'); if(tb){doiTab(tb.dataset.t);render();return}
 const gd=t.closest('[data-godot]'); if(gd){doiTab('cauhinh');render();
  toast('⚙ Đợt đăng ký ở nội trú nằm ở <b>tab 7 · khối 3</b>.');return}
 const sb=t.closest('[data-sub]'); if(sb){ST.sub=sb.dataset.sub;ST.curPhong=null;ST.curDon=null;ST.curHS=null;ST.curDot=null;ST.curYC=null;ST.buoc=1;render();return}
 const gt=t.closest('[data-goto]'); if(gt){const[a,b]=gt.dataset.goto.split('|');doiTab(a);ST.sub=b||ST.sub;render();return}
 if(t.closest('[data-close]')){ST.curPhong=null;ST.curDon=null;ST.curHS=null;ST.curViec=null;ST.curYC=null;render();return}

 const lnk=t.closest('[data-lnk]'); if(lnk){
  toast('🔗 Deep-link sang <b>'+esc(lnk.dataset.lnk)+'</b> — mở sẵn đúng ngữ cảnh, quay lại được M6.10. '
   +'<code>D3</code>: M6.10 không dựng luồng thứ hai cho việc của menu khác.');return}
 const xu=t.closest('[data-xuat]'); if(xu){hopXuat(xu.dataset.xuat);return}

 /* ---- tab 1 ---- */
 const dn=t.closest('[data-day]'); if(dn){
  const v=+dn.dataset.day; const d=k2d(ST.ngay);
  if(v===0) ST.ngay=HOMNAY; else {d.setDate(d.getDate()+v);ST.ngay=d2k(d)}
  ST.curPhong=null;render();return}
 const pc=t.closest('[data-p]'); if(pc){
  const p=phongById(pc.dataset.p);
  if(p.tt!=='dung'){toast('🚧 Phòng <b>'+p.id+'</b> — '+TT_PHONG[p.tt]+'. '+esc(p.ghi||'')
    +' Phòng vẫn hiện ở danh sách vì <b>danh sách dựng từ phạm vi</b>, không dựng từ dữ liệu.');return}
  if(!hsCuaPhong(p.id).length){toast('🛏 Phòng <b>'+p.id+'</b> chưa xếp học sinh nào — còn '+p.sc
    +' chỗ trống. Xếp chỗ ở <b>tab 5 · Sơ đồ chỗ ở</b>.');return}
  ST.curPhong=ST.curPhong===p.id?null:p.id;render();return}
 if(t.id==='btnNhanh'){hopNhanh(ST.curPhong,ST.ngay);return}
 const ev=t.closest('[data-ev]'); if(ev){hopSuKienCua(ev.dataset.ev,ST.ngay);return}
 const wy=t.closest('[data-why]'); if(wy){hopLyDoNghi(wy.dataset.why);return}
 if(t.closest('[data-flag]')){toast('🚩 Đã gắn cờ <b>nghi sai</b> cho lượt này, kèm tên bạn. '
   +'Sự kiện cửa <b>không sửa được</b> — chỉ gắn cờ, vì đó là dữ liệu thô của thiết bị.');return}
 const st=t.closest('[data-set]'); if(st){
  const [hid,tt]=st.dataset.set.split('|'), k=ST.ngay, key=hid+'|'+k;
  const cu=DD[key];
  if(cu&&cu.tt===tt){delete DD[key];render();return}
  DD[key]={tt,nguon:'qs',boi:trucCua(k),luc:simGio};
  const s=suyRa(hid,k,nowMin());
  if(tt==='cm'&&s.nghi) toast('✍ Đã chấm <b>Có mặt</b> cho '+esc(hsById(hid).ten)+' dù máy đang nghi. '
   +'Đây là <b>quyết định hợp lệ</b> — em có thể quên quẹt thẻ — nhưng badge ⚠ của phòng <b>vẫn còn</b> để người ngoài nhìn thấy được.');
  render();return}
 if(t.id==='btnDN'){hopDeNghi();return}
 const dnb=t.closest('[data-dn]'); if(dnb){
  const [a,id]=dnb.dataset.dn.split('|'), x=DENGHI.find(y=>y.id===id);
  if(a==='ok'){x.tt='duyet';x.nguoiDuyet=R().n;x.duyetLuc=k2s(HOMNAY).slice(0,5)+' '+simGio;
   DD[x.hs+'|'+x.ngay]={tt:x.moi,nguon:'qs',boi:x.boi,luc:'sửa sau chốt · '+R().n};
   toast('✅ Đã duyệt <b>'+id+'</b> — hệ thống sửa bản ghi và <b>ghi audit kèm giá trị cũ ('+TT_DD[x.cu].n+') và tên người duyệt</b>.');
  } else {x.tt='tuchoi';toast('↩ Đã từ chối <b>'+id+'</b> — giữ nguyên bản ghi, báo lại người gửi.')}
  ST.curViec=null;render();return}

 /* ---- tab 2 ---- */
 const dd=t.closest('[data-don]'); if(dd){ST.curDon=ST.curDon===dd.dataset.don?null:dd.dataset.don;render();return}

  } else {d.tt='tuchoi';toast('↩ Đã từ chối <b>'+id+'</b>. GVCN và gia đình nhận thông báo.')}

   +'<label class="lbl">Rời KTX</label><input class="fldi" value="'+simGio+'">'
   +'<label class="lbl">Giờ hẹn về <span style="color:var(--red)">*</span></label><input class="fldi" value="21:00">'

 const cp=t.closest('[data-cp]'); if(cp){hopChuyenPhong(cp.dataset.cp);return}

     +'không trả lời được câu <i>"gia đình đang đăng ký vào đợt nào"</i>.');return}
   d.tt='dangMo';
   if(soNgayConLai(d.den)<0){toast('⚠ Đã mở <b>'+esc(d.ten)+'</b>, nhưng <b>ngày kết thúc '+k2s(d.den)

     +'Đã ghi audit.');render();return}

   +'<b>không nhận được</b> một em nam nào.</div>',
   '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="close">Tạo đợt (chưa mở)</button>');return}

   +'<div class="tbw"><div class="f"><span>Họ và tên</span><b>'+esc(x.ten)+'</b></div>'
   +'<div class="f"><span>Mã học sinh</span><b>'+x.ma+'</b></div>'
   +'<div class="f"><span>Lớp</span><b>'+esc(x.lop)+'</b></div>'

   +'<div class="f"><span>Chỗ ở hợp pháp</span><b>Ký túc xá — '+tenKhu(x.khu)+' · phòng '+x.phong+' · giường '+x.giuong+'</b></div>'

   +'<div class="f"><span>Tổ chức quản lý chỗ ở</span><b>Trường THCS &amp; THPT Nguyễn Tất Thành</b></div></div>'
   +'<div class="ro" style="margin-top:10px">Mẫu theo <b>TT 55/2021/TT-BCA</b>. Lượt xem này <b>đã ghi audit</b> — '
   +'Luật BVDLCN 91/2025.</div>',
   '<button class="btn" data-mb="close">Đóng</button>'

 const sc=t.closest('[data-sc]'); if(sc){hopSucChua(sc.dataset.sc);return}

 const bd=t.closest('[data-bed]'); if(bd){const[p,g]=bd.dataset.bed.split('|');hopXepCho(p,+g);return}

 if(t.closest('[data-m64]')){modal('↗ Mở M6.4 — Thêm địa điểm «Phòng ở nội trú»',

   +'Demo không mở được menu khác; hệ thống thật đi tới:</div>'
   +'<div class="tbw"><div class="f"><span>Đường dẫn</span><b><code>/M6.4?action=tao&amp;loai=noitru&amp;return=M6.10</code></b></div>'
   +'<div class="f"><span>M6.4 bắt</span><b>mã duy nhất toàn trường (tiền tố khu: <code>KA-303</code>) · dãy nhà (= khu) · tầng · '
   +'sức chứa (giường) · cấp công trình</b></div></div>'
   +'<div class="ro" style="margin-top:9px">Giới tính phòng <b>lấy theo khu</b> (phần vận hành ở ⚙ khối 1), không khai riêng — '
   +'nếu không thì sẽ có phòng nữ nằm trong khu nam và ràng buộc chặn cứng mất chỗ dựa. Khối ưu tiên khai ở M6.10 sau khi phòng xuất hiện.</div>',
   '<button class="btn p" data-mb="close">Đóng</button>');return}

 /* ---- tab 7 · Cấu hình (tab 6 cho tới v1.2) ---- */
 const cn=t.closest('[data-cn]'); if(cn){
  CFG.congNghe=cn.dataset.cn;
  if(CFG.congNghe==='the'){CFG.theThayThe=false;toast('🪪 Công nghệ: <b>Thẻ từ / QR</b> — không chạm dữ liệu sinh trắc học của trẻ em.')}
  render();return}
 if(t.id==='btnLuuCN'){
  toast('💾 Đã lưu. Phương án <b>thẻ / QR thay thế</b> đã khai — gia đình không đồng ý quét mặt vẫn có đường vào KTX. '
   +'Đã ghi audit lượt đổi cấu hình.');return}
 const qs=t.closest('[data-qs]'); if(qs){
  const k=khuById(qs.dataset.qs);
  modal('⚙ Đổi quản sinh phụ trách — '+esc(k.ten),
   '<div class="ro">Đổi phân công giữa năm <b>không hồi tố</b>: bản ghi các đêm trước vẫn ghi tên người cũ. '
   +'Sau khi đổi thì <b>chỉ người mới thấy phòng của khu này</b> ở tab 1.</div>'
   +'<label class="lbl">Quản sinh phụ trách</label><select class="fldi"><option>'+esc(k.qs)+'</option>'
   +'<option>Đỗ Văn Sơn</option><option>Mai Thị Hạnh</option></select>',
   '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="close">Lưu</button>');return}

 /* ---- tab duyệt ---- */
 const vc=t.closest('[data-viec]'); if(vc){ST.curViec=ST.curViec===vc.dataset.viec?null:vc.dataset.viec;render();return}
});

/* ---------- change / input ---------- */
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='simg'){simGio=t.value;render();return}
 if(t.id==='hdt'){ST.dt=t.value;ST.curPhong=null;ST.curHS=null;render();return}
 if(t.id==='ckThe'){CFG.theThayThe=t.checked;render();return}
});
document.addEventListener('input',e=>{
 if(e.target.id==='qdk'){ST.q=e.target.value;const p=e.target.selectionStart;render();
  const n=$('#qdk'); if(n){n.focus();n.setSelectionRange(p,p)}}
});

render();
</script>
