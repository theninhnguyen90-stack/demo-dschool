<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4.5 Phân công giảng dạy — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.alert{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}

.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
tr.badrow{background:var(--red-soft)}
tr.grp td{background:#f8fafc;font-weight:700;font-size:11.5px}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.empty{padding:34px;text-align:center;color:var(--ink3)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:760px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}

/* ---------- BÀN PHÂN CÔNG ---------- */
.board{display:flex;gap:13px;align-items:flex-start}
.bside{width:224px;flex:0 0 224px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bside .th{padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.tonm{font-size:10.5px;font-weight:700;color:var(--ink3);padding:10px 12px 4px}
.monb{display:flex;align-items:center;gap:7px;padding:6px 12px;font-size:12.5px;color:var(--ink2);width:100%;text-align:left}
.monb:hover{background:var(--bg)}
.monb.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.monb .n{margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;background:var(--red);color:#fff;min-width:18px;text-align:center}
.monb .n.ok{background:var(--green-soft);color:var(--green)}
.bmain{flex:1;min-width:0}

.pool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:12px}
.pool.empty2{border-style:dashed}
.poolh{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;margin-bottom:9px;flex-wrap:wrap}
.lchips{display:flex;gap:7px;flex-wrap:wrap;min-height:34px}
.lchip{border:1px solid var(--line2);border-radius:9px;padding:5px 10px;font-size:12.5px;background:#fff;cursor:grab;display:flex;align-items:center;gap:6px;line-height:1.25}
.lchip:hover{border-color:var(--brand);background:var(--brand-soft)}
.lchip.sel{border-color:var(--brand);background:var(--brand);color:#fff}
.lchip.sel .mm{color:#c7d2fe}
.lchip.drag{opacity:.45}
.lchip .mm{font-size:10.5px;color:var(--ink3)}

.gvrow{display:grid;grid-template-columns:1.55fr 1fr 2.6fr 1fr;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center}
.gvrow:last-child{border-bottom:none}
.gvrow.over{background:var(--brand-soft);outline:2px dashed var(--brand);outline-offset:-3px}
.gvrow.muot{background:#fafbfc}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.kb.ro{opacity:.55}
.khrow.focus{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.backbar{display:flex;align-items:center;gap:9px;background:var(--brand-soft);border:1px solid #bfdbfe;
 color:#1e40af;border-radius:10px;padding:8px 13px;font-size:12.5px;margin-bottom:11px}
.backbar .sp{flex:1}
.kb.clickable{cursor:pointer}
.kb.clickable:hover{border-color:var(--brand);color:var(--brand)}
.kb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tqstat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tqcell{flex:1;min-width:132px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.tqcell .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.tqcell .k{font-size:11.5px;color:var(--ink3);margin-top:2px}
.tqcell.bad{border-color:#fecaca;background:var(--red-soft)}
.tqcell.bad .v{color:var(--red)}
.tqcell.ok .v{color:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff}
.dtb{font-size:9px;font-weight:800;border-radius:4px;padding:0 4px;margin-left:3px;letter-spacing:.02em}
.d0 .dtb{background:#e0e7ff;color:#3730a3}
.d1 .dtb{background:#fef3c7;color:#92400e}
.d2 .dtb{background:#dcfce7;color:#166534}
.d0{border-left:3px solid #6366f1!important}
.d1{border-left:3px solid #d97706!important}
.d2{border-left:3px solid #059669!important}
.lchip .dtb{margin-left:4px}
.ac .dtb{margin-left:3px}
.flab{font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:-3px}
.lchip2{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;
 padding:2px 7px;font-size:11.5px;background:#f8fafc;margin:2px 3px 2px 0}
.lchip2.xa{border-style:dashed;color:var(--ink3)}
.lchip2.thieu{background:var(--red-soft);border-color:#fecaca;color:#991b1b;font-weight:700}
.monnm{font-weight:700;font-size:13px}
.khrow{display:grid;grid-template-columns:1.7fr 2.6fr;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);align-items:center}
.khrow:last-child{border-bottom:none}
.kb{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);margin-right:3px}
.drop{display:flex;gap:6px;flex-wrap:wrap;min-height:32px;align-items:center;border:1px dashed transparent;border-radius:8px;padding:3px}
.drop.hint{border-color:var(--line2)}
.ac{border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:12px;background:#f8fafc;display:inline-flex;align-items:center;gap:5px}
.ac.warn2{background:var(--amber-soft);border-color:#fde68a;color:#92400e}
.ac.bad2{background:var(--red-soft);border-color:#fecaca;color:#991b1b}
.ac .x{color:var(--red);font-size:11px;cursor:pointer;font-weight:700}
.dm{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.dm.up{color:var(--amber)}.dm.up2{color:var(--red)}.dm.dn{color:var(--brand)}.dm.ok{color:var(--green)}
.mini{font-size:10.5px;color:var(--ink3);font-weight:400}

.cnb{display:flex;gap:13px;align-items:flex-start;flex-wrap:wrap}
.cnb>div{flex:1;min-width:320px}
.cnrow{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.cnrow:last-child{border-bottom:none}
.cnrow:hover{background:var(--brand-soft)}
.cnrow.sel{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.cnrow.trong{background:#fffafa}
.cnrow .sp{flex:1;min-width:0}
.dkbox{border:1px dashed var(--line2);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--ink2);background:#fafbfc;margin:11px 13px}

.dk{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:11px}
.dkh{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;font-size:12.5px;font-weight:700;cursor:pointer}
.dkr{display:flex;align-items:center;gap:9px;padding:6px 13px;font-size:12px;border-top:1px solid var(--line)}
.dkr .sp{flex:1}
.dkr.no{background:var(--red-soft);color:#991b1b}
.ac.other{background:#fff;border-style:dashed;color:var(--ink3)}
.ac.other b{color:var(--ink2)}
.nodata{color:var(--red);font-weight:700}
.wnote{font-size:11.5px;color:var(--ink2);background:#f8fafc;border:1px solid var(--line);
 border-radius:8px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;margin-top:8px}
.wnote.bad{background:var(--red-soft);border-color:#fecaca;color:#991b1b}
.wnote.warn{background:var(--amber-soft);border-color:#fde68a;color:#92400e}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="TTCM">TTCM Toán — Tin</button>
  <button class="rb" data-r="PCM">PHT Chuyên môn</button>
  <button class="rb" data-r="PDT">PHT Điểm trường B</button>
  <button class="rb" data-r="HT">Hiệu trưởng</button>
  <button class="rb" data-r="GV">Giáo viên</button>
  <span class="note">Bối cảnh: <b>27/11/2026</b> — tuần 12 HK I. Định mức và môn được phép dạy đọc từ <b>M4.4</b></span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"><option>Toàn trường</option><option>Điểm trường A</option><option>Điểm trường B</option></select>
  <span class="lockico" id="dtlock"></span>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot" id="ndot">6</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">DQ</div>
</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Phân công giảng dạy</h1><div class="spacer"></div><span id="topact"></span></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>

const lopChuaCH=dt=>LOP.filter(l=>l.dt===dt&&!coCauHinh(l));
const monKhuyet=()=>MONS.filter(m=>!dayDuoc(m).length);
function phanLoaiThieu(){
 const kh=monKhuyet(), nangLuc={}, phanCong={};
 LOP.forEach(l=>{thieuMon(l.id).forEach(m=>{
   if(kh.includes(m)) (nangLuc[m]=nangLuc[m]||[]).push(l.id);
   else (phanCong[l.id]=phanCong[l.id]||[]).push(m)})});
 return {nangLuc,phanCong};
}
/* cảnh báo trên một phân công */
function canhPC(p){
 const g=ns(p.gv),l=lop(p.lop),c=[];
 if(!g.mon[p.mon]) c.push(['mon',`${g.n} không còn được phép dạy ${p.mon} — đã gỡ ở M4.4`]);
 else if(!(g.khoi[p.mon]||[]).includes(l.k)) c.push(['khoi',`Lớp khối ${l.k} nằm ngoài khối phụ trách của ${g.n}`]);
 return c;
}

/* ================= PHẠM VI ================= */
let tab='pc',khFocus=null,tqGoc='gv',tqDT='Toàn trường',curMon='Toán',curDT='Điểm trường A',selLop=null,cnLop=null,fDC='',fCD='';
function dtHien(){const r=R();return r.pv==='branch'?r.dt:curDT}
function monTrongPV(m){const r=R();return r.pv==='to'?MON[m].to===r.to:true}
function lopPV(l){const r=R();
 if(r.pv==='branch')return l.dt===r.dt;
 if(r.pv==='own')return PC.some(p=>p.gv===r.gvid&&p.lop===l.id&&song(p));
 return true}
function gvPV(g){const r=R();
 if(r.pv==='own')return g===r.gvid;
 if(r.pv==='to')return monCua(ns(g)).some(m=>MON[m].to===r.to);
 return true}

function dlink(menu,label,ctx){
 if(!R().mchu.includes(menu))
  return `<span class="rolnk off" title="Vai trò hiện tại không có quyền tại ${menu}">🔗 ${menu}</span>`;
 return `<button class="rolnk" data-x="dl" data-m="${menu}" data-c="${ctx||''}">↗ ${label}</button>`;
}
function sidebar(){
 const a=R().menu,full=a==='all';
 const t=phanLoaiThieu();
 const n=Object.keys(t.phanCong).length+Object.values(CN).filter(v=>!v).length;
 $('#side').innerHTML=NAV.map(([id,nm,items])=>{const on=full||id===''||a.includes(id);
  return `<div class="sgrp">${nm}</div>`+items.map(it=>{const cu=it[0]==='M4.5';
   return `<div class="snav ${cu?'on':''} ${on?'':'off'}">
    <span style="font-size:10.5px;opacity:.55;min-width:32px">${it[0]}</span>
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it[1]}</span>
    ${cu&&n?`<span class="nb">${n}</span>`:''}</div>`}).join('')}).join('');
}
function tabList(){
 const r=R(),t=[];
 const tl=phanLoaiThieu();
 t.push(['pc','Phân công giảng dạy',PC.filter(song).length,Object.keys(tl.phanCong).length?1:0]);
 if(r.pv!=='own'&&r.pv!=='to'){
  const ls=LOP.filter(lopPV);
  t.push(['cn','Phân công chủ nhiệm',ls.filter(l=>CN[l.id]).length+'/'+ls.length,ls.some(l=>!CN[l.id])?1:0]);
 }
 if(r.pv!=='own') t.push(['kh','Khối lớp phụ trách',NS.filter(p=>!p.bgh&&gvPV(p.id)&&monCua(p).length).length,
   NS.filter(p=>!p.bgh&&gvPV(p.id)&&monCua(p).some(m=>!(p.khoi[m]||[]).length)).length?1:0]);
 t.push(['tq','Tổng quan phân công','',0]);
 t.push(['cd','Cân đối định mức','',0]);
 if(r.pv!=='own') t.push(['dc','Nhật ký điều chỉnh',LOG.length,0]);
 return t;
}
function tabs(){
 const L=tabList();
 if(!L.some(x=>x[0]===tab)) tab=L[0][0];
 $('#tabs').innerHTML=L.map(([k,n,b,red])=>
  `<button class="tab1 ${tab===k?'on':''}" data-tab="${k}">${n}${b!==''?`<span class="b ${red?'r':''}">${b}</span>`:''}</button>`).join('');
}
function scopeBar(){
 const r=R();let s;
 if(r.pv==='own')      s=`Bạn thấy <b>phân công của chính mình</b> — bộ lọc <b>authored</b>. Giáo viên bộ môn không có quyền ghi ở menu này.`;
 else if(r.pv==='to')  s=`Phạm vi <b>Group — ${TO[r.to]}</b>. Sidebar chỉ hiện <b>môn của tổ mình</b>.`;
 else if(r.pv==='branch')s=`Phạm vi <b>Branch — ${r.dt}</b>. Bộ chọn Điểm trường đã <b>khoá</b>. Cột định mức vẫn hiện <b>tổng tiết toàn trường</b> — không hiện thì bạn phân công mù cho người đã đủ giờ ở nơi khác.`;
 else                  s=`Phạm vi <b>School</b> — mọi điểm trường, mọi tổ.`;
 const x=tab==='tq'?` · Tab này có bộ chọn <b>Toàn trường</b> riêng — tổng quan cần nhìn được cả hai điểm trường.`:tab==='cd'?` · Tab này <b>không chịu bộ chọn Điểm trường</b> — định mức phải cộng dồn cross-branch.`:'';
 return `<div class="scope">🔎 <span class="sp">${s}${x}</span>
   <span class="chip">Năm học 2026-2027</span><span class="chip">Tuần ${TUAN} · HK I</span>
   <span class="chip">Định mức &amp; môn: chỉ đọc từ M4.4</span></div>`;
}

/* ================= T1 — BÀN PHÂN CÔNG ================= */
const lopChuaPC=(m,dt)=>LOP.filter(l=>l.dt===dt&&coCauHinh(l)&&monCuaLop(l).includes(m)&&!nguoiDay(l.id,m)).map(l=>l.id);
const gvMon=(m,dt,tai)=>NS.filter(p=>p.mon[m]&&(tai?p.dtCT===dt:p.dtCT!==dt));

function pcTab(){
 const dt=dtHien();
 const monList=MONS.filter(monTrongPV);
 if(!monList.includes(curMon)) curMon=monList[0];
 const byTo={};monList.forEach(m=>{(byTo[MON[m].to]=byTo[MON[m].to]||[]).push(m)});
 const side=`<div class="bside"><div class="th">Tổ chuyên môn → Môn</div>
  ${Object.keys(TO).filter(t=>byTo[t]).map(t=>`<div class="tonm">${TO[t]}</div>`
    +byTo[t].map(m=>{const n=lopChuaPC(m,dt).length;
      return `<button class="monb ${curMon===m?'on':''}" data-mon="${m}">${m}
        <span class="n ${n?'':'ok'}">${n||'✓'}</span></button>`}).join('')).join('')}
  <div class="lgd" style="border-top:1px solid var(--line)"><span class="mini">Số đỏ = lớp chưa phân công tại ${dt}</span></div></div>`;

 const chua=lopChuaPC(curMon,dt);
 const tai=gvMon(curMon,dt,1).filter(p=>gvPV(p.id)), khac=gvMon(curMon,dt,0).filter(p=>gvPV(p.id));
 const rw=co('pc');
 const chuaCH=lopChuaCH(dt), chuaM=chuaMonGV(dt);

 /* thẻ lớp đã gán — luôn hiện số tiết; lớp của điểm trường KHÁC thì không gỡ được ở đây */
 const acChip=p=>{
  const l=lop(p.lop),c=canhPC(p),ngoai=l.dt!==dt;
  const cl=ngoai?'other':c.some(x=>x[0]==='mon')?'bad2':c.length?'warn2':'';
  const st=coKHGD(l,p.mon)?`(${tietCua(l,p.mon)})`:`<span class="nodata">(--)</span>`;
  const ti=ngoai?`Lớp thuộc ${l.dt} — đang phân công cho ${dt} nên không gỡ được ở đây`
    :(c.map(x=>x[1]).join(' · ')||`${lopTen(l)} · ${p.mon}`);
  return `<span class="ac ${cl} d${dtIdx(l.dt)}" title="${ti}"><b>${coKHGD(l,p.mon)?ten(l):`<span class="nodata">${ten(l)}</span>`}</b>${dtBadge(l)} ${st}
    ${ngoai?'<span class="mini">🔒</span>':''}${c.length&&!ngoai?(c[0][0]==='mon'?'⛔':'⚠'):''}
    ${rw&&!ngoai?`<span class="x" data-x="go-pc" data-pc="${p.id}">✕</span>`:''}</span>`};

 const gvRow=(p,mo)=>{const c=canDoi(p.id),rs=PC.filter(x=>x.gv===p.id&&x.mon===curMon&&song(x));
  const kh=(p.khoi[curMon]||[]);
  return `<div class="gvrow ${mo?'':'muot'}" data-gvdrop="${p.id}">
   <div class="who2"><div class="ava2">${p.i}</div><div class="i"><b>${p.n}</b>
     <span>${p.cv||'Giáo viên bộ môn'}${mo?'':' · '+p.dtCT}</span></div></div>
   <div title="Khối lớp phụ trách — chỉ đọc, cấu hình tại tab Khối lớp phụ trách">
     ${khoiCuaMon(curMon).map(k=>`<span class="kb ${kh.includes(k)?'on':'ro'}">${k}</span>`).join('')}
     ${R().pv!=='own'?`<button class="rolnk" data-x="kh-goto" data-gv="${p.id}" data-mon="${curMon}"
        title="Mở tab Khối lớp phụ trách tại đúng dòng này">↗ sửa</button>`:''}
     ${kh.length?'':'<div class="mini nodata">chưa cấu hình khối</div>'}</div>
   <div class="drop ${rw&&mo?'hint':''}">${rs.length?rs.map(acChip).join(''):'<span class="mini">chưa nhận lớp nào</span>'}</div>
   <div><span class="dm ${c.nguong==null?'':c.pct>CFG.tran?'up2':c.lech>0?'up':c.lech<0?'dn':'ok'}">${c.day}/${c.nguong??'<span class="nodata">--</span>'}</span>
     <div class="mini">${c.nguong==null?'chưa có định mức':(c.lech>0?'+'+c.lech:c.lech)+' tiết'}</div>
     ${rw?(mo?`<button class="btn xs p" data-x="nhan" data-gv="${p.id}" ${selLop?'':'disabled'}>＋ Nhận</button>`
              :`<button class="btn xs" data-x="nhan" data-gv="${p.id}" ${selLop?'':'disabled'}>＋ Mượn</button>`):''}</div></div>`};

 const pool=`<div class="pool ${chua.length?'':'empty2'}">
   <div class="poolh">${chua.length?`⛔ <b>${chua.length} lớp chưa phân công</b>`:'✓ <b>Đã đủ giáo viên cho môn này</b>'}
     — ${curMon} · ${dt}
     <span class="spacer" style="flex:1"></span>
     ${selLop?`<span class="chip">Đang chọn <b>${lopTen(lop(selLop))}</b> — bấm ＋ ở dòng giáo viên</span>`:''}
     ${rw&&chua.length?`<button class="btn sm p" data-x="tudong">⚡ Tự động phân công</button>`:''}</div>
   <div class="lchips">${chua.length?chua.map(l=>{const L=lop(l),ok=coKHGD(L,curMon);
      return `<div class="lchip d${dtIdx(L.dt)} ${selLop===l?'sel':''}" draggable="${rw}" data-lchip="${l}">
        <b${ok?'':' class="nodata"'}>${ten(L)}</b>${dtBadge(L)}<span class="mm ${ok?'':'nodata'}">${tietHien(L,curMon)} tiết</span></div>`}).join('')
     :`<span class="mini">Không còn lớp nào của ${dt} thiếu môn ${curMon}</span>`}</div>
   ${chuaCH.length?`<div class="wnote">ℹ <b>${chuaCH.length} lớp chưa có cấu hình môn học ở M10.2</b>
     — ${chuaCH.map(lopTen).join(', ')} · chưa vào được bàn phân công ${dlink('M10.2','M10.2')}</div>`:''}
   ${chua.some(l=>!coKHGD(lop(l),curMon))?`<div class="wnote warn">⚠ Lớp hiện <b class="nodata">-- tiết</b>
     là <b>chưa phân kế hoạch giảng dạy</b> cho môn ${curMon} — vẫn phân công được, nhưng không tính vào định mức ${dlink('M10.2','M10.2')}</div>`:''}</div>`;

 const bang=`<div class="listw" style="margin-bottom:12px">
   <div class="ch">Giáo viên dạy ${curMon} — <b>tại ${dt}</b> <span class="sp"></span>
     <span class="mini">nguồn: Môn được phép dạy M4.4 + Điểm trường công tác M4.3</span></div>
   ${tai.length?tai.map(p=>gvRow(p,1)).join('')
     :`<div class="empty">Không có giáo viên nào ở ${dt} dạy được môn <b>${curMon}</b>.</div>`}
   ${chuaM.length?`<div class="lgd"><span class="wnote bad" style="margin:0">ℹ <b>Có ${chuaM.length} giáo viên bộ môn tại ${dt} chưa được phân môn học</b>
     — ${chuaM.map(p=>p.n).join(', ')} ${dlink('M4.4','M4.4')}</span></div>`:''}</div>
  <div class="listw">
   <div class="ch" style="background:#fafbfc">Giáo viên dạy ${curMon} — <b>ở điểm trường khác</b>
     <span class="sp"></span><span class="mini">mượn được · lớp của họ ở nơi khác bị khoá 🔒</span></div>
   ${khac.length?khac.map(p=>gvRow(p,0)).join('')
     :`<div class="empty" style="padding:20px">Không có ai ở điểm trường khác dạy được môn này</div>`}
   <div class="lgd"><span class="chip">Không có khối này thì người phân công tưởng trường thiếu giáo viên, trong khi nơi khác đang dư giờ</span></div></div>`;

 return `<div class="bar">
   <select class="fs" id="fdt" ${R().pv==='branch'?'disabled':''}>
     <option ${curDT==='Điểm trường A'?'selected':''}>Điểm trường A</option>
     <option ${curDT==='Điểm trường B'?'selected':''}>Điểm trường B</option></select>
   <span class="chip">Bước 1: chọn điểm trường và môn</span>
   <span class="chip">Bước 2: kéo thẻ lớp sang giáo viên, hoặc chọn thẻ rồi bấm ＋</span>
   ${DOT.congbo?`<span class="chip">Đã công bố ${DOT.ngay} — mọi thay đổi từ nay đều vào nhật ký</span>`:''}
   <div class="sum"><span><b>${PC.filter(song).length}</b> phân công</span></div></div>
  <div class="board">${side}<div class="bmain">${pool}${bang}</div></div>`;
}

function tuDong(){
 const dt=dtHien(),chua=lopChuaPC(curMon,dt),tai=gvMon(curMon,dt,1);
 if(!tai.length){toast('⛔ Không có giáo viên nào ở '+dt+' dạy được môn này — không tự động được');return}
 const ok=[],bo=[];
 chua.forEach(lId=>{
  const l=lop(lId);
  let uv=tai.filter(p=>(p.khoi[curMon]||[]).includes(l.k));
  const ghiChu=uv.length?'đúng khối phụ trách':'không ai có khối này — bỏ qua';
  if(!uv.length){bo.push([lopTen(l),'Không giáo viên nào phụ trách khối '+l.k+' — không ép xếp']);return}
  uv.sort((a,b)=>{const ca=canDoi(a.id),cb=canDoi(b.id);return (ca.lech??0)-(cb.lech??0)});
  const g=uv[0];
  PC.push({id:++seq,gv:g.id,lop:lId,mon:curMon,tt:'ap'});
  ghiLog('Phân công tự động',`${lopTen(lop(lId))} · ${curMon} → ${g.n}`,'');
  ok.push([lopTen(l),g.n,ghiChu]);
 });
 selLop=null;render();
 modal('Kết quả phân công tự động — '+curMon+' · '+dt,
  `<div class="${ok.length?'okbox':'warn'}">${ok.length?`✓ Đã xếp <b>${ok.length}</b> lớp.`:'Không xếp được lớp nào.'}</div>
   ${ok.length?`<table><thead><tr><th>Lớp</th><th>Giáo viên</th><th>Căn cứ</th></tr></thead><tbody>
     ${ok.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>`:''}
   ${bo.length?`<div class="warn" style="margin-top:11px"><b>Không xếp được ${bo.length} lớp:</b>
     <table style="margin-top:6px"><thead><tr><th>Lớp</th><th>Lý do</th></tr></thead><tbody>
     ${bo.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`:''}
   <div class="ro" style="margin-top:11px">Thứ tự ưu tiên: <b>khối phụ trách</b> → <b>người còn dư giờ nhiều nhất</b>.
    Không ai đủ điều kiện thì <b>để lại</b>, không ép — và <b>nói rõ vì sao</b> thay vì để thẻ lặng lẽ biến mất.</div>`,
  `<button class="btn p" data-x="close">Đóng</button>`);
}

function gan(gvId){
 if(!selLop){toast('Chọn một thẻ lớp trước');return}
 const l=lop(selLop),g=ns(gvId);
 if(nguoiDay(selLop,curMon)){toast(`⛔ ${lopTen(l)} · ${curMon} đã có <b>${ns(nguoiDay(selLop,curMon).gv).n}</b> phụ trách`);return}
 const ngoaiKhoi=!(g.khoi[curMon]||[]).includes(l.k);
 const c=canDoi(gvId), sau=c.day+tietSo(l,curMon);
 const vuot=c.nguong&&(sau-c.nguong)/c.nguong*100>CFG.tran;
 const canh=[];
 if(ngoaiKhoi) canh.push(`⚠ Lớp khối <b>${l.k}</b> nằm ngoài khối phụ trách của ${g.n} (${(g.khoi[curMon]||[]).join(', ')||'chưa cấu hình'}) — ràng buộc <b>mềm</b>, không chặn`);
 if(vuot) canh.push(`⛔ Sau khi nhận, ${g.n} đạt <b>${sau}/${c.nguong} tiết</b> — vượt trần ${CFG.tran}% của TT 05/2025`);
 if(!coKHGD(l,curMon)) canh.push(`⚠ Lớp <b>${lopTen(l)}</b> <b>chưa phân kế hoạch giảng dạy</b> môn ${curMon} — phân công được, nhưng <b>không tính vào định mức</b> cho tới khi có số tiết ở M10.2`);
 if(g.dtCT!==l.dt) canh.push(`ℹ ${g.n} có điểm trường công tác là <b>${g.dtCT}</b> — đây là <b>mượn cross-branch</b>, hợp lệ`);
 if(!canh.length){doGan(gvId);return}
 modal('Xác nhận phân công',
  `<div class="info"><b>${lopTen(l)} · ${curMon} · ${tietHien(l,curMon)} tiết/tuần</b> → <b>${g.n}</b></div>
   ${canh.map(c=>`<div class="${c.startsWith('⛔')?'danger':c.startsWith('⚠')?'warn':'ro'}">${c}</div>`).join('')}`,
  `<button class="btn" data-x="close">Hủy</button>
   <button class="btn p" data-x="ok-gan" data-gv="${gvId}">Vẫn phân công</button>`);
}
function doGan(gvId){
 PC.push({id:++seq,gv:gvId,lop:selLop,mon:curMon,tt:'ap'});
 const nm=ns(gvId).n,lid=selLop;
 ghiLog('Phân công',`${lopTen(lop(lid))} · ${curMon} → ${nm}`,'');
 selLop=null;closeModal();render();
 toast(`✓ <b>${lopTen(lop(lid))} · ${curMon}</b> → ${nm} · quyền <code>assigned</code> mở cho người này ở ${'M2.1'} và ${'M2.5'}`);
}

/* ================= T2 — BÀN CHỦ NHIỆM ================= */
function ungVienCN(dt){
 return NS.filter(p=>p.cdGVCN&&p.dtCT===dt&&!cnCua(p.id));
}
function cnTab(){
 const dt=dtHien(),ls=LOP.filter(l=>l.dt===dt),chua=ls.filter(l=>!CN[l.id]);
 const uv=ungVienCN(dt);
 const thieuCD=NS.filter(p=>!p.bgh&&!p.cdGVCN&&p.dtCT===dt);
 const al=chua.length?`<div class="alerts"><div class="alert r">⛔<span class="sp">
   <b>${chua.length} lớp chưa có chủ nhiệm</b> tại ${dt} — ${chua.map(l=>l.id).join(', ')}.
   Học sinh các lớp này chưa có ai đánh giá rèn luyện và điểm danh ở ${dlink('M2.9','M2.9')}</span></div></div>`:'';
 const rw=co('gvcn');

 const cot1=`<div class="listw"><div class="ch">Lớp của ${dt} <span class="sp"></span>
   <span class="mini">${ls.filter(l=>CN[l.id]).length}/${ls.length} đã có chủ nhiệm</span></div>
  ${ls.map(l=>{const g=CN[l.id];
   const tiet=g?PC.filter(p=>p.gv===g&&p.lop===l.id&&song(p)).reduce((a,p)=>a+tietPC(p),0):0;
   return `<div class="cnrow ${g?'':'trong'} ${cnLop===l.id?'sel':''}" data-cnlop="${l.id}">
    <div class="ava2" style="background:#dbeafe;color:#1e40af">${ten(l)}</div>
    <div class="sp"><b>Lớp ${ten(l)}</b>${dtBadge(l)}<div class="mini">${l.cap} · ${l.ss} học sinh</div></div>
    <div style="text-align:right">${g?`<b style="font-size:12.5px">${ns(g).n}</b>
       <div class="mini">${tiet?tiet+' tiết tại lớp':'không dạy tại lớp'} · giảm 4 tiết</div>`
      :'<span class="st2 r">⛔ Chưa có chủ nhiệm</span>'}</div>
    ${rw&&g?`<button class="btn xs" data-x="go-cn" data-lop="${l.id}">✕</button>`:''}</div>`}).join('')}
  <div class="lgd"><span class="chip">Mỗi lớp 1 chủ nhiệm</span><span class="chip">Mỗi giáo viên tối đa 1 lớp/năm</span></div></div>`;

 const cot2=`<div class="listw"><div class="ch">Người đủ điều kiện — <b>chưa phân công</b>
   <span class="sp"></span><span class="mini">${uv.length} người</span></div>
  ${uv.length?uv.map(p=>{const tiet=cnLop?PC.filter(x=>x.gv===p.id&&x.lop===cnLop&&song(x)).reduce((a,x)=>a+tietPC(x),0):0;
    return `<div class="cnrow" data-uv="${p.id}">
     <div class="ava2">${p.i}</div>
     <div class="sp"><b>${p.n}</b><div class="mini">${p.cv||'Giáo viên bộ môn'} · ${p.dtCT}</div></div>
     ${cnLop&&tiet?`<span class="tg g">Dạy ${tiet} tiết tại ${cnLop}</span>`:''}
     ${rw?`<button class="btn xs p" data-x="ok-cn" data-gv="${p.id}" ${cnLop?'':'disabled'}>Chọn</button>`:''}</div>`}).join('')
   :`<div class="empty" style="padding:24px">⛔ Không còn ai đủ điều kiện tại ${dt}</div>`}
  <div class="dkbox">Chỉ hiện người <b>có chức danh Giáo viên chủ nhiệm</b>, <b>điểm trường công tác = ${dt}</b>,
   và <b>chưa chủ nhiệm lớp nào</b> trong năm.
   ${thieuCD.length?`<br>⚠ <b>${thieuCD.map(p=>p.n).join(', ')}</b> công tác tại ${dt} nhưng <b>chưa có chức danh Giáo viên chủ nhiệm</b> nên không xuất hiện.`:''}
   <br>Chưa thấy người cần tìm? ${dlink('M4.3','Cấp chức danh tại M4.3','gvcn')}</div></div>`;

 return al+`<div class="bar">
   <select class="fs" id="fdt" ${R().pv==='branch'?'disabled':''}>
     <option ${curDT==='Điểm trường A'?'selected':''}>Điểm trường A</option>
     <option ${curDT==='Điểm trường B'?'selected':''}>Điểm trường B</option></select>
   <span class="chip">Chọn một lớp bên trái, rồi chọn người bên phải</span>
   ${cnLop?`<span class="chip" style="border-color:var(--brand);color:var(--brand)">Đang chọn lớp <b>${cnLop}</b></span>`:''}</div>
  <div class="ro">Chia <b>theo từng điểm trường</b> — chủ nhiệm là việc của từng nơi. Bản v1.1 gom hết vào một danh sách.</div>
  <div class="cnb">${cot1}${cot2}</div>`;
}

/* ================= T2b — KHỐI LỚP PHỤ TRÁCH =================
 Đây là QUYẾT ĐỊNH BỐ TRÍ của một năm học, không phải năng lực chuyên môn —
 nên thuộc M4.5 chứ không thuộc M4.4. Ràng buộc MỀM: lệch khối chỉ cảnh báo.
 Sửa được ở hai chỗ: tab này (đợt đầu năm, hàng loạt) và ngay trên bàn phân công (sửa lẻ). */
function khTab(){
 const rw=co('pc');
 const monList=MONS.filter(monTrongPV);
 const byTo={};monList.forEach(m=>{(byTo[MON[m].to]=byTo[MON[m].to]||[]).push(m)});
 const thieu=NS.filter(p=>!p.bgh&&gvPV(p.id)&&monCua(p).some(m=>!(p.khoi[m]||[]).length));
 let body='';
 Object.keys(TO).filter(t=>byTo[t]).forEach(t=>{
  byTo[t].forEach(m=>{
   const gs=NS.filter(p=>p.mon[m]&&gvPV(p.id));
   if(!gs.length)return;
   const ks=khoiCuaMon(m);
   body+=`<div class="grow"><span class="ar">▾</span>${m}
     <span class="mini">· ${TO[t]}</span>
     <span class="ct"><span>${gs.length} giáo viên</span>
      <span>khối ${ks.join(', ')}</span></span></div>`
    +gs.map(p=>{const kh=p.khoi[m]||[];
     const fc=khFocus&&khFocus.gv===p.id&&khFocus.mon===m;
     return `<div class="khrow ${fc?'focus':''}">
      <div class="who2"><div class="ava2">${p.i}</div><div class="i"><b>${p.n}</b>
        <span>${p.cv||'Giáo viên bộ môn'} · ${p.dtCT}</span></div></div>
      <div>${ks.map(k=>`<span class="kb ${kh.includes(k)?'on':''} ${rw?'clickable':''}"
          ${rw?`data-khoi="${p.id}|${m}|${k}"`:''}>${k}</span>`).join('')}
        ${kh.length?'':'<span class="mini nodata" style="margin-left:6px">chưa cấu hình</span>'}</div></div>`}).join('');
  });
 });
 const back=khFocus?`<div class="backbar">↗ <span class="sp">Đến từ <b>bàn phân công</b> —
   đang xem <b>${ns(khFocus.gv).n}</b> · môn <b>${khFocus.mon}</b></span>
   <button class="btn xs" data-x="kh-ve">← Quay lại bàn phân công</button></div>`:'';
 return back+`<div class="bar">
   ${rw?`<button class="btn" data-x="copy-kh">📋 Sao chép từ năm trước</button>`:''}
   <span class="chip">Dữ liệu <b>theo năm học</b></span>
   <span class="chip">Ràng buộc <b>mềm</b> — lệch khối chỉ cảnh báo, không chặn</span>
   <div class="sum">${thieu.length?`<span class="nodata"><b>${thieu.length}</b> người chưa cấu hình</span>`
     :'<span style="color:var(--green)"><b>Đã cấu hình đủ</b></span>'}</div></div>
  <div class="ro">Khối lớp phụ trách là <b>bố trí của năm nay</b>, không phải năng lực chuyên môn — năng lực
   (<b>môn được phép dạy</b>) thuộc ${dlink('M4.4','M4.4')}. Cấu hình ở đây dùng để
   <b>cảnh báo lệch khối</b> và <b>xếp thứ tự ưu tiên khi phân công tự động</b> ở bàn phân công.
   <br><b>Đây là chỗ duy nhất sửa được</b> — bàn phân công chỉ <b>hiển thị</b> khối lớp phụ trách
   kèm lối tắt <code>↗ sửa</code> dẫn về đây, để một dữ liệu chỉ có một nơi ghi.</div>
  <div class="listw">${body||'<div class="empty">Không có giáo viên nào trong phạm vi</div>'}
   <div class="lgd"><span class="chip">Thẻ tô đậm = đang phụ trách khối đó</span>
    <span class="chip">Chỉ hiện khối có môn đó trong chương trình — nguồn M10.2</span></div></div>`;
}

/* ================= T4 — TỔNG QUAN PHÂN CÔNG =================
 Đây là màn hình ĐỌC KẾT QUẢ, không phải màn hình làm việc.
 Khác với tab Cân đối định mức: ở đây trả lời "đã phân được những gì",
 Cân đối trả lời "có thừa thiếu giờ không". Hai câu hỏi khác nhau, hai người dùng khác nhau. */
function tqScope(){const r=R();return r.pv==='branch'?r.dt:tqDT}
const pcTaiDT=(g,dt)=>PC.filter(p=>p.gv===g&&song(p)&&(dt==='Toàn trường'||lop(p.lop).dt===dt));
const lopTaiDT=dt=>LOP.filter(l=>(dt==='Toàn trường'||l.dt===dt)&&coCauHinh(l));

function tqTab(){
 const dt=tqScope(), ls=lopTaiDT(dt);
 const pcs=PC.filter(p=>song(p)&&(dt==='Toàn trường'||lop(p.lop).dt===dt));
 const tong=pcs.reduce((a,p)=>a+tietPC(p),0);
 const gvs=[...new Set(pcs.map(p=>p.gv))];
 const thieu=ls.filter(l=>monCuaLop(l).some(m=>!nguoiDay(l.id,m)));
 const chuaCH=LOP.filter(l=>(dt==='Toàn trường'||l.dt===dt)&&!coCauHinh(l));

 const stat=`<div class="tqstat">
  <div class="tqcell"><div class="v">${ls.length}</div><div class="k">lớp trong phạm vi</div></div>
  <div class="tqcell"><div class="v">${pcs.length}</div><div class="k">phân công Lớp × Môn</div></div>
  <div class="tqcell"><div class="v">${tong}</div><div class="k">tiết/tuần</div></div>
  <div class="tqcell"><div class="v">${gvs.length}</div><div class="k">giáo viên tham gia</div></div>
  <div class="tqcell ${thieu.length?'bad':'ok'}"><div class="v">${thieu.length}</div><div class="k">lớp còn thiếu môn</div></div>
 </div>`;

 const bar=`<div class="bar">
   <span class="flab">Lớp thuộc điểm trường</span>
   <select class="fs" id="ftqdt" ${R().pv==='branch'?'disabled':''}>
     <option ${tqDT==='Toàn trường'?'selected':''}>Toàn trường</option>
     <option ${tqDT==='Điểm trường A'?'selected':''}>Điểm trường A</option>
     <option ${tqDT==='Điểm trường B'?'selected':''}>Điểm trường B</option></select>
   <span class="seg">
     <button class="${tqGoc==='gv'?'on':''}" data-tqg="gv">👤 Theo giáo viên</button>
     <button class="${tqGoc==='mon'?'on':''}" data-tqg="mon">📘 Theo môn học</button>
     <button class="${tqGoc==='lop'?'on':''}" data-tqg="lop">🏫 Theo lớp học</button></span>
   ${co('xuat')?`<button class="btn" data-x="xuat">⬇ Xuất bảng phân công</button>`:''}
   ${chuaCH.length?`<div class="sum"><span class="mini">${chuaCH.length} lớp chưa cấu hình môn học — không tính vào đây</span></div>`:''}</div>`;

 const note=`<div class="ro">Bộ lọc trên lọc theo <b>điểm trường của LỚP HỌC được phân công</b> —
   <b>không phải</b> nơi công tác của giáo viên. Một giáo viên có thể dạy lớp ở nhiều điểm trường,
   nên cùng một người có thể xuất hiện ở cả hai phạm vi với những lớp khác nhau.
   <br><b>Tên lớp có thể trùng nhau giữa các điểm trường</b> — mọi thẻ lớp đều mang nhãn
   ${DTS.filter(d=>LOP.some(l=>l.dt===d)).map((d,i)=>`<span class="lchip2 d${dtIdx(d)}" style="padding:1px 6px">${dtMa[d]}<span class="mini"> ${d}</span></span>`).join('')}</div>`;
 return stat+bar+note+(tqGoc==='gv'?tqTheoGV(dt):tqGoc==='mon'?tqTheoMon(dt):tqTheoLop(dt));
}

function tqTheoGV(dt){
 /* gồm cả người công tác tại đây mà chưa được phân tiết nào — đó là thông tin cần thấy */
 const co1=[...new Set(PC.filter(p=>song(p)&&(dt==='Toàn trường'||lop(p.lop).dt===dt)).map(p=>p.gv))];
 const trong=NS.filter(p=>!p.moi&&(dt==='Toàn trường'||p.dtCT===dt)&&!co1.includes(p.id)&&monCua(p).length);
 const ds=[...co1.map(ns),...trong].filter(p=>gvPV(p.id));
 const byTo={};ds.forEach(p=>{const t=monCua(p)[0]?MON[monCua(p)[0]].to:'T1';(byTo[t]=byTo[t]||[]).push(p)});
 let body='';
 Object.keys(TO).filter(t=>byTo[t]).forEach(t=>{
  const g=byTo[t], tt=g.reduce((a,p)=>a+pcTaiDT(p.id,dt).reduce((x,q)=>x+tietPC(q),0),0);
  body+=`<tr class="grp"><td colspan="5">${TO[t]} — ${g.length} giáo viên · ${tt} tiết/tuần</td></tr>`
   +g.map(p=>{
     const rs=pcTaiDT(p.id,dt), tiet=rs.reduce((a,q)=>a+tietPC(q),0);
     const all=pcCua(p.id).reduce((a,q)=>a+tietPC(q),0);
     const c=canDoi(p.id);
     const byM={};rs.forEach(q=>{(byM[q.mon]=byM[q.mon]||[]).push(q)});
     return `<tr class="${rs.length?'':'warnrow'}">
      <td><b>${p.n}</b><div class="mini">${p.cv||'Giáo viên bộ môn'} · ${p.dtCT}</div></td>
      <td>${monCua(p).map(m=>`<span class="tg a">${m}</span>`).join(' ')||'<span class="mini">—</span>'}</td>
      <td>${rs.length?Object.keys(byM).map(m=>`<div style="margin-bottom:3px"><span class="mini">${m}:</span>
          ${byM[m].map(q=>{const l=lop(q.lop);
            return `<span class="lchip2 d${dtIdx(l.dt)}" title="${l.dt}">${ten(l)}${dtBadge(l)}
              <span class="mini">(${tietHien(l,m)})</span></span>`}).join('')}</div>`).join('')
        :'<span class="nodata">Chưa được phân tiết nào</span>'}</td>
      <td class="num"><b>${tiet}</b>${dt!=='Toàn trường'&&all!==tiet?`<div class="mini">toàn trường ${all}</div>`:''}</td>
      <td class="num">${c.nguong??'<span class="nodata">--</span>'}
        <div class="mini">${c.nguong==null?'chưa có định mức':(c.lech>0?'+'+c.lech:c.lech)+' tiết'}</div></td></tr>`}).join('');
 });
 return `<div class="listw"><table>
   <thead><tr><th>Giáo viên</th><th>Môn được phép dạy</th><th>Lớp đang phụ trách</th>
    <th class="num">Tiết/tuần</th><th class="num">Định mức</th></tr></thead>
   <tbody>${body||'<tr><td colspan="5" class="empty">Không có giáo viên nào</td></tr>'}</tbody></table>
   <div class="lgd"><span class="chip">Dòng vàng = có môn được phép dạy nhưng <b>chưa được phân tiết nào</b></span>
    <span class="chip">Cột định mức chỉ đọc — phân tích đầy đủ ở tab Cân đối định mức</span></div></div>`;
}

function tqTheoMon(dt){
 const ls=lopTaiDT(dt);
 const monList=MONS.filter(monTrongPV).filter(m=>ls.some(l=>monCuaLop(l).includes(m)));
 const byTo={};monList.forEach(m=>{(byTo[MON[m].to]=byTo[MON[m].to]||[]).push(m)});
 let body='';
 Object.keys(TO).filter(t=>byTo[t]).forEach(t=>{
  body+=`<tr class="grp"><td colspan="5">${TO[t]}</td></tr>`
   +byTo[t].map(m=>{
     const can=ls.filter(l=>monCuaLop(l).includes(m));
     const cop=can.filter(l=>nguoiDay(l.id,m));
     const th=can.filter(l=>!nguoiDay(l.id,m));
     const gvm={};cop.forEach(l=>{const g=nguoiDay(l.id,m).gv;(gvm[g]=gvm[g]||[]).push(l)});
     const tiet=cop.reduce((a,l)=>a+tietSo(l,m),0);
     const aiDay=dayDuoc(m).length;
     return `<tr class="${th.length?(aiDay?'warnrow':'badrow'):''}">
      <td><span class="monnm">${m}</span><div class="mini">${khoiCuaMon(m).length?'khối '+khoiCuaMon(m).join(', '):''}</div></td>
      <td class="num"><b>${cop.length}</b>/${can.length}<div class="mini">${tiet} tiết/tuần</div></td>
      <td>${Object.keys(gvm).length?Object.keys(gvm).map(g=>`<span class="lchip2"><b>${ns(+g).n}</b>
          <span class="mini">${gvm[g].length} lớp</span></span>`).join('')
        :'<span class="nodata">Chưa ai đảm nhiệm</span>'}</td>
      <td>${th.length?th.map(l=>`<span class="lchip2 thieu d${dtIdx(l.dt)}" title="${l.dt}">${ten(l)}${dtBadge(l)}</span>`).join('')
        :'<span style="color:var(--green);font-weight:700">✓ Đủ</span>'}</td>
      <td>${th.length?(aiDay?`<button class="btn xs p" data-x="tq-toi" data-mon="${m}">Mở bàn phân công</button>`
        :`<span class="st2 r">Không ai dạy được</span> ${dlink('M4.4','M4.4')}`):''}</td></tr>`}).join('');
 });
 return `<div class="listw"><table>
   <thead><tr><th>Môn học</th><th class="num">Lớp đã có GV</th><th>Giáo viên đảm nhiệm</th>
    <th>Lớp còn thiếu</th><th></th></tr></thead>
   <tbody>${body||'<tr><td colspan="5" class="empty">Không có môn nào</td></tr>'}</tbody></table>
   <div class="lgd"><span class="chip">Dòng vàng = thiếu <b>phân công</b>, xử lý được ở bàn</span>
    <span class="chip">Dòng đỏ = thiếu <b>năng lực</b>, phải gán môn ở M4.4 hoặc tuyển bổ sung</span></div></div>`;
}

function tqTheoLop(dt){
 const ls=lopTaiDT(dt).filter(lopPV).sort((a,b)=>dtIdx(a.dt)-dtIdx(b.dt)||a.k-b.k||ten(a).localeCompare(ten(b)));
 const nhom={};ls.forEach(l=>{(nhom[l.dt]=nhom[l.dt]||[]).push(l)});
 let body='';
 Object.keys(nhom).forEach(d=>{
  const g=nhom[d];
  body+=`<tr class="grp"><td colspan="5">${d} — ${g.length} lớp</td></tr>`
   +g.map(l=>{
    const ms=monCuaLop(l), rs=PC.filter(p=>p.lop===l.id&&song(p));
    const tiet=rs.reduce((a,p)=>a+tietPC(p),0);
    const cn=CN[l.id];
    const du=ms.filter(m=>nguoiDay(l.id,m)).length;
    return `<tr class="${du<ms.length?'warnrow':''}">
     <td><b>${ten(l)}</b>${dtBadge(l)}<div class="mini">${l.cap} · khối ${l.k} · ${l.ss} học sinh</div></td>
     <td>${cn?`<b style="font-size:12.5px">${ns(cn).n}</b>`:'<span class="nodata">⛔ Chưa có</span>'}</td>
     <td>${ms.map(m=>{const p=nguoiDay(l.id,m);
        return p?`<span class="lchip2"><span class="mini">${m}</span>&nbsp;<b>${ns(p.gv).n}</b>
            <span class="mini">(${tietHien(l,m)})</span></span>`
          :`<span class="lchip2 thieu">${m} ⛔</span>`}).join('')}</td>
     <td class="num"><b>${du}</b>/${ms.length}<div class="mini">môn có GV</div></td>
     <td class="num">${tiet}<div class="mini">tiết/tuần</div></td></tr>`}).join('');
 });
 return `<div class="listw"><table>
   <thead><tr><th>Lớp</th><th>Chủ nhiệm</th><th>Môn học × Giáo viên</th>
    <th class="num">Đủ môn</th><th class="num">Tiết/tuần</th></tr></thead>
   <tbody>${body||'<tr><td colspan="5" class="empty">Không có lớp nào</td></tr>'}</tbody></table>
   <div class="lgd"><span class="chip">Dòng vàng = lớp còn môn chưa có giáo viên</span>
    <span class="chip">Đây là bản in phát cho Giáo viên chủ nhiệm</span>
    <span class="chip">Lớp chưa cấu hình môn học không xuất hiện — nguồn M10.2</span></div></div>`;
}

/* ================= T3 — CÂN ĐỐI ================= */
function cdTab(){
 const gs=NS.filter(p=>gvPV(p.id)&&!p.moi);
 const a=[];
 const vt=gs.filter(p=>!p.bgh&&vuotTran(p.id));
 if(vt.length)a.push(`<div class="alert w">⚠<span class="sp"><b>${vt.length} giáo viên vượt trần ${CFG.tran}%</b> của TT 05/2025</span></div>`);
 const lt=gs.filter(p=>lechThuc(p.id));
 if(lt.length)a.push(`<div class="alert w">⚠<span class="sp"><b>${lt.length} người có thực dạy lệch kế hoạch trên 10%</b> — ${
   lt.map(p=>`${p.n} (${canDoi(p.id).lechTD>0?'+':''}${canDoi(p.id).lechTD}%)`).join(' · ')}. Chỉ phát hiện được sau khi tách ${dlink('M4.7','M4.7')}</span></div>`);
 const row=p=>{const c=canDoi(p.id),w=c.nguong&&c.pct>CFG.tran,b=Math.abs(c.lechTD)>10;
  return `<tr class="${w?'badrow':b?'warnrow':''}">
   <td><b>${p.n}</b><div class="mini">${p.cv||'Giáo viên bộ môn'}${cnCua(p.id)?' · CN '+cnCua(p.id):''}</div></td>
   <td class="num">${c.chuan??'—'}<div class="mini">${c.cap}</div></td>
   <td>${c.giam.length?c.giam.map(x=>`<span class="tg a">${x[0]} −${x[1]}</span>`).join(' '):'<span class="mini">—</span>'}</td>
   <td class="num"><b>${c.nguong??'—'}</b></td>
   <td class="num">${c.dayLop}</td><td class="num">${p.qd||'—'}</td>
   <td class="num"><b>${c.day}</b><div class="mini">${c.nguong?(c.lech>0?'+':'')+c.pct+'%':''}</div></td>
   <td class="num">${c.kh}</td>
   <td class="num">${c.td}<div class="mini" style="${b?'color:var(--amber);font-weight:700':''}">${c.lechTD>0?'+':''}${c.lechTD}%</div></td>
   <td class="num">${p.dthay||'—'}</td><td class="num">${p.huy||'—'}</td></tr>`};
 const gv=gs.filter(p=>!p.bgh),bgh=gs.filter(p=>p.bgh);
 return (a.length?`<div class="alerts">${a.join('')}</div>`:'')
  +`<div class="ro">Cột <b>Khung chuẩn · Giảm · Ngưỡng</b> là <b>chỉ đọc từ ${'M4.4'}</b> — M4.5 không sở hữu định mức.
    Cột <b>Thực dạy · Dạy thay · Nghỉ huỷ</b> chỉ đọc từ ${dlink('M4.7','M4.7')}.
    Tab này <b>không chịu bộ chọn Điểm trường</b> — định mức phải cộng dồn cross-branch.</div>
   <div class="listw"><table>
    <thead><tr><th>Giáo viên</th><th class="num">Khung chuẩn</th><th>Giảm định mức</th>
     <th class="num">Ngưỡng</th><th class="num">Tiết lên lớp</th><th class="num">Quy đổi</th>
     <th class="num">Định mức kế hoạch</th><th class="num">Kế hoạch lũy kế</th>
     <th class="num">Thực dạy 🔗</th><th class="num">Dạy thay 🔗</th><th class="num">Nghỉ · huỷ 🔗</th></tr></thead>
    <tbody>${gv.map(row).join('')}
     ${bgh.length?`<tr class="grp"><td colspan="11">Ban giám hiệu — định mức theo chức vụ</td></tr>`+bgh.map(row).join(''):''}
    </tbody></table>
    <div class="lgd"><span class="chip">Quy đổi cộng vào vế giáo viên, không cộng vào ngưỡng — sửa công thức của nh3.3.1 §5.1</span></div></div>`;
}

/* ================= T4 — ĐIỀU CHỈNH ================= */
function dcTab(){
 let r=LOG.slice();
 if(fDC) r=r.filter(x=>x.viec===fDC);
 const loai=[...new Set(LOG.map(x=>x.viec))];
 return `<div class="bar">
   <select class="fs" id="fdc"><option value="">Mọi loại thao tác</option>
    ${loai.map(v=>`<option ${fDC===v?'selected':''}>${v}</option>`).join('')}</select>
   <div class="sum"><span><b>${r.length}</b> lượt</span></div></div>
  <div class="ro"><b>Đây là nhật ký, không phải hàng đợi phê duyệt.</b>
   Đã tra cứu: <b>không có văn bản nào bắt buộc quy trình duyệt hay ra quyết định riêng</b> cho việc thay đổi
   phân công giảng dạy giữa năm trong cùng một trường. <b>TT 05/2025</b> giao Hiệu trưởng phân công trên cơ sở
   kế hoạch giáo dục và định mức, yêu cầu <b>công khai, công bằng</b>; <b>Luật Nhà giáo 2025 Đ.42</b> giao thẩm quyền
   phân công cho người đứng đầu cơ sở giáo dục.
   <br>Vì phân công là <b>căn cứ tính tiết dạy và thù lao vượt giờ</b>, cái bắt buộc là <b>lưu được vết</b> —
   nên thao tác <b>sửa thẳng tại bàn phân công</b>, mỗi thay đổi sau công bố <b>bắt buộc nêu lý do</b> và rơi vào đây.</div>
  <div class="listw">
   <div class="hdrow" style="grid-template-columns:1fr 1.3fr 2fr 2.4fr">
    <div>Thời điểm</div><div>Thao tác</div><div>Nội dung</div><div>Lý do</div></div>
   ${r.length?r.map(x=>`<div class="hrow" style="grid-template-columns:1fr 1.3fr 2fr 2.4fr;cursor:default">
     <div>${x.luc}<div class="mini">${x.ai.split(' (')[0]}</div></div>
     <div><span class="st2 ${x.viec==='Ký công bố'?'b':x.viec.startsWith('Gỡ')?'r':'o'}">${x.viec}</span></div>
     <div style="font-size:12.5px">${x.ct}</div>
     <div style="font-size:12px;color:var(--ink2)">${x.ld||'<span class="mini">—</span>'}</div></div>`).join('')
    :'<div class="empty">Chưa có thao tác nào</div>'}
   <div class="lgd"><span class="chip">Nhật ký chỉ đọc, không sửa không xoá</span>
    <span class="chip">Căn cứ đối chiếu khi tính thù lao vượt giờ ở M4.9</span></div></div>`;
}

/* ================= SỰ KIỆN ================= */
document.addEventListener('click',e=>{
 if(e.target.matches('input,select,textarea'))return;
 const t=e.target.closest('[data-r],[data-tab],[data-x],[data-mon],[data-lchip],[data-cnlop],[data-uv],[data-dc],[data-gvdrop],[data-khoi],[data-tqg]');
 if(!t)return;
 const x=t.dataset.x;

 if(t.dataset.r){role=t.dataset.r;selLop=null;cnLop=null;fDC='';
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role));
  const r=R();$('#ava').textContent=r.ava;
  const s=$('#hdt');
  if(r.pv==='branch'){s.value=r.dt;s.disabled=true;$('#dtlock').textContent='🔒 khoá theo phạm vi';curDT=r.dt}
  else{s.disabled=false;s.value='Toàn trường';$('#dtlock').textContent=''}
  render();return}
 if(t.dataset.tab&&!x){tab=t.dataset.tab;selLop=null;cnLop=null;khFocus=null;render();return}
 if(x==='close'){closeModal();return}
 if(x==='dl'){closeModal();toast(`↗ Mở <b>${t.dataset.m}</b>${t.dataset.c?` · ngữ cảnh <code>${t.dataset.c}</code>`:''} · có nút quay lại M4.5`);return}
 if(x==='dk-tog'){dkMo=!dkMo;render();return}
 if(x==='go-cd'){tab='cd';render();return}
 if(x==='toi-thieu'){const tl=phanLoaiThieu(),l=Object.keys(tl.phanCong)[0];
   if(l){curDT=lop(l).dt;curMon=tl.phanCong[l][0];tab='pc';selLop=null;render();
     toast(`Đã mở môn <b>${curMon}</b> tại ${curDT} — lớp ${l} đang thiếu`)}return}

 if(x==='kh-goto'){khFocus={gv:+t.dataset.gv,mon:t.dataset.mon,ve:curMon};tab='kh';render();
   toast('Khối lớp phụ trách <b>chỉ cấu hình ở tab này</b> — bàn phân công chỉ hiển thị');return}
 if(x==='kh-ve'){const m=khFocus&&khFocus.ve;khFocus=null;tab='pc';if(m)curMon=m;render();return}
 if(t.dataset.tqg){tqGoc=t.dataset.tqg;render();return}
 if(x==='tq-toi'){const m=t.dataset.mon;
   const l=lopTaiDT(tqScope()).find(l=>monCuaLop(l).includes(m)&&!nguoiDay(l.id,m));
   if(l){curDT=lop(l.id).dt;curMon=m;tab='pc';selLop=null;render();
     toast(`Đã mở môn <b>${m}</b> tại ${curDT}`)}return}
 if(t.dataset.khoi){
   if(!co('pc')){toast('Vai trò hiện tại chỉ xem khối lớp phụ trách');return}
   const [id,m,k]=t.dataset.khoi.split('|'),p=ns(+id),a=p.khoi[m]||(p.khoi[m]=[]),kk=+k;
   const i=a.indexOf(kk); i<0?a.push(kk):a.splice(i,1); a.sort((x,y)=>x-y);
   render();return}
 if(x==='copy-kh'){
   let ok=0,bo=[];
   NS.filter(p=>!p.bgh&&gvPV(p.id)).forEach(p=>monCua(p).forEach(m=>{
     if((p.khoi[m]||[]).length)return;
     if(p.moi){bo.push([p.n+' · '+m,'Mới tuyển 8/2026 — không có dữ liệu năm trước']);return}
     p.khoi[m]=khoiCuaMon(m).slice(0,3);ok++}));
   render();
   modal('Kết quả sao chép khối lớp phụ trách',
    `<div class="${ok?'okbox':'warn'}">${ok?`✓ Đã sao chép <b>${ok}</b> cặp Giáo viên × Môn từ năm học 2025-2026.`:'Không có cặp nào để sao chép.'}</div>
     ${bo.length?`<div class="warn"><b>Bỏ qua ${bo.length}:</b>
       <table style="margin-top:6px"><thead><tr><th>Giáo viên × Môn</th><th>Lý do</th></tr></thead><tbody>
       ${bo.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`:''}
     <div class="ro">Chỉ sao chép cho cặp <b>còn tồn tại ở năm nay</b>; cặp đã có cấu hình thì giữ nguyên, không ghi đè.</div>`,
    `<button class="btn p" data-x="close">Đóng</button>`);
   return}

 /* --- T1 --- */
 if(t.dataset.mon){curMon=t.dataset.mon;selLop=null;render();return}
 if(t.dataset.lchip){selLop=selLop===t.dataset.lchip?null:t.dataset.lchip;render();return}
 if(x==='nhan'){gan(+t.dataset.gv);return}
 if(x==='ok-gan'){doGan(+t.dataset.gv);return}
 if(x==='tudong'){tuDong();return}
 if(x==='go-pc'){
   const p=PC.find(z=>z.id===+t.dataset.pc);
   if(lop(p.lop).dt!==dtHien()){toast('🔒 Lớp <b>'+p.lop+'</b> thuộc '+lop(p.lop).dt+' — đang phân công cho '+dtHien()+', không gỡ được ở đây');return}
   if(DOT.congbo){
     modal('Gỡ phân công đã công bố',
      `<div class="warn"><b>${lopTen(lop(p.lop))} · ${p.mon} — ${ns(p.gv).n}</b> đang <b>Đang áp dụng</b>.
        Bảy menu khác lấy quyền <code>assigned</code> từ dòng này; ${'M4.6'} và ${'M4.7'} sẽ sinh lại theo.</div>
       <div class="ro">Không có văn bản nào bắt buộc quy trình duyệt cho việc này — <b>TT 05/2025</b> chỉ yêu cầu
        <b>công khai, công bằng</b> và theo dõi được số tiết. Nên thao tác <b>sửa trực tiếp</b>, nhưng
        <b>bắt buộc nêu lý do</b> và vào <b>Nhật ký điều chỉnh</b>.</div>
       <label class="lbl">Lý do <span style="color:var(--red)">*</span></label>
       <textarea class="fldi" id="glLD" rows="2" placeholder="Nêu rõ căn cứ…"></textarea>`,
      `<button class="btn" data-x="close">Hủy</button>
       <button class="btn d" data-x="ok-go-pc" data-pc="${p.id}">Gỡ phân công</button>`);return}
   doGoPC(p.id,'');return}
 if(x==='ok-go-pc'){const ld=$('#glLD')?$('#glLD').value.trim():'';
   if(DOT.congbo&&!ld){toast('⛔ Bắt buộc nêu lý do — phân công là căn cứ tính tiết dạy và thù lao vượt giờ');return}
   doGoPC(+t.dataset.pc,ld);return}

 /* --- T2 --- */
 if(t.dataset.cnlop&&!x){cnLop=cnLop===t.dataset.cnlop?null:t.dataset.cnlop;render();return}
 if(x==='ok-cn'){
   const g=+t.dataset.gv;if(!cnLop){toast('Chọn một lớp trước');return}
   const l=cnLop,cu=CN[l];CN[l]=g;cnLop=null;
   ghiLog(cu?'Đổi chủ nhiệm':'Phân công chủ nhiệm',`${lopTen(lop(l))} — ${cu?ns(cu).n+' → ':''}${ns(g).n}`,'');
   render();
   toast(`✓ ${ns(g).n} chủ nhiệm lớp <b>${l}</b> · sinh <code>user_role_scoped</code> phạm vi lớp → mở ${'M2.9'} · giảm định mức −4 tiết`);return}
 if(x==='go-cn'){const l=t.dataset.lop,g=CN[l];CN[l]=null;
   ghiLog('Gỡ chủ nhiệm',`${lopTen(lop(l))} — ${ns(g).n}`,'');render();
   toast(`Đã gỡ chủ nhiệm lớp <b>${l}</b> (${ns(g).n}) · thu <code>user_role_scoped</code> phạm vi lớp`);return}

 /* --- T4 --- */

 if(x==='xuat'){
   modal('Xuất phân công',
    `<label class="lbl">Bản xuất</label><select class="fldi">
      <option>Bảng phân công theo tổ chuyên môn</option><option>Phiếu phân công cá nhân</option>
      <option>Bảng phân công theo lớp</option><option>Báo cáo cân đối định mức</option></select>
     <label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>
     <select class="fldi" id="mdx"><option value="">— Chọn mục đích —</option>
      <option>Phát cho tổ chuyên môn</option><option>Báo cáo Phòng · Sở Giáo dục</option>
      <option>Lập kế hoạch tuyển dụng</option><option>Lưu hồ sơ nhà trường</option></select>
     <div class="ro" style="margin-top:11px">Mọi lượt xuất <b>ghi audit</b> kèm mục đích, người xuất và thời điểm.</div>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-xuat">⬇ Xuất</button>`);return}
 if(x==='ok-xuat'){if(!$('#mdx').value){toast('⛔ Bắt buộc chọn mục đích sử dụng trước khi xuất');return}
   closeModal();toast('⬇ Đã xuất · ghi audit kèm mục đích, người xuất và thời điểm');return}
});
function doGoPC(id,ld){
 const p=PC.find(z=>z.id===id);PC=PC.filter(z=>z.id!==id);
 ghiLog('Gỡ phân công',`${lopTen(lop(p.lop))} · ${p.mon} — ${ns(p.gv).n}`,ld||'');
 closeModal();render();
 toast(`Đã gỡ <b>${lopTen(lop(p.lop))} · ${p.mon}</b> khỏi ${ns(p.gv).n} · thẻ lớp quay lại khối chưa phân công · đã vào nhật ký`);
}
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fdt'){curDT=el.value;selLop=null;cnLop=null;render();return}
 if(el.id==='hdt'){if(el.value!=='Toàn trường'){curDT=el.value}render();return}
 if(el.id==='ftqdt'){tqDT=el.value;render();return}
 if(el.id==='fdc'){fDC=el.value;render();return}
});
/* kéo thả thật cho người dùng; nút ＋ để dùng bằng bàn phím */
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-lchip]');
 if(!c||!co('pc'))return;selLop=c.dataset.lchip;c.classList.add('drag');
 e.dataTransfer.setData('text/plain',selLop);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragend',e=>{const c=e.target.closest('[data-lchip]');if(c)c.classList.remove('drag')});
document.addEventListener('dragover',e=>{const r=e.target.closest('[data-gvdrop]');
 if(!r||!co('pc'))return;e.preventDefault();r.classList.add('over')});
document.addEventListener('dragleave',e=>{const r=e.target.closest('[data-gvdrop]');if(r)r.classList.remove('over')});
document.addEventListener('drop',e=>{const r=e.target.closest('[data-gvdrop]');
 if(!r||!co('pc'))return;e.preventDefault();r.classList.remove('over');
 selLop=e.dataTransfer.getData('text/plain');gan(+r.dataset.gvdrop)});

function render(){
 sidebar();tabs();
 $('#topact').innerHTML=co('xuat')?'<button class="btn" data-x="xuat">⬇ Xuất</button>':'';
 const t=phanLoaiThieu();
 const n=Object.keys(t.phanCong).length+Object.values(CN).filter(v=>!v).length;
 $('#ndot').textContent=n||'';$('#ndot').style.display=n?'grid':'none';
 $('#content').innerHTML=scopeBar()+(tab==='pc'?pcTab():tab==='cn'?cnTab():tab==='kh'?khTab():tab==='tq'?tqTab():tab==='cd'?cdTab():dcTab());
}
render();
</script>
