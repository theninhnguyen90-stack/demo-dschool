<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M0.3 Thông báo của tôi — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--brand);text-decoration:none}
mark{background:#fef08a;padding:0 1px;border-radius:2px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:14px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.icobtn.act{background:var(--brand-soft);color:var(--brand)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:13px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}

.main{flex:1;display:flex;min-width:0}
.list{flex:1;min-width:0;padding:18px 20px 40px}
.detail{width:430px;flex:0 0 430px;border-left:1px solid var(--line);background:var(--surface);
 position:sticky;top:56px;max-height:calc(100vh - 56px);display:flex;flex-direction:column}
.detail.hide{display:none}
@media(max-width:1180px){.detail{position:fixed;top:56px;right:0;bottom:0;z-index:55;box-shadow:-8px 0 26px rgba(0,0,0,.1)}}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:14px 0 0}
.tab{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab.on .b{background:var(--red);color:#fff}

.bar{display:flex;gap:8px;align-items:center;padding:12px 0;flex-wrap:wrap}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:200px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}

.daygrp{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 7px;display:flex;align-items:center;gap:8px}
.daygrp::after{content:"";flex:1;height:1px;background:var(--line)}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.n{display:grid;grid-template-columns:22px 30px 1fr auto;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start;border-left:3px solid transparent}
.n:last-child{border-bottom:none}
.n:hover{background:var(--brand-soft)}
.n.sel{background:#eff6ff;border-left-color:var(--brand)}
.n.hi{border-left-color:var(--red)}
.n.hi.sel{border-left-color:var(--red)}
.st{padding-top:5px}
.st i{display:block;width:9px;height:9px;border-radius:50%;background:var(--brand);cursor:pointer}
.n.read .st i{background:transparent;border:1.5px solid var(--line2)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--bg)}
.bd{min-width:0}
.bd .t{font-weight:700;font-size:13.5px;margin-bottom:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.n.read .bd .t{font-weight:500;color:var(--ink2)}
.bd .x{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd .m{font-size:11px;color:var(--ink3);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.bd .m code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;color:var(--brand)}
.sc{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#e0e7ff;color:#3730a3}
.sc.lop{background:#dcfce7;color:#166534}
.sc.ca{background:#fce7f3;color:#9d174d}
.sc.dt{background:#fef3c7;color:#92400e}
.hi-tag{font-size:10px;font-weight:700;color:var(--red);background:var(--red-soft);padding:1px 6px;border-radius:4px}
/* KGL2-1H — BA DUONG SINH TIN (M0.3 §5.1.1). .dt = o «Dung ten», ⛔ khong bao gio trong (rang buoc 7).
   .sig = chip chi bat o duong ③; VANG chip la cau tra loi day du cho hai duong kia — ⛔ khong them chip cho ① ②. */
/* ⚠ .dt DA CO NGHIA KHAC o menu nay (.sc.dt = pham vi «Tổ CM») — o «Dung ten» dung .dtn */
.bd .m .dtn{font-weight:600;color:var(--ink2)}
.sig{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#ede9fe;color:#5b21b6;border:1px solid #ddd6fe;white-space:nowrap}
.dcx{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#fef3c7;color:#92400e;white-space:nowrap}
.sigbox{border:1px solid #ddd6fe;border-left:3px solid #7c3aed;background:#faf8ff;border-radius:8px;padding:10px 13px;margin-bottom:14px}
.sigbox h4{font-size:11px;color:#5b21b6;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.sigbox .sgl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}
.sigbox .sgl span:first-child{color:var(--ink3)}
.sigbox .sgl span:last-child{font-weight:600;text-align:right}
.sigbox p{font-size:12px;color:var(--ink2);line-height:1.55;margin-top:6px}
.sigbox .dcline{margin-top:8px;font-size:12px;font-weight:600;color:#5b21b6;background:#f3f0ff;border-radius:6px;padding:6px 9px}
.sigbox .dcline.warn{color:#92400e;background:#fffbeb;border:1px solid #fde68a}
.rt{text-align:right;font-size:11.5px;color:var(--ink3);white-space:nowrap;padding-top:2px}
.rt .pin{display:block;margin-top:4px;font-size:13px;color:var(--amber)}

.dh{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.dh h3{font-size:15px;flex:1;line-height:1.4}
.db{flex:1;overflow-y:auto;padding:15px 17px;font-size:13.5px}
.meta{background:var(--bg);border-radius:9px;padding:11px 13px;font-size:12.5px;margin-bottom:14px}
.meta div{display:flex;justify-content:space-between;padding:3px 0}
.meta span:first-child{color:var(--ink3)}
.meta span:last-child{font-weight:600;text-align:right}
.ctxbox{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:10px 13px;margin-bottom:14px;background:#fafbff}
.ctxbox h4{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.ctxbox div{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
.body{line-height:1.75;white-space:pre-line}
.files{margin-top:15px}
.file{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:12.5px}
.file .fi{font-size:17px}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fz{color:var(--ink3);font-size:11.5px}
.df{padding:13px 17px;border-top:1px solid var(--line);display:flex;gap:8px}
.nodet{flex:1;display:grid;place-items:center;color:var(--ink3);text-align:center;padding:40px}
.nodet .e{font-size:36px;margin-bottom:9px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:560px;max-width:93vw;max-height:84vh;display:flex;flex-direction:column}
.mh{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:9px}
.mb{padding:16px 18px;overflow-y:auto;font-size:13px}
.mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.ctab{width:100%;border-collapse:collapse;font-size:12.5px}
.ctab th{text-align:center;font-size:10.5px;color:var(--ink3);text-transform:uppercase;padding:6px 4px;font-weight:700}
.ctab th:first-child{text-align:left}
.ctab td{padding:8px 4px;border-top:1px solid var(--line);text-align:center}
.ctab td:first-child{text-align:left;font-weight:500}
.ck{width:17px;height:17px;cursor:pointer}
.lock{color:var(--ink3);font-size:11px}
.qh{background:var(--bg);border-radius:9px;padding:12px 14px;margin-top:15px}
.qh .r{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12.5px}
.tin{border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-size:12.5px;width:80px}
.hint{font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.6}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 16px;display:flex;align-items:center;gap:9px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 11px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;
 padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:46px;text-align:center;color:var(--ink3)}
.empty .e{font-size:34px;margin-bottom:8px}
</style>
</head>

 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm'],['M0.3','Thông báo của tôi','B'],['M0.4','Trang cá nhân']]],
 ['hs','👥 Học sinh',[['M1.1','Hồ sơ học sinh'],['M1.3','Học bạ điện tử'],['M1.7','Lớp học & Chuyển lớp']]],
 ['lop','📚 Lớp học hàng ngày',[['M2.1','Lịch dạy & học'],['M2.2','Sổ đầu bài'],['M2.3','Bài tập về nhà'],['M2.5','Nhập điểm thường xuyên'],['M2.5','Bảng điểm môn'],['M2.9','Không gian lớp học']]],

 ['gt','💬 Giao tiếp',[['M8.1','Thông báo chủ động'],['M8.2','Nhắn tin']]],
];
const RM={FULL:'all',HT:'all',GVCN:['hs','lop','gt'],GVBM:['lop','cm','gt'],TCNS:['ns','gt'],PH:['none']};
const RN={FULL:'Đủ quyền (demo)',HT:'Hiệu trưởng',GVCN:'Giáo viên chủ nhiệm',GVBM:'Giáo viên bộ môn',TCNS:'Tổ chức nhân sự',PH:'Phụ huynh (App)'};
const GRP=['Hôm nay','Hôm qua','Tuần này','Cũ hơn'];

let role='FULL',tab='all',cur=null;
/* FULL = vai mặc định của demo (quy ước dự án): thấy thông báo gửi tới MỌI vai + mọi dòng cài đặt nhận,
   để rà trọn luồng trên một màn hình. Hệ thống thật: mỗi người chỉ thấy phần của mình. */
const duQuyen=()=>role==='FULL';
const read=new Set(), pin=new Set();
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),2600)};
const mine=()=>N.filter(n=>duQuyen()||n.role.includes(role));

/* ===== BA DUONG SINH TIN — M0.3 §5.1.1 (KGL2-1H, 23/9/2026) =====
   ⛔ KHONG doan tu ten menu: doc thang truong cua ban ghi (src + tuKy).
   Cot «Dung ten» tra loi cau ①: ai chiu trach nhiem. Cot «Ban can lam gi» tra loi cau ②. */
const duong=n=>n.src===2?2:(n.tuKy?3:1);
const duongTen=n=>({1:'Thông báo soạn tay (đường ①)',2:'Sự kiện hệ thống (đường ②)',
                    3:'Sinh từ chữ ký công bố (đường ③)'})[duong(n)];
/* mot dong tren feed — ⛔ khong bao gio de trong (rang buoc 7) */
const dungTen=n=>n.src===2?'⚙ Hệ thống':('✍ '+n.w+' · '+n.wr);
/* cau day du trong panel chi tiet */
const dungTenDai=n=>{const d=duong(n);
  if(d===2)return 'Không ai — hệ thống tự sinh';
  if(d===3)return n.w+' — '+n.wr+' · <b>'+n.tuKy.hv+'</b> lúc '+n.tuKy.luc;  /* HDTKB ⑤: «ký công bố» HOẶC «hủy công bố» */
  return n.w+' — '+n.wr+' · đã soạn và gửi'};
/* BA gia tri va chi ba — DAN XUAT, ⛔ khong menu nao go chu vao day.
   Tin duong ③ luon roi vao gia tri 1 hoac 2: HDTKB ⑧ chot «khong sinh viec o M0.2». */
const canLam=n=>n.act?('Xem lại: '+n.act):'Không phải làm gì — đây là tin';
const unread=()=>mine().filter(n=>!read.has(n.id));

function sidebar(){
  const a=RM[role],full=a==='all';
  $('#side').innerHTML=NAV.map(([id,n,items])=>{
    const on=full||id===''||a.includes(id);
    return `<div class="sgrp">${n}</div>`+items.map(it=>{
      const cu=it[0]==='M0.3';
      const bd=it[2]?`<span class="nb">${unread().length}</span>`:'';
      return `<div class="snav ${cu?'on':''} ${on?'':'off'}">
        <span style="font-size:11px;opacity:.55;min-width:30px">${it[0]}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it[1]}</span>${bd}</div>`}).join('')
  }).join('')}

const hl=(s,q)=>q?s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):s;

function render(){
  const q=$('#q').value.trim(), ql=q.toLowerCase();
  let rows=mine();
  if(tab==='unread')rows=rows.filter(n=>!read.has(n.id));
  if(tab==='pin')rows=rows.filter(n=>pin.has(n.id));
  if(ql)rows=rows.filter(n=>(n.t+n.x+(n.body||'')).toLowerCase().includes(ql));
  const s1=$('#fsrc').value,s2=$('#fsc').value,s3=$('#fpr').value,s4=$('#ftm').value;
  if(s1==='Thông báo chủ động')rows=rows.filter(n=>n.src===1);
  if(s1==='Sự kiện hệ thống')rows=rows.filter(n=>n.src===2);
  if(s2!=='Mọi phạm vi')rows=rows.filter(n=>n.sc===s2);
  if(s3==='Quan trọng cao')rows=rows.filter(n=>n.hi);
  if(s4==='Hôm nay')rows=rows.filter(n=>n.d==='Hôm nay');
  if(s4==='7 ngày')rows=rows.filter(n=>n.d!=='Cũ hơn');

  $('#ba').textContent=mine().length; $('#bu').textContent=unread().length;
  $('#bp').textContent=mine().filter(n=>pin.has(n.id)).length;
  $('#bell').textContent=unread().length;
  $('#ava').textContent=role.slice(0,2);

  if(!rows.length){$('#feed').innerHTML=
    `<div class="feed"><div class="empty"><div class="e">${tab==='unread'?'✅':'📭'}</div>
     <b>${tab==='unread'?'Bạn đã đọc hết thông báo':tab==='pin'?'Chưa ghim thông báo nào':'Không có thông báo phù hợp'}</b></div></div>`;
    return}

  const card=n=>`<div class="n ${read.has(n.id)?'read':''} ${n.hi?'hi':''} ${cur===n.id?'sel':''}" data-id="${n.id}">
    <div class="st"><i data-tog="${n.id}" title="${read.has(n.id)?'Đánh dấu chưa đọc':'Đánh dấu đã đọc'}"></i></div>
    <div class="ico">${n.ic}</div>
    <div class="bd">
      <div class="t">${hl(n.t,q)} ${n.hi?'<span class="hi-tag">Quan trọng cao</span>':''}</div>
      <div class="x">${hl(n.x,q)}</div>
      <div class="m"><code>${n.m}</code>
        <span class="dtn">${dungTen(n)}</span>
        ${n.tuKy?'<span class="sig" title="Nội dung dẫn xuất từ bản ghi đã ký — không ai gõ thêm chữ nào">⚙ Sinh từ chữ ký</span>':''}
        ${n.tuKy&&n.tuKy.codc?'<span class="dcx">⚠ Đã có đính chính</span>':''}
        <span class="sc ${n.scc}">${n.sc}</span>
        ${n.files?'<span>📎 '+n.files.length+'</span>':''}</div>
    </div>
    <div class="rt">${n.tm}${pin.has(n.id)?'<span class="pin">⚑</span>':''}</div></div>`;

  if(tab==='pin'){$('#feed').innerHTML=`<div class="feed">${rows.map(card).join('')}</div>`;return}
  $('#feed').innerHTML=GRP.map(g=>{
    const r=rows.filter(n=>n.d===g); if(!r.length)return'';
    return `<div class="daygrp">${g}</div><div class="feed">${r.map(card).join('')}</div>`}).join('');
}

function detail(id){
  const n=N.find(x=>x.id===id); cur=id; read.add(id);
  $('#det').classList.remove('hide');
  $('#det').innerHTML=`
   <div class="dh">
     <h3>${n.t}</h3>
     <button class="icobtn" data-pin="${id}" title="Ghim">${pin.has(id)?'⚑':'⚐'}</button>
     <button class="icobtn" id="dclose">✕</button>
   </div>
   <div class="db">
     ${n.hi?'<div style="background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:8px 11px;border-radius:8px;font-size:12px;margin-bottom:13px">🔴 <b>Quan trọng cao</b> — hệ thống ghi nhận thời điểm bạn đọc thông báo này</div>':''}
     <div class="meta">
       <div><span>Người đứng tên</span><span>${dungTenDai(n)}</span></div>
       <div><span>Bạn cần làm gì</span><span>${canLam(n)}</span></div>
       <div><span>Thời điểm</span><span>${n.d} · ${n.tm}</span></div>
       <div><span>Phạm vi gửi</span><span>${n.sc}</span></div>
       <div><span>Nguồn</span><span>${n.m} · ${n.mn}</span></div>
       <div><span>Loại</span><span>${duongTen(n)}</span></div>
     </div>
     ${n.tuKy?`<div class="sigbox">
       <h4>⚙ Sinh từ chữ ký</h4>
       <div class="sgl"><span>Bản ghi nguồn</span><span><code>${n.tuKy.bg}</code> · ${n.tuKy.ten}</span></div>
       <p>Không ai ngồi gõ tin này — nội dung <b>dẫn xuất trọn vẹn</b> từ bản ghi đã ký ở <code>${n.tuKy.menu}</code>.
       Hỏi lại về <i>câu chữ</i> là hỏi sai chỗ; cái hỏi được là <b>quyết định</b> đứng sau nó.</p>
       ${n.tuKy.dc?`<div class="dcline">↩ Đính chính cho <code>${n.tuKy.dc}</code> — bản trước vẫn nằm lại trong hộp thư của bạn</div>`:''}
       ${n.tuKy.codc?`<div class="dcline warn">⚠ Đã có đính chính — xem bản ghi <code>${n.tuKy.codc}</code> ở cùng hộp thư</div>`:''}
     </div>`:''}
     ${n.ctx?`<div class="ctxbox"><h4>Ngữ cảnh</h4>
       ${n.ctx.map(c=>`<div><span style="color:var(--ink3)">${c[0]}</span><span style="font-weight:600">${c[1]}</span></div>`).join('')}</div>`:''}
     <div class="body">${n.body}</div>
     ${n.files?`<div class="files"><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:7px">Tệp đính kèm</div>
       ${n.files.map(f=>`<div class="file"><span class="fi">${f[2]}</span><span class="fn">${f[0]}</span>
         <span class="fz">${f[1]}</span><button class="btn" style="padding:4px 9px;font-size:12px" data-dl="${f[0]}">Tải</button></div>`).join('')}</div>`:''}
   </div>
   <div class="df">
     ${n.act?`<button class="btn p" style="flex:1" data-go="${n.go||n.m}">${n.act} →</button>`:''}
     <button class="btn" data-unread="${id}">Đánh dấu chưa đọc</button>
   </div>`;
  render();
}

document.body.addEventListener('click',e=>{
  const tg=e.target.closest('[data-tog]');
  if(tg){const id=+tg.dataset.tog; read.has(id)?read.delete(id):read.add(id); render(); e.stopPropagation(); return}
  const pn=e.target.closest('[data-pin]');
  if(pn){const id=+pn.dataset.pin;
    if(!pin.has(id)&&pin.size>=20){toast('Tối đa 20 thông báo ghim — bỏ bớt trước khi ghim thêm');return}
    pin.has(id)?pin.delete(id):pin.add(id); detail(id);
    toast(pin.has(id)?'Đã ghim thông báo':'Đã bỏ ghim'); return}
  const ur=e.target.closest('[data-unread]');
  if(ur){read.delete(+ur.dataset.unread); cur=null; $('#det').classList.add('hide'); render();
    toast('Đã đưa về chưa đọc'); return}
  const dl=e.target.closest('[data-dl]');
  if(dl){toast(`Tải "${dl.dataset.dl}" — ghi audit ai tải tệp nào`); return}
  const go=e.target.closest('[data-go]');
  if(go){toast(`Deep-link → ${go.dataset.go} · return=M0.3`); return}
  if(e.target.closest('#dclose')){cur=null;$('#det').classList.add('hide');render();return}
  const c=e.target.closest('.n');
  if(c){detail(+c.dataset.id); return}
});

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); tab=b.dataset.t; render()});
document.querySelectorAll('.rb').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.rb').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); role=b.dataset.r; cur=null; $('#det').classList.add('hide');
  sidebar(); render(); toast(`Hộp thư của ${RN[role]}`)});
['q','fsrc','fsc','fpr','ftm'].forEach(i=>{$('#'+i).addEventListener('input',render);$('#'+i).addEventListener('change',render)});
$('#allread').onclick=()=>{const n=unread().length;
  if(!n){toast('Không còn thông báo chưa đọc');return}
  mine().forEach(x=>read.add(x.id)); render(); toast(`Đã đánh dấu ${n} thông báo là đã đọc`)};

/* ==== CÀI ĐẶT ==== */
const CH=[
 ['Thông báo từ nhà trường',1,1,0],
 ['Việc cần tôi xử lý',1,0,0],
 ['Kết quả xử lý việc của tôi',1,0,0],
 /* GY18-J1 — nhom thu bay. Bien ban to nop len khong phai «viec can toi xu ly» (khong co hang doi duyet)
    va cung khong phai «ket qua xu ly viec CUA TOI» (viec cua to khac). ✅ anh Ninh chot 19/9/2026: them nhom moi. */
 ['Hồ sơ chuyên môn',1,0,0],
 ['Điểm và học tập của con',1,0,0,'PH'],
 ['Chuyên cần của con',1,0,0,'PH'],
 ['Tài chính, hóa đơn',1,1,0],
];
$('#cfg').onclick=()=>{
  const rows=CH.filter(c=>!c[4]||duQuyen()||c[4]===role);
  $('#mb').innerHTML=`
   <div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:8px">A · Kênh nhận theo nhóm thông báo</div>
   <table class="ctab"><tr><th>Nhóm thông báo</th><th>In-app</th><th>Push</th><th>Email</th><th>SMS</th></tr>
   ${rows.map(c=>`<tr><td>${c[0]}</td>
     <td><span class="lock" title="Không tắt được">🔒 Luôn</span></td>
     <td><input type="checkbox" class="ck" ${c[1]?'checked':''}></td>
     <td><input type="checkbox" class="ck" ${c[2]?'checked':''}></td>
     <td><input type="checkbox" class="ck" disabled title="Trường chưa bật SMS"></td></tr>`).join('')}
   </table>
   <div class="hint">🔒 <b>Kênh in-app không tắt được</b> — đảm bảo mọi thông tin đều tới được hộp thư, bạn chỉ điều chỉnh mức độ làm phiền bên ngoài.<br>
   Kênh <b>SMS</b> đang mờ vì nhà trường chưa bật ở cấu hình cấp trường (⚙ M8.1). Giới hạn cấp trường luôn thắng cấu hình cá nhân.</div>

   <div class="qh">
     <div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700">B · Giờ yên lặng</div>
     <div class="r"><input type="checkbox" class="ck" checked> Bật giờ yên lặng
       <span style="margin-left:auto">Từ <input class="tin" value="21:00"> đến <input class="tin" value="06:00"></span></div>
     <div class="hint">Trong giờ yên lặng vẫn nhận in-app, chỉ không đẩy push và không gửi SMS.</div>
   </div>

   <div class="qh">
     <div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700">C · Ngoại lệ</div>
     <div class="r"><input type="checkbox" class="ck" checked> Luôn nhận thông báo <b>Quan trọng cao</b> kể cả trong giờ yên lặng</div>
   </div>`;
  $('#mask').classList.add('on')};
$('#mok').onclick=()=>{$('#mask').classList.remove('on');toast('Đã lưu cài đặt nhận thông báo')};
$('#mreset').onclick=()=>{$('#cfg').click();toast('Đã khôi phục mặc định')};
$('#mask').onclick=e=>{if(e.target.id==='mask')$('#mask').classList.remove('on')};

sidebar(); render();
</script>
</body>
</html>
