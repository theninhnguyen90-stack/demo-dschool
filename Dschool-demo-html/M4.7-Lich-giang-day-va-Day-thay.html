<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}
.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}
.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}
.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.flab{font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:-3px}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}.st2.v{background:#ede9fe;color:#5b21b6}
.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:150px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}tr.badrow{background:var(--red-soft)}
tr.grp td{background:#f8fafc;font-weight:700;font-size:11.5px}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.empty{padding:32px;text-align:center;color:var(--ink3)}
.mini{font-size:10.5px;color:var(--ink3);font-weight:400}
.nodata{color:var(--red);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:800px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}

/* ---------- LƯỚI LỊCH ---------- */
.gridw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
.lg{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
.lg th{position:sticky;top:0;z-index:2;background:#f8fafc;font-size:11px;padding:8px 6px;text-align:center;text-transform:none;letter-spacing:0}
.lg th.hom{background:#e0e7ff;color:#3730a3}
.lg td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.lg td.hr{background:#f8fafc;font-size:10.5px;color:var(--ink3);text-align:center;padding:4px 6px;white-space:nowrap;font-weight:700;position:sticky;left:0;z-index:1;min-width:74px}

.cell{min-height:62px;padding:5px 6px;font-size:11.5px;line-height:1.35;cursor:pointer;display:flex;flex-direction:column;justify-content:center;position:relative}

.cell.co{background:#fafbfc;cursor:default}
.cell b{font-weight:700}
.cell .g{color:var(--ink2);font-size:11px;font-weight:600;display:block;word-break:break-word}
.cell .g2{color:var(--ink3);font-size:10px;display:block}
.cell.dien{background:#f8fafc}
.cell.dien::after{content:"✓";position:absolute;top:3px;right:5px;color:var(--green);font-size:10px;font-weight:800}

.cell.thay{background:var(--amber-soft);box-shadow:inset 0 0 0 2px #fbbf24}
.cell.doi{background:#ede9fe;box-shadow:inset 0 0 0 2px #a78bfa}
.cell.bu{background:var(--green-soft);box-shadow:inset 0 0 0 2px #6ee7b7}
.cell.chua{background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red)}
.ngn{font-size:9px;font-weight:800;border-radius:4px;padding:0 4px;margin-left:3px}
.ngn.t{background:#fef3c7;color:#92400e}.ngn.d{background:#ede9fe;color:#5b21b6}
.ngn.b{background:#dcfce7;color:#166534}.ngn.x{background:#e0e7ff;color:#3730a3}
.vrow{display:grid;grid-template-columns:1.5fr 1.7fr 1.3fr 1.1fr 1.6fr;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;font-size:12.5px}
.vrow:last-child{border-bottom:none}
.vrow.khan{background:var(--red-soft)}
.vrow.gap{background:var(--amber-soft)}
.hdrow{display:grid;grid-template-columns:1.5fr 1.7fr 1.3fr 1.1fr 1.6fr;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.uv{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
.uv:hover{border-color:var(--brand);background:var(--brand-soft)}
.uv.on{border-color:var(--brand);background:var(--brand-soft)}
.uv .sp{flex:1;min-width:0}
.uv.loai{opacity:.5;background:#fafbfc;cursor:not-allowed;border-style:dashed}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff}
.dtb{font-size:9px;font-weight:800;border-radius:4px;padding:0 4px;margin-left:3px;background:#e0e7ff;color:#3730a3}
.dtb.b{background:#fef3c7;color:#92400e}
</style>

<script>
const $=s=>document.querySelector(s);
const HOMNAY=new Date(2026,11,2);          /* thứ Tư 02/12/2026 */
const GIOHIENTAI=8*60+40;                   /* 08:40 */
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
const them=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const key=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4400)}
function closeModal(){$('#mask').classList.remove('on')}
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}

const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','4'],['M0.3','Thông báo'],['M0.4','Trang cá nhân']]],
 ['lh','📚 Lớp học hàng ngày',[['M2.1','Lịch dạy và học'],['M2.2','Sổ đầu bài']]],
 ['ns','👨‍🏫 Nhân sự',[['M4.1','Hồ sơ nhân sự'],['M4.2','Biến động nhân sự'],['M4.3','Chức danh & Điểm công tác'],
   ['M4.4','Quản lý giáo viên'],['M4.5','Phân công giảng dạy'],['M4.6','Thời khóa biểu'],
   ['M4.7','Lịch giảng dạy & Dạy thay','4'],['M4.8','Nghỉ phép'],['M4.9','Chấm công nhân sự'],
   ['M4.10','Khen thưởng & Kỷ luật NS'],['M4.11','Chứng thư số']]],
 ['qt','⚙️ Quản trị',[['M10.1','Hồ sơ năm học'],['M10.2','Cơ cấu tổ chức']]],
];

/* ================= VAI TRÒ =================
 viec: daythay · doitiet · huy · daybu · sinh · nghi · xuat */
const ROLE={
 FULL:{n:'Đủ quyền — rà luồng nghiệp vụ',menu:'all',ava:'DQ',pv:'school',
   viec:['daythay','doitiet','huy','daybu','sinh','nghi','xuat'],mchu:['M4.6','M4.8','M2.1','M2.2','M4.9','M4.5','M10.1']},

   viec:['daythay','doitiet','huy','daybu','sinh','nghi','xuat'],mchu:['M4.6','M4.8','M2.1','M2.2','M4.5']},
 TTCM:{n:'Ngô Thị Hương — Tổ trưởng Tổ Ngoại ngữ',menu:['','lh','ns'],ava:'NH',pv:'to',to:'T3',

 VT:{n:'Ngô Thị Bích — Văn thư Điểm trường A',menu:['','lh','ns'],ava:'NB',pv:'branch',dt:'Điểm trường A',
   viec:['sinh','nghi','daybu','xuat'],mchu:['M4.6','M2.2']},
 HT:{n:'Trần Văn Hùng — Hiệu trưởng',menu:'all',ava:'TH',pv:'school',
   viec:['nghi','xuat'],mchu:['M4.6','M4.8','M4.9','M4.5']},
 GV:{n:'Ngô Thị Hương — Giáo viên Tiếng Anh',menu:['','lh','ns'],ava:'NH',pv:'own',gvid:7,
   viec:[],mchu:['M2.1']},

let role='FULL';
const R=()=>ROLE[role];
const co=v=>R().viec.includes(v);

/* ================= DANH MỤC ================= */
const DTS=['Điểm trường A','Điểm trường B'];
const dtMa={'Điểm trường A':'A','Điểm trường B':'B'};
const LOP=[
 {id:'6A1',k:6,cap:'THCS',dt:'Điểm trường A',phong:'P.101'},{id:'6A2',k:6,cap:'THCS',dt:'Điểm trường A',phong:'P.102'},

  if(TKB.some(x=>x.gv===g&&x.thu===t&&x.tiet===n))return 1;
  return TKB.some(x=>x.gv===g&&x.thu===t&&DTGV[g]&&lop(x.lop).dt!==dt&&

     TKB.filter(z=>z.lop===l.id&&z.thu===x).length-TKB.filter(z=>z.lop===l.id&&z.thu===y).length||x-y);
   let dat=false;
   for(const t of days){

/* gợi ý người dạy thay — 3 tầng + loại trừ */
function goiY(x){
 const L=lop(x.lop),toMon=MONTO[x.mon];
 return NS.map(p=>{
  const day=(MONGV[p.id]||[]).includes(x.mon);
  const cungTo=p.to===toMon;
  const ban=LICH.find(z=>z.gv===p.id&&z.ngay===x.ngay&&z.tiet===x.tiet&&z.tt!=='nghi'&&z.id!==x.id);
  const nghi=NGHIPHEP.some(n=>n.gv===p.id&&pd(n.tu)<=pd(x.ngay.split('-').reverse().join('/'))&&pd(x.ngay.split('-').reverse().join('/'))<=pd(n.den));
  /* kề tiết ở điểm trường khác -> không kịp di chuyển */
  const ke=LICH.find(z=>z.gv===p.id&&z.ngay===x.ngay&&lop(z.lop).dt!==L.dt&&
    (Math.abs(phut(tiet(x.tiet).bd)-phut(tiet(z.tiet).kt))<DICHUYEN||
     Math.abs(phut(tiet(z.tiet).bd)-phut(tiet(x.tiet).kt))<DICHUYEN));
  let loai='',hang=9;
  if(R().pv==='to'&&p.to!==R().to) loai='Ngoài tổ chuyên môn — Tổ trưởng chỉ xếp được người trong tổ mình';
  else if(ban) loai=`Đang dạy ${ban.lop} cùng tiết`;
  else if(nghi) loai='Đang nghỉ phép';
  else if(ke) loai=`Có tiết ở ${lop(ke.lop).dt} tiết ${ke.tiet} — không kịp di chuyển (cần ${DICHUYEN} phút)`;
  else if(day&&cungTo)hang=1; else if(day)hang=2; else if(cungTo)hang=3; else loai='Không cùng môn, không cùng tổ';
  return {p,hang,loai,thay:soThayThang(p.id),day,cungTo};
 }).sort((a,b)=>a.hang-b.hang||(DTGV[a.p.id]===L.dt?0:1)-(DTGV[b.p.id]===L.dt?0:1)||a.thay-b.thay);
}

/* ================= T1 — LỊCH GIẢNG DẠY ================= */
const dtBadge=lId=>`<span class="dtb ${lop(lId).dt==='Điểm trường B'?'b':''}">${dtMa[lop(lId).dt]}</span>`;
/* kieu: 'lop' lưới theo lớp và lưới theo ngày · 'gv' theo giáo viên · 'phong' theo phòng */
function oCell(x,kieu){
 kieu=kieu||'lop';
 if(!x) return `<div class="cell co"></div>`;
 const cls=x.tt==='nghi'?'nghi':x.tt==='huy'?'huy':x.canThay?'chua'
   :x.nguon==='Dạy thay'?'thay':x.nguon==='Đổi tiết'?'doi':x.nguon==='Dạy bù'?'bu':x.tt==='dien'?'dien':'';
 const ng=x.nguon==='Dạy thay'?'<span class="ngn t">🔁 thay</span>':x.nguon==='Đổi tiết'?'<span class="ngn d">⇄ đổi</span>'
   :x.nguon==='Dạy bù'?'<span class="ngn b">➕ bù</span>':x.nguon==='Thêm thủ công'?'<span class="ngn x">✋</span>':'';
 const dau=kieu==='lop'?`${x.mon}${ng}`
   :kieu==='gv'?`${x.lop}${dtBadge(x.lop)}${ng}`
   :`${x.lop}${dtBadge(x.lop)}${ng}`;
 if(x.tt==='nghi')
  return `<div class="cell nghi" data-tiet="${x.id}"><b>${dau}</b>
    <span class="g2">Nghỉ — ${nghiCua(pd(x.ngay.split('-').reverse().join('/')),x.lop).loai}</span></div>`;
 let than;
 if(x.canThay)
  than=`<span class="g nodata">⛔ Chưa có giáo viên</span><span class="g2">${ns(x.gvGoc).n} nghỉ · ${x.donNghi||''}</span>`;
 else if(kieu==='lop')
  than=`<span class="g">${ns(x.gv).n}</span>`+
   (x.nguon==='Dạy thay'?`<span class="g2">thay cho ${ns(x.gvGoc).n}</span>`:`<span class="g2">${x.phong}</span>`);
 else if(kieu==='gv')
  than=`<span class="g">${x.mon}</span><span class="g2">${x.phong}</span>`;
 else
  than=`<span class="g">${x.mon}</span><span class="g2">${ns(x.gv).n}</span>`;
 return `<div class="cell ${cls}" data-tiet="${x.id}"><b>${dau}</b>${than}
   ${x.tt==='huy'?`<span class="g2 nodata">HỦY · ${x.cachXuLy}</span>`:''}</div>`;
}
const don=x=>x.donNghi?x.donNghi:'';
function khungHien(loc){
 const cs=new Set(VIS().filter(loc).map(x=>tiet(x.tiet).b));
 const k=KHUNG.filter(x=>cs.has(x.b));
 return k.length?k:KHUNG.filter(x=>x.b==='S');
}
function lichTab(){

 const bar=`<div class="bar">

      ${r.pv==='own'?'<span class="chip">🔒 chỉ lịch của bạn</span>'
        :`<span class="seg">${[['lop','Lớp'],['gv','Giáo viên'],['phong','Phòng']].map(([k,n])=>
        `<button class="${aiLoai===k?'on':''}" data-al="${k}">${n}</button>`).join('')}</span>`}`}
   <span class="flab">Điểm trường</span>

   +`<div class="gridw"><table class="lg">

      const sep=i>0&&KH[i-1].b!==k.b?`<tr class="buoi"><td colspan="${ls.length+1}">— nghỉ trưa —</td></tr>`:'';
      return sep+`<tr><td class="hr">Tiết ${k.n}<div class="mini">${k.bd}</div></td>

    </tbody></table></div>`;
 } else {
  const bd=pd(tuanBD.split('-').reverse().join('/'));
  const ngs=[0,1,2,3,4,5].map(i=>them(bd,i));
  chotAi();
  const oc=(d,n)=>VIS().filter(x=>x.ngay===key(d)&&x.tiet===n&&(
    aiLoai==='lop'?x.lop===curAi:aiLoai==='gv'?String(x.gv)===curAi||String(x.gvGoc)===curAi:x.phong===curAi))[0];
  luoi=`<div class="gridw"><table class="lg">
   <thead><tr><th style="width:76px"></th>${ngs.map(d=>`<th class="${key(d)===key(HOMNAY)?'hom':''}">${['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]}<div class="mini">${p2(d.getDate())}/${p2(d.getMonth()+1)}</div></th>`).join('')}</tr></thead>
   <tbody>${(()=>{const KH=khungHien(x=>ngs.some(d=>key(d)===x.ngay)&&(
      aiLoai==='lop'?x.lop===curAi:aiLoai==='gv'?String(x.gv)===curAi||String(x.gvGoc)===curAi:x.phong===curAi));
     return KH.map((k,i)=>{
     const sep=i>0&&KH[i-1].b!==k.b?`<tr class="buoi"><td colspan="7">— nghỉ trưa —</td></tr>`:'';
     return sep+`<tr><td class="hr">Tiết ${k.n}<div class="mini">${k.bd}</div></td>
      ${ngs.map(d=>`<td>${oCell(oc(d,k.n),aiLoai)}</td>`).join('')}</tr>`}).join('')})()}
   </tbody></table></div>`;
 }
 return bar+chuGiai+luoi+(curTiet?panelTiet():'');
}
function chotAi(){const d=dsAi();if(!d.length)return d;
 if(!d.some(x=>x[0]===curAi))curAi=d[0][0];return d}
function dsAi(){
 const dt=dtHien();
 if(aiLoai==='lop')return LOP.filter(l=>l.dt===dt).map(l=>[l.id,l.id]);
 if(aiLoai==='gv') return NS.filter(p=>VIS().some(x=>x.gv===p.id)).map(p=>[String(p.id),p.n+' — '+DTGV[p.id]]);
 return [...new Set(VIS().filter(x=>lop(x.lop).dt===dt).map(x=>x.phong))].sort().map(p=>[p,p]);
}

document.addEventListener('click',e=>{
 if(e.target.matches('input,select,textarea'))return;
 const t=e.target.closest('[data-r],[data-tab],[data-x],[data-cd],[data-al],[data-tiet],[data-uv]');
 if(!t)return;
 const x=t.dataset.x;
 if(t.dataset.r){role=t.dataset.r;curTiet=null;
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role));
  const r=R();$('#ava').textContent=r.ava;
  const s=$('#hdt');
  if(r.pv==='branch'){s.value=r.dt;s.disabled=true;$('#dtlock').textContent='🔒 khoá theo phạm vi';curDT=r.dt}
  else{s.disabled=false;s.value='Toàn trường';$('#dtlock').textContent=''}
  if(r.pv==='own'){cheDo='tuan';aiLoai='gv';curAi=String(r.gvid)}
  render();return}
 if(t.dataset.tab&&!x){tab=t.dataset.tab;curTiet=null;render();return}
 if(x==='close'){closeModal();return}
 if(x==='dl'){closeModal();toast(`↗ Mở <b>${t.dataset.m}</b>${t.dataset.c?` · <code>${t.dataset.c}</code>`:''} · có nút quay lại M4.7`);return}
 if(t.dataset.cd){cheDo=t.dataset.cd;curTiet=null;render();return}
 if(t.dataset.al){aiLoai=t.dataset.al;curAi=null;render();return}
 if(x==='ng-tr'){curNgay=key(them(pd(curNgay.split('-').reverse().join('/')),-1));curTiet=null;render();return}
 if(x==='ng-sau'){curNgay=key(them(pd(curNgay.split('-').reverse().join('/')),1));curTiet=null;render();return}
 if(x==='ve-homnay'){curNgay=key(HOMNAY);render();return}
 if(t.dataset.tiet&&!x){curTiet=+t.dataset.tiet;render();
   const el=document.querySelector('.card .ch');if(el)el.scrollIntoView({block:'nearest'});return}
 if(x==='dong-tiet'){curTiet=null;render();return}
 if(x==='toi-tiet'){const z=LICH.find(q=>q.id===+t.dataset.i);
   tab='lich';cheDo='ngay';curNgay=z.ngay;curDT=lop(z.lop).dt;curTiet=z.id;render();return}

 /* --- dạy thay --- */
 if(x==='xep-thay'){moXepThay(+t.dataset.i);return}
 if(t.dataset.uv){uvChon=+t.dataset.uv;
   const id=+$('[data-x="ok-thay"]').dataset.i;const g=$('#dtGiai').value;veXepThay(id);
   setTimeout(()=>{if($('#dtGiai')&&g)$('#dtGiai').value=g},0);return}
 if(x==='ok-thay'){
   const z=LICH.find(q=>q.id===+t.dataset.i),gi=$('#dtGiai').value.trim();
   if(!gi){toast('⛔ Bắt buộc ghi diễn giải — ai đã hỏi ai, bằng cách nào, khi nào. Đây là vết duy nhất của thỏa thuận');return}
   z.gv=uvChon;z.nguon='Dạy thay';z.canThay=false;z.dienGiai=gi;
   z.nguoiXep=R().n.split(' — ')[0]+' · '+d2s(HOMNAY);
   closeModal();render();
   toast(`🔁 <b>${ns(uvChon).n}</b> dạy thay ${z.lop} · ${z.mon} · tiết ${z.tiet} · đã gửi thông báo tới giáo viên dạy thay, GVCN và phụ huynh · sổ đầu bài và điểm danh chuyển sang người này`);return}

 /* --- hủy --- */
 if(x==='mo-huy'){moHuy(+t.dataset.i);return}
 if(x==='ok-huy'){
   const z=LICH.find(q=>q.id===+t.dataset.i),xl=$('#hxl').value,ly=$('#hly').value.trim();
   if(!xl){toast('⛔ Bắt buộc chọn cách xử lý — lớp tự học, lớp nghỉ, hay sẽ dạy bù');return}
   if(!ly){toast('⛔ Bắt buộc nêu lý do hủy');return}
   z.tt='huy';z.cachXuLy=xl;z.lyHuy=ly;z.canThay=false;z.seBu=xl==='Sẽ dạy bù'?1:0;
   z.nguoiXep=R().n.split(' — ')[0]+' · '+d2s(HOMNAY);
   closeModal();render();
   toast(`Đã hủy tiết <b>${z.lop} · ${z.mon}</b> · ${xl} · thông báo mức cao tới PHT Điểm trường và Hiệu trưởng${xl==='Sẽ dạy bù'?' · đã vào hàng đợi dạy bù':''}`);return}

 /* --- đổi tiết --- */
 if(x==='mo-doi'){moDoi(+t.dataset.i);return}
 if(x==='ok-doi'){
   const a=LICH.find(q=>q.id===+t.dataset.i),bid=+$('#doiVoi').value,ly=$('#doiLy').value.trim();
   if(!bid){toast('⛔ Không còn tiết nào đổi được trong ngày');return}
   if(!ly){toast('⛔ Bắt buộc nêu lý do và tên hai giáo viên đã thỏa thuận');return}
   const b=LICH.find(q=>q.id===bid);
   /* kiểm xung đột THẬT trước khi ghi: giáo viên và phòng ở vị trí MỚI */
   const va=(gv,ph,slot,tru)=>{
     const g=LICH.find(z=>z.ngay===slot.ngay&&z.tiet===slot.tiet&&z.gv===gv&&z.tt!=='nghi'&&z.id!==tru.id&&z.id!==slot.id);
     if(g)return `${ns(gv).n} đã có tiết ${g.mon} lớp ${g.lop} vào tiết ${slot.tiet}`;
     const p=LICH.find(z=>z.ngay===slot.ngay&&z.tiet===slot.tiet&&z.phong===ph&&z.tt!=='nghi'&&z.id!==tru.id&&z.id!==slot.id);
     if(p)return `Phòng ${ph} đã bị lớp ${p.lop} dùng vào tiết ${slot.tiet}`;
     return null};
   const e1=va(b.gv,b.phong,a,b), e2=va(a.gv,a.phong,b,a);
   if(e1||e2){toast('⛔ Xung đột sau khi đổi: '+(e1||e2)+' — không ghi vào lịch');return}
   const tmp={mon:a.mon,gv:a.gv,gvGoc:a.gvGoc,phong:a.phong};
   a.mon=b.mon;a.gv=b.gv;a.gvGoc=b.gvGoc;a.phong=b.phong;
   b.mon=tmp.mon;b.gv=tmp.gv;b.gvGoc=tmp.gvGoc;b.phong=tmp.phong;
   [a,b].forEach(z=>{z.nguon='Đổi tiết';z.lyDo=ly;z.nguoiXep=R().n.split(' — ')[0]+' · '+d2s(HOMNAY)});
   a.doiVoi=b.id;b.doiVoi=a.id;
   closeModal();render();
   toast(`⇄ Đã đổi <b>tiết ${a.tiet} ↔ tiết ${b.tiet}</b> lớp ${a.lop} · đã kiểm lại xung đột · thông báo cả hai giáo viên, GVCN và phụ huynh`);return}

 /* --- dạy bù --- */
 if(x==='mo-bu'){moBu(+t.dataset.i);return}
 if(x==='ok-bu'){
   const z=LICH.find(q=>q.id===+t.dataset.i);
   const ng=$('#buNgay').value,tt=+$('#buTiet').value,ph=$('#buPhong').value;
   const d=pd(ng);
   const trung=LICH.find(q=>q.ngay===key(d)&&q.tiet===tt&&(q.lop===z.lop||q.gv===z.gvGoc||q.phong===ph)&&q.tt!=='nghi');
   if(trung){toast(`⛔ Xung đột: ${trung.lop===z.lop?'lớp '+z.lop+' đã có tiết':trung.gv===z.gvGoc?ns(z.gvGoc).n+' đã có tiết ở lớp '+trung.lop:'phòng '+ph+' đã bị lớp '+trung.lop+' dùng'} vào ${ng} tiết ${tt}`);return}
   LICH.push({id:++seq,ngay:key(d),thu:d.getDay()+1,tiet:tt,lop:z.lop,mon:z.mon,gv:z.gvGoc,gvGoc:z.gvGoc,
     phong:ph,nguon:'Dạy bù',tt:'dukien',buCho:z.id});
   z.daBu=1;closeModal();render();
   toast(`➕ Đã xếp dạy bù <b>${z.lop} · ${z.mon}</b> vào ${ng} tiết ${tt} · liên kết ngược tới tiết gốc bị hủy · thông báo giáo viên, GVCN và phụ huynh`);return}

 /* --- lịch nghỉ --- */
 if(x==='them-nghi'){moThemNghi();return}
 if(x==='ok-nghi'){
   const tu=$('#nTu').value,den=$('#nDen').value,ly=$('#nLy').value.trim();
   if(!ly){toast('⛔ Bắt buộc nêu lý do');return}
   if(pd(tu)<HOMNAY||pd(den)<HOMNAY){
     const d=pd(tu)<HOMNAY?tu:den;
     const n=LICH.filter(q=>q.ngay===key(pd(d))).length;
     modal('⛔ Không khai báo được nghỉ cho ngày đã diễn ra',
      `<div class="danger">Ngày <b>${d}</b> đã có <b>${n} tiết</b> được ghi nhận.</div>
       <div class="ro">Một ngày đã diễn ra đã sinh dữ liệu ở nhiều nơi: <b>sổ đầu bài đã ký</b> (timestamp là căn cứ chấm công),
        <b>điểm danh đã chốt và đã gửi thông báo cho phụ huynh</b>, tiết đã tính vào số tiết thực dạy, có thể đã nằm trong
        báo cáo tuần đã phát hành. Chuyển ngày đó thành <b>Nghỉ</b> sẽ làm <b>mồ côi toàn bộ các bản ghi này</b>
        và phá vỡ đối chiếu chấm công.</div>
       <div class="ro">Đây là <b>ràng buộc cứng</b>, không phải cảnh báo bỏ qua được.</div>`,
      `<button class="btn" data-x="close">Đóng</button>`);return}
   const id='N'+(NGHI.length+1);
   const pv=$('#nPv').value;
   NGHI.push({id,loai:$('#nLoai').value,tu,den,pv,pvId:pv==='Điểm trường'?$('#nPvId').value:'',ly,
     ai:R().n.split(' — ')[0]+' · '+d2s(HOMNAY),nguon:''});
   let n=0;
   LICH.forEach(q=>{const d=pd(q.ngay.split('-').reverse().join('/'));
     if(q.tt==='dukien'&&nghiCua(d,q.lop)){q.tt='nghi';n++}});
   closeModal();render();
   toast(`Đã khai báo đợt nghỉ · <b>${n} tiết</b> chuyển sang Nghỉ · không sinh sổ đầu bài và điểm danh · đã gửi thông báo`);return}
 if(x==='rut-nghi'){const n=NGHI.find(q=>q.id===t.dataset.i);
   modal('Rút ngắn đợt nghỉ đang diễn ra',
    `<div class="warn">Đợt <b>${n.loai}</b> (${n.tu} — ${n.den}) <b>đã bắt đầu</b>.
      Chỉ <b>rút ngắn ngày kết thúc về tương lai</b> — không sửa ngày bắt đầu, không xóa.</div>
     <label class="lbl">Ngày kết thúc mới</label><input class="fldi" id="rnDen" value="${n.den}">
     <div class="ro" style="margin-top:11px">Những ngày đã trôi qua trong đợt nghỉ này <b>đã sinh dữ liệu</b> —
      không quay ngược được.</div>`,
    `<button class="btn" data-x="close">Hủy</button>
     <button class="btn p" data-x="ok-rut" data-i="${n.id}">Rút ngắn</button>`);return}
 if(x==='ok-rut'){const n=NGHI.find(q=>q.id===t.dataset.i),d=$('#rnDen').value;
   if(pd(d)<HOMNAY){toast('⛔ Ngày kết thúc mới phải từ hôm nay trở đi');return}
   if(pd(d)>pd(n.den)){toast('⛔ Chỉ rút ngắn được, không kéo dài thêm');return}
   n.den=d;
   let tra=0;
   LICH.forEach(z=>{const dd=pd(z.ngay.split('-').reverse().join('/'));
     if(z.tt==='nghi'&&!nghiCua(dd,z.lop)){z.tt=dd<HOMNAY?'dien':'dukien';tra++}});
   closeModal();render();
   toast(`Đã rút ngắn đợt nghỉ tới <b>${d}</b> · <b>${tra} tiết</b> trở lại lịch dạy`);return}
 if(x==='sua-nghi'){toast('Mở form sửa — đợt sắp tới sửa được toàn bộ');return}
 if(x==='xoa-nghi'){const n=NGHI.find(q=>q.id===t.dataset.i);
   NGHI.splice(NGHI.indexOf(n),1);
   LICH.forEach(q=>{const d=pd(q.ngay.split('-').reverse().join('/'));
     if(q.tt==='nghi'&&!nghiCua(d,q.lop))q.tt=d<HOMNAY?'dien':'dukien'});
   render();toast(`Đã xóa đợt nghỉ · các tiết trở lại trạng thái cũ`);return}

 /* --- sinh lại --- */
 if(x==='sinh-lai'){moSinhLai();return}
 if(x==='ok-sinh'){closeModal();
   toast('🔄 Đã sinh lại lịch · <b>không đụng tiết đã diễn ra</b> · giữ nguyên tiết đã can thiệp tay theo quyết định từng dòng · mọi quyết định vào audit');return}

 if(x==='xuat'){
   modal('Xuất lịch giảng dạy',
    `<label class="lbl">Bản xuất</label><select class="fldi">
      <option>Lịch cá nhân từng giáo viên</option><option>Lịch lớp theo tuần</option>
      <option>Báo cáo dạy thay trong tháng</option><option>Danh sách tiết hủy chưa bù</option></select>
     <label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>
     <select class="fldi" id="mdx"><option value="">— Chọn mục đích —</option>
      <option>Phát cho giáo viên</option><option>Đối chiếu chấm công</option>
      <option>Báo cáo Ban giám hiệu</option><option>Lưu hồ sơ nhà trường</option></select>
     <div class="ro" style="margin-top:11px">Mọi lượt xuất <b>ghi audit</b> kèm mục đích, người xuất và thời điểm.</div>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-xuat">⬇ Xuất</button>`);return}
 if(x==='ok-xuat'){if(!$('#mdx').value){toast('⛔ Bắt buộc chọn mục đích sử dụng trước khi xuất');return}
   closeModal();toast('⬇ Đã xuất · ghi audit kèm mục đích, người xuất và thời điểm');return}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fdt'){curDT=el.value;curTiet=null;curAi=null;render();return}
 if(el.id==='hdt'){if(el.value!=='Toàn trường')curDT=el.value;render();return}
 if(el.id==='fai'){curAi=el.value;render();return}
 if(el.id==='fngay'){const[a,b,c]=el.value.split('/').map(Number);
   if(a&&b&&c){curNgay=key(new Date(c,b-1,a));render()}return}
});

function render(){
 sidebar();tabs();
 $('#topact').innerHTML=co('xuat')?'<button class="btn" data-x="xuat">⬇ Xuất</button>':'';
 const n=canThay().length+huyChuaBu().length;
 $('#ndot').textContent=n||'';$('#ndot').style.display=n?'grid':'none';
 $('#content').innerHTML=scopeBar()+(tab==='lich'?lichTab():tab==='viec'?viecTab():nghiTab());
}
render();
</script>
</body>
</html>
