<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}
.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}
.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}
.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.flab{font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:-3px}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}.st2.v{background:#ede9fe;color:#5b21b6}
.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:150px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}tr.badrow{background:var(--red-soft)}
tr.grp td{background:#f8fafc;font-weight:700;font-size:11.5px}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.empty{padding:32px;text-align:center;color:var(--ink3)}
.mini{font-size:10.5px;color:var(--ink3);font-weight:400}
.nodata{color:var(--red);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:800px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}

/* ---------- LƯỚI LỊCH ---------- */
.gridw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
.lg{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
.lg th{position:sticky;top:0;z-index:2;background:#f8fafc;font-size:11px;padding:8px 6px;text-align:center;text-transform:none;letter-spacing:0}
.lg th.hom{background:#e0e7ff;color:#3730a3}
.lg td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.lg td.hr{background:#f8fafc;font-size:10.5px;color:var(--ink3);text-align:center;padding:4px 6px;white-space:nowrap;font-weight:700;position:sticky;left:0;z-index:1;min-width:74px}
.lg tr.buoi td{background:#eef2f7;font-size:10.5px;font-weight:700;color:var(--ink2);text-align:center;padding:3px}
.cell{min-height:62px;padding:5px 6px;font-size:11.5px;line-height:1.35;cursor:pointer;display:flex;flex-direction:column;justify-content:center;position:relative}
.cell:hover{background:var(--brand-soft)}
.cell.co{background:#fafbfc;cursor:default}
.cell b{font-weight:700}
.cell .g{color:var(--ink2);font-size:11px;font-weight:600;display:block;word-break:break-word}
.cell .g2{color:var(--ink3);font-size:10px;display:block}
.cell.dien{background:#f8fafc}
.cell.dien::after{content:"✓";position:absolute;top:3px;right:5px;color:var(--green);font-size:10px;font-weight:800}
.cell.nghi{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#eef2f7 6px,#eef2f7 12px);color:var(--ink3)}
.cell.huy{background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red)}
.cell.thay{background:var(--amber-soft);box-shadow:inset 0 0 0 2px #fbbf24}
.cell.doi{background:#ede9fe;box-shadow:inset 0 0 0 2px #a78bfa}
.cell.bu{background:var(--green-soft);box-shadow:inset 0 0 0 2px #6ee7b7}
.cell.chua{background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red)}
.ngn{font-size:9px;font-weight:800;border-radius:4px;padding:0 4px;margin-left:3px}
.ngn.t{background:#fef3c7;color:#92400e}.ngn.d{background:#ede9fe;color:#5b21b6}
.ngn.b{background:#dcfce7;color:#166534}.ngn.x{background:#e0e7ff;color:#3730a3}
.vrow{display:grid;grid-template-columns:1.5fr 1.7fr 1.3fr 1.1fr 1.6fr;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;font-size:12.5px}
.vrow:last-child{border-bottom:none}
.vrow.khan{background:var(--red-soft)}
.vrow.gap{background:var(--amber-soft)}
.hdrow{display:grid;grid-template-columns:1.5fr 1.7fr 1.3fr 1.1fr 1.6fr;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.uv{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
.uv:hover{border-color:var(--brand);background:var(--brand-soft)}
.uv.on{border-color:var(--brand);background:var(--brand-soft)}
.uv .sp{flex:1;min-width:0}
.uv.loai{opacity:.5;background:#fafbfc;cursor:not-allowed;border-style:dashed}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff}
.dtb{font-size:9px;font-weight:800;border-radius:4px;padding:0 4px;margin-left:3px;background:#e0e7ff;color:#3730a3}
.dtb.b{background:#fef3c7;color:#92400e}

/* YK-01 — nhãn trực tuyến (theo TIẾT) · ô thử deep-link */
.ngn.tt{background:#e0f2fe;color:#075985}
.dlsel{margin-left:auto;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:7px;padding:4px 8px;font-size:12px;max-width:340px}

</style>

/* sinh mẫu tuần bằng greedy đơn giản, kiểm trùng GV/lớp/phòng + thời gian di chuyển */
let TKB=[];
(function(){
 const THU=[2,3,4,5,6,7];
 const ban=(g,t,n,dt)=>{
  if(TKB.some(x=>x.gv===g&&x.thu===t&&x.tiet===n))return 1;
  return TKB.some(x=>x.gv===g&&x.thu===t&&DTGV[g]&&lop(x.lop).dt!==dt&&
    Math.abs(phut(tiet(n).bd)-phut(tiet(x.tiet).kt))<DICHUYEN&&
    Math.abs(phut(tiet(x.tiet).bd)-phut(tiet(n).kt))<DICHUYEN);
 };
 LOP.forEach(l=>Object.keys(CTR[l.k]).forEach(m=>{
  const g=PCM[l.id][m];if(!g)return;let con=CTR[l.k][m],guard=0;

     TKB.filter(z=>z.lop===l.id&&z.thu===x).length-TKB.filter(z=>z.lop===l.id&&z.thu===y).length||x-y);
   let dat=false;
   for(const t of days){

   Menu này là NGUỒN SỰ THẬT của cả ba — M4.9 chỉ đọc, không tự sửa. */
/* 5) phong_id BẮT BUỘC — một tiết hôm nay CHƯA GÁN PHÒNG (phòng chưa xếp xong).
      Không có phòng ⇒ M4.9 không ghép được ⇒ rơi vào 'Ngoài phạm vi' TRONG IM LẶNG. Chặn MỀM: vẫn lưu, nhưng đếm + cảnh báo. */
(function(){
 const x=LICH.find(z=>z.ngay===key(HOMNAY)&&z.lop==='6A2'&&z.tt==='dukien'&&!z.canThay&&z.tiet>=4)
   ||LICH.find(z=>z.ngay===key(HOMNAY)&&lop(z.lop).dt==='Điểm trường A'&&z.tt==='dukien'&&!z.canThay);
 if(x){x.ghiChuPhong='Phòng '+x.phong+' đang sửa mái — chưa chốt phòng thay thế';x.phong='';}
})();
/* 6) cờ truc_tuyen THEO TIẾT (không theo lớp, không theo phòng). Cố ý đặt ở tiết của lớp 7A2 → phòng P.202
      ĐÃ CÓ thiết bị ở M4.9: cờ trực tuyến THẮNG cả điểm chấm công (M4.9 §4f.7c). */
(function(){
 const x=LICH.find(z=>z.ngay===key(HOMNAY)&&z.lop==='7A2'&&z.tt==='dukien'&&!z.canThay&&z.tiet>=3);
 if(x){x.truc=1;x.trucGhi='Lớp học trực tuyến qua phòng họp trực tuyến — giáo viên đi tập huấn ở Sở';}
 const y=LICH.find(z=>z.ngay>key(HOMNAY)&&z.lop==='7A2'&&z.tt==='dukien'&&!z.truc&&!z.canThay&&z.nguon==='TKB');
 if(y){y.truc=1;y.trucGhi='Tiết ôn tập trực tuyến';}
})();
/* 7) ca DẠY THAY KHÔNG KHAI BÁO mà thiết bị vừa phát hiện — hàng đợi 'Lệch người' của M4.9 dẫn sang đây bằng
      /M4.7?ctx=<tiet_id>&action=tao&loai=day_thay&return=M4.9. Người thiết bị ghi nhận lấy trong số ứng viên
      HỢP LỆ của chính tiết đó (không bận, không nghỉ, kịp di chuyển) để dữ liệu mẫu không tự mâu thuẫn. */
let LECH_NGUOI=null;
/* ---- PHẠM VI: dữ liệu ngoài phạm vi KHÔNG có trong tập trả về ---- */
function xemDuoc(x){const r=R();
 if(r.pv==='own') return x.gv===r.gvid||x.gvGoc===r.gvid;
 /* YKNP 17/9 — Group NEO VÀO TIẾT (HDNP ⑦): môn của tiết thuộc tổ, KHÔNG phải tổ của người dạy.
    Bản cũ neo người (ns(x.gv).to) ⇒ GV dạy hai tổ lọt hết vào một TTCM, tiết Toán của GV Tổ KHTN không TTCM Toán nào thấy. */
 if(r.pv==='to')  return MONTO[x.mon]===r.to;
 if(r.pv==='branch') return lop(x.lop).dt===r.dt;
 return true}
const VIS=()=>LICH.filter(xemDuoc);

/* ================= HÀM NGHIỆP VỤ ================= */
/* KHUNG GIỜ TIẾT LÀ NGUỒN của cửa chặn cứng M4.9 ràng buộc 29: khoảng cách NHỎ NHẤT giữa giờ bắt đầu hai tiết
   liền nhau cùng buổi — DẪN XUẤT, không ai khai tay ở M4.9. Đổi KHUNG ở đây thì cửa chặn bên kia tự đổi. */
/* GY18-A: min trên MỌI bộ giờ của MỌI điểm trường — không phải của bộ đang xem, không phải của
   bộ đang chạy hôm nay. Cửa sổ nhận ở M4.9 khai MỘT con số cho cả năm nên nó phải hợp với mọi bộ;
   lấy theo bộ đang chạy thì đến ngày đổi mùa nó tự trở thành sai mà không ai đụng vào cấu hình nào. */
const GAP_TIET=(()=>{let m=999;
 Object.keys(BOGIO).forEach(dt=>dsBo(dt).forEach(b=>{
  for(let i=1;i<KHUNGTIET.length;i++){
   if(KHUNGTIET[i].b!==KHUNGTIET[i-1].b)continue;
   const d=phut(b.gio[KHUNGTIET[i].n][0])-phut(b.gio[KHUNGTIET[i-1].n][0]);
   if(d<m)m=d}}));
 return m})();
const thieuPhong=()=>VIS().filter(x=>!x.phong&&x.tt!=='nghi'&&x.tt!=='huy');
const conLai=x=>{const d=pd(x.ngay.split('-').reverse().join('/'));
 const mm=(d-HOMNAY)/60000+phut(gioCua(x)[0])-GIOHIENTAI;return Math.round(mm)};
const canThay=()=>VIS().filter(x=>x.canThay&&x.tt==='dukien').sort((a,b)=>conLai(a)-conLai(b));
const huyChuaBu=()=>VIS().filter(x=>x.tt==='huy'&&x.seBu&&!x.daBu);
/* de nghi huy dang cho PHT quyet — §4.5.2. Tiet VAN o 'dukien' (rang buoc 8c). */
const deNghiHuy=()=>VIS().filter(x=>x.tt==='dukien'&&x.deNghiHuy);
const soThayThang=g=>LICH.filter(x=>x.gv===g&&x.nguon==='Dạy thay').length;

/* gợi ý người dạy thay — 3 tầng + loại trừ */
function goiY(x){
 const L=lop(x.lop),toMon=MONTO[x.mon];
 return GV_NS.map(p=>{
  const day=(MONGV[p.id]||[]).includes(x.mon);
  const cungTo=p.to===toMon;
  const ban=LICH.find(z=>z.gv===p.id&&z.ngay===x.ngay&&z.tiet===x.tiet&&z.tt!=='nghi'&&z.id!==x.id);
  /* đang vắng = có bản ghi vắng CÓ HIỆU LỰC phủ buổi đó (đơn · báo vắng · đợt đào tạo · tạm nghỉ) — không đọc «đơn đã duyệt» */
  const vg=vangCua(p.id,x.ngay,buoiCua(x.tiet));const nghi=vg.length?vg[0]:null;
  /* kề tiết ở điểm trường khác -> không kịp di chuyển */
  const ke=LICH.find(z=>z.gv===p.id&&z.ngay===x.ngay&&lop(z.lop).dt!==L.dt&&
    (Math.abs(phut(tiet(x.tiet).bd)-phut(tiet(z.tiet).kt))<DICHUYEN||
     Math.abs(phut(tiet(z.tiet).bd)-phut(tiet(x.tiet).kt))<DICHUYEN));
  let loai='',hang=9;
  /* F3 — luật HIỆN CÓ, không nới (⏳ P-1): tiết phải thuộc tổ mình (đã lọc bằng phạm vi dữ liệu) VÀ người dạy thay phải trong tổ mình */
  if(R().pv==='to'&&p.to!==R().to) loai=`Ngoài ${TO[R().to]} — Tổ trưởng chọn người dạy thay trong tổ mình; cần người tổ khác thì chuyển Phó HT điểm trường`;
  else if(ban) loai=`Đang dạy ${ban.lop} cùng tiết`;
  else if(nghi) loai=`Đang vắng — ${TEN_NGUON_VANG[nghi.loai]} ${nghi.id}`;
  else if(ke) loai=`Có tiết ở ${lop(ke.lop).dt} tiết ${ke.tiet} — không kịp di chuyển (cần ${DICHUYEN} phút)`;
  else if(day&&cungTo)hang=1; else if(day)hang=2; else if(cungTo)hang=3; else loai='Không cùng môn, không cùng tổ';
  return {p,hang,loai,thay:soThayThang(p.id),day,cungTo};
 }).sort((a,b)=>a.hang-b.hang||(DTGV[a.p.id]===L.dt?0:1)-(DTGV[b.p.id]===L.dt?0:1)||a.thay-b.thay);
}
const hangTen=h=>['','Cùng môn, cùng tổ','Cùng môn, khác tổ','Khác môn, cùng tổ — dạy trông'][h]||'';

/* ================= TRẠNG THÁI ================= */
let tab='lich',cheDo='ngay',curNgay=key(HOMNAY),curDT='Điểm trường A',curAi='6A1',aiLoai='lop',curTiet=null,tuanBD=key(TUAN_BD);
function dtHien(){const r=R();return r.pv==='branch'?r.dt:curDT}

function dlink(menu,label,ctx){
 if(!R().mchu.includes(menu))
  return `<span class="rolnk off" title="Vai trò hiện tại không có quyền tại ${menu}">🔗 ${menu}</span>`;
 return `<button class="rolnk" data-x="dl" data-m="${menu}" data-c="${ctx||''}">↗ ${label}</button>`;
}
function sidebar(){
 const a=R().menu,full=a==='all';
 const n=canThay().length+huyChuaBu().length+deNghiHuy().length+thieuPhong().length;
 $('#side').innerHTML=NAV.map(([id,nm,items])=>{const on=full||id===''||a.includes(id);
  return `<div class="sgrp">${nm}</div>`+items.map(it=>{const cu=it[0]==='M4.7';
   return `<div class="snav ${cu?'on':''} ${on?'':'off'}">
    <span style="font-size:10.5px;opacity:.55;min-width:32px">${it[0]}</span>
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it[1]}</span>
    ${cu&&n?`<span class="nb">${n}</span>`:''}</div>`}).join('')}).join('');
}
function tabList(){
 const r=R(),t=[['lich','Lịch giảng dạy','',0]];
 if(r.pv!=='own'){const n=canThay().length+huyChuaBu().length+deNghiHuy().length;
  t.push(['viec','Việc cần xử lý',n,n?1:0]);
  /* NP-5: T4 Giáo viên vắng đứng NGAY SAU Việc cần xử lý. Mã số T4 theo thứ tự ra đời — không đánh số lại T3 Lịch nghỉ */
  const nv=dsVang().filter(c=>c.chua).length;
  t.push(['vang','Giáo viên vắng',nv,nv?1:0]);
  t.push(['nghi','Lịch nghỉ',NGHI.length,0]);}
 return t;
}
function tabs(){
 const L=tabList();if(!L.some(x=>x[0]===tab))tab=L[0][0];
 $('#tabs').innerHTML=L.map(([k,n,b,red])=>
  `<button class="tab1 ${tab===k?'on':''}" data-tab="${k}">${n}${b!==''?`<span class="b ${red?'r':''}">${b}</span>`:''}</button>`).join('');
}
function scopeBar(){
 const r=R();let s;
 if(r.pv==='own')       s=`Bạn thấy <b>lịch dạy của chính mình</b> — chỉ đọc. Giáo viên không thao tác ở menu này, xem lịch cá nhân tại ${dlink('M2.1','M2.1')}.`;
 else if(r.pv==='to')   s=`Phạm vi <b>Group — ${TO[r.to]}</b>, <b>neo vào TIẾT</b>: bạn thấy và xử lý <b>tiết có môn thuộc tổ mình</b>, kể cả tiết của giáo viên tổ khác; người dạy thay chọn trong tổ mình.`;
 else if(r.pv==='branch')s=`Phạm vi <b>Branch — ${r.dt}</b>. Bộ chọn Điểm trường đã <b>khoá</b>.`;
 else                   s=`Phạm vi <b>School</b> — mọi điểm trường.`;
 return `<div class="scope">🔎 <span class="sp">${s}
   Đây là <b>instance tiết học theo ngày</b> — đổi ở đây <b>chỉ ảnh hưởng đúng ngày đó</b>; đổi mẫu tuần thì sang ${dlink('M4.6','M4.6')}.</span>
   <span class="chip">Hôm nay ${d2s(HOMNAY)}</span></div>`;
}

/* ================= T1 — LỊCH GIẢNG DẠY ================= */
const dtBadge=lId=>`<span class="dtb ${lop(lId).dt==='Điểm trường B'?'b':''}">${dtMa[lop(lId).dt]}</span>`;
/* kieu: 'lop' lưới theo lớp và lưới theo ngày · 'gv' theo giáo viên · 'phong' theo phòng */
function oCell(x,kieu){
 kieu=kieu||'lop';
 if(!x) return `<div class="cell co"></div>`;
 const cls=x.tt==='nghi'?'nghi':x.tt==='huy'?'huy':x.canThay?'chua'
   :x.nguon==='Dạy thay'?'thay':x.nguon==='Đổi tiết'?'doi':x.nguon==='Dạy bù'?'bu':x.tt==='dien'?'dien':'';
 const ng=x.nguon==='Dạy thay'?'<span class="ngn t">🔁 thay</span>':x.nguon==='Đổi tiết'?'<span class="ngn d">⇄ đổi</span>'
   :x.nguon==='Dạy bù'?'<span class="ngn b">➕ bù</span>':x.nguon==='Thêm thủ công'?'<span class="ngn x">✋</span>':'';
 /* nhãn thứ hai, ĐỘC LẬP với nguồn: 🖥 trực tuyến (YK-01) — hiện ở CẢ HAI chế độ lưới */
 const tr=x.truc?'<span class="ngn tt">🖥 trực tuyến</span>':'';
 const ph=x.phong?x.phong:'<b class="nodata">⛔ chưa gán phòng</b>';
 const dau=kieu==='lop'?`${x.mon}${ng}`
   :kieu==='gv'?`${x.lop}${dtBadge(x.lop)}${ng}`
   :`${x.lop}${dtBadge(x.lop)}${ng}`;
 if(x.tt==='nghi')
  return `<div class="cell nghi" data-tiet="${x.id}"><b>${dau}</b>
    <span class="g2">Nghỉ — ${nghiCua(pd(x.ngay.split('-').reverse().join('/')),x.lop).loai}</span></div>`;
 let than;
 if(x.canThay)
  than=`<span class="g nodata">⛔ Chưa có giáo viên</span><span class="g2">${ns(x.gvGoc).n} vắng · ${(x.vang[0]||{}).id||''}</span>`;
 else if(kieu==='lop')
  than=`<span class="g">${ns(x.gv).n}</span>`+
   (x.nguon==='Dạy thay'?`<span class="g2">thay cho ${ns(x.gvGoc).n}</span>`:`<span class="g2">${ph}</span>`);
 else if(kieu==='gv')
  than=`<span class="g">${x.mon}</span><span class="g2">${ph}</span>`;
 else
  than=`<span class="g">${x.mon}</span><span class="g2">${ns(x.gv).n}</span>${x.phong?'':'<span class="g2">'+ph+'</span>'}`;
 return `<div class="cell ${cls}" data-tiet="${x.id}"><b>${dau}</b>${than}
   ${x.tt==='huy'?`<span class="g2 nodata">HỦY · ${x.cachXuLy}</span>`:''}${tr?'<span class="g2">'+tr+'</span>':''}</div>`;
}
/* giờ hiển thị trên ĐẦU DÒNG của lưới — lấy từ chính các instance đang vẽ ở dòng đó,
   nên nó phản ánh cả bản chụp của tiết đã diễn ra (GY18-A §3b.4), không phải một bảng giờ chung. */
function gioDong(xs,dt,ngayKeys,n){
 const set=[...new Set(xs.map(x=>gioCua(x)[0]))];
 if(set.length)return set.sort().join(' · ');
 const g=ngayKeys.map(k=>{const b=boTheoNgay(dt,pd(k.split('-').reverse().join('/')));return b?b.gio[n][0]:''}).filter(Boolean);
 return [...new Set(g)].sort().join(' · ');
}
/* tiết đã ĐÓNG BĂNG giờ: đã diễn ra, hoặc đã có kết luận chấm công (§3b.4) */
const daChotGio=x=>x.tt==='dien'||!!x.ccChot;
function khungHien(loc){
 const cs=new Set(VIS().filter(loc).map(x=>tiet(x.tiet).b));
 const k=KHUNG.filter(x=>cs.has(x.b));
 return k.length?k:KHUNG.filter(x=>x.b==='S');
}
function lichTab(){
 const r=R(),dt=dtHien();
 const ngay=pd(curNgay.split('-').reverse().join('/'));
 const ls=LOP.filter(l=>l.dt===dt);
 const bar=`<div class="bar">
   <span class="seg">
     <button class="${cheDo==='ngay'?'on':''}" data-cd="ngay">📅 Theo ngày</button>
     <button class="${cheDo==='tuan'?'on':''}" data-cd="tuan">🗓 Theo tuần</button></span>
   ${cheDo==='ngay'?`<button class="btn sm" data-x="ng-tr">←</button>
     <input class="fs" id="fngay" value="${d2s(ngay)}" style="width:110px;text-align:center">
     <button class="btn sm" data-x="ng-sau">→</button>
     ${curNgay!==key(HOMNAY)?`<button class="btn xs" data-x="ve-homnay">Hôm nay</button>`:'<span class="chip">Hôm nay</span>'}`
    :`<button class="btn sm" data-x="tuan-tr">←</button>
      <span class="chip">Tuần ${d2s(pd(tuanBD.split('-').reverse().join('/')))}</span>
      <button class="btn sm" data-x="tuan-sau">→</button>
      ${tuanBD!==key(TUAN_BD)?`<button class="btn xs" data-x="ve-tuan">Tuần này</button>`:''}
      <span class="flab">${aiLoai==='lop'?'Lớp':aiLoai==='gv'?'Giáo viên':'Phòng'}</span>
      <select class="fs" id="fai" ${r.pv==='own'?'disabled':''}>${chotAi().map(([v,n])=>`<option value="${v}" ${curAi===v?'selected':''}>${n}</option>`).join('')}</select>
      ${r.pv==='own'?'<span class="chip">🔒 chỉ lịch của bạn</span>'
        :`<span class="seg">${[['lop','Lớp'],['gv','Giáo viên'],['phong','Phòng']].map(([k,n])=>
        `<button class="${aiLoai===k?'on':''}" data-al="${k}">${n}</button>`).join('')}</span>`}`}
   <span class="flab">Điểm trường</span>
   <select class="fs" id="fdt" ${r.pv==='branch'?'disabled':''}>${DTS.map(d=>`<option ${curDT===d?'selected':''}>${d}</option>`).join('')}</select>
   ${co('sinh')?`<button class="btn" data-x="sinh-lai">🔄 Sinh lại từ TKB</button>`:''}
   ${co('sinh')&&nhieuBo(dtHien())?`<button class="btn" data-x="doi-gio" title="M4.6 §8.2b ký ban hành một bộ giờ — điểm đến của deep-link M4.6 → M4.7?nhom=doi_gio">⏰ Bộ giờ vừa đổi ở M4.6</button>`:''}
   ${co('xuat')?`<button class="btn" data-x="xuat">⬇ Xuất</button>`:''}
   </div>`;
 const chuGiai=`<div class="lgd" style="border:0;padding:0 0 10px">
   <span class="chip" style="background:var(--red-soft);border-color:#fecaca">⛔ Chưa có giáo viên</span>
   <span class="chip" style="background:var(--amber-soft);border-color:#fde68a">🔁 Dạy thay</span>
   <span class="chip" style="background:#ede9fe;border-color:#ddd6fe">⇄ Đổi tiết</span>
   <span class="chip" style="background:var(--green-soft);border-color:#a7f3d0">➕ Dạy bù</span>
   <span class="chip" style="background:var(--red-soft);border-color:#fecaca">HỦY</span>
   <span class="chip">Nghỉ</span><span class="chip">✓ Đã diễn ra</span>
   <span class="chip" style="background:#e0f2fe;border-color:#bae6fd">🖥 trực tuyến</span>
   <span class="chip" title="M4.9 ràng buộc 29 — cửa sổ nhận trước + sau phải nhỏ hơn con số này">⏱ Hai tiết liền nhau cách nhau <b>${GAP_TIET}′</b> — <b>min trên MỌI bộ giờ</b>, là <b>cửa chặn cứng của M4.9</b></span>
   ${nhieuBo(dtHien())?`<span class="chip" title="M4.6 §8.1c — giờ của một tiết giải theo NGÀY của tiết đó (§3b.4)">⏰ ${dtHien()} có <b>${dsBo(dtHien()).length} bộ giờ</b>: ${dsBo(dtHien()).map(b=>b.ten).join(' · ')}</span>`:''}</div>`;
 const tp=thieuPhong().filter(x=>cheDo==='ngay'?x.ngay===curNgay&&lop(x.lop).dt===dtHien():true);
 const canhPhong=tp.length?`<div class="danger">⛔ <b>${tp.length} tiết chưa gán phòng</b>${cheDo==='ngay'?' trong ngày đang xem':' trong phạm vi đang xem'}.
   Tầng ghép của <b>M4.9</b> ghép chấm công theo <b>phòng × khung giờ × giáo viên thực dạy</b> — tiết không có phòng <b>không ghép được</b>
   và rơi vào <i>Ngoài phạm vi</i> <b>trong im lặng</b>, không sinh cảnh báo nào bên đó.
   <div style="margin-top:6px">${tp.map(x=>`<button class="btn xs" data-x="toi-tiet" data-i="${x.id}" style="margin:0 5px 4px 0">→ ${x.lop} · ${x.mon} · ${d2s(ngayCuaTiet(x))} tiết ${x.tiet} — gán phòng</button>`).join('')}</div></div>`:'';

 let luoi='';
 if(cheDo==='ngay'){
  const ngh=nghiCua(ngay,ls[0]?ls[0].id:'');
  luoi=(ngh?`<div class="warn">📌 <b>${d2s(ngay)} — ${ngh.loai}:</b> ${ngh.ly}. Mọi tiết trong phạm vi <b>${ngh.pv==='Toàn trường'?'toàn trường':ngh.pvId}</b> chuyển <b>Nghỉ</b>, không sinh sổ đầu bài và điểm danh.</div>`:'')
   +`<div class="gridw"><table class="lg">
    <thead><tr><th style="width:76px">${d2s(ngay)}</th>${ls.map(l=>`<th>${l.id}</th>`).join('')}</tr></thead>
    <tbody>${(()=>{const KH=khungHien(x=>x.ngay===curNgay&&lop(x.lop).dt===dt);return KH.map((k,i)=>{
      const sep=i>0&&KH[i-1].b!==k.b?`<tr class="buoi"><td colspan="${ls.length+1}">— nghỉ trưa —</td></tr>`:'';
      const xs=VIS().filter(x=>x.ngay===curNgay&&lop(x.lop).dt===dt&&x.tiet===k.n);
      return sep+`<tr><td class="hr">Tiết ${k.n}<div class="mini">${gioDong(xs,dt,[curNgay],k.n)}</div></td>
       ${ls.map(l=>`<td>${oCell(lc(curNgay,l.id,k.n))}</td>`).join('')}</tr>`}).join('')})()}
    </tbody></table></div>`;
 } else {
  const bd=pd(tuanBD.split('-').reverse().join('/'));
  const ngs=[0,1,2,3,4,5].map(i=>them(bd,i));
  chotAi();
  const oc=(d,n)=>VIS().filter(x=>x.ngay===key(d)&&x.tiet===n&&(
    aiLoai==='lop'?x.lop===curAi:aiLoai==='gv'?String(x.gv)===curAi||String(x.gvGoc)===curAi:x.phong===curAi))[0];
  luoi=`<div class="gridw"><table class="lg">
   <thead><tr><th style="width:76px"></th>${ngs.map(d=>{const b=boTheoNgay(dtHien(),d);
     return `<th class="${key(d)===key(HOMNAY)?'hom':''}">${['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]}<div class="mini">${p2(d.getDate())}/${p2(d.getMonth()+1)}</div>
      ${nhieuBo(dtHien())&&b?`<div class="mini2">${b.ten}</div>`:''}</th>`}).join('')}</tr></thead>
   <tbody>${(()=>{const loc=x=>ngs.some(d=>key(d)===x.ngay)&&(
      aiLoai==='lop'?x.lop===curAi:aiLoai==='gv'?String(x.gv)===curAi||String(x.gvGoc)===curAi:x.phong===curAi);
     const KH=khungHien(loc);
     return KH.map((k,i)=>{
     const sep=i>0&&KH[i-1].b!==k.b?`<tr class="buoi"><td colspan="7">— nghỉ trưa —</td></tr>`:'';
     const xs=VIS().filter(x=>loc(x)&&x.tiet===k.n);
     return sep+`<tr><td class="hr">Tiết ${k.n}<div class="mini">${gioDong(xs,dtHien(),ngs.map(key),k.n)}</div></td>
      ${ngs.map(d=>`<td>${oCell(oc(d,k.n),aiLoai)}</td>`).join('')}</tr>`}).join('')})()}
   </tbody></table></div>`;
 }
 return bar+chuGiai+canhPhong+luoi+(curTiet?panelTiet():'');
}
function chotAi(){const d=dsAi();if(!d.length)return d;
 if(!d.some(x=>x[0]===curAi))curAi=d[0][0];return d}
function dsAi(){
 const dt=dtHien();
 if(aiLoai==='lop')return LOP.filter(l=>l.dt===dt).map(l=>[l.id,l.id]);
 if(aiLoai==='gv') return NS.filter(p=>VIS().some(x=>x.gv===p.id)).map(p=>[String(p.id),p.n+' — '+DTGV[p.id]]);
 return [...new Set(VIS().filter(x=>lop(x.lop).dt===dt).map(x=>x.phong))].sort().map(p=>[p,p]);
}

 const kP=`<div class="listw" style="margin-bottom:13px">

     <span class="st2 ${tp.length?'r':'o'}">${tp.length}</span></div>

/* ===== NGUONG CANH BAO 'CHUA BU' — MOT THAM SO DUY NHAT (chot 7/9/2026) =====
   Dung chung cho T2 (khoi 'Tiet bi huy chua bo tri day bu') va T3 (cot 'Chua bu').
   Nguon: nh3.3.5 §9.2 — qua 7 ngay ke tu ngay tiet bi huy thi canh bao.
   Hai tab doc CUNG MOT TAP TIET duoi hai truc khac nhau; dat hai nguong thi cung
   mot tiet DO o tab nay ma khong do o tab kia — M4.7 §6.3.1, rang buoc 13c. */
const NGUONG_BU_NGAY=7;
const ngayCuaTiet=x=>pd(x.ngay.split('-').reverse().join('/'));
const soNgayTu=d=>Math.round((HOMNAY-d)/86400000);
const quaHanBu=x=>x.tt==='huy'&&!x.daBu&&soNgayTu(ngayCuaTiet(x))>NGUONG_BU_NGAY;

/* ================= T3 — LỊCH NGHỈ ================= */
function nghiTab(){
 const quaKhu=n=>pd(n.den)<HOMNAY;
 const daBatDau=n=>pd(n.tu)<=HOMNAY&&pd(n.den)>=HOMNAY;
 /* lát cắt theo TIẾT — thứ M10.9 không có, và là lý do tab này còn tồn tại (§6.3) */
 const tietCua=n=>{const t1=pd(n.tu),t2=pd(n.den);
   return LICH.filter(z=>{const d=pd(z.ngay.split('-').reverse().join('/'));
     return d>=t1&&d<=t2&&(n.pv==='Toàn trường'||true)});};
 return `<div class="bar">
   <div class="sum"><span><b>${NGHI.length}</b> đợt nghỉ trong năm học</span></div>
   <button class="btn" data-x="di-m109">↗ Khai báo tại M10.9</button></div>
  <div class="ro"><b>🔗 Tab này CHỈ ĐỌC.</b> Chủ sở hữu 🔒 duy nhất của mọi đợt nghỉ là
   ${dlink('M10.9','M10.9 Lịch nghỉ &amp; Ngày đặc biệt')} — ràng buộc <b>R7</b>:
   <i>"Không menu nào ngoài M10.9 được tạo, sửa hoặc xóa một ngày nghỉ — kể cả M6.8 và M4.7."</i>
   <br>Menu này <b>không khai báo, không sửa, không rút ngắn, không xóa</b> đợt nghỉ nào —
   <b>kể cả với Hiệu trưởng</b>. Muốn khai thì sang M10.9; đó là <b>D3</b>, không phải cắt quyền.
   <br>⭐ Cái tab này có mà M10.9 không có: <b>lát cắt theo TIẾT</b> — đợt nghỉ cắt bao nhiêu tiết,
   đã bù bao nhiêu, và <b>còn bao nhiêu tiết chưa bù</b>. Từ đó bấm sang <b>Xếp dạy bù</b> —
   thao tác <b>vẫn thuộc menu này</b> (M10.9 §1: "Học bù → M4.7").</div>
  <div class="listw"><table>
   <thead><tr><th>Loại · tên đợt</th><th>Từ — đến</th><th>Phạm vi</th><th>Ba cờ hệ quả</th>
    <th class="num">Tiết Nghỉ</th><th class="num">Đã bù</th><th class="num">Chưa bù</th><th></th></tr></thead>
   <tbody>${NGHI.map(n=>{
    const ts=tietCua(n),nghi=ts.filter(z=>z.tt==='nghi').length;
    const huy=ts.filter(z=>z.tt==='huy'),bu=huy.filter(z=>z.daBu).length,chuaBu=huy.length-bu;
    const qh=huy.filter(quaHanBu).length;   /* nguong dung chung voi T2 — §6.3.1 */
    return `<tr class="${quaKhu(n)?'':daBatDau(n)?'warnrow':''}">
    <td><b>${n.loai}</b>${n.nguon?`<div class="mini">căn cứ ${n.nguon}</div>`:''}
      <div class="mini" style="font-weight:400">${n.ly}</div></td>
    <td>${n.tu}${n.den!==n.tu?' — '+n.den:''}<div class="mini">${quaKhu(n)?'đã qua':daBatDau(n)?'đang diễn ra':'sắp tới'}</div></td>
    <td>${n.pv}${n.pvId?`<div class="mini">${n.pvId}</div>`:''}</td>
    <td class="mini">📕 không dạy TKB<br>🎒 HS ${n.loai==='Sự kiện toàn trường'?'ĐẾN':'nghỉ'}
      <br>💼 NS ${n.loai==='Nghỉ đột xuất'?'nghỉ':'ĐI LÀM'}</td>
    <td class="num">${nghi}</td>
    <td class="num">${bu}</td>
    <td class="num">${chuaBu?`<b style="color:var(--red)">${chuaBu}</b>`+(qh?`<div class="mini" style="color:var(--red)">⚠ ${qh} quá ${NGUONG_BU_NGAY} ngày</div>`:''):'0'}</td>
    <td style="text-align:right">

      <button class="btn xs" data-x="di-m109" data-i="${n.id}">↗ M10.9</button></td></tr>`}).join('')}
   </tbody></table>
   <div class="lgd"><span class="chip">Khai báo · sửa · rút ngắn · xóa: đều ở M10.9</span>
    <span class="chip">Cột "Chưa bù" là việc của menu này — R13b</span>
    <span class="chip">Ngưỡng quá ${NGUONG_BU_NGAY} ngày <b>dùng chung với tab Việc cần xử lý</b> — R13c</span>
    <span class="chip">Ngày nghỉ = M10.9 · Tiết bù = M4.7</span></div></div>`;
}

/* ================= T4 — GIÁO VIÊN VẮNG (YKNP 17/9/2026) =================
   TRỤC NHÌN đối xứng T3 Lịch nghỉ: đợt vắng của NGƯỜI ↔ đợt nghỉ của TRƯỜNG.
   KHÔNG có form xử lý riêng — bấm tiết là mở panel F2 hiện có.
   Hai thao tác ghi DUY NHẤT của tab: ⚡ Báo vắng · ↩ Đề nghị đổi ngày. */
const nhanVang=x=>(x.vang||[]).map(v=>TEN_NGUON_VANG[v.loai]+' '+v.id).join(' · ');
function nguoiXuLy(x){const t=MONTO[x.mon];
 return TTCM_CUA[t]?`${ns(TTCM_CUA[t]).n} (TTCM ${TO[t]})`:`Phó HT ${lop(x.lop).dt} (${TO[t]||'tổ'} chưa phân TTCM)`}
function lyDoMo(x){const r=R();
 if(r.pv==='to')return `thuộc ${TO[MONTO[x.mon]]||'tổ khác'} · ${nguoiXuLy(x)} xử lý`;
 if(r.pv==='branch')return `thuộc ${lop(x.lop).dt} · Phó HT điểm trường đó xử lý`;
 if(r.pv==='own')return 'ngoài lịch của bạn';return ''}
const tenNguonPS=n=>!n?'':n.loai==='giao_vien_vang'?'Giáo viên vắng · '+(n.don_nghi_id||n.bao_vang_id||n.dot_tap_huan_id||n.tam_nghi_id)
 :n.loai==='doi_tiet_thoa_thuan'?'Đổi tiết theo thỏa thuận':n.loai==='su_kien_truong'?'Sự kiện trường · '+n.su_kien_id
 :n.loai==='lech_nguoi'?'Lệch người — từ M4.9':'Khác · '+n.ghi_ro;
function ghiLichSu(x,viec,truoc,sau,nguon){
 const luc=k2s(key(HOMNAY))+' '+p2(Math.floor(GIOHIENTAI/60))+':'+p2(GIOHIENTAI%60);
 x.lichSu=(x.lichSu||[]).concat({luc,ai:R().n.split(' — ')[0],viec,truoc,sau,nguon});x.nguonPS=nguon;
}

/* mỗi bản ghi vắng = một thẻ; tiết bị ảnh hưởng = tiết của người trong đúng ngày/buổi của bản ghi (mọi tổ, mọi điểm trường) */
function dsVang(){
 const out=[];
 const tietCuaNguoi=(nsId,loc)=>LICH.filter(x=>x.gvGoc===nsId&&x.tt!=='nghi'&&loc(x.ngay,buoiCua(x.tiet)))
   .sort((a,b)=>a.ngay<b.ngay?-1:a.ngay>b.ngay?1:a.tiet-b.tiet);
 DON.forEach(d=>{const ds=d.ngay.map(z=>z.ngay);
  out.push({loai:'don',id:d.id,rec:d,ns:d.ns,tu:ds[0],den:ds[ds.length-1],
   ts:tietCuaNguoi(d.ns,(n,b)=>{const z=d.ngay.find(q=>q.ngay===n);return !!z&&phuBuoi(z.buoi,b)})})});
 BAOVANG.forEach(b=>out.push({loai:'bao_vang',id:b.id,rec:b,ns:b.nhan_su_id,tu:b.tu.ngay,den:b.den.ngay,ts:tietCuaNguoi(b.nhan_su_id,(n,bu)=>bvPhu(b,n,bu))}));
 DOT.forEach(t=>t.nguoi.forEach(p=>out.push({loai:'dot',id:t.id,rec:t,ns:p,tu:t.tu,den:t.den,ts:tietCuaNguoi(p,n=>n>=t.tu&&n<=t.den)})));
 TAMNGHI.forEach(t=>out.push({loai:'tam_nghi',id:t.id,rec:t,ns:t.ns,tu:t.tu,den:t.den,ts:tietCuaNguoi(t.ns,n=>n>=t.tu&&n<=t.den)}));
 /* 🛑 thẻ chỉ hiện khi có ≥ 1 tiết TRONG PHẠM VI — nhân sự không dạy (S9) không bao giờ sinh việc ở menu này */
 return out.filter(c=>c.ts.some(xemDuoc)).map(c=>{
  c.chua=c.ts.filter(x=>xemDuoc(x)&&x.canThay).length;
  c.daQua=c.den<key(HOMNAY);return c})
  .sort((a,b)=>(b.chua?1:0)-(a.chua?1:0)||(a.daQua?1:0)-(b.daQua?1:0)||(a.tu<b.tu?-1:1));
}
let locVang='tat_ca',vangChon='';
function chipTiet(x,c){
 const ngoai=!xemDuoc(x);
 const dau=`T${x.tiet} · <b>${x.lop}</b>${dtBadge(x.lop)} ${x.mon}`;
 if(ngoai)return `<span class="tchip mo" title="Ngoài phạm vi — chỉ hiện tên người xử lý">${dau}<i>${lyDoMo(x)}</i></span>`;
 let than,cls='';
 if(x.tt==='dien'){than=x.gv!==x.gvGoc?`✓ đã dạy — 🔁 ${ns(x.gv).n}`:'✓ đã dạy';cls='xong'}
 else if(x.tt==='huy'){than=`HỦY · ${x.cachXuLy}`;cls='huy'}
 else if(x.canThay){than='⛔ chưa xếp người';cls='chua'}
 else if(x.nguon==='Dạy thay'){than=`🔁 ${ns(x.gv).n}`+(x.giuNguoi?' · giữ người':'');cls='thay'}
 else if(x.baoHuy){than=`↩ đã gỡ ${ns(x.baoHuy.nguoi).n} — GV gốc dạy`;cls='rut'}
 else {than='GV gốc dạy';cls='rut'}
 const sat=(x.baoHuy&&x.baoHuy.satGio)||(x.giuNguoi&&x.giuNguoi.satGio)?'<span class="st2 r">sát giờ</span>':'';
 const xn=x.canThay&&x.deXuat&&co('xacnhan')?`<button class="btn xs g" data-x="xn-dexuat" data-i="${x.id}">✓ Xác nhận ${ns(x.deXuat).n}</button>`:'';
 return `<span class="tchip ${cls} ${curTiet===x.id?'on':''}" data-tiet="${x.id}">${dau}<i>${than}</i>${sat}${xn}</span>`;
}
function theVang(c){
 const r=c.rec,p=ns(c.ns),hom=key(HOMNAY);
 let nguon='',nhan=[],hanhDong=[];
 if(c.loai==='don'){
  nguon=`<span class="tg a">🔗 M4.8 · Đơn nghỉ ${r.id}</span> ${r.loai}`;
  if(r.nguoi_nhap_ho)nhan.push(`<span class="st2 v">nhập hộ — ${ns(r.nguoi_nhap_ho).n}</span>`);
  if(r.trang_thai==='da_rut')nhan.push('<span class="st2 n">Đã rút cả đơn</span>');
  else if(r.ngay.some(z=>z.da_rut))nhan.push('<span class="st2 w">Rút một phần</span>');
  else nhan.push('<span class="st2 o">Có hiệu lực</span>');
  if(r.quyet_dinh&&r.quyet_dinh.can_ky&&!r.quyet_dinh.da_ky_luc)nhan.push('<span class="st2 w">🔏 Quyết định chờ HT ký — không chặn nghỉ</span>');
  if(r.de_nghi_doi_ngay)nhan.push(`<span class="st2 b">↩ Đã đề nghị đổi ngày</span>`);
  if(co('doingay')&&r.trang_thai==='co_hieu_luc')hanhDong.push(`<button class="btn xs" data-x="mo-doingay" data-i="${r.id}">↩ Đề nghị đổi ngày</button>`);
  hanhDong.push(dlink('M4.8','M4.8',r.id));
 } else if(c.loai==='bao_vang'){
  nguon=`<span class="tg b">⚡ Báo vắng ${r.id}</span> ${KENH[r.kenh]} · báo bởi <b>${ns(r.nguoi_bao_id).n}</b> lúc ${k2s(r.luc.split(' ')[0])} ${r.luc.split(' ')[1]}`;
  if(r.don_phu_id)nhan.push(`<span class="st2 o">🔗 Máy đã ghép đơn ${r.don_phu_id}</span>`);
  else if(vangChuaDon(r))nhan.push(`<span class="st2 r">⚠ Vắng chưa có đơn — quá ${NGUONG_CHUA_DON_M49} ngày làm việc</span> ${dlink('M4.9','hàng đợi M4.9')}`);
  else nhan.push('<span class="st2 w">Chưa có đơn phủ</span>');
 } else if(c.loai==='dot'){
  nguon=`<span class="tg g">🔗 M5.6 · Đợt ${r.id}</span> ${r.ten}`;hanhDong.push(dlink('M5.6','M5.6',r.id));
 } else {
  nguon=`<span class="tg c">🔗 M4.2 · Tạm nghỉ ${r.id}</span> ${r.loai} · đến ${k2s(r.den)}`;hanhDong.push(dlink('M4.2','M4.2',r.id));
 }
 const ngays=[...new Set(c.ts.map(x=>x.ngay))];
 const dongNgay=ngays.map(n=>{
  const z=c.loai==='don'?r.ngay.find(q=>q.ngay===n):null;
  const rut=z&&z.da_rut?`<span class="st2 ${z.vung===2?'w':'n'}">↩ rút ${z.vung===2?'🟡':'⚪'} ${z.rut_luc.split(' ')[1]} ${k2s(z.rut_luc.split(' ')[0])}</span>`
    +(z.vung===2&&z.ly_do_rut?`<span class="mini">«${z.ly_do_rut}»</span>`:'')+(z.giu_nguoi_day_thay?'<span class="st2 b">giữ nguyên người dạy thay — ngày này không Vắng có phép (M4.9)</span>':''):'';
  const ts=c.ts.filter(x=>x.ngay===n);
  return `<div class="vday ${n<hom?'qua':''}"><div class="vd">${['CN','T2','T3','T4','T5','T6','T7'][k2d(n).getDay()]} ${k2s(n).slice(0,5)}${z?`<div class="mini">${BUOI[z.buoi]}</div>`:''}</div>
   <div class="vt">${rut}${ts.map(x=>chipTiet(x,c)).join('')}</div></div>`}).join('');
 const tomTat=c.chua?`<span class="st2 r">${c.chua} tiết chưa xếp</span>`:'<span class="st2 o">đã xử lý hết trong phạm vi</span>';
 return `<div class="card vcard ${vangChon===c.id?'chon':''}" id="the-${c.id}">
  <div class="ch"><b>${p.n}</b><span class="mini">${TO[p.to]||''} · ${DTGV[c.ns]||''}</span>${nguon}<span class="sp"></span>${tomTat}</div>
  <div class="vmeta">${k2s(c.tu)}${c.den!==c.tu?' → '+(c.loai==='tam_nghi'?k2s(c.den):k2s(c.den)):''} ${nhan.join(' ')}
   ${c.loai==='don'&&r.gui?`<span class="mini">gửi: ${r.gui}</span>`:''}
   ${c.loai==='bao_vang'&&r.ghi_chu?`<span class="mini">«${r.ghi_chu}»</span>`:''}
   ${c.loai==='don'&&r.de_xuat?`<div class="mini" style="width:100%">Đề xuất người dạy thay: <b>${ns(r.de_xuat).n}</b> — «${r.thoa_thuan}»</div>`:''}
   ${c.loai==='don'&&r.de_nghi_doi_ngay?`<div class="mini" style="width:100%">↩ ${r.de_nghi_doi_ngay.boi} · ${r.de_nghi_doi_ngay.luc}: «${r.de_nghi_doi_ngay.ly_do}» — <b>đơn vẫn có hiệu lực</b> tới khi chính người xin nghỉ rút</div>`:''}</div>
  <div class="vbody">${dongNgay}</div>
  ${hanhDong.length?`<div class="cact">${hanhDong.join(' ')}</div>`:''}</div>`;
}
function vangTab(){
 const all=dsVang();
 const ds=all.filter(c=>locVang==='chua'?c.chua:locVang==='qua'?c.daQua:true);
 const r=R();
 const bar=`<div class="bar">
   ${co('baovang')?`<button class="btn p" data-x="mo-baovang">⚡ Báo vắng</button>`:''}
   <span class="seg">${[['tat_ca','Tất cả'],['chua','Còn tiết chưa xếp'],['qua','Đã qua']].map(([k,n])=>`<button class="${locVang===k?'on':''}" data-lv="${k}">${n}</button>`).join('')}</span>
   <button class="btn" data-x="mo-nguong">⚙ Ngưỡng sát giờ: ${NGUONG_SATGIO} giờ</button>
   <div class="sum"><span><b>${all.length}</b> đợt vắng có tiết trong phạm vi</span><span><b style="color:var(--red)">${all.reduce((s,c)=>s+c.chua,0)}</b> tiết chưa xếp</span></div></div>`;
 const giai=`<div class="ro"><b>Trục nhìn, không phải nơi xử lý.</b> Mỗi thẻ là một <b>đợt vắng của NGƯỜI</b> — đối xứng tab <i>Lịch nghỉ</i> (đợt nghỉ của TRƯỜNG).
   Bốn nguồn: <b>đơn nghỉ có hiệu lực theo ngày</b> 🔗 M4.8 · <b>⚡ báo vắng</b> · <b>đợt đào tạo</b> 🔗 M5.6 · <b>tạm nghỉ</b> 🔗 M4.2.
   Bấm một tiết là mở <b>panel tiết</b> — mọi thay đổi ở đó bắt khai <b>Nguồn phát sinh</b>.

/* ---- ④ THU HỒI phía phân công — sự kiện RÚT xảy ra ở M0.4 (người xin nghỉ), menu này CHỊU hệ quả ---- */
function vungThuHoi(don,ngay,luc){
 const ts=LICH.filter(x=>x.gvGoc===don.ns&&x.ngay===ngay&&x.tt!=='nghi');
 const dau=ts.map(x=>gioCua(x)[0]).sort()[0];
 if(dau&&ngay+' '+dau<=luc)return {v:3,dau};
 if(CHAMCONG_KL.includes(don.ns+'|'+ngay))return {v:3,dau,kl:1};
 if(ts.some(x=>x.nguon==='Dạy thay'&&x.gv!==x.gvGoc))return {v:2,dau};
 return {v:1,dau};
}
function rutDon(don,ngays,luc,boi,lyDo,giu){
 const ok=[],khong=[];
 ngays.forEach(n=>{const z=don.ngay.find(q=>q.ngay===n);if(!z||z.da_rut)return;
  const {v,dau,kl}=vungThuHoi(don,n,luc);
  const nhapHo=don.nguoi_nhap_ho&&boi===don.nguoi_nhap_ho;
  if(v===3){khong.push({n,v,ly:kl?'Ngày đã có kết luận chấm công ở M4.9':`Tiết đầu tiên ${dau} đã bắt đầu — không rút; người phụ trách chấm công đính chính ở M4.9 (lý do + audit)`});return}
  if(v===2&&nhapHo){khong.push({n,v,ly:'Người nhập hộ chỉ rút ở vùng ⚪ — ngày này đã xếp người dạy thay'});return}
  if(v===2&&!lyDo){khong.push({n,v,ly:'Vùng 🟡 bắt buộc lý do'});return}
  const truoc=LICH.filter(x=>x.gvGoc===don.ns&&x.ngay===n&&x.canThay).length;
  z.da_rut=true;z.rut_luc=luc;z.rut_boi=boi;z.ly_do_rut=lyDo||'';z.giu_nguoi_day_thay=v===2&&!!giu;z.vung=v;
  if(v===1){ok.push({n,v,hq:truoc?`Xóa ${truoc} nhu cầu dạy thay — im lặng, không báo ai`:'Không có nhu cầu nào'});return}
  const satGio=dau?(tg(n+' '+dau)-tg(luc))/3600000<NGUONG_SATGIO:false;
  const thay=LICH.filter(x=>x.gvGoc===don.ns&&x.ngay===n&&x.nguon==='Dạy thay'&&x.gv!==x.gvGoc&&x.tt==='dukien');
  if(giu){thay.forEach(x=>x.giuNguoi={don:don.id,satGio});
   ok.push({n,v,satGio,hq:`Giữ nguyên ${[...new Set(thay.map(x=>ns(x.gv).n))].join(', ')} — không gỡ; ngày này GV gốc đi làm nhưng không dạy các tiết đó, M4.9 không tính Vắng có phép`});return}
  const bi=[];
  thay.forEach(x=>{const cu=x.gv;bi.push(ns(cu).n);
   x.lichSu=(x.lichSu||[]).concat({luc:k2s(luc.split(' ')[0])+' '+luc.split(' ')[1],ai:ns(boi).n+' (rút đơn ở M0.4)',viec:'Gỡ phân công dạy thay — cùng giao dịch rút đơn',truoc:ns(cu).n,sau:ns(x.gvGoc).n,
     nguon:{loai:'giao_vien_vang',don_nghi_id:don.id}});
   x.gv=x.gvGoc;x.nguon='TKB';delete x.dienGiai;x.baoHuy={nguoi:cu,luc,ly:lyDo,satGio,don:don.id,rutBoi:boi}});   /* YKNP-3Z2: + mã đơn · người rút — M2.1 kể cùng một dòng (PHIEU-YKNP-2A E4) */
  ok.push({n,v,satGio,hq:`Gỡ ${thay.length} phân công của ${[...new Set(bi)].join(', ')} trong cùng giao dịch · báo đích danh ở M2.1${satGio?' · <b style="color:var(--red)">sát giờ — báo đỏ</b>':''}`});
 });
 if(don.ngay.every(z=>z.da_rut))don.trang_thai='da_rut';
 tinhNhuCau();
 return {ok,khong};
}
function bangRut(tieuDe,kq){
 const ten=v=>v===1?'⚪':v===2?'🟡':'🔴';

/* ===== GY18-A §7 — nhóm «tiết tương lai bị đổi giờ» =====
   Chạy CẢ KHI KHÔNG sinh lại lịch: M4.6 §8.2b ký ban hành một bộ giờ thì mẫu tuần KHÔNG đổi,
   không tiết nào tạo mới / thay người / bị xóa — chỉ giờ đổi. Vẫn đi qua ĐÚNG bảng này. */
let dgTam=null;
function moDoiGio(){
 const dt=dtHien(), bo=dsBo(dt).find(b=>b.ma==='DONG')||dsBo(dt)[1]||dsBo(dt)[0];
 const LECH=10;   /* Sở lùi giờ vào học thêm 10 phút — kịch bản của ca A5 */
 const gioMoi={}; KHUNGTIET.forEach(k=>gioMoi[k.n]=[themPhutHM(bo.gio[k.n][0],LECH),themPhutHM(bo.gio[k.n][1],LECH)]);
 const trong=x=>x.boGio===bo.ma&&lop(x.lop).dt===dt;
 /* Tiết TƯƠNG LAI = Dự kiến · chưa có kết luận chấm công · ngày >= hôm nay (§3b.4 bảng bốn dòng).
    Tiết Nghỉ và Hủy không có giờ để đổi; tiết ngày đã qua thì dù mang trạng thái gì cũng không đổi hồi tố. */
 const saiNgay=x=>pd(x.ngay.split('-').reverse().join('/'))<HOMNAY;
 const tuongLai=LICH.filter(x=>trong(x)&&x.tt==='dukien'&&!x.ccChot&&!saiNgay(x));
 const giuNguyen=LICH.filter(x=>trong(x)&&(daChotGio(x)||saiNgay(x)));
 const ngays=[...new Set(tuongLai.map(x=>x.ngay))].sort();
 dgTam={dt,bo,gioMoi,ids:tuongLai.map(x=>x.id)};
 modal(`Bộ giờ đổi ở M4.6 — bảng đối chiếu (${bo.ten})`,
  `<div class="info">M4.6 ${dlink('M4.6','M4.6 ⚙ Khung tiết')} vừa ký ban hành bộ <b>${bo.ten}</b> của <b>${dt}</b>
    — mọi tiết lùi <b>${LECH} phút</b>. <b>Số tiết không đổi</b> nên <b>thời khóa biểu KHÔNG sinh lại</b>.</div>
   <table><thead><tr><th>Nhóm</th><th class="num">Số tiết</th><th>Ứng xử</th></tr></thead><tbody>
    <tr><td>Tiết <b>đã diễn ra</b></td><td class="num">${giuNguyen.filter(x=>x.tt==='dien').length}</td>
      <td>✓ <b>Giữ nguyên giờ đã ghi</b> — không đổi hồi tố</td></tr>
    <tr><td>Tiết đã có <b>kết luận chấm công</b> mà chưa diễn ra</td><td class="num">${giuNguyen.filter(x=>x.ccChot&&x.tt!=='dien').length}</td>
      <td>✓ <b>Giữ nguyên</b> — không sửa căn cứ của một kết luận đã ra</td></tr>
    <tr><td>Tiết <b>Nghỉ · Hủy</b>, hoặc ngày đã qua ở trạng thái khác</td><td class="num">${giuNguyen.filter(x=>!x.ccChot&&x.tt!=='dien').length}</td>
      <td>✓ <b>Giữ nguyên</b> — không có giờ để đổi</td></tr>
    <tr class="warnrow"><td><b>Tiết TƯƠNG LAI bị đổi giờ</b></td><td class="num">${tuongLai.length}</td>
      <td>${ngays.length?`${k2s(ngays[0])} → ${k2s(ngays[ngays.length-1])} · <b>${bo.ten}</b> cũ → mới`:'—'}</td></tr>
   </tbody></table>
   ${tuongLai.length?`<table style="margin-top:9px"><thead><tr><th>Tiết</th><th>Giờ cũ</th><th>Giờ mới</th><th>Quyết định</th></tr></thead><tbody>
    ${tuongLai.slice(0,12).map(x=>`<tr><td>${k2s(x.ngay)} · ${x.lop} · tiết ${x.tiet}</td>
      <td>${gioCua(x)[0]}–${gioCua(x)[1]}</td>
      <td><b>${gioMoi[x.tiet][0]}–${gioMoi[x.tiet][1]}</b></td>
      <td><span class="seg"><button class="on" style="padding:3px 9px;font-size:11px">Đổi</button>
        <button style="padding:3px 9px;font-size:11px">Giữ</button></span></td></tr>`).join('')}
    ${tuongLai.length>12?`<tr><td colspan="4" class="mini">… và ${tuongLai.length-12} tiết khác</td></tr>`:''}

/* ================= DEEP-LINK (đầu tiên của M4.7 — YK-01) =================
   /M4.7?ctx=<tiet_id>&action=tao&loai=day_thay&return=M4.9 — mở sẵn form dạy thay của đúng tiết.
   Giữ khuôn D3: action ∈ {tao|sua|duyet}; loại cụ thể để ở `loai`, KHÔNG đẻ action=day_thay. */
let linkVe='';
/* YKNP 17/9 — thêm ba cửa, cùng khuôn D3 (action là ĐỘNG TỪ chung, loại để ở `loai`):
     /M4.7?tab=giao_vien_vang&ctx=<don_nghi_id|bao_vang_id>&return=…        mở tab T4, chọn thẻ
     /M4.7?action=tao&loai=bao_vang&ctx=<nhan_su_id>&return=…              mở hộp ⚡ Báo vắng điền sẵn người
     /M4.7?action=tao&loai=de_nghi_doi_ngay&ctx=<don_nghi_id>&return=…     mở hộp ↩ Đề nghị đổi ngày của đơn */
function moLink(ctx,action,loai,ret,tabQ){
 if(tabQ==='giao_vien_vang'){
  const c=dsVang().find(q=>q.id===ctx);
  if(ctx&&!c){toast(`⛔ Không có đợt vắng <b>${ctx}</b> trong phạm vi của vai này — nhân sự không đứng lớp không có thẻ ở M4.7; bản ghi ngoài phạm vi không trả về`);tab='vang';render();return}
  linkVe=ret||'';tab='vang';vangChon=ctx||'';render();return}
 if(action==='tao'&&loai==='bao_vang'){
  if(!co('baovang')){toast('⛔ Vai này không có quyền <b>T</b> ở tab Giáo viên vắng — menu gọi đã <b>không hiện</b> deep-link này (D3)');return}
  linkVe=ret||'';tab='vang';render();moBaoVang({ns:+ctx});return}
 if(action==='tao'&&loai==='de_nghi_doi_ngay'){
  const d=DON.find(q=>q.id===ctx);
  if(!co('doingay')){toast('⛔ Vai này không gửi được đề nghị đổi ngày (D3)');return}
  if(!d){toast(`⛔ Không tìm thấy đơn <b>${ctx}</b>`);return}
  linkVe=ret||'';tab='vang';vangChon=d.id;render();moDoiNgay(d.id);return}
 const z=LICH.find(q=>String(q.id)===String(ctx));
 if(action!=='tao'||loai!=='day_thay'){toast(`⛔ M4.7 nhận <code>action=tao</code> với <code>loai</code> ∈ {day_thay · bao_vang · de_nghi_doi_ngay} — nhận được <code>action=${action||''}&amp;loai=${loai||''}</code>`);return}
 if(!z){toast(`⛔ Không tìm thấy tiết <b>${ctx}</b> ở Lịch giảng dạy`);return}
 if(!co('daythay')){toast('⛔ Vai này không có quyền <b>T</b> ở F3 Xếp dạy thay — M4.9 đã <b>không hiện</b> deep-link này (D3)');return}
 linkVe=ret||'';tab='lich';cheDo='ngay';curNgay=z.ngay;curDT=lop(z.lop).dt;curTiet=z.id;render();moXepThay(z.id);
}

}

 /* S4 🟡 D+1 — đã xếp Đỗ Thị Yến */
 cua(15,D(1)).filter(x=>ranh(x,16)).forEach(x=>xep(x,16,'Cao Thị Nhung (TTCM)',k2s(D(-1))+' 16:00',{loai:'giao_vien_vang',don_nghi_id:'NP-2026-138'},
