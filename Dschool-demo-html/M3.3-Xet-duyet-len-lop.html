<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M3.3 Xét duyệt lên lớp — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:12px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink2)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:4px}
.crumb button{color:var(--brand);font-weight:600}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;overflow-x:auto}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1 .c{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .c{background:var(--brand);color:#fff}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:250px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:9px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap;align-items:center}
.sum b{color:var(--ink)}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12.5px;background:#fff;white-space:nowrap}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:8px 12px;border-radius:9px;font-size:12.5px;margin-bottom:11px;display:flex;gap:8px;align-items:flex-start}

.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage{display:flex;gap:13px;align-items:flex-start}
.stage .listw{flex:1;min-width:0}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grph{padding:7px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);letter-spacing:.03em}
.row{border-bottom:1px solid var(--line);padding:11px 13px;cursor:pointer}
.row:hover{background:var(--brand-soft)}
.row.on{background:#eff6ff}
.rh{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.rh b{font-size:14px}
.rmeta{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden;width:96px;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;background:var(--green)}
.prog.bad i{background:var(--red)}
.prog.warn i{background:var(--amber)}
.cap{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap}
.cap.TH{background:#ccfbf1;color:#115e59}
.cap.THCS{background:#dbeafe;color:#1e40af}
.cap.THPT{background:#ede9fe;color:#5b21b6}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.fl{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid}
.fl.r{background:var(--red-soft);color:#991b1b;border-color:#fecaca}
.fl.w{background:var(--amber-soft);color:#92400e;border-color:#fde68a}
.fl.b{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
.pl4{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--ink2)}
.pl4 span{background:var(--bg);border-radius:6px;padding:2px 8px}
.ract{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.wrapx{overflow-x:auto}
.gtb th,.gtb td{padding:5px 6px;text-align:center;font-size:12px}
.gtb th:nth-child(-n+2),.gtb td:nth-child(-n+2){text-align:left}
.gtb tbody tr:hover{background:#f8fafc}
.dz{color:var(--amber);font-weight:700}
.dl{color:var(--red);font-weight:800;background:var(--red-soft)}
.mienc{color:var(--ink3);background:#f1f5f9;font-size:11px;font-weight:600}
.nx{font-weight:700;font-size:11.5px}
.stick{position:sticky;left:0;background:#fff;z-index:2}
th.stick{background:#f8fafc}
tr:hover td.stick{background:#f8fafc}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph h2{font-size:16px;font-weight:700}
.ph .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:14px 15px;max-height:calc(100vh - 220px);overflow-y:auto}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.ok{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:5px}
.ct2{font-size:11px;color:var(--ink3);font-family:ui-monospace,monospace;background:var(--bg);padding:2px 6px;border-radius:5px;display:inline-block}
.wk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;background:#fff}
.wk:hover{border-color:var(--brand);background:var(--brand-soft)}
.wk.on{border-color:var(--brand);background:#eff6ff}
.wk .ic{font-size:19px;flex:0 0 26px}
.wk .bd{flex:1;min-width:0}
.wk .bd b{display:block;font-size:13.5px}

.nh4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:11px}
.nbox{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--surface)}
.nbox .v{font-size:26px;font-weight:800;line-height:1.1}
.nbox .l{font-size:11.5px;color:var(--ink2);font-weight:600;min-height:32px}
.nbox .s{font-size:10.5px;color:var(--ink3);margin-top:5px}
.nbox.n1{background:var(--green-soft);border-color:#a7f3d0}
.nbox.n2{background:#eff6ff;border-color:#bfdbfe}
.nbox.n3{background:var(--amber-soft);border-color:#fde68a}
.nbox.n4{background:var(--red-soft);border-color:#fecaca}
.nbox.n5{background:#f8fafc}

.stepl{display:flex;gap:0;margin:10px 0 14px;flex-wrap:wrap}
.stp{flex:1;min-width:130px;border:1px solid var(--line);padding:8px 11px;font-size:12px;background:#fff}
.stp:first-child{border-radius:9px 0 0 9px}
.stp:last-child{border-radius:0 9px 9px 0}
.stp+.stp{border-left:none}
.stp b{display:block;font-size:12.5px}
.stp.done{background:var(--green-soft);border-color:#a7f3d0;color:#065f46}
.stp.now{background:var(--brand-soft);border-color:#bfdbfe;color:#1e40af}
.stp .n{font-size:10.5px;color:var(--ink3)}

.tl{border-left:2px solid var(--line);margin-left:7px;padding-left:15px}
.tli{position:relative;padding:8px 0;font-size:12.5px}
.tli::before{content:"";position:absolute;left:-21px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.tli.w::before{background:var(--amber)}.tli.r::before{background:var(--red)}.tli.g::before{background:var(--green)}
.tli b{display:block;font-weight:600}
.tli .mm{color:var(--ink3);font-size:11.5px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:940px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column}
.modal.sm{width:660px}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{margin-bottom:10px;font-size:12.5px;font-weight:700}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.res{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.resh{padding:8px 12px;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--line)}
.resh.ok{background:var(--green-soft);color:#065f46;margin:0;border-radius:0}
.resh.skip{background:var(--amber-soft);color:#92400e;margin:0;border-radius:0;border-top:1px solid var(--line)}
.resb{padding:8px 12px;font-size:12.5px}
.resb .rr{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.resb .rr:last-child{border-bottom:none}
.resb .rr b{min-width:56px}
.blk{background:var(--red-soft);border:1px solid #fecaca;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-bottom:12px}
.blk b{color:#991b1b}
.blk .li{display:flex;gap:8px;align-items:baseline;padding:4px 0;color:#991b1b}
.blk .li .x{flex:0 0 14px}
.inpage{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:22px 26px;font-size:12px;line-height:1.7;color:#0f172a}
.inpage h3{text-align:center;font-size:14px;font-weight:800;margin:0}
.inpage .qh2{text-align:center;font-size:11.5px;margin-bottom:14px}
.sig2{display:flex;justify-content:space-between;margin-top:22px;font-size:11.5px;text-align:center}
.evd{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:11px}
.evd .er{display:grid;grid-template-columns:120px 1fr auto;gap:9px;padding:7px 11px;font-size:12.5px;align-items:center}
.evd .er+.er{border-top:1px solid #f1f5f9}
.evd .er .k{color:var(--ink3);font-size:11.5px}
.rlpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rlpick .b2{border:1px solid var(--line2);border-radius:8px;padding:6px 13px;font-size:12.5px;background:#fff;font-weight:600}
.rlpick .b2.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.selm{border:1px solid var(--line2);border-radius:6px;padding:2px 4px;font-size:11.5px;background:#fff;width:78px}
.selm.none{border-color:var(--amber);background:var(--amber-soft)}
.kv{display:grid;grid-template-columns:145px 1fr;gap:6px 11px;font-size:12.5px;margin-bottom:12px}
.kv .k{color:var(--ink3)}
.fitem{display:flex;gap:9px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:12.5px}
.fitem .nm{flex:1;min-width:0}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:36px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.rlmeta{font-size:10px;color:var(--ink3);margin-top:2px;line-height:1.35}
.bulk{font-size:9px;font-weight:800;background:#fef3c7;color:#92400e;padding:0 4px;border-radius:3px}
.gtb th{white-space:normal;text-transform:none;font-size:11px;line-height:1.3;min-width:82px;max-width:118px;
 vertical-align:bottom;padding:6px 5px;letter-spacing:0}
.gtb th.stick{min-width:158px;max-width:none;text-align:left}
.gtb thead tr.hgrp th{background:#eef2ff;color:#3730a3;font-size:10.5px;font-weight:800;text-align:center;
 letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line2);padding:5px 6px;min-width:0;max-width:none}
.gtb th.sep,.gtb td.sep{border-left:2px solid var(--line2)}
.gtb th .gv{display:block;font-weight:400;color:var(--ink3);font-size:9.5px;margin-top:1px;line-height:1.2}
.gvw{display:flex;gap:7px;overflow-x:auto;padding:9px 11px;background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:11px}
.gvi{flex:0 0 auto;min-width:118px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:11.5px;cursor:pointer;background:#fff}
.gvi:hover{border-color:var(--brand);background:var(--brand-soft)}
.gvi .m{font-weight:700;font-size:12px}
.gvi .g{color:var(--ink2);font-size:11px;margin:1px 0 3px}
.gvi.ok{background:var(--green-soft);border-color:#a7f3d0}
.gvi.no{background:var(--amber-soft);border-color:#fde68a}
.gvi.yc{background:var(--red-soft);border-color:#fecaca}
.gvi.cn{background:#ede9fe;border-color:#ddd6fe}
.colst{font-size:9px;font-weight:800;display:block;margin-top:2px;letter-spacing:0}
.colst.ok{color:var(--green)}.colst.no{color:var(--amber)}.colst.yc{color:var(--red)}
.th-yc{cursor:pointer}
.mtag{font-size:8.5px;font-weight:800;background:#e0e7ff;color:#3730a3;padding:0 3px;border-radius:3px;vertical-align:super}
.ycbox{border:1px solid #fecaca;background:var(--red-soft);border-radius:9px;padding:8px 11px;margin-top:7px;font-size:12px;line-height:1.6}
.ycbox b{color:#991b1b}
.ycbox .act{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.kqgrid{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.kqi{background:var(--bg);border-radius:7px;padding:3px 9px;font-size:11.5px}
.kqi b{font-size:13px}
.frm{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:11.5px;color:var(--ink2);font-family:ui-monospace,monospace;margin-bottom:11px}

.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-bottom:12px}
.lbox{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--surface)}
.lbox .ic{font-size:20px;line-height:1}
.lbox b{font-size:12.5px}
.lbox .m{font-size:11px;color:var(--ink2);margin-top:2px}
.lbox .m2{font-size:11px;color:var(--ink3);margin-top:3px;font-style:italic}
.lbox .cnt{margin-left:auto;font-size:19px;font-weight:800;color:var(--brand)}
.klbig{border-radius:11px;padding:12px 14px;margin-bottom:12px;border:1px solid}
.klbig .t{font-size:16px;font-weight:800}

 if(!x.he||!x.he.d14||x.he.d14.cho)return x.ht;
 if(x.he.d14.khongDK)return x.ht;
 return x.he.d14.ok?'Đạt':'Chưa đạt';
}
function kqTHNay(x){return (x.he&&x.he.d13&&x.he.d13.kq==='Đạt')?'Hoàn thành':x.kqTH}

/* ===== KET LUAN DAN XUAT — chi lien quan LEN LOP, khong xet tot nghiep ===== */
function ketLuan(x){
 if(!heXong(x))return {k:'cho',t:'⏳ Chưa kết luận được',c:'w',ly:thieuGi(x).join(' · ')};
 if(x.nghi>45)return {k:'ol',t:'⛔ Ở lại lớp',c:'r',ly:`Nghỉ ${x.nghi} buổi — quá 45 buổi, TT 22 Đ.12 k.1`};
 if(x.cap==='TH'){
  const kq=kqTHNay(x);
  if(kq==='Chưa hoàn thành')return {k:'ol',t:'⛔ Ở lại lớp',c:'r',ly:'Kết quả giáo dục Chưa hoàn thành sau hướng dẫn, giúp đỡ trong hè'};
  return {k:'ll',t:'✅ Được lên lớp',c:'o',ly:`Kết quả giáo dục ${kq} · nghỉ ${x.nghi} buổi`};
 }
 const rl=rlNay(x),ht=htNay(x);
 if(rl==='Chưa đạt'&&ht==='Chưa đạt')return {k:'ol',t:'⛔ Ở lại lớp',c:'r',ly:'Cả rèn luyện và học tập đều Chưa đạt sau xử lý hè'};
 if(rl==='Chưa đạt')return {k:'ol',t:'⛔ Ở lại lớp',c:'r',ly:'Kết quả rèn luyện Chưa đạt sau rèn luyện hè'};
 if(ht==='Chưa đạt')return {k:'ol',t:'⛔ Ở lại lớp',c:'r',ly:'Kết quả học tập Chưa đạt sau đánh giá lại môn'};
 return {k:'ll',t:'✅ Được lên lớp',c:'o',ly:`Rèn luyện ${rl} · học tập ${ht} · nghỉ ${x.nghi} buổi`};
}
function klCuoi(x){const k=KQ[x.ma];return k?{k:k.kl,t:k.t,c:k.c,ly:k.ly,hd:k}:ketLuan(x)}
function laMode2(x){return M2.indexOf(x.ma)>=0}
function cuoiCap(L){return L.khoi===5||L.khoi===9||L.khoi===12}
/* thong ke mot lop */
function tk(L){
 const hs=HS[L.id],o={ll:0,ol:0,cho:0,m2:0,xet:0};
 hs.forEach(x=>{const k=klCuoi(x);
  if(!heXong(x))o.cho++;
  if(laMode2(x)&&!KQ[x.ma])o.m2++;
  if(KQ[x.ma])o.xet++;
  if(k.k==='ll')o.ll++; else if(k.k==='ol')o.ol++;});
 return o;
}
function ttLop(L){
 const o=tk(L);
 if(o.cho)return {k:'chua',t:`⚠ ${o.cho} học sinh chưa chốt dữ liệu`,c:'r'};
 if(!DAXET[L.id])return {k:'canchay',t:'⟳ Cần chạy xét duyệt lên lớp',c:'w'};
 if(o.m2)return {k:'m2',t:`⚖ ${o.m2} ca chờ Hội đồng biểu quyết`,c:'v'};
 if(o.xet<HS[L.id].length)return {k:'dodang',t:'⚠ Chạy xét duyệt chưa phủ hết lớp',c:'w'};
 return {k:'xong',t:'✔ Đã có kết quả xét duyệt',c:'o'};
}
function lopChuaXong(){return dsLop().filter(L=>ttLop(L).k!=='xong')}

/* ===== ket chuyen ===== */
function lopSauMacDinh(x){
 const k=klCuoi(x);
 if(k.k!=='ll')return null;                 /* o lai lop -> xep tay */
 if(cuoiCap(LOP.find(L=>L.id===x.lop)))return '__cc__';  /* chuyen cap -> M3.4 */
 return MAPLOP[x.lop]||null;
}
function lopKC(x){
 if(KCLOP[x.ma])return KCLOP[x.ma];
 const d=lopSauMacDinh(x);
 return d;
}
function dsKC(){
 const out=[];
 dsLop().forEach(L=>HS[L.id].forEach(x=>{ if(KQ[x.ma])out.push(x)}));
 return out;
}
function lopSauCua(khoi,dt){return LOP_SAU.filter(l=>l.khoi===khoi&&l.dt===dt)}
function khoaKC(){
 const k=[];
 if(!KYCB)k.push({t:'Hiệu trưởng chưa ký công bố kết quả xét duyệt',
   m:'Kết chuyển là hệ quả của một quyết định đã có hiệu lực. Chưa ký thì chưa có quyết định để thi hành.'});
 if(NAM_SAU_TT!=='Sắp tới')k.push({t:`Năm học ${NAM_SAU} chưa ở trạng thái "Sắp tới"`,
   m:'Chỉ kết chuyển được vào một năm học đã mở hồ sơ. Cấu hình tại M10.1.'});
 if(!LOP_SAU.length)k.push({t:`Năm học ${NAM_SAU} chưa có danh sách lớp`,
   m:'Không có lớp đích thì không kết chuyển được ai. Danh sách lớp mở tại M10.1 / M1.7.'});
 return k;
}
function thieuMap(){
 const s={};
 dsKC().forEach(x=>{const L=LOP.find(z=>z.id===x.lop);
  if(klCuoi(x).k!=='ll'||cuoiCap(L))return;
  if(!MAPLOP[x.lop])s[x.lop]=L});
 return Object.keys(s).map(k=>s[k]);
}
function chuaXepLuuBan(){return dsKC().filter(x=>klCuoi(x).k==='ol'&&!KCLOP[x.ma])}
/* HS dang bao luu KHONG ket chuyen o day — tai nhap hoc thuoc M1.6 (quy uoc D1: mot thuc the, mot menu ghi).
   M3.3 chi NHAC de khong ai bi quen o thoi diem chuyen nam hoc. */
function nhacBaoLuu(){return BAOLUU.filter(b=>(R().sc==='branch'?b.dt===R().dt:true))}

 if(m2.length)can.push(`<b>${m2.length} ca</b> đang chờ Hội đồng biểu quyết`);

 h+=`<div class="hdbar">
   <div class="hdcell"><div class="hl">⚖ Hội đồng xét lên lớp ${NAM_SAU}</div>
     <div class="hv">${HD?`<span class="st2 o">Đã lập · ${HD.uv.length+3} thành viên</span>`:'<span class="st2 w">Chưa lập</span>'}</div>
     ${(r.hoiDong||F())?`<button class="btn xs ${HD?'':'p'}" data-x="laphd">${HD?'✎ Sửa':'⚖ Lập Hội đồng'}</button>`:''}</div>
   <div class="hdcell"><div class="hl">📄 Biên bản họp</div>
     <div class="hv">${BB?`<span class="st2 o">Đã ghi ${BB.at}</span>`:'<span class="st2 n">Chưa ghi</span>'}</div>
     ${(r.bienBan||F())?`<button class="btn xs" data-x="ghibb" ${HD?'':'disabled'}>${BB?'✎ Sửa':'📄 Ghi'} biên bản</button>`:''}
     ${BB?`<button class="btn xs" data-x="xembb">👁 Xem</button>`:''}</div>
   <div class="hdcell"><div class="hl">🖊 Ký công bố</div>
     <div class="hv">${can.length?`<span class="st2 r">Còn ${can.length} việc</span>`:'<span class="st2 o">Đã đủ điều kiện</span>'}</div>
     ${(r.kyCB||F())?`<button class="btn xs ${can.length?'':'p'}" data-x="kycb">🖊 Rà soát và ký công bố</button>`:'<span class="mm">Chỉ Hiệu trưởng ký</span>'}</div>
 </div>`;
 if(can.length)h+=`<div class="warn"><b>Chưa ký công bố được:</b><br>${can.map(t=>'• '+t).join('<br>')}</div>`;
 return h;
}
function tabLop(){
 const r=R(),L0=dsLop();
 let h=`<div class="scopebar"><span>📋</span><div>${scopeText()}</div></div>`;
 h+=`<div class="info"><b>Mỗi trường × mỗi năm học chỉ xét MỘT lần</b>, sau khi đã chốt hết kết quả năm học (M3.1) và
   kết quả rèn luyện hè (M3.2). Không chia đợt: xét lên lớp là <b>một việc làm một lần cho cả trường</b>, chia đợt chỉ tạo
   thêm chỗ để quên lớp.<br>
   <b>Menu này chỉ kết luận lên lớp / ở lại lớp.</b> Xét tốt nghiệp tiểu học, tốt nghiệp THCS và điều kiện dự thi TN THPT
   ở <b>M3.4 Xét duyệt tốt nghiệp</b> — khối cuối cấp vẫn xét ở đây để biết em <b>đủ hay không đủ điều kiện</b>, rồi M3.4 mới công nhận.
   <button class="btn xs" data-go="M3.4?return=M3.3">↗ M3.4</button></div>`;
 h+=daiHoiDong();
 /* tong hop */
 const T={ll:0,ol:0,cho:0,ss:0};
 L0.forEach(L=>{const o=tk(L);T.ll+=o.ll;T.ol+=o.ol;T.cho+=o.cho;T.ss+=L.ss});
 h+=`<div class="nh4">
   <div class="nbox n5"><div class="v">${L0.length}</div><div class="l">Lớp trong phạm vi<br><span style="font-weight:400">${T.ss} học sinh</span></div></div>
   <div class="nbox n1"><div class="v">${T.ll}</div><div class="l">✅ Được lên lớp</div></div>
   <div class="nbox n4"><div class="v">${T.ol}</div><div class="l">⛔ Ở lại lớp</div></div>
   <div class="nbox ${T.cho?'n3':'n5'}"><div class="v">${T.cho}</div><div class="l">⏳ Chưa chốt dữ liệu<br><span style="font-weight:400">còn thiếu kết quả năm học hoặc kết quả hè</span></div>
     ${T.cho?`<div class="s"><button class="btn xs" data-go="M3.2?return=M3.3">↗ M3.2</button></div>`:''}</div>
 </div>`;
 h+=`<div class="bar">
   <input class="inp" id="q" placeholder="Tìm lớp hoặc giáo viên chủ nhiệm…" value="${q}">
   <select class="fs" id="ftt">${['Tất cả','Chưa chốt dữ liệu','Cần chạy xét duyệt','Chờ Hội đồng biểu quyết','Đã có kết quả'].map(v=>opt(fTT,v)).join('')}</select>
   <div class="spacer"></div>
   ${(r.chay||F())&&!KYCB?`<button class="btn sm" data-x="chontat">☑ Chọn lớp cần chạy</button>`:''}
   ${(r.chay||F())&&selL.size&&!KYCB?`<button class="btn sm p" data-x="chayloat">⟳ Chạy xét duyệt ${selL.size} lớp</button>
     <button class="btn sm" data-x="bochon">Bỏ chọn</button>`:''}
 </div>`;
 let rows=L0.filter(L=>{
  if(q&&!(L.id+' '+L.gvcn).toLowerCase().includes(q.toLowerCase()))return false;
  const t=ttLop(L);
  if(fTT==='Chưa chốt dữ liệu')return t.k==='chua';
  if(fTT==='Cần chạy xét duyệt')return t.k==='canchay'||t.k==='dodang';
  if(fTT==='Chờ Hội đồng biểu quyết')return t.k==='m2';
  if(fTT==='Đã có kết quả')return t.k==='xong';
  return true});
 h+='<div class="listw">';
 if(!rows.length)h+='<div class="empty">Không có lớp nào khớp bộ lọc.</div>';
 let cdt='',cnk='';
 rows.forEach(L=>{
  if(L.dt!==cdt){cdt=L.dt;cnk='';h+=`<div class="grph gdt">📍 ${L.dt}</div>`}
  const nk=nhomKhoi(L);
  if(nk!==cnk){cnk=nk;h+=`<div class="grph gkh">${nk}</div>`}
  h+=theLop(L);
 });
 return h+'</div>';
}
function theLop(L){
 const r=R(),t=ttLop(L),o=tk(L),chon=selL.has(L.id),ok=t.k==='canchay'||t.k==='dodang';
 return `<div class="row" data-lop="${L.id}">

   ${(r.chay||F())&&ok&&!KYCB?`<input type="checkbox" data-lsel="${L.id}" ${chon?'checked':''} onclick="event.stopPropagation()">`:''}

   ${cuoiCap(L)?'<span class="st2 b">cuối cấp</span>':''}
   <span style="font-size:11.5px;color:var(--ink3)">GVCN ${L.gvcn} · ${L.ss} học sinh</span>
   <div class="spacer"></div>
   <span class="st2 ${t.c}">${t.t}</span></div>
  ${t.k==='xong'||t.k==='m2'||t.k==='dodang'?`<div class="rmeta">
    <span class="st2 o">✅ ${o.ll} lên lớp</span>
    <span class="st2 ${o.ol?'r':'n'}">⛔ ${o.ol} ở lại lớp</span>
    ${DAXET[L.id]?`<span style="color:var(--ink3)">chạy xét duyệt ${DAXET[L.id].at} · ${DAXET[L.id].by}</span>`:''}</div>`
   :t.k==='chua'?`<div class="rmeta" style="color:var(--red)">Phải chốt xong ở M3.1 và M3.2 rồi mới xét được — xét khi dữ liệu còn thiếu là đoán, không phải xét.</div>`
   :`<div class="rmeta">Dữ liệu đã đủ. Chạy xét duyệt để hệ thống tính kết luận cho ${L.ss} học sinh.</div>`}
 </div>`;
}

/* ================= F2 — Ket chuyen ================= */

 const r=R(),kh=khoaKC();
 let h=`<div class="scopebar"><span>↪</span><div>Kết chuyển đưa học sinh vào <b>lớp của năm học ${NAM_SAU}</b>.

}

/* ================= Su kien ================= */
document.body.addEventListener('click',e=>{
 const rb=e.target.closest('[data-r]');
 if(rb){role=rb.dataset.r;curLop=curHS=null;tab=ROLE[role].tabs[0];
  q='';fTT='Tất cả';fKC='Tất cả';selL.clear();MOKC={};
  document.querySelectorAll('.rb').forEach(x=>x.classList.remove('on'));rb.classList.add('on');render();return}
 const t1=e.target.closest('[data-t1]');
 if(t1){tab=t1.dataset.t1;curLop=curHS=null;q='';$('#mask').classList.remove('on');render();return}
 const go=e.target.closest('[data-go]');
 if(go){e.stopPropagation();toast('Deep-link → /'+go.dataset.go+(go.dataset.go.includes('return')?'':'&return=M3.3'));return}
 const x=e.target.closest('[data-x]');
 if(x){e.stopPropagation();act(x.dataset.x,x.dataset);return}
 const gk=e.target.closest('[data-gkc]');
 if(gk){const k=gk.dataset.gkc;MOKC[k]?delete MOKC[k]:MOKC[k]=1;render();return}
 const wk=e.target.closest('[data-wk]');
 if(wk){const w=viec().find(z=>z.id===wk.dataset.wk);if(!w)return;
  if(w.kc){tab='ketchuyen';curLop=null;if(w.id==='map')MOKC.len=1;if(w.id==='xl')MOKC.lb=1;if(w.id==='bl')MOKC.bl=1}
  else if(w.lop){tab='lop';curLop=w.lop}
  else{tab='lop';curLop=null}
  render();return}
 const lp=e.target.closest('[data-lop]');
 if(lp){$('#mask').classList.remove('on');curLop=lp.dataset.lop;tab='lop';render();return}
});
document.body.addEventListener('change',e=>{
 if(e.target.id==='hdt'||e.target.id==='nam'){curLop=curHS=null;render();return}
 if(e.target.id==='ftt'){fTT=e.target.value;render();return}
 const ls=e.target.closest('[data-lsel]');
 if(ls){const id=ls.dataset.lsel;selL.has(id)?selL.delete(id):selL.add(id);render();return}
 const mp=e.target.closest('[data-map]');
 if(mp){const id=mp.dataset.map;
  if(!mp.value)delete MAPLOP[id];else MAPLOP[id]=mp.value;
  toast('Lớp đích của '+id+' → '+(mp.value||'chưa cấu hình'));render();return}
 const kc=e.target.closest('[data-kclop]');
 if(kc){const ma=kc.dataset.kclop;
  if(!kc.value)delete KCLOP[ma];else KCLOP[ma]=kc.value;
  toast('Đã xếp lớp '+(kc.value||'— bỏ trống —'));render();return}
});
document.body.addEventListener('input',e=>{
 if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();
  const el=$('#q');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
});
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')$('#mask').classList.remove('on')});
render();
</script>
