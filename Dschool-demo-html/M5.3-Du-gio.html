<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M5.3 Dự giờ — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--red);color:#fff}
.totabs{display:flex;gap:4px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-top:none;
 border-radius:0 0 10px 10px;padding:6px 10px 6px 22px;flex-wrap:wrap}
.totabs .lb{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.totab{padding:4px 12px;border-radius:999px;font-size:12.5px;color:var(--ink2);border:1px solid transparent}
.totab.on{background:#fff;border-color:var(--brand);color:var(--brand);font-weight:700}
.totab .vt{font-size:10px;opacity:.75;font-weight:400}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.scope.first{margin-top:12px}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber)}
.scope.rd{border-left-color:var(--red)}
.scope.vi{border-left-color:var(--violet)}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:210px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.qf{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;background:#fff}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1240px){.stage.open .listw{display:none}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:26px}
.hrow.gone{opacity:.6}
.gk{grid-template-columns:1.9fr 1.5fr .95fr .9fr .95fr 1.15fr 1.5fr}
.stage.open .gk{grid-template-columns:1.8fr 1.2fr}
.stage.open .kx{display:none}
.gv{grid-template-columns:1.15fr 2.2fr 1.1fr 1.5fr}
.gs{grid-template-columns:1.5fr .85fr .85fr 1fr 1.9fr}
.gd{grid-template-columns:2.4fr 1.15fr .85fr .85fr .85fr 1.1fr}
.gdd{grid-template-columns:2.6fr 1.2fr .9fr .6fr}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:var(--violet-soft);color:#5b21b6}
.st2.y{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.eye{font-size:11px;color:var(--brand);border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:1px 7px}
.eye:hover{background:#e0e7ff}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.bc{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.bc button{color:var(--brand);font-weight:600}
.bc button:hover{text-decoration:underline}
.bc .cur{font-weight:700;color:var(--ink)}
.sumbar{display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;
 padding:9px 13px;flex-wrap:wrap;position:sticky;top:56px;z-index:25}
.mt{font-size:12px;color:var(--ink2);border-right:1px solid var(--line);padding-right:11px;line-height:1.35}
.mt b{display:block;font-size:14px;color:var(--ink);font-weight:700}
.mt.bad b{color:var(--red)}.mt.wr b{color:var(--amber)}.mt.gd b{color:var(--green)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:15px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbody{padding:13px 15px;max-height:calc(100vh - 290px);overflow-y:auto}
.pfoot{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.f{display:grid;grid-template-columns:132px 1fr;gap:11px;align-items:start;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11.5px;background:#fff;margin:0 4px 4px 0}
.lchip.ok{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.lchip.no{border-color:#fde68a;background:var(--amber-soft);color:#92400e}
.sech{font-size:13px;font-weight:700;margin:16px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sech .pill{font-weight:400}

.gsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:11px}
.gsec h3{font-size:13.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gf{margin-bottom:10px}
.gf label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:3px;font-weight:600}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;min-height:62px;resize:vertical;font-family:inherit}
.ta:focus{border-color:var(--brand);outline:none}
.ta.sm{min-height:44px}
.xlg{display:flex;gap:7px;flex-wrap:wrap}
.xlb{border:1px solid var(--line2);border-radius:999px;padding:6px 15px;font-size:13px;background:#fff;font-weight:600}
.xlb.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.bb{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fcfdfe}
.bb.me{background:var(--brand-soft);border-color:#bfdbfe}
.bb .h{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:6px;flex-wrap:wrap}
.bb .h b{font-size:12.5px}
.bb .r{font-size:12.5px;margin:4px 0}
.bb .r i{color:var(--ink3);font-style:normal;font-weight:600;display:block;font-size:11px}
.ph2{border:1px solid #ddd6fe;background:var(--violet-soft);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.agg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:8px 0}
.aggc{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;background:#fcfdfe}
.aggc b{display:block;font-size:15px;color:var(--ink)}
.bars{display:flex;gap:4px;align-items:flex-end;height:34px;margin-top:5px}
.barc{flex:1;text-align:center;font-size:9.5px;color:var(--ink3)}
.barc .bx{background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}

.viewer{display:grid;grid-template-columns:1fr 180px;gap:12px}
@media(max-width:760px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:230px;display:grid;place-items:center;position:relative;overflow:hidden}
.vsheet{background:#fff;width:82%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:13px 15px;font-size:8.5px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:9.5px;text-align:center;font-weight:800;margin-bottom:6px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:4px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.res{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:9px}
.resh{padding:7px 11px;font-size:12px;font-weight:700}
.resh.ok{background:var(--green-soft);color:#065f46}
.resh.sk{background:var(--amber-soft);color:#92400e}
.resr{padding:6px 11px;font-size:12.5px;border-top:1px solid var(--line);display:flex;gap:9px}
.resr .w{min-width:165px;font-weight:600}
.resr .r{color:var(--ink2);flex:1}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:840px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.blk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.blk:last-child{border-bottom:none}
.blk .ic{flex:0 0 18px;font-size:13px}
.blk .tx{flex:1}
.blk .tx b{display:block}
.stepn{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:12px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--bg);color:var(--ink2)}
.stp.on{background:var(--brand);color:#fff;font-weight:700}
.stp.dn{background:var(--green-soft);color:var(--green);font-weight:600}
.lbl{font-size:12px;color:var(--ink2);display:block;margin:9px 0 3px}
.lbl b{color:var(--red)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:8px 13px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35}
.sgb b{display:block}
.sgb span{font-size:10.5px;color:var(--ink3)}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.sgb.on span{color:var(--brand)}
.trow{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center;cursor:pointer}
.trow:hover{background:var(--brand-soft)}
.trow.busy{opacity:.6;cursor:not-allowed;background:#fafbfc}
.trow.busy:hover{background:#fafbfc}
.trow b{display:block}
.trow .s{display:block;font-size:10.5px;color:var(--ink3)}
.box{border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:290px;overflow-y:auto}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.g::before{background:var(--green)}.logi.r::before{background:var(--red)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="TTCM">TTCM</button>
  <button class="rb" data-r="TPCM">TPCM</button>
  <button class="rb" data-r="GVBM">GVBM</button>
  <button class="rb" data-r="PHT_CM">PHT_CM</button>
  <button class="rb" data-r="HT">HT</button>
  <span class="note">Dự giờ <b>KHÔNG bắt buộc</b> (TT 15/2026) — menu này <b>không có định mức, không có chỉ tiêu</b></span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026 (đã kết thúc)</option></select>
  <select class="sel" id="hdt"><option>Toàn trường</option><option>Điểm trường A</option><option>Điểm trường B</option></select>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot" id="ndot">3</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">DQ</div>
</header>

<div class="wrap">
  <main class="main"><div id="content"></div></main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>

/* tong hop cho F6 — MAY dem */
function tongHop(b){
 const xl={'Tốt':0,'Khá':0,'Đạt':0,'Chưa đạt':0};
 b.bb.forEach(x=>{if(x.xl)xl[x.xl]++});
 /* Gom theo MENH DE DAU cua moi y. Day la HEURISTIC — may chi gom duoc cach dien dat
    gan giong nhau, khong hieu nghia. Vi the may chi DEM, nguoi van phai doc va ket luan. */
 const gom=function(f){const m={};b.bb.forEach(function(x){
   const k=x[f].split(/[.,;]/)[0].trim().toLowerCase();
   if(!k)return;if(!m[k])m[k]={t:x[f].split(/[.;]/)[0].trim(),n:0,ai:[]};m[k].n++;m[k].ai.push(x.nguoi)});
  return Object.keys(m).map(k=>m[k]).sort((p,q)=>q.n-p.n)};
 let daSo='',mx=0;Object.keys(xl).forEach(k=>{if(xl[k]>mx){mx=xl[k];daSo=k}});
 return {xl:xl,dm:gom('dm'),hc:gom('hc'),dx:b.bb.map(x=>({t:x.dx,ai:x.nguoi})),daSo:daSo};
}

function curTo(){if(!grp())return '';if(!V.to||R().to.indexOf(V.to)<0)V.to=R().to[0];return V.to}

/* ===== VIEC CUA TOI ===== */
function viecCuaToi(){
 const m=me();if(!m)return [];
 const o=[];
 baseB().filter(b=>!b.huy).forEach(function(b){
  const t=tOf(b),st=ttBDG(b);
  /* viet bien ban */
  if(b.tp.indexOf(m)>=0&&t.ngay<=HOMNAY&&!bbCua(b,m))
   o.push({loai:'bb',b:b,t:t,tieu:'Viết biên bản dự giờ',mo:t.lop+' · '+t.mon+' · '+thu(t.ngay)+' '+d2s(t.ngay)});
  /* phan hoi tiet cua minh */
  if(t.gv===m&&b.bb.length&&!b.phanHoi)
   o.push({loai:'ph',b:b,t:t,tieu:'Phản hồi tiết của tôi được dự',mo:b.bb.length+' biên bản đã viết — đọc và phản hồi'});
  /* duyet xin du */
  if(can('duyetxin')&&b.xin.some(x=>x.tt==='cho'))
   o.push({loai:'xin',b:b,t:t,tieu:'Duyệt lượt xin dự thêm',mo:b.xin.filter(x=>x.tt==='cho').map(x=>x.nguoi).join(', ')});
  /* viet ket luan */
  if(can('ketluan')&&st==='Chờ kết luận')
   o.push({loai:'kl',b:b,t:t,tieu:'Viết kết luận buổi dự giờ',mo:b.bb.length+'/'+b.tp.length+' biên bản đã đủ'});
 });
 return o;
}

/* ===== TAB 1 — LICH DU GIO ===== */
function tabLich(){
 let r=baseB();
 const m=me();
 if(V.qf==='sap')r=r.filter(b=>ttBDG(b)==='Sắp diễn ra');
 else if(V.qf==='chobb')r=r.filter(b=>ttBDG(b)==='Chờ biên bản');
 else if(V.qf==='toidu')r=r.filter(b=>b.tp.indexOf(m)>=0&&!b.huy);
 else if(V.qf==='duocdu')r=r.filter(b=>tOf(b).gv===m&&!b.huy);
 else if(V.qf==='huy')r=r.filter(b=>b.huy);
 else if(V.qf.indexOf('dot:')===0)r=r.filter(b=>!b.huy&&b.dot===V.qf.slice(4));
 else if(V.qf==='ngoaidot')r=r.filter(b=>!b.huy&&!b.dot);
 else r=r.filter(b=>!b.huy);
 r.sort((a,b)=>tOf(b).ngay-tOf(a).ngay);
 const QF=[['','Tất cả'],['sap','Sắp diễn ra'],['chobb','Chờ biên bản'],['toidu','Buổi tôi tham gia'],
  ['duocdu','Tiết của tôi được dự'],['huy','Đã hủy']]
  .concat(DOT.filter(d=>baseB().some(b=>b.dot===d.id)).map(d=>['dot:'+d.id,'🏷 '+d.ten]))
  .concat([['ngoaidot','Ngoài đợt']]);
 const head='<div class="hdrow gk"><div>Tiết được dự</div><div>Bài dạy</div><div>Loại</div>'+
  '<div class="kx">Thành phần</div><div class="kx">Biên bản</div><div>Trạng thái</div><div class="kx">Thao tác</div></div>';
 return '<div class="bar">'+QF.map(q=>'<button class="qf '+(V.qf===q[0]?'on':'')+'" data-x="qf" data-t="'+q[0]+'">'+q[1]+'</button>').join('')+
  '<span class="sum"><span>Đang xem <b>'+r.length+'</b> buổi</span></span></div>'+
 '<div class="stage '+(V.pick?'open':'')+'"><div class="listw">'+
  (r.length?head+r.map(rowB).join(''):'<div class="empty"><b>Không có buổi nào khớp bộ lọc</b></div>')+
  '</div><div class="panel">'+(V.pick?panelB():'')+'</div></div>';
}
function rowB(b){
 const t=tOf(b),st=ttBDG(b),L=LOAI[b.loai];
 return '<div class="hrow gk '+(b.huy?'gone':'')+' '+(V.pick===b.id?'on':'')+'" data-x="pick" data-i="'+b.id+'">'+
  '<div><b>'+t.lop+' · '+t.mon+' · tiết '+t.tiet+'</b>'+
   '<div style="font-size:11px;color:var(--ink3)">'+thu(t.ngay)+' '+d2s(t.ngay)+' · '+t.phong+' · <b>'+esc(t.gv)+'</b></div></div>'+
  '<div style="font-size:12px">'+esc(t.bai)+
   '<div style="margin-top:2px">'+(t.coGA?'<span class="st2 o">📄 Có giáo án</span>':'<span class="st2 w">⚠ Chưa có giáo án</span>')+'</div></div>'+
  '<div><span class="st2 '+L.c+'">'+L.t+'</span>'+
   (b.dot&&dotBy(b.dot)?'<div style="margin-top:3px"><span class="st2 y">🏷 '+esc(dotBy(b.dot).ten)+'</span></div>':'')+'</div>'+
  '<div class="kx">'+b.tp.length+' người'+(b.xin.filter(x=>x.tt==='cho').length?'<div style="font-size:10.5px;color:var(--amber)">+'+b.xin.filter(x=>x.tt==='cho').length+' xin dự</div>':'')+'</div>'+
  '<div class="kx"><b>'+b.bb.length+'/'+b.tp.length+'</b></div>'+
  '<div>'+stB(st)+(t.doi?'<div style="margin-top:2px"><span class="st2 r">⚠ Tiết đã đổi</span></div>':'')+'</div>'+
  '<div class="kx" style="display:flex;gap:4px;flex-wrap:wrap">'+actB(b)+'</div></div>';
}
function actB(b){
 const t=tOf(b),st=ttBDG(b),m=me(),o=[];
 const B=(lb,a,c)=>'<button class="btn xs '+(c||'')+'" data-x="'+a+'" data-i="'+b.id+'">'+lb+'</button>';
 if(b.huy){o.push(B('Xem','pick'));return o.join('')}
 if(st==='Sắp diễn ra'){
  o.push(B('Xem','pick'));
  if(t.coGA)o.push(B('👁 Giáo án','xemGA'));
  if(m&&b.tp.indexOf(m)<0&&can('xinDu')&&!b.xin.some(x=>x.nguoi===m))o.push(B('Xin dự thêm','xinDu','p'));
  if(can('tao')&&b.nguoiTao===m)o.push(B('Sửa thành phần','suaTP'));
  if(can('xoa'))o.push(B('Hủy buổi','huy'));
  return o.join('');
 }
 if(m&&b.tp.indexOf(m)>=0&&!bbCua(b,m)&&can('bb'))o.push(B('✍ Viết biên bản','vietBB','p'));
 if(m&&t.gv===m&&b.bb.length&&!b.phanHoi)o.push(B('Phản hồi','phanHoi','p'));
 if(can('ketluan')&&st==='Chờ kết luận')o.push(B('Viết kết luận','ketLuan','p'));
 o.push(B('Xem','pick'));
 if(m&&bbCua(b,m)&&st!=='Đã hoàn tất')o.push(B('Sửa biên bản của tôi','vietBB'));
 if(can('xuat'))o.push(B('Xuất','xuat1'));
 return o.join('');
}

 let body='<div class="ro">🏷 <b>Đợt chuyên môn chỉ là cái NHÃN để gom nhóm.</b> Một buổi dự giờ <b>không thuộc đợt nào vẫn hợp lệ hoàn toàn</b> — '+
  'đợt không sinh chỉ tiêu, không bắt ai đăng ký, không xếp giải.</div>'+
  '<div class="warn">⚠ <b>Không nhầm với Hội thi Giáo viên dạy giỏi</b> (TT 22/2019/TT-BGDĐT). Hội thi có <b>Ban giám khảo</b>, có <b>danh hiệu công nhận</b>, '+
  'giáo viên tham gia <b>tự nguyện</b> — đó là một cuộc thi, <b>không thuộc menu Dự giờ</b>.</div>'+
  '<h3 class="sech">Danh sách đợt</h3><div class="listw"><div class="hdrow gdd"><div>Đợt</div><div>Thời gian</div><div>Trạng thái</div><div class="kx">Buổi</div></div>'+
  DOT.map(function(d){const tt=ttDot(d),c=tt==='Đang mở'?'o':(tt==='Sắp mở'?'b':'n');
   return '<div class="hrow gdd"><div><b>'+esc(d.ten)+'</b>'+(d.mt?'<div style="font-size:11px;color:var(--ink3)">'+esc(d.mt)+'</div>':'')+
    '<div style="font-size:10.5px;color:var(--ink3)">Tạo bởi '+esc(d.nguoiTao)+' · '+d2s(d.ngayTao)+'</div></div>'+
    '<div style="font-size:12px">'+d2s(d.tu)+' → '+d2s(d.den)+'</div><div><span class="st2 '+c+'">'+tt+'</span></div>'+
    '<div class="kx"><b>'+bs.filter(b=>b.dot===d.id).length+'</b></div></div>'}).join('')+'</div>';
 if(ql)body+='<h3 class="sech">Tạo đợt mới</h3>'+
   '<label class="lbl">Tên đợt *</label><input class="inp" id="dTen" style="width:100%" placeholder="ví dụ: Đợt thao giảng chào mừng 26/3">'+
   '<div style="display:flex;gap:10px;margin-top:8px"><div style="flex:1"><label class="lbl">Ngày mở *</label><input class="inp" id="dTu" type="date" style="width:100%"></div>'+
   '<div style="flex:1"><label class="lbl">Ngày đóng *</label><input class="inp" id="dDen" type="date" style="width:100%"></div></div>'+
   '<label class="lbl">Mục đích của đợt</label><input class="inp" id="dMt" style="width:100%" placeholder="tùy chọn">';
 else body+='<div class="ro" style="margin-top:10px">Vai trò của anh/chị <b>chọn được đợt khi tạo buổi</b> nhưng <b>không tạo/sửa danh mục đợt</b> — '+
   'đợt do <b>Phó HT Chuyên môn</b> phát động cho toàn trường.</div>';
 modal('🏷 Đợt chuyên môn',body,
  (ql?'<button class="btn p" data-x="dotLuu">Tạo đợt</button>':'')+'<button class="btn" data-x="close">Đóng</button>');
}
function dlgXuat(){
 modal('Xuất dữ liệu dự giờ',
  '<label class="lbl">Xuất cái gì</label><div class="seg">'+
  '<button class="sgb on" data-x="xk" data-v="1"><b>Một biên bản dự giờ</b><span>Word/PDF theo mẫu của tổ</span></button>'+
  '<button class="sgb" data-x="xk" data-v="2"><b>Hồ sơ đầy đủ một buổi</b><span>mọi biên bản + phản hồi + kết luận</span></button>'+
  '<button class="sgb" data-x="xk" data-v="3"><b>Bảng thống kê dự giờ</b><span>⚖ có dữ liệu cá nhân</span></button></div>'+
  '<div id="xmd"></div><div class="ro" style="margin-top:12px">🔎 Mọi lượt xuất đều <b>ghi Audit Log</b>.</div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="doXuat">⬇ Xuất</button>');
 xuatKind(1);
}
function xuatKind(v){XK=v;
 Array.prototype.forEach.call(document.querySelectorAll('#mb .sgb'),function(b,i){b.classList.toggle('on',i===v-1)});
 $('#xmd').innerHTML=(v===3)
  ?'<div class="warn" style="margin-top:11px">⚖ Bảng này gắn <b>tên giáo viên với xếp loại tiết dạy</b> — dữ liệu cá nhân theo <b>NĐ 13/2023</b>, dùng được để đánh giá thi đua. <b>Bắt buộc chọn mục đích xuất.</b></div>'+
   '<label class="lbl">Mục đích xuất <b>*</b></label><select class="fs" id="mdich" style="width:100%">'+
   '<option value="">— Chọn mục đích —</option><option>Sinh hoạt tổ chuyên môn</option><option>Báo cáo Sở / Phòng GD</option>'+
   '<option>Hồ sơ thanh tra chuyên môn</option><option>Khác — ghi rõ</option></select>'
  :'<div class="ro" style="margin-top:11px">Đây là <b>tài liệu chuyên môn của chính buổi dự giờ</b> — <b>không bắt chọn mục đích</b>.</div>';
}
document.addEventListener('change',function(e){
 const t=e.target;
 if(t.id==='nGV'){V.newGV=t.value;V.newTiet='';renderNew();return}
 if(t.id==='hdt'){toast('🏫 Bộ chọn Điểm trường không cắt dữ liệu — buổi dự giờ gắn với một tiết cụ thể, tiết đã nói rõ lớp và phòng');return}
 if(t.id==='hnam'){if(t.selectedIndex===1)toast('🔒 Năm học <b>Đã kết thúc</b> — chỉ đọc');return}
});
$('#mask').addEventListener('click',function(e){if(e.target.id==='mask')closeModal()});
render();
</script>
</body>
