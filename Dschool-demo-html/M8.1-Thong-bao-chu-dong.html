<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M8.1 Thông báo chủ động — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.lockic{font-size:11px;color:var(--ink3);margin-left:-8px}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:12px;flex-wrap:wrap;line-height:1.6}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber);background:var(--amber-soft);color:#92400e}
.scope.am b{color:#7c2d12}
.scope.vi{border-left-color:var(--violet)}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:230px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.qf{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;background:#fff;display:inline-flex;align-items:center;gap:6px}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.qf .c{background:var(--bg);color:var(--ink2);font-size:10.5px;font-weight:700;padding:0 6px;border-radius:9px}
.qf.on .c{background:rgba(255,255,255,.28);color:#fff}
.qf .c.al{background:var(--red);color:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1240px){.stage.open .listw{display:none}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow .t1{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.hrow .t2{font-size:11.5px;color:var(--ink3);margin-top:2px}
.gtb{grid-template-columns:2.2fr 1.35fr .8fr 1.05fr .95fr}
.stage.open .gtb{grid-template-columns:1.7fr .95fr}
.gdu{grid-template-columns:26px 2.1fr .85fr 1.05fr}
.stage.open .gdu{grid-template-columns:26px 1.7fr}
.glc{grid-template-columns:.62fr 2fr 1.15fr 1.2fr .78fr 1.5fr}
.stage.open .glc{grid-template-columns:.7fr 1.9fr}
.gmu{grid-template-columns:2fr 1.05fr 1fr .95fr 1.2fr}
.stage.open .gmu{grid-template-columns:1.8fr 1fr}
.kx{min-width:0}
.stage.open .kx{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:var(--violet-soft);color:#5b21b6}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2);white-space:nowrap}
.pill.kh{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.eye{font-size:11px;color:var(--brand);border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:1px 7px}
.eye:hover{background:#e0e7ff}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.bc{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-bottom:10px;flex-wrap:wrap}
.bc button{color:var(--brand);font-weight:600}
.bc button:hover{text-decoration:underline}
.bc .cur{font-weight:700;color:var(--ink)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph .n{flex:1;min-width:0}
.ph .n h2{font-size:15px;font-weight:700;line-height:1.4}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbody{padding:13px 15px;max-height:calc(100vh - 300px);overflow-y:auto}
.pfoot{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.f{display:grid;grid-template-columns:126px 1fr;gap:11px;align-items:start;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sech{font-size:13px;font-weight:700;margin:15px 0 7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.sech:first-child{border-top:none;padding-top:0;margin-top:0}
.sech .pill{font-weight:400}
.body-txt{font-size:13px;line-height:1.75;background:#fcfdfe;border:1px solid var(--line);border-radius:9px;padding:11px 13px;white-space:pre-wrap}
.atch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;margin-bottom:6px;background:#fcfdfe}
.atch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.res{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:9px}
.resr{padding:7px 11px;font-size:12.5px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-start}
.resr:first-child{border-top:none}
.resr .w{min-width:210px;font-weight:600;display:flex;gap:6px}
.resr .r{color:var(--ink2);flex:1}
.resr .q{font-weight:700;min-width:52px;text-align:right}
.resr.ok{background:var(--green-soft)}
.resr.wr{background:var(--amber-soft)}
.resr.bd{background:var(--red-soft)}

.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.g::before{background:var(--green)}.logi.r::before{background:var(--red)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.stepn{display:flex;gap:6px;align-items:center;margin-bottom:14px;font-size:12px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:var(--bg);color:var(--ink2)}
.stp.on{background:var(--brand);color:#fff;font-weight:700}
.stp.dn{background:var(--green-soft);color:var(--green);font-weight:600}
.stp:disabled{opacity:.45;cursor:not-allowed}
.stpar{color:var(--ink3);font-size:11px}
.gsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.gsec h3{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gf{margin-bottom:12px}
.gf label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.gf label b{color:var(--red)}
.gf .hint{font-size:11px;color:var(--ink3);margin-top:3px}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;background:#fff;min-height:120px;resize:vertical;font-family:inherit;line-height:1.7}
.ta:focus,.ti:focus{border-color:var(--brand);outline:none}
.ta.sm{min-height:60px}
.ti{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;background:#fff}
.ti.err,.ta.err{border-color:var(--red);background:var(--red-soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:8px 13px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35}
.sgb b{display:block}
.sgb span{font-size:10.5px;color:var(--ink3)}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.sgb.on span{color:var(--brand)}
.sgb:disabled{opacity:.45;cursor:not-allowed;background:var(--bg)}
.chk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:9px;padding:7px 12px;font-size:12.5px;background:#fff}
.chk.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.chk.dis{opacity:.5;background:var(--bg);cursor:not-allowed}
.chk .bx{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:10px;color:#fff;flex:0 0 15px}
.chk.on .bx{background:var(--brand);border-color:var(--brand)}
.tree{border:1px solid var(--line);border-radius:10px;max-height:290px;overflow-y:auto;background:#fcfdfe}
.trg{padding:6px 12px;background:#f1f5f9;font-size:11px;font-weight:700;color:var(--ink2);border-bottom:1px solid var(--line);position:sticky;top:0}
.trw{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.trw:hover{background:var(--brand-soft)}
.trw.on{background:#eff6ff}
.trw .bx{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:10px;color:#fff;flex:0 0 15px}
.trw.on .bx{background:var(--brand);border-color:var(--brand)}
.trw .mt{margin-left:auto;color:var(--ink3);font-size:11px}
.trw.dis{opacity:.5;cursor:not-allowed;background:#fafbfc}
.uoc{border:1px solid #bfdbfe;background:var(--brand-soft);border-radius:10px;padding:11px 13px;font-size:12.5px;color:#1e40af;line-height:1.75}
.uoc .big{font-size:21px;font-weight:800;color:#1d4ed8}
.uoc.zero{border-color:#fecaca;background:var(--red-soft);color:#991b1b}
.uoc.zero .big{color:var(--red)}

.pv{display:grid;grid-template-columns:236px 1fr;gap:14px}
@media(max-width:900px){.pv{grid-template-columns:1fr}}
.phone{background:#1e293b;border-radius:20px;padding:9px;box-shadow:0 6px 22px rgba(15,23,42,.22)}
.pscr{background:linear-gradient(160deg,#334155,#0f172a);border-radius:13px;min-height:250px;padding:13px 10px;position:relative}
.ptime{color:#e2e8f0;font-size:19px;font-weight:300;text-align:center;letter-spacing:.03em}
.pdate{color:#94a3b8;font-size:10.5px;text-align:center;margin-bottom:14px}
.pcard{background:rgba(248,250,252,.94);border-radius:11px;padding:8px 10px;font-size:10.5px;color:#0f172a}
.pcard .ap{display:flex;align-items:center;gap:5px;color:#475569;font-size:9px;margin-bottom:3px}
.pcard .ap .ic{width:12px;height:12px;border-radius:3px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:7px}
.pcard b{display:block;font-size:11px;line-height:1.35}
.pcard .bd{color:#475569;line-height:1.4;margin-top:2px}
.cut{color:var(--red);font-weight:700}
.pnote{font-size:11px;color:var(--ink3);text-align:center;margin-top:7px;line-height:1.5}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.slot{background:#fef3c7;border-bottom:1.5px solid #f59e0b;padding:0 2px;font-weight:700;color:#92400e;border-radius:2px}
/* SL24-Z v1.5 — khoi .noacc cua §5.1: viec NGOAI pham vi D — noi ra, ⛔ khong an im lang */
.stage .noacc{padding:34px 22px;text-align:center;font-size:13px;line-height:1.65;color:var(--ink2)}
.stage .noacc .ic{font-size:34px;margin-bottom:10px}
.stage .noacc.ln{padding:10px 14px;text-align:left;font-size:12.5px;background:#f8fafc;border-top:1px dashed var(--line2,#cbd5e1)}

/* ══════════════════════════════════════════════════════════════════════════
   CSS CỦA BỐN TAB BÁO CÁO ĐẶT TẠI MENU CHỦ — `BCM9-3C` (20/9/2026)

   Trích từ `demo-src/M9.13-Bao-cao-CSVC-thiet-bi/style.css` (phần của nhóm 📊:
   dải giải thích · PV · KB · panel drill-down · XU), rồi ĐÓNG KHUNG mọi bộ chọn
   dưới `body.bc9`.

   Vì sao phải đóng khung — không phải để cho đẹp:
   menu chủ đã có sẵn `.ro` `.dnote` `.empty` `.toast` `.badrow` `.tbx` `.big`
   của riêng nó. Dán thẳng CSS của nhóm 📊 vào thì sáu tab cũ của `M6.9`, ba tab
   của `M6.12`, bốn tab của `M8.1`, hai tab của `M8.4` ĐỔI HÌNH mà không ai đụng
   vào chúng — đúng thứ prompt `3C` §1 cấm ("tab cũ giữ nguyên từng dòng").
   `body.bc9` chỉ được gắn khi tab báo cáo đang mở.

   Hai bộ chọn KHÔNG đóng khung, cố ý: panel `#kbMask` và hộp xuất `#xuMask` do

function uoc(pv){
 const vai=pv.vai||[];let ph=0,hs=0,ns=0,chualk=0; /* chualk — TKPH 25/9: em chưa có phụ huynh liên kết App */
 if(pv.loai==='to'){ns=(pv.ids||[]).reduce((a,b)=>a+(TOCM[b]||0),0)}
 else if(pv.loai==='nhom'){ns=(pv.ids||[]).reduce((a,b)=>a+(NHOMCD[b]||0),0)}
 else if(pv.loai==='canhan'){(pv.ids||[]).forEach(function(t){const p=NGUOI.find(x=>x.t===t);if(!p)return;if(p.l==='NS')ns++;else ph++})}
 else{
  const ls=lopCua(pv.loai,pv.ids||[]);
  ls.forEach(function(i){ph+=LOP[i].ph;hs+=LOP[i].hs;ns+=LOP[i].gv;chualk+=Math.round(LOP[i].hs*0.03)});
  if(pv.loai==='truong')ns=132;
  else if(pv.loai==='dt')ns=(pv.ids||[]).reduce((a,b)=>a+(DTS[b]?DTS[b].ns:0),0);
 }
 if(pv.loai!=='canhan'){
  if(vai.indexOf('PH')<0){ph=0;chualk=0}
  if(vai.indexOf('HS')<0)hs=0;
  if(vai.indexOf('NS')<0)ns=0;
 }
 const tong=ph+hs+ns;
 const push=Math.round((ph+hs)*0.78)+Math.round(ns*0.95);
 return {ph:ph,hs:hs,ns:ns,tong:tong,push:Math.min(push,tong),inapp:tong-Math.min(push,tong),chualk:chualk};
}
function nhanPV(pv){

 if(pv.loai==='dt')return pv.ids.map(i=>DTS[i].ten).join(', ')+hau;
 if(pv.loai==='khoi')return 'Khối '+pv.ids.join(', ')+hau;

 return '—';
}

<script>
"use strict";
/* ============ TRANG THAI MAN HINH ============ */
let V={view:'list',tab:'toi',chip:'all',chipL:'sap',pick:null,kind:'tb',q:'',sel:[],hdt:'ALL'};

const TT={draft:{t:'Nháp',c:'n'},pending:{t:'Chờ duyệt',c:'w'},rejected:{t:'Bị từ chối',c:'r'},
 scheduled:{t:'Đã lên lịch',c:'b'},sent:{t:'Đã gửi',c:'o'},cancelled:{t:'Đã hủy',c:'n'}};
const byId=id=>TB.find(x=>x.id===id);
const mauById=id=>MAU.find(x=>x.id===id);

function chamLop(tb){
 const p=tb.pv;
 if(p.loai==='to'||p.loai==='nhom'||p.loai==='canhan')return [];
 return lopCua(p.loai,p.ids||[]);
}
function chamDT(tb){
 const p=tb.pv;
 if(p.loai==='dt')return p.ids.slice();
 const ls=chamLop(tb);const s={};ls.forEach(i=>s[LOP[i].dt]=1);
 if(p.loai==='to'||p.loai==='nhom')return ['A','B','C'];
 if(p.loai==='canhan'){const r={};(p.ids||[]).forEach(function(t){const n=NGUOI.find(x=>x.t===t);if(n)r[n.dt]=1});return Object.keys(r)}
 return Object.keys(s);
}
/* Pham vi la RANG BUOC DU LIEU — ban ghi ngoai pham vi khong co trong ket qua tra ve */
function trongPV(tb){
 const r=R();
 if(r.f5==='authored')return tb.ai===r.me;
 if(r.sc.indexOf('School')===0)return true;
 if(r.to)return tb.pv.loai==='to'&&(tb.pv.ids||[]).indexOf(r.to)>=0;
 if(r.lop)return chamLop(tb).some(i=>r.lop.indexOf(i)>=0);
 if(r.dt)return chamDT(tb).indexOf(r.dt)>=0;
 return true;
}
function locDT(tb){ /* bo chon Diem truong o header */
 const d=R().dt||V.hdt;
 if(!d||d==='ALL')return true;
 return chamDT(tb).indexOf(d)>=0;
}
const myTB=()=>TB.filter(t=>t.ai===R().me);
/* ============ MO HINH DUYET §5 · §5.1 (v1.5 — SL24 Đ2) ============
   Cau 1: Toan truong HOAC ca mot Diem truong ⇒ phai co mot chu ky D. Nho hon ⇒ khong.
   Cau 2: chu ky phai cua nguoi co D PHU TRON nguoi nhan. D @ School phu moi thu;
          D @ Branch chi phu tin gui dung MOT diem truong cua minh.
   Hang doi KHONG co «nguoi duoc giao» — la tap moi vai co D phu tron, suy lai moi lan ve. */
const PHTDT_CUA={A:'Trần Văn Bảo',B:'Ngô Minh Tâm'}; /* DT C khong co PHT diem truong */
const canD=pv=>pv.loai==='truong'||pv.loai==='dt';
function phuTron(r,pv){
 if(!r.duyet)return false;
 if(!r.dD)return true; /* D @ School */
 return pv.loai==='dt'&&(pv.ids||[]).length===1&&pv.ids[0]===r.dD;
}
/* Ten hang doi se nhan viec — noi dich danh o buoc 4 va trong nhat ky (§8.2.5) */
function aiDuyet(pv){
 const d=pv.loai==='dt'&&(pv.ids||[]).length===1?pv.ids[0]:null;
 if(d&&PHTDT_CUA[d])return {ten:'Phó hiệu trưởng '+DTS[d].ten+' và Hiệu trưởng',hai:true};
 return {ten:'Hiệu trưởng',hai:false};
}
const queueDu=()=>R().duyet?TB.filter(t=>t.tt==='pending'&&t.ai!==R().me&&canD(t.pv)&&phuTron(R(),t.pv)):[];
/* §4 v1.5: bo chon diem truong loc MOT PHAN — viec ca mot diem truong theo bo chon, viec toan truong luon hien */
const queue=()=>queueDu().filter(t=>t.pv.loai!=='dt'||!V.hdt||V.hdt==='ALL'||t.pv.ids.indexOf(V.hdt)>=0);
/* §5.1 cho 1 — dem viec toan truong dang cho Hieu truong, NGOAI pham vi D @ Branch; chi dem, ⛔ khong noi dung */
const ngoaiPV=()=>R().duyet&&R().dD?TB.filter(t=>t.tt==='pending'&&t.pv.loai==='truong').length:0;
const lichTB=()=>TB.filter(t=>(t.tt==='scheduled'||t.tt==='sent')&&trongPV(t)&&locDT(t));

/* Doi thong bao: dem so luot phat cham vao cung mot LOP trong cua so 3 gio,
   chi tinh luot co nguoi nhan la Phu huynh (§8.5.1). Nguong 3 luot / 3 gio. */
function doiTin(lop,khi,boQua){
 return TB.filter(function(t){
  if(boQua&&t.id===boQua)return false;
  if(t.tt!=='scheduled'&&t.tt!=='sent')return false;
  if(!t.phat)return false;
  if((t.pv.vai||[]).indexOf('PH')<0)return false;
  if(chamLop(t).indexOf(lop)<0)return false;
  return Math.abs(t.phat-khi)<=3*3600*1000;
 });
}
function quetDoi(ds){ /* tra ve canh bao dau tien tim duoc trong mot nhom ngay */
 const m={};
 ds.forEach(function(t){if((t.pv.vai||[]).indexOf('PH')<0)return;chamLop(t).forEach(function(l){(m[l]=m[l]||[]).push(t)})});
 let best=null;
 Object.keys(m).forEach(function(l){
  const a=m[l].slice().sort((x,y)=>x.phat-y.phat);
  for(let i=0;i<a.length;i++){
   const w=a.filter(t=>t.phat-a[i].phat>=0&&t.phat-a[i].phat<=3*3600*1000);
   if(w.length>=3&&(!best||w.length>best.n))best={lop:l,n:w.length,tu:w[0].phat,den:w[w.length-1].phat,ai:w.map(x=>x.ct)};
  }
 });
 return best;
}

/* ============ SIDEBAR ============ */
const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','4'],['M0.3','Thông báo của tôi','7'],['M0.4','Trang cá nhân']]],
 ['hs','👥 Học sinh',[['M1.1','Hồ sơ học sinh'],['M1.7','Lớp học & Chuyển lớp']]],

 ['ns','👨‍🏫 Nhân sự',[['M4.1','Hồ sơ nhân sự'],['M4.5','Phân công giảng dạy'],['M4.8','Nghỉ phép']]],
 ['vh','🏫 Vận hành & Dịch vụ',[['M6.1','Bán trú'],['M6.8','Sự kiện trường học'],['M6.9','Văn thư — Công văn']]],
 ['gt','💬 Giao tiếp',[['M8.1','Thông báo chủ động'],['M8.2','Nhắn tin'],['M8.7','Quản lý nhóm chat']]],   /* TKCT-Z 24/9/2026: M8.3 gỡ → M8.7 */
 ['qt','⚙️ Quản trị',[['M10.1','Hồ sơ năm học'],['M10.6','Trung tâm cấu hình']]]];
const NAVOK={FULL:'all',HT:'all',PHT_CM:['lop','ns','vh','gt','qt'],PHT_DT:['hs','lop','vh','gt'],PHT_DT_B:['hs','lop','vh','gt'],
 TCNS:['ns','vh','gt','qt'],VT:['hs','vh','gt'],TTCM:['lop','ns','gt'],GVCN:['hs','lop','gt'],GVBM:['lop','gt']};
function sidebar(){
 const a=NAVOK[role],full=a==='all',hide=R().hide||[];
 $('#side').innerHTML=NAV.map(function(g){

  return '<div class="sgrp">'+g[1]+'</div>'+items.map(function(it){
   const cu=it[0]==='M8.1',nb=cu?(queue().length||0):(it[2]||0);
   return '<div class="snav '+(cu?'on':'')+' '+(on?'':'off')+'">'+
    '<span style="font-size:10.5px;opacity:.55;min-width:30px">'+it[0]+'</span>'+
    '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+it[1]+'</span>'+
    (nb?'<span class="nb">'+nb+'</span>':'')+'</div>'}).join('')}).join('');
}
function header(){
 const r=R();$('#ava').textContent=r.ava;
 const sel=$('#hdt');
 if(r.dt){sel.innerHTML='<option>'+DTS[r.dt].ten+'</option>';sel.disabled=true;$('#hlock').textContent='🔒';V.hdt=r.dt}
 else{sel.innerHTML='<option value="ALL">Toàn trường</option>'+Object.keys(DTS).map(k=>'<option value="'+k+'">'+DTS[k].ten+'</option>').join('');
  sel.disabled=false;$('#hlock').textContent='';sel.value=V.hdt}

/* ============ KHUNG MAN HINH ============ */
function tabsOf(){
 const t=[];
 if(R().duyet&&queue().length)t.push(['duyet','⏳ Chờ tôi duyệt',queue().length,true]);
 t.push(['toi','Thông báo của tôi',myTB().length,false]);
 t.push(['lich','Lịch phát tán',lichTB().length,false]);
 t.push(['mau','Mẫu thông báo',MAU.filter(m=>m.tt==='dung').length,false]);

 if(typeof bcPTCoTab==='function'&&bcPTCoTab())t.push(['bc','📊 Báo cáo phát tán',0,false]);

function render(){
 sidebar();header();

 if(!ts.some(x=>x[0]===V.tab))V.tab='toi';

  /* 🛑 tab báo cáo KHÔNG có nút ghi: hai nút xuất thay cho «＋ Soạn thông báo» */
  (laBC?(BCN?BC.nutXuat(bcPTCoXuat())+' '+BC.nutGhiChu():'')
      :'<button class="btn p" data-x="new">＋ Soạn thông báo</button>')+'</div>';
 h+='<div class="tabs">'+ts.map(function(t){
   return '<button class="tab1 '+(V.tab===t[0]?'on':'')+'" data-tab="'+t[0]+'">'+t[1]+
    (t[2]?'<span class="b '+(t[3]?'al':'')+'">'+t[2]+'</span>':'')+'</button>'}).join('')+'</div>';
 h+=scopeBar();
 h+=laBC?veBaoCaoPhatTan()
   :V.tab==='duyet'?vDuyet():V.tab==='toi'?vToi():V.tab==='lich'?vLich():vMau();

 let h='<div class="scope"><span>🏫</span><span class="sp">Bạn đang xem với vai <b>'+r.n+'</b>. Phạm vi: <code>'+r.sc+'</code>. '+r.scT+'</span></div>';
 if(V.tab==='mau')h+='<div class="scope am"><span>⚠</span><span class="sp">Mẫu là dữ liệu <b>Master dùng chung toàn trường, xuyên năm học</b> — đổi bộ chọn năm học hay điểm trường ở header <b>không</b> làm đổi danh sách này.</span></div>';

 return h;
}

/* ============ F1 — THONG BAO CUA TOI ============ */
const CHIPS=[['all','Tất cả'],['draft','Nháp'],['pending','Chờ duyệt'],['rejected','Bị từ chối'],
 ['scheduled','Đã lên lịch'],['sent','Đã gửi'],['cancelled','Đã hủy']];
function vToi(){
 const all=myTB();
 let ds=all.filter(t=>V.chip==='all'||t.tt===V.chip);
 const q=kd(V.q);
 if(q)ds=ds.filter(t=>kd(t.tieu+' '+t.id+' '+nhanPV(t.pv)).indexOf(q)>=0);
 ds=ds.slice().sort((a,b)=>(b.phat||b.sua||0)-(a.phat||a.sua||0));
 let h='<div class="bar"><input class="inp" id="q" placeholder="Tìm theo tiêu đề, mã, người nhận…" value="'+esc(V.q)+'">';
 h+=CHIPS.map(function(c){
   const n=c[0]==='all'?all.length:all.filter(t=>t.tt===c[0]).length;
   const al=(c[0]==='rejected'||c[0]==='cancelled')&&n>0;
   return '<button class="qf '+(V.chip===c[0]?'on':'')+'" data-chip="'+c[0]+'">'+c[1]+
    (n?'<span class="c '+(al?'al':'')+'">'+n+'</span>':'')+'</button>'}).join('');
 h+='<div class="sum"><span>Bộ lọc bản ghi <code>authored</code> — chỉ thông báo <b>do tôi tạo</b></span></div></div>';
 h+='<div class="stage '+(V.pick&&(V.kind==='tb'||V.kind==='noacc')?'open':'')+'"><div class="listw">';
 h+='<div class="hdrow gtb"><div>Tiêu đề</div><div>Người nhận</div><div class="kx">Quy mô</div><div class="kx">Thời điểm</div><div>Trạng thái</div></div>';
 if(!ds.length)h+='<div class="empty"><b>Không có thông báo nào</b>Đổi chip lọc, hoặc bấm <b>＋ Soạn thông báo</b> để tạo bản mới.</div>';
 ds.forEach(function(t){
  const u=t.tt==='sent'?t.kq:uoc(t.pv);
  const so=t.tt==='sent'?(t.kq.push+t.kq.inapp+t.kq.loi):u.tong;
  const khi=t.tt==='sent'?dt2s(t.phat):t.tt==='scheduled'?('hẹn '+dt2s(t.phat)):t.tt==='draft'?('sửa '+dt2s(t.sua||HOMNAY)):(t.ls&&t.ls.length?dt2s(t.ls[t.ls.length-1].t):'—');
  h+='<div class="hrow gtb '+(V.pick===t.id?'on':'')+'" data-tb="'+t.id+'">'+
   '<div><div class="t1">'+CDIC[t.chude]+' '+esc(t.tieu)+(t.khan?' <span class="pill kh">KHẨN</span>':'')+
     (t.dcBoi?' <span class="pill" style="border-color:#fde68a;background:#fffbeb;color:#92400e">⚠ đã có đính chính</span>':'')+
     (t.nguon?' <span class="pill" style="border-color:#c7d2fe;background:#eef2ff;color:#3730a3" title="Sinh từ một chữ ký ở menu chủ — §1.3">⚙ '+t.nguon.menu+'</span>':'')+'</div>'+
     '<div class="t2">'+t.id+' · '+t.chude+(t.mon?' · môn '+t.mon:'')+'</div></div>'+

 });
 h+='</div>'+panel()+'</div>';
 return h;
}

/* ============ F4 — CHO TOI DUYET ============ */
function vDuyet(){
 const ds=queue(),r=R();
 let h='<div class="info">Hàng đợi này chứa thông báo <b>do người khác viết</b> gửi <b>toàn trường</b> hoặc <b>cả một điểm trường</b>, mà quyền <code>D</code> của bạn '+
  (r.dD?'(<code>Branch — '+DTS[r.dD].ten+'</code>) <b>phủ trọn</b> người nhận — tức chỉ việc gửi cả '+DTS[r.dD].ten+'.':'(<code>School</code>) <b>phủ trọn</b> người nhận — tức mọi việc cần duyệt.')+
  ' Chúng không nằm trong danh sách <code>authored</code> ở tab “Thông báo của tôi”, nên phải có tab riêng (§3.1). Việc cấp điểm trường nằm ở <b>hai hàng đợi</b> — Phó hiệu trưởng điểm trường và Hiệu trưởng — <b>ai ký trước thì xong</b> (§5.1). Bấm một dòng để <b>xem và duyệt ngay tại chỗ</b>.</div>';
 /* 🧪 chi de ra soat §8.4 dong «da duoc nguoi khac duyet»: mot viec dang chon nam o hai hang doi */
 const hai=V.sel.map(byId).filter(t=>t&&t.tt==='pending'&&t.pv.loai==='dt'&&aiDuyet(t.pv).hai);
 h+='<div class="bar">'+
  '<button class="btn '+(V.sel.length?'p':'')+'" data-x="bulk" '+(V.sel.length?'':'disabled')+'>✓ Duyệt các mục đã chọn'+(V.sel.length?' ('+V.sel.length+')':'')+'</button>'+
  '<button class="btn sm" data-x="selall">'+(V.sel.length===ds.length?'Bỏ chọn tất cả':'Chọn tất cả')+'</button>'+
  (hai.length?'<button class="btn sm" data-x="giaky" title="Demo: giả lập người thứ hai có D phủ trọn ký trước, trong lúc bạn đang xem">🧪 Mô phỏng: người kia ký trước '+hai[0].id+'</button>':'')+
  '<div class="sum"><span>Từ chối <b>không</b> làm hàng loạt — mỗi bản cần một lý do riêng</span></div></div>';
 h+='<div class="stage '+(V.pick&&(V.kind==='tb'||V.kind==='noacc')?'open':'')+'"><div class="listw">';
 h+='<div class="hdrow gdu"><div></div><div>Thông báo · người trình</div><div class="kx">Quy mô</div><div class="kx">Trình lúc</div></div>';
 if(!ds.length)h+='<div class="empty"><b>Hàng đợi trống</b>Không có thông báo nào chờ chữ ký của bạn.</div>';
 ds.forEach(function(t){

<script>

 h+='<div class="stage '+(V.pick&&(V.kind==='tb'||V.kind==='noacc')?'open':'')+'"><div class="listw">';

    '<span style="opacity:.85">Đây là cảnh báo, không phải chặn: giãn lịch hoặc hủy bằng nút ở từng dòng.</span></div>';

/* ============ F3 — PANEL CHI TIET ============ */

 if(t.dcBoi)h+='<div class="warn">⚠ Thông báo này <b>đã có đính chính</b>: <button class="rolnk" data-go="'+t.dcBoi+'">'+t.dcBoi+' ↗</button></div>';
 if(t.dcCho)h+='<div class="info">📝 Đây là <b>bản đính chính</b> cho <button class="rolnk" data-go="'+t.dcCho+'">'+t.dcCho+' ↗</button> — người nhận sao chép nguyên bản gốc và không sửa được.</div>';
 /* KGLH-1G — khối riêng của ĐƯỜNG ③: bản ghi sinh từ một chữ ký ở menu chủ (§1.3) */

 function tatDai(s){var m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)return '—';

    '⛔ Không phải trường thứ mười của bản ghi.</span></div></div>'+
   '<div class="ro">🛑 <b>Hết hạn là hết CHIẾU, ⛔ không phải hết VẾT.</b> Sau ngày trên, máy chủ <b>thôi trả bản ghi</b> '+
   'cho ba bề mặt chiếu và dải tự tắt — nhưng bản ghi này <b>không bị xóa, không đổi trạng thái</b>: nó vẫn ở đây, vẫn đếm ở '+
   '<b>Lịch phát tán</b> và <b>📊 Báo cáo phát tán</b>, vẫn xuất được kết quả giao nhận, và tin vẫn nằm ở <b>M0.3</b> của người nhận. '+

   'Người đứng tên là <b>chính người đã ký</b>, nên bản ghi này <b>không vào hàng đợi «Chờ tôi duyệt»</b> (§1.3.1 điều kiện 3).</div>';
 }
 if(t.lich)h+='<div class="warn">🕐 Bản nháp này đã đặt lịch dự kiến <b>'+dt2s(t.lich)+'</b>. Giờ đó rơi vào <b>khung im lặng 21:00–6:00</b> — mở lại bản nháp để xem cảnh báo ở bước 4.</div>';

  h+='<div class="ro">Xem tệp ngay trong màn hình, không bắt tải về mở phần mềm khác. <b>Mỗi lượt xem và tải đều ghi audit</b> — Luật BVDLCN 91/2025.</div>';
 }

 if(t.tt==='sent'){
  const tot=t.kq.push+t.kq.inapp+t.kq.loi;
  h+='<div class="f"><div class="k">Số người nhận</div><div class="v">'+n3(tot)+' <span class="pill">thực tế lúc phát '+dt2s(t.phat)+'</span></div></div>'+

 return h;
}

function panelNgoai(t){
 const r=R(),id=t?t.id:V.pick;

 if(t&&t.pv.loai==='truong')vuot='gửi <b>toàn trường</b> — vượt ra ngoài '+(r.dD?DTS[r.dD].ten:'phạm vi của bạn');

<script>

/* ============ F2 — SOAN & GUI THONG BAO (man hinh day du, 4 buoc) ============ */

 C={step:1,mode:'new',id:null,chude:r.mon?'Học tập':'',mon:r.mon||'',tieu:'',nd:'',tep:[],

 const chan=[],canh=[];const u=uoc(curPV());const L=lichDate();
 if(!C.chude)chan.push({s:1,m:'Chưa chọn <b>chủ đề</b>. Chủ đề quyết định người nhận lọc được tin ở M0.3 và là ràng buộc có vết với vai giáo viên bộ môn.'});
 if(role==='GVBM'&&!C.mon)chan.push({s:1,m:'Vai giáo viên bộ môn <b>bắt buộc gắn môn</b> cho thông báo.'});
 if(!C.tieu.trim())chan.push({s:1,m:'Chưa nhập <b>tiêu đề</b>. Đây là dòng người nhận thấy trên màn hình khóa điện thoại.'});
 if(!C.nd.trim())chan.push({s:1,m:'Chưa nhập <b>nội dung</b> thông báo.'});

 if(sl.length)chan.push({s:1,m:'Còn <b>'+sl.length+' ô điền động chưa thay</b> từ mẫu: '+sl.map(x=>'<code>'+esc(x)+'</code>').join(', ')+'. Gửi đi thì người nhận thấy nguyên dấu ngoặc.'});
 if(!C.pvLoai)chan.push({s:2,m:'<b>Chưa chọn ai nhận</b> thông báo này.'});
 else if(C.pvLoai!=='truong'&&!C.pvIds.length)chan.push({s:2,m:'Đã chọn nhánh <b>'+PVTEN[C.pvLoai]+'</b> nhưng chưa tích mục nào bên trong.'});
 else if(['truong','dt','khoi','lop'].indexOf(C.pvLoai)>=0&&!C.vai.length)
   chan.push({s:2,m:'Đã chọn <b>'+nhanPV({loai:C.pvLoai,ids:C.pvIds,vai:[]})+'</b> nhưng chưa chọn gửi cho phụ huynh, học sinh hay nhân sự.'});
 else if(u.tong===0){
   const rong=C.pvLoai==='lop'?C.pvIds.filter(i=>LOP[i]&&LOP[i].hs===0):[];

 }

 if(big.length)chan.push({s:1,m:'Tệp <b>'+esc(big[0].ten)+'</b> nặng '+big[0].kb+', vượt giới hạn 20MB.'});
 if(C.khi==='lich'&&L<=HOMNAY)chan.push({s:3,m:'Giờ phát đã chọn là <b>'+dt2s(L)+'</b>, đã qua mốc hiện tại '+dt2s(HOMNAY)+'. Chọn lại giờ.'});

 /* canh bao mem */
 const gio=C.khi==='lich'?L.getHours():HOMNAY.getHours();
 if(C.khi==='lich'&&(gio>=21||gio<6)&&!C.khan)
  canh.push({k:'W1',m:'Giờ phát <b>'+hm(L)+'</b> rơi vào <b>khung im lặng 21:00–6:00</b>. Push sẽ được giữ lại tới 6:00 sáng hôm sau, tin vẫn vào feed ngay.',
   btn:['doi6','Dời sang 6:00 sáng hôm sau']});
 if(C.khan)canh.push({k:'W5',m:'Cờ <b>Khẩn</b> sẽ đánh thức người nhận ngoài giờ và được <b>ghi nhật ký riêng</b>. Cờ này <b>không</b> thay đổi việc thông báo có cần duyệt hay không.'});
 if(C.vai.indexOf('PH')>=0){

 if(C.chude==='Hành chính'&&C.tep.length)

   btn:['m69','↗ Mở M6.9 Văn thư (action=tao)']});
 if(u.tong&&u.inapp/u.tong>0.3)

 return {chan:chan,canh:canh,u:u,L:L};

function guiTB(){
 const k=kiemTra();if(k.chan.length)return;
 /* §5 v1.5 (SL24 Đ2): can D = Toan truong HOAC ca mot Diem truong; tu thoa man khi D cua nguoi tao PHU TRON */
 const r=R(),u=k.u,pv0={loai:C.pvLoai,ids:C.pvIds},canKy=canD(pv0)&&!phuTron(r,pv0);
 const quiet=C.khi==='lich'&&(k.L.getHours()>=21||k.L.getHours()<6)&&!C.khan;
 const id=C.mode==='edit'&&C.id?C.id:nextId();
 let t=C.mode==='edit'&&C.id?byId(C.id):null;
 if(!t){t={id:id,ls:[]};TB.push(t)}
 Object.assign(t,{ai:r.me,ct:r.ct,chude:C.chude,mon:C.mon||undefined,khan:C.khan,tieu:C.tieu,nd:C.nd,
  tep:C.tep.slice(),pv:{loai:C.pvLoai,ids:C.pvIds.slice(),vai:C.vai.slice()},dcCho:C.dcCho||undefined});
 if(C.dcCho){const g=byId(C.dcCho);if(g)g.dcBoi=t.id}
 if(canKy){
  const a=aiDuyet(t.pv),pvT=t.pv.loai==='truong'?'Toàn trường':t.pv.ids.map(i=>DTS[i].ten).join(', ');
  t.tt='pending';t.phat=C.khi==='lich'?k.L:null;
  t.ls.push(L(HOMNAY,r.me,r.ct,'Trình duyệt — phạm vi '+pvT+', vào hàng đợi của '+a.ten));
  V.view='list';V.tab='toi';V.chip='pending';V.pick=t.id;V.kind='tb';render();
  modal('📨 Đã gửi duyệt','<div class="info">Thông báo <b>'+t.id+'</b> đã vào <b>hàng đợi duyệt của '+a.ten+'</b>'+(a.hai?' — <b>ai duyệt trước thì phát</b>':'')+' và <b>chưa phát tán</b>.</div>'+
   '<div class="ro">Thông báo gửi <b>toàn trường</b> hoặc <b>cả một điểm trường</b> cần một chữ ký <code>D</code> phủ trọn người nhận (§5). Vai của bạn không có <code>D</code> ấy nên bản này phải xếp hàng — đổi sang vai '+
   (a.hai?'<b>PHT_DT'+(t.pv.ids[0]==='B'?' (ĐT B)':'')+'</b> hoặc <b>HT</b>':'<b>HT</b>')+' ở thanh đen để duyệt nó.</div>');
  return;
 }
 if(C.khi==='lich'){
  t.tt='scheduled';t.phat=k.L;
  t.ls.push(L(HOMNAY,r.me,r.ct,'Đặt lịch phát '+dt2s(k.L)+(C.khan?' · đánh dấu KHẨN':'')));
  V.view='list';V.tab='lich';V.chipL='sap';V.pick=t.id;V.kind='tb';render();
  toast('🕐 Đã đặt lịch <b>'+t.id+'</b> phát lúc '+dt2s(k.L)+(quiet?' — push sẽ giữ tới 6:00':''));
  return;
 }
 t.tt='sent';t.phat=new Date(HOMNAY);t.kq=lamKQ(u,false);
 t.ls.push(L(HOMNAY,r.me,r.ct,'Phát tán tới '+n3(u.tong)+' người nhận'+(C.khan?' · KHẨN, bỏ qua khung im lặng':'')));
 V.view='list';V.tab='toi';V.chip='sent';V.pick=t.id;V.kind='tb';render();
 modal('📤 Kết quả phát tán — '+t.id,
  '<div class="ro">Phát tán là <b>thao tác hàng loạt</b>, nên phải có bảng tách rõ dòng thành công và dòng bị bỏ qua kèm lý do, không phải một dòng toast. Bảng này <b>lưu lại</b> và mở lại được từ chi tiết thông báo.</div>'+
  kqBang(t.kq)+
  '<div class="ro" style="margin-top:10px">Cột trạng thái ghi <b>“đã đẩy tới thiết bị”</b>, không ghi “đã đọc” — MVP không đo lượt đọc (§8.5.3).</div>');
}
function duyetTB(t,ok,ly){
 const r=R();
 if(ok){
  if(t.phat&&t.phat>HOMNAY){t.tt='scheduled'}
  else{t.tt='sent';t.phat=new Date(HOMNAY);t.kq=lamKQ(uoc(t.pv),false)}
  t.ls.push(L(HOMNAY,r.me,r.ct,'Duyệt đồng ý — '+(t.tt==='scheduled'?'giữ lịch phát '+dt2s(t.phat):'phát tán ngay')));
 }else if(ly.k==='no'){t.tt='rejected';t.lyDo=ly.t;t.ls.push(L(HOMNAY,r.me,r.ct,'Từ chối — có nêu lý do'))}
 else{t.tt='draft';t.sua=new Date(HOMNAY);t.lyDo=ly.t;t.ls.push(L(HOMNAY,r.me,r.ct,'Yêu cầu chỉnh sửa — trả về Nháp cho người tạo'))}
}
function bulkDuyet(){
 const ok=[],skip=[];
 V.sel.forEach(function(id){
  const t=byId(id);if(!t)return;
  if(t.tt!=='pending'){
   /* §8.4 v1.5 — viec cap diem truong nam o HAI hang doi: nguoi kia ky truoc thi viec roi khoi hang doi nay */
   const l=(t.ls||[]).slice().reverse().find(x=>/^(Duyệt đồng ý|Từ chối|Yêu cầu chỉnh sửa)/.test(x.hd));
   if(l&&l.ai!==R().me){skip.push([t.id,t.tieu,'Đã được '+l.ai+' — '+l.ct+' '+(l.hd.indexOf('Duyệt')===0?'duyệt':l.hd.indexOf('Từ chối')===0?'từ chối':'trả về chỉnh sửa')+' trong lúc bạn đang xem']);return}
   skip.push([t.id,t.tieu,'Người tạo đã thu hồi trình duyệt trong lúc bạn đang xem']);return}
  if(t.phat&&t.phat<HOMNAY){skip.push([t.id,t.tieu,'Giờ phát đã hẹn ('+dt2s(t.phat)+') nằm ở quá khứ — cần người tạo đặt lại giờ']);return}
  duyetTB(t,true,null);ok.push([t.id,t.tieu,'']);
 });
 V.sel=[];V.pick=null;render();
 modal('✓ Kết quả duyệt hàng loạt',
  '<div class="ro">Thao tác hàng loạt luôn trả về bảng <b>tách dòng thành công và dòng bị bỏ qua kèm lý do</b>.</div>'+
  '<div class="res">'+
  (ok.length?ok.map(x=>'<div class="resr ok"><div class="w">✅ Đã duyệt</div><div class="r"><b>'+x[0]+'</b> — '+esc(x[1])+'</div></div>').join(''):'')+
  (skip.length?skip.map(x=>'<div class="resr wr"><div class="w">⏭ Bỏ qua</div><div class="r"><b>'+x[0]+'</b> — '+esc(x[1])+'<br><span style="color:var(--ink2)">'+esc(x[2])+'</span></div></div>').join(''):'')+
  '</div>'+(skip.length?'':'<div class="okbx" style="margin-top:10px">Không có dòng nào bị bỏ qua.</div>'));
}
function hopLyDo(tt,tieu,cb){
 modal(tt,'<div class="gf"><label>Lý do <b>*</b></label><textarea class="ta sm" id="lyDo" placeholder="Nêu rõ để người tạo biết phải sửa gì…"></textarea>'+
  '<div class="hint">Lý do hiện <b>nguyên văn</b> cho người tạo ở tab “Thông báo của tôi” và trong lịch sử thao tác.</div></div>'+
  '<div class="ro">'+esc(tieu)+'</div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" id="okLy">Xác nhận</button>');
 $('#okLy').onclick=function(){
  const v=$('#lyDo').value.trim();
  if(!v){$('#lyDo').classList.add('err');toast('⛔ <b>Bắt buộc nhập lý do</b> — không có lý do thì người tạo không biết phải sửa gì');return}
  closeModal();cb(v);
 };
}

/* ─────────────────── ③ TỪ ĐIỂN CHỈ TIÊU — bộ máy ─────────────────── */
const CT = (function () {
  const D = {};                                          /* mã → khai báo */

  /* ── khai một chỉ tiêu ──────────────────────────────────────────────
     {ma, ten, donVi, loaiSo:'TON'|'PS'|'DAN_XUAT', nguon:['M6.4'],
      chieuHopLe:[…], moc:'yyyy-mm-dd',
      quyTacDem:{tinhVao:[…tiếng Việt…], khongTinh:[…tiếng Việt…]},
      canCu:'…' (tùy chọn — văn bản pháp lý),
      oPhu:{ <khóa ô>: {ten, loaiSo, donVi, moc, quyTacDem} }  (tùy chọn)}

     ★ `oPhu` — vì sao có. Một BẢNG có nhiều cột mà cả bảng chỉ mang MỘT mã
     chỉ tiêu: `CS.05 Tỉ lệ khai thác` bày ra bốn cột (lượt mượn · tiết sử dụng ·
     tỉ lệ · lượt bị từ chối vì trùng). Nguyên tắc số 1 đòi MỌI ô bấm được và
     MỌI ô có quy tắc đếm riêng — nên từng ô con khai quy tắc của nó, thay vì
     đẻ thêm mã chỉ tiêu cho mỗi cột (mã chỉ tiêu là danh mục của cả hệ thống,
     không phải tên cột của một bảng).
     Ô con cũng có `moc` RIÊNG được: sổ mượn phòng bắt đầu chạy sau thời khóa
     biểu, nên «lượt mượn» chưa có dữ liệu trong quãng mà «tiết sử dụng» đã có. */
  function khai(o) {
    if (!o || !o.ma) throw new Error('CT.khai: thiếu mã');
    if (D[o.ma]) throw new Error('CT.khai: mã ' + o.ma + ' đã khai — không khai đè');
    if (!o.quyTacDem || !o.quyTacDem.tinhVao) throw new Error('CT.khai: ' + o.ma + ' thiếu quyTacDem.tinhVao');
    D[o.ma] = Object.assign({ chieuHopLe: [], nguon: [], oPhu: {} }, o, { tinh: null });
    return D[o.ma];
  }

  /* nối phần TÍNH — `app.20` của từng demo gọi, một lần cho mỗi mã.
     fn(thamSo, oPhu) → {giaTri, banGhiGoc:[…], ghiChu} */
  function nguonSo(ma, fn) {
    if (!D[ma]) throw new Error('CT.nguonSo: chưa khai mã ' + ma);
    D[ma].tinh = fn;
  }

  const co = ma => !!D[ma];
  const khaiBao = ma => D[ma] || null;
  const danhSach = () => Object.keys(D).sort();
  const ten = ma => (D[ma] || {}).ten || ma;

  /* chiều hợp lệ — bộ chọn phải hỏi hàm này TRƯỚC khi bày một chiều ra */
  const chieuOK = (ma, chieu) => !!D[ma] && D[ma].chieuHopLe.indexOf(chieu) >= 0;
  const chieuCua = ma => (D[ma] || { chieuHopLe: [] }).chieuHopLe.slice();

  /* mốc dữ liệu sớm nhất của một ô (ô con có mốc riêng thì lấy của ô con) */
  function mocCua(ma, o) {
    const d = D[ma]; if (!d) return null;
    if (o && d.oPhu[o] && d.oPhu[o].moc) return d.oPhu[o].moc;
    return d.moc || null;
  }

  /* ★ «CHƯA CÓ DỮ LIỆU» ≠ 0 ────────────────────────────────────────────
     Một báo cáo ghi 0 cho quãng nhà trường chưa dùng phần mềm là NÓI SAI VỀ
     NHÀ TRƯỜNG: người đọc hiểu là «kỳ đó không có việc gì xảy ra», trong khi
     sự thật là «hệ thống không biết». Hai câu đó khác nhau, và chỉ câu thứ hai
     là đúng. Nên ô ghi «dữ liệu có từ …», không ghi 0. */
  function thieuDuLieu(moc, tham) {
    if (!moc) return null;
    const dau = tham.cheDo === 'chot' ? tham.chotNgay : tham.tuNgay;
    if (!dau || dau >= moc) return null;
    return { ma: 'CHUA_CO_DU_LIEU', moc, chu: 'dữ liệu có từ ' + k2s(moc) };
  }

  /* ── CỔNG DUY NHẤT để một tab lấy một con số ────────────────────────
     CT.doc(ma, {cheDo, chotNgay, tuNgay, denNgay, phamVi, phanTo, loc}, oPhu?)
     → {ma, o, ten, giaTri, donVi, loaiSo, quyTacDem, nguon, chieuHopLe,
        banGhiGoc:[…], canhBao:null|{ma,chu}, ghiChu}                       */
  function doc(ma, tham, o) {
    const d = D[ma];
    if (!d) return loi(ma, o, 'KHONG_CO_MA', 'mã chỉ tiêu «' + ma + '» chưa có trong từ điển');
    const oKhai = o ? d.oPhu[o] : null;
    if (o && !oKhai) return loi(ma, o, 'KHONG_CO_O', 'mã ' + ma + ' không khai ô con «' + o + '»');
    tham = tham || {};
    if (tham.phanTo && !chieuOK(ma, tham.phanTo))
      return loi(ma, o, 'CHIEU_KHONG_HOP_LE',
        'không cắt được ' + ma + ' theo chiều «' + (CHIEU[tham.phanTo] || tham.phanTo) + '»');
    if (!d.tinh) return loi(ma, o, 'CHUA_NOI_NGUON',
      'mã ' + ma + ' đã khai nhưng app.20 chưa gọi CT.nguonSo()');

    const nen = {
      ma, o: o || null,
      ten: oKhai ? oKhai.ten : d.ten,
      donVi: (oKhai && oKhai.donVi) || d.donVi || '',
      loaiSo: (oKhai && oKhai.loaiSo) || d.loaiSo,
      quyTacDem: (oKhai && oKhai.quyTacDem) || d.quyTacDem,
      nguon: d.nguon.slice(), chieuHopLe: d.chieuHopLe.slice(),
      canCu: d.canCu || null
    };
    const thieu = thieuDuLieu(mocCua(ma, o), tham);
    if (thieu) return Object.assign(nen, { giaTri: null, banGhiGoc: [], canhBao: thieu });

    let kq;
    try { kq = d.tinh(tham, o) || {} }
    catch (e) { return loi(ma, o, 'LOI_TINH', String(e && e.message || e)) }
    return Object.assign(nen, {
      giaTri: kq.giaTri == null ? null : kq.giaTri,
      banGhiGoc: kq.banGhiGoc || [],
      ghiChu: kq.ghiChu || null,
      veTrai: kq.veTrai || null, vePhai: kq.vePhai || null,   /* ô dẫn xuất — hai vế của phân số */
      canhBao: kq.canhBao || null
    });
  }

  function loi(ma, o, maLoi, chu) {
    return {
      ma, o: o || null, ten: ten(ma), giaTri: null, donVi: '', loaiSo: 'TON',
      quyTacDem: { tinhVao: ['—'], khongTinh: ['—'] }, nguon: [], chieuHopLe: [],
      banGhiGoc: [], canhBao: { ma: maLoi, chu }
    };
  }

  return { khai, nguonSo, doc, co, khaiBao, danhSach, ten, chieuOK, chieuCua, mocCua, CHIEU };
})();

/* ══════════════════════════════════════════════════════════════════════════
   TỆP NỀN 2/4 CỦA NHÓM 📊 BÁO CÁO — `app.11-khuon-bang.js`  →  xuất ra `KB`

   🔄 HDBC v2 · phiên `BCM9-V24` (21/9/2026) — CHỈ THÊM, mọi khai báo cũ chạy

   ① CHIP LOẠI SỐ cạnh tiêu đề bảng — TỒN (chốt tại ngày) / PHÁT SINH (từ → đến)
      / DẪN XUẤT. Loại số là một CHIP, không phải một đoạn văn (`nh9` §9.1).
   ② DÒNG TỔNG, và tổng NÓI RÕ đã trừ bao nhiêu ô vì thiếu quyền (`N5`).
   ③ `KB.drill()` — panel: danh sách bản ghi gốc + quy tắc đếm bằng tiếng Việt
      + deep-link về menu chủ. 🛑 KHÔNG Ô SỐ NÀO KHÔNG BẤM ĐƯỢC, kể cả ô dẫn
      xuất — ô dẫn xuất mở panel có HAI VẾ của phân số.
   ④ Khối `.noacc` — thiếu `XD` ở feature nguồn thì ô VẪN CHIẾM CHỖ và ghi rõ
      thiếu quyền gì trên menu nào. Ẩn mà im lặng là để người đọc tin vào một
