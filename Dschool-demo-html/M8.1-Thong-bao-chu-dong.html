const KB = (function () {

  /* ── cổng quyền: `app.20` của từng demo nối vào ──────────────────────
     KB.quyenNguon(maFeature) → true nếu VAI ĐANG XEM có `XD` ở feature nguồn.
     KB.moTaNguon(maFeature)  → {menu:'M6.5', ten:'Lịch mượn phòng'}
     Chưa nối thì coi như có đủ quyền — để demo chưa khai quyền vẫn chạy. */
  let quyenNguon = () => true;
  let moTaNguon = ma => ({ menu: (ma || '').split('.')[0].toUpperCase().replace('M', 'M'), ten: ma });
  const noiQuyen = (fnQuyen, fnMoTa) => { if (fnQuyen) quyenNguon = fnQuyen; if (fnMoTa) moTaNguon = fnMoTa; };

  /* menu đang đứng — dùng cho `&return=` của mọi deep-link */
  let MENU_NAY = 'M9.x';
  const datMenu = m => { MENU_NAY = m };

  /* ── kho ô đã vẽ: khóa → {ket, cot, dong, kb} ───────────────────────── */
  const O = {};
  let seq = 0;

  /* ───────────────────────── chip loại số ───────────────────────────── */
  const TEN_LOAI = {
    TON: ['TỒN', 'đếm tại một thời điểm — Chốt tại ngày', 'ton'],
    PS: ['PHÁT SINH', 'đếm trong một khoảng — Từ → đến', 'ps'],
    DAN_XUAT: ['DẪN XUẤT', 'tính từ hai số khác — bấm vào ô để xem hai vế', 'dx']
  };
  function chip(loai) {
    const t = TEN_LOAI[loai] || TEN_LOAI.TON;
    return '<span class="lschip ' + t[2] + '" title="' + esc(t[1]) + '">' + t[0] + '</span>';
  }

  /* ───────────────────── định dạng một giá trị ──────────────────────── */
  function soRa(v, kieu) {
    if (v == null) return '—';
    if (kieu === 'tien') return trieu(v);
    if (kieu === 'nghin') return vn(Math.round(v / 1000));
    if (kieu === 'tile') return (Math.round(v * 10) / 10).toLocaleString('vi-VN') + '%';
    if (kieu === 'ngay') return (Math.round(v * 10) / 10).toLocaleString('vi-VN');
    if (kieu === 'chu') return esc(v);
    return vn(v);
  }

  /* ─────────────────────────── vẽ MỘT ô ──────────────────────────────
     Ba đường ra, theo đúng thứ tự ưu tiên:
       ① thiếu `XD` ở feature nguồn  → khối `.noacc`, ô vẫn chiếm chỗ
       ② chưa có dữ liệu cho quãng   → «dữ liệu có từ …», KHÔNG ghi 0
       ③ có số                        → nút bấm được                        */
  function veO(kb, dong, cot, ket) {
    /* v2 · việc 2 — nguồn THEO DÒNG đứng trước nguồn của cột và của bảng */
    const nguon = (dong && dong.nguonDong) || cot.nguon || (kb.nguon || null);
    if (nguon && !quyenNguon(nguon)) {
      const m = moTaNguon(nguon);
      return { html: '<span class="noacc" title="Thiếu quyền Xem (X) ở ' + esc(m.ten) + ' — ' + esc(m.menu) + '">🔒 ẩn</span>', tru: true, khoa: nguon };
    }
    if (!ket) return { html: '<span class="oro">—</span>', tru: false };
    if (ket.canhBao) {
      const cb = ket.canhBao;
      const k = 'o' + (++seq);
      O[k] = { ket, cot, dong, kb };
      const chu = cb.ma === 'CHUA_CO_DU_LIEU' ? cb.chu : cb.chu;
      return {
        html: '<button class="oso ocb" data-kbo="' + k + '">⚠ ' + esc(chu) + '</button>',
        tru: true, khongCo: true
      };
    }
    const k = 'o' + (++seq);
    O[k] = { ket, cot, dong, kb };
    const cls = 'oso' + (cot.kieu === 'tile' || ket.loaiSo === 'DAN_XUAT' ? ' odx' : '')
      + (cot.canhBao && cot.canhBao(ket, dong) ? ' oxau' : '');
    return { html: '<button class="' + cls + '" data-kbo="' + k + '">' + soRa(ket.giaTri, cot.kieu) + '</button>', tru: false };
  }

  /* ══════════════════════ LÕI — dựng một bảng ══════════════════════════
     kb = {khuon, tieuDe, ma, chip, moTaKy, ghiChuKy, cot:[…], dong:[…],
           o:(dong,cot)=>ket, tong:true|false, tongRieng:fn, gomNhom:bool,
           nguon:'m6.4.x', chuoiTrong:'…', duoiBang:'…html…'}              */
  function bang(kb) {
    const cot = kb.cot || [];
    const dong = kb.dong || [];
    const loai = kb.chip || (kb.ma && CT.khaiBao(kb.ma) ? CT.khaiBao(kb.ma).loaiSo : 'TON');
    let h = '<div class="bg" data-bg="' + esc(kb.id || '') + '">';

    /* đầu bảng — tiêu đề · chip loại số · nhãn kỳ */
    h += '<div class="bgh"><b>' + esc(kb.tieuDe || '') + '</b>' + chip(loai)
      + (kb.moTaKy ? '<span class="bgky">' + esc(kb.moTaKy) + '</span>' : '')
      + (kb.ma ? '<span class="bgma" title="' + esc(CT.ten(kb.ma)) + '">' + esc(kb.ma) + '</span>' : '')
      + '<span class="spacer"></span>' + (kb.nutPhai || '') + '</div>';

    if (!dong.length) {
      h += '<div class="empty">' + esc(kb.chuoiTrong || 'Không có dòng nào trong phạm vi đang xem.') + '</div></div>';
      return h;
    }

    const hDau = h.length;                 /* v2 · việc 4 — chỗ cắt nếu cả bảng bị khóa */
    let oKhoa = 0; const nguonKhoa = [];
    h += '<div class="tbx"><table class="bgt"><thead><tr><th>' + esc(kb.tenCotDau || 'Chỉ tiêu') + '</th>';
    cot.forEach(c => h += '<th class="num" title="' + esc(c.chuThich || '') + '">' + esc(c.ten)
      + (c.donVi ? '<i>' + esc(c.donVi) + '</i>' : '') + '</th>');
    h += '</tr></thead><tbody>';

    const tong = cot.map(() => ({ v: 0, co: false, tru: 0, khongCo: 0, gop: [], mau: null }));
    let nhomHienTai = null;

    dong.forEach(d => {
      if (kb.gomNhom && d.nhom && d.nhom !== nhomHienTai) {
        nhomHienTai = d.nhom;
        h += '<tr class="nhomrow"><td colspan="' + (cot.length + 1) + '">' + esc(d.nhom) + '</td></tr>';
      }
      h += '<tr' + (d.mo ? ' class="dongmo"' : '') + '>'
        + '<td>' + (d.bac ? '<span class="bac"></span>' : '') + '<b>' + esc(d.ten) + '</b>'
        + (d.phu ? '<span class="dphu">' + esc(d.phu) + '</span>' : '') + '</td>';
      cot.forEach((c, i) => {
        const ket = kb.o(d, c);
        const r = veO(kb, d, c, ket);
        h += '<td class="num">' + r.html + '</td>';
        if (r.khoa) { oKhoa++; if (nguonKhoa.indexOf(r.khoa) < 0) nguonKhoa.push(r.khoa); }
        if (r.tru) { tong[i].tru++; if (r.khongCo) tong[i].khongCo++; }
        else if (ket && ket.giaTri != null && c.kieu !== 'tile' && c.kieu !== 'ngay' && !c.khongCong) {
          tong[i].v += Number(ket.giaTri); tong[i].co = true;
          tong[i].mau = tong[i].mau || ket;
          tong[i].gop.push({ id: '', ten: d.ten, so: soRa(ket.giaTri, c.kieu) });
        }
      });
      h += '</tr>';
    });

    /* ── v2 · việc 4 — CẢ BẢNG thiếu quyền nguồn ⇒ MỘT dải thay cho N ô ────
       N ô `🔒 ẩn` lặp lại nói N lần cùng một câu, và dòng Tổng «đã trừ N dòng»
       thành một con số không còn gì để trừ. Một dải nói một lần: thiếu quyền
       gì, trên menu nào, và bảng có bao nhiêu dòng không hiện. Chỉ khi MỌI ô
       số của bảng đều bị khóa — khóa một phần thì vẫn là ô `🔒 ẩn` như v1.  */
    if (kb.daiKhoa !== false && cot.length && oKhoa === dong.length * cot.length) {
      h = h.slice(0, hDau) + '<div class="noaccbox kbdai">🔒 <b>Cả bảng bị ẩn</b> — vai đang xem không có quyền '
        + '<b>Xem (X)</b> ở ' + nguonKhoa.map(n => { const m = moTaNguon(n); return '<b>' + esc(m.ten) + ' — ' + esc(m.menu) + '</b>' }).join(' · ')
        + '. Bảng có <b>' + dong.length + ' dòng</b>, không hiện ở đây.</div>';
      if (kb.duoiBang) h += kb.duoiBang;
      return h + '</div>';
    }

    /* ── dòng Tổng — và NÓI RÕ đã trừ bao nhiêu (N5) ─────────────────── */
    if (kb.tong !== false) {
      h += '<tr class="tongrow"><td><b>' + esc(kb.tenTong || 'Tổng') + '</b></td>';
      cot.forEach((c, i) => {
        const t = tong[i];
        let o;
        if (kb.tongRieng && kb.tongRieng(c) != null) {
          const ket = kb.tongRieng(c);
          const r = veO(kb, { id: '_tong', ten: 'Tổng' }, c, ket);
          o = r.html;
        } else if (c.kieu === 'tile' || c.kieu === 'ngay' || c.khongCong) {
          o = '<span class="oro" title="Cột này không cộng dọc được — tỉ lệ và trung vị của cả bảng không phải tổng của các dòng">—</span>';
        } else if (t.co) {
          /* ★ Ô TỔNG CŨNG BẤM ĐƯỢC. Câu hỏi hay bị hỏi nhất về một bảng là
             «tổng này gồm những dòng nào», và nó chính là câu mà tổng phải trả
             lời được — nhất là khi tổng đã bị trừ bớt vì thiếu quyền (N5). */
          const ketT = Object.assign({}, t.mau, {
            ten: 'Tổng — ' + ((t.mau && t.mau.ten) || esc(c.ten)),
            giaTri: t.v, banGhiGoc: t.gop, veTrai: null, vePhai: null,
            ghiChu: 'Cộng <b>' + t.gop.length + ' dòng</b> của bảng'
              + (t.tru ? '; <b>đã trừ ' + t.tru + ' dòng</b> ('
                + (t.tru - t.khongCo ? (t.tru - t.khongCo) + ' thiếu quyền' : '')
                + (t.tru - t.khongCo && t.khongCo ? ' · ' : '')
                + (t.khongCo ? t.khongCo + ' chưa có dữ liệu' : '') + ')' : '') + '.'
          });
          o = veO(kb, { id: '_tong', ten: 'Tổng' }, Object.assign({}, c, { canhBao: null }), ketT).html;
        } else {
          o = '—';
        }
        const ghi = [];
        if (t.tru - t.khongCo > 0) ghi.push('đã trừ ' + (t.tru - t.khongCo) + ' dòng — thiếu quyền');
        if (t.khongCo > 0) ghi.push('đã trừ ' + t.khongCo + ' dòng — chưa có dữ liệu');
        h += '<td class="num">' + o + (ghi.length ? '<span class="tongtru">' + esc(ghi.join(' · ')) + '</span>' : '') + '</td>';
      });
      h += '</tr>';
    }
    h += '</tbody></table></div>';
    if (kb.duoiBang) h += kb.duoiBang;
    h += '</div>';
    return h;
  }

  /* ══════════════════════ CHÍN KHUÔN BIỂU MẪU ══════════════════════════
     Mỗi khuôn là một cách SẮP một bảng, không phải một bộ mã riêng. Chín
     khuôn phủ hết 81 báo cáo của tài liệu 18/9 — mẫu thứ mười chỉ tốn
     một dòng cấu hình (`N8`), không tốn một khuôn.                       */

  /* ── K1 · Bảng phân tổ MỘT chiều ─────────────────────────────────────
     Một chỉ tiêu, cắt theo một chiều. Dòng = giá trị của chiều;
     cột = Số lượng + Tỉ lệ + dòng Tổng.                                 */
  function K1(kb) {
    const tongSo = (kb.dong || []).reduce((a, d) => {
      const k = kb.oSo(d); return a + (k && k.giaTri != null ? Number(k.giaTri) : 0);
    }, 0);
    return bang(Object.assign({}, kb, {
      khuon: 'K1', tenCotDau: kb.tenCotDau || (CT.CHIEU[kb.chieu] || 'Chỉ tiêu'),
      cot: [
        { khoa: 'so', ten: 'Số lượng', donVi: kb.donVi || '', kieu: 'so', nguon: kb.nguon },
        { khoa: 'tl', ten: 'Tỉ lệ', kieu: 'tile', nguon: kb.nguon, khongCong: true }
      ],
      o: (d, c) => {
        const k = kb.oSo(d);
        if (c.khoa === 'so') return k;
        if (!k || k.giaTri == null) return k;
        return Object.assign({}, k, {
          ten: 'Tỉ lệ — ' + k.ten, loaiSo: 'DAN_XUAT', donVi: '%',
          giaTri: tile(Number(k.giaTri), tongSo),
          veTrai: { ten: k.ten + ' của dòng này', giaTri: Number(k.giaTri), donVi: kb.donVi || '' },
          vePhai: { ten: 'Tổng toàn bảng', giaTri: tongSo, donVi: kb.donVi || '' }
        });
      }
    }));
  }

  /* ── K2 · Bảng chéo HAI chiều ────────────────────────────────────────
     Dòng × cột, ô = số (và % nếu có mẫu số rõ). Gom nhóm Điểm trường →
     Khối → Lớp bằng `gomNhom:true` + `dong[].nhom`.                     */
  function K2(kb) { return bang(Object.assign({ gomNhom: true }, kb, { khuon: 'K2' })) }

  /* ── K3 · HAI KHỐI: TỒN + PHÁT SINH ──────────────────────────────────
     🛑 HAI BẢNG TÁCH HẲN, hai nhãn, hai bộ điều khiển thời gian.
     KHÔNG BAO GIỜ cộng chéo hai khối — đó là lỗi nghiệm thu, không phải
     chuyện thẩm mỹ: cộng một số tồn với một số phát sinh ra một con số
     không có nghĩa nào trong đời thật.                                   */
  function K3(kb) {
    return '<div class="k3">'
      + bang(Object.assign({}, kb.khoiTon, { khuon: 'K3', chip: 'TON' }))
      + '<div class="k3sep">🛑 Hai khối dưới đây <b>không cộng chéo</b> — khối trên đếm tại một thời điểm, khối dưới đếm trong một khoảng.</div>'
      + bang(Object.assign({}, kb.khoiPS, { khuon: 'K3', chip: 'PS' }))
      + '</div>';
  }

  /* ── K4 · Lưới người × ngày / danh sách chi tiết ──────────────────────
     Dòng = một người / một học sinh. Luôn kèm dải Luật BVDLCN 91/2025:
     bảng này có HỌ TÊN, nên xuất nó là xuất dữ liệu cá nhân.             */
  function K4(kb) {
    return '<div class="bvdl" data-kbk4="1">⚖ Bảng này có <b>họ tên</b> — xuất ra là <b>xuất dữ liệu cá nhân</b>. '
      + 'Nút <b>Danh sách chi tiết</b> bắt chọn mục đích, chọn trường, đóng dấu tệp và ghi audit '
      + '<i>(Luật BVDLCN 91/2025)</i>.</div>'
      + bang(Object.assign({ tong: false, tenCotDau: 'Họ và tên' }, kb, { khuon: 'K4' }));
  }

  /* ── K5 · Sổ / phiếu ─────────────────────────────────────────────────
     Một bản ghi một dòng, theo thời gian. Bắt buộc: SỐ HIỆU LIÊN TỤC,
     KHÔNG NHẢY SỐ — sổ nhảy số là sổ không dùng được làm căn cứ, nên
     khuôn tự dò và nói ra chỗ đứt.                                       */
  function K5(kb) {
    const ds = kb.banGhi || [];
    let canh = '';
    if (kb.kiemSoHieu !== false && ds.length > 1) {
      const so = ds.map(x => Number(String(x.so || '').replace(/\D/g, ''))).filter(n => !isNaN(n)).sort((a, b) => a - b);
      const dut = [];
      for (let i = 1; i < so.length; i++) if (so[i] - so[i - 1] > 1) dut.push(so[i - 1] + ' → ' + so[i]);
      if (dut.length) canh = '<div class="canh r">⚠ <b>Sổ nhảy số</b> ở ' + dut.length + ' chỗ: ' + esc(dut.join(' · '))
        + '. Sổ có số hiệu đứt quãng thì không dùng làm căn cứ được — kiểm lại ở menu chủ.</div>';
    }
    let h = '<div class="bg"><div class="bgh"><b>' + esc(kb.tieuDe || 'Sổ') + '</b>' + chip(kb.chip || 'PS')
      + (kb.moTaKy ? '<span class="bgky">' + esc(kb.moTaKy) + '</span>' : '') + '</div>' + canh;
    if (!ds.length) return h + '<div class="empty">' + esc(kb.chuoiTrong || 'Sổ chưa có dòng nào trong khoảng đang xem.') + '</div></div>';
    h += '<div class="tbx"><table class="bgt so"><thead><tr>'
      + (kb.cot || [{ khoa: 'so', ten: 'Số hiệu' }, { khoa: 'ngay', ten: 'Ngày' }, { khoa: 'noiDung', ten: 'Nội dung' },
      { khoa: 'nguoiLap', ten: 'Người lập' }, { khoa: 'nguoiKy', ten: 'Người ký' }, { khoa: 'tt', ten: 'Trạng thái' }])
        .map(c => '<th>' + esc(c.ten) + '</th>').join('') + '</tr></thead><tbody>';
    const cot = kb.cot || [{ khoa: 'so' }, { khoa: 'ngay' }, { khoa: 'noiDung' }, { khoa: 'nguoiLap' }, { khoa: 'nguoiKy' }, { khoa: 'tt' }];
    ds.forEach(x => {
      h += '<tr>' + cot.map(c => '<td>' + (c.ve ? c.ve(x) : esc(x[c.khoa] == null ? '—' : x[c.khoa])) + '</td>').join('') + '</tr>';
    });
    h += '</tbody></table></div>' + (kb.duoiBang || '') + '</div>';
    return h;
  }

  /* ── K6 · Biểu CỐ ĐỊNH (của Bộ hoặc của trường ban hành) ──────────────
     Loại A · C — cấu trúc KHÔNG ĐỔI ĐƯỢC. Mỗi ô của biểu phải ánh xạ tới
     một mã chỉ tiêu; ô CHƯA ánh xạ được thì NÊU ĐÍCH DANH, không để trống
     cho người đọc tự đoán. Kèm khối chữ ký + đóng dấu ngày chốt.         */
  function K6(kb) {
    let h = '<div class="k6">';
    (kb.khoi || []).forEach(kh => { h += bang(Object.assign({ khuon: 'K6' }, kh)) });
    const chua = (kb.oChuaAnhXa || []);
    if (chua.length) {
      h += '<div class="canh w"><b>' + chua.length + ' ô của biểu chưa ánh xạ được vào mã chỉ tiêu nào</b> — '
        + 'nêu đích danh ở đây thay vì để trống: ' + chua.map(x => '<b>' + esc(x.o) + '</b> <i>(' + esc(x.ly) + ')</i>').join(' · ')
        + '. Người ký phải biết mình đang ký một biểu còn ô do người điền tay.</div>';
    }
    if (kb.chuKy) h += kb.chuKy;
    h += '</div>';
    return h;
  }

  /* ── K7 · Tệp đối soát cho hệ thống ngoài ─────────────────────────────
     Cột do HỆ ĐÍCH quy định. Bắt buộc kèm BẢNG ĐỐI CHIẾU SỐ TỔNG hai
     chiều TRƯỚC khi tải — và không làm tròn: chênh một đồng vẫn là chênh. */
  function K7(kb) {
    let h = '<div class="k7"><div class="canh b">📤 Cột của bảng này do <b>' + esc(kb.heDich || 'hệ đích')
      + '</b> quy định — Dschool không đổi được. Đối chiếu số tổng trước khi tải.</div>';
    h += bang(Object.assign({ khuon: 'K7', tong: true }, kb));
    if (kb.doiChieu) {
      h += '<div class="bg"><div class="bgh"><b>Đối chiếu số tổng — hai chiều</b>' + chip('TON') + '</div><div class="tbx"><table class="bgt"><thead><tr>'
        + '<th>Chỉ tiêu đối chiếu</th><th class="num">Dschool</th><th class="num">' + esc(kb.heDich || 'Hệ đích') + '</th><th class="num">Chênh</th></tr></thead><tbody>';
      kb.doiChieu.forEach(r => {
        const ch = (r.a == null || r.b == null) ? null : r.a - r.b;
        h += '<tr' + (ch ? ' class="badrow"' : '') + '><td>' + esc(r.ten) + '</td><td class="num">' + vn(r.a)
          + '</td><td class="num">' + (r.b == null ? '—' : vn(r.b)) + '</td><td class="num">'
          + (ch == null ? '—' : (ch === 0 ? '0' : '<b>' + vn(ch) + '</b>')) + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }
    return h + '</div>';
  }

  /* ── K8 · Báo cáo VĂN BẢN (sơ kết · tổng kết · đột xuất) ──────────────
     Căn cứ → phần SỐ (nhúng K1/K2/K3) → nhận xét, phương hướng → chữ ký.
     🛑 Phần số SINH TỪ CHỈ TIÊU, không gõ tay: một báo cáo tổng kết có số
     gõ tay là một báo cáo không ai đối chiếu lại được.                    */
  function K8(kb) {
    let h = '<div class="k8"><div class="k8h">' + esc(kb.tieuDe || 'Báo cáo') + '</div>';
    if (kb.canCu) h += '<div class="k8m"><b>Căn cứ</b><ul>' + kb.canCu.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></div>';
    h += '<div class="k8m"><b>Phần số liệu</b> <i>— sinh từ từ điển chỉ tiêu, không gõ tay</i>' + (kb.phanSo || '') + '</div>';
    if (kb.nhanXet) h += '<div class="k8m"><b>Nhận xét và phương hướng</b><div class="k8nx">' + kb.nhanXet + '</div></div>';
    if (kb.chuKy) h += kb.chuKy;
    return h + '</div>';
  }

  /* ── K9 · Bảng TIẾN ĐỘ / TUÂN THỦ ────────────────────────────────────
     «Còn thiếu gì, ai chậm». Dòng = đối tượng phải làm; cột = mốc / trạng
     thái. 🛑 MỖI Ô HỎNG PHẢI BẤM ĐƯỢC VỀ CHỖ SỬA — một bảng nói «thiếu»
     mà không dẫn tới chỗ sửa chỉ tạo thêm việc đi tìm.                    */
  function K9(kb) {
    return bang(Object.assign({ gomNhom: false }, kb, { khuon: 'K9' }));
  }

  /* ════════════════════ PANEL DRILL-DOWN ════════════════════════════════
     Ba thứ bắt buộc, không thiếu thứ nào (`M9.1` §7):
       ① danh sách BẢN GHI GỐC — không phải lại một con số khác
       ② QUY TẮC ĐẾM bằng tiếng Việt — tính vào gì · KHÔNG tính gì
       ③ DEEP-LINK về menu chủ, mang theo bộ lọc, kèm `&return=`           */
  function nodePanel() {
    let m = $('#kbMask');
    if (m) return m;
    m = document.createElement('div');
    m.id = 'kbMask'; m.className = 'kbmask';
    m.innerHTML = '<div class="kbpanel"><div class="kbh"><b id="kbTen"></b>'
      + '<span class="spacer"></span><button class="kbx" id="kbDong">✕</button></div>'
      + '<div class="kbb" id="kbBody"></div></div>';
    document.body.appendChild(m);
    m.addEventListener('click', e => { if (e.target === m || e.target.id === 'kbDong') dong() });
    return m;
  }
  const dong = () => { const m = $('#kbMask'); if (m) m.classList.remove('on') };

  function drill(khoa) {
    const o = O[khoa]; if (!o) return;
    const { ket, cot, dong: d, kb } = o;
    nodePanel();
    $('#kbTen').innerHTML = esc(ket.ten) + ' — <span class="kbdong">' + esc(d.ten) + '</span>' + chip(ket.loaiSo);
    let h = '';

    /* giá trị + hai vế nếu là ô dẫn xuất */
    h += '<div class="kbso">' + (ket.canhBao ? '<span class="kbcb">⚠ ' + esc(ket.canhBao.chu) + '</span>'
      : '<b>' + soRa(ket.giaTri, cot.kieu) + '</b> <i>' + esc(ket.donVi || '') + '</i>') + '</div>';
    if (ket.veTrai && ket.vePhai) {
      h += '<div class="kbps"><div class="kbpsl"><span>' + esc(ket.veTrai.ten) + '</span><b>'
        + vn(ket.veTrai.giaTri) + ' ' + esc(ket.veTrai.donVi || '') + '</b></div>'
        + '<div class="kbpsc">chia cho</div>'
        + '<div class="kbpsl"><span>' + esc(ket.vePhai.ten) + '</span><b>'
        + vn(ket.vePhai.giaTri) + ' ' + esc(ket.vePhai.donVi || '') + '</b></div></div>';
    }
    if (ket.ghiChu) h += '<div class="kbgc">' + ket.ghiChu + '</div>';

    /* ② quy tắc đếm — nguyên văn từ từ điển */
    const q = ket.quyTacDem || { tinhVao: [], khongTinh: [] };
    h += '<div class="kbqt"><div class="kbqth">Quy tắc đếm</div>'
      + '<div class="kbqtv"><b>Tính vào</b><ul>' + (q.tinhVao || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>'
      + '<div class="kbqtx"><b>KHÔNG tính</b><ul>' + (q.khongTinh || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
    if (ket.canCu) h += '<div class="kbcc">⚖ Căn cứ: ' + esc(ket.canCu) + '</div>';
    h += '<div class="kbng">Mã chỉ tiêu <b>' + esc(ket.ma) + (ket.o ? ' · ô ' + esc(ket.o) : '') + '</b>'
      + ' · nguồn ' + (ket.nguon || []).map(x => '<b>' + esc(x) + '</b>').join(' · ')
      + ' · cắt được theo ' + (ket.chieuHopLe || []).map(x => esc(CT.CHIEU[x] || x)).join(' · ') + '</div></div>';

    /* ① bản ghi gốc */
    const bg = ket.banGhiGoc || [];
    h += '<div class="kbbg"><div class="kbqth">Bản ghi gốc — ' + bg.length + ' dòng</div>';
    if (!bg.length) h += '<div class="empty">Không có bản ghi nào.</div>';
    else {
      h += '<div class="tbx"><table class="bgt"><tbody>';
      bg.slice(0, 200).forEach(r => {
        h += '<tr><td class="bgid">' + esc(r.id || '') + '</td><td>' + esc(r.ten || '')
          + (r.phu ? '<span class="dphu">' + esc(r.phu) + '</span>' : '') + '</td>'
          + '<td class="num">' + (r.so == null ? '' : esc(r.so)) + '</td></tr>';
      });
      h += '</tbody></table></div>';
      if (bg.length > 200) h += '<div class="ro">Hiển thị 200 dòng đầu trên ' + bg.length + '.</div>';
    }
    h += '</div>';

    /* ③ deep-link về menu chủ */
    /* v2 · việc 2 — deep-link THEO DÒNG đứng trước link của cột và của bảng */
    const lk = (d && (typeof d.linkDong === 'function' ? d.linkDong(d) : d.linkDong))
      || (typeof cot.link === 'function' ? cot.link(d) : cot.link) || (typeof kb.link === 'function' ? kb.link(d) : kb.link);
    if (lk) {
      h += '<div class="kblk"><button class="btn p" data-dl="' + esc(lk.menu) + '" data-dlq="'
        + esc((lk.ctx || '') + (lk.ctx ? '&' : '') + 'return=' + MENU_NAY) + '">↗ Mở danh sách này tại '
        + esc(lk.menu) + (lk.nhan ? ' — ' + esc(lk.nhan) : '') + '</button>'
        + '<span class="kblkc">Mang theo bộ lọc đang xem, và <b>return=' + esc(MENU_NAY) + '</b> để quay lại đúng chỗ này.</span></div>';
    }
    $('#kbBody').innerHTML = h;
    $('#kbMask').classList.add('on');
  }

  /* gắn một lần — bắt mọi nút ô số trên trang, kể cả ô vẽ sau */
  function gan() {
    if (gan._da) return; gan._da = true;
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-kbo]');
      if (b) { drill(b.getAttribute('data-kbo')); return }
      const dl = e.target.closest('[data-dl]');
      if (dl && $('#kbMask') && $('#kbMask').classList.contains('on')) dong();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') dong() });
  }

  /* dọn kho ô trước mỗi lần vẽ lại — không dọn thì kho phình theo số lần vẽ */
  function moi() { Object.keys(O).forEach(k => delete O[k]); seq = 0; }

  return {
    K1, K2, K3, K4, K5, K6, K7, K8, K9,
    bang, drill, gan, moi, chip, soRa, noiQuyen, datMenu, dong,
    get MENU() { return MENU_NAY }
  };
})();

/* ══════════════════════════════════════════════════════════════════════════
   TỆP NỀN 3/4 CỦA NHÓM 📊 BÁO CÁO — `app.12-pham-vi-thoi-gian.js` → xuất `PV`
   Hợp đồng 🔒 HDBC · phiên `BCM9-0A` (20/9/2026)
   🔄 HDBC v2 · phiên `BCM9-V24` (21/9/2026) — CHỈ THÊM: hai kỳ `hl_giao` ·
      `hl_bao_cao` vào `KY` (việc 6).

   🛑 CHÉP NGUYÊN BYTE sang mọi demo M9.x. Lệch một byte = DỪNG, báo người dùng.

   ── Vì sao phải là nền chung ─────────────────────────────────────────────
   Đây đúng là chỗ mỗi phiên dễ làm mỗi kiểu: một demo để `Chốt tại ngày` mặc
   định là hôm nay, demo kia để là cuối kỳ; một demo cảnh báo khi lùi ngày,
   demo kia không. Hai cách làm ấy sinh ra hai con số khác nhau cho cùng một
   câu hỏi, và người đọc không có cách nào biết mình đang xem cái nào.

   ── Bốn thứ tệp này giữ ──────────────────────────────────────────────────
   ① `PV.chotNgay()`   — số TỒN: lùi được mọi ngày trong năm học, ra khỏi hôm
                          nay thì DẢI CẢNH BÁO hiện, không tắt được
   ② `PV.khoang()`     — số PHÁT SINH: Từ → đến, mặc định theo KỲ CHUẨN (`nh9` §4)
   ③ `PV.daiPhamVi()`  — «268 tài sản · phạm vi ĐT A · toàn trường 412»,
                          và CHỈ hiện khi phạm vi THỰC SỰ cắt bớt dữ liệu
   ④ `PV.napMau()`     — mẫu báo cáo định kỳ là một BỘ THAM SỐ (`N8`),
                          không phải một Feature, không phải một khuôn mới
   ══════════════════════════════════════════════════════════════════════════ */

const PV = (function () {

  /* ───────────────── KỲ BÁO CÁO CHUẨN — `nh9` §4 ─────────────────────
     Lịch này là Master, cấu hình tại `M10.6`; ngày cụ thể lấy từ `M10.9`.
     Ở demo đặt theo năm học 2026-2027 của `M10.1`. Mốc «Đầu năm» là 5/9. */
  const KY = {
    dau_nam: { ten: 'Đầu năm', chot: '2026-09-05', tu: '2026-09-05', den: '2026-09-30' },
    giua_ky_1: { ten: 'Giữa kỳ I', chot: '2026-11-02', tu: '2026-09-05', den: '2026-11-02' },
    cuoi_ky_1: { ten: 'Cuối kỳ I', chot: '2026-12-31', tu: '2026-09-05', den: '2026-12-31' },
    giua_ky_2: { ten: 'Giữa kỳ II', chot: '2027-03-15', tu: '2027-01-01', den: '2027-03-15' },
    cuoi_nam: { ten: 'Cuối năm', chot: '2027-05-31', tu: '2026-09-05', den: '2027-05-31' },
    thang_nay: { ten: 'Tháng này', chot: HOMNAY, tu: HOMNAY.slice(0, 8) + '01', den: HOMNAY },
    tu_dau_nam: { ten: 'Từ đầu năm học tới hôm nay', chot: HOMNAY, tu: NAMHOC_TU, den: HOMNAY },
    /* HDBC v2 (`BCM9-V24`, việc 6) — hai kỳ của nhóm 🗃 Học liệu, chép NGUYÊN
       CHỮ từ `M9.11` `app.30`: mốc sổ giao bài `M12.7` và sổ báo cáo học liệu
       bắt đầu chạy. Không bày thành nút ở `chotNgay()` · `khoang()` (hai danh
       sách nút ấy cố định) — tab gọi `PV.khoangMacDinh('hl_giao')`. */
    hl_giao: { ten: 'Từ khi sổ giao bài chạy', chot: HOMNAY, tu: '2026-10-12', den: HOMNAY },
    hl_bao_cao: { ten: 'Từ khi sổ báo cáo học liệu chạy', chot: HOMNAY, tu: '2026-10-04', den: HOMNAY }
  };

  /* ── BA MẪU ĐỊNH KỲ DÙNG CHUNG cho cả 16 demo ───────────────────────
     Mẫu = {tab, cheDo, chotNgay | tu·den, phanTo}. Mẫu riêng của từng nhóm
     khai thêm ở `app.20` bằng `PV.themMau()` — vẫn là một dòng cấu hình. */
  const MAU = {
    dau_nam: { ten: '📌 Đầu năm', mo: 'Số liệu chốt ngày khai giảng', cheDo: 'chot', ky: 'dau_nam' },
    cuoi_ky_1: { ten: '📌 Cuối kỳ I', mo: 'Số liệu chốt 31/12 và phát sinh cả kỳ I', cheDo: 'ca_hai', ky: 'cuoi_ky_1' },
    cuoi_nam: { ten: '📌 Cuối năm', mo: 'Số liệu chốt bế giảng và phát sinh cả năm học', cheDo: 'ca_hai', ky: 'cuoi_nam' }
  };
  const themMau = (ma, o) => { MAU[ma] = o };

  /* ───────────────────────── TRẠNG THÁI ─────────────────────────────── */
  const st = {
    chotNgay: HOMNAY,
    tuNgay: HOMNAY.slice(0, 8) + '01',
    denNgay: HOMNAY,
    phamVi: 'ALL',            /* mã điểm trường, hoặc 'ALL' */
    phanTo: null,
    mauDangDung: null,
    /* ★ người dùng đã tự đặt khoảng chưa. Mỗi tab có KỲ CHUẨN riêng (`nh9` §4)
       và tab được mở bằng kỳ của nó; nhưng một khi người dùng tự chọn ngày,
       chuyển tab KHÔNG được ghi đè lựa chọn ấy — đổi số dưới tay người đang
       đọc là cách nhanh nhất làm họ mất tin vào bảng. */
    tuTay: false
  };
  /* tab gọi khi mở: đặt khoảng theo kỳ chuẩn của tab, trừ khi người dùng đã tự đặt */
  function khoangMacDinh(maKy) {
    if (st.tuTay || !KY[maKy]) return;
    st.tuNgay = KY[maKy].tu; st.denNgay = KY[maKy].den;
  }
  let veLai = () => { };
  const noiVeLai = fn => { veLai = fn };

  /* tham số truyền cho `CT.doc()` */
  const thamSo = them => Object.assign({
    cheDo: 'chot', chotNgay: st.chotNgay, tuNgay: st.tuNgay, denNgay: st.denNgay,
    phamVi: st.phamVi, phanTo: st.phanTo
  }, them || {});
  const thamSoPS = them => thamSo(Object.assign({ cheDo: 'khoang' }, them || {}));

  const laHomNay = () => st.chotNgay === HOMNAY;
  const moTaChot = () => 'Chốt tại ngày ' + k2s(st.chotNgay);
  const moTaKhoang = () => 'Từ ' + k2s(st.tuNgay) + ' → ' + k2s(st.denNgay);

  /* ══════════════ ① CHỐT TẠI NGÀY — cho số TỒN ══════════════════════
     Lùi được MỌI ngày trong năm học. Nút lùi nhanh theo kỳ chuẩn.        */
  function chotNgay() {
    let h = '<div class="pvbar"><span class="pvlb">🗓 Chốt tại ngày</span>'
      + '<input type="date" class="pvd" id="pvChot" value="' + st.chotNgay
      + '" min="' + NAMHOC_TU + '" max="' + NAMHOC_DEN + '">'
      /* ★ In LẠI ngày theo lối Việt Nam ngay cạnh ô chọn. Ô <input type="date">
         hiển thị theo locale của MÁY — ở máy tiếng Anh nó ra `12/28/2026`, và
         một người đọc Việt Nam sẽ đọc thành «12 tháng 28» hoặc «12/28». Con số
         ngày tháng trên một báo cáo mà đọc sai là sai cả bảng. */
      + '<span class="pvthu">' + kThu(st.chotNgay) + ' · <b>' + k2s(st.chotNgay) + '</b></span>'
      + '<span class="pvky">';
    ['dau_nam', 'giua_ky_1', 'cuoi_ky_1', 'cuoi_nam'].forEach(k => {
      h += '<button class="pvk' + (st.chotNgay === KY[k].chot ? ' on' : '') + '" data-pvky="' + k + '">' + esc(KY[k].ten) + '</button>';
    });
    h += '<button class="pvk' + (laHomNay() ? ' on' : '') + '" data-pvky="_homnay">Hôm nay</button></span></div>';
    return h;
  }

  /* ── DẢI CẢNH BÁO — ra khỏi ngày mặc định thì hiện, KHÔNG TẮT ĐƯỢC ──
     Vì sao gắt: một bảng số chụp ở 30/9 trông giống hệt một bảng số của
     hôm nay. Người in nó ra rồi mang đi họp thì không còn dòng nào trên
     giấy nói cho người đọc biết đó là số của ba tháng trước.              */
  function daiCanhBao() {
    if (st.chotNgay > HOMNAY) {
      return '<div class="canh r">⏭ <b>Ngày chốt ở tương lai</b> — bảng dừng ở ' + k2s(HOMNAY)
        + '; phần sau đó <b>chưa xảy ra</b>, không phải bằng 0.</div>';
    }
    if (laHomNay()) return '';
    return '<div class="canh w">🕐 <b>Số liệu chốt tại ' + k2s(st.chotNgay) + ', không phải hôm nay</b> ('
      + k2s(HOMNAY) + ' — lệch ' + soNgay(st.chotNgay, HOMNAY) + ' ngày). '
      + '<button class="btn xs" data-pvky="_homnay">↩ Về hôm nay</button></div>';
  }

  /* ══════════════ ② TỪ → ĐẾN — cho số PHÁT SINH ═══════════════════════ */
  function khoang() {
    let h = '<div class="pvbar"><span class="pvlb">📆 Từ → đến</span>'
      + '<input type="date" class="pvd" id="pvTu" value="' + st.tuNgay + '" min="' + NAMHOC_TU + '" max="' + NAMHOC_DEN + '">'
      + '<span class="pvsep">→</span>'
      + '<input type="date" class="pvd" id="pvDen" value="' + st.denNgay + '" min="' + NAMHOC_TU + '" max="' + NAMHOC_DEN + '">'
      + '<span class="pvthu"><b>' + k2s(st.tuNgay) + ' → ' + k2s(st.denNgay) + '</b> · '
      + (soNgay(st.tuNgay, st.denNgay) + 1) + ' ngày</span><span class="pvky">';
    ['thang_nay', 'giua_ky_1', 'cuoi_ky_1', 'tu_dau_nam'].forEach(k => {
      h += '<button class="pvk' + (st.tuNgay === KY[k].tu && st.denNgay === KY[k].den ? ' on' : '')
        + '" data-pvkh="' + k + '">' + esc(KY[k].ten) + '</button>';
    });
    h += '</span></div>';
    if (st.tuNgay > st.denNgay) h += '<div class="canh r">⚠ <b>Ngày bắt đầu sau ngày kết thúc</b> — khoảng rỗng, mọi ô sẽ trống.</div>';
    return h;
  }

  /* ══════════════ ③ DẢI PHẠM VI ════════════════════════════════════════
     `268 tài sản · phạm vi Điểm trường A · toàn trường 412`.
     🛑 CHỈ hiện khi phạm vi THỰC SỰ cắt bớt. Dán một dòng «phạm vi: toàn
     trường» lên mọi màn hình là thêm chữ mà không thêm thông tin — và
     `nh9` §9.1 đếm nó vào 20% chữ giải thích.                            */
  function daiPhamVi(n, donVi, tongToanTruong, tenPhamVi) {
    if (tongToanTruong == null || n === tongToanTruong) return '';
    return '<div class="pvcut"><b>' + vn(n) + ' ' + esc(donVi) + '</b>'
      + ' · phạm vi <b>' + esc(tenPhamVi || 'đang lọc') + '</b>'
      + ' · toàn trường <b>' + vn(tongToanTruong) + '</b>'
      + ' <i>— ' + vn(tongToanTruong - n) + ' ' + esc(donVi) + ' ngoài phạm vi không có trong kết quả trả về</i></div>';
  }

  /* ══════════════ ④ MẪU BÁO CÁO ĐỊNH KỲ — một BỘ THAM SỐ ══════════════ */
  function daiMau() {
    return '<div class="pvmau"><span class="pvlb">Mẫu định kỳ</span>'
      + Object.keys(MAU).map(k => '<button class="pvm' + (st.mauDangDung === k ? ' on' : '')
        + '" data-pvmau="' + k + '" title="' + esc(MAU[k].mo || '') + '">' + esc(MAU[k].ten) + '</button>').join('')
      + (st.mauDangDung ? '<button class="pvm x" data-pvmau="_bo">✕ Bỏ mẫu</button>' : '')
      /* ★ lời giải thích «mẫu là bộ tham số» nằm ở TITLE của từng nút, không
         dán thành một câu trên màn hình: `nh9` §9.1 đếm nó vào 20% chữ. */
      + '</div>';
  }

  function napMau(ma) {
    if (ma === '_bo') { st.mauDangDung = null; return }
    const m = MAU[ma]; if (!m) return;
    const k = KY[m.ky] || {};
    if (m.cheDo === 'chot' || m.cheDo === 'ca_hai') st.chotNgay = m.chotNgay || k.chot || HOMNAY;
    if (m.cheDo === 'khoang' || m.cheDo === 'ca_hai') { st.tuNgay = m.tu || k.tu; st.denNgay = m.den || k.den; }
    if (m.phanTo !== undefined) st.phanTo = m.phanTo;
    if (m.tab && typeof PV.doiTab === 'function') PV.doiTab(m.tab);
    st.mauDangDung = ma;
  }

  /* ══════════════ BỘ CHỌN CHIỀU PHÂN TỔ ════════════════════════════════
     🛑 CHẶN NGAY chiều không hợp lệ — không bày ra rồi mới báo lỗi.
     Chiều bị chặn vẫn hiện, mờ đi, kèm lý do: người dùng cần biết vì sao
     không cắt được, chứ không cần một danh sách ngắn hơn.                 */
  function chonChieu(ma, dsChieu) {
    const hopLe = CT.chieuCua(ma);
    let h = '<div class="pvbar"><span class="pvlb">✂ Phân tổ theo</span>'
      + '<button class="pvk' + (!st.phanTo ? ' on' : '') + '" data-pvct="">Không cắt</button>';
    (dsChieu || hopLe).forEach(c => {
      const ok = hopLe.indexOf(c) >= 0;
      h += '<button class="pvk' + (st.phanTo === c ? ' on' : '') + (ok ? '' : ' cam') + '"'
        + (ok ? ' data-pvct="' + c + '"' : ' disabled title="' + esc(CT.ten(ma)) + ' không cắt được theo chiều này — từ điển chỉ tiêu không khai nó là chiều hợp lệ"')
        + '>' + esc(CT.CHIEU[c] || c) + (ok ? '' : ' 🚫') + '</button>';
    });
    return h + '</div>';
  }

  /* ─────────────────────────── gắn sự kiện ──────────────────────────── */
  function gan() {
    if (gan._da) return; gan._da = true;
    document.addEventListener('change', e => {
      if (e.target.id === 'pvChot') { st.chotNgay = e.target.value || HOMNAY; st.mauDangDung = null; veLai() }
      if (e.target.id === 'pvTu') { st.tuNgay = e.target.value; st.mauDangDung = null; veLai() }
      if (e.target.id === 'pvDen') { st.denNgay = e.target.value; st.mauDangDung = null; veLai() }
    });
    document.addEventListener('click', e => {
      const k = e.target.closest('[data-pvky]');
      if (k) {
        const v = k.getAttribute('data-pvky');
        st.chotNgay = v === '_homnay' ? HOMNAY : KY[v].chot;
        st.mauDangDung = null; veLai(); return;
      }
      const h = e.target.closest('[data-pvkh]');
      if (h) { const v = h.getAttribute('data-pvkh'); st.tuNgay = KY[v].tu; st.denNgay = KY[v].den; st.mauDangDung = null; st.tuTay = true; veLai(); return }
      const m = e.target.closest('[data-pvmau]');
      if (m) { napMau(m.getAttribute('data-pvmau')); veLai(); return }
      const c = e.target.closest('[data-pvct]');
      if (c) { st.phanTo = c.getAttribute('data-pvct') || null; veLai(); return }
    });
  }

  return {
    st, KY, MAU, themMau, napMau, gan, noiVeLai, khoangMacDinh,
    chotNgay, khoang, daiCanhBao, daiPhamVi, daiMau, chonChieu,
    thamSo, thamSoPS, moTaChot, moTaKhoang, laHomNay
  };
})();

/* ══════════════════════════════════════════════════════════════════════════
   TỆP NỀN 4/4 CỦA NHÓM 📊 BÁO CÁO — `app.13-xuat-hai-muc.js`  →  xuất ra `XU`
   Hợp đồng 🔒 HDBC · phiên `BCM9-0A` (20/9/2026)
   🔄 HDBC v2 · phiên `BCM9-V24` (21/9/2026) — CHỈ THÊM, chữ ký hàm giữ nguyên:
      · việc 1 — mọi lượt xuất (CẢ HAI MỨC) sinh một dòng đúng KHUÔN của tab ③
        Báo cáo tuân thủ `M10.7` (`KT-2`) và ghi vào SỔ CHUNG của trình duyệt
        (`XU.KHOA_SO`) — `M10.7` đọc sổ ấy. `XU.AUDIT` giữ đủ trường cũ.
      · việc 3 — câu mức 1 sửa lại cho đúng; đứng trên lưới có họ tên (`K4`)
        thì nút mức 1 ĐI CỔNG MỨC 2. Bối cảnh `coHoTen: true | false` ép tay.

   🛑 CHÉP NGUYÊN BYTE sang mọi demo M9.x. Lệch một byte = DỪNG, báo người dùng.

   ── Vì sao phải là nền chung ─────────────────────────────────────────────
   Xuất dữ liệu cá nhân sai chế độ là RỦI RO PHÁP LÝ, không phải lỗi giao diện.
   Để mỗi phiên tự dựng nút xuất thì sớm muộn có một demo cho tải thẳng một
   danh sách có họ tên mà không hỏi mục đích — và cái đó không sửa lại được
   sau khi tệp đã rời khỏi máy.

   ── Hai mức, hai chế độ pháp lý — KHÔNG ĐƯỢC GỘP ─────────────────────────
   │ Mức 1 · Bảng tổng hợp   │ chỉ có SỐ         │ số liệu thống kê │ tự do   │
   │ Mức 2 · Danh sách chi tiết │ có HỌ TÊN      │ dữ liệu cá nhân  │ Luật    │
   │                          │                   │                  │ 91/2025 │
   Hai nút **khác chữ, khác màu, khác popup** — người dùng phải THẤY được
   mình đang làm cái nào, không phải đọc tài liệu mới biết.

   ── Đầu trang và cuối trang mọi tệp xuất (sổ §3) ─────────────────────────
   Đầu trang BỐN dòng: tên trường · tên báo cáo · Chốt tại ngày hoặc Từ → đến
   · phạm vi (và tổng toàn trường nếu phạm vi bị cắt).
   Cuối trang: quy tắc đếm bằng tiếng Việt · người xuất · thời điểm · mã audit.
   Thiếu một dòng là tệp đó ra khỏi trường mà không ai biết nó nói về cái gì.
   ══════════════════════════════════════════════════════════════════════════ */

const XU = (function () {

  /* bối cảnh do `app.20` nối vào: tên trường · người đang xem · tên báo cáo */
  let boiCanh = () => ({
    truong: 'Trường học', baoCao: 'Báo cáo', menu: 'M9.x',
    nguoi: 'Người dùng', chucDanh: '', ky: '', phamVi: '', toanTruong: null,
    quyTac: [], banGhiCaNhan: false, truong_du_lieu: []
  });
  const noiBoiCanh = fn => { boiCanh = fn };

  /* ───────────────────── SỔ AUDIT — mọi lượt xuất ─────────────────────
     Ở MVP sổ nằm trong bộ nhớ trang; bản thật ghi vào `M10.7` Nhật ký hệ
     thống. Mã audit in vào CHÍNH TỆP XUẤT — tệp in ra giấy rồi vẫn tra
     ngược được ai xuất, lúc nào, với mục đích gì.                        */
  const AUDIT = [];
  let seqA = 0;

  /* ── v2 · việc 1 — SỔ CHUNG: bản mô phỏng của «ghi vào `M10.7`» ─────────
     Mười tám demo là mười tám tệp riêng, cùng một nguồn gốc trình duyệt, nên
     sổ chung nằm ở `localStorage` dưới một khóa. Đọc/ghi hỏng (chế độ ẩn danh,
     trình duyệt chặn) thì vẫn xuất được — sổ trong trang `AUDIT` còn nguyên;
     chỉ mất phần chuyển sang `M10.7`, và đó là giới hạn của bản demo. */
  const KHOA_SO = 'dschool.bcm9.soAuditXU';
  function docSoChung() {
    try { const s = JSON.parse(localStorage.getItem(KHOA_SO) || '[]'); return Array.isArray(s) ? s : [] }
    catch (e) { return [] }
  }
  function ghiSoChung(dong) {
    try { const s = docSoChung(); s.push(dong); localStorage.setItem(KHOA_SO, JSON.stringify(s)) } catch (e) { }
  }
  /* mã audit duy nhất trên CẢ sổ chung — hai demo cùng ngày không cấp trùng số */
  const maAudit = () => {
    const dau = 'XU-' + HOMNAY.replace(/-/g, '') + '-';
    const daCo = docSoChung().filter(a => String(a.id || '').indexOf(dau) === 0).length;
    seqA = Math.max(seqA, daCo) + 1;
    return dau + p2(seqA);
  };
  const gioNay = () => { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()) };

  /* ── KHUÔN DÒNG của tab ③ `M10.7` (`KT-2`) — TÁM thứ, không thiếu thứ nào:
     ai · chức danh LÚC THAO TÁC · lúc nào · bao nhiêu bản ghi · trường nào ·
     mục đích · menu/tab nguồn · mã audit. Tên trường trùng tên cột của sổ
     `TCDL` ở `M10.7` (`id ngay gio nguoi cd mn ob hv bg tr md dau`) để một
     dòng mới và một dòng đã gieo đọc bằng cùng một hàm; thêm `muc` · `trTen`
     · `mdTen` · `tab` cho những gì sổ cũ không có. */
  function dongAudit(a, bc) {
    return {
      id: a.ma, ngay: a.luc, gio: a.gio, nguoi: a.nguoi, cd: a.chucDanh || '',
      mn: a.menu || '', tab: a.tab || '', ob: a.baoCao || '', hv: 'xuat', muc: a.muc,
      bg: a.soBanGhi == null ? null : a.soBanGhi,
      tr: (a.truong || []).slice(), trTen: (a.truongTen || []).slice(),
      md: a.mucDichMa || null, mdTen: a.mucDich || null, dau: 1
    };
  }
  function ghiAudit(a, bc) {
    AUDIT.push(a);
    ghiSoChung(dongAudit(a, bc));
  }

  /* ─────────── MỤC ĐÍCH XUẤT — Luật BVDLCN 91/2025 ────────────────────
     Danh sách đóng, không có ô «khác» tự do: một ô tự do thì trong ba
     tháng mọi lượt xuất đều ghi «công việc», và sổ audit thành vô dụng. */
  const MUC_DICH = [
    ['bao_cao_cap_tren', 'Lập báo cáo gửi cơ quan quản lý cấp trên'],
    ['doi_chieu_noi_bo', 'Đối chiếu số liệu nội bộ giữa các bộ phận'],
    ['ho_so_luu', 'Lập hồ sơ lưu trữ theo quy định'],
    ['kiem_tra_thanh_tra', 'Phục vụ đoàn kiểm tra · thanh tra'],
    ['xu_ly_su_vu', 'Xử lý một sự vụ cụ thể đang phát sinh']
  ];

  /* ═════════════════════ HAI NÚT — khác chữ, khác màu ═════════════════ */
  function veNut(opt) {
    opt = opt || {};
    let h = '<span class="xunut">'
      + '<button class="btn xu1" data-xu="tong">⬇ Xuất bảng số liệu</button>';
    if (opt.coChiTiet !== false)
      h += '<button class="btn xu2" data-xu="chitiet">⬇ Xuất danh sách chi tiết <i>(có dữ liệu cá nhân)</i></button>';
    return h + '</span>';
  }

  /* ═════════════════════ ĐẦU TRANG — bốn dòng ═════════════════════════ */
  function dauTrang(bc) {
    let h = '<div class="xdau">'
      + '<div class="xd1">' + esc(bc.truong) + '</div>'
      + '<div class="xd2">' + esc(bc.baoCao) + '</div>'
      + '<div class="xd3">' + esc(bc.ky) + '</div>'
      + '<div class="xd4">Phạm vi: <b>' + esc(bc.phamVi) + '</b>';
    if (bc.toanTruong != null && bc.tongPhamVi != null && bc.tongPhamVi !== bc.toanTruong)
      h += ' — <b>' + vn(bc.tongPhamVi) + '</b> ' + esc(bc.donVi || '') + ' trong phạm vi, toàn trường <b>' + vn(bc.toanTruong) + '</b>';
    return h + '</div></div>';
  }

  /* ═════════════════════ CUỐI TRANG ═══════════════════════════════════ */
  function cuoiTrang(bc, ma, mucDich) {
    let h = '<div class="xcuoi"><div class="xqt"><b>Quy tắc đếm</b><ul>';
    (bc.quyTac || []).forEach(q => h += '<li>' + esc(q) + '</li>');
    if (!(bc.quyTac || []).length) h += '<li>—</li>';
    h += '</ul></div><div class="xvet">Người xuất: <b>' + esc(bc.nguoi) + '</b>'
      + (bc.chucDanh ? ' <i>(' + esc(bc.chucDanh) + ')</i>' : '')
      + ' · Thời điểm: <b>' + k2s(HOMNAY) + '</b>'
      + (mucDich ? ' · Mục đích: <b>' + esc(mucDich) + '</b>' : '')
      + ' · Mã audit: <b>' + esc(ma) + '</b></div></div>';
    return h;
  }

  /* ═════════════ MỨC 1 · BẢNG TỔNG HỢP — xuất thẳng ═══════════════════
     Chỉ có số ⇒ không phải dữ liệu cá nhân ⇒ không có cổng. Vẫn ghi audit
     đơn giản, vì «ai lấy con số nào đi đâu» là câu hỏi sẽ được hỏi lại.  */
  /* v2 · việc 3 — màn hình đang bày một lưới CÓ HỌ TÊN (`K4`) không?
     Đọc dải `data-kbk4` mà `KB.K4` gắn, và chỉ tính dải ĐANG HIỆN (tab ẩn
     thì không). Bối cảnh `coHoTen` ép tay được: `true` — bảng có tên dù
     không dựng bằng `K4`; `false` — tệp mức 1 của tab là bản GỘP đã bỏ cột
     họ tên, để nút mức 1 xuất tự do như v1. */
  function dangCoHoTen(bc) {
    if (bc.coHoTen === true || bc.coHoTen === false) return bc.coHoTen;
    return $$('[data-kbk4]').some(n => n.offsetParent !== null);
  }

  function tongHop(themVaoBoiCanh) {
    const bc = Object.assign({}, boiCanh(), themVaoBoiCanh || {});
    /* 🛑 lưới người × ngày có họ tên: «chỉ có số» là câu SAI — mỗi ô là số của
       MỘT NGƯỜI có tên. Không cho đi đường tự do; chuyển sang cổng mức 2. */
    if (dangCoHoTen(bc)) { chiTiet(themVaoBoiCanh, { tuMuc1: true }); return; }
    const ma = maAudit();
    ghiAudit({
      ma, muc: 1, luc: HOMNAY, nguoi: bc.nguoi, baoCao: bc.baoCao, mucDich: null, truong: null,
      gio: gioNay(), chucDanh: bc.chucDanh || '', menu: bc.menu || '', tab: bc.tab || '',
      soBanGhi: bc.soDongTongHop == null ? null : bc.soDongTongHop, truongTen: [], mucDichMa: null
    }, bc);
    hopThoai('⬇ Xuất bảng số liệu — <span class="xtag t1">Mức 1 · chỉ có số</span>',
      '<div class="xok">Tệp <b>.xlsx</b> đã tạo. Tệp mức 1 <b>chỉ mang số tổng hợp</b>, không mang cột họ tên — '
      + 'là <b>số liệu thống kê</b>, xuất tự do. Lượt xuất vẫn ghi một dòng vào nhật ký hệ thống <b>(M10.7)</b>, nhãn «mức 1».</div>'
      + '<div class="xfile">' + dauTrang(bc) + '<div class="xbody">' + (bc.xemTruoc || '<i>(nội dung bảng đang xem)</i>') + '</div>'
      + cuoiTrang(bc, ma, null) + '</div>',
      '<button class="btn p" data-xdong="1">Đã hiểu</button>');
  }

  /* ═════════════ MỨC 2 · DANH SÁCH CHI TIẾT — có cổng ═════════════════
     Bốn việc bắt buộc, không bỏ việc nào:
       ① chọn MỤC ĐÍCH  ② chọn TRƯỜNG xuất  ③ ĐÓNG DẤU tệp  ④ ghi AUDIT đủ */
  function chiTiet(themVaoBoiCanh, opt) {
    const bc = Object.assign({}, boiCanh(), themVaoBoiCanh || {});
    const truongDL = bc.truong_du_lieu || [];
    let h = '';
    if (opt && opt.tuMuc1)
      h += '<div class="xcanh">↪ Anh/chị bấm <b>Xuất bảng số liệu</b>, nhưng bảng đang xem là <b>lưới có họ tên</b> — '
        + 'mỗi ô là số của <b>một người có tên</b>, nên tệp là <b>dữ liệu cá nhân</b> dù chỉ có số. Lượt này đi cổng mức 2.</div>';
    h += '<div class="xcanh">⚖ <b>Danh sách này có dữ liệu cá nhân.</b> Theo <b>Luật Bảo vệ dữ liệu cá nhân 91/2025</b>, '
      + 'mỗi lượt xuất phải <b>nêu mục đích</b>, <b>chỉ lấy trường cần dùng</b>, và <b>để lại vết</b>. '
      + 'Tệp tải về sẽ mang dấu của lượt xuất này.</div>';
    h += '<div class="xm"><b>① Mục đích xuất</b> <i>— bắt buộc chọn một</i><div class="xmd">'
      + MUC_DICH.map((m, i) => '<label class="xr"><input type="radio" name="xmd" value="' + m[0]
        + '"' + (i === 0 ? '' : '') + '> ' + esc(m[1]) + '</label>').join('') + '</div></div>';
    h += '<div class="xm"><b>② Trường dữ liệu đưa vào tệp</b> <i>— bỏ chọn trường không cần dùng</i><div class="xtr">'
      + (truongDL.length
        ? truongDL.map(t => '<label class="xc"><input type="checkbox" class="xtrc" value="' + esc(t.khoa) + '"'
          + (t.macDinh === false ? '' : ' checked') + (t.batBuoc ? ' disabled' : '') + '> ' + esc(t.ten)
          + (t.batBuoc ? ' <i>(bắt buộc)</i>' : '') + (t.nhay ? ' <b class="xnhay">nhạy cảm</b>' : '') + '</label>').join('')
        : '<i>(demo chưa khai danh sách trường — `app.20` truyền `truong_du_lieu`)</i>')
      + '</div></div>';
    h += '<div class="xm"><b>③ Tệp sẽ mang dấu</b><div class="xdau2">Tên người xuất · chức danh · thời điểm · mục đích · mã audit — '
      + 'in ở cuối mọi trang, không gỡ được khỏi tệp.</div></div>';
    hopThoai('⬇ Xuất danh sách chi tiết — <span class="xtag t2">Mức 2 · có dữ liệu cá nhân</span>', h,
      '<button class="btn" data-xdong="1">Hủy</button>'
      + '<button class="btn d" id="xuGo" disabled>⬇ Tôi xác nhận mục đích trên và tải tệp</button>');
    const ktra = () => {
      const r = document.querySelector('input[name="xmd"]:checked');
      const n = $$('.xtrc').filter(x => x.checked).length;
      const b = $('#xuGo'); if (!b) return;
      b.disabled = !(r && (n > 0 || !truongDL.length));
      b.textContent = r ? '⬇ Tôi xác nhận mục đích trên và tải tệp (' + n + ' trường)'
        : '⬇ Chọn mục đích trước';
    };
    $$('#xuMask input').forEach(i => i.addEventListener('change', ktra));
    ktra();
    $('#xuGo').addEventListener('click', () => {
      const r = document.querySelector('input[name="xmd"]:checked');
      const md = (MUC_DICH.find(m => m[0] === r.value) || [, ''])[1];
      const tr = $$('.xtrc').filter(x => x.checked).map(x => x.value);
      const ma = maAudit();
      ghiAudit({
        ma, muc: 2, luc: HOMNAY, nguoi: bc.nguoi, baoCao: bc.baoCao, mucDich: md, truong: tr,
        gio: gioNay(), chucDanh: bc.chucDanh || '', menu: bc.menu || '', tab: bc.tab || '',
        soBanGhi: bc.soDong == null ? null : bc.soDong,
        truongTen: tr.map(k => ((truongDL.find(t => t.khoa === k) || {}).ten) || k),
        mucDichMa: r.value
      }, bc);
      hopThoai('✅ Đã tạo tệp — <span class="xtag t2">Mức 2</span>',
        '<div class="xok">Tệp <b>.xlsx</b> đã tạo và <b>đã đóng dấu</b>. Một dòng audit đã ghi vào nhật ký hệ thống '
        + '<b>(M10.7)</b> — mã <b>' + esc(ma) + '</b>.</div>'
        + '<div class="xfile">' + dauTrang(bc)
        + '<div class="xbody"><i>' + tr.length + ' trường dữ liệu · ' + (bc.soDong || '—') + ' dòng có họ tên</i></div>'
        + cuoiTrang(bc, ma, md) + '</div>',
        '<button class="btn p" data-xdong="1">Đóng</button>');
    });
  }

  /* ─────────────── hộp thoại riêng của tệp nền (tự tạo DOM) ─────────── */
  function nodeMask() {
    let m = $('#xuMask');
    if (m) return m;
    m = document.createElement('div');
    m.id = 'xuMask'; m.className = 'xumask';
    m.innerHTML = '<div class="xumodal"><div class="xuh" id="xuH"></div><div class="xub" id="xuB"></div>'
      + '<div class="xuf" id="xuF"></div></div>';
    document.body.appendChild(m);
    m.addEventListener('click', e => {
      if (e.target === m || e.target.closest('[data-xdong]')) dong();
    });
    return m;
  }
  function hopThoai(tieuDe, than, chan) {
    nodeMask();
    $('#xuH').innerHTML = tieuDe; $('#xuB').innerHTML = than; $('#xuF').innerHTML = chan || '';
    $('#xuMask').classList.add('on');
  }
  const dong = () => { const m = $('#xuMask'); if (m) m.classList.remove('on') };

  /* sổ audit — bày ra được khi cần chứng minh «đã ghi vết» */
  function soAudit() {
    if (!AUDIT.length) return '<div class="empty">Chưa có lượt xuất nào trong phiên này.</div>';
    return '<div class="tbx"><table class="bgt"><thead><tr><th>Mã</th><th>Mức</th><th>Người xuất</th>'
      + '<th>Báo cáo</th><th>Mục đích</th></tr></thead><tbody>'
      + AUDIT.slice().reverse().map(a => '<tr><td>' + esc(a.ma) + '</td><td>'
        + (a.muc === 1 ? '<span class="xtag t1">1</span>' : '<span class="xtag t2">2</span>') + '</td><td>'
        + esc(a.nguoi) + '</td><td>' + esc(a.baoCao) + '</td><td>' + esc(a.mucDich || '—') + '</td></tr>').join('')
      + '</tbody></table></div>';
  }

  function gan() {
    if (gan._da) return; gan._da = true;
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-xu]');
      if (!b) return;
      if (b.getAttribute('data-xu') === 'tong') tongHop(XU.themBoiCanh ? XU.themBoiCanh() : null);
      else chiTiet(XU.themBoiCanh ? XU.themBoiCanh() : null);
    });
  }

  return {
    veNut, tongHop, chiTiet, dauTrang, cuoiTrang, soAudit, gan, noiBoiCanh, dong, MUC_DICH, AUDIT,
    /* v2 */ KHOA_SO, docSoChung, dongAudit
  };
})();


/* ══════════════════════════════════════════════════════════════════════════
   ĐÓNG KHUNG — `BCM9-3C` (20/9/2026). Cặp với `app.10-mo-khung-bao-cao.js`.

   Đưa bốn cổng của hợp đồng 🔒 HDBC ra ngoài khung dưới một cái tên duy nhất,
   `BCN`. Tab báo cáo gọi `BCN.CT` `BCN.KB` `BCN.PV` `BCN.XU` — ⛔ không gọi
   thẳng `CT` `KB` `PV` `XU`, vì bên ngoài khung bốn tên ấy không tồn tại.

   Kèm theo là các tiện ích của nền mà tab báo cáo cần và menu chủ có thể đang
   hiểu khác: `HOMNAY` của nền là **28/12/2026** — mốc chung của cả nhóm 📊,
   ⛔ không phải "hôm nay" mô phỏng của menu chủ (`M6.12` 23/10 · `M8.1` và
   `M8.4` 20/11). Tab báo cáo dùng mốc của NỀN để 16 bản báo cáo cùng một mốc,
   và NÓI RA mốc ấy trên màn hình thay vì để người đọc tự đoán.
   ══════════════════════════════════════════════════════════════════════════ */

  BCN = {
    CT: CT, KB: KB, PV: PV, XU: XU,
    CHIEU: CHIEU,
    HOMNAY: HOMNAY, NAMHOC: NAMHOC, NAMHOC_TU: NAMHOC_TU, NAMHOC_DEN: NAMHOC_DEN,
    esc: esc, vn: vn, vnd: vnd, trieu: trieu, tile: tile, kd: kd,
    d2k: d2k, k2d: k2d, d2s: d2s, k2s: k2s, kThu: kThu, p2: p2,
    themNgay: themNgay, soNgay: soNgay, thangCua: thangCua, tenThang: tenThang
  };

})();


/* ══════════════════════════════════════════════════════════════════════════
   PHẦN DÙNG CHUNG CỦA BỐN TAB BÁO CÁO TẠI MENU CHỦ — `BCM9-3C` (20/9/2026)
   Chép nguyên vào cả bốn demo `M6.9` · `M6.12` · `M8.1` · `M8.4`.

   ⚠ Tệp này KHÔNG thuộc hợp đồng 🔒 HDBC (hợp đồng chỉ có bốn tệp nền).
     Nó là phần dùng chung của riêng phiên `3C`; băm ghi ở mục G của phiếu để
     phiên sau biết bốn bản phải giống nhau.

   Bốn tab đều phải mang đúng những thứ này, nên chúng ở một chỗ:
     · `BC.batKhung()`  — bật/tắt lớp `bc9` (xem `style.30-bao-cao.css`)
     · `BC.daiLuat()`   — dải nói tab này chịu luật nhóm 📊 (`3C` §5)
     · `BC.daiRanh()`   — dải RANH GIỚI với tab tác nghiệp bên cạnh (`N7`)
     · `BC.daiMoc()`    — dải nói mốc "hôm nay" của nhóm 📊
     · `BC.daiNgoaiLe()`— dải nói vai đang đọc số qua ngoại lệ quyền khai tay
     · `BC.ghiChu()` · `BC.nutGhiChu()` — lý do thiết kế, ẩn sau nút 💡
     · `BC.nutXuat()`   — hai nút xuất, chỉ với vai có `XD` trên chính tab này
     · `BC.ganChung()`  — bắt nút deep-link, nối `KB` `PV` `XU`
   ══════════════════════════════════════════════════════════════════════════ */

var BC = (function () {

  /* ── lớp khung CSS ──────────────────────────────────────────────────────
     Chỉ bật khi tab báo cáo đang mở. Rời tab là tắt, và đóng luôn panel còn
     mở — panel sống ngoài `#content` nên nó không tự biến mất theo lần vẽ. */
  function batKhung(dangMo) {
    document.body.classList.toggle('bc9', !!dangMo);
    if (!dangMo && BCN) { BCN.KB.dong(); BCN.XU.dong(); }
  }

  /* ── dải LUẬT (`3C` §5) ─────────────────────────────────────────────────
     Bốn tab này nằm trong menu nghiệp vụ nhưng chịu luật của nhóm 📊. Viết ra
     để phiên sau không "dọn cho giống tab cũ" — thêm một nút `Tạo` vào đây là
     phá `N4`, không phải làm cho tiện. */
  function daiLuat() {
    return '<div class="ro">📊 <b>Tab báo cáo</b> — chỉ <code>X</code> <code>XD</code>, '
      + 'không nút ghi nào. Mọi ô số bấm được.</div>';
  }

  /* ── dải RANH GIỚI (`N7`) — 🛑 bắt buộc, không để trống ──────────────────
     Không nêu thì chắc chắn có người hỏi «sao hai chỗ ra hai số khác nhau» —
     và cả hai đều đúng, vì khác khoảng thời gian. */
  function daiRanh(tenTabCu, hoiCu, hoiMoi) {
    return '<div class="canh b">🧭 <b>' + BCN.esc(tenTabCu) + '</b>: <i>«' + BCN.esc(hoiCu)
      + '»</i> · <b>tab này</b>: <i>«' + BCN.esc(hoiMoi) + '»</i>.</div>';
  }

  /* ── dải MỐC — vì sao ngày chốt mặc định không phải "hôm nay" của menu chủ */
  function daiMoc(homNayMenu) {
    if (!homNayMenu || homNayMenu === BCN.k2s(BCN.HOMNAY)) return '';
    return '<div class="ro">🗓 Mốc chung của nhóm 📊: <b>' + BCN.k2s(BCN.HOMNAY)
      + '</b> — menu này mô phỏng hôm nay <b>' + BCN.esc(homNayMenu) + '</b>.</div>';
  }

  /* ── nối dây một lần ────────────────────────────────────────────────────
     `veLai` là hàm vẽ lại của MENU CHỦ: đổi ngày chốt, đổi khoảng, đổi phân tổ
     đều phải đi qua đúng một đường vẽ, không dựng đường thứ hai. */
  function ganChung(o) {
    if (ganChung._da) return; ganChung._da = true;
    BCN.KB.datMenu(o.menu);
    BCN.KB.noiQuyen(o.coXD, o.moTaNguon);
    BCN.PV.noiVeLai(o.veLai);
    BCN.XU.noiBoiCanh(o.boiCanh);
    BCN.KB.gan(); BCN.PV.gan(); BCN.XU.gan();

    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-bcnote]')) { NOTE = !NOTE; o.veLai(); return }
      var dl = e.target.closest('[data-dl]');
      if (!dl) return;
      var m = dl.getAttribute('data-dl'), q = dl.getAttribute('data-dlq') || '';
      /* ── deep-link VỀ CHÍNH MENU NÀY thì nhảy thật ──────────────────────
         Bốn tab của `3C` nằm ngay trong menu chủ, nên phần lớn ô số dẫn về
         một tab bên cạnh — cách một cú bấm, không cách một trang. Bày ra
         đường dẫn rồi bắt người dùng tự đi là bỏ phí đúng cái lợi thế mà
         `N11` đổi lấy khi đặt báo cáo tại menu chủ.                        */
      if (m === o.menu && typeof o.nhay === 'function') {
        BCN.KB.dong();
        o.nhay(q);
        return;
      }
      /* deep-link sang menu khác: demo là tệp rời, nên nói ra đường dẫn thật
         thay vì nhảy trang — nhảy sang một demo không đọc tham số thì người
         rà tưởng deep-link hỏng. */
      toast('↗ Deep-link sang <b>' + BCN.esc(m) + '</b> — <code>?' + BCN.esc(q) + '</code><br>'
        + '<i>Demo một tệp: không mở được menu khác, nhưng đường dẫn là đường dẫn thật.</i>');
    });
  }

  /* ── dải NGOẠI LỆ QUYỀN — `N5` nói «ẩn thì phải nói»; mở cũng phải nói ──
     Cổng `N5` đọc cột `XD` của bảng chuẩn. Có menu chủ **không có một ô `XD`
     nào** (`M6.9`), có chức danh chưa từng có mặt trong bảng của menu ấy
     (`TTVP`). Prompt `3C` §6 vẫn cấp `X XD` cho họ trên tab báo cáo — đó là
     ngoại lệ KHAI TAY mà sổ điều phối §5 cho phép, với điều kiện nêu lý do.
     Nêu ở phiếu thôi thì người đang đọc bảng không thấy; nên nêu luôn ở đây. */
  function daiNgoaiLe(ds) {
    if (!ds || !ds.length) return '';
    return '<div class="canh w">🔑 Bảng chuẩn quyền <b>chưa có ô <code>XD</code></b> ở '
      + ds.map(function (x) { return '<b>' + BCN.esc(x) + '</b>' }).join(' · ')
      + ' — đang đọc qua <b>ngoại lệ khai tay</b> <i>(phiếu 3C mục H)</i>.</div>';
  }

  /* ── GHI CHÚ THIẾT KẾ — ẩn mặc định ────────────────────────────────────
     Sổ điều phối §2: *«lý do thiết kế nằm sau nút `💡 Ghi chú thiết kế` ẩn
     mặc định»*. Ngưỡng mật độ chữ ≤ 20% không đòi bỏ lời giải thích — nó đòi
     lời giải thích **đừng chiếm màn hình mặc định**. Bốn menu chủ đều có sẵn
     công tắc ấy và đều dùng lớp `nn` trên `<body>` để tắt, nên hàm này chỉ
     hỏi đúng công tắc của menu chủ thay vì dựng một công tắc thứ hai. */
  var NOTE = false;
  var coCongTacChu = function () { return !!document.getElementById('btnNote') };

  function ghiChu(html) {
    /* menu chủ có công tắc riêng (`M6.9` · `M6.12` dùng lớp `nn`) thì nghe nó,
       ⛔ đừng dựng công tắc thứ hai cạnh một công tắc đã có. */
    if (coCongTacChu()) {
      if (document.body.classList.contains('nn')) return '';
    } else if (!NOTE) return '';
    return '<div class="dnote">💡 <b>Ghi chú thiết kế.</b> ' + html + '</div>';
  }

  /* ── HAI NÚT XUẤT chỉ hiện với vai có `XD` TRÊN CHÍNH TAB BÁO CÁO ──────
     Cổng `N5` quyết định **ô nào đọc được số**; còn **mang số ra khỏi màn
     hình** là việc của `XD` trên chính tab này — hai chuyện khác nhau, và
     prompt `3C` §6 cấp `X` cho vài vai mà không cấp `XD`.
     Vai không có `XD` thì ⛔ không thấy nút nào, và **được nói cho biết vì
     sao** — `N5` đòi «ẩn thì phải nói», kể cả khi thứ bị ẩn là một cái nút. */
  function nutXuat(coXD) {
    if (coXD) return BCN.XU.veNut();
    return '<span class="noacc" title="Tab này cấp cho vai của bạn quyền Xem (X), '
      + 'không cấp quyền Xuất dữ liệu (XD)">🔒 không có quyền Xuất</span>';
  }

  /* `M8.1` và `M8.4` KHÔNG có công tắc ghi chú — tab báo cáo tự mang một cái,
     và chỉ mang khi menu chủ chưa có. */
  function nutGhiChu() {
    if (coCongTacChu()) return '';
    return '<button class="btn xs" data-bcnote="1">💡 Ghi chú thiết kế: '
      + (NOTE ? 'BẬT' : 'TẮT') + '</button>';
  }

  /* ── đo mật độ chữ giải thích (`nh9` §9.1 — ngưỡng ≤ 20%) ───────────────
     Gọi `doMatDoChuBC()` trong console khi tab báo cáo đang mở. */
  function doMatDo() {
    /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
    var giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.pvcut';
    var goc = document.querySelector('#content');
    var tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
    var chu = 0;
    goc.querySelectorAll(giai).forEach(function (n) {
      chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length;
    });
    var r = { tong: tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
    console.log('Mật độ chữ giải thích —', r);
    return r;
  }

  return {
    batKhung: batKhung, daiLuat: daiLuat, daiRanh: daiRanh, daiMoc: daiMoc,
    daiNgoaiLe: daiNgoaiLe, ghiChu: ghiChu, nutGhiChu: nutGhiChu, nutXuat: nutXuat,
    ganChung: ganChung, doMatDo: doMatDo
  };
})();
function doMatDoChuBC() { return BC.doMatDo() }

/* ══════════════ NỐI NGUỒN ═══════════════════════════════════════════════ */
function bcPTNoiNguon() {
  var CT = BCN.CT;

  function daPhat() {
    return TB.filter(function (t) { return t.tt === 'sent' && t.phat && trongPV(t) && locDT(t) });
  }
  function ngayCua(t) {
    var d = t.phat;
    return d.getFullYear() + '-' + BCN.p2(d.getMonth() + 1) + '-' + BCN.p2(d.getDate());
  }
  /* kênh của MỘT lượt phát: lượt nào cũng chạm cả hai kênh, nên bộ lọc kênh
     không bỏ lượt — nó đổi con số mang ra đếm (xem `bcPTDaiKenh`). */
  function locKenh(t, o) {
    if (BCPT.kenh === 'ALL') return true;
    if (BCPT.kenh === 'push') return t.kq.push > 0;
    return t.kq.inapp > 0;
  }

  CT.nguonSo('GT.01', function (tham, o) {
    var tu = tham.tuNgay, den = tham.denNgay, loc = tham.loc || function () { return true };
    var ds = daPhat().filter(function (t) {
      var n = ngayCua(t);
      return n >= tu && n <= den && loc(t) && locKenh(t, o);
    });
    var tong = 0;
    var goc = ds.map(function (t) {
      var k = t.kq, v;
      if (!o) v = 1;
      else if (o === 'nguoiNhan') v = k.push + k.inapp + k.loi;
      else if (o === 'phatLai') v = t.dcCho ? 1 : 0;
      else v = k[o] || 0;
      /* bộ lọc kênh cắt bớt con số của từng lượt, không cắt bớt số lượt */
      if (o === 'nguoiNhan' && BCPT.kenh === 'push') v = k.push;
      if (o === 'nguoiNhan' && BCPT.kenh === 'inapp') v = k.inapp;
      tong += v;
      return {
        id: t.id, ten: t.tieu,
        phu: nhanPV(t.pv) + ' · phát ' + dt2s(t.phat) + (t.dcCho ? ' · ĐÍNH CHÍNH cho ' + t.dcCho : ''),
        so: BCN.vn(v)
      };
    }).filter(function (r) { return !o || r.so !== '0' });
    return { giaTri: tong, banGhiGoc: goc };
  });

}

      + '<i>(anh Ninh chốt 21/9)</i>, nên tab đo <b>giao tới</b> chứ không đo <b>đã đọc</b>. '
      + 'Mốc chung của nhóm 📊 là <b>' + BCN.k2s(BCN.HOMNAY) + '</b>; demo menu này mô phỏng '
      + 'hôm nay <b>' + d2s(HOMNAY) + '</b>, nên tab mở bằng «từ đầu năm học» thay vì «tháng này».')
    + PV.daiMau() + PV.khoang() + bcPTDaiKenh();

  var chieu = PV.st.phanTo || 'loai_thong_bao';
  h += PV.chonChieu('GT.01', ['loai_thong_bao', 'nhom_nhan', 'thang', 'lop']);

  h += KB.K2({
    id: 'a', tieuDe: 'Lượt phát tán và kết quả giao nhận', ma: 'GT.01', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: BCN.CHIEU[chieu], gomNhom: false,
    dong: bcPTDong(chieu),
    cot: [
      { khoa: null, ten: 'Số lượt phát', donVi: 'lượt', kieu: 'so', nguon: 'm8.1.lich_phat_tan' },
      { khoa: 'nguoiNhan', ten: 'Người nhận', kieu: 'so', nguon: 'm8.1.lich_phat_tan' },
      { khoa: 'push', ten: 'Đẩy được qua App', kieu: 'so', nguon: 'm8.1.lich_phat_tan' },
      { khoa: 'inapp', ten: 'Chỉ trong ứng dụng', kieu: 'so', nguon: 'm8.1.lich_phat_tan' },
      { khoa: 'loi', ten: 'Lỗi đẩy', kieu: 'so', nguon: 'm8.1.lich_phat_tan', canhBao: function (k) { return k.giaTri > 0 } },
      { khoa: 'bo', ten: 'Bị bỏ lúc phát', kieu: 'so', nguon: 'm8.1.lich_phat_tan', canhBao: function (k) { return k.giaTri > 0 } },
      { khoa: 'phatLai', ten: 'Phát lại (đính chính)', kieu: 'so', nguon: 'm8.1.lich_phat_tan', canhBao: function (k) { return k.giaTri > 0 } }
    ],
    o: function (d, c) { return CT.doc('GT.01', PV.thamSoPS({ loc: d.loc, phanTo: chieu }), c.khoa || undefined) },
    link: function (d) { return { menu: 'M8.1', ctx: 'tab=lich', nhan: 'Lịch phát tán' } },
    duoiBang: '<div class="ro">📡 Bốn cột giữa là <b>GIAO TỚI</b>, ⛔ không phải <b>đã đọc</b> — '
      + 'trường không lưu vết đọc <i>(chốt 21/9)</i>.</div>'
  });

  /* Khối phụ — phải qua duyệt hay không. Nguồn là Feature `Chờ tôi duyệt`,
     nên đây là chỗ cổng `N5` thật sự cắt: xem chú thích ở đầu tệp. */
  h += KB.K1({
    id: 'b', tieuDe: 'Lượt phát theo yêu cầu duyệt', ma: 'GT.01', chip: 'PS',
    moTaKy: PV.moTaKhoang(), donVi: 'lượt', nguon: 'm8.1.cho_toi_duyet',
    tenCotDau: 'Yêu cầu duyệt',
    dong: [
      {
        /* v1.5 §5 câu 1: Toàn trường HOẶC cả một điểm trường — cùng hàm `canD` của màn soạn */
        id: 'toantruong', ten: 'Toàn trường hoặc cả một điểm trường — phải có một chữ ký D',
        loc: function (t) { return canD(t.pv) },
        link: { menu: 'M8.1', ctx: 'tab=duyet', nhan: '⏳ Chờ tôi duyệt' }
      },
      {
        id: 'khac', ten: 'Phạm vi nhỏ hơn cả một điểm trường — không cần duyệt',
        loc: function (t) { return !canD(t.pv) },
        link: { menu: 'M8.1', ctx: 'tab=lich', nhan: 'Lịch phát tán' }
      }
    ],
    oSo: function (d) { return CT.doc('GT.01', PV.thamSoPS({ loc: d.loc, phanTo: null })) },
    link: function (d) { return d.link }
  });

  return h;
}

/* ── bộ chọn KÊNH ────────────────────────────────────────────────────────
   Kênh không phải một thuộc tính của lượt phát mà là một CÁCH ĐẾM: mỗi lượt
   đều chạm cả hai kênh, chỉ khác số người ở mỗi bên. Nên bộ chọn này đổi con
   số mang ra đếm, ⛔ không bỏ bớt lượt — và màn hình nói ra điều đó. */
function bcPTDaiKenh() {
  var k = BCPT.kenh;
  return '<div class="pvbar"><span class="pvlb">📡 Kênh</span>'
    + '<button class="pvk' + (k === 'ALL' ? ' on' : '') + '" data-bck="ALL">Cả hai kênh</button>'
    + '<button class="pvk' + (k === 'push' ? ' on' : '') + '" data-bck="push">App — đẩy được</button>'
    + '<button class="pvk' + (k === 'inapp' ? ' on' : '') + '" data-bck="inapp">Chỉ trong ứng dụng</button>'
    + '<span class="pvmc">đổi <b>con số mang ra đếm</b>, không bỏ bớt lượt phát</span></div>';
}

/* dòng theo chiều đang chọn */
function bcPTDong(chieu) {
  if (chieu === 'nhom_nhan') {
    return Object.keys(PVTEN).map(function (k) {
      return { id: k, ten: PVTEN[k], loc: function (t) { return t.pv.loai === k } };
    });
  }
  if (chieu === 'thang') {
    var PV = BCN.PV, ds = [], t = BCN.thangCua(PV.st.tuNgay), het = BCN.thangCua(PV.st.denNgay), dem = 0;
    while (t <= het && dem++ < 24) {
      (function (thang) {
        ds.push({
          id: thang, ten: BCN.tenThang(thang),
          loc: function (x) {
            var d = x.phat;
            return d.getFullYear() + '-' + BCN.p2(d.getMonth() + 1) === thang;
          }
        });
      })(t);
      var y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)) + 1;
      if (m > 12) { m = 1; y++ }
      t = y + '-' + BCN.p2(m);
    }
    return ds;
  }
  /* mặc định: loại thông báo = chủ đề (M8.1 §8.2 — chủ đề là danh mục đóng) */
  return CHUDE.map(function (c) {
    return {
      id: c, ten: (CDIC[c] || '') + ' ' + c,
      loc: function (t) { return t.chude === c }
    };
  });
}

/* ══════════════ BỐI CẢNH TỆP XUẤT ═══════════════════════════════════════ */
function bcPTBoiCanh() {
  var PV = BCN.PV;
  var kb = BCN.CT.khaiBao('GT.01');
  var trong = TB.filter(function (t) { return t.tt === 'sent' && trongPV(t) && locDT(t) }).length;
  var tong = TB.filter(function (t) { return t.tt === 'sent' }).length;
  return {
    truong: 'THCS & THPT Nguyễn Tất Thành',
    baoCao: 'Báo cáo phát tán thông báo (BC-GT-01)',
    menu: 'M8.1', nguoi: R().me, chucDanh: R().ct,
    ky: PV.moTaKhoang(),
    phamVi: R().sc + (BCPT.kenh === 'ALL' ? '' : ' · kênh ' + (BCPT.kenh === 'push' ? 'App' : 'chỉ trong ứng dụng')),
    toanTruong: tong, tongPhamVi: trong, donVi: 'lượt phát',
    quyTac: kb.quyTacDem.tinhVao.concat(kb.quyTacDem.khongTinh.map(function (x) { return 'KHÔNG tính: ' + x })),
    /* Mức 2 ở đây là DANH SÁCH NGƯỜI NHẬN — đúng nghĩa dữ liệu cá nhân:
       nó ghép tên người với việc họ đã nhận thông báo gì. */
    truong_du_lieu: [
      { khoa: 'id', ten: 'Mã thông báo', batBuoc: true },
      { khoa: 'tieu', ten: 'Tiêu đề · chủ đề', batBuoc: true },
      { khoa: 'phat', ten: 'Giờ phát tán' },
      { khoa: 'pv', ten: 'Công thức chọn người nhận' },
      { khoa: 'kq', ten: 'Kết quả giao nhận (số)' },
      { khoa: 'nguoiNhan', ten: 'Danh sách người nhận (họ tên)', nhay: true, macDinh: false },
      { khoa: 'nguoiSoan', ten: 'Người soạn (họ tên)', nhay: true, macDinh: false }
    ],
    soDong: trong
  };
}


/* ============ DEEP-LINK VÀO — menu khác mở sẵn màn soạn (§1.2) ============
   Thêm 14/9/2026 — phiếu DOT1-P12 mục E4: M8.5 Trang web trường gọi
   /M8.1?action=tao&ctx={mã bài web}&return=M8.5
   M8.1 chỉ BƠM SẴN chủ đề · tiêu đề · nội dung · đường dẫn bài. Người nhận do người soạn chọn,
   và bước 4 vẫn phải bấm gửi — không có đường tự bắn tin từ menu khác. */
const NGUON_VAO={
 'M8.5':{ten:'M8.5 Trang web trường',bai:{
  'WEB-0142':{tieu:'Lịch họp cha mẹ học sinh đầu năm học 2026-2027',
   tom:'Họp cha mẹ học sinh toàn trường vào sáng Chủ nhật 20/9/2026, từ 8h00 tại các lớp học.'}}}
};
function moTu(src,ctx){
 const n=NGUON_VAO[src];if(!n){toast('⛔ Menu nguồn <b>'+esc(src||'?')+'</b> chưa khai trong danh sách kích hoạt của M8.1');return}
 const b=n.bai[ctx]||{tieu:'Bài mới trên trang web trường',tom:''};
 newC({chude:'Sự kiện',tieu:'Mời xem: '+b.tieu,
  nd:'Nhà trường vừa đăng bài «'+b.tieu+'» trên trang web trường.\n\n'+(b.tom?b.tom+'\n\n':'')+'Xem đầy đủ: https://nguyentatthanh.truong.dschool.vn/bai/'+ctx,
  tu:{src:src,ctx:ctx,ten:n.ten}});
 toast('📥 Mở sẵn màn soạn từ <b>'+esc(n.ten)+'</b> — chọn người nhận rồi gửi như mọi thông báo');
}
document.addEventListener('click',function(e){if(e.target.closest('#vaoM85'))moTu('M8.5','WEB-0142')});
(function(){const q=new URLSearchParams(location.search);
 /* SL24-Z v1.5 — ?vai= doc SAU khi ROLE da khai du (ke ca PHT_DT_B) */
 const v=q.get('vai');
 if(v&&ROLE[v]){role=v;document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role));render()}
 if(q.get('action')==='tao'&&q.get('return'))moTu(q.get('return'),q.get('ctx'));
 /* §5.1 cho 2 — /M8.1?tab=cho_toi_duyet&id=TB-… (tu M0.3, hoac lien ket duoc chuyen tiep).
    Viec trong hang doi cua vai ⇒ mo chi tiet de duyet; ngoai pham vi D ⇒ khoi .noacc, ⛔ khong noi dung, ⛔ khong nut */
 if(q.get('tab')==='cho_toi_duyet'&&q.get('id')){
  const id=q.get('id'),t=byId(id);
  if(t&&queueDu().indexOf(t)>=0){V.tab='duyet';V.pick=id;V.kind='tb'}
  else{V.tab=queue().length?'duyet':'toi';V.pick=id;V.kind='noacc'}
  render();
 }})();


/* ══════════════════════════════════════════════════════════════════════════
   `M8.1` — KHỞI ĐỘNG TAB BÁO CÁO · `BCM9-3C` (20/9/2026)

   Sắp cuối cùng vì phần lớn mã của `M8.1` nằm trong `body.html` và chạy
   trước mọi tệp `app.*.js`. Lần vẽ đầu của menu không hỏng — tab báo cáo
   thấy `BCN` còn rỗng thì trả về một dòng «đang nạp» — nên chỉ cần vẽ lại.
   ══════════════════════════════════════════════════════════════════════════ */

(function bcPTKhoiDong() {
  bcPTChieu();
  bcPTKhaiMa();
  bcPTNoiNguon();

  /* KỲ CHUẨN của tab (`nh9` §4): `BC-GT-01` là báo cáo THÁNG — nhưng mở bằng
     «từ đầu năm học». Lý do là một lệch mốc có thật, không phải tiện tay:
     mốc "hôm nay" của tệp nền là **28/12/2026** (chung cho cả nhóm 📊), còn
     demo `M8.1` gieo dữ liệu quanh **20/11/2026**. Mở bằng «tháng này» thì
     bảng trắng trơn và người rà tưởng tab hỏng. Nút «Tháng này» vẫn ở ngay
     đó, cách một cú bấm. Lệch mốc ghi ở mục H của phiếu `3C`. */
  BCN.PV.khoangMacDinh('tu_dau_nam');

  BC.ganChung({
    menu: 'M8.1',
    veLai: render,
    coXD: bcPTCoXD,
    moTaNguon: function (f) { return BCPT_NGUON[f] || { menu: 'M8.1', ten: f } },
    boiCanh: bcPTBoiCanh,
    nhay: bcPTNhay
  });

  /* bộ chọn kênh */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-bck]');
    if (!b) return;
    BCPT.kenh = b.getAttribute('data-bck');
    render();
  });

  render();
})();

/* deep-link trong chính `M8.1` — mở đúng tab bên cạnh */
function bcPTNhay(q) {
  var p = {};
  (q || '').split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  if (p.tab) V.tab = p.tab;
  V.pick = null; V.q = '';
  render();
  toast('↗ Đã mở tab <b>' + esc(p.tab === 'duyet' ? '⏳ Chờ tôi duyệt' : 'Lịch phát tán')
    + '</b> — cùng phạm vi với ô số bạn vừa bấm.');
}
