<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}

.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}
.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}
.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}

.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}
.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.flab{font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:-3px}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}.tg.v{background:#ede9fe;color:#5b21b6}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}.st2.v{background:#ede9fe;color:#5b21b6}
.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:13px}
.listw table{display:block;overflow-x:auto}
.listw table thead,.listw table tbody{display:table;width:100%}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:160px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}tr.badrow{background:var(--red-soft)}
tr.okrow{background:var(--green-soft)}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.lgd{display:flex;gap:12px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.empty{padding:32px;text-align:center;color:var(--ink3)}
.mini{font-size:10.5px;color:var(--ink3);font-weight:400}
.nodata{color:var(--red);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:840px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff}

/* ---- lưới ngày công ---- */
.cg{border-collapse:separate;border-spacing:0;min-width:900px}
.cg th{position:sticky;top:0;z-index:2;background:#f8fafc;text-align:center;padding:5px 2px;font-size:10px;letter-spacing:0;text-transform:none}
.cg th.cn{color:var(--red)}
.cg td{padding:0;border-bottom:1px solid var(--line)}
.cg td.nm{padding:6px 9px;position:sticky;left:0;background:#fff;z-index:1;min-width:168px;border-right:1px solid var(--line)}
.cg tr:hover td.nm{background:#f8fafc}
.d{width:23px;height:26px;display:grid;place-items:center;font-size:10px;font-weight:700;border-radius:4px;margin:1px auto;cursor:pointer}
.d:hover{outline:2px solid var(--brand)}
.d.du{background:var(--green-soft);color:var(--green)}
.d.muon{background:var(--amber-soft);color:var(--amber)}
.d.thieu{background:var(--red-soft);color:var(--red);outline:1px solid #fca5a5}
.d.khong{background:var(--red);color:#fff}
.d.phep{background:#e0e7ff;color:#3730a3}
.d.ct{background:#ede9fe;color:#5b21b6}
.d.nghi{background:#f1f5f9;color:var(--ink3)}
.d.chua{background:#fff;color:#e2e8f0;border:1px dashed var(--line2);cursor:default}
.d.dang{background:var(--brand-soft);color:var(--brand);outline:1px solid var(--brand)}
.d.nua{position:relative}

 background:linear-gradient(135deg,transparent 49%,rgba(255,255,255,.75) 49%,rgba(255,255,255,.75) 51%,transparent 51%)}
.mycal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
.mycal .hd{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink3);padding-bottom:3px}
.mycal .hd.cn{color:var(--red)}
.dc{border:1px solid var(--line);border-radius:9px;min-height:62px;padding:5px 6px;font-size:11px;cursor:pointer}

.dc .n{font-weight:700;font-size:12px}

.dc.thieu{background:var(--red-soft);border-color:#fecaca}

.dc.ct{background:#f5f3ff;border-color:#ddd6fe}
.dc.nghi{background:#f8fafc;color:var(--ink3)}

.dc .s{font-size:10px;display:block;margin-top:2px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin-bottom:13px}
.kb{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.kb .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kb .l{font-size:11px;color:var(--ink3);margin-top:1px}
.kb.bad .v{color:var(--red)} .kb.warn .v{color:var(--amber)} .kb.ok .v{color:var(--green)}
.bar3{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);margin-top:5px}

  background:#fff;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--ink2)}

function chuanCua(p,k){
 if(!p.gv) return {loai:'hc',gio:CFG.gioHC.vao,mo:'Giờ hành chính'};
 const thu=new Date(k).getDay(), t=(TIETDAU[p.id]||{})[thu];

 return {loai:'tiet',gio:KHUNGTIET[t],tiet:t,mo:`Tiết ${t} — ${KHUNGTIET[t]}`};
}
const phutCua=hm=>{const[a,b]=hm.split(':').map(Number);return a*60+b};
/* tính muộn theo ĐÚNG chuẩn của từng người */
function tinhMuon(p,k,vao){
 const c=chuanCua(p,k);
 if(!c.gio||!vao)return {muon:0,c};
 return {muon:Math.max(0,phutCua(vao)-phutCua(c.gio)),c};
}

   Ghép theo khung giờ CỦA NGÀY ⇒ hai ngày cho ra kết quả giống hệt nhau. */
SUKIEN.slice().forEach(x=>SUKIEN.push({...x,id:x.id+'-D',ngay:NGAY_DONG,gio:themHM(x.gio,LECH_DONG)}));
TBNGUNG.slice().forEach(x=>TBNGUNG.push({...x,id:x.id+'-D',ngay:NGAY_DONG,
  tu:themHM(x.tu,LECH_DONG),den:themHM(x.den,LECH_DONG)}));
/* giờ ghi sổ đầu bài của tiết — cũng dịch theo ngày đang xem */
const sdbLucCua=t=>t.sdbLuc?(NGAYT===NGAY_DONG?themHM(t.sdbLuc,LECH_DONG):t.sdbLuc):'';
const suKien=id=>SUKIEN.find(x=>x.id===id);

/* ---- TẦNG ② ghep_tiet — DẪN XUẤT. Không lưu, tính lại mỗi lần vẽ.
   Đổi cửa sổ nhận, đổi ngưỡng dung sai, hay M4.7 đổi người dạy thay
   ⇒ chạy lại phép ghép, KHÔNG mất gì và KHÔNG đè lên kết luận của người. */
const KQ={
 khop:      {t:'Khớp',            c:'g',mo:'Có sự kiện của đúng người, đúng phòng, trong cửa sổ nhận'},
 muon:      {t:'Muộn',            c:'w',mo:'Như Khớp nhưng vào sau giờ bắt đầu tiết'},
 som:       {t:'Sớm',             c:'b',mo:'Vào sớm hơn giờ bắt đầu tiết quá 10 phút'},
 khongdl:   {t:'Không có dữ liệu',c:'r',mo:'Phòng CÓ điểm chấm công, thiết bị ĐANG CHẠY, mà không có sự kiện nào'},
 lechnguoi: {t:'Lệch người',      c:'r',mo:'Có sự kiện của NGƯỜI KHÁC trong khung giờ tiết — ca dạy thay không khai báo'},
 lechphong: {t:'Lệch phòng',      c:'r',mo:'Người có sự kiện, nhưng ở PHÒNG KHÁC trong khung giờ đó'},
 ngung:     {t:'Thiết bị ngừng',  c:'v',mo:'Thiết bị của phòng hỏng / bảo trì / mất kết nối trong khung giờ'},
 ngoai:     {t:'Ngoài phạm vi',   c:'n',mo:'Phòng CHƯA có điểm chấm công → không đánh giá, không sinh cảnh báo'},
};
const SOM_PHUT=10;   /* vào sớm hơn ngần này thì tách nhãn Sớm; trong khoảng đó coi là Khớp */
/* Khoảng cách NHỎ NHẤT giữa giờ bắt đầu hai tiết liền nhau (bỏ qua quãng nghỉ trưa).
   Cửa sổ nhận `trước + sau` mà >= số này thì MỘT lượt quẹt gán được vào HAI tiết —
   máy không còn cách nào chọn đúng, nên đây là cửa chặn cứng ở ⚙ (ràng buộc 29). */
/* GY18-A: min trên MỌI bộ giờ đang hiệu lực trong năm học (M4.6 §8.1c · M4.7 §3b.3), KHÔNG phải
   của «khung giờ hiện hành». Cửa sổ nhận khai MỘT con số cho cả năm nên nó phải hợp với mọi bộ;
   lấy theo bộ đang chạy thì đến ngày đổi mùa nó tự trở thành sai mà không ai đụng vào cấu hình nào.
   Cửa chặn NAY ĐỨNG THÊM Ở M4.6 §8.2c (chặn lúc lưu bộ giờ); M4.9 giữ cửa chặn đối xứng bên này. */
const GAP_TIET=(()=>{let m=999;
 BOGIO.forEach(b=>{for(let n=2;n<=8;n++){
  const d=phutCua(b.gio[n][0])-phutCua(b.gio[n-1][0]);if(d>0&&d<m)m=d}});
 return m})();
function ngungCua(ph,tiet){
 const k=khungT(tiet);
 return TBNGUNG.find(x=>x.phong===ph&&x.ngay===NGAYT
   &&phutCua(x.tu)<phutCua(k.kt)&&phutCua(x.den)>phutCua(k.bd));
}
function ghepTiet(t){
 /* Xét TRƯỚC diemCC: tiết trực tuyến thì dù phòng CÓ thiết bị cũng không đo được —
    lớp không ở trong phòng, cái cửa không chứng minh được gì về tiết này. */
 if(t.truc)return {kq:'ngoai',vi:'truc'};
 const d=diemCC(t.phong);
 if(!d)return {kq:'ngoai',vi:phong(t.phong).khongLapTB?'khongdo':'chualap'};
 const ng=ngungCua(t.phong,t.tiet);
 if(ng)return {kq:'ngung',ngung:ng};                /* lỗi của trường, không phải của GV */
 const k=khungT(t.tiet),bd=phutCua(k.bd);
 const trongCua=s=>{const m=phutCua(s.gio);return m>=bd-d.truoc&&m<=bd+d.sau};
 const cua=SUKIEN.filter(s=>s.phong===t.phong&&s.ngay===NGAYT&&trongCua(s))
   .sort((a,b)=>phutCua(a.gio)-phutCua(b.gio));
 const minh=cua.filter(s=>s.ns===t.gv);
 if(minh.length){const m=phutCua(minh[0].gio)-bd;
  return m>0?{kq:'muon',lech:m,sk:minh[0]}:(-m>SOM_PHUT?{kq:'som',lech:-m,sk:minh[0]}:{kq:'khop',lech:-m,sk:minh[0]})}
 const nguoiKhac=cua.filter(s=>s.ns&&s.ns!==t.gv);
 if(nguoiKhac.length)return {kq:'lechnguoi',sk:nguoiKhac[0]};
 const noiKhac=SUKIEN.filter(s=>s.ns===t.gv&&s.ngay===NGAYT&&s.phong!==t.phong&&trongCua(s));
 if(noiKhac.length)return {kq:'lechphong',sk:noiKhac[0]};
 return {kq:'khongdl'};
}

/* ---- TẦNG ③ cham_cong_tiet — KẾT LUẬN. CHỈ tầng này chảy sang bảng công tháng và M7.6 ---- */
const KLT={dung:{t:'Đúng giờ',c:'o'},muon:{t:'Muộn',c:'w'},khong:{t:'Không lên lớp',c:'r'},
 colydo:{t:'Có lý do',c:'b'},khongdg:{t:'Không đánh giá',c:'n'}};
let KLTIET={};   /* chỉ chứa kết luận DO NGƯỜI chốt hoặc sửa — máy không ghi vào đây */
/* Luật tự chốt: Khớp · Sớm · Muộn ≤ ngưỡng dung sai → Đúng giờ; Muộn > ngưỡng → Muộn N′;
   Ngoài phạm vi → Không đánh giá; bốn ca còn lại ĐỂ TRỐNG và vào hàng đợi.
   🛑 MÁY KHÔNG BAO GIỜ TỰ KẾT LUẬN "Không lên lớp" (mở rộng §5.1 xuống tầng tiết). */
function ketLuan(t){
 if(KLTIET[t.id])return KLTIET[t.id];
 const g=ghepTiet(t);
 if(g.kq==='khop'||g.kq==='som')return {kl:'dung',phut:0,nguon:'may'};
 if(g.kq==='muon')return g.lech<=CFG.dungSai
   ?{kl:'dung',phut:g.lech,nguon:'may',trongDungSai:1}
   :{kl:'muon',phut:g.lech,nguon:'may'};
 if(g.kq==='ngoai')return {kl:'khongdg',nguon:'may'};
 return null;                                       /* chưa có kết luận — vào hàng đợi */
}
const tietTrongPV=t=>{const r=R(),p=ns(t.gv);
 if(r.pv==='own')return false;
 if(r.pv==='to')return p&&p.to===r.to;
 if(r.pv==='branch')return dtCua(t)===r.dt;
 return true};
const dsTiet=()=>TIETD.filter(tietTrongPV);
const tietCuaToi=()=>TIETD.filter(t=>t.gv===R().id);
/* hàng đợi ngoại lệ */
const tietNgoaiLe=()=>dsTiet().filter(t=>!ketLuan(t));
const tietKq=k=>dsTiet().filter(t=>ghepTiet(t).kq===k&&!KLTIET[t.id]);
const skLa=()=>SUKIEN.filter(s=>s.ns===null&&s.ngay===NGAYT
 &&(R().pv==='school'||R().pv==='branch'&&phong(s.phong).dt===R().dt));
/* NGỮ CẢNH của một sự kiện không nhận ra ai — thay cho ảnh (YK01-D2): tiết nào của lịch M4.7 ở phòng đó
   có cửa sổ nhận chứa giờ sự kiện, GV theo lịch là ai, sổ đầu bài đã ghi chưa. */
function nguCanhSK(s){
 const m=phutCua(s.gio),d=diemCC(s.phong),tr=d?d.truoc:15,sa=d?d.sau:20;
 return TIETD.filter(t=>{if(t.phong!==s.phong)return false;const bd=phutCua(khungT(t.tiet).bd);return m>=bd-tr&&m<=bd+sa});
}
/* gom theo THIẾT BỊ × KHUNG GIỜ — một camera chết một buổi = MỘT dòng việc, không phải 40 */
function ngungGom(){
 return TBNGUNG.filter(n=>R().pv==='school'||(R().pv==='branch'&&phong(n.phong).dt===R().dt))
  .map(n=>({n,ts:dsTiet().filter(t=>t.phong===n.phong&&ngungCua(t.phong,t.tiet)===n&&!KLTIET[t.id])}))
  .filter(x=>x.ts.length);
}
const viecTietCount=()=>{const r=R();if(r.pv==='own')return 0;
 return tietKq('khongdl').length+tietKq('lechnguoi').length+tietKq('lechphong').length
  +ngungGom().length+skLa().length};
/* cảnh báo bất thường — ca ngược của chỉ số §4.0 */
const coVetKhongSo=()=>dsTiet().filter(t=>{const g=ghepTiet(t);
 return (g.kq==='khop'||g.kq==='muon'||g.kq==='som')&&!t.sdb});
function haiPhongGan(){
 const out=[],ds=SUKIEN.filter(s=>s.ns&&s.ngay===NGAYT);
 ds.forEach((a,i)=>ds.slice(i+1).forEach(b=>{
  if(a.ns===b.ns&&a.phong!==b.phong&&Math.abs(phutCua(a.gio)-phutCua(b.gio))<CFG.haiPhongPhut)out.push([a,b])}));
 return out.filter(([a])=>R().pv==='school'||(R().pv==='branch'&&phong(a.phong).dt===R().dt));
}
/* số tiết THỰC DẠY (sổ đầu bài) mà KHÔNG có dấu vết thiết bị — chỉ số cảnh báo thứ hai (§4.0) */
const soKhongVet=p=>TIETD.filter(t=>t.gv===p.id&&t.sdb&&(()=>{const k=ketLuan(t);
 return !k||k.kl!=='dung'&&k.kl!=='muon'})()).length;

/* ================= KHUNG ================= */
let tab='toi',gocNhin='ngay',fTo='',moNguoi=null,ngayCham=null,chonNg=new Set();

 if(!R().mchu.includes(m))

   kết quả đi tiếp sang ${dlink('M5.3','M5.3 Bảng lương')}.</span>

   <select class="fs" id="fTo"><option value="">Tất cả</option>

     <span>Thiếu chấm công <b class="${ngayThieu().length?'nodata':''}">${ngayThieu().length}</b></span></div></div>`;

   <tbody>${ds.map(p=>{const th=tongHop(p);

      o+=`<td><div class="d ${t.c} ${nua?'nua':''} ${x.duKien?'dukien':''} ${nh.length?'conhan':''}" ${x.tt==='chua'&&!nh.length?'':`data-o="${p.id}|${k}"`}
        title="${d}/${KY.n} — ${t.t}${x.duKien?' (dự kiến — chưa tới)':''}${nua?' '+NUATEN[x.buoi]+', nửa còn lại đi làm':''} · ${x.duKien?0:congNgay(x)} công${nh.length?' · nhãn: '+nh.map(z=>z[0]).join(', '):''}">${
        x.tt==='du'?'✓':x.tt==='muon'?'M':x.tt==='thieu'?'?':x.tt==='khong'?'✕':x.tt==='phep'?'P':
        x.tt==='ct'?'CT':x.tt==='nghi'?'':x.tt==='dang'?'•':''}${nua?'<i>½</i>':''}</div></td>`}
     return `<tr><td class="nm"><b>${p.n}</b><div class="mini">${p.gv?TO[p.to]:p.vt} · ${p.dt}</div></td>${o}
      <td class="num"><b>${th.cong}</b>${th.nua?`<div class="mini">${th.nua} nửa ngày</div>`:''}</td>
      <td class="num">${th.muon||''}</td>
      <td class="num">${th.thieu?`<b class="nodata">${th.thieu}</b>`:''}</td><td class="num">${th.phep||''}</td></tr>`}).join('')}

     <span class="chip"><span class="d phep" style="cursor:default">P</span> Vắng có phép <span class="mini">tự động — ngày <b>có hiệu lực</b> của đơn M4.8</span></span>
     <span class="chip"><span class="d phep dukien" style="cursor:default">P</span> Vắng có phép <b>dự kiến</b> <span class="mini">ngày chưa tới — không tính</span></span>
     <span class="chip"><span class="d chua conhan" style="cursor:default"></span> <b>Có nhãn</b> <span class="mini">đã báo vắng · báo muộn · vượt quỹ · đã rút — chỉ hiển thị, <b>không đổi trạng thái</b></span></span>

     <span class="chip"><span class="d nghi" style="cursor:default"></span> Ngày nghỉ</span>
     <span class="chip"><span class="d chua" style="cursor:default"></span> Chưa diễn ra</span>
     <span class="chip"><span class="d phep nua" style="cursor:default">P<i>½</i></span> <b>Nửa ngày</b> — nửa còn lại đi làm, tính <b>0,5 công</b></span>
     <span class="chip"><b>Đang diễn ra không tính công</b> — ngày chưa xong thì chưa có gì để trả</span></div></div>`;
}

/* YK01-Z1 · 2g — KHÔNG ghi cứng ngày hết hạn ảnh. Thời hạn giữ ảnh là CHÍNH SÁCH CỦA LỚP LƯU TRỮ L58 ở M10.11
   (✅ YK01-4: 30 ngày sau ngày tải lên); M4.9 chỉ chiếu 🔗 con số đó và tính ngày hết hạn từ ngày của sự kiện.
   Đổi ⚙ M10.11 thì M4.9 hiện theo. (Bản ghi sự kiện tầng ① là lớp L59 — hết năm học + 1 năm, không có tệp.) */
const THOI_HAN_L58_NGAY=30;   /* 🔗 chiếu từ M10.11 — lớp L58 «Ảnh từng lượt nhận diện chấm công» */
const hanAnh=ngay=>{const [y,m,d]=ngay.split('-').map(Number);return d2s(new Date(y,m-1,d+THOI_HAN_L58_NGAY))};
const HANANH=()=>hanAnh(NGAYT);   /* GY18-A: hai ngày mẫu — tính theo ngày đang xem */
const nguonKL=k=>k.nguon==='may'
  ? `<span class="tg c">máy tự chốt</span>`
  : `<span class="ava2">${(k.nguoiTen||'?').split(' ').pop().slice(0,2)}</span><span class="mini">${k.nguoiTen}</span>`;
function tietTab(){
 if(!fNgayT)fNgayT=NGAYT;
 /* GY18-A · ca A6 — hai ngày mẫu. Đổi ngày thì ĐỔI CẢ BỘ GIỜ đang hiệu lực (M4.7 §3b.4). */
 if((fNgayT===NGAY_HE||fNgayT===NGAY_DONG)&&NGAYT!==fNgayT){NGAYT=fNgayT;syncKhungT()}
 const khacNgay=fNgayT!==NGAYT;
 let ds=dsTiet();
 if(khacNgay)ds=[];
 if(fPhongT)ds=ds.filter(t=>t.phong===fPhongT);
 if(fGvT)ds=ds.filter(t=>String(t.gv)===fGvT);
 if(fKqT)ds=ds.filter(t=>ghepTiet(t).kq===fKqT);
 if(chiNgoaiLe)ds=ds.filter(t=>!ketLuan(t));
 ds=ds.slice().sort((a,b)=>a.tiet-b.tiet||(a.phong<b.phong?-1:1));
 const tat=dsTiet();
 const dem={dung:0,muon:0,chua:0,khongdg:0,khong:0};
 tat.forEach(t=>{const k=ketLuan(t);
  if(!k)dem.chua++;else if(k.kl==='dung')dem.dung++;else if(k.kl==='muon')dem.muon++;
  else if(k.kl==='khongdg')dem.khongdg++;else dem.khong++});
 const co=R().chotTiet, coSua=R().suaTiet;
 const chonDuoc=ds.filter(t=>!ketLuan(t));
 const bar=`<div class="bar">
   <span class="flab">Ngày</span>
   <input class="fs" id="fNgayT" value="${fNgayT.split('-').reverse().join('/')}" style="width:108px;text-align:center">
   <span class="seg">${[[NGAY_HE,'28/08 · trước mốc'],[NGAY_DONG,'30/10 · sau mốc']].map(([d,n])=>
     `<button class="${NGAYT===d?'on':''}" data-ngayt="${d}">${n}</button>`).join('')}</span>
   <span class="chip" title="M4.6 §8.1c — nhiều bộ giờ theo mùa; giờ của một tiết giải theo NGÀY (M4.7 §3b.4). M4.9 chỉ ĐỌC.">⏰ <b>${tenBoNgay()}</b> · tiết 1 ${khungT(1).bd} · tiết 3 ${khungT(3).bd}</span>
   <span class="flab">Phòng</span>
   <select class="fs" id="fPhongT"><option value="">Tất cả</option>
     ${PHONG.map(p=>`<option value="${p.id}" ${fPhongT===p.id?'selected':''}>${p.id} · ${p.lop}</option>`).join('')}</select>
   <span class="flab">Giáo viên</span>
   <select class="fs" id="fGvT"><option value="">Tất cả</option>
     ${NS.filter(p=>p.gv).map(p=>`<option value="${p.id}" ${fGvT===String(p.id)?'selected':''}>${p.n}</option>`).join('')}</select>
   <span class="flab">Kết quả ghép</span>
   <select class="fs" id="fKqT"><option value="">Tất cả</option>
     ${Object.keys(KQ).map(k=>`<option value="${k}" ${fKqT===k?'selected':''}>${KQ[k].t}</option>`).join('')}</select>
   <label class="ckl"><input type="checkbox" id="fNgoaiLe" ${chiNgoaiLe?'checked':''}> chỉ ngoại lệ</label>
   ${co?`<button class="btn" data-x="tiet-suco">📄 Ghi nhận sự cố thiết bị</button>`:''}
   ${co?`<button class="btn ${chonTiet.size?'p':''}" data-x="tiet-loat" ${chonTiet.size?'':'disabled'}>✓ Chốt hàng loạt ${chonTiet.size||''}</button>`:''}
   ${R().napTB?`<button class="btn" data-x="nap-tb">📥 Nạp dữ liệu thiết bị</button>`:''}
   <button class="btn" data-x="xuat">⬇ Xuất</button></div>
  <div class="sumbar">
   <span><b>${tat.length}</b> tiết</span>
   <span class="s-du"><b>${dem.dung}</b> đúng giờ</span>
   <span class="s-mu"><b>${dem.muon}</b> muộn</span>
   <span class="s-ch"><b>${dem.chua}</b> chưa có kết luận</span>
   <span class="s-kd"><b>${dem.khongdg}</b> không đánh giá</span>
   ${dem.khong?`<span class="s-kl"><b>${dem.khong}</b> không lên lớp</span>`:''}</div>`;
 const gt=`<div class="ro"><b>Nguồn chấm công tiết dạy là THIẾT BỊ TẠI CỬA LỚP, không phải sổ đầu bài.</b>
    Sổ đầu bài do chính người được chấm công tạo ra, nên nó giữ vai <b>căn cứ số tiết thực dạy</b> và vai
    <b>đối chứng</b> — không còn là nguồn giờ giấc.
    Ba cột tách bạch: <b>② kết quả ghép của máy</b> · <b>③ kết luận</b> · <b>nguồn kết luận</b>.
    🛑 <b>Máy không bao giờ tự kết luận "Không lên lớp"</b> — chỉ người phụ trách kết luận, bắt buộc lý do và audit đặc biệt.</div>`;
 if(khacNgay)return gt+bar+`<div class="listw"><div class="empty">
    Bản demo dựng dữ liệu tiết cho <b>thứ Sáu 28/08/2026</b> — ngày đang chọn không có tiết nào.
    <br><span class="mini">Chọn lại ngày 28/08/2026 để xem đủ năm ca.</span></div></div>`;
 return gt+bar+`<div class="listw"><table>
   <thead><tr>${co?'<th style="width:28px"><input type="checkbox" id="ckAllTiet"></th>':''}
     <th style="width:150px">Tiết</th><th>Phòng · lớp</th><th>Môn · giáo viên</th>
     <th>② Kết quả ghép</th><th>③ Kết luận</th><th>Nguồn kết luận</th><th>Thao tác</th></tr></thead>
   <tbody>${ds.length?ds.map(t=>{const g=ghepTiet(t),k=ketLuan(t),kh=khungT(t.tiet),ph=phong(t.phong);
     return `<tr class="${!k?'badrow':k.kl==='muon'?'warnrow':''}">
      ${co?`<td>${!k?`<input type="checkbox" data-cktiet="${t.id}" ${chonTiet.has(t.id)?'checked':''}>`:''}</td>`:''}
      <td><b>Tiết ${t.tiet}</b><div class="mini">${kh.bd}–${kh.kt}</div></td>
      <td><b>${ph.id}</b><div class="mini">${ph.lop} · ${ph.dt}</div></td>
      <td>${t.mon}${t.truc?' <span class="tg v">trực tuyến</span>':''}<div class="mini">${ns(t.gv).n}</div></td>
      <td><span class="st2 ${KQ[g.kq].c==='g'?'o':KQ[g.kq].c}">${KQ[g.kq].t}${g.kq==='muon'||g.kq==='som'?' '+g.lech+'′':''}</span>
        ${g.sk?`<div class="mini">${g.sk.gio} · ${PT[g.sk.pt]}${g.sk.ns&&g.sk.ns!==t.gv?` · <b class="nodata">${ns(g.sk.ns).n}</b>`:''}${g.sk.phong!==t.phong?` · <b class="nodata">${g.sk.phong}</b>`:''}</div>`:''}
        ${g.kq==='ngung'?`<div class="mini">${g.ngung.tb} · ${g.ngung.tu}–${g.ngung.den}</div>`:''}
        ${g.kq==='ngoai'?`<div class="mini">${g.vi==='truc'?'<b>tiết trực tuyến</b> — không có cửa lớp để đo'
          :g.vi==='khongdo'?'<b>địa điểm không đo được</b> — ngoài trời'
          :'phòng chưa có điểm chấm công'}</div>`:''}</td>
      <td>${k?`<span class="st2 ${KLT[k.kl].c}">${KLT[k.kl].t}${k.kl==='muon'?' '+k.phut+'′':''}</span>
        ${k.trongDungSai?`<div class="mini">muộn ${k.phut}′ — trong dung sai ${CFG.dungSai}′</div>`:''}
        ${k.lyDo?`<div class="mini">${k.lyDo}</div>`:''}`
       :'<span class="st2 r">— chưa có kết luận</span><div class="mini">đang ở hàng đợi</div>'}</td>
      <td>${k?nguonKL(k):'<span class="mini">—</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn xs" data-x="tiet-mo" data-i="${t.id}">Chi tiết</button>
        ${!k&&co?`<button class="btn xs g" data-x="tiet-chot" data-i="${t.id}">✓ Chốt</button>`:''}
        ${k&&coSua?`<button class="btn xs" data-x="tiet-sua" data-i="${t.id}">✎ Sửa</button>`:''}</td></tr>`}).join('')
    :`<tr><td colspan="${co?8:7}"><div class="empty">Không có tiết nào khớp bộ lọc</div></td></tr>`}
   </tbody></table>
   <div class="lgd">${Object.keys(KQ).map(k=>`<span class="chip"><span class="st2 ${KQ[k].c==='g'?'o':KQ[k].c}">${KQ[k].t}</span> ${KQ[k].mo}</span>`).join('')}
     <span class="chip"><b>Chưa có kết luận</b> ≠ <b>Không đánh giá</b> — cái trước là <b>việc tồn</b>, cái sau là <b>trạng thái bình thường</b></span>
     <span class="chip"><b>Ngoài phạm vi</b> có <b>ba nguyên nhân</b>: phòng <b>chưa lắp</b> <i>(tạm thời)</i> · địa điểm <b>không đo được</b> <i>(ngoài trời, vĩnh viễn)</i> · <b>tiết trực tuyến</b> <i>(không có cửa lớp)</i> — cùng một hệ quả, <b>khác hẳn nhau về nghĩa</b></span>
     <span class="chip"><b>Tiết ghép</b> <i>(một GV dạy hai lớp cùng khung giờ)</i> <b>chưa mô hình hóa ở bản này</b> — mỗi tiết ghép riêng, tiết kia rơi vào <b>Lệch phòng</b> và <b>vào hàng đợi để người xem</b>, KHÔNG tự sinh kết luận bất lợi</span></div></div>
  ${co?'':'<div class="ro">Vai hiện tại <b>chỉ xem và đối chiếu</b> — chốt và sửa kết luận là việc của <b>người phụ trách chấm công</b>: <b>TCNS</b> (toàn trường) hoặc <b>NVCC</b> (theo điểm trường).</div>'}`;
}

/* ---- panel một tiết: dòng thời gian tầng ① · trạng thái thiết bị · bản chiếu sổ đầu bài · lịch sử ---- */
function moTiet(id){
 const t=tietD(id),g=ghepTiet(t),k=ketLuan(t),kh=khungT(t.tiet),ph=phong(t.phong),d=diemCC(t.phong);
 const sk=SUKIEN.filter(s=>s.phong===t.phong&&s.ngay===NGAYT
   &&phutCua(s.gio)>=phutCua(kh.bd)-(d?d.truoc:15)&&phutCua(s.gio)<=phutCua(kh.bd)+(d?d.sau:20))
   .sort((a,b)=>phutCua(a.gio)-phutCua(b.gio));
 const dong=sk.length?`<table><thead><tr><th>Giờ</th><th>Người</th><th>Phương thức</th><th class="num">Độ tin cậy</th><th>Ảnh</th></tr></thead><tbody>
   ${sk.map(s=>`<tr class="${s.ns===null?'badrow':s.ns===t.gv?'okrow':'warnrow'}">
     <td><b>${s.gio}</b><div class="mini">${s.chieu==='vao'?'vào':'ra'}</div></td>
     <td>${s.ns===null?'<b class="nodata">Máy không nhận ra ai</b>':`<b>${ns(s.ns).n}</b>${s.ns!==t.gv?' <span class="tg r">không phải GV của tiết</span>':''}`}</td>
     <td><span class="tg c">${PT[s.pt]}</span></td>
     <td class="num">${s.tc!==null?s.tc.toFixed(2):'<span class="mini">—</span>'}</td>
     <td>${s.ns===null?'<span class="mini">không giữ ảnh — máy không nhận ra ai</span>':s.anh?`<button class="btn xs" data-x="sk-anh" data-i="${s.id}">👁 Mở ảnh</button>`:s.napTep?'<span class="tg b">nạp từ tệp</span>':'<span class="mini">không có</span>'}</td></tr>`).join('')}
   </tbody></table>
   <div class="mini" style="padding:8px 12px">🔒 Ảnh <b>chỉ mở trong panel</b>, không hiện ở lưới; <b>mỗi lượt mở ghi audit</b>.
     Ảnh giữ tới <b>${hanAnh(NGAYT)}</b> theo chính sách lưu trữ của <b>M10.11</b> <span class="mini">(lớp L58 · ${THOI_HAN_L58_NGAY} ngày sau ngày tải lên)</span>.</div>`
  :'<div class="empty">Không có sự kiện thiết bị nào trong cửa sổ nhận của tiết này</div>';
 modal(`Tiết ${t.tiet} · ${kh.bd}–${kh.kt} · ${ph.id} · ${t.mon} ${ph.lop} · ${ns(t.gv).n}`,
  `<div class="ro"><b>Tầng ① sự kiện thiết bị là BẤT BIẾN</b> — không ai sửa, kể cả Hiệu trưởng.
     Sai thì <b>sửa ở tầng ③</b> kèm lý do, và audit giữ cả giá trị trước lẫn sau.</div>
   <div class="card"><div class="f"><div class="k">② Kết quả ghép <span class="mini">gợi ý của máy</span></div>
     <div class="v"><span class="st2 ${KQ[g.kq].c==='g'?'o':KQ[g.kq].c}">${KQ[g.kq].t}${g.kq==='muon'||g.kq==='som'?' '+g.lech+'′':''}</span>
       <div class="mini" style="font-weight:400">${KQ[g.kq].mo}</div></div></div>
    <div class="f"><div class="k">③ Kết luận</div><div class="v">
      ${k?`<span class="st2 ${KLT[k.kl].c}">${KLT[k.kl].t}${k.kl==='muon'?' '+k.phut+'′':''}</span> ${nguonKL(k)}
        ${k.lyDo?`<div class="mini" style="font-weight:400">Lý do: ${k.lyDo}</div>`:''}
        ${k.luc?`<div class="mini">${k.nguoiTen} · ${k.luc}</div>`:''}`
       :'<span class="st2 r">— chưa có kết luận</span> <span class="mini">đang ở hàng đợi Việc cần xử lý</span>'}</div></div>
    <div class="f"><div class="k">Điểm chấm công</div><div class="v">
      ${t.truc?`<b class="nodata">Tiết dạy TRỰC TUYẾN</b> <span class="mini">không có cửa lớp để đo — <b>Ngoài phạm vi</b>, không đánh giá.
         ${d?`Phòng <b>${t.phong}</b> có thiết bị <b>${d.tb}</b>, nhưng <b>lớp không ở trong phòng</b> nên dấu vết ở cửa không nói gì về tiết này`:''}</span>`
       :d?`<b>${d.tb}</b> · ${d.pt.map(x=>PT[x]).join(' · ')} <span class="mini">cửa sổ nhận trước ${d.truoc}′ / sau ${d.sau}′ · áp dụng từ ${d.tu.split('-').reverse().join('/')}</span>`
       :phong(t.phong).khongLapTB?`<b class="nodata">Địa điểm không đo được</b> <span class="mini">${khongLap(phong(t.phong))} — <b>Không đánh giá vĩnh viễn</b>, không phải việc tồn · cờ trên địa điểm ở 🔗 M6.4</span>`
       :'<b class="nodata">Phòng chưa có điểm chấm công</b> <span class="mini">mọi tiết ở đây là Ngoài phạm vi — không đánh giá</span>'}</div></div>
    <div class="f"><div class="k">Trạng thái thiết bị</div><div class="v">
      ${g.kq==='ngung'?`<span class="st2 v">Ngừng ${g.ngung.tu}–${g.ngung.den}</span>
        <div class="mini" style="font-weight:400">${g.ngung.lyDo} · nguồn: <b>${g.ngung.nguon==='tu_phat_hien'?'máy tự phát hiện (mất heartbeat)':'người khai (bảo trì)'}</b></div>
        <div class="mini"><b>Không sinh hệ quả bất lợi cho người lao động</b> — đây là lỗi của trường</div>`
       :d?'<span class="st2 o">Đang chạy</span>':'<span class="mini">—</span>'}</div></div>
    <div class="f"><div class="k">🔗 Sổ đầu bài <span class="mini">bản chiếu chỉ đọc · M2.2</span></div><div class="v">
      ${t.sdb?`<span class="st2 o">Đã ghi ${sdbLucCua(t)}</span> <span style="font-weight:400">${t.bai}</span>
        <div class="mini" style="font-weight:400">Đây là căn cứ <b>tiết thực dạy</b> (§4) và là <b>đối chứng</b> cho ngoại lệ — <b>không</b> phải nguồn chấm công</div>`
       :`<span class="st2 r">Chưa ghi sổ</span> <div class="mini nodata">Có dấu vết thiết bị mà chưa có sổ đầu bài — xem cảnh báo bất thường ở Việc cần xử lý</div>`}
      ${dlink('M2.2','Mở sổ đầu bài',t.phong)}</div></div>
    <div class="f"><div class="k">Ghi danh nhận diện</div><div class="v">
      <span class="tg ${GHIDANH[t.gv]&&GHIDANH[t.gv].tt==='da'?'g':GHIDANH[t.gv]&&GHIDANH[t.gv].tt==='the'?'b':'r'}">${GHIDANH[t.gv]?GD[GHIDANH[t.gv].tt]:'—'}</span>
      <span class="mini">${GHIDANH[t.gv]&&GHIDANH[t.gv].ngay?GHIDANH[t.gv].ngay:''}</span></div></div>
   </div>
   <div class="ch" style="margin-top:13px">Dòng thời gian sự kiện thiết bị <span class="sp"></span><span class="mini">tầng ① — bất biến</span></div>
   ${dong}`,
  `<button class="btn" data-x="close">Đóng</button>
   ${!k&&R().chotTiet?`<button class="btn p" data-x="tiet-chot" data-i="${t.id}">✓ Chốt</button>`:''}
   ${k&&R().suaTiet?`<button class="btn" data-x="tiet-sua" data-i="${t.id}">✎ Sửa kết luận</button>`:''}
   ${R().chotTiet?`<button class="btn d" data-x="tiet-khong" data-i="${t.id}">⛔ Không lên lớp</button>`:''}`);
}

/* ---- hộp chốt / sửa kết luận ---- */
function moKL(id,sua){
 const t=tietD(id),k=ketLuan(t),g=ghepTiet(t);
 modal(`${sua?'Sửa kết luận':'Chốt kết luận'} — Tiết ${t.tiet} · ${t.phong} · ${ns(t.gv).n}`,
  `<div class="ro">② Máy ghép ra: <b>${KQ[g.kq].t}${g.kq==='muon'||g.kq==='som'?' '+g.lech+'′':''}</b>.
     ${sua?`Kết luận hiện tại: <b>${KLT[k.kl].t}${k.kl==='muon'?' '+k.phut+'′':''}</b>
       — nguồn <b>${k.nguon==='may'?'máy tự chốt':k.nguoiTen}</b>.`:''}</div>
   ${sua&&k.nguon==='may'?`<div class="warn">Bạn đang <b>sửa một dòng máy đã tự chốt</b>.
     Bắt buộc ghi lý do; audit lưu <b>giá trị trước và sau</b>.</div>`:''}
   <label class="lbl">Kết luận</label>
   <select class="fldi" id="klKq">
     <option value="dung" ${k&&k.kl==='dung'?'selected':''}>Đúng giờ</option>
     <option value="muon" ${k&&k.kl==='muon'?'selected':''}>Muộn N′</option>
     <option value="colydo" ${k&&k.kl==='colydo'?'selected':''}>Có lý do — đã xác minh, không tính muộn</option>
     <option value="khongdg" ${k&&k.kl==='khongdg'?'selected':''}>Không đánh giá</option>

/* ---- ⚙ ba khối của chấm công tiết dạy ---- */
function cauhinhTiet(){
 const rw=R().cfg;
 /* id bắt đầu bằng "dcc:" thì đi vào một DÒNG của bảng diem_cham_cong, không phải vào CFG */
 const inp2=(id,v,w)=>`<input class="fs" style="width:${w||60}px" data-${id.slice(0,4)==='dcc:'?'dcc':'cfg'}="${id.slice(0,4)==='dcc:'?id.slice(4):id}" value="${v}" ${rw?'':'disabled'}>`;
 /* MẪU SỐ chỉ gồm phòng ĐO ĐƯỢC. Sân thể dục và địa điểm ngoài trời sẽ không bao giờ lắp thiết bị
    (YK01-A3) — để chúng trong mẫu số thì N/M không bao giờ đạt đủ và nhãn dẫn xuất kẹt ở
    "Đang triển khai" vĩnh viễn, tức là chính con số dùng để theo dõi tiến độ lại thành vô nghĩa. */
 const theoDT={};
 phongDoDuoc().forEach(p=>{theoDT[p.dt]=theoDT[p.dt]||{co:0,tong:0};theoDT[p.dt].tong++;if(diemCC(p.id))theoDT[p.dt].co++});
 /* tử số cũng chỉ đếm phòng đo được — phòng đang sửa còn dòng điểm chấm công thì không kéo tỉ lệ lên */
 const tongCo=phongDoDuoc().filter(p=>diemCC(p.id)).length,tongPh=phongDoDuoc().length;
 const tamNg=PHONG.filter(p=>tamNgung(p)&&!p.khongLapTB);
 const nhan=tongCo===0?'Chỉ nguồn khai báo':tongCo>=tongPh?'Thiết bị toàn phần'
   :`Đang triển khai (${Math.round(tongCo/tongPh*100)}%)`;
 return `<div class="listw"><div class="ch">① Điểm chấm công — theo PHÒNG HỌC <span class="sp"></span>
    <span class="st2 ${tongCo>=tongPh?'o':'w'}">${nhan}</span>
    <span class="mini">danh sách phòng ${dlink('M6.4','🔗 M6.4')}</span></div>
   <div class="ro" style="margin:11px 12px 0"><b>Khai theo từng phòng, không phải một công tắc toàn trường.</b>
    Trường không lắp đủ phòng ngay — và trạng thái lắp dở kéo dài vài năm.
    Phòng <b>không có dòng</b> ⇒ mọi tiết ở đó là <b>Ngoài phạm vi</b>, không đánh giá, không sinh cảnh báo.
    <div class="mini" style="margin-top:4px">🛑 <b>"Chưa lắp" KHÁC "không đo được".</b> Sân thể dục và địa điểm ngoài trời
     <b>sẽ không bao giờ lắp thiết bị</b> <i>(anh Ninh chốt 16/9/2026 — YK01-A3)</i>: tiết ở đó <b>Không đánh giá VĨNH VIỄN</b>,
     đó là <b>trạng thái bình thường, không phải việc tồn</b>. Vì vậy chúng <b>bị loại khỏi MẪU SỐ</b> của N/M —
     để trong mẫu số thì trường <b>không bao giờ đạt "Thiết bị toàn phần"</b> và chính con số dùng để theo dõi tiến độ thành vô nghĩa.</div>
    <div class="mini" style="margin-top:4px"><b>Cửa sổ nhận</b> mặc định <b>trước 15′ / sau 20′</b> <i>(anh Ninh chốt 16/9/2026 — YK01-A1)</i>,

        ${dlink('M4.7','M4.7')}</div>`
      :c.loai==='khongtiet'?`<span class="mini">Không có tiết trong ngày — <b>không đánh giá đi muộn</b></span>`
      :`<b>Giờ hành chính ${c.gio}</b> <span class="tg c">nhân viên</span>`})()],

  nhanNgay(pid,k).length?['Nhãn',`${tagsNhan(pid,k)}

  bvCua(pid,k)?['Báo vắng',(()=>{const b=bvCua(pid,k);return `<b>${b.id}</b> · ${ns(b.nguoi_bao_id).n} · ${KENH[b.kenh]} · ${b.luc} ${dlink('M4.7','Xem ở M4.7',b.id)}

  x.dinhChinh?['Đính chính',`<span style="font-weight:400"><b>${x.dinhChinh.truoc}</b> → <b>${x.dinhChinh.sau}</b> · ${x.dinhChinh.boi} · ${x.dinhChinh.luc}

  x.nguoiKL?['Người kết luận',`<span style="font-weight:400">${x.nguoiKL} · ${x.ngayKL}</span>`]:null,
 ].filter(Boolean);
 const banner=x.tt==='thieu'
  ? `<div class="danger"><b>Thiếu chấm công KHÔNG phải là Vắng không phép.</b>
     Hệ thống chỉ đang <b>không có dữ liệu</b> cho ngày này. Bốn nguyên nhân có thể, hệ quả khác hẳn nhau:
     <b>quên bấm</b> · <b>máy hỏng</b> · <b>đang đi công tác chưa khai</b> · <b>thực sự tự ý nghỉ</b>.
     <br>Ngày này <b>chưa trừ công</b>. Chỉ khi chuyển sang <b>Vắng không phép</b> mới ảnh hưởng dữ liệu xuất lương ở M5.3.</div>

 modal(`Ngày công — ${p.n} · ${k.split('-').reverse().join('/')}`,
  banner+`<div class="card">${rows.map(([a,b])=>`<div class="f"><div class="k">${a}</div><div class="v">${b}</div></div>`).join('')}</div>`,

   ${x.tt==='thieu'&&duoc?`<button class="btn p" data-x="xac-minh" data-i="${pid}|${k}">Xác minh</button>`:''}
   ${x.tt==='khong'&&laToi?`<button class="btn" data-x="khieu-nai" data-i="${pid}|${k}">Khiếu nại</button>`:''}
   ${(x.tt==='du'||x.tt==='muon')&&R().sua&&!DACHOT?`<button class="btn" data-x="sua-cc" data-i="${pid}|${k}">✎ Sửa</button>`:''}
   ${x.tt==='phep'&&!x.duKien&&R().dinhChinh?(DACHOT?`<button class="btn" data-x="dc-sauchot" data-i="${pid}|${k}">Đề nghị sửa sau chốt</button>`
     :`<button class="btn" data-x="dc-mo" data-i="${pid}|${k}">✎ Đính chính Vắng có phép</button>`):''}`);

 modal(`${kieu==='ct'?'Khai báo đi công tác':'Nhập chấm công'} — ${p.n} · ${ngayCham.split('-').reverse().join('/')}`,
  `<div class="ro">Bạn đang <b>nhập hộ</b> ${p.n}. Bản ghi sẽ mang nguồn <b>Nhập tay</b> kèm
    <b>tên bạn</b> — không lẫn với dữ liệu tự bấm hay ký sổ đầu bài.</div>
   ${deLen?`<div class="warn">Ngày này <b>đã có dữ liệu</b>: <b>${cu.vao} – ${cu.ra||'…'}</b>
     từ nguồn <b>${NGUON[cu.nguon]?NGUON[cu.nguon].t:'?'}</b>.
     Ghi đè thì <b>bắt buộc ghi lý do</b>, và audit lưu <b>giá trị trước và sau</b>.</div>`:''}
   ${kieu==='ct'?`<label class="lbl">Phạm vi trong ngày</label>
     <select class="fldi" id="ntBuoi"><option value="ca">Cả ngày</option>
       <option value="S">Chỉ buổi sáng — chiều đi làm</option>
       <option value="C">Chỉ buổi chiều — sáng đi làm</option></select>
     <div class="mini" style="margin-top:4px">Nửa ngày tính <b>0,5 công công tác + 0,5 công đi làm</b>.</div>`

      ${p.gv?'<span class="mini">— giáo viên đo theo tiết, không theo giờ hành chính</span>':''}</div>
    <div class="row2">
     <div><label class="lbl">Giờ vào</label><input class="fldi" id="ntVao" value="${cu.vao||CFG.gioHC.vao}"></div>
     <div><label class="lbl">Giờ ra</label><input class="fldi" id="ntRa" value="${cu.ra||CFG.gioHC.ra}"></div></div>
    <div class="mini" style="margin-top:5px">Vào sau chuẩn trên quá <b>${CFG.nguongMuon} phút</b> thì tự chuyển <b>Đi muộn</b>.</div>`}
   <label class="lbl">${kieu==='ct'?'Nội dung công tác':'Lý do nhập tay'}
     ${kieu==='ct'||deLen?'<span style="color:var(--red)">*</span>':'<span class="mini">— không bắt buộc khi ngày đang trống</span>'}</label>
   <textarea class="fldi" id="ntLy" rows="2" placeholder="${kieu==='ct'?'Đi đâu, việc gì, ai cử':'Vì sao nhập hộ — quên bấm, máy lỗi, nhập bù…'}"></textarea>`,
  `<button class="btn" data-x="close">Hủy</button>
   <button class="btn p" data-x="ok-nhap" data-i="${id}|${kieu}">Ghi</button>`);

/* ================= SỰ KIỆN ================= */
document.addEventListener('click',e=>{
 if(e.target.matches('input,select,textarea'))return;
 const t=e.target.closest('[data-r],[data-tab],[data-x],[data-gn],[data-ngay],[data-o],[data-ckng],[data-ngayt]');
 if(!t)return;
 const x=t.dataset.x;
 if(t.dataset.r){role=t.dataset.r;fTo='';
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role));
  const r=R();$('#ava').textContent=r.ava;
  const s=$('#hdt');
  if(r.pv==='branch'){s.value=r.dt;s.disabled=true;$('#dtlock').textContent='🔒 khoá theo phạm vi'}
  else{s.disabled=false;s.value='Toàn trường';$('#dtlock').textContent=''}
  render();return}
 if(t.dataset.tab&&!x){tab=t.dataset.tab;render();return}
 /* GY18-A ca A6 — đổi ngày mẫu = đổi bộ giờ đang hiệu lực */
 if(t.dataset.ngayt){fNgayT=t.dataset.ngayt;NGAYT=fNgayT;syncKhungT();chonTiet.clear();render();
  toast(`Ngày <b>${NGAYT.split('-').reverse().join('/')}</b> — khung giờ <b>${tenBoNgay()}</b>.
   Tầng ② ghép theo <b>khung giờ CỦA NGÀY</b>, nên kết quả ghép <b>không đổi</b> khi đổi mùa`);return}
 if(t.dataset.gn&&!x){gocNhin=t.dataset.gn;chonNg.clear();render();return}
 if(x==='close'){closeModal();return}
 if(x==='dl'){closeModal();toast(`↗ Mở <b>${t.dataset.m}</b>${t.dataset.c?` · <code>${t.dataset.c}</code>`:''} · có nút quay lại M4.9`);return}
 if(t.dataset.ngay&&!x){moNgay(R().id,t.dataset.ngay);return}
 if(t.dataset.o&&!x){const[a,b]=t.dataset.o.split('|');moNgay(+a,b);return}

 /* --- chấm công theo ngày (nhập hộ) --- */
 if(x==='ng-tr'){const d=new Date(ngayCham);d.setDate(d.getDate()-1);
   if(d.getMonth()+1!==KY.n){toast('Kỳ đang xem là tháng '+KY.n+' — đổi kỳ để xem tháng khác');return}
   ngayCham=`${KY.y}-${p2(KY.n)}-${p2(d.getDate())}`;chonNg.clear();render();return}
 if(x==='ng-sau'){const d=new Date(ngayCham);d.setDate(d.getDate()+1);
   if(d>HOMNAY){toast('⛔ Không chấm công cho <b>ngày chưa diễn ra</b>');return}
   ngayCham=`${KY.y}-${p2(KY.n)}-${p2(d.getDate())}`;chonNg.clear();render();return}
 if(x==='ve-homnay'){ngayCham=ky(KY.n,HOMNAY.getDate());chonNg.clear();render();return}
 if(t.dataset.ckng!==undefined&&!x){const id=+t.dataset.ckng;
   chonNg.has(id)?chonNg.delete(id):chonNg.add(id);render();return}
 if(x==='o-ngay'){moNgay(+t.dataset.i,ngayCham);return}
 if(x==='nhanh-du'){moNhapTay(+t.dataset.i,'du');return}
 if(x==='nhanh-ct'){moNhapTay(+t.dataset.i,'ct');return}
 if(x==='ok-nhap'){const[a,kieu]=t.dataset.i.split('|'),id=+a,p=ns(id);

     <div class="ro" style="margin-top:11px">Mọi lượt xuất <b>ghi audit</b> kèm mục đích, người xuất, thời điểm.</div>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-xuat">⬇ Xuất</button>`);return}
 if(x==='ok-xuat'){if(!$('#mdx').value){toast('⛔ Bắt buộc chọn mục đích sử dụng trước khi xuất');return}
   const sel=$('#mdBan'), canKyBC=sel&&sel.selectedOptions[0].dataset.ky==='1';
   if(canKyBC&&R().cdKy!=='HT'){toast('⛔ <b>Báo cáo gửi cơ quan quản lý chỉ Hiệu trưởng ký</b> — nh3.3.3 §8. Chốt công tháng thì TCNS ký được, nhưng văn bản gửi ra ngoài nhà trường thì không');return}
   if(canKyBC){closeModal();
     modal('Ký báo cáo chấm công gửi cơ quan quản lý',
      `<div class="danger">🔒 <b>Ký số bắt buộc.</b> Báo cáo gửi ra ngoài nhà trường phải có chữ ký của
        <b>Hiệu trưởng</b> — nh3.3.3 §8.</div>
       <div class="f"><div class="k">Người ký</div><div class="v">${ns(HT_ID).n} — Hiệu trưởng</div></div>
       <div class="f"><div class="k">Chứng thư</div><div class="v">CTS-HT-2026 ${dlink('M4.11','M4.11')}</div></div>`,
      `<button class="btn" data-x="close">Hủy</button>
       <button class="btn g" data-x="ok-ky-bc">✍ Ký và xuất</button>`);return}
   closeModal();toast('⬇ Đã xuất · ghi audit kèm mục đích, người xuất và thời điểm');return}
 if(x==='ok-ky-bc'){closeModal();
   toast('✍ Đã ký và xuất <b>báo cáo gửi cơ quan quản lý</b> · chữ ký Hiệu trưởng · đồng bộ chứng thư sang M4.11 · ghi audit');return}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fTo'){fTo=el.value;render();return}
 if(el.id==='fPhongT'){fPhongT=el.value;chonTiet.clear();render();return}
 if(el.id==='fGvT'){fGvT=el.value;chonTiet.clear();render();return}
 if(el.id==='fKqT'){fKqT=el.value;chonTiet.clear();render();return}
 if(el.id==='fNgoaiLe'){chiNgoaiLe=el.checked;chonTiet.clear();render();return}
 if(el.id==='fNgayT'){const[a,b,c]=el.value.split('/').map(Number);const d=new Date(c,b-1,a);
   if(isNaN(d)){toast('⛔ Ngày phải theo dạng <b>DD/MM/YYYY</b>');render();return}
   fNgayT=`${c}-${p2(b)}-${p2(a)}`;chonTiet.clear();render();return}
 if(el.id==='ckAllTiet'){const ds=dsTiet().filter(z=>!ketLuan(z));
   el.checked?ds.forEach(z=>chonTiet.add(z.id)):chonTiet.clear();render();return}
 if(el.dataset.cktiet!==undefined){const id=el.dataset.cktiet;
   el.checked?chonTiet.add(id):chonTiet.delete(id);render();return}
 if(el.id==='fNgayCham'){const[a,b,c]=el.value.split('/').map(Number);
   const d=new Date(c,b-1,a);
   if(isNaN(d)||b!==KY.n||c!==KY.y){toast('⛔ Ngày phải nằm trong kỳ tháng '+KY.n+'/'+KY.y);render();return}
   if(d>HOMNAY){toast('⛔ Không chấm công cho <b>ngày chưa diễn ra</b>');render();return}
   ngayCham=`${KY.y}-${p2(KY.n)}-${p2(a)}`;chonNg.clear();render();return}
 if(el.id==='ckAllNg'){const ds=dsNguoi().filter(p=>!fTo||p.to===fTo)
     .filter(p=>suaDuoc(CC[p.id][ngayCham]||{tt:'thieu'}));
   el.checked?ds.forEach(p=>chonNg.add(p.id)):chonNg.clear();render();return}
 if(el.dataset.ckng!==undefined){const id=+el.dataset.ckng;
   el.checked?chonNg.add(id):chonNg.delete(id);render();return}
 if(el.dataset.vao!==undefined||el.dataset.ra!==undefined){
   const id=+(el.dataset.vao!==undefined?el.dataset.vao:el.dataset.ra);
   const la=el.dataset.vao!==undefined;
   const v=el.value.trim();
   if(v&&!/^\d{1,2}:\d{2}$/.test(v)){toast('⛔ Giờ phải theo dạng <b>HH:MM</b>');render();return}
   const c=CC[id][ngayCham]||{tt:'thieu'};
   const truoc=c.vao?`${c.vao} – ${c.ra||'…'}`:TT[c.tt].t;
   if(la)c.vao=v;else c.ra=v;
   if(c.vao&&c.ra){
     const r=tinhMuon(ns(id),ngayCham,c.vao);
     if(r.muon>CFG.nguongMuon){c.tt='muon';c.muonPhut=r.muon;c.chuan=r.c.mo} else {c.tt='du';delete c.muonPhut;delete c.chuan}
   } else if(c.vao){
     /* Đang diễn ra chỉ đúng với HÔM NAY — nh3.3.3 §3b.1. Ngày đã qua mà thiếu giờ ra
        thì bản ghi CHƯA trọn vẹn, phải ở lại hàng đợi chặn chốt tháng, không được coi là đủ công. */
     c.tt=(ngayCham===ky(KY.n,HOMNAY.getDate()))?'dang':'thieu';
     c.thieuGioRa=c.tt==='thieu'?1:0;
   } else {c.tt='thieu';delete c.thieuGioRa;}
   c.nguon='nhaptay';c.nguoiNhap=toi().n;
   CC[id][ngayCham]=c;render();
   toast(`Đã ghi <b>${ns(id).n}</b> · ${ngayCham.split('-').reverse().join('/')} → <b>${TT[c.tt].t}</b>
     · nguồn <b>Nhập tay</b>, người nhập <b>${toi().n}</b> · audit lưu giá trị trước <b>${truoc}</b>`);return}
 /* --- cửa sổ nhận của MỘT PHÒNG (bảng diem_cham_cong) — đi cùng chuỗi duyệt TCNS → HT --- */
 if(el.dataset.dcc!==undefined){
  const [ph,truong]=el.dataset.dcc.split(':'), d=diemCC(ph);
  const cu=d[truong], moi=+el.value;
  if(String(cu)===String(moi))return;
  const ten=`Cửa sổ nhận ${truong==='truoc'?'TRƯỚC':'SAU'} giờ vào tiết — phòng ${ph}`;
  const kiem=()=>{
   if(isNaN(moi)||moi<0)return `<b>${ten}</b> phải là số phút không âm`;
   const tong=truong==='truoc'?moi+d.sau:d.truoc+moi;
   if(tong>=GAP_TIET)
    return `Cửa sổ nhận của <b>${ph}</b> đang là <b>trước ${truong==='truoc'?moi:d.truoc}′ + sau ${truong==='sau'?moi:d.sau}′ = ${tong}′</b>,
      bằng hoặc rộng hơn <b>khoảng cách ${GAP_TIET}′ giữa hai tiết liền nhau</b>.
      Một lượt quẹt sẽ gán được vào <b>hai tiết</b> và máy không còn cách nào chọn đúng — hãy để tổng <b>nhỏ hơn ${GAP_TIET}′</b>`;
   return null};
  const loi=kiem();
  if(loi){toast('⛔ '+loi);render();return}
  CFG_CHO.push({id:'CF'+(++cfgSeq),mo:`<b>${ten}</b>: ${cu}′ → <b>${moi}′</b>`,ai:toi().n,ngay:d2s(HOMNAY),
    fn:()=>{diemCC(ph)[truong]=moi},kiem});
  render();toast('✎ Đã ghi vào đề xuất — <b>chưa có hiệu lực</b>, chờ Hiệu trưởng duyệt');return}
 if(el.dataset.cfg){
  const path=el.dataset.cfg;
  const cu=path.split('.').reduce((o,k)=>o[k],CFG);
  const moi=el.type==='checkbox'?(el.checked?1:0):(isNaN(+el.value)?el.value:+el.value);
  if(String(cu)===String(moi))return;
  const ten={cheDo:'Chế độ chấm công',nguongMuon:'Ngưỡng đi muộn (phút)',chamCongBGH:'Chấm công cho Ban Giám hiệu',
   soTuan:'Số tuần thực dạy',tranDayThem:'Trần dạy thêm giờ (tiết/năm học)',hsDayThem:'Hệ số dạy thêm giờ (%)',
   tranOTThang:'Trần làm thêm giờ mỗi tháng',tranOTNam:'Trần làm thêm giờ mỗi năm',
   'gioHC.vao':'Giờ vào hành chính','gioHC.ra':'Giờ ra hành chính',
   'gioHC.nghiTruaTu':'Bắt đầu nghỉ trưa','gioHC.nghiTruaDen':'Kết thúc nghỉ trưa',
   'hsOT.thuong':'Hệ số làm thêm ngày thường (%)','hsOT.tuan':'Hệ số làm thêm ngày nghỉ hằng tuần (%)',
   'hsOT.le':'Hệ số làm thêm ngày lễ, Tết (%)',
   'dinhMuc.TH':'Định mức TH (tiết/tuần)','dinhMuc.THCS':'Định mức THCS (tiết/tuần)','dinhMuc.THPT':'Định mức THPT (tiết/tuần)',
   dungSai:'Ngưỡng dung sai muộn của một tiết (phút)',tuChotMuon:'Tự chốt ca Muộn',
   heartbeat:'Ngưỡng mất heartbeat (phút)',haiPhongPhut:'Ngưỡng cảnh báo một người ở hai phòng (phút)',
   vangChuaDon:'Số ngày làm việc chờ đơn sau báo vắng'}[path]||path;
  /* cửa chặn: hệ số OT không được thấp hơn mức tối thiểu của BLLĐ Đ.98 */
  const sanBLLD={'hsOT.thuong':150,'hsOT.tuan':200,'hsOT.le':300};
  const kiem=()=>{
   if(sanBLLD[path]&&moi<sanBLLD[path])
    return `<b>${ten}</b> không được thấp hơn <b>${sanBLLD[path]}%</b> — Bộ luật Lao động 2019 Điều 98 quy định đây là mức TỐI THIỂU. Trả cao hơn được, thấp hơn thì không`;
   if(path==='tranDayThem'&&moi>200)
    return `Trần dạy thêm giờ không được khai cao hơn <b>200 tiết/năm học</b> — TT 21/2025/TT-BGDĐT`;
   if(path==='tranOTThang'&&moi>40)
    return `Trần làm thêm giờ mỗi tháng không được vượt <b>40 giờ</b> — BLLĐ Điều 107`;
   if(path==='tranOTNam'&&moi>200)
    return `Trần làm thêm giờ mỗi năm không được vượt <b>200 giờ</b> — BLLĐ Điều 107 (một số ngành nghề đặc thù mới tới 300 giờ)`;
   if((path==='nguongMuon'||path.startsWith('dinhMuc')||path==='soTuan'
      ||path==='dungSai'||path==='heartbeat'||path==='haiPhongPhut'||path==='vangChuaDon')&&(isNaN(moi)||moi<1||!Number.isInteger(moi)))
    return `<b>${ten}</b> phải là số nguyên dương`;
   return null};
  const loi=kiem();
  if(loi){toast('⛔ '+loi);render();return}
  CFG_CHO.push({id:'CF'+(++cfgSeq),mo:`<b>${ten}</b>: ${cu} → <b>${moi}</b>`,ai:toi().n,ngay:d2s(HOMNAY),path,cu,moi,
    fn:()=>{const ks=path.split('.');const last=ks.pop();ks.reduce((o,k)=>o[k],CFG)[last]=moi},kiem});
  render();toast('✎ Đã ghi vào đề xuất — <b>chưa có hiệu lực</b>');return}
});

function render(){
 sidebar();tabs();
 const n=viecCount();
 $('#ndot').textContent=n||'';$('#ndot').style.display=n?'grid':'none';
 $('#topact').innerHTML=R().tabs.includes('bang')&&!R().khongXuat?'<button class="btn" data-x="xuat">⬇ Xuất</button>':'';
 $('#content').innerHTML=scopeBar()+(tab==='toi'?toiTab():tab==='bang'?bangTab():tab==='tiet'?tietTab()
   :tab==='viec'?viecTab():cauhinhTab());
}
syncKhungT();
render();
</script>
