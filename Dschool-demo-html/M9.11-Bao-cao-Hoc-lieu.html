  const DSB = {
    dang_cau: DANG.map(x => ({ id: x.id, ten: x.ten, loc: c => c.g === x.id })),
    muc_do: MUC_DO.map(x => ({ id: x.id, ten: x.ten, loc: c => c.d === x.id })),
    mon_hoc: Object.keys(MON).map(m => ({ id: m, ten: tenMon(m), loc: c => c.m === m })),
    khoi: [...new Set(CAU_C.map(c => c.k))].sort((a, b) => a - b).map(kh => ({ id: 'k' + kh, ten: 'Khối ' + kh, loc: c => c.k === kh })),
    to_chuyen_mon: PV_TO.map(t => ({ id: t, ten: TO[t].ten, loc: c => toCuaMon(c.m) === t }))
  };
  const bangB = KB.K1({
    id: 'b', tieuDe: 'B · Phân bố câu đã duyệt theo ' + (CT.CHIEU[chieuB] || chieuB).toLowerCase(),
    ma: 'HL.01', chip: 'TON', chieu: chieuB, donVi: 'câu', moTaKy: PV.moTaChot(),
    tenCotDau: CT.CHIEU[chieuB], nguon: 'm12.5.ngan_hang_cau_hoi',
    dong: (DSB[chieuB] || DSB.dang_cau).filter(d => CAU_C.some(c => trongPV(c) && d.loc(c))),
    link: () => LK.cau(''),
    oSo: d => CT.doc('HL.01', PV.thamSo({ phanTo: chieuB, loc: d.loc }))
  });

  /* ---------- bảng C · nhóm câu · đề · ma trận ---------- */
  const dongC = oMK.filter(d => NHOM_C.some(n => n.m === d.mon && n.k === d.khoi && trongPV(n))
    || DE_C.some(x => x.m === d.mon && x.k === d.khoi && trongPV(x))
    || MT_C.some(x => x.m === d.mon && x.k === d.khoi && trongPV(x)));
  const bangC = KB.K2({
    id: 'c', tieuDe: 'C · Nhóm câu hỏi · đề bài · ma trận đề', ma: 'HL.02', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Môn · khối', gomNhom: true, dong: dongC,
    cot: [
      { khoa: 'nhom', ten: 'Nhóm đã duyệt', kieu: 'so', nguon: 'm12.6.ngan_hang_nhom_cau', link: d => LK.nhom('') },
      { khoa: 'nhomCho', ten: 'Nhóm chờ duyệt', kieu: 'so', nguon: 'm12.6.ngan_hang_nhom_cau', link: () => LK.duyetNhom() },
      { khoa: 'cauCon', ten: 'Câu con trong nhóm', kieu: 'so', nguon: 'm12.6.ngan_hang_nhom_cau', chuThich: '🛑 Không cộng vào bảng A — câu con thuộc nhóm, không phải câu lẻ' },
      { khoa: 'de', ten: 'Đề bài', kieu: 'so', nguon: 'm12.2.ngan_hang_de', link: d => LK.de('') },
      { khoa: 'deDaDung', ten: 'Trong đó đã sử dụng', kieu: 'so', nguon: 'm12.2.ngan_hang_de', link: d => LK.de('') },
      { khoa: 'maTran', ten: 'Ma trận đề', kieu: 'so', nguon: 'm12.3.ma_tran', link: d => LK.mt('') }
    ],
    o: (d, c) => CT.doc('HL.02', PV.thamSo({ phanTo: null, loc: locMK(d) }), c.khoa)
  });

  /* ---------- bảng D · NGUỒN TẠO ĐỀ ---------- */
  const OD = { thucong: 'deThucong', mt: 'deMt', nhanban: 'deNhanban', word: 'deWord', kho: 'deKho' };
  const bangD = KB.K1({
    id: 'd', tieuDe: 'D · Đề bài theo nguồn tạo', ma: 'HL.02', chip: 'TON', chieu: 'nguon_tao_de',
    donVi: 'đề', moTaKy: PV.moTaChot(), tenCotDau: 'Nguồn tạo', nguon: 'm12.2.ngan_hang_de',
    dong: NGUON_DE.map(([id, ten, mo]) => ({ id, ten, phu: mo })),
    link: () => LK.de(''),
    oSo: d => CT.doc('HL.02', PV.thamSo({ phanTo: null }), OD[d.id])
  });

  /* ---------- khối cảnh báo sửa — hệ quả của «câu không có phiên bản» ---------- */
  const cbDung = CT.doc('HL.03', PV.thamSo({ phanTo: null }), 'deDaDung');
  const bangE = KB.bang({
    id: 'e', tieuDe: 'E · Câu đã sửa tại chỗ mà đề còn tham chiếu', ma: 'HL.03', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Chỉ tiêu', tong: false, nguon: 'm12.5.ngan_hang_cau_hoi',
    dong: [
      { id: 'cau', ten: 'Câu mang cảnh báo sửa', o: undefined },
      { id: 'de', ten: 'Đề đang mang cảnh báo', o: 'deLienQuan' },
      { id: 'dung', ten: '…trong đó đề ĐÃ SỬ DỤNG', bac: true, o: 'deDaDung' },
      { id: 'ban', ten: 'Câu có bản sửa chờ duyệt', o: 'banCho' }
    ],
    cot: [{ khoa: 'v', ten: 'Số lượng', kieu: 'so', nguon: 'm12.5.ngan_hang_cau_hoi', canhBao: (x, d) => d.id === 'dung' && x.giaTri > 0 }],
    link: d => d.id === 'cau' || d.id === 'ban' ? LK.cau('') : LK.de(''),
    o: d => CT.doc('HL.03', PV.thamSo({ phanTo: null }), d.o)
  });
  let canhE = '';
  if (cbDung.giaTri > 0) canhE = '<div class="canh w">⚠ <b>' + cbDung.giaTri + ' đề đã sử dụng</b> đang chứa câu bị sửa sau lúc câu vào đề. '
    + 'Câu hỏi <b>không có phiên bản</b>, nên bản in trên giấy là nội dung <i>trước</i> lần sửa. '
    + nutDL('M12.2', 'tab=ngan_hang_de&loc=canh_bao_sua', 'Mở danh sách đề này tại M12.2') + '</div>';

  return h
    + PV.chonChieu('HL.01', ['dang_cau', 'muc_do', 'mon_hoc', 'khoi', 'to_chuyen_mon', 'lop'])
    + dnote('Cột <b>Chờ duyệt</b> đứng cạnh cột <b>Đã duyệt</b> nhưng <b>không cộng vào nó</b>: '
      + 'một câu chờ duyệt là một câu chưa ai đọc, đưa vào tổng là nói rằng tổ đã kiểm định một nội dung mà thật ra chưa. '
      + 'Cùng lý do cho <b>Câu con trong nhóm</b> ở bảng C — chúng thuộc nhóm, đếm sang bảng A là đếm hai lần.')
    + bangA + bangB + bangC + bangD + bangE + canhE;
}

/* ══════════════ TAB 2 · GIAO BÀI & KẾT QUẢ LÀM BÀI ══════════════════════
   Khuôn K9 — bảng tiến độ: dòng là một LƯỢT GIAO, cột là các mốc của nó.
   Toàn bộ tab là số PHÁT SINH, lọc theo NGÀY GIAO. */
function veTab2() {
  const t = PV.thamSoPS();
  const ds = LUOT_C.filter(l => trongPV(l));
  let h = PV.khoang() + daiPV('lượt giao', ds.length, LUOT_C.length);

  /* ---------- cụm TUẦN NÀY — lọc theo NGÀY GIAO ---------- */
  const dauTuan = themNgay(HOMNAY, -(thuSo(HOMNAY) === 1 ? 6 : thuSo(HOMNAY) - 2));
  const tuanNay = ds.filter(l => l.t !== 'huy' && ngay(l.gi) >= dauTuan && ngay(l.gi) <= HOMNAY);
  const gaanNhat = ds.filter(l => l.t !== 'huy').map(l => ngay(l.gi)).sort().pop();
  h += '<div class="bg"><div class="bgh"><b>Tuần này — lượt giao mới</b>' + KB.chip('PS')
    + '<span class="bgky">' + k2s(dauTuan) + ' → ' + k2s(HOMNAY) + '</span></div>'
    + (tuanNay.length
      ? '<div class="tbx"><table class="bgt"><tbody>' + tuanNay.map(l => '<tr><td class="bgid">' + esc(l.i)
        + '</td><td><b>' + esc(l.x) + '</b><span class="dphu">' + esc(tenDoiTuong(l)) + ' · ' + esc(CO_CHE[l.cc]) + '</span></td>'
        + '<td class="num">' + l.np + '/' + l.tg + '</td></tr>').join('') + '</tbody></table></div>'
      : '<div class="empty">Không có lượt nào được giao trong tuần này. Lượt gần nhất giao ngày <b>'
        + k2s(gaanNhat) + '</b> — bảng dưới đây đang xem cả khoảng.</div>')
    + '</div>';

  /* ---------- bảng chính ---------- */
  const dongL = ds.filter(l => l.t !== 'huy' && trongKhoang(l.gi, t))
    /* xếp theo MÔN trước rồi mới theo ngày giao: `gomNhom` in tiêu đề nhóm mỗi lần
       giá trị nhóm đổi, nên xếp thuần theo ngày làm một môn hiện ra hai lần. */
    .sort((a, b) => (tenMon(a.m) < tenMon(b.m) ? -1 : tenMon(a.m) > tenMon(b.m) ? 1 : (a.gi < b.gi ? 1 : -1)))
    .map(l => ({
      id: l.i, ten: l.x, nhom: tenMon(l.m),
      phu: 'giao ' + k2s(ngay(l.gi)) + ' · ' + tenDoiTuong(l) + ' · ' + CO_CHE[l.cc] + ' · đề ' + l.de.join(' · ')
        + (l.kh ? ' · ' + l.kh + ' không làm' : '') + (l.dl ? ' · ' + l.dl + ' đang làm' : ''),
      loc: x => x.i === l.i
    }));
  const cotL = [
    { khoa: 'hsGiao', ma: 'HL.04', ten: 'HS được giao', kieu: 'so', nguon: 'm12.7.luot_giao' },
    { khoa: 'daNop', ma: 'HL.04', ten: 'Đã nộp', kieu: 'so', nguon: 'm12.7.luot_giao' },
    { khoa: 'tiLeNop', ma: 'HL.04', ten: 'Tỉ lệ nộp', kieu: 'tile', nguon: 'm12.7.luot_giao', khongCong: true, canhBao: x => x.giaTri != null && x.giaTri < 60 },
    { khoa: 'nopMuon', ma: 'HL.04', ten: 'Nộp sau hạn', kieu: 'so', nguon: 'm12.7.luot_giao' },
    { khoa: 'daCham', ma: 'HL.05', ten: 'Đã chấm', kieu: 'so', nguon: 'm12.7.luot_giao' },
    { khoa: 'choCham', ma: 'HL.05', ten: 'Chờ chấm', kieu: 'so', nguon: 'm12.7.luot_giao', canhBao: x => x.giaTri > 0 },
    { khoa: 'dtb', ma: 'HL.05', ten: 'ĐTB lượt', donVi: 'thang 10', kieu: 'ngay', nguon: 'm12.7.luot_giao', khongCong: true }
  ];
  const bang = KB.K9({
    id: 'l', tieuDe: 'Lượt giao bài trong khoảng', ma: 'HL.04', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Lượt giao', gomNhom: true, dong: dongL,
    cot: cotL, link: d => LK.luot(d.id),
    chuoiTrong: 'Không có lượt giao nào trong khoảng đang xem.',
    o: (d, c) => CT.doc(c.ma, PV.thamSoPS({ phanTo: null, loc: d.loc }), c.khoa),
    tongRieng: c => (c.khoa === 'tiLeNop' ? CT.doc('HL.04', PV.thamSoPS({ phanTo: null }), 'tiLeNop')
      : c.khoa === 'dtb' ? CT.doc('HL.05', PV.thamSoPS({ phanTo: null }), 'dtb') : null)
  });

  /* ---------- lượt đã hủy — KHÔNG vào bảng trên, nhưng phải NÓI ---------- */
  const huy = ds.filter(l => l.t === 'huy' && trongKhoang(l.gi, t));
  let khoiHuy = '';
  if (huy.length) {
    khoiHuy = '<div class="canh w">🚫 <b>' + huy.length + ' lượt đã hủy — không tính vào bảng trên</b> ('
      + huy.map(l => l.i + ' · ' + esc(l.x) + ' · <b>' + l.np + '</b> bài đã nộp').join(' · ') + '). '
      + 'Bài đã nộp của lượt hủy <b>giữ nguyên</b> nhưng <b>không vào hàng đợi chấm</b> — chúng xếp ở nhóm <b>Đã nộp</b>, '
      + 'không phải <b>Chờ chấm</b>. ' + nutDL('M12.7', 'tab=luot_giao&tt=huy', 'Mở lượt đã hủy') + '</div>';
  }

  return h + dnote('Dòng là một <b>lượt giao</b>, không phải một lớp: cùng một đề giao hai lần là hai lượt, '
    + 'và hai lượt ấy có thể khác cơ chế, khác hạn, khác kết quả. '
    + 'Cột <b>Chờ chấm</b> đọc theo <b>điểm cuối của từng câu</b> — câu tự luận đã chấm tay thì hết chờ, dù máy không tự chấm được nó.')
    + bang + khoiHuy;
}

/* ══════════════ TAB 3 · PHÂN TÍCH CÂU HỎI ══════════════════════════════
   🛑 BẪY LỚN NHẤT CỦA CẢ MẢNG NẰM Ở ĐÂY. Câu hỏi KHÔNG có phiên bản: sửa là
   sửa tại chỗ. Nên một câu bị sửa giữa kỳ phải TÁCH THÀNH NHIỀU DÒNG, mỗi
   khúc một mốc sửa, và mỗi khúc tính `p` · `d` riêng. Gộp lại là cộng hai câu
   khác nhau vào một con số — con số ấy không nói về câu nào cả. */
function veTab3() {
  const t = PV.thamSoPS();
  const trongKy = kh => (kh.luot || []).some(id => { const l = luotById(id); return l && trongKhoang(l.gi, t) });
  const ds = PT_C.filter(x => (x.mon ? trongPV({ m: x.mon }) : true) && x.khuc.some(trongKy));
  let h = PV.khoang();

  /* dòng: mỗi KHÚC của mỗi câu là một dòng. Câu không bị sửa có đúng một khúc. */
  const dong = [];
  ds.forEach(x => {
    const co = x.khuc.filter(trongKy);
    const nhieu = co.length > 1;
    co.forEach((kh, i) => dong.push({
      id: x.cau + (nhieu ? '#' + i : ''), ten: x.cau + (nhieu ? (kh.truoc ? '  ·  trước lần sửa' : '  ·  sau lần sửa') : ''),
      bac: nhieu && i > 0, nhom: (x.mon ? tenMon(x.mon) + ' ' + x.khoi : 'Câu con của nhóm'),
      phu: (nhieu ? '⚠ câu đã sửa ngày ' + k2s(ngay(kh.moc)) + ' — ' + esc(ngan2((x.sua[0] || {}).ly, 70)) + ' · ' : '')
        /* câu con của một nhóm không mang dạng · mức độ riêng (chúng thuộc NHÓM),
           nên bỏ hẳn cụm ấy thay vì in ra «con · null» — một ô rỗng đội lốt một giá trị. */
        + (x.dang && x.dang !== 'con' ? tenDang(x.dang) + ' · ' + tenMD(x.md) + ' · ' : '')
        + 'đề ' + x.de.join(' · ') + ' · lượt ' + kh.luot.join(' · '),
      pt: x, kh
    }));
  });

  /* gom liền khối theo nhóm — `gomNhom` in tiêu đề mỗi lần giá trị nhóm đổi */
  dong.sort((a, b) => a.nhom < b.nhom ? -1 : a.nhom > b.nhom ? 1 : (a.id < b.id ? -1 : 1));

  const cot = [
    { khoa: 'soLuot', ten: 'Số lượt làm', kieu: 'so', nguon: 'm12.7.luot_giao' },
    { khoa: null, ten: '% đúng (p)', kieu: 'tile', nguon: 'm12.7.luot_giao', khongCong: true, canhBao: x => x.giaTri != null && (x.giaTri < 20 || x.giaTri > 95) },
    { khoa: 'd', ten: 'Độ phân cách (d)', kieu: 'ngay', nguon: 'm12.7.luot_giao', khongCong: true, canhBao: x => x.giaTri != null && x.giaTri < 0.2 },
    { khoa: 'pa', ten: 'Phương án gây nhiễu hiệu quả', kieu: 'chu', nguon: 'm12.5.ngan_hang_cau_hoi', khongCong: true },
    { khoa: 'ra', ten: 'Đề nghị rà lại', kieu: 'chu', nguon: 'm12.5.ngan_hang_cau_hoi', khongCong: true }
  ];

  const bang = KB.K2({
    id: 'p', tieuDe: 'Độ khó và độ phân cách của từng câu', ma: 'HL.06', chip: 'DAN_XUAT',
    moTaKy: PV.moTaKhoang() + ' · ngưỡng hiện d: ' + ST.nguongN + ' lượt',
    tenCotDau: 'Câu hỏi', gomNhom: true, tong: false, dong, cot,
    chuoiTrong: 'Chưa có lượt làm nào đã chấm xong trong khoảng đang xem.',
    link: d => LK.cau(d.pt.cau.split('.')[0]),
    o: (d, c) => {
      const tham = PV.thamSoPS({ phanTo: null, khuc: d.kh });
      if (c.khoa === 'soLuot') return CT.doc('HL.06', tham, 'soLuot');
      if (c.khoa === 'd') return CT.doc('HL.07', tham);
      if (c.khoa === 'pa') return oPhuongAn(d);
      if (c.khoa === 'ra') return oRaLai(d);
      return CT.doc('HL.06', tham);
    }
  });

  return h + dnote('Một câu bị sửa giữa kỳ <b>tách thành nhiều dòng</b>, mỗi khúc một mốc sửa. '
    + 'Đây không phải chuyện trình bày: câu hỏi <b>không có phiên bản</b> nên lượt làm trước và sau lần sửa là lượt làm '
    + 'trên <b>hai câu khác nhau</b>. Cột <b>Đề nghị rà lại</b> là gợi ý của máy, <b>không phải kết luận</b>, '
    + 'và <b>không gắn với giáo viên nào</b> — độ khó là tính chất của câu và của lớp đã làm nó.')
    + bang;
}
const ngan2 = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s };

/* ô «Phương án gây nhiễu hiệu quả» — CHỈ có với câu trắc nghiệm nhiều phương án.
   Dạng khác để trống: một ô ghi 0 ở đây là nói rằng câu tự luận có phương án nhiễu kém. */
function oPhuongAn(d) {
  const nen = {
    ma: 'HL.06', o: 'phuongAn', ten: 'Phương án gây nhiễu hiệu quả', donVi: '', loaiSo: 'DAN_XUAT',
    nguon: ['M12.5', 'M12.7'], chieuHopLe: [], banGhiGoc: [],
    quyTacDem: {
      tinhVao: ['Phương án SAI có ít nhất một em chọn — một phương án nhiễu không ai chọn là một phương án không làm việc gì, câu thành ra chỉ có ba lựa chọn thật.'],
      khongTinh: ['Phương án đúng.', 'Câu không phải trắc nghiệm nhiều phương án: ô để TRỐNG, không ghi 0.']
    }
  };
  if (d.pt.dang !== 'nlc' || !d.kh.pa) return Object.assign({}, nen, { giaTri: null });
  /* 🛑 MỘT NGƯỠNG cho cả ba cột dẫn xuất — `d`, phương án nhiễu, đề nghị rà lại.
     «0 trên 3 phương án nhiễu có người chọn» tính trên MỘT lượt làm là một câu
     đúng về mặt số học mà vô nghĩa về mặt đo lường, và người đọc sẽ hiểu là câu
     có ba phương án chết. Dưới ngưỡng thì ô ghi «—», đúng như cột `d`. */
  if (d.kh.n < ST.nguongN) return Object.assign({}, nen, {
    giaTri: null, canhBao: { ma: 'DUOI_NGUONG', chu: 'mới ' + d.kh.n + '/' + ST.nguongN + ' lượt' }
  });
  const sai = d.kh.pa.filter(x => !x.dung);
  const lam = sai.filter(x => x.n > 0);
  return Object.assign({}, nen, {
    giaTri: lam.length + '/' + sai.length,
    banGhiGoc: d.kh.pa.map(x => ({
      id: String.fromCharCode(65 + x.i), ten: ngan2(x.ten, 60) + (x.dung ? '   ✔ đáp án đúng' : ''),
      so: x.n + ' lượt' + (d.kh.n ? ' · ' + (Math.round(x.n * 1000 / d.kh.n) / 10) + '%' : '')
    })),
    ghiChu: lam.length < sai.length
      ? '<b>' + (sai.length - lam.length) + ' phương án nhiễu không ai chọn</b> — câu này trên thực tế chỉ có '
      + (lam.length + 1) + ' lựa chọn.'
      : 'Mọi phương án nhiễu đều có người chọn.'
  });
}

/* ô «Đề nghị rà lại» — GỢI Ý, không phải kết luận, và không gắn với ai. */
function oRaLai(d) {
  const kh = d.kh, ly = [];
  if (kh.n < ST.nguongN) return {
    ma: 'HL.06', o: 'deNghi', ten: 'Đề nghị rà lại', donVi: '', loaiSo: 'DAN_XUAT',
    nguon: ['M12.5'], chieuHopLe: [], giaTri: null, banGhiGoc: [],
    canhBao: { ma: 'DUOI_NGUONG', chu: 'mới ' + kh.n + '/' + ST.nguongN + ' lượt' },
    quyTacDem: {
      tinhVao: ['Dưới ngưỡng lượt làm thì KHÔNG nêu dấu hiệu nào.'],
      khongTinh: ['🛑 Một câu có 1–2 em làm thì tỉ lệ đúng chỉ nhận vài giá trị rời rạc (0% · 50% · 100%); gọi đó là «quá dễ» hay «quá khó» là rút kết luận từ tiếng ồn.']
    }
  };
  if (kh.p != null && kh.p >= 95) ly.push('gần như cả lớp làm đúng (p = ' + kh.p + '%) — câu có thể quá dễ so với chỗ nó đang đứng trong đề');
  if (kh.p != null && kh.p <= 20) ly.push('rất ít em làm đúng (p = ' + kh.p + '%) — xem lại đề có rõ không, đáp án có đúng không');
  if (kh.d != null && kh.d < 0) ly.push('độ phân cách ÂM (d = ' + kh.d + ') — nhóm điểm cao làm sai nhiều hơn nhóm điểm thấp, đây là dấu hiệu điển hình của đáp án nhập sai');
  else if (kh.d != null && kh.d < 0.2) ly.push('độ phân cách thấp (d = ' + kh.d + ') — câu gần như không phân biệt được em nắm bài và em không nắm bài');
  if (kh.pa) {
    const im = kh.pa.filter(x => !x.dung && x.n === 0).length;
    if (im) ly.push(im + ' phương án nhiễu không ai chọn');
  }
  return {
    ma: 'HL.06', o: 'deNghi', ten: 'Đề nghị rà lại', donVi: '', loaiSo: 'DAN_XUAT',
    nguon: ['M12.5'], chieuHopLe: [], giaTri: ly.length ? '⚠ ' + ly.length + ' dấu hiệu' : '—',
    banGhiGoc: ly.map((x, i) => ({ id: String(i + 1), ten: x, so: '' })),
    quyTacDem: {
      tinhVao: [
        'Máy nêu dấu hiệu khi: p ≥ 95% hoặc p ≤ 20%, hoặc d < 0,2, hoặc có phương án nhiễu không ai chọn.',
        '🛑 Đây là GỢI Ý MỞ LẠI XEM, không phải kết luận câu sai. Quyết định là của tổ chuyên môn.'
      ],
      khongTinh: [
        '🛑 Không gắn với giáo viên soạn câu, và không có cột xếp hạng người soạn. Một câu khó có thể vì lớp chưa học tới phần đó chứ không vì người soạn.',
        'Câu dưới ngưỡng lượt làm: không đủ dữ liệu để nói gì về độ phân cách.'
      ]
    },
    ghiChu: ly.length ? null : 'Không có dấu hiệu nào trong bốn dấu hiệu máy dò.'
  };
}

const soDongChiTiet = () => {
  const k = PV.st.chotNgay > HOMNAY ? HOMNAY : PV.st.chotNgay;
  if (ST.tab === 'ngan_hang') return CAU_C.filter(c => trongPV(c) && truoc(c.tao, k)).length;
  if (ST.tab === 'giao_bai') return LUOT_C.filter(l => trongPV(l) && l.t !== 'huy' && trongKhoang(l.gi, PV.thamSoPS())).reduce((a, l) => a + l.np, 0);
  if (ST.tab === 'phan_tich_cau') return PT_C.reduce((a, x) => a + x.khuc.length, 0);
  return CAU_C.filter(c => trongPV(c) && (coTai(c, k) || ngungTai(c, k))).length + NHOM_C.filter(n => trongPV(n) && n.bl).length;
};

KB.gan(); PV.gan(); XU.gan();

document.addEventListener('click', e => {
  const r = e.target.closest('[data-r]');
  if (r) { role = r.getAttribute('data-r'); moTab(tabMacDinh()); ve(); return }
  const t = e.target.closest('[data-t]');
  if (t) { moTab(t.getAttribute('data-t')); ve(); return }
  if (e.target.closest('#btnNote')) { ST.note = !ST.note; ve(); return }
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const m = dl.getAttribute('data-dl'), q = dl.getAttribute('data-dlq') || '';
    toast('↗ Deep-link sang <b>' + esc(m) + '</b> — <code>?' + esc(q) + '</code><br>'
      + '<i>Demo một tệp: không mở được menu khác, nhưng đường dẫn là đường dẫn thật.</i>');
  }
});
$('#hdt').addEventListener('change', e => { ST.to = e.target.value; ve() });

function toast(h) {
  const t = $('#toast'); t.innerHTML = h; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 4200);
}

/* ── công cụ nghiệm thu: đo MẬT ĐỘ CHỮ GIẢI THÍCH (`nh9` §9.1, ngưỡng ≤ 20%) ── */
function doMatDoChu() {
  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(n => { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = { tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
/* công cụ nghiệm thu: đếm ô số và ô bấm được */
function doOSo() {
  const goc = $('#content');
  const bam = goc.querySelectorAll('button.oso').length;
  const tro = goc.querySelectorAll('td.num .oro').length;
  console.log('Ô số —', ST.tab, { bamDuoc: bam, oTrong: tro });
  return { bamDuoc: bam, oTrong: tro };
}
window.doMatDoChu = doMatDoChu; window.doOSo = doOSo;

ST.tab = tabMacDinh();
moTab(ST.tab);
ve();
