<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10.10 Dịch vụ trên App PH-HS — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.main{flex:1;padding:12px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-bottom:2px}
h1{font-size:17px;font-weight:700}
.nowrite{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:999px;padding:2px 11px;font-size:11.5px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 9px;font-size:11.5px}
.btn.lk{opacity:.6;cursor:help;background:#f8fafc;border-color:var(--line);color:var(--ink3)}

.scope{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--red);
 border-radius:9px;padding:7px 12px;font-size:12px;color:var(--ink2);margin:8px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:#fff;min-width:250px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}

.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grow{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}
.hdrow,.hrow{display:grid;gap:11px;padding:8px 13px;align-items:center;
 grid-template-columns:2.3fr .95fr 1.5fr 1.05fr 105px}
.hdrow{background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);font-size:13px}
.hrow:hover{background:#fafbfc}
.hrow .kh b{font-weight:600;display:block}
.hrow .kh span{font-size:11px;color:var(--ink3)}
.mc{font-weight:700;color:var(--brand);font-size:11px;background:var(--brand-soft);border:1px solid #bfdbfe;border-radius:5px;padding:1px 6px;white-space:nowrap}
.mc.off{color:var(--ink3);background:var(--bg);border-color:var(--line)}
.gt{font-size:12.5px;font-weight:600;color:var(--ink)}
.gt.mac{color:var(--ink3);font-weight:400;font-style:italic}
.cn{font-size:11.5px;color:var(--ink2)}
.cn .m{color:var(--ink3);font-size:10.5px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line)}
.rolnk.rd{color:#991b1b;background:var(--red-soft);border-color:#fecaca}
.rolnk.am{color:#92400e;background:var(--amber-soft);border-color:#fde68a}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.sech{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.blk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12.5px}
.blk .ic{flex:0 0 16px;color:var(--ink3)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.din{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:10px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:7px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.noacc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px;text-align:center}
.noacc h3{font-size:17px;margin-bottom:9px}
.noacc p{color:var(--ink2);font-size:13px;max-width:560px;margin:0 auto 9px}

/* ---------- M10.10 ---------- */
.tagcfg{background:var(--brand-soft);border:1px solid #bfdbfe;color:var(--brand);border-radius:999px;padding:2px 11px;font-size:11.5px;font-weight:700}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;margin-top:10px;align-items:start}
@media (max-width:1180px){.lay{grid-template-columns:1fr}}
.mtx{overflow-x:auto}
.mhd,.mrow{display:grid;grid-template-columns:150px repeat(6,minmax(84px,1fr)) 52px 120px;gap:6px;align-items:center;padding:8px 12px;min-width:860px}
.mhd{background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
.mhd .fx{color:#b6c0cc}
.mrow{border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:none}
.mrow:hover{background:#fafbfc}
.mrow.sel{background:#f5f8ff;box-shadow:inset 3px 0 0 var(--brand)}
.c{text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.dtn b{display:block;font-size:13px}
.dtn span{font-size:11px;color:var(--ink3)}
.lock{font-size:10.5px;color:var(--ink3);background:var(--bg);border:1px dashed var(--line2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.sw{width:38px;height:21px;border-radius:999px;background:#cbd5e1;position:relative;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--green)}
.sw.on i{left:19px}
.sw.khoa{opacity:.45;cursor:not-allowed}
.cd{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.cd.rd{color:var(--red);font-weight:700}
.cd.am{color:var(--amber)}
.cd.mu{color:var(--ink3)}
.so{font-size:15px}
.leg{font-size:11.5px;color:var(--ink3);margin:7px 2px 0}
.sech .ct{font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px}
.m{font-size:11px;color:var(--ink3)}
.nw{white-space:nowrap}
.btn.dg{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:sticky;top:68px}
.pvh{font-weight:700;font-size:13px;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:11.5px;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pvn{font-size:12px;color:var(--ink2);margin:6px 0 4px;line-height:1.55}
.phone{width:390px;max-width:100%;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:8px}
.ph-nhan{font-size:11px;color:var(--ink2);padding:6px 10px;background:#f8fafc;border-bottom:1px solid var(--line)}
.ph-tab{font-size:12px;font-weight:700;padding:6px 10px;color:var(--brand)}
.ph-sub{display:grid;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ph-sub span{font:10.5px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:center;padding:5px 1px 6px;color:var(--ink2);line-height:1.35;border-bottom:2px solid transparent}
.ph-sub span i{display:block;font-style:normal;font-size:14px}
.ph-sub span.on{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}
.ph-foot{font-size:10.5px;color:var(--ink3);padding:4px 10px}
.mf-json{margin-top:8px;font-size:12px}
.mf-json summary{cursor:pointer;color:var(--ink2);font-weight:600}
.mf-json pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:9px 11px;font-size:11px;overflow-x:auto;margin-top:6px}

.ba{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;gap:6px;margin-bottom:10px}
.ba .phone{width:100%}
.ba .mui{text-align:center;color:var(--ink3);font-size:18px}
.warn ul{margin:5px 0 6px 18px}
.dl{color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline}
.ds{margin-top:7px}
.ds summary{cursor:pointer;font-weight:600}
.ds table{margin-top:6px;background:#fff;border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rq{color:var(--red)}
.ck{display:flex;gap:7px;align-items:center;font-size:12.5px;margin-top:6px}
.ol{margin:8px 0 10px 20px;font-size:12.5px;line-height:1.6}
.p{font-size:12.5px;color:var(--ink2);line-height:1.6}
.modal{width:880px}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="HT">HT</button>

  <span class="note">Bật/tắt <b>ba sub-tab dịch vụ</b> của <b>🏫 Ở trường</b> trên App PH-HS — theo từng điểm trường</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"></select>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot">3</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">DH</div>
</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Dịch vụ trên App PH-HS</h1><span class="tagcfg">⚙ Cấu hình · manifest năng lực</span>
      <div class="spacer"></div>
      <button class="btn sm" data-x="ghiChu">💡 Ghi chú thiết kế</button>
      <button class="btn sm" data-x="xuat" id="bXuat">⬇ Xuất</button></div>
    <div id="content"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
/* ==========================================================================
   M10.10 — Dịch vụ trên App PH-HS
   Một tab = một Feature: m10.10.dich_vu_app
   Cấu hình này là MỘT MỤC của manifest năng lực (Q2): máy chủ trường trả
   `dich_vu_app` theo điểm trường, App vẽ sub-bar 🏫 Ở trường theo đó.
   ========================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---------- Vai — mảng năng lực, kiểm bằng .includes() ---------- */
const ROLES = {
  FULL:   { ten: '🔓 Đủ quyền (demo)', q: ['X', 'S', 'XD'], nguoi: 'Người thử demo',  ava: 'DM' },
  HT:     { ten: 'HT',       q: ['X', 'S', 'XD'], nguoi: 'Đặng Quốc Hưng',  ava: 'DH' },
  IT:     { ten: 'IT_Admin', q: ['X', 'S', 'XD'], nguoi: 'Trần Minh Khoa',  ava: 'TK' },
  PHT_CM: { ten: 'PHT_CM',   q: ['X'],            nguoi: 'Lê Thu Hà',       ava: 'LH' },
  KT:     { ten: 'KT',       q: ['X'],            nguoi: 'Phạm Thị Yến',    ava: 'PY' },
  GVBM:   { ten: 'GVBM',     q: [],               nguoi: 'Vũ Đức Anh',      ava: 'VA' }
};
const co = n => ROLES[ST.r].q.includes(n);

/* ---------- Điểm trường ---------- */
const DT = [
  { id: 'A', ten: 'Điểm trường A — cơ sở chính', ngan: 'Điểm trường A', hs: 612 },
  { id: 'B', ten: 'Điểm trường B', ngan: 'Điểm trường B', hs: 405 },
  { id: 'C', ten: 'Điểm trường C', ngan: 'Điểm trường C', hs: 287 }
];
const dtCua = id => DT.find(d => d.id === id);

/* ---------- Sáu sub-tab của 🏫 Ở trường — ĐÚNG thứ tự T6_SUB của App ----------
   dv:null ⇒ quyền cơ bản của phụ huynh, KHÔNG có cờ trong manifest.        */
const SUB = [
  { sub: 'xin-nghi',   ic: '✍',  ten: 'Xin nghỉ',   dv: null },
  { sub: 'ban-tru',    ic: '🍱', ten: 'Bán trú',    dv: 'ban_tru' },
  { sub: 'ngoai-khoa', ic: '🎨', ten: 'Ngoại khóa', dv: 'ngoai_khoa' },
  { sub: 'gop-y',      ic: '📮', ten: 'Góp ý',      dv: null },
  { sub: 'suc-khoe',   ic: '🩺', ten: 'Sức khỏe',   dv: null },
  { sub: 'ky-tuc-xa',  ic: '🛏', ten: 'Ký túc xá',  dv: 'ky_tuc_xa' }
];
const DV = {
  ban_tru: { ic: '🍱', ten: 'Bán trú', menu: 'M6.1', menuTen: 'Bán trú',
    donVi: 'em đang đăng ký bán trú tháng 9/2026',
    mat: ['<b>Báo nghỉ ăn</b> (C04) — buổi nghỉ không báo <b>vẫn tính tiền</b>',
          'Suất ăn của con · thực đơn · ảnh khay ăn (C03 · C05)',
          'Lối tắt ⚡ <i>Báo nghỉ ăn</i> ở Trang chủ'],
    /* D06 chuyển sang 💰 Tài chính (chốt 14/9/2026) — không chịu cờ này */
    giu: 'Báo cáo minh bạch bán trú (D06) — ở 💰 Tài chính' },
  ngoai_khoa: { ic: '🎨', ten: 'Ngoại khóa', menu: 'M6.2', menuTen: 'Học ngoại khóa',
    donVi: 'em đang học khóa ngoại khóa',
    mat: ['Đăng ký khóa mới (C06)',
          'Chuyên cần · nhận xét · xếp loại khóa đang học (C11)'] },
  ky_tuc_xa: { ic: '🛏', ten: 'Ký túc xá', menu: 'M6.10', menuTen: 'Ký túc xá',
    donVi: 'em đang ở ký túc xá',
    mat: ['Đơn xin ra ngoài / về nhà (C13) — gia đình phải xin qua điện thoại',
          'Điểm danh buổi tối của con (C14)',
          '<b>Thông báo con vắng mặt buổi tối</b> (E10)',
          'Số trực đêm của khu'] }
};

/* ---------- Cấu hình hiện hành (nguồn sự thật của menu này) ---------- */
let CFG = {
  A: { ban_tru: true, ngoai_khoa: true, ky_tuc_xa: true },
  B: { ban_tru: true, ngoai_khoa: true, ky_tuc_xa: true },
  C: { ban_tru: true, ngoai_khoa: true, ky_tuc_xa: false }
};

/* ---------- Bản chiếu 🔗 từ menu nghiệp vụ — CHỈ ĐỌC ----------
   n: số em đang dùng · to: menu nghiệp vụ có tổ chức ở điểm trường này không */
const SD = {
  A: { ban_tru: { n: 318, to: '1 bếp · 12 lớp bán trú' }, ngoai_khoa: { n: 146, to: '9 khóa đang mở' }, ky_tuc_xa: { n: 138, to: '2 khu · 64 phòng' } },
  B: { ban_tru: { n: 12,  to: '1 bếp — hợp đồng nấu kết thúc 30/09/2026' }, ngoai_khoa: { n: 58, to: '4 khóa đang mở' }, ky_tuc_xa: { n: 42, to: '1 khu · 18 phòng' } },
  C: { ban_tru: { n: 164, to: '1 bếp · 7 lớp bán trú' }, ngoai_khoa: { n: 0, to: '' }, ky_tuc_xa: { n: 0, to: '' } }
};
/* 12 em còn đăng ký bán trú ở Điểm trường B — luồng cảnh báo khi tắt */
const DS_B_BT = [
  ['Nguyễn Gia Bảo', '6B1', 'Cả tháng'], ['Trần Khánh Linh', '6B1', 'Cả tháng'],
  ['Lê Minh Quân', '6B2', 'Chọn ngày T2·T4·T6'], ['Phạm Ngọc Anh', '6B2', 'Cả tháng'],
  ['Hoàng Đức Thịnh', '7B1', 'Cả tháng'], ['Vũ Thảo Nguyên', '7B1', 'Chọn ngày T3·T5'],
  ['Đỗ Hải Đăng', '7B2', 'Cả tháng'], ['Bùi Phương Thảo', '8B1', 'Cả tháng'],
  ['Ngô Quang Huy', '8B1', 'Cả tháng'], ['Đặng Mai Chi', '8B2', 'Chọn ngày T2·T4·T6'],
  ['Phan Tuấn Kiệt', '9B1', 'Cả tháng'], ['Trịnh Bảo Ngọc', '9B1', 'Cả tháng']
];

/* ---------- Lịch sử bật/tắt — không xóa, chỉ thêm ---------- */
let HIS = [
  { t: '02/09/2026 16:24', ai: 'Trần Minh Khoa', cd: 'IT_Admin', dt: 'B', dv: 'ngoai_khoa', den: true,
    ly: 'Bật lại — tắt nhầm dòng lúc 16:20', canh: 0 },
  { t: '02/09/2026 16:20', ai: 'Trần Minh Khoa', cd: 'IT_Admin', dt: 'B', dv: 'ngoai_khoa', den: false,
    ly: 'Định tắt ký túc xá Điểm trường C, bấm nhầm dòng', canh: 58 },
  { t: '21/08/2026 15:40', ai: 'Đặng Quốc Hưng', cd: 'HT', dt: 'C', dv: 'ky_tuc_xa', den: false,
    ly: 'Điểm trường C không có khu nội trú', canh: 0 },
  { t: '20/08/2026 09:12', ai: 'Hệ thống', cd: 'nâng cấp v2.4', dt: '*', dv: '*', den: true,
    ly: 'Khởi tạo khi nâng cấp máy chủ: bật cả ba dịch vụ ở mọi điểm trường — giữ nguyên App như trước nâng cấp', canh: 0 }
];

let ST = { r: 'FULL', dt: 'ALL', xem: 'A', haiCon: false, locDv: 'ALL', dem: 0 };
let CHO = null;   /* thay đổi đang mở trong hộp xác nhận */

/* ---------- Dẫn xuất ---------- */
const subCua = (dt, cfg) => SUB.filter(s => !s.dv || (cfg || CFG[dt])[s.dv]);
function raSoat() {
  const tatConDung = [], batRong = [];
  DT.forEach(d => Object.keys(DV).forEach(k => {
    const s = SD[d.id][k];
    if (!CFG[d.id][k] && s.n > 0) tatConDung.push({ dt: d.id, dv: k, n: s.n });
    if (CFG[d.id][k] && !s.to) batRong.push({ dt: d.id, dv: k });
  }));
  return { tatConDung, batRong };
}
const bayGio = () => { const d = new Date(2026, 8, 14, 10, 30 + ST.dem); ST.dem++;
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };

/* ---------- Sub-bar xem trước — mô phỏng .subbar của App (khung 390px) ---------- */
function veSub(dt, cfg, nhan) {
  const bo = subCua(dt, cfg);
  const w = Math.round(390 / bo.length * 10) / 10;
  return `<div class="phone">
    ${nhan ? `<div class="ph-nhan">${nhan}</div>` : ''}
    <div class="ph-tab">🏫 Ở trường</div>
    <div class="ph-sub" style="grid-template-columns:repeat(${bo.length},1fr)">
      ${bo.map((s, i) => `<span class="${i === 0 ? 'on' : ''}"><i>${s.ic}</i>${s.ten}</span>`).join('')}
    </div>
    <div class="ph-foot">${bo.length} ô · mỗi ô ≈ ${String(w).replace('.', ',')}px</div>
  </div>`;
}

/* ---------- Render ---------- */
function render() {
  $$('.rb').forEach(b => b.classList.toggle('on', b.dataset.r === ST.r));
  $('#ava').textContent = ROLES[ST.r].ava;
  $('#hdt').innerHTML = '<option value="ALL">Tất cả điểm trường</option>' +
    DT.map(d => `<option value="${d.id}">${d.ten}</option>`).join('');
  $('#hdt').value = ST.dt;
  $('#bXuat').hidden = !co('XD');
  if (!co('X')) {
    $('#content').innerHTML = `<div class="noacc"><h3>🔒 ${ROLES[ST.r].ten} không có quyền vào menu này</h3>
      <p>Cấu hình sub-tab dịch vụ trên App PH-HS do <b>Hiệu trưởng</b> và <b>quản trị hệ thống</b> quyết.</p>
      <p>Muốn biết điểm trường của mình đang hiện gì trên App, hỏi HT hoặc IT_Admin.</p></div>`;
    return;
  }
  const rs = raSoat();
  const dsDT = ST.dt === 'ALL' ? DT : DT.filter(d => d.id === ST.dt);
  if (ST.dt !== 'ALL') ST.xem = ST.dt;

  const scope = `<div class="scope">
    <span>Đang xem <b>${ST.dt === 'ALL' ? 'toàn trường · 3 điểm trường' : dtCua(ST.dt).ten}</b> · cấu hình <b>theo điểm trường</b>, <b>không chịu bộ chọn Năm học</b> · lưu là <b>có hiệu lực ngay</b></span>
    <span class="sp"></span>
    ${rs.tatConDung.length ? `<button class="rolnk rd" data-x="rsTat">⚠ ${rs.tatConDung.length} dịch vụ đã tắt mà còn học sinh dùng</button>` : ''}
    ${rs.batRong.length ? `<button class="rolnk am" data-x="rsRong">💡 ${rs.batRong.length} dịch vụ bật mà chưa có gì để hiện</button>` : ''}
    ${!rs.tatConDung.length && !rs.batRong.length ? '<span class="st2 o">✓ Cấu hình khớp menu nghiệp vụ</span>' : ''}
  </div>`;

  const hd = `<div class="mhd"><div>Điểm trường</div>${SUB.map(s => `<div class="c ${s.dv ? '' : 'fx'}">${s.ic} ${s.ten}</div>`).join('')}<div class="c">Số ô</div><div>Cập nhật lần cuối</div></div>`;
  const rows = dsDT.map(d => {
    const lc = HIS.find(h => h.dt === d.id) || HIS[HIS.length - 1];
    return `<div class="mrow ${ST.xem === d.id ? 'sel' : ''}" data-x="xem" data-dt="${d.id}">
      <div class="dtn"><b>${d.ngan}</b><span>${d.hs} học sinh</span></div>
      ${SUB.map(s => {
        if (!s.dv) return `<div class="c fx"><span class="lock" title="Quyền cơ bản của phụ huynh — không tắt được">🔒 Luôn bật</span></div>`;
        const on = CFG[d.id][s.dv], sd = SD[d.id][s.dv];
        let sub;
        if (sd.n > 0) sub = `<span class="cd ${on ? '' : 'rd'}">🔗 ${sd.n} em ${on ? '' : '· ⚠'}</span>`;
        else if (sd.to) sub = `<span class="cd">🔗 0 em</span>`;
        else sub = `<span class="cd ${on ? 'am' : 'mu'}">${on ? '💡 chưa tổ chức' : 'không tổ chức'}</span>`;
        return `<div class="c"><button class="sw ${on ? 'on' : ''} ${co('S') ? '' : 'khoa'}" data-x="tg" data-dt="${d.id}" data-dv="${s.dv}" title="${co('S') ? (on ? 'Tắt' : 'Bật') + ' ' + s.ten + ' — ' + d.ngan : 'Chỉ HT · IT_Admin bật/tắt được'}"><i></i></button>${sub}</div>`;
      }).join('')}
      <div class="c"><b class="so">${subCua(d.id).length}</b></div>
      <div class="cn">${lc.t.slice(0, 10)}<div class="m">${lc.ai}</div></div>
    </div>`;
  }).join('');

  const khoa = co('S') ? '' : `<div class="ro">🔒 <b>${ROLES[ST.r].ten}</b> chỉ xem. Bật/tắt: <b>HT · IT_Admin</b>.</div>`;

  /* Xem trước */
  const xem = ST.xem;
  const d1 = DT.find(d => d.id === 'A'), d2 = DT.find(d => d.id === 'C');
  const an = SUB.filter(s => s.dv && !CFG[xem][s.dv]);
  const preview = `<div class="pv">
    <div class="pvh">👁 Xem trước — phụ huynh thấy gì</div>
    <div class="chips">${DT.map(d => `<button class="chip ${!ST.haiCon && ST.xem === d.id ? 'on' : ''}" data-x="xem" data-dt="${d.id}">${d.ngan.replace('Điểm trường ', 'ĐT ')}</button>`).join('')}
      <button class="chip ${ST.haiCon ? 'on' : ''}" data-x="haiCon">👪 Hai con, hai điểm trường</button></div>
    ${ST.haiCon
      ? veSub('A', null, `Con 1 · <b>Nguyễn An</b> · 9A2 · ${d1.ngan}`) + veSub('C', null, `Con 2 · <b>Nguyễn Bình</b> · 6C1 · ${d2.ngan}`) +
        `<div class="pvn">Cùng một tài khoản, <b>đổi con thì sub-bar đổi theo</b> — App xét điểm trường của <b>từng con</b>.</div>`
      : veSub(xem, null, `Phụ huynh học sinh <b>${dtCua(xem).ngan}</b>`) +
        `<div class="pvn">${an.length ? 'Không hiện: ' + an.map(s => s.ic + ' ' + s.ten).join(' · ') + '.' : 'Hiện đủ sáu sub-tab.'}
          Con <b>không đăng ký</b> một dịch vụ đang bật thì sub-tab <b>vẫn hiện</b> và nói vậy.</div>`}
    <details class="mf-json"><summary>{ } Manifest máy chủ trả App</summary><pre>${manifest()}</pre></details>
  </div>`;

  /* Lịch sử */
  const his = HIS.filter(h => (ST.dt === 'ALL' || h.dt === ST.dt || h.dt === '*') && (ST.locDv === 'ALL' || h.dv === ST.locDv || h.dv === '*'));
  const lichSu = `<div class="sech">🕘 Lịch sử bật / tắt <span class="ct">${his.length} lượt · không xóa được</span></div>
    <div class="bar"><select class="fs" id="locDv"><option value="ALL">Mọi dịch vụ</option>${Object.keys(DV).map(k => `<option value="${k}" ${ST.locDv === k ? 'selected' : ''}>${DV[k].ic} ${DV[k].ten}</option>`).join('')}</select>
      ${ST.dt !== 'ALL' ? `<span class="cn">Lọc theo <b>${dtCua(ST.dt).ngan}</b> ở header</span>` : ''}</div>
    <div class="listw"><table><thead><tr><th>Thời điểm</th><th>Người</th><th>Điểm trường</th><th>Dịch vụ</th><th>Thay đổi</th><th>Lý do</th><th>Cảnh báo lúc lưu</th></tr></thead><tbody>
    ${his.map(h => `<tr><td class="nw">${h.t}</td><td>${h.ai}<div class="m">${h.cd}</div></td>
      <td>${h.dt === '*' ? 'Mọi điểm trường' : dtCua(h.dt).ngan}</td>
      <td>${h.dv === '*' ? 'Cả ba' : DV[h.dv].ic + ' ' + DV[h.dv].ten}</td>
      <td>${h.den ? '<span class="st2 o">Bật</span>' : '<span class="st2 r">Tắt</span>'}</td>
      <td>${h.ly}</td>
      <td>${h.canh ? `<span class="st2 w">⚠ ${h.canh} em đang dùng</span>` : '<span class="m">—</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Chưa có lượt nào khớp bộ lọc</td></tr>'}
    </tbody></table></div>`;

  $('#content').innerHTML = scope + khoa +
    `<div class="lay"><div class="lft"><div class="listw mtx">${hd}${rows}</div>
      <div class="leg">🔒 <b>Xin nghỉ · Góp ý · Sức khỏe</b> là quyền cơ bản của phụ huynh — không có công tắc. 🔗 số em đang dùng, đọc từ menu nghiệp vụ.</div>
      ${lichSu}</div>${preview}</div>`;
  $('#locDv') && ($('#locDv').onchange = e => { ST.locDv = e.target.value; render(); });
}

function manifest() {
  const o = {};
  DT.forEach(d => { o['dt-' + d.id] = { ...CFG[d.id] }; });
  return JSON.stringify({ phien_ban_may_chu: '2.4.1', tinh_nang_co: ['dich_vu_app', '…'], dich_vu_app: o }, null, 2)
    .replace(/</g, '&lt;');
}

/* ---------- Hộp thoại ---------- */
function moModal(h, b, f) { $('#mh').innerHTML = h; $('#mb').innerHTML = b; $('#mf').innerHTML = f; $('#mask').classList.add('on'); }
function dong() { $('#mask').classList.remove('on'); CHO = null; }
function toast(t) { const e = $('#toast'); e.innerHTML = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 3200); }

function moDoi(dt, dv) {
  if (!co('S')) { toast('🔒 Chỉ <b>HT · IT_Admin</b> bật/tắt được dịch vụ trên App'); return; }
  const tu = CFG[dt][dv], den = !tu, D = DV[dv], d = dtCua(dt), sd = SD[dt][dv];
  const sau = { ...CFG[dt], [dv]: den };
  CHO = { dt, dv, den, canh: !den ? sd.n : 0 };
  let b = `<div class="ba">${veSub(dt, null, 'Trước')}<div class="mui">→</div>${veSub(dt, sau, 'Sau khi lưu')}</div>`;
  if (!den) {
    if (sd.n > 0) {
      b += `<div class="warn">⚠ <b>Còn ${sd.n} ${D.donVi}</b> ở ${d.ngan} <span class="m">(🔗 ${D.menu})</span>. Tắt thì phụ huynh của ${sd.n} em <b>mất trên App</b>:
        <ul>${D.mat.map(x => `<li>${x}</li>`).join('')}</ul>
        Không chặn. Nếu dịch vụ thật sự dừng, <b>kết thúc đăng ký</b> ở <a class="dl" data-x="dl" data-m="${D.menu}">↗ ${D.menu} ${D.menuTen}</a>.
        ${dt === 'B' && dv === 'ban_tru' ? `<details class="ds"><summary>Xem ${sd.n} em</summary><table><tr><th>Học sinh</th><th>Lớp</th><th>Hình thức</th></tr>${DS_B_BT.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></details>` : ''}</div>`;
    } else {
      b += `<div class="okbox">✓ Không có học sinh nào đang dùng ${D.ten.toLowerCase()} ở ${d.ngan}.</div>`;
    }
    b += `<div class="two"><div><div class="sech">Đổi</div>
        <div class="blk"><span class="ic">✕</span>Sub-tab ${D.ic} ${D.ten} biến mất với phụ huynh của <b>${d.hs} học sinh</b> ${d.ngan}</div>
        <div class="blk"><span class="ic">✕</span>Lối tắt ⚡ và thông báo đẩy của dịch vụ này</div></div>
      <div><div class="sech">Không đổi</div>
        <div class="blk"><span class="ic">✓</span>Dữ liệu ở ${D.menu} — không xóa gì</div>
        <div class="blk"><span class="ic">✓</span>Hóa đơn dịch vụ vẫn hiện ở 💰 Tài chính</div>
        ${D.giu ? `<div class="blk"><span class="ic">✓</span>${D.giu}</div>` : ''}
        <div class="blk"><span class="ic">✓</span>Menu Web ${D.menu} vẫn chạy như cũ</div></div></div>`;
  } else {
    b += `<div class="info">Sub-tab ${D.ic} ${D.ten} sẽ hiện với phụ huynh của <b>${d.hs} học sinh</b> ${d.ngan} — kể cả em chưa đăng ký.</div>`;
    if (!sd.to) b += `<div class="warn">💡 ${D.menu} <b>chưa tổ chức</b> ${D.ten.toLowerCase()} ở ${d.ngan} — phụ huynh mở sub-tab sẽ gặp màn trống. Không chặn.</div>`;
  }
  b += `<label class="lbl">Lý do <span class="rq">*</span></label>
    <textarea class="din" id="lyDo" rows="2" placeholder="Ví dụ: Bếp Điểm trường B dừng nấu từ 01/10/2026">${''}</textarea>
    <div class="m" id="lyDoGhi">Bắt buộc, tối thiểu 10 ký tự — ghi vào lịch sử cùng người và thời điểm.</div>`;
  moModal(`${den ? 'Bật' : 'Tắt'} ${D.ic} ${D.ten} trên App — ${d.ngan}`, b,
    `<button class="btn" data-x="dong">Hủy</button><button class="btn ${den ? 'p' : 'dg'}" id="bLuu" data-x="luu" disabled>${den ? 'Bật' : 'Tắt'} — hiệu lực ngay</button>`);
  $('#lyDo').oninput = e => { $('#bLuu').disabled = e.target.value.trim().length < 10; };
  $('#lyDo').focus();
}

function luu() {
  if (!CHO) return;
  const ly = $('#lyDo').value.trim();
  if (ly.length < 10) return;
  const { dt, dv, den, canh } = CHO, r = ROLES[ST.r];
  CFG[dt][dv] = den;
  HIS.unshift({ t: bayGio(), ai: r.nguoi, cd: r.ten, dt, dv, den, ly, canh });
  dong(); ST.xem = dt; ST.haiCon = false; render();
  toast(`✓ Đã ${den ? 'bật' : 'tắt'} ${DV[dv].ic} ${DV[dv].ten} ở ${dtCua(dt).ngan} — App nhận ở lần mở hoặc làm mới tiếp theo`);
}

function moRaSoat(loai) {
  const rs = raSoat();
  if (loai === 'tat') {
    moModal('⚠ Đã tắt trên App mà menu nghiệp vụ còn học sinh dùng',
      `<div class="warn">Phụ huynh của các em dưới đây <b>không còn đường trên App</b> cho dịch vụ con đang dùng. Hoặc bật lại, hoặc kết thúc đăng ký ở menu nghiệp vụ.</div>
      <table><tr><th>Điểm trường</th><th>Dịch vụ</th><th>Đang dùng</th><th></th></tr>
      ${rs.tatConDung.map(x => `<tr><td>${dtCua(x.dt).ngan}</td><td>${DV[x.dv].ic} ${DV[x.dv].ten}</td><td><b>${x.n} em</b></td>
        <td><a class="dl" data-x="dl" data-m="${DV[x.dv].menu}">↗ ${DV[x.dv].menu}</a> ${co('S') ? `<button class="btn xs" data-x="tg" data-dt="${x.dt}" data-dv="${x.dv}">Bật lại</button>` : ''}</td></tr>`).join('')}</table>`,
      '<button class="btn" data-x="dong">Đóng</button>');
  } else {
    moModal('💡 Bật trên App mà menu nghiệp vụ chưa tổ chức',
      `<div class="info">Không phải lỗi — có thể trường sắp mở. Nhưng tới lúc đó phụ huynh mở sub-tab sẽ gặp màn trống.</div>
      <table><tr><th>Điểm trường</th><th>Dịch vụ</th><th>Menu nghiệp vụ</th><th></th></tr>
      ${rs.batRong.map(x => `<tr><td>${dtCua(x.dt).ngan}</td><td>${DV[x.dv].ic} ${DV[x.dv].ten}</td><td>${DV[x.dv].menu}: chưa có ${x.dv === 'ngoai_khoa' ? 'khóa nào mở' : x.dv === 'ky_tuc_xa' ? 'khu nội trú' : 'lớp bán trú'}</td>
        <td>${co('S') ? `<button class="btn xs" data-x="tg" data-dt="${x.dt}" data-dv="${x.dv}">Tắt</button>` : ''}</td></tr>`).join('')}</table>`,
      '<button class="btn" data-x="dong">Đóng</button>');
  }
}

function moXuat() {
  moModal('⬇ Xuất cấu hình dịch vụ trên App',
    `<label class="lbl">Nội dung</label>
     <label class="ck"><input type="checkbox" checked> Cấu hình hiện hành (3 điểm trường × 3 dịch vụ)</label>
     <label class="ck"><input type="checkbox" checked> Lịch sử bật/tắt (${HIS.length} lượt)</label>
     <label class="lbl">Mục đích <span class="rq">*</span></label>
     <select class="din" id="mdXuat"><option value="">— Chọn mục đích —</option><option>Bàn giao hệ thống</option><option>Kiểm tra nội bộ</option><option>Gửi đơn vị triển khai App</option></select>`,
    '<button class="btn" data-x="dong">Hủy</button><button class="btn p" data-x="xuatOk">Xuất</button>');
}

function moGhiChu() {
  moModal('💡 Ghi chú thiết kế — vì sao nay được ẩn sub-tab',
    `<div class="warn"><b>Đảo một quyết định cũ.</b> T6 §3.6 chốt <i>"sub-tab không ẩn khi trường không tổ chức"</i>. Góp ý 11 (Đợt 1) đảo lại. Ba lý do nay hợp lý:</div>
     <ol class="ol"><li><b>App dùng chung nhiều trường</b> (on-prem): trường không có ký túc xá thì 🛏 là nhiễu <b>vĩnh viễn</b> với mọi phụ huynh trường đó — không phải "affordance đang tìm".</li>
     <li><b>Sub-bar hết trần ở 6 ô</b>: tắt dịch vụ không có là cách <b>nhả chỗ</b>.</li>
     <li>Đây là <b>một mục của manifest năng lực Q2</b>: máy chủ trả, App vẽ — không hard-code.</li></ol>
     <div class="okbox"><b>Giữ phần đúng của quyết định cũ:</b> trường <b>có</b> dịch vụ mà con <b>không đăng ký</b> ⇒ sub-tab <b>vẫn hiện</b> và nói vậy. Ẩn theo <b>cấu hình trường</b>, không bao giờ theo <b>tình trạng của con</b>.</div>
     <div class="sech">Vì sao là công tắc tay, không dẫn xuất từ M6.1 · M6.2 · M6.10</div>
     <p class="p">"Có tổ chức" là <b>sự thật vận hành</b>; "công bố qua App" là <b>quyết định</b> — trường chạy thử ký túc xá một tháng rồi mới mở cho phụ huynh. Hai thứ lệch nhau thì chip rà soát nói ra, không tự sửa.</p>
     <div class="sech">Vì sao ba sub-tab kia không có cờ trong manifest</div>
     <p class="p">Không có trường dữ liệu thì <b>không tắt được, kể cả bằng một lỗi phía máy chủ</b>. Xin nghỉ · Góp ý · Sức khỏe là quyền của phụ huynh (T6 §2).</p>`,
    '<button class="btn" data-x="dong">Đóng</button>');
}

/* ---------- Sự kiện ---------- */
document.addEventListener('click', e => {
  const rb = e.target.closest('.rb');
  if (rb) { ST.r = rb.dataset.r; render(); return; }
  if (e.target.id === 'mask') { dong(); return; }
  const t = e.target.closest('[data-x]');
  if (!t) return;
  const x = t.dataset.x;
  if (x === 'tg') { e.stopPropagation(); dong(); moDoi(t.dataset.dt, t.dataset.dv); return; }
  if (x === 'xem') { ST.xem = t.dataset.dt; ST.haiCon = false; render(); return; }
  if (x === 'haiCon') { ST.haiCon = !ST.haiCon; render(); return; }
  if (x === 'luu') { luu(); return; }
  if (x === 'dong') { dong(); return; }
  if (x === 'rsTat') { moRaSoat('tat'); return; }
  if (x === 'rsRong') { moRaSoat('rong'); return; }
  if (x === 'xuat') { moXuat(); return; }
  if (x === 'xuatOk') {
    if (!$('#mdXuat').value) { toast('Chọn <b>mục đích</b> trước khi xuất'); return; }
    dong(); toast('✓ Đã xuất — lượt xuất ghi vào nhật ký M10.7 kèm mục đích'); return;
  }
  if (x === 'ghiChu') { moGhiChu(); return; }
  if (x === 'dl') { toast(`↗ Mở ${t.dataset.m}?return=M10.10 — demo không điều hướng`); return; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'hdt') { ST.dt = e.target.value; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') dong(); });
render();
</script>
</body>
</html>
