<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.5 Yêu cầu CSVC — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.cell{width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;text-align:right;font:inherit;font-size:12.5px}
.cell:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:6px;border-radius:1px;display:block}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}

const ycCuaDot=id=>YEUCAU.filter(y=>y.loai==='ms'&&y.dot===id);
const tienDot=id=>ycCuaDot(id).reduce((a,y)=>a+y.uocGia,0);


/* ══════════════════════════════════════════════════════════════════
   PHẠM VI — dữ liệu, không phải nút bị ẩn
   ══════════════════════════════════════════════════════════════════ */
/* ★ Một yêu cầu mượn thiết bị liên quan HAI điểm trường: nơi người mượn công tác
   và nơi SỞ HỮU thiết bị. Lọc một chiều thì QL CSVC bên sở hữu không thấy việc
   của chính mình — đúng bài học đã gặp ở lệnh điều chuyển của M6.4. */
function dtLienQuan(y){
 if(y.loai==='phong') return [phongById(y.phong).dt];
 if(y.loai==='tb') return [...new Set([y.dt,y.dtLay])];
 return [y.dt];
}
function ycTrongPhamVi(){
 const r=R();
 if(r.sc==='Own') return YEUCAU.filter(y=>y.nguoi===toiLa());
 const d=dtHieuLuc();
 if(d==='ALL') return YEUCAU.slice();
 return YEUCAU.filter(y=>dtLienQuan(y).includes(d));
}
/* ★ M6.5 KHÔNG CÓ CHỨC NĂNG BÁO HỎNG.
   Người dùng phát hiện hỏng thì báo trực tiếp với QL CSVC; QL CSVC ghi vào sổ ở M6.4 tab 5.
   GVCN có cửa riêng ở M2.9 cho phòng của lớp mình.
   Sổ BAOHONG vẫn được đọc ở đây, nhưng CHỈ MỘT CHIỀU và CHỈ ĐỂ MỘT VIỆC:
   thiết bị có phiếu hỏng đang mở thì tsMuonDuoc() loại nó khỏi danh sách cho mượn. */

/* ══════════════════════════════════════════════════════════════════
   MƯỢN PHÒNG — kiểm trùng là TRẠNG THÁI DẪN XUẤT
   ★ Hai nguồn trùng khác hẳn nhau về sức nặng:
       · trùng THỜI KHÓA BIỂU  → tiết chính khóa, gần như không nhường được
       · trùng LƯỢT MƯỢN khác  → hai việc ngoài giờ, người duyệt cân nhắc
     Gộp làm một thì người duyệt mất đúng thông tin cần để quyết định.
   ══════════════════════════════════════════════════════════════════ */
const giaoTiet=(a,b)=>a.some(t=>b.includes(t));
const muonSong=y=>y.loai==='phong'&&['cho','duyet'].includes(y.tt);
function xungDotPhong(phong,ngay,tiet,boQua){
 const tkb=tkbCua(phong,ngay).filter(x=>giaoTiet(x[1],tiet))
   .map(x=>({tiet:x[1].filter(t=>tiet.includes(t)),nhan:x[2]}));
 const muon=YEUCAU.filter(y=>y.id!==boQua&&muonSong(y)&&y.phong===phong&&y.ngay===ngay&&giaoTiet(y.tiet,tiet))
   .map(y=>({id:y.id,tiet:y.tiet.filter(t=>tiet.includes(t)),nhan:tenNS(y.nguoi)+' — '+y.mucdich,tt:y.tt}));
 return {tkb,muon,co:tkb.length+muon.length>0};
}
/* ★ Tự duyệt khi HOÀN TOÀN TRỐNG — cùng cơ chế đã chốt ở M6.2.
   Có bất kỳ vướng mắc nào thì đẩy sang người duyệt, KHÔNG tự từ chối:
   máy không đủ thẩm quyền nói không với một tiết dạy. */
function xetTuDongPhong(phong,ngay,tiet){
 if(!CFG.tuDongPhong)           return {ok:false,ma:'tat'};
 const p=phongById(phong);
 if(!p)                          return {ok:false,ma:'khong'};
 if(p.tt==='dong')               return {ok:false,ma:'dong',chan:true};
 if(p.tt==='sua')                return {ok:false,ma:'sua',chan:true};
 if(!phongMuonDuoc(p))           return {ok:false,ma:'loai',chan:true};
 if(ngay<HOMNAY)                 return {ok:false,ma:'quakhu',chan:true};
 const xd=xungDotPhong(phong,ngay,tiet);
 if(xd.co) return {ok:false,ma:xd.tkb.length?'tkb':'muon',xd};
 return {ok:true,xd};
}

/* ══════════════════════════════════════════════════════════════════
   MƯỢN THIẾT BỊ
   ══════════════════════════════════════════════════════════════════ */
const muonTBSong=y=>y.loai==='tb'&&['cho','duyet','dagiao'].includes(y.tt);
const chongNgay=(a1,a2,b1,b2)=>a1<=b2&&b1<=a2;
/* ★ NGƯỜI MƯỢN CHỌN LOẠI THIẾT BỊ, KHÔNG CHỌN MÃ.
   Giáo viên cần «một cái máy chiếu di động», không cần TS-26-41. Bắt họ chọn mã là
   bắt họ đọc một danh sách vô nghĩa với họ — và nếu cái họ chọn bận thì họ phải tự dò
   sang cái khác cùng loại. MÃ CỤ THỂ do QL CSVC chốt LÚC BÀN GIAO, vì chỉ lúc đó mới
   biết cái nào đang thật sự nằm trong kho. */
function nhomMuon(){
 const m={};
 TAISAN.filter(tsMuonDuoc).forEach(t=>{const k=t.ten+'|'+t.dt;
  (m[k]=m[k]||{ten:t.ten,dt:t.dt,ds:[]}).ds.push(t.id)});
 return Object.values(m).sort((a,b)=>a.dt.localeCompare(b.dt)||a.ten.localeCompare(b.ten));
}
const nhomCua=(ten,dt)=>nhomMuon().find(x=>x.ten===ten&&x.dt===dt);
const soCoCua=(ten,dt)=>{const g=nhomCua(ten,dt); return g?g.ds.length:0};
/* số cái của loại đó đã bị đặt trong khoảng ngày */
function daDat(ten,dt,tu,den,boQua){
 return YEUCAU.filter(y=>y.id!==boQua&&muonTBSong(y)&&y.tenTB===ten&&y.dtLay===dt
   &&chongNgay(y.tuNgay,y.denNgay,tu,den)).reduce((a,y)=>a+(y.sl||1),0);
}
const soRanh=(ten,dt,tu,den,boQua)=>soCoCua(ten,dt)-daDat(ten,dt,tu,den,boQua);
/* mã cụ thể còn rảnh — chỉ dùng ở bước BÀN GIAO */
function maRanh(ten,dt,tu,den,boQua){
 const g=nhomCua(ten,dt); if(!g) return [];
 const ban=new Set();
 YEUCAU.filter(y=>y.id!==boQua&&muonTBSong(y)&&y.giao&&chongNgay(y.tuNgay,y.denNgay,tu,den))
  .forEach(y=>(y.giao.ma||[]).forEach(m=>ban.add(m)));
 return g.ds.filter(id=>!ban.has(id));
}
const maDaGiao=y=>(y.giao&&y.giao.ma)||[];
/* ★ YÊU CẦU MƯỢN PHÒNG ĐÃ QUÁ NGÀY DÙNG — cũng là trạng thái DẪN XUẤT.
   Duyệt một lượt mượn cho ngày hôm qua là vô nghĩa, nên nó RỜI KHỎI hàng đợi;
   nhưng nó không được biến mất im lặng: người duyệt phải thấy mình đã bỏ sót mấy cái. */
const quaNgay=y=>y.loai==='phong'&&y.tt==='cho'&&y.ngay<HOMNAY;
/* ★ QUÁ HẠN LÀ SỐ DẪN XUẤT — so hạn trả với hôm nay, không có ô đánh dấu tay */
const quaHan=y=>y.loai==='tb'&&y.tt==='dagiao'&&y.denNgay<HOMNAY;
const soNgayTre=y=>Math.round((k2d(HOMNAY)-k2d(y.denNgay))/86400000);
const dangGiu=ma=>YEUCAU.filter(y=>y.loai==='tb'&&y.tt==='dagiao'&&y.nguoi===ma);
const dangChoMuon=()=>YEUCAU.filter(y=>y.loai==='tb'&&y.tt==='dagiao');

/* ══════════════════════════════════════════════════════════════════
   AI DUYỆT CÁI GÌ
   ★ Báo hỏng KHÔNG có bước duyệt ở đây: nó chảy thẳng vào sổ M6.4.
     Thêm một bước duyệt cho «cái quạt hỏng» chỉ làm chậm việc sửa.
   ══════════════════════════════════════════════════════════════════ */
function nguoiDuyetYC(y){
 if(y.loai==='phong') return {vai:'QL CSVC',dt:phongById(y.phong).dt};
 if(y.loai==='tb') return {vai:'QL CSVC',dt:y.dtLay,soHuu:true};
 if(y.loai==='ms')    return {vai:'QL CSVC',dt:y.dt,gom:true};
 return null;
}
function toiDuyetDuoc(y){
 if(!can('duyetMuon')) return false;
 if(!['phong','tb'].includes(y.loai)) return false;
 if(y.tt!=='cho') return false;
 if(quaNgay(y)) return false;
 const n=nguoiDuyetYC(y), d=dtHieuLuc();
 return d==='ALL'||n.dt===d;
}
function toiGomDuoc(y){
 return can('tonghop')&&y.loai==='ms'&&y.tt==='chotonghop'
   &&(dtHieuLuc()==='ALL'||y.dt===dtHieuLuc());
}
/* ★ NGƯỠNG KÝ: đợt ≥ ngưỡng thì Hiệu trưởng ký, dưới thì PHT duyệt.
   Ngưỡng là cấu hình chứ không phải hằng số trong mã: mỗi trường một quy chế
   chi tiêu nội bộ khác nhau. */
const canHTKy=id=>tienDot(id)>=CFG.nguongKy;
function toiXuLyDot(d){
 if(d.tt==='ngansach') return can('ngansach')?'ngansach':null;
 if(d.tt==='choduyet') return canHTKy(d.id)?(can('kyLon')?'ky':null):(can('duyetNho')?'duyet':null);
 return null;
}
/* ★ Dải hạn mức đấu thầu — THÔNG TIN THAM KHẢO cho người duyệt, không phải
   bước thủ tục. Hệ thống này không làm đấu thầu; nó chỉ nói con số này rơi
   vào nhóm nào để người ký biết mình đang ký cái gì. */
function daiDauThau(t){
 if(t<=50000000)  return ['≤ 50 triệu','Thủ trưởng đơn vị quyết định mua sắm, không phải lập kế hoạch lựa chọn nhà thầu','o'];
 if(t<=300000000) return ['> 50 – 300 triệu','Gói mua sắm thường xuyên của đơn vị sự nghiệp công lập — có thể chỉ định thầu (Luật Đấu thầu 2023, sửa đổi 2024)','w'];
 return ['> 300 triệu','Phải lập kế hoạch lựa chọn nhà thầu theo quy định','r'];
}

/* ══════════════════════════════════════════════════════════════════
   HÀNG ĐỢI «CHỜ TÔI DUYỆT» — lọc theo VIỆC, không phải theo tab
   ══════════════════════════════════════════════════════════════════ */
function choToiDuyet(){
 const ds=ycTrongPhamVi();
 const a=ds.filter(toiDuyetDuoc);
 const b=ds.filter(toiGomDuoc);
 const c=DOTMS.filter(d=>toiXuLyDot(d)&&(dtHieuLuc()==='ALL'||d.dt===dtHieuLuc()));
 return {muon:a,dexuat:b,dot:c,n:a.length+b.length+c.length};
}
/* việc của QL CSVC ngoài duyệt: giao thiết bị đã duyệt, nhận lại thiết bị đang mượn */
function viecGiaoTra(){
 if(!can('giaoTra')) return {giao:[],nhan:[]};
 const d=dtHieuLuc(), owns=y=>d==='ALL'||y.dtLay===d;
 return {giao:YEUCAU.filter(y=>y.loai==='tb'&&y.tt==='duyet'&&owns(y)),
         nhan:YEUCAU.filter(y=>y.loai==='tb'&&y.tt==='dagiao'&&owns(y))};
}

/* ── ghi vết ── */
function ghiLS(y,viec,boi){(y.ls=y.ls||[]).push([HOMNAY,viec,boi||toiLa()])}
const tenLS=m=>m==='_may'?'Hệ thống':tenNS(m);

/* ── nhãn trạng thái hiển thị của một yêu cầu (gồm cả quá hạn dẫn xuất) ── */
function nhanTT(y){
 if(quaHan(y))  return ['Quá hạn trả '+soNgayTre(y)+' ngày','r'];
 if(quaNgay(y)) return ['Đã quá ngày dùng — không ai xử lý','n'];
 return ttY(y.tt);
}

/* ★ MỘT ĐỊNH NGHĨA DUY NHẤT cho «số việc đang chờ tôi».
   Trước đây chuông đếm cả lượt quá hạn trả còn badge trên tab thì không —

function soViec(){

/* ══════════════════════════════════════════════════════════════════

const nhanTrangThai=y=>nhanTT(y);
function tenDoiTuong(y){

function thoiGianYC(y){
 if(y.loai==='phong') return '<b>'+kThu(y.ngay)+' '+k2s(y.ngay)+'</b><br><span class="xs">'+dsTiet(y.tiet)+'</span>';
 if(y.loai==='tb') return '<b>'+k2s(y.tuNgay)+' → '+k2s(y.denNgay)+'</b><br><span class="xs">'
   +Math.round((k2d(y.denNgay)-k2d(y.tuNgay))/86400000)+' ngày</span>';
 return '<span class="xs">gửi '+k2s(y.ngayGui)+'</span>';
}

/* ══════════════════════════════════════════════════════════════════
   TAB 1 — CỦA TÔI
   ★ Đây là tab duy nhất của 200 giáo viên, nên nó phải trả lời đúng hai câu:
     «tôi gửi gì rồi» và «cái tôi gửi đang ở đâu».
   ══════════════════════════════════════════════════════════════════ */
const CHIP_LOAI={all:'Tất cả',phong:'📍 Mượn phòng',tb:'🔌 Mượn thiết bị',ms:'🛒 Đề xuất mua sắm'};
const dsCuaToi=()=>YEUCAU.filter(y=>y.nguoi===aiToi())
 .sort((x,y)=>y.ngayGui.localeCompare(x.ngayGui));
const dangMo=y=>['cho','duyet','dagiao','chotonghop','trongdot'].includes(y.tt);

function veCuaToi(){
 const me=aiToi(), ds0=dsCuaToi();
 let ds=ds0;
 if(ST.lc&&ST.lc!=='all') ds=ds.filter(y=>y.loai===ST.lc);
 if(ST.chiMo) ds=ds.filter(dangMo);
 const giu=dangGiu(me), tre=giu.filter(quaHan);

 let h=scopeBar(role==='FULL'?'<b>Vai rà soát</b> đang xem hộp thư việc của <b>'+esc(tenNS(me))+'</b>.':'');

 if(role==='FULL'){
  h+='<div class="bar"><span class="fs">🔓 Xem màn hình «Của tôi» dưới góc nhìn của</span>'
   +'<select class="fs" id="nhinNhu">'+Object.keys(NS).map(k=>'<option value="'+k+'"'+(k===me?' selected':'')
     +'>'+esc(tenDu(k))+'</option>').join('')+'</select>'
   +'<span class="chip">chỉ có ở vai rà soát — hệ thống thật <b>không cho ai xem hộp thư việc của người khác</b></span></div>';
 }

 if(tre.length) h+='<div class="danger"><b>⏰ Bạn đang giữ quá hạn '+tre.length+' thiết bị.</b> '
  +tre.map(y=>esc(y.tenTB)+' <span class="pill">'+maDaGiao(y).join(' · ')+'</span> — trễ <b>'+soNgayTre(y)+' ngày</b>').join(' · ')
  +(CFG.chanQuaHan?' Chưa trả thì <b>không mượn thêm được</b> thiết bị nào khác.':'')+'</div>';

 h+='<div class="bar">'
  +(can('taoYC')?'<button class="btn p" data-new="phong">📍 Mượn phòng</button>'
    +'<button class="btn p" data-new="tb">🔌 Mượn thiết bị</button>'
    +'<button class="btn" data-new="ms">🛒 Đề xuất mua sắm</button>':'')
  +'<span class="sp"></span>'
  +'<label class="kchk"><input type="checkbox" id="chiMo"'+(ST.chiMo?' checked':'')+'> Chỉ việc chưa xong</label></div>';

 h+='<div class="filter">'+Object.keys(CHIP_LOAI).map(k=>{
   const n=k==='all'?ds0.length:ds0.filter(y=>y.loai===k).length;
   return '<button class="chip'+((ST.lc||'all')===k?' on':'')+'" data-lc="'+k+'">'+CHIP_LOAI[k]
    +' <b>'+n+'</b></button>'}).join('')+'</div>';

 h+='<div class="stage'+(ST.cur?' open':'')+'"><div class="listw">';
 h+='<div class="tbw"><div class="ch">Yêu cầu tôi đã gửi <span class="tg b">'+ds.length+' dòng</span>'
  +'<span class="sp"></span><span class="xs">đơn vị dòng: <b>một yêu cầu</b></span></div>'
  +'<div class="tbx"><table><tr><th>Mã</th><th>Loại</th><th>Nội dung</th><th>Thời gian</th><th>Trạng thái</th></tr>'
  +(ds.length?ds.map(y=>{
    const [nh,c]=nhanTrangThai(y);
    return '<tr class="rw'+(ST.cur===y.id?' on':'')+(quaHan(y)?' badrow':'')+'" data-yc="'+y.id+'">'
     +'<td><b>'+y.id+'</b></td>'
     +'<td><span class="tg '+(y.loai==='ms'?'c':y.loai==='hong'?'w':'b')+'">'+LOAI_YC[y.loai].ic+' '+LOAI_YC[y.loai].ten+'</span></td>'
     +'<td>'+tenDoiTuong(y)+'<br><span class="xs">'+esc(y.mucdich||'')+'</span></td>'
     +'<td>'+thoiGianYC(y)+'</td>'
     +'<td><span class="tg '+c+'">'+esc(nh)+'</span></td></tr>'}).join('')
   :'<tr><td colspan="5" class="empty">Chưa gửi yêu cầu nào.</td></tr>')
  +'</table></div></div>';

 h+=dnote('Ba loại yêu cầu <b>khác hẳn nhau về vòng đời</b> nhưng chung một hộp thư, vì với người gửi '
  +'chúng là <b>cùng một việc</b>: «tôi nhờ nhà trường một chuyện, giờ nó tới đâu rồi». '
  +'Tách thành ba menu thì giáo viên phải nhớ mình đã gửi cái gì ở đâu.<br>'
  +'<b>Menu này KHÔNG có chức năng báo hỏng.</b> Thiết bị hay phòng ốc hỏng thì <b>báo trực tiếp với QL CSVC</b>, '
  +'và <b>QL CSVC ghi vào sổ ở M6.4</b> sau khi xem tận nơi. GVCN có cửa riêng ở <b>M2.9</b> cho phòng của lớp mình.<br>'
  +'Lý do: người sửa đọc <b>dòng mô tả trên phiếu</b> để biết mang theo cái gì. '
  +'«Máy bị sao ấy» và «hỏng cổng HDMI» là hai phiếu khác nhau về mặt công việc — '
  +'chỉ người xem tận nơi mới viết được cái thứ hai.');
 h+='</div>'+panelYC()+'</div>';
 return h;
}

/* ── Tầng 2: một yêu cầu = một panel 1:1 ── */
function panelYC(){
 if(!ST.cur) return '<div class="panel"></div>';
 const y=ycById(ST.cur)||bh2yc(bhById(ST.cur));
 if(!y) return '<div class="panel"></div>';
 const [nh,c]=nhanTrangThai(y);
 return '<div class="panel"><div class="ph"><b>'+y.id+'</b><span class="tg '+c+'">'+esc(nh)+'</span>'
  +'<span class="pill">'+LOAI_YC[y.loai].ic+' '+LOAI_YC[y.loai].ten+'</span>'
  +'<span class="sp"></span><button class="btn xs" data-close="1">✕ Đóng</button></div>'
  +'<div class="pbody">'+thanYC(y)+'</div></div>';
}
/* ★ Cùng một thân nội dung dùng cho panel (tab 1) và cho hộp thoại chi tiết
   mở từ các tab khác — cùng một thực thể thì phải đọc ra cùng một thứ. */
function thanYC(y){
 let h='<div class="kv"><div><span>Người gửi</span><b>'+esc(tenDu(y.nguoi||'duc'))+'</b></div>'
  +'<div><span>Ngày gửi</span><b>'+k2s(y.ngayGui)+'</b></div></div>';

 if(y.loai==='phong'){
  const p=phongById(y.phong);
  h+='<div class="kv"><div><span>Phòng</span><b>'+esc(p.ten)+'</b> <span class="pill">'+p.id+'</span></div>'
   +'<div><span>Điểm trường</span><b>'+DT[p.dt]+'</b></div>'
   +'<div><span>Ngày dùng</span><b>'+kThu(y.ngay)+' '+k2s(y.ngay)+'</b></div>'
   +'<div><span>Khung tiết</span><b>'+dsTiet(y.tiet)+'</b></div></div>';
  const xd=xungDotPhong(y.phong,y.ngay,y.tiet,y.id);
  if(xd.co&&['cho','duyet'].includes(y.tt)) h+=veXungDot(xd);
 }
 if(y.loai==='tb'){
  const khac=y.dtLay!==dtNS(y.nguoi), ma=maDaGiao(y);
  h+='<div class="kv"><div><span>Loại thiết bị</span><b>'+esc(y.tenTB)+'</b></div>'
   +'<div><span>Số lượng</span><b>'+y.sl+'</b></div>'
   +'<div><span>Lấy tại</span><b>'+DT[y.dtLay]+'</b>'+(khac?' <span class="tg w">liên điểm trường</span>':'')+'</div>'
   +'<div><span>Mã bàn giao</span>'+(ma.length?'<b>'+ma.join(' · ')+'</b>'
      :'<i>chưa bàn giao</i>')+'</div>'
   +'<div><span>Từ ngày</span><b>'+k2s(y.tuNgay)+'</b></div>'
   +'<div><span>Hạn trả</span><b>'+k2s(y.denNgay)+'</b>'+(quaHan(y)?' <span class="tg r">trễ '+soNgayTre(y)+' ngày</span>':'')+'</div></div>';
  if(khac) h+='<div class="info">Thiết bị lấy tại <b>'+DT[y.dtLay]+'</b> nên người duyệt là <b>QL CSVC của '+DT[y.dtLay]
   +'</b>, không phải QL CSVC nơi người mượn công tác. Yêu cầu này <b>hiện ở cả hai điểm trường</b>.</div>';
  if(!ma.length&&['cho','duyet'].includes(y.tt)) h+='<div class="ro">Yêu cầu ghi <b>loại thiết bị</b>, chưa gắn mã. '
   +'<b>Mã cụ thể chốt lúc bàn giao</b> — chỉ khi đó mới biết cái nào đang thật sự nằm trong kho.</div>';
  if(y.tt==='khongnhan') h+='<div class="danger"><b>Người mượn không nhận bàn giao.</b> '
   +esc((y.tra&&y.tra.ghichu)||'')+'<br>Thiết bị <b>không rời kho</b>. Việc lập phiếu báo hỏng là của QL CSVC ở '
   +'<b>M6.4 tab 5</b>. '+rolnk('🔗 M6.4 · tab 5')+'</div>';
  if(y.tra&&y.tt==='datra') h+='<div class="'+(y.tra.tt==='tot'?'okbox':'warn')+'"><b>Đã nhận lại '+k2s(y.tra.ngay)+'</b> — '
   +(y.tra.tt==='tot'?'tình trạng tốt':'người mượn báo có vấn đề: '+esc(y.tra.ghichu))
   +' <span class="xs">('+esc(tenNS(y.tra.boi))+')</span>'
   +(y.tra.tt==='loi'?'<br>Việc lập <b>phiếu báo hỏng</b> là của QL CSVC ở <b>M6.4 tab 5</b> — '
     +'menu này chỉ lo mượn và trả. '+rolnk('🔗 M6.4 · tab 5'):'')+'</div>';
 }
 if(y.loai==='ms'){
  const dai=daiDauThau(y.uocGia*(y.sl||1));
  h+='<div class="kv"><div><span>Nội dung</span><b>'+esc(y.ten)+'</b></div>'
   +'<div><span>Số lượng</span><b>'+y.sl+'</b></div>'
   +'<div><span>Ước tính</span><b>'+vnd(y.uocGia)+'</b></div>'
   +'<div><span>Đợt mua sắm</span>'+(y.dot?'<b>'+y.dot+'</b> — '+esc(dotById(y.dot).ten):'<i>chưa vào đợt nào</i>')+'</div></div>';
  if(y.dot){const d=dotById(y.dot);
   h+='<div class="info">Đề xuất đã nằm trong đợt <b>'+d.id+'</b> — trạng thái đợt: <b>'+TT_DOT[d.tt][0]+'</b>. '
    +'Từ đây trở đi <b>đợt là đơn vị được duyệt</b>, không phải từng đề xuất lẻ.</div>';}
 }
 h+='<div class="kv"><div style="flex:1 1 100%"><span>Lý do / mục đích</span><b>'+esc(y.mucdich||'')+'</b></div></div>';
 if(y.tuchoi) h+='<div class="danger"><b>Từ chối '+k2s(y.tuchoi.ngay)+' — '+esc(tenNS(y.tuchoi.boi))+'</b><br>'+esc(y.tuchoi.ly)+'</div>';

 h+=veVet(y);
 h+='<div class="frow" style="margin-top:11px">'+nutYC(y)+'</div>';
 return h;
}
/* ★ Ở tab 1 danh sách là «của tôi», nên mở một yêu cầu của NGƯỜI KHÁC bằng panel
   của tab đó là sai: panel sẽ nói về một thực thể không có trong danh sách bên cạnh.
   Từ hàng đợi việc và các bảng khác, chi tiết mở bằng HỘP THOẠI ngay tại chỗ. */
function chiTietYC(id){
 const y=ycById(id); if(!y) return;
 const [nh,c]=nhanTrangThai(y);
 modal(LOAI_YC[y.loai].ic+' '+y.id+' — '+LOAI_YC[y.loai].ten
   +' <span class="tg '+c+'">'+esc(nh)+'</span>', thanYC(y),
   '<button class="btn" data-mb="close">Đóng</button>');
}
/* ★ VẾT — người gửi phải thấy việc của mình đi tới đâu. Gửi xong mà mất dấu
   thì lần sau họ đi hỏi miệng thay vì dùng hệ thống. */
function veVet(y){
 const rows=(y.ls||[]).map(([d,v,b])=>[k2s(d),v,b?tenLS(b):'']);
 return '<div class="tbw" style="margin-top:11px"><div class="ch">Vết xử lý</div><table>'
  +'<tr><th style="width:104px">Lúc</th><th>Việc</th><th style="width:150px">Bởi</th></tr>'
  +rows.map(([a,b,c])=>'<tr><td>'+esc(a)+'</td><td>'+b+'</td><td>'+esc(c)+'</td></tr>').join('')
  +'</table></div>';
}
function veXungDot(xd){
 let h='<div class="warn"><b>⚠️ Khung tiết này đang có việc khác.</b> Hai loại vướng mắc không cùng sức nặng:</div>'
  +'<div class="tbw"><table><tr><th style="width:150px">Nguồn</th><th>Nội dung</th><th style="width:120px">Tiết trùng</th></tr>';
 xd.tkb.forEach(x=>h+='<tr class="badrow"><td><b>Thời khóa biểu</b><br><span class="xs">tiết chính khóa</span></td>'
  +'<td>'+esc(x.nhan)+'</td><td>'+x.tiet.map(tenTiet).join(', ')+'</td></tr>');
 xd.muon.forEach(x=>h+='<tr class="warnrow"><td><b>Lượt mượn khác</b><br><span class="xs">'+ttY(x.tt)[0]+'</span></td>'
  +'<td>'+esc(x.nhan)+' <span class="pill">'+x.id+'</span></td><td>'+x.tiet.map(tenTiet).join(', ')+'</td></tr>');
 return h+'</table></div>';
}
function nutYC(y){
 const me=aiToi(), toi=y.nguoi===me;
 let b='';
 if(toi&&can('huyYC')&&['cho','chotonghop'].includes(y.tt))
  b+='<button class="btn d" data-huy="'+y.id+'">✕ Hủy yêu cầu</button>';
 if(toi&&can('huyYC')&&y.tt==='duyet')
  b+='<button class="btn d" data-huy="'+y.id+'">'
   +(y.loai==='phong'?'✕ Trả lại lượt mượn':'✕ Hủy — không cần mượn nữa')+'</button>';
 if(toiDuyetDuoc(y))
  b+='<button class="btn p" data-duyet="'+y.id+'">✓ Duyệt</button><button class="btn d" data-tuchoi="'+y.id+'">✕ Từ chối</button>';
 if(can('giaoTra')&&y.loai==='tb'&&y.tt==='duyet') b+='<button class="btn p" data-giao="'+y.id+'">📦 Giao thiết bị</button>';
 if(can('giaoTra')&&y.loai==='tb'&&y.tt==='dagiao') b+='<button class="btn p" data-nhan="'+y.id+'">📥 Nhận lại</button>';
 if(toiGomDuoc(y)) b+='<button class="btn p" data-gom="'+y.id+'">📋 Đưa vào đợt mua sắm</button>';
 return b||'<span class="xs">Không có thao tác nào ở trạng thái này.</span>';
}


/* ══════════════════════════════════════════════════════════════════
   TAB 2 — CHỜ TÔI DUYỆT
   ★ Hàng đợi việc, KHÔNG phải khung thời gian: ở đây chỉ có thứ đang chờ
     chính tôi làm một động tác. Cái gì tôi không quyết được thì không nằm đây.
   ══════════════════════════════════════════════════════════════════ */
function veChoDuyet(){
 const q=choToiDuyet(), g=viecGiaoTra();
 let h=scopeBar();
 const tong=q.n+g.giao.length+g.nhan.length;
 if(!tong) return h+'<div class="okbox"><b>✅ Không có việc nào đang chờ bạn.</b> '
  +'Tab này <b>chỉ chứa thứ chờ chính bạn làm một động tác</b> — cái người khác quyết thì không nằm ở đây.</div>'
  +dnote('Không dùng bộ lọc trạng thái để làm tab: <b>«chờ tôi duyệt» là một hàng đợi việc</b>, '
   +'còn «đã duyệt / từ chối» là <b>lịch sử</b> — tra ở tab 3, 4, 5 hoặc ở hộp thư của người gửi.');

 /* ── mượn phòng & thiết bị chờ duyệt ── */
 if(q.muon.length){
  const sach=q.muon.filter(y=>y.loai==='phong'&&!xungDotPhong(y.phong,y.ngay,y.tiet,y.id).co);
  h+='<div class="tbw"><div class="ch">Yêu cầu mượn chờ duyệt <span class="tg b">'+q.muon.length+'</span>'
   +'<span class="sp"></span>'
   +(sach.length?'<button class="btn xs p" id="duyetLoat">✓ Duyệt hàng loạt '+sach.length+' yêu cầu không vướng</button>':'')
   +'</div><div class="tbx"><table>'
   +'<tr><th>Mã</th><th>Người gửi</th><th>Nội dung</th><th>Thời gian</th><th>Vướng mắc</th><th></th></tr>'
   +q.muon.map(y=>{
     let vm='<span class="tg o">không vướng</span>';
     if(y.loai==='phong'){const xd=xungDotPhong(y.phong,y.ngay,y.tiet,y.id);
      if(xd.tkb.length) vm='<span class="tg r">trùng thời khóa biểu</span><br><span class="xs">'+esc(xd.tkb[0].nhan)+'</span>';
      else if(xd.muon.length) vm='<span class="tg w">trùng lượt mượn khác</span><br><span class="xs">'+xd.muon[0].id+'</span>';
     }else{
      const co=soCoCua(y.tenTB,y.dtLay), ranh=soRanh(y.tenTB,y.dtLay,y.tuNgay,y.denNgay,y.id);
      const lien=y.dtLay!==y.dt;
      if(ranh<y.sl) vm='<span class="tg r">không đủ máy rảnh</span><br><span class="xs">còn '+Math.max(0,ranh)+'/'+co+', xin '+y.sl+'</span>';
      else if(lien) vm='<span class="tg w">liên điểm trường</span><br><span class="xs">lấy tại '+DT[y.dtLay]+'</span>';
      const tre=dangGiu(y.nguoi).filter(quaHan);
      if(tre.length) vm='<span class="tg r">người mượn đang giữ quá hạn</span><br><span class="xs">'+tre.length+' thiết bị</span>';
     }
     return '<tr class="rw" data-yc="'+y.id+'"><td><b>'+y.id+'</b></td>'
      +'<td>'+esc(tenNS(y.nguoi))+'<br><span class="xs">'+esc(cdNS(y.nguoi))+'</span></td>'
      +'<td>'+LOAI_YC[y.loai].ic+' '+tenDoiTuong(y)+'<br><span class="xs">'+esc(y.mucdich)+'</span></td>'
      +'<td>'+thoiGianYC(y)+'</td><td>'+vm+'</td>'
      +'<td><button class="btn xs p" data-duyet="'+y.id+'">✓</button> '
       +'<button class="btn xs d" data-tuchoi="'+y.id+'">✕</button></td></tr>'}).join('')
   +'</table></div></div>';
 }
 /* ★ Yêu cầu đã quá ngày dùng KHÔNG nằm trong hàng đợi (duyệt nó là vô nghĩa),
    nhưng cũng KHÔNG được biến mất im lặng — người duyệt phải biết mình bỏ sót mấy cái. */
 const bqua=ycTrongPhamVi().filter(y=>quaNgay(y)&&(dtHieuLuc()==='ALL'||phongById(y.phong).dt===dtHieuLuc()));
 if(bqua.length&&can('duyetMuon'))

   +'từ lúc này thiết bị có <b>một người chịu trách nhiệm bằng tên</b>.</div>';
  if(!ranh.length) b+='<div class="danger"><b>Không còn cái nào rảnh</b> trong khoảng '

  else b+='<label class="lbl">Mã bàn giao — đã chọn <b>'+ST.gchon.length+'/'+y.sl+'</b></label>'
   +'<div class="lichpick"><div class="lprow">'+ranh.map(m=>{const t=tsById(m);
     return '<label class="lpt" style="min-width:190px"><input type="checkbox" data-gma="'+m+'"'
      +(ST.gchon.includes(m)?' checked':'')+'> <b>'+m+'</b>'
      +'<span class="xs">'+esc(t.ten)+'</span></label>'}).join('')+'</div></div>';
  b+='<div class="ro">Bàn giao xong, thiết bị hiện ở <b>tab 4 — thiết bị đang cho mượn</b>, và '
   +'<b>đợt kiểm kê kho của M6.4 đọc đúng danh sách đó</b> để không ghi nhầm thành mất.<br>'
   +'Nếu người mượn <b>xem máy rồi không nhận</b> vì có hư hỏng thì bấm nút bên phải — '
   +'thiết bị <b>không rời kho</b>, và bạn lập phiếu báo hỏng ở <b>M6.4 tab 5</b>.</div>';
  modal('📦 Bàn giao thiết bị — '+y.id,b,
   '<button class="btn" data-mb="close">Hủy</button>'
   +'<button class="btn d" data-mb="KhongNhan">✕ Người mượn không nhận</button>'
   +'<button class="btn p'+(du?'':' off')+'" data-mb="GiaoOK"'+(du?'':' disabled')+'>Xác nhận đã giao</button>');
  $$('[data-gma]').forEach(el=>el.onchange=()=>{
   const m=el.dataset.gma;
   ST.gchon=el.checked?[...ST.gchon,m]:ST.gchon.filter(x=>x!==m);
   ve();

 };

 const bo=q.muon.filter(y=>!sach.includes(y));
 mfns.bLoatOK=()=>{
  sach.forEach(y=>{y.tt='duyet'; y.duyet={boi:toiLa(),ngay:HOMNAY}; ghiLS(y,'Duyệt hàng loạt — không vướng mắc')});
  closeM(); render();
  modal('Kết quả duyệt hàng loạt',
   '<div class="okbox"><b>✅ Đã duyệt '+sach.length+' yêu cầu.</b></div>'
   +'<div class="tbw"><table><tr><th>Mã</th><th>Nội dung</th><th>Kết quả</th></tr>'
   +sach.map(y=>'<tr class="okrow"><td><b>'+y.id+'</b></td><td>'+tenDoiTuong(y)+'</td>'
     +'<td><span class="tg o">đã duyệt</span></td></tr>').join('')
   +bo.map(y=>{let ly='cần xem xét riêng';
     if(y.loai==='phong'){const xd=xungDotPhong(y.phong,y.ngay,y.tiet,y.id);
      ly=xd.tkb.length?'trùng thời khóa biểu — '+esc(xd.tkb[0].nhan):'trùng lượt mượn '+xd.muon[0].id}
     else ly='mượn thiết bị — luôn phải duyệt từng cái';
     return '<tr class="badrow"><td><b>'+y.id+'</b></td><td>'+tenDoiTuong(y)+'</td>'
      +'<td><span class="tg r">bỏ qua</span><br><span class="xs">'+ly+'</span></td></tr>'}).join('')
   +'</table></div>'
   +'<div class="ro">Mỗi dòng bỏ qua <b>nêu lý do cụ thể</b>. Một bảng chỉ ghi «7 thành công, 3 lỗi» '
   +'buộc người dùng dò lại từ đầu để biết ba cái nào.</div>',
   '<button class="btn p" data-mb="close">Đóng</button>');
 };
 modal('✓ Duyệt hàng loạt',
  '<div class="info">Chỉ duyệt được những yêu cầu <b>mượn phòng không vướng mắc gì</b>. '
  +'Yêu cầu có trùng lịch và mọi yêu cầu mượn thiết bị <b>phải xem từng cái</b>.</div>'
  +'<div class="kv"><div><span>Sẽ duyệt</span><b style="color:var(--green)">'+sach.length+' yêu cầu</b></div>'
  +'<div><span>Bỏ qua</span><b style="color:var(--red)">'+bo.length+' yêu cầu</b></div></div>',
  '<button class="btn" data-mb="close">Hủy</button>'
  +'<button class="btn p'+(sach.length?'':' off')+'" data-mb="LoatOK"'+(sach.length?'':' disabled')+'>Duyệt '+sach.length+' yêu cầu</button>');
}
/* ── gom đề xuất vào đợt ── */
function gomVaoDot(id){
 const y=ycById(id);
 const ds=DOTMS.filter(d=>d.dt===y.dt&&d.tt==='nhap');
 let b='<div class="kv"><div><span>Đề xuất</span><b>'+esc(y.ten)+'</b></div>'
  +'<div><span>Ước tính</span><b>'+vnd(y.uocGia)+'</b></div></div>';
 if(ds.length) b+='<label class="lbl">Đưa vào đợt</label><select class="fldi" id="gDot">'
  +ds.map(d=>'<option value="'+d.id+'">'+d.id+' — '+esc(d.ten)+' ('+vnd(tienDot(d.id))+')</option>').join('')+'</select>';
 else b+='<div class="warn"><b>Chưa có đợt nào đang gom ở '+DT[y.dt]+'.</b> '
  +'Tạo đợt mới thì đề xuất này vào đợt đó.</div>'
  +'<label class="lbl">Tên đợt mới</label><input class="fldi" id="gTen" value="Bổ sung thiết bị — '+DT[y.dt]+'">';
 modal('📋 Đưa vào đợt mua sắm',b,'<button class="btn" data-mb="close">Hủy</button>'
  +'<button class="btn p" data-mb="GomOK">'+(ds.length?'Đưa vào đợt':'Tạo đợt và đưa vào')+'</button>');
 mfns.bGomOK=()=>{
  let did;
  if(ds.length) did=$('#gDot').value;
  else{did='DMS-'+p2(DOTMS.length+1);
   DOTMS.push({id:did,ten:$('#gTen').value.trim()||'Đợt mua sắm',dt:y.dt,ngay:HOMNAY,boi:toiLa(),tt:'nhap',
    ls:[[HOMNAY,'Tạo đợt',toiLa()]]});}
  y.dot=did; y.tt='trongdot'; ghiLS(y,'Đưa vào đợt '+did);
  closeM(); ST.tab='ms'; ST.curDot=did; render(); toast('📋 Đã đưa <b>'+y.id+'</b> vào đợt <b>'+did+'</b>.');
 };
}
function xlDot(id){ST.tab='ms'; ST.curDot=id; render()}
function guiNganSach(id){
 const d=dotById(id);
 d.tt='ngansach'; d.ls.push([HOMNAY,'Gửi Kế toán đối chiếu ngân sách',toiLa()]);
 render(); toast('➡ Đã gửi đợt <b>'+id+'</b> sang Kế toán.');
}
function ghiNganSach(id){
 const d=dotById(id), t=tienDot(id);
 modal('💰 Ý kiến ngân sách — '+id,
  '<div class="info">Kế toán <b>không duyệt hay từ chối</b> đợt mua sắm — đó là thẩm quyền của PHT hoặc '
  +'Hiệu trưởng. Việc của Kế toán là nói <b>còn nguồn hay không</b> và <b>hạch toán vào đâu</b>.</div>'
  +'<div class="kv"><div><span>Tổng ước tính</span><b>'+vnd(t)+'</b></div>'
  +'<div><span>Số mục</span><b>'+ycCuaDot(id).length+'</b></div></div>'
  +'<label class="lbl">Nguồn kinh phí</label><select class="fldi" id="nsNguon">'
  +'<option>Chi thường xuyên — mục mua sắm tài sản, dự toán 2027</option>'
  +'<option>Nguồn thu sự nghiệp</option><option>Kinh phí không thường xuyên được giao</option>'
  +'<option>Nguồn xã hội hóa — có văn bản tài trợ</option></select>'
  +'<label class="lbl">Dự toán còn lại</label><input class="fldi" type="number" id="nsCon" value="120000000" step="1000000">'
  +'<label class="lbl">Ý kiến <span style="color:var(--red)">*</span></label>'
  +'<textarea class="fldi" id="nsY" rows="3" placeholder="Ví dụ: còn đủ dự toán; lưu ý mục dưới 10 triệu là công cụ dụng cụ, hạch toán khác nhóm tài sản cố định"></textarea>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p off" data-mb="NSOK" disabled>Ghi ý kiến và chuyển duyệt</button>');
 const el=$('#nsY'); el.oninput=()=>{const b=$('[data-mb="NSOK"]');
  b.disabled=!el.value.trim(); b.classList.toggle('off',!el.value.trim())};
 mfns.bNSOK=()=>{
  d.ns={boi:toiLa(),ngay:HOMNAY,nguon:$('#nsNguon').value,con:+$('#nsCon').value,ykien:el.value.trim()};
  d.tt='choduyet'; d.ls.push([HOMNAY,'Kế toán đã đối chiếu ngân sách',toiLa()]);
  closeM(); render();
  toast('💰 Đã ghi ý kiến — đợt chuyển sang <b>'+(canHTKy(id)?'Hiệu trưởng ký':'PHT duyệt')+'</b>.');
 };
}
function kyDot(id){
 const d=dotById(id), t=tienDot(id), lon=canHTKy(id), dai=daiDauThau(t);
 modal((lon?'✍️ Ký duyệt chủ trương — ':'✓ Duyệt chủ trương — ')+id,
  '<div class="kv"><div><span>Tổng ước tính</span><b style="font-size:15px">'+vnd(t)+'</b></div>'
  +'<div><span>Ngưỡng ký</span><b>'+vnd(CFG.nguongKy)+'</b></div>'
  +'<div><span>Thẩm quyền</span><b>'+(lon?'Hiệu trưởng':'PHT')+'</b></div></div>'
  +'<div class="'+(dai[2]==='o'?'okbox':dai[2]==='w'?'warn':'danger')+'"><b>'+dai[0]+'</b> — '+dai[1]+'.</div>'
  +(d.ns?'<div class="ro"><b>Kế toán:</b> '+esc(d.ns.ykien)+'<br>Nguồn: '+esc(d.ns.nguon)+' · còn '+vnd(d.ns.con)+'</div>':'')
  +'<label class="lbl">Ý kiến (không bắt buộc)</label><input class="fldi" id="kyY">'
  +'<div class="warn">Duyệt ở đây là <b>duyệt chủ trương mua sắm</b>. '
  +'Thủ tục lựa chọn nhà thầu và hợp đồng <b>nằm ngoài hệ thống này</b>; '
  +'khoản chi ghi ở <b>M7.3</b>, tài sản ghi tăng ở <b>M6.4</b>.</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="KyOK">'
  +(lon?'Ký duyệt':'Duyệt')+'</button>');
 mfns.bKyOK=()=>{
  d.ky={boi:toiLa(),ngay:HOMNAY,lon,ykien:$('#kyY').value.trim()};
  d.tt='duyet'; d.ls.push([HOMNAY,lon?'Hiệu trưởng ký duyệt chủ trương':'PHT duyệt chủ trương',toiLa()]);
  ycCuaDot(id).forEach(y=>{y.tt='datduyet'; ghiLS(y,'Đợt '+id+' được duyệt chủ trương')});
  closeM(); render(); toast('✅ Đã duyệt chủ trương đợt <b>'+id+'</b>.');
 };
}
function tcDot(id){
 const d=dotById(id);
 modal('✕ Không duyệt đợt — '+id,
  '<label class="lbl">Lý do <span style="color:var(--red)">*</span></label>'
  +'<textarea class="fldi" id="tdLy" rows="3"></textarea>'
  +'<div class="ro">Các đề xuất trong đợt <b>quay lại trạng thái chờ tổng hợp</b> để gom vào đợt sau — '
  +'không bị xóa, và người đề xuất thấy lý do ở hộp thư của họ.</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn d off" data-mb="TDOK" disabled>Không duyệt</button>');
 const el=$('#tdLy'); el.oninput=()=>{const b=$('[data-mb="TDOK"]');
  b.disabled=!el.value.trim(); b.classList.toggle('off',!el.value.trim())};
 mfns.bTDOK=()=>{
  d.tuchoi={boi:toiLa(),ngay:HOMNAY,ly:el.value.trim()}; d.tt='tuchoi';
  d.ls.push([HOMNAY,'Không duyệt',toiLa()]);
  ycCuaDot(d.id).forEach(y=>{y.tt='chotonghop'; y.dot=null; ghiLS(y,'Đợt '+d.id+' không được duyệt — quay lại chờ tổng hợp')});
  closeM(); render(); toast('Đã ghi không duyệt đợt <b>'+d.id+'</b>.');
 };
}
function xuatKiemKe(){
 modal('📤 Xuất danh sách thiết bị đang cho mượn',
  '<div class="info">Bản xuất này để <b>đợt kiểm kê kho ở M6.4</b> đối chiếu: thiết bị không có mặt trong kho '
  +'mà <b>có tên trong danh sách này</b> thì <b>không phải mất</b>.</div>'
  +'<label class="lbl">Nội dung</label><select class="fldi">'
  +'<option>Thiết bị đang ở ngoài kho — kèm người giữ và hạn trả</option>'
  +'<option>Toàn bộ kho thiết bị mượn được — kèm vị trí hiện tại</option></select>'
  +'<label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>'
  +'<select class="fldi"><option>Đối chiếu đợt kiểm kê kho thiết bị</option>'
  +'<option>Báo cáo nội bộ nhà trường</option></select>'
  +'<label class="lbl">Định dạng</label><select class="fldi"><option>Excel (.xlsx)</option><option>PDF</option></select>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="close">Xuất và ghi audit</button>');
}

/* ══════════════════════════════════════════════════════════════════
   RENDER + SỰ KIỆN
   ══════════════════════════════════════════════════════════════════ */
function render(){
 rolebar(); header(); sidebar(); tabs();
 const c=$('#content');
 $('#crumb').innerHTML='';
 if(ST.tab==='toi')        c.innerHTML=veCuaToi();
 else if(ST.tab==='duyet') c.innerHTML=veChoDuyet();
 else if(ST.tab==='lich')  c.innerHTML=veLich();
 else if(ST.tab==='muon')  c.innerHTML=veDangMuon();
 else if(ST.tab==='ms')    c.innerHTML=veMuaSam();
 else                     {c.innerHTML=veCauHinh(); gCfg();}
 const nn=document.body.classList.contains('nn');
 $('#btnNote').classList.toggle('on',!nn);
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(nn?'TẮT':'BẬT');
 const s=$('#nhinNhu'); if(s) s.onchange=()=>{ST.nhinNhu=s.value; ST.cur=null; render()};
 const cm=$('#chiMo'); if(cm) cm.onchange=()=>{ST.chiMo=cm.checked; render()};
}
function doiTab(t){ST.tab=t; ST.cur=null; ST.curDot=null}
function gCfg(){
 const g=(id,f)=>{const el=$(id); if(el) el.onchange=()=>{f(el.value); render();
  toast('⚙️ Đã đổi tham số — <b>số liệu liên quan tính lại ngay</b>.')}};
 g('#cfTuDong',v=>CFG.tuDongPhong=v==='1');
 g('#cfNguong',v=>CFG.nguongKy=+v);
 g('#cfHan',v=>CFG.hanTraMacDinh=+v);
 g('#cfChan',v=>CFG.chanQuaHan=v==='1');
 $$('[data-lpm]').forEach(el=>el.onchange=()=>{
  const k=el.dataset.lpm;
  CFG.loaiPhongMuon=el.checked?[...CFG.loaiPhongMuon,k]:CFG.loaiPhongMuon.filter(x=>x!==k);
  render(); toast('⚙️ Đã đổi danh sách loại phòng cho mượn.');
 });
}
document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 if(t===$('#mask')){closeM(); return}
 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r; ST.nhinNhu='minh'; doiTab(null);
  if(R().sc!=='School'&&R().dt) ST.dt=R().dt; else ST.dt='ALL'; render(); return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn'); render(); return}
 const tb=t.closest('#tabs [data-t]'); if(tb){doiTab(tb.dataset.t); render(); return}
 const bk=t.closest('[data-back]'); if(bk){ST.curDot=null; render(); return}
 const lc=t.closest('[data-lc]'); if(lc){ST.lc=lc.dataset.lc; ST.cur=null; render(); return}
 const nd=t.closest('[data-ngay]'); if(nd){ST.ngay=nd.dataset.ngay; render(); return}
 const nw=t.closest('[data-new]'); if(nw){
  ({phong:moTaoPhong,tb:moTaoTB,ms:moTaoMS})[nw.dataset.new](); return}
 const du=t.closest('[data-duyet]'); if(du){duyetYC(du.dataset.duyet); return}
 const tc=t.closest('[data-tuchoi]'); if(tc){tuchoiYC(tc.dataset.tuchoi); return}
 const hu=t.closest('[data-huy]'); if(hu){huyYC(hu.dataset.huy); return}
 const gi=t.closest('[data-giao]'); if(gi){giaoTB(gi.dataset.giao); return}
 const nh=t.closest('[data-nhan]'); if(nh){nhanTB(nh.dataset.nhan); return}
 const gm=t.closest('[data-gom]'); if(gm){gomVaoDot(gm.dataset.gom); return}
 const bx=t.closest('[data-botkhoi]'); if(bx){const y=ycById(bx.dataset.botkhoi);
  const d=y.dot; y.dot=null; y.tt='chotonghop'; ghiLS(y,'Bỏ khỏi đợt '+d); render();
  toast('Đã bỏ <b>'+y.id+'</b> khỏi đợt — quay lại chờ tổng hợp.'); return}
 const xd=t.closest('[data-xldot]'); if(xd){xlDot(xd.dataset.xldot); return}
 const gn=t.closest('[data-guins]'); if(gn){guiNganSach(gn.dataset.guins); return}
 const ns=t.closest('[data-ns]'); if(ns){ghiNganSach(ns.dataset.ns); return}
 const ky=t.closest('[data-kydot]'); if(ky){kyDot(ky.dataset.kydot); return}
 const td=t.closest('[data-tcdot]'); if(td){tcDot(td.dataset.tcdot); return}
 if(t.id==='duyetLoat'){duyetHangLoat(); return}
 if(t.id==='taoDot'){const le=YEUCAU.filter(y=>y.loai==='ms'&&y.tt==='chotonghop'
   &&(dtHieuLuc()==='ALL'||y.dt===dtHieuLuc()));
  if(le.length) gomVaoDot(le[0].id); return}
 if(t.id==='xuatKK'){xuatKiemKe(); return}
 const cl=t.closest('[data-close]'); if(cl){ST.cur=null; render(); return}
 const yc=t.closest('[data-yc]'); if(yc){
  if(ST.tab==='toi'){ST.cur=yc.dataset.yc; render()} else chiTietYC(yc.dataset.yc);
  return}
});
$('#hdt').addEventListener('change',()=>{ST.dt=$('#hdt').value; ST.cur=null; ST.curDot=null; render()});
dongBoTS();
render();

</script>
