<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10.1 Hồ sơ năm học — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:222px;flex:0 0 222px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.snav.new{color:var(--violet)}
.main{flex:1;padding:11px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn.demo{border-style:dashed;border-color:var(--violet);color:var(--violet);background:var(--violet-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:9px 0 0;flex-wrap:wrap;align-items:flex-end}
.tab1{padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.scope.first{margin-top:9px}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber);background:var(--amber-soft)}
.scope.rd{border-left-color:var(--red);background:var(--red-soft)}
.scope.vi{border-left-color:var(--violet)}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.tabtools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:5px}
.inp{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:#fff;min-width:0;width:138px}
.qf{white-space:nowrap}
.qf{border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;background:#fff}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.stage{display:flex;gap:13px;align-items:flex-start;margin-top:2px}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1300px){.stage.open .listw{display:none}}

.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:last-child{border-bottom:none}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.gn{grid-template-columns:1.25fr 1.05fr 1.35fr 1.5fr 1.9fr}
.stage.open .gn{grid-template-columns:1.2fr 1.05fr}
.stage.open .kx{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:var(--violet-soft);color:#5b21b6}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:15px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbody{padding:13px 15px;max-height:calc(100vh - 250px);overflow-y:auto}
.ptabs{display:flex;gap:4px;padding:0 15px;border-bottom:1px solid var(--line);background:#fcfdfe}
.ptab{padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand)}
.f{display:grid;grid-template-columns:158px 1fr;gap:11px;align-items:center;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sech{font-size:13px;font-weight:700;margin:16px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.tlbar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line2);margin:6px 0 5px}
.tlbar i{display:block;height:100%}
.tlleg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2)}
.tlleg span{display:inline-flex;align-items:center;gap:5px}
.tlleg em{width:10px;height:10px;border-radius:3px;font-style:normal;display:inline-block}

.ck{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:10px;background:#fff}
.ckh{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#f8fafc;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ckh b{font-size:13.5px}
.ckr{display:grid;grid-template-columns:26px 1.35fr 1.9fr auto;gap:10px;padding:9px 13px;border-top:1px solid var(--line);font-size:12.5px;align-items:center}
.ckr .ic{font-size:14px;text-align:center}
.ckr .nm{font-weight:600}
.ckr .ds{color:var(--ink2);font-size:12px}
.ckr.bad{background:var(--red-soft)}
.ckr.wr{background:var(--amber-soft)}
.ckr.usr{background:var(--violet-soft)}
.ckf{padding:11px 13px;border-top:1px solid var(--line);background:#fcfdfe;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.gsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:11px}
.gsec h3{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gsec .sub{font-size:12px;color:var(--ink2);margin-bottom:8px}
.lbl{font-size:12px;color:var(--ink2);display:block;margin:9px 0 3px}
.lbl b{color:var(--red)}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;min-height:56px;resize:vertical;font-family:inherit}
.ta:focus,.inp:focus{border-color:var(--brand);outline:none}
.din{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:13px;background:#fff;width:100%}
.din.bad{border-color:var(--red);background:var(--red-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

.cl{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px;display:grid;grid-template-columns:26px 1fr;gap:10px;background:#fff;cursor:pointer}
.cl.on{border-color:var(--brand);background:var(--brand-soft)}
.cl.lock{border-color:#a7f3d0;background:var(--green-soft);cursor:default}
.cl .cb{font-size:15px;text-align:center;line-height:1.3}
.cl b{font-size:13px;display:block}
.cl .d{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.cl .mm{font-size:10.5px;color:var(--ink3);margin-top:3px}
.cl .wn{font-size:11.5px;color:#92400e;background:var(--amber-soft);border:1px solid #fde68a;border-radius:7px;padding:5px 8px;margin-top:6px}

.res{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:9px}
.resh{padding:7px 11px;font-size:12px;font-weight:700}
.resh.ok{background:var(--green-soft);color:#065f46}
.resh.sk{background:var(--amber-soft);color:#92400e}
.resr{padding:6px 11px;font-size:12.5px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
.resr .w{min-width:210px;font-weight:600}
.resr .r{color:var(--ink2);flex:1;min-width:180px}

.mtx{width:100%;border-collapse:collapse;font-size:12.5px}
.mtx th,.mtx td{border:1px solid var(--line);padding:7px 9px;text-align:center}
.mtx th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3);font-weight:700}
.mtx td.nm{text-align:left;font-weight:600}
.mtx td.nm span{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.mtx .cur{background:var(--brand-soft)}
.mtx th.cur{background:#dbeafe;color:var(--brand)}
.mtxw{overflow-x:auto;border-radius:11px;border:1px solid var(--line);background:#fff}

.stepn{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:12px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--bg);color:var(--ink2)}
.stp.on{background:var(--brand);color:#fff;font-weight:700}
.stp.dn{background:var(--green-soft);color:var(--green);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:9px 13px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35;flex:1;min-width:200px}
.sgb b{display:block}
.sgb span{font-size:10.5px;color:var(--ink3)}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.sgb.on span{color:var(--brand)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:880px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.blk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.blk:last-child{border-bottom:none}
.blk .ic{flex:0 0 18px;font-size:13px}
.blk .tx{flex:1}
.blk .tx b{display:block}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.rb.dt.on{background:#fbbf24;color:#0f172a;border-color:#fbbf24}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.g::before{background:var(--green)}.logi.r::before{background:var(--red)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}
.dnote{font-size:11px;color:var(--violet);background:var(--violet-soft);border:1px dashed #ddd6fe;border-radius:7px;padding:5px 9px;margin-top:8px}


/* ===== v2.0 — khong gian cau hinh (tang 2 man hinh day du) ===== */
.pips{display:inline-flex;gap:3px;align-items:center}
.pip{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:1.5px solid var(--line2);color:var(--ink3);background:#fff}
.pip.x{background:var(--green);border-color:var(--green);color:#fff}
.pip.d{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.pip.o{background:#fff}
.pip.c{outline:2px solid var(--brand);outline-offset:1px}
.gn2{grid-template-columns:1.1fr 1fr 1.35fr 1.25fr 1.35fr 1.7fr}

.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}
.ws{display:grid;grid-template-columns:232px 1fr;gap:13px;margin-top:10px;align-items:start}
@media(max-width:1100px){.ws{grid-template-columns:1fr}}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px;position:sticky;top:66px}
.ri{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;font-size:12.8px;color:var(--ink2);cursor:pointer;width:100%;text-align:left}
.ri:hover{background:var(--bg)}
.ri.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.ri .t{flex:1}
.ri .opt{font-size:10px;color:var(--ink3);font-weight:400}
.rsep{border-top:1px solid var(--line);margin:6px 4px}
.wsm{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.wsh{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wsh h2{font-size:15.5px;font-weight:700}
.wsb{padding:12px 15px 16px}
.mbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin-bottom:11px;font-size:12.5px}
.mbar .lb{font-weight:700;color:var(--ink2);margin-right:2px}
.mbar select{border:1px solid var(--line2);border-radius:7px;padding:3px 6px;font-size:12px;background:#fff}
.wzf{display:flex;align-items:center;gap:8px;padding:11px 15px;border-top:1px solid var(--line);background:#fcfdfe;border-radius:0 0 12px 12px;flex-wrap:wrap}
.wzs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:auto}
.wzs .s{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink2);cursor:pointer}
.wzs .s.on{background:var(--brand);color:#fff;font-weight:700}
.wzs .s.x{background:var(--green-soft);color:var(--green);font-weight:600}

.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{background:#f8fafc;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:7px 8px;border-bottom:1px solid #eef2f6;vertical-align:middle}
.tb tr.gh td{background:#f8fafc;font-weight:700;font-size:11.5px;color:var(--ink2);padding:5px 8px}
.tb tr.dong td{opacity:.5}
.tb .sub{font-size:11px;color:var(--ink3)}
.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.lbm{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:#e0e7ff;color:#3730a3;margin-left:4px;vertical-align:1px}
.lby{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--green-soft);color:var(--green);margin-left:4px;vertical-align:1px}
.src{font-size:10px;color:var(--violet);margin-left:4px}

function txKHGD(n,lop,e){
 if(e.kdg==='nx')return null;const t=khgdTiet(n,lop,e.ma);if(!t)return null;
 return {v:band(t)+(e.cd?1:0),t:t};

/* trang thai cot DGtx cua mot dong Lop x Mon */
function txTT(n,lop,e){
 const def=txChuan(e.ma,lop.khoi,e.kdg,e.cd);
 const cur=e.tx?e.tx:[def,def];
 const k=txKHGD(n,lop,e);
 const theoK=!!(k&&e.tx&&e.tx[0]===k.v&&e.tx[1]===k.v);
 const lechChuan=!!(e.tx&&(e.tx[0]!==def||e.tx[1]!==def)&&!theoK);
 const lechK=!!(k&&(cur[0]!==k.v||cur[1]!==k.v));
 return {def:def,cur:cur,k:k,theoK:theoK,lechChuan:lechChuan,lechK:lechK};
}

function buoc(n){
 const c=cfgOf(n),s={},th={1:[],2:[],3:[],4:[],5:[],6:[]};
 s[1]=n.hk1bd&&n.hk1kt&&n.hk2bd&&n.hk2kt?'x':'o';

   if(!d.he.length)th[2].push(dtTen(d.ma)+' chưa có hệ đào tạo áp dụng');});
  if(!dts.length)th[2].push('Chưa có điểm trường nào đang hoạt động');
  s[2]=th[2].length?'d':'x';}
 if(!c.lop.length)s[3]='o';
 else{dts.forEach(function(d){khoiDT(d).forEach(function(k){
   if(!c.lop.some(l=>l.tt==='mo'&&l.dt===d.ma&&l.khoi===k))th[3].push('Khối '+k+' · '+dtTen(d.ma)+' chưa có lớp nào');});});
  s[3]=th[3].length?'d':'x';}
 if(!c.mon.length)s[4]='o';
 else{dts.forEach(function(d){d.cap.forEach(function(cp){
   const thieu=bbCua(cp).filter(ma=>!c.mon.some(x=>x.ma===ma&&x.dts.indexOf(d.ma)>=0));
   if(thieu.length)th[4].push(dtTen(d.ma)+' dạy '+cp+' nhưng chưa áp dụng môn bắt buộc: '+thieu.map(monTen).join(', '));
   if(!c.mon.some(x=>monM(x.ma).nn&&x.dts.indexOf(d.ma)>=0))th[4].push(dtTen(d.ma)+' chưa có môn ngoại ngữ nào cho ô Ngoại ngữ 1');});});
  s[4]=th[4].length?'d':'x';}
 if(!c.to.length)s[5]='o';
 else{const chua=c.mon.filter(x=>!toCuaMon(n,x.ma));
  chua.forEach(x=>th[5].push(monTen(x.ma)+' chưa thuộc tổ nào'));
  s[5]=chua.length?'d':'x';}

 return {s:s,th:th};
}

function actNam(n){
 const o=[],B=(lb,a,c,ex)=>'<button class="btn xs '+(c||'')+'" data-x="'+a+'" data-i="'+n.id+'"'+(ex||'')+'>'+lb+'</button>';
 if(n.tt==='nhap'){
  const bd=buocDo(n),tiep=n.dungMuc||bd;
  if(tiep&&(can('tao')||can('suaNhap')||can('m'+tiep)))o.push(B('▶ Làm tiếp '+nhanNgan(tiep),'lamTiep','p',' data-m="'+tiep+'"'));
  o.push(B('Xem','mo'));
  if(can('clone'))o.push(B('⧉ Clone thêm','mClone'));
  if(can('kichhoat')&&du14(n))o.push(B('✓ Tạo hồ sơ','mKichHoat','p'));
  if(can('xoa'))o.push(B('🗑 Xóa','mXoa','d'));
 }else{
  o.push(B('Xem','mo'));
  if(n.tt==='saptoi'&&can('batdau'))o.push(B('🚀 Bắt đầu năm học','mBatDau','p'));
  if(n.tt==='saptoi'&&can('kichhoat'))o.push(B('↩ Về Nháp','mVeNhap'));
  if(n.tt==='khoaso'&&can('ketthuc'))o.push(B('🔐 Kết thúc năm học','mKetThuc','g'));
  if(n.tt==='ketthuc'&&can('xuat'))o.push(B('⬇ Xuất','mXuat'));
 }
 return o.join('');
}

 s+=ckRow({k:'c4',nm:'④ Có lớp',lv:'block',ok:!ch.some(x=>x.m===3),ds:'Chưa có lớp nào',dsOk:lopMo(n).length+' lớp',muc:3},'BD',n);
 [2,4,5,'ns',3,6].forEach(function(k){const a=cb.filter(x=>x.m===k);
  s+=ckRow({k:'w'+k,nm:nhanKhoi(k)+' — không chặn tạo hồ sơ',lv:'warn',ok:!a.length,ds:a.length+' việc: '+a.slice(0,3).map(x=>x.t).join(' · ')+(a.length>3?' …':''),dsOk:'Không có cảnh báo',muc:k},'BD',n)});

   '<span style="color:var(--green);font-weight:600;font-size:12.5px">✅ Năm học chạy được'+(cb.length?' — '+cb.length+' cảnh báo nêu đích danh':'')+'</span>')+

function kiemTraTao(){
 const d=TAO,e=[],c=[],g=k=>d[k]?new Date(d[k]):null;
 if(!d.ten.trim())e.push('Chưa nhập tên năm học');else if(NAM.some(n=>n.ten===d.ten.trim()))e.push('Tên năm học <b>'+esc(d.ten)+'</b> đã tồn tại — R1');
 if(['hk1bd','hk1kt','hk2bd','hk2kt'].some(k=>!d[k]))e.push('Còn mốc học kỳ chưa nhập — bốn mốc học kỳ bắt buộc');
 else{
  if(g('hk1bd')>g('hk1kt'))e.push('Bắt đầu HK1 phải trước Kết thúc HK1');
  if(g('hk1kt')>=g('hk2bd'))e.push('Kết thúc HK1 phải trước Bắt đầu HK2');
  if(g('hk2bd')>g('hk2kt'))e.push('Bắt đầu HK2 phải trước Kết thúc HK2');
  const khai=g('khai')||D(5,9,g('hk1bd').getFullYear()),tuu=g('tuu')||(g('hk1bd')<khai?g('hk1bd'):khai);
  if(tuu>khai)e.push('Ngày tựu trường phải trước hoặc bằng ngày khai giảng');
  if(d.chot1&&g('chot1')<g('hk1kt'))e.push('Mốc chốt điểm HK1 phải từ ngày Kết thúc HK1 trở đi');
  if(d.chot2&&g('chot2')<g('hk2kt'))e.push('Mốc chốt điểm HK2 phải từ ngày Kết thúc HK2 trở đi');
  if(khai.getMonth()!==8||khai.getDate()!==5)c.push('Ngày khai giảng '+d2s(khai)+' khác 05/9 — Khung kế hoạch thời gian năm học của Bộ GDĐT quy định khai giảng 05/9 hằng năm');
  const k1=g('hk1kt');if(k1>new Date(k1.getFullYear(),0,18))c.push('Kết thúc HK1 '+d2s(k1)+' sau 18/01 — Khung kế hoạch quy định kết thúc học kỳ I trước 18/01');
  const k2=g('hk2kt');if(k2>new Date(k2.getFullYear(),4,31))c.push('Kết thúc năm học '+d2s(k2)+' sau 31/5 — Khung kế hoạch quy định kết thúc năm học trước 31/5');
 }
 return {e:e,c:c};
}

  'hệ thống ghi <b>lý do</b> vào <b>Lịch sử hồ sơ</b> và <b>M10.7</b>. ⛔ Không ký số ở đây — quyết định và ký số thuộc bản ghi Master ở M10.2.</div>'+
  '<label class="lbl">Lý do <b>*</b></label><textarea class="ta" id="lyKhung" placeholder="vd: Theo QĐ sáp nhập số …/QĐ-UBND, hiệu lực …"></textarea>',

function kiemDua(n){
 const w=DUA,e=[],tuD=w.tu?new Date(w.tu):null;

 else if(w.ma&&!dtTonTai(w.ma,tuD))e.push(DTM[w.ma].ten+' không còn tồn tại tại '+d2s(tuD)+' (R77)');
 if(!w.cap.length)e.push('chưa chọn cấp học');

 const c=cfgOf(n),e=ed(n,3),pv=phamViDT(3),mt=muctieuDS(n);

let NB={src:null,dich:[]};

function keHoachNB(n,src,t){
 const S=mlOf(n,src.id),T=mlOf(n,t.id),cung=src.khoi===t.khoi,skip=[];
 let moi=[];
 S.forEach(function(e){const mn=monNam(n,e.ma);
  if(!mn||mn.dts.indexOf(t.dt)<0){skip.push([t.ten+' · '+monTen(e.ma),'môn không áp dụng cho '+dtTen(t.dt)+' ở bước ④ (R59)']);return}
  const old=T.filter(x=>x.ma===e.ma)[0];
  moi.push({ma:e.ma,vai:e.vai,kdg:e.kdg,cd:e.cd,tx:cung?e.tx:null,ly:cung?e.ly:'',d:old?old.d:0});});
 T.forEach(function(x){if(moi.some(z=>z.ma===x.ma))return;
  if(coDiem(n,t,x)){
   if(x.vai==='nn1'||x.vai==='nn2'){const trung=moi.filter(z=>z.vai===x.vai)[0];if(trung){moi.splice(moi.indexOf(trung),1);skip.push([t.ten+' · không áp '+monTen(trung.ma)+' ('+VAITEN[x.vai]+')','ô đã có '+monTen(x.ma)+' với điểm — một ô một môn (R49)'])}}
   moi.push(x);skip.push([t.ten+' · giữ '+monTen(x.ma)+(x.vai==='nn2'?' (NN2)':''),'đã có điểm của '+t.hs+' học sinh ở M2.5 — không bỏ được (R31)']);}});
 const them=moi.filter(z=>!T.some(x=>x.ma===z.ma)).map(z=>z.ma),bot=T.filter(x=>!moi.some(z=>z.ma===x.ma)).map(x=>x.ma);
 return {moi:moi,them:them,bot:bot,skip:skip,ghiDe:T.length>0,cung:cung};
}

  '<div class="bar" style="padding:0 0 6px"><b style="font-size:12px">Chọn lớp đích</b><button class="btn xs" data-x="nbTat" data-k="khoi">Mọi lớp cùng khối '+src.khoi+'</button><button class="btn xs" data-x="nbTat" data-k="khoidt">Mọi lớp cùng khối, cùng điểm trường</button><button class="btn xs" data-x="nbTat" data-k="bo">Bỏ chọn</button></div>';
 uniq(cand.map(l=>l.khoi)).forEach(k=>{s+='<div style="margin-bottom:4px"><span class="sub">Khối '+k+':</span> '+cand.filter(l=>l.khoi===k).map(l=>'<span class="chip '+(NB.dich.indexOf(l.id)>=0?'on':'')+'" data-x="nbChon" data-l="'+l.id+'">'+esc(l.ten)+'</span>').join('')+'</div>'});
 s+='<div class="sub">'+khac+' lớp khác cấp không chọn được — danh sách môn bắt buộc khác nhau (R54)</div>';
 if(NB.dich.length){
  s+='<div class="sech">Xem trước — '+NB.dich.length+' lớp</div><table class="tb"><thead><tr><th>Lớp đích</th><th>Thêm</th><th>Bỏ</th><th>Ghi đè?</th><th>Sẽ bỏ qua</th></tr></thead><tbody>'+
   NB.dich.map(function(id){const t=lopBy(n,id),k=keHoachNB(n,src,t);
    return '<tr><td><b>'+esc(t.ten)+'</b> <span class="sub">'+heTen(t.he)+(k.cung?'':' · khối '+t.khoi+' — ĐGtx tính lại')+'</span></td><td>'+(k.them.map(monTen).join(', ')||'—')+'</td>'+

  if(apply)C.dt.push({ma:d.ma,tu:n.hk1bd,den:null,cap:d.cap.slice(),he:d.he.filter(h=>HEM[h]&&HEM[h].tt==='dang_dung'),sc:d.sc,tt:d.tt,nguon:'⧉ '+src.ten});
  const g=giuCD('PHT_DT',d.ma,n.hk1bd);
  tao.push([tenTai(d.ma,n.hk1bd),'từ '+d2s(n.hk1bd)+(giuaNam(src,d)?' (năm nguồn vào giữa năm '+d2s(d.tu)+' — năm mới tính từ đầu năm)':'')+' · '+d.cap.join(' · ')+' · hệ '+d.he.map(heTen).join(', ')+' · PHT: '+(g&&!g.roi?nsTen(g.ns)+' (bổ nhiệm còn hiệu lực — tự áp sang)':'khuyết')]);

}
function kt3(n,src,mode,apply,opt){
 const C=cfgOf(n),S=cfgOf(src),tao=[],bo=[],kh=[],lien=namTruoc(n)===src;
 const cu=mode==='ghide'?[]:C.lop.slice(),moi=[];
 S.lop.filter(l=>l.tt==='mo').forEach(function(l){
  const d=dtNam(n,l.dt);
  if(!d||d.tt!=='hd'){bo.push([l.ten+' ('+dtTen(l.dt)+')','điểm trường không hoạt động ở năm '+n.ten]);return}
  if(khoiDT(d).indexOf(l.khoi)<0){bo.push([l.ten+' ('+dtTen(l.dt)+')','khối '+l.khoi+' không còn trong cấp học của điểm trường năm nay']);return}

  moi.push({id:nid('L'),ten:l.ten,khoi:l.khoi,dt:l.dt,he:l.he,ssMax:l.ssMax,hs:0,giu:0,gvcn:null,gvcnTT:'ccb',tt:'mo',nguon:'⧉ '+src.ten});
 });

 if(lien){S.lop.filter(l=>l.tt==='mo'&&CUOICAP.indexOf(l.khoi)<0).forEach(function(l){can++;
  const d=tat.filter(x=>x.dt===l.dt&&x.khoi===l.khoi+1&&x.ten===doiKhoi(l.ten,l.khoi))[0];
  if(d){mt[l.id]=d.id;co++}else gap.push(l.ten+' → chưa có '+doiKhoi(l.ten,l.khoi)+' ở năm '+n.ten);});}
 let gv=0,gvTrong=0;const gvGan=[];
 moi.forEach(function(nl){

  s=ks[0]?lopBy(src,ks[0]):null;
  if(!s||!s.gvcn){gvTrong++;return}
  if(roiTruoc(s.gvcn,n.hk1bd)){bo.push([nsTen(s.gvcn)+' · GVCN '+s.ten+' → '+nl.ten,NS[s.gvcn].ly+' — không mang sang (quy tắc 2)']);gvTrong++;return}
  nl.gvcn=s.gvcn;gv++;gvGan.push(nsTen(s.gvcn)+': '+s.ten+' → '+nl.ten);
 });
 if(apply){if(mode==='ghide'){C.lop=[];C.mt={};C.ml={}}moi.forEach(l=>{C.lop.push(l);C.ml[l.id]=[]});Object.keys(mt).forEach(k=>{C.mt[k]={dich:mt[k],nguon:'goi_y'}})}
 const dem={};moi.forEach(l=>{dem[l.dt]=(dem[l.dt]||0)+1});
 tao.push(['Lớp (vỏ lớp, không kèm học sinh)',moi.length+' lớp — '+Object.keys(dem).map(k=>dtTen(k)+' '+dem[k]).join(' · ')]);
 if(lien)tao.push(['Lớp mục tiêu gợi ý',co+'/'+can+' lớp năm '+src.ten+' (khối cuối cấp không cần)']);
 if(opt.gv==='hs')tao.push(['GVCN theo lớp mục tiêu — ghi hộ M4.5, chưa công bố',gv+' lớp'+(gvTrong?' · '+gvTrong+' lớp để trống (không có lớp năm cũ trỏ tới, gộp lớp, hoặc người đã rời trường)':'')+(gvGan.length?' · ví dụ: '+gvGan.slice(0,3).join(' · '):'')]);
 else tao.push(['GVCN','không kế thừa (mặc định — N4) · 40 ô GVCN để trống, chọn từng lớp hoặc phân công ở M4.5']);
 gap.forEach(g=>bo.push([g.split(' → ')[0]+' — lớp mục tiêu',g.split(' → ')[1]+' · tạo ở góc nhìn Lớp mục tiêu']));
 return {tao:tao,bo:bo,kh:kh,note:lien?'':'Lớp mục tiêu chỉ gợi ý khi kế thừa từ <b>năm liền trước</b>.'};
}
function kt4(n,src,mode,apply){

  if(apply)C.to.push({ma:t.ma,ldpt:'',nguon:'⧉ '+src.ten});
  const g=giuCD('TTCM',t.ma,n.hk1bd),mon=monCuaTo(t.ma,nd).filter(m=>C.mon.some(z=>z.ma===m));
  tao.push([tn,'có ở năm này (dẫn xuất) · môn 🔗 M10.2 tab ④ (③b): '+(mon.map(monTen).join(', ')||'—')+(g&&!g.roi?' · TT: '+nsTen(g.ns):'')]);
  if(g&&g.roi){bo.push([nsTen(g.ns)+' · Tổ trưởng '+tn,NS[g.ns].ly+' ⇒ tổ khuyết Tổ trưởng từ đầu năm']);kh.push('Tổ trưởng '+tn)}
 });

 const chua=C.mon.filter(x=>!toNam.some(t=>monCuaTo(t.ma,nd).indexOf(x.ma)>=0));
 chua.forEach(x=>bo.push([monTen(x.ma),'chưa thuộc tổ nào đang hoạt động ở M10.2 — gán ở M10.2 tab ④ (F6 sẽ chặn)']));
 return {tao:tao,bo:bo,kh:kh,note:'Chỉ chép <b>tổ hoạt động năm nay</b>. <b>Môn thuộc tổ</b> là Master có ngày hiệu lực ở M10.2 tab ④ — đọc 🔗, không chép. Tổ trưởng, Tổ phó <b>không sao chép</b> — bổ nhiệm còn hiệu lực tự áp sang; người đã rời trường hiện <b>khuyết</b>. Lãnh đạo phụ trách đổi theo năm — khai lại.'};

function kt6(n,src,mode,apply){
 const C=cfgOf(n),S=cfgOf(src),tao=[],bo=[],lien=namTruoc(n)===src;
 let a=0,b=0,dong=0;const doi={},sua=[];
 lopMo(n).forEach(function(l){
  if(mode!=='ghide'&&mlOf(n,l.id).length){bo.push([l.ten,'đã có cấu hình — giữ nguyên']);return}

   if(!mn||mn.dts.indexOf(l.dt)<0){bo.push([l.ten+' · '+monTen(e.ma),'môn không áp dụng cho '+dtTen(l.dt)+' ở bước ④']);return}
   if(e.tx)sua.push(l.ten+' · '+monTen(e.ma));
   if(s.khoi!==l.khoi){const x0=txChuan(e.ma,s.khoi,e.kdg,e.cd),x1=txChuan(e.ma,l.khoi,e.kdg,e.cd);if(x0!==x1){const k=monTen(e.ma)+' '+x0+' → '+x1+' (khối '+l.khoi+' · '+monM(e.ma).tiet[l.khoi]+' tiết/năm)';doi[k]=(doi[k]||0)+1}}

 if(Object.keys(doi).length)tao.push(['Số cột ĐGtx tính lại theo khối đích',Object.keys(doi).map(k=>k+' — '+doi[k]+' lớp').join(' · ')]);

/* =================================================================================
   MHTB-1C (25/9/2026) — BUOC ② NAP DANH SACH HIEN TAI CUA MENU CHU  (§7.0.1c · chot b · c · c2)

   Ba khoi cua buoc ② dung CHUNG khuon nay, chi khac NGUON va khac COT GOI Y:
     ② a diem truong & he  ← M10.2 tab ②  (diem truong Dang ton tai tai ngay doc)
     ② b mon cua nam       ← M10.2 tab ② (mon Dang dung, loc theo cap cua ② a)
     ② c to bo mon         ← M10.2 tab ④ (to Dang hoat dong tai ngay doc)

   🛑 LUAT «DIEU KIEN KIEU MAY KET LUAN PHAI SAI DUOC O TRANG THAI RONG» (CLAUDE.md, bon vi du):
      danh sach nap song o NAP[...] — TRANG THAI MAN HINH, ⛔ KHONG phai ban ghi HDCT ④ ⑤ ⑥.
      Chua bam «✓ Xac nhan» thi cfg.dt / cfg.mon / cfg.to van RONG ⇒ buoc(n).s[2] van 'o',
      va R47 van chan «✓ Tao ho so». Ranh gioi giua BAY SAN va GHI SAN la MOT CU BAM cua con nguoi —
      ⛔ dung bo cu bam ay de «cho nhanh».
   ================================================================================= */

/* Trang thai man hinh — ⛔ KHONG luu vao n.cfg, ⛔ khong vao NAM. Mat khi doi ho so la DUNG y do. */
const NAP={};
function napKey(n,m){return n.id+'|'+m}
function napST(n,m){const k=napKey(n,m);if(!NAP[k])NAP[k]={bo:{}};return NAP[k]}
const napTicked=(n,m,ma)=>!napST(n,m).bo[ma];   /* mac dinh TICH SAN (luat ② cua §7.0.1c) */

/* ---- nam GAN NHAT (khong ke nam dang mo) co ban ghi nay — nguon cua COT GOI Y (luat ④) ---- */
function namGanNhat(n,co){
 const ds=NAM.filter(x=>x.id!==n.id).sort((a,b)=>(a.ten<b.ten?1:-1));
 for(let i=0;i<ds.length;i++){if(co(ds[i]))return ds[i]}
 return null;
}

/* ---- UNG VIEN + PHAN BO QUA cho tung khoi ---- */
function napUng(n,m){
 const c=cfgOf(n),nd=ngayDoc(n),ra=[],bo=[];
 if(m===2){
  Object.keys(DTM).forEach(function(k){
   if(c.dt.some(d=>d.ma===k))return;                       /* da co dong nam */
   if(!dtTonTai(k,n.hk1bd)){                               /* luat ⑥ — ⛔ khong hien dong */
    bo.push([tenTai(k,nd),(DTM[k].thanhLap&&DTM[k].thanhLap.ngay>n.hk1bd)
     ?'chưa thành lập tại '+d2s(n.hk1bd)+' — từ '+d2s(DTM[k].thanhLap.ngay)+' (R77)'
     :'đã giải thể ở M10.2 trước '+d2s(n.hk1bd)+' (R77)']);return}
   const src=namGanNhat(n,x=>cfgOf(x).dt.some(d=>d.ma===k));
   const g=src?cfgOf(src).dt.filter(d=>d.ma===k)[0]:null;
   ra.push({ma:k,ten:tenTai(k,nd),src:src,
    goi:g?{cap:g.cap.slice(),he:g.he.filter(h=>HEM[h]&&HEM[h].tt==='dang_dung'),sc:g.sc}:null});});
 }else if(m===4){
  const caps=uniq([].concat.apply([],dtHoatDong(n).map(d=>d.cap)));
  MON.forEach(function(mo){
   if(c.mon.some(x=>x.ma===mo.ma))return;
   if(!capsMon(mo).some(cp=>caps.indexOf(cp)>=0))return;   /* loc theo cap dang co o ② a */
   if(!monDangDung(mo.ma)){                                /* chot e — khoa la BO LOC HIEN THI */
    bo.push([monTenTai(mo.ma,nd),'đang Khóa ở M10.2 tab ②'+(mo.khoaTu?' từ '+d2s(mo.khoaTu):'')+
     ' — bản ghi «môn được phép dạy» ở M4.4 GIỮ NGUYÊN, mở khóa là hiện lại']);return}
   const src=namGanNhat(n,x=>cfgOf(x).mon.some(y=>y.ma===mo.ma));
   const g=src?cfgOf(src).mon.filter(y=>y.ma===mo.ma)[0]:null;
   ra.push({ma:mo.ma,ten:monTenTai(mo.ma,nd),src:src,
    goi:g?{dts:g.dts.filter(d=>c.dt.some(x=>x.ma===d))}:null});});
 }else{
  Object.keys(TOM).forEach(function(t){
   if(c.to.some(x=>x.ma===t))return;
   if(!toDangHD(t,nd)){bo.push([toTenTai(t,nd),'Không hoạt động ở M10.2 tab ④ tại '+d2s(nd)]);return}
   const src=namGanNhat(n,x=>cfgOf(x).to.some(y=>y.ma===t));
   const g=src?cfgOf(src).to.filter(y=>y.ma===t)[0]:null;
   ra.push({ma:t,ten:toTenTai(t,nd),src:src,goi:g&&g.ldpt?{ldpt:g.ldpt}:null});});
 }
 return {ra:ra,bo:bo};
}

const NAPTEN={2:['điểm trường','M10.2 tab ③','diem_truong'],
 4:['môn','M10.2 tab ②','danh_muc_mon'],5:['tổ','M10.2 tab ④','to_bo_mon']};

/* ---- goi y mot dong, ve chu ---- */
function napGoi(m,u){

 if(m===2)return '<b>'+(u.goi.cap.join(' · ')||'—')+'</b> · hệ '+(u.goi.he.map(heTen).join(', ')||'—')+' · '+u.goi.sc+' lớp';

/* =========== ① HOP NAP — chi hien khi khoi CON TRONG (luat ⑨: da co dong ⇒ ⛔ khong nap lai) =========== */
function napBox(n,m){
 const t=NAPTEN[m],k=napUng(n,m),ung=k.ra,so=ung.filter(u=>napTicked(n,m,u.ma)).length;

 let s='<div class="okbx" style="border-color:var(--amber)"><b>📥 Nạp từ '+esc(t[1])+'</b> — '+ung.length+' '+t[0]+

 s+='<div class="tbw"><table class="tb"><thead><tr><th style="width:34px"></th><th>'+

   return '<tr class="'+(on?'':'dong')+'"><td><span class="chip '+(on?'on':'')+'" data-x="napTick" data-m="'+m+'" data-k="'+u.ma+'">'+(on?'☑':'☐')+'</span></td>'+
    '<td><b>'+esc(u.ten)+'</b><div class="sub">'+esc(u.ma)+(m===2?' · '+esc(dcTai(u.ma,ngayDoc(n))):'')+'</div></td>'+
    '<td>'+(m===2?'Từ ngày <b>'+d2s(n.hk1bd)+'</b> · ':'')+napGoi(m,u)+'</td>'+
    '<td>'+(u.src?'<span class="src">⧉ '+esc(u.src.ten)+'</span>':'<span class="st2 v">🆕 chưa từng dùng</span>')+'</td></tr>'}).join('')+
  '</tbody></table></div>';
 if(k.bo.length)s+='<div class="warn">⚠ <b>Bỏ qua '+k.bo.length+' bản ghi</b> — ⛔ không hiện ở danh sách trên: '+
  k.bo.map(b=>'<b>'+esc(b[0])+'</b> <span class="sub">('+esc(b[1])+')</span>').join(' · ')+'</div>';
 s+='<div class="bar" style="padding:8px 0 0"><span class="spacer" style="flex:1"></span>'+
  '<button class="btn sm" data-x="napHet" data-m="'+m+'">↺ Bỏ tích hết</button>'+
  '<button class="btn p" data-x="napXac" data-m="'+m+'"'+(so?'':' disabled')+'>✓ Xác nhận đưa '+so+' '+t[0]+' vào năm</button></div>';
 s+='<div class="dnote">🛑 <b>Vì sao phải có cú bấm này.</b> Danh sách trên là <b>đề nghị chưa lưu</b> — ⛔ chưa một dòng <code>HDCT ④ ⑤ ⑥</code> nào được ghi. '+
  'Nhờ vậy điều kiện «bước ② xong» <b>vẫn SAI ĐƯỢC ở trạng thái rỗng</b>: quay về tầng 1 lúc này thì bước ② vẫn <code>○</code> và <b>✓ Tạo hồ sơ vẫn bị chặn</b> (R47 · R89). '+
  'Máy <b>bày sẵn</b> là tiện ích; máy <b>ghi sẵn</b> rồi đếm chính nó là lỗi — đúng bốn ca CLAUDE.md nêu.</div>';
 return s;
}
ACT.napTick=function(el){const n=namBy(V.mo),m=+el.dataset.m,st=napST(n,m),k=el.dataset.k;
 if(st.bo[k])delete st.bo[k];else st.bo[k]=1;render()};
ACT.napHet=function(el){const n=namBy(V.mo),m=+el.dataset.m;
 napUng(n,m).ra.forEach(u=>{napST(n,m).bo[u.ma]=1});render()};
ACT.napXac=function(el){
 const n=namBy(V.mo),m=+el.dataset.m,c=cfgOf(n),nd=ngayDoc(n);
 const ch=napUng(n,m).ra.filter(u=>napTicked(n,m,u.ma));
 if(!ch.length){toast('⛔ Chưa tích dòng nào — ⛔ không ghi gì (R89)');return}
 if(m===2){ch.forEach(function(u){const g=u.goi;
   const he=(g?g.he:[]).slice();
   he.forEach(h=>{if(!c.he.some(x=>x.ma===h))c.he.push({ma:h,tt:'hd',nguon:'📥 nạp hiện tại'})});
   c.dt.push({ma:u.ma,tu:n.hk1bd,den:null,cap:g?g.cap.slice():[],he:he,sc:g?g.sc:0,tt:'hd',nguon:'📥 nạp hiện tại'})});
 }else if(m===4){ch.forEach(u=>c.mon.push({ma:u.ma,dts:u.goi?u.goi.dts.slice():[],nguon:'📥 nạp hiện tại'}));
 }else{ch.forEach(u=>c.to.push({ma:u.ma,ldpt:u.goi?u.goi.ldpt:'',nguon:'📥 nạp hiện tại'}));}
 logNam(n,m,'Nạp danh sách hiện tại',ch.length+' '+NAPTEN[m][0]+' · nguồn '+NAPTEN[m][1]+', đọc tại '+d2s(nd),'');
 toast('✅ Đã ghi '+ch.length+' '+NAPTEN[m][0]+' — từ lúc này bước ② mới tính là có dữ liệu');
 render();
};

/* =========== ② DAI CANH BAO «menu chu co N · nam nay dung M» (chot c2 · R91) ===========
   Hien o MOI TRANG THAI HO SO, ke ca nam Dang hoat dong — ca dau nhat la quen dua co so
   moi sap nhap vao nam DANG CHAY, luc do man hinh cu ⛔ khong noi mot chu nao.
   ⚠ canh bao, ⛔ KHONG chan: «nam nay khong dung co so B» la quyet dinh hop le. */
function napDai(n,m){
 const c=cfgOf(n),k=napUng(n,m),t=NAPTEN[m];
 const co=(m===2?Object.keys(DTM).filter(x=>dtTonTai(x,ngayDoc(n)))
   :m===4?MON.filter(x=>monDangDung(x.ma)).map(x=>x.ma)
   :Object.keys(TOM).filter(x=>toDangHD(x,ngayDoc(n)))).length;
 const dung=(m===2?c.dt:m===4?c.mon:c.to).length;
 if(!k.ra.length)return '';
 const ten=k.ra.slice(0,5).map(u=>esc(u.ten)).join(', ')+(k.ra.length>5?' … và '+(k.ra.length-5)+' nữa':'');
 const doc=n.tt==='khoaso'||n.tt==='ketthuc';   /* R39 — chi doc, ⛔ khong nut */
 return '<div class="warn">⚠ <b>'+esc(t[1])+' có '+co+' '+t[0]+
  (m===2?' đang tồn tại':m===4?' đang dùng':' đang hoạt động')+' · năm '+esc(n.ten)+' dùng '+dung+'</b> — còn '+ten+' chưa đưa vào năm.'+
  (doc?' <span class="sub">Năm đã khóa sổ / kết thúc — dải chỉ đọc (R39).</span>'
      :' <span class="sub">⚠ cảnh báo, ⛔ không chặn — «năm nay không dùng» là quyết định hợp lệ.</span> '+dlChu(m))+'</div>';
}


/* =================================================================================
   TNHM-1A (v3.2 · 24/9/2026) — LUONG MOI cua ho so nam hoc (ban chot §8 N1…N8)
   · thanh muc theo luong (TN-1): ① Thoi gian · ② To chuc truong (khoi a b c) · ③ Nhan su (RA)
     · ④ Lop hoc (khoi a b) · ⑤ ✓ Tao ho so (THAO TAC) · ⑥ Hoc sinh vao lop · Dieu kien dam bao
   · ID khoi = so muc cu (1..7) — giu de moi tep cu va deep-link cu con dung; 'ns' · 'hs' la hai muc chieu moi
   · ↩ Dua ve Nhap — dieu kien DAN XUAT (TN-4): may dem ban ghi cua nam o moi menu da mo khi tao;
     LOAI TRU ban ghi do chinh M10.1 ghi ho / Clone (nguon audit = M10.1)
   · bang tra muc= (TN-2): ten la chuan, so cu 1..7 van chay
   ⛔ 0 Feature · 0 o quyen (TN-3): muc ③ ⑥ doc quyen X cua Feature NGUON; thieu thi NOI RA (🔒), khong an
   ================================================================================= */
const NHOM=[
 {k:'thoi_gian',so:'①',ten:'Thời gian năm học',khoi:[1]},
 {k:'to_chuc',so:'②',ten:'Tổ chức trường trong năm',khoi:[2,4,5]},
 {k:'nhan_su',so:'③',ten:'Nhân sự trong năm',khoi:['ns']},
 {k:'lop',so:'④',ten:'Lớp học',khoi:[3,6]},
 {k:'hoc_sinh',so:'⑥',ten:'Học sinh vào lớp',khoi:['hs']},
 {k:'dieu_kien',so:'',ten:'Điều kiện đảm bảo & hạ tầng',khoi:[7]}];
const KHOICH={2:'a',4:'b',5:'c',3:'a',6:'b'};
const KHOITEN={2:'Điểm trường & hệ',4:'Môn học của năm',5:'Tổ bộ môn',3:'Lớp · GVCN · lớp mục tiêu',6:'Môn của từng lớp'};
const nhomCua=m=>NHOM.filter(g=>g.khoi.indexOf(m)>=0)[0]||null;
const nhomK=k=>NHOM.filter(g=>g.k===k)[0];
/* thu tu buoc khi dang TAO (wizard) — ① ② a b c ③ ④ a b, roi ⑤ ✓ Tao ho so */
const LUONG=[1,2,4,5,'ns',3,6];
function nhanNgan(m){if(m==='ns')return '③';if(m==='hs')return '⑥';if(m===7)return 'ĐK';return MUCSO[m]||''}
function nhanKhoi(m){
 if(m==='ns')return '③ Nhân sự trong năm';if(m==='hs')return '⑥ Học sinh vào lớp';if(m===7)return 'Điều kiện đảm bảo & hạ tầng';
 const g=nhomCua(m);if(!g)return '';return g.so+(g.khoi.length>1?' '+KHOICH[m]:'')+' '+(g.khoi.length>1?KHOITEN[m]:g.ten);
}

/* ----- BANG TRA muc= (TN-2) — tra ve id khoi, hoac undefined neu khong nhan ra ----- */
function tuMuc(muc,khoi){
 if(muc==null||muc==='')return null;
 if(/^\d+$/.test(muc)){const k=parseInt(muc,10);return k>=1&&k<=7?k:undefined}
 const g=nhomK(muc);if(!g)return undefined;
 if(g.k==='dieu_kien')return 7;               /* &khoi=a|b|c giu nghia cu — ba khoi cua dieu kien dam bao */
 const i={a:0,b:1,c:2}[khoi];
 return g.khoi[(i!=null&&g.khoi[i]!=null)?i:0];
}

/* ----- TRANG THAI TUNG MUC — dan xuat (§3) ----- */
function stNhom(n,g){
 const b=buoc(n).s;
 if(g.k==='nhan_su'){if(n.daRa)return 'x';return (n.tt==='nhap'||n.tt==='saptoi')?'o':'n'}
 if(g.k==='hoc_sinh'){const h=hsvl(n);if(!h)return 'n';const t=tongHS(h);return !t.can?'o':(t.da>=t.can?'x':(t.da?'d':'o'))}
 if(g.k==='dieu_kien'){const q=dem7(n);return q.co?(q.co>=q.tong?'x':'d'):'o'}
 const s=g.khoi.map(k=>b[k]);
 if(s.every(x=>x==='x'))return 'x';if(s.every(x=>x==='o'))return 'o';return 'd';
}
const PIPNHAN={x:'xong',d:'đang dở',o:'chưa có gì',n:'chưa tới lúc / không áp dụng'};
/* nam o tien do ① ② ③ ④ ⑥ + dau tao ⑤ */
function pipsMoi(n,cur){
 const gc=cur!=null?nhomCua(cur):null;
 const P=g=>{const s=stNhom(n,g);return '<span class="pip '+s+(gc&&gc.k===g.k?' c':'')+'" title="'+g.so+' '+g.ten+' — '+PIPNHAN[s]+'">'+(s==='x'?'✓':(s==='n'?'—':g.so.replace(/[①②③④⑥]/,x=>({'①':1,'②':2,'③':3,'④':4,'⑥':6})[x])))+'</span>'};
 const tao=n.tt!=='nhap';
 return '<span class="pips">'+NHOM.slice(0,4).map(P).join('')+
  '<span class="pip '+(tao?'x':'o')+'" style="border-radius:5px;width:auto;padding:0 5px" title="⑤ ✓ Tạo hồ sơ năm học — '+(tao?'đã tạo':'chưa tạo (hồ sơ Nháp)')+'">⑤'+(tao?'✓':'')+'</span>'+
  P(NHOM[4])+'</span>';
}

/* ----- GHI CUA CAC MENU KHAC VAO NAM (du lieu mo phong) — nguon cua ⑥ va cua ↩ Dua ve Nhap ----- */
const ghiOf=n=>n.ghi||(n.ghi={kc:[],kcLo:0,ts:0,pl:0,nhap:0,pc:0,tkb:0,thu:0});
/* ⑥ Hoc sinh vao lop — ba nguon; «thuoc dien» la mau so (§7.9) */
function hsvl(n){
 if(n.tt==='nhap')return null;
 const lm=lopMo(n),dau=laNamDau(n),dc=l=>[1,6,10].indexOf(l.khoi)>=0;
 if(n.tt!=='saptoi'){   /* nam da chay: moi em thuoc dien da vao lop — dem theo si so lop */
  const a=lm.filter(l=>!dc(l)).reduce((s,l)=>s+(l.hs||0),0),b=lm.filter(dc).reduce((s,l)=>s+(l.hs||0),0);
  return dau?{kc:{dung:false},ts:{dung:true,da:b,can:b},nhap:{dung:true,da:a,can:a}}:{kc:{dung:true,da:a,can:a},ts:{dung:true,da:b,can:b},nhap:{dung:false}};
 }
 const g=ghiOf(n),t=namTruoc(n);
 const can=t&&t.cfg?lopMo(t).filter(l=>CUOICAP.indexOf(l.khoi)<0).reduce((s,l)=>s+(l.hs||0),0):0;
 return {kc:{dung:!dau,da:g.kc.length+g.kcLo,can:can,ds:g.kc},ts:{dung:true,da:g.ts,can:g.tsCan||0},nhap:{dung:dau,da:g.nhap,can:g.nhapCan||0}};
}
function tongHS(h){let da=0,can=0;['kc','ts','nhap'].forEach(k=>{if(h[k].dung){da+=h[k].da||0;can+=h[k].can||0}});return {da:da,can:can}}

/* quyen X cua Feature NGUON (bang chuan hoa — M4.1 · M4.3 · M4.4 · M4.5): vai khong co thi NOI RA */
const XNGUON={
 'm4.1.danh_sach_nhan_su':['FULL','HT','PHT_DT','PHT_CM'],'m4.3.ra_soat_bo_may':['FULL','HT','PHT_DT','PHT_CM'],
 'm4.4.mon_duoc_phep_day':['FULL','HT','PHT_CM'],'m4.5.khoi_lop_phu_trach':['FULL','HT','PHT_DT','PHT_CM'],
 'm10.1.to_nam_hoc':['FULL','HT','PHT_DT','PHT_CM','IT','GV'],
 'm3.3.ket_chuyen_sang_nam_sau':['FULL','HT','PHT_DT','PHT_CM'],'m1.4.phan_lop_hs_moi':['FULL','HT','PHT_DT'],'m1.9.xep_lop':['FULL','HT','PHT_DT']};
const coX=f=>(XNGUON[f]||[]).indexOf(role)>=0;
const noacc=(f,m)=>'<div class="ro noacc">🔒 Bạn không có quyền xem <code>'+f+'</code> ở <b>'+m+'</b> — khối này <b>để trống</b>, ⛔ không phải «không có vấn đề».</div>';
const MON_CHUA_GV=['NHAT','CDTOAN'];   /* du lieu mau M4.4 — mon cua nam chua co giao vien nao duoc phep day */
function nsRa(n){
 const c=cfgOf(n),hk=n.hk1bd,dtL=V.dtHeader,r={k1:[],k2:[],k3:[],k4:[],k5:[]};
 dtHoatDong(n).filter(d=>!dtL||d.ma===dtL).forEach(function(d){const g=giuCD('PHT_DT',d.ma,hk);
  if(!g)r.k2.push('PHT phụ trách '+dtTen(d.ma)+' — khuyết');else if(g.roi)r.k1.push(nsTen(g.ns)+' · PHT phụ trách '+dtTen(d.ma)+' — '+NS[g.ns].ly);});
 /* 🔁 MHTB — «to co o nam nay» dan xuat tu trang thai to tai ngay doc (HDCT ⑥ ban 3) */
 toNamHD(n).forEach(function(t){const g=giuCD('TTCM',t.ma,hk),tn=toTenTai(t.ma,ngayDoc(n));
  if(!g)r.k2.push('Tổ trưởng '+tn+' — khuyết');else if(g.roi)r.k1.push(nsTen(g.ns)+' · Tổ trưởng '+tn+' — '+NS[g.ns].ly);
  if(!t.ldpt)r.k4.push(tn+' — chưa khai lãnh đạo phụ trách');});
 c.lop.filter(l=>l.tt==='mo'&&l.gvcn&&roiTruoc(l.gvcn,hk)&&(!dtL||l.dt===dtL)).forEach(l=>r.k1.push(nsTen(l.gvcn)+' · GVCN '+l.ten+' — '+NS[l.gvcn].ly));
 c.mon.filter(x=>MON_CHUA_GV.indexOf(x.ma)>=0).forEach(x=>r.k3.push(monTen(x.ma)+' — 0 giáo viên được phép dạy (⇒ tổ không có thành viên dạy môn này) · số liệu mẫu'));
 if(lopMo(n).some(l=>l.khoi===12))r.k5.push('Khối 12 · Tin học — chưa có giáo viên phụ trách khối (số liệu mẫu)');
 return r;
}
const soCanhNS=n=>{const r=nsRa(n);return r.k1.length+r.k2.length+r.k3.length+r.k5.length};
function secNS(n){
 const r=nsRa(n);
 const K=(so,ten,f,m,ds,muc,info)=>'<div class="sech">'+so+' · '+ten+' <span class="pill">'+m+' · '+f+'</span>'+(coX(f)&&ds.length?'<span class="st2 '+(info?'n':'w')+'">'+ds.length+(info?' dòng':' ⚠')+'</span>':'')+'</div>'+
  (!coX(f)?noacc(f,m):(ds.length?ds.map(x=>'<div class="blk"><div class="ic">'+(info?'ℹ':'⚠')+'</div><div class="tx">'+esc(x)+'</div></div>').join('')+
   '<div style="margin:4px 0 0">'+(muc?'<button class="rolnk" data-x="muc" data-m="'+muc+'">Mở '+nhanKhoi(muc)+'</button>':dlink(m))+'</div>':'<div class="okbx">✅ Không có dòng nào</div>'));
 let s='<div class="wsh"><h2>③ NHÂN SỰ TRONG NĂM <span class="st2 b">🆕</span></h2><span class="pill">chỉ chiếu — ⛔ không Feature riêng (TN-3)</span><span class="spacer" style="flex:1"></span></div><div class="wsb">'+
  '<div class="info">Bước <b>RÀ</b> — ⛔ không chặn «✓ Tạo hồ sơ» (N5). Mỗi khối đọc quyền <b>X của Feature nguồn</b>; vai không có quyền thì khối <b>nói ra</b> 🔒, ⛔ không ẩn. Dòng cần sửa có deep-link sang đúng chỗ.'+
   (V.dtHeader?' · đang lọc theo điểm trường <b>'+esc(dtTen(V.dtHeader))+'</b>':'')+'</div>'+
  K('1','Người đã rời trường mà vẫn đứng ở một vị trí của năm','m4.1.danh_sach_nhan_su','M4.1',r.k1)+
  K('2','Chức danh khuyết — PHT phụ trách từng điểm trường · Tổ trưởng từng tổ','m4.3.ra_soat_bo_may','M4.3',r.k2)+
  K('3','Môn được phép dạy (⇒ thành viên tổ)','m4.4.mon_duoc_phep_day','M4.4',r.k3)+
  K('4','Lãnh đạo phụ trách tổ — ℹ không cảnh báo (§7.5.1)','m10.1.to_nam_hoc','M10.1 ② c',r.k4,5,1)+
  K('5','Khối phụ trách NS × Môn × Khối','m4.5.khoi_lop_phu_trach','M4.5',r.k5);
 const ra=n.daRa;
 s+='<div class="sech">✓ Đã rà</div>'+(ra?'<div class="okbx">✓ <b>'+esc(ra.ng)+'</b> đã rà lúc <b>'+esc(ra.gio)+'</b> — lúc rà có <b>'+ra.canh+'</b> dòng ⚠'+(soCanhNS(n)!==ra.canh?' · <span class="st2 w">có thay đổi sau lần rà: nay '+soCanhNS(n)+' dòng ⚠</span>':'')+'</div>':'<div class="ro">Chưa ai rà.</div>')+
  '<div class="ro">«Đã rà» là <b>bản ghi người + giờ</b> — ⛔ không phải trạng thái máy: không chặn gì, không mở gì, ⛔ không làm dòng ⚠ biến mất.</div>'+
  ((can('tao')||(can('suaNhap')&&n.tt==='nhap'))&&n.tt!=='ketthuc'?'<button class="btn p" data-x="daRa" data-i="'+n.id+'">✓ Đã rà nhân sự'+(ra?' (rà lại)':'')+'</button>':'');
 return s+'</div>';
}

function secHS(n){
 let s='<div class="wsh"><h2>⑥ HỌC SINH VÀO LỚP <span class="st2 b">🆕</span></h2><span class="pill">chỉ chiếu · làm dần (N3)</span><span class="spacer" style="flex:1"></span></div><div class="wsb">';

  (can('kichhoat')?'Bấm <button class="btn xs p" data-x="mKichHoat" data-i="'+n.id+'">⑤ ✓ Tạo hồ sơ năm học</button> khi sẵn sàng.':'')+'</div></div>';
 const h=hsvl(n);
 const R_=(ten,m,f,x,dien)=>{
  if(!x.dung)return '<div class="ckr"><div class="ic">·</div><div class="nm">'+ten+'</div><div class="ds" style="color:var(--ink3)">không dùng ở năm này'+(m==='M1.9'?' — chỉ năm triển khai đầu (TN-7)':' — năm triển khai đầu đi một nguồn M1.9 (TN-7)')+'</div><div></div></div>';
  if(!coX(f))return '<div class="ckr usr"><div class="ic">🔒</div><div class="nm">'+ten+'</div><div class="ds">Bạn không có quyền xem <code>'+f+'</code> ở '+m+' — ⛔ không phải «đã xong»</div><div></div></div>';
  const ok=x.can&&x.da>=x.can;
  return '<div class="ckr '+(ok?'':(x.can?'wr':''))+'"><div class="ic">'+(ok?'✅':(x.can?'◐':'○'))+'</div><div class="nm">'+ten+'</div><div class="ds"><b>'+(x.da||0).toLocaleString('vi')+' / '+(x.can||0).toLocaleString('vi')+'</b> em đã vào lớp — thuộc diện: '+dien+
   (x.ds&&x.ds.length?'<br><i>'+x.ds.slice(0,5).map(e=>esc(e.hs+' '+e.tu+' → '+e.vao)).join(' · ')+'</i>':'')+'</div><div>'+dlink(m)+'</div></div>'};
 s+='<div class="info">Xếp học sinh vào lớp là việc của <b>ba menu chủ</b> — mục này chỉ đếm và dẫn đường, ⛔ không thao tác tại chỗ. <b>Chặn 🚀 Bắt đầu năm học</b> (F6 dòng 10 · R84), ⛔ không chặn «Tạo hồ sơ». Một em vào lớp qua bất kỳ nguồn nào ⇒ ⛔ <b>↩ Đưa về Nháp</b>.</div>'+
  '<div class="ck">'+R_('Kết chuyển — M3.3','M3.3','m3.3.ket_chuyen_sang_nam_sau',h.kc,'đã có kết luận lên lớp ở năm liền trước (trừ khối cuối cấp)')+
  R_('Tuyển sinh đầu cấp — M1.4','M1.4','m1.4.phan_lop_hs_moi',h.ts,'đã xác nhận nhập học ở các đợt gắn năm')+
  R_('Nhập danh sách — M1.9','M1.9','m1.9.xep_lop',h.nhap,'trong các lô đã nhập cho năm')+'</div>';
 if(n.tt==='saptoi')s+='<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn xs demo" data-x="glKC" data-i="'+n.id+'">⚡ Giả lập: M3.3 kết chuyển 1 em (6A1 → 7A1)</button>'+
  '<span style="font-size:11px;color:var(--ink3);align-self:center">demo — mô phỏng một menu khác ghi vào năm, để thử ↩ Đưa về Nháp bị chặn</span></div>';
 return s+'</div>';
}

/* ----- KHOI «VIEC TIEP THEO» — chi ho so Sap toi (N6 · §7.10) ----- */

/* =================================================================================
   DEEP-LINK VAO M10.1 — them boi phien P9B (14/9/2026), chi THEM tep nay, khong sua tep P9A.
   /M10.1?ctx={ma_nam|ten_nam}&muc={thoi_gian|to_chuc|nhan_su|lop|hoc_sinh|dieu_kien}[&khoi=a|b|c][&view=muctieu][&lop={ten_lop}]
      [&action={sua|tao_ho_so|bat_dau_nam_hoc|dua_ve_nhap}]&return={menu-goc}   (TNHM-1A v3.2 — so cu muc=1..7 van chay, §7.11)
   (dinh dang o M10.1 §13 — dich moi cua moi deep-link tab ②–⑥ cu cua M10.2)
   Demo: M10.1 ⇄ M10.2 dieu huong that giua hai tep; menu khac van chi bao duong dan.
   ================================================================================= */
(function(){
 const T=new URLSearchParams(location.search);
 const TEP={'M10.2':'M10.2-Co-cau-to-chuc.html'};
 const TEN={'M10.2':'Thông tin trường'};
 const VAI={FULL:'FULL',HT:'HT',PHT_DT:'PHT_DT',PHT_CM:'PHT_CM',IT_Admin:'IT',IT:'IT',GVBM:'GV',GV:'GV'};
 const vai=VAI[T.get('vai')||''];
 if(vai&&ROLE[vai]){role=vai;$$('.rb[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===role))}
 const ctx=T.get('ctx');
 const n=ctx?(namBy(ctx)||NAM.filter(x=>x.ten===ctx)[0]):null;
 /* TNHM-1A — TN-2: muc= theo TEN (thoi_gian|to_chuc|nhan_su|lop|hoc_sinh|dieu_kien) [&khoi=a|b|c];
    so cu 1..7 VAN CHAY qua bang tra (app.60 tuMuc — M10.1 §7.11). Ten la / so ngoai 1..7 ⇒ muc mac dinh + dai bao, ⛔ khong im lang */
 const mRaw=T.get('muc'),km=tuMuc(mRaw,T.get('khoi'));
 if(n&&(n.tt!=='nhap'||can('xemNhap'))){
  V.mo=n.id;V.namHeader=n.id;V.tao=false;
  V.muc=km!=null?km:(n.tt==='nhap'&&buocDo(n)?buocDo(n):3);
  if(km===undefined)V.dlLa=mRaw;
  if(V.muc===3&&T.get('view')==='muctieu')V.m3view='mt';
  const lt=T.get('lop');
  if(V.muc===6&&lt){const l=cfgOf(n).lop.filter(x=>x.ten===lt)[0];if(l)V.m6lop=l.id}
  const ac=T.get('action');
  V.edit=ac==='sua'&&typeof V.muc==='number'&&canMuc(n,V.muc)&&mucGhi(n,'mot')!=='lock';
  /* action= ba thao tac vong doi — CHI MO HOP, ⛔ khong tu thuc hien (M10.1 §7.11) */
  if(ac==='tao_ho_so'||ac==='dua_ve_nhap'||ac==='bat_dau_nam_hoc')setTimeout(function(){
   if(!can(ac==='bat_dau_nam_hoc'?'batdau':'kichhoat')){toast('🔒 Thao tác <b>'+ac+'</b> chỉ Hiệu trưởng — không mở hộp');return}
   if(ac==='tao_ho_so'&&n.tt==='nhap')mKichHoat(n.id);
   else if(ac==='dua_ve_nhap'&&n.tt==='saptoi')mVeNhap(n.id);
   else if(ac==='bat_dau_nam_hoc'&&n.tt==='saptoi')mBatDau(n.id);
   else toast('Thao tác <b>'+ac+'</b> không hợp với trạng thái <b>'+TT[n.tt][0]+'</b> của hồ sơ '+esc(n.ten));},0);
 }
 const tu=T.get('return');
 /* dai "mo tu menu kia" — dat tren cung, ve lai sau moi lan render */
 const _render=render;
 render=function(){
  _render();
  if(V.dlLa&&V.mo){const c=$('#content');if(c&&!c.querySelector('.dlla'))c.insertAdjacentHTML('afterbegin','<div class="scope dlla" style="margin:0 0 6px;border-left-color:var(--amber)">⚠ Tham số <code>muc='+esc(V.dlLa)+'</code> không nhận ra — mở mục mặc định (như không có tham số). Tên hợp lệ: thoi_gian · to_chuc · nhan_su · lop · hoc_sinh · dieu_kien (số cũ 1–7 vẫn chạy)</div>')}
  if(!tu||!TEP[tu])return;
  const c=$('#content');if(!c||c.querySelector('.dlvao'))return;
  c.insertAdjacentHTML('afterbegin','<div class="scope dlvao" style="margin:0 0 6px;border-left-color:#7c3aed">↩ Mở từ <b>'+tu+' '+TEN[tu]+'</b>'+
   ' — deep-link <code>'+esc(location.search)+'</code><span class="spacer" style="flex:1"></span>'+
   '<button class="btn xs" data-x="dlVe">↩ Quay lại '+tu+'</button></div>');
 };
 ACT.dlVe=function(){location.href=TEP[tu]+'?tab='+(T.get('rtab')==='mon'?'danh_muc_mon':'truong')+'&ctx='+(V.mo||V.namHeader)+'&vai='+role};
 /* ↗ M10.2 tu M10.1 → mo that tab Danh muc mon, kem duong ve dung muc dang dung */
 const _dl=ACT.dl;
 ACT.dl=function(el){
  if(el.dataset.m!=='M10.2')return _dl(el);
  /* CCTT — muc ② ⑤ tro sang tab ③ (diem_truong · he_dao_tao) / tab ④ (to_bo_mon) cua M10.2; action=tao chi vai co T (dlM102) */
  const tab=el.dataset.tab||'danh_muc_mon',act=el.dataset.act?'&action='+el.dataset.act:'';
  location.href=TEP['M10.2']+'?tab='+tab+act+'&return=M10.1&rctx='+(V.mo||V.namHeader)+(V.mo&&typeof V.muc==='number'?'&rmuc='+V.muc:'')+'&vai='+role;
 };
 /* O ghi ho ＋ Tao mon rieng (buoc ④) — CUNG LUAT voi form o M10.2 (M10.2 R8, chot 14/9/2026):
    ten trung mot mon CHUAN (bo dau, bo khoang trang) → ⚠ nghi trung, bam lan hai moi tao */
 const chuan=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]/g,'');
 const _tao=ACT.doTaoMon;
 ACT.doTaoMon=function(el){
  const ten=($('#tmTen')||{value:''}).value.trim();
  const tr=MON.filter(m=>!m.cua&&chuan(m.ten)===chuan(ten))[0];
  if(tr&&el&&!el.dataset.ok){el.dataset.ok='1';el.textContent='Vẫn tạo';
   $('#mb').insertAdjacentHTML('afterbegin','<div class="danger">⚠ <b>Nghi trùng môn chuẩn</b> — danh mục M10.2 đã có <b>'+esc(tr.ten)+'</b> ('+tr.ma+', CT GDPT). '+
    'Có phải bạn định <b>＋ Chọn từ danh mục môn</b>? Tạo môn riêng trùng tên thì nó <b>tự mang Của trường</b> và <b>không vào học bạ</b>. Bấm <b>Vẫn tạo</b> nếu đúng là môn khác.</div>');return}
  return _tao(el);
 };
 render();
})();
</script>
</body>
</html>
