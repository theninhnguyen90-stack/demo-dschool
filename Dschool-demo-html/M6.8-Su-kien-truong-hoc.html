<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.8 Sự kiện trường học — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}
.tg.w{background:var(--amber-soft);color:var(--amber)}
.tg.o{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.tg.n{background:var(--bg);color:var(--ink2)}
.tg.p{background:#fce7f3;color:#9d174d}
/* ★ v2.0 — hàng ô tích chọn nhóm nhận thông báo */
.ck{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:12.5px;cursor:pointer}
.ck input{width:15px;height:15px;flex:0 0 auto;cursor:pointer}
.ck input:disabled{cursor:default}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.cell{width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;text-align:right;font:inherit;font-size:12.5px}
.cell:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:6px;border-radius:1px;display:block}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}

.empty{padding:38px;text-align:center;color:var(--ink3)}

.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}

/* --- rieng M6.1 --- */

<script>
/* ========== TIỆN ÍCH ========== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const THU=['CN','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const d2k=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const k2d=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const d2s=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
const k2s=k=>d2s(k2d(k));

/* ══════════════════════════════════════════════════════════════════
   M6.8 — SỰ KIỆN TRƯỜNG HỌC
   ★ Module nhẹ nhất Nhóm 6 về nghiệp vụ, nhưng chạm một thứ nặng:

   ══════════════════════════════════════════════════════════════════ */

 duc :['Trần Minh Đức','Tài khoản rà soát','A'],
 huy :['Nguyễn Quang Huy','Hiệu trưởng','A'],

 nga :['Vũ Hồng Nga','Văn thư','A'],

};
const tenNS=m=>(NS[m]||['?','?','A'])[0];
const cdNS =m=>(NS[m]||['?','?','A'])[1];
const dtNS =m=>(NS[m]||['?','?','A'])[2];

/* ══════════════════════════════════════════════════════════════════

   Không phải «ai được tạo sự kiện» mà là «ai được tạo LOẠI NÀO».
   PHT Chuyên môn tạo được lễ tổng kết nhưng không tạo được hội nghị
   cán bộ — đó là việc của Tổ chức nhân sự.
   ══════════════════════════════════════════════════════════════════ */
const LOAI_SK={
 le    :{ten:'Ngày lễ · kỷ niệm',c:'p',tao:['HT','PDT','TPT']},
 hoctap:{ten:'Học tập · nghi lễ nhà trường',c:'b',tao:['HT','PCM','PDT']},
 thidua:{ten:'Thi đua · phong trào',c:'g',tao:['HT','PCM','PDT','TPT']},
 ph    :{ten:'Phụ huynh',c:'w',tao:['HT','PCM','PDT']},
 chuyenmon:{ten:'Chuyên môn · nội bộ',c:'c',tao:['HT','PCM','TCNS']},
 nhansu:{ten:'Nhân sự · công đoàn',c:'a',tao:['HT','TCNS']},
 dotxuat:{ten:'Đột xuất',c:'r',tao:['HT','PDT']}
};

/* ── Vai ── */
const ROLES={
 FULL:{ma:'duc', cd:'🔓 Đủ quyền (demo)',sc:'School',dt:null,
   q:['xem','tao','sua','xoa','cauhinh','xuat','xemAll'],},
 HT  :{ma:'huy', cd:'Hiệu trưởng',sc:'School',dt:null,
   q:['xem','tao','sua','xoa','xuat','xemAll'],},
 PCM :{ma:'son', cd:'PHT Chuyên môn',sc:'School',dt:null,
   q:['xem','tao','sua','xuat','xemAll'],},
 PDT :{ma:'huong',cd:'PHT Điểm trường A',sc:'Branch',dt:'A',
   q:['xem','tao','sua'],},
 TCNS:{ma:'lien',cd:'Tổ chức nhân sự',sc:'School',dt:null,
   q:['xem','tao','sua','xemAll','xuat'],},   /* ★ 7/9/2026: §9 vốn ghi TCNS xuất được, demo thiếu — đồng bộ */
 TPT :{ma:'tuan',cd:'Tổng phụ trách Đội',sc:'School',dt:null,
   q:['xem','tao','sua'],},
 VT  :{ma:'nga', cd:'Văn thư',sc:'School',dt:null, q:['xem','xuat'],}   /* ★ G chốt 7/9/2026 — Văn thư XUẤT được để làm hồ sơ lưu; vẫn không tạo, không sửa */
};
let role='FULL', ST={dt:'ALL',tab:null,cur:null,chip:'all',thang:'2026-12'};
const R=()=>ROLES[role];
const can=q=>R().q.includes(q);
const toiLa=()=>R().ma;
const dtHieuLuc=()=>R().sc==='School'?ST.dt:R().dt;
const dtThuc=()=>{const d=dtHieuLuc(); return d==='ALL'?'A':d};
/* loại sự kiện vai này tạo được */
const loaiTaoDuoc=()=>can('tao')?Object.keys(LOAI_SK).filter(k=>LOAI_SK[k].tao.includes(role)
  ||role==='FULL'):[];

const CFG={
 /* ⛔ `nhacTruoc` ĐÃ BỎ HẲN — chốt 7/9/2026 (điểm H).

      📬 — nên người tổ chức không thấy nó, và nhắc tay lần nữa. */
 canRaAnh:true      /* bắt buộc xác nhận đã rà ảnh trước khi publish có ảnh */
};

/* ══════════════════════════════════════════════════════════════════
   ★★ DANH SÁCH HỌC SINH KHÔNG ĐỒNG Ý ĐĂNG ẢNH
   Chiếu từ M1.1. Đây là thứ tài liệu nguồn hoàn toàn bỏ trống, mà nó
   quyết định việc một tấm ảnh có được đăng hay không.
   Căn cứ: BLDS 2015 Đ.32 (dùng hình ảnh cá nhân phải được đồng ý;
   người dưới 15 tuổi phải được cha mẹ đồng ý) · Luật Trẻ em 2016.
   ══════════════════════════════════════════════════════════════════ */
const KHONG_DANG_ANH=[
 {ten:'Nguyễn Gia Bảo',lop:'6A1',dt:'A',ghi:'Cha mẹ không đồng ý — ghi nhận khi nhập học'},
 {ten:'Trần Thị Khánh Ly',lop:'7A1',dt:'A',ghi:'Cha mẹ không đồng ý'},
 {ten:'Lê Minh Quân',lop:'9A1',dt:'A',ghi:'Cha mẹ rút lại đồng ý — 12/2026'},
 {ten:'Phạm Thu Trang',lop:'6B1',dt:'B',ghi:'Cha mẹ không đồng ý'},
 {ten:'Hoàng Đức Anh',lop:'8B1',dt:'B',ghi:'Hoàn cảnh gia đình — đề nghị của cha mẹ'}
];
const khongDangAnhCua=dt=>KHONG_DANG_ANH.filter(x=>dt==='ALL'||x.dt===dt);

/* ══════════════════════════════════════════════════════════════════
   PHẠM VI PUBLISH — bao nhiêu PHỤ HUYNH thấy sự kiện
   ★ 7/9/2026 (ràng buộc 20e): trường này KHÔNG cắt gì cho nhân sự.

   ══════════════════════════════════════════════════════════════════ */
const PUBLISH={

/* ══════════════════════════════════════════════════════════════════

   Ràng buộc 20f: hộp Gửi thông báo CHỈ CHÀO nhóm PHỤ HUYNH nằm trong
   phạm vi hiển thị của sự kiện. Ràng buộc 20e: nhóm NHÂN SỰ luôn chào đủ,

   kiện không cắt gì cho nhân sự.
   ★ Khối giao với điểm trường (không phải hợp): sự kiện hiển thị ở
     Điểm trường A thì «khối 9» nghĩa là khối 9 CỦA ĐIỂM A.
   ══════════════════════════════════════════════════════════════════ */
const KHOI=[6,7,8,9];
const PH_SO={A:{6:68,7:70,8:66,9:62}, B:{6:46,7:44,8:45,9:44}, C:{6:27,7:26,8:25,9:26}};
const NS_SO={A:38,B:24,C:13};
const phDT=d=>KHOI.reduce((a,k)=>a+PH_SO[d][k],0);
/* điểm trường nào có phụ huynh thấy được sự kiện này */
const dtThayDuoc=e=>e.pub==='truong'?Object.keys(DT):e.pub==='dt'?[e.dt]:[];

function nhomNhan(e){
 const pdt=dtThayDuoc(e), g=[];
 if(pdt.length){
  g.push({id:'ph:all',loai:'ph',so:pdt.reduce((a,d)=>a+phDT(d),0),

  if(pdt.length>1) pdt.forEach(d=>g.push({id:'ph:dt:'+d,loai:'ph',so:phDT(d),ten:'Phụ huynh '+DT[d]}));
  KHOI.forEach(k=>g.push({id:'ph:k:'+k,loai:'ph',so:pdt.reduce((a,d)=>a+PH_SO[d][k],0),
   ten:'Phụ huynh khối '+k+(pdt.length>1?' — toàn trường':' — '+DT[pdt[0]])}));
 }
 const ndt=R().sc==='Branch'?[R().dt]:Object.keys(DT);

 if(!e.anh.length||!denPH(e.pub)) return null;

}

function tongHopLoai(ds){
 const g={};
 Object.keys(LOAI_SK).forEach(k=>g[k]={n:0,chi:0,anh:0});
 ds.forEach(e=>{if(e.huy) return; g[e.loai].n++; g[e.loai].chi+=e.chi; g[e.loai].anh+=e.anh.length});
 return g;
}
function tongHopThang(ds){
 const g={};
 ds.forEach(e=>{if(e.huy) return; const k=e.tu.slice(0,7);
  (g[k]=g[k]||{n:0,chi:0}); g[k].n++; g[k].chi+=e.chi});
 return g;
}

function veVet(e){
 return '<div class="tbw" style="margin-top:11px"><div class="ch">Vết xử lý</div><table>'
  +'<tr><th style="width:104px">Ngày</th><th>Việc</th><th style="width:160px">Bởi</th></tr>'
  +(e.ls||[]).map(([a,b,c])=>'<tr><td>'+k2s(a)+'</td><td>'+esc(b)+'</td><td>'+esc(tenLS(c))+'</td></tr>').join('')
  +'</table></div>';
}

/* ══════════════════════════════════════════════════════════════════
   TAB 2 — LỊCH SỰ KIỆN
   ★ Danh sách trả lời «có những sự kiện gì»; lịch trả lời «tháng này
     dày hay thưa, có ngày nào chồng nhau». Hai câu khác nhau.
   ══════════════════════════════════════════════════════════════════ */
const THANG=['01','02','03','04','05','06','07','08','09','10','11','12'];
function veLich(){
 const ds=skTrongPhamVi().filter(e=>!e.huy&&e.pub!=='nhap');
 const [y,m]=ST.thang.split('-').map(Number);
 const dau=new Date(y,m-1,1), so=new Date(y,m,0).getDate();
 const lech=(dau.getDay()+6)%7;   /* Thứ Hai đầu tuần */
 let h=scopeBar();

 /* thanh tháng của năm học */
 const ths=[]; for(let i=0;i<10;i++){const d=new Date(2026,8+i,1); ths.push(d2k(d).slice(0,7))}
 h+='<div class="daybar">'+ths.map(k=>{const n=ds.filter(e=>e.tu.slice(0,7)===k).length;
   return '<button class="chip'+(ST.thang===k?' on':'')+'" data-thang="'+k+'">Tháng '+(+k.slice(5))
    +'/'+k.slice(0,4)+(n?' <b>'+n+'</b>':'')+'</button>'}).join('')+'</div>';

 h+='<div class="tbw"><div class="ch">Lịch tháng '+m+'/'+y+' <span class="tg b">'
  +ds.filter(e=>e.tu.slice(0,7)===ST.thang).length+' sự kiện</span></div><div style="padding:11px">';
 h+='<div class="calh">'+['T2','T3','T4','T5','T6','T7','CN'].map(x=>'<div>'+x+'</div>').join('')+'</div>';
 h+='<div class="cal">';
 for(let i=0;i<lech;i++) h+='<div class="cald mo"></div>';
 for(let d=1;d<=so;d++){
  const k=y+'-'+p2(m)+'-'+p2(d);
  const evs=ds.filter(e=>e.tu<=k&&k<=e.den);
  h+='<div class="cald'+(k===HOMNAY?' hom':'')+'"><div class="dn">'+d+(k===HOMNAY?' •':'')+'</div>'
   +evs.map(e=>'<div class="ev tg '+LOAI_SK[e.loai].c+'" data-sk2="'+e.id+'" title="'+esc(e.ten)+'">'
     +esc(e.ten.length>26?e.ten.slice(0,25)+'…':e.ten)+'</div>').join('')
   +'</div>';
 }
 h+='</div></div>';
 /* ngày có nhiều sự kiện */
 const dem={};
 ds.forEach(e=>{if(e.tu.slice(0,7)===ST.thang){(dem[e.tu]=dem[e.tu]||[]).push(e)}});
 const chong=Object.keys(dem).filter(k=>dem[k].length>1);
 h+='<div class="lgd">'+Object.keys(LOAI_SK).map(k=>'<span class="chip"><span class="tg '
  +LOAI_SK[k].c+'">'+LOAI_SK[k].ten.split(' · ')[0]+'</span></span>').join('')+'</div></div>';
 if(chong.length) h+='<div class="warn"><b>📌 '+chong.length+' ngày có nhiều hơn một sự kiện.</b> '
  +chong.map(k=>k2s(k)+': <b>'+dem[k].length+'</b> sự kiện').join(' · ')
  +'<br>Không sai — nhưng đáng nhìn trước khi xếp thêm việc vào ngày đó.</div>';
 h+=dnote('Lịch <b>chỉ hiện sự kiện đã công bố</b> — nháp và đã hủy không chiếm chỗ trên lịch, '
  +'vì lịch là thứ người khác dựa vào để xếp việc của mình.<br>'
  +'Bấm một ô sự kiện để mở chi tiết ở tab 1.');
 return h;
}

 const tongChi=ds.reduce((a,e)=>a+e.chi,0), tongAnh=ds.reduce((a,e)=>a+e.anh.length,0);
 const daQua=ds.filter(e=>giaiDoan(e)==='qua').length;
 let h=scopeBar();
 h+='<div class="frow" style="margin-bottom:12px">'
  +[['Tổng số sự kiện',ds.length,'c'],['Đã diễn ra',daQua,'o'],
    ['Tổng chi cả năm',vnd(tongChi),'b'],['Tổng số ảnh',tongAnh,'w'],
    ['Chưa hoàn tất hồ sơ',chuaXong().length,chuaXong().length?'r':'o']]
   .map(([a,b,c])=>'<div class="card"><div class="cb"><div class="xs">'+a+'</div>'
    +'<div class="num '+c+'" style="font-size:20px;font-weight:800">'+b+'</div></div></div>').join('')+'</div>';

 const mx=Math.max(1,...Object.values(gl).map(v=>v.chi));
 h+='<div class="tbw" style="margin-bottom:12px"><div class="ch">Theo loại sự kiện'
  +'<span class="sp"></span>'+(can('xuat')?'<button class="btn xs" id="xuatBC">📤 Xuất cho Kế toán</button>':'')+'</div><table>'
  +'<tr><th>Loại</th><th class="num">Số sự kiện</th><th class="num">Tổng chi</th><th class="num">Ảnh</th><th style="width:34%"></th></tr>'
  +Object.keys(LOAI_SK).map(k=>{const v=gl[k];
    return '<tr'+(v.n?'':' class="rorow"')+'><td><span class="tg '+LOAI_SK[k].c+'">'+LOAI_SK[k].ten+'</span></td>'
     +'<td class="num">'+(v.n||'—')+'</td><td class="num">'+(v.chi?vnd(v.chi):'—')+'</td>'
     +'<td class="num">'+(v.anh||'—')+'</td>'
     +'<td>'+(v.chi?'<div style="height:12px;border-radius:6px;background:var(--brand);width:'
       +Math.round(v.chi/mx*100)+'%"></div>':'')+'</td></tr>'}).join('')
  +'<tr class="totrow"><td><b>Tổng</b></td><td class="num"><b>'+ds.length+'</b></td>'
  +'<td class="num"><b>'+vnd(tongChi)+'</b></td><td class="num"><b>'+tongAnh+'</b></td><td></td></tr>'
  +'</table></div>';

 const ks=Object.keys(gt).sort(), mt=Math.max(1,...ks.map(k=>gt[k].chi));
 h+='<div class="tbw" style="margin-bottom:12px"><div class="ch">Theo tháng</div><table>'

  +ks.map(k=>{const v=gt[k];
    return '<tr><td><b>Tháng '+(+k.slice(5))+'/'+k.slice(0,4)+'</b></td>'
     +'<td class="num">'+v.n+'</td><td class="num">'+(v.chi?vnd(v.chi):'—')+'</td>'
     +'<td>'+(v.chi?'<div style="height:12px;border-radius:6px;background:var(--brand);width:'
       +Math.round(v.chi/mt*100)+'%"></div>':'')+'</td></tr>'}).join('')
  +'</table></div>';

 /* ★ Theo KHỐI LIÊN QUAN — chỉ làm được vì khối nay là trường có cấu trúc.
    Khi khối còn nằm trong `Thành phần` dạng chữ tự do thì bảng này không tồn tại. */
 const coKhoi=ds.filter(e=>(e.khoi||[]).length);
 h+='<div class="tbw" style="margin-bottom:12px"><div class="ch">Theo khối liên quan '
  +'<span class="tg a">mới</span><span class="sp"></span>'
  +'<span class="xs">một sự kiện gắn nhiều khối thì đếm ở mọi khối đó</span></div><table>'
  +'<tr><th>Khối</th><th class="num">Số sự kiện</th><th class="num">Tổng chi</th>'
  +'<th class="num">Đã báo</th><th>Sự kiện</th></tr>'
  +KHOI.map(k=>{const sk=ds.filter(e=>(e.khoi||[]).includes(k));
    const tb=sk.reduce((a,e)=>a+e.tb.length,0);
    return '<tr'+(sk.length?'':' class="rorow"')+'><td><b>Khối '+k+'</b> '
     +'<span class="xs">'+vn(Object.keys(DT).reduce((a,d)=>a+PH_SO[d][k],0))+' phụ huynh</span></td>'
     +'<td class="num">'+(sk.length||'—')+'</td>'
     +'<td class="num">'+(sk.reduce((a,e)=>a+e.chi,0)?vnd(sk.reduce((a,e)=>a+e.chi,0)):'—')+'</td>'
     +'<td class="num">'+(tb||'—')+'</td>'
     +'<td class="xs">'+(sk.map(e=>esc(e.ten)).join(' · ')||'—')+'</td></tr>'}).join('')
  +'<tr class="totrow"><td><b>Không gắn khối</b> <span class="xs">sự kiện chung</span></td>'
  +'<td class="num"><b>'+(ds.length-coKhoi.length)+'</b></td>'

  modal('➕ Tạo sự kiện','<div class="warn"><b>Vai của bạn không tạo được loại sự kiện nào.</b></div>',
   '<button class="btn" data-mb="close">Đóng</button>'); return;
 }
 ST.f=e?{sua:e.id,ten:e.ten,loai:e.loai,dt:e.dt,tu:e.tu,den:e.den,noi:e.noi,tp:e.tp,mota:e.mota,pub:e.pub,
    khoi:[...(e.khoi||[])],bao:false,baoAuto:false,baoNoi:''}
  :{sua:null,ten:'',loai:lt[0],dt:R().sc==='Branch'?R().dt:'ALL',tu:HOMNAY,den:HOMNAY,
    noi:'',tp:'',mota:'',pub:'nhap',khoi:[]};
 ve();
 function ve(){
  const f=ST.f;
  const dsLoai=f.sua?Object.keys(LOAI_SK):lt;
  const trung=trungNgay(f.tu,f.den,f.dt,f.sua);
  let b='<label class="lbl">Tên sự kiện <span style="color:var(--red)">*</span></label>'
   +'<input class="fldi" id="fTen" value="'+esc(f.ten)+'" placeholder="VD: Lễ tổng kết năm học 2026-2027">';
  b+='<div class="frow"><div><label class="lbl">Loại sự kiện</label><select class="fldi" id="fLoai">'
   +dsLoai.map(k=>'<option value="'+k+'"'+(f.loai===k?' selected':'')+'>'+LOAI_SK[k].ten+'</option>').join('')+'</select></div>'
   +'<div><label class="lbl">Phạm vi</label><select class="fldi" id="fDT">'
   +(R().sc==='Branch'?'<option value="'+R().dt+'">'+DT[R().dt]+'</option>'
     :'<option value="ALL"'+(f.dt==='ALL'?' selected':'')+'>Toàn trường</option>'
      +Object.keys(DT).map(k=>'<option value="'+k+'"'+(f.dt===k?' selected':'')+'>'+DT[k]+'</option>').join(''))
   +'</select></div></div>';
  if(!f.sua&&lt.length<Object.keys(LOAI_SK).length)
   b+='<div class="ro">Danh sách loại <b>chỉ hiện loại vai bạn tạo được</b> — '
    +'không phải mọi loại rồi khóa bớt. Loại khác thuộc vai khác, xem tab Cấu hình.</div>';
  b+='<div class="frow"><div><label class="lbl">Từ ngày</label>'
   +'<input class="fldi" type="date" id="fTu" value="'+f.tu+'"></div>'
   +'<div><label class="lbl">Đến ngày</label><input class="fldi" type="date" id="fDen" value="'+f.den+'"></div></div>';
  if(f.den<f.tu) b+='<div class="danger">Ngày kết thúc <b>trước</b> ngày bắt đầu.</div>';
  else if(trung.length) b+='<div class="warn"><b>📌 '+trung.length+' sự kiện khác trùng khoảng ngày này:</b><br>'
   +trung.map(x=>'<b>'+esc(x.ten)+'</b> — '+k2s(x.tu)+(x.den!==x.tu?' → '+k2s(x.den):'')
     +' <span class="pill">'+(x.dt==='ALL'?'toàn trường':DT[x.dt])+'</span>').join('<br>')
   +'<br><span class="xs">Không sai — nhưng đáng nhìn trước khi chốt ngày.</span></div>';
  b+='<label class="lbl">Địa điểm <span style="color:var(--red)">*</span></label>'
   +'<input class="fldi" id="fNoi" value="'+esc(f.noi)+'" placeholder="VD: Sân trường Điểm trường A">';
  b+='<label class="lbl">Thành phần tham gia</label>'
   +'<input class="fldi" id="fTp" value="'+esc(f.tp)+'" placeholder="VD: Toàn thể giáo viên, học sinh và phụ huynh">';
  /* ★ Khối liên quan — NHÃN, không phải quyền xem (điểm I, chốt 7/9/2026) */

   +'<div class="frow" style="gap:14px;padding:2px 0 4px">'
   +KHOI.map(k=>'<label class="ck" style="padding:0"><input type="checkbox" data-fk="'+k+'"'
     +((f.khoi||[]).includes(k)?' checked':'')+'> Khối '+k+'</label>').join('')+'</div>'
   +'<div class="ro">⛔ <b>Trường này KHÔNG quyết định ai thấy sự kiện</b> — quyền xem vẫn hoàn toàn do '
   +'<b>Phạm vi hiển thị</b> ở dưới. Gắn khối chỉ để: hộp <b>📣 Gửi thông báo</b> <b>tích sẵn đúng khối</b>, '
   +'thẻ sự kiện đeo <b>chip khối</b> cho gia đình khối khác khỏi đọc nhầm là việc của mình, và '
   +'<b>Báo cáo</b> gom được theo khối.<br>Để trống nếu sự kiện <b>chung cho cả trường</b>. '
   +'Trước đây khối chỉ nằm trong ô <b>Thành phần</b> dạng chữ — người đọc hiểu, <b>máy thì không</b>.</div>';
  b+='<label class="lbl">Nội dung</label>'
   +'<textarea class="fldi" id="fMota" rows="2">'+esc(f.mota)+'</textarea>';
  b+='<label class="lbl">Phạm vi hiển thị — <b>bao nhiêu phụ huynh thấy sự kiện</b></label>'
   +'<select class="fldi" id="fPub">'
   +Object.keys(PUBLISH).map(k=>'<option value="'+k+'"'+(f.pub===k?' selected':'')+'>'+PUBLISH[k][0]+'</option>').join('')
   +'</select>';
  b+='<div class="ro">Trường này <b>KHÔNG gửi thông báo</b>. Nó chỉ quyết định ai <b>thấy</b> sự kiện '
   +'trên lịch và trên feed App. Gửi thông báo là <b>nút riêng</b> <i>(📣 Gửi thông báo)</i>, bấm được '
   +'<b>nhiều lần</b>, mỗi lần chọn đối tượng nhận riêng và tự soạn nội dung.'
   +(f.sua?'':'<br>Để <b>Chưa triển khai</b> nếu chỉ muốn giữ chỗ — triển khai sau bằng nút <b>🚀 Triển khai</b>.')+'</div>';

     vì ngày là thứ người ta đã ghi vào lịch của mình. */
  if(f.sua){
   const eo=skById(f.sua), dn=nguoiDaNhan(eo), doiNgay=(f.tu!==eo.tu||f.den!==eo.den);
   if(dn.so){

/* ── ★ Ai đã từng nhận thông báo của sự kiện này (gộp, không cộng trùng) ── */
function nguoiDaNhan(e){
 const m={};
 (e.tb||[]).forEach(t=>t.nhom.forEach(n=>{if(!m[n.id]||m[n.id].so<n.so) m[n.id]={...n}}));
 let nhom=Object.values(m);
 const co=i=>nhom.some(n=>n.id===i);
 if(co('ph:all')) nhom=nhom.filter(n=>!n.id.startsWith('ph:')||n.id==='ph:all');
 if(co('ns:all')) nhom=nhom.filter(n=>!n.id.startsWith('ns:dt:'));
 return {nhom,so:nhom.reduce((a,n)=>a+n.so,0)};
}
/* ★ nhóm nào đã nhận mà nay NẰM NGOÀI phạm vi hiển thị hiện tại — ràng buộc 20g
   ⚠ So mã nhóm là KHÔNG ĐỦ: `ph:all` giữ nguyên mã nhưng ĐỔI NGHĨA khi phạm vi
   hẹp lại — «toàn bộ phụ huynh» của sự kiện toàn trường là 549 người, của sự
   kiện một điểm trường chỉ còn 266. Nhóm cũ vẫn phải bị đánh dấu là ngoài
   phạm vi, vì 283 người trong đó nay không mở được sự kiện nữa.
   Nên so cả SỐ NGƯỜI: mã biến mất, HOẶC số cũ lớn hơn số hiện tại. */
function ngoaiPV(e,nhom){
 const by=Object.fromEntries(nhomNhan(e).map(x=>[x.id,x.so]));
 return nhom.filter(n=>by[n.id]===undefined||n.so>by[n.id]);
}
/* bao nhiêu người trong nhóm đã nhận nay KHÔNG còn mở được sự kiện */
function soNgoaiPV(e,nhom){
 const by=Object.fromEntries(nhomNhan(e).map(x=>[x.id,x.so]));
 return nhom.reduce((a,n)=>a+Math.max(0,n.so-(by[n.id]||0)),0);
}

  '<div class="info">Bản xuất kèm <b>mã sự kiện</b> để đối chiếu ngược về đúng sự kiện — '
  +'một dòng chi không truy được về việc nào thì không kê khai được.</div>'
  +'<label class="lbl">Kỳ xuất</label><select class="fldi"><option>Cả năm học '+NAMHOC+'</option>'
  +'<option>Học kỳ 1</option><option>Tháng 12/2026</option></select>'
  +'<label class="lbl">Nội dung</label><select class="fldi">'
  +'<option>Tổng hợp theo loại sự kiện và tổng chi</option>'
  +'<option>Chi tiết từng sự kiện</option></select>'
  +'<label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>'
  +'<select class="fldi"><option>Kế toán kê khai chi phí sự kiện</option>'
  +'<option>Báo cáo Hội đồng trường / UBND</option>'
  +'<option>Báo cáo tổng kết năm học</option></select>'
  +'<div class="ro">Con số ở đây <b>không thay sổ chi M7.5</b> — nó là số để kê khai và đối chiếu.</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="close">Xuất và ghi audit</button>');
}
/* ── 🌐 Đăng tin lên web — deep-link sang M8.5 (v2.7) ──
   M6.8 KHÔNG đăng web: nó chỉ mở màn soạn của M8.5 với sẵn tên, ngày, địa điểm, mô tả và ảnh.
   Bài web do bộ phận truyền thông viết lại cho người đọc ngoài trường, qua duyệt ở M8.5. */
const WEB_T=['FULL','HT','PCM','PDT','TCNS','TPT','VT'];
let MWEB=147;
function moWeb(id){
 const e=skById(id);
 if(e.web){
  modal('🌐 Bài web của sự kiện',
   '<div class="evkv"><div style="flex:1 1 100%"><span>Sự kiện</span><b>'+esc(e.ten)+'</b></div>'
   +'<div><span>Bài web</span><b>'+e.web.ma+'</b></div><div><span>Trạng thái ở M8.5</span><b>'+esc(e.web.tt)+'</b></div>'
   +'<div><span>Tạo ngày</span><b>'+k2s(e.web.ngay)+'</b></div></div>'
   +'<div class="ro">Bản chiếu chỉ đọc 🔗 — soạn, duyệt, đăng, gỡ đều ở <b>M8.5</b>.<br>Deep-link: <code>/M8.5?ctx='+e.web.ma+'&amp;return=M6.8</code></div>',
   '<button class="btn" data-mb="close">Đóng</button><button class="btn p" data-mb="close">Mở ở M8.5</button>');
  return;
 }
 modal('🌐 Đăng tin lên web — '+e.id,
  '<div class="info">Mở màn soạn của <b>M8.5 Trang web trường</b> với sẵn nội dung của sự kiện. '
  +'Bài được <b>viết lại cho người đọc ngoài trường</b> và phải <b>qua duyệt ở M8.5</b> — nút này không đăng gì lên web.</div>'
  +'<div class="evkv"><div style="flex:1 1 100%"><span>Tiêu đề gợi ý</span><b>'+esc(e.ten)+'</b></div>'
  +'<div><span>Ngày</span><b>'+k2s(e.tu)+(e.den!==e.tu?' – '+k2s(e.den):'')+'</b></div><div><span>Địa điểm</span><b>'+esc(e.noi||'—')+'</b></div>'
  +'<div><span>Ảnh mang sang</span><b>'+e.anh.length+' ảnh</b> <span class="xs">— người soạn chọn ảnh nào lên web</span></div></div>'
  +'<div class="ro">Deep-link: <code>/M8.5?action=tao&amp;ctx='+e.id+'&amp;return=M6.8</code></div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="webOK">Tạo bài nháp ở M8.5</button>');
 mfns.bwebOK=()=>{e.web={ma:'WEB-0'+(++MWEB),tt:'Nháp',ngay:HOMNAY};ghiLS(e,'🌐 Tạo bài nháp '+e.web.ma+' ở M8.5 (Đăng tin lên web)');
  closeM();toast('🌐 Đã tạo bài nháp <b>'+e.web.ma+'</b> ở M8.5 — mở «Bài của tôi» để viết tiếp.');render()};
}
function moM63(id){
 const e=skById(id);
 modal('🔗 Liên kết phong trào Đội — Đoàn',
  '<div class="info">Sự kiện thi đua và ngày lễ thường gắn với một <b>đợt phong trào</b> ở <b>M6.14</b>. '
  +'Menu này <b>không sở hữu phong trào</b> — nút này mở M6.14 với sẵn ngữ cảnh.</div>'
  +'<div class="evkv"><div style="flex:1 1 100%"><span>Sự kiện</span><b>'+esc(e.ten)+'</b></div>'
  +'<div><span>Thời gian</span><b>'+k2s(e.tu)+'</b></div></div>'
  +'<div class="ro">Deep-link: <code>/M6.14?ctx='+e.id+'&amp;action=lien-ket-phong-trao&amp;return=M6.8</code></div>',
  '<button class="btn" data-mb="close">Đóng</button><button class="btn p" data-mb="close">Mở M6.14</button>');
}

/* ══════════════════════════════════════════════════════════════════
   RENDER + SỰ KIỆN
   ══════════════════════════════════════════════════════════════════ */
function render(){
 rolebar(); header(); sidebar(); tabs();
 const c=$('#content'); $('#crumb').innerHTML='';
 if(ST.tab==='sk')       c.innerHTML=veDanhSach();
 else if(ST.tab==='lich')c.innerHTML=veLich();
 else if(ST.tab==='bc')  c.innerHTML=veBaoCao();
 else                   {c.innerHTML=veCauHinh(); gCfg();}
 const nn=document.body.classList.contains('nn');
 $('#btnNote').classList.toggle('on',!nn);
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(nn?'TẮT':'BẬT');
 const t=$('#tim'); if(t) t.oninput=()=>{ST.tim=t.value; render();
  const e=$('#tim'); if(e){e.focus(); e.setSelectionRange(e.value.length,e.value.length)}};
}
function doiTab(t){ST.tab=t; ST.cur=null}
function gCfg(){
 const g=(id,f)=>{const el=$(id); if(el) el.onchange=()=>{f(el.value); render();
  toast('⚙️ Đã đổi tham số.')}};
 g('#cfRa',v=>CFG.canRaAnh=v==='1');
}
document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 if(t===$('#mask')){closeM(); return}
 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r; doiTab(null); ST.chip='all';
  ST.dt=R().sc==='School'?'ALL':(R().dt||'A'); render(); return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn'); render(); return}
 const tb=t.closest('#tabs [data-t]'); if(tb){doiTab(tb.dataset.t); render(); return}
 const cp=t.closest('[data-chip]'); if(cp){ST.chip=cp.dataset.chip; ST.cur=null; render(); return}
 const th=t.closest('[data-thang]'); if(th){ST.thang=th.dataset.thang; render(); return}
 if(t.closest('[data-close]')){ST.cur=null; render(); return}
 const s2=t.closest('[data-sk2]'); if(s2){ST.tab='sk'; ST.cur=s2.dataset.sk2; ST.chip='all'; render(); return}
 const sk=t.closest('[data-sk]'); if(sk){ST.cur=sk.dataset.sk; render(); return}
 if(t.id==='taoSK'){moTao(null); return}
 const su=t.closest('[data-sua]'); if(su){moTao(su.dataset.sua); return}
 const ch=t.closest('[data-chi]'); if(ch){moChi(ch.dataset.chi); return}
 const ta=t.closest('[data-themanh]'); if(ta){moThemAnh(ta.dataset.themanh); return}
 const ra=t.closest('[data-raanh]'); if(ra){moRaAnh(ra.dataset.raanh); return}
 const xo=t.closest('[data-xong]'); if(xo){moXong(xo.dataset.xong); return}
 const hu=t.closest('[data-huy]'); if(hu){moHuy(hu.dataset.huy); return}
 const pb=t.closest('[data-pub]'); if(pb){moPub(pb.dataset.pub,false); return}
 const gp=t.closest('[data-gopub]'); if(gp){moPub(gp.dataset.gopub,true); return}
 const gt=t.closest('[data-guitb]'); if(gt){moGuiTB(gt.dataset.guitb); return}
 const xh=t.closest('[data-xoa]'); if(xh){moXoa(xh.dataset.xoa); return}
 const m6=t.closest('[data-m63]'); if(m6){moM63(m6.dataset.m63); return}
 const wb=t.closest('[data-web]'); if(wb){moWeb(wb.dataset.web); return}
 if(t.id==='xuat'){xuat('Xuất danh sách sự kiện'); return}
 if(t.id==='xuatBC'){xuat('Xuất chi phí sự kiện cho Kế toán'); return}
});
$('#hdt').addEventListener('change',()=>{ST.dt=$('#hdt').value; ST.cur=null; render()});
render();

</script>
</body>
</html>
