  }));
  h += KB.K2({
    id: 'dien', tieuDe: '🎯 Diện chính sách — đủ 16 diện của danh mục M1.2', ma: 'HS.06', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Diện chính sách', gomNhom: false, dong,
    link: d => ({ menu: 'M1.2', ctx: 'dien=' + encodeURIComponent(d.dien), nhan: 'Học sinh thuộc diện' }),
    cot: [
      { khoa: 'so', ten: 'Số lượt diện', donVi: 'HS.06', kieu: 'so', nguon: 'm1.2.hoc_sinh_thuoc_dien' },
      { khoa: 'tl', ten: '% trên sĩ số', kieu: 'tile', nguon: 'm1.2.hoc_sinh_thuoc_dien', khongCong: true },
      { khoa: 'mg', ten: 'Được miễn giảm', donVi: 'TC.03', kieu: 'so', nguon: 'm7.4.bao_cao' },
      { khoa: 'tien', ten: 'Tiền miễn giảm', donVi: 'triệu đ', kieu: 'tien', nguon: 'm7.4.bao_cao' }
    ],
    o: (d, c) => {
      if (c.khoa === 'so') return CT.doc('HS.06', PV.thamSo({ dien: d.dien }));
      if (c.khoa === 'mg') return mgCua(d.dien) ? CT.doc('TC.03', PV.thamSo({ dien: d.dien }), 'soEm') : null;
      if (c.khoa === 'tien') return mgCua(d.dien) ? CT.doc('TC.03', PV.thamSo({ dien: d.dien })) : null;
      const k = CT.doc('HS.06', PV.thamSo({ dien: d.dien }));
      const si = CT.doc('HS.01', PV.thamSo());
      if (k.canhBao) return k;
      return Object.assign({}, k, {
        ten: 'Tỉ lệ trên sĩ số', loaiSo: 'DAN_XUAT', donVi: '%', giaTri: tile(k.giaTri, si.giaTri),
        veTrai: { ten: 'Lượt diện của dòng này', giaTri: k.giaTri, donVi: 'lượt' },
        vePhai: { ten: 'Sĩ số đang học', giaTri: si.giaTri, donVi: 'em' }
      });
    },
    duoiBang: '<div class="canh b">🛑 Đơn vị dòng là <b>«em × diện»</b>: <b>'
      + (luot.giaTri == null ? '—' : vn(luot.giaTri)) + ' lượt diện</b> nhưng <b>'
      + (em.giaTri == null ? '—' : vn(em.giaTri)) + ' em</b> — hai số khác nhau là <b>đúng</b>.</div>'
      + '<div class="canh w">🛑 Hai cột miễn giảm phải <b>khớp tab Miễn giảm của M9.7</b> — cùng đọc '
      + '<code>HS.06</code>. <b>Lệch là lỗi.</b> '
      + '<button class="btn xs" data-dl="M9.7" data-dlq="tab=mien_giam">↗ M9.7</button> '
      + '<button class="btn xs" data-dl="M7.4" data-dlq="tab=bao_cao">↗ M7.4</button></div>'
  });

  /* ── khối ♿ KHUYẾT TẬT theo dạng × mức độ — `HS.07` ──────────────── */
  const dongKT = KTDANG.map(x => ({ id: x, ten: x, dang: x }))
    .concat([{ id: '_ck', ten: '⚠ Chưa khai dạng', dang: null }]);
  const cotKT = KTMUC.map(m => ({ khoa: m, ten: m, kieu: 'so', nguon: 'm1.2.hoc_sinh_thuoc_dien' }))
    .concat([{ khoa: '_ck', ten: '⚠ Chưa khai mức độ', kieu: 'so', nguon: 'm1.2.hoc_sinh_thuoc_dien' }]);
  h += KB.K2({
    id: 'kt', tieuDe: '♿ Học sinh khuyết tật học hòa nhập — theo dạng và mức độ', ma: 'HS.07', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Dạng khuyết tật', gomNhom: false, dong: dongKT, cot: cotKT,
    link: d => ({ menu: 'M1.2', ctx: 'dien=' + encodeURIComponent('Học sinh khuyết tật'), nhan: 'Học sinh thuộc diện' }),
    o: (d, c) => CT.doc('HS.07', PV.thamSo({
      loc: h2 => h2.kt && (d.dang ? h2.kt.dang === d.dang : !h2.kt.dang)
        && (c.khoa === '_ck' ? !h2.kt.muc : h2.kt.muc === c.khoa)
    })),
    duoiBang: '<div class="bvdl">⚖ ⛔ Không xuất danh sách, panel ⛔ không hiện dạng · mức độ — '
      + 'dữ liệu sức khỏe của trẻ em.</div>'
      + '<div class="ro">Danh mục 6 dạng × 3 mức độ ở <b>M1.2 ⚙</b> — Luật 51/2010 Đ.3.</div>'
  });
  return h + dnote('<b>Vì sao Σ lượt diện lớn hơn số em.</b> Đơn vị dòng của M1.2 là «em × diện»: '
    + 'một em thuộc hai diện thì đếm hai lượt. Và ⛔ <b>không cộng «Chế độ nhà nước cấp» vào đây</b> — '
    + 'một em thuộc 1 diện, hưởng 3 chế độ, vẫn là <b>1</b> (PHIEU-CSDL-1D E.4).'
    + '<br><b>Vì sao ràng buộc chéo với M9.7 là cố ý.</b> Hai chỗ ra hai số nghĩa là một trong hai '
    + 'đang <b>tự tính</b> thay vì đọc từ điển chỉ tiêu — để nó lộ ra còn hơn để nó nằm im. '
    + 'Tiền ở đây ⛔ không phải số quyết toán; tiền thật ở <b>M7.5</b>.'
    + '<br><b>Vì sao kế toán có tab này nhưng ⛔ không cắt được theo khoản mục.</b> Cắt được thì bảng này '
    + 'thành <b>bảng quyết toán thứ hai</b>, và trường có hai con số khác nhau cho cùng một khoản tiền.'
    + '<br><b>Vì sao danh mục khuyết tật không thuộc menu này.</b> Báo cáo gom theo <b>giá trị mà bản ghi '
    + 'mang</b> và luôn giữ dòng «⚠ chưa khai»; thêm một dạng ở M1.2 thì bảng tự có dòng mới. '
    + 'Ai cần tên kèm dạng thì đi về M1.2 — quyền ở đó quyết định họ thấy gì.');
}

/* ══════════════ TAB 5 · PHỄU TUYỂN SINH ĐẦU CẤP ══════════════════════
   🔄 `TSDC-2B` (21/9/2026) — phễu MỘT luồng của `M1.4` v2.0:
   Chỉ tiêu → Trong danh sách → Đã xác nhận nhập học → Đã phân lớp.
   NGUỒN THEO KHỐI, ⛔ không một nguồn cho cả tab:
   · khối A cộng MỌI đợt của năm = tab `📊 Thống kê tuyển sinh` (`m1.4.thong_ke`),
     riêng bậc Chỉ tiêu là TRƯỜNG của bản ghi đợt (`m1.4.dot_tuyen_sinh`);
   · khối B · C từng đợt = tab `📊 Tổng hợp đợt` — `M1.4` §6.12 dùng quyền của
     `m1.4.dot_tuyen_sinh` (Giáo vụ thấy — `M1.4` §9 điểm 21 ✅).
   Deep-link (D3): vai không có quyền ở feature đích thì ô vẫn bấm được, panel
   ⛔ không hiện lối sang `M1.4`.                                              */
let namTS = '2026-2027';
const TT_M14 = { trongDS: 'all', daXacNhan: 'xn', daPhanLop: 'xn&pl=da', cho: 'cho', hetHan: 'quahan', tuChoi: 'tuchoi',
  tuChoi_giadinh: 'tuchoi&kl=giadinh', tuChoi_truong: 'tuchoi&kl=truong', tuChoi_hethan: 'tuchoi&kl=hethan', noGiayTo: 'xn&no=1' };
/* lối sang tab ✅ Xác nhận nhập học của MỘT đợt, đã lọc sẵn — tham số theo bộ lọc của `M1.4` §6.7 */
const dlXacNhan = (dot, o, them) => !coXD('m1.4.dot_tuyen_sinh') || !TT_M14[o] ? null
  : { menu: 'M1.4', ctx: 'ctx=' + dot + '&tab=xac_nhan&tt=' + TT_M14[o] + (them || ''), nhan: '✅ Xác nhận nhập học' };
function veTab5() {
  const locNam = d => d.nam === namTS;
  const ts = (loc, o, them) => CT.doc('TS.01', PV.thamSoPS(Object.assign({ loc }, them || {})), o);
  const nams = [...new Set(DOTTS.map(d => d.nam))].sort().reverse();
  let h = PV.khoang();
  h += '<div class="pvbar"><span class="pvlb">📅 Năm học tuyển sinh</span>'
    + nams.map(n => '<button class="pvk' + (n === namTS ? ' on' : '') + '" data-nts="' + n + '">' + n + '</button>').join('')
    + '</div>';
  const ds = DOTTS.filter(d => locNam(d) && d.tt !== 'nhap' && trongPV({ dtm: d.dt }));
  const nhap = DOTTS.filter(d => locNam(d) && d.tt === 'nhap' && trongPV({ dtm: d.dt })).length;
  h += daiPV('đợt tuyển sinh', ds.length, DOTTS.filter(d => locNam(d) && d.tt !== 'nhap').length);

  /* khối A — bốn bậc chính + dải phụ, tách hai nguồn */
  const CHINH = 'Bốn bậc chính', PHU = 'Dải phụ — trong danh sách mà chưa xác nhận';
  const BAC = [
    { id: 'chiTieu', ten: '① Chỉ tiêu được giao', nhom: CHINH, ng: 'm1.4.dot_tuyen_sinh' },
    { id: 'trongDS', ten: '② Trong danh sách', nhom: CHINH, tren: 'chiTieu' },
    { id: 'daXacNhan', ten: '③ Đã xác nhận nhập học', nhom: CHINH, tren: 'trongDS' },
    { id: 'daPhanLop', ten: '④ Đã phân lớp', phu: '🔗 M1.9', nhom: CHINH, tren: 'daXacNhan' },
    { id: 'cho', ten: 'Chờ xác nhận', nhom: PHU, tren: 'trongDS' },
    { id: 'hetHan', ten: 'Hết hạn chờ xử lý', phu: 'vẫn xác nhận được', nhom: PHU, tren: 'trongDS' },
    { id: 'tuChoi', ten: 'Từ chối nhập học', phu: 'tách nguồn kết luận ở khối C', nhom: PHU, tren: 'trongDS' },
    { id: 'noGiayTo', ten: 'Còn nợ giấy tờ', phu: 'trong số đã xác nhận', nhom: PHU, tren: 'daXacNhan' }
  ].map(b => Object.assign(b, {
    nguonDong: b.ng || 'm1.4.thong_ke',
    linkDong: () => b.ng ? (coXD(b.ng) ? { menu: 'M1.4', ctx: 'tab=dot&nam=' + namTS, nhan: '📋 Đợt tuyển sinh' } : null)
      : (coXD('m1.4.thong_ke') ? { menu: 'M1.4', ctx: 'tab=thong_ke&nam=' + namTS, nhan: '📊 Thống kê tuyển sinh' } : null)
  }));
  const giaTri = {};
  BAC.forEach(b => { giaTri[b.id] = ts(locNam, b.id).giaTri });
  h += KB.bang({
    id: 'phe', tieuDe: 'A · Phễu tuyển sinh ' + namTS, ma: 'TS.01', chip: 'PS', gomNhom: true,
    moTaKy: 'Cộng mọi đợt đã mở của năm học ' + namTS + (nhap ? ' · ' + nhap + ' đợt Nháp không tính' : ''),
    tenCotDau: 'Bậc của phễu', dong: BAC, tong: false,
    cot: [
      { khoa: 'tong', ten: 'Cả hai nguồn', kieu: 'so' },
      { khoa: 'so', ten: 'Sở phân về', kieu: 'so' },
      { khoa: 'truong', ten: 'Trường tiếp nhận thêm', kieu: 'so' },
      { khoa: 'tlt', ten: 'So với bậc trên', kieu: 'tile', khongCong: true },
      { khoa: 'tlc', ten: 'So với chỉ tiêu', kieu: 'tile', khongCong: true }
    ],
    o: (d, c) => {
      if (c.khoa === 'tong') return ts(locNam, d.id);
      if (c.khoa === 'so' || c.khoa === 'truong') return d.id === 'chiTieu' ? null : ts(locNam, d.id, { nguon: c.khoa });
      const mau = c.khoa === 'tlc' ? (d.nhom === CHINH && d.id !== 'chiTieu' ? 'chiTieu' : null) : d.tren;
      const k = ts(locNam, d.id);
      if (!mau || k.canhBao || !giaTri[mau]) return k.canhBao ? k : null;
      const tenMau = BAC.find(x => x.id === mau).ten;
      return Object.assign({}, k, {
        ten: c.khoa === 'tlc' ? 'Tỉ lệ so với chỉ tiêu' : 'Tỉ lệ so với ' + tenMau.replace(/^. /, ''),
        loaiSo: 'DAN_XUAT', donVi: '%', giaTri: tile(k.giaTri, giaTri[mau]), banGhiGoc: [],
        veTrai: { ten: d.ten, giaTri: k.giaTri, donVi: 'học sinh' },
        vePhai: { ten: tenMau, giaTri: giaTri[mau], donVi: 'học sinh' }
      });
    }
  });

  /* khối B — từng đợt, bung theo HỆ (bảng chỉ tiêu theo hệ, `M1.4` §6.2.2c) */
  const COT_B = [['chiTieu', 'Chỉ tiêu'], ['trongDS', 'Trong danh sách'], ['daXacNhan', 'Đã xác nhận'], ['daPhanLop', 'Đã phân lớp'],
    ['cho', 'Chờ xác nhận'], ['hetHan', 'Hết hạn chờ xử lý'], ['tuChoi', 'Từ chối'], ['noGiayTo', 'Còn nợ giấy tờ']];
  h += KB.K2({
    id: 'dot', tieuDe: 'B · Từng đợt, theo hệ', ma: 'TS.01', chip: 'PS', moTaKy: 'Năm học ' + namTS,
    tenCotDau: 'Hệ', nguon: 'm1.4.dot_tuyen_sinh',
    dong: [].concat(...ds.map(d => d.ct.map(c => ({
      id: d.id + '|' + c.he, ten: c.he + (c.mc ? ' ★' + c.mc : ''), dot: d, he: c.he,
      nhom: d.id + ' · ' + d.ten + ' — ' + DT[d.dt] + ' · ' + TT_DOTTS[d.tt][0]
    })))),
    cot: COT_B.map(([k, t]) => ({ khoa: k, ten: t, kieu: 'so', canhBao: k === 'hetHan' ? x => x.giaTri > 0 : null,
      link: d => d.id === '_tong' ? null : k === 'chiTieu'
        ? (coXD('m1.4.dot_tuyen_sinh') ? { menu: 'M1.4', ctx: 'ctx=' + d.dot.id + '&tab=tong_hop', nhan: '📊 Tổng hợp đợt' } : null)
        : dlXacNhan(d.dot.id, k, '&he=' + encodeURIComponent(d.he)) }))
      .concat([{ khoa: '_tl', ten: 'Tỉ lệ xác nhận', kieu: 'tile', khongCong: true }]),
    o: (d, c) => c.khoa === '_tl'
      ? CT.doc('TS.02', PV.thamSoPS({ loc: x => x.id === d.dot.id, he: d.he }))
      : ts(x => x.id === d.dot.id, c.khoa, { he: d.he }),
    tongRieng: c => c.khoa === '_tl' ? CT.doc('TS.02', PV.thamSoPS({ loc: locNam })) : null
  });

  /* khối C — chênh TRONG DANH SÁCH − ĐÃ XÁC NHẬN, giải bằng phần còn phải liên hệ và
     từ chối theo NGUỒN KẾT LUẬN. Dựng bằng `KB.bang`, ⛔ không bảng tay (mọi ô bấm được). */
  const rows = ds.filter(d => (ts(x => x.id === d.id, 'trongDS').giaTri || 0) > (ts(x => x.id === d.id, 'daXacNhan').giaTri || 0));
  const COT_C = [['cho', 'Chờ xác nhận'], ['hetHan', 'Hết hạn chờ xử lý'], ['tuChoi_giadinh', 'Từ chối — gia đình'],
    ['tuChoi_truong', 'Từ chối — trường kết luận'], ['tuChoi_hethan', 'Từ chối — từ hết hạn']];
  h += KB.bang({
    id: 'chenh', tieuDe: 'C · Trong danh sách mà chưa xác nhận — vì sao', ma: 'TS.01', chip: 'PS',
    moTaKy: 'chênh = chờ + hết hạn + từ chối', tenCotDau: 'Đợt', nguon: 'm1.4.dot_tuyen_sinh',
    chuoiTrong: 'Mọi em trong danh sách của năm học đang xem đã xác nhận nhập học.',
    dong: rows.map(d => ({ id: d.id, ten: d.id + ' · ' + d.ten, phu: DT[d.dt] + ' · ' + TT_DOTTS[d.tt][0], dot: d })),
    cot: [{ khoa: 'chenh', ten: 'Chênh', kieu: 'so',
      link: d => d.id === '_tong' || !coXD('m1.4.dot_tuyen_sinh') ? null
        : { menu: 'M1.4', ctx: 'ctx=' + d.dot.id + '&tab=tong_hop', nhan: '📊 Tổng hợp đợt' } }].concat(COT_C.map(([k, t]) => ({
      khoa: k, ten: t, kieu: 'so', canhBao: k === 'hetHan' ? x => x.giaTri > 0 : null,
      link: d => d.id === '_tong' ? null : dlXacNhan(d.dot.id, k) }))),
    o: (d, c) => {
      const loc = x => x.id === d.dot.id;
      if (c.khoa !== 'chenh') return ts(loc, c.khoa);
      const t = ts(loc, 'trongDS'), x = ts(loc, 'daXacNhan');
      return Object.assign({}, t, {
        ten: 'Chênh trong danh sách − đã xác nhận', loaiSo: 'DAN_XUAT', giaTri: t.giaTri - x.giaTri, banGhiGoc: [],
        veTrai: { ten: 'Trong danh sách', giaTri: t.giaTri, donVi: 'học sinh' },
        vePhai: { ten: 'Đã xác nhận nhập học', giaTri: x.giaTri, donVi: 'học sinh' },
        ghiChu: 'Mỗi em trong phần chênh có trạng thái ở <b>M1.4</b>; lý do từ chối nằm trên từng dòng — báo cáo chỉ chiếu, '
          + '⛔ không có ô nhập lý do ở nhóm 📊 (<code>N4</code>).'
      });
    },
    duoiBang: coXD('m1.4.dot_tuyen_sinh') ? '<div class="ro">Lý do từ chối do <b>M1.4</b> giữ. '

function doMatDoChu() {
  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(n => { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = { tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
