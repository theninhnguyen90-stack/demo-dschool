<html lang="vi">
<head>
<meta charset="utf-8">

<title>M0.1 Bảng điều khiển — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9; --surface:#fff; --line:#e2e8f0; --line2:#cbd5e1;
  --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --brand:#1d4ed8; --brand-soft:#eff6ff;
  --red:#dc2626; --red-soft:#fef2f2;
  --amber:#d97706; --amber-soft:#fffbeb;
  --green:#059669; --green-soft:#ecfdf5;
  --violet:#7c3aed;
}
body{font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--brand);text-decoration:none}

/* ---------- HEADER ---------- */
.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff;color:var(--ink)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700}

/* ---------- LAYOUT ---------- */
.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--line);
  padding:10px 8px;overflow-y:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;
  color:var(--ink2);font-size:13px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .n{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:9px}
.snav.off{opacity:.34;pointer-events:none}

.main{flex:1;padding:18px 22px 40px;min-width:0}
.top{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:700}
.top p{color:var(--ink2);font-size:13px;margin-top:2px}
.ctx{display:flex;gap:6px;margin-top:6px}
.chip{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}

.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.cols.solo{grid-template-columns:1fr}
@media(max-width:1024px){.cols{grid-template-columns:1fr}}
.colhd{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.colhd::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- WIDGET ---------- */
.w{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  margin-bottom:12px;overflow:hidden;border-left:3px solid var(--line2)}
.w.urg{border-left-color:var(--red)}
.w.warn{border-left-color:var(--amber)}
.w.ok{border-left-color:var(--green)}
.wh{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
.wh .ic{font-size:15px}
.wh .t{font-weight:600;font-size:13.5px;flex:1}
.wh .c{background:var(--bg);color:var(--ink2);font-size:11.5px;font-weight:700;
  padding:2px 8px;border-radius:999px}
.w.urg .wh .c{background:var(--red-soft);color:var(--red)}
.w.warn .wh .c{background:var(--amber-soft);color:var(--amber)}
.kebab{width:24px;height:24px;border-radius:6px;color:var(--ink3);display:grid;place-items:center}
.kebab:hover{background:var(--bg);color:var(--ink)}
.wb{padding:3px 0}
.row{display:flex;align-items:center;gap:10px;padding:8px 13px;font-size:13px;cursor:pointer;border-left:2px solid transparent}
.row:hover{background:var(--brand-soft);border-left-color:var(--brand)}
.row .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--ink3);font-size:11.5px;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tag.r{background:var(--red-soft);color:var(--red)}
.tag.a{background:var(--amber-soft);color:var(--amber)}
.tag.g{background:var(--bg);color:var(--ink2)}
.more{padding:6px 13px 2px;font-size:12px;color:var(--ink3);font-style:italic}
.wf{padding:9px 13px;border-top:1px solid var(--line);background:#fafbfc}
.wf a{font-size:12.5px;font-weight:600}

/* stat widget */
.sw .wb{padding:13px}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.biglbl{color:var(--ink2);font-size:12px;margin-top:1px}
.sep{height:1px;background:var(--line);margin:11px 0}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;cursor:pointer;border-radius:5px}
.kv:hover{background:var(--brand-soft)}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:600}

.empty{background:var(--surface);border:1px dashed var(--line2);border-radius:11px;
  padding:34px;text-align:center;color:var(--ink3)}
.empty .e{font-size:32px;margin-bottom:8px}

/* ---------- PANEL ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:60;display:none}
.mask.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);
  z-index:61;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
.panel.on{transform:none}
.ph{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph h3{font-size:15px;flex:1}
.pb{flex:1;overflow-y:auto;padding:13px 17px}
.pf{padding:13px 17px;border-top:1px solid var(--line);display:flex;gap:9px}
.grp{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.05em;margin:14px 0 7px}
.cfg{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:6px;background:#fff}
.cfg.dis{opacity:.45}
.cfg .g{color:var(--ink3);cursor:grab}
.cfg .m{flex:1;min-width:0}
.cfg .m b{display:block;font-size:13px;font-weight:600}
.cfg .m i{font-size:11px;color:var(--ink3);font-style:normal}
.sw2{width:36px;height:20px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 36px;transition:.15s}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:.15s}
.sw2.on{background:var(--brand)}
.sw2.on::after{left:18px}

/* ---------- ROLE BAR ---------- */
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 16px;display:flex;align-items:center;
  gap:9px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 11px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:#0f172a;color:#fff;padding:10px 17px;border-radius:9px;font-size:13px;
  z-index:80;transition:transform .22s;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.toast.on{transform:translateX(-50%)}
</style>
</head>

let role='HT', cfg={};
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),2300)};

function defCfg(r){const o={L:{},R:{}};
  Object.keys(A).forEach(k=>o.L[k]=R[r].L.includes(k));
  Object.keys(S).forEach(k=>o.R[k]=R[r].Rr.includes(k));return o}

function sidebar(){
  const allow=R[role].menu, full=allow.includes('all');
  $('#side').innerHTML=NAV.map(([id,name,items])=>{
    const on = full || id==='' || allow.includes(id);
    return `<div class="sgrp">${name}</div>`+items.map(it=>{
      const cur=it[0]==='M0.1';
      const badge = it[3] ? `<span class="n">${it[3]===1?(role==='HT'?14:6):''}</span>`:'';
      return `<div class="snav ${cur?'on':''} ${on?'':'off'}">
        <span style="font-size:11px;opacity:.55;min-width:30px">${it[0]}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it[1]}</span>${badge}</div>`;
    }).join('');
  }).join('');
}

function widgetA(k){
  const w=A[k], show=w.rows.slice(0,5), rest=w.n-show.length;
  return `<div class="w ${w.lv}">
    <div class="wh"><span class="ic">${w.i}</span><span class="t">${w.t}</span>
      <span class="c">${w.n}</span><button class="kebab" data-k="${k}">⋮</button></div>
    <div class="wb">${show.map(r=>`<div class="row" data-go="${w.m}">
      <span class="d">${r[0]}</span>${r[2]?`<span class="tag ${r[2]||'g'}">${r[1]}</span>`:`<span class="s">${r[1]}</span>`}
      </div>`).join('')}
      ${rest>0?`<div class="more">và ${rest} mục khác</div>`:''}</div>
    <div class="wf"><a href="#" data-all="${w.t}">Xem tất cả →</a></div></div>`;
}
function widgetS(k){
  const w=S[k];
  return `<div class="w sw">
    <div class="wh"><span class="ic">${w.i}</span><span class="t">${w.t}</span>
      <button class="kebab" data-k="${k}">⋮</button></div>
    <div class="wb"><div class="big">${w.big}</div><div class="biglbl">${w.lbl}</div>
      <div class="sep"></div>
      ${w.kv.map(x=>`<div class="kv"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}
    </div>
    <div class="wf"><a href="#" data-rep="${w.t}">Xem chi tiết →</a></div></div>`;
}

function render(){
  const c=cfg[role];
  const L=R[role].L.filter(k=>c.L[k]), Rr=R[role].Rr.filter(k=>c.R[k]);
  $('#colL').innerHTML = L.length ? L.map(widgetA).join('')
    : `<div class="empty"><div class="e">🎉</div><b>Hôm nay không có việc cần xử lý</b>
       <div style="margin-top:5px;font-size:12.5px">Mọi widget đều rỗng nên được tự động ẩn</div></div>`;
  $('#colR').innerHTML = Rr.map(widgetS).join('');
  const solo = Rr.length===0;
  $('#cols').classList.toggle('solo',solo);
  $('#wrapR').style.display = solo?'none':'';
  $('#c3').textContent='👤 '+R[role].n;
  $('#ava').textContent = role==='PHT_DT'?'PD':role==='PHT_CM'?'PC':role.slice(0,2);
  $('#nbell').textContent=R[role].bell;
}

function panel(){
  const c=cfg[role];
  const line=(k,o,g)=>`<div class="cfg ${o?'':'dis'}">
     <span class="g">⠿</span><div class="m"><b>${(g==='L'?A[k].t:S[k].t)}</b>
     <i>${k} · nguồn ${(g==='L'?A[k].m:'Báo cáo')}</i></div>
     <div class="sw2 ${o?'on':''}" data-g="${g}" data-k="${k}"></div></div>`;
  $('#pbody').innerHTML =
    `<div class="grp">Cột trái — Widget hành động</div>`+
    R[role].L.map(k=>line(k,c.L[k],'L')).join('')+
    (R[role].Rr.length?`<div class="grp">Cột phải — Widget số liệu tháng</div>`+
      R[role].Rr.map(k=>line(k,c.R[k],'R')).join(''):'')+
    `<div class="grp">Không khả dụng với vai trò này</div>
     <div style="font-size:12.5px;color:var(--ink3);line-height:1.7">
     Các widget khác bị ẩn vì vai trò <b>${R[role].n}</b> không có quyền trên feature nguồn.
     Widget sẽ tự xuất hiện nếu được cấp thêm quyền.</div>`;
}

/* ====== EVENTS ====== */
document.querySelectorAll('.rb').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.rb').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); role=b.dataset.r;
  if(!cfg[role]) cfg[role]=defCfg(role);
  sidebar(); render();
  toast(`Đã chuyển sang vai trò ${R[role].n}`);
});
document.body.addEventListener('click',e=>{
  const row=e.target.closest('.row');
  if(row){toast(`Deep-link → ${row.dataset.go} · mở đúng bản ghi · return=M0.1`);return}
  const all=e.target.closest('[data-all]');
  if(all){e.preventDefault();toast(`→ M0.2 Việc cần làm · filter "${all.dataset.all}"`);return}
  const rep=e.target.closest('[data-rep]');
  if(rep){e.preventDefault();toast(`→ 📊 M9 Báo cáo · "${rep.dataset.rep}"`);return}
  const kv=e.target.closest('.kv');
  if(kv){toast('Mở popup danh sách chi tiết (chỉ đọc)');return}
  const kb=e.target.closest('.kebab');
  if(kb){toast('Menu ⋮ · Ẩn widget · Đưa lên đầu · Đưa xuống cuối');return}
  const sw=e.target.closest('.sw2');
  if(sw){const g=sw.dataset.g,k=sw.dataset.k;
    cfg[role][g][k]=!cfg[role][g][k];sw.classList.toggle('on');
    sw.closest('.cfg').classList.toggle('dis',!cfg[role][g][k]);render();return}
});
$('#cfgbtn').onclick=()=>{panel();$('#mask').classList.add('on');$('#panel').classList.add('on')};
const close=()=>{$('#mask').classList.remove('on');$('#panel').classList.remove('on')};
$('#mask').onclick=close;$('#close').onclick=close;$('#save').onclick=()=>{close();toast('Đã lưu tùy chỉnh cá nhân')};
$('#reset').onclick=()=>{cfg[role]=defCfg(role);panel();render();toast('Đã khôi phục bộ mặc định của vai trò')};
$('#year').onchange=e=>{
  const closed=e.target.value.includes('Đã kết thúc');
  $('#c1').textContent='📅 '+e.target.value.split(' · ')[0].replace('Năm học ','');
  $('#colL').style.display=closed?'none':'';
  $('#colL').previousElementSibling.style.display=closed?'none':'';
  toast(closed?'Năm học Đã kết thúc — cột việc cần xử lý được ẩn':'Đã tải lại toàn bộ widget');
};
$('#dt').onchange=e=>{$('#c2').textContent='📍 '+e.target.value;
  toast('Widget scope Điểm trường tải lại · widget scope Trường giữ nguyên')};

const h=new Date().getHours();
$('#greet').textContent = h<11?'Chào buổi sáng':h<14?'Chào buổi trưa':h<18?'Chào buổi chiều':'Chào buổi tối';
cfg[role]=defCfg(role); sidebar(); render();
</script>
