<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2.2 Sổ đầu bài — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.lockwrap{position:relative;display:inline-flex;align-items:center;gap:5px}
.lockwrap .lk{font-size:11px;color:var(--ink3)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:8px 12px;border-radius:9px;font-size:12.5px;margin:11px 0;display:flex;gap:8px;align-items:flex-start}
.scopebar code{background:#e0e7ff;padding:0 4px;border-radius:3px;font-size:11.5px}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:6px}
.rolnk:hover{background:#e0e7ff}
.backbar{background:#0f172a;color:#cbd5e1;border-radius:9px;padding:8px 12px;font-size:12.5px;display:flex;gap:9px;align-items:center;margin-bottom:11px}
.backbar b{color:#fff}
.oldwk{background:#fef3c7;border:1px solid var(--amber);color:#92400e;border-radius:9px;padding:9px 13px;
 font-size:12.5px;margin-bottom:11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.oldwk .sp{flex:1}
.wksel{border:1px solid var(--line2);border-radius:8px;padding:6px 11px;font-size:12.5px;background:#fff;font-weight:700}
.lastles{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:9px 12px;font-size:12.5px;color:#065f46;margin-bottom:11px}
.lastles b{color:#064e3b}
.backbar button{color:#93c5fd;font-weight:600}

.navbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 11px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 13px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.sumbar{display:flex;gap:0;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.sumbar .it{padding:9px 15px;border-right:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.sumbar .it b{display:block;font-size:17px;color:var(--ink);font-weight:700;line-height:1.25}
.sumbar .it.w b{color:var(--amber)}.sumbar .it.r b{color:var(--red)}.sumbar .it.g b{color:var(--green)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage.open .listw{flex:1 1 0}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}

.trow{display:flex;gap:11px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.trow:hover{background:var(--brand-soft)}
.trow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.trow .tm{flex:0 0 72px;text-align:center;font-size:11px;color:var(--ink3)}
.trow .tm b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.trow .bd{flex:1;min-width:0}
.trow .bd b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .bd .sub{font-size:11.5px;color:var(--ink3)}
.trow .rt{flex:0 0 auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.trow.huy{background:var(--red-soft)}
.trow.huy .bd b{text-decoration:line-through;color:#991b1b}

.lrow{display:flex;gap:11px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.lrow:hover{background:var(--brand-soft)}
.lrow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.lrow .lp{flex:0 0 150px}
.lrow .lp b{font-size:13.5px;display:block}
.lrow .lp span{font-size:11.5px;color:var(--ink3)}
.lrow .num{flex:0 0 86px;text-align:center;font-size:11px;color:var(--ink3)}
.lrow .num b{display:block;font-size:15px;color:var(--ink)}
.lrow .num.r b{color:var(--red)}.lrow .num.w b{color:var(--amber)}.lrow .num.g b{color:var(--green)}
.bar4{flex:1;min-width:120px;display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bg)}
.bar4 i{display:block;height:100%}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph .n{flex:1;min-width:0}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pnav{display:flex;gap:6px;align-items:center;padding:8px 15px;border-bottom:1px solid var(--line);background:#fafbfc;font-size:12px;color:var(--ink2)}
.pnav .sp{flex:1}
.pbody{padding:14px 15px;max-height:calc(100vh - 260px);overflow-y:auto}
.f{display:grid;grid-template-columns:136px 1fr;gap:11px;align-items:start;padding:7px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.lock{opacity:.55}
.card.hl{border-color:#fde68a}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.card.hl .ch{background:var(--amber-soft);border-bottom-color:#fde68a;color:#92400e}
.ch .sp{flex:1}
.cb{padding:4px 12px}
.cb.p{padding:11px 12px}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.r::before{background:var(--red)}.logi.g::before{background:var(--green)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.fld label .req{color:var(--red)}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff}
.fldi:disabled,textarea.fldi:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.fldi.err{border-color:var(--red);background:var(--red-soft)}
.mucs{display:flex;gap:6px;flex-wrap:wrap}
.muc{border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:6px 15px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.muc:hover:not(:disabled){background:var(--bg)}
.muc.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.muc:disabled{opacity:.45;cursor:not-allowed}

.dd{display:flex;gap:9px;padding:7px 0;font-size:12.5px;align-items:flex-start;border-bottom:1px solid #f1f5f9}
.dd:last-child{border-bottom:none}
.dd .nm{flex:1;min-width:0}
.dd .nm b{display:block;font-weight:600}
.dd .nm span{color:var(--ink3);font-size:11.5px}
.dd .ac{flex:0 0 auto;display:flex;gap:4px}
.roblk{background:#f8fafc;border:1px dashed var(--line2);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--ink2)}

table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
table.tb td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb tr:last-child td{border-bottom:none}
.diff-o{background:var(--red-soft);color:#991b1b;padding:1px 4px;border-radius:3px;text-decoration:line-through}
.diff-n{background:var(--green-soft);color:#065f46;padding:1px 4px;border-radius:3px;font-weight:600}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:210px;max-height:260px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:700px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:13px;font-size:11px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}

/* ── bố cục sidebar (P17 · khuôn M2.5 §15) — phần riêng của M2.2; khuôn ở style.05-sidebar-lop.css ── */
.sbl-main>.tabs{margin-top:0}
.dlsel{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:7px;padding:3px 6px;font-size:11.5px;max-width:330px}
.caphd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:11px 0 0}
.caphd h2{font-size:16px;margin:0}
.caphd span{font-size:12px;color:var(--ink3)}
.lrow.tong{flex-wrap:wrap;cursor:default;background:#f8fafc}
.lrow.tong:hover{background:#f8fafc}
.ngoaicap{font-size:12px;color:var(--ink2);padding:8px 13px;background:#fffbeb;border-bottom:1px solid #fde68a}


/* ── GY18-H1 · ô XÁC NHẬN sĩ số của tiết (không phải ô gõ số) ── */
.xnbox{border:1px solid var(--line);border-left:3px solid var(--ink3);border-radius:9px;padding:10px 12px;margin-top:9px;background:#fff}
.xnbox.du{border-left-color:var(--green);background:#f0fdf4}
.xnbox.vang{border-left-color:var(--amber);background:#fffbeb}
.xnbox.chua{border-left-color:var(--ink3);background:#f8fafc}
.xnh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;flex-wrap:wrap}
.xnhan{font-size:11px;color:var(--ink3);font-weight:400;margin-top:4px}
.xnb{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.xnds{margin-top:9px}
.xnck{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.xnck input{width:15px;height:15px;flex:0 0 15px}

/* ══ GDDP (v2.5) — PHẦN của môn chia phần ═══════════════════════════════════
   Dải «phần của tôi» ở đầu danh sách tiết của cặp, và dòng tên phần trên mỗi
   dòng tiết. Môn một phần KHÔNG sinh phần tử nào — PC1 chạy y hệt hôm nay.   */
.phandai{flex:1 1 100%;margin-top:6px;padding:7px 10px;border-radius:7px;
  background:color-mix(in srgb,var(--violet) 7%,transparent);
  border-left:3px solid var(--violet);font-size:12px;line-height:1.5}
.phandai b{color:var(--violet)}
.phandai span{font-size:11px;color:var(--ink3)}
.phandai div{margin-top:2px;color:var(--ink2)}
.phanln{font-size:11.5px;color:var(--violet);margin:2px 0 1px}
/* SDBG-1A — dinh chinh co vet */
.sumbar .it.v b{color:var(--violet)}
.dcx{border-color:#ddd6fe}
.dcx .ch{background:#f5f3ff}
.dcl{padding:6px 0 8px;border-bottom:1px dashed var(--line)}
.dcl:last-of-type{border-bottom:0}
.dch{font-size:12px;margin-bottom:5px;color:var(--ink2)}
.dcly{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.5}
/* DTHN-1B (24/9/2026) — khối «Bài tập về nhà đến hạn hôm nay» của tiết dạy thay: chỉ đọc, 🔗 M2.3 */
.btvn .btvn-l{padding:6px 0;border-bottom:1px dashed var(--line)}
.btvn .btvn-l:last-of-type{border-bottom:0}
.btvn .mm{font-size:11.5px;color:var(--ink3);margin-top:2px}
.btvn .btvn-da{margin-top:5px;padding:6px 9px;border-radius:7px;background:#f0fdf4;border:1px solid #bbf7d0;color:#065f46;font-size:12px}
.btvn .btvn-da div{margin-top:2px;color:var(--ink2)}

<script>/* ═══════════════════════════════════════════════════════════════════════════════
   KHUÔN SIDEBAR LỚP × MÔN — app.05-sidebar-lop.js  (+ style.05-sidebar-lop.css)
   Gốc: M2.5 Bảng điểm môn học (Đợt 1 · P16 · 14/9/2026) — góp ý mục 25.
   Dùng chung BỐN menu: M2.5 · M2.2 Sổ đầu bài (P17) · M2.3 Bài tập về nhà (P18) · M2.11 Lớp tôi giảng dạy (KGLH).
   Mô tả đầy đủ: mo-ta-giao-dien/M2.5-Bang-diem-mon-hoc.md §15.

   ⚠ CHÉP NGUYÊN BYTE sang từng menu, so bằng Get-FileHash. tools/gen-demo.py KHÔNG gộp
     chéo thư mục — sửa khuôn ở một bên thì PHẢI chép sang MỌI bên (tiền lệ tệp nền chung
     CSVC M6.4 ⇄ M6.11 ⇄ M6.5). Việc riêng của menu KHÔNG viết vào tệp này.
   ⚠ Khuôn KHÔNG đọc dữ liệu riêng của menu nào. Nó chỉ cần hai hook toàn cục:
       R()      — vai hiện hành; đổi vai thì khuôn tự bỏ lựa chọn cũ
       render() — vẽ lại cả trang; khuôn gọi sau mỗi lần đổi lựa chọn
     Khuôn chỉ dùng function + var (không const/let ở tầng ngoài) để nằm TRƯỚC mọi tệp của menu
     mà không vướng vùng chết tạm thời. ⚠ gen-demo ghép `app.js` TRƯỚC mọi `app.*.js`: menu còn app.js nguyên
     khối thì đổi tên thành app.10-….js, để lời gọi render() đầu tiên chạy SAU khi SBL đã có giá trị.

   Cách dùng trong render() của menu:
       var c = sblChuan(o);                 // 1. chuẩn hóa lựa chọn theo tab đang mở
       var phai = <thanh tab> + <nội dung theo c.lop · c.mon · c.tatCa · c.cuoi>;
       $('#content').innerHTML = sblKhung(phai);   // 2. ghép sidebar trái + nội dung phải
   o = { che:'lopmon'|'lop'|'an',          đơn vị sidebar của TAB ĐANG MỞ ('an' = ẩn sidebar)
         muc:[{lop, mon|null, dt, dtTen, khoi, viec:[{n,t,c}], ghi}],
             — DỰNG TỪ PHẠM VI (phân công · tổ · điểm trường), KHÔNG từ dữ liệu (khung §13):
               cặp chưa có bản ghi nào vẫn phải có mặt.
             — viec = con số việc của tab đang mở; n>0 mới hiện; c = w|r|b|o|v|n (màu nhãn)
         hangDoi: null | {nhan:'Tất cả lớp của tôi'}   tab dạng hàng đợi: dòng đầu «Tất cả»
         rong: bool          vai phạm vi rộng ⇒ thêm tầng Khối (tầng Điểm trường tự bật khi ≥ 2 điểm trường)
         macDinh: 'lop|mon'  (tùy chọn) dòng chọn sẵn khi chưa có lựa chọn — menu tự quyết «việc nào gấp nhất»;
                             không có thì lấy dòng đầu tiên CÒN VIỆC
         nhomCuoi: (tùy chọn — DTHN-0A 24/9/2026) MỘT nhóm vẽ DƯỚI CÙNG, sau mọi tầng Điểm trường · Khối:
             { ten:'Tiết dạy thay', bieuTuong:'🔁', ghi:'html ngắn dưới tiêu đề nhóm' (tùy chọn),
               vaoTatCa: bool (tùy chọn, mặc định false — việc của nhóm có cộng vào dòng «Tất cả» của hàng đợi không),
               muc:[{k:'thay:<tiet_id>', nhan:'9A3 · Vật lí · T3 tiết 2 · thay cô Mai', viec:[{n,t,c}], ghi, …}] }
             — mỗi mục là MỘT DÒNG PHẲNG, khóa k DUY NHẤT; trường khác của mục khuôn không đọc, trả nguyên cho menu.
             — 🛑 CHỈ cho tập bản ghi KHÔNG phải phân công (hiện có đúng một: tiết dạy thay — DTHN);
               ⛔ không dùng làm tầng thứ ba cho phân công. muc rỗng ⇒ không vẽ nhóm.
             — không truyền nhomCuoi ⇒ HTML sinh ra GIỐNG HỆT khuôn trước DTHN-0A (phép kiểm byte ×4).
         tieuDe, phamVi:'html ngắn', trong:'html khi không có mục nào' }
   Kết quả sblChuan: {lop, mon, tatCa, muc, cuoi, link}. Chọn một dòng nhóm cuối ⇒ cuoi = CHÍNH mục đó
     (object menu đã truyền), lop = mon = null, muc = null; chọn dòng thường ⇒ cuoi = null.
   Deep-link: sblDocUrl() đọc ?ctx=lop|mon (hoặc #ctx=…); ?ctx=<k của một mục nhóm cuối> ⇒ mở thẳng dòng đó.
   Chọn bằng mã: sblChon(lop,mon) · sblChonCuoi(k) rồi render() — menu có nhomCuoi ⛔ gán tay SBL.lop/SBL.mon.
   Sửa: 14/9 P17 (M2.2) — dải ↩/⚠ deep-link hiện cả ở khung ≤ 900px (sblLinkBand); đã chép sang M2.5 · M2.3.
   Sửa: 15/9 PZ2 — nút "＋ Hiện cả n …" nói DÒNG khi đơn vị là Lớp × Môn (trước ghi "lớp" mà đếm cặp — phiếu P18); đã chép sang M2.2 · M2.3 · M2.5.
   Sửa: 24/9 DTHN-0A — tham số tùy chọn nhomCuoi (nhóm «🔁 Tiết dạy thay»); chú thích kể đủ bốn menu (trước sót M2.11);
        chép nguyên byte sang M2.2 · M2.3 · M2.5 · M2.11.
   ═══════════════════════════════════════════════════════════════════════════════ */

var SBL={lop:null,mon:null,tatCa:false,tim:'',dong:{},vai:undefined,hd:false,nho:null,link:null,giuLink:false,chiViec:true,o:null,cuoi:null};

function sblE(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sblBo(t){return String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function sblCoViec(m){return (m.viec||[]).some(function(x){return x.n>0})}
function sblTong(ds){                       /* cộng việc của nhiều mục theo nhãn — tiêu đề nhóm thu lại KHÔNG giấu việc (khung §12.3) */
 var g={},thu=[];
 ds.forEach(function(m){(m.viec||[]).forEach(function(x){if(!(x.n>0))return;var k=x.t+'|'+x.c;
  if(!g[k]){g[k]={n:0,t:x.t,c:x.c};thu.push(k)} g[k].n+=x.n})});
 return thu.map(function(k){return g[k]});
}
function sblNhan(v){return (v||[]).filter(function(x){return x.n>0}).map(function(x){
 return '<span class="sbl-b '+(x.c||'n')+'">'+x.n+' '+sblE(x.t)+'</span>'}).join('')}

/* nhóm cuối (DTHN-0A): mục của nhóm · tập cộng vào dòng «Tất cả» · mục đang chọn */
function sblCuoi(o){o=o||SBL.o||{};return (o.nhomCuoi&&o.nhomCuoi.muc)||[]}
function sblTatCa(o){var M=o.muc||[];return (o.nhomCuoi&&o.nhomCuoi.vaoTatCa)?M.concat(sblCuoi(o)):M}
function sblCuoiDang(){if(SBL.cuoi==null||SBL.tatCa)return null;return sblCuoi().filter(function(x){return x.k===SBL.cuoi})[0]||null}

/* 1 ─ chuẩn hóa lựa chọn. Quy tắc:
   • đổi tab GIỮ lựa chọn; đơn vị đổi Lớp × Môn → Lớp thì giữ lớp, bỏ môn
   • vào tab hàng đợi ⇒ đứng ở «Tất cả» (hàng đợi bị lựa chọn cũ lọc mất là giấu việc), nhớ cặp cũ;
     rời hàng đợi mà vẫn đang «Tất cả» ⇒ trả lại cặp đã nhớ
   • lựa chọn không còn trong phạm vi ⇒ cùng lớp nếu có, không thì mục đầu tiên CÒN VIỆC
   • nhóm cuối: dòng đang chọn còn trong nhomCuoi.muc ⇒ giữ; mất ⇒ rơi về luật trên;
     không có cặp thường nào mà nhóm cuối có mục ⇒ chọn mục đầu tiên CÒN VIỆC của nhóm cuối */
function sblChuan(o){
 var v=(typeof R==='function')?R():null;
 if(SBL.vai!==undefined&&v!==SBL.vai&&!SBL.giuLink){SBL.lop=null;SBL.mon=null;SBL.tatCa=false;SBL.tim='';SBL.nho=null;SBL.link=null;SBL.cuoi=null}
 SBL.giuLink=false;SBL.vai=v;SBL.o=o;
 if(o.che==='an') return {an:true};
 var M=o.muc||[],hd=!!o.hangDoi,C=sblCuoi(o);
 if(SBL.link&&SBL.link.xet!==true){SBL.link.xet=true;
  var lc=C.filter(function(x){return x.k===SBL.link.ctx})[0];
  if(lc){SBL.cuoi=lc.k;SBL.lop=null;SBL.mon=null;SBL.link.lop=lc.nhan;SBL.link.mon=null;SBL.link.ngoai=false}
  else SBL.link.ngoai=!M.some(function(m){return m.lop===SBL.link.lop&&(!SBL.link.mon||o.che==='lop'||m.mon===SBL.link.mon)})}
 if(hd&&!SBL.hd&&!(SBL.link&&!SBL.link.ngoai&&SBL.link.moi)){SBL.nho={lop:SBL.lop,mon:SBL.mon,cuoi:SBL.cuoi};SBL.tatCa=true;SBL.cuoi=null}
 if(!hd&&SBL.hd&&SBL.tatCa&&SBL.nho){SBL.lop=SBL.nho.lop;SBL.mon=SBL.nho.mon;SBL.cuoi=SBL.nho.cuoi||null}
 if(SBL.link)SBL.link.moi=false;
 SBL.hd=hd; if(!hd)SBL.tatCa=false;
 if(o.che==='lop')SBL.mon=null;
 if(SBL.cuoi!=null&&!SBL.tatCa){if(C.some(function(x){return x.k===SBL.cuoi}))return sblKq();SBL.cuoi=null}
 if(!SBL.tatCa&&!M.length&&C.length){SBL.cuoi=(C.filter(sblCoViec)[0]||C[0]).k;return sblKq()}
 if(SBL.tatCa||!M.length) return sblKq();
 if(hd&&SBL.mon===null&&M.some(function(m){return m.lop===SBL.lop})) return sblKq();   /* hàng đợi: chọn cả lớp = lọc theo lớp */
 var khop=M.filter(function(m){return m.lop===SBL.lop&&(o.che==='lop'||m.mon===SBL.mon)});
 if(!khop.length){
  var cung=M.filter(function(m){return m.lop===SBL.lop});
  var md=o.macDinh?M.filter(function(m){return m.lop+'|'+(m.mon==null?'':m.mon)===o.macDinh})[0]:null;
  var c=cung.length?(cung.filter(sblCoViec)[0]||cung[0]):(md||M.filter(sblCoViec)[0]||M[0]);
  SBL.lop=c.lop;SBL.mon=o.che==='lop'?null:c.mon;
 }
 return sblKq();
}
function sblKq(){
 var o=SBL.o||{},M=o.muc||[],cu=sblCuoiDang();
 if(cu) return {lop:null,mon:null,tatCa:false,muc:null,cuoi:cu,link:SBL.link};
 var m=SBL.tatCa?null:(M.filter(function(x){return x.lop===SBL.lop&&(SBL.mon==null||x.mon===SBL.mon)})[0]||null);
 return {lop:SBL.tatCa?null:SBL.lop,mon:SBL.tatCa?null:SBL.mon,tatCa:SBL.tatCa,muc:m,cuoi:null,link:SBL.link};
}

/* 2 ─ ghép khung: sidebar trái · (bộ chọn thả xuống khi hẹp) + nội dung phải */
function sblKhung(phai){
 var o=SBL.o; if(!o||o.che==='an') return phai;
 return '<div class="sbl-wrap"><aside class="sbl-side">'+sblSide()+'</aside><section class="sbl-main">'+sblHep()+phai+'</section></div>';
}

function sblHienMuc(){                      /* hàng đợi: mặc định chỉ hiện dòng CÓ việc (+ dòng đang chọn) */
 var o=SBL.o,M=o.muc||[];
 if(o.hangDoi&&SBL.chiViec&&!SBL.tim) return M.filter(function(m){return sblCoViec(m)||(m.lop===SBL.lop&&!SBL.tatCa&&SBL.cuoi==null)});
 if(SBL.tim){var q=sblBo(SBL.tim);return M.filter(function(m){return sblBo(m.lop+' '+(m.mon||'')+' '+(m.ghi||'')).indexOf(q)>=0})}
 return M;
}
function sblHienCuoi(){                     /* cùng luật lọc cho nhóm cuối; tìm theo nhan + ghi */

   (= 28 ngày TÍNH CẢ HÔM NAY — DTHN-Z2 đồng bộ với M2.3 `HOMNAY-27` · M2.5 `HOMNAY-(CUA_SO_THAY-1)`; bản 2C dùng − 28 = 29 ngày)

/* ========== TRANG THAI DAN XUAT ========== */
function ttSo(x){
 if(x.tt==='huy')  return {k:'huy',  t:'✕ Tiết bị hủy', c:'r'};
 if(x.tt==='dinh') return {k:'dinh', t:'✎ Đã đính chính', c:'v'};
 if(x.tt==='chot') return {k:'chot', t:'🔒 Đã chốt', c:'n'};
 if(x.tt==='ghi'){
   const qua = NOW - absW(x.w,x.d,GIO[x.t][1]);
   return qua>CFG.chot*60 ? {k:'chot',t:'🔒 Đã chốt',c:'n'} : {k:'ghi',t:'✓ Đã ghi xong',c:'o'};
 }
 if(x.tt==='dang') return {k:'dang', t:'✎ Đang ghi dở', c:'w'};
 /* chua ghi — o nhap MO SAN (YK-01: khong con nut ▶ Vao tiet) */
 if(NOW > absW(x.w,x.d,GIO[x.t][1])) return {k:'quagio',t:'⛔ Quá giờ, chưa ghi',c:'r'};
 return {k:'chua',t:'Chưa ghi',c:'n'};
}
/* nhan lech gio GHI SO (YK-01) — ghi TRUOC gio tiet (so voi gio luu lan dau) / ghi so MUON (so voi gio ✓ Ket thuc).
   Khong chan, chi gan nhan va vao bao cao ne nep. KHONG chay sang M4.9. */
const treTxt=p=>p>=1440?Math.floor(p/1440)+' ngày':p>=60?Math.floor(p/60)+' giờ'+(p%60?' '+(p%60)+'′':''):p+'′';
const mocGio=m=>m?hhmm(m%1440)+' ngày '+NGAYW(Math.floor(m/1440/7)+1,Math.floor(m/1440)%7):'<span style="color:var(--ink3)">chưa có</span>';
function nhanGhi(x){
 if(!x.ky) return null;
 const bd=absW(x.w,x.d,GIO[x.t][0]), kt=absW(x.w,x.d,GIO[x.t][1]);
 if(x.gkt && x.gkt > kt+CFG.treGhi) return ['⏱ Ghi sổ muộn '+treTxt(x.gkt-kt),'r'];
 if(x.ky < bd-CFG.truocGhi) return ['⏱ Ghi trước giờ tiết','w'];
 return null;
}
/* ===== GY18-H1 · TIET DAU CUA BUOI · SI SO DAN XUAT =====
   Khung gio: tiet 1-5 buoi sang, tiet 6-8 buoi chieu (bang GIO o dau tep). */
const BUOI=t=>t<=5?'sang':'chieu';
const BUOITEN={sang:'buổi sáng',chieu:'buổi chiều'};
/* TIET DAU cua mot buoi = DAN XUAT tu lich (M4.7): tiet co thu tu NHO NHAT cua chinh lop do trong buoi do,
   tinh ca tiet cua giao vien khac. Khong ai khai tay, khong o cau hinh. Tiet Huy khong tinh — khong ai day. */
function tietDauBuoi(lop,w,d,buoi){
 const ts=SO.filter(y=>y.lop===lop&&y.w===w&&y.d===d&&y.tt!=='huy'&&BUOI(y.t)===buoi).map(y=>y.t);
 return ts.length?Math.min.apply(null,ts):null;
}
const laTietDau=x=>x.tt!=='huy'&&tietDauBuoi(x.lop,x.w,x.d,BUOI(x.t))===x.t;
/* SI SO CO MAT = dan xuat, khong co o nhap tay. BA nguon theo thu tu uu tien:
   ban CHOT cua GVCN (M2.9/T2) > o xac nhan cua CHINH tiet nay (tam tinh) > chua co can cu (khong doan). */
function siSo(x){
 if(x.ddChot) return {n:x.ss-x.vangDN.length-x.bd.length,ng:'chot',vang:x.vangDN.length};
 if(x.xn)     return {n:x.ss-(x.xn.du?0:x.xn.ds.length)-x.bd.length,ng:'xn',vang:x.xn.du?0:x.xn.ds.length};
 return {n:null,ng:'khong',vang:0};
}
const coMat=x=>{const s=siSo(x); return s.n==null?'—':s.n};
/* BA trang thai phan biet duoc cua mot dong so (§4.1.2 — truoc day chi co "trong" va "khong trong") */
const xnTT=x=>!x.xn?'chua':(x.xn.du?'du':'vang');
const xnNhan=x=>({chua:['— chưa xác nhận sĩ số','n'],du:['✓ Lớp đủ','o'],
 vang:['⚠ '+((x.xn&&x.xn.ds)?x.xn.ds.length:0)+' em vắng','w']})[xnTT(x)];
/* GVCN DA chot ma xac nhan cua tiet noi khac -> KHONG doi ben nao, chi neu ra.
   Ben M2.9 viec nay hien thanh DE NGHI DINH CHINH — GVCN quyet. */
function lechXN(x){
 if(!x.ddChot||!x.xn) return null;
 const vangChot=x.vangDN.map(v=>String(v[0]));
 const vangXN=x.xn.du?[]:x.xn.ds.map(z=>String(z[0]));
 const them=vangXN.filter(h=>vangChot.indexOf(h)<0);       /* tiet bao vang · ban chot khong co */
 const bot=vangChot.filter(h=>vangXN.indexOf(h)<0);        /* ban chot bao vang · tiet khong neu */
 return (them.length||bot.length)?{them:them,bot:bot}:null;
}
/* cap hoc suy tu khoi cua lop */
const capHoc=lop=>Number(lop[0])>=10?'THPT':'THCS';
const batYThuc=lop=>CFG.ythuc[capHoc(lop)==='TH'?'TH':'THCS'];
/* truong bat buoc con thieu */
function thieu(x){
 const t=[];
 if(!x.nd||!x.nd.trim()) t.push(['nd','Nội dung dạy thực tế']);
 if(batYThuc(x.lop)&&!x.muc) t.push(['muc','Xếp loại ý thức lớp']);

}

/* SDBG-1A: con DUNG MOT tab «Ghi so tiet cua toi» ⇒ KHONG ve thanh tab (khuon: T.length ≤ 1). */

/* ========== SIDEBAR LỚP × MÔN — dữ liệu của khuôn (M2.5 §15), riêng M2.2 ==========
   Đơn vị đổi theo tab: Ghi sổ = Lớp × Môn của tôi · Nề nếp = Lớp · Chờ tôi duyệt = hàng đợi · ⚙ = ẩn.
   Danh sách DỰNG TỪ PHẠM VI (PC · LOP), con số việc mới đếm từ dòng sổ. */
const khoiOf=l=>Number(l.match(/^\d+/)[0]);
const mucOf=(lop,mon,viec,ghi,ghiDT)=>({lop,mon,dt:LOP[lop].dt,dtTen:DTTEN[LOP[lop].dt],khoi:khoiOf(lop),viec,ghi,ghiDT});
const V=(n,t,c)=>({n,t,c});
/* cap cua toi = PHAN CONG (M4.5) — DTHN-1B (24/9/2026, ban CHOT §3.2g): BO ve «∪ cap co tiet toi THUC day».
   Tiet day thay KHONG keo ca cap vao danh sach thuong (DT-1 — cap la don vi cua PHAN CONG); moi tiet day thay
   la MOT dong o nhom cuoi «🔁 Tiet day thay» (sblThay). Ca ban giao 🤝 · theo giai doan ⏱ la phan cong ⇒ o lai day. */
function capCuaToi(){
 const g=me(); if(!g) return [];
 const ds=[], co=(l,m)=>ds.some(p=>p.lop===l&&p.mon===m);
 PC.filter(p=>p[2]===g).forEach(p=>{if(!co(p[0],p[1]))ds.push({lop:p[0],mon:p[1],ghi:''})});
 /* GDDP · HDPC ⑥ — cặp tôi CHỈ GIỮ MỘT PHẦN: dòng cặp ở PC mang tên người CHỦ TRÌ, không
    phải tên tôi, nên lọc theo PC là MẤT LỚP. Đơn vị phân công nay là (lop, mon, phan). */
 PCPHAN.filter(p=>p[3]===g).forEach(p=>{if(!co(p[0],p[1]))ds.push({lop:p[0],mon:p[1],ghi:''})});
 /* `ghi` = chú giải dòng sidebar (khuôn dùng làm title) — gộp cả hai câu.
    `ghiDT` giữ riêng để dải phạm vi bên phải KHÔNG in lại câu về phần hai lần. */
 ds.forEach(p=>{p.dai=daiPhan(p.lop,p.mon,g); p.ghi=[p.dai,p.ghiDT].filter(Boolean).join(' · ')});
 return ds;
}
/* SDBG-1A: mot tab ⇒ sidebar mot che do `lopmon` (Lop × Mon cua toi). Ba che do cu (ne nep `lop` ·
   hang doi tiet huy cua Giam thi · hang doi Cho toi duyet · an o ⚙) roi menu cung ba tab. */
function sblO(){
 /* DTHN-1B: tiet TOI day thay KHONG dem vao cap thuong — no co dong rieng o nhom cuoi */
 const g=me(), mine=SO.filter(x=>x.gv===g&&!laThayToi(x));
 const dem=(p,f)=>mine.filter(x=>x.lop===p.lop&&x.mon===p.mon&&f(x)).length;
 const muc=capCuaToi().map(p=>mucOf(p.lop,p.mon,[
   V(dem(p,x=>ttSo(x).k==='quagio'),'chưa ghi','r'),
   V(dem(p,x=>ttSo(x).k==='dang'),'ghi dở','w'),
   V(dem(p,x=>x.w===TUANNAY&&x.d===HOMNAY&&ttSo(x).k==='chua'),'hôm nay','o')],p.ghi,p.ghiDT));
 /* viec gap nhat (S8 — KHONG doi): dang ghi do → qua gio chua ghi → tiet hom nay chua ghi */
 const gap=['dang','quagio'].map(k=>mine.filter(x=>ttSo(x).k===k).sort((a,b)=>absW(a.w,a.d,a.t)-absW(b.w,b.d,b.t))[0]).find(Boolean)
   ||mine.find(x=>x.w===TUANNAY&&x.d===HOMNAY&&ttSo(x).k==='chua');
 const thay=sblThay();
 return {che:'lopmon',tieuDe:'Lớp × Môn của tôi',muc,macDinh:gap?gap.lop+'|'+gap.mon:undefined,
  phamVi:'Theo phân công (M4.5)'+(thay.length?' · tiết dạy thay ở nhóm cuối (M4.7)':''),
  nhomCuoi:thay.length?{ten:'Tiết dạy thay',bieuTuong:'🔁',
   ghi:'Mỗi dòng là <b>một tiết</b> bạn dạy thay — chỉ tiết đó ghi được, từ lúc tiết bắt đầu. 28 ngày gần nhất (tính cả hôm nay), mọi tiết đã xếp phía trước và tiết còn việc. '
     +'<button class="rolnk" data-x="thaycu">Tra tiết cũ hơn</button>',
   muc:thay}:null};
}
/* NHÓM CUỐI «🔁 Tiết dạy thay» (DTHN-1B · bản CHỐT §3.2a · b · e · f · g — hợp đồng nhomCuoi của khuôn, phiếu DTHN-0A A2).
   Mỗi mục là MỘT TIẾT, không phải một cặp. Tập = tiết tôi dạy thay trong 4 TUẦN gần nhất (kể cả tiết đã xếp sắp tới)
   ∪ tiết dạy thay CÒN VIỆC dù cũ hơn (hàng đợi không được giấu việc — §8.1.2b) ∪ tiết cũ đã ghim từ «Tra tiết cũ hơn».
   Người dạy thay VỐN dạy môn khác ở chính lớp đó thì tiết vẫn vào đây (§3.2f) — điều kiện chỉ là gv = tôi ≠ gv_goc. */
function sblThay(){
 if(!me()) return [];
 const T=x=>absW(x.w,x.d,GIO[x.t][0]);
 /* DTHN-2C (P-7): cận dưới theo NGÀY (trongCuaSo), không cận trên */
 return SO.filter(x=>laThayToi(x)&&x.tt!=='huy'&&(trongCuaSo(x)||['quagio','dang'].indexOf(ttSo(x).k)>=0||thayGhim.has(x.id)))
  .sort((a,b)=>T(b)-T(a))                 /* mới nhất trên cùng — tiết hôm nay đứng đầu nhóm */
  .map(x=>{const k=ttSo(x).k;
   return {k:'thay:'+x.id,tiet:x.id,lop:x.lop,mon:x.mon,
    nhan:x.lop+' · '+x.mon+' · T'+(x.d+2)+' '+NGAYW(x.w,x.d)+' tiết '+x.t+' · thay '+tenGoi(x.gvg),
    ghi:'Tiết dạy thay '+GV[x.gvg].n+' (M4.7) — chỉ tiết này ghi được, các tiết khác của '+x.lop+' · '+x.mon+' không mở ở đây',
    viec:[V(k==='quagio'?1:0,'chưa ghi','r'),V(k==='dang'?1:0,'ghi dở','w'),
          V(x.w===TUANNAY&&x.d===HOMNAY&&k==='chua'?1:0,'hôm nay','o')]}});
}
/* chon san dong sidebar theo mot tiet — dung cho ⛔ nhay tiet, Tiet truoc/sau, Lan truoc, deep-link.
   DTHN-1B: menu da truyen nhomCuoi ⇒ ⛔ gan tay SBL.lop/SBL.mon (hop dong DTHN-0A A2 §4) — goi sblChon / sblChonCuoi. */
function theoTiet(x){
 if(!x) return;
 const o=SBL.o||{};
 if(o.hangDoi&&SBL.tatCa) return;           /* hang doi dang o «Tat ca» thi giu nguyen — khong tu loc */
 if(laThayToi(x)){thayGhim.add(x.id); dongThay=null; sblChonCuoi('thay:'+x.id); return}
 sblChon(x.lop, o.che==='lopmon'?x.mon:null);
}

/* ══ GDDP — BA NHÃN NGUỒN (§2.6.1). Trả [chữ, màu, chú giải] hoặc null.
   🛑 `theo_giai_doan` KHÁC `day_thay`: hai thứ chảy vào HAI CHỖ khác nhau của bảng lương
   (HDPC ⑦), nên KHÔNG gộp thành một nhãn chung. Môn một phần ⇒ chỉ còn nhánh dạy thay,
   y hệt hôm nay (PC1). */
function nhanNguon(x){
 /* DTHN-1B — phía GIÁO VIÊN GỐC: cùng một tiết, nhãn nói từ chỗ đứng của người đang xem */
 if(biThayToi(x)) return ['↔ '+tenGoi(x.gv)+' dạy thay','v','Tiết của cặp bạn được phân công, do '+GV[x.gv].n
   +' dạy thay — dòng sổ thuộc người thực dạy (gv_id), bạn chỉ đọc'];
 if(x.gvg!==x.gv) return ['🔁 Dạy thay','v','Bạn dạy thay '+GV[x.gvg].n+' — tiết này vào chỗ DẠY THAY của bảng công, không vào định mức của bạn'];
 if(x.ng==='giaidoan') return ['⏱ Theo giai đoạn','b','Bạn dạy phần này theo KẾ HOẠCH'
   +(x.giaidoan?' ('+x.giaidoan+')':'')+' — tiết nằm trong định mức của chính bạn, không phải việc phát sinh'];
 return null;
}

   <code>gv_goc_id</code>. Gán theo giáo viên trong thời khóa biểu thì <b>biên bản tiết học mang tên người đang nghỉ</b> —
   và M4.9 ghép chấm công theo <code>gv_id</code> thực dạy, nên tiết đó lập tức ra <i>Lệch người</i>.
   Tiết <b>bạn</b> dạy thay người khác nằm ở nhóm <b>🔁 Tiết dạy thay</b> cuối thanh bên — mỗi dòng một tiết.

   quản lý ở <b>M5.9</b> · ghi chú tiết giáo viên vắng ở <b>M4.7</b> · cấu hình sổ ở <b>M5.10</b>.</span></div></div>`;
}

/* ========== RENDER ========== */
let C={};                       /* lua chon sidebar da chuan hoa: {lop, mon, tatCa, muc, link} */
let lkNgoai=false;              /* dai loi cua lien ket «tiet khong phai cua toi» — giu den khi bo lien ket */
function render(){
 sidebar(); header();
 const tb=tabs();
 C=sblChuan(sblO());
 if(lkNote&&(!SBL.link||(!lkNgoai&&C.lop!==SBL.link.lop))) {lkNote='';lkNgoai=false}
 if(C.cuoi){

   const x=byId(C.cuoi.tiet);

 else if(cur){const x=byId(cur); if(!x||laThayToi(x)||(!C.tatCa&&(x.lop!==C.lop||(C.mon!=null&&x.mon!==C.mon)))) cur=null}

/* ---------- MOT TAB: ghi so tiet cua toi ---------- */
/* tiet x co thuoc lua chon dang dung o sidebar khong */
const trongChon=x=>C.tatCa||(x.lop===C.lop&&(C.mon==null||x.mon===C.mon));
/* DTHN-1B — danh sach cua CAP: tiet toi thuc day (TRU tiet toi day thay — chung o nhom cuoi)
   + tiet cua cap toi ma nguoi khac day thay (↔, CHI DOC, khong dem vao cac con so viec) */
const soCap=()=>{const g=me(); if(!g)return [];
 return SO.filter(x=>x.w===curW&&((x.gv===g&&!laThayToi(x))||biThayToi(x)))};
function viewGhi(){
 /* Noi dung = tiet cua CAP dang chon o sidebar */
 const all = soCap().filter(trongChon);
 let L = all;
 if(pham==='ngay'&&curW===TUANNAY) L=L.filter(x=>x.d===HOMNAY);
 L=applyF(L).sort((a,b)=>a.d-b.d||a.t-b.t);
 const homNay = curW===TUANNAY&&pham==='ngay';
 const allToi = all.filter(x=>x.gv===me());           /* con so viec chi dem tiet TOI thuc day */
 const hn = homNay ? allToi.filter(x=>x.d===HOMNAY) : allToi;
 const n=k=>hn.filter(x=>ttSo(x).k===k).length;
 const capHd = C.lop?`<div class="caphd"><h2>${esc(C.lop)} · ${esc(C.mon)}</h2><span>${DTTEN[LOP[C.lop].dt]}${
     C.muc&&C.muc.ghiDT?' · <span style="color:var(--violet)">'+esc(C.muc.ghiDT)+'</span>':''}</span>${
     coPhan(C.mon)?`<div class="phandai">🧩 <b>${esc(PHAN[C.mon].ten)}</b> <span>${esc(PHAN[C.mon].cc)}</span>
       <div>${esc(daiPhan(C.lop,C.mon,me())||'Bạn không giữ phần nào của môn này ở lớp này.')}</div></div>`:''}</div>`:'';
 const bang = `<div class="sumbar">
   <div class="it"><b>${hn.length}</b>${homNay?'tiết hôm nay':'tiết tuần này'}</div>
   <div class="it g"><b>${n('ghi')+n('chot')+n('dinh')}</b>đã ghi xong</div>
   <div class="it w"><b>${n('dang')}</b>đang ghi dở</div>
   <div class="it"><b>${n('chua')}</b>chưa ghi</div>
   <div class="it ${n('quagio')?'r':''}"><b>${n('quagio')}</b>quá giờ chưa ghi</div>
   ${n('dinh')?`<div class="it v"><b>${n('dinh')}</b>đã đính chính</div>`:''}
  </div>`;
 const canhbao = dauCanhBao();
 const daiCu = curW!==TUANNAY ? `<div class="oldwk">🕐
   <div class="sp"><b>Bạn đang xem ${esc(TUAN[curW-1].lb)} — tuần đã qua.</b>
    Mọi dòng sổ ở đây đều <b>đã tự chốt</b> sau ${CFG.chot} giờ, <b>không sửa trực tiếp được</b>;
    người thực dạy sửa bằng <code>✎ Đính chính</code> — <b>lý do bắt buộc</b>, bản gốc giữ nguyên, <b>không chờ ai duyệt</b>.
    Riêng tiết <b>chưa ghi</b> thì <b>vẫn ghi được</b> — nhưng gắn nhãn Ghi sổ muộn.</div>
   <button class="btn sm" data-wk="${TUANNAY}">Về tuần này</button></div>`:'';
 const _pre = dauM21();
 const lk = lkNote?`<div class="warn">${lkNote}</div>`:'';
 const trong = all.length?'Không có tiết nào khớp bộ lọc.'
   : C.lop?'Không có tiết '+esc(C.lop+' · '+C.mon)+(homNay?' hôm nay — bấm <b>Cả tuần</b>':' trong '+esc(TUAN[curW-1].lb)+' — dùng ◀ ▶ để lùi tuần')+'.'
   : 'Bạn chưa có lớp – môn nào trong phân công.';
 return _pre + capHd + scopeNote() + lk + bang + daiCu + canhbao + navbar() + filterBar() + stage(L,'tiet',trong);
}
/* dai ↩ cua cua M2.1 — dung chung cho cap thuong va dong nhom cuoi (DTHN-1B) */
function dauM21(){
 return tuVaoM21?`<div class="backbar">↩ <button data-x="veM21">‹ Quay lại Lịch dạy &amp; học</button>
   <span>Bạn vừa tới từ <b>M2.1</b> qua deep-link <code>/M2.2?ctx=…&amp;action=${esc(lkAct||'ghi')}&amp;return=M2.1</code>${
     lkAct==='ky'?' — <b>liên kết cũ <code>action=ky</code>, vẫn nhận</b> (YK-01)':''}</span></div>`:'';
}
/* Hang doi tiet qua gio chua ghi: quet CA NAM va MOI cap cua toi — khong bi tuan dang xem
   lan dong dang chon o sidebar cat mat (khung §11). Tiet nam ngoai man hinh hien nut nhay.
   DTHN-1B: tach thanh ham de dong nhom cuoi dung chung — tiet day thay qua gio chua ghi CUNG o hang doi nay. */
function dauCanhBao(){
 const ck=chuaKy(), ckCu=ck.filter(x=>x.w!==curW||!trongChon(x));
 return ck.length ? `<div class="danger">⛔ <b>${ck.length} tiết đã qua giờ mà chưa ghi sổ${
   ckCu.length?`, trong đó <b>${ckCu.length} tiết ở tuần khác hoặc lớp – môn khác</b>`:''}.</b>
   ${ckCu.length?`Danh sách này <b>quét cả năm học và mọi lớp – môn của bạn</b>, không theo tuần hay dòng đang chọn bên trái — tiết quên ghi ở tuần trước
     vẫn <b>ghi được</b> (gắn nhãn Ghi sổ muộn), và nếu không ghi thì tiết đó <b>không có biên bản</b>:
     M4.9 mất căn cứ <b>tiết thực dạy</b> của bạn.<br>${ckCu.map(x=>`<button class="btn xs" data-goto="${x.id}" style="margin:5px 5px 0 0">
       → ${esc(x.mon)} ${esc(x.lop)} · ${DOW[x.d]} ${NGAYW(x.w,x.d)} tiết ${x.t}${x.w!==curW?' · '+TUAN[x.w-1].lb.split(' ·')[0]:''}</button>`).join('')}`
   :`Ba con số <i>đã ghi xong</i> / <i>đang ghi dở</i> / <i>chưa ghi</i> là <b>ba tình huống khác nhau</b> —
     gộp lại thành "chưa hoàn tất" thì mất ý nghĩa nhắc việc.`}</div>`:'';
}
/* ══ DTHN-1B — DÒNG NHÓM CUỐI: MỘT TIẾT DẠY THAY (bản CHỐT §3.2a · b) ══
   Khung phải CHỈ có đúng tiết đó: ⛔ không thanh tổng hợp của cặp, ⛔ không điều hướng tuần, ⛔ không hiện tiết khác
   của cặp — người dạy thay KHÔNG có quyền ở mức cặp Lớp × Môn (DT-1). Panel ghi sổ mở sẵn; hai khối chỉ đọc
   «Lần trước dạy đến đâu» · «Bài tập về nhà đến hạn hôm nay» nằm đầu panel (§3.2c). */
function viewThay(m){
 const x=byId(m.tiet); if(!x) return '<div class="empty">Không tìm thấy tiết dạy thay này — lịch M4.7 đã đổi?</div>';
 const capHd=`<div class="caphd"><h2>🔁 ${esc(x.lop)} · ${esc(x.mon)} — tiết dạy thay</h2><span>${DTTEN[LOP[x.lop].dt]}
   · ${DOW[x.d]} ${NGAYW(x.w,x.d)} tiết ${x.t} (${khung(x.t)}) · thay <b style="color:var(--violet)">${esc(GV[x.gvg].n)}</b></span></div>`;
 const dai=`<div class="scopebar">🔁<div><b>Bạn dạy thay ${esc(tenGoi(x.gvg))} ĐÚNG TIẾT NÀY — không phải cặp được phân công.</b>
   Chỉ tiết này ghi được; các tiết khác của <b>${esc(x.lop)} · ${esc(x.mon)}</b> thuộc người dạy tiết đó nên <b>không hiện ở đây</b>
   <i>(quyền theo TIẾT — bản chốt dạy thay 24/9/2026)</i>. Ghi được <b>từ lúc tiết bắt đầu</b> — ⛔ không ghi trước giờ như tiết thường
   <i>(phân công dạy thay còn gỡ được tới giờ dạy)</i>. Hạn ghi và đính chính <b>theo luật chung</b>: tự chốt sau ${CFG.chot} giờ
   kể từ giờ kết thúc tiết, sau đó sửa bằng <code>✎ Đính chính</code> có vết. Nguồn: bản ghi dạy thay ở <b>M4.7</b> — không ai khai tay.
   <br><span style="font-size:11.5px">Chữa bài tập của ${esc(tenGoi(x.gvg))} trên lớp là <b>hoạt động dạy học</b> — ghi vào ô <b>Ghi chú của giáo viên</b>
   của tiết này; chấm, nhận xét từng em, xác nhận bài nộp giấy, công bố đáp án là việc của <b>chủ lượt</b> ở M2.3.</span></div></div>`;
 const lk = lkNote?`<div class="warn">${lkNote}</div>`:'';
 return dauM21() + capHd + dai + lk + dauCanhBao() + stage([x],'tiet','');
}
function navbar(){
 const nav=`<button class="btn sm" ${curW<=1?'disabled':''} data-wk="${curW-1}">◀</button>
   <select class="wksel" id="wksel">${TUAN.map(t=>
     `<option value="${t.n}" ${curW===t.n?'selected':''}>${t.lb}${t.n===TUANNAY?' · tuần này':''}</option>`).join('')}</select>
   <button class="btn sm" ${curW>=TUAN.length?'disabled':''} data-wk="${curW+1}">▶</button>
   ${curW!==TUANNAY?`<button class="btn sm" data-wk="${TUANNAY}">Về tuần này</button>`:''}`;
 return `<div class="navbar">${nav}
   ${curW===TUANNAY?`<div class="seg"><button class="${pham==='ngay'?'on':''}" data-pham="ngay">Hôm nay</button>
     <button class="${pham==='tuan'?'on':''}" data-pham="tuan">Cả tuần</button></div>`:''}
   <span style="font-size:11.5px;color:var(--ink3)">${curW===TUANNAY
     ?`Hôm nay ${DOW[HOMNAY]} ${NGAYW(TUANNAY,HOMNAY)}, ${hhmm(GIONAY)} — đang xem <b>một lớp – môn</b> nên mặc định cả tuần; đang ở lớp thì vào từ tiết trên lịch M2.1`
     :`Đang xem <b>tuần đã qua</b> — không có bộ chọn ngày`}</span></div>`;
}
/* Bo loc Lop · Mon cu (§8.1.4) da chuyen thanh SIDEBAR ben trai — o day chi con Trang thai so */
function filterBar(){
 return `<div class="navbar" style="padding-top:0">
   <select class="sel" id="ftt">${['Tất cả','Chỉ tiết chưa hoàn tất','Đã ghi xong','Đã chốt','Đã đính chính']
     .map(o=>`<option ${fTT===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
}
function applyF(L){
 let r=L.slice();
 if(fTT==='Chỉ tiết chưa hoàn tất') r=r.filter(x=>['chua','dang','quagio'].indexOf(ttSo(x).k)>=0);
 if(fTT==='Đã ghi xong') r=r.filter(x=>ttSo(x).k==='ghi');
 if(fTT==='Đã chốt') r=r.filter(x=>['chot','dinh'].indexOf(ttSo(x).k)>=0);
 if(fTT==='Đã đính chính') r=r.filter(x=>ttSo(x).k==='dinh');
 return r;
}
function stage(L,kind,trong){
 return `<div class="stage ${cur?'open':''}"><div class="listw">
   ${L.length?rows(L,kind):'<div class="empty">'+(trong||'Không có tiết nào khớp bộ lọc.')+'</div>'}
   <div class="lgd">Bấm một dòng để mở màn hình ghi sổ. Nút thao tác <b>đổi theo trạng thái</b> — không có nút vô nghĩa.</div>
  </div>${cur?panelSo():''}</div>`;
}
function rows(L,kind){
 let h='', lastD=-1;
 L.forEach(x=>{
  /* gom nhom theo ngay khi xem ca tuan, khi la Giam thi, HOAC khi xem tuan cu */
 if((pham==='tuan'||curW!==TUANNAY)&&x.d!==lastD){lastD=x.d;
   h+=`<div class="grow"><span>${DOW[x.d]} ${NGAYW(x.w,x.d)}${x.w===TUANNAY&&x.d===HOMNAY?' · hôm nay':''}</span>
     <span class="ct">${L.filter(y=>y.d===x.d).length} tiết</span></div>`;}
  h+=trow(x);
 });
 return h;
}
function trow(x){
 const s=ttSo(x), nk=nhanGhi(x), khac = x.gv!==me();
 return `<div class="trow ${x.tt==='huy'?'huy':''} ${cur===x.id?'on':''}" data-so="${x.id}">
  <div class="tm"><b>Tiết ${x.t}</b>${khung(x.t)}</div>
  <div class="bd"><b>${esc(x.mon)} · ${esc(x.lop)}</b>
   ${x.phan&&coPhan(x.mon)?`<div class="phanln">🧩 phần ${esc(tenPhan(x.mon,x.phan))}</div>`:''}
   <div class="sub">Phòng ${esc(x.phong)} · ${DTTEN[LOP[x.lop].dt]}${biThayToi(x)
     ?' · <span style="color:var(--violet)">↔ '+esc(GV[x.gv].n)+' dạy thay bạn — chỉ đọc</span>'   /* DTHN-1B — phía giáo viên gốc */
     :(khac?' · '+esc(GV[x.gv].n):'')+(x.gvg!==x.gv?' · <span style="color:var(--violet)">↔ dạy thay cho '+esc(GV[x.gvg].n)+'</span>':'')}</div></div>
  <div class="rt">
   ${(ng=>ng?`<span class="st2 ${ng[1]}" title="${esc(ng[2])}">${ng[0]}</span>`:'')(nhanNguon(x))}
   ${x.muc?`<span class="st2 ${x.muc==='Tốt'?'o':x.muc==='Khá'?'b':x.muc==='Yếu'?'r':'w'}">Ý thức: ${x.muc}</span>`:''}
   ${nk?`<span class="st2 ${nk[1]}">${nk[0]}</span>`:''}
   ${x.tt!=='huy'?`<span class="st2 ${xnNhan(x)[1]}" title="Xác nhận sĩ số của tiết — GY18-H1">${xnNhan(x)[0]}</span>`:''}
   <span class="st2 ${s.c}" title="Ghi sổ">${s.t}</span>
   ${khoaDT3(x)?`<span class="st2 n" title="DTHN-2C — tiết dạy thay chỉ ghi được từ lúc tiết bắt đầu (DT-3)">🔒 Mở lúc ${hhmm(GIO[x.t][0])}</span>`
    :(s.k==='chua'||s.k==='quagio')&&x.gv===me()?`<button class="btn sm ${s.k==='quagio'?'d':'p'}" data-so2="${x.id}">✍ Ghi sổ</button>`:''}
   ${s.k==='dang'&&x.gv===me()?`<button class="btn sm" data-so2="${x.id}">✎ Tiếp tục ghi</button>`:''}</div></div>`;
}

/* ---------- PANEL: man hinh ghi so ---------- */
function panelSo(){
 const x=byId(cur); if(!x) return '';
 const s=ttSo(x), nk=nhanGhi(x);
 const laToi = !!me() && x.gv===me();
 /* YK-01: KHONG con khoa o nhap. Chua ghi · qua gio chua ghi · dang ghi — o nhap MO NGAY khi mo man hinh */
 /* DTHN-2C (P-1): tiết TÔI DẠY THAY chưa bắt đầu ⇒ ô nhập KHÓA tới giờ bắt đầu tiết (DT-3); tiết thường giữ nguyên */
 const moKhoa = laToi && ['chua','quagio','dang'].indexOf(s.k)>=0 && !khoaDT3(x);
 const suaDuoc = laToi && s.k==='ghi';                      /* da ghi, trong 24h */
 const th=thieu(x);
 /* dieu huong tiet truoc / sau — di qua MOI tiet cua toi trong tuan (§2.4) */
 const mine=mySo().sort((a,b)=>a.d-b.d||a.t-b.t);
 const i=mine.findIndex(y=>y.id===x.id);

 let acts=[];
 if(x.tt!=='huy'&&laToi){
   /* Chua ghi va Dang ghi dung CHUNG mot bo nut (§8.2.4) */
   if(moKhoa){acts.push(['ketthuc','✓ Kết thúc','p']); acts.push(['chep','⇩ Chép từ nội dung dự kiến','']); acts.push(['luutam','💾 Lưu tạm',''])}
   if(s.k==='ghi') acts.push(['sua','✎ Sửa','']);
   /* SDBG-1A · S6: qua moc chot ⇒ DINH CHINH CO VET, khong con «de nghi sua» cho PHT_CM duyet */
   if((s.k==='chot'||s.k==='dinh')&&!hetHanDC(x)) acts.push(['dinhchinh','✎ Đính chính','']);
   if(s.k==='dinh') acts.push(['xemgoc','📄 Xem bản gốc','']);
 }
 if(x.tt!=='huy') acts.push(['ban','📄 Xem bản in','']);

 return `<div class="panel"><div class="ph">
   <div class="n"><h2>${esc(x.mon)}${x.phan&&coPhan(x.mon)?' <i style="font-weight:500;font-style:normal;color:var(--violet)">· phần '+esc(tenPhan(x.mon,x.phan))+'</i>':''} · Lớp ${esc(x.lop)}</h2>
    <div class="m"><span class="pill">${DOW[x.d]} ${NGAYW(x.w,x.d)}</span>
     <span class="pill">Tiết ${x.t} · ${khung(x.t)}</span>
     <span class="pill">Phòng ${esc(x.phong)}</span>${x.truc?'<span class="pill">🖥 trực tuyến</span>':''}
     <span class="pill">${DTTEN[LOP[x.lop].dt]}</span>
     <span class="st2 ${s.c}">${s.t}</span>${nk?`<span class="st2 ${nk[1]}">${nk[0]}</span>`:''}</div></div>
   <button class="btn sm" data-x="close">✕</button></div>

  ${i<0?'':/* DTHN-1B: tiet ↔ nguoi khac day thay khong phai «tiet cua toi» ⇒ khong co thanh chuyen nhanh */`<div class="pnav"><button class="btn xs" ${i<=0?'disabled':''} data-nav="${i>0?mine[i-1].id:''}">‹ Tiết trước</button>
   <span class="sp" style="text-align:center">${i+1} / ${mine.length} tiết của tôi trong tuần — chuyển nhanh <b>ngay trong panel</b>; sang lớp khác thì sidebar đi theo</span>
   <button class="btn xs" ${i>=mine.length-1?'disabled':''} data-nav="${i<mine.length-1?mine[i+1].id:''}">Tiết sau ›</button></div>`}

  <div class="pbody">
   ${x.tt==='huy'?blkHuy(x):blkDC(x)+blkSo(x,s,laToi,moKhoa,suaDuoc,th)}
   ${blkLog(x)}
  </div>
  ${acts.length?`<div class="cact">${acts.map(([k,t,c])=>
    `<button class="btn ${c==='p'?'p':c==='d'?'d':''}" data-act="${k}">${t}</button>`).join('')}
    ${(moKhoa&&th.length)?`<span style="font-size:11.5px;color:var(--red);margin-left:auto">Còn thiếu ${th.length} trường bắt buộc</span>`:''}
    ${(laToi&&(s.k==='chot'||s.k==='dinh'))?`<span style="font-size:11px;color:var(--ink3);margin-left:auto;max-width:330px">${hanDCTxt(x)}</span>`:''}</div>`:''}
 </div>`;
}

/* Tiet Huy — dong so RUT GON. SDBG-1A (S1): ghi chu tinh hinh lop + cach xu ly THUOC M4.7 (tiet Huy),
   Giam thi va PHT_DT ghi o do. M2.2 chi CHIEU 🔗 — khong co o nhap nao, khong co nut luu. */
function blkHuy(x){
 return `<div class="danger"><b>Tiết bị hủy — dòng sổ RÚT GỌN.</b>
   Không có mốc giờ ghi sổ, không có nội dung dạy, không có xếp loại ý thức, không sinh điểm danh tiết,
   <b>không tính vào tiết thực dạy</b> ở M4.9. Nhưng vẫn có mặt trên lưới để lớp <b>không mất vết</b>.</div>

  <div class="card"><div class="ch">Ghi chú tiết giáo viên vắng <span class="sp"></span>
    <span style="font-weight:400;font-size:11px;color:var(--ink3)">🔗 bản chiếu chỉ đọc từ M4.7</span></div>
   <div class="cb">
    <div class="f"><div class="k">Cách xử lý</div><div class="v">${esc(x.xuly||'—')}</div></div>
    <div class="f"><div class="k">Ghi chú tình hình lớp</div><div class="v" style="font-weight:400">${x.ghichuGT?esc(x.ghichuGT):'<span style="color:var(--ink3)">chưa có ghi chú</span>'}</div></div>
    <div class="f"><div class="k">Người ghi · lúc</div><div class="v" style="font-weight:400">${x.boiGT?esc(x.boiGT)+' · '+esc(x.lucGT):'—'}</div></div>
    <div class="roblk" style="margin-top:8px">Ô ghi chú này <b>thuộc tiết <code>Hủy</code> ở M4.7</b> — nơi tiết bị hủy và đã bắt chọn
     cách xử lý. <b>Giám thị</b> và <b>PHT_DT</b> ghi ở đó; sổ đầu bài của giáo viên chỉ <b>chiếu lại</b> để lớp không mất vết.
     ${co('m47')?'<button class="rolnk" data-x="m47">↗ Mở tiết này ở M4.7</button>':''}</div>
   </div></div>`;
}

function blkSo(x,s,laToi,moKhoa,suaDuoc,th){
 const dis = moKhoa?'':'disabled';
 const chuaGhi = s.k==='chua'||s.k==='quagio';
 return `
  ${laToi&&khoaDT3(x)?`<div class="warn">🔒 <b>Tiết dạy thay chưa bắt đầu — ô ghi sổ mở lúc ${gioMo(x)}.</b>
    Tiết thường ghi trước giờ được (gắn nhãn <b>⏱ Ghi trước giờ tiết</b>); tiết <b>dạy thay</b> thì <b>không</b>: trước giờ dạy, phân công dạy thay
    <b>còn gỡ được</b> — ${esc(tenGoi(x.gvg))} rút đơn nghỉ thì tiết trở về ${esc(tenGoi(x.gvg))} (M4.7), và chữ bạn gõ sẵn sẽ nằm lại trên
    biên bản tiết học của người khác. Từ lúc tiết bắt đầu, phân công <b>không gỡ được nữa</b> — ô mở, ghi như tiết thường.
    <i>(ràng buộc 38 · bản chốt dạy thay §7.3 — mở rộng DT-3.)</i> Soạn trước thì soạn ở giáo án của bạn.</div>`
   :chuaGhi&&laToi?`<div class="${s.k==='quagio'?'danger':'info'}">
    ${s.k==='quagio'?'⛔ <b>Tiết đã qua giờ mà chưa ghi sổ.</b> Vẫn ghi được — hệ thống <b>không chặn cứng</b>, vì chặn thì bạn mất luôn biên bản tiết. Khi bấm <b>✓ Kết thúc</b> sẽ gắn nhãn <b>Ghi sổ muộn</b> và ghi audit.'
      :'✍ <b>Chưa ghi.</b> Ô nhập <b>mở sẵn</b> — không có nút nào phải bấm trước.'}
    <br><b>Sổ đầu bài ghi việc DẠY, không ghi việc CHẤM CÔNG.</b> Giờ giấc lên lớp do <b>thiết bị tại cửa lớp</b> ghi (M4.9).
    Sổ chỉ lưu <b>giờ lưu lần đầu</b> và <b>giờ ✓ Kết thúc</b> — dùng cho nề nếp chuyên môn, không dùng chấm công.</div>`:''}

  ${!laToi&&biThayToi(x)?`<div class="ro">↔ <b>${esc(tenGoi(x.gv))} dạy thay bạn tiết này — chỉ đọc.</b>
    Dòng sổ thuộc <b>người thực dạy</b> (<code>gv_id</code>) — bạn đọc để nối mạch bài của cặp mình, <b>không có nút ghi nào</b>.
    Việc chữa bài tập của bạn trên lớp (nếu có) nằm ở ô <b>Ghi chú của giáo viên</b>; nó cũng hiện ở khối
    «Lần trước dạy đến đâu» của tiết kế tiếp của bạn.</div>`
   :!laToi?`<div class="ro">👁 <b>Tiết của ${esc(GV[x.gv].n)} — chỉ đọc.</b>
    Sổ đầu bài là ghi chép của <b>người đứng lớp tiết đó</b>; M2.2 là menu của người đứng lớp. ${loiKhac(x)}</div>`:''}

  ${lanTruoc(x)}
  ${x.gvg!==x.gv?blkBTVN(x,laToi&&moKhoa):''}

  <div class="card"><div class="ch">Thông tin cố định <span class="sp"></span>
    <span style="font-weight:400;font-size:11px;color:var(--ink3)">bản chiếu chỉ đọc từ M4.7</span></div><div class="cb">
   ${x.phan&&coPhan(x.mon)?`<div class="f"><div class="k">Phần</div><div class="v">${esc(tenPhan(x.mon,x.phan))}
     ${(ng=>ng&&ng[0].charAt(0)==='⏱'?`<span class="st2 ${ng[1]}">${ng[0]}</span>
       <span style="font-weight:400;font-size:11px;color:var(--ink3)">— ${esc(x.giaidoan||'')}</span>`:'')(nhanNguon(x))}
     <div style="font-weight:400;font-size:11px;color:var(--ink3);margin-top:3px">
       ${esc(PHAN[x.mon].ten)} · bản chụp tại lúc sinh tiết — M2.2 không tự tra lịch triển khai phần (M5.1 ⑤)</div></div></div>`:''}
   <div class="f"><div class="k">Giáo viên thực dạy</div><div class="v">${esc(GV[x.gv].n)}
     ${x.gvg!==x.gv?`<span class="st2 v">🔁 Dạy thay cho ${esc(GV[x.gvg].n)}</span>`:''}</div></div>
   <div class="f"><div class="k">Nội dung dự kiến</div><div class="v" style="font-weight:400">
     ${x.phan&&coPhan(x.mon)?'Theo bảng chia tiết của <b>phần '+esc(tenPhan(x.mon,x.phan))+'</b>':'Bài 4 — Định luật về công'}
     <span class="rolnk" data-x="kh">🔗 Kế hoạch giảng dạy (M5.1)</span></div></div>
   <div class="f"><div class="k">Giờ lưu lần đầu</div><div class="v">${mocGio(x.ky)}</div></div>
   <div class="f"><div class="k">Giờ ✓ Kết thúc</div><div class="v">${mocGio(x.gkt)}
     <span style="font-weight:400;font-size:11px;color:var(--ink3)">— chỉ số nề nếp, không chảy sang M4.9</span></div></div>
  </div></div>

  <div class="card ${moKhoa?'':'lock'}"><div class="ch">Nội dung giáo viên điền
    ${moKhoa?'':'<span class="sp"></span><span style="font-weight:400;font-size:11px">'+(!laToi?'chỉ đọc'
      :khoaDT3(x)?'🔒 khóa tới '+hhmm(GIO[x.t][0])+' — giờ bắt đầu tiết dạy thay'
      :(s.k==='chot'||s.k==='dinh')?'đã chốt — sửa bằng ✎ Đính chính ở cuối panel':'đã kết thúc')+'</span>'}</div>
   <div class="cb p">
    <div class="fld"><label>Nội dung dạy thực tế <span class="req">*</span>
      ${moKhoa?'<button class="rolnk" data-x="chep">⇩ Chép từ nội dung dự kiến</button>':''}</label>
     <textarea class="fldi ${moKhoa&&th.some(t=>t[0]==='nd')?'err':''}" id="fnd" rows="2" ${dis}
       placeholder="Bài, mục đã dạy">${esc(x.nd||'')}</textarea></div>

    ${blkSiSo(x,moKhoa)}

    ${blkDiemDanh(x,moKhoa)}

    ${batYThuc(x.lop)?`<div class="fld"><label>Xếp loại ý thức lớp <span class="req">*</span></label>
     <div class="mucs">${MUC.map(m=>`<button class="muc ${x.muc===m?'on':''} ${moKhoa&&th.some(t=>t[0]==='muc')?'':''}"
       ${dis} data-muc="${m}">${m}</button>`).join('')}</div>
     <div class="roblk" style="margin-top:7px"><b>Không có căn cứ pháp lý.</b> TT 22/2021 chỉ xếp loại rèn luyện
      <b>cả học kỳ và cả năm</b>, không có xếp loại theo từng tiết. Đây là <b>tiêu chí nội bộ của trường</b> —
      bật/tắt được theo cấp học tại <b>⚙ M5.10 Cấu hình chuyên môn</b>, <b>mặc định tắt với Tiểu học</b>. ${loiCfg()}</div></div>`
     :`<div class="fld"><div class="roblk">Xếp loại ý thức lớp <b>đang tắt</b> cho cấp học này tại ⚙ M5.10. ${loiCfg()}</div></div>`}

    ${blkSuViec(x,moKhoa,laToi)}

    <div class="fld"><label>Ghi chú của giáo viên${laThayToi(x)?' <span style="font-weight:400;color:var(--ink3)">— chỗ ghi việc <b>chữa bài</b> của '+esc(tenGoi(x.gvg))+'</span>':''}</label>
     <textarea class="fldi" id="fgc" rows="2" ${dis} placeholder="${laThayToi(x)
       ?'Ví dụ: Đã chữa bài … của '+esc(tenGoi(x.gvg))+'; 3 em chưa làm: …; thu 2 bài giấy, để ở tủ tổ'
       :'Tự do'}">${esc(x.gc||'')}</textarea></div>
   </div>
   ${suaDuoc?`<div class="cact"><span style="font-size:11.5px;color:var(--ink2)">Đã kết thúc — còn
     <b>${Math.max(0,Math.round((CFG.chot*60-(NOW-absW(x.w,x.d,GIO[x.t][1])))/60))} giờ</b> để sửa tự do.
     Mốc chốt tính từ <b>giờ kết thúc tiết</b>, không tính từ lúc ghi <i>(🔗 tham số của M5.10)</i>. Quá mốc thì sửa bằng <b>✎ Đính chính</b>.</span></div>`:''}
  </div>`;
}

/* ===== GY18-H1 — O XAC NHAN SI SO CUA TIET =====
   Khong phai o go so: hai nut, va nhanh "co em vang" BAT chon TEN. Khong co han nop — giao vien ghi so
   buoi toi van hop le (moc chot 24h cua §8.6.1 khong doi). */
function blkSiSo(x,moKhoa){
 const s=siSo(x), tt=xnTT(x), td=laTietDau(x), b=BUOI(x.t), nh=xnNhan(x);
 return `<div class="fld"><label>Sĩ số có mặt</label>
  <div class="roblk"><b style="font-size:19px;color:var(--ink)">${s.n==null?'—':s.n}</b> / ${x.ss}
   &nbsp;— <b>con số DẪN XUẤT, không có ô nhập tay</b><br>
   <span style="font-size:11.5px">${
    s.ng==='chot'?`${x.ss} sĩ số − ${x.vangDN.length} vắng đầu ngày <b>(bản chốt của GVCN — M2.9/T2)</b>
      − ${x.bd.length} biến động trong tiết.`
   :s.ng==='xn'?`GVCN <b>chưa chốt điểm danh đầu ngày</b>. Đang <b>tạm tính theo ô xác nhận của chính tiết này</b>:
      ${x.ss} sĩ số − ${s.vang} em bạn xác nhận vắng − ${x.bd.length} biến động trong tiết.
      GVCN chốt xong thì con số lấy theo <b>bản chốt</b>, không lấy theo ô này.`
   :`<b>Chưa có căn cứ.</b> GVCN chưa chốt điểm danh đầu ngày và tiết này chưa xác nhận sĩ số —
      hệ thống <b>không đoán</b> một con số. Xác nhận ngay dưới đây.`}
    Cho gõ đè một con số thì nó không khớp với danh sách học sinh vắng, phụ huynh của em vắng không nhận được
    thông báo, và báo cáo chuyên cần lệch với sổ đầu bài vĩnh viễn.</span></div>

  <div class="xnbox ${tt}">
   <div class="xnh">Xác nhận sĩ số của tiết <span class="st2 ${nh[1]}">${nh[0]}</span>
    <span class="sp"></span><span class="xnhan">không có hạn — ghi sổ buổi tối vẫn hợp lệ</span></div>
   ${moKhoa?`<div class="xnb">
     <button class="btn ${tt==='du'?'p':''}" data-x="xndu">✓ Lớp đủ</button>
     <button class="btn ${tt==='vang'?'p':''}" data-x="xnvang">Có em vắng → chọn tên</button>
     ${tt!=='chua'?`<button class="btn d" data-x="xnbo">↩ Bỏ xác nhận</button>`:''}</div>`:''}
   ${tt==='vang'?`<div class="xnds">${x.xn.ds.map(([h,ly])=>`<div class="dd"><div class="nm">
     <b>${esc(HS[h]?HS[h].n:h)}</b><span>${esc(ly||'chưa rõ lý do — lý do là việc của gia đình với GVCN')}</span>
     </div></div>`).join('')}</div>`:''}
   ${x.xn?`<div class="xnhan">${esc(GV[x.xn.boi]?GV[x.xn.boi].n:x.xn.boi)} xác nhận lúc ${esc(x.xn.luc)}</div>`:''}
   ${(()=>{const L=lechXN(x); if(!x.xn||!x.ddChot) return '';
     return L?`<div class="warn" style="margin-top:9px">⚠ <b>Lệch với bản chốt điểm danh đầu ngày của GVCN.</b>
        ${L.them.length?`Tiết này báo vắng <b>${L.them.map(h=>esc(HS[h]?HS[h].n:h)).join(', ')}</b> mà bản chốt
          không có. `:''}${L.bot.length?`Bản chốt báo vắng <b>${L.bot.map(h=>esc(HS[h]?HS[h].n:h)).join(', ')}</b>
          mà tiết này không nêu. `:''}
        <br>Hệ thống <b>không đè bên nào</b>: ${laTietDau(x)
         ?`bên M2.9/T2 việc này hiện thành <b>đề nghị đính chính</b> để <b>GVCN quyết</b>`
         :`tiết này không phải tiết đầu buổi nên chỉ ghi nhận tại chỗ`}, sổ đầu bài <b>giữ nguyên</b>
        điều bạn xác nhận. Sĩ số ở trên vẫn tính theo <b>bản chốt</b> — nguồn của con số phải có <b>một chủ</b>.</div>`
      :`<div class="xnhan" style="margin-top:7px">✓ Khớp bản chốt điểm danh đầu ngày của GVCN.</div>`})()}
   <div class="roblk" style="margin-top:9px">${td
    ?`⧉ <b>Đây là tiết đầu ${BUOITEN[b]} của lớp ${esc(x.lop)}</b> — <b>dẫn xuất từ lịch M4.7</b>
       (tiết có thứ tự nhỏ nhất của lớp trong buổi), không ai khai tay. Xác nhận ở đây chảy sang
       <b>M2.9/T2</b> thành <b>gợi ý</b> điểm danh đầu ngày — <b>người chốt vẫn là giáo viên chủ nhiệm</b>.
       Bạn <b>không</b> chấm điểm danh và <b>không</b> sửa được ô nào của GVCN.`
    :`Tiết này <b>không phải tiết đầu ${BUOITEN[b]}</b> nên xác nhận chỉ dùng cho <b>chính dòng sổ này</b>,
       không thành gợi ý ở M2.9. Một buổi <b>một nguồn gợi ý</b>: nhiều nguồn thì GVCN phải xử ba bốn con số
       nói khác nhau — đúng thứ mô hình ba tầng sinh ra để tránh.`}
    <br><b>Vì sao phải có ô này:</b> một dòng sổ để trống trước đây <b>không nói được</b>
    <i>«thầy chưa nhập»</i> khác <i>«thầy xác nhận lớp đủ»</i> — nên bên M2.9 không biết có nên tin con số hay không.</div>

/* Lan truoc day den dau — giai nhu cau pho bien nhat ma KHONG can dieu huong tuan.
   Voi mon 1 tiet/tuan, tiet gan nhat LUON o tuan truoc. */
function lanTruoc(x){
 /* GDDP (v2.5) — môn CHIA PHẦN thì «lần trước» là của PHẦN, không của cặp: người dạy mạch
    Văn hóa – lịch sử hỏi «mạch của tôi tới đâu», không hỏi «tiết gần nhất của lớp là gì».
    Trả lời bằng tiết của phần khác là TRẢ LỜI SAI CÂU HỎI. 🛑 Không rơi xuống lấy phần khác. */
 const theoPhan = !!(x.phan&&coPhan(x.mon));
 const truoc=SO.filter(y=>y.lop===x.lop&&y.mon===x.mon&&y.nd&&(!theoPhan||y.phan===x.phan)&&
    absW(y.w,y.d,GIO[y.t][0]) < absW(x.w,x.d,GIO[x.t][0]))
   .sort((a,b)=>absW(b.w,b.d,GIO[b.t][0])-absW(a.w,a.d,GIO[a.t][0]))[0];
 if(!truoc) return `<div class="roblk" style="margin-bottom:11px">Chưa có tiết nào trước đó của
   <b>${esc(x.mon)}${theoPhan?' · phần '+esc(tenPhan(x.mon,x.phan)):''} lớp ${esc(x.lop)}</b> trong năm học này.${
   theoPhan?' Danh sách <b>chỉ tính phần của bạn</b> — tiết của phần khác cùng môn không phải là lần trước của bạn.':''}</div>`;
 const cungTuan = truoc.w===x.w;
 /* DTHN-1B — khối đọc dòng sổ gần nhất của CẶP BẤT KỂ AI DẠY (giáo viên gốc, người dạy thay khác) — đúng từ trước,
    nay nói ra: khác người dạy ⇒ ghi tên người đã dạy + ô Ghi chú (chỗ người dạy thay ghi việc CHỮA BÀI — bản CHỐT §3.3e).
    Tiết TÔI dạy thay mà dòng trước KHÔNG phải của tôi ⇒ ⛔ không nút «Mở dòng sổ đó» (DT-1: không mở tiết khác của cặp). */
 const khacNg = truoc.gv!==x.gv, chanMo = laThayToi(x)&&truoc.gv!==me();
 return `<div class="lastles">📖 <b>Lần trước dạy đến đâu</b>${theoPhan?' <span class="st2 v">phần '+esc(tenPhan(x.mon,x.phan))+'</span>':''} — ${DOW[truoc.d]} ${NGAYW(truoc.w,truoc.d)}
   tiết ${truoc.t}${cungTuan?'':` <span class="st2 w">${esc(TUAN[truoc.w-1].lb)}</span>`}${
   khacNg?` · <b>${esc(tenGoi(truoc.gv))}</b> dạy${truoc.gvg!==truoc.gv?' <i>(dạy thay '+esc(tenGoi(truoc.gvg))+')</i>':''}`:''}
   ${chanMo?'<span style="font-size:11px;color:var(--ink3)">— chỉ đọc nội dung, dòng sổ thuộc '+esc(tenGoi(truoc.gv))+'</span>'
     :`<button class="rolnk" data-goto="${truoc.id}">Mở dòng sổ đó</button>`}
   <div style="margin-top:4px">${esc(truoc.nd)}</div>${khacNg&&truoc.gc?`<div style="margin-top:4px">📝 <i>Ghi chú của ${esc(tenGoi(truoc.gv))}:</i> ${esc(truoc.gc)}</div>`:''}
   ${cungTuan?'':`<div style="margin-top:5px;font-size:11.5px">Tiết gần nhất của môn này nằm ở <b>tuần trước</b> —
     đây chính là lý do màn hình phải lùi tuần được. Với môn <b>1 tiết/tuần</b> thì điều đó là <b>luôn luôn</b>.</div>`}
  </div>`;
}

    <tr><td><b>Lưu ở đâu</b></td><td>Trong dòng sổ</td><td>Kho quyết định của học sinh — M1.1 tab F</td></tr>
    <tr><td><b>Vào học bạ</b></td><td>Không</td><td>${khen?'Xem M2.10':'<b>Không</b> — TT 19/2025 bỏ ghi kỷ luật vào học bạ'}</td></tr>
    <tr><td><b>Phụ huynh thấy</b></td><td>Qua Báo cáo học tập tuần (M2.9/T6)</td><td>${khen?'Khi công bố':'Notification cá nhân khi có hiệu lực'}</td></tr>

    Loại vi phạm là <b>Master của M2.7</b> (mã <code>HV*</code>), M2.2 chỉ đọc.</div>`,

}
/* Luu lan dau: sinh MOC 'gio luu lan dau' + chuyen Chua ghi → Dang ghi. KHONG sinh khi mo man hinh. */
function luuLan1(x){
 if(x.ky) return false;
 x.ky=NOW; if(x.tt==='chua') x.tt='dang';
 (x.log=x.log||[]).push([NGAYW(TUANNAY,HOMNAY)+' '+hhmm(GIONAY),GV[me()].n,'✍ Bắt đầu ghi','Lưu lần đầu']);
 return true;
}
function act(a,id){
 if(a==='close'){if(C.cuoi)dongThay=C.cuoi.k; cur=null;render();return}
 /* DTHN-1B — chen goi y chua bai vao o Ghi chu cua DONG SO CUA TOI (khong cham vao luot cua chu luot) */
 if(a==='chuabai'){const x=byId(cur); if(!x||!laThayToi(x))return;
   const L=BTVN_M23.filter(b=>b.lop===x.lop&&b.mon===x.mon&&b.han[0]===x.w&&b.han[1]===x.d);
   const f=$('#fgc'); if(f)x.gc=f.value;
   x.gc=(x.gc?x.gc.trim()+' ':'')+'Đã chữa '+L.map(b=>b.ten.split(' — ')[0].replace(/^Bài/,'bài')).join(', ')+' của '+tenGoi(x.gvg)+'; … em chưa làm: …';
   luuLan1(x); render(); toast('⇩ Đã chèn gợi ý vào <b>Ghi chú của giáo viên</b> — sửa tên các em chưa làm rồi lưu. Lượt vẫn thuộc '+esc(tenGoi(x.gvg))+' (M2.3)');return}
 /* DTHN-1B — «Tra tiet cu hon» (ban CHOT §3.2e): tiet day thay cu hon 4 tuan, da xong viec — mo thi ghim vao nhom cuoi */
 if(a==='thaycu'){const dang=sblThay().map(m=>m.tiet);   /* DTHN-2C (P-7): «cũ hơn» = ngoài cửa sổ 28 ngày theo NGÀY */
   const cu=SO.filter(x=>laThayToi(x)&&x.tt!=='huy'&&dang.indexOf(x.id)<0&&!trongCuaSo(x))
     .sort((a,b)=>absW(b.w,b.d,b.t)-absW(a.w,a.d,a.t));
   modal('🔁 Tra tiết dạy thay cũ hơn 28 ngày',
    `<div class="info">Nhóm <b>🔁 Tiết dạy thay</b> ở thanh bên chỉ giữ tiết <b>28 ngày gần nhất</b> <i>(tính cả hôm nay)</i>, <b>mọi</b> tiết <b>đã xếp sắp tới</b> và tiết <b>còn việc</b> — để nhóm không dài ra
      cả năm. Tiết cũ hơn tra ở đây; bấm <b>Mở</b> thì tiết được ghim vào nhóm cho tới khi đổi vai. Quyền vẫn là quyền trên <b>đúng tiết đó</b>.</div>
     ${cu.length?`<table class="tb"><tr><th>Tiết</th><th>Thay</th><th>Ghi sổ</th><th></th></tr>${cu.map(x=>`<tr><td>${esc(x.lop)} · ${esc(x.mon)} · ${DOW[x.d]} ${NGAYW(x.w,x.d)} tiết ${x.t}</td>
       <td>${esc(GV[x.gvg].n)}</td><td>${ttSo(x).t}</td><td><button class="btn xs" data-thaymo="${x.id}">Mở</button></td></tr>`).join('')}</table>`
      :'<div class="roblk">Chưa có tiết dạy thay nào cũ hơn 28 ngày trong năm học này — mọi tiết dạy thay của bạn đang ở nhóm cuối thanh bên.</div>'}`,
    [['Đóng',0]]);
   document.querySelectorAll('[data-thaymo]').forEach(el=>el.onclick=()=>{const x=byId(el.dataset.thaymo); closeM(); theoTiet(x); render()});
   return}
 if(a==='closeL'){curL=null;render();return}
 if(a==='veM21'){tuVaoM21=false;render();toast('↩ Quay lại M2.1 · giữ nguyên tuần đang xem');return}
 if(a==='chep'){const x=byId(cur); x.nd='Bài 4 — Định luật về công'; luuLan1(x); render();
   toast('Đã chép từ nội dung dự kiến — sửa lại nếu dạy khác kế hoạch · <b>'+ttSo(x).t+'</b>');return}
 if(a==='luutam'){const x=byId(cur), f=$('#fnd'); if(f)x.nd=f.value;
   if(!(x.nd||'').trim()&&!x.muc){toast('Chưa có ô nội dung nào để lưu — dòng sổ vẫn <b>Chưa ghi</b>');return}
   const dau=luuLan1(x); render();
   toast('💾 Đã lưu tạm · <b>'+ttSo(x).t+'</b>'+(dau?' · giờ lưu lần đầu '+hhmm(GIONAY):'')+
     (nhanGhi(x)?' · nhãn <b>'+nhanGhi(x)[0]+'</b>':''));return}

 if(a==='ketthuc'){
   const x=byId(cur), th=thieu(x);
   if(th.length){
     modal('⛔ Chưa kết thúc được',
      `<div class="danger" style="margin-bottom:12px"><b>Còn thiếu ${th.length} trường bắt buộc.</b>
        Màn hình nêu <b>chính xác thiếu gì</b> kèm liên kết cuộn tới đúng ô — không hiện một dòng
        "vui lòng điền đầy đủ" rồi để bạn tự dò.</div>
       <table class="tb"><tr><th>Trường còn thiếu</th><th></th></tr>
        ${th.map(([k,n])=>`<tr><td><b>${esc(n)}</b></td><td><button class="btn xs">Điền ngay</button></td></tr>`).join('')}
       </table>`,[['Đóng',0]]);
     return;
   }
   luuLan1(x); x.tt='ghi'; x.gkt=NOW;
   const nh=nhanGhi(x);
   x.log.push([NGAYW(TUANNAY,HOMNAY)+' '+hhmm(GIONAY),GV[me()].n,'✓ Kết thúc',nh?nh[0].replace('⏱ ',''):'']);
   render(); toast('✓ Đã ghi xong sổ'+(nh?' · gắn nhãn <b>'+nh[0]+'</b>':'')+' · sửa tự do trong '+CFG.chot+' giờ kể từ <b>giờ kết thúc tiết</b>');
   return}

 if(a==='sua'){const x=byId(cur); x.tt='dang'; render();
   toast('Mở lại để sửa — vẫn trong cửa sổ '+CFG.chot+' giờ');return}

 /* ===== SDBG-1A · S6 — DINH CHINH CO VET (thay «de nghi sua» + «duyet») =====

     <div class="fld"><label>Học sinh bị nhắc nhở <span style="font-weight:400;color:var(--ink3)">— bỏ tích là bớt dòng · thêm / bớt thì <b>báo GVCN ${esc(cn.n)}</b></span></label>

      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">

       <select class="fldi" id="dcnhv" style="flex:1;min-width:140px">${Object.keys(HANHVI).map(m=>`<option value="${m}">${esc(hvTen(m))}</option>`).join('')}</select></div></div>

          <tr><th>Nội dung</th><td>${esc(GV[me()].n)} đã đính chính sổ ${esc(x.mon)} lớp ${esc(x.lop)} · ${DOW[x.d]} ${NGAYW(x.w,x.d)} tiết ${x.t}:
            ${[...boN.map(n=>'bỏ nhắc nhở '+nhacTxt(n)),...themN.map(n=>'thêm nhắc nhở '+nhacTxt(n))].join('; ')}. Lý do: <i>${esc(ly)}</i></td></tr>

          <tr><th>Thi đua nền nếp</th><td>M6.13 đã chốt tuần thì <b>giữ số đã chốt</b>, hiện cảnh báo «sổ đầu bài đã đính chính sau chốt»</td></tr></table>`,

 tuVaoM21 = tu==='M2.1'&&laToi;
 render();
 if(cur) toast('↩ Từ '+esc(tu||'liên kết')+' — đã chọn sẵn <b>'+esc(x.lop+' · '+x.mon)+'</b> và mở tiết '+x.t+' '+DOW[x.d]+' '+NGAYW(x.w,x.d));

  [f('lan','9A2','Ngữ văn',2,1,1),'9A2 · Ngữ văn · T3 tiết 1 (tiết của cô Lan — không phải của tôi)'],
  [f('hung','9A2','Vật lí',2,0,2),'9A2 · Vật lí · T2 tiết 2 (tiết thầy Hùng — thử bằng vai GVCN / TTCM)'],
  ['9A2','?ctx=9A2 (liên kết lớp × tuần cũ của M5.2)']
 ];
 const s=document.getElementById('dlsel'); if(!s) return;
 s.innerHTML='<option value="">🔗 Thử cửa M2.1 — bấm một tiết…</option>'+ds.filter(d=>d[0]).map(d=>`<option value="${d[0]}">${esc(d[1])}</option>`).join('');
 s.onchange=()=>{const v=s.value; s.value=''; if(v) moLink(v,'ghi','M2.1')};
})();
/* nạp trang: có ?ctx= / #ctx= thì theo liên kết. KHÔNG có thì mở menu THƯỜNG (SDBG-1A — bỏ màn mô phỏng «vào từ M2.1»):
   cặp mở sẵn theo luật S8 (tiết ghi dở sớm nhất → 8A1 · Vật lí), panel ĐÓNG — thấy trọn danh sách tiết của cặp. */
(function(){
 const q='&'+String(location.search||'').replace(/^\?/,'')+'&'+String(location.hash||'').replace(/^#/,'');
 const g=k=>{const m=q.match(new RegExp('&'+k+'=([^&]+)'));return m?decodeURIComponent(m[1]):''};
 if(g('ctx')){ moLink(g('ctx'),g('action'),g('return'));
   if(g('tuan')){const w=+g('tuan');
     if(TUAN.some(t=>t.n===w)){curW=w;render()} else toast('↩ Liên kết xin tuần '+w+' — demo chỉ dựng tuần 1–2, đang mở tuần '+curW)}}
 else render();
})();
</script>
