<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1.11 Xét duyệt học bổng — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}

/* ═════════ M6.10 KÝ TÚC XÁ ═════════ */
.simtg{display:inline-flex;align-items:center;gap:6px;border:1px solid #475569;border-radius:8px;padding:3px 9px;font-size:11.5px;color:#cbd5e1;background:#1e293b}
.simtg.off{border-color:#b45309;color:#fcd34d}

/* thẻ phòng ở tab 1 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
.pcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer}
.pcard:hover{border-color:var(--brand);box-shadow:0 1px 6px rgba(29,78,216,.10)}
.pcard.sel{border-color:var(--brand);background:var(--brand-soft)}
.pcard.off{opacity:.62;cursor:default}
.pcard.off:hover{border-color:var(--line);box-shadow:none}
.pcard .pn{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px}
.pcard .pm{font-size:11.5px;color:var(--ink3);margin:2px 0 7px}
.bdg{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px;margin:2px 3px 0 0}
.bdg.r{background:var(--red-soft);color:var(--red)}
.bdg.a{background:var(--amber-soft);color:var(--amber)}
.bdg.g{background:var(--green-soft);color:var(--green)}
.bdg.n{background:#f1f5f9;color:var(--ink2)}
.bdg.v{background:#f5f3ff;color:var(--violet)}
.bdg.rr{background:var(--red);color:#fff}

/* cột gợi ý của máy — tầng 2 */
.hint2{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap}
.hint2.in{background:var(--green-soft);color:var(--green)}
.hint2.out{background:var(--red-soft);color:var(--red)}
.hint2.perm{background:var(--brand-soft);color:var(--brand)}
.hint2.none{background:#f1f5f9;color:#64748b}
.dev{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.dev.o{color:var(--red);font-weight:600}
.dev.i{color:var(--green);font-weight:600}
.dev.m{color:var(--ink3)}

/* năm nút trạng thái điểm danh — tô bằng chính màu trạng thái */
.dd{display:inline-flex;gap:3px}
.dd button{width:30px;height:27px;border:1px solid var(--line2);border-radius:7px;background:#fff;font-size:12px;font-weight:700;color:var(--ink2);display:grid;place-items:center}
.dd button:hover{border-color:var(--ink3)}
.dd button.on{color:#fff;border-color:transparent}
.dd button.on[data-s="cm"]{background:var(--green)}
.dd button.on[data-s="vp"]{background:var(--brand)}
.dd button.on[data-s="kp"]{background:var(--red)}
.dd button.on[data-s="vien"]{background:var(--violet)}
.dd button.on[data-s="nha"]{background:#0f766e}
.dd.lk button{opacity:.45;cursor:not-allowed}
.srcline{font-size:10.5px;color:var(--ink3);margin-top:2px}
tr.nocham td{background:#fffbeb}
tr.nocham td:first-child{font-weight:700}
tr.susp td{background:#fef2f2}

/* sơ đồ giường */
.khu{margin-bottom:16px}
.khu>h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px}
.rbox{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px}
.rbox.rep{background:#f8fafc;border-style:dashed}

 const ung=rows.filter(x=>x.nhom==='dat').map(x=>({x,k:khoaXep(hsById(x.id),dot)})).sort((a,b)=>cmpKhoa(a.k,b.k));
 let cum=0;
 for(let i=0;i<ung.length;){
  let j=i;while(j<ung.length&&cmpKhoa(ung[j].k,ung[i].k)===0) j++;
  const g=ung.slice(i,j), mac=cum+g.length<=dot.soSuat?'in':cum>=dot.soSuat?'out':'hoa';
  g.forEach(e=>{e.x.hang=i+1;e.x.mac=mac;e.x.dong=g.length});
  if(mac==='hoa') g.forEach(e=>e.x.conLai=dot.soSuat-cum);
  cum+=g.length;i=j;
 }
 rows.forEach(x=>{x.chon=x.nhom==='dat'&&(dot.dc[x.id]?dot.dc[x.id].chon:x.mac==='in')});
 return rows;
}
const rowsCua=dot=>dot.chot?dot.chot.rows:tinhDot(dot);
/* đợt không tính được khi M3.1 chưa chốt kỳ xét — ràng buộc DỮ LIỆU, không phải thẩm quyền */
const thieuDuLieu=dot=>!M31_CHOT[dot.ky];

function tomTat(dot){
 const rows=rowsCua(dot), c=n=>rows.filter(x=>x.nhom===n).length;
 const hoa=rows.filter(x=>x.mac==='hoa'&&!dot.dc[x.id]);
 const chon=rows.filter(x=>x.chon);
 return {rows,dat:c('dat'),cho:c('cho'),sat:c('sat'),khong:c('khong'),tay:rows.filter(x=>x.nguon==='tay').length,
  chon:chon.length,hoa,vuot:chon.length>dot.soSuat,tien:chon.length*dot.muc};
}

/* trạng thái đợt — lap/cho/ky/thuhoi do người; "chưa tính được" suy từ M3.1 */
const TT_DOT={lap:['Đang lập','b'],cho:['Chờ HT duyệt','w'],ky:['Đã ký quyết định','o'],thuhoi:['Đã thu hồi toàn bộ','r'],nd:['Chưa tính được — chờ M3.1','n']};
const ttDot=d=>d.st==='lap'&&thieuDuLieu(d)?'nd':d.st;

/* ---------- SUẤT = một học sinh trong quyết định đã ký ---------- */
function suatCua(dot){
 if(!dot.qd) return [];
 return dot.chot.rows.filter(x=>x.chon).map(x=>({dot,id:x.id,hs:hsById(x.id),muc:dot.muc,nguon:x.nguon,th:dot.thuHoi[x.id]||null}));
}
const moiSuat=()=>DOT.flatMap(suatCua);
/* 🔗 M7.5 — đã chi khi có giao dịch chi (chưa đảo) mang mã nguồn = số QĐ và có tên em */
const gdChi=s=>GD75.find(g=>g.qd===s.dot.qd.so&&g.hs.includes(s.id)&&!g.dao);
const ttChi=s=>gdChi(s)?'da':s.th?'th':'chua';
/* học bổng khác em đang hưởng cùng năm học — BÀY RA, không tự loại (§15.2) */
const hbKhac=(hsId,dot)=>moiSuat().filter(s=>s.id===hsId&&s.dot.id!==dot.id&&s.dot.nam===dot.nam&&!s.th);

/* ---------- lịch sử — căn cứ chi tiền: không sửa, không xóa ---------- */
function ghiLS(dot,viec,ct){const e={ngay:HOMNAY+' '+GIO,boi:R().n,vai:R().cd,viec,ct};dot.lichSu.push(e);ghiAudit(viec,dot.ma+' · '+ct)}

/* ---------- gieo hai quyết định đã ký (chạy đúng bộ máy, rồi chụp) ---------- */
function gieoKy(id,o){

 d.lichSu.push({ngay:o.trinh+' 16:10',boi:'Phan Thị Thảo',vai:'Văn thư',viec:'Trình duyệt',ct:tomTat(d).chon+' suất · chụp danh sách làm căn cứ'},
  {ngay:o.ky+' 10:25',boi:'Nguyễn Quang Huy',vai:'Hiệu trưởng',viec:'Duyệt & ký quyết định',ct:'QĐ '+o.so+' · ký bằng USB Token · chiếu vào kho quyết định M1.1'});
 if(o.chi) GD75.push({ma:o.chi.ma,ngay:o.chi.ngay,qd:o.so,hs:suatCua(d).slice(0,o.chi.n).map(s=>s.id),tien:o.chi.n*d.muc,boi:'Đỗ Thị Nhung'});
}
gieoKy('d3',{trinh:'2026-06-10',ky:'2026-06-15',so:'168/QĐ-NTT',chi:{ma:'PC-0151',ngay:'2026-06-30',n:10}});

/* ---------- PHẠM VI — ràng buộc dữ liệu ---------- */
function trongPV(hs){
 const r=R();
 if(r.sc==='Class'&&hs.lop!==r.lop) return false;
 if(r.sc==='Branch'&&hs.dt!==r.dt) return false;
 if(ST.dt!=='ALL'&&hs.dt!==ST.dt) return false;
 return true;
}
const dotTrongNam=()=>DOT.filter(d=>d.nam===ST.nam);

/* ---------- việc chờ tôi — dẫn xuất theo năng lực ---------- */
function viecCua(){
 const ra=[];
 DOT.forEach(d=>{
  const t=ttDot(d);
  if(t==='cho'&&can('duyet')) ra.push({d,txt:'Duyệt & ký quyết định'});
  if(t==='lap'){
   const s=tomTat(d);
   if(can('trinh')&&d.traLai) ra.push({d,txt:'Bị trả lại — sửa và trình lại'});
   if(can('quyetSuat')&&s.hoa.length) ra.push({d,txt:'Quyết suất hòa ('+s.hoa.length+' em)'});
   if(can('xacNhan')){const n=s.rows.filter(x=>x.nhom==='cho'&&trongPV(hsById(x.id))).length;if(n) ra.push({d,txt:'Xác nhận tiêu chí người ('+n+' em)'})}
  }
  if((t==='ky')&&R().m75){const n=suatCua(d).filter(s=>ttChi(s)==='chua').length;if(n) ra.push({d,txt:'Lập phiếu chi ở M7.5 ('+n+' suất)'})}
 });
 return ra;
}

   Tầng 1: danh sách đợt (dòng = một đợt). Tầng 2: MÀN HÌNH ĐẦY ĐỦ có breadcrumb — không gian làm việc

}

  +loc.map(d=>{const h=hmById(d.hm),t=ttDot(d),s=t==='nd'?null:tomTat(d),v=coViec(d);
   return '<tr class="rowlk" data-a="dot.mo" data-v="'+d.id+'"><td><b>'+esc(h.ten)+'</b><div class="mini">'+esc(d.ten)+' · '+esc(d.ma)+'</div></td>'

  +'</table></div></div>':'<div class="empty">Không có đợt nào ở bộ lọc này trong năm '+ST.nam+'.</div>');
}
ON['dot.chip']=v=>{ST.chip=v;render()};

 crumb('<a data-a="dot.ve">Đợt xét học bổng</a> › <b>'+esc(h.ten)+'</b> · '+esc(d.ten));

}

}

 const NH=[
  ['in','✓ Trong suất',x=>x.nhom==='dat'&&x.chon,'o'],

 ];
 if(ST.nhomMo.khong===undefined) ST.nhomMo.khong=0;
 const cols=d.tc.length;

 else NH.forEach(([k,n,f,c])=>{

function veSuat(){
 const all=moiSuat().filter(s=>s.dot.nam===ST.nam&&trongPV(s.hs));
 const CH=[['all','Hiệu lực',s=>!s.th],['chua','Chưa chi',s=>ttChi(s)==='chua'],['da','Đã chi',s=>ttChi(s)==='da'],['th','Đã thu hồi',s=>!!s.th],['tay','Thêm tay',s=>s.nguon==='tay'],['nhieu','Nhận ≥ 2 học bổng',s=>!s.th&&all.filter(y=>y.id===s.id&&!y.th).length>1]];
 const f=CH.find(c=>c[0]===ST.sChip)[2], q=kd(ST.sQ);
 const ds=all.filter(f).filter(s=>!q||kd(s.hs.ten).includes(q)||kd(s.dot.qd.so).includes(q)||kd(hmById(s.dot.hm).ten).includes(q));
 const hl=all.filter(s=>!s.th), da=hl.filter(s=>ttChi(s)==='da');
 const dong=(s,phang)=>{const g=gdChi(s),h=hmById(s.dot.hm);
  return '<tr class="rowlk'+(s.th?' mo':'')+'" data-a="suat.mo" data-v="'+s.dot.id+'"><td><b>'+esc(s.hs.ten)+'</b>'+(phang?'<div class="mini">'+esc(lopTai(s.hs,s.dot.nam))+' · '+esc(DT[s.hs.dt])+'</div>':'')+'</td>'
   +'<td>'+esc(h.ten)+'<div class="mini">'+esc(s.dot.ten)+'</div></td><td class="nw">'+esc(s.dot.qd.so)+'</td><td class="num">'+fm(s.muc)+'</td>'
   +'<td><span class="tg '+NGUON[h.nguon][1]+'">'+NGUON[h.nguon][0]+'</span></td>'
   +'<td>'+(s.nguon==='tay'?'<span class="tg b">✍ Thêm tay</span>':'<span class="tg c">Máy</span>')+'</td>'
   +'<td>'+(g?'<span class="okt">✓ '+esc(g.ma)+'</span> <span class="mini">'+k2s(g.ngay)+'</span>':s.th?'—':'<span class="tg b">Chưa chi</span>')+'</td>'
   +'<td>'+(s.th?'<span class="st2 r">Đã thu hồi</span><div class="mini">'+esc(s.th.qd)+'</div>':'<span class="st2 o">Hiệu lực</span>')+'</td></tr>'};
 let body='';
 if(q) body=ds.map(s=>dong(s,1)).join('');
 else Object.keys(DT).forEach(dt=>{
  const a=ds.filter(s=>s.hs.dt===dt); if(!a.length) return;
  body+='<tr class="grow"><td colspan="8"><b>'+esc(DT[dt])+'</b> · '+a.length+' suất · '+fm(a.reduce((t,s)=>t+(s.th?0:s.muc),0))+'</td></tr>';
  [...new Set(a.map(s=>lopTai(s.hs,s.dot.nam)))].sort().forEach(l=>{
   const b=a.filter(s=>lopTai(s.hs,s.dot.nam)===l);
   body+='<tr class="grow2"><td colspan="8">Lớp '+esc(l)+' · '+b.length+' suất</td></tr>'+b.map(s=>dong(s)).join('');
  });
 });
 return scopeBar('<span class="mini">Năm học = <b>năm cấp</b> của quyết định</span>')
  +'<div class="sumstrip" style="margin-top:12px"><div><b>'+hl.length+'</b><span>suất hiệu lực</span></div><div><b>'+fm(hl.reduce((t,s)=>t+s.muc,0))+'</b><span>tổng kinh phí</span></div>'
  +'<div><b>'+da.length+'/'+hl.length+'</b><span>đã chi 🔗 M7.5</span></div><div><b>'+new Set(hl.map(s=>s.id)).size+'</b><span>học sinh</span></div>'
  +'<div><b>'+all.filter(s=>s.th).length+'</b><span>đã thu hồi</span></div></div>'
  +'<div class="bar">'+CH.map(([k,n,fn])=>'<button class="chip'+(ST.sChip===k?' on':'')+'" data-a="suat.chip" data-v="'+k+'">'+n+' '+all.filter(fn).length+'</button>').join('')
  +'<input class="inp" data-sq="1" placeholder="🔍 Học sinh, số quyết định, hạng mục" value="'+esc(ST.sQ)+'"></div>'
  +'<div class="dnote">Suất <b>đã thu hồi</b> không biến mất — chip <b>Đã thu hồi</b> tìm lại được. Cột <b>Chi trả</b> là bản chiếu 🔗 từ M7.5, không có nút đánh dấu đã chi ở đây.</div>'
  +(ds.length?'<div class="tbw"><div class="tbx"><table><tr><th>Học sinh</th><th>Học bổng</th><th>Quyết định</th><th class="num">Mức</th><th>Nguồn tiền</th><th>Đề xuất</th><th>Chi trả 🔗 M7.5</th><th>Trạng thái</th></tr>'+body+'</table></div></div>'
   :'<div class="empty">Không có suất nào ở bộ lọc này trong năm '+ST.nam+(ST.nam===NAM_HIEN?'. Quyết định năm 2025-2026: đổi năm học ở header.':'.')+'</div>');

function luuForm(){
 const f=ST.form, loi=[];
 if(!f.ten.trim()) loi.push('tên hạng mục');
 if(f.nguon==='tt'&&!(f.nhaTaiTro||'').trim()) loi.push('nhà tài trợ (nguồn Tài trợ bắt buộc ghi — TT 16/2018: công khai, đúng mục đích)');
 if(!f.soSuat) loi.push('số suất');
 if(!(f.mucSuat||f.mucThang)) loi.push('mức mỗi suất');
 if(!f.doiTuong.khoi.length||!f.doiTuong.he.length||!f.doiTuong.dt.length) loi.push('đối tượng (khối · hệ · điểm trường)');
 if(!f.tc.length) loi.push('ít nhất một tiêu chí');
 if(f.tc.some(t=>t.loai==='nguoi'&&!t.ten.trim())) loi.push('tên của tiêu chí người xác nhận');
 if(!f.uu.length) loi.push('ít nhất một khóa ưu tiên');
 if(loi.length){toast('⛔ Còn thiếu: <b>'+loi.join(' · ')+'</b>');return}
 let ly='';
 if(f.mau&&JSON.stringify(f.tc)!==ST.formGoc){ly=batLyDo('ffLy',15);if(!ly)return}
 if(f.id){const i=HM.findIndex(h=>h.id===f.id);HM[i]=f;ghiAudit('Sửa hạng mục',f.ten+(ly?' · sửa tiêu chí mẫu — '+ly:''))}
 else {f.id='hm'+(HM.length+1);f.tao={boi:R().n,vai:vaiNgan(),ngay:HOMNAY};HM.push(f);ghiAudit('Tạo hạng mục',f.ten)}
 ST.hm=f.id;ST.hmChip=f.tt;closeM();render();toast('✓ Đã lưu <b>'+esc(f.ten)+'</b>'+(f.tt==='nhap'?' — ở trạng thái <b>Nháp</b>, Hiệu trưởng bấm Áp dụng thì mới mở được đợt.':'. Đợt đã mở không đổi theo.'));
}

   ghiLS(d,'Thu hồi',(toan?'toàn bộ quyết định':ids.length+' suất: '+ids.map(i=>hsById(i).ten).join(', '))+' · QĐ '+so+' · '+(cach==='so'?'ký số':'bỏ qua ký số')+' · '+ly);
   render();toast('↩ Đã ký <b>QĐ thu hồi '+esc(so)+'</b>. Quyết định gốc '+esc(d.qd.so)+' <b>giữ nguyên</b> — lọc "Đã thu hồi" ở tab 2 để tìm lại.');
  });
 };
 modal('↩ Thu hồi — QĐ '+esc(d.qd.so),
  '<label class="lbl"><input type="checkbox" id="thToan"> Thu hồi <b>toàn bộ</b> quyết định</label>'
  +'<table><tr><th></th><th>Học sinh</th><th>Chi trả 🔗 M7.5</th></tr>'+s.map(x=>'<tr><td><input type="checkbox" data-th="'+x.id+'"></td><td>'+esc(x.hs.ten)+' · '+esc(lopTai(x.hs,d.nam))+'</td><td>'+(gdChi(x)?'<span class="red">Đã chi '+fm(x.muc)+'</span>':'Chưa chi')+'</td></tr>').join('')+'</table>'
  +'<div class="warn" style="margin-top:10px">Suất <b>đã chi</b>: M1.11 <b>không truy thu</b> và không sửa sổ. Việc thu lại tiền (nếu có) do kế toán xử lý ở M7.5 bằng bút toán đảo / phiếu thu. '+(R().m75?lnk('M7.5','↗ M7.5'):'')+'</div>'
  +'<label class="lbl">Lý do <span class="red">*</span> <span class="mini">— vd "phát hiện giấy xác nhận hoàn cảnh không hợp lệ", "em chuyển trường ngày …"</span></label><textarea class="fldi" id="thLy" rows="3"></textarea>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn d" data-mb="ok">Thu hồi → ký số</button>');
};

/* ---------- xuất — bắt buộc chọn mục đích, ghi audit ---------- */
ON['xuat.mo']=()=>{
 const d=D();
 mfns.bok=()=>{const md=$('#xMd').value;if(!md){toast('⛔ Chọn mục đích xuất (Luật BVDLCN 91/2025).');return}
  const m=$('#xMau').value;ghiAudit('Xuất danh sách',d.ma+' · '+m+' · mục đích: '+md);closeM();toast('⬇ Đã xuất <b>'+esc(m)+'</b> — ghi audit kèm mục đích.')};
 modal('⬇ Xuất danh sách — QĐ '+esc(d.qd.so),
  '<label class="lbl">Mẫu</label><select class="fldi" id="xMau">'
  +(can('hoanCanh')?'<option>Danh sách nội bộ — đủ cột tiêu chí, minh chứng, lý do thêm tay</option>':'')
  +'<option>Danh sách chi trả — tên · lớp · mức · nguồn (không có hoàn cảnh)</option><option>Số liệu công khai — theo TT 09/2024, không có tên</option></select>'
  +'<label class="lbl">Mục đích <span class="red">*</span></label><select class="fldi" id="xMd"><option value="">— chọn —</option><option>Lưu hồ sơ quyết định</option><option>Gửi nhà tài trợ báo cáo sử dụng</option><option>Kế toán chi trả</option><option>Công khai theo TT 09/2024</option></select>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="ok">Xuất</button>');
};

/* ---------- mở đợt mới — một hạng mục × một kỳ chỉ có MỘT đợt (toàn vẹn dữ liệu) ---------- */
ON['dot.moMoi']=()=>{
 const hm=HM.filter(h=>h.tt==='ap');
 mfns.bok=()=>{
  const h=hmById($('#mHm').value), ky=$('#mKy').value, nam=$('#mNam').value, trung=DOT.find(d=>d.hm===h.id&&d.ky===ky&&d.nam===nam&&d.st!=='thuhoi');
  if(trung){toast('⛔ Hạng mục này đã có đợt xét kỳ <b>'+esc(KY[ky].ten)+'</b> cấp năm '+nam+' ('+esc(trung.ma)+') — mở lại đợt đó.');return}
  const id='d'+(DOT.length+1);
  DOT.push(moDot({id,hm:h.id,ma:'HB-'+nam.replace(/20(\d\d)-20(\d\d)/,'$1$2')+'-'+id.toUpperCase(),ten:h.chuKy==='hk'?KY[ky].ten:'Năm học '+nam,nam,ky,st:'lap'}));
  const d=dotById(id);ST.dot=null;ghiLS(d,'Mở đợt xét','Chụp '+d.tc.length+' tiêu chí · '+d.soSuat+' suất × '+fm(d.muc));
  closeM();ON['dot.mo'](id);
 };
 modal('＋ Mở đợt xét học bổng',
  '<label class="lbl">Hạng mục <span class="mini">(chỉ hạng mục Đang áp dụng)</span></label><select class="fldi" id="mHm">'+hm.map(h=>'<option value="'+h.id+'">'+esc(h.ten)+'</option>').join('')+'</select>'
  +'<label class="lbl">Kỳ xét — kỳ máy đọc kết quả</label><select class="fldi" id="mKy">'+Object.keys(KY).map(k=>'<option value="'+k+'">'+esc(KY[k].ten)+(M31_CHOT[k]?'':' — M3.1 chưa chốt')+'</option>').join('')+'</select>'
  +'<label class="lbl">Năm cấp</label><select class="fldi" id="mNam"><option>2026-2027</option><option>2025-2026</option></select>'
  +'<div class="ro" style="margin-top:10px">Đợt <b>chụp</b> tiêu chí, thứ tự ưu tiên, số suất và mức của hạng mục tại lúc mở — sửa hạng mục về sau không làm đổi đợt đang chạy.</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="ok">Mở đợt</button>');
};

/* ═══════════ M1.11 — KHUNG: vai · phạm vi · header · tab ═══════════
   Quyền là MẢNG NĂNG LỰC kiểm bằng .includes().
   Cờ m75 / m12 = vai có quyền ở menu chủ (M7.5 · M1.2) — không có thì KHÔNG hiện deep-link sang đó (D3). */

const QALL=['xem','moDot','themTay','xacNhan','quyetSuat','trinh','duyet','thuHoi','hmSua','hmKichHoat','xuat','hoanCanh'];
const ROLES={
 FULL :{n:'Trần Minh Đức',cd:'🔓 Đủ quyền (demo)',sc:'School',m75:1,m12:1,q:QALL},
 HT   :{n:'Nguyễn Quang Huy',cd:'Hiệu trưởng',sc:'School',m75:1,m12:1,q:['xem','duyet','thuHoi','hmSua','hmKichHoat','xuat','hoanCanh']},
 VT   :{n:'Phan Thị Thảo',cd:'Văn thư',sc:'School',m75:0,m12:1,q:['xem','moDot','themTay','xacNhan','quyetSuat','trinh','hmSua','xuat','hoanCanh']},
 GVCN :{n:'Trần Văn Kiên',cd:'GVCN 12A4',sc:'Class',lop:'12A4',m75:0,m12:1,q:['xem','themTay','xacNhan','hoanCanh']},
 KT   :{n:'Đỗ Thị Nhung',cd:'Kế toán',sc:'School',m75:1,m12:0,q:['xem','xuat']},
 PHTDT:{n:'Hà Văn Phong',cd:'PHT phụ trách Điểm trường B',sc:'Branch',dt:'B',m75:0,m12:1,q:['xem','xuat','hoanCanh']}
};
let role='FULL';
const R=()=>ROLES[role];
const can=q=>R().q.includes(q);

const ST={tab:'dot',nam:NAM_HIEN,dt:'ALL',dot:null,sub:'ds',chip:'all',nhomMo:{dat:1,cho:1,sat:1,tay:1},q:'',sel:null,
 sChip:'all',sQ:'',hm:null,choToi:false};

function scopeBar(extra){
 const r=R();
 const pv={School:'School — toàn trường',Branch:'Branch — '+DT[r.dt],Class:'Class — học sinh lớp '+r.lop}[r.sc];
 const loc=ST.dt!=='ALL'&&r.sc==='School'?' · đang lọc <b>'+esc(DT[ST.dt])+'</b>':'';
 return '<div class="scope"><b>👁 Phạm vi:</b> '+esc(pv)+loc+(can('hoanCanh')?'':' · <b>không thấy cột hoàn cảnh, minh chứng</b> <span class="mini">(Luật BVDLCN 91/2025)</span>')
  +'<span class="sp"></span>'+(extra||'')+'</div>';
}
function crumb(t){$('#crumb').innerHTML=t?'<div class="crumb">'+t+'</div>':''}

function rolebar(){
 $('#rolebar').innerHTML='<b>Chức danh:</b>'+Object.keys(ROLES).map(k=>
  '<button class="rb'+(k===role?' on':'')+'" data-r="'+k+'">'+esc(ROLES[k].cd)+'</button>').join('')
  +'<span class="simw">Hôm nay (mô phỏng): <b style="color:#fff">'+kThu(HOMNAY)+' '+k2s(HOMNAY)+'</b></span>'
  +'<button class="ntg" id="btnNote">💡 Ghi chú thiết kế: TẮT</button>';
}

function header(){
 const r=R();
 $('#ava').textContent=r.n.split(' ').slice(-2).map(x=>x[0]).join('');
 $('#hdt').innerHTML='<option value="ALL">Tất cả điểm trường</option>'+Object.keys(DT).map(d=>'<option value="'+d+'">'+DT[d]+'</option>').join('');
 if(r.sc==='Branch'){ST.dt=r.dt;$('#hdt').value=r.dt;$('#hdt').disabled=true;$('#dtlock').textContent='🔒 khóa theo phạm vi Branch'}
 else if(r.sc==='Class'){ST.dt='ALL';$('#hdt').value='ALL';$('#hdt').disabled=true;$('#dtlock').textContent='🔒 phạm vi lớp '+r.lop}
 else {$('#hdt').value=ST.dt;$('#hdt').disabled=false;$('#dtlock').textContent=ST.tab==='hm'?'tab Hạng mục là Master — bộ chọn không tác động':''}
 $('#hnam').value=ST.nam;
 const n=viecCua().length;
 $('#ndot').textContent=n||''; $('#ndot').style.display=n?'grid':'none';
 $('#topact').innerHTML='<button class="btn sm" data-a="audit">🕘 Nhật ký thao tác</button>';
}

/* MỌI TAB HIỆN VỚI MỌI VAI — phạm vi dữ liệu mới theo vai. Chờ tôi = chip trong tab 1 (tiền lệ M1.5 · M2.7 · M11.4) */
function tabs(){
 const v=viecCua().length;
 const T=[['dot','1 · Đợt xét học bổng',v,'r'],['suat','2 · Học sinh nhận học bổng'],['hm','3 · Hạng mục & tiêu chí']];
 $('#tabs').innerHTML=T.map(([k,n,b,c])=>'<button class="tab1'+(k===ST.tab?' on':'')+'" data-t="'+k+'">'+n
  +(b?'<span class="b '+(c||'')+'">'+b+'</span>':'')+'</button>').join('');
}

/* xem tệp NGAY TRONG MÀN HÌNH — 👁 Xem đứng trước ⬇ Tải; mọi lượt ghi audit (BVDLCN 91/2025) */
function nutTep(ten){
 return '<button class="btn xs" data-a="tep.xem" data-v="'+esc(ten)+'">👁 Xem</button><button class="btn xs" data-a="tep.tai" data-v="'+esc(ten)+'">⬇ Tải</button>';
}
ON['tep.xem']=v=>{ghiAudit('Xem tệp',v);
 modal('👁 '+esc(v),'<div class="ro">Xem ngay trong màn hình · lượt xem đã ghi audit (Luật BVDLCN 91/2025)</div>'
  +'<div class="giay"><div style="text-align:center;font-weight:700">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br><span style="font-weight:400">Độc lập – Tự do – Hạnh phúc</span></div>'
  +'<div style="text-align:center;font-weight:700;margin-top:18px">'+(v.startsWith('QĐ')?'QUYẾT ĐỊNH':'GIẤY XÁC NHẬN')+'</div><div style="text-align:center;font-style:italic">'+esc(v.replace(/\.pdf$/,''))+'</div>'
  +'<p style="margin-top:14px"><i>(bản xem trước mô phỏng — tệp thật hiển thị bằng trình xem PDF nhúng: thu phóng · xoay · chuyển trang)</i></p></div>',
  '<button class="btn" data-a="tep.tai" data-v="'+esc(v)+'">⬇ Tải</button><button class="btn p" data-mb="close">Đóng</button>')};
ON['tep.tai']=v=>{ghiAudit('Tải tệp',v);toast('⬇ Đã tải <b>'+esc(v)+'</b> — lượt tải ghi audit (Luật BVDLCN 91/2025).')};

/* deep-link sang menu chủ — chỉ hiện khi vai có quyền ở đó */
function lnk(menu,chu,co){return co===false?'':'<a class="lk" data-lnk="'+esc(menu)+'">'+chu+'</a>'}
const st2=(a)=>'<span class="st2 '+a[1]+'">'+esc(a[0])+'</span>';

/* ═══════════ M1.11 — RENDER + SỰ KIỆN ═══════════ */

function sidebar(){}                                   /* sidebar thuộc demo-html/index.html */

function render(){
 rolebar(); header(); tabs(); crumb('');
 const c=$('#content');
 if(ST.tab==='dot'&&ST.dot&&!dotById(ST.dot)) ST.dot=null;
 c.innerHTML=ST.tab==='dot'?(ST.dot?veDot():veDotList()):ST.tab==='suat'?veSuat():veHM();
 const nn=document.body.classList.contains('nn');
 $('#btnNote').classList.toggle('on',!nn);
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(nn?'TẮT':'BẬT');
}

ON['audit']=()=>modal('🕘 Nhật ký thao tác — M1.11',AUDIT.length?'<table><tr><th>Lúc</th><th>Người</th><th>Việc</th><th>Chi tiết</th></tr>'
 +AUDIT.map(a=>'<tr><td class="nw">'+a.luc+'</td><td>'+esc(a.boi)+'<div class="mini">'+esc(a.vai)+'</div></td><td>'+esc(a.viec)+'</td><td class="mini">'+esc(a.chiTiet)+'</td></tr>').join('')+'</table>'
 :'<div class="empty">Chưa có thao tác nào trong phiên demo này.</div>','<button class="btn" data-mb="close">Đóng</button>');

document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 const lk0=t.closest('[data-lnk]'); if(lk0){e.stopPropagation();toast('🔗 Deep-link sang <b>'+esc(lk0.dataset.lnk)+'</b> — mở sẵn đúng ngữ cảnh, quay lại được M1.11 (<code>D3</code>). M1.11 không ghi vào menu đó.');return}
 const a=t.closest('[data-a]'); if(a&&a.dataset.a&&ON[a.dataset.a]){if(a.disabled)return;ON[a.dataset.a](a.dataset.v,a);return}
 if(t===$('#mask')){closeM();return}
 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r;ST.chip='all';ST.hm=null;ST.dt='ALL';closeM();render();return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn');render();return}
 const tb=t.closest('[data-t]'); if(tb){ST.tab=tb.dataset.t;ST.dot=null;ST.hm=null;render();return}
});

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='hnam'){ST.nam=t.value;ST.dot=null;render();return}
 if(t.id==='hdt'){ST.dt=t.value;render();return}
 if(t.dataset.ff){datFF(t.dataset.ff,t.value);if(t.tagName==='SELECT')veForm();return}
 if(t.dataset.fc){const a=ST.form.doiTuong[t.dataset.fc],v=t.dataset.fc==='khoi'?+t.value:t.value;
  ST.form.doiTuong[t.dataset.fc]=t.checked?[...a,v]:a.filter(x=>x!==v);return}
 if(t.id==='thToan'){$$('[data-th]').forEach(c=>{c.checked=t.checked;c.disabled=t.checked});return}
});
/* ô tìm kiếm — vẽ lại khi gõ, giữ con trỏ */
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.ff&&t.tagName!=='SELECT'){datFF(t.dataset.ff,t.value);return}
 const key=t.dataset.dq?'q':t.dataset.sq?'sQ':null; if(!key) return;
 ST[key]=t.value;render();
 const n=$(t.dataset.dq?'[data-dq]':'[data-sq]');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}
});

render();
</script>
