<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4.1 Hồ sơ nhân sự — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
mark{background:#fef08a;padding:0 1px;border-radius:2px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:240px}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:236px;max-height:270px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.alert{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.miss{color:var(--amber);font-weight:700}
.miss.r{color:var(--red)}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:2fr 1.5fr 1.15fr 1.3fr 1fr}
.stage.open .hrow{grid-template-columns:2fr 1.3fr}
.stage.open .hcol{display:none}
.stage.open .hcol.keep{display:block}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:26px}
.hrow.gone{opacity:.6}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.ava2.noimg{background:#fee2e2;color:#991b1b}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:2fr 1.5fr 1.15fr 1.3fr 1fr}
.stage.open .hdrow{grid-template-columns:2fr 1.3fr}
.stage.open .hdrow div{display:none}
.stage.open .hdrow div.kc{display:block}
.hrow input[type=checkbox],.hdrow input[type=checkbox]{width:15px;height:15px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ava3{width:50px;height:50px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 50px}
.ava3.noimg{background:#fee2e2;color:#991b1b;font-size:11px;text-align:center;line-height:1.15}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.ptabs{display:flex;gap:2px;padding:0 11px;border-bottom:1px solid var(--line);background:#fafbfc;overflow-x:auto}
.ptab{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand);background:#fff}
.pbody{padding:14px 15px;max-height:calc(100vh - 230px);overflow-y:auto}

.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.exp{border-color:#fecaca}
.card.rev{opacity:.72}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:172px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.f.t2{background:#fffdf5}
.f.t3{background:#f8fafc}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.mask-val{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.eye{font-size:11px;color:var(--brand);border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:1px 7px}
.eye:hover{background:#e0e7ff}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}

.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.r::before{background:var(--red)}
.logi.g::before{background:var(--green)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

.viewer{display:grid;grid-template-columns:1fr 200px;gap:13px}
@media(max-width:700px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:270px;display:grid;place-items:center;color:#94a3b8;position:relative;overflow:hidden}
.vsheet{background:#fff;width:80%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:14px 16px;font-size:9px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:10px;text-align:center;font-weight:800;margin-bottom:7px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.diff{display:grid;grid-template-columns:1fr 22px 1fr;gap:8px;align-items:center;font-size:12.5px;padding:7px 0}
.diff .old{background:var(--red-soft);border:1px solid #fecaca;border-radius:7px;padding:6px 9px;color:#991b1b}
.diff .new{background:var(--green-soft);border:1px solid #a7f3d0;border-radius:7px;padding:6px 9px;color:#065f46;font-weight:700}
.diff .ar{text-align:center;color:var(--ink3)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:700px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--ink3);font-size:12.5px;margin-top:5px;cursor:pointer}
.drop:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.drop.has{border-style:solid;border-color:var(--green);background:var(--green-soft);color:#065f46;font-weight:600}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.bulkbar{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#0f172a;color:#fff;font-size:12.5px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bulkbar .sp{flex:1}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="TCNS">TCNS</button>
  <button class="rb" data-r="HT">HT</button>
  <button class="rb" data-r="PHT_DT">PHT_DT</button>
  <button class="rb" data-r="PHT_CM">PHT_CM</button>
  <button class="rb" data-r="TTCM">TTCM</button>
  <button class="rb" data-r="KT">KT</button>
  <span class="note">Vai <b>Đủ quyền</b> làm được mọi thao tác nghiệp vụ của menu — dùng để rà luồng. Các vai còn lại để thử phân quyền.</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"><option>Toàn trường</option><option>Điểm trường A</option><option>Điểm trường B</option></select>
  <span class="lockico" id="dtlock"></span>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot" id="ndot">4</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">DQ</div>
</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Hồ sơ nhân sự</h1><div class="spacer"></div>
      <span id="topact"></span></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const HOMNAY=new Date(2026,7,26);           /* 26/8/2026 */
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
const pd=s=>{const[a,b,c]=s.split('/').map(Number);return new Date(c,b-1,a)};
const days=d=>Math.round((d-HOMNAY)/86400000);
const dleft=s=>days(pd(s));
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');

/* ================= SIDEBAR ================= */

];
const byId=id=>NS.find(x=>x.id===id);
/* ===== NHIEM VU KIEM NHIEM (W1 — anh Ninh chot 20/9/2026) =====
   MOT truong, tich chon NHIEU muc + o `Khac` tu dien. CHI LUU THONG TIN —
   KHONG sinh quyen, KHONG cap cua vao du lieu. Do la ly do no o day chu khong o M4.3:
   M4.3 quan CHUC DANH, ma chuc danh sinh quyen truy cap menu (rang buoc 43).
   Danh muc dung tu bang 37 o cua cong, M4.1 §6b.2b:
     nhom A = 11 o «thieu han» (cong co, Dschool khong co cho nao)
     nhom B = 7 o cua to chuc Dang va Cong doan — truoc bi loai vi «ghi vao M4.3 la cap quyen»,
              nay het ly do do vi truong nay KHONG cap quyen.
   KHONG dua vao: 2 o hoi dong truong (Luat 123/2025 — truong cong lap khong con hoi dong truong
   tu 1/1/2026) va Pho Bi thu Doan TN (da co nguon that o M6.15 — khai them la de nguon thu hai). */
const NVKN_A=['Thanh tra','Hướng nghiệp','Hỗ trợ giáo dục người khuyết tật',
 'Phụ trách phòng học bộ môn','Công tác văn nghệ','Thể dục toàn trường',
 'Phụ trách vườn, xưởng trường','Trưởng ban thanh tra nhân dân',
 'Tổ trưởng tổ tư vấn tâm lý học đường','Tổ phó tổ tư vấn tâm lý học đường',
 'Ủy viên tổ tư vấn tâm lý học đường'];
const NVKN_B=['Bí thư đảng bộ','Bí thư chi bộ','Phó bí thư chi bộ',
 'Chủ tịch Công đoàn','Phó Chủ tịch Công đoàn','Tổ trưởng công đoàn',
 'Ủy viên Ban chấp hành công đoàn'];
const NVKN=[...NVKN_A,...NVKN_B];
/* Ba chuc vu Dang, xep tu CAO xuong THAP — dung de suy o 12 va 13 cua mau 38 muc.
   Mot truong binh thuong chi co chi bo HOAC dang bo, nen thuc te nhieu nhat mot o trung. */
const NVKN_DANG=['Bí thư đảng bộ','Bí thư chi bộ','Phó bí thư chi bộ'];
/* o 12 `Chuc vu Dang hien tai` = chuc vu Dang CAO NHAT dang tich */
const cvDangNay=p=>NVKN_DANG.find(x=>(p.bnv.nvkn||[]).includes(x))||'';
/* o 13 `Chuc vu Dang kiem nhiem` = cac chuc vu Dang con lai dang tich */
const cvDangKiem=p=>NVKN_DANG.filter(x=>(p.bnv.nvkn||[]).includes(x)&&x!==cvDangNay(p)).join(', ');

const TAICHUC=['lamviec','tamnghi'];


/* ================= CỤM CSDL — TRƯỜNG BỔ SUNG (19/9/2026 · CSDL-1E) =================
 Mọi trường dưới đây gieo BẰNG MÁY từ dữ liệu đang có, để không phải sửa 20 bản ghi tay.
 Hạng của từng trường ghi ngay tại chỗ: that | danxuat | anhxa. */

/* --- ① CỤM ĐỊA CHỈ SÁU PHẦN, HAI CHẾ ĐỘ NHẬP (HDCS ①) ---
   md:'dm' chọn danh mục (MẶC ĐỊNH) | md:'td' nhập tự do — CHẾ ĐỘ HỢP LỆ, không phải lỗi.
   hien = DẪN XUẤT, không có ô nhập. Khong chan gi ca: khong chan luu, khong sinh viec o M0.2. */
const DCF=[['qq','Quê quán',2],['nsinh','Nơi sinh',2],['nks','Nơi khai sinh',2],
           ['ttru','Nơi đăng ký thường trú',2],['ohn','Nơi ở hiện tại',1]];
const dmuc=(tinh,xa,ct)=>({md:'dm',tinh,xa,ct});
const tudo=s=>({md:'td',td:s});
const dcHien=d=>!d?'':(d.md==='dm'?[d.ct,d.xa,d.tinh].filter(Boolean).join(', '):(d.td||''));
const dcChua=p=>DCF.filter(([k])=>p.dc&&p.dc[k]&&p.dc[k].md==='td').length;   /* số trường chưa chuẩn hóa */
/* Danh mục hành chính hai cấp (TT 13/2025 · TT 26/2025) — bản rút gọn của demo */
const TINHXA={'Thành phố Hà Nội':['Phường Cầu Giấy','Phường Nghĩa Tân','Phường Dịch Vọng','Phường Ô Chợ Dừa'],
 'Tỉnh Nam Định':['Phường Vị Xuyên','Xã Nam Điền'],'Tỉnh Hưng Yên':['Phường Hiến Nam','Xã Đồng Than'],
 'Tỉnh Sơn La':['Phường Chiềng Lề','Xã Chiềng Sinh'],'Tỉnh Thanh Hóa':['Phường Hạc Thành','Xã Quảng Yên'],
 'Tỉnh Phú Thọ':['Phường Nông Trang','Xã Thanh Minh']};
/* Máy GỢI Ý tỉnh và xã dò theo tên trong chuỗi tự do — NGƯỜI XÁC NHẬN mới ghi.
   ⛔ Máy không bao giờ tự đổi: dò sai thì sai im lặng và không ai phát hiện ra. */
function dcGoiY(chuoi){
 const c=kd(chuoi||'');
 for(const t of Object.keys(TINHXA)){
  const ten=kd(t.replace(/^(Tỉnh|Thành phố) /,''));
  if(ten&&c.includes(ten)) return {tinh:t,xa:TINHXA[t][0]};
 }
 return null;
}

/* --- ② GIEO CÁC TRƯỜNG MỚI --- */
NS.forEach(p=>{
 const nam=+((p.vaonganh||'01/01/2000').slice(-4)), sn=+((p.sinh||'01/01/1980').slice(-4));
 /* Địa chỉ: DỮ LIỆU CŨ ⇒ che_do = tu_do + nhãn ⚠ (HDCS ① quy tắc d) — không chuyển đổi hàng loạt */
 /* Văn thư đã chuẩn hóa DẦN — một phần hồ sơ đã sang chế độ danh mục, phần còn lại vẫn tự do.
    Cả hai đều hợp lệ; bộ lọc ⚠ chỉ để biết còn bao nhiêu việc, ⛔ không phải để đòi làm cho hết. */
 const gq=dcGoiY(p.qq);

   thấy con số này (ràng buộc 100) — người không mở được khối N ⛔ không được biết nhóm ấy tồn tại. */
const NC7=['bibat','tcnn','thannhan','xuatthan','kinhte','nhadat','taisan'];

/* HS03 mục II — DẪN XUẤT từ sáu bảng 32.x, dòng có Từ – Đến CHẠM kỳ khai (MYC-2A · 1B E.4).
   🛑 Bản in chỉ in CỘT CỦA MẪU — ⛔ không in «Nguồn dòng», ⛔ không in «Hiệu lực đến» (cột nội bộ, chốt #25). */
const thang=s=>{const m=String(s||'').match(/(\d{1,2})\/(\d{4})/);return m?(+m[2])*12+(+m[1]):null};
function hs03MucII(p,d){
 const a=thang(d.tu), z=thang(d.den), o=[];
 HVBANG.forEach(([k,so,ten])=>(p.hv[k]||[]).forEach(r=>{
  const tu=thang(r.tu), den=r.den==='nay'?z:thang(r.den);
  if(tu!==null&&den!==null&&tu<=z&&den>=a) o.push([so,r]);}));
 return `<div class="card"><div class="ch">II. Đào tạo, bồi dưỡng nâng cao trình độ chuyên môn <span class="tg b">bản in HS03</span></div>

   <th>Chuyên ngành · chứng chỉ</th><th>Hình thức</th><th>Văn bằng, chứng chỉ</th></tr></thead><tbody>
   ${o.map(([so,r])=>`<tr><td>${esc(r.tu)} – ${esc(r.den)}</td><td>${esc(r.coso)}</td><td>${esc(r.nganh||r.ten||'')}</td>
     <td>${esc(r.ht||'')}</td><td>${esc(r.vb||r.cc||'')}${r.diem?' · '+esc(r.diem):''}</td></tr>`).join('')}</tbody></table>`
   :'<div style="font-size:12px;color:var(--ink3)">Không có dòng nào trong kỳ '+d.tu+' – '+d.den+'.</div>'}
  <div style="font-size:11px;color:var(--ink3);margin-top:5px">Gộp sáu bảng 32.x như HS01 II · HS02 27 · chỉ cột của mẫu —
   ⛔ không in «Nguồn dòng» và cột nội bộ về hạn chứng chỉ.</div></div></div>`;
}

   <div class="i"><b>${hi(p.n)}</b><span>${p.ma} · ${p.dt}</span></div></div>
  <div class="hcol">${p.cd}${p.cdphu?`<br><span style="font-size:11px;color:var(--violet);font-weight:600">${p.cdphu}</span>`:''}</div>

    ? (hsBadge(p)? `<button class="st2 ${hsBadge(p)[0]}" data-x="go-thieu" data-ns="${p.id}" title="${esc(hsBadge(p)[2]||'Mức ① — hồ sơ cũ thiếu trường định danh')}">${hsBadge(p)[1]}</button>`
                : '<span class="st2 o">✓ Đủ</span>')
    : '<span style="color:var(--ink3);font-size:11.5px">—</span>'}</div></div>`;
}
function listTab(){
 const r=rows(), q=($('#q')?.value||'').trim();
 const flat = fGOM==='Không gom' || !!q || !r.length;   /* TỰ PHẲNG HOÁ khi đang tìm kiếm */
 let body='';
 if(!r.length) body=`<div class="empty">Không có nhân sự nào khớp bộ lọc.<br>
   <span style="font-size:12px">Người đã rời trường bị bộ lọc <b>Trạng thái công tác</b> ẩn theo mặc định — bật lại để tra cứu.</span></div>`;
 else if(flat) body=r.map(x=>nsRow(x)).join('');
 else{
  const key = fGOM==='Theo điểm trường'?(x=>x.dt) : fGOM==='Theo nhóm chức danh'?nhomTen : (x=>x.to);
  const ks=[...new Set(r.map(key))];
  body=ks.map(k=>{const rk=r.filter(x=>key(x)===k), gk='g-'+k, op=openG[gk]!==false;
   const nt=rk.filter(x=>thieu(x).length).length;
   const nh=rk.filter(x=>{const[,c]=hdLabel(x);return c==='w'||c==='r'}).length;
   return `<div class="grow" data-g="${gk}"><span class="ar">${op?'▼':'▶'}</span>${k}
     <span class="ct"><span>${rk.length} người</span>
      ${nt?`<span class="miss">${nt} hồ sơ chưa đủ</span>`:''}
      ${nh?`<span class="miss r">${nh} HĐ cần xử lý</span>`:''}</span></div>
    ${op?rk.map(x=>nsRow(x,1)).join(''):''}`}).join('');
 }
 /* dải cảnh báo đối soát — tính trên TOÀN BỘ nhân sự trong phạm vi,
    không phụ thuộc bộ lọc Trạng thái công tác đang bật hay tắt người đã rời trường */
 const ho=base().filter(tkHoSo);
 const alert=ho.length?`<div class="alerts"><div class="alert r">⛔
   <span class="sp"><b>${ho.length}</b> người <b>đã rời trường</b> nhưng tài khoản vẫn <b>Đang hoạt động</b> —

   <button class="btn xs" data-x="show-gone">Xem</button>${dlink('M10.5','M10.5')}</div></div>`:'';
 return `${filters()}${alert}
  <div class="stage ${cur?'open':''}">
   <div class="listw">
    <div class="hdrow"><div class="kc">Nhân sự</div><div>Chức danh</div>
     <div>${R().luong?'Bậc / Hệ số':'Hạng CDNN / Vị trí VL'}</div><div class="kc">Trạng thái công tác</div>
     <div>Diện làm việc / Hợp đồng</div><div>Hồ sơ</div></div>
    ${body}
    <div class="lgd">Một dòng = <b>một nhân sự</b>. Trạng thái công tác <b>dẫn xuất từ ticket đã ký ở M4.2</b> — menu này không có nút đổi trạng thái.</div>
   </div>

  </div>`;
}

function t3rows(){
 /* Đơn vị dòng: ① Nhân sự × trường · ② Nhân sự × NHÓM (MYC-3) · ③ Nhân sự × trường · Việc cần xử lý: Nhân sự × việc */
 const o=[];
 rows().forEach(p=>{const m=myc(p);
  m.m1.forEach((f,i)=>o.push({p,t:['⛔ Thiếu thông tin định danh — '+f,'lylich','r','Mức ① · hồ sơ cũ nhập TRƯỚC luật MYC-1 — sửa ngay','1'],k:p.id+'-m1-'+i}));
  m.m2.forEach(x=>o.push({p,t:['Thiếu nhóm «'+x.ten+'»: '+x.truong.join(' · '),x.tab,ttMau[x.tt],'Mức ② · '+ttChu(x),'2'],k:p.id+'-m2-'+x.nh}));
  m.m3.forEach((f,i)=>o.push({p,t:['⚪ '+f,'lylich','n','Mức ③ · nên có — ⛔ không tính là thiếu, ⛔ không nhắc','3'],k:p.id+'-m3-'+i}));
  m.viec.forEach((v,i)=>o.push({p,t:[v[0],v[1],v[2],v[3],'v'],k:p.id+'-v-'+i}));
 });
 return o;
}

   phải nhớ «bằng thạc sĩ khai ở bảng nào». */

/* Thứ bậc văn bằng — ĐỌC TỪ GHI CHÚ CỦA CHÍNH MẪU (HS02 mục 27 · HS03 mục II):
   «TSKH, TS, chuyên khoa II, Ths, chuyên khoa I, đại học, cao đẳng, trung cấp, sơ cấp, chứng chỉ».
   Mẫu liệt kê TỪ CAO XUỐNG THẤP ⇒ thứ bậc này là của Bộ Nội vụ, ⛔ không phải tôi tự đặt. */
const VB_BAC=[['tiến sĩ khoa học',9],['tskh',9],['tiến sĩ',8],['chuyên khoa ii',7],['thạc sĩ',6],
              ['chuyên khoa i',5],['đại học',4],['cao đẳng',3],['trung cấp',2],['sơ cấp',1]];
const LLCT_BAC=[['cao cấp',3],['trung cấp',2],['sơ cấp',1]];
const QLNN_BAC=[['chuyên viên cao cấp',4,'Chuyên viên cao cấp'],['chuyên viên chính',3,'Chuyên viên chính'],
                ['chuyên viên',2,'Chuyên viên'],['cán sự',1,'Cán sự']];
const bacTheo=(t,bang)=>{const x=(t||'').toLowerCase();let b=0;bang.forEach(r=>{if(x.includes(r[0])&&r[1]>b)b=r[1]});return b};
const mmyy=v=>{const m=/^(\d{1,2})\/(\d{4})$/.exec(v||'');return m?(+m[2])*12+(+m[1]):0};
const hvMoiNhat=rs=>(rs||[]).slice().sort((a,b)=>mmyy(b.den)-mmyy(a.den))[0]||null;
/* CAO NHẤT, ⛔ KHÔNG phải dòng cuối cùng — bằng sau chưa chắc cao hơn bằng trước
   (rất thật: thầy cô học thêm một bằng đại học thứ hai SAU khi đã có thạc sĩ). */
function hvCaoNhat(rs,truong,bang){
 let best=null,bb=0;
 (rs||[]).forEach(r=>{const b=bacTheo(r[truong],bang);
   if(b>0&&(b>bb||(b===bb&&best&&mmyy(r.den)>mmyy(best.den)))){bb=b;best=r}});
 return best;
}

 return best?{r:best,ten:ten}:null;
}

 const R0=R(), full=R0.full;                  /* vai trò phạm vi hẹp chỉ thấy tên ĐN + trạng thái */

 const head=`<div class="ch">Tài khoản đăng nhập hệ thống <span class="tg a">🔗 M10.5</span>

 if(!p.tk) return `<div class="card exp">${head}<div class="cb"><div style="padding:9px 12px">

    Phải báo IT_Admin qua <b>M10.7 Nhật ký hệ thống</b>.</span></div></div></div></div>`;
 const t=p.tk, [lb,cl]=TKTT[t.tt];
 const lech=tkHoSo(p), moi=t.tt==='moi';

    Nhân sự <b>${TT[p.tt][0].replace(/^\S+\s/,'')}</b> từ ${p.roiTu} nhưng tài khoản vẫn <b>Đang hoạt động</b> —

    <b>chưa truy cập được dữ liệu nào</b> — đăng nhập vào là rơi thẳng vào màn hình đổi mật khẩu.</div></div>`:''}

   ${t.khoaLy?`<span style="font-weight:400;font-size:11.5px;color:var(--ink3)">${t.khoaLy}</span>`:''}</div></div>

  ${chiTT?`<div class="f"><div class="k">Chi tiết tài khoản</div><div class="v" style="font-weight:400;color:var(--ink3)">
    Ngoài phạm vi vai trò ${role} — không có trong dữ liệu trả về</div></div>`

   <div class="warn">⏱ Đồng hồ: <b>30 ngày từ hôm nay</b> với hồ sơ có sẵn. Quá hạn ⇒ nhóm đỏ + việc ở M0.2 cho Tổ chức nhân sự.</div>`,
  `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="cfg-nang-ok" data-k="${k}">Nâng lên ②</button>`);
}
/* MYC-1A — biểu mẫu TỐI THIỂU bảy ô mức ① (§6.11.1). ⛔ Không ô nào khác. */
function formMoi(v,loi){
 v=v||{}; loi=loi||[];
 const thieuO=k=>loi.length&&!coGiaTri(v[k])?' style="border-color:var(--red);box-shadow:0 0 0 2px #fee2e2"':'';
 const o=(k,lb,html,ghi)=>`<label class="lbl">${lb} <span style="color:var(--red)">*</span>${ghi?` <span style="font-weight:400;color:var(--ink3)">— ${ghi}</span>`:''}</label>${html}`;
 modal('＋ Thêm hồ sơ nhân sự — 7 trường mức ①',
  `${loi.length?`<div class="danger">⛔ <b>Chưa lưu được</b> — còn: ${loi.map(esc).join(' · ')}</div>`:''}
   <div class="info">Chỉ <b>bảy trường mức ①</b> — thiếu thì không lưu được. Mọi trường khác khai <b>sau</b>, ở panel, theo mức ② / ③.</div>
   ${o('n','Họ và tên',`<input class="fldi" id="m1n" value="${esc(v.n)}"${thieuO('n')}>`)}
   ${o('sinh','Ngày sinh',`<input class="fldi" id="m1sinh" placeholder="dd/mm/yyyy" value="${esc(v.sinh)}"${thieuO('sinh')}>`)}
   ${o('gt','Giới tính',`<select class="fldi" id="m1gt"${thieuO('gt')}><option value="">— chọn —</option>${['Nam','Nữ'].map(x=>`<option${v.gt===x?' selected':''}>${x}</option>`).join('')}</select>`)}
   ${o('cccd','Số căn cước công dân',`<input class="fldi" id="m1cccd" value="${esc(v.cccd)}"${thieuO('cccd')}>`,'khóa chống trùng')}
   ${o('sdt','Số điện thoại',`<input class="fldi" id="m1sdt" value="${esc(v.sdt)}"${thieuO('sdt')}>`,'= định danh đăng nhập')}
   ${o('dien','Diện làm việc',`<select class="fldi" id="m1dien"${thieuO('dien')}><option value="">— chọn —</option>${DIEN.map(d=>`<option value="${d.ma}"${v.dien===d.ma?' selected':''}>${d.ten}</option>`).join('')}</select>`,'quyết định người này phải khai gì ở mức ②')}
   ${o('cd','Chức danh chính',`<select class="fldi" id="m1cd"${thieuO('cd')}><option value="">— chọn —</option>${CDMOI.map(c=>`<option${v.cd===c[0]?' selected':''}>${c[0]}</option>`).join('')}</select>`,'→ ghi bản ghi đầu tiên ở M4.3 — ⛔ không phải ô của hồ sơ')}`,
  `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="luu-moi">Lưu</button>`);
}
function render(){
 sidebar();tabs();
 $('#topact').innerHTML=topActions();
 $('#ndot').textContent=myQueue().length||'';
 $('#ndot').style.display=myQueue().length?'grid':'none';
 const body = tab==='ds'?listTab(): tab==='duyet'?queueYC(): tab==='duyethd'?queueHD(): tab==='thieu'?thieuTab():
              tab==='qd'?qdTab(): tab==='cd'?cdTab(): tab==='rs'?rsTab(): tab==='dongbo'?dbTab(): luongTab();
 $('#content').innerHTML=scopeBar()+body;
}
render();

/* ===== MYC-3A — deep-link ĐẾN T3 «Hồ sơ cần hoàn thiện» (M4.1 §6.7.4 · PHIEU-MYC-2B E.4) =====
   Nguyên văn M0.2 §4.2.2e dòng V2: ?tab=ho_so_can_hoan_thien&ctx={ns_id}&return=M0.2 — ⛔ không đặt tên khác.
   ctx nhận mã nhân sự (NS-…) — cũng nhận id nội bộ cho tiện gõ tay. Mở T3, lọc đúng người, mở sẵn panel đúng tab của nhóm thiếu đầu tiên.
   Chỉ demo: &vai=<mã vai thanh đen> (mặc định giữ vai đang chọn) · &xem=sau (đồng hồ ② như ngày 15/11/2026 = chip «Ngày xem hồ sơ» 15/11 của M0.2).
   Thiếu / sai tham số ⇒ mở chỗ gần nhất và NÓI ra — ⛔ không im lặng. Vai không có quyền X ở T3 hoặc người ngoài phạm vi ⇒ ⛔ không lộ tên. */
var t3Ctx=null, t3Return=null;
(function t3DeepLink(){const q=new URLSearchParams(location.search), tb=q.get('tab');
 if(!tb)return;
 const vai=q.get('vai'); if(vai&&ROLE[vai]){const btn=document.querySelector(`.rb[data-r="${vai}"]`);if(btn)btn.click();}
 if(q.get('xem')==='sau')NGAYXEM=NGAYXEM_SAU;
 if(tb!=='ho_so_can_hoan_thien'){render();toast('Tham số tab «'+esc(tb)+'» không nhận ra — mở Danh sách nhân sự');return}
 if(!tabList().some(t=>t[0]==='thieu')){render();toast('Vai '+role+' không có tab Hồ sơ cần hoàn thiện — mở Danh sách nhân sự');return}
 tab='thieu'; t3Return=q.get('return');
 const ctx=q.get('ctx'), p=ctx?NS.find(x=>x.ma===ctx||String(x.id)===ctx):null;
 let bao;
 if(!ctx) bao='Thiếu tham số ctx — mở T3 cả trường';
 else if(!p||!rows().includes(p)) bao='Không có hồ sơ «'+esc(ctx)+'» trong phạm vi của vai '+role+' — mở T3 cả trường';
 else{t3Ctx=p.id; cur=p.id; const m=myc(p); ptab=(m.m2[0]&&m.m2[0].tab)||'lylich';
  bao=`T3 · lọc đúng một người: <b>${p.n}</b> — ${m.m2.length?'thiếu '+m.m2.length+' nhóm':'không còn nhóm ② nào thiếu'}`;}
 render(); toast(bao+(NGAYXEM!==HOMNAY?' · đồng hồ ② xem như 15/11/2026':''));
 /* dải lọc đứng ngay đầu T3 ⇒ chỉ cần giữ trang ở đầu: tắt khôi phục cuộn của trình duyệt (bài học MYC-2B), ⛔ scrollIntoView — nó đẩy dải khỏi tầm nhìn */
 try{history.scrollRestoration='manual'}catch(e){} setTimeout(()=>window.scrollTo(0,0),60);
})();

/* ═══════════════════════════════════════════════════════════════
   KTLD-1D — M4.1 F11 trong LUỒNG KHỞI TẠO LẦN ĐẦU  ·  bước B04
   Tài liệu: M4.1 §6.11.0 (trong luồng · hạng N) · §6.11.4 (bảng tra mã cũ → mới)

   🛑 Hạng N: máy ĐẾM, người KẾT LUẬN. Máy ⛔ không biết trường có 63 hay 64 người.
   🛑 Tệp này ⛔ KHÔNG sửa một byte nào của app.js — chỉ bọc render() và importModal().
   ═══════════════════════════════════════════════════════════════ */

let TT_TR41 = 'dang_khoi_tao';
let daDu41 = false;
const DEM41 = [['Điểm trường A', 28], ['Điểm trường B', 21], ['Điểm trường C', 14]];

const _renderGoc41 = render;
render = function(){ _renderGoc41.apply(null, arguments); veKhoiTao41(); };

function veKhoiTao41(){
  const c = document.querySelector('#content');
  if(!c) return;
  c.insertAdjacentHTML('afterbegin', dai41());
}

function dai41(){
  const tong = DEM41.reduce((s, x) => s + x[1], 0);
  let h = '<div class="card" style="margin-bottom:12px">'+
   '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>Tình huống của trường (demo):</b>'+
   ['dang_khoi_tao','dang_van_hanh'].map(t=>'<button class="btn xs'+(TT_TR41===t?' p':'')+
     '" data-kt="tt" data-v="'+t+'">'+(t==='dang_khoi_tao'?'Đang khởi tạo':'Đang vận hành')+'</button>').join('')+
   '</div>';
  if(TT_TR41==='dang_khoi_tao'){
    h += '<div class="info" style="margin-top:10px;line-height:1.7">'+
     '<b>Bước 4 của luồng khởi tạo lần đầu — <code>B04</code> Nạp nhân sự hiện hữu.</b> '+
     'Màn hình F11 <b>nguyên vẹn</b>, ⛔ không có bản rút gọn riêng cho luồng.<br>'+
     '🔑 <b>Hạng <code>N</code> — máy ĐẾM, người KẾT LUẬN.</b> Máy ⛔ <b>không thể biết</b> trường có 63 hay 64 người; '+
     'nó đếm <b>theo điểm trường</b> rồi hỏi. Bấm xác nhận ghi <b>ai</b> và <b>lúc nào</b> — ⛔ đây <b>không phải ô tick trạng thái</b> '+
     '<i>(KT-2: thứ máy tính được là CON SỐ, còn «đủ chưa» là kết luận nghiệp vụ)</i>.<br>'+
     '🔁 <b>Thứ tự sửa 23/9:</b> <b>bước 8a «Khung năm học»</b> <i>(mốc · điểm trường · cấp học · hệ)</i> đứng <b>TRƯỚC</b> bước này — vì mẫu <b>MAU-B04</b> có <b>cột Điểm trường bắt buộc</b> và sheet <i>Danh mục tra cứu</i> xuất từ dữ liệu thật; ⛔ không có danh sách điểm trường thì <b>không sinh được tệp mẫu</b>.<br>'+
     '<b>Bước 8b «Chi tiết năm học»</b> <i>(lớp · môn của năm · tổ · môn của lớp)</i> đứng <b>SAU</b> bước 5 ⇒ GVCN và Tổ trưởng <b>chọn được từ danh sách</b>. Còn đúng <b>một ô</b> đứng trước nhân sự — <i>PHT phụ trách điểm trường</i> ở mục ② — ô ấy <b>tùy chọn</b>, ⛔ <b>không chặn</b> <i>(M10.1 §6.2.1)</i>.'+
     ' <button class="rolnk" data-kt="ve">↗ Về M10.12 — bảng tiến độ</button></div>'+
     '<div class="'+(daDu41?'okbox':'warn')+'" style="margin-top:10px;line-height:1.8">'+
     (daDu41 ? '✅ <b>Đã xác nhận đủ</b> — Nguyễn Thu Hà <i>(Tổ chức nhân sự)</i> · 23/09/2026 15:41. '+
               'Bước 4 <b>xong</b>; bước 5 mở. <button class="rolnk" data-kt="dat">↺ Đặt lại (demo)</button>'
             : 'Đã nạp <b>'+tong+' hồ sơ nhân sự</b> — '+DEM41.map(x=>x[0]+': <b>'+x[1]+'</b>').join(' · ')+'.<br>'+
               '<b>Danh sách đã đủ chưa?</b> '+
               '<button class="btn xs" data-kt="chuaDu">Chưa đủ</button> '+
               '<button class="btn xs p" data-kt="du">✓ Đủ — xác nhận</button>')+
     '</div>'+
     '<div class="ro" style="margin-top:8px">🔴 Nạp <b>theo từng điểm trường</b> <i>(H5)</i> — mỗi cơ sở cũ xuất ra một tệp riêng, '+
     'nên mẫu <b>MAU-B04-nhan-su-v1</b> bắt buộc có cột <b>Điểm trường</b> và bảng tiến độ ⛔ không gộp ba con số thành một.'+
     ' <button class="rolnk" data-kt="traMa">🔁 Xem bảng tra mã cũ → mới</button></div>';
  }
  return h + '</div>';
}

/* ───────── bọc màn Import: thêm số hiệu mẫu (bước 1) và bảng tra mã (bước 3) ───────── */
const _impGoc41 = importModal;
importModal = function(){
  _impGoc41.apply(null, arguments);
  const mb = document.querySelector('#mb'); if(!mb) return;
  if(impStep === 0){
    mb.insertAdjacentHTML('afterbegin',
      '<div class="ro" style="margin-bottom:10px;line-height:1.7">🆕 Mẫu mang số hiệu <b>MAU-B04-nhan-su-v1</b> — '+
      'ô <code>A1</code> khai số hiệu · hàng 2 tiêu đề · dữ liệu từ hàng 3 · ngày kiểu <code>Text</code> <code>dd/mm/yyyy</code>. '+
      '🛑 Lỗi báo theo <b>SỐ DÒNG EXCEL</b>, ⛔ không theo <code>STT</code>.<br>'+
      '🔴 Cột <b>Điểm trường</b> <b>bắt buộc</b>, kể cả trường một cơ sở <i>(khi đó điền sẵn)</i>. '+
      'Cột <b>Mã nhân sự cũ (tại cơ sở)</b> <b>tùy chọn</b> — ⛔ <b>không phải khóa chống trùng</b>, chỉ để sinh bảng tra mã.</div>');
  } else if(impStep === 2){
    mb.insertAdjacentHTML('beforeend', bangTraMa41());
  }
};

function bangTraMa41(){
  return '<div class="info" style="margin-top:12px"><b>🔁 Bảng tra mã cũ → mới</b> — '+
   'mỗi cơ sở cũ đánh số từ <code>001</code>, nên <b>ba người cùng mang <code>GV-001</code></b> ở ba tệp khác nhau. '+
   '🛑 Mã cũ ⛔ <b>không</b> được dùng làm khóa chống trùng — khóa vẫn là <b>CCCD · SĐT · email</b>.</div>'+
   '<table><thead><tr><th>Điểm trường</th><th>Mã cũ tại cơ sở</th><th>Mã nhân sự Dschool</th><th>Họ và tên</th></tr></thead><tbody>'+
   '<tr><td>Điểm trường A</td><td>GV-001</td><td><b>NS-2026-0142</b></td><td>Phạm Thanh Sơn</td></tr>'+
   '<tr><td>Điểm trường B</td><td>GV-001</td><td><b>NS-2026-0143</b></td><td>Hồ Văn Trung</td></tr>'+
   '<tr><td>Điểm trường B</td><td>GV-014</td><td><b>NS-2026-0144</b></td><td>Trần Thị Bình</td></tr>'+
   '</tbody></table>'+
   '<div class="ro" style="margin-top:8px">⚠ Mã cũ <b>trùng nhau giữa hai cơ sở ⛔ không phải lỗi</b> — cột <b>Điểm trường</b> sinh ra để chở ca đó. '+
   'Bảng này <b>lưu lại và tải về được</b>: nó là thứ duy nhất nối <b>sổ giấy của cơ sở cũ</b> với hệ thống mới, '+
   'và là chỗ lấy cột <code>Mã nhân sự</code> cho mẫu <b>B05</b> ở M4.3.</div>';
}

document.addEventListener('click', function(e){
  const b = e.target.closest('[data-kt]'); if(!b) return;
  const k = b.dataset.kt;
  if(k==='tt'){ TT_TR41 = b.dataset.v; render(); return; }
  if(k==='ve'){ toast('Deep-link <b>↗ M10.12?tab=luong&buoc=B04</b> — demo này ⛔ không rời menu'); return; }
  if(k==='du'){ daDu41 = true; render();
    toast('Đã ghi kết luận «đủ» — <b>người</b> và <b>thời điểm</b> vào vết của bước <i>(M10.12)</i>'); return; }
  if(k==='chuaDu'){ toast('Bước 4 ở lại <b>đang làm</b> — ⛔ máy không tự kết luận thay người'); return; }
  if(k==='dat'){ daDu41 = false; render(); return; }
  if(k==='traMa'){ modal('🔁 Bảng tra mã cũ → mới — M4.1 §6.11.4', bangTraMa41(),
     '<button class="btn" data-x="close">Đóng</button><button class="btn p" data-x="close">⬇ Tải về</button>'); return; }
});

render();
</script>
