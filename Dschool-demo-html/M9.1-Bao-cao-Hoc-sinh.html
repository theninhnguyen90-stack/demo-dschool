<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M9.1 Báo cáo tổng hợp — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:12px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:8px 0 0;flex-wrap:wrap;align-items:flex-end}
.tab1{padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tfil{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:5px;flex-wrap:wrap}

.scope{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:7px 12px;font-size:12px;color:var(--ink2);margin:8px 0 9px;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.inp{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:#fff;min-width:180px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hrow{display:grid;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:2.1fr 1.1fr .95fr 1.35fr 1fr}
.stage.open .hrow{grid-template-columns:2.1fr 1.2fr}
.stage.open .hcol{display:none}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.gone{opacity:.55}
.hdrow{display:grid;gap:9px;padding:7px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:2.1fr 1.1fr .95fr 1.35fr 1fr}
.stage.open .hdrow{grid-template-columns:2.1fr 1.2fr}
.stage.open .hdrow div.hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.bar2{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:54px;flex:1}
.bar2 i{display:block;height:100%;background:var(--brand)}
.qcell{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2)}

/* ---- toan man hinh: ma tran ---- */
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:2px 0 6px;flex-wrap:wrap}
.crumb b{color:var(--ink);font-size:15px}
.crumb .bk{color:var(--brand);font-weight:600;cursor:pointer}
.mxtool{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:0 0 9px}
.mxw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mxh,.mxr{display:grid;grid-template-columns:minmax(210px,2.4fr) repeat(7,34px) 104px 96px;gap:0;align-items:center}
.mxh{background:#f8fafc;border-bottom:1px solid var(--line);font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
.mxh>div{padding:7px 4px;text-align:center}
.mxh>div:first-child{text-align:left;padding-left:13px}
.mxr{border-bottom:1px solid var(--line);font-size:12.5px}
.mxr:hover{background:#fafbfc}
.mxr>.fn b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mxr>.fn span{font-size:10.5px;color:var(--ink3)}
.cel{display:grid;place-items:center;height:33px;border-left:1px solid #f1f5f9}
.cb{width:21px;height:21px;border-radius:6px;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;font-size:11px;color:var(--ink3)}
.cb:hover{border-color:var(--brand)}
.cb.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.cb.lk{background:#fef2f2;border-color:#fecaca;color:#b91c1c;cursor:help}
.cb.ch{box-shadow:0 0 0 2px #fde68a}
.mxsel{border:1px solid var(--line2);border-radius:6px;padding:3px 5px;font-size:11px;background:#fff;width:94px;margin:0 4px}
.mxsel:disabled{background:#f8fafc;color:var(--ink3);cursor:not-allowed}
.mxsel.mo{opacity:.4}
.mgrp{display:flex;align-items:center;gap:9px;padding:7px 13px;background:#e8eef6;border-bottom:1px solid var(--line2);font-size:12px;font-weight:700;cursor:pointer}
.mmen{display:flex;align-items:center;gap:8px;padding:6px 13px 6px 26px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
.mmen:hover{background:#eef2f7}
.mmen .ar{color:var(--ink3);font-size:9px;width:10px}
.mmen .mc{font-weight:700;color:var(--brand);font-size:11px;background:var(--brand-soft);border:1px solid #bfdbfe;border-radius:5px;padding:0 6px}
.mmen .mt{font-weight:600}
.mmen .ct{margin-left:auto;color:var(--ink3);font-size:11px;display:flex;gap:9px;align-items:center}
.mxr>.fn{padding:7px 13px 7px 42px;min-width:0}
.mgrp .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11px}

.ph{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:15px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:13px 15px;max-height:calc(100vh - 220px);overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.f{display:grid;grid-template-columns:130px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:12.5px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2)}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.c,th.c{text-align:center}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.rolnk.rd{color:#991b1b;background:var(--red-soft);border-color:#fecaca}
.rolnk.am{color:#92400e;background:var(--amber-soft);border-color:#fde68a}
.sech{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.dif{display:flex;align-items:flex-start;gap:9px;padding:6px 10px;border-radius:8px;font-size:12.5px;margin-bottom:5px;border:1px solid var(--line);background:#fff}
.dif.add{background:var(--green-soft);border-color:#a7f3d0;color:#065f46}
.dif.rem{background:var(--red-soft);border-color:#fecaca;color:#991b1b}
.dif .ic{flex:0 0 16px;font-weight:700}
.dif .sp{margin-left:auto;font-size:11px;opacity:.8;white-space:nowrap}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:760px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.din{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px;min-height:52px;resize:vertical}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:10px}
.chkl{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chkb{border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12px;background:#fff}
.chkb.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.chkb:disabled{opacity:.45;cursor:not-allowed}

.rolebar{background:#0f172a;color:#cbd5e1;padding:7px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.noacc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px;text-align:center}
.noacc h3{font-size:17px;margin-bottom:9px}
.noacc p{color:var(--ink2);font-size:13px;max-width:560px;margin:0 auto 9px}

.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-bottom:13px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;margin-bottom:13px}
.oso{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.oso:hover{border-color:var(--brand);background:var(--brand-soft)}
.tab1.mo{opacity:.45}
.hint{font-size:11.5px;color:var(--ink2);line-height:1.45}
.sech{font-weight:700;font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:15px 0 7px}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="HT">HT</button>
  <button class="rb" data-r="PHT_CM">PHT_CM</button>
  <button class="rb" data-r="PHT_A">PHT_ĐT · A</button>
  <button class="rb" data-r="VT">VT · ĐT A</button>
  <button class="rb" data-r="TCNS">TCNS</button>
  <button class="rb" data-r="KT">KT</button>
  <button class="rb" data-r="VT_HEP">VT thiếu quyền M1.5</button>
  <button class="rb" data-r="BTD">Bí thư Đoàn</button>

  <span class="note">Nhóm 9 <b>chỉ có X và XD</b> — không sửa được gì, chỉ deep-link về menu chủ</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option></select>
  <select class="sel" id="hdt"><option>Toàn trường</option></select>
  <span class="lockico" id="dtlock"></span>

  <button class="icobtn">🔔<span class="dot">3</span></button>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1 id="ttl">Báo cáo tổng hợp</h1>
      <span class="pill" style="background:var(--green-soft);color:#065f46;font-weight:700;border:1px solid #6ee7b7">M9.1 · v2.2 MVP</span><span class="pill">6 tab · 22 chỉ tiêu cơ bản + 15 <code>DD</code> · công thức đọc từ Từ điển chỉ tiêu nh9 §2</span><div class="spacer"></div>
      <button class="btn sm" data-x="ghiChu">💡 Ghi chú thiết kế</button><button class="btn sm" data-x="mau">📋 Mẫu báo cáo định kỳ</button>
      <button class="btn sm" data-x="xuatbang">⬇ Xuất bảng số liệu</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=x=>(x||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');
const HOMNAY='30/11/2026';   /* moc demo - xem ghiChuDemo() */
const DAUNAM='5/9/2026';

const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','!'],['M0.3','Thông báo']]],
 ['hs','👥 Học sinh',[['M1.1','Hồ sơ học sinh'],['M1.2','Đối tượng ưu tiên'],['M1.5','Chuyển trường'],
   ['M1.6','Bảo lưu / Tái nhập'],['M1.7','Chuyển lớp']]],
 ['bc','📊 Báo cáo & Thống kê',[['M9.1','Báo cáo Học sinh','x'],['M9.2','Báo cáo Học tập & Kết quả'],
   ['M9.8','Báo cáo Tuyển sinh'],['M9.9','Báo cáo gửi Sở / Phòng GD']]],
 ['ht','⚙ Hệ thống',[['M10.4','Chức danh & Phân quyền'],['M10.8','Đồng bộ CSDL ngành']]],
];

/* ===== §14.4 — mô hình quyền bằng MẢNG NĂNG LỰC, kiểm bằng .includes() =====
   'dd' = tab 🎖 Đoàn - Đội (m9.1.doan_doi — YKDD-2B). Trục tổ chức KHÔNG phải năng lực: nó theo chức danh (ddVaiTC ở app.60). */
const ROLE={
 FULL  :{ten:'Đủ quyền (demo)',sc:'school',av:'DQ',
         q:['hs','bd','kq','ns','tc','dd','xd_m15','xd_m16','xd_m17','xuat_ct']},
 HT    :{ten:'Hiệu trưởng',sc:'school',av:'HT',
         q:['hs','bd','kq','ns','tc','dd','xd_m15','xd_m16','xd_m17','xuat_ct']},

const d2n=s=>{const [d,m,y]=s.split('/').map(Number);return new Date(y,m-1,d)};

/* ===== ĐẾM SỐ TỒN — chốt tại một ngày ===== */
function dangHoc(h,ngay){
 if(!tr(h.vaoNgay,ngay))return false;                 /* chưa vào trường */
 if(h.roiNgay&&tr(h.roiNgay,ngay))return false;       /* đã rời trước ngày chốt */
 const bl=h.sk.find(s=>s[0]==='baoluu');
 if(bl&&tr(bl[1],ngay)){
  const tn=h.sk.find(s=>s[0]==='tainhap');
  if(!(tn&&tr(tn[1],ngay)))return false;              /* đang bảo lưu tại ngày chốt */
 }
 return true}
function dangBaoLuu(h,ngay){
 const bl=h.sk.find(s=>s[0]==='baoluu');
 if(!bl||!tr(bl[1],ngay))return false;
 const tn=h.sk.find(s=>s[0]==='tainhap');
 return !(tn&&tr(tn[1],ngay))}

function locDrill(d){
 const A=HS.filter(inScope);
 const g=h=>phanTo==='khoi'?'Khối '+h.k:phanTo==='dt'?h.dt:h.lop;
 if(d.t==='hoc'){const L=A.filter(h=>dangHoc(h,chotNgay)&&(!d.g||g(h)===d.g));
  return [L,'Học sinh đang học'+(d.g?' — '+d.g:''),
   ['Trạng thái <b>Đang học</b> tại ngày chốt <b>'+chotNgay+'</b>',

    (d.g?'Thuộc <b>'+d.g+'</b>':'Mọi khối / lớp')],
   ['Em đã <b>chuyển đi</b> hoặc <b>thôi học</b> trước ngày chốt',
    'Em <b>đang bảo lưu</b> tại ngày chốt — giữ chỗ nhưng không tính vào sĩ số',
    'Em <b>vào trường sau</b> ngày chốt'],'M1.1']}
 if(d.t==='baoluu'){const L=A.filter(h=>dangBaoLuu(h,chotNgay)&&(!d.g||g(h)===d.g));
  return [L,'Đang bảo lưu — giữ chỗ',

   ['Em đã <b>tái nhập</b> trước ngày chốt — đã quay lại nhóm Đang học'],'M1.6']}
 if(d.t==='uu'){let L=A.filter(h=>dangHoc(h,chotNgay)&&h.uu);
  if(d.u==='ngheo')L=L.filter(h=>['Hộ nghèo','Cận nghèo'].includes(h.uu));

 if(d.t==='pend')return [A.filter(h=>dangHoc(h,chotNgay)&&!h.mdd),'Còn mang mã định danh tạm',
   ['Đang học tại ngày chốt','Mã định danh bắt đầu bằng <code>PENDING-</code>'],
   ['Em đã có mã thật — kể cả mới nhập hôm nay'],'M10.8'];

/* ================= MODAL ================= */
function modal(h,b,f){
 $('#mh').innerHTML=h;$('#mb').innerHTML=b;
 const F=(f||[]).filter(Boolean);
 $('#mf').innerHTML=F.map(([l,fn,c],i)=>'<button class="btn '+(c===''?'':(c||(fn?'p':'')))+'" data-mf="'+i+'">'+l+'</button>').join('');
 window.__mf=F.map(x=>x[1]);
 $('#mask').classList.add('on')}
const closeM=()=>{$('#mask').classList.remove('on')};
let tmr;const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>e.classList.remove('on'),4200)};

/* ================= BIND ================= */
document.body.addEventListener('click',e=>{
 const g=id=>e.target.closest('['+id+']');
 let x;
 if(x=g('data-r')){role=x.dataset.r;
  const T=TABS.find(t=>t[0]===tab);
  if(T&&!co(T[2])){/* giữ nguyên tab để thấy khối .noacc, đúng nguyên tắc "ẩn thì phải nói" */}
  render();return}
 if(x=g('data-tab')){tab=x.dataset.tab;render();return}
 if(x=g('data-tab2')){tab=x.dataset.tab2;render();return}
 if(x=g('data-mf')){const fn=window.__mf[+x.dataset.mf];closeM();if(fn)fn();return}
 if(x=g('data-go')){toast('Deep-link sang '+x.dataset.go+' — mang theo bộ lọc của báo cáo, có đường quay lại M9.1');return}
 if(x=g('data-x')){act(x.dataset.x,x.dataset);return}
 if(e.target.id==='mask')closeM();
});
document.body.addEventListener('change',e=>{
 if(e.target.id==='fchot'){chotNgay=e.target.value.trim()||HOMNAY;render()}
 if(e.target.id==='ftu'){tuNgay=e.target.value.trim();render()}
 if(e.target.id==='fden'){denNgay=e.target.value.trim();render()}
});

function act(a,d){
 if(actDD(a,d))return;                       /* tab Đoàn - Đội — app.60 */
 if(a==='drill'){drill(d.k);return}
 if(a==='setchot'){chotNgay=d.k;render();return}
 if(a==='vehomnay'){chotNgay=HOMNAY;render();return}

 return R_('',[],[],[],[],'');
}
function drillDD(k){
 const x=locDD(k);
 $('#mdl').classList.remove('sm');
 modal('🔎 '+x.ten+' — <b>'+x.rows.length+'</b> dòng',
  '<div class="hb"><div class="lbh">📐 Quy tắc đếm</div><div style="padding:11px 13px">'+
   '<div style="font-weight:700;font-size:11.5px;color:var(--green);margin-bottom:5px">✓ TÍNH VÀO</div>'+x.vao.map(s=>'<div style="font-size:12.5px;margin-bottom:3px">• '+s+'</div>').join('')+
   '<div style="font-weight:700;font-size:11.5px;color:var(--red);margin:9px 0 5px">✕ KHÔNG TÍNH</div>'+x.ra.map(s=>'<div style="font-size:12.5px;margin-bottom:3px">• '+s+'</div>').join('')+
  '</div></div>'+
  '<div class="hb"><div class="lbh">Danh sách đơn vị<span class="sp"></span><span class="st2 n">'+x.rows.length+'</span></div><div style="padding:0">'+
   (x.rows.length?bang(x.cot,x.rows.map(r=>tr_(r.map(v=>esc(v))))):'<div class="empty" style="padding:18px">Không có bản ghi nào</div>')+'</div></div>'+
  '<div class="hint">Chỉ số tổng hợp — danh sách từng người mở ở menu chủ, theo quyền của bạn ở menu đó</div>',
  [['Đóng',0],['↗ Mở tại '+x.lk,()=>toast('Deep-link '+x.lk+'&return=M9.1 — mang theo khoảng thời gian, có đường quay lại M9.1'),'']]);
}

/* ================= MẪU NẠP SẴN — dải nút (§6.2), không phải màn hình mới ================= */
function napMauDD(m){
 const v=ddVaiTC();
 if(m==='hk'){DD.ky='hk';DD.hk=DD_HOM>=DD_NAM.hk[1][1]?1:0;return 'Tổng kết học kỳ '+DD_NAM.hk[DD.hk][0]}
 if(m==='nam'){DD.ky='nam';return 'Tổng kết năm học '+DD_NAM.ten}
 const tc=v.length===1?v[0]:(DD.tc==='doi'?'doi':'doan');
 const nk=NK_DD.filter(n=>n.tc===tc&&n.ke&&n.ke<=DD_HOM).slice(-1)[0];
 DD.ky='nk';DD.nk=nk.id;return 'Tổng kết nhiệm kỳ '+nk.ten;
}
const mauDDHtml=()=>co('dd')?'<div class="sech">Tab 🎖 Đoàn - Đội</div>'+
 [['hk','Tổng kết học kỳ','Học kỳ hiện hành · phát sinh từ đầu kỳ tới hôm nay'],['nam','Tổng kết năm học','01/09 → 31/08 — trùng năm đoàn phí và sổ Liên đội'],
  ['nk','Tổng kết nhiệm kỳ','Nhiệm kỳ vừa kết thúc gần nhất · ngày đầu / cuối từ M6.15']].map(x=>
 '<div class="hb" style="margin-bottom:8px"><div style="padding:10px 13px;display:flex;gap:10px;align-items:center"><div style="flex:1"><b>'+x[1]+'</b>'+
 '<div style="font-size:11.5px;color:var(--ink2);margin-top:3px">'+x[2]+'</div></div><button class="btn sm p" data-x="ddmau" data-k="'+x[0]+'">Nạp</button></div></div>').join(''):'';
const loaiSoDD=()=>{const K=ddKhoang();return 'Số TỒN · chốt '+d2(K.chot)+' — và số PHÁT SINH · '+d2(K.tu)+' → '+d2(K.denT)+' (hai loại, bảng riêng)'};

/* ================= THAO TÁC ================= */
function actDD(a,d){
 if(a==='drill'&&d.k&&decodeURIComponent(d.k).startsWith('{"dd"')){drillDD(JSON.parse(decodeURIComponent(d.k)).dd);return true}
 if(a==='ddky'){if(d.k==='nam')DD.ky='nam';else if(d.k==='tuy')DD.ky='tuy';else{DD.ky='hk';DD.hk=+d.k.slice(2)}render();return true}
 if(a==='ddtc'){DD.tc=d.k;render();return true}
 if(a==='ddmau'){const ten=napMauDD(d.k);tab='dd';closeM();toast('Đã nạp mẫu «'+ten+'» — tham số vào thẳng tab Đoàn - Đội');render();return true}
 return false;
}
document.body.addEventListener('change',e=>{
 if(e.target.id==='ddnk'&&e.target.value){DD.ky='nk';DD.nk=e.target.value;render()}
 if(e.target.id==='ddtu'||e.target.id==='ddden'){const v=tuVN(e.target.value);
  if(!v){toast('Ngày phải theo dạng dd/mm/yyyy');render();return}
  DD[e.target.id==='ddtu'?'tu':'den']=v;
  if(DD.tu>DD.den){toast('Từ ngày phải trước đến ngày — đã đổi chỗ hai ngày');const t=DD.tu;DD.tu=DD.den;DD.den=t}
  render()}
});
/* vai hẹp chỉ thấy một tổ chức — nhiệm kỳ đang chọn phải thuộc tổ chức đó */
function ddChuanVai(){const v=ddVaiTC(); if(!v.includes(nkDD(DD.nk).tc)){DD.nk=NK_DD.find(n=>n.tc===v[0]).id; if(DD.ky==='nk')DD.ky='nam'} if(v.length===1)DD.tc='ca'}
render();
</script>
