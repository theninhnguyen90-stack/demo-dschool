<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M8.4 Khiếu nại và phản ánh — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.lockic{font-size:11px;color:var(--ink3);margin-left:-8px}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:12px;flex-wrap:wrap;line-height:1.6}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber);background:var(--amber-soft);color:#92400e}
.scope.am b{color:#7c2d12}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:230px}
.qf{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;background:#fff;display:inline-flex;align-items:center;gap:6px}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.qf .c{background:var(--bg);color:var(--ink2);font-size:10.5px;font-weight:700;padding:0 6px;border-radius:9px}
.qf.on .c{background:rgba(255,255,255,.28);color:#fff}
.qf .c.al{background:var(--red);color:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1240px){.stage.open .listw{display:none}}

.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow .t1{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.hrow .t2{font-size:11.5px;color:var(--ink3);margin-top:2px}
.gbc{grid-template-columns:1.55fr 1.5fr 1.35fr 1.05fr .95fr}
.stage.open .gbc{grid-template-columns:1.5fr 1.4fr}
.gkc{grid-template-columns:1.6fr 1.35fr 1.25fr 1.1fr 1fr}
.stage.open .gkc{grid-template-columns:1.5fr 1.3fr}
.kx{min-width:0}
.stage.open .kx{display:none}
.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:var(--violet-soft);color:#5b21b6}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2);white-space:nowrap}
.pill.ns{background:var(--violet-soft);border-color:#ddd6fe;color:#5b21b6;font-weight:700}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px;line-height:1.65}
.lock{background:#f1f5f9;border:1px solid var(--line2);color:var(--ink2);padding:9px 12px;border-radius:9px;font-size:12px;line-height:1.65;margin-bottom:12px}
.lock b{color:var(--ink)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph .n{flex:1;min-width:0}
.ph .n h2{font-size:15px;font-weight:700;line-height:1.4}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbody{padding:13px 15px;max-height:calc(100vh - 300px);overflow-y:auto}
.pfoot{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.f{display:grid;grid-template-columns:132px 1fr;gap:11px;align-items:start;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sech{font-size:13px;font-weight:700;margin:15px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.sech:first-child{border-top:none;padding-top:0;margin-top:0}

.msgq{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px}
.msgq .h{font-size:11.5px;color:var(--ink2);font-weight:600;margin-bottom:4px;display:flex;gap:7px;flex-wrap:wrap}
.msgq .h .who{color:var(--ink)}
.msgq .tx{font-size:13px;line-height:1.65;white-space:pre-wrap}
.msgq.bad{background:var(--red-soft);border-color:#fecaca}

.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.g::before{background:var(--green)}.logi.r::before{background:var(--red)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

.gsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:11px}
.gsec h3{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gf{margin-bottom:12px}
.gf label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.gf label b{color:var(--red)}
.gf .hint{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.55}
.ti{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;background:#fff}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;min-height:70px;resize:vertical;font-family:inherit;line-height:1.6}
.ti.err,.ta.err{border-color:var(--red);background:var(--red-soft)}
.ti:disabled,.ta:disabled{background:var(--bg);color:var(--ink2);cursor:not-allowed}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:8px 13px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35}
.sgb b{display:block}
.sgb span{font-size:10.5px;color:var(--ink3)}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.sgb.on span{color:var(--brand)}
.sgb.dg.on{border-color:var(--red);background:var(--red-soft);color:#991b1b}
.sgb:disabled{opacity:.4;cursor:not-allowed;background:var(--bg)}
.sw{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:none}
.sw .tx{flex:1;min-width:0}
.sw .tx b{display:block;font-size:13px}
.sw .tx span{font-size:11.5px;color:var(--ink2);line-height:1.55;display:block;margin-top:2px}
.tg{width:42px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 42px;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--green)}
.tg.on::after{left:21px}
.tg.dis{opacity:.4;cursor:not-allowed}
.chk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:9px;padding:7px 12px;font-size:12.5px;background:#fff;text-align:left}
.chk.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.chk .bx{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:10px;color:#fff;flex:0 0 15px}
.chk.on .bx{background:var(--brand);border-color:var(--brand)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.diff{grid-template-columns:1fr}}
.diffb{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.7;max-height:200px;overflow-y:auto}
.diffb.old{background:var(--red-soft);border-color:#fecaca}
.diffb.new{background:var(--green-soft);border-color:#a7f3d0}
.diffb h5{font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;color:var(--ink2)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:800px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}

/* ============ M8.4 ============ */
.gkn{grid-template-columns:1.5fr 1.5fr 1.3fr 1.15fr .95fr}
.stage.open .gkn{grid-template-columns:1.25fr 1.1fr .72fr}
.hrow.al{border-left-color:var(--red);background:#fffbfb}
.hrow.al:hover{background:#fff5f5}
.hrow.al.on{background:#fee2e2}
.age{font-weight:700;color:var(--red)}
.age.w{color:var(--amber)}
.lo{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block;background:#e0e7ff;color:#3730a3}
.lo.ha{background:var(--violet-soft);color:#5b21b6}
.lo.kh{background:var(--bg);color:var(--ink2)}
.cd{font-size:10.5px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);padding:1px 7px;border-radius:5px;white-space:nowrap}
.cd.no{border-style:dashed;color:var(--ink3)}
.mo{color:var(--ink3);font-style:italic;letter-spacing:.5px}
.tep{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12px;background:#fff;margin:0 6px 6px 0}
.tep .nm{font-weight:600}
.tep .sz{color:var(--ink3);font-size:11px}
.tep .ph{background:var(--green-soft);color:var(--green);font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px}
.kqb{border:1px solid #a7f3d0;background:var(--green-soft);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.65}
.kqb .ht{font-weight:700;color:#065f46;margin-bottom:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gcb{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px}
.gcb .h{font-size:11.5px;color:var(--ink2);font-weight:600;margin-bottom:4px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.gcb .tx{font-size:13px;line-height:1.6;white-space:pre-wrap}
.gcb.ph{background:var(--green-soft);border-color:#a7f3d0}
.badge{background:var(--green-soft);color:var(--green);font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.fold{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.fold>.fh{padding:8px 12px;background:#f8fafc;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.fold>.fb{padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px}
.dl{display:inline-flex;align-items:center;gap:5px;color:var(--brand);font-size:12.5px;font-weight:600;border:1px solid #bfdbfe;background:var(--brand-soft);border-radius:7px;padding:4px 9px}
.dl:hover{background:#dbeafe}
.ctx{border:1px dashed var(--line2);border-radius:9px;padding:9px 12px;font-size:12.5px;background:#fcfcfd;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="VT">VT — Điểm trường A</button>
  <button class="rb" data-r="KT">KT (chỉ khoản thu)</button>
  <button class="rb" data-r="PHT_DT">PHT_ĐT — Điểm trường A</button>
  <button class="rb" data-r="HT">HT</button>
  <span class="note">Khiếu nại đến từ <b>App</b>, hoặc do trường <b>ghi nhận hộ</b> khi gia đình gọi hotline / đến trực tiếp</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"></select><span class="lockic" id="hlock"></span>
  <div class="spacer"></div>
  <button class="icobtn" title="Thông báo của tôi — M0.3">🔔<span class="dot" id="ndot">3</span></button>
  <button class="icobtn" title="Nhắn tin — M8.2">💬</button>
  <div class="avatar" id="ava">DQ</div>
</header>

<div class="wrap">
  <main class="main"><div id="content"></div></main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>

/* ===== TUOI VA CANH BAO — thay cho han cam ket (chot 3/9/2026) ===== */
function hoatDongCuoi(x){
 let t=x.nhan?x.nhan.t:x.gui;
 x.gc.forEach(g=>{if(g.t>t)t=g.t});
 if(x.kq&&x.kq.t>t)t=x.kq.t;
 return t;
}
function canhBao(x){
 if(x.tt==='cho'){const n=ngay(HOMNAY,x.gui);
  return n>=NG.chuaNhan?{k:'chuaNhan',n:n,tx:'Chưa tiếp nhận '+n+' ngày'}:null}
 if(x.tt==='dang'){const n=ngay(HOMNAY,hoatDongCuoi(x));
  return n>=NG.imLang?{k:'imLang',n:n,tx:'Im lặng '+n+' ngày'}:null}
 return null;
}
const canXuLy=x=>x.tt==='cho'||x.tt==='dang';
const choChot=x=>x.tt==='dang'&&x.kq&&!x.kq.chot;
const dsCanXuLy=()=>dsKN().filter(canXuLy);
const soCanhBao=()=>dsCanXuLy().filter(canhBao).length;

/* Luot doc GOP theo nguoi + ngay — khong de mot lan luot danh sach de ra chuc dong log */
function ghiDoc(x){

}

function render(){

  '</span></div>';

/* ============ KHUNG BA LOAI — §13: dung tu PHAM VI, khong dung tu du lieu ============ */
function khungLoai(ds){
 const r=R();
 return '<div class="sum">'+Object.keys(LOAI).map(function(k){
  const trong=r.loai.indexOf(k)>=0;
  if(!trong)return '<span style="opacity:.65">🔒 <b>'+LOAI[k].t+'</b> — '+LOAI[k].xl+' phụ trách, không nằm trong dữ liệu trả về cho bạn</span>';
  const n=ds.filter(x=>x.loai===k).length;
  return '<span><b>'+LOAI[k].t+'</b> '+(n?n:'0')+(n?'':' — chưa có khiếu nại loại này')+'</span>';
 }).join('')+'</div>';
}

/* ============ TAB 1 — CAN XU LY ============ */
function vCX(){
 const all=dsCanXuLy();
 let ds=all.slice();
 if(V.chip==='cb')ds=ds.filter(canhBao);
 else if(V.chip==='chot')ds=ds.filter(choChot);
 else if(V.chip==='cho'||V.chip==='dang')ds=ds.filter(x=>x.tt===V.chip);
 const q=kd(V.q);
 if(q)ds=ds.filter(x=>kd(x.id+' '+x.pg+' '+x.hs+' '+x.lop+' '+(x.cd||'')+' '+x.nd).indexOf(q)>=0);
 /* Sap: dong CO CANH BAO len dau, trong moi cum thi cu nhat truoc */
 ds.sort(function(a,b){
  const ca=canhBao(a),cb=canhBao(b);
  if(!!ca!==!!cb)return ca?-1:1;
  if(ca&&cb&&ca.n!==cb.n)return cb.n-ca.n;
  return a.gui-b.gui;});
 const chips=[['all','Tất cả',all.length],['cb','⚠ Cần chú ý',all.filter(canhBao).length],
  ['cho','Chờ xử lý',all.filter(x=>x.tt==='cho').length],['dang','Đang xử lý',all.filter(x=>x.tt==='dang').length]];
 if(co('chot'))chips.push(['chot','Chờ tôi chốt',dsKN().filter(choChot).length]);
 let h='<div class="bar"><input class="inp" id="q" placeholder="Tìm theo mã, phụ huynh, học sinh, lớp, nội dung…" value="'+esc(V.q)+'">'+
  chips.map(c=>'<button class="qf '+(V.chip===c[0]?'on':'')+'" data-chip="'+c[0]+'">'+c[1]+
   (c[2]?'<span class="c '+(c[0]==='cb'||c[0]==='chot'?'al':'')+'">'+c[2]+'</span>':'')+'</button>').join('')+
  khungLoai(all)+'</div>';
 h+=bang(ds,true);
 return h;
}

/* ============ TAB 2 — TAT CA ============ */
function vALL(){
 const all=dsKN();
 let ds=all.slice();
 if(V.chipA!=='all')ds=ds.filter(x=>x.tt===V.chipA);
 if(V.ngn==='app')ds=ds.filter(x=>x.nguon==='app');
 else if(V.ngn==='ho')ds=ds.filter(x=>x.nguon!=='app');
 if(V.tu)ds=ds.filter(x=>x.gui>=new Date(V.tu));
 if(V.den)ds=ds.filter(x=>x.gui<=new Date(V.den+'T23:59'));
 const q=kd(V.q);
 if(q)ds=ds.filter(x=>kd(x.id+' '+x.pg+' '+x.hs+' '+x.lop+' '+(x.cd||'')+' '+x.nd).indexOf(q)>=0);
 ds.sort((a,b)=>b.gui-a.gui);
 const chips=[['all','Tất cả',all.length],['cho','Chờ xử lý',all.filter(x=>x.tt==='cho').length],
  ['dang','Đang xử lý',all.filter(x=>x.tt==='dang').length],['xong','Đã xử lý',all.filter(x=>x.tt==='xong').length]];
 let h='<div class="bar"><input class="inp" id="q" placeholder="Tìm theo mã, phụ huynh, học sinh, lớp, nội dung…" value="'+esc(V.q)+'">'+
  chips.map(c=>'<button class="qf '+(V.chipA===c[0]?'on':'')+'" data-chipa="'+c[0]+'">'+c[1]+
   (c[2]?'<span class="c">'+c[2]+'</span>':'')+'</button>').join('')+
  '<span style="width:1px;height:22px;background:var(--line2);margin:0 3px"></span>'+
  [['all','Mọi nguồn',all.length],['app','📱 App',all.filter(x=>x.nguon==='app').length],
   ['ho','📞 Ghi nhận hộ',all.filter(x=>x.nguon!=='app').length]]
   .map(c=>'<button class="qf '+(V.ngn===c[0]?'on':'')+'" data-ngn="'+c[0]+'">'+c[1]+
    (c[2]?'<span class="c">'+c[2]+'</span>':'')+'</button>').join('')+
  '<span style="display:flex;align-items:center;gap:6px;font-size:12.5px">Gửi từ <input class="inp" type="date" id="tu" value="'+V.tu+'" style="max-width:150px"> đến <input class="inp" type="date" id="den" value="'+V.den+'" style="max-width:150px"></span>'+
  (V.tu||V.den?'<button class="btn xs" data-x="xoaLoc">✕ Bỏ lọc thời gian</button>':'')+
  khungLoai(all)+'</div>';
 h+=bang(ds,false);
 return h;
}

/* ============ BANG DANH SACH ============ */
function bang(ds,cx){
 let h='<div class="stage '+(V.pick?'open':'')+'"><div class="listw">';
 h+='<div class="hdrow gkn"><div>Khiếu nại</div><div>Học sinh · phụ huynh</div><div class="kx">Loại · chủ đề</div><div class="kx">Người xử lý</div><div>Trạng thái</div></div>';
 if(!ds.length)h+='<div class="empty"><b>Không có khiếu nại nào khớp bộ lọc</b>'+
  (cx?'Hàng đợi rỗng nghĩa là mọi khiếu nại trong phạm vi của bạn đã ở trạng thái Đã xử lý.':'Đổi chip trạng thái, bỏ lọc thời gian hoặc xóa từ khóa tìm kiếm.')+'</div>';
 ds.forEach(function(x){
  const cb=canhBao(x),cc=choChot(x);
  h+='<div class="hrow gkn '+(cb?'al':'')+' '+(V.pick===x.id?'on':'')+'" data-kn="'+x.id+'">'+
   '<div><div class="t1">'+x.id+
     (x.nguon!=='app'?' <span class="lo kh" title="'+NGUON[x.nguon].t+'">'+NGUON[x.nguon].ic+' ghi nhận hộ</span>':'')+'</div>'+
     '<div class="t2">'+(x.nguon==='app'?'Gửi ':'Ghi nhận ')+dt2s(x.gui)+
     (cb?' · <span class="age'+(cb.k==='chuaNhan'?'':' w')+'">'+cb.tx+'</span>':'')+'</div></div>'+
   '<div><div class="t1">'+tenHS(x)+' <span class="cd">'+x.lop+'</span></div>'+
     '<div class="t2">'+tenPG(x)+' · '+x.qh+' · '+DTS[x.dt]+'</div></div>'+
   '<div class="kx"><div class="t1"><span class="lo '+LOAI[x.loai].c+'">'+LOAI[x.loai].t+'</span></div>'+
     '<div class="t2">'+(x.cd?'<span class="cd">'+esc(x.cd)+'</span>':'<span class="cd no">chưa phân loại chủ đề</span>')+'</div></div>'+
   '<div class="kx"><div class="t1" style="font-weight:500">'+(x.xl?esc(x.xl):'<span class="mo">chưa ai nhận</span>')+'</div>'+
     '<div class="t2">'+(x.xlct?esc(x.xlct):LOAI[x.loai].xl+' xử lý theo mặc định')+'</div></div>'+
   '<div><span class="st2 '+TT[x.tt].c+'">'+TT[x.tt].t+'</span>'+
     (cc?' <span class="st2 b">chờ chốt</span>':'')+
     (x.tt==='xong'&&x.kq?'<div class="t2" style="margin-top:3px">'+HTKT[x.kq.ht].t+'</div>':'')+'</div></div>';
 });
 h+='</div>'+panel()+'</div>';
 return h;
}

<script>"use strict";

}
/* So gio da troi — dung cho canh bao phap ly cua loai KN-HA */
const gioTroi=x=>Math.floor((HOMNAY-x.gui)/3600000);

/* ============ PANEL TRUOT 1:1 ============ */
function panel(){
 if(!V.pick)return '<div class="panel"></div>';
 const x=knId(V.pick);if(!x)return '<div class="panel"></div>';
 const cb=canhBao(x),cc=choChot(x),ha=x.loai==='KN-HA';
 let h='<div class="panel"><div class="ph"><div class="n">'+
  '<h2>'+x.id+'</h2><div class="m"><span class="lo '+LOAI[x.loai].c+'">'+LOAI[x.loai].t+'</span> '+
  '<span class="st2 '+TT[x.tt].c+'">'+TT[x.tt].t+'</span>'+(cc?' <span class="st2 b">chờ chốt</span>':'')+'</div></div>'+
  '<button class="btn xs" data-x="close2">✕</button></div><div class="pbody">';

 /* --- canh bao van hanh (khong phai han cam ket) --- */
 if(cb)h+='<div class="'+(cb.k==='chuaNhan'?'danger':'warn')+'"><b>⚠ '+cb.tx+'.</b> '+
  (cb.k==='chuaNhan'?'Chưa có ai bấm Tiếp nhận. Ngưỡng nhắc hiện đặt '+NG.chuaNhan+' ngày.'
   :'Đã tiếp nhận nhưng '+cb.n+' ngày nay không có ghi chú hay kết quả nào mới. Ngưỡng nhắc hiện đặt '+NG.imLang+' ngày.')+'</div>';

 /* --- canh bao phap ly rieng cua KN-HA --- */
 if(ha&&x.tt!=='xong'){
  const g=gioTroi(x);
  h+='<div class="'+(g>72?'danger':'info')+'"><b>⚖ Đây là yêu cầu của chủ thể dữ liệu, không chỉ là phản ánh.</b> '+
   'Phản đối việc dùng ảnh của con là <b>quyền phản đối xử lý dữ liệu</b> và <b>quyền yêu cầu xóa dữ liệu</b> — '+
   '<b>Luật Bảo vệ dữ liệu cá nhân 91/2025/QH15</b> <i>(hiệu lực 01/01/2026)</i> và <b>NĐ 356/2025/NĐ-CP</b> buộc thực hiện yêu cầu <b>trong 72 giờ</b>.<br>'+
   'Đã trôi <b>'+g+' giờ</b> kể từ khi gia đình gửi'+(g>72?' — <b>đã quá mốc 72 giờ</b>.':'.')+
   ' Biện pháp tức thời đúng là <b>tạm ẩn ảnh trước, xác minh sau</b>.</div>';
 }

 /* --- nut thao tac doi theo trang thai --- */
 let nut='';
 if(x.tt==='cho'){
  if(co('nhan'))nut+='<button class="btn p" data-nhan="'+x.id+'">✋ Tiếp nhận</button>';
  if(co('phanloai'))nut+='<button class="btn" data-pl="'+x.id+'">🏷 Phân loại &amp; gán người xử lý</button>';
 }else if(x.tt==='dang'){
  if(co('ghichu'))nut+='<button class="btn p" data-gc="'+x.id+'">＋ Ghi chú xử lý</button>';
  if(!x.kq&&co('soanKQ'))nut+='<button class="btn" data-kq="'+x.id+'">✅ Ghi kết quả xử lý</button>';
  if(x.kq&&co('soanKQ'))nut+='<button class="btn" data-kq="'+x.id+'">✏ Sửa kết quả</button>';
  if(x.kq&&co('chot'))nut+='<button class="btn p" data-chot="'+x.id+'">🔒 Chốt Đã xử lý</button>';
  if(co('gan'))nut+='<button class="btn" data-pl="'+x.id+'">👤 Chuyển người xử lý</button>';
 }
 if(ha&&x.tt!=='xong'&&co('anhtam'))nut+='<button class="btn d" data-an="'+x.id+'">⏸ Tạm ẩn ảnh</button>';
 if(x.tt==='xong'&&co('xuat'))nut+='<button class="btn" data-hoso="'+x.id+'">⬇ Xuất hồ sơ khiếu nại</button>';
 if(nut)h+='<div class="pfoot" style="padding:0 0 11px;border:none">'+nut+'</div>';
 if(x.tt==='dang'&&x.kq&&!x.kq.chot&&!co('chot'))
  h+='<div class="lock">Kết quả đã soạn xong nhưng <b>bạn không có quyền Duyệt</b> nên không chốt được. Việc này đang chờ <b>PHT_ĐT hoặc Hiệu trưởng</b> — đổi vai ở thanh đen để thử.</div>';

 /* --- ngu canh gan kem --- */
 if(x.ctx){
  h+='<div class="ctx"><span>🔗</span><span style="flex:1"><b>'+esc(x.ctx.nhan)+'</b><br><span style="font-size:11.5px;color:var(--ink3)">'+
   x.ctx.ma+(x.ctx.ma2?' · '+x.ctx.ma2:'')+' — gia đình gửi khiếu nại từ đúng màn hình này trên App</span></span>'+
   dl(x.ctx.menu,'Mở '+x.ctx.ma+' tại '+x.ctx.menu,x.ctx.ma)+'</div>';
 }

 /* --- thong tin --- */
 h+='<div class="sech">Thông tin khiếu nại</div>';
 h+='<div class="f"><div class="k">Học sinh</div><div class="v">'+tenHS(x)+' <span class="cd">'+x.lop+'</span> <span class="cd">'+DTS[x.dt]+'</span></div></div>';
 h+='<div class="f"><div class="k">Người gửi</div><div class="v">'+tenPG(x)+' <span style="font-weight:400;color:var(--ink2)">— '+x.qh+' của em</span></div></div>';
 h+='<div class="f"><div class="k">Nguồn tiếp nhận</div><div class="v">'+NGUON[x.nguon].ic+' '+NGUON[x.nguon].t+
  (x.ghi?' <span style="font-weight:400;color:var(--ink2)">— '+esc(x.ghi.ai)+', '+esc(x.ghi.ct)+' ghi nhận hộ</span>':'')+'</div></div>';

  '<div class="sech">Điểm còn chờ chốt ⏳</div>'+

/* ============ SU KIEN ============ */
document.addEventListener('click',function(e){
 const t=e.target.closest('[data-r],[data-tab],[data-chip],[data-chipa],[data-ngn],[data-kn],[data-x],[data-nhan],[data-pl],[data-gc],[data-kq],[data-chot],[data-an],[data-hoso],[data-go],[data-tep],[data-taitep],[data-fold],[data-xtep],[data-tb],[data-thsel],[data-tkenh],[data-txtep]');
 if(!t)return;const d=t.dataset;

 if(d.r){role=d.r;V={tab:'cx',chip:'all',chipA:'all',ngn:'all',pick:null,q:'',hdt:'ALL',tu:'',den:'',mo:{}};
   document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role));render();return}
 if(d.tab){V.tab=d.tab;V.pick=null;V.q='';render();return}
 if(d.chip){V.chip=d.chip;V.pick=null;render();return}
 if(d.chipa){V.chipA=d.chipa;V.pick=null;render();return}
 if(d.ngn){V.ngn=d.ngn;V.pick=null;render();return}

 /* --- ghi nhan ho: 3 buoc --- */
 if(d.thsel){TF.hs=HSDS.find(s=>s.ma===d.thsel);veTaoHo();return}
 if(d.tkenh){TF.kenh=d.tkenh;TF.nd=$('#tND').value;veTaoHo();return}
 if(d.txtep){TF.nd=$('#tND').value;TF.tep.splice(+d.txtep,1);veTaoHo();return}
 if(d.tb){
   const b=+d.tb;
   if(b===2&&TF.b===1&&!TF.hs){toast('⛔ <b>Chưa chọn học sinh</b> — tìm và bấm vào một dòng trong danh sách');return}
   if(b===3&&TF.b===2&&!TF.cd){$('#tCD').classList.add('err');toast('⛔ <b>Chưa chọn chủ đề</b> — chủ đề quyết định bản ghi chạy tới bàn của ai');return}
   if(TF.b===3)TF.nd=$('#tND').value;
   TF.b=b;veTaoHo();return}
 if(d.fold){V.mo[d.fold]=!V.mo[d.fold];render();return}
 if(d.kn){
   if(V.pick===d.kn){V.pick=null;render();return}
   V.pick=d.kn;const moi=ghiDoc(knId(d.kn));render();
   if(moi)audit('bạn đã mở '+d.kn+' — lưu kèm chức danh «'+R().ct+'»');
   return}
 if(d.x==='close'){closeModal();return}
 if(d.x==='close2'){V.pick=null;render();return}
 if(d.x==='taoho'){hopTaoHo();return}
 if(d.x==='tThemTep'){
   const n=['don-viet-tay.jpg','anh-chup-hoa-don.jpg','giay-to-kem-theo.pdf'][TF.tep.length%3];
   TF.nd=$('#tND').value;TF.tep.push({n:n,s:'380 KB'});veTaoHo();return}
 if(d.x==='ghiChu'){ghiChuTK();return}
 if(d.x==='xuat'){hopXuat();return}
 if(d.x==='xoaLoc'){V.tu='';V.den='';render();return}
 if(d.x==='themTep'){
   const n=['bien-ban-lam-viec.pdf','anh-hien-truong.jpg','quyet-dinh-xu-ly.pdf','phieu-dieu-chinh.pdf'][KQF.tep.length%4];
   KQF.tep.push({n:n,s:'420 KB',ph:true});KQF.nd=$('#kND').value;veKQ(V.pick);return}
 if(d.xtep){KQF.nd=$('#kND').value;KQF.tep.splice(+d.xtep,1);veKQ(V.pick);return}
 if(d.nhan){hopNhan(d.nhan);return}
 if(d.pl){hopPL(d.pl);return}
 if(d.gc){hopGC(d.gc);return}
 if(d.kq){hopKQ(d.kq);return}
 if(d.chot){hopChot(d.chot);return}
 if(d.an){hopAn(d.an);return}
 if(d.hoso){hopHoSo(d.hoso);return}
 if(d.go){const p=d.go.split('|');closeModal();
   toast('🔗 Mở <b>'+p[0]+'</b>'+(p[1]?' tại bản ghi <b>'+p[1]+'</b>':'')+' — deep-link mang theo đường quay lại M8.4');return}
 if(d.tep){audit('xem tệp «'+d.tep+'» — dữ liệu cá nhân trẻ em, mọi lượt xem đều ghi vết');return}
 if(d.taitep){audit('TẢI tệp «'+d.taitep+'» — bản sao ra khỏi hệ thống, ghi vết riêng');return}
});
document.addEventListener('input',function(e){
 if(e.target.id==='q'){V.q=e.target.value;V.pick=null;reRender('#q')}
});
document.addEventListener('change',function(e){
 if(e.target.id==='hdt'){V.hdt=e.target.value;V.pick=null;render()}
 if(e.target.id==='tu'){V.tu=e.target.value;V.pick=null;render()}
 if(e.target.id==='den'){V.den=e.target.value;V.pick=null;render()}
});
render();
</script>
