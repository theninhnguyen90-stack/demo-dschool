        : '🕐 <b>Chờ Hiệu trưởng ký</b>' + (k.doiSoat ? ' — Kế toán đã đối chiếu ' + k2s(k.doiSoat.luc) + '.' : '') + ' '
        + '<button class="btn xs" data-dl="M6.4" data-dlq="tab=kiemke&dot=' + k.id + '&viec=ky&return=' + MENU_NAY + '">↗ Ký biên bản tại M6.4 tab 3</button>')
      + '</div>'
      + '<div class="kyro">🛑 Ký thuộc <b>M6.4</b> — nhóm 📊 chỉ <b>Xem</b> · <b>Xuất</b>. Tệp xuất có đóng dấu ngày chốt, không thay chữ ký.</div></div>';
  }

  /* ---------- 🔗 chiếu m6.4.bao_cao_cong_trinh — N7 ---------- */
  const bc = BCCT_CHIEU;
  let chieu = '<div class="bg chieu"><div class="bgh"><b>🔗 Thực trạng công trình — bản chiếu</b>' + KB.chip('TON')
    + '<span class="bgky">cập nhật ' + k2s(bc.capNhat) + '</span><span class="spacer"></span>'
    + '<button class="btn xs" data-dl="M6.4" data-dlq="tab=baocaoct&return=' + MENU_NAY + '">↗ M6.4 tab 4b</button></div>'
    + '<div class="tbx"><table class="bgt"><thead><tr><th>Chỉ tiêu</th>'
    + bc.cap.map(c => '<th class="num">' + esc(c) + '</th>').join('') + '<th class="num">Tổng</th></tr></thead><tbody>'
    /* ★ Ô của bản chiếu CŨNG BẤM ĐƯỢC — nguyên tắc số 1 không có ngoại lệ cho
       bảng đi mượn. Khác ở chỗ nó không mở panel drill-down: dữ liệu thuộc
       M6.4, nên bấm là ĐI VỀ CHỦ của nó, không phải xem một panel dựng lại. */
    + bc.dong.map((d, i) => '<tr><td>' + esc(d.ten) + '</td>'
      + d.so.map((s2, j) => '<td class="num"><button class="oso ochieu" data-dl="M6.4" '
        + 'data-dlq="tab=baocaoct&dong=' + i + '&cap=' + j + '&return=' + MENU_NAY + '" '
        + 'title="Số của M6.4 tab 4b — bấm để mở đúng ô này ở menu chủ">' + vn(s2) + '</button></td>').join('')
      + '<td class="num"><button class="oso ochieu" data-dl="M6.4" data-dlq="tab=baocaoct&dong=' + i
      + '&return=' + MENU_NAY + '"><b>' + vn(d.so.reduce((a, b2) => a + b2, 0)) + '</b></button></td></tr>').join('')
    + '</tbody></table></div>'
    + '<div class="chieuro">🛑 <b>Nhu cầu đầu tư khai ở M6.4 tab 4b</b> — tab đó có ô nhập, nhóm 📊 thì không (<b>N7</b>). Đây chỉ chiếu phần số.</div></div>';

  return h + chonDot
    + dnote('Hai khối <b>A</b> và <b>B</b> tách hẳn vì <b>hai loài số</b>: khối A đếm tại <i>ngày chốt</i>, khối B đếm trong <i>một đợt kiểm kê</i>. '
      + 'Cột «Sổ sách tại mốc» của khối B là bản chụp lúc mở đợt, không phải sổ hôm nay — sổ vẫn động trong lúc ban kiểm kê đi đếm.')
    + KB.bang(khoiA) + khoiB + chuKy + chieu;
}

/* ══════════════ TAB 2 · SỬA CHỮA & LUÂN CHUYỂN ════════════════════════
   Khuôn K9 — bảng tiến độ. HAI BỘ ĐIỀU KHIỂN THỜI GIAN trên cùng một tab,
   cố ý: dải trên hỏi «hôm nay còn tồn bao nhiêu», bảng dưới hỏi «trong kỳ
   phát sinh bao nhiêu». Đó là hai câu hỏi khác nhau, không cộng vào nhau. */
function veTab2() {
  const dsTong = BAOHONG, dsPV = BAOHONG.filter(trongPV);
  let h = daiPV('phiếu sửa chữa', dsPV.length, dsTong.length);

  /* ---------- dải TỒN ---------- */
  h += PV.chotNgay() + PV.daiCanhBao();
  const ttMo = [['moi', 'Mới báo — chờ đến nơi xác nhận'], ['tiepnhan', 'Đã xác nhận tại chỗ'], ['dangxuly', 'Đang sửa / thay']];
  h += KB.K1({
    id: 't', tieuDe: 'Phiếu còn ĐANG MỞ tại ngày chốt', ma: 'CS.03', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Trạng thái', donVi: 'phiếu',
    nguon: 'm6.4.sua_chua_thay_the',
    dong: ttMo.map(([k, t]) => ({ id: k, ten: t, loc: x => x.tt === k })),
    link: d => ({ menu: 'M6.11', ctx: 'tab=suachua&tt=' + d.id, nhan: 'Sửa chữa & thay thế' }),
    oSo: d => CT.doc('CS.03', PV.thamSo({ loc: d.loc }))
  });
  const qh = CT.doc('CS.03', PV.thamSo(), 'quaHan');
  if (qh.giaTri > 0) h += '<div class="canh w">⏰ <b>' + qh.giaTri + ' phiếu quá ' + NGUONG_QUAHAN
    + ' ngày làm việc</b> <i>(ngưỡng mặc định, chờ trường chốt)</i> '
    + '<button class="btn xs" data-dl="M6.11" data-dlq="tab=suachua&loc=quahan&return=' + MENU_NAY + '">↗ M6.11</button></div>';

  /* ---------- bảng K9 · PHÁT SINH theo tháng ---------- */
  h += '<div class="pvcach">Bảng dưới đếm <b>trong khoảng</b> — không cộng với dải tồn ở trên.</div>';
  h += PV.khoang();
  const thang = [];
  { let t = thangCua(PV.st.tuNgay); const het = thangCua(PV.st.denNgay); let dem = 0;
    while (t <= het && dem++ < 24) {
      thang.push(t);
      const d = k2d(t + '-01'); d.setMonth(d.getMonth() + 1); t = thangCua(d2k(d));
    } }
  const trongThang = t => x => thangCua(x.ngay) === t;
  const xongThang = t => x => x.ngayXong && thangCua(x.ngayXong) === t;
  h += KB.K9({
    id: 'k9', tieuDe: 'Tiến độ xử lý phiếu sửa chữa theo tháng', ma: 'CS.03', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Tháng',
    dong: thang.map(t => ({ id: t, ten: tenThang(t) })),
    link: d => ({ menu: 'M6.11', ctx: 'tab=suachua&thang=' + d.id, nhan: 'Sửa chữa & thay thế' }),
    cot: [
      { khoa: 'moi', ten: 'Yêu cầu mới', kieu: 'so', nguon: 'm6.4.sua_chua_thay_the' },
      { khoa: 'xong', ten: 'Hoàn thành', kieu: 'so', nguon: 'm6.4.sua_chua_thay_the' },
      { khoa: 'tv', ten: 'Thời gian xử lý', donVi: 'ngày · trung vị', kieu: 'ngay', nguon: 'm6.4.sua_chua_thay_the' },
      { khoa: 'qh', ten: 'Quá hạn', donVi: '> ' + NGUONG_QUAHAN + ' ngày LV', kieu: 'so', nguon: 'm6.4.sua_chua_thay_the', canhBao: k => k.giaTri > 0 },
      { khoa: 'cp', ten: 'Chi phí ghi trên phiếu', donVi: 'nghìn đ', kieu: 'nghin', nguon: 'm6.4.sua_chua_thay_the' }
    ],
    o: (d, c) => {
      const t = d.id;
      if (c.khoa === 'moi') return CT.doc('CS.03', PV.thamSoPS({ loc: trongThang(t) }), 'moTrongKhoang');
      if (c.khoa === 'xong') return CT.doc('CS.03', PV.thamSoPS({ loc: xongThang(t) }), 'xongTrongKhoang');
      if (c.khoa === 'tv') return CT.doc('CS.04', PV.thamSoPS({ loc: xongThang(t) }));
      if (c.khoa === 'qh') return CT.doc('CS.03', PV.thamSo({ loc: trongThang(t) }), 'quaHan');
      return CT.doc('CS.03', PV.thamSoPS({ loc: xongThang(t) }), 'chiPhi');
    },
    tongRieng: c => c.khoa === 'tv' ? CT.doc('CS.04', PV.thamSoPS())
      : c.khoa === 'qh' ? CT.doc('CS.03', PV.thamSo(), 'quaHan') : null,
    duoiBang: '<div class="canh b">💰 Chi phí <b>ghi trên phiếu</b> ≠ quyết toán; tiền thật ở M7.5. '
      + '<button class="btn xs" data-dl="M7.5" data-dlq="return=' + MENU_NAY + '">↗ M7.5</button></div>'
  });

  /* ---------- khối phụ · điều chuyển giữa điểm trường (K5) ---------- */
  const tu = PV.st.tuNgay, den = PV.st.denNgay;
  const dc = DIEUCHUYEN.filter(d => d.ngayDX >= tu && d.ngayDX <= den)
    .filter(d => { const x = dtHieuLuc(); return x === 'ALL' || d.nguon === x || d.dich === x });
  if (!coXD('m6.4.dieu_chuyen_giua_diem_truong')) {
    h += '<div class="bg"><div class="bgh"><b>Điều chuyển giữa điểm trường</b></div>'
      + '<div class="noaccbox">🔒 <b>Khối này bị ẩn.</b> Vai <b>' + esc(R().cd) + '</b> không có quyền '
      + '<b>Xuất dữ liệu (XD)</b> ở <b>Điều chuyển giữa điểm trường — M6.11</b>. '
      + 'Có <b>' + dc.length + ' lệnh</b> trong khoảng đang xem, không hiện ở đây.</div></div>';
  } else {
    h += KB.K5({
      tieuDe: 'Khối phụ · Điều chuyển giữa điểm trường', chip: 'PS', moTaKy: PV.moTaKhoang(),
      banGhi: dc.map(d => ({
        so: d.id, ngay: k2s(d.ngayDX),
        noiDung: (tsById(d.ts) || {}).ten + ' · ' + DT[d.nguon] + ' → ' + DT[d.dich],
        nguoiLap: d.boiDX, nguoiKy: d.tt === 'hoantat' ? 'Hoàn tất ' + k2s(d.ngayXong) : '—',
        tt: TT_DC[d.tt][0]
      })),
      kiemSoHieu: false,
      chuoiTrong: 'Không có lệnh điều chuyển nào trong khoảng đang xem.',
      duoiBang: '<div class="ro">Điều chuyển = <b>đổi hẳn nơi sở hữu</b>; mượn = dùng tạm (tab 3). '
        + '<button class="btn xs" data-dl="M6.11" data-dlq="tab=dieuchuyen&return=' + MENU_NAY + '">↗ M6.11</button></div>'
    });
  }
  return h + dnote('Tab này giáp <b>M6.11</b> — nhưng M6.11 trả lời <i>«phiếu nào của tôi chưa xong, bấm vào để xử lý»</i>, '
    + 'còn tab này trả lời <i>«cả kỳ trường sửa bao nhiêu việc, mất bao lâu, tốn bao nhiêu»</i>. '
    + 'Khác kỳ, khác dòng, khác người đọc — nên hai chỗ ra hai con số khác nhau là <b>đúng</b>.');
}

/* ══════════════ TAB 3 · KHAI THÁC PHÒNG & THIẾT BỊ ════════════════════
   Khuôn K2 — bảng chéo. CHỈ SỐ PHÁT SINH: câu hỏi của tab này luôn là
   «trong khoảng ấy phòng được dùng bao nhiêu», không có vế «tại ngày».    */
function veTab3() {
  const phongDem = PHONG.filter(p => !LOAI_NGOAI_CS05.includes(p.loai));   /* PHKT-1C — + noitru */
  const dsPV = phongDem.filter(trongPV);
  let h = daiPV('phòng', dsPV.length, phongDem.length) + PV.khoang();

  h += '<div class="pvbar"><span class="pvlb">🎯 Đối tượng</span>'
    + '<button class="pvk' + (ST.doiTuong === 'phong' ? ' on' : '') + '" data-dtg="phong">Phòng</button>'
    + '<button class="pvk' + (ST.doiTuong === 'tb' ? ' on' : '') + '" data-dtg="tb">Thiết bị cho mượn</button>'
    + '<span class="pvmc">Phòng tính theo <b>tiết</b> · thiết bị theo <b>ngày</b>.</span></div>';
  h += PV.chonChieu('CS.05', ['diem_truong', ST.doiTuong === 'phong' ? 'loai_phong' : 'loai_tai_san', 'thang', 'mon_hoc']);

  /* ── dòng của bảng đổi theo CHIỀU PHÂN TỔ ──────────────────────────
     Không cắt → một dòng một đối tượng. Cắt theo chiều → một dòng một
     giá trị của chiều, và ô là số GỘP của cả nhóm (cộng tử số và mẫu số
     rồi mới chia — xem ghi chú ở CS.05).                                */
  const ct = PV.st.phanTo;
  const kieu = ST.doiTuong;
  const dsDT = kieu === 'phong' ? dsPV
    : TAISAN.filter(t => t.diDong && !['thanhly', 'hong'].includes(t.tt) && trongPV(t));
  let dong;
  if (!ct) {
    dong = dsDT.map(x => ({
      id: x.id, ids: [x.id], ten: x.id + ' · ' + x.ten, nhom: DT[x.dt],
      phu: kieu === 'phong' ? LOAIP[x.loai] + (x.tt !== 'dung' ? ' · ' + TT_PHONG[x.tt][0] : '') : LOAITS[x.loai],
      mo: kieu === 'phong' && x.tt !== 'dung'
    }));
  } else if (ct === 'thang') {
    const th = []; let t0 = thangCua(PV.st.tuNgay); const het = thangCua(PV.st.denNgay); let dem = 0;
    while (t0 <= het && dem++ < 24) { th.push(t0); const d0 = k2d(t0 + '-01'); d0.setMonth(d0.getMonth() + 1); t0 = thangCua(d2k(d0)) }
    dong = th.map(t => ({ id: t, ids: dsDT.map(x => x.id), ten: tenThang(t), thang: t }));
  } else {
    const khoa = ct === 'diem_truong' ? (x => x.dt) : (x => x.loai);
    const ten = ct === 'diem_truong' ? (k => DT[k]) : (k => kieu === 'phong' ? LOAIP[k] : LOAITS[k]);
    const nhomHoa = {};
    dsDT.forEach(x => { (nhomHoa[khoa(x)] = nhomHoa[khoa(x)] || []).push(x.id) });
    dong = Object.keys(nhomHoa).map(k => ({ id: k, ids: nhomHoa[k], ten: ten(k), phu: nhomHoa[k].length + (kieu === 'phong' ? ' phòng' : ' thiết bị') }));
  }
  const thamDong = d => {
    const t = { kieu, doiTuongIds: d.ids };
    if (d.thang) { const a = d.thang + '-01', b0 = k2d(a); b0.setMonth(b0.getMonth() + 1); b0.setDate(0); t.tuNgay = a > PV.st.tuNgay ? a : PV.st.tuNgay; t.denNgay = d2k(b0) < PV.st.denNgay ? d2k(b0) : PV.st.denNgay }
    return PV.thamSoPS(t);
  };
  if (kieu === 'phong') {
    h += KB.K2({
      id: 'kt', tieuDe: 'Khai thác PHÒNG' + (ct ? ' — phân tổ theo ' + CT.CHIEU[ct] : ''),
      ma: 'CS.05', chip: 'PS', moTaKy: PV.moTaKhoang(),
      tenCotDau: ct ? CT.CHIEU[ct] : 'Phòng', dong, gomNhom: !ct && dtHieuLuc() === 'ALL',
      link: d => ({ menu: 'M6.5', ctx: 'tab=lichmuon&phong=' + d.ids.join(','), nhan: 'Lịch mượn phòng' }),
      cot: [
        { khoa: 'luotMuon', ten: 'Lượt mượn', donVi: 'đã duyệt', kieu: 'so', nguon: 'm6.5.lich_muon_phong' },
        { khoa: 'tietDung', ten: 'Tiết sử dụng', kieu: 'so', nguon: 'm4.6.tkb_dang_ap_dung' },
        { khoa: null, ten: 'Tỉ lệ khai thác', kieu: 'tile', nguon: 'm4.6.khung_tiet_rang_buoc' },
        { khoa: 'tuChoiTrung', ten: 'Bị từ chối vì trùng', kieu: 'so', nguon: 'm6.5.lich_muon_phong', canhBao: k => k.giaTri > 0 }
      ],
      o: (d, c) => CT.doc('CS.05', thamDong(d), c.khoa || undefined),
      tongRieng: c => c.khoa ? null : CT.doc('CS.05', PV.thamSoPS({ kieu: 'phong', doiTuongIds: dsDT.map(x => x.id) }))
    });
    h += '<div class="ro">⛔ Ngoài mẫu số: phòng đang sửa · đóng cửa · sân · nhà công vụ — vẫn hiện thành dòng mờ.</div>';
  } else {
    h += KB.K2({
      id: 'kt', tieuDe: 'Khai thác THIẾT BỊ cho mượn' + (ct ? ' — phân tổ theo ' + CT.CHIEU[ct] : ''),
      ma: 'CS.05', chip: 'PS', moTaKy: PV.moTaKhoang(),
      tenCotDau: ct ? CT.CHIEU[ct] : 'Thiết bị', gomNhom: !ct && dtHieuLuc() === 'ALL', dong,
      link: d => ({ menu: 'M6.5', ctx: 'tab=thietbi&ts=' + d.ids.join(','), nhan: 'Thiết bị đang cho mượn' }),
      cot: [
        { khoa: 'luotMuon', ten: 'Lượt mượn', donVi: 'đã duyệt', kieu: 'so', nguon: 'm6.5.thiet_bi_dang_cho_muon' },
        { khoa: 'ngayMuon', ten: 'Ngày cho mượn', kieu: 'so', nguon: 'm6.5.thiet_bi_dang_cho_muon' },
        { khoa: null, ten: 'Tỉ lệ khai thác', kieu: 'tile', nguon: 'm6.5.thiet_bi_dang_cho_muon' }
      ],
      o: (d, c) => CT.doc('CS.05', thamDong(d), c.khoa || undefined),
      tongRieng: c => c.khoa ? null : CT.doc('CS.05', PV.thamSoPS({ kieu: 'tb', doiTuongIds: dsDT.map(x => x.id) }))
    });
  }
  return h + dnote('Tab này <b>không xếp hạng phòng</b> và <b>không có cột điểm thi đua</b>. '
    + 'Một phòng bộ môn khai thác thấp có thể chỉ vì cả trường có hai lớp học môn đó — '
    + 'quy một hoàn cảnh về một thứ hạng là nói dối bằng con số.');
}

/* ══════════════════════════ VẼ LẠI ════════════════════════════════════ */
function ve() {
  KB.moi();
  rolebar(); header(); tabs();
  if (!R().tab.length) {
    $('#content').innerHTML = '<div class="noaccbox big">🔒 <b>Vai ' + esc(R().cd) + ' không có Feature nào của M9.13.</b><br>'
      + 'Bảng chuẩn quyền <b>không có dòng nào</b> cho chức danh này ở ba Feature — '
      + '<b>không có dòng nghĩa là không có quyền</b>. Việc CSVC của giáo viên ở <b>M6.5</b>: '
      + '<button class="btn xs" data-dl="M6.5" data-dlq="return=' + MENU_NAY + '">↗ Mở M6.5</button></div>';
    $('#topact').innerHTML = '';
    return;
  }
  const t = TAB.find(x => x.ma === ST.tab) || TAB[0];
  $('#h1').textContent = 'Báo cáo CSVC & thiết bị';
  $('#crumb').innerHTML = '<div class="crumb">📊 Báo cáo &amp; thống kê <span>›</span> <b>CSVC &amp; thiết bị</b> '
    + '<span>›</span> ' + esc(t.nhan.replace(/^\d+ · /, ''))
    + '<span class="pill">' + t.bc + '</span><span class="pill">loại ' + t.loai + '</span><span class="pill">khuôn ' + t.k + '</span></div>';
  $('#topact').innerHTML = XU.veNut();
  $('#content').innerHTML = PV.daiMau()
    + (ST.tab === 'kiem_ke' ? veTab1() : ST.tab === 'sua_chua' ? veTab2() : veTab3());
}

/* ══════════════════════════ NỐI DÂY ═══════════════════════════════════ */
KB.datMenu(MENU_NAY);
KB.noiQuyen(f => coXD(f), f => NGUON[f] || { menu: '?', ten: f });
PV.noiVeLai(ve);
PV.doiTab = t => { if (coTab(t)) ST.tab = t };
XU.noiBoiCanh(() => {
  const t = TAB.find(x => x.ma === ST.tab) || TAB[0];
  const ky = ST.tab === 'khai_thac' ? PV.moTaKhoang()
    : ST.tab === 'sua_chua' ? PV.moTaChot() + ' · ' + PV.moTaKhoang() : PV.moTaChot();
  const maCT = ST.tab === 'kiem_ke' ? 'VH.03' : ST.tab === 'sua_chua' ? 'CS.03' : 'CS.05';
  const kb = CT.khaiBao(maCT);
  return {
    truong: 'THCS & THPT Nguyễn Tất Thành',
    baoCao: 'Báo cáo CSVC & thiết bị — ' + t.nhan.replace(/^\d+ · /, '') + ' (' + t.bc + ')',
    menu: MENU_NAY, nguoi: R().n, chucDanh: R().cd, ky,
    phamVi: tenPhamVi(),
    toanTruong: TAISAN.filter(x => x.tt !== 'thanhly').length,
    tongPhamVi: TAISAN.filter(x => x.tt !== 'thanhly' && trongPV(x)).length,
    donVi: 'tài sản',
    quyTac: (kb.quyTacDem.tinhVao || []).concat((kb.quyTacDem.khongTinh || []).map(x => 'KHÔNG tính: ' + x)),
    /* Danh sach truong DOI THEO TAB — muc 2 cua ba tab lay ba loai ban ghi khac nhau */
    truong_du_lieu: TRUONG_XUAT[ST.tab],
    soDong: soDongChiTiet()
  };
});
/* ── ba danh sách trường của mức 2 — mỗi tab một bộ ────────────────────
   Mức 2 của ba tab lấy ba loại bản ghi khác nhau, nên trường cá nhân cũng
   khác: tab 1 là người kiểm đếm, tab 2 là người báo hỏng, tab 3 là người
   mượn. Một danh sách dùng chung thì người xuất tab 3 vẫn phải bỏ chọn một
   trường không có trong bảng họ đang xem. */
const TRUONG_XUAT = {
  kiem_ke: [
    { khoa: 'ma', ten: 'Mã tài sản', batBuoc: true },
    { khoa: 'ten', ten: 'Tên tài sản', batBuoc: true },
    { khoa: 'phong', ten: 'Phòng đặt' },
    { khoa: 'tt', ten: 'Tình trạng' },
    { khoa: 'gia', ten: 'Nguyên giá' },
    { khoa: 'kq', ten: 'Kết luận kiểm kê · ghi chú' },
    { khoa: 'nguoiDem', ten: 'Người kiểm đếm (họ tên)', nhay: true, macDinh: false }
  ],
  sua_chua: [
    { khoa: 'id', ten: 'Số phiếu', batBuoc: true },
    { khoa: 'ngay', ten: 'Ngày báo · ngày xong', batBuoc: true },
    { khoa: 'phong', ten: 'Phòng · đối tượng' },
    { khoa: 'tt', ten: 'Trạng thái · cách xử lý' },
    { khoa: 'chiphi', ten: 'Chi phí ghi trên phiếu' },
    { khoa: 'nguoiBao', ten: 'Người báo hỏng (họ tên)', nhay: true, macDinh: false }
  ],
  khai_thac: [
    { khoa: 'id', ten: 'Mã yêu cầu', batBuoc: true },
    { khoa: 'doiTuong', ten: 'Phòng · thiết bị', batBuoc: true },
    { khoa: 'ngay', ten: 'Ngày · tiết' },
    { khoa: 'tt', ten: 'Trạng thái' },
    { khoa: 'mucDich', ten: 'Mục đích sử dụng' },
    { khoa: 'nguoiMuon', ten: 'Người mượn (họ tên)', nhay: true, macDinh: false }
  ]
};
const soDongChiTiet = () => ST.tab === 'kiem_ke'
  ? TAISAN.filter(trongPV).length
  : ST.tab === 'sua_chua' ? BAOHONG.filter(trongPV).length
    : YEUCAU.filter(trongPV).length;

KB.gan(); PV.gan(); XU.gan();

document.addEventListener('click', e => {
  const r = e.target.closest('[data-r]');
  if (r) { role = r.getAttribute('data-r'); moTab(tabMacDinh()); ve(); return }
  const t = e.target.closest('[data-t]');
  if (t) { moTab(t.getAttribute('data-t')); ve(); return }
  const d = e.target.closest('[data-dot]');
  if (d) { ST.dotKK = d.getAttribute('data-dot'); ve(); return }
  const g = e.target.closest('[data-dtg]');
  if (g) { ST.doiTuong = g.getAttribute('data-dtg'); PV.st.phanTo = null; ve(); return }
  if (e.target.closest('#btnNote')) { ST.note = !ST.note; ve(); return }
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const m = dl.getAttribute('data-dl'), q = dl.getAttribute('data-dlq') || '';
    toast('↗ Deep-link sang <b>' + esc(m) + '</b> — <code>?' + esc(q) + '</code><br>'
      + '<i>Demo một tệp: không mở được menu khác, nhưng đường dẫn là đường dẫn thật.</i>');
  }
});
$('#hdt').addEventListener('change', e => { ST.dt = e.target.value; ve() });

function toast(h) {
  const t = $('#toast'); t.innerHTML = h; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 4200);
}

/* ── công cụ nghiệm thu: đo MẬT ĐỘ CHỮ GIẢI THÍCH (`nh9` §9.1, ngưỡng ≤ 20%)
   Gọi `doMatDoChu()` trong console. Đếm ký tự của mọi khối giải thích chia
   cho ký tự của toàn màn hình đang hiện.                                 */
function doMatDoChu() {
  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(n => { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = { tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
window.doMatDoChu = doMatDoChu;

ST.tab = tabMacDinh();
ve();
</script>
