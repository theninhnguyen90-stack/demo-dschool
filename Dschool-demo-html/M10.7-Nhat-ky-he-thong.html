/* ════════ LỌC ════════ */
function locHienTai(){
  const q=document.getElementById('q').value.trim().toLowerCase(),
        fu=document.getElementById('fu').value, fa=document.getElementById('fa').value,
        fm=document.getElementById('fm').value, ft=+document.getElementById('ft').value,
        fl=document.getElementById('fl').value, fc=document.getElementById('fc').value,
        fz=document.getElementById('fz').checked;
  return nguon().filter(function(r){
    if(r.ar && !fz) return false;
    if(ft && ngay(r.t)>ft) return false;
    if(fu && r.u!==fu) return false;
    if(fa && r.a!==fa) return false;
    if(fm && r.mn!==fm) return false;
    if(fl && String(r.m)!==fl) return false;
    if(fc==='*' && !(r.f&&r.f.length)) return false;
    if(fc && fc!=='*' && !(r.f&&r.f.indexOf(fc)>=0)) return false;
    if(q){
      const s=(r.u+' '+r.ob+' '+r.mn+' '+(r.df||[]).map(x=>x.join(' ')).join(' ')).toLowerCase();
      if(s.indexOf(q)<0) return false;
    }
    return true;
  }).sort((a,b)=>b.t-a.t);
}
