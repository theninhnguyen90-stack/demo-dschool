<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1.5 Chuyển trường — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:12px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink2)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;overflow-x:auto}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:2px}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:290px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap;align-items:center}
.sum b{color:var(--ink)}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12.5px;background:#fff;white-space:nowrap}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.chip .cb{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;margin-left:5px}
.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:8px 12px;border-radius:9px;font-size:12.5px;margin-bottom:11px;display:flex;gap:8px;align-items:flex-start}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
.stage.open .hcol{display:none}
@media(max-width:1180px){.stage.open .listw{display:none}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tr.tr:hover td{background:var(--brand-soft);cursor:pointer}
tr.tr.on td{background:#eff6ff}
tr:last-child td{border-bottom:none}
.wrapx{overflow-x:auto}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph h2{font-size:16px;font-weight:700}
.ph .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:14px 15px;max-height:calc(100vh - 210px);overflow-y:auto}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px;line-height:1.6}
.ok{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;line-height:1.6}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:5px}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:default}

.hb{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:13px}
.lbh{padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.lbh .sp{flex:1}
.f2{display:grid;grid-template-columns:158px 1fr;gap:10px;padding:7px 12px;font-size:12.5px}
.f2+.f2{border-top:1px solid #f1f5f9}
.f2 .k{color:var(--ink2)}
.f2 .v{font-weight:600}

.tl{border-left:2px solid var(--line);margin-left:9px;padding-left:17px}
.tli{position:relative;padding:8px 0;font-size:12.5px}
.tli::before{content:"";position:absolute;left:-23px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #fff}
.tli.now::before{background:var(--amber);box-shadow:0 0 0 3px #fef3c7}
.tli.wait::before{background:var(--line2)}
.tli.no::before{background:var(--red)}
.tli.now{background:var(--amber-soft);border-radius:8px;padding:8px 10px;margin-left:-10px}
.tli b{display:block}
.tli span{color:var(--ink3);font-size:11.5px}

.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
.ck.done{background:var(--green-soft);border-color:#a7f3d0}
.ck .ic{font-size:15px;flex:0 0 20px;text-align:center}
.ck .bd{flex:1;min-width:0}
.ck .bd b{display:block;font-size:12.5px}
.xnrow{display:flex;gap:11px;align-items:flex-start;cursor:pointer;user-select:none}
.xnrow.off{cursor:not-allowed;opacity:.72}
.xnrow:not(.off):hover .bd b{color:var(--brand)}
.xncb{width:19px;height:19px;flex:0 0 19px;margin-top:2px;cursor:pointer;accent-color:var(--green)}
.xncb:disabled{cursor:not-allowed}
.ck .bd span{font-size:11.5px;color:var(--ink3)}
.who{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.who.may{background:#e0e7ff;color:#3730a3}
.who.ng{background:#fef3c7;color:#92400e}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:12.5px}
.cmp .h{background:#f8fafc;padding:7px 10px;font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;border-bottom:1px solid var(--line)}
.cmp .c{padding:7px 10px;border-bottom:1px solid #f1f5f9}
.cmp .c.bad{background:var(--red-soft);color:#991b1b;font-weight:700}
.cmp .lb{font-size:10.5px;color:var(--ink3);display:block;font-weight:400}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:880px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column}
.modal.sm{width:620px}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--ink3);font-size:12.5px;margin-top:4px;cursor:pointer}
.drop:hover{border-color:var(--brand);color:var(--brand)}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.ai{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:700;
 letter-spacing:.03em;background:rgba(0,0,0,.09);color:inherit;opacity:.85;vertical-align:middle;white-space:nowrap}
.btn.p .ai,.btn.d .ai,.btn.g .ai{background:rgba(255,255,255,.26)}
.hintline .ai{background:#e0e7ff;color:#3730a3;opacity:1}
.ck .bd b .ai{background:#e0e7ff;color:#3730a3}
.hintline{background:var(--bg);border:1px dashed var(--line2);color:var(--ink2);
 padding:7px 11px;border-radius:8px;font-size:12px;margin-bottom:11px}
.hint{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:7px 11px;border-radius:8px;font-size:12px;margin:9px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:36px;text-align:center;color:var(--ink3)}
.noacc{padding:50px 30px;text-align:center}
.noacc .ic{font-size:38px;margin-bottom:12px}
.wk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;background:#fff}
.wk:hover{border-color:var(--brand);background:var(--brand-soft)}
.wk.on{border-color:var(--brand);background:#eff6ff}
.wk .ic{font-size:17px;flex:0 0 24px}
.wk .bd{flex:1;min-width:0}
.wk .bd b{display:block;font-size:13px}
.wk .bd span{font-size:11.5px;color:var(--ink3)}
.cols{display:flex;gap:13px;align-items:flex-start}
.colL{flex:0 0 340px;max-width:340px}
.colR{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(max-width:1100px){.cols{flex-direction:column}.colL{flex:1;max-width:none;width:100%}}
.chip .cb{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;margin-left:5px}
.tab1 .b{margin-left:2px}
.actbar{position:sticky;top:0;z-index:5;display:flex;gap:7px;flex-wrap:wrap;align-items:center;
 padding:10px 15px;background:#f8fafc;border-bottom:1px solid var(--line)}
.syncbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;background:#eef2ff;border:1px solid #c7d2fe;
 color:#3730a3;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
.hslist{border:1px solid var(--line);border-radius:9px;max-height:200px;overflow-y:auto;margin-top:7px}
.hsr{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:12.5px}
.hsr:last-child{border-bottom:none}
.hsr:hover{background:var(--brand-soft)}
.hsr.on{background:#eff6ff}
.hsr>div{flex:1;min-width:0}
.hsr b{display:block}
.hsr span.lbl,.hsr div span{display:block;font-size:11px;color:var(--ink3)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
.ck.done{background:var(--green-soft);border-color:#a7f3d0}
.ck .ic{font-size:15px;flex:0 0 20px;text-align:center}
.ck .bd{flex:1;min-width:0}
.ck .bd b{display:block;font-size:12.5px}
.ck .bd span{font-size:11.5px;color:var(--ink3)}
.who{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.who.may{background:#e0e7ff;color:#3730a3}
.who.ng{background:#fef3c7;color:#92400e}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:12.5px}
.cmp .h{background:#f8fafc;padding:7px 10px;font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;border-bottom:1px solid var(--line)}
.cmp .c{padding:7px 10px;border-bottom:1px solid #f1f5f9}
.cmp .c.bad{background:var(--red-soft);color:#991b1b;font-weight:700}
.cmp .lb{font-size:10.5px;color:var(--ink3);display:block;font-weight:400}
.tli.no::before{background:var(--red)}
.pbody{max-height:calc(100vh - 250px)}
</style>
</head>

<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb" data-r="GVCN">GVCN 9A2</button>
  <button class="rb" data-r="VT">Văn thư · ĐT A</button>
  <button class="rb" data-r="KT">Kế toán · ĐT A</button>
  <button class="rb" data-r="PHT_A">PHT_ĐT · Điểm trường A</button>
  <button class="rb" data-r="PHT_B">PHT_ĐT · Điểm trường B</button>
  <button class="rb on" data-r="HT">Hiệu trưởng</button>
  <span class="note">Hệ thống vận hành trường — phụ huynh dùng App riêng, không có mặt trong menu</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="nam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"></select>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot" id="bell">0</span></button>

</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Chuyển trường</h1>
      <span class="pill">Đổi pháp nhân trường — chuyển điểm trường thuộc M1.7</span></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal" id="mdl">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const NGAY='26/8/2026';
const vnd=n=>n.toLocaleString('vi-VN')+'đ';


const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','!'],['M0.3','Thông báo'],['M0.4','Trang cá nhân']]],
 ['hs','👥 Học sinh',[['M1.1','Hồ sơ học sinh'],['M1.2','Đối tượng ưu tiên'],['M1.3','Học bạ điện tử'],
   ['M1.4','Tuyển sinh đầu cấp'],['M1.5','Chuyển trường','x'],['M1.6','Bảo lưu / Tái nhập'],
   ['M1.7','Lớp học & Chuyển lớp']]],
 ['lop','📚 Lớp học hàng ngày',[['M2.5','Bảng điểm môn học'],['M2.9','Không gian lớp học']]],
 ['tc','💰 Tài chính',[['M7.1','Danh mục khoản thu'],['M7.2','Theo dõi thực hiện khoản thu'],['M7.3','Điều chỉnh & Hoàn tiền']]],
 ['vb','📄 Văn bản',[['M4.11','Văn bản đi']]],
];

/* v2.0 — chuỗi duyệt rút gọn:
   Chuyển đi : Nháp → Chờ KT đối soát → Chờ HT duyệt và ký → Chờ trường đến tiếp nhận → Đã hoàn tất
   Chuyển đến: Đang hoàn thiện hồ sơ → Chờ HT duyệt tiếp nhận và ký → Đã tiếp nhận
   b = bước mà vai trò này xử lý · lam = thao tác nghiệp vụ của văn thư */

  :{c:'o',l:'Trường đến',v:t.den.ten+' · '+t.den.tinh,s:''});
 o.push(t.no
  ?{c:'r',l:'Công nợ',v:'Còn nợ '+vnd(t.no),
    s:'KHÔNG chặn cứng — đẩy lên Hiệu trưởng quyết. Kế toán đối soát và báo số; cho chuyển hay không là thẩm quyền Hiệu trưởng.',go:'M7.2'}
  :{c:'o',l:'Công nợ',v:(t.tt==='nhap'?'Chưa đối soát':(t.hoan?'Không nợ · phải hoàn '+vnd(t.hoan):'Không nợ, không phải hoàn')),

 o.push(t.hb.giuaky

  :t.hb.thieu.length

/* trạng thái hồ sơ giấy tờ: SUY RA, không có nút "đánh dấu đủ" */
function hsTT(t){
 const F=t.files||{}, co=GTDEN.filter(g=>F[g]), chua=GTDEN.filter(g=>F[g]&&!F[g].dc);
 if(co.length<GTDEN.length)return ['r','⚠ Thiếu '+(GTDEN.length-co.length)+'/'+GTDEN.length+' giấy tờ',GTDEN.filter(g=>!F[g])];
 if(chua.length)return ['w','Chờ đối chiếu '+chua.length+' giấy tờ',chua];
 return ['o','✓ Đủ '+GTDEN.length+'/'+GTDEN.length+' giấy tờ',[]]}
const duHoSo=t=>hsTT(t)[0]==='o';

function hbTT(t){
 const h=t.hbn;
 if(!h)return ['n','Chưa nhận tệp'];
 if(h.sig==='bad')return ['r','⛔ Chữ ký không hợp lệ — chặn import'];
 if(h.lech.filter(l=>!h.xuly[l[0]]).length)return ['r','⛔ Lệch '+h.lech.filter(l=>!h.xuly[l[0]]).length+' thông tin, chưa import'];
 if(!h.imported)return ['w','Sẵn sàng import'];
 if(h.sig==='warn')return ['w','⚠ Đã tiếp nhận — chưa xác thực được'];
 return ['o','✓ Đã tiếp nhận — chữ ký hợp lệ']}

/* --- việc còn tồn SAU khi ticket đã đóng: không giam ticket, đẩy sang M1.1 / M0.2 --- */
function conTon(t){
 const O=[];
 if(t.chieu==='den'&&t.tt==='xong'){
  if(!t.hbn||!t.hbn.imported)O.push(['Chưa tiếp nhận học bạ từ '+t.cu.ten,'M1.3']);
  if(!t.hd)O.push(['Chưa phát sinh hóa đơn học phí','M7.2']);
  if(t.csTam)O.push(['Còn dùng mã tạm '+t.csTam+' — chưa có mã định danh chính thức','M10.8']);
 }
 if(t.chieu==='di'&&t.tt==='xong'){
  if(!t.sau||!t.sau.bg)O.push(['Chưa ghi nhận bàn giao bản cứng cho gia đình','']);
 }
 return O}

/* --- Hai xác nhận thay cho hai bước duyệt (v2.1) ---
   Không đẩy ticket qua tay GVCN rồi Kế toán. Màn hình bày sẵn thống kê,
   người duyệt gọi hỏi rồi tích. Tích đủ thì nút Duyệt và ký mới sáng. */
const XN=[
 {k:'lop',ic:'🏫',t:'Bàn giao lớp',
  ai:t=>'GVCN '+gvcnCua(t.lop),
  ho:'Quỹ lớp · sách và đồ dùng mượn ghi sổ tay · kỷ luật đang xem xét chưa lập hồ sơ'},
 {k:'no',ic:'💰',t:'Công nợ',
  ai:t=>'Kế toán — '+ROLE.KT.sdt,
  ho:'Khoản thu tiền mặt chưa nhập sổ · số phải hoàn của khoản đã đóng chưa dùng'},
];
const xnOf=t=>(t.xn=t.xn||{lop:{},no:{}});
const duXN=t=>XN.every(x=>xnOf(t)[x.k]&&xnOf(t)[x.k].ok);
const thieuXN=t=>XN.filter(x=>!(xnOf(t)[x.k]&&xnOf(t)[x.k].ok)).map(x=>x.t);

/* --- ai đang phải làm gì --- */
function choToi(t){const r=R();
 if(dong(t)||t.tt==='xong')return false;
 if(t.tt===r.b)return true;
 if(t.tt==='ht'&&t.chieu==='di'&&r.xn&&!duXN(t))return true;   /* còn xác nhận chưa tích */
 if(t.tt==='ngoai'&&r.lam)return true;          /* VT theo dõi bên kia + xuất học bạ */
 if(t.tt==='tuchoiNgoai'&&(r.lam||r.ky))return true;
 if(t.tt==='nhap'&&t.chieu==='den'&&r.chonlop&&duHoSo(t))return true;  /* PHT đề xuất lớp */
 return false}
function loaiCho(t){const r=R();
 if(!choToi(t))return null;
 if(t.tt==='ht')return (t.chieu==='di'&&!duXN(t))
  ?(r.ky?['b','Thiếu xác nhận: '+thieuXN(t).join(' · ')]:['b','Chờ bạn xác nhận: '+thieuXN(t).join(' · ')])
  :['v','Chờ bạn duyệt và ký'];
 if(t.tt==='nhap')return t.chieu==='den'&&r.chonlop&&!r.lam?['b','Chờ bạn đề xuất lớp']:['b','Chờ bạn hoàn thiện'];
 if(t.tt==='ngoai')return ['b','Chờ trường đến — theo dõi'];
 if(t.tt==='tuchoiNgoai')return ['r','Bên kia từ chối — cần xử lý'];
 return ['b','Chờ bạn'];}
const viecCua=()=>T.filter(t=>inScope(t)&&choToi(t));

function locTT(L){
 if(fTT==='Đang xử lý')return L.filter(t=>!dong(t)&&t.tt!=='xong');
 if(fTT==='Chờ tôi')return L.filter(choToi);
 if(fTT==='Đã hoàn tất')return L.filter(t=>t.tt==='xong');
 if(fTT==='Đã đóng (từ chối / hủy)')return L.filter(dong);
 return L.filter(t=>!dong(t))}

   (gk?'<div class="info"><b>Hệ thống tự chọn loại giấy, người dùng không tự chọn.</b><div style="margin-top:5px">Chuyển đi <b>giữa kỳ, chưa tổng kết</b> — năm đang học sẽ <b>không bao giờ có học bạ tại trường này</b>. Bàn giao: học bạ <b>'+t.hb.nam.length+' năm trước</b> + <b>Giấy xác nhận quá trình học tập đến thời điểm chuyển</b>.</div></div>'+
     '<div class="ro">Theo <b>TT 50/2021</b>, trường nhận chấp nhận <i>học bạ HOẶC giấy xác nhận kết quả học tập</i> — nên bản này đủ hiệu lực để nhập học.</div>':'')+
   (thieu.length?'<div class="danger"><b>⛔ Chưa xuất được — còn '+thieu.length+'/'+t.hb.nam.length+' năm chưa Hoàn tất:</b>'+
     thieu.map(x=>'<div style="margin-top:5px">&bull; Năm <b>'+x[0]+'</b> — '+x[1]+' <span class="rolnk" data-go="M1.3">→ M1.3</span></div>').join('')+
     '<div style="margin-top:8px;font-size:11.5px">Bàn giao học bạ thiếu chữ ký sang trường khác là <b>đẩy artefact không có hiệu lực pháp lý ra ngoài phạm vi kiểm soát của mình</b>.</div></div>'
    :'<div class="ok">✓ '+(gk?'Các năm trước đã Hoàn tất':'Toàn bộ '+t.hb.nam.length+' năm đã Hoàn tất')+' — '+t.hb.nam.join(' · ')+'</div>')+
   '<div><b>Mục đích xuất</b> <span style="color:var(--red)">*bắt buộc — ghi audit theo NĐ 13/2023</span>'+
   '<select class="fldi"><option>Hồ sơ chuyển trường</option><option>Cấp bản sao theo yêu cầu gia đình</option></select></div>'+
   '<div class="ro" style="margin:11px 0 0">Bản xuất có <b>chữ ký số HT + chữ ký số trường</b>, có <b>mã tra cứu và QR</b> ở mỗi trang để bên nhận xác thực.</div>',
   [['Hủy',0],thieu.length?null:['📤 Xuất',()=>{t.sau=t.sau||{};t.sau.xuat=1;
     t.log.push(lg(R().n,gk?'Xuất giấy xác nhận quá trình học tập + học bạ các năm trước':'Xuất học bạ điện tử '+t.hb.nam.length+' năm','Mục đích: hồ sơ chuyển trường'));
     toast('Đã xuất · ký số HT + trường · ghi audit kèm mục đích');render()},'p']]);return}

 if(a==='bangiao'){
  $('#mdl').classList.add('sm');
  if(!t.sau||!t.sau.xuat){toast('Chưa xuất học bạ — không có gì để bàn giao');return}
  modal('✍️ Ghi nhận bàn giao bản cứng',
   '<div class="info"><b>Máy biết tệp đã sinh ra; máy không biết gia đình đã cầm bản cứng về chưa.</b> Vì thế đây là mục duy nhất <b>bắt buộc có ảnh minh chứng</b> — về sau tranh chấp <i>"trường chưa trả học bạ"</i> thì đây là bằng chứng duy nhất.</div>'+
   '<div><b>Hình thức</b><select class="fldi" id="fht"><option>Trao trực tiếp cho gia đình</option><option>Gửi trực tiếp trường mới</option><option>Qua CSDL ngành</option></select></div>'+
   '<div style="margin-top:11px"><b>Người nhận</b> <span style="color:var(--red)">*bắt buộc</span>'+
   '<input class="fldi" id="fai" value="'+t.ph[0].ten+' ('+t.ph[0].qh+') — CCCD "></div>'+
   '<div style="margin-top:11px"><b>Ảnh biên bản có chữ ký người nhận</b> <span style="color:var(--red)">*bắt buộc</span>'+
   '<div class="drop">📷 Bấm để chụp hoặc tải ảnh biên bản</div></div>',
   [['Hủy',0],['✓ Ghi nhận bàn giao',()=>{
     t.sau.bg=1;t.sau.bgHt=$('#fht').value;t.sau.bgAi=$('#fai').value;t.sau.bgNgay=NGAY;
     t.log.push(lg(R().n,'Bàn giao bản cứng — '+t.sau.bgHt,'Người nhận: '+t.sau.bgAi+' · có ảnh biên bản'));
     toast('Đã ghi nhận bàn giao · lưu ảnh biên bản · ghi audit');render()},'g']]);return}

 /* --- chọn lớp (đề xuất) --- */
 if(a==='chonlop'){
  const L=LOP.filter(x=>x.k===t.khoi&&x.dt===t.dt);
  modal('🪑 Đề xuất lớp tiếp nhận — Khối '+t.khoi+' · '+t.dt,
   '<div class="ro">Phó hiệu trưởng <b>đề xuất</b> vì nắm sĩ số từng lớp; <b>Hiệu trưởng chốt lại ngay trong màn hình ký</b>. Chọn lớp và ký là một bước, không tách thành hai trạng thái ticket.</div>'+
   (L.length?'<table><tr><th>Lớp</th><th>GVCN</th><th>Sĩ số</th><th></th></tr>'+
    L.map(x=>'<tr><td><b>'+x.id+'</b></td><td>'+x.gvcn+'</td>'+
     '<td>'+(x.ss>=x.max?'<span class="st2 w">'+x.ss+'/'+x.max+' — vượt</span>':'<span class="st2 o">'+x.ss+'/'+x.max+'</span>')+'</td>'+
     '<td><button class="btn xs '+(t.lop===x.id?'':'p')+'" data-x="lopOK" data-t="'+t.id+'" data-k="'+x.id+'">'+(t.lop===x.id?'Đang chọn':'Chọn')+'</button></td></tr>').join('')+'</table>'
    :'<div class="empty">Không có lớp nào đúng khối trong điểm trường này</div>')+
   '<div class="warn" style="margin:11px 0 0">Lớp vượt sĩ số: <b>cảnh báo, không chặn</b>.</div>',
   [['Đóng',0]]);return}
 if(a==='lopOK'){const old=t.lop;t.lop=d.k;
  t.log.push(lg(R().n,old?'Đổi lớp đề xuất '+old+' → '+d.k:'Đề xuất lớp tiếp nhận '+d.k,''));
  closeM();toast('Đã đề xuất lớp '+d.k+' · Hiệu trưởng chốt khi ký');render();return}

 if(a==='doidt'){
  $('#mdl').classList.add('sm');
  modal('🔄 Đổi Điểm trường đăng ký',
   '<div class="danger">Đổi giá trị này là <b>chuyển ticket sang phạm vi Phó hiệu trưởng khác</b>. Ghi audit và thông báo cả hai bên.</div>'+
   '<div><b>Điểm trường đăng ký</b><select class="fldi" id="fdt"><option>Điểm trường A</option><option>Điểm trường B</option></select></div>',
   [['Hủy',0],['✓ Đổi',()=>{const v=$('#fdt').value;if(v===t.dt){toast('Không đổi gì');return}
     const old=t.dt;t.dt=v;t.lop='';
     t.log.push(lg(R().n,'Đổi Điểm trường đăng ký '+old+' → '+v,'Lớp đề xuất bị xóa vì khác điểm trường'));
     cur=null;toast('Đã đổi sang '+v+' · ticket rời khỏi phạm vi PHT '+old);render()},'d']]);return}

 /* --- sửa / hủy / thu hồi --- */
 if(a==='suatk'){
  const ty=t.chieu==='di'
   ?[['Học sinh',t.n,'fn'],['Trường đến',t.den.ten,'fden'],['Ngày dự kiến chuyển',t.ngay,'fngay']]
   :[['Họ và tên',t.n,'fn'],['Ngày sinh',t.ns,'fns'],['Khối đăng ký',t.khoi,'fkhoi']];
  const ph=t.chieu==='di'
   ?[['SĐT liên hệ chính',t.ph[0].sdt,'psdt'],['Lý do chuyển',t.ly,'ply']]
   :[['SĐT liên hệ chính',t.ph[0].sdt,'psdt'],['Nơi ở',t.dcTT,'pdc'],['Lý do chuyển',t.ly,'ply']];
  const daQua=CH[t.chieu].slice(1,CH[t.chieu].indexOf(t.tt));
  const fld=(l,v,id,ty2)=>'<div style="margin-bottom:9px"><b>'+l+'</b>'+(ty2?' <span class="st2 r">Trọng yếu</span>':'')+
   '<input class="fldi" id="'+id+'" data-goc="'+String(v).replace(/"/g,'&quot;')+'" value="'+String(v).replace(/"/g,'&quot;')+'"></div>';
  $('#mdl').classList.remove('sm');
  modal('✏️ Sửa ticket '+t.id,
   (t.tt==='nhap'?'<div class="ro">Trạng thái <b>Nháp</b> — sửa tự do, chưa ai xử lý.</div>'
    :'<div class="warn"><b>Ticket đã qua '+daQua.length+' bước.</b> Sửa <b>trường trọng yếu</b> sẽ <b>vô hiệu các bước đó</b> và đưa ticket về <b>'+BUOC[t.chieu][CH[t.chieu][0]]+'</b>.'+
     '<div style="margin-top:5px;font-size:11.5px">Sẽ vô hiệu: '+daQua.map(x=>'<b>'+BUOC[t.chieu][x]+'</b>').join(' · ')+'</div></div>')+
   '<div style="font-weight:700;font-size:11px;color:var(--red);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Trường trọng yếu — đổi thì phải duyệt lại</div>'+
   ty.map(x=>fld(x[0],x[1],'ty_'+x[2],1)).join('')+
   '<div style="font-weight:700;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:13px 0 6px">Trường phụ — sửa tại chỗ, chỉ ghi audit</div>'+
   ph.map(x=>fld(x[0],x[1],'ph_'+x[2],0)).join(''),
   [['Hủy',0],['💾 Lưu thay đổi',()=>{
     const doi=[];const g={};
     document.querySelectorAll('#mb input').forEach(i=>{g[i.id]=i.value;
       if(i.value!==i.dataset.goc)doi.push([i.id.startsWith('ty_')?'ty':'ph',i.dataset.goc,i.value])});
     if(!doi.length){toast('Không có thay đổi nào');return}
     if(t.chieu==='di'){t.n=g.ty_fn;t.den.ten=g.ty_fden;t.ngay=g.ty_fngay;t.ph[0].sdt=g.ph_psdt;t.ly=g.ph_ply}
     else{t.n=g.ty_fn;t.ns=g.ty_fns;t.khoi=+g.ty_fkhoi||t.khoi;t.ph[0].sdt=g.ph_psdt;t.dcTT=g.ph_pdc;t.ly=g.ph_ply}
     const T2=doi.filter(x=>x[0]==='ty'), P2=doi.filter(x=>x[0]==='ph');
     if(P2.length)t.log.push(lg(R().n,'Sửa '+P2.length+' trường phụ',P2.map(x=>x[1]+' → '+x[2]).join(' · ')));
     if(T2.length&&t.tt!=='nhap'){
      const n=CH[t.chieu].slice(1,CH[t.chieu].indexOf(t.tt)).length;
      t.tt=CH[t.chieu][0];
      t.log.push(lg(R().n,'Sửa '+T2.length+' trường TRỌNG YẾU — vô hiệu '+n+' bước đã qua',T2.map(x=>x[1]+' → '+x[2]).join(' · ')));
      toast('Đã lưu · vô hiệu '+n+' bước · ticket quay về bước đầu')}
     else toast('Đã lưu · ghi audit');
     render()},'p']]);return}

 if(a==='huytk'){
  $('#mdl').classList.remove('sm');
  const O=t.chieu==='di'&&t.sau?[t.sau.xuat&&(t.sau.bg
      ?['Đã xuất và ĐÃ bàn giao bản cứng','⛔ Không thu hồi được — bản cứng đã ra khỏi trường','']
      :['Đã xuất học bạ điện tử','Thu hồi bản đã xuất · ghi audit','M1.3']),
     t.ky&&['Đã đẩy CSDL ngành','Phải hủy thao tác chuyển đi trên CSDL để trường đến không còn thấy em này','M10.8']].filter(Boolean):[];
  modal('⊘ Hủy ticket '+t.id,
   '<div class="ro"><b>Hủy khác Từ chối.</b> <i>Từ chối</i> là nhà trường <b>bác hồ sơ</b>. <i>Hủy</i> là hồ sơ <b>không còn hiệu lực</b> — gia đình rút, hoặc lập nhầm. Phải phân biệt vì báo cáo cuối năm đếm riêng.</div>'+
   (t.ky?'<div class="danger"><b>Quyết định '+t.ky.so+' đã ban hành.</b> Hủy ở đây <b>đồng thời thu hồi quyết định</b> — bản cũ đánh dấu <i>Đã thu hồi</i>, giữ trong audit và đồng bộ M4.11.</div>':'')+
   (O.length?'<div class="warn"><b>⚠ Cần hoàn nguyên '+O.length+' việc:</b><div style="margin-top:7px">'+
     O.map(x=>'<div style="margin-bottom:6px;padding:7px 9px;border-radius:7px;background:#fff;border:1px solid #fde68a"><b>'+x[0]+'</b>'+
      '<div style="margin-top:3px;font-size:11.5px">'+x[1]+(x[2]?' <span class="rolnk" data-go="'+x[2]+'">→ '+x[2]+'</span>':'')+'</div></div>').join('')+'</div>'+
     '<div style="font-size:11.5px"><b>Menu này KHÔNG tự hoàn nguyên</b> — chỉ liệt kê và mở đường sang menu chủ.</div></div>':'')+
   '<div style="margin-bottom:9px"><b>Nhóm lý do</b> <span style="color:var(--red)">*bắt buộc</span>'+
   '<select class="fldi" id="fnh"><option>Gia đình rút đơn</option><option>Lập nhầm / trùng ticket</option><option>Học sinh không còn nhu cầu</option><option>Khác</option></select></div>'+
   '<div><b>Diễn giải</b> <span style="color:var(--red)">*bắt buộc</span><textarea class="fldi" id="fly" rows="2"></textarea></div>'+
   '<div class="ro" style="margin:11px 0 0">Ticket <b>không bị xóa</b> — chuyển <i>Đã hủy</i>, giữ vĩnh viễn, tìm bằng chip <b>Đã đóng</b>.</div>',
   [['Không hủy',0],['⊘ Hủy ticket',()=>{
     const v=$('#fly')?$('#fly').value:'', nh=$('#fnh')?$('#fnh').value:'';
     if(!v.trim()){toast('Phải nêu diễn giải lý do hủy');return}
     if(t.ky){t.thuhoi=(t.thuhoi||[]);t.thuhoi.push([NGAY,t.ky.so,R().n,'Hủy ticket — '+nh]);
      t.log.push(lg(R().n,'Thu hồi quyết định '+t.ky.so,'Kèm theo hủy ticket · đồng bộ M4.11'));
      t.log.push(lg('Hệ thống','Hủy thao tác chuyển đi trên CSDL ngành',''));t.ky=null}
     t.tt='huy';t.huyLy='['+nh+'] '+v;
     t.log.push(lg(R().n,'Hủy ticket — '+nh,v));
     cur=null;toast('Đã hủy · ticket giữ trong bộ lọc Đã đóng');render()},'d']]);return}

 if(a==='thuhoi'){
  $('#mdl').classList.add('sm');
  modal('↩ Thu hồi quyết định '+(t.ky?t.ky.so:''),
   '<div class="danger"><b>Thu hồi một quyết định đã ban hành.</b> Ticket quay về <b>Chờ HT duyệt và ký</b>; bản '+(t.ky?t.ky.so:'')+' đánh dấu <i>Đã thu hồi</i>, <b>không xóa</b>, giữ trong audit và đồng bộ <b>M4.11</b>.'+
   '<div style="margin-top:5px;font-size:11.5px">Đây là <b>lối duy nhất</b> sửa một ticket đã ký — không sửa lén, mà ra một văn bản mới có người chịu trách nhiệm.</div></div>'+
   (t.tt==='ngoai'?'<div class="warn"><b>Đã đẩy lên CSDL ngành.</b> Thu hồi thì phải <b>hủy luôn thao tác chuyển đi trên CSDL</b>, nếu không '+t.den.ten+' vẫn thấy em này trong danh sách chờ và có thể bấm tiếp nhận.</div>':'')+
   '<div><b>Lý do thu hồi</b> <span style="color:var(--red)">*bắt buộc — in vào văn bản thu hồi</span><textarea class="fldi" id="fly" rows="3"></textarea></div>',
   [['Hủy',0],['↩ Thu hồi',()=>{const v=$('#fly')?$('#fly').value:'';
     if(!v.trim()){toast('Phải nêu lý do thu hồi');return}
     t.thuhoi=(t.thuhoi||[]);t.thuhoi.push([NGAY,t.ky.so,R().n,v]);
     t.log.push(lg(R().n,'Thu hồi quyết định '+t.ky.so,v+' · ticket quay về bước ký · đồng bộ M4.11'));
     if(t.tt==='ngoai')t.log.push(lg('Hệ thống','Hủy thao tác chuyển đi trên CSDL ngành',''));
     t.ky=null;t.gioithieu=null;t.tt='ht';t.db=null;
     toast('Đã thu hồi · ticket quay về bước ký');render()},'d']]);return}

 if(a==='xoanhap'){
  $('#mdl').classList.add('sm');
  modal('🗑 Xóa ticket nháp',
   '<div class="warn"><b>Chỉ ticket Nháp mới xóa được.</b> Ticket đã vào chuỗi duyệt thì <b>hủy, không xóa</b> — có người đã xử lý, lịch sử phải giữ. CSDL ngành cũng quy định không xóa hồ sơ và mã định danh học sinh.</div>',
   [['Hủy',0],['🗑 Xóa',()=>{T=T.filter(x=>x.id!==t.id);cur=null;toast('Đã xóa ticket nháp '+t.id);render()},'d']]);return}

 toast('Thao tác demo');
}
render();
</script>
</body>
</html>
