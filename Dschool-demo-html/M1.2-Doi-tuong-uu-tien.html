<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1.2 Đối tượng ưu tiên &amp; chính sách — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
mark{background:#fef08a;padding:0 1px;border-radius:2px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:250px}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:230px;max-height:260px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

/* dai canh bao */
.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.alert{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600}
.alert .sp{flex:1}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}

/* layout tang 2 */
.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage.open .listw{flex:1 1 0;max-width:none}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer}
.grow:hover{background:#eef2f7}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.miss{color:var(--amber);font-weight:700}
.miss.r{color:var(--red)}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:26px 1.9fr 1.5fr 1.35fr 1.1fr 1fr}
.stage.open .hrow{grid-template-columns:26px 1.9fr 1.35fr}
.stage.open .hcol{display:none}
.stage.open .hcol.keep{display:block}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:26px}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:26px 1.9fr 1.5fr 1.35fr 1.1fr 1fr}
.stage.open .hdrow{grid-template-columns:26px 1.9fr 1.35fr}
.stage.open .hdrow div{display:none}
.stage.open .hdrow div.kc{display:block}
.hrow input[type=checkbox],.hdrow input[type=checkbox]{width:15px;height:15px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}
.viewer{display:grid;grid-template-columns:1fr 210px;gap:13px}
@media(max-width:700px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:300px;display:grid;place-items:center;color:#94a3b8;position:relative;overflow:hidden}
.vsheet{background:#fff;width:78%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:14px 16px;font-size:9px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:10px;text-align:center;font-weight:800;margin-bottom:7px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.tag{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag.gh{background:#ede9fe;color:#5b21b6}.tag.moi{background:var(--bg);color:var(--ink2)}
.tag.dup{background:var(--red-soft);color:var(--red)}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.r::before{background:var(--red)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

/* panel */
.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ava3{width:50px;height:50px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 50px}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.ptabs{display:flex;gap:2px;padding:0 11px;border-bottom:1px solid var(--line);background:#fafbfc;overflow-x:auto}
.ptab{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand);background:#fff}
.pbody{padding:14px 15px;max-height:calc(100vh - 250px);overflow-y:auto}

/* the dien uu tien */
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.exp{border-color:#fecaca}
.card.rev{opacity:.72}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:150px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}

/* chuoi ky hieu luc */
.ky{display:flex;flex-direction:column;gap:5px}
.kyi{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 8px;border-radius:7px;background:var(--bg)}
.kyi.now{background:var(--green-soft);color:#065f46;font-weight:600}
.kyi.old{color:var(--ink3)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:6px}
.rolnk:hover{background:#e0e7ff}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:660px;max-width:94vw;max-height:86vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.bulkbar{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#0f172a;color:#fff;font-size:12.5px;border-bottom:1px solid var(--line)}
.bulkbar .sp{flex:1}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="VT">VT</button>
  <button class="rb" data-r="GVCN">GVCN</button>
  <button class="rb" data-r="KT">KT</button>
  <button class="rb" data-r="HT">HT</button>
  <span class="note">Hệ thống vận hành trường — phụ huynh dùng App riêng, không có mặt trong menu</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel"><option>Năm học 2026-2027</option></select>
  <select class="sel" id="hdt"><option>Toàn trường</option><option>Điểm trường A</option><option>Điểm trường B</option></select>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot">5</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">VT</div>
</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Đối tượng ưu tiên &amp; chính sách</h1><div class="spacer"></div>
      <button class="btn" data-x="them">+ Thêm diện cho học sinh</button>
      <button class="btn" data-x="xuat">⬇ Xuất</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const HOMNAY=new Date(2026,7,25);           /* 25/8/2026 */
const d2s=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
const days=d=>Math.round((d-HOMNAY)/86400000);

const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','7'],['M0.3','Thông báo'],['M0.4','Trang cá nhân']]],
 ['hs','👥 Học sinh',[['M1.1','Hồ sơ học sinh'],['M1.2','Đối tượng ưu tiên','5'],['M1.3','Học bạ điện tử'],
   ['M1.4','Tuyển sinh đầu cấp'],['M1.5','Chuyển trường'],['M1.6','Bảo lưu / Tái nhập'],
   ['M1.7','Lớp học & Chuyển lớp']]],
 ['lop','📚 Lớp học hàng ngày',[['M2.1','Lịch dạy & học'],['M2.2','Sổ đầu bài'],['M2.9','Không gian lớp học']]],
 ['vh','🏫 Vận hành',[['M6.1','Bán trú'],['M6.6','Y tế học đường']]],
 ['tc','💰 Tài chính',[['M7.1','Danh mục khoản thu'],['M7.2','Theo dõi thực hiện khoản thu'],['M7.3','Điều chỉnh & Hoàn tiền'],['M7.4','Chính sách miễn giảm']]],
 ['gt','💬 Giao tiếp',[['M8.2','Nhắn tin']]],
];

/* edit: 1 = day du | 'dexuat' = chi tao de xuat | 0 = chi doc
   giayto: 1 = thay tep | 0 = khong thay tep (KT) */
const ROLE={
 VT:  {n:'Văn thư',sc:'Điểm trường',menu:['hs','lop','gt'],edit:1,duyet:1,giayto:1,xuat:1,thuhoi:1},
 GVCN:{n:'GVCN lớp 9A2',sc:'Lớp 9A2',menu:['hs','lop','gt'],edit:'dexuat',duyet:0,giayto:1,xuat:1,thuhoi:0},
 KT:  {n:'Kế toán',sc:'Điểm trường',menu:['tc','gt'],edit:0,duyet:0,giayto:0,xuat:1,thuhoi:0},
 HT:  {n:'Hiệu trưởng',sc:'Toàn trường',menu:'all',edit:0,duyet:0,giayto:1,xuat:1,thuhoi:0},
};
let role='VT', tab='ds', ptab='dien', cur=null, openG={}, sel=new Set();
let fDIEN=new Set(), fKH=new Set(), fLOP=new Set(), fDT=new Set();
let fHL='Đang hiệu lực', fGOM='Theo diện';
const R=()=>ROLE[role];
const hdtVal=()=>$('#hdt').value;
const showDTfilter=()=>hdtVal()==='Toàn trường';

/* ===== danh muc dien uu tien — Master, cau hinh tai tab Cau hinh cua chinh Menu nay ===== */
const DM={

/* ===== trang thai dan xuat theo ngay ===== */
function pd(s){if(!s)return null;const [d,m,y]=s.split('/').map(Number);return new Date(y,m-1,d)}
function stt(r){
 if(r.tt==='cxn')   return ['cxn','Chờ xác nhận','w'];
 if(r.tt==='bosung')return ['bosung','Yêu cầu bổ sung','w'];
 if(r.tt==='tuchoi')return ['tuchoi','Từ chối','n'];
 if(r.tt==='thuhoi')return ['thuhoi','🚫 Đã thu hồi','n'];
 if(!r.hh)          return ['ok','✓ Đang hiệu lực','o'];
 const n=days(pd(r.hh));
 if(n<0) return ['het','⛔ Hết hiệu lực '+(-n)+' ngày trước','r'];
 if(n<=30)return ['sap','⏰ Còn '+n+' ngày','w'];
 return ['ok','✓ Đang hiệu lực','o'];
}
const hieuLuc=r=>r.hh?('đến '+r.hh):'Vĩnh viễn';
/* ban ghi DANG hieu luc cung HS + cung dien — dung de chan de xuat trung */
function trung(r){return REC.find(x=>x.id!==r.id&&x.hs===r.hs&&x.dien===r.dien&&['ok','sap'].includes(stt(x)[0]))}
/* cac dien dang hieu luc khac cua cung HS — VT can biet khi duyet */
function dienKhac(r){return REC.filter(x=>x.id!==r.id&&x.hs===r.hs&&x.dien!==r.dien&&['ok','sap'].includes(stt(x)[0]))}

/* ===== loc ===== */
function base(){
 let r=REC.slice();
 if(role==='GVCN')r=r.filter(x=>HS[x.hs].lop==='9A2');
 if(hdtVal()!=='Toàn trường')r=r.filter(x=>HS[x.hs].dt===hdtVal());
 return r}

function kd(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function rows(){
 /* ban ghi da tu choi chi hien khi loc dung vao no — khong tron vao danh sach thuong */
 let r=base().filter(x=>!['cxn','bosung'].includes(x.tt))
   .filter(x=>x.tt!=='tuchoi'||['Đã từ chối','Tất cả'].includes(fHL));
 const q=kd($('#q')?.value);
 if(q)r=r.filter(x=>kd(HS[x.hs].n).includes(q)||HS[x.hs].ma.toLowerCase().includes(q)||kd(x.sv).includes(q));
 if(fDT.size) r=r.filter(x=>fDT.has(HS[x.hs].dt));
 if(fKH.size) r=r.filter(x=>fKH.has(HS[x.hs].kh));
 if(fLOP.size)r=r.filter(x=>fLOP.has(HS[x.hs].lop));
 if(fDIEN.size)r=r.filter(x=>fDIEN.has(x.dien));
 /* 'Sap het han' la trang thai CON cua 'Dang hieu luc', khong phai anh em */
 const m={'Đang hiệu lực':['ok','sap'],'Sắp hết hạn':['sap'],'Hết hiệu lực':['het'],
          'Đã thu hồi':['thuhoi'],'Đã từ chối':['tuchoi']};
 if(fHL!=='Tất cả')r=r.filter(x=>m[fHL].includes(stt(x)[0]));
 return r}
const queue=()=>base().filter(x=>['cxn','bosung'].includes(x.tt));

function recRow(r,sub){
 const h=HS[r.hs], [c,lb,cl]=stt(r);
 const q=$('#q')?.value.trim();
 const hl=t=>q?t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):t;
 const canSel=R().duyet&&['sap','het'].includes(c);
 return `<div class="hrow ${sub?'sub':''} ${cur===r.hs?'on':''}" data-hs="${r.hs}" data-id="${r.id}">
  <div>${canSel?`<input type="checkbox" data-sel="${r.id}" ${sel.has(r.id)?'checked':''}>`:''}</div>
  <div class="who2"><div class="ava2">${h.i}</div><div class="i"><b>${hl(h.n)}</b>
   <span>${h.dt} · ${h.lop}</span></div></div>
  <div class="hcol">${r.dien}${r.thuoc?`<br><span style="font-size:11px;color:var(--ink3)">${r.thuoc}</span>`:''}</div>
  <div class="hcol keep">${hieuLuc(r)}<br><span class="st2 ${cl}">${lb}</span></div>
  <div class="hcol">${R().giayto
    ? (r.tep? (r.doichieu?'<span class="st2 o">✓ Đã đối chiếu</span>':'<span class="st2 w">Chờ đối chiếu</span>')
            : '<span class="st2 r">Chưa có</span>')
    : '<span style="color:var(--ink3);font-size:11.5px">— ẩn —</span>'}</div>
  <div class="hcol" style="font-size:11.5px;color:var(--ink2)">${r.nguon}</div></div>`}

function listTab(){
 const r=rows(), q=($('#q')?.value||'').trim();
 const flat = fGOM==='Không gom' || !!q || !r.length;
 let body='';
 if(!r.length)body=`<div class="empty">Không có bản ghi phù hợp bộ lọc</div>`;
 else if(flat)body=r.map(x=>recRow(x)).join('');
 else{
  const key = fGOM==='Theo diện' ? (x=>x.dien) : (x=>HS[x.hs].dt+' · Lớp '+HS[x.hs].lop);
  const ks=[...new Set(r.map(key))].sort();
  body=ks.map(k=>{const rk=r.filter(x=>key(x)===k), gk='g-'+k, op=openG[gk]!==false;
   const ns=rk.filter(x=>stt(x)[0]==='sap').length, nh=rk.filter(x=>stt(x)[0]==='het').length;
   return `<div class="grow" data-g="${gk}"><span class="ar">${op?'▼':'▶'}</span>${k}
     <span class="ct"><span>${rk.length} bản ghi</span>
      ${ns?`<span class="miss">${ns} sắp hết hạn</span>`:''}
      ${nh?`<span class="miss r">${nh} hết hiệu lực</span>`:''}</span></div>
    ${op?rk.map(x=>recRow(x,1)).join(''):''}`}).join('');
 }
 const nsel=sel.size;
 return `${filters()}${alerts()}
  <div class="stage ${cur?'open':''}">
   <div class="listw">
    ${nsel?`<div class="bulkbar">Đã chọn <b>${nsel}</b> bản ghi<span class="sp"></span>
      <button class="btn xs" data-x="bulk-nhac">🔔 Nhắc gia hạn</button>
      <button class="btn xs" data-x="bulk-xn">✓ Xác nhận hàng loạt</button>
      <button class="btn xs" data-x="bulk-clear">Bỏ chọn</button></div>`:''}
    <div class="hdrow"><div></div><div class="kc">Học sinh</div><div>Diện ưu tiên</div>
     <div class="kc">Hiệu lực</div><div>Giấy tờ</div><div>Nguồn</div></div>
    ${body}
    <div class="lgd">Một dòng = <b>Học sinh × Diện</b>. Mở chi tiết thì panel gom <b>toàn bộ các diện</b> của em đó.</div>
   </div>
   <div class="panel">${cur?panel(cur):''}</div>
  </div>`}

/* ===== TAB 2 — hang doi ===== */
function queueTab(){
 const r=queue();
 if(!r.length)return `<div class="listw" style="margin-top:11px"><div class="empty">Không có đề xuất nào đang chờ</div></div>`;
 return `<div class="ro" style="margin-top:11px">Đề xuất do <b>phụ huynh gửi từ App</b> hoặc <b>giáo viên chủ nhiệm nhập thay</b>.
   Văn thư <b>mở tệp ra xem</b> rồi mới xác nhận — không xác nhận được khi chưa có tệp.<br>
   Cột <b>Đang có</b> cho biết em đó đã thuộc diện nào — cần thiết vì M7.4 sẽ phải chọn giữa các diện, và vì
   đề xuất trùng diện đang có <b>phải xử lý bằng Gia hạn</b>, không tạo bản ghi thứ hai.</div>
  <div class="listw"><table>
   <tr><th>Học sinh</th><th>Diện đề xuất</th><th>Đang có</th><th>Người đề xuất</th><th>Chờ</th><th>Giấy tờ</th><th></th></tr>
   ${r.map(x=>{const h=HS[x.hs], n=-days(pd(x.ngayGui)), lau=n>3;
    const gh=x.giahan?rec(x.giahan):null, dup=!gh&&trung(x), khac=dienKhac(x);
    const chan = !x.tep || !!dup;
    return `<tr><td><b>${h.n}</b><br><span style="color:var(--ink3);font-size:11px">${h.dt} · ${h.lop}</span></td>
    <td>${x.dien}${x.thuoc?`<br><span style="color:var(--ink3);font-size:11px">${x.thuoc}</span>`:''}
     <br>${gh?`<span class="tag gh">⟳ Gia hạn</span> <span style="font-size:11px;color:var(--ink3)">nối vào kỳ đang có (hết ${gh.hh})</span>`
        :dup?`<span class="tag dup">⚠ Trùng diện đang có</span>`:`<span class="tag moi">Diện mới</span>`}
     ${x.tt==='bosung'?`<br><span class="st2 w">Đã yêu cầu nộp lại</span>`:''}</td>
    <td style="font-size:11.5px">${khac.length?khac.map(k=>k.dien).join('<br>'):'<span style="color:var(--ink3)">—</span>'}</td>
    <td>${x.nguoiGui}<br><span style="color:var(--ink3);font-size:11px">${x.nguon} · ${x.ngayGui}</span></td>
    <td>${n} ngày${lau?'<br><span class="st2 r">Chờ quá lâu</span>':''}</td>
    <td>${x.tep?`<span class="st2 w">Có tệp, chưa đối chiếu</span>
       <br><button class="btn xs" data-x="xem" data-id="${x.id}" style="margin-top:4px">👁 Xem tệp</button>`
      :'<span class="st2 r">Chưa có tệp</span>'}
     ${x.lyDoBS?`<br><span style="color:var(--amber);font-size:11px">↩ ${x.lyDoBS}</span>`:''}</td>
    <td style="text-align:right;white-space:nowrap">
     ${R().duyet?`<button class="btn xs p" data-x="xn" data-id="${x.id}" ${chan?'disabled title="'+(dup?'Trùng diện đang có — phải xử lý bằng Gia hạn':'Chưa có tệp giấy tờ')+'"':''}>✓ Xác nhận</button>
      <button class="btn xs" data-x="nopLai" data-id="${x.id}">↩ Yêu cầu nộp lại</button>
      <button class="btn xs" data-x="tuchoi" data-id="${x.id}">✕ Từ chối</button>
      ${dup?`<br><button class="btn xs" data-x="chuyenGH" data-id="${x.id}" style="margin-top:4px">⟳ Chuyển thành Gia hạn</button>`:''}`
     :'<span style="color:var(--ink3);font-size:11.5px">Chỉ Văn thư xác nhận</span>'}</td></tr>`}).join('')}
  </table></div>`}

/* ===== TANG 2 — panel theo HOC SINH ===== */
function panel(hsId){
 const h=HS[hsId], rs=REC.filter(x=>x.hs===hsId);
 const okn=rs.filter(x=>stt(x)[0]==='ok'||stt(x)[0]==='sap').length;
 const gan=rs.filter(x=>x.hh&&['ok','sap'].includes(stt(x)[0])).sort((a,b)=>pd(a.hh)-pd(b.hh))[0];
 const T=[['dien','Các diện ('+rs.length+')'],['giayto','Giấy tờ'],['cs','Chính sách đang hưởng'],['log','Lịch sử']]
  .filter(t=>!(t[0]==='giayto'&&!R().giayto));
 if(!T.some(t=>t[0]===ptab))ptab=T[0][0];
 return `<div class="ph"><div class="ava3">${h.i}</div>
   <div class="n"><h2>${h.n}</h2><div class="m">
    <span class="pill">${h.ma}</span><span class="pill">${h.dt} · ${h.lop}</span>
    <span class="st2 o">${okn} diện đang hiệu lực</span>
    ${gan?`<span class="st2 ${days(pd(gan.hh))<=30?'w':'n'}">Hạn gần nhất: ${gan.hh}</span>`:''}</div></div>
   <div class="spacer" style="flex:1"></div><button class="btn sm" id="pclose">✕ Đóng</button></div>
  <div class="ptabs">${T.map(t=>`<button class="ptab ${ptab===t[0]?'on':''}" data-ptab="${t[0]}">${t[1]}</button>`).join('')}</div>
  <div class="pbody">${ptab==='dien'?tabDien(rs):ptab==='giayto'?tabGiayTo(rs):ptab==='log'?tabLog(rs):tabCS(rs)}</div>`}

/* Lich su thao tac — ban ghi dien la can cu chi ngan sach, phai truy duoc vet */
function tabLog(rs){
 const all=[]; rs.forEach(r=>(r.log||[]).forEach(l=>all.push([r,l])));
 all.sort((a,b)=>pd(b[1][0])-pd(a[1][0]));
 if(!all.length)return '<div class="empty">Chưa có thao tác nào được ghi nhận</div>';
 return `<div class="ro">Bản ghi diện là <b>căn cứ chi ngân sách</b> — mọi thao tác tạo, xác nhận, gia hạn,
   sửa hạn và thu hồi đều phải truy được vết, kể cả khi người thực hiện đã nghỉ việc.</div>
  <div class="logl">${all.map(([r,l])=>{
   const cl=/Thu hồi|Từ chối/.test(l[2])?'r':/Gia hạn|nộp lại|Sửa/.test(l[2])?'w':'';
   return `<div class="logi ${cl}"><b>${l[2]} — ${r.dien}</b>
    <div class="mm">${l[0]} · ${l[1]}</div>
    <div style="color:var(--ink2);margin-top:2px">${l[3]}</div></div>`}).join('')}</div>`}

function tabDien(rs){
 return rs.map(r=>{const [c,lb,cl]=stt(r), dm=DM[r.dien];
  return `<div class="card ${c==='het'?'exp':''} ${c==='thuhoi'?'rev':''}">
   <div class="ch">${r.dien}${r.thuoc?` <span class="pill">${r.thuoc}</span>`:''}
    <span class="sp"></span><span class="st2 ${cl}">${lb}</span></div>
   <div class="cb">
    <div class="f"><div class="k">Kiểu hiệu lực</div><div class="v">${dm.vv===1?'Vĩnh viễn':dm.vv===2?'Tùy giấy xác nhận':'Có hạn — phải gia hạn'}</div></div>
    <div class="f"><div class="k">Ngày công nhận</div><div class="v">${r.cap||'<span style="color:var(--ink3);font-weight:400">— chưa có —</span>'}</div></div>
    <div class="f"><div class="k">Đơn vị cấp</div><div class="v">${r.dv||'<span style="color:var(--ink3);font-weight:400">— chưa có —</span>'}</div></div>
    <div class="f"><div class="k">Số văn bản</div><div class="v">${r.sv||'<span style="color:var(--ink3);font-weight:400">— chưa có —</span>'}</div></div>
    ${r.ky.length?`<div class="f"><div class="k">Các kỳ hiệu lực</div><div class="v"><div class="ky">
      ${r.ky.map((k,i)=>{const last=i===r.ky.length-1;
       return `<div class="kyi ${last&&c!=='het'&&c!=='thuhoi'?'now':'old'}">
        ${k[0]} → ${k[1]||'không thời hạn'} ${last&&r.ky.length>1?'<b style="margin-left:auto">kỳ hiện tại</b>':''}</div>`}).join('')}
     </div>${r.ky.length>1?'<div style="font-size:11.5px;color:var(--ink3);margin-top:5px">Gia hạn <b>nối tiếp vào bản ghi cũ</b>, không tạo bản ghi mới — nhờ vậy tra được chuỗi liên tục.</div>':''}</div></div>`:''}
    <div class="f"><div class="k">Nguồn</div><div class="v" style="font-weight:500">${r.nguon}
     ${r.nguoiXN?`<br><span style="color:var(--ink3);font-size:11.5px">Xác nhận bởi ${r.nguoiXN} · ${r.ngayXN}</span>`:''}</div></div>
    ${r.tt==='thuhoi'?`<div class="f"><div class="k">Lý do thu hồi</div><div class="v" style="font-weight:500;color:var(--red)">
      ${r.lyDoThuHoi}<br><span style="color:var(--ink3);font-size:11.5px">Mốc thu hồi ${r.mocThuHoi} · ${r.nguoiThuHoi} · ${r.ngayThuHoi}</span></div></div>`:''}
   </div>
   ${c==='het'?`<div class="danger" style="margin:0;border-radius:0;border-left:0;border-right:0;border-bottom:0">
     Hết hiệu lực <b>tự chuyển theo ngày</b>, không ai đặt tay. M1.2 <b>không dừng miễn giảm và không tính truy thu</b> —
     chỉ bắn trigger, phần tiền do <b>M7.4</b> xử lý.</div>`:''}
   ${r.khoa?`<div class="cact"><span style="font-size:11.5px;color:var(--ink2)">
      🔗 Diện này <b>hệ thống tự sinh</b> từ trường <b>Dân tộc</b> ở hồ sơ học sinh — không sửa tại đây.
      Sửa dân tộc thì diện tự cập nhật theo.</span>
      <span style="flex:1"></span><span class="rolnk" data-go="${r.khoa}">→ ${r.khoa}</span></div>`
    :['cxn','bosung'].includes(r.tt)?`<div class="cact">
      <span style="font-size:11.5px;color:var(--ink2)">Đề xuất đang chờ xử lý${r.giahan?' — <b>gia hạn</b> cho kỳ hiện tại':''}.</span>
      <span style="flex:1"></span>
      ${R().duyet?`<button class="btn xs p" data-x="toQueue">→ Xử lý ở tab Đề xuất</button>`:''}
      ${r.tep?`<button class="btn xs" data-x="xem" data-id="${r.id}">👁 Xem tệp</button>`:''}</div>`
    :R().edit===1?`<div class="cact">
     <button class="btn xs" data-x="sua" data-id="${r.id}">✎ Sửa thông tin</button>
     ${dm.vv!==1&&r.tt==='ok'?`<button class="btn xs p" data-x="giahan" data-id="${r.id}">⟳ Gia hạn</button>`:''}
     ${r.tt==='ok'?`<button class="btn xs" data-x="thuhoi" data-id="${r.id}">🚫 Thu hồi</button>`:''}
     <span style="flex:1"></span>
     <span style="font-size:11px;color:var(--ink3);align-self:center">Không có nút Xóa — bản ghi là căn cứ chi ngân sách</span>
    </div>`:''}
  </div>`}).join('')}

function tabGiayTo(rs){
 return `<div class="ro">Tệp gắn với <b>từng bản ghi diện</b>, không gắn với hồ sơ học sinh — một em hai diện thì hai bộ giấy riêng, hết hạn riêng.
   Cơ chế tải lên, nhập hộ và đối chiếu <b>giống hệt M1.1 Kho giấy tờ</b>.</div>
  <table><tr><th>Diện</th><th>Loại giấy tờ</th><th>Trạng thái</th><th>Nguồn nộp</th><th></th></tr>
  ${rs.map(r=>`<tr><td><b>${r.dien}</b></td><td>${DM[r.dien].gt}</td>
   <td>${r.tep?(r.doichieu?'<span class="st2 o">✓ Đã đối chiếu</span>':'<span class="st2 w">Chờ đối chiếu</span>')
              :'<span class="st2 r">Chưa có</span>'}</td>
   <td style="font-size:11.5px">${r.tep?(r.nguon==='PH đề xuất'?'PH tải qua App':'<b>VT nhập hộ</b><br><span style="color:var(--ink3)">Nộp trực tiếp · đã đối chiếu</span>'):'—'}</td>
   <td style="text-align:right;white-space:nowrap">${r.tep
     ?`<button class="btn xs p" data-x="xem" data-id="${r.id}">👁 Xem</button>
       <button class="btn xs" data-x="tai">⬇ Tải</button>${R().edit===1?`<button class="btn xs" data-x="thaythe">⟳ Thay thế</button><button class="btn xs" data-x="lichsu">🕐</button>`:''}`
     :(R().edit===1?'<button class="btn xs p" data-x="nhapho">⬆ Tải lên thay PH</button>':
       '')}</td></tr>`).join('')}
  </table>`}

function tabCS(rs){
 const all=[]; rs.forEach(r=>(r.ms||[]).forEach(m=>all.push([r,m])));
 const active=all.filter(([r])=>['ok','sap'].includes(stt(r)[0]));
 const dead=all.filter(([r])=>!['ok','sap'].includes(stt(r)[0]));
 return `<div class="ro"><b>Toàn bộ khối này chỉ đọc</b> — dữ liệu thuộc sở hữu của <b>M7.4 Chính sách miễn giảm</b>.
   M1.2 <b>không chọn mức có lợi nhất</b>, chỉ ghi nhận đủ các diện; việc chọn mức là logic của M7.4.</div>
  ${active.length?`<table><tr><th>Loại miễn giảm</th><th>Khoản thu</th><th>Mức</th><th>Nguồn chi trả</th><th>Căn cứ</th></tr>
   ${active.map(([r,m])=>`<tr><td><b>${m[0]}</b></td><td>${m[1]}</td><td><b>${m[2]}</b></td><td>${m[3]}</td>
    <td>${r.dien}<span class="rolnk" data-go="M7.4">→ M7.4</span></td></tr>`).join('')}</table>`
  :'<div class="empty" style="padding:22px">Chưa có chính sách miễn giảm nào đang áp dụng</div>'}
  ${dead.length?`<div class="warn" style="margin-top:12px"><b>Đã dừng vì diện hết hiệu lực hoặc bị thu hồi:</b><br>
    ${dead.map(([r,m])=>`${m[0]} — căn cứ <b>${r.dien}</b> (${stt(r)[1]})`).join('<br>')}</div>`:''}
  ${rs.filter(r=>['ok','sap'].includes(stt(r)[0])).length>1?`<div class="info" style="margin-top:12px">
    Học sinh này thuộc <b>nhiều diện</b>. Khối này hiện rõ <b>M7.4 đã chọn mức nào</b> để văn thư trả lời được câu hỏi
    của phụ huynh <i>"sao con tôi thuộc hai diện mà chỉ được giảm một"</i>.</div>`:''}`}

    <div class="vmeta">

     <div class="r"><b>Diện</b>${r.dien}</div>

/* ===== render ===== */
function render(){
 $('#ava').textContent=role;
 sidebar();
 $('#tabs').innerHTML=`<button class="tab1 ${tab==='ds'?'on':''}" data-t1="ds">Học sinh thuộc diện <span class="b">${rows().length}</span></button>
  ${R().duyet||R().edit==='dexuat'?`<button class="tab1 ${tab==='q'?'on':''}" data-t1="q">Đề xuất chờ xác nhận <span class="b">${queue().length}</span></button>`:''}`;
 $('#content').innerHTML = tab==='ds'?listTab():queueTab();
}

/* ===== modal + toast ===== */
function modal(t,body,btns){$('#mh').innerHTML=t;$('#mb').innerHTML=body;
 $('#mf').innerHTML='';btns.forEach(([lb,fn,cls])=>{const b=document.createElement('button');
  b.className='btn '+(cls||(fn?'p':''));b.textContent=lb;
  b.onclick=()=>{$('#mask').classList.remove('on');if(fn)fn()};$('#mf').appendChild(b)});
 $('#mask').classList.add('on')}
let tt2;function toast(m){$('#toast').innerHTML=m;$('#toast').classList.add('on');
 clearTimeout(tt2);tt2=setTimeout(()=>$('#toast').classList.remove('on'),3400)}
const rec=id=>REC.find(x=>x.id===+id);

/* ===== su kien ===== */
document.body.addEventListener('click',e=>{
 const rb=e.target.closest('[data-r]');
 if(rb){role=rb.dataset.r;cur=null;sel.clear();tab='ds';fHL='Đang hiệu lực';
  document.querySelectorAll('.rb').forEach(x=>x.classList.remove('on'));rb.classList.add('on');render();return}
 const t1=e.target.closest('[data-t1]');if(t1){tab=t1.dataset.t1;cur=null;render();return}
 const ms=e.target.closest('[data-ms]');
 if(ms){const p=$('#msp-'+ms.dataset.ms);const o=p.classList.contains('on');
  document.querySelectorAll('.msp').forEach(x=>x.classList.remove('on'));if(!o)p.classList.add('on');return}
 if(!e.target.closest('.msp'))document.querySelectorAll('.msp').forEach(x=>x.classList.remove('on'));

 const g=e.target.closest('[data-g]');if(g){const k=g.dataset.g;openG[k]=openG[k]===false;render();return}
 if(e.target.closest('[data-sel]')){const id=+e.target.closest('[data-sel]').dataset.sel;
  sel.has(id)?sel.delete(id):sel.add(id);render();return}
 if(e.target.closest('#pclose')){cur=null;render();return}
 const pt=e.target.closest('[data-ptab]');if(pt){ptab=pt.dataset.ptab;render();return}
 const go=e.target.closest('[data-go]');if(go){toast(`Deep-link → ${go.dataset.go} · mở sẵn với học sinh này · return=M1.2`);return}

 const x=e.target.closest('[data-x]');

      <label style="display:flex;gap:9px;align-items:center;font-size:12.5px;cursor:pointer">
       <input type="checkbox" checked style="width:16px;height:16px"><span><b>Đã đối chiếu bản gốc</b> —
        tích thì vào thẳng <b>Đang hiệu lực</b>, bỏ tích thì vào hàng đợi chờ xác nhận</span></label></div>`
     :`<div class="warn" style="margin-bottom:0">Vai trò <b>${R().n}</b> tạo bản ghi ở trạng thái
        <b>Chờ xác nhận</b> — Văn thư đối chiếu bản gốc rồi mới xác nhận.</div>`}`,
   [['Hủy',0],[R().duyet?'Tạo và xác nhận':'Gửi đề xuất',()=>toast(R().duyet
     ?'Đã tạo bản ghi ở trạng thái Đang hiệu lực · trigger M7.4'
     :'Đã gửi đề xuất tới Văn thư · đang chờ xác nhận')]]);return}

 if(a==='nhapho'){
  modal('⬆ Tải lên thay phụ huynh',
   `<div class="info">Cơ chế <b>giống hệt M1.1 Kho giấy tờ</b> — ghi rõ nguồn nộp, hình thức nhận, và ô tích đã đối chiếu bản gốc.</div>
    <div style="margin-bottom:11px"><b>Tệp scan</b> <span style="color:var(--red)">*</span>
     <div style="border:1.5px dashed var(--line2);border-radius:9px;padding:16px;text-align:center;color:var(--ink3);font-size:12.5px;margin-top:5px">📎 Kéo thả tệp</div></div>
    ${1?`<div style="margin-bottom:11px"><b>Hình thức nhận</b>
      <select class="fldi"><option>Phụ huynh nộp trực tiếp tại trường</option><option>Qua giáo viên chủ nhiệm</option>
       <option>Qua bưu điện</option><option>Qua email</option></select></div>
     <div style="background:var(--amber-soft);border:1px solid #fde68a;border-radius:9px;padding:11px 13px">
      <label style="display:flex;gap:9px;align-items:center;font-size:12.5px;cursor:pointer">
       <input type="checkbox" checked style="width:16px;height:16px"><b>Đã đối chiếu bản gốc</b></label></div>`:''}`,
   [['Hủy',0],['Tải lên',()=>toast('Đã tải lên · ghi nguồn nộp và audit')]]);return}

 if(a==='thaythe'){modal('⟳ Thay thế tệp',
   `<div class="ro">Bản cũ <b>giữ trong lịch sử phiên bản</b>, bắt buộc ghi lý do thay.
     Trạng thái xác nhận <b>reset về chờ</b> nếu người thay không tích đã đối chiếu bản gốc.</div>
    <div style="border:1.5px dashed var(--line2);border-radius:9px;padding:16px;text-align:center;color:var(--ink3);font-size:12.5px">📎 Kéo thả tệp mới</div>`,
   [['Hủy',0],['Thay thế',()=>toast('Đã thay thế · bản cũ lưu lịch sử')]]);return}

 if(a==='lichsu'){modal('🕐 Lịch sử phiên bản',
   `<table><tr><th>Phiên bản</th><th>Người nộp</th><th>Nguồn</th><th></th></tr>
     <tr><td><b>v2</b> · 08/01/2026<br><span class="st2 o">Đang dùng</span></td><td>Lê Thu Hằng<br><span style="color:var(--ink3);font-size:11px">Văn thư</span></td><td>VT nhập hộ · nộp trực tiếp</td><td><button class="btn xs">Tải</button></td></tr>
     <tr><td>v1 · 06/01/2025</td><td>Trần Quốc Việt<br><span style="color:var(--ink3);font-size:11px">Cha</span></td><td>PH tải qua App</td><td><button class="btn xs">Tải</button></td></tr>
    </table>`,[['Đóng',0]]);return}

 if(a==='sua'){modal('✎ Sửa thông tin diện',
   `<div class="warn">Sửa <b>ngày hết hiệu lực</b> ghi audit riêng, tách khỏi audit sửa thông tin thường —
     vì trường này ảnh hưởng trực tiếp tới tiền miễn giảm.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
     <div><b>Ngày công nhận</b><input class="fldi" value="${r.cap}"></div>
     <div><b>Hiệu lực đến</b><input class="fldi" value="${r.hh||''}" placeholder="Trống = vĩnh viễn"></div>
     <div><b>Đơn vị cấp</b><input class="fldi" value="${r.dv}"></div>
     <div><b>Số văn bản</b><input class="fldi" value="${r.sv}"></div></div>`,
   [['Hủy',0],['Lưu',()=>{(r.log=r.log||[]).push(['25/8/2026','Lê Thu Hằng (VT)','✎ Sửa thông tin','Sửa ngày hết hiệu lực — audit riêng vì ảnh hưởng tới tiền']);
     toast('Đã lưu · ghi audit riêng cho ngày hết hiệu lực');render()}]]);return}

 if(a==='xuat'){modal('⬇ Xuất dữ liệu',
   `<div class="ro">Mọi lượt xuất <b>ghi audit</b> — dữ liệu hoàn cảnh gia đình thuộc nhóm nhạy cảm theo NĐ 13/2023.</div>
    <table><tr><th>Bản xuất</th><th>Dùng khi nào</th><th></th></tr>
     <tr><td><b>Danh sách theo bộ lọc</b></td><td>Đúng những gì đang thấy trên màn</td><td><button class="btn xs">Excel</button></td></tr>
     <tr><td><b>Theo diện — đối chiếu ngân sách</b></td><td>Nhóm theo diện, có tổng số HS — báo cáo lên Phòng/Sở</td><td><button class="btn xs">Excel</button></td></tr>
     <tr><td><b>Danh sách sắp hết hạn</b></td><td>In giao cho GVCN nhắc trực tiếp</td><td><button class="btn xs">PDF</button></td></tr>
    </table>`,[['Đóng',0]]);return}

 if(a==='tai'){toast('Đã tải tệp · ghi audit ai tải giấy tờ nào');return}
 toast('Thao tác demo');
}
render();
</script>
</body>
</html>
