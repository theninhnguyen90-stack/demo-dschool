<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.main{flex:1;padding:12px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-bottom:2px}
h1{font-size:17px;font-weight:700}
.nowrite{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:999px;padding:2px 11px;font-size:11.5px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 9px;font-size:11.5px}
.btn.lk{opacity:.6;cursor:help;background:#f8fafc;border-color:var(--line);color:var(--ink3)}

.scope{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--red);
 border-radius:9px;padding:7px 12px;font-size:12px;color:var(--ink2);margin:8px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:#fff;min-width:250px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}

.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grow{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}
.hdrow,.hrow{display:grid;gap:11px;padding:8px 13px;align-items:center;
 grid-template-columns:2.3fr .95fr 1.5fr 1.05fr 105px}
.hdrow{background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);font-size:13px}
.hrow:hover{background:#fafbfc}
.hrow .kh b{font-weight:600;display:block}
.hrow .kh span{font-size:11px;color:var(--ink3)}
.mc{font-weight:700;color:var(--brand);font-size:11px;background:var(--brand-soft);border:1px solid #bfdbfe;border-radius:5px;padding:1px 6px;white-space:nowrap}
.mc.off{color:var(--ink3);background:var(--bg);border-color:var(--line)}
.gt{font-size:12.5px;font-weight:600;color:var(--ink)}
.gt.mac{color:var(--ink3);font-weight:400;font-style:italic}
.cn{font-size:11.5px;color:var(--ink2)}
.cn .m{color:var(--ink3);font-size:10.5px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line)}
.rolnk.rd{color:#991b1b;background:var(--red-soft);border-color:#fecaca}
.rolnk.am{color:#92400e;background:var(--amber-soft);border-color:#fde68a}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.sech{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.blk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12.5px}
.blk .ic{flex:0 0 16px;color:var(--ink3)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.din{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:10px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:7px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.noacc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px;text-align:center}
.noacc h3{font-size:17px;margin-bottom:9px}
.noacc p{color:var(--ink2);font-size:13px;max-width:560px;margin:0 auto 9px}
</style>
</head>

 ['tc','Template báo cáo tài chính · lương · KPI','Mẫu xuất báo cáo','M7.6','9 mẫu','',''],
 ['ll','Chế độ gửi thông báo · kênh SMS','Kênh nào bật, nhóm nào được gửi SMS (có phí)','M8.1','App bật · SMS chỉ nhóm khẩn','21/08/2026','Nguyễn Thị Hạnh (Hiệu trưởng)'],
 ['ll','Cửa sổ cảnh báo dội thông báo','Bao nhiêu lượt trong bao lâu thì coi là dội','M8.1','3 lượt / 3 giờ','',''],
 ['ll','Quy tắc chat','Từ khóa chặn, giờ được nhắn, mức xử lý','M8.3','36 từ khóa · 06:00–21:00','',''],
 ['qt','Chứng thư số tổ chức + cấu hình CA','Chứng thư của trường và nhà cung cấp dịch vụ ký số','M10.2','VNPT-CA · hết hạn 14/03/2027','02/08/2026','Hồ Thị Cẩm (IT_Admin)'],
 ['qt','Chính sách bảo mật','Độ dài mật khẩu, hết phiên, ngưỡng khóa','M10.5','8 ký tự · 60 phút · khóa sau 5 lần','29/08/2026','Hồ Thị Cẩm (IT_Admin)'],
 ['qt','Mapping mã CSDL ngành','1 trường ↔ 1 mã, hay mỗi điểm trường một mã','M10.8','Chế độ chuẩn — 1 mã trường','',''],
];
const KH=K.map(function(a,i){return {id:i,ng:a[0],ten:a[1],mo:a[2],menu:a[3],gt:a[4],ngay:a[5],boi:a[6]}});

/* ===== AI CẤU HÌNH ĐƯỢC MENU NÀO — chiếu từ M10.4 ===== */
const SUA={
 FULL:'*', HT:'*',
 IT  :['M10.2','M10.5','M10.8','M4.1'],
 PHT_CM:['M2.2','M2.5','M2.7','M2.9','M3.1','M5.2','M5.3','M5.5','M4.4','M4.6','M1.7','M6.2'],
 TCNS:['M4.1','M4.2','M4.8','M4.9'],
 KT  :['M7.1','M7.5','M7.6','M1.2','M6.2'],
 TTCM:['M5.2'],
 GVBM:[]};
const ROLE={FULL:{ten:'Đủ quyền (demo)',xem:1},HT:{ten:'Hiệu trưởng',xem:1},IT:{ten:'Quản trị hệ thống',xem:1},
 PHT_CM:{ten:'Phó HT Chuyên môn',xem:1},TCNS:{ten:'Tổ chức nhân sự',xem:1},KT:{ten:'Kế toán',xem:1},
 TTCM:{ten:'Tổ trưởng chuyên môn',xem:1},GVBM:{ten:'Giáo viên bộ môn',xem:0}};
let role='FULL', q='', fNg='', fSua=0, fMac=0;
const R=()=>ROLE[role];
const suaDuoc=m=>{const s=SUA[role];return s==='*'||s.indexOf(m)>=0};
const aiSua=m=>{const r=[];Object.keys(SUA).forEach(function(k){if(k==='FULL')return;
 const s=SUA[k];if(s==='*'||s.indexOf(m)>=0)r.push(ROLE[k].ten)});return r};

const chuaSua=()=>KH.filter(k=>!k.ngay);
const moiSua=()=>KH.filter(k=>k.ngay&&['29/08/2026','25/08/2026','22/08/2026'].indexOf(k.ngay)>=0);

function sidebar(){
 $('#side').innerHTML=NAV.map(function(g){return '<div class="sgrp">'+g[0]+'</div>'+
  g[1].map(function(m){return '<div class="snav'+(m[0]==='M10.6'?' on':'')+'">'+
   '<span>'+(m[0]==='M10.6'?'🗂':'▫')+'</span><span>'+m[1]+'</span></div>'}).join('')}).join('')}

function loc(){
 let a=KH.slice();
 if(fNg)a=a.filter(k=>k.ng===fNg);
 if(fSua)a=a.filter(k=>suaDuoc(k.menu));
 if(fMac)a=a.filter(k=>!k.ngay);
 if(q){const s=kd(q);a=a.filter(k=>kd(k.ten+' '+k.mo+' '+k.menu+' '+MTEN[k.menu]+' '+k.gt).indexOf(s)>=0)}
 return a}

function chips(){
 const h=[],cs=chuaSua(),ms=moiSua();
 if(cs.length)h.push('<button class="rolnk am" data-x="xemChuaSua">⚠ '+cs.length+' khối chưa từng sửa</button>');
 if(ms.length)h.push('<button class="rolnk" data-x="xemMoiSua">🕘 '+ms.length+' khối đổi trong 7 ngày</button>');
 const kh=KH.filter(k=>!suaDuoc(k.menu)).length;
 if(kh)h.push('<button class="rolnk off" data-x="xemKhoa">🔒 '+kh+' khối bạn không sửa được</button>');
 h.push('<button class="rolnk rd" data-x="viSaoZero">⛔ vì sao zero-write</button>');
 return h.join(' ')}

function render(){
 sidebar();
 $('#ava').textContent=role==='FULL'?'DQ':role.slice(0,2);
 if(!R().xem){
  $('#content').innerHTML='<div class="noacc"><h3>🚫 Chức danh '+esc(R().ten)+' không truy cập được Menu này</h3>'+
   '<p>Trung tâm cấu hình là <b>bản đồ các ngưỡng của hệ thống</b> — dành cho người vận hành và quản trị.</p>'+
   '<p>Các ngưỡng ảnh hưởng tới công việc hằng ngày của bạn <i>(hạn nộp giáo án, hạn viết biên bản dự giờ)</i> '+
   'đã hiện sẵn ngay tại màn hình làm việc, kèm ngày hạn cụ thể.</p></div>';return}
 const a=loc();
 let h='<div class="scope">⛔ <b>ZERO WRITE</b> — menu này <b>không sở hữu tham số nào</b>, mọi giá trị đọc trực tiếp từ menu chủ'+
  '<span class="sp"></span><span class="st2 n">'+KH.length+' khối · '+[...new Set(KH.map(k=>k.menu))].length+' menu chủ</span>'+chips()+'</div>';
 h+='<div class="bar"><input class="inp" id="q" placeholder="⌕ Tìm khối cấu hình, menu, hoặc chính GIÁ TRỊ — thử gõ &quot;30 ngày&quot;" value="'+esc(q)+'">'+
  '<select class="fs" id="fng"><option value="">Mọi nhóm nghiệp vụ</option>'+
   NG.map(n=>'<option value="'+n[0]+'"'+(fNg===n[0]?' selected':'')+'>'+n[1]+'</option>').join('')+'</select>'+
  '<button class="btn sm'+(fSua?' p':'')+'" data-x="fSua">'+(fSua?'✓ ':'')+'Chỉ khối tôi sửa được</button>'+
  '<button class="btn sm'+(fMac?' p':'')+'" data-x="fMac">'+(fMac?'✓ ':'')+'Chỉ khối chưa từng sửa</button>'+
  '<span class="sp" style="flex:1"></span><span class="st2 n">hiện '+a.length+'/'+KH.length+'</span></div>';
 h+='<div class="listw"><div class="hdrow"><div>Khối cấu hình</div><div>Menu chủ</div>'+
  '<div>Giá trị hiện tại</div><div>Cập nhật lần cuối</div><div></div></div>';
 if(!a.length)h+='<div class="empty">Không có khối nào khớp bộ lọc.</div>';
 NG.forEach(function(g){
  const ks=a.filter(k=>k.ng===g[0]); if(!ks.length)return;
  h+='<div class="grow">'+g[1]+'<span class="ct">'+ks.length+' khối · '+
   [...new Set(ks.map(k=>k.menu))].length+' menu</span></div>';
  ks.forEach(function(k){h+=row(k)})});
 h+='</div>';
 $('#content').innerHTML=h;
 const qi=$('#q');if(qi){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}}

function row(k){
 const ok=suaDuoc(k.menu);
 return '<div class="hrow">'+
  '<div class="kh"><b>'+esc(k.ten)+'</b><span>'+esc(k.mo)+'</span></div>'+
  '<div><span class="mc'+(ok?'':' off')+'">'+k.menu+'</span><div style="font-size:10.5px;color:var(--ink3);margin-top:2px">'+esc(MTEN[k.menu]||'')+'</div></div>'+
  '<div class="gt'+(k.ngay?'':' mac')+'">'+esc(k.gt)+(k.ngay?'':' <span class="st2 w">mặc định</span>')+'</div>'+
  '<div class="cn">'+(k.ngay?esc(k.ngay)+'<div class="m">'+esc(k.boi)+'</div>':'<span style="color:var(--ink3)">chưa từng sửa</span>')+'</div>'+
  '<div>'+(ok?'<button class="btn xs" data-x="mo" data-m="'+k.menu+'">↗ Mở</button>'
    :'<button class="btn xs lk" data-x="viSaoKhoa" data-m="'+k.menu+'">🔒 Mở</button>')+'</div></div>'}

function viSaoZero(){
 modal('⛔ Vì sao Menu này không có nút Lưu',
  '<div class="danger"><b>Nếu M10.6 sửa được thì mỗi tham số có HAI nơi sửa.</b> Hai nơi <b>sẽ</b> lệch — không phải <i>có thể lệch</i> — '+
  'vì hai màn hình được dựng ở hai thời điểm bởi hai luồng nghiệp vụ khác nhau, và không ai nhớ đồng bộ chúng.</div>'+
  '<div class="ro">Đúng nguyên tắc <b>D1</b> của dự án: <i>mỗi thực thể có đúng MỘT menu chủ có quyền ghi</i>. '+
  'Một trung tâm cấu hình ghi được là <b>vi phạm D1 ba mươi hai lần cùng lúc</b>.</div>'+
  '<div class="sech">Nhưng "chỉ điều hướng" không có nghĩa là chỉ hiện danh sách link</div>'+
  '<div class="info">Danh sách link thuần thì Hiệu trưởng vẫn phải bấm vào từng menu mới biết ngưỡng đang là bao nhiêu — '+
  '<b>tức là không giải quyết được vấn đề sinh ra menu này</b>.<div style="margin-top:6px">Nên M10.6 <b>hiện luôn giá trị hiện tại</b>, chỉ đọc, '+
  'và <b>đọc trực tiếp từ nguồn</b> — không giữ bản sao, vì bản sao lại là nguồn sự thật thứ hai, đúng thứ vừa loại bỏ.</div></div>'+
  '<div class="okbox">Thử: gõ <b>"30 ngày"</b> vào ô tìm — ra mọi ngưỡng đang đặt 30 ngày, ở bốn menu khác nhau. '+
  'Đó là thứ mà không màn hình nào khác trong hệ thống làm được.</div>',
  '<button class="btn" data-x="close">Đóng</button>')}

function viSaoKhoa(m){
 modal('🔒 Bạn không sửa được khối này',
  '<div class="ro">Khối này thuộc <b>'+m+' '+esc(MTEN[m]||'')+'</b>. Chức danh <b>'+esc(R().ten)+'</b> '+
  'không có quyền <code>Sửa</code> ở menu đó — cấu hình quyền tại '+dlink('M10.4')+'.</div>'+
  '<div class="info"><b>Nhưng dòng vẫn hiện, và giá trị vẫn đọc được.</b> Các ngưỡng <b>không phải thông tin mật</b> — '+
  'Tổ trưởng cần biết <i>"hạn nộp giáo án là 7 ngày"</i> để nhắc tổ viên, dù họ không phải người đặt con số đó. '+
  'Ẩn cả dòng thì họ đi hỏi vòng.</div>'+
  '<div class="sech">Chức danh sửa được khối này</div>'+
  '<div>'+aiSua(m).map(x=>'<span class="st2 n" style="margin-right:5px">'+esc(x)+'</span>').join('')+'</div>',
  '<button class="btn" data-x="close">Đóng</button>')}

function dsModal(ten,ds,mo){
 modal(ten,mo+'<table><tr><th>Khối cấu hình</th><th>Menu chủ</th><th>Giá trị</th></tr>'+
  ds.map(k=>'<tr><td><b>'+esc(k.ten)+'</b></td><td>'+k.menu+'</td><td>'+esc(k.gt)+'</td></tr>').join('')+'</table>',
  '<button class="btn" data-x="close">Đóng</button>')}

function ghiChu(){
 modal('💡 Ghi chú thiết kế — M10.6',
  '<div class="danger"><b>ZERO WRITE.</b> Không nút <code>Lưu</code>, không <code>Sửa nhanh</code>, không <code>Đặt lại mặc định</code>. '+
  'Một nút ghi ở đây là một nút phá vỡ <b>D1</b>.</div>'+
  '<div class="sech">Ba quyết định</div>'+
  '<div class="blk"><div class="ic">①</div><div><b>Hiện GIÁ TRỊ, không chỉ hiện link.</b> Danh sách link thuần không giải quyết được '+
  'vấn đề sinh ra menu này — người ta vẫn phải bấm vào từng menu mới biết ngưỡng là bao nhiêu.</div></div>'+
  '<div class="blk"><div class="ic">②</div><div><b>Đọc trực tiếp, không đồng bộ định kỳ.</b> Bản sao thì có lúc sai, '+
  'mà màn hình <i>"soi mọi ngưỡng một chỗ"</i> sai thì <b>tệ hơn là không có</b>, vì người ta tin nó.</div></div>'+
  '<div class="blk"><div class="ic">③</div><div><b>Không có tầng 2.</b> Tầng 2 của một khối cấu hình <b>chính là màn hình của menu chủ</b>. '+
  'Dựng panel ở đây thì hoặc lặp lại, hoặc bắt đầu cho sửa — và thế là vỡ zero-write.</div></div>'+
  '<div class="sech">Quy tắc chọn menu chủ</div>'+
  '<div class="okbox"><b>Menu chủ của một tham số là menu SỐNG VỚI hậu quả của nó</b>, không phải menu nào có chữ <i>"cấu hình"</i> trong tên. '+
  'Người đặt <i>"hạn nộp giáo án là 7 ngày"</i> phải là người nhìn thấy hệ quả của con số đó mỗi tuần.</div>'+
  '<div class="ro">Bốn khối từng bị đẩy về đây nay <b>trả về menu nghiệp vụ</b>: chứng thư số + CA → <b>M10.2</b> · '+
  'danh mục diện ưu tiên → <b>M1.2</b> · lộ trình tuổi nghỉ hưu và lý do biến động → <b>M4.2</b> · '+
  'danh mục trường bắt buộc và quy tắc sinh mã nhân sự → <b>M4.1</b>.</div>',
  '<button class="btn" data-x="close">Đóng</button>')}

function xuat(){
 modal('⬇ Xuất toàn bộ cấu hình hệ thống',
  '<div class="info">Một bản xuất duy nhất: <b>toàn bộ cấu hình tại một thời điểm</b> — dùng khi <b>bàn giao hệ thống</b>, '+
  'khi <b>kiểm tra</b>, hoặc để <b>so hai trường</b>.</div>'+
  '<label class="lbl">Mục đích <b>*</b></label><select class="din"><option value="">— chọn mục đích —</option>'+
  '<option>Bàn giao hệ thống cho trường</option><option>Hồ sơ kiểm tra</option>'+
  '<option>Rà soát cấu hình định kỳ</option></select>'+
  '<div class="ro" style="margin-top:11px">Bản xuất ghi cả <b>giá trị</b>, <b>menu chủ</b>, và <b>ngày sửa gần nhất</b> — '+
  'đủ để bên nhận biết cái nào trường đã quyết, cái nào còn nguyên mặc định của phần mềm.</div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="close">⬇ Xuất</button>')}

document.addEventListener('click',function(e){
 const rb=e.target.closest('.rb');
 if(rb){role=rb.dataset.r;document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b===rb));
  q='';fNg='';fSua=0;fMac=0;render();return}
 const el=e.target.closest('[data-x]');
 if(!el)return;
 const x=el.dataset.x,m=el.dataset.m;
 if(x==='close'){closeModal();return}
 if(x==='dl'){toast('Mở <b>'+m+'</b> — deep-link <code>/'+m+'?tab=cauhinh&return=M10.6</code>');return}
 if(x==='mo'){toast('Mở <b>'+m+' '+esc(MTEN[m]||'')+'</b> tab <b>⚙ Cấu hình</b> — deep-link <code>/'+m+'?tab=cauhinh&return=M10.6</code>');return}
 if(x==='viSaoKhoa'){viSaoKhoa(m);return}
 if(x==='viSaoZero'){viSaoZero();return}
 if(x==='ghiChu'){ghiChu();return}
 if(x==='xuat'){xuat();return}
 if(x==='fSua'){fSua=fSua?0:1;render();return}
 if(x==='fMac'){fMac=fMac?0:1;render();return}
 if(x==='xemChuaSua'){dsModal('⚠ Khối chưa từng sửa — còn nguyên giá trị mặc định',chuaSua(),
  '<div class="warn">Trường đang chạy bằng <b>giá trị mặc định của phần mềm</b>, không phải giá trị trường quyết. '+
  'Cần rà ít nhất một lần khi bàn giao — <b>không phải cái nào cũng phải đổi</b>, nhưng phải có người đã nhìn qua.</div>');return}
 if(x==='xemMoiSua'){dsModal('🕘 Khối đổi trong 7 ngày qua',moiSua(),
  '<div class="info">Đổi ngưỡng giữa năm học kéo theo hệ quả ở màn hình nghiệp vụ. Đây là chỗ soát lại sau khi đổi.</div>');return}
 if(x==='xemKhoa'){dsModal('🔒 Khối bạn không sửa được',KH.filter(k=>!suaDuoc(k.menu)),
  '<div class="info">Vẫn <b>xem được giá trị</b> — các ngưỡng không phải thông tin mật. Danh sách này cho biết <b>phải nhờ ai</b>, '+
  'không phải để chặn.</div>');return}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;render()}});
document.addEventListener('change',function(e){if(e.target.id==='fng'){fNg=e.target.value;render()}});
render();
</script>
</body>
</html>
