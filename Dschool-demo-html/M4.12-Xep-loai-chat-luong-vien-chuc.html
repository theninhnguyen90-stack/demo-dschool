<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4.12 Xếp loại chất lượng viên chức — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}
.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}
.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.crumb button{color:var(--brand);font-weight:600}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}
.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.flab{font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:-3px}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}.tg.v{background:#ede9fe;color:#5b21b6}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}.st2.v{background:#ede9fe;color:#5b21b6}
.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:13px}
.listw table{display:block;overflow-x:auto}
.listw table thead,.listw table tbody{display:table;width:100%}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:175px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}tr.badrow{background:var(--red-soft)}
tr.okrow{background:var(--green-soft)}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.lgd{display:flex;gap:12px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.empty{padding:32px;text-align:center;color:var(--ink3)}
.mini{font-size:10.5px;color:var(--ink3);font-weight:400}
.nodata{color:var(--red);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:840px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff}
/* dòng thời gian sáu bước */
.steps{display:flex;flex-wrap:wrap;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:13px}
.stp{flex:1;min-width:118px;position:relative;padding:0 8px}
.stp .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
 background:var(--line);color:var(--ink3);margin-bottom:5px}
.stp.done .n{background:var(--green);color:#fff}
.stp.now .n{background:var(--brand);color:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.stp.skip .n{background:#ede9fe;color:#5b21b6}
.stp .t{font-size:11.5px;font-weight:700}
.stp.done .t,.stp.now .t{color:var(--ink)}
.stp .s{font-size:10.5px;color:var(--ink3);margin-top:1px}
.stp::after{content:"";position:absolute;top:12px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:var(--line)}
.stp:last-child::after{display:none}
.stp.done::after{background:var(--green)}
.hd3{display:flex;gap:9px;flex-wrap:wrap}
.mem{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px}
.mem .r{font-size:10.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tt{display:flex;flex-wrap:wrap;gap:5px}
.ttc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
.ttc:hover{border-color:var(--brand)}
.ttc.on.up{background:var(--red-soft);border-color:#fca5a5;color:#991b1b;font-weight:600}
.ttc.on.down{background:var(--green-soft);border-color:#6ee7b7;color:#065f46;font-weight:600}
.clock{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#fff;margin-bottom:12px;flex-wrap:wrap}
.clock.bad{border-color:#fecaca;background:var(--red-soft)}
.clock .big{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.qbar{flex:1;min-width:130px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--brand)}
.qbar i.bad{background:var(--red)}

.gate{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink2);line-height:1.75}
.gate h3{font-size:15px;color:var(--ink);margin-bottom:7px}
.slot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slot i{width:15px;height:15px;border-radius:4px;border:1px solid var(--line2);display:inline-block;background:#fff}
.slot i.used{background:var(--brand);border-color:var(--brand)}
.slot i.over{background:var(--red);border-color:var(--red)}
.msel{border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-size:12px;background:#fff}
.msel.low{border-color:var(--amber);background:var(--amber-soft);color:#92400e;font-weight:700}
.dnum{font-variant-numeric:tabular-nums;font-weight:700}
.src{font-size:10.5px;color:var(--ink3);display:block;margin-top:2px;line-height:1.45}
.edited{background:var(--amber-soft)}
.dinp{width:52px;border:1px solid var(--line2);border-radius:6px;padding:3px 5px;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>

<script>
/* ============================================================
   M4.12 — XẾP LOẠI CHẤT LƯỢNG VIÊN CHỨC
   Căn cứ NĐ 233/2026/NĐ-CP (26/6/2026, hiệu lực 01/7/2026, thay NĐ 90/2020)
     Đ.10 tiêu chí chung ≤30đ · Đ.11 kết quả nhiệm vụ ≤70đ
     Đ.12 bốn mức 90/70/50; HTXSNV còn ba điều kiện a) b) c)
     Đ.12 TRẦN: HTXSNV ≤ 20% tổng số viên chức xếp loại HTTNV,
          TÍNH TRONG TỪNG NHÓM VIÊN CHỨC CÓ NHIỆM VỤ TƯƠNG ĐỒNG;
          ≤ 25% nếu đơn vị được công nhận HTXSNV
     Đ.13 k.3b người đứng đầu ĐVSNCL xếp loại
     Đ.15 xếp loại theo NĂM CÔNG TÁC, SAU KHI xếp loại đơn vị; 5 bước; công khai
     "Điểm theo dõi, đánh giá viên chức của NĂM được xác định căn cứ theo điểm
      theo dõi, đánh giá HẰNG THÁNG HOẶC HẰNG QUÝ" ⇒ điểm năm là DẪN XUẤT
   Điều kiện tiên quyết: trường "Diện làm việc" ở M4.1 §3b
   ============================================================ */

/* ---------- DIỆN LÀM VIỆC (đọc từ M4.1, chỉ đọc) ---------- */
const DIEN={
 vc:   {ten:'Viên chức',             vc:1,mau:1},
 bpdi: {ten:'Biệt phái đi',          vc:1,mau:1},
 bpden:{ten:'Biệt phái đến',         vc:1,mau:0},
 nd111:{ten:'HĐLĐ theo NĐ 111/2022', vc:0,mau:0},
 tg:   {ten:'Thỉnh giảng',           vc:0,mau:0},
 hdk:  {ten:'HĐLĐ khác',             vc:0,mau:0}};
const dn=m=>DIEN[m]||{ten:'(chưa khai)',vc:0,mau:0};

/* ---------- NHÂN SỰ — gd:1 = nhóm CÓ GIẢNG DẠY ---------- */
const NS=[
 {id:1, n:'Trần Văn Hùng',      i:'TH',cd:'Hiệu trưởng',           to:'Ban giám hiệu',     d:'vc',   gd:1,ql:1},
 {id:2, n:'Nguyễn Thị Lan',     i:'NL',cd:'Phó HT Chuyên môn',     to:'Ban giám hiệu',     d:'vc',   gd:1,ql:1},
 {id:3, n:'Phạm Đức Thắng',     i:'PT',cd:'Phó HT Điểm trường A',  to:'Ban giám hiệu',     d:'vc',   gd:1,ql:1},
 {id:4, n:'Lê Minh Tuấn',       i:'LT',cd:'GV Toán · TTCM',        to:'Tổ Toán — Tin',     d:'vc',   gd:1,ql:1},
 {id:5, n:'Vũ Thị Hồng',        i:'VH',cd:'GV Toán',               to:'Tổ Toán — Tin',     d:'vc',   gd:1},
 {id:6, n:'Đặng Quốc Việt',     i:'ĐV',cd:'GV Tin học',            to:'Tổ Toán — Tin',     d:'nd111',gd:1},
 {id:7, n:'Hoàng Thị Mai',      i:'HM',cd:'GV Ngữ văn · GVCN 9A2', to:'Tổ Văn — Sử — Địa', d:'vc',   gd:1},
 {id:8, n:'Bùi Văn Nam',        i:'BN',cd:'GV Ngữ văn',            to:'Tổ Văn — Sử — Địa', d:'vc',   gd:1},
 {id:9, n:'Trịnh Thu Hà',       i:'TH',cd:'GV Tiếng Anh · TTCM',   to:'Tổ Ngoại ngữ',      d:'vc',   gd:1,ql:1},
 {id:10,n:'Lý Quốc Anh',        i:'LA',cd:'GV Hóa học',            to:'Tổ Lý — Hóa — Sinh',d:'tg',   gd:1},
 {id:11,n:'Nguyễn Thị Tuyết Nhung',i:'TN',cd:'Tổ chức nhân sự',    to:'Bộ phận Hành chính',d:'vc',   gd:0},
 {id:12,n:'Ngô Thị Bích',       i:'NB',cd:'Kế toán',               to:'Bộ phận Hành chính',d:'vc',   gd:0},
 {id:13,n:'Lê Thu Hằng',        i:'LH',cd:'Văn thư',               to:'Bộ phận Hành chính',d:'vc',   gd:0},

/* KHÔNG đặt tên biến toàn cục là `top`: window.top là thuộc tính non-configurable
   của global object, khai `const top` ở script scope làm CẢ FILE không chạy. */
const laTop=id=>TOP.includes(id);
const kyIdx=k=>KY().indexOf(k);
function sl(id,k){
 const T=laTop(id), i=Math.max(0,kyIdx(k)), r=(a,b)=>a+((id*7+i*11)%b);
 return {tiet: T? 66+((id+i)%4) : 58+((id*3+i)%10), kh:70,
         hs: T? 90+((id*7+i*3)%9) : 58+((id*29+i*5)%34),
         cong: 21-((id*3+i)%2), muon: T?((id+i)%2):1+((id*13+i*7)%4),
         ga: T? 17+((id+i)%2) : 13+((id*17+i*3)%5),
         bdtx: T?120:(((id*23+i)%10)<4?84:120),
         viec: T? 18+((id+i)%3) : 13+((id*11+i*5)%6), kh2:20,
         bdtx2: T?40:(((id*19+i)%10)<4?30:40)};
}
function diemMay(id,k){

 if(g==='gd'){

  o[4]=Math.round(10*(s.bdtx/120)*10)/10;
 }else{
  o[0]=Math.round(25*Math.min(1,s.viec/s.kh2)*10)/10;
  o[1]=laTop(id)?19:15+((id*5)%4);
  o[2]=Math.max(0,15-s.muon*2);
  o[3]=Math.round(10*(s.bdtx2/40)*10)/10;
 }
 return o}

 return TC[g].chung.map((c,j)=>c[1]-(laTop(id)?((id*3+j*7+i)%2)*0.5:((id*3+j*7+i)%4)*0.5))}

 KY().forEach((k,i)=>{if(i<soKyCham)ky[k]={chung:chungMay(id,k),nv:diemMay(id,k),sua:{}}});
 return {ns:id,nop:'da',lyKhongNop:'',ky,

   coKL:id===22, klAnhHuong:true,      /* cờ do M4.10 sở hữu — xem §6.2.3 */
   hanCheTruoc:'', khacPhuc:null,      /* c) khắc phục hạn chế kỳ trước */
   hanChe:'',
   duyet:null, lyLech:'', botrong:false, lyBoTrong:'', nx:''};
}
const kyDaCham=b=>Object.keys(b.ky);
/* Điểm năm là DẪN XUẤT: trung bình cộng điểm các kỳ đã chấm (Đ. "điểm của năm căn cứ theo điểm hằng tháng/quý") */
function diemKy(b,k){const x=b.ky[k]; if(!x)return null;
 return Math.round((x.chung.reduce((a,c)=>a+c,0)+Object.values(x.nv).reduce((a,c)=>a+c,0))*10)/10}
function tongDiem(b){const ks=kyDaCham(b); if(!ks.length)return 0;
 return Math.round(ks.reduce((a,k)=>a+diemKy(b,k),0)/ks.length*10)/10}
const duKy=b=>kyDaCham(b).length===KY().length;

function dieuKienXS(b){
 const t=tongDiem(b), v=[];
 if(t<90)v.push('chưa đủ 90 điểm ('+t+')');
 if(!b.ht100)v.push('chưa hoàn thành 100% nhiệm vụ đúng hạn <span class="mini">(Đ.12 điểm a)</span>');
 if(!b.vuot30)v.push('chưa đạt <b>30% nhiệm vụ vượt mức</b> <span class="mini">(Đ.12 điểm a)</span>');
 if(b.hanCheTruoc&&!b.khacPhuc)v.push('<b>chưa khắc phục hạn chế kỳ trước</b> <span class="mini">(Đ.12 điểm c)</span>');
 /* KHÔNG chặn vì thiếu kỳ: trung bình 8/9 kỳ vẫn là một con số hợp lệ, và NĐ 233
    không đòi đủ kỳ. Thiếu kỳ chỉ hiện cảnh báo ở cột "Kỳ đã chấm". */
 return v}
/* Mức theo điểm — dẫn xuất. KHÔNG ép KHTNV khi có kỷ luật (chốt 29/8/2026, §6.2.3) */
function mucTheoDiem(b){
 const t=tongDiem(b);
 if(t>=90 && !dieuKienXS(b).length)return 'HTXSNV';
 if(t>=70)return 'HTTNV';
 if(t>=50)return 'HTNV';
 return 'KHTNV'}

function tabs(){

      <td class="num">${cacNhom().map(g=>`<span class="dnum">${TENNHOM[g].replace('Nhóm ','')}: ${c(g)}</span>`).join('<br>')}</td>
      <td class="num dnum">${boTrong(d).length}</td>

 const daCK=d.buoc>=5, g=boCua(me);

/* ---------- T4: nhận xét của tôi ---------- */

/* ================= TẦNG 2 ================= */
function manDot(){
 const d=dot(moDot); if(!d)return '';
 const B=[['①','Tự đánh giá'],['②','Họp nhận xét'],['③','Ý kiến cấp ủy'],['④','Quyết định'],['⑤','Công khai']];

   <span class="tg ${d.buoc>=5?'g':'b'}">${d.buoc>=5?'Đã công khai':'Bước '+B[d.buoc-1][0]+' '+B[d.buoc-1][1]}</span>
   ${d.dieuChinh?'<span class="tg v">Đã điều chỉnh sau công khai</span>':''}</div>
  ${dai0(d)}
  <div class="steps">${B.map((b,i)=>{const n=i+1;
    const cls=n<d.buoc?'done':n===buoc?'now':'';
    return `<div class="stp ${cls}" data-buoc="${n}" style="cursor:pointer">
      <div class="n">${n<d.buoc?'✓':b[0]}</div><div class="t">${b[1]}</div>
      <div class="s">${moTaBuoc(d,n)}</div></div>`}).join('')}</div>
  ${[b1,b2,b3,b4,b5][buoc-1](d)}`}

function moTaBuoc(d,n){
 const dsX=d.bg.filter(b=>!b.botrong);
 if(n===1)return dsX.filter(b=>b.nop==='da').length+'/'+dsX.length+' đã nộp';
 if(n===2)return 'chấm theo bộ tiêu chí';
 if(n===3)return d.capUyBoQua?'không áp dụng':d.capUy?('đã ghi nhận '+d.capUy):'chưa ghi nhận';
 if(n===4)return soSuat(d,cacNhom()[0])===null?'chờ trần':cacNhom().map(g=>`${g==='all'?'':TENNHOM[g].replace('Nhóm ','')+' '}${daDungXS(d,g)}/${soSuat(d,g)}`).join(' · ');
 return d.congKhai?('công khai '+d.congKhai):'chưa công khai'}

  </div>

function render(){
 const r=R();
 $('#ava').textContent=r.i;
 $('#rnote').innerHTML=r.tabs.length?`Vai <b style="color:#fff">${r.ten}</b> · scope ${r.sc} · ${r.tabs.length} tab`
   :`Vai <b style="color:#fff">${r.ten}</b> — không truy cập được menu này`;
 sidebar();
 if(!r.tabs.length){$('#main').innerHTML=`<div class="tophd"><h1>Xếp loại chất lượng viên chức</h1></div>
   <div class="gate" style="margin-top:14px"><h3>Menu này không áp dụng với bạn</h3></div>`;return}
 if(!r.tabs.includes(tab))tab=r.tabs[0];
 if(moDot&&tab==='dot'){$('#main').innerHTML=manDot();return}
 $('#main').innerHTML=`<div class="tophd"><h1>Xếp loại chất lượng viên chức</h1>
   <span class="tg c">NĐ 233/2026/NĐ-CP</span><span class="tg r">⚖ Ký số Nhóm B</span></div>
  ${tabs()}${scopeBand()}
  <div style="margin-top:13px">${({dot:tDot,ky:tKy,toi:tToi,nx:tNX,tc:tTC})[tab]()}</div>`}

function modal(t,h,ok,lab){$('#mh').textContent=t;$('#mb').innerHTML=h;$('#mok').textContent=lab||'Xác nhận';

 $('#mask').classList.add('on');
 $('#mok').onclick=()=>{if(ok&&ok()===false)return;$('#mask').classList.remove('on')}}
$('#mno').onclick=()=>$('#mask').classList.remove('on');

 if(t.dataset.knop){const id=+t.dataset.knop,d=dot(moDot);
   modal('Ghi nhận không nộp phiếu — '+ns(id).n,

    ()=>{if(DOT.some(z=>z.nam===namHoc()&&!z.huy)){toast('Năm học này đã có đợt đang mở');return false}

 if(x==='xl-donvi'){

     ()=>{d.buoc=2;buoc=2;render();toast('Đã sang bước ② — <b>'+c.length+'</b> người chuyển bước mà chưa có phiếu')},
     'Vẫn chuyển bước');return}
   d.buoc=2;buoc=2;render();toast('Đã sang bước ② Họp nhận xét');return}
 if(x==='sang3'){d.buoc=3;buoc=3;render();toast('Đã sang bước ③ Ý kiến cấp ủy');return}
 if(x==='sang4'){buoc=4;if(!d.dvXL)toast('Bước ④ bị khóa — chưa có kết quả xếp loại đơn vị');render();return}
 if(x==='ghi-capuy'){
   modal('Ghi nhận ý kiến cấp ủy',
    `<div class="info">Hệ thống <b>chỉ ghi nhận</b>: ngày họp, trích yếu, tệp biên bản.</div>
     <label class="lbl">Ngày họp</label><input class="fldi" id="cuNgay" value="${HOMNAY}">
     <label class="lbl">Trích yếu ý kiến</label><textarea class="fldi" id="cuY" rows="3"></textarea>
     <label class="lbl">Biên bản</label>
     <div class="fldi" style="text-align:center;color:var(--ink3);border-style:dashed">📎 Kéo thả tệp</div>`,
    ()=>{d.capUy=$('#cuNgay').value||HOMNAY;d.capUyBoQua=false;render();toast('Đã ghi nhận ý kiến cấp ủy')},'Ghi nhận');return}
 if(x==='bo-capuy'){
   modal('Không áp dụng bước lấy ý kiến cấp ủy',
    `<div class="warn">Chỉ chọn khi <b>đơn vị chưa có tổ chức đảng</b>. ⛔ Bước này cũng không được làm kẹt cả đợt.</div>
     <label class="lbl">Lý do <span style="color:var(--red)">*bắt buộc</span></label>
     <input class="fldi" id="bqLy" placeholder="VD: Đơn vị chưa thành lập chi bộ">`,
    ()=>{if(!$('#bqLy').value.trim()){toast('Bỏ qua bước thì phải ghi lý do');return false}
      d.capUyBoQua=true;d.capUy=null;render();toast('Đã ghi nhận: bước ③ không áp dụng · có lý do và audit')},'Xác nhận');return}
 if(x==='chot'){
   modal('Chốt cả đợt và ký quyết định',
    `<div class="info"><b>Một quyết định cho cả đơn vị</b>, không ký lẻ từng người.
      Kết quả ghi vào hồ sơ viên chức ở ${dlink('M4.1','M4.1 tab Đánh giá cuối năm')}.</div>
     <label class="lbl">Số quyết định <span style="color:var(--red)">*bắt buộc</span></label>
     <input class="fldi" id="qdSo" placeholder="VD: 214/QĐ-NTT">
     <div class="danger" style="margin-top:11px"><b>⚖ Ký số Nhóm B — BẮT BUỘC.</b>
      Quyết định vào hồ sơ viên chức và là căn cứ nâng lương, thi đua.</div>
     <div class="mini" style="margin-top:8px">${cacNhom().map(g=>`${TENNHOM[g]} <b>${daDungXS(d,g)}/${soSuat(d,g)}</b> suất`).join(' · ')} · không xếp loại <b>${boTrong(d).length}</b> người.</div>`,
    ()=>{if(!$('#qdSo').value.trim()){toast('Số quyết định là trường bắt buộc');return false}
      d.soQD=$('#qdSo').value.trim();d.buoc=4;buoc=5;render();
      toast('Đã chốt đợt · quyết định <b>'+d.soQD+'</b> đã ký số · tiếp theo là <b>⑤ Công khai</b>')},'Chốt & ký');return}
 if(x==='cong-khai'){
   modal('Công khai kết quả trong đơn vị',
    `<div class="info">NĐ 233 Đ.15 k.2 điểm d — <b>nghĩa vụ bắt buộc</b>.</div>
     <label class="lbl">Hình thức</label>
     <select class="fldi"><option>Niêm yết tại trụ sở</option><option>Đăng trên hệ thống nội bộ</option>
      <option>Thông báo tại hội nghị viên chức</option><option>Niêm yết + đăng nội bộ</option></select>
     <label class="lbl">Ngày công khai</label><input class="fldi" id="ckNgay" value="${HOMNAY}">`,
    ()=>{d.congKhai=$('#ckNgay').value||HOMNAY;d.buoc=5;render();
      toast('Đã công khai · mọi viên chức xem được danh sách mức ở tab <b>Phiếu của tôi</b>')},'Công khai');return}
 if(x==='mo-lai'){
   modal('Mở lại đợt đã chốt',
    `<div class="danger"><b>Đợt này đã ${d.congKhai?'CÔNG KHAI':'chốt'}.</b>
      ${d.congKhai?'Kết quả sau khi sửa mang dấu <b>"Đã điều chỉnh sau công khai"</b> <b>vĩnh viễn</b>. Không xóa được dấu đó.':''}</div>
     <label class="lbl">Lý do <span style="color:var(--red)">*bắt buộc</span></label>
     <textarea class="fldi" id="mlLy" rows="3"></textarea>`,
    ()=>{if(!$('#mlLy').value.trim()){toast('Mở lại đợt thì phải ghi lý do');return false}
      if(d.congKhai)d.dieuChinh=true; d.buoc=3;buoc=4;render();
      toast('Đã mở lại đợt'+(d.dieuChinh?' · mang dấu <b>Đã điều chỉnh sau công khai</b>':''))},'Mở lại');return}
 if(x==='nop-phieu'){const dd=DOT.find(z=>z.nam===namHoc()&&!z.huy),b=bgCua(dd,R().me);
   b.nop='da';render();toast('Đã nộp phiếu tự đánh giá');return}
 if(x==='ban-hanh'){toast('Đã trình Hiệu trưởng ban hành bộ <b>'+TENNHOM[nhomXem==='all'?'gd':nhomXem]+'</b>');return}
 if(x==='xuat'){
   modal('Xuất bảng tổng hợp xếp loại',
    `<div class="warn">Bảng <b>gắn tên người với mức xếp loại</b> — dữ liệu cá nhân theo <b>NĐ 13/2023</b>.</div>
     <label class="lbl">Mục đích <span style="color:var(--red)">*bắt buộc</span></label>
     <select class="fldi" id="xmd"><option value="">— chọn mục đích —</option>
      <option>Báo cáo Phòng / Sở GDĐT</option><option>Hồ sơ xét nâng lương</option>
      <option>Hồ sơ thi đua khen thưởng</option><option>Lưu hồ sơ viên chức</option></select>`,
    ()=>{if(!$('#xmd').value){toast('Chưa chọn mục đích — không xuất được');return false}
      toast('Đã xuất · mục đích <b>'+$('#xmd').value+'</b> · đã ghi audit')},'Xuất');return}
 if(x==='xem-qd'||x==='xem-bb'){modal('👁 '+(x==='xem-qd'?'Quyết định công nhận kết quả xếp loại':'Biên bản họp cấp ủy'),
   `<div style="border:1px solid var(--line2);border-radius:9px;background:#fff;padding:20px 24px;line-height:1.85;font-size:12.5px;max-height:320px;overflow:auto">
     <div style="text-align:center;font-weight:700">SỞ GIÁO DỤC VÀ ĐÀO TẠO<br>TRƯỜNG THCS &amp; THPT NGUYỄN TẤT THÀNH</div>
     <div style="text-align:center;margin:9px 0 13px">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br><b>Độc lập - Tự do - Hạnh phúc</b></div>
     <div style="text-align:center;font-weight:700">${x==='xem-qd'?'QUYẾT ĐỊNH<br>Về việc công nhận kết quả xếp loại chất lượng viên chức':'BIÊN BẢN HỌP CẤP ỦY'}</div>
     <div style="margin-top:12px;color:var(--ink3)">— Nội dung hiển thị ngay trong màn hình, không cần tải về —</div>
     <div style="margin-top:10px">Căn cứ Nghị định số 233/2026/NĐ-CP ngày 26/6/2026 của Chính phủ;<br>
      Căn cứ kết quả xếp loại chất lượng đơn vị và biên bản họp nhận xét;<br>Theo đề nghị của Tổ chức nhân sự,</div>
     <div style="margin-top:12px;color:var(--ink3)">…</div></div>
    <div class="mini" style="margin-top:9px">Lượt xem đã ghi audit — NĐ 13/2023.</div>`,null,'Đóng');return}
 if(x==='tai-qd'||x==='tai-bb'){toast('Đã tải · ghi audit: người tải · tệp · thời điểm · nguồn M4.12');return}
});

document.body.addEventListener('change',e=>{
 const el=e.target, d=dot(moDot);
 if(el.dataset.duyet){const b=bgCua(d,+el.dataset.duyet),md=mucTheoDiem(b),v=el.value;
  if(v==='__bt'){
   modal('Bỏ trống — không xếp loại '+ns(b.ns).n,
    `<div class="info">Danh sách đợt gồm <b>mọi nhân sự</b>; ai không thuộc phạm vi xếp loại thì <b>bỏ trống</b>
      thay vì bị lọc khỏi danh sách. Người bỏ trống <b>không vào mẫu số</b> và <b>không có trong bảng công khai</b>,
      nhưng <b>vẫn nằm trong đợt</b> nên không ai bị bỏ quên trong im lặng.</div>
     <label class="lbl">Lý do <span style="color:var(--red)">*bắt buộc</span></label>
     <select class="fldi" id="btLy"><option value="">— chọn lý do —</option>
      <option>Người đứng đầu đơn vị — do cấp trên xếp loại</option>
      <option>Biệt phái đến — đơn vị cử đi xếp loại</option>
      <option>Không phải viên chức — đánh giá theo hợp đồng đã ký</option>
      <option>Mới tuyển, chưa đủ thời gian công tác trong năm</option>
      <option value="__khac">Khác — mô tả bên dưới</option></select>
     <label class="lbl">Mô tả thêm</label><input class="fldi" id="btMo">
     <div class="mini" style="margin-top:8px">Lý do này <b>hiển thị cho chính người đó</b> ở tab Phiếu của tôi.</div>`,
    ()=>{const s=$('#btLy').value,mo=$('#btMo').value.trim();
      if(!s){toast('Bỏ trống thì phải có lý do');return false}
      if(s==='__khac'&&!mo){toast('Chọn "Khác" thì phải mô tả');return false}
      b.botrong=true;b.lyBoTrong=(s==='__khac'?mo:s+(mo?' — '+mo:''));b.duyet=null;b.lyLech='';
      render();toast('Đã bỏ trống xếp loại cho <b>'+ns(b.ns).n+'</b> · có lý do và ghi audit')},'Bỏ trống');
   el.value=b.duyet||''; return}
  if(v&&capMuc(v)<capMuc(md)){toast('Không được duyệt <b>cao hơn</b> mức theo điểm — nâng mức không phải quyết định quản lý mà là chấm sai điểm');el.value=b.duyet||'';return}
  b.duyet=v||null; if(!v||v===md)b.lyLech='';
  render();
  if(v&&v!==md)toast('Mức duyệt <b>thấp hơn</b> mức theo điểm — <b>Lý do bắt buộc</b>, người bị hạ đọc nguyên văn sau công khai');
  return}
 if(el.dataset.ly){bgCua(d,+el.dataset.ly).lyLech=el.value;render();return}
 if(el.dataset.hc){bgCua(d,+el.dataset.hc).hanChe=el.value;return}
 if(el.dataset.ky){const[id,k]=el.dataset.ky.split(':');
  const dd=DOT.find(z=>z.nam===namHoc()&&!z.huy), b=bgCua(dd,+id);
  const cu=diemKy(b,k); let v=parseFloat(el.value);
  if(isNaN(v)||v<0||v>100){toast('Điểm kỳ phải trong khoảng 0 – 100');render();return}
  const may=Math.round((chungMay(+id,k).reduce((a,c)=>a+c,0)+Object.values(diemMay(+id,k)).reduce((a,c)=>a+c,0))*10)/10;
  if(Math.abs(v-may)>0.05){
   modal('Sửa khác số máy — '+ns(+id).n+' · kỳ '+k,
    `<div class="warn"><b>MÁY ĐẾM — NGƯỜI KẾT LUẬN.</b> Bạn sửa điểm kỳ <b>${k}</b>
      từ <b>${may}</b> (số máy) thành <b>${v}</b>.</div>
     <label class="lbl">Lý do sửa <span style="color:var(--red)">*bắt buộc</span></label>
     <textarea class="fldi" id="csLy" rows="3" placeholder="VD: tiết thiếu là do nghỉ ốm có phép, không tính vào đánh giá"></textarea>`,
    ()=>{if(!$('#csLy').value.trim()){toast('Sửa khác số máy thì Lý do là trường bắt buộc');return false}
      const tyLe=v/ (cu||1);
      b.ky[k].nv=Object.fromEntries(Object.entries(b.ky[k].nv).map(([i,c])=>[i,Math.round(c*tyLe*10)/10]));
      b.ky[k].sua[k]=$('#csLy').value.trim();
      render();toast('Đã sửa điểm kỳ '+k+' · ghi lý do và audit · <b>điểm năm tính lại</b>')},'Lưu');
   render();return}
  render();return}
 if(el.dataset.tc){const[g,k,i]=el.dataset.tc.split(':');const v=parseFloat(el.value);
  if(isNaN(v)||v<0){toast('Điểm không hợp lệ');render();return}
  TC[g][k][+i][1]=v;render();
  const tong=TONG(g,k),khoa=k==='chung'?30:70;
  if(tong!==khoa)toast(`Khối ${k==='chung'?'chung':'nhiệm vụ'} của ${NHOMTEN[g].toLowerCase()} đang <b>${tong}</b>/${khoa} — <b>chặn ban hành</b>`);
  return}
});
$('#selNam').onchange=()=>{moDot=null;render()};

render();
</script>
</body>
</html>
