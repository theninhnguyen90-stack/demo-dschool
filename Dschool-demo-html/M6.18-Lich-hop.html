<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.18 Lịch họp — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.cell{width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;text-align:right;font:inherit;font-size:12.5px}
.cell:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:6px;border-radius:1px;display:block}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.mini{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:12px}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}


/* --- riêng M6.18 Lịch họp --- */
.modal.wide{width:1040px}
/* lịch tuần — đơn vị dòng là MỘT NGÀY */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media(max-width:1100px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}}

const loaiH=h=>CFG.loai[h.loai];

/* ========== CUỘC HỌP — M6.18 SỞ HỮU ========== */
const HOP=[];
let MHOP=0;                                     /* số cuối của mã HOP — app.35 đặt sau khi nạp mẫu */
function themHop(o){HOP.push(Object.assign({tt:'moi',ds:{},doi:[],tb:[],diemDanh:null,bb:null,luu:null,tl:[],ls:[],moi:{},noiDung:'',kl:[]},o))}
const hopById=id=>HOP.find(h=>h.id===id);
/* phản hồi sinh tất định — 70% tham dự, 6% vắng có lý do, còn lại chưa trả lời */
const LYDO_VANG=['Dự tập huấn cấp huyện cùng giờ','Con ốm — đã báo tổ trưởng','Coi thi nghề phổ thông tại trường bạn','Khám sức khỏe định kỳ theo lịch Sở'];
function phanHoiMau(ids,key,tron,ngayGui){
 const r=rng(hat(key,3)), ds={};
 ids.forEach(m=>{
  const x=r();
  if(x<(tron?.7:.55)) ds[m]={ph:'du',luc:ngayGui+' '+p2(8+Math.floor(r()*9))+':'+p2(Math.floor(r()*60))};
  else if(x<(tron?.76:.62)) ds[m]={ph:'vang',ly:LYDO_VANG[Math.floor(r()*LYDO_VANG.length)],luc:ngayGui+' 16:02'};
  else ds[m]={ph:'cho'};
 });
 return ds;
}


/* ══════════════ M6.18 — LOGIC DẪN XUẤT ══════════════
   Mọi trạng thái ở đây TÍNH LẠI mỗi lần đọc — không có ô «đã kiểm tra trùng», không có nút «kết thúc họp». */

const BAYGIO=HOMNAY+' '+GIONAY;
const mocBD=h=>h.ngay+' '+khoang(h)[0], mocKT=h=>h.ngay+' '+khoang(h)[1];

/* ── Thành phần mời ──
   ★ Công thức: (TỔ ∪ CHỨC DANH) ∩ ĐIỂM TRƯỜNG  ∪  NGƯỜI  ∪ {chủ trì, thư ký}
     Điểm trường là bộ LỌC THU HẸP («GVCN ở điểm trường A»), không phải thêm người.
     Chỉ chọn điểm trường = mọi nhân sự của điểm trường đó. Trùng lặp tự gộp. */
function nguoiMoi(moi,h){
 const tp=new Set(), m=moi||{};
 let nhom=[];
 if(m.tatCa) nhom=DSNS.map(n=>n.ma);
 else{
  const coTo=(m.to||[]).length, coCd=(m.cd||[]).length, coDt=(m.dt||[]).length;
  if(coTo||coCd) nhom=DSNS.filter(n=>(m.to||[]).includes(n.to)||n.cd.some(c=>(m.cd||[]).includes(c))).map(n=>n.ma);
  else if(coDt) nhom=DSNS.map(n=>n.ma);
  if(coDt) nhom=nhom.filter(x=>m.dt.includes(NS[x].dt));
 }
 nhom.forEach(x=>tp.add(x));
 if(m.hdt) HDT.thanhVien.forEach(x=>tp.add(x));            /* thành viên Hội đồng trường — chiếu M4.3, cộng như người đích danh */
 if(m.bch&&BCH[m.bch]) bchTK(m.bch).forEach(x=>tp.add(x)); /* BCH nhiệm kỳ hiện hành — chiếu M6.15, CHỈ người có tài khoản (HDDD ②) */
 (m.ng||[]).forEach(x=>tp.add(x));
 if(h){if(h.chuTri)tp.add(h.chuTri);if(h.thuKy)tp.add(h.thuKy)}
 return [...tp].filter(x=>NS[x]);
}
/* sau khi GỬI MỜI, danh sách là ẢNH CHỤP (h.ds) — nhân sự mới vào trường sau đó không tự thành người được mời */
const dsMoi=h=>h.tt==='nhap'?nguoiMoi(h.moi,h):Object.keys(h.ds);
function moTaMoi(m){
 if(!m) return '—';
 if(m.tatCa) return 'Toàn trường';
 const a=[];
 if((m.to||[]).length) a.push('Tổ: '+m.to.map(t=>TO[t]).join(', '));
 if((m.cd||[]).length) a.push('Chức danh: '+m.cd.map(c=>CDTEN[c]).join(', '));
 if((m.dt||[]).length) a.push((a.length?'chỉ ở ':'Điểm trường: ')+m.dt.map(d=>DT[d]).join(', '));
 if(m.hdt) a.push('Thành viên Hội đồng trường (🔗 M4.3 — '+HDT.thanhVien.length+' người)');
 if(m.bch&&BCH[m.bch]) a.push(BCH[m.bch].ten+' nhiệm kỳ hiện hành (🔗 M6.15 '+BCH[m.bch].nk+' — '+bchTK(m.bch).length+' người có tài khoản; '+bchHS(m.bch).length+' học sinh ghi dòng chữ)');
 if((m.ng||[]).length) a.push(m.ng.length+' người chọn đích danh');
 return a.join(' · ')||'—';
}

/* ── Trạng thái — CHỈ «nháp · đã mời · đã hủy» do NGƯỜI đặt; còn lại dẫn xuất từ giờ và biên bản ── */
function trangThai(h){
 if(h.tt==='huy') return {k:'huy',ten:'Đã hủy',c:'n'};
 if(h.tt==='nhap') return {k:'nhap',ten:'Nháp — chưa gửi mời',c:'n'};
 if(BAYGIO<mocBD(h)) return {k:'sap',ten:'Sắp diễn ra',c:'b'};
 if(BAYGIO<mocKT(h)) return {k:'dang',ten:'Đang họp',c:'o'};
 if(h.loai==='ngoai') return h.bb?{k:'xong',ten:'Hoàn tất',c:'o'}:{k:'chobb',ten:'Chờ ghi nội dung tiếp thu',c:'w'};
 if(!h.bb) return {k:'chobb',ten:'Chờ biên bản',c:'w'};
 if(!h.bb.xn) return {k:'choxn',ten:'Chờ chủ trì xác nhận',c:'w'};
 return {k:'xong',ten:'Hoàn tất',c:'o'};
}
const quaHanBB=h=>trangThai(h).k==='chobb'&&soNgay(h.ngay,HOMNAY)>CFG.hanBB;

/* ── Điểm trường của cuộc họp: theo phòng; ngoài trường / trực tuyến thì theo khai báo ── */
const dtHop=h=>h.dd.kieu==='phong'||h.dd.kieu==='lamviec'?(phongById(h.dd.phong)||{}).dt||h.dt:h.dt;

/* ── Phạm vi — RÀNG BUỘC DỮ LIỆU, không phải ẩn nút ── */
const coMat=(h,m)=>dsMoi(h).includes(m)||h.tao===m||h.chuTri===m||h.thuKy===m;
/* người được giao việc từ kết luận ĐÃ SINH nhưng không có tên trong cuộc họp — thấy cuộc họp (phần lịch) + đúng dòng việc của mình */
const laNguoiTH=(h,m)=>(h.kl||[]).some(k=>k.nguoi_thuc_hien_id===m&&daSinh(k));
function hopTrongPV(h){
 const r=R();
 if(h.tt==='nhap'&&h.tao!==R().ma&&role!=='FULL'&&!(r.sc==='School'&&can('sua'))) return false; /* nháp chỉ người tạo + vai quản lý thấy */
 if(r.loc==='assigned') return coMat(h,r.ma)||laNguoiTH(h,r.ma);
 if(r.sc==='Branch') return dtHop(h)===r.dt||coMat(h,r.ma)||laNguoiTH(h,r.ma);
 return true;
}
/* bộ chọn điểm trường ở header chỉ cắt dữ liệu của vai School — vai hẹp đã bị khóa */
const hopTheoLoc=h=>hopTrongPV(h)&&(R().sc!=='School'||ST.dt==='ALL'||dtHop(h)===ST.dt);

/* ── Phòng — ĐỌC trạng thái yêu cầu ở M6.5 ── */
function phongTT(h){
 if(h.dd.kieu!=='phong') return null;
 const y=ycById(h.yc); if(!y) return {c:'r',ten:'Chưa có yêu cầu mượn phòng',y:null};
 const t=TT_YC[y.tt]; return {c:t[1],ten:t[0],y};
}
/* vướng mắc khi đặt phòng — HAI nguồn không cùng sức nặng (M6.5 §2.5) */
function vuongPhong(phong,ngay,tiet,boQua){
 const p=phongById(phong), out={chan:null,tkb:[],muon:[]};
 if(!p) return out;
 if(p.tt==='sua') out.chan='đang sửa chữa — '+p.ghichu;
 (TKBPHONG[phong]||[]).filter(x=>x[0]===thuSo(ngay)).forEach(x=>{const g=x[1].filter(t=>tiet.includes(t));if(g.length)out.tkb.push({nd:x[2],tiet:g})});
 YCP.filter(y=>y.phong===phong&&y.ngay===ngay&&['cho','duyet'].includes(y.tt)&&y.id!==boQua).forEach(y=>{
  const g=y.tiet.filter(t=>tiet.includes(t)); if(g.length) out.muon.push({y,tiet:g});
 });
 return out;
}
const trongHet=v=>!v.chan&&!v.tkb.length&&!v.muon.length;

/* ── Trùng lịch của người được mời — cảnh báo nêu đích danh, KHÔNG chặn ── */
function tietCuaHop(h){return h.tiet&&h.tiet.length?h.tiet:tietGiao(...khoang(h))}
function trungDay(h,ids){
 const ts=tietCuaHop(h), out=[];
 ids.forEach(m=>{const g=lichDay(m,h.ngay).filter(x=>ts.includes(x.tiet)); if(g.length) out.push({ma:m,tiet:g})});
 return out;
}
function trungHopKhac(h,ids){
 const [a,b]=khoang(h), out=[];
 HOP.forEach(o=>{
  if(o===h||o.id===h.id||o.tt==='huy'||o.ngay!==h.ngay) return;
  const [c,d]=khoang(o); if(!giaoGio(a,b,c,d)) return;
  const chung=ids.filter(m=>dsMoi(o).includes(m)); if(chung.length) out.push({ten:o.ten,nguon:'M6.18 · '+o.id,ma:chung});
 });
 PJ.forEach(p=>{
  if(p.ngay!==h.ngay) return; const [c,d]=khoang(p); if(!giaoGio(a,b,c,d)) return;
  const chung=ids.filter(m=>p.tp.includes(m)); if(chung.length) out.push({ten:p.ten,nguon:'🔗 '+p.menu,ma:chung});
 });
 return out;
}
const dangNghi=(h,ids)=>ids.map(m=>({ma:m,n:nghiNgay(m,h.ngay)})).filter(x=>x.n);

/* ── Đếm phản hồi — BA SỐ TÁCH RIÊNG, «chưa trả lời» không gộp vào «vắng» (bài học M2.9/T9) ── */
function demPH(h){
 const o={du:0,vang:0,cho:0}; Object.values(h.ds).forEach(x=>o[x.ph]++); return o;
}
const phCua=(h,m)=>h.ds[m]?h.ds[m].ph:null;

/* ── Việc của tôi — MỘT định nghĩa, dùng cho chuông · badge tab · dải việc ── */
function viecCuaToi(){
 const m=toi(), out=[];
 HOP.forEach(h=>{
  if(!hopTrongPV(h)&&!coMat(h,m)) return;
  const t=trangThai(h).k;
  if(t==='sap'&&phCua(h,m)==='cho') out.push({h,loai:'ph',ten:'Phản hồi lời mời'});
  if(t==='chobb'&&(h.thuKy===m||(!h.thuKy&&h.tao===m)||(h.loai==='ngoai'&&h.chuTri===m))) out.push({h,loai:'bb',ten:h.loai==='ngoai'?'Ghi nội dung tiếp thu':'Ghi biên bản'});
  if(t==='choxn'&&h.chuTri===m) out.push({h,loai:'xn',ten:'Xác nhận biên bản'});
  /* YKDD-2E: kết luận CHỜ TÔI NGHIỆM THU — chủ trì theo dõi tiến độ ngay trong cuộc họp (không có tab «việc đã giao» ở M0.2 — P5) */
  const nt=klChoNghiemThu(h).length; if(h.chuTri===m&&nt) out.push({h,loai:'nt',ten:'Nghiệm thu '+nt+' kết luận giao việc'});
  if(h.tao===m&&t==='sap'){
   const pt=phongTT(h); if(pt&&pt.y&&pt.y.tt==='tuchoi') out.push({h,loai:'phong',ten:'Phòng bị từ chối — đổi phòng'});
   if(h.chuTri&&phCua(h,h.chuTri)==='vang') out.push({h,loai:'chutri',ten:'Chủ trì báo vắng'});
  }
 });
 return out;
}
const soViec=()=>viecCuaToi().length;

/* ── Quyền trên MỘT cuộc họp — kiểm theo NGƯỜI khi việc gắn với vai trong cuộc họp (chủ trì · thư ký) ── */
/* quản lý một cuộc họp = người tạo · HT · PHT trong phạm vi. Văn thư chỉ quản lý cuộc họp mình tạo
   (lập lịch hộ, ghi đi họp từ giấy mời) — không dời, không hủy cuộc họp của BGH. */
const laNguoiQL=h=>role==='FULL'||h.tao===R().ma||(['HT','PHTCM','PHTDT'].includes(role)&&hopTrongPV(h));
/* ✅ LH-10 chốt 14/9/2026 — NỘI DUNG (chương trình · tài liệu · danh sách phản hồi · thông báo · biên bản · lịch sử)
   chỉ hiện với người CÓ TÊN trong cuộc họp và người quản lý (HT · PHT trong phạm vi · người tạo).
   Vai thấy cuộc họp nhờ phạm vi `all` mà không có tên (Văn thư) chỉ thấy phần LỊCH: tiêu đề · giờ · nơi · chủ trì · số người mời. */
const xemND=h=>laNguoiQL(h)||coMat(h,R().ma);
const coTheGhiBB=h=>role==='FULL'||h.thuKy===R().ma||h.tao===R().ma||(h.loai==='ngoai'&&h.chuTri===R().ma);
const coTheXN=h=>role==='FULL'||h.chuTri===R().ma;

/* ── Lời giải thích dải phạm vi ── */
function scopeBar(extra){
 const r=R(), n=NS[r.ma];
 let pv;
 if(r.loc==='assigned') pv='<b>'+r.sc+' · chỉ cuộc họp có tên tôi</b> (được mời · chủ trì · thư ký · người tạo). Cuộc họp khác <b>không có trong kết quả trả về</b> — kể cả họp của người cùng tổ. Bộ chọn điểm trường không áp';
 else if(r.sc==='Branch') pv='<b>Branch — '+DT[r.dt]+'</b>: cuộc họp tổ chức tại '+DT[r.dt]+', cộng cuộc họp ở nơi khác <b>có tên tôi</b>. Họp của điểm trường khác không có trong kết quả trả về';
 else pv='<b>School'+(ST.dt==='ALL'?' — toàn trường':' (đang lọc '+DT[ST.dt]+')')+'</b>';
 return '<div class="scope"><span>🎨</span><span class="sp">Vai <b>'+esc(r.cd)+'</b>'+(n?' — '+esc(n.ten):'')+'. Phạm vi: '+pv+'.'
  +(extra?' '+extra:'')+'</span></div>';
}

/* ══════════════ KẾT LUẬN GIAO VIỆC — YKDD-2E 17/9/2026 · hợp đồng HDDD ① ══════════════

   +(h.bb.hs?'<div class="f" style="padding:4px 0"><span class="k">Học sinh BCH</span><span class="v" style="font-weight:400">'+esc(h.bb.hs)+'</span></div>':'')

 } else s+='<div class="ro" style="margin:6px 0">'+(h.loai==='ngoai'?'Chưa ghi nội dung tiếp thu. Người được cử ghi lại <b>điều cần triển khai</b> và tải lên tài liệu nhận về.':'Chưa có biên bản. Thư ký ghi <b>nội dung hoặc tải tệp</b> — một trong hai là đủ, kết luận là bắt buộc.')+'</div>';
 if(t.k==='xong'){
  s+=h.luu?'<div class="okbox" style="margin:8px 0 0">🗂 Đã lưu <b>liên kết</b> vào <b>M6.12 › '+esc(h.luu.thu)+'</b> ('+h.luu.ma+') · '+h.luu.luc+' · '+esc(tenNS(h.luu.boi))+' '+lk('M6.12','ctx='+h.luu.ma,'Mở ở M6.12')
    +'<br><span style="font-size:11.5px">Liên kết, không phải bản sao — sửa biên bản ở đây thì M6.12 thấy bản mới. <b>Ai xem được ở M6.12 do điều kiện hiển thị của thư mục quyết định</b>, không phải danh sách mời.</span></div>'

/* nút đổi theo TRẠNG THÁI và theo NGƯỜI */
function nutHop(h,t){
 const a=[], ql=laNguoiQL(h), m=toi();
 if(t.k==='nhap'&&ql) a.push('<button class="btn sm" data-act="sua">✏ Sửa</button>','<button class="btn sm p" data-act="gui">📣 Gửi mời</button>','<button class="btn sm" data-act="huy">✕ Hủy nháp</button>');
 if(t.k==='sap'){
  if(phCua(h,m)) a.push('<button class="btn sm g" data-ph="'+h.id+'|du">✓ '+(role==='FULL'?esc(tenNS(m))+' ':'')+'tham dự</button>','<button class="btn sm" data-ph="'+h.id+'|vang">✕ Báo vắng</button>');
  if(ql) a.push('<button class="btn sm" data-act="sua">✏ Sửa nội dung</button>','<button class="btn sm" data-act="doi">↻ Dời / đổi địa điểm</button>',
   '<button class="btn sm" data-act="nhac">🔔 Nhắc</button>','<button class="btn sm" data-act="them">➕ Mời thêm</button>','<button class="btn sm d" data-act="huy">✕ Hủy cuộc họp</button>');
  if(ql&&can('doiChuTri')) a.push('<button class="btn sm" data-act="chutri">👤 Đổi chủ trì</button>');
 }
 if(['dang','chobb','choxn'].includes(t.k)){
  if(loaiH(h).diemDanh&&coTheGhiBB(h)) a.push('<button class="btn sm" data-act="diemdanh">🗒 Điểm danh</button>');
  if(coTheGhiBB(h)&&t.k!=='dang') a.push('<button class="btn sm p" data-act="bb">📝 '+(h.bb?'Sửa ':'Ghi ')+(h.loai==='ngoai'?'nội dung tiếp thu':'biên bản')+'</button>');
  if(t.k==='choxn'&&coTheXN(h)) a.push('<button class="btn sm g" data-act="xn">✓ Xác nhận biên bản'+(role==='FULL'&&h.chuTri!=='huy'?' (thay chủ trì — rà soát)':'')+'</button>');
  if(t.k==='choxn'&&!coTheXN(h)) a.push('<span style="font-size:12px;color:var(--ink2)">Chỉ <b>người chủ trì</b> ('+esc(tenNS(h.chuTri))+') xác nhận được — kiểm theo người, không theo chức danh.</span>');
 }
 /* L6 · HDDD ①: sửa biên bản đã xác nhận = GỠ XÁC NHẬN trước — việc đã sinh giữ ở M0.2, gắn nhãn «biên bản đang sửa» */
 if(t.k==='xong'&&h.loai!=='ngoai'&&coTheGhiBB(h)) a.push('<button class="btn sm" data-act="goxn">↩ Gỡ xác nhận để sửa biên bản</button>');
 if(t.k==='xong'&&!h.luu&&can('luutru')&&(ql||coTheXN(h))) a.push('<button class="btn sm p" data-act="luu">🗂 Lưu vào Tài liệu lưu trữ</button>');
 if(t.k==='xong'&&coTheGhiBB(h)&&h.loai==='ngoai'&&can('tao')&&(CFG.vaiLoai[role]||[]).length) a.push('<button class="btn sm" data-act="trienkhai">＋ Tạo cuộc họp triển khai lại</button>');
 if(!a.length) a.push('<span style="font-size:12px;color:var(--ink3)">'+(t.k==='huy'?'Cuộc họp đã hủy — không còn thao tác. Bản ghi giữ để tra cứu.':'Không có thao tác nào cho vai này ở trạng thái «'+t.ten+'».')+'</span>');
 return a.join('');
}

/* ══════════════ 🎯 KẾT LUẬN GIAO VIỆC — theo dõi tiến độ NGAY TRONG CUỘC HỌP (YKDD-2E · HDDD ①) ══════════════
   chiToi = true: người thực hiện không có tên trong cuộc họp — chỉ đúng dòng của họ (không lộ biên bản — LH-10). */
function veKetLuan(h,chiToi){
 const m=toi(), ds=(h.kl||[]).filter(k=>!chiToi||(k.nguoi_thuc_hien_id===m&&daSinh(k)));

function fDoi(el){
 if(el.dataset.f){F[el.dataset.f]=el.value;
  if(el.dataset.f==='loiMoi') F.tuSua=1;
  if(el.dataset.f==='cv'&&el.value){const c=cvById(el.value);Object.assign(F,{noi:c.diaChi,donVi:c.noi,ngay:c.ngayHop,gio:c.gio.slice(),ten:F.ten||(s=>s.charAt(0).toUpperCase()+s.slice(1))(c.trich.replace(/^Giấy mời (dự |họp )?/,''))});
   if(!F.noiDung) F.noiDung='Thành phần theo giấy mời: '+c.tp+'.'}
  return !['ten','noiDung','loiMoi','lyDoi','noi','donVi','link'].includes(el.dataset.f)}
 if(el.dataset.fgio){F.gio[+el.dataset.fgio]=el.value;return true}
 if(el.dataset.ftiet){const t=+el.dataset.ftiet;F.tiet=el.checked?F.tiet.concat(t):F.tiet.filter(x=>x!==t);return true}
 if(el.dataset.fall){F.moi.tatCa=el.checked?1:0;return true}
 if(el.dataset.fhdt){F.moi.hdt=el.checked?1:0;return true}
 if(el.dataset.fbch){F.moi.bch=el.checked?el.dataset.fbch:null;return true}
 const tg=(k,v)=>{F.moi[k]=el.checked?F.moi[k].concat(v):F.moi[k].filter(x=>x!==v)};
 if(el.dataset.fto){tg('to',el.dataset.fto);return true}
 if(el.dataset.fcd){tg('cd',el.dataset.fcd);return true}
 if(el.dataset.fdt){tg('dt',el.dataset.fdt);return true}
 if(el.dataset.flap){F.lap=el.checked?1:0;return true}
 if(el.id==='fAddNg'&&el.value){F.moi.ng.push(el.value);return true}
 return false;
}

   :'Vai <b>'+esc(R().cd)+'</b> không gắn một tổ chức — chọn tổ chức của cuộc họp (⏳ P-1).')+'</div>'

  +'<div class="f"><span class="k">Học sinh trong BCH</span><span class="v" style="font-weight:400">'+(hs.length?esc(hs.join(' · '))+'<br><span style="color:var(--ink3);font-size:11.5px">Không có tài khoản ⇒ <b>không mời, không điểm danh theo bản ghi</b> — thư ký ghi dòng chữ trong biên bản.</span>':'—')+'</span></div>'

/* ══════════════ THAO TÁC ══════════════
   ★ Phòng: M6.18 GỬI yêu cầu sang M6.5 và ĐỌC lại trạng thái — không tự giữ phòng (D1).
   ★ Thông báo: mỗi lần mời / nhắc / báo dời / báo hủy là MỘT bản ghi ở M8.1 — không thu hồi được.
   ★ Hệ thống KHÔNG tự gửi gì — nhắc do người tạo bấm (cùng lập luận M6.8 v2.5). */
const LUC=()=>HOMNAY+' '+GIONAY;
let MTB=500;
function guiTB(h,loai,n,trich){const tb={id:'TB-2612-'+(++MTB),luc:LUC(),boi:R().ma,loai,n,trich:trich.slice(0,140)};h.tb.push(tb);return tb}
/* gửi yêu cầu mượn phòng sang M6.5 — tự duyệt khi trống hoàn toàn (M6.5 §2.6), còn lại chờ QL CSVC */
function guiYC(h){
 const v=vuongPhong(h.dd.phong,h.ngay,h.tiet);
 const y={id:'YC-'+(++MYC),phong:h.dd.phong,ngay:h.ngay,tiet:h.tiet.slice(),nguoi:R().ma,md:h.ten,tt:trongHet(v)?'duyet':'cho',hop:h.id,
  vet:[[LUC(),'Gửi yêu cầu — từ cuộc họp '+h.id+' (M6.18)'],[LUC(),trongHet(v)?'Tự duyệt — khung tiết hoàn toàn trống':'Có trùng lịch — chuyển người duyệt xem xét']]};
 YCP.push(y); h.yc=y.id; return y;
}
function huyYC(h,ly){const y=ycById(h.yc); if(y&&['cho','duyet'].includes(y.tt)){y.tt='huy';y.vet.push([LUC(),'Hủy — '+ly+' (M6.18)'])} return y}
function chupDS(h){const ids=nguoiMoi(h.moi,h);h.ds={};ids.forEach(m=>h.ds[m]=m===R().ma?{ph:'du',luc:LUC()}:{ph:'cho'});return ids}

function luuForm(kieu){
 const loi=kiemForm(kieu==='gui');
 if(loi.length){$('#floi').innerHTML='<div class="danger" style="margin-top:10px">⛔ <b>Chưa lưu được — còn thiếu:</b><br>'+loi.map(x=>'• '+esc(x)).join('<br>')+'</div>';$('#floi').scrollIntoView({block:'nearest'});return}
 if(kieu==='doi') return luuDoi();
 if(kieu==='sua'){const h=hopById(F.id);
  const doiTK=h.thuKy!==F.thuKy; Object.assign(h,{ten:F.ten,noiDung:F.noiDung,tl:F.tl,thuKy:F.thuKy||null});
  if(h.tt==='nhap') ganForm(h);
  h.ls.push([LUC(),'Sửa nội dung'+(doiTK?' · đổi thư ký → '+tenNS(h.thuKy):'')+' — không báo lại',R().ma]);closeM();ST.cur=h.id;toast('💾 Đã lưu — không gửi thông báo nào.');render();return}
 /* tạo mới hoặc lưu nháp đang có */
 let hs=[];
 if(F.mode==='sua'){const h=hopById(F.id);ganForm(h);hs=[h]}
 else{
  const ngays=[F.ngay]; if(F.lap){let k=congNgay(F.ngay,7);while(k<=F.lapDen){ngays.push(k);k=congNgay(k,7)}}
  const series=F.lap?'CH-'+(MHOP+1):null;
  ngays.forEach(k=>{const h={id:'HOP-'+p2(++MHOP),tt:'nhap',tao:R().ma,series,ds:{},doi:[],tb:[],diemDanh:null,bb:null,luu:null,ls:[]};ganForm(h);h.ngay=k;HOP.push(h);hs.push(h)});
 }
 const kq=[];
 hs.forEach(h=>{
  if(h.dd.kieu==='phong'&&!h.yc){
   if(phongById(h.dd.phong).tt==='sua'){kq.push([h,'bo','phòng đang sửa']);return}
   const y=guiYC(h); kq.push([h,y.tt,y.id]);
  } else kq.push([h,'-','']);
  h.ls.push([LUC(),(F.mode==='sua'?'Lưu nháp':'Tạo cuộc họp')+(h.yc?' — gửi yêu cầu mượn phòng '+h.yc+' sang M6.5':''),R().ma]);
  if(kieu==='gui'){h.tt='moi';const ids=chupDS(h);guiTB(h,'moi',ids.length,F.tuSua?F.loiMoi:loiMoiMau());h.ls.push([LUC(),'Gửi mời '+ids.length+' người',R().ma])}
 });
 closeM(); ST.tab='hop'; ST.cur=hs[0].id; ST.chip=kieu==='gui'?'sap':'nhap';
 if(hs.length>1){         /* thao tác hàng loạt ⇒ BẢNG KẾT QUẢ, không phải một dòng toast */
  render();
  modal('🔁 Đã tạo chuỗi '+hs.length+' buổi','<table><tr><th>Buổi</th><th>Ngày</th><th>Phòng ở M6.5</th></tr>'+kq.map(([h,t,y])=>
   '<tr class="'+(t==='duyet'?'okrow':t==='cho'?'warnrow':t==='bo'?'badrow':'')+'"><td>'+h.id+'</td><td>'+kThu(h.ngay)+' '+k2s(h.ngay)+'</td><td>'
   +(t==='duyet'?'✅ '+y+' tự duyệt — trống hoàn toàn':t==='cho'?'⏳ '+y+' chờ QL CSVC — '+(()=>{const v=vuongPhong(h.dd.phong,h.ngay,h.tiet,y);return v.tkb.map(x=>'trùng TKB '+x.nd).concat(v.muon.map(x=>'trùng '+x.y.id)).join(', ')})()
    :t==='bo'?'⛔ bỏ qua — phòng đang sửa':'— không qua M6.5')+'</td></tr>').join('')+'</table>',
   '<button class="btn p" data-mb="close">Đóng</button>');
  return;
 }
 const y=hs[0].yc&&ycById(hs[0].yc);
 toast((kieu==='gui'?'📣 Đã gửi mời '+Object.keys(hs[0].ds).length+' người (M8.1).':'💾 Đã lưu nháp — chưa ai nhận được gì.')
  +(y?' Phòng: '+y.id+' '+(y.tt==='duyet'?'<b>tự duyệt</b>':'<b>chờ QL CSVC duyệt</b>')+' ở M6.5.':''));
 render();
}
function ganForm(h){
 if(CFG.loai[F.loai].bch) h.tc=F.tc; else delete h.tc;
 if(!h.kl) h.kl=[];
 Object.assign(h,{loai:F.loai,ten:F.ten,noiDung:F.noiDung,tl:F.tl.slice(),ngay:F.ngay,dd:{kieu:F.kieu,phong:F.phong,noi:F.noi,donVi:F.donVi,link:F.link},
  dt:F.kieu==='phong'||F.kieu==='lamviec'?phongById(F.phong).dt:F.dt,cv:F.cv||null,chuTri:F.chuTri,thuKy:F.thuKy||null,moi:JSON.parse(JSON.stringify(F.moi))});
 if(F.kieu==='phong'||F.kieu==='lamviec'){h.tiet=F.tiet.slice().sort((a,b)=>a-b);delete h.gio}else{h.gio=F.gio.slice();delete h.tiet}
}
function luuDoi(){
 const h=hopById(F.id), cu={ngay:h.ngay,tiet:h.tiet,gio:h.gio,dd:JSON.parse(JSON.stringify(h.dd)),yc:h.yc};
 const doiGio=h.ngay!==F.ngay||String(khoang(h))!==String(khoang(hopNhap()));
 const doiNoi=JSON.stringify(h.dd)!==JSON.stringify({kieu:F.kieu,phong:F.phong,noi:F.noi,donVi:F.donVi,link:F.link});
 if(!doiGio&&!doiNoi){$('#floi').innerHTML='<div class="danger" style="margin-top:10px">⛔ Ngày, giờ và địa điểm đều như cũ — không có gì để dời.</div>';return}
 if(h.yc) huyYC(h,'cuộc họp dời');
 h.yc=null; ganForm(h);
 const y=h.dd.kieu==='phong'?guiYC(h):null;
 h.doi.push({tu:cu,ly:F.lyDoi,luc:LUC(),boi:R().ma});
 if(doiGio) Object.keys(h.ds).forEach(m=>{if(m!==R().ma)h.ds[m]={ph:'cho'}});
 const n=Object.keys(h.ds).length;
 guiTB(h,'doi',n,'Cuộc họp «'+h.ten+'» DỜI sang '+kThu(h.ngay)+' '+k2s(h.ngay)+', '+nhanGio(h)+', '+tenDD(h)+'. Lý do: '+F.lyDoi);
 h.ls.push([LUC(),'Dời '+k2n(cu.ngay)+' → '+k2n(h.ngay)+(doiNoi?' · đổi địa điểm':'')+(cu.yc?' · hủy '+cu.yc:'')+(y?' · gửi '+y.id+' ('+(y.tt==='duyet'?'tự duyệt':'chờ duyệt')+')':''),R().ma],
  [LUC(),'Báo dời tới '+n+' người'+(doiGio?' — phản hồi cũ đặt lại «chưa trả lời»':''),R().ma]);
 closeM(); toast('↻ Đã dời và báo lại '+n+' người.'+(y?' Phòng mới: '+y.id+' '+(y.tt==='duyet'?'tự duyệt':'chờ QL CSVC')+'.':'')); render();
}

 modal('✕ Báo vắng — '+esc(h.ten),'<label class="lbl">Lý do vắng * <span style="font-weight:400">— người tạo và chủ trì đọc được</span></label><textarea class="fldi" id="lyV" rows="3"></textarea>'
  +'<div class="ro" style="margin-top:8px">Vắng có lý do <b>không phải</b> đơn nghỉ phép. Nghỉ cả buổi làm việc thì vẫn làm đơn ở <b>M4.8</b>.</div>',

 mfns.bvang=()=>{const ly=$('#lyV').value.trim();if(ly.length<5){$('#lyV').style.borderColor='var(--red)';toast('⛔ Nêu lý do vắng (ít nhất 5 ký tự).');return}
  h.ds[m]={ph:'vang',ly,luc:LUC()};h.ls.push([LUC(),tenNS(m)+' báo vắng: '+ly,m]);closeM();toast('Đã báo vắng.');render()};
}

/* ── gửi mời một nháp ── */
function guiMoi(h){
 const ids=nguoiMoi(h.moi,h);
 if(!ids.length){toast('⛔ Chưa có ai trong thành phần mời.');return}
 const td=trungDay(h,ids);
 modal('📣 Gửi mời — '+esc(h.ten),'<p>Gửi tới <b>'+ids.length+' người</b> qua M8.1. Sau khi gửi, danh sách mời thành <b>ảnh chụp</b> — thêm người dùng <b>➕ Mời thêm</b>.</p>'
  +(td.length?'<div class="danger">⚠ '+td.length+' người có tiết dạy trùng: '+td.map(x=>esc(tenNS(x.ma))).join(', ')+' — vẫn gửi được.</div>':'')
  +(phongTT(h)&&phongTT(h).y&&phongTT(h).y.tt==='cho'?'<div class="warn">⏳ Phòng '+h.yc+' chưa được duyệt — nếu bị từ chối bạn sẽ phải đổi phòng và báo lại.</div>':'')
  +'<label class="lbl">Nội dung lời mời</label><textarea class="fldi" id="noiMoi" rows="3">'+esc('Kính mời dự '+h.ten+' — '+kThu(h.ngay)+' '+k2s(h.ngay)+', '+nhanGio(h)+', '+tenDD(h)+'.')+'</textarea>'
  +'<div class="ro" style="margin-top:8px">Thông báo đã gửi <b>không thu hồi được</b>.</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="gui">📣 Gửi '+ids.length+' người</button>');
 mfns.bgui=()=>{h.tt='moi';chupDS(h);guiTB(h,'moi',ids.length,$('#noiMoi').value);h.ls.push([LUC(),'Gửi mời '+ids.length+' người',R().ma]);closeM();toast('📣 Đã gửi mời '+ids.length+' người.');render()};
}
/* ── nhắc — người tạo bấm, không có nhắc tự động ── */
function nhac(h){
 const d=demPH(h), cu=h.tb.filter(t=>t.loai==='nhac');
 modal('🔔 Nhắc — '+esc(h.ten),(cu.length?'<div class="warn">Đã nhắc <b>'+cu.length+' lần</b>: '+cu.map(t=>t.luc+' ('+t.n+' người)').join(' · ')+' — tránh nhắc trùng.</div>':'')
  +'<label class="lbl">Nhắc ai</label><label class="kchk"><input type="radio" name="nh" value="cho" checked> Chỉ người <b>chưa trả lời</b> ('+d.cho+')</label>'
  +'<label class="kchk"><input type="radio" name="nh" value="all"> Mọi người <b>trừ người đã báo vắng</b> ('+(d.du+d.cho)+')</label>'
  +'<label class="lbl">Nội dung — bạn tự soạn</label><textarea class="fldi" id="noiNhac" rows="3">'+esc('Nhắc: '+h.ten+' — '+kThu(h.ngay)+' '+k2s(h.ngay)+', '+nhanGio(h)+', '+tenDD(h)+'.')+'</textarea>'
  +dnote('Không có nhắc tự động — cùng lập luận <b>M6.8 v2.5</b>: tin do cấu hình sinh ra không hiện ở khối 📬, không ai là người gửi, và người tổ chức sẽ nhắc tay thêm lần nữa. Dải <b>📅 Sắp diễn ra</b> ở tab 2 là thứ giúp nhớ.'),
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="nhac">🔔 Gửi nhắc</button>');
 mfns.bnhac=()=>{const all=document.querySelector('input[name=nh]:checked').value==='all', n=all?d.du+d.cho:d.cho;
  if(!n){toast('Không có ai để nhắc ở nhóm này.');return}
  guiTB(h,'nhac',n,$('#noiNhac').value);h.ls.push([LUC(),'Nhắc '+n+' người',R().ma]);closeM();toast('🔔 Đã nhắc '+n+' người (M8.1).');render()};
}
function moiThem(h){
 modal('➕ Mời thêm — '+esc(h.ten),'<label class="lbl">Chọn người</label><select class="fldi" id="thNg" multiple size="10">'
  +DSNS.filter(n=>!h.ds[n.ma]).map(n=>'<option value="'+n.ma+'">'+esc(tenDu(n.ma))+'</option>').join('')+'</select>'
  +'<div class="ro" style="margin-top:8px">Chỉ người được thêm nhận lời mời — người đã được mời <b>không nhận lại</b>. Giữ Ctrl để chọn nhiều.</div>',

  closeM();toast('➕ Đã mời thêm '+a.length+' người.'+(td.length?' ⚠ '+td.length+' người trùng tiết dạy.':''));render()};

  +'<label class="lbl">Lý do hủy *'+(daMoi?' <span style="font-weight:400;color:var(--red)">— gửi thẳng tới '+n+' người được mời</span>':'')+'</label><textarea class="fldi" id="lyH" rows="3"></textarea>'
  +(daMoi?'<div class="warn" style="margin-top:8px">📣 Thông báo hủy <b>bắt buộc</b> tới đúng '+n+' người đã nhận lời mời. Khác M6.8 (bỏ tích được): người nhận ở đây là người <b>đã được mời đích danh</b> — không có trường hợp nào không báo mà đúng.</div>':''),

/* ── sau họp ── */
function diemDanh(h){
 const ids=Object.keys(h.ds), cu=h.diemDanh||{};
 const md=m=>cu[m]||(nghiNgay(m,h.ngay)||phCua(h,m)==='vang'?'vangcp':'co');
 modal('🗒 Điểm danh — '+esc(h.ten),'<div class="ro">Điền sẵn: người <b>báo vắng</b> và người có <b>đơn nghỉ có hiệu lực ngày họp (M4.8)</b> → vắng có phép; còn lại → có mặt. Người điểm danh sửa lại theo thực tế.</div>'
  +'<div style="max-height:420px;overflow-y:auto">'+ids.map(m=>'<div class="hsrow"><div class="nm"><b>'+esc(tenNS(m))+'</b><span>'+esc(cdChinh(m))+(phCua(h,m)==='vang'?' · báo vắng: '+esc(h.ds[m].ly):'')+(nghiNgay(m,h.ngay)?' · 🌙 '+nghiNgay(m,h.ngay).loai:'')+'</span></div>'
   +'<div class="tgl">'+[['co','Có mặt'],['vangcp','Vắng có phép'],['vangkp','Vắng không phép']].map(([k,n])=>'<button class="'+(md(m)===k?'on'+(k!=='co'?' v':''):'')+'" data-ddm="'+m+'|'+k+'">'+n+'</button>').join('')+'</div></div>').join('')+'</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="dd">Lưu điểm danh</button>');
 mfns.tmp={};ids.forEach(m=>mfns.tmp[m]=md(m));
 mfns.bdd=()=>{h.diemDanh=Object.assign({},mfns.tmp);const v=Object.values(h.diemDanh);
  h.ls.push([LUC(),'Điểm danh '+v.filter(x=>x==='co').length+'/'+v.length,R().ma]);closeM();toast('Đã lưu điểm danh.');render()};
}
function ghiBB(h){
 const ngoai=h.loai==='ngoai';
 if(!ngoai&&loaiH(h).diemDanh&&!h.diemDanh){
  modal('⛔ Chưa ghi được biên bản','<div class="danger">Biên bản phải ghi <b>thành phần tham dự</b> — cuộc họp <b>'+esc(h.ten)+'</b> <b>chưa điểm danh</b>. Điểm danh trước (một biên bản không có thành phần thì không phải biên bản).</div>',
   '<button class="btn" data-mb="close">Đóng</button><button class="btn p" data-mb="sangdd">🗒 Điểm danh ngay</button>');
  mfns.bsangdd=()=>diemDanh(h);return;
 }
 const b=h.bb||{};
 mfns.tep=b.tep||null;
 const veTep=()=>mfns.tep?'<span class="pill">📄 '+esc(mfns.tep)+'</span> <button class="btn xs" data-bbtep="0">✕ Bỏ tệp</button>':'<button class="btn xs" data-bbtep="1">📎 Tải lên tệp biên bản (scan có chữ ký)</button>';
 modal((ngoai?'📝 Nội dung tiếp thu — ':'📝 Biên bản — ')+esc(h.ten),
  '<label class="lbl">'+(ngoai?'Nội dung tiếp thu':'Diễn biến / nội dung thảo luận')+' <span style="font-weight:400;color:var(--ink3)">— hoặc chỉ tải tệp</span></label><textarea class="fldi" id="bbNd" rows="4">'+esc(b.nd||'')+'</textarea>'
  +'<label class="lbl">'+(ngoai?'Việc cần triển khai lại':'Kết luận')+' *</label><textarea class="fldi" id="bbKl" rows="3">'+esc(b.kl||'')+'</textarea>'
  +(loaiH(h).bch&&h.tc?'<label class="lbl">Thành viên BCH là học sinh <span style="font-weight:400;color:var(--ink3)">— không có tài khoản: không mời, không điểm danh theo bản ghi; ghi dòng chữ (🔗 M6.15 '+BCH[h.tc].nk+')</span></label>'
    +'<textarea class="fldi" id="bbHs" rows="2">'+esc(b.hs!=null?b.hs:bchHS(h.tc).map(x=>x+': có mặt').join(' · '))+'</textarea>':'')
  +'<label class="lbl">Tệp</label><div id="bbTep">'+veTep()+'</div>'
  +(ngoai?'':'<label class="lbl">🎯 Kết luận giao việc <span style="font-weight:400;color:var(--ink3)">— không bắt buộc · mỗi dòng MỘT người thực hiện · sinh vào M0.2 «Việc của tôi» khi chủ trì xác nhận biên bản</span></label><div id="klBox"></div>')
  +(ngoai?'':'<div class="ro" style="margin-top:8px">Lưu xong, biên bản chờ <b>chủ trì '+esc(tenNS(h.chuTri))+'</b> xác nhận. Sửa biên bản sau khi đã xác nhận thì xác nhận bị gỡ — phải xác nhận lại.</div>'),
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="bb">💾 Lưu</button>');
 mfns.veTep=veTep;
 if(!ngoai){mfns.klH=h;mfns.kl=JSON.parse(JSON.stringify(h.kl||[]));mfns.klF={nd:'',ng:[],han:'',cach:'tu_danh_dau'};veKLBox()}
 mfns.bbb=()=>{const nd=$('#bbNd').value.trim(), kl=$('#bbKl').value.trim(), thieu=[];
  if(!kl) thieu.push(ngoai?'Việc cần triển khai lại':'Kết luận');
  if(!nd&&!mfns.tep) thieu.push('Nội dung hoặc tệp biên bản — cần một trong hai');
  if(thieu.length){toast('⛔ Còn thiếu: '+thieu.join(' · '));return}
  if(!ngoai) klDocForm();
  if(!ngoai&&(mfns.klF.nd.trim()||mfns.klF.ng.length)){toast('⛔ Dòng kết luận đang nhập dở — bấm <b>＋ Thêm dòng</b> hoặc xóa nội dung trước khi lưu.');return}
  const coXN=h.bb&&h.bb.xn, hs=$('#bbHs')?$('#bbHs').value.trim():null;
  if(coXN&&!ngoai) ganNhanDangSua(h,'sửa biên bản đã xác nhận');
  h.bb={nd,kl,tep:mfns.tep,boi:R().ma,luc:LUC(),xn:ngoai?{boi:R().ma,luc:LUC()}:null,hs,go:(h.bb||{}).go};
  let bo=0, moi=0;
  if(!ngoai){
   mfns.kl.forEach(k=>{if(k._bo&&daSinh(k)&&!['da_nghiem_thu','huy'].includes(k.trang_thai)){
    k.trang_thai='huy';k.lich_su.push({luc:LUC(),nguoi:R().ma,su_kien:'huy',ly_do:'bỏ khi sửa biên bản'});bo++}delete k._bo});
   moi=mfns.kl.filter(k=>!daSinh(k)).length; h.kl=mfns.kl;
  }
  h.ls.push([LUC(),(ngoai?'Ghi nội dung tiếp thu':'Ghi biên bản')+(!ngoai&&h.kl.length?' — '+moi+' dòng kết luận chưa xác nhận'+(bo?' · hủy '+bo+' việc đã sinh (bỏ khi sửa biên bản)':''):'')+(coXN?' — xác nhận cũ bị gỡ, chờ chủ trì xác nhận lại':''),R().ma]);
  closeM();toast('💾 Đã lưu.'+(bo?' '+bo+' việc đã sinh bị <b>hủy</b> — lý do «bỏ khi sửa biên bản».':'')+(moi?' '+moi+' dòng kết luận sẽ sinh việc khi chủ trì xác nhận.':''));render()};
}
function xacNhan(h){
 const sinhMoi=(h.kl||[]).filter(k=>!daSinh(k)), goNhan=(h.kl||[]).filter(dangSuaBB);
 modal('✓ Xác nhận biên bản — '+esc(h.ten),'<p>Xác nhận nội dung biên bản do <b>'+esc(tenNS(h.bb.boi))+'</b> ghi là đúng diễn biến cuộc họp.</p>'
  +(sinhMoi.length?'<div class="info">🎯 Xác nhận sẽ <b>sinh '+sinhMoi.length+' việc</b> vào M0.2 «Việc của tôi»: '+sinhMoi.map(k=>'<b>'+esc(tenNS(k.nguoi_thuc_hien_id))+'</b> — '+esc(k.noi_dung)+(k.han?' (hạn '+k2n(k.han)+')':'')).join(' · ')+'</div>':'')
  +(goNhan.length?'<div class="ro">↩ '+goNhan.length+' việc đã sinh trước đó được <b>gỡ nhãn «biên bản đang sửa»</b>.</div>':'')
  +(role==='FULL'&&h.chuTri!==R().ma?'<div class="warn">Vai rà soát đang xác nhận <b>thay chủ trì '+esc(tenNS(h.chuTri))+'</b> — hệ thống thật chỉ người chủ trì làm được.</div>':'')
  +'<div class="ro">Không ký số ở menu này — biên bản có chữ ký tay thì tải bản scan lên (điểm ⏳ LH-9).</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn g" data-mb="xn">✓ Xác nhận</button>');
 mfns.bxn=()=>{h.bb.xn={boi:R().ma,luc:LUC()};
  sinhMoi.forEach(k=>{k.nguon_xac_nhan='bien_ban_da_xac_nhan';k.lich_su.push({luc:LUC(),nguoi:R().ma,su_kien:'tao',ly_do:null})});
  goNhan.forEach(k=>{k.nhan=k.nhan.filter(x=>x!=='bien_ban_dang_sua')});
  h.ls.push([LUC(),'Chủ trì xác nhận biên bản'+(sinhMoi.length?' — sinh '+sinhMoi.length+' việc vào M0.2':''),R().ma]);closeM();
  toast('✓ Biên bản đã hoàn tất.'+(sinhMoi.length?' 🎯 Đã sinh <b>'+sinhMoi.length+' việc</b> vào M0.2 của người thực hiện.':''));render()};
}
function luuTru(h){
 const tm=['Đoàn - Đội / Biên bản họp BCH','Biên bản họp › Giao ban BGH','Biên bản họp › Hội đồng sư phạm','Biên bản họp › Hội nghị viên chức','Biên bản họp › Hội đồng trường','Biên bản họp › Chuyên đề','Biên bản họp › Tổ văn phòng','Tài liệu hội nghị cấp trên','Biên bản họp › Khác'];
 modal('🗂 Lưu vào Tài liệu lưu trữ (M6.12) — '+esc(h.ten),'<label class="lbl">Thư mục <span style="font-weight:400">— mặc định theo loại cuộc họp (tab ⚙)</span></label><select class="fldi" id="tmL">'

  +'Ai xem được ở M6.12 do <b>điều kiện hiển thị của thư mục</b> quyết định, không phải danh sách mời — nên kiểm thư mục trước khi lưu biên bản giao ban BGH.</div>'
  +'<div class="ro">Demo M6.12 là tệp riêng — liên kết ghi ở đây, M6.12 chưa hiện nó trong cây thư mục (phiếu mục E).</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="luu">🗂 Lưu liên kết</button>');
 mfns.bluu=()=>{h.luu={thu:$('#tmL').value,luc:LUC(),boi:R().ma,ma:'TL-2612-'+(200+HOP.indexOf(h))};h.ls.push([LUC(),'Lưu liên kết biên bản vào M6.12 › '+h.luu.thu,R().ma]);closeM();toast('🗂 Đã lưu liên kết vào M6.12.');render()};
}

 modal('📤 Xuất lịch công tác tuần '+tuanCua(ST.tuan),'<label class="lbl">Mục đích xuất *</label><select class="fldi" id="mdX"><option value="">— chọn —</option><option>Niêm yết lịch công tác tuần tại phòng hội đồng</option><option>Gửi BGH điểm trường</option><option>Lưu hồ sơ văn thư</option></select>'

/* ══════════════ 🎯 KẾT LUẬN GIAO VIỆC — THAO TÁC (YKDD-2E · HDDD ①) ══════════════ */
/* mục kết luận trong hộp biên bản — sửa trên BẢN SAO (mfns.kl), chỉ ghi vào cuộc họp khi bấm Lưu biên bản */
function veKLBox(){
 const h=mfns.klH, f=mfns.klF, box=$('#klBox'); if(!box) return;
 const ids=Object.keys(h.ds), khac=DSNS.map(n=>n.ma).filter(m=>!ids.includes(m));
 const gy=goiYMenu(f.nd);
 box.innerHTML='<div class="mbox">'
  +(mfns.kl.length?'<table><tr><th>Nội dung</th><th>Người thực hiện</th><th>Hạn</th><th>Cách báo</th><th>Trạng thái</th><th></th></tr>'+mfns.kl.map(k=>{
    const dong=['da_nghiem_thu','huy'].includes(k.trang_thai)&&daSinh(k);
    return '<tr'+(k._bo?' style="text-decoration:line-through;opacity:.6"':'')+'><td>'+esc(k.noi_dung)+'</td><td>'+esc(tenNS(k.nguoi_thuc_hien_id))+'</td><td>'+(k.han?k2n(k.han):'—')+'</td><td style="font-size:11.5px">'+CACH_BAO[k.cach_bao_ket_qua]+'</td>'
     +'<td style="font-size:11.5px">'+(daSinh(k)?TT_KL[k.trang_thai][0]+' <span class="tg b">đã sinh việc</span>':'chưa xác nhận')+'</td><td>'
     +(dong?'<span style="font-size:11px;color:var(--ink3)">đã đóng — giữ</span>'
      :daSinh(k)?'<button class="btn xs'+(k._bo?'':' d')+'" data-klbo="'+k.id+'">'+(k._bo?'↺ Giữ lại':'✕ Bỏ khỏi biên bản')+'</button>'
      :'<button class="btn xs" data-klbo="'+k.id+'">✕ Xóa dòng</button>')+'</td></tr>';
   }).join('')+'</table>'
   +(mfns.kl.some(daSinh)?'<div style="font-size:11.5px;color:var(--ink2);margin:4px 0">Dòng <b>đã sinh việc</b> không sửa tại chỗ — việc đang nằm ở M0.2 của người ta; đổi nội dung âm thầm là đổi việc người ta đang làm. Muốn đổi: <b>bỏ</b> dòng cũ (hủy, lý do «bỏ khi sửa biên bản») rồi <b>thêm</b> dòng mới.</div>':'')
   :'<div style="font-size:12px;color:var(--ink3);margin-bottom:6px">Chưa có dòng nào.</div>')
  +'<div class="frow"><div style="flex:2"><label class="lbl">Nội dung việc</label><textarea class="fldi" rows="2" id="klNd">'+esc(f.nd)+'</textarea>'
  +(gy.length?'<div style="font-size:11.5px;color:var(--amber)">💡 Việc này có menu chủ: '+gy.map(g=>'<b>'+g[1]+'</b> '+esc(g[2])).join(' · ')+' — vẫn thêm được (DD-4: gợi ý, không chặn).</div>':'')+'</div>'
  +'<div><label class="lbl">Người thực hiện <span style="font-weight:400">(Ctrl — chọn nhiều ⇒ mỗi người một dòng)</span></label><select class="fldi" id="klNg" multiple size="5">'
  +'<optgroup label="Có tên trong cuộc họp">'+ids.map(m=>'<option value="'+m+'"'+(f.ng.includes(m)?' selected':'')+'>'+esc(tenDu(m))+'</option>').join('')+'</optgroup>'
  +'<optgroup label="Nhân sự khác (người phụ trách có tài khoản)">'+khac.map(m=>'<option value="'+m+'"'+(f.ng.includes(m)?' selected':'')+'>'+esc(tenDu(m))+'</option>').join('')+'</optgroup></select></div></div>'
  +'<div class="frow"><div><label class="lbl">Hạn <span style="font-weight:400">(để trống = không có hạn)</span></label><input type="date" class="fldi" id="klHan" value="'+f.han+'"></div>'
  +'<div><label class="lbl">Cách báo kết quả</label><select class="fldi" id="klCach">'+Object.keys(CACH_BAO).map(c=>'<option value="'+c+'"'+(f.cach===c?' selected':'')+'>'+CACH_BAO[c]+'</option>').join('')+'</select></div>'
  +'<div style="align-self:flex-end"><button class="btn sm p" data-klthem="1">＋ Thêm dòng</button></div></div>'
  +'<div style="font-size:11.5px;color:var(--ink3);margin-top:4px">Giao cho <b>đơn vị</b> hoặc <b>học sinh</b> thì ghi <b>người phụ trách có tài khoản</b> — việc phải về «Việc của tôi» của một người cụ thể.</div></div>';
}
function klDocForm(){const f=mfns.klF;if(!$('#klNd'))return;f.nd=$('#klNd').value;f.ng=[...$('#klNg').selectedOptions].map(o=>o.value);f.han=$('#klHan').value;f.cach=$('#klCach').value}
function klThem(){
 klDocForm(); const f=mfns.klF, h=mfns.klH, thieu=[];
 if(!f.nd.trim()) thieu.push('Nội dung việc'); if(!f.ng.length) thieu.push('Người thực hiện');
 if(f.han&&f.han<h.ngay) thieu.push('Hạn trước ngày họp ('+k2s(f.han)+')');
 if(thieu.length){toast('⛔ Còn thiếu: '+thieu.join(' · '));return}
 const nhom='N-'+(++MNHOM);
 f.ng.forEach(m=>mfns.kl.push(klMoi(h,{nhom_id:nhom,noi_dung:f.nd.trim(),nguoi_thuc_hien_id:m,han:f.han||null,cach_bao_ket_qua:f.cach})));
 toast('＋ Thêm '+f.ng.length+' dòng'+(f.ng.length>1?' cùng nhóm '+nhom+' — mỗi người một việc riêng, báo và nghiệm thu riêng':'')+'.');
 mfns.klF={nd:'',ng:[],han:f.han,cach:f.cach}; veKLBox();
}
function klBo(id){
 klDocForm(); const i=mfns.kl.findIndex(k=>k.id===id), k=mfns.kl[i]; if(!k) return;
 if(daSinh(k)) k._bo=!k._bo; else mfns.kl.splice(i,1);
 veKLBox();
}
/* gỡ xác nhận — dòng đã sinh GIỮ, gắn nhãn bien_ban_dang_sua (HDDD ①) */
function ganNhanDangSua(h,ly){
 (h.kl||[]).filter(k=>daSinh(k)&&k.trang_thai!=='huy').forEach(k=>{
  if(!k.nhan.includes('bien_ban_dang_sua')) k.nhan.push('bien_ban_dang_sua');
  k.lich_su.push({luc:LUC(),nguoi:R().ma,su_kien:'go_xac_nhan_bien_ban',ly_do:ly});
 });
}
function goXacNhan(h){
 const n=(h.kl||[]).filter(k=>daSinh(k)&&k.trang_thai!=='huy').length;
 modal('↩ Gỡ xác nhận biên bản — '+esc(h.ten),'<div class="warn">Biên bản trở về <b>Chờ chủ trì xác nhận</b>; chủ trì <b>'+esc(tenNS(h.chuTri))+'</b> phải xác nhận lại.</div>'
  +(n?'<div class="ro">🎯 <b>'+n+' việc</b> đã sinh từ kết luận <b>giữ nguyên</b> ở M0.2 của người thực hiện, gắn nhãn <b>«biên bản đang sửa»</b>. Dòng bạn bỏ khi sửa sẽ bị hủy; dòng mới chỉ sinh khi xác nhận lại.</div>':'')
  +'<label class="lbl">Lý do gỡ xác nhận *</label><textarea class="fldi" id="lyGo" rows="2"></textarea>',
  '<button class="btn" data-mb="close">Không gỡ</button><button class="btn p" data-mb="goxn">↩ Gỡ xác nhận</button>');

 if((x=g('data-fngx'))){F.moi.ng=F.moi.ng.filter(m=>m!==x.dataset.fngx);veForm();return}

 if((x=g('data-ftlx'))){F.tl.splice(+x.dataset.ftlx,1);veForm();return}

 if((x=g('data-ftc'))){if(x.disabled)return;F.tc=x.dataset.ftc;F.moi.bch=F.tc;F.chuTri=NS[R().ma]?R().ma:(F.tc==='Doan'?'trung':'ngoc');veForm();return}

 if(g('data-kltep')){mfns.klTep.push(['Minh-chung-hoan-thanh.pdf','Anh-hien-truong.jpg','Bao-cao-ket-qua.docx'][mfns.klTep.length%3]);$('#klTepBox').innerHTML=mfns.veKlTep();return}
 if((x=g('data-bbtep'))){mfns.tep=x.dataset.bbtep==='1'?'Bien-ban-hop-scan.pdf':null;$('#bbTep').innerHTML=mfns.veTep();return}
 if((x=g('data-ddm'))){const[m,k]=x.dataset.ddm.split('|');mfns.tmp[m]=k;x.parentNode.querySelectorAll('button').forEach(b=>{b.className=b===x?'on'+(k!=='co'?' v':''):''});return}
 /* điều hướng */
 if((x=g('data-chuadung'))){e.preventDefault();toast('↗ '+x.title+' — <b>'+x.dataset.chuadung+'</b> đang dựng song song (phiên P3), deep-link ghi sẵn theo D3.');return}
 if((x=g('data-sangtab'))){closeM();ST.tab='hop';ST.cur=x.dataset.sangtab;const h=hopById(ST.cur);if(!locChip(h,ST.chip))ST.chip='all';render();return}
 if((x=g('data-ph'))){const[id,ph]=x.dataset.ph.split('|');closeM();phanHoi(id,ph);return}
 if((x=g('data-kl'))){const[a,hid,kid]=x.dataset.kl.split('|'), h=hopById(hid), k=h&&h.kl.find(y=>y.id===kid);closeM();if(!k)return;
  ({bao:()=>klBao(h,k),nt:()=>klNghiemThu(h,k),tl:()=>klLyDo(h,k,'tl'),huy:()=>klLyDo(h,k,'huy')})[a]();return}
 if((x=g('data-klls'))){ST.klLS=ST.klLS===x.dataset.klls?null:x.dataset.klls;if(ST.tab==='hop')render();else if(MODAL_HOP)moHop(MODAL_HOP.id);return}
 if((x=g('data-momuc'))){ST.tab='hop';ST.cur=x.dataset.momuc;ST.chip='all';ST.muc='ket_luan';closeM();render();cuonKL();return}
 if((x=g('data-act'))){const h=ST.tab==='hop'&&ST.cur?hopById(ST.cur):MODAL_HOP;thaoTac(x.dataset.act,h);return}
 if((x=g('data-ev'))){MODAL_HOP=hopById(x.dataset.ev);moHop(x.dataset.ev);return}
 if((x=g('data-pj'))){moPJ(x.dataset.pj);return}
 if((x=g('data-mo'))){ST.muc=null;MODAL_HOP=hopById(x.dataset.mo);if(ST.tab!=='hop'){ST.tab='hop'};ST.cur=x.dataset.mo;const h=hopById(ST.cur);if(!locChip(h,ST.chip))ST.chip='all';closeM();render();return}
 if(g('data-close')){ST.cur=null;render();return}
 if((x=g('data-chip'))){ST.chip=x.dataset.chip;render();return}
 if((x=g('data-dsloc'))){ST.dsLoc=x.dataset.dsloc;if(ST.tab==='hop')render();else moHop(MODAL_HOP.id);return}
 if((x=g('data-tuan'))){const n=+x.dataset.tuan;ST.tuan=n?congNgay(ST.tuan,n):dauTuan(HOMNAY);render();return}
 if((x=g('data-nguon'))){const k=x.dataset.nguon;ST.nguon[k]=ST.nguon[k]?0:1;render();return}
 if((x=g('data-tao'))){fMoi('tao');return}
 if(g('data-xuat')){xuatLich();return}
 if((x=g('data-xemtl'))||(x=g('data-xembb'))){toast('👁 Mở tệp ngay trong màn hình — lượt xem ghi audit.');return}
 if((x=g('data-taitl'))||(x=g('data-taibb'))){toast('⬇ Tải tệp — lượt tải ghi audit.');return}
});
/* ô nhập của form: select / checkbox / date vẽ lại ngay; ô chữ chỉ ghi vào F */
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.vl){const[v,k]=el.dataset.vl.split('|');CFG.vaiLoai[v]=el.checked?CFG.vaiLoai[v].concat(k):CFG.vaiLoai[v].filter(x=>x!==k);toast('Đã lưu: '+ROLES[v].cd+' '+(el.checked?'tạo được':'không tạo được')+' «'+CFG.loai[k].ten+'».');return}
 if(!F||!$('#mask').classList.contains('on')) return;
 if(fDoi(el)) veForm();
});
document.addEventListener('input',e=>{
 const el=e.target; if(!F||!el.dataset||!el.dataset.f) return;
 if(['ten','noiDung','loiMoi','lyDoi','noi','donVi','link'].includes(el.dataset.f)) fDoi(el);
});
$('#hdt').onchange=e=>{ST.dt=e.target.value;render()};
/* deep-link D3: ?ctx=HOP-xx&return=… · ?action=tao&cv=CVD-… (từ M6.9) · ?vai=…
   YKDD-2E: ?tab=cuoc_hop&ctx=HOP-xx&muc=ket_luan&return=M0.2 — việc từ kết luận ở M0.2 mở thẳng khối 🎯 của cuộc họp.
   &nhin=<mã nhân sự> — CHỈ cho vai rà soát (Đủ quyền): nhìn dưới góc nhìn người thực hiện; hệ thống thật là chính người đăng nhập. */
function cuonKL(){const el=$('#mucKL');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'})}
(function moTuLienKet(){
 if(QS.get('return')) ST.ret=QS.get('return');
 if(role==='FULL'&&QS.get('nhin')&&NS[QS.get('nhin')]) ST.nhin=QS.get('nhin');
 const tb={cuoc_hop:'hop',lich_hop:'lich',cau_hinh:'ch'}[QS.get('tab')]; if(tb) ST.tab=tb;
 const cx=QS.get('ctx');
 if(cx&&hopById(cx)&&hopTrongPV(hopById(cx))){ST.tab='hop';ST.cur=cx;ST.chip='all';if(QS.get('muc')==='ket_luan')ST.muc='ket_luan'}
 render();
 if(ST.muc==='ket_luan') cuonKL();
 if(QS.get('action')==='tao'&&can('tao')){
  const cv=QS.get('cv'); fMoi('tao',null,cv&&cvById(cv)?{loai:'ngoai',kieu:'ngoai'}:{});
  if(cv&&cvById(cv)){const el={dataset:{f:'cv'},value:cv};fDoi(el);veForm()}
 }
})();
