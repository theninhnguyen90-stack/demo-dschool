<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2.1 Lịch dạy &amp; học — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.lockwrap{position:relative;display:inline-flex;align-items:center;gap:5px}
.lockwrap .lk{font-size:11px;color:var(--ink3)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:8px 12px;border-radius:9px;font-size:12.5px;margin:11px 0;display:flex;gap:8px;align-items:flex-start}
.scopebar code{background:#e0e7ff;padding:0 4px;border-radius:3px;font-size:11.5px}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:6px}
.rolnk:hover{background:#e0e7ff}
.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.alert{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600}
.alert .sp{flex:1}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}

/* dai THAY DOI TREN LICH — F2 */
.chg{border:1px solid #fde68a;background:var(--amber-soft);border-radius:11px;margin-bottom:12px;overflow:hidden}
.chgh{display:flex;align-items:center;gap:9px;padding:9px 13px;font-size:12.5px;font-weight:700;color:#92400e;cursor:pointer}
.chgh .sp{flex:1}
.chgb{border-top:1px solid #fde68a;background:#fff}
.chgr{display:flex;gap:11px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center;cursor:pointer}
.chgr:last-child{border-bottom:none}
.chgr:hover{background:var(--brand-soft)}
.chgr .k{flex:0 0 138px}
.chgr .bd{flex:1;min-width:0}
.chgr .bd b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chgr .bd .ly{color:var(--ink2);font-size:11.5px;margin-top:2px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chgr .who{flex:0 0 178px;text-align:right;color:var(--ink3);font-size:11px;line-height:1.35}
.chgf{padding:8px 13px;font-size:11.5px;color:var(--ink3);background:#f8fafc;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* thanh dieu huong lich */
.navbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 11px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 13px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.wk{font-size:13.5px;font-weight:700;min-width:210px;text-align:center}
.sumbar{display:flex;gap:0;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.sumbar .it{padding:9px 15px;border-right:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.sumbar .it b{display:block;font-size:17px;color:var(--ink);font-weight:700;line-height:1.25}
.sumbar .it.w b{color:var(--amber)}.sumbar .it.r b{color:var(--red)}.sumbar .it.g b{color:var(--green)}
.sumbar .it.v b{color:var(--violet)}

/* san khau: luoi + panel */
.stage{display:flex;gap:13px;align-items:flex-start}
.gridw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage.open .gridw{flex:1 1 0}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .gridw{display:none}.stage.open .panel{flex:1}}

/* luoi tuan */
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);background:#f8fafc;text-align:center;vertical-align:middle}
.cal th.today{background:var(--brand-soft);color:var(--brand)}
.cal th .dd{display:block;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:2px}
.cal th.today .dd{color:var(--brand)}
.cal th.rowh,.cal td.rowh{width:64px;background:#f8fafc;border-right:1px solid var(--line);text-align:center;font-size:10.5px;color:var(--ink3);font-weight:700;padding:6px 3px;vertical-align:middle}
.cal td.rowh .gio{display:block;font-weight:400;font-size:9.5px;margin-top:2px;color:var(--ink3)}
.cal td{border-bottom:1px solid var(--line);border-right:1px solid #f1f5f9;padding:4px;vertical-align:top;height:62px}
.cal td.today{background:#fbfdff}
.cal tr.sep td,.cal tr.sep th{border-bottom:2px solid var(--line2)}
.buoi{background:#f8fafc;font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:4px 9px !important;height:auto !important}

/* the tiet */
.tt{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:7px;padding:5px 7px;font-size:11.5px;cursor:pointer;background:#fff;height:100%;overflow:hidden;position:relative}
.tt:hover{background:var(--brand-soft);border-color:var(--brand)}
.tt.on{background:#dbeafe;border-color:var(--brand);box-shadow:0 0 0 2px #bfdbfe}
.tt b{display:block;font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt .sub{color:var(--ink3);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt.dd{opacity:.68}
.tt.thay{border-left-color:var(--violet);background:#faf5ff}
.tt.bithay{border-left-color:var(--ink3);background:#f8fafc;opacity:.75}
.tt.bu{border-left-color:var(--green);background:var(--green-soft)}
.tt.doi{border-left-color:var(--amber);background:var(--amber-soft)}
.tt.noGV{border-left-color:var(--red);background:var(--red-soft)}
.cell-nghi{border-radius:7px;height:100%;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink3);
 background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 6px,#e2e8f0 6px,#e2e8f0 12px);cursor:pointer;border:1px solid var(--line)}
.cell-nghi:hover{outline:2px solid var(--line2)}
.cell-huy{border:1px solid #fecaca;border-left:3px solid var(--red);border-radius:7px;padding:5px 7px;font-size:11.5px;background:var(--red-soft);cursor:pointer;height:100%;overflow:hidden}
.cell-huy b{display:block;font-size:12px;text-decoration:line-through;color:#991b1b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-huy .sub{color:#b91c1c;font-size:10px}
.mk{position:absolute;top:3px;right:4px;font-size:9.5px;font-weight:700;padding:0 4px;border-radius:4px;line-height:14px}
.mk.v{background:#ede9fe;color:#5b21b6}.mk.a{background:#fef3c7;color:#92400e}
.mk.g{background:#d1fae5;color:#065f46}.mk.r{background:#fee2e2;color:#991b1b}
.mk.n{background:var(--bg);color:var(--ink2)}

/* view ngay */
.daylist{padding:0}
.drow{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.drow:hover{background:var(--brand-soft)}
.drow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.drow .tm{flex:0 0 74px;text-align:center;font-size:11px;color:var(--ink3)}
.drow .tm b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.drow .bd{flex:1;min-width:0}
.drow .bd b{font-size:13.5px}
.drow .bd .sub{font-size:11.5px;color:var(--ink3)}
.drow .rt{flex:0 0 auto;display:flex;gap:6px;align-items:center}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

/* panel */
.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph .n{flex:1;min-width:0}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:14px 15px;max-height:calc(100vh - 220px);overflow-y:auto}
.f{display:grid;grid-template-columns:132px 1fr;gap:11px;align-items:start;padding:7px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.hl{border-color:#fde68a}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.card.hl .ch{background:var(--amber-soft);border-bottom-color:#fde68a;color:#92400e}
.ch .sp{flex:1}
.cb{padding:4px 12px}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.r::before{background:var(--red)}.logi.v::before{background:var(--violet)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
table.tb td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb tr:last-child td{border-bottom:none}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:210px;max-height:260px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:13px;font-size:11px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="GVBM">GVBM</button>
  <button class="rb" data-r="GVCN">GVCN</button>
  <button class="rb" data-r="TTCM">TTCM</button>
  <button class="rb" data-r="VT">VT</button>
  <button class="rb" data-r="PHT_DT">PHT_DT</button>
  <button class="rb" data-r="PHT_CM">PHT_CM</button>
  <button class="rb" data-r="HT">HT</button>
  <span class="note">Menu CHỈ ĐỌC 100% — không tạo, không sửa, không xác nhận · PH và HS dùng App riêng</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel"><option>Năm học 2026-2027</option></select>
  <span class="lockwrap"><select class="sel" id="hdt"></select><span class="lk" id="lk"></span></span>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot" id="bell">3</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">NH</div>
</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Lịch dạy &amp; học</h1><div class="spacer"></div>
      <button class="btn" data-x="xuat">⬇ Xuất lịch</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= NGU CANH THOI GIAN =================
   Hom nay = Thu Tu 26/8/2026 · Tuan 2 nam hoc 2026-2027 (24/8 - 30/8) */

    out.push({k,t:x,luc:x.luc,boi:x.boi,ly:x.ly});
  }
 });
 const ng=L.filter(x=>x.tt==='nghi');
 [...new Set(ng.map(x=>x.d))].forEach(d=>{
   const cs=ng.filter(x=>x.d===d);
   out.push({k:'nghi',t:cs[0],gop:cs.length,luc:LUCNGHI,boi:'Nguyễn Thị Bích (PHT_DT)',ly:LYNGHI});
 });
 return out.sort((a,b)=>String(b.luc||'').localeCompare(String(a.luc||'')));
}

/* ================= NHAN & TRANG THAI ================= */
function nhan(x){
 const g=me();
 if(x.tt==='huy') return ['✕ Hủy','r'];
 if(x.tt==='nghi')return ['Nghỉ','n'];
 if(x.ng==='bu')  return ['➕ Dạy bù','g'];
 if(x.ng==='doi') return ['⇄ Đã đổi','a'];
 if(x.ng==='thay'){
   if(g&&x.gvg===g&&x.gv!==g) return ['🔁 Bị dạy thay','n'];
   if(!x.gv) return ['⛔ Chưa có GV','r'];
   return ['🔁 Dạy thay','v'];
 }
 return null;
}
const nhanCls=c=>c==='v'?'v':c==='r'?'r':c==='g'?'o':c==='a'?'w':'n';
function ttSo(x){
 if(x.tt==='nghi'||x.tt==='huy') return null;
 const qua = x.d<HOMNAY || (x.d===HOMNAY && GIO[x.t].slice(8) < GIONAY);
 if(x.so==='ky') return ['✓ Đã ký sổ'+(x.soAt&&x.soAt!=='—'?' '+x.soAt:''),'o'];
 if(qua) return ['⛔ Quá giờ, chưa ký sổ','r'];
 return ['Chưa ký sổ','n'];
}
const laTuong=x=>x.d>HOMNAY||(x.d===HOMNAY&&GIO[x.t].slice(0,5)>GIONAY);
const canVao=x=>{const g=me();return !!g&&x.gv===g&&x.tt!=='nghi'&&x.tt!=='huy'};

 let al='';
 if(dh){

 }

 `<div class="chips">${r.truc.map(k=>`<button class="chip ${truc===k?'on':''}" data-truc="${k}">${trucs[k][0]} ${trucs[k][1]}</button>`).join('')}

 (truc==='gv'?`<div class="ro">Trục này là <b>công cụ chuẩn bị cho việc đổi tiết</b>: khi giáo viên báo đã thỏa thuận xong,

   M2.1 là màn hình <b>tra cứu</b>, M4.7 là màn hình <b>thao tác</b>.</div>`:'')+
 (r.truc.length===1?`<div class="ro">Vai trò <b>${esc(r.cd)}</b> chỉ có <b>trục Phòng</b>, và

 navbar()+ tcBody(L);

function tcBody(L){
 const key=truc==='lop'?(x=>x.lop):truc==='gv'?(x=>x.gv||'__'):(x=>x.phong);

 const label=k=>truc==='gv'?(k==='__'?'⛔ Chưa có giáo viên':GV[k].n+' · '+GV[k].m)
             :truc==='lop'?('Lớp '+k+' · '+DTTEN[LOP[k]]):('Phòng '+k);
 if(!keys.length) return `<div class="gridw"><div class="empty">Không có tiết nào trong phạm vi.</div></div>`;
 return `<div class="stage ${cur?'open':''}"><div class="gridw">`+
  keys.map(k=>{
   const rows=L.filter(x=>key(x)===k);
   return `<div class="ch"><span>${esc(label(k))}</span><span class="sp"></span>
     <span style="font-weight:400;color:var(--ink3);font-size:11.5px">${rows.length} tiết/tuần</span></div>
    <div style="padding:7px 10px 11px">${miniWeek(rows)}</div>`}).join('')+
  `</div>`+(cur?panelHTML():'')+`</div>`;
}
function miniWeek(rows){
 return `<table class="cal"><tr>${DOWS.map((d,i)=>`<th class="${i===HOMNAY?'today':''}">${d} <span class="dd">${NGAY[i]}</span></th>`).join('')}</tr>
  <tr>${DOWS.map((_,i)=>{
    const cs=rows.filter(x=>x.d===i).sort((a,b)=>a.t-b.t);
    return `<td class="${i===HOMNAY?'today':''}" style="height:auto">${cs.length?cs.map(x=>cell(x,1)).join(''):'<span style="color:var(--ink3);font-size:11px">—</span>'}</td>`;
  }).join('')}</tr></table>`;
}

function filterBar(lopAll,monAll){

 return `<div class="navbar" style="padding-top:0">

   ${ms('mon','Môn',fMON,monAll.map(x=>[x,x]))}
   ${ms('hien','Hiển thị',fHIEN,[['nghi','Tiết nghỉ'],['huy','Tiết bị hủy'],['bithay','Tiết tôi bị dạy thay']])}
   <span style="font-size:11.5px;color:var(--ink3)">Tiết nghỉ và tiết hủy <b>mặc định bật</b> — ẩn đi thì ô trống rỗng không phân biệt được với "không có tiết"</span>
 </div>`;

function applyF(L){
 let r=L.slice();
 if(fLOP.size) r=r.filter(x=>fLOP.has(x.lop));
 if(fMON.size) r=r.filter(x=>fMON.has(x.mon));
 if(!fHIEN.has('nghi')) r=r.filter(x=>x.tt!=='nghi');
 if(!fHIEN.has('huy'))  r=r.filter(x=>x.tt!=='huy');
 if(!fHIEN.has('bithay'))r=r.filter(x=>!(x.gvg===me()&&x.gv!==me()));
 return r;
}

/* ---------- san khau tab 1 ---------- */
function stage(L){
 const open=!!cur;
 const grid=(view==='ngay'||open&&view==='tuan')?dayCol(L):weekGrid(L);
 return `<div class="stage ${open?'open':''}"><div class="gridw">${grid}</div>${open?panelHTML():''}</div>`;
}
function weekGrid(L){
 let h=`<table class="cal"><tr><th class="rowh">Tiết</th>${DOWS.map((d,i)=>
   `<th class="${i===HOMNAY?'today':''}">${d}<span class="dd">${NGAY[i]}</span></th>`).join('')}</tr>`;
 TIETS.forEach(t=>{
  if(t===1) h+=`<tr><td class="buoi" colspan="7">Buổi sáng</td></tr>`;
  if(t===6) h+=`<tr><td class="buoi" colspan="7">Buổi chiều</td></tr>`;
  h+=`<tr class="${t===5?'sep':''}"><td class="rowh">${t}<span class="gio">${GIO[t].replace(' – ','<br>')}</span></td>`;
  DOWS.forEach((_,i)=>{
   const x=L.find(y=>y.d===i&&y.t===t);
   h+=`<td class="${i===HOMNAY?'today':''}">${x?cell(x):''}</td>`;
  });
  h+=`</tr>`;
 });
 return h+`</table>`+legend();
}
function dayCol(L){
 const rows=L.filter(x=>x.d===curDay).sort((a,b)=>a.t-b.t);
 return `<div class="ch"><button class="btn xs" data-x="prevd">‹</button>
   <span>${DOW[curDay]} ${NGAY[curDay]}${curDay===HOMNAY?' · hôm nay':''}</span>
   <button class="btn xs" data-x="nextd">›</button><span class="sp"></span>
   <span style="font-weight:400;color:var(--ink3);font-size:11.5px">${rows.length} tiết</span></div>
  <div class="daylist">${rows.length?rows.map(x=>drow(x)).join('')
    :'<div class="empty">Không có tiết nào trong ngày này.</div>'}</div>`+legend();
}
function drow(x){
 const n=nhan(x), s=ttSo(x), dt=LOP[x.lop];
 return `<div class="drow ${cur===x.id?'on':''}" data-t="${x.id}">
  <div class="tm"><b>Tiết ${x.t}</b>${GIO[x.t]}</div>
  <div class="bd"><b>${esc(x.mon)} · ${esc(x.lop)}</b>
   <div class="sub">Phòng ${esc(x.phong)} · ${DTTEN[dt]}${x.gv&&x.gv!==me()?' · '+esc(GV[x.gv].n):''}</div></div>
  <div class="rt">
   ${n?`<span class="st2 ${nhanCls(n[1])}">${n[0]}</span>`:''}
   ${s?`<span class="st2 ${s[1]}">${s[0]}</span>`:''}
   ${canVao(x)&&x.tt==='dk'&&x.d===HOMNAY?`<button class="btn sm p" data-vao="${x.id}">▶ Vào tiết</button>`:''}</div></div>`;
}
function cell(x,mini){
 if(x.tt==='nghi') return `<div class="cell-nghi" data-t="${x.id}">NGHỈ</div>`;
 if(x.tt==='huy') return `<div class="cell-huy ${cur===x.id?'on':''}" data-t="${x.id}">
    <b>${esc(x.mon)} · ${esc(x.lop)}</b><div class="sub">✕ Hủy · ${esc(x.xuly||'')}</div></div>`;
 const n=nhan(x);
 let cls='tt';
 if(me()&&x.gvg===me()&&x.gv!==me()) cls+=' bithay';
 else if(!x.gv) cls+=' noGV';
 else if(x.ng==='thay') cls+=' thay';
 else if(x.ng==='bu') cls+=' bu';
 else if(x.ng==='doi') cls+=' doi';
 if(x.tt==='dd') cls+=' dd';
 if(cur===x.id) cls+=' on';
 const who = mini ? (x.gv?GV[x.gv].n:'⛔ chưa có GV') : ('P.'+x.phong+(LOP[x.lop]!=='A'?' · ĐT B':''));
 return `<div class="${cls}" data-t="${x.id}">
   ${n?`<span class="mk ${n[1]}">${n[0].split(' ')[0]}</span>`:''}
   <b>${esc(mini?x.mon+' '+(truc==='lop'?'':x.lop):x.mon)}</b>
   <div class="sub">${esc(mini?who:x.lop)}</div>
   <div class="sub">${esc(mini?'P.'+x.phong:who)}</div></div>`;
}

/* ---------- PANEL chi tiet tiet ---------- */

 let acts=[];
 if(x.tt==='nghi'){acts=[];}
 else if(x.tt==='huy'){ if(R().m46==='full') acts.push(['m46','↗ Xếp dạy bù tại M4.7','']); }
 else if(biThay){ acts.push(['xemso','📖 Xem sổ đầu bài','']); }
 else if(laToi){
   if(x.tt==='dd'||x.d===HOMNAY) acts.push(['vao','▶ Vào tiết','p']);
   if(x.tt==='dd') acts.push(['xemcc','👥 Xem chuyên cần tiết','']);
   if(laTuong(x)) acts.push(['kh','📖 Xem kế hoạch bài dạy','']);
 }else{ acts.push(['xemso','📖 Xem sổ đầu bài (chỉ đọc)','']); }

 const canNot = (!me())?'Vai trò này <b>không lên lớp</b> — chỉ xem, không có nút vào tiết.'
   :biThay?'Quyền ghi sổ và điểm danh thuộc <b>giáo viên thực dạy</b> — bạn xem được nhưng không ký được.'
   :(x.tt==='nghi')?'Tiết nghỉ <b>không sinh bản ghi sổ đầu bài và không sinh điểm danh</b>, nên không có gì để mở.'
   :(x.tt==='huy')?'Tiết bị hủy <b>không sinh bản ghi sổ đầu bài</b>.'
   :(!laToi)?'Bạn không dạy tiết này.':'';

 return `<div class="panel"><div class="ph">
   <div class="n"><h2>${esc(x.mon)} · Lớp ${esc(x.lop)}</h2>
    <div class="m"><span class="pill">${DOW[x.d]} ${NGAY[x.d]}/2026</span>

   <div class="ro">🔗 <b>Bản chiếu chỉ đọc từ M4.7 Lịch giảng dạy &amp; Dạy thay.</b>
     Menu này không sinh lịch, không sửa lịch, không xếp dạy thay, <b>không tạo đề nghị đổi tiết</b>.
     Thao tác ghi duy nhất của toàn Menu là <b>xác nhận hoặc từ chối lời mời dạy thay</b>.</div>

     ${doiUng?`<div class="f"><div class="k">Tiết đối ứng</div><div class="v">

    </div>

      <b>Việc nhờ dạy thay thỏa thuận ngoài hệ thống.</b> Giáo viên nghỉ hỏi trước đồng nghiệp; đồng ý rồi mới

   ${!x.gv?`<div class="danger">⛔ <b>Tiết chưa có giáo viên.</b> ${esc(x.ly||'')}

   <div class="card"><div class="ch">Giáo viên và nguồn tiết</div><div class="cb">

    <div class="f"><div class="k">Nguồn tiết</div><div class="v">${
      {tkb:'TKB — sinh từ thời khóa biểu đang áp dụng',thay:'Dạy thay',doi:'Đổi tiết — thao tác tại M4.7',bu:'Dạy bù',tay:'Thêm thủ công'}[x.ng]}</div></div>
    ${x.ng!=='tkb'&&x.ng!=='doi'?`<div class="f"><div class="k">Lý do thay đổi</div><div class="v" style="font-weight:400">${esc(x.ly||'—')}</div></div>
      <div class="f"><div class="k">Người thực hiện</div><div class="v" style="font-weight:400">${esc(x.boi||'—')} · ${esc(x.luc||'—')}</div></div>`:''}

     <div class="f"><div class="k">Điểm danh tiết</div><div class="v" style="font-weight:400">${

/* ================= MODAL & TOAST ================= */
let mfns={};
function modal(title,body,btns){
 $('#mh').innerHTML=title; $('#mb').innerHTML=body;
 mfns={};
 $('#mf').innerHTML=btns.map((b,i)=>{
   const t=b[0], fn=b[1];
   if(fn) mfns['b'+i]=fn;
   const cls=typeof fn==='function'?(t.indexOf('✕')===0?'d':'p'):'';
   return `<button class="btn ${cls}" data-mb="${fn?'b'+i:''}">${t}</button>`}).join('');
 $('#mask').classList.add('on');
}
const closeM=()=>$('#mask').classList.remove('on');
let tmr;
function toast(t){const el=$('#toast');el.innerHTML=t;el.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>el.classList.remove('on'),4200)}

/* ================= WIRE ================= */
function wire(){
 document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;cur=null;render()});
 document.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{
   cur=(cur===el.dataset.t)?null:el.dataset.t;
   if(cur){const x=byId(cur); if(x) curDay=x.d;}
   render();
 });
 document.querySelectorAll('[data-vao]').forEach(el=>el.onclick=e=>{e.stopPropagation();vaoTiet(el.dataset.vao)});
 document.querySelectorAll('[data-truc]').forEach(el=>el.onclick=()=>{truc=el.dataset.truc;cur=null;render()});
 document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{view=el.dataset.view;render()});
 document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=e=>{e.stopPropagation();cur=el.dataset.goto;const x=byId(cur);if(x)curDay=x.d;render()});
 document.querySelectorAll('[data-chgw]').forEach(el=>el.onclick=e=>{e.stopPropagation();chgWin=el.dataset.chgw;render();
   toast('Demo dựng đúng tuần 24/8 – 30/8 nên ba cửa sổ cho cùng một tập thay đổi')});
 document.querySelectorAll('[data-ms]').forEach(el=>el.onclick=e=>{
   e.stopPropagation();
   const p=$('#msp-'+el.dataset.ms), was=p.classList.contains('on');
   document.querySelectorAll('.msp').forEach(z=>z.classList.remove('on'));
   if(!was)p.classList.add('on');
 });
 document.querySelectorAll('[data-msv]').forEach(el=>el.onchange=()=>{
   const s={lop:fLOP,mon:fMON,hien:fHIEN}[el.dataset.msv];
   el.checked?s.add(el.value):s.delete(el.value); render();
 });
 document.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>act(el.dataset.act,el.dataset.id));
 document.querySelectorAll('[data-x]').forEach(el=>el.onclick=e=>{e.stopPropagation();act(el.dataset.x)});
}
document.addEventListener('click',e=>{
 if(!e.target.closest('.ms')) document.querySelectorAll('.msp').forEach(z=>z.classList.remove('on'));
 const mb=e.target.closest('[data-mb]');
 if(mb){const k=mb.dataset.mb; if(k&&mfns[k]) mfns[k](); else closeM(); return}
 if(e.target.id==='mask') closeM();
 const rb=e.target.closest('.rb');
 if(rb){role=rb.dataset.r;document.querySelectorAll('.rb').forEach(z=>z.classList.toggle('on',z===rb));
   cur=null;view='tuan';truc='lop';chgOpen=false;chgAll=false;
   fLOP.clear();fMON.clear();fHIEN=new Set(['nghi','huy','bithay']);render();}
});
$('#hdt').onchange=()=>{cur=null;render()};

/* ================= HANH DONG ================= */
function vaoTiet(id){
 const x=byId(id);
 modal('▶ Vào tiết — deep-link sang Menu chủ',
  `<div class="info">Đây là feature quan trọng nhất của Menu — lý do Menu tồn tại.
    Một cú bấm là vào thẳng phần việc, <b>không phải chọn lại lớp, môn, ngày</b>.</div>
   <div style="background:#0f172a;color:#93c5fd;padding:11px 13px;border-radius:9px;font-size:12px;font-family:ui-monospace,Consolas,monospace;margin-bottom:12px">
    /M2.2?ctx=${esc(x.id)}&amp;action=ky&amp;return=M2.1</div>
   <table class="tb"><tr><th>Màn hình đích mở sẵn</th><th>Ghi chú</th></tr>
    <tr><td><b>M2.2 Sổ đầu bài</b> — đúng tiết ${esc(x.mon)} lớp ${esc(x.lop)}, ${DOW[x.d]} ${NGAY[x.d]} tiết ${x.t}</td>
      <td>Màn hình mở ở trạng thái <b>Chưa vào tiết</b>, ô nhập khóa. Timestamp chỉ sinh khi bấm <b>▶ Vào tiết</b> — là căn cứ chấm công nên phải có chủ ý (M2.2 §5.1)</td></tr>
    <tr><td><b>Widget điểm danh của tiết</b> nằm ngay trong màn hình đó</td>
      <td>Ngoại lệ V7 — chỉ thêm biến động Lớp 3, <b>không sửa được điểm danh đầu ngày</b></td></tr>
    <tr><td>Nút <b>‹ Quay lại Lịch dạy</b></td><td>Về đúng chỗ vừa rời đi</td></tr></table>`,
  [['Đóng',0]]);
}
function act(a,id){
 if(a==='close'){cur=null;render();return}
 if(a==='chgtoggle'){chgOpen=!chgOpen;render();return}
 if(a==='chgall'){chgAll=!chgAll;render();return}
 if(a==='prevd'){curDay=Math.max(0,curDay-1);render();return}
 if(a==='nextd'){curDay=Math.min(5,curDay+1);render();return}
 if(a==='today'){curDay=HOMNAY;render();return}
 if(a==='prevw'||a==='nextw'){toast('Demo chỉ dựng <b>Tuần 2 · 24/8 – 30/8/2026</b>');return}
 if(a==='vao'){vaoTiet(cur);return}

 if(a==='m46'){
   modal('↗ Deep-link sang M4.7 Lịch giảng dạy &amp; Dạy thay',
    `<div class="info">Chuẩn deep-link: <code>/M4.7?ctx={id}&amp;action={sua|duyet}&amp;return=M2.1</code></div>
     <div class="ro"><b>Link này chỉ hiện với vai trò có quyền tương ứng tại M4.7.</b>
      GVBM và GVCN không thấy bất kỳ link nào dẫn sang đó — tránh dẫn người dùng tới màn hình bị từ chối.
      TTCM chỉ thấy link <i>xếp người dạy thay trong tổ mình</i>.
      Hiệu trưởng có <code>X/XD</code> tại M4.7 nên chỉ thấy link <i>Xem</i>, không thấy link thao tác.</div>

       kể cả thao tác <b>Đổi tiết</b> sau khi hai giáo viên đã thỏa thuận xong ngoài hệ thống.</div>`,
    [['Đóng',0]]);return}
 if(a==='xemso'){toast('🔗 Mở M2.2 Sổ đầu bài ở chế độ <b>chỉ đọc</b> · ghi audit ai xem sổ của tiết nào');return}

 if(a==='kh'){toast('🔗 Mở M5.1 Kế hoạch giảng dạy · nội dung dự kiến của tiết là bản chiếu chỉ đọc');return}
 if(a==='xuat'){
   const dh=['branch','school','group'].indexOf(R().sc)>=0;
   modal('⬇ Xuất lịch',
    `<div class="ro">Mọi lượt xuất <b>ghi audit</b>. Bản xuất theo Lớp <b>không kèm thông tin cá nhân học sinh</b>.</div>

      ${R().gv?`<tr><td><b>Lịch dạy cá nhân theo tuần</b></td><td>In dán bàn làm việc</td><td><button class="btn xs">PDF</button></td></tr>
      <tr><td><b>Lịch dạy cá nhân theo tháng</b></td><td>Sắp xếp việc riêng</td><td><button class="btn xs">Excel</button></td></tr>`:''}
      ${R().toancanh?`<tr><td><b>Lịch toàn cảnh theo Lớp</b></td><td>Dán bảng tin lớp</td><td><button class="btn xs">PDF</button></td></tr>`:''}
      ${R().truc.indexOf('gv')>=0?`<tr><td><b>Lịch toàn cảnh theo Giáo viên</b></td><td>Treo phòng hội đồng</td><td><button class="btn xs">PDF</button></td></tr>`:''}
      ${dh?`<tr><td><b>Nhật ký thay đổi lịch</b></td><td>Rà lại cuối tháng: lịch bị can thiệp bao nhiêu lần, ai thao tác,
        lý do gì — <b>đặc biệt cần với các lượt Đổi tiết</b>, vì thỏa thuận diễn ra ngoài hệ thống</td>
        <td><button class="btn xs">Excel</button></td></tr>`:''}
     </table>`,[['Đóng',0]]);return}
 toast('Thao tác demo');
