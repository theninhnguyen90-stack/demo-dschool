<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}
.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}
.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}
.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.flab{font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:-3px}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}.tg.v{background:#ede9fe;color:#5b21b6}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}.st2.v{background:#ede9fe;color:#5b21b6}
.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:13px}
.listw table{display:block;overflow-x:auto;white-space:normal}
.listw table thead,.listw table tbody{display:table;width:100%;min-width:640px}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:165px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}tr.badrow{background:var(--red-soft)}
tr.okrow{background:var(--green-soft)}
tr.sel{background:var(--brand-soft)}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.empty{padding:32px;text-align:center;color:var(--ink3)}
.mini{font-size:10.5px;color:var(--ink3);font-weight:400}
.nodata{color:var(--red);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.fldi:disabled{background:#f1f5f9;color:var(--ink3);cursor:not-allowed}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.quota{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:12px;flex-wrap:wrap}
.qbar{flex:1;min-width:130px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--brand)}
.uv{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;cursor:pointer;font-size:12.5px}
.uv:hover{border-color:var(--brand);background:var(--brand-soft)}
.uv.on{border-color:var(--brand);background:var(--brand-soft)}
.uv .sp{flex:1;min-width:0}
.uv.loai{opacity:.5;background:#fafbfc;cursor:not-allowed;border-style:dashed}
.tiet{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;margin:0 4px 4px 0;background:#fff}
.tiet.da{background:var(--amber-soft);border-color:#fde68a}
.dtb{font-size:9px;font-weight:800;border-radius:4px;padding:0 4px;background:#e0e7ff;color:#3730a3}
.dtb.b{background:#fef3c7;color:#92400e}
.appr{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:999px;padding:2px 9px;margin:0 4px 4px 0}
.appr.yk{border-style:dashed;background:#f8fafc;color:var(--ink2);border-color:var(--line2)}
.file{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:12.5px}
.file .sp{flex:1}
.fview{border:1px solid var(--line);border-radius:9px;background:#f8fafc;padding:22px;text-align:center;color:var(--ink2);font-size:12.5px;margin-top:9px}
</style>
</head>

/* ---- danh sách người được duyệt: khớp MÔN + ĐIỂM TRƯỜNG, mức lấy từ CFG ---- */
function nguoiDuyet(d){
 const p=ns(d.gv), n=songay(d.tu,d.den), ts=tietTrong(d.gv,d.tu,d.den);
 const out=[];
 const themNg=(id,vaiTro,yk)=>{if(id&&id!==d.gv&&!out.some(o=>o.id===id))out.push({id,vaiTro,yk:yk||0})};
 const theoCD=(cd,yk)=>{
  if(cd==='HT')     return themNg(HT_ID,'Hiệu trưởng'+(yk?' — cho ý kiến, không duyệt':''),yk);
  if(cd==='PHT_CM') return themNg(PHTCM_ID,'PHT Chuyên môn'+(yk?' — cho ý kiến trước, không duyệt':''),yk);
  if(cd==='TCNS')   return themNg(TCNS_ID,'TCNS'+(yk?' — phối hợp thủ tục Tạm nghỉ, không duyệt':''),yk);
  /* Chốt 28/8/2026 điểm 5 và 6: KHÔNG có luật riêng theo chức danh người gửi.
     Quyền duyệt gắn theo SỐ NGÀY (bảng CFG.muc); danh sách chỉ THU HẸP theo liên quan —
     tổ có tiết, điểm trường có tiết. Không có tiết thì lùi về tổ và điểm trường của
     chính người gửi. Nhân viên hành chính không thuộc tổ chuyên môn nên tự nhiên
     không có TTCM trong danh sách — đó là hệ quả của dữ liệu, không phải luật riêng. */
  if(cd==='TTCM'){
   const tos=new Set(ts.map(t=>MONTO[t.mon]).filter(Boolean));
   if(!tos.size&&p.to)tos.add(p.to);
   tos.forEach(t=>themNg(TTCM_CUA[t],`TTCM ${TO[t]}`+(ts.length?' — có tiết trong khoảng nghỉ':''),yk));
   return}
  if(cd==='PHT_DT'){
   const dts=new Set(ts.map(t=>LOPDT[t.lop])); if(!dts.size)dts.add(p.dt);
   dts.forEach(dt=>themNg(PDT_CUA[dt],`PHT ${dt}`+(ts.length?' — có tiết trong khoảng nghỉ':''),yk));
   return}
 };
 if(d.loai==='TS'){
  CFG.thaiSan.ai.forEach(cd=>theoCD(cd,0));
  CFG.thaiSan.yk.forEach(cd=>theoCD(cd,1));
  return out}
 const m=mucCua(n); if(!m)return out;
 m.ai.forEach(cd=>theoCD(cd,0));
 m.yk.forEach(cd=>theoCD(cd,1));
 if(CFG.htLuon)themNg(HT_ID,m.den==null?'Hiệu trưởng — người duyệt duy nhất':'Hiệu trưởng');
 return out;
}

/* ================= T1 — ĐƠN CỦA TÔI ================= */
function quyBand(){
 const p=toi(),bl=NGAY_BLLD(p),he=NGAY_HE(p),q=QUY_PHEP(p);
 const daDung=DON.filter(d=>d.gv===p.id&&loai(d.loai).quy&&['duyet','cho'].includes(d.tt))
   .reduce((s,d)=>s+soNgayCong(d),0);
 const cho=DON.filter(d=>d.gv===p.id&&loai(d.loai).quy&&d.tt==='cho')
   .reduce((s,d)=>s+soNgayCong(d),0);
 if(!p.nhaGiao)
  return `<div class="quota"><b>Quỹ nghỉ phép năm</b>
   <span class="st2 b">Không phải nhà giáo</span>
   <span style="font-size:12px">Đã dùng <b>${daDung}</b> / <b>${q}</b> ngày${cho?` <span class="mini">(gồm ${cho} ngày đang chờ duyệt)</span>`:''}</span>
   <span class="qbar"><i style="width:${Math.min(100,daDung/q*100)}%"></i></span>
   <span class="mini">12 ngày + ${Math.floor(p.tn/5)} ngày thâm niên — Điều 113, 114 BLLĐ 2019</span></div>`;
 /* nhà giáo: quỹ = max(0, ngày BLLĐ − nghỉ hè thực hưởng) — KHÔNG khoá cứng theo tư cách */
 const du=q===0;
 return `<div class="quota" style="${du?'':'border-left:3px solid var(--brand)'}"><b>Quỹ nghỉ hằng năm</b>
   <span class="st2 n">Nhà giáo</span>
   <span style="flex:1;min-width:230px;font-size:12px;color:var(--ink2)">
     Bộ luật Lao động: <b>${bl} ngày</b> <span class="mini">(12 + ${Math.floor(p.tn/5)} ngày thâm niên, ${p.tn} năm công tác)</span>
     · nghỉ hè thực hưởng <b>${HE_TUAN} tuần ≈ ${he} ngày</b> <span class="mini">(NĐ 93/2026/NĐ-CP — đã bao gồm nghỉ hằng năm)</span>
     <br>${du
      ? `Quỹ còn lại trong năm học: <b class="nodata">0 ngày</b> — nghỉ hè <b>đã bằng hoặc vượt</b> quỹ theo Bộ luật.
         Muốn nghỉ thì dùng <b>Nghỉ việc riêng</b>.`
      : `Nghỉ hè <b>ít hơn</b> quỹ theo Bộ luật nên được <b>nghỉ bổ sung phần chênh</b>
         <span class="mini">(TT 05/2025/TT-BGDĐT Điều 6 — bố trí linh hoạt theo thỏa thuận với Hiệu trưởng)</span>:
         <b>${q} ngày</b>, đã dùng <b>${daDung}</b>${cho?` <span class="mini">(gồm ${cho} ngày đang chờ duyệt)</span>`:''}.`}</span>
   ${!du?`<span class="qbar" style="max-width:120px"><i style="width:${Math.min(100,daDung/q*100)}%"></i></span>`:''}
   ${dlink('M10.1','Số tuần nghỉ hè khai tại M10.1')}</div>`;
}

  <tbody>${ds.map(d=>{const p=ns(d.gv),n=songay(d.tu,d.den),ts=tietTrong(d.gv,d.tu,d.den);
   return `<tr class="${chon.has(d.id)?'sel':''}">
   ${ngc==='duyet'?`<td><input type="checkbox" data-ck="${d.id}" ${chon.has(d.id)?'checked':''}></td>`:''}
   <td><b>${d.id}</b>${d.nhapBoi?'<div><span class="tg b">nhập hộ</span></div>':''}${d.tep.length?'<div class="mini">📎 '+d.tep.length+' tệp</div>'

   ${ngc!=='toi'?`<td><b>${p.n}</b><div class="mini">${p.nhaGiao?TO[p.to]:p.vt} · ${p.dt}</div></td>`:''}
   <td>${loai(d.loai).ten}<div class="mini">${loai(d.loai).luong}</div></td>
   <td>${d.tu}${d.den!==d.tu?' — '+d.den:''}${nuaNgay(d)?`<div class="mini"><b>${NUATEN[d.buoi]}</b></div>`:''}</td>
   <td class="num">${soNgayCong(d)}${n>7?'<div class="mini" style="color:var(--amber)">cần HT ký</div>':''}</td>
   <td>${ts.length?`<b>${ts.length}</b> tiết`:'<span class="mini">không có tiết</span>'}
     ${d.tt==='duyet'&&d.dayThay?`<div class="mini">${d.dayThay.da<d.dayThay.tong

function chupCFG(){return JSON.stringify({muc:CFG.muc,thaiSan:CFG.thaiSan,htLuon:CFG.htLuon,
 soNguoiCanDuyet:CFG.soNguoiCanDuyet,loai:LOAI})}
function phucCFG(snap){const o=JSON.parse(snap);
 CFG.muc=o.muc;CFG.thaiSan=o.thaiSan;CFG.htLuon=o.htLuon;CFG.soNguoiCanDuyet=o.soNguoiCanDuyet;
 LOAI.length=0;o.loai.forEach(l=>LOAI.push(l));}
/* áp THỬ danh sách thay đổi rồi kiểm; sai thì hoàn tác nguyên trạng */
function apThu(ds){
 const snap=chupCFG();
 ds.forEach(c=>c.fn());
 const loi=kiemMuc();
 if(loi){phucCFG(snap);return loi}
 return null;
}
function kiemMuc(){
 const ms=CFG.muc.slice().sort((a,b)=>a.tu-b.tu);
 for(let i=0;i<ms.length;i++){
  const m=ms[i];
  if(m.den!=null&&m.den<m.tu)return `Mức <b>${m.ten}</b> có số ngày kết thúc nhỏ hơn số ngày bắt đầu`;
  if(i>0){const tr=ms[i-1];
   if(tr.den==null)return `Mức <b>${tr.ten}</b> để trống ∞ nhưng vẫn còn mức sau — chỉ mức cuối được để trống`;
   if(m.tu!==tr.den+1)return `Có khoảng hở giữa <b>${tr.ten}</b> (đến ${tr.den}) và <b>${m.ten}</b> (từ ${m.tu}) — các mức phải liền mạch`;}
  if(!m.ai.length&&!CFG.htLuon)return `Mức <b>${m.ten}</b> không có người duyệt nào, và Hiệu trưởng cũng không được gắn mặc định`;
 }
 return null;
}

function dsUV(q,p,ts){
 const mons=[...new Set(ts.map(t=>t.mon))];
 const k=kd(q);
 const trungNgay=x=>DON.some(d=>d.gv===x.id&&d.tt==='duyet'&&!(pd(d.den)<pd(fTu)||pd(d.tu)>pd(fDen)));
 const ds=NS.map(x=>{
  let loaiVi='';
  if(x.id===p.id)loaiVi='Chính bạn — người đang xin nghỉ';
  else if(x.nghiViec)loaiVi='Đã nghỉ việc';
  else if(trungNgay(x))loaiVi='Đã có đơn nghỉ đã duyệt trùng ngày';
  else if(!x.nhaGiao)loaiVi='Không phải nhà giáo';
  const cungMon=x.mon.some(m=>mons.includes(m)), cungTo=x.to===p.to;
  const hang=cungMon&&cungTo?1:cungMon?2:cungTo?3:9;
  if(!loaiVi&&hang===9)loaiVi='Không cùng môn, không cùng tổ';
  return {x,loaiVi,hang,thay:[3,2,1,4,0,2][x.id%6]};
 }).filter(o=>!k||kd(o.x.n).includes(k)||kd(o.x.ma).includes(k)||o.x.mon.some(m=>kd(m).includes(k)))
   .sort((a,b)=>a.hang-b.hang||a.thay-b.thay);
 const duoc=ds.filter(o=>!o.loaiVi),lo=ds.filter(o=>o.loaiVi);
 const hangTen=h=>['','Cùng môn, cùng tổ','Cùng môn, khác tổ','Cùng tổ, khác môn'][h]||'';
 return (duoc.length?duoc.map(o=>`<div class="uv ${fUV===o.x.id?'on':''}" data-uv="${o.x.id}">
    <input type="checkbox" ${fUV===o.x.id?'checked':''} style="pointer-events:none">
    <div class="sp"><b>${o.x.n}</b> <span class="mini">${o.x.sdt} · ${o.x.mon.join(', ')} · ${TO[o.x.to]||''} · ${o.x.ma}</span>
      <div class="mini">${hangTen(o.hang)}</div></div>
    <span class="tg ${o.thay>=3?'b':'c'}">${o.thay} tiết dạy thay tháng này</span></div>`).join('')
  :'<div class="mini" style="padding:7px">Không ai khớp — thử từ khoá khác, hoặc để trống cho người điều hành chọn</div>')
  +(lo.length?`<div class="mini" style="margin:9px 0 4px;font-weight:700">KHÔNG CHỌN ĐƯỢC — ${lo.length} người</div>`
   +lo.slice(0,4).map(o=>`<div class="uv loai"><div class="sp"><b>${o.x.n}</b>
      <div class="mini">${o.loaiVi}</div></div></div>`).join('')
   +(lo.length>4?`<div class="mini">… và ${lo.length-4} người khác</div>`:''):'');
}

function dsNhanSu(q){
 const k=kd(q),r=R();
 const ds=NS.filter(p=>p.id!==r.id)
  .filter(p=>!k||kd(p.n).includes(k)||kd(p.ma).includes(k)||p.mon.some(m=>kd(m).includes(k))||kd(p.vt||'').includes(k))
  .filter(p=>r.pv==='school'||r.pv==='own'?true:r.pv==='branch'?p.dt===r.dt:p.to===r.to);
 if(!ds.length)return '<div class="empty" style="padding:18px">Không ai khớp từ khoá</div>';
 return ds.map(p=>`<div class="uv ${p.nghiViec?'loai':''}" ${p.nghiViec?'':`data-ho="${p.id}"`}>
   <div class="sp"><b>${p.n}</b> <span class="mini">${p.ma} · ${p.sdt}</span>
     <div class="mini">${p.nhaGiao?TO[p.to]+' · '+p.mon.join(', '):p.vt} · ${p.dt}
       ${p.nghiViec?' — <b>đã nghỉ việc, không tạo đơn được</b>':''}</div></div>
   <span class="tg ${p.nhaGiao?'a':'c'}">${p.nhaGiao?'Nhà giáo':'Không phải nhà giáo'}</span>
   <span class="tg c">quỹ phép ${QUY_PHEP(p)} ngày</span></div>`).join('');
}

  :'không phát sinh nhu cầu dạy thay'}
function moKy(id){const d=don(id);
 modal('Ký quyết định cho nghỉ — '+id,
  `<div class="info">Đơn <b>${songay(d.tu,d.den)} ngày</b> nên phải có <b>Quyết định cho nghỉ</b> do Hiệu trưởng ký.</div>
   <div class="danger">🔒 <b>Ký số Nhóm B — bắt buộc, không bỏ qua được.</b>
     Quyết định này là <b>căn cứ tính lương và chế độ bảo hiểm xã hội</b>; một quyết định không chữ ký
     mà vẫn có hiệu lực trên bảng lương là lỗ hổng đối chiếu.</div>
   <div class="f"><div class="k">Người ký</div><div class="v">Trần Văn Hùng — Hiệu trưởng</div></div>
   <div class="f"><div class="k">Chứng thư</div><div class="v">CTS-HT-2026 · còn hạn đến 31/12/2027 ${dlink('M4.11','M4.11')}</div></div>`,
  `<button class="btn" data-x="close">Hủy</button>
   <button class="btn g" data-x="ok-ky" data-i="${id}">✍ Ký và duyệt</button>`);
}
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fTT'){fTT=el.value;render();return}
 if(el.id==='fLoai'){fLoai=el.value;render();return}
 if(el.id==='sLoai'){fLoaiSoan=el.value;fTu=$('#sTu').value;fDen=$('#sDen').value;veSoan();return}
 if(el.id==='sTu'||el.id==='sDen'){fTu=$('#sTu').value;fDen=$('#sDen').value;if(fTu!==fDen)fBuoi='ca';
   const ly=$('#sLy')?$('#sLy').value:'';veSoan();setTimeout(()=>{if($('#sLy'))$('#sLy').value=ly},0);return}
 if(el.dataset.cfgcd){const [mid,cd,yk]=el.dataset.cfgcd.split('|');
   const m=CFG.muc.find(z=>z.id===mid),arr=yk==='1'?m.yk:m.ai,ten=yk==='1'?'cho ý kiến':'duyệt';
   const cu=arr.slice();
   const moi=el.checked?[...arr,cd]:arr.filter(v=>v!==cd);
   themDeXuat(`Mức <b>${m.ten}</b>: người <b>${ten}</b> ${cu.map(v=>CDTEN[v]).join(', ')||'(trống)'} → ${moi.map(v=>CDTEN[v]).join(', ')||'(trống)'}`,
     ()=>{yk==='1'?m.yk=moi:m.ai=moi});
   cfgTam++;render();toast('✎ Đã ghi vào đề xuất — chưa có hiệu lực');return}
 if(el.dataset.cfgky){const m=CFG.muc.find(z=>z.id===el.dataset.cfgky),v=el.checked?1:0;
   themDeXuat(`Mức <b>${m.ten}</b>: ký quyết định ${m.ky?'bắt buộc → không':'không → <b>bắt buộc</b>'}`,()=>{m.ky=v});
   cfgTam++;render();toast('✎ Đã ghi vào đề xuất — chưa có hiệu lực');return}
 if(el.dataset.cfgtu||el.dataset.cfgden){
   const mid=el.dataset.cfgtu||el.dataset.cfgden,m=CFG.muc.find(z=>z.id===mid);
   const la=!!el.dataset.cfgtu,v=el.value.trim();
   if(la&&(!v||isNaN(+v)||+v<1)){toast('⛔ Số ngày bắt đầu phải là số nguyên dương');render();return}
   if(!la&&v&&(isNaN(+v)||+v<1)){toast('⛔ Số ngày kết thúc phải là số nguyên dương, hoặc để trống nghĩa là ∞');render();return}
   const moi=la?+v:(v?+v:null);
   const cu=la?m.tu:m.den;
   if(cu===moi)return;
   themDeXuat(`Mức <b>${m.ten}</b>: ${la?'từ':'đến'} ${cu==null?'∞':cu} → ${moi==null?'∞':moi} ngày`,
     ()=>{la?m.tu=moi:m.den=moi});
   cfgTam++;render();toast('✎ Đã ghi vào đề xuất — chưa có hiệu lực');return}
 if(el.id==='cfgHT'){const v=el.checked?1:0;
   themDeXuat(`Hiệu trưởng ${v?'LUÔN':'KHÔNG luôn'} nằm trong danh sách người được duyệt`,()=>{CFG.htLuon=v});
   cfgTam++;render();toast('✎ Đã ghi vào đề xuất — chưa có hiệu lực');return}
 if(el.id==='cfgSo'){const v=+el.value;
   themDeXuat(`Số người cần đồng ý: ${CFG.soNguoiCanDuyet} → <b>${v}</b>`+(v===2?' — trái với nh3.3.4 §3 "ai duyệt trước có hiệu lực"':''),
     ()=>{CFG.soNguoiCanDuyet=v});
   cfgTam++;render();toast('✎ Đã ghi vào đề xuất — chưa có hiệu lực');return}
 if(el.id==='sHT'){fHT=el.value;return}
 if(el.id==='sBuoi'){fBuoi=el.value;fTu=$('#sTu').value;fDen=$('#sDen').value;
   const ly=$('#sLy')?$('#sLy').value:'';veSoan();setTimeout(()=>{if($('#sLy'))$('#sLy').value=ly},0);return}
 if(el.id==='ckAll'){const ds=choToi().filter(d=>!fMuc?true:fMuc==='TS'?d.loai==='TS'
     :d.loai!=='TS'&&(mucCua(songay(d.tu,d.den))||{}).id===fMuc);
   el.checked?ds.forEach(d=>chon.add(d.id)):chon.clear();render();return}
 if(el.dataset.ck!==undefined){const id=el.dataset.ck;el.checked?chon.add(id):chon.delete(id);render();return}
});

function render(){
 sidebar();tabs();
 const n=choToi().length;
 $('#ndot').textContent=n||'';$('#ndot').style.display=n?'grid':'none';
 $('#topact').innerHTML=R().tabs.includes('tong')?'<button class="btn" data-x="xuat">⬇ Xuất</button>':'';
 $('#content').innerHTML=scopeBar()+(tab==='toi'?toiTab():tab==='duyet'?duyetTab():tab==='tong'?tongTab():cauhinhTab());
}
render();
</script>
</body>
</html>
