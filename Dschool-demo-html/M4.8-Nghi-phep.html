<style>

 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}

<script>const $=s=>document.querySelector(s);
/* v2.0 — YKNP-1A (17/9/2026): đơn nghỉ nhân sự BỎ DUYỆT. Tiếp nhận là mặc định, đồng ý là ngoại lệ khai theo LOẠI NGHỈ.

const HOMNAY=new Date(2026,7,28);           /* thứ Sáu 28/08/2026 */
const GIO_NAY='09:24';                      /* giờ demo — tiết 1 của D0 đã bắt đầu lúc 07:00 */
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
const pd=s=>{const[a,b,c]=s.split('/').map(Number);return new Date(c,b-1,a)};
const them=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
/* Ngày làm việc: bỏ Chủ nhật (nh3.3.4 §4). D(n) = ngày làm việc thứ n tính từ D0 — HOMNAY là thứ Sáu nên
   D+2 theo lịch rơi vào Chủ nhật; đếm theo ngày làm việc để ca mẫu không có đơn nghỉ ngày Chủ nhật. */
function ngayLV(g,n){let d=new Date(g),k=0;const b=n<0?-1:1;while(k<Math.abs(n)){d=them(d,b);if(d.getDay()!==0)k++}return d}

const dsNgayLV=(tu,den)=>{const o=[];let d=pd(tu);const e=pd(den);let g=0;while(d<=e&&g++<400){if(d.getDay()!==0)o.push(d2s(d));d=them(d,1)}return o};

function vungThuHoi(d,ngay){
 const ts=tietNgay(d.gv,ngay,(d.ngay.find(x=>x.ngay===ngay)||{}).buoi);
 const truoc=pd(ngay)<HOMNAY;                         /* ngày đã qua: M4.9 đã có kết luận chấm công (demo) */
 const daBatDau=ngay===HOMNAY_S&&ts.length&&GIO_NAY>='07:00';
 if(truoc||daBatDau)return 3;
 if(ts.length&&(d.daXep||[]).includes(ngay))return 2;
 return 1;
}

function nguoiDongY(d){const p=ns(d.gv),o=[];
 const pdt=PDT_CUA[p.dt];
 if(pdt&&pdt!==d.gv)o.push({id:pdt,vai:'PHT '+p.dt+' — điểm trường trong hồ sơ nhân sự của người xin nghỉ'});
 if(HT_ID!==d.gv)o.push({id:HT_ID,vai:'Hiệu trưởng'});
 return o}
function nguoiCanBiet(d){
 const p=ns(d.gv),o=[];
 const add=(id,vai)=>{if(id&&id!==d.gv&&!o.some(x=>x.id===id))o.push({id,vai})};
 if(d.coChe==='can_thoa_thuan')nguoiDongY(d).forEach(x=>add(x.id,x.vai+' — người ĐỒNG Ý'));
 else{add(PDT_CUA[p.dt],'PHT '+p.dt+' — biết');add(HT_ID,'Hiệu trưởng — biết'+(d.quyetDinh?' · ký quyết định':''))}
 const ts=tietDon(d);
 new Set(ts.map(t=>LOPDT[t.lop])).forEach(dt=>{if(dt!==p.dt)add(PDT_CUA[dt],'PHT '+dt+' — có tiết ở điểm trường này')});
 if(loai(d.loai).giay)add(TCNS_ID,'Tổ chức nhân sự — theo dõi hồ sơ');
 return o}

/* ================= TẠO ĐƠN HỘ (§8b giữ nguyên) ================= */
let hoCho=null,fQho='',fHT='',fLoaiSoan='OM',fTu='',fDen='',fBuoi='ca_ngay',fUV=null,fQ='',hoBV=null,hoVe=null;
function moTaoHo(){fQho='';veChonNguoi();
 setTimeout(()=>{const q=$('#hoQ');if(q)q.oninput=()=>{fQho=q.value;$('#hoList').innerHTML=dsNhanSu(fQho)}},0)}
function veChonNguoi(){
 modal('Tạo đơn hộ nhân sự — chọn người xin nghỉ',
  `<div class="ro">Dùng khi người xin nghỉ <b>nộp đơn giấy</b>, gọi điện báo, hoặc không dùng được hệ thống. Đơn ghi <b>cả hai người</b>.</div>
   <input class="fldi" id="hoQ" placeholder="Gõ tên có dấu hoặc không dấu, mã nhân sự, môn, vị trí việc làm…" value="${fQho}">
   <div id="hoList" style="margin-top:9px">${dsNhanSu(fQho)}</div>`,'<button class="btn" data-x="close">Hủy</button>');
}
function dsNhanSu(q){
 const k=kd(q),r=R();
 const ds=NS.filter(p=>p.id!==r.id)
  .filter(p=>!k||kd(p.n).includes(k)||kd(p.ma).includes(k)||p.mon.some(m=>kd(m).includes(k))||kd(p.vt||'').includes(k))
  .filter(p=>r.pv==='school'||p.dt===r.dt);
 if(!ds.length)return '<div class="empty" style="padding:18px">Không ai khớp từ khoá</div>';
 return ds.map(p=>`<div class="uv ${p.nghiViec?'loai':''}" ${p.nghiViec?'':`data-ho="${p.id}"`}>
   <div class="sp"><b>${p.n}</b> <span class="mini">${p.ma} · ${p.sdt}</span>
    <div class="mini">${p.nhaGiao?TO[p.to]+' · '+p.mon.join(', '):p.vt} · ${p.dt}${p.nghiViec?' — <b>đã nghỉ việc</b>':''}</div></div>
   <span class="tg ${p.nhaGiao?'a':'c'}">${p.nhaGiao?'Nhà giáo':'Không phải nhà giáo'}</span><span class="tg c">quỹ ${QUY_PHEP(p)} ngày</span></div>`).join('');
}
function soanHo(){fLoaiSoan='OM';fTu=HOMNAY_S;fDen=HOMNAY_S;fBuoi='ca_ngay';fUV=null;fQ='';fHT='';hoBV=null;hoVe=null;veSoan()}
function veSoan(){
 const p=ns(hoCho),l=loai(fLoaiSoan);
 const ngays=pd(fDen)>=pd(fTu)?dsNgayLV(fTu,fDen):[];
 const tam={gv:p.id,loai:l.ma,coChe:l.coChe,ngay:ngays.map(x=>ng(x,ngays.length===1?fBuoi:'ca_ngay')),nhan:[],tep:[]};
 const ts=tietDon(tam),n=soNgay(tam);
 const quaKhu=pd(fTu)<HOMNAY||(fTu===HOMNAY_S);
 const vq=vuotQuy(p,l,n);
 modal('Tạo đơn hộ — '+p.n,
  (hoBV?`<div class="info">↩ Mở từ <b>${hoVe||'M4.9'}</b> — hàng đợi <b>Vắng chưa có đơn</b>. Đơn sẽ gắn <b>báo vắng ${hoBV}</b> để máy ghép <b>don_phu_id</b>; ghi xong có nút quay lại.</div>`:'')+
  `<div class="warn">✍ Bạn đang <b>nhập hộ</b> đơn của <b>${p.n}</b> (${p.ma} · ${p.nhaGiao?TO[p.to]:p.vt} · ${p.dt}).
    Người xin nghỉ là <b>${p.n}</b>, người nhập là <b>${toi().n}</b> — hai trường tách biệt, đơn mang nhãn <b>nhập hộ</b> ở M0.4 của ${p.n}.</div>
   <label class="lbl">Căn cứ nhận đơn <span style="color:var(--red)">*</span></label>
   <select class="fldi" id="sHT"><option value="">— Chọn —</option>${['Đơn giấy có chữ ký','Gọi điện báo','Báo trực tiếp','Cấp trên chỉ đạo nhập']
     .map(h=>`<option ${fHT===h?'selected':''}>${h}</option>`).join('')}</select>
   <label class="lbl">Loại nghỉ</label><select class="fldi" id="sLoai">${LOAI.filter(x=>x.tt==='ap').map(x=>`<option value="${x.ma}" ${fLoaiSoan===x.ma?'selected':''}>${x.ten} — ${COCHE[x.coChe]}</option>`).join('')}</select>
   <div class="ro" style="margin-top:8px">${l.ghi}<br>Cơ chế <b>${COCHE[l.coChe]}</b>: ${COCHE_GT[l.coChe]}.</div>
   <div class="row2"><div><label class="lbl">Từ ngày</label><input class="fldi" id="sTu" value="${fTu}"></div>
    <div><label class="lbl">Đến ngày</label><input class="fldi" id="sDen" value="${fDen}"></div></div>
   ${ngays.length===1?`<label class="lbl">Phạm vi trong ngày</label><select class="fldi" id="sBuoi">
     <option value="ca_ngay" ${fBuoi==='ca_ngay'?'selected':''}>Cả ngày</option><option value="sang" ${fBuoi==='sang'?'selected':''}>Chỉ buổi sáng</option>
     <option value="chieu" ${fBuoi==='chieu'?'selected':''}>Chỉ buổi chiều</option></select>`:''}
   <div class="ro" style="margin-top:9px"><b>${n} ngày làm việc</b>${n>CFG.nguongQD||l.coChe==='ghi_nhan_quyet_dinh'?' — sinh <b>quyết định chờ Hiệu trưởng ký</b> (Nhóm B)':''}.</div>
   ${quaKhu?`<div class="warn">🕒 Có ngày <b>đã bắt đầu hoặc đã qua</b> — <b>vẫn nhận</b>, đơn gắn nhãn <b>báo muộn</b> và chảy sang hàng đợi ngoại lệ M4.9.
     Tiết đã diễn ra không sinh nhu cầu dạy thay.</div>`:''}
   ${vq?`<div class="warn">📊 ${vq} — <b>vẫn nhận</b>, gắn nhãn <b>vượt quỹ</b>.</div>`:''}
   <label class="lbl">Đơn này sẽ đến tay</label><div>${nguoiCanBiet(tam).map(o=>`<span class="appr${/ĐỒNG Ý/.test(o.vai)?'':' yk'}"><b>${ns(o.id).n}</b> — ${o.vai}</span>`).join('')}</div>
   <label class="lbl">Tiết bị ảnh hưởng <span class="mini">— đọc từ M4.7</span></label>
   <div>${ts.length?ts.map(t=>`<span class="tiet">${t.ngay} · tiết ${t.tiet} · <b>${t.lop}</b> · ${t.mon}</span>`).join('')
     :'<div class="ro" style="margin:0">Không có tiết dạy nào — <b>vẫn ghi nhận được</b>.</div>'}</div>
   ${ts.length?`<label class="lbl">Đề xuất người dạy thay <span class="mini">— không bắt buộc</span></label>
    <input class="fldi" id="sQ" placeholder="Gõ tên có dấu hoặc không dấu, mã nhân sự, môn…" value="${fQ}">
    <div id="sList" style="margin-top:7px">${dsUV(fQ,p,ts,ngays)}</div>
    ${fUV?'<label class="lbl">Ghi chú thỏa thuận <span style="color:var(--red)">*</span></label><textarea class="fldi" id="sGhi" rows="2" placeholder="Ai đã hỏi ai, bằng cách nào, khi nào…"></textarea>':''}`:''}
   <label class="lbl">Lý do <span style="color:var(--red)">*</span></label><textarea class="fldi" id="sLy" rows="2"></textarea>`,
  `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ghi-ho">Ghi nhận đơn</button>`);
 setTimeout(()=>{const q=$('#sQ');if(q)q.oninput=()=>{fQ=q.value;$('#sList').innerHTML=dsUV(fQ,p,ts,ngays)}},0);
}
function daDung(p,ma){return DON.filter(d=>d.gv===p.id&&d.loai===ma&&d.tt==='co_hieu_luc').reduce((s,d)=>s+soNgayCon(d),0)}
function vuotQuy(p,l,n){
 if(l.quy){const q=QUY_PHEP(p),dd=daDung(p,l.ma)+(p.daDungTruoc||0);if(dd+n>q)return `Quỹ nghỉ hằng năm của ${p.n} còn <b>${Math.max(0,q-dd)} ngày</b>, đơn này <b>${n} ngày</b>`}
 if(l.max){const dd=daDung(p,l.ma);if(dd+n>l.max)return `Loại ${l.ten} tối đa <b>${l.max} ngày/năm</b>, ${p.n} đã dùng ${dd} ngày`}
 return null}
function dsUV(q,p,ts,ngays){
 const mons=[...new Set(ts.map(t=>t.mon))],k=kd(q);
 const trung=x=>DON.some(d=>d.gv===x.id&&ngays.some(g=>coHieuLuc(d,g)));
 const ds=NS.map(x=>{let lv='';
  if(x.id===p.id)lv='Người đang xin nghỉ';else if(x.nghiViec)lv='Đã nghỉ việc';
  else if(trung(x))lv='Đã có đơn nghỉ có hiệu lực trùng ngày';else if(!x.nhaGiao)lv='Không phải nhà giáo';
  const cm=x.mon.some(m=>mons.includes(m)),ct=x.to===p.to,h=cm&&ct?1:cm?2:ct?3:9;
  if(!lv&&h===9)lv='Không cùng môn, không cùng tổ';
  return {x,lv,h,thay:[3,2,1,4,0,2][x.id%6]}})
  .filter(o=>!k||kd(o.x.n).includes(k)||kd(o.x.ma).includes(k)||o.x.mon.some(m=>kd(m).includes(k))).sort((a,b)=>a.h-b.h||a.thay-b.thay);
 const ok=ds.filter(o=>!o.lv),lo=ds.filter(o=>o.lv);
 return (ok.map(o=>`<div class="uv ${fUV===o.x.id?'on':''}" data-uv="${o.x.id}"><div class="sp"><b>${o.x.n}</b>
   <span class="mini">${o.x.sdt} · ${o.x.mon.join(', ')} · ${TO[o.x.to]||''} · ${o.x.ma}</span></div>
   <span class="tg ${o.thay>=3?'b':'c'}">${o.thay} tiết dạy thay tháng này</span></div>`).join('')||'<div class="mini">Không ai khớp</div>')
  +(lo.length?`<div class="mini" style="margin:8px 0 4px;font-weight:700">KHÔNG CHỌN ĐƯỢC — ${lo.length} người</div>`
   +lo.slice(0,3).map(o=>`<div class="uv loai"><div class="sp"><b>${o.x.n}</b><div class="mini">${o.lv}</div></div></div>`).join(''):'');
}

/* ================= BẢNG KẾT QUẢ HAI KHỐI — khuôn §9, M0.4 dùng lại cho bảng rút đơn ================= */
function bangHaiKhoi(tieuDe,ok,bo,cotOk,nutXacNhan){
 return modal(tieuDe,
  `<div class="okbox">✅ <b>${cotOk.ten} ${ok.length}</b>${cotOk.tomTat?' — '+cotOk.tomTat:''}</div>
   ${ok.length?`<table><thead><tr>${cotOk.cot.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${ok.map(x=>`<tr class="okrow">${cotOk.dong(x)}</tr>`).join('')}</tbody></table>`:''}
   ${bo.length?`<div class="warn" style="margin-top:13px">⏭ <b>Bỏ qua ${bo.length}</b> — nêu rõ từng lý do:</div>
    <table><thead><tr><th>Mục</th><th>Vì sao bỏ qua</th></tr></thead><tbody>
    ${bo.map(([ten,ly])=>`<tr class="badrow"><td><b>${ten}</b></td><td>${ly}</td></tr>`).join('')}</tbody></table>`:''}`,
  `<button class="btn" data-x="close">Hủy</button>${nutXacNhan(ok.length)}`);
}

let _ok=[],_rut=null;
document.addEventListener('click',e=>{
 if(e.target.matches('input[type=text],select,textarea'))return;
 const t=e.target.closest('[data-r],[data-tab],[data-x],[data-uv],[data-ck],[data-ho]');
 if(!t)return;
 const x=t.dataset.x;
 if(t.dataset.r){role=t.dataset.r;chon.clear();fTT='';fLoai='';fNhan='';fDT='';
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role));
  const r=R();$('#ava').textContent=r.ava;const s=$('#hdt');
  if(r.pv==='branch'||r.pv==='nhapho'){s.value=r.dt;s.disabled=true;$('#dtlock').textContent='🔒 khoá theo phạm vi'}
  else{s.disabled=false;s.value='Toàn trường';$('#dtlock').textContent=''}
  render();return}
 if(t.dataset.tab&&!x){tab=t.dataset.tab;chon.clear();render();return}
 if(x==='close'){closeModal();return}
 if(x==='dl'){closeModal();toast(`↗ Mở <b>${t.dataset.m}</b>${t.dataset.c?' · <code>'+t.dataset.c+'</code>':''} · có nút quay lại M4.8`);return}
 if(t.dataset.ck!==undefined&&!x){const id=t.dataset.ck;chon.has(id)?chon.delete(id):chon.add(id);render();return}
 if(x==='mo'){xemDon(t.dataset.i);return}

 /* --- 🟡 đồng ý / không đồng ý --- */
 if(x==='dy1'){const d=don(t.dataset.i);ghiDongY(d);closeModal();render();
   toast(`✓ Đã đồng ý <b>${d.id}</b> — đơn <b>có hiệu lực</b> · ${nhuCau(d)}${loai(d.loai).giay&&!d.tep.length?' · còn thiếu hồ sơ (cảnh báo, không chặn)':''}`);return}
 if(x==='kdy'){const id=t.dataset.i;
   modal('Không đồng ý — '+id,`<label class="lbl">Lý do <span style="color:var(--red)">*</span></label><textarea class="fldi" id="kdyLy" rows="3"></textarea>
    <div class="ro" style="margin-top:11px">Chỉ có với loại <b>Cần thỏa thuận</b>. Đơn sang <b>Không đồng ý</b>, không bị xóa; người xin nghỉ <b>gửi đơn mới</b> nếu muốn đổi ngày.</div>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn d" data-x="ok-kdy" data-i="${id}">Không đồng ý</button>`);return}
 if(x==='ok-kdy'){const d=don(t.dataset.i),ly=$('#kdyLy').value.trim();
   if(!ly){toast('⛔ Bắt buộc nêu lý do không đồng ý');return}
   d.tt='khong_dong_y';d.khongDongY={boi:toi().id,luc:HOMNAY_S+' '+GIO_NAY,ly_do:ly};closeModal();render();
   toast(`Đã ghi <b>Không đồng ý</b> cho ${d.id} · đã báo ${ns(d.gv).n} kèm lý do`);return}
 if(x==='dy-loat'){const r=R(),ok=[],bo=[];
   [...chon].map(don).forEach(d=>{
    if(d.gv===r.id){bo.push([d.id,'đơn của chính bạn — không ai tự đồng ý đơn mình']);return}
    if(d.tt!=='cho_dong_y'){bo.push([d.id,'đang ở trạng thái '+TTEN[d.tt]]);return}
    if(r.dongY==='branch'&&ns(d.gv).dt!==r.dt){bo.push([d.id,'người xin nghỉ thuộc '+ns(d.gv).dt+' — ngoài điểm trường của bạn']);return}
    if(loai(d.loai).giay&&!d.tep.length){bo.push([d.id,'thiếu hồ sơ bắt buộc — mở từng đơn để cân nhắc, không đồng ý hàng loạt được']);return}
    ok.push(d)});
   _ok=ok;
   bangHaiKhoi('Kết quả đồng ý hàng loạt',ok,bo,{ten:'Đồng ý được',tomTat:ok.length?`sinh <b>${ok.reduce((s,d)=>s+tietDon(d).length,0)} tiết</b> nhu cầu dạy thay ở M4.7`:'',
     cot:['Đơn','Người xin nghỉ','Số ngày','Tiết'],dong:d=>`<td><b>${d.id}</b></td><td>${ns(d.gv).n}</td><td>${soNgay(d)}</td><td>${tietDon(d).length}</td>`},
     n=>`<button class="btn p" data-x="ok-dy-loat" ${n?'':'disabled'}>Đồng ý ${n} đơn</button>`);return}
 if(x==='ok-dy-loat'){_ok.forEach(ghiDongY);const n=_ok.length;chon.clear();closeModal();render();
   toast(`✓ Đã đồng ý <b>${n} đơn</b> — có hiệu lực, nhu cầu dạy thay đã sinh ở M4.7`);return}

 /* --- 🔏 ký --- */
 if(x==='ky'){const d=don(t.dataset.i);
   modal('Ký quyết định cho nghỉ — '+d.id,`<div class="info">Đơn <b>${soNgay(d)} ngày</b> của <b>${ns(d.gv).n}</b> — <b>đã có hiệu lực</b> từ ${d.gui}.</div>
    <div class="danger">🔒 <b>Ký số Nhóm B — bắt buộc, không bỏ qua được.</b> Quyết định là căn cứ tính lương và BHXH.
      Ký chậm không làm người nghỉ phải đi làm lại — nó <b>chặn chốt lương</b> tháng có ngày nghỉ này.</div>
    <div class="f"><div class="k">Người ký</div><div class="v">Trần Văn Hùng — Hiệu trưởng</div></div>
    <div class="f"><div class="k">Chứng thư</div><div class="v">CTS-HT-2026 · còn hạn đến 31/12/2027 ${dlink('M4.11','M4.11')}</div></div>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn g" data-x="ok-ky" data-i="${d.id}">✍ Ký</button>`);return}
 if(x==='ok-ky'){const d=don(t.dataset.i);d.quyetDinh.da_ky_luc=HOMNAY_S+' '+GIO_NAY;closeModal();render();
   toast(`✍ Đã ký <b>Quyết định cho nghỉ ${d.id}</b> — Nhóm B · M7.x được chốt lương tháng này`);return}

 /* --- 📎 thiếu hồ sơ --- */
 if(x==='nhac'){const d=don(t.dataset.i);toast(`📨 Đã nhắc <b>${ns(d.gv).n}</b> bổ sung hồ sơ cho ${d.id} · đơn <b>vẫn có hiệu lực</b> · ghi audit`);return}
 if(x==='nhan-giay'){const d=don(t.dataset.i);d.daNhanGiay=1;render();
   toast(`✓ Đã ghi nhận hồ sơ của <b>${d.id}</b> (bản giấy nộp tại văn phòng) · rời khối 📎 · ghi audit`);return}

 /* --- rút của người nhập hộ: chỉ vùng ⚪ --- */
 if(x==='rut-ho'){const d=don(t.dataset.i);
   modal('Rút ngày — người nhập hộ — '+d.id,
    `<div class="ro">Bạn là <b>người nhập hộ</b>: chỉ rút được ngày ở <b>vùng ⚪</b> (chưa xếp người, tiết chưa bắt đầu). Ngày đã có hệ quả thì chính
      <b>${ns(d.gv).n}</b> rút ở M0.4, hoặc người chấm công đính chính ở M4.9.</div>
     ${d.ngay.filter(g=>!g.da_rut).map(g=>{const v=vungThuHoi(d,g.ngay);
      return `<label class="uv ${v===1?'':'loai'}" style="cursor:${v===1?'pointer':'not-allowed'}"><input type="checkbox" data-rutngay="${g.ngay}" checked>
       <div class="sp"><b>${g.ngay}</b> <span class="st2 ${VUNG[v][1]}">${VUNG[v][0]} ${VUNG[v][2]}</span></div></label>`}).join('')}
     <div class="mini">Một nút — máy phân loại từng ngày, kết quả hiện bảng hai khối.</div>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn d" data-x="rut-ho-xem" data-i="${d.id}">Rút các ngày đã tick</button>`);return}
 if(x==='rut-ho-xem'){const d=don(t.dataset.i);
   const tick=[...document.querySelectorAll('[data-rutngay]')].filter(c=>c.checked).map(c=>c.dataset.rutngay);
   if(!tick.length){toast('Chưa tick ngày nào');return}
   const ok=[],bo=[];
   tick.forEach(n=>{const v=vungThuHoi(d,n);
    if(v===1)ok.push(n);
    else bo.push([n,v===2?'🟡 đã xếp người dạy thay — người nhập hộ không rút được; '+ns(d.gv).n+' rút ở M0.4 (bắt lý do)'
      :'🔴 tiết đã bắt đầu / đã có kết luận chấm công — chỉ người chấm công đính chính ở M4.9'])});
   _rut={id:d.id,ok};
   bangHaiKhoi('Kết quả rút ngày — '+d.id,ok,bo,{ten:'Rút được',tomTat:ok.length?'M4.7 xóa nhu cầu dạy thay <b>im lặng</b>':'',
     cot:['Ngày','Vùng'],dong:n=>`<td><b>${n}</b></td><td>⚪ vùng 1</td>`},
     n=>`<button class="btn d" data-x="ok-rut-ho" ${n?'':'disabled'}>Rút ${n} ngày</button>`);return}
 if(x==='ok-rut-ho'){const d=don(_rut.id);
   _rut.ok.forEach(n=>{const g=d.ngay.find(z=>z.ngay===n);Object.assign(g,{da_rut:true,rut_luc:HOMNAY_S+' '+GIO_NAY,rut_boi:toi().id,ly_do_rut:null})});
   if(d.ngay.every(g=>g.da_rut))d.tt='da_rut';
   closeModal();render();toast(`Đã rút <b>${_rut.ok.length} ngày</b> của ${d.id}${d.tt==='da_rut'?' — mọi ngày đã rút, đơn sang <b>Đã rút</b>':''} · báo ${ns(d.gv).n}`);return}

 /* --- tạo đơn hộ --- */
 if(x==='tao-ho'){moTaoHo();return}
 if(t.dataset.ho&&!x){hoCho=+t.dataset.ho;soanHo();return}
 if(t.dataset.uv){fUV=fUV===+t.dataset.uv?null:+t.dataset.uv;docForm();veSoan();return}
 if(x==='ghi-ho'){
   const p=ns(hoCho),l=loai($('#sLoai').value),ly=$('#sLy').value.trim();docForm();
   if(!$('#sHT').value){toast('⛔ Bắt buộc chọn <b>căn cứ nhận đơn</b> — người xin nghỉ không tự gửi nên phải có căn cứ để nhập thay');return}
   if(pd(fDen)<pd(fTu)){toast('⛔ Ngày kết thúc phải từ ngày bắt đầu trở đi');return}
   const ngays=dsNgayLV(fTu,fDen);if(!ngays.length){toast('⛔ Khoảng ngày không có ngày làm việc nào');return}
   if(!ly){toast('⛔ Bắt buộc nêu lý do');return}
   if(fUV&&!($('#sGhi')&&$('#sGhi').value.trim())){toast('⛔ Đã điền tên người dạy thay thì <b>bắt buộc ghi chú thỏa thuận</b>');return}
   const d={id:'NP-2026-'+(++seq),gv:p.id,nhapHo:toi().id,canCu:$('#sHT').value,gui:HOMNAY_S+' '+GIO_NAY,kenh:'Web — nhập hộ',
    loai:l.ma,coChe:l.coChe,tt:l.coChe==='can_thoa_thuan'?'cho_dong_y':'co_hieu_luc',ly,deXuat:fUV,ghiTho:fUV?$('#sGhi').value.trim():'',
    tep:[],nhan:['nhap_ho'],quyetDinh:null,deNghiDoiNgay:null,daXep:[],ngay:ngays.map(z=>ng(z,ngays.length===1?fBuoi:'ca_ngay'))};
   if(pd(fTu)<=HOMNAY)d.nhan.push('bao_muon');
   if(vuotQuy(p,l,soNgay(d)))d.nhan.push('vuot_quy');
   if(l.coChe==='ghi_nhan_quyet_dinh'||soNgay(d)>CFG.nguongQD)d.quyetDinh={can_ky:true,da_ky_luc:null};
   if(hoBV)d.baoVang={id:hoBV,boi:null,luc:null,kenh:null};
   DON.unshift(d);closeModal();tab='tong';render();
   toast(`Đã ghi nhận <b>${d.id}</b> hộ <b>${p.n}</b> · ${TTEN[d.tt]} · căn cứ: ${d.canCu} · nhãn ${d.nhan.map(k=>NHANTEN[k]).join(', ')}${d.quyetDinh?' · quyết định chờ HT ký':''}${d.baoVang?' · đã ghép báo vắng '+d.baoVang.id+' · <b>↩ quay lại '+(hoVe||'M4.9')+'</b>':''}`);hoBV=null;hoVe=null;return}

 /* --- tệp --- */
 if(x==='xem-tep'){const d=don(t.dataset.i),f=d.tep[+t.dataset.k];
   modal('👁 '+f.ten,`<div class="ro">Xem <b>ngay trong màn hình</b>, không tải về máy.</div>
    <div class="fview">📄 <b>${f.ten}</b><br><span class="mini">${f.kb} KB · bản xem trước</span></div>
    <div class="warn" style="margin-top:11px">Đã ghi <b>audit</b>: <b>${toi().n}</b> xem <b>${f.ten}</b> của ${d.id} lúc ${HOMNAY_S} ${GIO_NAY}.</div>`,
    '<button class="btn" data-x="close">Đóng</button>');return}
 if(x==='tai-tep'){const d=don(t.dataset.i),f=d.tep[+t.dataset.k];toast(`⬇ Đã tải <b>${f.ten}</b> · ghi audit — dữ liệu sức khỏe`);return}

 /* --- xuất --- */
 if(x==='xuat'){modal('Xuất danh sách đơn nghỉ',
   `<label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>
    <select class="fldi" id="mdx"><option value="">— Chọn mục đích —</option><option>Đối chiếu chấm công tháng</option>
     <option>Báo cáo Ban giám hiệu</option><option>Lưu hồ sơ nhà trường</option><option>Báo cáo cơ quan quản lý</option></select>
    <label class="lbl" style="display:flex;align-items:center;gap:8px;margin-top:13px"><input type="checkbox" id="mdLy"> <b>Kèm cột Lý do nghỉ</b></label>
    <div class="warn">Mặc định <b>KHÔNG kèm lý do nghỉ</b> — dữ liệu sức khỏe. Bản xuất <b>không bao giờ kèm tệp</b>. Mỗi ngày một dòng kèm cờ đã rút.</div>`,
   '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-xuat">⬇ Xuất</button>');return}
 if(x==='ok-xuat'){if(!$('#mdx').value){toast('⛔ Bắt buộc chọn mục đích sử dụng trước khi xuất');return}
   const k=$('#mdLy').checked;closeModal();toast(`⬇ Đã xuất · <b>${k?'CÓ':'không'}</b> kèm lý do nghỉ · không kèm tệp · ghi audit kèm mục đích`);return}

 /* --- cấu hình --- */
 if(x==='cfg-loai'){moSuaLoai(t.dataset.i);return}
 if(x==='cfg-loai-moi'){moSuaLoai(null);return}
 if(x==='cl-ok'){
   const ma=t.dataset.i||$('#clMa').value.trim().toUpperCase(),ten=$('#clTen').value.trim();
   if(!ma||!ten){toast('⛔ Bắt buộc nhập mã và tên loại nghỉ');return}
   if(!t.dataset.i&&loai(ma)){toast(`⛔ Mã <b>${ma}</b> đã tồn tại`);return}
   const mx=$('#clMax').value.trim();if(mx&&(isNaN(+mx)||+mx<1)){toast('⛔ Số ngày tối đa phải là số nguyên dương, hoặc để trống');return}
   const moi={ma,ten,luong:$('#clLuong').value,coChe:$('#clCoChe').value,giay:$('#clGiay').checked?1:0,quy:$('#clQuy').checked?1:0,
    max:mx?+mx:null,ghi:$('#clGhi').value.trim(),tt:'ap'};
   /* cửa chặn 4 ngay ở form — không để đề xuất sai lọt vào hàng chờ */
   if(moi.luong==='Không lương'&&moi.coChe!=='can_thoa_thuan'){
    toast(`⛔ Loại <b>${ten}</b> không hưởng lương thì cơ chế <b>bắt buộc Cần thỏa thuận</b> — BLLĐ 2019 Điều 115 khoản 3`);return}
   const cu=t.dataset.i?loai(ma):null,dif=[];
   if(cu){[['ten','tên'],['luong','chế độ lương'],['coChe','cơ chế'],['giay','hồ sơ'],['quy','trừ quỹ'],['max','tối đa/năm'],['ghi','ghi chú']]
     .forEach(([k,n])=>{if((cu[k]??null)!==(moi[k]??null))dif.push(n+' '+(k==='coChe'?COCHE[cu[k]]+' → '+COCHE[moi[k]]:(k==='ghi'?'':(cu[k]??'—')+' → '+(moi[k]??'—'))))});
    if(!dif.length){toast('Không có gì thay đổi');return}}
   themDeXuat(cu?`Sửa loại nghỉ <b>${cu.ten}</b>: ${dif.join('; ')}`:`Thêm loại nghỉ <b>${ten}</b> (${ma}) — ${COCHE[moi.coChe]}`,()=>{cu?Object.assign(cu,moi):LOAI.push(moi)});
   cfgTam++;closeModal();render();toast('✎ Đã ghi vào đề xuất — <b>chưa có hiệu lực</b>');return}
 if(x==='cfg-tat'){const l=loai(t.dataset.i);
   if(l.tt==='ap'){const dang=DON.filter(d=>d.loai===l.ma&&['nhap','cho_dong_y'].includes(d.tt));
    if(dang.length){modal('⛔ Không ngừng áp dụng được — còn đơn đang mở',
     `<div class="danger">Loại <b>${l.ten}</b> còn <b>${dang.length} đơn</b> ở Nháp / Chờ đồng ý.</div>
      <table><thead><tr><th>Đơn</th><th>Người xin nghỉ</th><th>Trạng thái</th></tr></thead><tbody>
      ${dang.map(d=>`<tr class="badrow"><td><b>${d.id}</b></td><td>${ns(d.gv).n}</td><td>${TTEN[d.tt]}</td></tr>`).join('')}</tbody></table>`,
     '<button class="btn" data-x="close">Đóng</button>');return}
    themDeXuat(`<b>Ngừng áp dụng</b> loại nghỉ <b>${l.ten}</b>`,()=>{l.tt='ngung'})}
   else themDeXuat(`<b>Dùng lại</b> loại nghỉ <b>${l.ten}</b>`,()=>{l.tt='ap'});
   cfgTam++;render();toast('✎ Đã ghi vào đề xuất — chưa có hiệu lực');return}
 if(x==='cfg-gui'){cfgTam=0;render();toast(`✎ Đã chuyển <b>${CFG_CHO.length} thay đổi</b> sang Hiệu trưởng duyệt`);return}
 if(x==='cfg-ok'){const c=CFG_CHO.find(z=>z.id===t.dataset.i),loi=apThu([c]);
   if(loi){toast('⛔ '+loi+'. Cấu hình <b>giữ nguyên</b>');render();return}
   CFG_CHO=CFG_CHO.filter(z=>z.id!==c.id);render();toast('✓ Đã duyệt · có hiệu lực với đơn tạo MỚI — đơn đã gửi giữ cơ chế lúc gửi');return}
 if(x==='cfg-ok-all'){const loi=apThu(CFG_CHO);
   if(loi){toast('⛔ '+loi+'. <b>Toàn bộ thay đổi bị hoàn tác</b>');render();return}
   CFG_CHO=[];render();toast('✓ Đã duyệt mọi thay đổi cấu hình');return}
 if(x==='cfg-bo'){CFG_CHO=CFG_CHO.filter(z=>z.id!==t.dataset.i);render();return}
});
function docForm(){if($('#sTu'))fTu=$('#sTu').value;if($('#sDen'))fDen=$('#sDen').value;if($('#sLoai'))fLoaiSoan=$('#sLoai').value;
 if($('#sBuoi'))fBuoi=$('#sBuoi').value;if($('#sHT'))fHT=$('#sHT').value}
function ghiDongY(d){d.tt='co_hieu_luc';d.dongY={boi:toi().id,luc:HOMNAY_S+' '+GIO_NAY};
 if(soNgay(d)>CFG.nguongQD&&!d.quyetDinh)d.quyetDinh={can_ky:true,da_ky_luc:null}}
function nhuCau(d){const n=tietDon(d).filter(t=>pd(t.ngay)>=HOMNAY).length;
 return n?`sinh <b>${n} tiết</b> nhu cầu dạy thay ở M4.7 tab Giáo viên vắng`:'không có tiết — không sinh nhu cầu dạy thay'}
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fTT'){fTT=el.value;render();return}
 if(el.id==='fLoai'){fLoai=el.value;render();return}
 if(el.id==='fNhan'){fNhan=el.value;render();return}
 if(el.id==='fDT'){fDT=el.value;render();return}
 if(['sLoai','sTu','sDen','sBuoi'].includes(el.id)){docForm();if(dsNgayLV(fTu,fDen).length!==1)fBuoi='ca_ngay';veSoan();return}
 if(el.id==='sHT'){fHT=el.value;return}
 if(el.id==='cfgQD'){const v=+el.value;
   if(!(v>=1)||!Number.isInteger(v)){toast('⛔ Ngưỡng phải là số nguyên dương');render();return}
   if(v===CFG.nguongQD)return;const cu=CFG.nguongQD;
   themDeXuat(`Quyết định HT ký cho đơn dài hơn <b>${cu} → ${v} ngày</b>`,()=>{CFG.nguongQD=v});cfgTam++;render();toast('✎ Đã ghi vào đề xuất');return}
 if(el.id==='ckAll'){const ds=choDongY();el.checked?ds.forEach(d=>chon.add(d.id)):chon.clear();render();return}
 if(el.dataset.ck!==undefined){el.checked?chon.add(el.dataset.ck):chon.delete(el.dataset.ck);render();return}
});

function render(){
 tabs();
 const n=demXuLy();$('#ndot').textContent=n||'';$('#ndot').style.display=n?'grid':'none';
 const r=R();
 $('#topact').innerHTML='';
 if(r.chan){$('#content').innerHTML=chanTab();return}
 $('#content').innerHTML=scopeBar()+(tab==='xuly'?xulyTab():tab==='tong'?tongTab():cauhinhTab());
}
render();
/* Deep-link NHẬN (PHIEU-YKNP-1D E1): M4.8?action=tao&nguoi=<id>&tu=<dd/mm/yyyy>&den=<dd/mm/yyyy>&bao_vang=<BV id>&return=M4.9
   — mở sẵn form tạo đơn hộ §8b. Vai không có quyền T ở Tổng hợp thì không mở. */
(function(){try{
 const q=new URLSearchParams(location.search);
 /* YKNP-3Z2 (17/9/2026): NHẬN ?ctx=<don_nghi_id>&action=duyet&return=M0.1|M0.2 — mở sẵn đơn ở khối 🟡 / 🔏 / 📎 của tab Đơn nghỉ cần xử lý.
    Giờ rút S4 thống nhất 08:40 (bảng S② PHIEU-YKNP-3Z — M4.7 chủ bản ghi gỡ phân công). */
 if(q.get('action')==='duyet'&&q.get('ctx')){
  const d=don(q.get('ctx')),ve=q.get('return')||'';
  if(!d||!trongPV(d)){toast(`⛔ Không có đơn <b>${q.get('ctx')}</b> trong phạm vi của vai này — bản ghi ngoài phạm vi không trả về`);return}
  const o=choDongY().includes(d)?'🟡 chờ bạn đồng ý':choKy().includes(d)?'🔏 quyết định chờ bạn ký':thieuHS().includes(d)?'📎 thiếu hồ sơ':'';
  tab='xuly';render();xemDon(d.id);
  toast(o?`↩ Mở từ <b>${ve||'menu gọi'}</b> — đơn <b>${d.id}</b> đang ở khối <b>${o}</b>`:`↩ Mở từ <b>${ve||'menu gọi'}</b> — đơn <b>${d.id}</b> <b>không còn chờ bạn</b> (${TTEN[d.tt]}) — có thể người khác đã xử lý`);
  return}
 if(q.get('action')!=='tao'||!q.get('nguoi')||!R().taoHo)return;
 const p=ns(+q.get('nguoi'));if(!p||p.nghiViec)return;
 tab='tong';render();hoCho=p.id;soanHo();
 if(q.get('tu'))fTu=q.get('tu');fDen=q.get('den')||fTu;hoBV=q.get('bao_vang');hoVe=q.get('return');fHT='Gọi điện báo';veSoan();
}catch(e){}})();
</script>
