function inScope(x){const r=R();
 if(r.sc==='mon')return !!(x.mon14&&x.mon14.indexOf(r.mon)>=0);
 if(r.sc==='class')return x.lop===r.lop;

}

function scopeText(){const r=R();
 if(F())return `Bạn đang ở vai trò <b>Hiệu trưởng</b> và demo <b>mở toàn quyền</b> để thao tác thử mọi chức năng — kể cả nhập kết quả và nhập điểm, việc thực tế thuộc giáo viên chủ nhiệm và giáo viên bộ môn. <b>Phân quyền thật xem §2.3 và §8 của tài liệu.</b>`;

}

/* ===== nhom viec: Diem truong -> Khoi -> NOI DUNG (ren luyen he | tung mon danh gia lai) ===== */
function nhomViec(){
 const g={};
 dsHS().forEach(x=>{
  if(x.nd13&&R().sc!=='mon'){
   const k=x.dt+'|'+x.khoi+'|RL';
   (g[k]=g[k]||{dt:x.dt,khoi:x.khoi,loai:'rl',ten:x.cap==='TH'?'Hướng dẫn, giúp đỡ trong hè':'Rèn luyện hè',
     cc:x.cap==='TH'?'TT 27 Điều 11':'TT 22 Điều 13',hs:[]}).hs.push(x);
  }
  (x.mon14||[]).forEach(m=>{
   if(R().sc==='mon'&&m!==R().mon)return;
   const k=x.dt+'|'+x.khoi+'|M:'+m;
   (g[k]=g[k]||{dt:x.dt,khoi:x.khoi,loai:'mon',mon:m,ten:'Đánh giá lại môn '+m,
     cc:'TT 22 Điều 14',gv:MON_GV[m]||'—',hs:[]}).hs.push(x);
  });
 });
 return g;
}
function xong(gr,x){
 if(gr.loai==='rl')return !!(KQ13[x.ma]&&KQ13[x.ma].kq);
 return KQ14[x.ma+'|'+gr.mon]!==undefined;
}
function coBC(x){return !!(KQ13[x.ma]&&KQ13[x.ma].bc)}
function daGiao(x){return !!GIAO[x.ma]}
/* ket luan DE NGHI cho tung hoc sinh — day la DE NGHI, HT moi la nguoi ket luan */
function deNghi(x){
 const o={};
 if(x.nd13){const k=KQ13[x.ma];
  o.rl=(k&&k.kq==='Hoàn thành'&&k.bc)?'Đạt':'Chưa đạt';
  o.rlLy=!k||!k.kq?'chưa nhập kết quả':!k.bc?'chưa có báo cáo cha mẹ ký':k.kq;
 }
 if(x.mon14){const ds=x.mon14.map(m=>KQ14[x.ma+'|'+m]);
  o.thieuMon=x.mon14.filter(m=>KQ14[x.ma+'|'+m]===undefined);
  o.ht=(!o.thieuMon.length&&ds.every(v=>v>=5.0))?'Đạt':'Chưa đạt';
  o.htLy=o.thieuMon.length?('chưa có điểm: '+o.thieuMon.join(', ')):x.mon14.map(m=>m+' '+KQ14[x.ma+'|'+m].toFixed(1).replace('.',',')).join(' · ');
 }
 return o;
}
function duDL(x){
 const d=deNghi(x);
 if(x.nd13&&(!KQ13[x.ma]||!KQ13[x.ma].kq||!KQ13[x.ma].bc))return false;
 if(x.mon14&&d.thieuMon.length)return false;
 return true;
}
function thieuGi(x){
 const t=[];
 if(x.nd13){const k=KQ13[x.ma];
  if(!k||!k.kq)t.push('chưa nhập kết quả rèn luyện hè');
  else if(!k.bc)t.push('chưa có báo cáo cha mẹ ký — bắt buộc theo Đ.13 k.3');}
 if(x.mon14){const m=x.mon14.filter(z=>KQ14[x.ma+'|'+z]===undefined);
  if(m.length)t.push('chưa có điểm môn '+m.join(', '));}
 if(x.nd13&&!daGiao(x))t.push('chưa giao nhiệm vụ và thông báo gia đình');
 return t;
}
function tienDo(){
 const g=nhomViec();let t=0,d=0;
 Object.keys(g).forEach(k=>g[k].hs.forEach(x=>{t++;if(xong(g[k],x))d++}));
 return {t:t,d:d};
}

 /* --- tien do --- */
 const chuaGiao=ds.filter(x=>x.nd13&&!daGiao(x)),chuaBC=ds.filter(x=>x.nd13&&KQ13[x.ma]&&KQ13[x.ma].kq&&!KQ13[x.ma].bc);
 h+=`<div class="nh4">

   <div class="nbox ${td.d===td.t?'n1':'n3'}"><div class="v">${td.d}/${td.t}</div><div class="l">Đầu việc đã có kết quả<br><span style="font-weight:400">mỗi học sinh × mỗi nội dung là một đầu việc</span></div></div>
   <div class="nbox ${chuaGiao.length?'n4':'n1'}"><div class="v">${chuaGiao.length}</div><div class="l">Chưa giao nhiệm vụ<br><span style="font-weight:400">Đ.13 k.3 — bắt buộc thông báo gia đình</span></div>
     ${chuaGiao.length&&(r.giaoNV||F())?`<div class="s"><button class="btn xs p" data-x="giaonv">📤 Giao và thông báo</button></div>`:''}</div>
   <div class="nbox ${KYCHOT?'n1':'n5'}"><div class="v" style="font-size:15px;padding-top:7px">${KYCHOT?'🖊 Đã ký chốt':TINH?'⟳ Đã chạy tính':'✎ Đang nhập'}</div>
     <div class="l">Trạng thái</div>
     <div class="s">${KYCHOT?KYCHOT.by+' · '+KYCHOT.at:TINH?TINH.by+' · '+TINH.at:'Kết quả còn sửa được'}</div></div>
 </div>`;
 if(LOP_CHUA_CHOT.length)h+=`<div class="warn">⚠ Còn <b>${LOP_CHUA_CHOT.length} lớp chưa ký chốt kết quả tổng kết ở M3.1</b> —
   ${LOP_CHUA_CHOT.join(', ')} — học sinh các lớp đó <b>chưa vào danh sách này</b>. Chốt xong ở M3.1 thì các em tự xuất hiện.
   <button class="btn xs" data-go="M3.1?tab=lop&return=M3.2">↗ M3.1</button></div>`;
 if(chuaBC.length)h+=`<div class="warn">📎 <b>${chuaBC.length} em đã có kết quả nhưng chưa có báo cáo cha mẹ ký</b> —
   ${chuaBC.map(x=>x.n+' ('+x.lop+')').join(', ')}. Điều 13 khoản 3 bắt buộc, thiếu thì chạy tính sẽ bỏ qua.</div>`;

 /* --- thanh cong cu --- */
 h+=`<div class="bar">
   <input class="inp" id="q" placeholder="Tìm tên hoặc mã học sinh — gõ để phẳng hóa nhóm…" value="${q}">

   <div class="spacer"></div>
   ${!q?`<button class="btn xs" data-x="motat">▾ Mở tất cả</button><button class="btn xs" data-x="dongtat">▸ Đóng tất cả</button>`:''}
   ${(r.tinh||F())&&!KYCHOT?`<button class="btn sm" data-x="tinh">⟳ Chạy tính kết quả</button>`:''}
   ${(r.ky||F())&&!KYCHOT?`<button class="btn sm p" data-x="ky">🖊 Rà soát và ký chốt</button>`:''}
 </div>`;
 if(KYCHOT)h+=`<div class="ok">🖊 <b>Hiệu trưởng đã ký chốt kết quả trong hè</b> · ${KYCHOT.by} · ${KYCHOT.at} · ${KYCHOT.m} · ${KYCHOT.n} học sinh.
   Kết quả đã ghi thành <b>giá trị thứ hai</b> vào học bạ và <b>bàn giao sang M3.3</b>. Danh sách khóa lại, không nhập được nữa.
   <button class="btn xs p" data-go="M3.3?return=M3.2">↗ Mở M3.3</button></div>`;

 /* --- danh sach --- */
 h+=`<div class="stage ${curHS?'open':''}"><div class="listw">`;
 if(q){
  const rows=ds.filter(x=>(x.n+' '+x.ma).toLowerCase().includes(q.toLowerCase()));
  h+=`<div class="grph">🔎 Đang tìm kiếm — đã phẳng hóa, bỏ tầng gom nhóm · ${rows.length} học sinh</div>`;
  if(!rows.length)h+='<div class="empty">Không có học sinh nào khớp.</div>';
  rows.forEach(x=>h+=dongPhang(x));
 }else{
  const g=nhomViec();
  /* sap xep: Diem truong -> Khoi theo SO (khong phai theo chu) -> ren luyen he truoc, mon sau */
  const soKhoi=t=>parseInt(String(t).replace(/\D/g,''),10)||0;
  const ks=Object.keys(g).sort((a,b)=>{const A=g[a],B=g[b];
   if(A.dt!==B.dt)return A.dt<B.dt?-1:1;
   if(A.khoi!==B.khoi)return soKhoi(A.khoi)-soKhoi(B.khoi);
   if(A.loai!==B.loai)return A.loai==='rl'?-1:1;
   return (A.mon||'')<(B.mon||'')?-1:1});
  if(!ks.length)h+='<div class="empty">Không có học sinh nào phải xử lý trong hè trong phạm vi này.</div>';
  let cdt='',ckh='';
  ks.forEach(k=>{const gr=g[k];
   let hs=gr.hs.filter(x=>{
    if(fTT==='Chưa có kết quả')return !xong(gr,x);
    if(fTT==='Đã có kết quả')return xong(gr,x);
    if(fTT==='Chưa giao nhiệm vụ')return gr.loai==='rl'&&!daGiao(x);
    if(fTT==='Chưa có báo cáo cha mẹ ký')return gr.loai==='rl'&&!coBC(x);
    return true});
   if(!hs.length)return;
   if(gr.dt!==cdt){cdt=gr.dt;ckh='';h+=`<div class="grph gdt">📍 ${gr.dt}</div>`}
   if(gr.khoi!==ckh){ckh=gr.khoi;h+=`<div class="grph gkh">${gr.khoi}</div>`}
   h+=nhomBox(k,gr,hs);
  });
 }
 h+=`</div><div class="panel">${curHS?panelHS():''}</div></div>`;
 return h;
}
function nhomBox(k,gr,hs){

 const sua=(r.nhapKQ||F())&&!khoa;
 let h=`<div class="gwork ${mo?'mo':''}" data-gw="${k}">
   <span class="ar">${mo?'▾':'▸'}</span>
   <span class="gic">${gr.loai==='rl'?'☀️':'📚'}</span>
   <b>${gr.ten}</b>
   <span class="st2 n">${gr.cc}</span>
   ${gr.gv?`<span style="font-size:11.5px;color:var(--ink3)">GV ${gr.gv}</span>`:''}
   <div class="spacer"></div>
   <span class="gsum ${xg===hs.length?'ok':''}">${xg}/${hs.length} đã có kết quả</span>
  </div>`;
 if(!mo)return h;
 h+=`<div class="gbody">`;
 if(sua)h+=`<div class="gtools">
   ${gr.loai==='rl'?`<button class="btn xs" data-x="tatca" data-g="${k}">✔ Đặt tất cả = Hoàn thành</button>`
     :`<button class="btn xs" data-x="tatca" data-g="${k}">✎ Điền nhanh một điểm cho cả nhóm</button>`}
   ${(r.importKQ||F())?`<button class="btn xs" data-x="import" data-g="${k}">📥 Import kết quả nhóm này</button>`:''}
   <button class="btn xs" data-x="mau" data-g="${k}">⬇ Tải tệp mẫu</button>
   <div class="spacer"></div>
   <span style="font-size:11px;color:var(--ink3)">Nhập thẳng trong bảng — Enter hoặc rời ô là lưu, ghi audit</span>
  </div>`;
 h+=`<table class="gtbl"><thead><tr><th>Học sinh</th><th>Lớp</th>
   ${gr.loai==='rl'?`<th>Nội dung phải rèn luyện</th><th style="width:170px">Kết quả</th><th style="width:190px">Báo cáo cha mẹ ký</th><th style="width:120px">Giao nhiệm vụ</th>`
    :`<th>Điểm cả năm cũ</th><th style="width:110px">Điểm đánh giá lại</th><th style="width:110px">Kết quả môn</th>`}
   </tr></thead><tbody>`;
 hs.forEach(x=>{
  h+=`<tr><td><b data-hs="${x.ma}" style="cursor:pointer;color:var(--brand)">${x.n}</b><div class="mm">${x.ma}</div></td>
   <td>${x.lop}<div class="mm">GVCN ${GVCN_MAP[x.lop]||'—'}</div></td>`;
  if(gr.loai==='rl'){
   const kq=KQ13[x.ma]||{};
   h+=`<td class="mm">${x.nd13}</td>
    <td>${sua?`<select class="fs w100" data-kq13="${x.ma}">
       <option value="">— chưa nhập —</option>
       ${opt(kq.kq||'','Hoàn thành')}${opt(kq.kq||'','Chưa hoàn thành')}</select>`
      :kq.kq?`<span class="st2 ${kq.kq==='Hoàn thành'?'o':'r'}">${kq.kq}</span>`:'<span class="st2 w">chưa nhập</span>'}</td>
    <td>${kq.bc?`📄 <span class="mm">${kq.bc}</span>
        <button class="btn xs p" data-x="xemfile" data-f="${kq.bc}">👁</button>
        <button class="btn xs" data-x="taifile" data-f="${kq.bc}">⬇</button>`
      :sua?`<button class="btn xs" data-x="upbc" data-ma="${x.ma}">📎 Đính kèm</button> <span style="color:var(--red);font-size:11px">bắt buộc</span>`
      :'<span style="color:var(--red);font-size:11px">chưa có</span>'}</td>
    <td>${daGiao(x)?`<span class="st2 o">✔ ${GIAO[x.ma]}</span>`

  }else{

 });
 return h+'</tbody></table></div>';

 }

   ${x.mon14?`<div class="k">Học tập cả năm</div><div><span style="text-decoration:line-through;color:var(--ink3)">Chưa đạt</span> → <b style="color:var(--violet)">${d.ht}</b><div class="mm">${d.htLy}</div></div>`:''}

 if(e.target.id==='ftt'){fTT=e.target.value;render();return}
 const k13=e.target.closest('[data-kq13]');
 if(k13){const ma=k13.dataset.kq13,v=k13.value;
  if(!v){delete KQ13[ma];toast('Đã xóa kết quả · ghi audit')}
  else{KQ13[ma]=Object.assign({},KQ13[ma]||{},{kq:v});toast('Đã lưu: '+v+' · ghi audit')}
  render();return}
 const d14=e.target.closest('[data-d14]');
 if(d14){const k=d14.dataset.d14,raw=d14.value.trim();
  if(raw===''){delete KQ14[k];toast('Đã xóa điểm · ghi audit');render();return}
  const v=parseFloat(raw.replace(',','.'));
  if(isNaN(v)||v<0||v>10){toast('Điểm phải từ 0 đến 10');render();return}
  KQ14[k]=Math.round(v*10)/10;
  toast('Đã lưu điểm '+k.split('|')[1]+' = '+v.toFixed(1).replace('.',',')+(v>=5?' · Đạt':' · Chưa đạt')+' · ghi audit');
  render();return}
});
document.body.addEventListener('input',e=>{
 if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();
  const el=$('#q');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
});
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')$('#mask').classList.remove('on')});
render();
</script>
