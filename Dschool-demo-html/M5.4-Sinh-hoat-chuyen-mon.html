<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M5.4 Sinh hoạt chuyên môn — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--red);color:#fff}
.totabs{display:flex;gap:4px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-top:none;
 border-radius:0 0 10px 10px;padding:6px 10px 6px 22px;flex-wrap:wrap}
.totabs .lb{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.totab{padding:4px 12px;border-radius:999px;font-size:12.5px;color:var(--ink2);border:1px solid transparent}
.totab.on{background:#fff;border-color:var(--brand);color:var(--brand);font-weight:700}
.totab .vt{font-size:10px;opacity:.75;font-weight:400}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.scope.first{margin-top:12px}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber)}
.scope.rd{border-left-color:var(--red)}
.scope.vi{border-left-color:var(--violet)}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:210px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.qf{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;background:#fff}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1240px){.stage.open .listw{display:none}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:26px}
.hrow.gone{opacity:.6}
.gk{grid-template-columns:1.9fr 1.5fr .95fr .9fr .95fr 1.15fr 1.5fr}
.stage.open .gk{grid-template-columns:1.8fr 1.2fr}
.stage.open .kx{display:none}
.gv{grid-template-columns:1.15fr 2.2fr 1.1fr 1.5fr}
.gs{grid-template-columns:1.5fr .85fr .85fr 1fr 1.9fr}
.gd{grid-template-columns:2.4fr 1.15fr .85fr .85fr .85fr 1.1fr}
.gdd{grid-template-columns:2.6fr 1.2fr .9fr .6fr}
.gsh{grid-template-columns:1.25fr 1.25fr 2fr .8fr 1fr 1.35fr}
.stage.open .gsh{grid-template-columns:1.2fr 1.5fr}
.gnc{grid-template-columns:1.5fr 1.9fr 1.15fr 1.7fr 1fr .8fr}
.gvi{grid-template-columns:1.15fr 2.2fr 1.1fr 1.4fr}
.dd{display:grid;grid-template-columns:1.4fr 1fr 1.6fr;gap:9px;padding:7px 11px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.dd:last-child{border-bottom:none}
.dmg{display:flex;gap:5px;flex-wrap:wrap}
.dmb{border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:11.5px;background:#fff}
.dmb.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.dmb.on.ph{background:var(--amber);border-color:var(--amber)}
.dmb.on.kp{background:var(--red);border-color:var(--red)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chp{border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:11.5px;background:#fff;color:var(--ink2)}
.chp:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.stepbar{display:flex;gap:4px;align-items:center}
.sb1{flex:1;height:6px;border-radius:3px;background:var(--line)}
.sb1.dn{background:var(--green)}.sb1.cur{background:var(--brand)}
.ncb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:11px}
.ncb.dn{border-left:3px solid var(--green)}
.ncb.cur{border-left:3px solid var(--brand);box-shadow:0 2px 10px rgba(29,78,216,.08)}
.ncb.wait{border-left:3px solid var(--line2);opacity:.72}
.ncb h3{font-size:13.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.atch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;margin-bottom:6px;background:#fcfdfe}
.atch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:var(--violet-soft);color:#5b21b6}
.st2.y{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.eye{font-size:11px;color:var(--brand);border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:1px 7px}
.eye:hover{background:#e0e7ff}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.bc{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.bc button{color:var(--brand);font-weight:600}
.bc button:hover{text-decoration:underline}
.bc .cur{font-weight:700;color:var(--ink)}
.sumbar{display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;
 padding:9px 13px;flex-wrap:wrap;position:sticky;top:56px;z-index:25}
.mt{font-size:12px;color:var(--ink2);border-right:1px solid var(--line);padding-right:11px;line-height:1.35}
.mt b{display:block;font-size:14px;color:var(--ink);font-weight:700}
.mt.bad b{color:var(--red)}.mt.wr b{color:var(--amber)}.mt.gd b{color:var(--green)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:15px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbody{padding:13px 15px;max-height:calc(100vh - 290px);overflow-y:auto}
.pfoot{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.f{display:grid;grid-template-columns:132px 1fr;gap:11px;align-items:start;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11.5px;background:#fff;margin:0 4px 4px 0}
.lchip.ok{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.lchip.no{border-color:#fde68a;background:var(--amber-soft);color:#92400e}
.sech{font-size:13px;font-weight:700;margin:16px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sech .pill{font-weight:400}

.gsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:11px}
.gsec h3{font-size:13.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gf{margin-bottom:10px}
.gf label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:3px;font-weight:600}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;min-height:62px;resize:vertical;font-family:inherit}
.ta:focus{border-color:var(--brand);outline:none}
.ta.sm{min-height:44px}
.xlg{display:flex;gap:7px;flex-wrap:wrap}
.xlb{border:1px solid var(--line2);border-radius:999px;padding:6px 15px;font-size:13px;background:#fff;font-weight:600}
.xlb.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.bb{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fcfdfe}
.bb.me{background:var(--brand-soft);border-color:#bfdbfe}
.bb .h{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:6px;flex-wrap:wrap}
.bb .h b{font-size:12.5px}
.bb .r{font-size:12.5px;margin:4px 0}
.bb .r i{color:var(--ink3);font-style:normal;font-weight:600;display:block;font-size:11px}
.ph2{border:1px solid #ddd6fe;background:var(--violet-soft);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.agg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:8px 0}
.aggc{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;background:#fcfdfe}
.aggc b{display:block;font-size:15px;color:var(--ink)}
.bars{display:flex;gap:4px;align-items:flex-end;height:34px;margin-top:5px}
.barc{flex:1;text-align:center;font-size:9.5px;color:var(--ink3)}
.barc .bx{background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}

.viewer{display:grid;grid-template-columns:1fr 180px;gap:12px}
@media(max-width:760px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:230px;display:grid;place-items:center;position:relative;overflow:hidden}
.vsheet{background:#fff;width:82%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:13px 15px;font-size:8.5px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:9.5px;text-align:center;font-weight:800;margin-bottom:6px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:4px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.res{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:9px}
.resh{padding:7px 11px;font-size:12px;font-weight:700}
.resh.ok{background:var(--green-soft);color:#065f46}
.resh.sk{background:var(--amber-soft);color:#92400e}
.resr{padding:6px 11px;font-size:12.5px;border-top:1px solid var(--line);display:flex;gap:9px}
.resr .w{min-width:165px;font-weight:600}
.resr .r{color:var(--ink2);flex:1}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:840px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.blk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.blk:last-child{border-bottom:none}
.blk .ic{flex:0 0 18px;font-size:13px}
.blk .tx{flex:1}
.blk .tx b{display:block}
.stepn{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:12px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--bg);color:var(--ink2)}
.stp.on{background:var(--brand);color:#fff;font-weight:700}
.stp.dn{background:var(--green-soft);color:var(--green);font-weight:600}
.lbl{font-size:12px;color:var(--ink2);display:block;margin:9px 0 3px}
.lbl b{color:var(--red)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:8px 13px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35}
.sgb b{display:block}
.sgb span{font-size:10.5px;color:var(--ink3)}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.sgb.on span{color:var(--brand)}
.trow{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center;cursor:pointer}
.trow:hover{background:var(--brand-soft)}
.trow.busy{opacity:.6;cursor:not-allowed;background:#fafbfc}
.trow.busy:hover{background:#fafbfc}
.trow b{display:block}
.trow .s{display:block;font-size:10.5px;color:var(--ink3)}
.box{border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:290px;overflow-y:auto}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.rb.dt{border-color:#475569;color:#94a3b8}
.rb.dt.on{background:#fbbf24;color:#0f172a;border-color:#fbbf24}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}

<script>
"use strict";
const $=s=>document.querySelector(s);
/* Demo dat o THU SAU 20/11/2026 — TUAN 11 HK1, dong bo voi M5.2 va M5.3 */
let HOMNAY=new Date(2026,10,20);
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
const dm=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1);
const THU=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const thu=d=>THU[d.getDay()];
const ngay=(a,b)=>Math.round((a-b)/86400000);
const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3800)}

/* ===== TO CHUYEN MON ===== */

  gv:['Nguyễn Văn An','Trần Thị Bích','Lê Văn Dũng','Hoàng Văn Nam','Đỗ Thị Lan']},
 'Tổ Lý — Hóa — Sinh':{mon:['KHTN','Vật lí','Hóa học','Sinh học'],tt:'Vũ Đình Khoa',
  gv:['Vũ Đình Khoa','Nguyễn Thu Hà','Trịnh Văn Sơn']}};
const toCuaGV={};Object.keys(TOCM).forEach(t=>TOCM[t].gv.forEach(g=>toCuaGV[g]=t));
const NGHI={'Đỗ Thị Lan':'Nghỉ ốm dài ngày từ 09/11/2026 (M4.2)'};
const HAN_BB=3;   /* ngay — cau hinh M10.6 */

/* ===== LICH GIANG DAY (M4.7) — instance tiet hoc ===== */
let TSEQ=0;const TIET=[];
function addTiet(gv,lop,mon,khoi,d,tiet,phong,bai,coGA){
 TIET.push({id:'T'+(++TSEQ),gv:gv,lop:lop,mon:mon,khoi:khoi,ngay:d,tiet:tiet,phong:phong,bai:bai,coGA:coGA!==false,doi:null})}
const D=(dd,mm,yy)=>new Date(yy||2026,mm-1,dd);
/* Nguyen Van An */
[[4,11,3,'8A1','Bài 10. Tứ giác'],[11,11,2,'8A1','Bài 12. Hình bình hành'],
 [17,11,3,'9A1','Bài 13. Mở đầu về đường tròn',false],[18,11,3,'8A1','Bài 14. Hình thoi và hình vuông'],
 [19,11,1,'8A2','Bài 14. Hình thoi và hình vuông'],[20,11,4,'9A1','Bài 14. Cung và dây của một đường tròn',false],
 [25,11,2,'8A2','Bài 15. Định lí Thalès trong tam giác'],[26,11,3,'8A1','Bài 15. Định lí Thalès trong tam giác'],

].forEach(a=>addTiet('Nguyễn Văn An',a[3],'Toán',a[3][0]==='8'?8:9,D(a[0],a[1]),a[2],'P.204',a[4],a[5]));
/* Le Van Dung */
[[11,11,4,'7A1','Bài 11. Thu thập và phân loại dữ liệu'],[18,11,2,'7A1','Bài 12. Biểu đồ hình quạt tròn'],
 [24,11,3,'7A2','Bài 13. Tổng các góc trong một tam giác'],[1,12,2,'7A1','Bài 13. Tổng các góc trong một tam giác']
].forEach(a=>addTiet('Lê Văn Dũng',a[3],'Toán',7,D(a[0],a[1]),a[2],'P.105',a[4]));
/* Tran Thi Bich */
[[12,11,3,'9A2','Bài 12. Hệ thức giữa cạnh và góc'],[19,11,2,'9A2','Bài 13. Mở đầu về đường tròn'],
 [26,11,4,'9B1','Bài 14. Cung và dây của một đường tròn']
].forEach(a=>addTiet('Trần Thị Bích',a[3],'Toán',9,D(a[0],a[1]),a[2],'P.301',a[4]));
/* Hoang Van Nam */
[[13,11,5,'8A1','Bài 5. Sử dụng bảng tính giải quyết bài toán thực tế'],
 [20,11,5,'8A2','Bài 6. Sắp xếp và lọc dữ liệu'],[27,11,5,'8B1','Bài 7. Trực quan hóa dữ liệu'],
 [25,11,2,'8B1','Bài 6. Sắp xếp và lọc dữ liệu']   /* TRUNG khung gio voi tiet 25/11 t2 cua An -> R3 */
].forEach(a=>addTiet('Hoàng Văn Nam',a[3],'Tin học',8,D(a[0],a[1]),a[2],'Phòng máy 1',a[4]));
/* Do Thi Lan */
[[2,12,2,'6A1','Bài 13. Tam giác đều, hình vuông, lục giác đều'],[9,12,3,'6A2','Bài 14. Hình chữ nhật, hình thoi']
].forEach(a=>addTiet('Đỗ Thị Lan',a[3],'Toán',6,D(a[0],a[1]),a[2],'P.102',a[4]));
const tietBy=id=>TIET.filter(t=>t.id===id)[0];
/* mot tiet bi DOI o M4.7 -> buoi du gio phai canh bao */
TIET.filter(t=>t.gv==='Đỗ Thị Lan'&&t.lop==='6A1')[0].doi='Đổi sang thầy Lê Văn Dũng dạy thay (cô Lan nghỉ ốm) — cập nhật 18/11/2026 ở M4.7';

/* ===== LICH NAM HOC (M10.1) — ban chieu CHI DOC =====
   Dung de DUNG DEM tan suat trong ky nghi. Khong co cai nay thi dai nhac se keu suot he. */
const LICHNAM={khaiGiang:D(5,9),ketThucNam:D(31,5,2027),
 nghi:[{t:'Nghỉ Tết Nguyên đán',tu:D(1,2,2027),den:D(13,2,2027)},
       {t:'Nghỉ lễ Giỗ Tổ Hùng Vương',tu:D(16,4,2027),den:D(16,4,2027)},
       {t:'Nghỉ lễ 30/4 – 1/5',tu:D(30,4,2027),den:D(3,5,2027)},
       {t:'Nghỉ hè',tu:D(1,6,2027),den:D(31,8,2027)}]};
const trongNghi=d=>LICHNAM.nghi.filter(n=>d>=n.tu&&d<=n.den)[0];
function soNgayNghiGiua(a,b){                 /* so ngay nghi nam trong khoang [a,b] */
 let c=0;LICHNAM.nghi.forEach(function(n){
  const t=new Date(Math.max(a.getTime(),n.tu.getTime())),e=new Date(Math.min(b.getTime(),n.den.getTime()));
  if(e>=t)c+=ngay(e,t)+1});
 return c}

/* ===== NGHI PHEP DA DUYET (M4.8) — dung de dien san diem danh (R9) ===== */
const NGHIPHEP=[{ten:'Đỗ Thị Lan',tu:D(9,11),den:D(15,12),ld:'Nghỉ ốm dài ngày',don:'NP-2026-118'}];
function phepCua(ten,ng){return NGHIPHEP.filter(p=>p.ten===ten&&ng>=p.tu&&ng<=p.den)[0]}

const HT_={dinhky:{t:'Sinh hoạt tổ định kỳ',c:'b'},ncbh:{t:'Nghiên cứu bài học',c:'v'},cum:{t:'Sinh hoạt cụm chuyên môn',c:'w'}};
/* 8 muc noi dung goi y — CV 4069 mo rong so voi CV 5555 (4 muc) */
const GOIY=[['Đánh giá kết quả 2 tuần vừa qua',0],['Bàn kế hoạch 2 tuần tới',0],
 ['Trao đổi kinh nghiệm, tháo gỡ khó khăn',0],['Rút kinh nghiệm giáo án, dự giờ',0],
 ['Tổ chức dạy môn tự chọn và hướng nghiệp',1],['Phân tích dữ liệu học tập — hỗ trợ cá nhân hóa',1],
 ['Nghiên cứu khoa học, hoạt động STEM/STEAM',1],['Chuyển đổi số — ứng dụng AI trong dạy học',1]];

/* ===== CHU TRINH NGHIEN CUU BAI HOC ===== */
let NSEQ=0;const NCBH=[];
function addNC(o){const n={id:'N'+(++NSEQ),to:o.to||'Tổ Toán — Tin',mon:o.mon,khoi:o.khoi,bai:o.bai,
 lyDo:o.lyDo||'',phuongAn:o.phuongAn||'',tepPA:o.tepPA||[],nguoiDay:o.nguoiDay||'',tietId:o.tietId||'',
 tp:o.tp||[],phieu:o.phieu||[],ketLuan:o.ketLuan||null,nguoiTao:o.nguoiTao||'Trần Thị Bích',ngayTao:o.ngayTao||D(1,9)};
 n.lichSu=[{act:'Mở chu trình nghiên cứu bài học',ng:n.nguoiTao,d:n.ngayTao,note:n.mon+' '+n.khoi+' — '+n.bai}];
 NCBH.push(n);return n}
const ncBy=id=>NCBH.filter(n=>n.id===id)[0];
const PQ=(ng,d,hs,nhom,sai,cauhoi,dx)=>({nguoi:ng,ngay:d,hs:hs,nhom:nhom,sai:sai,cauhoi:cauhoi,dx:dx});
/* Nguoi co don nghi da duyet (M4.8) phu ngay day minh hoa thi KHONG the du,
   nen khong tinh vao mau so phieu quan sat — neu tinh thi chu trinh ket vinh vien (R15) */
function tpDu(n){const t=n.tietId?tietBy(n.tietId):null;
 if(!t)return n.tp.slice();
 return n.tp.filter(x=>!phepCua(x,t.ngay))}
function tpNghi(n){const t=n.tietId?tietBy(n.tietId):null;
 if(!t)return [];
 return n.tp.filter(x=>phepCua(x,t.ngay))}
function ncBuoc(n){                    /* dan xuat — khong phai nut bam */
 const b1=!!(n.phuongAn&&n.nguoiDay);
 const t=n.tietId?tietBy(n.tietId):null;
 const b2=!!(b1&&t&&t.ngay<=HOMNAY);
 const du=tpDu(n);
 const b3=!!(b2&&du.length&&n.phieu.length>=du.length);
 const b4=!!(b3&&n.ketLuan);
 return {b1:b1,b2:b2,b3:b3,b4:b4,n:(b4?4:b3?3:b2?2:b1?1:0)};
}
function ttNC(n){const s=ncBuoc(n);
 if(s.b4)return 'Đã hoàn tất';
 if(s.b3)return 'Chờ kết luận';
 if(s.b2)return 'Chờ phiếu quan sát';
 if(s.b1)return 'Chờ dạy minh họa';
 return 'Đang xây phương án'}

/* ===== BUOI SINH HOAT ===== */
let SSEQ=0;const SH=[];
function addSH(o){const b={id:'S'+(++SSEQ),to:o.to||'Tổ Toán — Tin',ht:o.ht,ngay:o.ngay,gio:o.gio||'14h00 — 16h00',
 ct:o.ct||'Trực tiếp',dd:o.dd||'Phòng họp tổ (P.207)',ndDK:o.ndDK||'',nguoiGhiMau:o.nguoiGhiMau||'Lê Văn Dũng',

  note:b.tp.length+' thành viên'}];

const shBy=id=>SH.filter(b=>b.id===id)[0];

function ttSH(b){
 if(b.huy)return 'Đã hủy';
 if(b.ngay>HOMNAY)return 'Sắp diễn ra';
 if(!b.bb)return 'Chờ biên bản';
 if(!b.ky)return 'Chờ ký';
 return 'Đã hoàn tất';
}

 const o={};b.tp.forEach(function(t){const p=phepCua(t,b.ngay);o[t]=p?'phep':'comat'});return o}

/* ===== DU LIEU MAU ===== */
/* NC3 — DA HOAN TAT (Toan 7) */
addNC({mon:'Toán',khoi:7,bai:'Bài 11. Thu thập và phân loại dữ liệu',
 lyDo:'Nội dung Thống kê là mạch mới của CT 2018, học sinh hay lúng túng khi phân loại dữ liệu định tính và định lượng.',
 phuongAn:'Thiết kế 3 hoạt động: khảo sát thực tế trong lớp (chiều cao, môn thể thao yêu thích) → học sinh tự phân loại dữ liệu thu được → rút ra tiêu chí phân loại. Không giảng định nghĩa trước.',
 tepPA:['Phuong-an-bai-hoc-Toan7-B11.docx'],nguoiDay:'Lê Văn Dũng',tietId:'T10',ngayTao:D(20,10),
 tp:['Trần Thị Bích','Nguyễn Văn An','Hoàng Văn Nam'],
 phieu:[PQ('Trần Thị Bích',D(12,11),'Học sinh bắt tay vào khảo sát rất nhanh, không cần giáo viên nhắc lại nhiệm vụ.','Nhóm 2 và nhóm 4 tham gia đều; nhóm 3 chỉ có 2 em làm, 2 em còn lại ngồi ngoài.','Nhiều em xếp "số áo" vào dữ liệu định lượng vì thấy là số.','Câu "Cộng hai số áo lại có ý nghĩa gì không?" làm cả lớp im lặng rồi bật ra cách hiểu đúng.','Cần giao vai cụ thể trong nhóm để không em nào ngồi ngoài.'),
  PQ('Nguyễn Văn An',D(12,11),'Học sinh học bằng cách thử và sửa, không chờ giáo viên chốt.','Nhóm 3 chỉ có 2 em làm việc.','Sai lầm phổ biến: coi mọi thứ ghi bằng số là dữ liệu định lượng.','Câu hỏi về số áo là tình huống tạo ra tư duy rõ nhất trong tiết.','Nên phát phiếu ghi vai cho từng thành viên nhóm.'),
  PQ('Hoàng Văn Nam',D(13,11),'Các em tranh luận với nhau trước khi hỏi giáo viên — đúng ý đồ phương án.','Nhóm 1 xong sớm rồi ngồi chơi, thiếu nhiệm vụ nối tiếp.','Có em nhầm dữ liệu định tính với dữ liệu bị khuyết.','Câu hỏi mở đầu "Muốn biết lớp mình thích môn thể thao nào thì làm sao?" kéo được cả lớp vào.','Chuẩn bị nhiệm vụ mở rộng cho nhóm xong sớm.')],
 ketLuan:{nd:'Phương án đạt mục tiêu: học sinh tự rút ra tiêu chí phân loại thay vì được cho định nghĩa. Hai ý được nhiều người ghi nhận: (1) sai lầm "cái gì ghi bằng số cũng là định lượng" xuất hiện ở cả ba nhóm quan sát; (2) có nhóm bị bỏ lại vì không phân vai.',
  dc:'Lần dạy sau: phát phiếu phân vai trong nhóm (người ghi, người hỏi, người báo cáo); chuẩn bị 1 nhiệm vụ mở rộng cho nhóm hoàn thành sớm; giữ nguyên câu hỏi về số áo vì đây là tình huống tạo tư duy tốt nhất.',
  nguoi:'Trần Thị Bích',ngay:D(16,11)}});
/* NC1 — CHO PHIEU QUAN SAT (Toan 8) */
addNC({mon:'Toán',khoi:8,bai:'Bài 14. Hình thoi và hình vuông',
 lyDo:'Học sinh thường học thuộc dấu hiệu nhận biết mà không hiểu quan hệ bao hàm giữa các tứ giác.',
 phuongAn:'Dùng bộ que ghép để học sinh tự tạo hình và tự phát hiện điều kiện; giáo viên không nêu dấu hiệu trước.',
 tepPA:['Phuong-an-bai-hoc-Toan8-B14.docx','So-do-quan-he-tu-giac.png'],
 nguoiDay:'Nguyễn Văn An',tietId:'T4',ngayTao:D(2,11),

/* ===== TAN SUAT — TT 15/2026 Dieu 14: it nhat 1 lan / 2 tuan ===== */
function tanSuat(moc){
 /* MOI buoi da ghi vao so deu tinh, ke ca buoi dot xuat (R12 — chot 28/8/2026).
    Ngay nghi doc tu M10.1 KHONG tinh vao khoang cach (R17) — nghi he/Tet thi to khong phai hop. */
 const N=moc||HOMNAY;
 const da=baseS().filter(b=>!b.huy&&b.ngay<=N).sort((a,b)=>b.ngay-a.ngay);
 const sap=baseS().filter(b=>!b.huy&&b.ngay>N).sort((a,b)=>a.ngay-b.ngay)[0];
 const dangNghi=trongNghi(N);
 if(!da.length)return {gapLich:999,gapHoc:999,cuoi:null,sap:sap,dangNghi:dangNghi,nghiTru:0};
 const gapLich=ngay(N,da[0].ngay);
 const nghiTru=soNgayNghiGiua(da[0].ngay,N);
 return {gapLich:gapLich,gapHoc:Math.max(0,gapLich-nghiTru),nghiTru:nghiTru,
  cuoi:da[0],sap:sap,dangNghi:dangNghi};
}

   o.push({k:'ky',id:b.id,ic:'🖊',tieu:'Ký biên bản sinh hoạt',mo:HT_[b.ht].t+' · '+thu(b.ngay)+' '+d2s(b.ngay),
    han:'Biên bản đã ghi xong — chờ chủ trì ký'});
  if(b.bb&&b.bb.viec)b.bb.viec.forEach(function(v,vi){
   v._i=vi;v._b=b.id;
   if(v.ai===m&&v.han&&ngay(v.han,HOMNAY)<=3&&!v.xong)
    o.push({k:'viec',id:b.id,vi:vi,ic:'📌',tieu:'Việc cần làm sau buổi sinh hoạt',mo:v.nd,
     han:ngay(v.han,HOMNAY)<0?'Quá hạn '+(-ngay(v.han,HOMNAY))+' ngày':'Hạn '+d2s(v.han)});
  });
 });
 baseN().forEach(function(n){

  if(s.b2&&!s.b3&&tpDu(n).indexOf(m)>=0&&!n.phieu.some(p=>p.nguoi===m))
   o.push({k:'phieu',id:n.id,ic:'👁',tieu:'Ghi phiếu quan sát học sinh',mo:n.mon+' '+n.khoi+' — '+n.bai,
    han:'Quan sát HỌC SINH học, không đánh giá giáo viên'});
  if(s.b3&&!s.b4&&can('ncbh'))
   o.push({k:'kl',id:n.id,ic:'📝',tieu:'Viết kết luận chu trình nghiên cứu bài học',mo:n.mon+' '+n.khoi+' — '+n.bai,
    han:n.phieu.length+'/'+tpDu(n).length+' phiếu quan sát đã đủ'});
 });
 return o;
}

function actS(b){

 if(b.huy){o.push(B('Xem','pick'));return o.join('')}
 if(st==='Sắp diễn ra'){o.push(B('Xem','pick'));
  if(can('lich'))o.push(B('Sửa lịch','suaLich'));
  if(can('xoa'))o.push(B('Hủy buổi','huy'));return o.join('')}
 if(st==='Chờ biên bản'&&ghiDuocBB(b))o.push(B('✍ Ghi biên bản','moBB','p'));
 if(st==='Chờ ký'){if(kyDuoc(b))o.push(B('🖊 Ký biên bản','ky','p'));

 o.push(B('Xem','pick'));
 if(st==='Đã hoàn tất'&&can('xuat'))o.push(B('Xuất','xuat1'));
 return o.join('');

function gomY(n){                       /* MAY chi dem — cung co che da dung o M5.3 */
 const out={};['sai','cauhoi','dx'].forEach(function(f){const mp={};
  n.phieu.forEach(function(p){const k=String(p[f]||'').split(/[.,;]/)[0].trim();
   if(!k)return;const key=kd(k);if(!mp[key])mp[key]={t:k,n:0};mp[key].n++});
  out[f]=Object.keys(mp).map(k=>mp[k]).sort((a,b)=>b.n-a.n).slice(0,3)});
 return out;
}

   const miss=[];if(!nd)miss.push('Nội dung thảo luận');if(!kl)miss.push('Kết luận của buổi');
   const co=b.tp.filter(t=>(DDTMP[t]||'comat')==='comat').length;
   if(!co)miss.push('Điểm danh — không ai có mặt thì không phải một buổi sinh hoạt');
   if(miss.length){toast('⚠ Còn thiếu: <b>'+miss.join(' · ')+'</b>');break}
   const cu=b.bb;
   b.bb={nd:nd,kl:kl,dd:Object.assign({},DDTMP),viec:BBTMP.viec.slice(),tep:BBTMP.tep.slice(),
    nguoiGhi:me()||b.nguoiGhiMau,ngayGhi:HOMNAY};
   b.lichSu.unshift({act:cu?'Sửa biên bản':'Ghi biên bản',ng:me()||b.nguoiGhiMau,d:HOMNAY,
    note:co+'/'+b.tp.length+' có mặt'});
   V.open=null;V.pick=b.id;DDTMP={};BBTMP=null;
   toast('✅ Đã lưu biên bản — buổi chuyển <b>'+ttSH(b)+'</b>, chờ <b>'+esc(b.chuTri)+'</b> ký');render();break}

  /* --- ky --- */
  case 'ky':closeModal();dlgKy(id);break;
  case 'doiCT':{const b=B();
   modal('Đổi người chủ trì buổi sinh hoạt',
    '<div class="ro">Biên bản đang <b>Chờ ký</b> mà người chủ trì hiện tại là <b>'+esc(b.chuTri)+'</b>. '+
    'Nếu người đó nghỉ dài ngày hoặc chuyển công tác thì biên bản sẽ <b>kẹt vĩnh viễn</b> — đây là lối thoát (R16).</div>'+
    (phepCua(b.chuTri,HOMNAY)?'<div class="warn">🔗 <b>'+esc(b.chuTri)+'</b> đang có đơn nghỉ đã duyệt ở M4.8: '+esc(phepCua(b.chuTri,HOMNAY).ld)+'</div>':'')+
    '<label class="lbl">Người chủ trì mới</label><select class="fs" id="ctMoi" style="width:100%">'+
     b.tp.filter(x=>x!==b.chuTri).map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>'+
    '<label class="lbl">Lý do đổi <span style="color:var(--red)">*</span></label>'+
    '<input class="inp" id="ctLd" style="width:100%" placeholder="Đổi người ký một hồ sơ bắt buộc phải có vết">',
    '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="doiCTDo" data-i="'+b.id+'">Đổi chủ trì</button>');break}
  case 'doiCTDo':{const b=B(),moi=$('#ctMoi').value,ld=$('#ctLd').value.trim();
   if(!ld){toast('⚠ Phải ghi <b>lý do đổi người chủ trì</b> — đây là hồ sơ bắt buộc của tổ');break}
   const cu=b.chuTri;b.chuTri=moi;
   b.lichSu.unshift({act:'Đổi người chủ trì',ng:me(),d:HOMNAY,note:cu+' → '+moi+' · '+ld});
   closeModal();toast('✓ Người chủ trì nay là <b>'+esc(moi)+'</b> — ghi Audit Log kèm lý do');render();break}
  case 'kySo':{const b=B();b.ky={nguoi:b.chuTri,ngay:HOMNAY,kySo:true};
   b.lichSu.unshift({act:'Ký biên bản',ng:b.chuTri,d:HOMNAY,note:'Ký số bằng USB Token / SmartCA — biên bản khóa sửa'});
   closeModal();V.pick=b.id;toast('🔏 Đã ký số — biên bản <b>khóa sửa</b>, buổi chuyển <b>Đã hoàn tất</b>');render();break}
  case 'kyBoQua':{const b=B();b.ky={nguoi:b.chuTri,ngay:HOMNAY,kySo:false};
   b.lichSu.unshift({act:'Ký biên bản — BỎ QUA ký số',ng:b.chuTri,d:HOMNAY,
    note:'Ghi Audit Log, đồng bộ tình trạng chứng thư số sang M4.3'});
   closeModal();V.pick=b.id;toast('⚠ Đã <b>bỏ qua ký số</b> — ghi Audit Log và đồng bộ M4.3. Biên bản vẫn <b>Đã hoàn tất</b>');render();break}

  /* --- NCBH --- */
  case 'newNC':{
   modal('🔬 Mở chu trình nghiên cứu bài học',
    '<div class="ro">CV 4069: mỗi môn <b>nên</b> xây dựng <b>2 bài học nghiên cứu/năm</b>, ưu tiên <i>"vấn đề mới, khó, nội dung cần phối hợp liên môn"</i>. '+
    'Đây là <b>gợi ý</b>, không phải định mức (R13).</div>'+
    '<label class="lbl">Môn <b>*</b></label><select class="fs" id="ncMon" style="width:100%">'+
     (grp()?TOCM[curTo()].mon:[]).map(m=>'<option>'+esc(m)+'</option>').join('')+'</select>'+
    '<label class="lbl">Khối <b>*</b></label><select class="fs" id="ncKhoi" style="width:100%">'+
     [6,7,8,9].map(k2=>'<option>'+k2+'</option>').join('')+'</select>'+
    '<label class="lbl">Tên bài học nghiên cứu <b>*</b> <span class="pill">🔗 tên bài lấy từ M5.1</span></label>'+
    '<input class="inp" id="ncBai" style="width:100%" placeholder="ví dụ: Bài 16. Đường trung bình của tam giác">'+
    '<label class="lbl">Lý do chọn bài này</label><textarea class="ta sm" id="ncLD2" placeholder="Học sinh thường gặp khó khăn ở đâu"></textarea>',
    '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ncTao">Mở chu trình</button>');break}
  case 'ncTao':{const bai=$('#ncBai').value.trim();
   if(!bai){toast('⚠ Chưa nhập <b>tên bài học nghiên cứu</b>');break}
   const n=addNC({mon:$('#ncMon').value,khoi:+$('#ncKhoi').value,bai:bai,lyDo:$('#ncLD2').value.trim(),
    nguoiTao:me()||'Trần Thị Bích',ngayTao:HOMNAY,tp:(grp()?TOCM[curTo()].gv.slice(0,4):[])});
   closeModal();V.tab='nc';V.nc=n.id;
   toast('🔬 Đã mở chu trình — bước 1: <b>xây dựng phương án</b> và <b>phân công người dạy minh họa</b>');render();break}
  case 'luuB1':{const n=ncBy(k);
   n.lyDo=$('#ncLD').value.trim();n.phuongAn=$('#ncPA').value.trim();n.nguoiDay=$('#ncGV').value;
   /* gia tri da ghi thang vao n nen render lai khong mat chu */
   const miss=[];if(!n.phuongAn)miss.push('Phương án bài học');if(!n.nguoiDay)miss.push('Người dạy minh họa');
   if(miss.length){toast('⚠ Bước 1 chưa xong — còn thiếu: <b>'+miss.join(' · ')+'</b>');render();break}
   n.lichSu.unshift({act:'Chốt phương án bài học',ng:me(),d:HOMNAY,note:'Người dạy minh họa: '+n.nguoiDay});
   toast('✅ Bước 1 xong — sang bước 2: <b>chọn tiết dạy minh họa từ M4.7</b>');render();break}
  case 'chonTiet':{const n=ncBy(k);n.tietId=v;const t=tietBy(v);
   n.lichSu.unshift({act:'Chọn tiết dạy minh họa',ng:me(),d:HOMNAY,note:d2s(t.ngay)+' · tiết '+t.tiet+' · '+t.lop+' (từ M4.7)'});
   toast('📅 Đã chọn tiết <b>'+d2s(t.ngay)+' · '+t.lop+'</b> — chiếu từ M4.7, không nhập tay');render();break}
  case 'doiTiet':{const n=ncBy(k);n.tietId='';toast('Chọn lại tiết dạy minh họa từ M4.7');render();break}
  case 'luuPhieu':{const n=ncBy(k);
   const p={hs:$('#pHS').value.trim(),nhom:$('#pNH').value.trim(),sai:$('#pSA').value.trim(),
    cauhoi:$('#pCH').value.trim(),dx:$('#pDX').value.trim()};
   const L={hs:'Học sinh học như thế nào',nhom:'Nhóm nào tham gia',sai:'Học sinh hiểu sai ở chỗ nào',cauhoi:'Câu hỏi tạo tư duy',dx:'Đề xuất điều chỉnh'};
   const miss=Object.keys(L).filter(f=>!p[f]).map(f=>L[f]);
   if(miss.length){toast('⚠ Còn thiếu: <b>'+miss.join(' · ')+'</b>');break}
   n.phieu.push(PQ(me(),HOMNAY,p.hs,p.nhom,p.sai,p.cauhoi,p.dx));
   n.lichSu.unshift({act:'Ghi phiếu quan sát học sinh',ng:me(),d:HOMNAY,note:n.phieu.length+'/'+tpDu(n).length+' phiếu'});
   toast('✅ Đã lưu phiếu quan sát — <b>không có ô xếp loại giờ dạy</b> (CV 4069)');render();break}
  case 'luuKL':{const n=ncBy(k),nd=$('#klND').value.trim(),dc=$('#klDC').value.trim();
   const miss=[];if(!nd)miss.push('Kết luận');if(!dc)miss.push('Phương án điều chỉnh cho lần dạy sau');
   if(miss.length){toast('⚠ Còn thiếu: <b>'+miss.join(' · ')+'</b>');break}
   n.ketLuan={nd:nd,dc:dc,nguoi:me(),ngay:HOMNAY};
   n.lichSu.unshift({act:'Viết kết luận chu trình',ng:me(),d:HOMNAY,note:'Chu trình hoàn tất'});
   toast('🎯 Chu trình <b>Đã hoàn tất</b> — phương án điều chỉnh là sản phẩm dùng lại cho năm sau');render();break}

  /* --- xuat --- */
  case 'xuat':dlgXuat();break;
  case 'xuat1':dlgXuat();break;
  case 'xk':xuatKind(+v);break;
  case 'doXuat':{
   if(XK===4&&(!$('#mdich')||!$('#mdich').value)){toast('⚠ Bắt buộc chọn <b>mục đích</b> — dữ liệu cá nhân theo NĐ 13/2023');break}
   const T={1:'một biên bản sinh hoạt',2:'SỔ GHI CHÉP HOẠT ĐỘNG CỦA TỔ',3:'hồ sơ một chu trình NCBH',4:'bảng điểm danh theo giáo viên'};
   closeModal();toast('⬇ Đã xuất <b>'+T[XK]+'</b> · ghi Audit Log'+(XK===4?', kèm mục đích':''));break}
 }
});
document.addEventListener('change',function(e){
 const t=e.target;
 if(t.id==='nNgay'){V.nNgay=t.value;renderNew();return}
 if(t.id==='nCT2'){V.nCT2=t.value;return}
 if(t.id==='nNC'){V.nNC=t.value;return}
 if(t.id==='hdt'){toast('🏫 Bộ chọn Điểm trường <b>không cắt dữ liệu</b> — tổ chuyên môn của trường sáp nhập có giáo viên ở nhiều điểm trường, sổ hoạt động là của cả tổ');return}
 if(t.id==='hnam'){if(t.selectedIndex===1)toast('🔒 Năm học <b>Đã kết thúc</b> — chỉ đọc. Sổ ghi chép năm cũ vẫn tra cứu và xuất được');return}
});
function luuB2(){
 if($('#nNgay'))V.nNgay=$('#nNgay').value;
 if($('#nGio'))V.nGio=$('#nGio').value;
 if($('#nDD'))V.nDD=$('#nDD').value;
 if($('#nND'))V.nND=$('#nND').value;
}
$('#mask').addEventListener('click',function(e){if(e.target.id==='mask')closeModal()});
render();
