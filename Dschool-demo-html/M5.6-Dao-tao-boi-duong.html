<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M5.6 Đào tạo, bồi dưỡng — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--red);color:#fff}
.totabs{display:flex;gap:4px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-top:none;
 border-radius:0 0 10px 10px;padding:6px 10px 6px 22px;flex-wrap:wrap}
.totabs .lb{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.totab{padding:4px 12px;border-radius:999px;font-size:12.5px;color:var(--ink2);border:1px solid transparent}
.totab.on{background:#fff;border-color:var(--brand);color:var(--brand);font-weight:700}
.totab .vt{font-size:10px;opacity:.75;font-weight:400}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.scope.first{margin-top:12px}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber)}
.scope.rd{border-left-color:var(--red)}
.scope.vi{border-left-color:var(--violet)}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:210px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.qf{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;background:#fff}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1240px){.stage.open .listw{display:none}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:26px}
.hrow.gone{opacity:.6}
.gk{grid-template-columns:1.9fr 1.5fr .95fr .9fr .95fr 1.15fr 1.5fr}
.stage.open .gk{grid-template-columns:1.8fr 1.2fr}
.stage.open .kx{display:none}
.gv{grid-template-columns:1.15fr 2.2fr 1.1fr 1.5fr}
.gs{grid-template-columns:1.5fr .85fr .85fr 1fr 1.9fr}
.gd{grid-template-columns:2.4fr 1.15fr .85fr .85fr .85fr 1.1fr}
.gdd{grid-template-columns:2.6fr 1.2fr .9fr .6fr}
.gsh{grid-template-columns:1.25fr 1.25fr 2fr .8fr 1fr 1.35fr}
.gbo{grid-template-columns:2fr .9fr .9fr .8fr 1fr 1.1fr}
.gnd{grid-template-columns:2fr .8fr .7fr .8fr .9fr 1fr}
.gnd2{grid-template-columns:2.2fr 1.2fr .6fr .7fr 1.2fr}
.gdt{grid-template-columns:1.9fr .9fr 1.1fr .8fr .9fr 1.2fr}
.stage.open .gdt{grid-template-columns:1.7fr 1.1fr}
.gtd{grid-template-columns:1.4fr 1.1fr 2.1fr .9fr 1.1fr}
.stage.open .gtd{grid-template-columns:1.4fr 1.5fr}
.gvi2{grid-template-columns:1.15fr 2.1fr 1.1fr 1.3fr}
.gdd2{grid-template-columns:1.5fr 1.6fr .8fr 1fr}
.ct3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.ctb{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fcfdfe}
.ctb.ok{border-color:#a7f3d0;background:var(--green-soft)}
.ctb.no{border-color:#fde68a;background:var(--amber-soft)}
.ctb .n{font-size:11px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ctb .v{font-size:17px;font-weight:800}
.ctb .bar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden;padding:0}
.ctb .bar i{display:block;height:100%;background:var(--brand)}
.ctb.ok .bar i{background:var(--green)}
.giay{border:2px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;background:#fff;margin:9px 0}
.giay.xn{border-color:var(--amber)}
.giay h4{font-size:13px;font-weight:800;margin-bottom:4px}
.giay .sub{font-size:11px;color:var(--ink3)}
.giay .canh{margin-top:8px;font-size:11.5px;font-weight:700;color:#92400e;background:var(--amber-soft);border:1px solid #fde68a;border-radius:6px;padding:5px 8px;display:inline-block}
.stage.open .gbo{grid-template-columns:1.8fr 1.1fr}
.gkq{grid-template-columns:1.5fr 1.2fr .6fr .9fr .9fr 1fr}
.stage.open .gkq{grid-template-columns:1.5fr 1fr}
.gky{grid-template-columns:1.1fr 1.3fr 1fr .9fr .9fr 1fr}
.gtc2{grid-template-columns:2.3fr .6fr 1.1fr .9fr 1fr}
.wbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:11px;padding:11px 14px;margin:12px 0;flex-wrap:wrap}
.wbar.bad{border-left-color:var(--red);background:var(--red-soft)}
.wbar.ok{border-left-color:var(--green);background:var(--green-soft)}
.wbar .big{font-size:21px;font-weight:800;line-height:1}
.wbar .lb{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.grp{border:1px solid var(--line);border-radius:12px;margin-top:11px;overflow:hidden;background:#fff}
.grph{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#f8fafc;border-bottom:1px solid var(--line);flex-wrap:wrap}
.grph b{font-size:13.5px}
.src{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.src.may{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe}
.src.nguoi{background:var(--amber-soft);color:#92400e;border:1px solid #fde68a}
.dnum{border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-size:13px;width:62px;text-align:center;background:#fff}
.dnum:focus{border-color:var(--brand);outline:none}
.dnum.w{border-color:var(--amber);background:var(--amber-soft)}
.spark{display:flex;gap:3px;align-items:flex-end;height:30px}
.spark i{flex:1;background:var(--brand);border-radius:2px 2px 0 0;min-height:2px;display:block}
.spark i.n{background:var(--line2)}
.kpib{font-size:19px;font-weight:800}
.kpib.g{color:var(--green)}.kpib.a{color:var(--amber)}.kpib.r{color:var(--red)}
.stage.open .gsh{grid-template-columns:1.2fr 1.5fr}
.gnc{grid-template-columns:1.5fr 1.9fr 1.15fr 1.7fr 1fr .8fr}
.gvi{grid-template-columns:1.15fr 2.2fr 1.1fr 1.4fr}
.dd{display:grid;grid-template-columns:1.4fr 1fr 1.6fr;gap:9px;padding:7px 11px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.dd:last-child{border-bottom:none}
.dmg{display:flex;gap:5px;flex-wrap:wrap}
.dmb{border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:11.5px;background:#fff}
.dmb.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.dmb.on.ph{background:var(--amber);border-color:var(--amber)}
.dmb.on.kp{background:var(--red);border-color:var(--red)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chp{border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:11.5px;background:#fff;color:var(--ink2)}
.chp:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.stepbar{display:flex;gap:4px;align-items:center}
.sb1{flex:1;height:6px;border-radius:3px;background:var(--line)}
.sb1.dn{background:var(--green)}.sb1.cur{background:var(--brand)}
.ncb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:11px}
.ncb.dn{border-left:3px solid var(--green)}
.ncb.cur{border-left:3px solid var(--brand);box-shadow:0 2px 10px rgba(29,78,216,.08)}
.ncb.wait{border-left:3px solid var(--line2);opacity:.72}
.ncb h3{font-size:13.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.atch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;margin-bottom:6px;background:#fcfdfe}
.atch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:var(--violet-soft);color:#5b21b6}
.st2.y{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.eye{font-size:11px;color:var(--brand);border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:1px 7px}
.eye:hover{background:#e0e7ff}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.bc{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.bc button{color:var(--brand);font-weight:600}
.bc button:hover{text-decoration:underline}
.bc .cur{font-weight:700;color:var(--ink)}
.sumbar{display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;
 padding:9px 13px;flex-wrap:wrap;position:sticky;top:56px;z-index:25}
.mt{font-size:12px;color:var(--ink2);border-right:1px solid var(--line);padding-right:11px;line-height:1.35}
.mt b{display:block;font-size:14px;color:var(--ink);font-weight:700}
.mt.bad b{color:var(--red)}.mt.wr b{color:var(--amber)}.mt.gd b{color:var(--green)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:15px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbody{padding:13px 15px;max-height:calc(100vh - 290px);overflow-y:auto}
.pfoot{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.f{display:grid;grid-template-columns:132px 1fr;gap:11px;align-items:start;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11.5px;background:#fff;margin:0 4px 4px 0}
.lchip.ok{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.lchip.no{border-color:#fde68a;background:var(--amber-soft);color:#92400e}
.sech{font-size:13px;font-weight:700;margin:16px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sech .pill{font-weight:400}

.gsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:11px}
.gsec h3{font-size:13.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gf{margin-bottom:10px}
.gf label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:3px;font-weight:600}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;min-height:62px;resize:vertical;font-family:inherit}
.ta:focus{border-color:var(--brand);outline:none}
.ta.sm{min-height:44px}
.xlg{display:flex;gap:7px;flex-wrap:wrap}
.xlb{border:1px solid var(--line2);border-radius:999px;padding:6px 15px;font-size:13px;background:#fff;font-weight:600}
.xlb.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.bb{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fcfdfe}
.bb.me{background:var(--brand-soft);border-color:#bfdbfe}
.bb .h{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:6px;flex-wrap:wrap}
.bb .h b{font-size:12.5px}
.bb .r{font-size:12.5px;margin:4px 0}
.bb .r i{color:var(--ink3);font-style:normal;font-weight:600;display:block;font-size:11px}
.ph2{border:1px solid #ddd6fe;background:var(--violet-soft);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.agg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:8px 0}
.aggc{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;background:#fcfdfe}
.aggc b{display:block;font-size:15px;color:var(--ink)}
.bars{display:flex;gap:4px;align-items:flex-end;height:34px;margin-top:5px}
.barc{flex:1;text-align:center;font-size:9.5px;color:var(--ink3)}
.barc .bx{background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}

.viewer{display:grid;grid-template-columns:1fr 180px;gap:12px}
@media(max-width:760px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:230px;display:grid;place-items:center;position:relative;overflow:hidden}
.vsheet{background:#fff;width:82%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:13px 15px;font-size:8.5px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:9.5px;text-align:center;font-weight:800;margin-bottom:6px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:4px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}

<script>
"use strict";

const $=s=>document.querySelector(s);
/* Demo dat o THU HAI 24/05/2027 — cuoi nam hoc 2026-2027, cac dot trong nam da chay xong */
const HOMNAY=new Date(2027,4,24);
const p2=n=>String(n).padStart(2,'0');

/* ===== NHAN SU (chieu tu M4.1 / M4.3) — GV va CBQL theo TT 19/2019 ===== */
const TO=['Tổ Toán — Tin','Tổ Ngữ văn','Tổ Ngoại ngữ','Tổ Lý — Hóa — Sinh','Tổ Sử — Địa — GDCD'];

addNS('Trần Thị Bích','Tổ Toán — Tin','II','Tổ trưởng');

addNS('Nguyễn Thị Yến','Tổ Sử — Địa — GDCD','II','');
const nsBy=id=>NS.filter(n=>n.id===id)[0];
const nsTen=t=>NS.filter(n=>n.ten===t)[0];
const dauTo={};TO.forEach(function(t){const x=NS.filter(n=>n.to===t&&n.cv==='Tổ trưởng')[0];if(x)dauTo[t]=x.ten});
/* nghi phep da duyet (M4.8) */
/* M4.8 NGHI PHEP — don ngan ngay, dung cho DIEM DANH tung buoi (R3) */
const NGHIPHEP=[{ten:'Ngô Văn Kiên',tu:D(17,4),den:D(19,4),ld:'Nghỉ phép việc riêng',don:'NP-2027-091'},
 {ten:'Trịnh Văn Sơn',tu:D(7,3),den:D(8,3),ld:'Nghỉ ốm',don:'NP-2027-066'}];
function phepCua(ten,ng){return NGHIPHEP.filter(p=>p.ten===ten&&ng>=p.tu&&ng<=p.den)[0]}

/* M4.2 BIEN DONG NHAN SU — Mang C "Tam nghi" (nh3.2 §4.1). M5.6 CHI DOC de doi chieu (R11). */
const TAMNGHI=[{ten:'Hà Minh Đức',tu:D(1,9,2026),den:D(30,6),loai:'Đi học dài hạn (thạc sĩ)',qd:'QĐ-TN-2026-09'}];

const nghiDai=tamNghiCua;

/* R11 — dot keo dai qua 30 ngay thi RAT CO THE la "cu di hoc dai han",
   ma theo nh3.2 §4.1 do la mot BIEN DONG NHAN SU phai khai o M4.2.
   Trang thai nay SUY RA tu ngay bat dau/ket thuc, KHONG phai o tick tay. */
const NGAY_DAI=30;   /* CHOT 29/8/2026: tam dong cung. Khi khach hang phan hoi thi dua ra cau hinh o M10.6 — doi mot hang so, khong dung luong. */
const soNgayDot=d=>Math.round((d.den-d.tu)/864e5)+1;
const laDaiHan=d=>soNgayDot(d)>NGAY_DAI;
function thieuTamNghi(d){
 if(!laDaiHan(d))return [];
 return dsDuThat(d).filter(function(t){const x=tamNghiCua(t);
  return !(x&&x.tu<=d.den&&x.den>=d.tu)});
}

/* ===== DOT TAP HUAN ===== */

const LOAI={bdtx:{t:'Trường tổ chức',c:'b'},chuyende:{t:'Trường tổ chức',c:'b'},tuchon:{t:'Trường tổ chức',c:'b'},ngoai:{t:'Đơn vị ngoài',c:'n'}};

const DONVI=['Nhà trường','Sở Giáo dục và Đào tạo','Phòng Giáo dục và Đào tạo','Cơ sở bồi dưỡng được giao nhiệm vụ','Đơn vị khác'];

const HTDG2=['Bài trắc nghiệm','Bài thu hoạch','Bài tập nghiên cứu','Khác'];
const LOAITEP=['Bài thi','Bài thu hoạch','Giấy chứng nhận / chứng chỉ','Quyết định cử đi học','Giấy tờ khác'];
let DSEQ=0;const DOT=[];
function addDot(o){const d={id:'D'+(++DSEQ),ten:o.ten,loai:o.loai,ct:o.ct||'',tiet:o.tiet||0,
 batBuoc:!!o.batBuoc,tu:o.tu,den:o.den,ht:o.ht||'Tập trung',dd:o.dd||'Hội trường tầng 3',
 noiBo:o.noiBo!==false,donVi:o.donVi||(o.noiBo!==false?'Nhà trường':'Sở Giáo dục và Đào tạo'),giangVien:o.giangVien||'',
 toChuc:o.toChuc||'Phó HT Chuyên môn',tp:o.tp?o.tp.slice():[],dk:o.dk||[],
 buoi:o.buoi||1,dd_:o.dd_||{},diem:o.diem||{},
 huy:!!o.huy,ldHuy:o.ldHuy||'',congBo:o.congBo!==false,lichSu:[]};
 d.lichSu.push({act:'Tạo đợt đào tạo',ng:o.nguoiTao||'Phó HT Chuyên môn',d:o.ngayTao||new Date(d.tu.getTime()-20*864e5),note:''});
 DOT.push(d);return d}
const dotBy=id=>DOT.filter(d=>d.id===id)[0];
function ttDot(d){
 if(d.huy)return 'Đã hủy';
 if(!d.congBo)return 'Nháp';
 if(soDaGhi(d)&&soDaGhi(d)>=dsDuThat(d).length)return 'Đã ghi nhận kết quả';
 if(HOMNAY<d.tu)return d.batBuoc?'Đã công bố':'Đang mở đăng ký';
 if(HOMNAY>d.den)return 'Đã kết thúc';
 return 'Đang diễn ra';
}
const dsDuThat=d=>d.batBuoc?d.tp:d.dk.filter(x=>x.tt==='ok').map(x=>x.nguoi);
function soBuoiCoMat(d,ten){let c=0;for(let i=1;i<=d.buoi;i++){const v=(d.dd_[ten]||{})[i];if(v==='comat')c++}return c}
const tietDat=(d,ten)=>Math.round(d.tiet*soBuoiCoMat(d,ten)/d.buoi);
const tlCoMat=(d,ten)=>d.buoi?Math.round(soBuoiCoMat(d,ten)/d.buoi*100):0;

const ALL=NS.map(n=>n.ten);
const D1=addDot({ten:'Tập huấn sử dụng phần mềm quản lý nhà trường Dschool',loai:'tuchon',ct:'',tiet:12,batBuoc:true,

const D3=addDot({ten:'Chuyên đề nội bộ: Ứng dụng AI trong thiết kế bài dạy',loai:'tuchon',ct:'',tiet:8,batBuoc:false,

/* ===== SINH DIEM DANH + DIEM DANH GIA (thang 10, dat tu 5) ===== */
let _s=20260829;const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff};
const YEU=['Tạ Thị Bình','Vũ Thị Ngọc','Dương Văn Thắng'];
function diemDanhTuDong(d,ds,tlVang){
 ds.forEach(function(ten){d.dd_[ten]=d.dd_[ten]||{};
  const p=phepCua(ten,d.tu);
  for(let i=1;i<=d.buoi;i++){
   if(p){d.dd_[ten][i]='phep';continue}
   d.dd_[ten][i]=(rnd()<tlVang)?'vang':'comat';
  }});
}

/* nguoi yeu vang nhieu -> khong du tiet, chay duoc R2 */
YEU.forEach(function(t){D2.dd_[t][3]='vang';D2.dd_[t][4]='vang';D1.dd_[t][4]='vang'});

D2.dd_['Ngô Văn Kiên'][4]='vang';

[['Trần Thị Bích','ok'],['Nguyễn Văn An','ok'],['Hoàng Văn Nam','ok'],['Lê Văn Dũng','ok'],

   const d=dotBy(id),x=d.dk.filter(y=>y.nguoi===k)[0];x.tt='no';x.ld=ld;
   d.lichSu.unshift({act:'Từ chối đăng ký',ng:me(),d:HOMNAY,note:k+' — '+ld});
   closeModal();toast('Đã từ chối <b>'+esc(k)+'</b> kèm lý do');render();break}

  /* --- mo man hinh ghi nhan ket qua + diem danh --- */
  case 'moDD':closeModal();V.open=id;V.pick=null;render();break;
  case 'tgDD':{const d=dotBy(id),p2=k.split('|'),ten=p2[0],b=+p2[1];
   hutKQ(d);
   d.dd_[ten]=d.dd_[ten]||{};
   const cur=d.dd_[ten][b]||'comat';
   d.dd_[ten][b]=cur==='comat'?'vang':(cur==='vang'?'phep':'comat');
   const n=nsTen(ten);if(n&&KQD[n.id][d.id])KQD[n.id][d.id].tiet=tietDat(d,ten);
   render();break}

  /* --- ghi nhan ket qua tung nguoi --- */
  case 'setKQ':{const d=dotBy(id),p2=k.split('|'),ten=p2[0],v=p2[1],n=nsTen(ten);
   hutKQ(d);
   KQD[n.id][d.id]=KQD[n.id][d.id]||{tiet:null,kq:'chua',d:null,htdg:'',donVi:'',tep:[],gc:''};
   KQD[n.id][d.id].kq=v;render();break}
  case 'themTep':{const d=dotBy(id),p2=k.split('|'),ten=p2[0],loai=p2[1],n=nsTen(ten);
   hutKQ(d);
   KQD[n.id][d.id]=KQD[n.id][d.id]||{tiet:null,kq:'chua',d:null,htdg:'',donVi:'',tep:[],gc:''};
   KQD[n.id][d.id].tep.push({ten:loai.replace(/[ \/]/g,'-')+'-'+ten.split(' ').pop()+'-'+d.id+'.pdf',loai:loai});
   toast('📎 Đã đính kèm <b>'+esc(loai)+'</b> — bằng chứng của kết quả, xem được ngay trong màn hình');render();break}
  case 'boTep':{const d=dotBy(id),p2=k.split('|'),n=nsTen(p2[0]);
   hutKQ(d);KQD[n.id][d.id].tep.splice(+p2[1],1);render();break}
  case 'luuDD':{const d=dotBy(id);hutKQ(d);
   const thieuDV=[],khongTep=[];
   dsDuThat(d).forEach(function(t){const n=nsTen(t);if(!n)return;
    const k2=KQD[n.id][d.id];if(!k2||!k2.kq||k2.kq==='chua')return;
    if(!k2.donVi)thieuDV.push(t);
    if(k2.kq==='dat'&&(!k2.tep||!k2.tep.length))khongTep.push(t);
    if(k2.tiet==null)k2.tiet=tietDat(d,t);
    if(k2.d!=null&&k2.d<5&&k2.kq==='dat')k2.kq='khong';
    k2.ng=me();k2.ngay=HOMNAY;});
   /* R6 o M5.6 chi CANH BAO: day la ban ghi luu tru noi bo, khong phai ho so phai trinh. O M5.7 thi CHAN CUNG. */
   d.lichSu.unshift({act:'Ghi nhận kết quả đợt',ng:me(),d:HOMNAY,note:soDaGhi(d)+'/'+dsDuThat(d).length+' người'});
   V.open=null;V.tab='dot';V.pick=d.id;
   toast('✅ Đã ghi nhận <b>'+soDaGhi(d)+'/'+dsDuThat(d).length+'</b> kết quả — lưu vào hồ sơ nhân sự (M4.1)'+
    (khongTep.length?' · ⚠ <b>'+khongTep.length+' người ghi Đạt mà chưa có tệp đính kèm</b> (R4)':'')+
    (thieuDV.length?' · ⚠ <b>'+thieuDV.length+' người chưa ghi đơn vị đánh giá</b> (R6 — cảnh báo, không chặn)':''));
   render();break}

  /* --- tao / cong bo / huy dot --- */
  case 'newDot':{
   modal('＋ Tạo đợt đào tạo',
    '<label class="lbl">Tên đợt <span style="color:var(--red)">*</span></label><input class="inp" id="ndTen" style="width:100%">'+
    '<div class="ro">↗ Đợt <b>quy đổi tiết BDTX</b> (CT01/CT02/CT03 — 120 tiết bắt buộc theo TT 17/2019) <b>không tạo ở đây</b>, '+
     'mà ở <b data-x="dl" data-m="M5.7 Bồi dưỡng thường xuyên" data-c="tao-dot" style="cursor:pointer;text-decoration:underline">M5.7</b>. '+
     'Menu này dành cho <b>đợt ngắn hạn của riêng trường</b> — chỉ lưu trữ, không phải hồ sơ trình.</div>'+
    '<label class="lbl">Số tiết quy đổi <span style="color:var(--red)">*</span></label><input class="inp" id="ndTiet" type="number" min="1" style="width:120px" value="15">'+
    '<label class="lbl">Số buổi</label><input class="inp" id="ndBuoi" type="number" min="1" style="width:120px" value="2">'+
    '<label class="lbl">Ngày bắt đầu <span style="color:var(--red)">*</span></label><input class="inp" id="ndTu" type="date" style="width:180px">'+
    '<label class="lbl">Đợt do ai tổ chức</label><div class="seg">'+
     '<button class="sgb on" data-x="ndNoiBo" data-k="1"><b>Trường tự tổ chức</b><span>⇒ chỉ cấp được <b>giấy xác nhận</b> (R5)</span></button>'+
     '<button class="sgb" data-x="ndNoiBo" data-k="0"><b>Cơ quan ngoài tổ chức</b><span>Sở · Phòng · cơ sở bồi dưỡng ⇒ có thể có chứng chỉ</span></button></div>'+
    '<div id="ndGiay"></div>'+
    '<label class="lbl">Người tổ chức đợt <span class="pill">chức danh phụ theo TỪNG đợt · tắt sau khi đợt kết thúc</span></label>'+
    '<select class="fs" id="ndTC" style="width:100%"><option>Phó HT Chuyên môn</option>'+NS.map(n=>'<option>'+esc(n.ten)+'</option>').join('')+'</select>',
    '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ndLuu">Tạo đợt (Nháp)</button>');
   NDCT='';NDNB=1;renderNDGiay();break}
  case 'ndNoiBo':{NDNB=+k;Array.prototype.forEach.call(document.querySelectorAll('[data-x=ndNoiBo]'),b=>b.classList.toggle('on',+b.dataset.k===NDNB));renderNDGiay();break}
  case 'ndLuu':{const ten=$('#ndTen').value.trim(),tiet=+$('#ndTiet').value,buoi=+$('#ndBuoi').value,tu=$('#ndTu').value;
   const miss=[];if(!ten)miss.push('Tên đợt');if(!tiet)miss.push('Số tiết');if(!tu)miss.push('Ngày bắt đầu');
   if(miss.length){toast('⚠ Còn thiếu: <b>'+miss.join(' · ')+'</b>');break}
   const dt=(function(x){const p=x.split('-');return new Date(+p[0],+p[1]-1,+p[2])})(tu);
   const nd=addDot({ten:ten,loai:'tuchon',ct:'',tiet:tiet,buoi:buoi,batBuoc:false,
    tu:dt,den:new Date(dt.getTime()+(buoi-1)*864e5),noiBo:NDNB===1,giay:NDNB===1?'xn':'ct',
    toChuc:$('#ndTC').value,nguoiTao:me(),ngayTao:HOMNAY});
   nd.congBo=false;
   closeModal();V.tab='dot';V.pick=nd.id;
   toast('✅ Đã tạo đợt ở trạng thái <b>Nháp</b> — '+(NDNB===1?'trường tự tổ chức, đơn vị đánh giá mặc định là <b>Nhà trường</b>':'đơn vị ngoài tổ chức, nhớ ghi <b>đơn vị đánh giá</b> khi ghi nhận kết quả')+'. Bấm <b>Công bố</b> để mở đăng ký');
   render();break}
  case 'congBo':{const d=dotBy(id);d.congBo=true;
   d.lichSu.unshift({act:'Công bố đợt',ng:me(),d:HOMNAY,note:'Mở đăng ký'});
   toast('📢 Đã công bố — đợt chuyển <b>'+ttDot(d)+'</b>');render();break}
  case 'huyDot':{const d=dotBy(id);
   modal('Hủy đợt đào tạo',
    '<div class="danger"><b>'+esc(d.ten)+'</b> — '+d2s(d.tu)+'<br>Sẽ báo cho <b>'+dsDuThat(d).length+' người</b> trong danh sách dự.</div>'+
    '<div class="ro">🗂 <b>Không xóa vật lý</b> (R12) — chuyển trạng thái <b>Đã hủy</b>, tìm lại bằng bộ lọc <b>Đã hủy</b>.</div>'+
    '<label class="lbl">Lý do hủy <span style="color:var(--red)">*</span></label>'+
    '<input class="inp" id="hdLD" style="width:100%" placeholder="Người đã đăng ký cần biết vì sao đợt không diễn ra">',
    '<button class="btn" data-x="close">Không hủy</button><button class="btn d" data-x="huyDotDo" data-i="'+id+'">Hủy đợt</button>');break}
  case 'huyDotDo':{const ld=$('#hdLD').value.trim();
   if(!ld){toast('⚠ Phải ghi <b>lý do hủy</b> — người đã đăng ký cần biết');break}
   const d=dotBy(id);d.huy=true;d.ldHuy=ld;
   d.lichSu.unshift({act:'Hủy đợt',ng:me(),d:HOMNAY,note:ld+' — không xóa vật lý'});
   closeModal();V.pick=null;toast('🗂 Đã hủy đợt — tìm lại bằng bộ lọc <b>Đã hủy</b>');render();break}

  /* --- xuat --- */
  case 'xuat':case 'xuat1':dlgXuat(a==='xuat1'&&V.tab==='toi');break;
  case 'xk':XK=+k;xuatKind(XK);break;
  case 'doXuat':{
   if(XK>1&&(!$('#mdich')||!$('#mdich').value)){toast('⚠ Bắt buộc chọn <b>mục đích</b> — dữ liệu cá nhân theo NĐ 13/2023 (R14)');break}
   const T={1:'danh sách đợt đào tạo của chính mình',2:'hồ sơ một đợt đào tạo',3:'bảng tổng hợp đào tạo toàn trường'};
   closeModal();toast('⬇ Đã xuất <b>'+T[XK]+'</b> · ghi Audit Log'+(XK>1?', kèm mục đích':''));break}
 }
});
let NDCT='',NDNB=1;
/* hut gia tri dang go tren man hinh ghi nhan ket qua truoc moi lan render lai */
function hutKQ(d){
 Array.prototype.forEach.call(document.querySelectorAll('[data-kq]'),function(el){
  const p2=el.dataset.kq.split('|'),f=p2[0],ten=p2[1],n=nsTen(ten);if(!n)return;
  KQD[n.id][d.id]=KQD[n.id][d.id]||{tiet:null,kq:'chua',d:null,htdg:'',donVi:'',tep:[],gc:''};
  const k2=KQD[n.id][d.id],v=el.value;
  if(f==='tiet')k2.tiet=v===''?null:+v;
  else if(f==='diem')k2.d=v===''?null:Math.max(0,Math.min(10,+v));
  else if(f==='htdg')k2.htdg=v;
  else if(f==='donvi')k2.donVi=v;
 });
}
function renderNDGiay(){
 const el=$('#ndGiay');if(!el)return;
 el.innerHTML=NDNB===1
  ?'<div class="ro" style="margin-top:9px">📄 Trường tự tổ chức ⇒ đơn vị đánh giá mặc định là <b>Nhà trường</b>. '+
   '<b>Hệ thống không phát hành giấy tờ nào</b> — đây là bản ghi <b>lưu trữ nội bộ</b> (R5).</div>'
  :'<div class="ro" style="margin-top:9px">📜 Cơ quan ngoài tổ chức ⇒ chứng chỉ do <b>Sở · Phòng GD · cơ sở bồi dưỡng</b> cấp. '+
   'Hệ thống <b>chỉ ghi nhận</b> chứng chỉ khi nhận được, không tạo ra giấy này.</div>';
}
document.addEventListener('change',function(e){
 const t=e.target;
 if(t.id==='fto'){V.to=t.value;V.pick=null;render();return}
 if(t.id==='hdt'){toast('🏫 Bộ chọn Điểm trường <b>không cắt dữ liệu</b> — đợt đào tạo tính theo cá nhân, không theo điểm trường');return}
 if(t.id==='hnam'){if(t.selectedIndex===1)toast('🔒 Năm học <b>Đã kết thúc</b> — chỉ đọc. Đợt đào tạo năm cũ tra ở <b>M4.1</b>');return}
});
$('#mask').addEventListener('click',function(e){if(e.target.id==='mask')closeModal()});
render();
</script>
</body>
</html>
