<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2.5 Bảng điểm môn học — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.lockwrap{position:relative;display:inline-flex;align-items:center;gap:5px}
.lockwrap .lk{font-size:11px;color:var(--ink3)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover:not(:disabled){background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:7px 11px;border-radius:9px;font-size:12px;margin:0 0 10px;display:flex;gap:8px;align-items:flex-start}
.scopebar code{background:#e0e7ff;padding:0 4px;border-radius:3px;font-size:11.5px}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.roblk{background:#f8fafc;border:1px dashed var(--line2);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--ink2)}
/* huong dan dung: mot dong, LUON hien. Khac voi .dnote la ly do thiet ke, an duoc. */
.hint{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.55}
.hint b{color:var(--ink2)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink3);padding:8px 13px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:6px}
.rolnk:hover{background:#e0e7ff}
.oldwk{background:#fef3c7;border:1px solid var(--amber);color:#92400e;border-radius:9px;padding:9px 13px;font-size:12.5px;margin-bottom:11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.oldwk .sp{flex:1}

.navbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 10px}
.gsep{flex:1}
.tab1 .tsub{font-weight:400;color:var(--ink3);font-size:11px;margin-left:4px}
.tab1.on .tsub{color:var(--brand)}
.navbar .num{font-size:11.5px;color:var(--ink3)}
.navbar .num b{color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 13px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.sumbar{display:flex;gap:0;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.sumbar .it{padding:7px 15px;border-right:1px solid var(--line);font-size:12px;color:var(--ink2)}
.sumbar .it b{display:block;font-size:17px;color:var(--ink);font-weight:700;line-height:1.25}
.sumbar .it.w b{color:var(--amber)}.sumbar .it.r b{color:var(--red)}.sumbar .it.g b{color:var(--green)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage.open .listw{flex:1 1 0}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}

/* Header nhom Lop x Mon — bam de mo/thu. Khi THU van phai doc duoc con so,
   neu khong thi thu nhom = giau viec. */
.gh{display:flex;align-items:center;gap:9px;padding:9px 13px 9px 10px;background:#eef2f7;
    border-bottom:1px solid var(--line2);border-left:3px solid var(--brand);cursor:pointer;user-select:none}
.gh:hover{background:#e4ebf3}
.gh .gbtn{border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:7px;
    padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.gh .gbtn:hover{background:var(--brand);color:#fff}
.gh .num{font-size:11.5px;color:var(--ink3);white-space:nowrap}
/* Nhom rong: van co mat, nhung nhat di de khong tranh cho voi nhom co viec */
.gh.rong{background:#fbfcfe;border-left-color:var(--line2)}
.gh.rong .gt{color:var(--ink2);font-weight:700}
.gh.rong:hover{background:#f4f7fb}
.erow{padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink3);background:#fcfdff}
.gh .num b{color:var(--ink2)}
.gh .cv{flex:0 0 15px;font-size:10px;color:var(--ink3);transition:transform .12s}
.gh.on .cv{transform:rotate(90deg)}
.gh .gt{font-size:13px;font-weight:800;color:var(--ink)}
.gh .gt i{font-style:normal;font-weight:600;color:var(--ink2)}
.gh .gs{font-size:11.5px;color:var(--ink3)}
.gh .gb{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.gbar{display:flex;align-items:center;gap:8px;padding:7px 13px;background:#fff;
      border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.gbar b{color:var(--ink2)}
.brow{display:flex;gap:11px;padding:9px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.gh + .brow, .gh + .srow{background:#fcfdff}
.brow:hover{background:var(--brand-soft)}
.brow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.brow.huy{background:#fafafa;opacity:.72}
.brow.huy .bd b{text-decoration:line-through}
.brow .bd{flex:1;min-width:0}
.brow .bd b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bd .sub{font-size:11.5px;color:var(--ink3)}
/* <b> trong dong phu phai la inline: quy tac .brow .bd b{display:block} o tren
   danh cho TEN o dong tren, an nham xuong day thi dong phu bi vo lam nhieu dong */
.brow .bd .sub b{display:inline;font-size:11.5px}
.brow .pg{flex:0 0 138px}
.brow .pg .lb{font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;gap:9px}
.brow .pg .lb b{color:var(--ink);font-size:12.5px}
.brow .pg .bar{height:8px}
.bar{height:7px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:3px;display:flex}
.bar i{display:block;height:100%}
.brow .rt{flex:0 0 auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:230px}

.srow{display:flex;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.srow:hover{background:var(--brand-soft)}
.srow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.srow .ava{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.srow .bd{flex:1;min-width:0}
.srow .bd b{font-size:13px;display:block}
.srow .bd .sub{font-size:11.5px;color:var(--ink3)}
.srow .rt{flex:0 0 auto;display:flex;gap:5px;align-items:center}

.lrow{display:flex;gap:11px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.lrow:hover{background:var(--brand-soft)}
.lrow .lp{flex:0 0 160px}
.lrow .lp b{font-size:13.5px;display:block}
.lrow .lp span{font-size:11.5px;color:var(--ink3)}
.lrow .num{flex:0 0 80px;text-align:center;font-size:11px;color:var(--ink3)}
.lrow .num b{display:block;font-size:15px;color:var(--ink)}
.lrow .num.r b{color:var(--red)}.lrow .num.w b{color:var(--amber)}.lrow .num.g b{color:var(--green)}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph .n{flex:1;min-width:0}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pnav{display:flex;gap:6px;align-items:center;padding:8px 15px;border-bottom:1px solid var(--line);background:#fafbfc;font-size:12px;color:var(--ink2)}
.pnav .sp{flex:1;text-align:center}
.pbody{padding:14px 15px;max-height:calc(100vh - 260px);overflow-y:auto}
.f{display:grid;grid-template-columns:130px 1fr;gap:11px;align-items:start;padding:7px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.hl{border-color:#fde68a}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.card.hl .ch{background:var(--amber-soft);border-bottom-color:#fde68a;color:#92400e}
.ch .sp{flex:1}
.cb{padding:4px 12px}
.cb.p{padding:11px 12px}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

/* xem bai nop */
.viewer{display:grid;grid-template-columns:1fr 176px;gap:12px}
@media(max-width:760px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:230px;display:grid;place-items:center;color:#94a3b8;position:relative;overflow:hidden}
.vsheet{background:#fff;width:76%;height:86%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:12px 14px;font-size:9px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:10px;font-weight:800;margin-bottom:6px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0}
.vsheet .ln.s{width:60%}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.fld label .req{color:var(--red)}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff}
.fldi:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.fldi.err{border-color:var(--red);background:var(--red-soft)}
.mucs{display:flex;gap:6px;flex-wrap:wrap}
.muc{border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:6px 16px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.muc:hover:not(:disabled){background:var(--bg)}
.muc.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.muc.on.no{background:var(--red);border-color:var(--red)}
.muc.on.ok{background:var(--green);border-color:var(--green)}
.drop{border:1.5px dashed var(--line2);border-radius:9px;padding:14px;text-align:center;color:var(--ink3);font-size:12.5px}

table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
table.tb td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb tr:last-child td{border-bottom:none}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:200px;max-height:250px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
/* Ghi chu thiet ke: chung giai thich VI SAO, khong phai mot phan man hinh that.
   Mac dinh TAT de nhin dung giao dien nguoi dung se thay. */
body.nn .dnote{display:none!important}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:14px}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1;margin-left:auto}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:13px;font-size:11px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}

/* ===== BANG DIEM ===== */
.bd{width:100%;border-collapse:collapse;font-size:13px}

<script>/* ═══════════════════════════════════════════════════════════════════════════════
   KHUÔN SIDEBAR LỚP × MÔN — app.05-sidebar-lop.js  (+ style.05-sidebar-lop.css)
   Gốc: M2.5 Bảng điểm môn học (Đợt 1 · P16 · 14/9/2026) — góp ý mục 25.
   Dùng chung: M2.5 · M2.2 Sổ đầu bài (P17) · M2.3 Bài tập về nhà (P18).
   Mô tả đầy đủ: mo-ta-giao-dien/M2.5-Bang-diem-mon-hoc.md §15.

   ⚠ CHÉP NGUYÊN BYTE sang từng menu, so bằng Get-FileHash. tools/gen-demo.py KHÔNG gộp
     chéo thư mục — sửa khuôn ở một bên thì PHẢI chép sang MỌI bên (tiền lệ tệp nền chung
     CSVC M6.4 ⇄ M6.11 ⇄ M6.5). Việc riêng của menu KHÔNG viết vào tệp này.
   ⚠ Khuôn KHÔNG đọc dữ liệu riêng của menu nào. Nó chỉ cần hai hook toàn cục:
       R()      — vai hiện hành; đổi vai thì khuôn tự bỏ lựa chọn cũ
       render() — vẽ lại cả trang; khuôn gọi sau mỗi lần đổi lựa chọn
     Khuôn chỉ dùng function + var (không const/let ở tầng ngoài) để nằm TRƯỚC mọi tệp của menu
     mà không vướng vùng chết tạm thời. ⚠ gen-demo ghép `app.js` TRƯỚC mọi `app.*.js`: menu còn app.js nguyên
     khối thì đổi tên thành app.10-….js, để lời gọi render() đầu tiên chạy SAU khi SBL đã có giá trị.

   Cách dùng trong render() của menu:
       var c = sblChuan(o);                 // 1. chuẩn hóa lựa chọn theo tab đang mở
       var phai = <thanh tab> + <nội dung theo c.lop · c.mon · c.tatCa>;
       $('#content').innerHTML = sblKhung(phai);   // 2. ghép sidebar trái + nội dung phải
   o = { che:'lopmon'|'lop'|'an',          đơn vị sidebar của TAB ĐANG MỞ ('an' = ẩn sidebar)
         muc:[{lop, mon|null, dt, dtTen, khoi, viec:[{n,t,c}], ghi}],
             — DỰNG TỪ PHẠM VI (phân công · tổ · điểm trường), KHÔNG từ dữ liệu (khung §13):
               cặp chưa có bản ghi nào vẫn phải có mặt.
             — viec = con số việc của tab đang mở; n>0 mới hiện; c = w|r|b|o|v|n (màu nhãn)
         hangDoi: null | {nhan:'Tất cả lớp của tôi'}   tab dạng hàng đợi: dòng đầu «Tất cả»
         rong: bool          vai phạm vi rộng ⇒ thêm tầng Khối (tầng Điểm trường tự bật khi ≥ 2 điểm trường)
         macDinh: 'lop|mon'  (tùy chọn) dòng chọn sẵn khi chưa có lựa chọn — menu tự quyết «việc nào gấp nhất»;
                             không có thì lấy dòng đầu tiên CÒN VIỆC
         tieuDe, phamVi:'html ngắn', trong:'html khi không có mục nào' }
   Kết quả sblChuan: {lop, mon, tatCa, muc, link}. Deep-link: sblDocUrl() đọc ?ctx=lop|mon (hoặc #ctx=…).
   Sửa: 14/9 P17 (M2.2) — dải ↩/⚠ deep-link hiện cả ở khung ≤ 900px (sblLinkBand); đã chép sang M2.5 · M2.3.
   Sửa: 15/9 PZ2 — nút "＋ Hiện cả n …" nói DÒNG khi đơn vị là Lớp × Môn (trước ghi "lớp" mà đếm cặp — phiếu P18); đã chép sang M2.2 · M2.3 · M2.5.
   ═══════════════════════════════════════════════════════════════════════════════ */

var SBL={lop:null,mon:null,tatCa:false,tim:'',dong:{},vai:undefined,hd:false,nho:null,link:null,giuLink:false,chiViec:true,o:null};

function sblE(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sblBo(t){return String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function sblCoViec(m){return (m.viec||[]).some(function(x){return x.n>0})}
function sblTong(ds){                       /* cộng việc của nhiều mục theo nhãn — tiêu đề nhóm thu lại KHÔNG giấu việc (khung §12.3) */
 var g={},thu=[];
 ds.forEach(function(m){(m.viec||[]).forEach(function(x){if(!(x.n>0))return;var k=x.t+'|'+x.c;
  if(!g[k]){g[k]={n:0,t:x.t,c:x.c};thu.push(k)} g[k].n+=x.n})});
 return thu.map(function(k){return g[k]});
}
function sblNhan(v){return (v||[]).filter(function(x){return x.n>0}).map(function(x){
 return '<span class="sbl-b '+(x.c||'n')+'">'+x.n+' '+sblE(x.t)+'</span>'}).join('')}

/* 1 ─ chuẩn hóa lựa chọn. Quy tắc:
   • đổi tab GIỮ lựa chọn; đơn vị đổi Lớp × Môn → Lớp thì giữ lớp, bỏ môn
   • vào tab hàng đợi ⇒ đứng ở «Tất cả» (hàng đợi bị lựa chọn cũ lọc mất là giấu việc), nhớ cặp cũ;
     rời hàng đợi mà vẫn đang «Tất cả» ⇒ trả lại cặp đã nhớ
   • lựa chọn không còn trong phạm vi ⇒ cùng lớp nếu có, không thì mục đầu tiên CÒN VIỆC */
function sblChuan(o){
 var v=(typeof R==='function')?R():null;
 if(SBL.vai!==undefined&&v!==SBL.vai&&!SBL.giuLink){SBL.lop=null;SBL.mon=null;SBL.tatCa=false;SBL.tim='';SBL.nho=null;SBL.link=null}
 SBL.giuLink=false;SBL.vai=v;SBL.o=o;
 if(o.che==='an') return {an:true};
 var M=o.muc||[],hd=!!o.hangDoi;
 if(SBL.link&&SBL.link.xet!==true){SBL.link.xet=true;
  SBL.link.ngoai=!M.some(function(m){return m.lop===SBL.link.lop&&(!SBL.link.mon||o.che==='lop'||m.mon===SBL.link.mon)})}
 if(hd&&!SBL.hd&&!(SBL.link&&!SBL.link.ngoai&&SBL.link.moi)){SBL.nho={lop:SBL.lop,mon:SBL.mon};SBL.tatCa=true}
 if(!hd&&SBL.hd&&SBL.tatCa&&SBL.nho){SBL.lop=SBL.nho.lop;SBL.mon=SBL.nho.mon}
 if(SBL.link)SBL.link.moi=false;
 SBL.hd=hd; if(!hd)SBL.tatCa=false;
 if(o.che==='lop')SBL.mon=null;
 if(SBL.tatCa||!M.length) return sblKq();
 if(hd&&SBL.mon===null&&M.some(function(m){return m.lop===SBL.lop})) return sblKq();   /* hàng đợi: chọn cả lớp = lọc theo lớp */
 var khop=M.filter(function(m){return m.lop===SBL.lop&&(o.che==='lop'||m.mon===SBL.mon)});
 if(!khop.length){
  var cung=M.filter(function(m){return m.lop===SBL.lop});
  var md=o.macDinh?M.filter(function(m){return m.lop+'|'+(m.mon==null?'':m.mon)===o.macDinh})[0]:null;
  var c=cung.length?(cung.filter(sblCoViec)[0]||cung[0]):(md||M.filter(sblCoViec)[0]||M[0]);
  SBL.lop=c.lop;SBL.mon=o.che==='lop'?null:c.mon;
 }
 return sblKq();
}
function sblKq(){
 var o=SBL.o||{},M=o.muc||[];
 var m=SBL.tatCa?null:(M.filter(function(x){return x.lop===SBL.lop&&(SBL.mon==null||x.mon===SBL.mon)})[0]||null);
 return {lop:SBL.tatCa?null:SBL.lop,mon:SBL.tatCa?null:SBL.mon,tatCa:SBL.tatCa,muc:m,link:SBL.link};
}

/* 2 ─ ghép khung: sidebar trái · (bộ chọn thả xuống khi hẹp) + nội dung phải */
function sblKhung(phai){
 var o=SBL.o; if(!o||o.che==='an') return phai;
 return '<div class="sbl-wrap"><aside class="sbl-side">'+sblSide()+'</aside><section class="sbl-main">'+sblHep()+phai+'</section></div>';
}

function sblHienMuc(){                      /* hàng đợi: mặc định chỉ hiện dòng CÓ việc (+ dòng đang chọn) */
 var o=SBL.o,M=o.muc||[];
 if(o.hangDoi&&SBL.chiViec&&!SBL.tim) return M.filter(function(m){return sblCoViec(m)||(m.lop===SBL.lop&&!SBL.tatCa)});
 if(SBL.tim){var q=sblBo(SBL.tim);return M.filter(function(m){return sblBo(m.lop+' '+(m.mon||'')+' '+(m.ghi||'')).indexOf(q)>=0})}
 return M;
}

function sblSide(){
 var o=SBL.o,M=o.muc||[],L=sblHienMuc(),h='';
 h+='<div class="sbl-hd"><b>'+sblE(o.tieuDe||(o.che==='lop'?'Lớp':'Lớp × Môn'))+'</b> <span class="sbl-dem">'+M.length+'</span>'
  +(o.phamVi?'<div class="sbl-pv">'+o.phamVi+'</div>':'')
  +(M.length>6?'<input class="sbl-tim" id="sblTim" placeholder="🔍 Tìm lớp, môn" value="'+sblE(SBL.tim)+'">':'')+'</div>';
 h+=sblLinkBand('');
 if(!M.length) return h+'<div class="sbl-trong">'+(o.trong||'Không có lớp nào trong phạm vi của bạn.')+'</div>';
 if(o.hangDoi){
  h+='<button class="sbl-r sbl-all'+(SBL.tatCa?' on':'')+'" data-sbl="ALL"><span class="sbl-n">'+sblE(o.hangDoi.nhan||'Tất cả lớp của tôi')+'</span><span class="sbl-bs">'+sblNhan(sblTong(M))+'</span></button>';
 }
 if(SBL.tim){                               /* đang tìm ⇒ phẳng, không tầng */
  h+=L.length?L.map(function(m){return sblDong(m,true)}).join(''):'<div class="sbl-trong">Không có lớp nào khớp «'+sblE(SBL.tim)+'».</div>';
  return h;
 }
 var dts=[],khoi={};
 L.forEach(function(m){if(dts.indexOf(m.dt)<0)dts.push(m.dt)}); dts.sort();
 var nhieuDT=dts.length>1||M.some(function(m){return m.dt!==M[0].dt});
 dts.forEach(function(dt){
  var Ld=L.filter(function(m){return m.dt===dt}),gk='dt:'+dt,dong=SBL.dong[gk];
  if(nhieuDT) h+='<button class="sbl-g'+(dong?'':' mo')+'" data-sbl="G" data-g="'+gk+'"><span class="cv">▶</span>'+sblE(Ld[0].dtTen||dt)+'<span class="sbl-bs">'+(dong?sblNhan(sblTong(Ld)):'')+'</span></button>';
  if(nhieuDT&&dong) return;
  var ks=[]; Ld.forEach(function(m){if(ks.indexOf(m.khoi)<0)ks.push(m.khoi)}); ks.sort(function(a,b){return a-b});
  var tangK=o.rong&&(ks.length>1||M.some(function(m){return m.khoi!==M[0].khoi}));
  ks.forEach(function(kh){
   var Lk=Ld.filter(function(m){return m.khoi===kh}),kk='k:'+dt+'|'+kh,dk=SBL.dong[kk];
   if(tangK) h+='<button class="sbl-g k'+(dk?'':' mo')+'" data-sbl="G" data-g="'+kk+'"><span class="cv">▶</span>Khối '+sblE(kh)+'<span class="sbl-bs">'+(dk?sblNhan(sblTong(Lk)):'')+'</span></button>';
   if(tangK&&dk) return;
   var lops=[]; Lk.forEach(function(m){if(lops.indexOf(m.lop)<0)lops.push(m.lop)});
   lops.sort(function(a,b){return a.localeCompare(b,'vi',{numeric:true})});
   lops.forEach(function(lop){
    var Ll=Lk.filter(function(m){return m.lop===lop});
    if(o.che==='lop'||Ll.length===1){h+=sblDong(Ll[0],o.che!=='lop');return}   /* lớp chỉ một môn ⇒ một dòng (khung §12.2) */
    var onL=!SBL.tatCa&&SBL.lop===lop&&SBL.mon===null;
    h+='<button class="sbl-r lh'+(onL?' on':'')+'" data-sbl="L" data-l="'+sblE(lop)+'"><span class="sbl-n">'+sblE(lop)+' <i>· '+Ll.length+' môn</i></span></button>';
    h+=Ll.map(function(m){return sblDong(m,false,true)}).join('');
   });
  });
 });
 var an=(M.length-L.length);
 if(o.hangDoi&&!SBL.tim) h+='<button class="sbl-viec" data-sbl="VIEC">'+(SBL.chiViec
   ?(an>0?'＋ Hiện cả '+an+(o.che==='lop'?' lớp':' dòng')+' không có việc':'')   /* đếm DÒNG (cặp Lớp × Môn), không đếm lớp — PZ2 15/9 theo P18 */
   :'－ Chỉ hiện lớp có việc')+'</button>';
 return h;
}
function sblDong(m,ghepLop,con){
 var on=!SBL.tatCa&&SBL.lop===m.lop&&(SBL.o.che==='lop'||SBL.mon===m.mon);
 var ten=m.mon==null?sblE(m.lop):ghepLop?sblE(m.lop)+' <i>·</i> '+sblE(m.mon):sblE(m.mon);
 return '<button class="sbl-r'+(on?' on':'')+(con?' con':'')+(SBL.o.hangDoi&&!sblCoViec(m)?' nhat':'')+'" data-sbl="P" data-l="'+sblE(m.lop)+'"'
  +(m.mon!=null?' data-m="'+sblE(m.mon)+'"':'')+(m.ghi?' title="'+sblE(m.ghi)+'"':'')+'><span class="sbl-n">'+ten+'</span><span class="sbl-bs">'+sblNhan(m.viec)+'</span></button>';
}

/* dải ↩ / ⚠ của deep-link (S9). Vẽ HAI chỗ: trong sidebar và trên bộ chọn khung hẹp ('hep') —
   sidebar ẩn ở ≤ 900px thì dải «không thuộc phạm vi» không được ẩn theo (sửa P17 · 14/9/2026) */
function sblLinkBand(cls){
 var k=SBL.link; if(!k) return '';
 return '<div class="sbl-link'+(k.ngoai?' ngoai':'')+(cls?' '+cls:'')+'">'+(k.ngoai
   ?'⚠ <span>Liên kết'+(k.tu?' từ <b>'+sblE(k.tu)+'</b>':'')+' trỏ tới <b>'+sblE(k.lop)+(k.mon?' · '+sblE(k.mon):'')+'</b> — <b>không thuộc phạm vi của bạn</b>, nên không có trong danh sách.</span>'
   :'↩ <span>Mở từ <b>'+sblE(k.tu||'liên kết')+'</b> — đã chọn sẵn <b>'+sblE(k.lop)+(k.mon?' · '+sblE(k.mon):'')+'</b></span>')
   +'<button data-sbl="BOLINK" title="Bỏ dòng này">✕</button></div>';
}

/* khung hẹp (≤ 900px): sidebar thu thành bộ chọn thả xuống ở đầu nội dung — CSS quyết định cái nào hiện */
function sblHep(){
 var o=SBL.o,M=o.muc||[],lk=sblLinkBand('hep'); if(!M.length) return lk;
 var chu=function(v){return (v||[]).filter(function(x){return x.n>0}).map(function(x){return x.n+' '+x.t}).join(', ')};
 var h='<div class="sbl-hep"><label for="sblSel">'+sblE(o.tieuDe||'Lớp × Môn')+'</label><select id="sblSel">';
 if(o.hangDoi) h+='<option value="ALL"'+(SBL.tatCa?' selected':'')+'>'+sblE(o.hangDoi.nhan||'Tất cả lớp của tôi')+(chu(sblTong(M))?' — '+chu(sblTong(M)):'')+'</option>';
 var dts=[]; M.forEach(function(m){if(dts.indexOf(m.dt)<0)dts.push(m.dt)}); dts.sort();
 dts.forEach(function(dt){
  var Ld=M.filter(function(m){return m.dt===dt});
  if(dts.length>1) h+='<optgroup label="'+sblE(Ld[0].dtTen||dt)+'">';
  Ld.slice().sort(function(a,b){return a.lop.localeCompare(b.lop,'vi',{numeric:true})||String(a.mon).localeCompare(String(b.mon),'vi')}).forEach(function(m){
   var on=!SBL.tatCa&&SBL.lop===m.lop&&(o.che==='lop'||SBL.mon===m.mon);
   h+='<option value="'+sblE(m.lop+'|'+(m.mon==null?'':m.mon))+'"'+(on?' selected':'')+'>'+sblE(m.lop+(m.mon!=null?' · '+m.mon:''))+(chu(m.viec)?' — '+sblE(chu(m.viec)):'')+'</option>';
  });
  if(dts.length>1) h+='</optgroup>';
 });
 return lk+h+'</select></div>';
}

/* deep-link: ?ctx=lop|mon&return=M2.1 (preview dạng data: mất query string ⇒ đọc thêm #ctx=…) */
function sblDocUrl(){
 var s='&'+String(location.search||'').replace(/^\?/,'')+'&'+String(location.hash||'').replace(/^#/,'');
 var m=s.match(/&ctx=([^&]+)/); if(!m) return false;
 var r=s.match(/&return=([^&]+)/);
 return sblMoLink(decodeURIComponent(m[1]),r?decodeURIComponent(r[1]):'');
}
function sblMoLink(ctx,tu){
 var p=String(ctx).split('|');
 SBL.lop=p[0]||null;SBL.mon=p[1]||null;SBL.tatCa=false;SBL.tim='';SBL.nho=null;
 SBL.link={ctx:ctx,tu:tu||'',lop:SBL.lop,mon:SBL.mon,moi:true};SBL.giuLink=true;
 return true;
}

document.addEventListener('click',function(e){
 var t=e.target&&e.target.closest?e.target.closest('[data-sbl]'):null; if(!t) return;
 var k=t.getAttribute('data-sbl');
 if(k==='P'){SBL.tatCa=false;SBL.lop=t.getAttribute('data-l');SBL.mon=t.hasAttribute('data-m')?t.getAttribute('data-m'):null}
 else if(k==='L'){SBL.tatCa=false;SBL.lop=t.getAttribute('data-l');SBL.mon=null}
 else if(k==='ALL'){SBL.tatCa=true}
 else if(k==='G'){var g=t.getAttribute('data-g');SBL.dong[g]=!SBL.dong[g]}
 else if(k==='VIEC'){SBL.chiViec=!SBL.chiViec}
 else if(k==='BOLINK'){SBL.link=null}
 else return;
 render();
});
document.addEventListener('change',function(e){

/* ═══════════ M2.5 — TÍNH: phạm vi · ô theo em · TB môn · vùng sửa · điều kiện mở ô định kỳ · số việc cho sidebar ═══════════ */

/* ===== PHẠM VI — ràng buộc dữ liệu, không phải ẩn nút. Danh sách DỰNG TỪ PHÂN CÔNG (khung §13) =====
   GVBM theo phân công · GVCN mọi môn lớp mình · TTCM theo tổ (+ cặp mình dạy) · BGH theo điểm trường */
function capPhamVi(){
 const r=R(); let ds=[];
 Object.keys(PC).forEach(g=>PC[g].forEach(([lop,mon])=>ds.push({lop,mon,gv:g})));
 if(!r.moiCap){
  if(r.sc==='group') ds=ds.filter(p=>(TO[r.to]||[]).includes(p.mon)||p.gv===r.gv);
  else if(r.lopCN) ds=ds.filter(p=>p.lop===r.lopCN);
  else if(r.sc!=='school') ds=ds.filter(p=>p.gv===r.gv);
 }
 if(ST.dt) ds=ds.filter(p=>dtOf(p.lop)===ST.dt);
 return ds.sort((a,b)=>a.lop.localeCompare(b.lop,'vi')||a.mon.localeCompare(b.mon,'vi'));
}
/* Lớp Tiểu học LOẠI khỏi danh sách — TT 27/2020 Đ.6: ĐGtx Tiểu học bằng nhận xét, không dùng điểm số */
const capHopLe=()=>capPhamVi().filter(p=>capHoc(p.lop)!=='TH');
const capTieuHoc=()=>capPhamVi().filter(p=>capHoc(p.lop)==='TH');

/* ===== MỐC CHỐT — theo (Kỳ × Điểm trường) (P20) ===== */
const mocChot=(k,lop)=>CFG.chot[k][dtOf(lop)];
const daChot=(k,lop)=>HOMNAY>mocChot(k,lop);
const conLai=(k,lop)=>mocChot(k,lop)-HOMNAY;

const coGT=v=>v!==undefined&&v!==null&&v!=='';
function oCua(p,k,h){
 return oArr(p.lop,p.mon,k,h).map((id,i)=>{const l=luotHien(id);
  return {k:i,l,v:l?l.diem[h]:undefined,vang:l&&!coGT(l.diem[h])?l.vang[h]:null}});
}
/* LƯỢT THAM KHẢO của em = lượt em có điểm nhưng không đứng ở ô chính thức nào — có điểm, có lịch sử, KHÔNG vào công thức, KHÔNG lên App */
function thamKhao(p,k,h){
 const a=oArr(p.lop,p.mon,k,h);
 return LUOT.filter(l=>hienL(l)&&l.lop===p.lop&&l.mon===p.mon&&l.hk===k&&coGT(l.diem[h])&&!a.includes(l.id)).sort((x,y)=>x.ngay-y.ngay);
}
const luotCuaEm=(p,k,h)=>LUOT.filter(l=>hienL(l)&&l.lop===p.lop&&l.mon===p.mon&&l.hk===k&&coGT(l.diem[h])).sort((x,y)=>x.ngay-y.ngay);
const thieuCua=(p,h,k)=>oCua(p,k,h).filter(o=>!coGT(o.v)).length;
const vangBu=(p,h,k)=>oCua(p,k,h).filter(o=>!coGT(o.v)&&o.vang).length;
const oTrongCap=(p,k)=>hsLop(p.lop).reduce((s,h)=>s+thieuCua(p,h,k),0);
const oCuaLuot=(l,h)=>oArr(l.lop,l.mon,l.hk,h).indexOf(l.id);

/* ===== v3.2 · VIỆC 1 — BẤM Ô ĐGtx: luồng theo TRẠNG THÁI Ô (§5.6) =====
   Lượt cá nhân CHỜ ĐIỂM của em = lượt đã gọi em mà chưa nhập, chưa vắng. Nó chưa đứng ở ô nào; «ô chờ» của nó là
   ô trống SỚM NHẤT của em — đúng chỗ §3.2.2 mục 4 sẽ đặt điểm khi nhập ⇒ bấm ô đó là ca ②, bấm ô trống khác là ca ① (có dải chống tạo trùng). */
const choCN=(p,k,h)=>LUOT.filter(l=>hienL(l)&&!l.nhap&&l.kieu==='cn'&&l.lop===p.lop&&l.mon===p.mon&&l.hk===k
 &&l.ds.includes(h)&&!coGT(l.diem[h])&&!l.vang[h]).sort((a,b)=>a.ngay-b.ngay);
const oTrongDau=(p,k,h)=>oCua(p,k,h).findIndex(o=>!o.l);
/* ca: 1 trống không lượt chờ · 2 trống có lượt chờ · 3 V (vắng lượt cả lớp) · 4 có điểm · 6 vai không nhập (chỉ xem).
   sau = đã qua mốc chốt (ca ⑤): ① không tạo lượt được · ② ③ vẫn nhập thẳng, nhãn `nhập sau mốc chốt` */
function caO(p,k,h,i){
 const o=oCua(p,k,h)[i], sau=daChot(k,p.lop);
 if(!canNhap(p)) return {ca:6,o};
 if(o.l&&coGT(o.v)) return {ca:4,o,l:o.l};
 if(o.l) return {ca:o.vang?3:2,o,ls:[o.l],sau};
 const cho=choCN(p,k,h);
 if(cho.length&&i===oTrongDau(p,k,h)) return {ca:2,o,ls:cho,sau,cn:true};
 return {ca:1,o,cho,sau};
}
/* Lượt của cặp trong học kỳ — `Nháp` chỉ người tạo thấy (§6): vai Đủ quyền và GVBM của cặp */
const thayNhap=p=>canNhap(p)&&co('tao');
const luotCap=(p,k)=>LUOT.filter(l=>hienL(l)&&l.lop===p.lop&&l.mon===p.mon&&l.hk===k&&(!l.nhap||thayNhap(p))).sort((a,b)=>b.ngay-a.ngay);
/* Vùng của MỘT lần đổi ô = vùng của lượt ĐANG đứng ở ô (§7.3). Ô trống / V: trước mốc = A, sau mốc = «ô trống sau mốc» — đều đổi thẳng */
function vungDoiO(p,k,h,idCu){
 const lCu=idCu?luotHien(idCu):null, vCu=lCu?lCu.diem[h]:undefined;
 if(hbKy(p)) return 'C+';
 if(daChot(k,p.lop)) return coGT(vCu)?'C':'sauChot';
 return lCu&&coGT(vCu)&&ttLuot(lCu)==='xong'?'B':'A';
}

/* ===== Ô ĐGgk / ĐGck — hình chiếu 🔗 M2.8, và là CỬA NHẬP THỨ HAI khi đủ điều kiện (Việc 2) =====
   Mở KHI VÀ CHỈ KHI: tai_lop · gv_cham · đang chấm · người dùng ∈ nguoi_cham (+ M2.8 chưa khóa vì chữ ký nhập liệu ⑦) */
function dieuKienDK(r){
 const tt=ttMon(r);
 return [
  {ok:r.hinh_thuc==='tai_lop',t:'Thi tại lớp',sai:'Thi chung toàn trường — học sinh ngồi theo phòng, có SBD'},
  {ok:r.cach_cham==='gv_cham',t:'GV chấm (không dọc phách)',sai:'Dọc phách — giáo viên không được biết số phách ứng với em nào; người chấm nhập theo mã phách ở M2.8 ⑦'},
  {ok:tt==='dang_cham',t:'Môn đang chấm',sai:{chua_thi:'Môn chưa thi xong ở mọi lớp — ô mở khi buổi thi cuối của môn kết thúc (M2.8 §3.4.1)',
    da_chot:'Môn đã chốt — chờ công bố ở M2.8 ⑧',da_cong_bo:'Môn đã công bố — sửa chỉ qua phúc khảo M2.8 ⑨'}[tt]},
  {ok:r.nguoi_cham.includes(toiGV()),t:'Bạn được phân chấm lớp này',sai:'Bạn không có tên trong người chấm của phòng (lớp) này — người chấm: '+r.nguoi_cham.map(g=>GV[g]).join(', ')},
  {ok:!r.ky_xac_nhan,t:'Chưa ký xác nhận nhập liệu',sai:'Người chấm đã ký xác nhận nhập liệu ở M2.8 ⑦ — dữ liệu khóa; muốn sửa thì gỡ chữ ký ở M2.8'},
 ];
}
const moNhapDK=r=>co('nhap')&&dieuKienDK(r).every(x=>x.ok);
const TT_MON={chua_thi:'Chưa thi',dang_cham:'Đang chấm',da_chot:'Đã chốt · chờ công bố',da_cong_bo:'Đã công bố'};
/* Ô trống ở cột định kỳ có BA nghĩa (§4.1b — giữ): chưa có kỳ thi · chờ công bố · (chưa thi). Cộng thêm: ô mở để nhập */
function oDK(p,k,loai,h){
 const r=kyCua(p.lop,p.mon,k,loai);
 if(!r) return {r:null,hien:'—',ghi:'chưa có kỳ thi'};
 const tt=ttMon(r),v=diemKy(r,h),vang=r.vang_thi.includes(h);
 if(tt==='da_cong_bo') return {r,tt,cong:true,v:vang?null:v,vang,hien:vang?'V':coGT(v)?f1(v):'—',pk:!!r.phuc_khao[h]};
 if(moNhapDK(r)) return {r,tt,mo:true,v,vang};
 /* người chấm tự nhập thì xem lại được con số của mình (mờ); người khác thấy «—» tới khi công bố */
 if(r.cach_cham==='gv_cham'&&(tt==='dang_cham'||tt==='da_chot')&&r.nguoi_cham.includes(toiGV()))
  return {r,tt,rieng:true,hien:vang?'V':coGT(v)?f1(v):'—',ghi:tt==='da_chot'?'chờ công bố':'đã khóa'};
 return {r,tt,hien:'—',ghi:tt==='chua_thi'?'chưa thi':r.cach_cham==='doc_phach'&&tt==='dang_cham'?'dọc phách':'chờ công bố'};
}
function dkCho(p,k){let n=0;['gk','ck'].forEach(lo=>{const r=kyCua(p.lop,p.mon,k,lo);
 if(r&&moNhapDK(r)) n+=hsLop(p.lop).filter(h=>!coGT(r.diem[h])&&!r.vang_thi.includes(h)).length});return n}

/* ===== TB MÔN HỌC KỲ — TT 22/2021 Điều 9: (Σ ĐĐGtx + 2·ĐĐGgk + 3·ĐĐGck) / (N + 5)
   CÔNG THỨC KHÔNG ĐỔI — chỉ khác là N ĐĐGtx nay được CHỌN THEO TỪNG EM. Thiếu dữ liệu ⇒ «—», không tính ẩu. */
function tbMon(p,h,k){
 if(laNX(p.mon)) return null;
 const os=oCua(p,k,h); if(os.some(o=>!coGT(o.v))) return null;
 const g=oDK(p,k,'gk',h),c=oDK(p,k,'ck',h);
 if(!g.cong||!c.cong||!coGT(g.v)||!coGT(c.v)) return null;
 return Math.round((os.reduce((s,o)=>s+o.v,0)+2*g.v+3*c.v)/(os.length+5)*10)/10;
}

/* ===== BỐN VÙNG (P20) + TK =====
   A chưa công bố · B đã công bố chưa chốt · C sau mốc chốt (Kỳ × Điểm trường) · C+ học bạ đã qua PHT/HT
   TK (P16): điểm của lượt đang là THAM KHẢO với em đó — không vào công thức, không lên App ⇒ sửa tự do, vẫn ghi vết */
function vungCua(p,l,h){
 if(hbKy(p)) return 'C+';
 if(h&&l&&!oArr(p.lop,p.mon,l.hk,h).includes(l.id)) return 'TK';
 if(daChot(l.hk,p.lop)) return 'C';
 return ttLuot(l)==='xong'?'B':'A';
}
const TENVUNG={A:'Vùng A — đang nhập, chưa công bố',B:'Vùng B — đã công bố, chưa tới mốc chốt',C:'Vùng C — sau mốc chốt',
 'C+':'Vùng C+ — học bạ đã ký',TK:'Lượt tham khảo — không vào công thức, không lên App'};

/* ===== ĐIỀU KIỆN KÝ KẾT QUẢ MÔN — §6.1 (P20): mốc chốt CẢ NĂM · đủ ô CẢ HAI kỳ · không còn đề nghị chờ ===== */
function dieuKienKy(p){
 const hs=hsLop(p.lop), thieu=hs.filter(h=>thieuCua(p,h,1)>0||thieuCua(p,h,2)>0);
 const dnC=DENGHI.filter(d=>hienD(d)&&d.lop===p.lop&&d.mon===p.mon&&d.buoc==='cho');
 const chua=[];
 if(!daChot(2,p.lop)) chua.push({k:'chot',t:'Chưa qua mốc chốt điểm cả năm ('+dstrY(mocChot(2,p.lop))+') — còn '+conLai(2,p.lop)+' ngày'});
 if(thieu.length) chua.push({k:'thieu',t:'Còn '+thieu.length+' học sinh chưa đủ ô ĐGtx (tính cả hai học kỳ)',ds:thieu});
 if(dnC.length) chua.push({k:'dn',t:'Còn '+dnC.length+' đề nghị sửa điểm đang chờ duyệt — ký xong rồi sửa thì chữ ký mất hiệu lực',dn:dnC});
 return chua;
}

/* ===== CON SỐ VIỆC CHO SIDEBAR — mỗi chế độ đếm việc của CHÍNH nó (khung §12.3: thu nhóm không giấu việc) ===== */
const dnCap=(p,f)=>DENGHI.filter(d=>hienD(d)&&d.lop===p.lop&&d.mon===p.mon&&(!f||f(d)));
function viecCap(p){
 if(ST.tab==='bang'&&ST.loc){
  const f=ST.loc==='cho'?d=>d.buoc==='cho'&&co('duyetC')&&dnPhamVi(d):ST.loc==='toi'?d=>d.gv===R().gv:d=>dnPhamVi(d);
  return [{n:dnCap(p,f).length,t:ST.loc==='cho'?'chờ duyệt':'đề nghị',c:'r'}];
 }
 /* v3.2: không còn tab Lượt — con số «đang nhập» của tab cũ bỏ; ô trống đã đếm việc nhập còn thiếu */
 const k=kyGet(p);
 return [{n:oTrongCap(p,ST.hk),t:'ô trống',c:'w'},{n:dnCap(p,d=>d.buoc==='cho').length,t:'chờ duyệt',c:'r'},
  {n:canNhap(p)?dkCho(p,ST.hk):0,t:'định kỳ chờ nhập',c:'b'},
  {n:daChot(2,p.lop)&&co('kyMon')&&canNhap(p)&&!k?1:0,t:'chưa ký',c:'v'}];
}

/* ═══════════ M2.5 — TAB 1 · BẢNG ĐIỂM MÔN (một cặp Lớp × Môn đang chọn ở sidebar) ═══════════
   Bố cục P16 (sidebar) · ô theo em P16 · dấu vùng trên ô, dải vùng, nút ✉ cấp bảng, cột Ghi chú: P20 */
const VT={'Hỏi–đáp':'HĐ','Thuyết trình':'TTr','Viết 15 phút':'15ph','15 phút':'15ph','Thực hành':'TH','Sản phẩm':'SP','Bài tập':'BT','Kiểm tra nhỏ':'KTn','Miệng':'M'};
/* lượt «Kiểm tra bù sau mốc» (V32-1) mang tiền tố `Bù` ngay trên ô — nhìn bảng là biết điểm này có sau mốc chốt */
const nhanL=l=>(l.bu?'Bù ':'')+(VT[l.loai]||l.loai)+' '+dstr(l.ngay);
const hkSeg=()=>'<div class="seg">'+[1,2].map(k=>'<button class="'+(ST.hk===k?'on':'')+'" data-a="hk" data-v="'+k+'">'+HK[k].ten
 +(HOMNAY>=HK[k].tu&&HOMNAY<=HK[k].den+1?' · đang diễn ra':'')+'</button>').join('')+'</div>';

function dauCap(p,nut){

  +esc(dtNgan(p.lop))+' · '+hsLop(p.lop).length+' học sinh'+(laNX(p.mon)?' · <b>môn đánh giá bằng nhận xét</b>':'')+'</div></div><span class="sp"></span>'+hkSeg()+(nut||'')+'</div>';
}
function daiNguon(p){
 const n=soO(p.lop,p.mon,ST.hk), chot=daChot(ST.hk,p.lop);
 return '<div class="wnote"><span>📐 <b>'+n+' ô ĐGtx mỗi em</b> '+(laNX(p.mon)?'(môn nhận xét — TT 22 Đ.6 k2a: 2 lần/HK)':'(TT 22/2021 Đ.6 k2)')
  +' · <button class="rolnk" data-a="lnk" data-v="M10.1 ⑥ Số cột điểm ĐGtx — /M10.1?ctx=2026-2027&muc=6&lop='+p.lop+'&return=M2.5">🔗 M10.1 ⑥</button></span>'

  +'<span>📅 Mốc chốt '+(ST.hk===1?'HK I':'HK II')+' · '+esc(dtNgan(p.lop))+': <b>'+dstrY(mocChot(ST.hk,p.lop))+'</b> — '+(chot?'<b style="color:var(--red)">đã qua</b>':'còn '+conLai(ST.hk,p.lop)+' ngày')
  +' · <button class="rolnk" data-x="m101">🔗 M10.1 Hồ sơ năm học</button></span></div>';
}

/* ─── dải kỳ thi: nói rõ VÌ SAO ô ĐGgk/ĐGck mở hay khóa — bốn điều kiện hiện thành ✓/✗ ─── */
function kyDong(p,loai){
 const r=kyCua(p.lop,p.mon,ST.hk,loai), nh=loai==='gk'?'Giữa kỳ':'Cuối kỳ', o=loai==='gk'?'ĐGgk':'ĐGck';
 if(!r) return '<div class="kyd chua"><b>'+nh+'</b><span>— <b>chưa có kỳ thi</b> nào phủ '+esc(p.lop)+' · '+esc(p.mon)+' · '+HK[ST.hk].ten+'. Ô '+o+' không mở.</span>'
  +(co('m28tao')?'<button class="btn xs" data-a="taoKy" data-v="'+loai+'">↗ Tạo kỳ thi tại M2.8</button>':'<span class="mini">Kỳ thi do PHT chuyên môn / tổ trưởng tạo ở M2.8.</span>')
  +'<div class="dnote kyly">Không có đường nhập tự do: nhập ngoài kỳ thi thì <b>mất công bố đồng loạt</b> · <b>mất đường phúc khảo</b> cho điểm hệ số 2 và 3 · <b>mất thi bù</b> (em vắng không có danh sách để tổ chức lại).</div></div>';
 const tt=ttMon(r), mo=moNhapDK(r), dk=dieuKienDK(r), hs=hsLop(p.lop);
 const coD=hs.filter(h=>coGT(diemKy(r,h))).length, v=r.vang_thi.filter(h=>hs.includes(h)).length;
 let giua;
 if(tt==='da_cong_bo') giua='<span>Điểm đã chảy sang bảng · sửa chỉ qua <b>phúc khảo M2.8 ⑨</b>.</span>';
 else if(mo) giua='<span class="mo">✎ <b>Bạn nhập ngay trên cột '+o+'</b> — ghi thẳng vào bản ghi của M2.8, nhật ký ghi «nhập tại M2.5». Có điểm <b>'+coD+'/'+hs.length+'</b>'+(v?' · <b>'+v+'</b> vắng thi':'')+'.</span>'
  +'<button class="btn xs" data-a="lnk" data-v="M2.8 ⑦ — Ký xác nhận nhập liệu phòng '+p.lop+' (chốt · công bố vẫn ở M2.8 ⑧)">↗ Ký xác nhận nhập liệu ở M2.8 ⑦</button>';
 else giua='<span class="kh">🔒 Không nhập ở đây — '+esc((dk.find(x=>!x.ok)||{sai:'vai của bạn không nhập điểm ở menu này'}).sai)+'</span>';
 return '<div class="kyd '+(mo?'mo':tt==='da_cong_bo'?'xong':'')+'"><b>'+nh+'</b><span class="kyt">'+esc(r.ten)+'</span>'
  +'<span class="st2 n">'+(r.hinh_thuc==='tai_lop'?'Thi tại lớp':'Thi chung')+'</span><span class="st2 n">'+(r.cach_cham==='gv_cham'?'GV chấm':'Dọc phách')+'</span>'
  +'<span class="st2 '+(tt==='da_cong_bo'?'o':tt==='dang_cham'?'b':'w')+'">'+TT_MON[tt]+'</span>'+giua
  +(tt!=='da_cong_bo'?'<div class="dkl">'+dk.map(x=>'<span class="'+(x.ok?'ok':'no')+'">'+(x.ok?'✓':'✗')+' '+esc(x.t)+'</span>').join('')+'</div>':'')
  +'<button class="rolnk" data-a="lnk" data-v="M2.8 — '+esc(r.ten)+' · /M2.8?ctx='+r.ky+'|'+p.lop+'|'+p.mon+'&action=xem&return=M2.5">🔗 M2.8</button></div>';
}

function viewBang(c){
 const p={lop:c.lop,mon:c.mon}, k=ST.hk, hs=hsLop(p.lop), n=soO(p.lop,p.mon,k), ghiDuoc=canNhap(p);
 const ky=kyGet(p), hb=hbKy(p), chot=daChot(k,p.lop), coYC=co('dexuat')&&ghiDuoc;
 const coLuot=hs.some(h=>oCua(p,k,h).some(o=>o.l));
 /* LỐI VÀO CẤP BẢNG (P20): không chỉ trông vào việc bấm đúng một ô */
 const nut=(chot&&!hb&&coYC&&coLuot?'<button class="btn sm yc" data-wyc="1">✉ Gửi yêu cầu sửa điểm</button>':'')
  +(co('import')&&ghiDuoc?'<button class="btn sm" data-x="import">⬆ Import</button>':'')
  +'<button class="btn sm" data-x="xuat">⬇ Xuất</button>'
  +(co('kyMon')&&ghiDuoc?'<button class="btn sm" data-x="kymon">⚖ '+(ky?'Xem chữ ký':'Ký kết quả môn')+'</button>':'')
  +(co('xemall')&&!co('nhap')?'<button class="btn sm" data-x="baogvbm">🔔 Báo GVBM</button>':'')
  +'<button class="btn sm" data-a="lichsu">🕘 Lịch sử</button>';
 /* DẢI VÙNG (P20) — luôn nói rõ bảng này đang ở vùng nào và sửa bằng cách nào (§7) */
 const vungBand=hb

  :chot?'<div class="danger zc"><div>🔒 <b>Vùng C — đã qua mốc chốt '+(k===1?'HK I':'HK II')+' ('+dstrY(mocChot(k,p.lop))+').</b> Điểm đã vào trung bình môn và đã hiện trên App phụ huynh — ô <b>có điểm</b> không sửa thẳng được, phải <b>gửi yêu cầu sửa điểm</b>: lý do + minh chứng, <b>Tổ trưởng CM hoặc PHT chuyên môn</b> duyệt, ai duyệt trước có hiệu lực. Ô <b>còn trống</b> vẫn nhập được, gắn nhãn <i>nhập sau mốc chốt</i> (M10.1 §6.2.5) — ô có lượt chờ / <b>V</b> gõ thẳng; ô chưa có lượt nào thì <b>✚ kiểm tra bù sau mốc</b> (lượt cá nhân, lý do bắt buộc).'
   +(ky?'<br>⚖ Kết quả môn <b>đã ký</b> (học bạ chưa qua PHT/HT): đề nghị được duyệt thì <b>chữ ký mất hiệu lực với riêng em đó</b>.':'')+'</div>'
   +(coYC&&coLuot?'<button class="btn p" data-wyc="1" style="flex:none">✉ Gửi yêu cầu sửa điểm</button>':'')+'</div>'
  :'<div class="roblk">✎ <b>Trước mốc chốt</b> — lượt <b>đang nhập</b> (vùng A): sửa tự do · lượt <b>đã hoàn tất</b> (vùng B, phụ huynh đã thấy): tự sửa, <b>bắt buộc lý do</b>, hệ thống <b>báo phụ huynh</b>, không cần duyệt. Sau '+dstrY(mocChot(k,p.lop))+' ô có điểm chuyển sang <b>vùng C</b> — phải gửi yêu cầu sửa điểm.</div>';
 const thieu=hs.filter(h=>thieuCua(p,h,k)>0), vb=hs.filter(h=>vangBu(p,h,k)>0), trong=oTrongCap(p,k);
 const nTK=hs.reduce((s,x)=>s+thamKhao(p,k,x).length,0), emTK=hs.filter(x=>thamKhao(p,k,x).length), nL=luotCap(p,k).length;
 if(ST.locTK&&!emTK.length) ST.locTK=false;
 /* ô đang gõ tại chỗ chỉ sống trong đúng cặp × học kỳ đã mở nó */
 if(ST.oGo&&ST.oGo.cap!==p.lop+'|'+p.mon+'|'+k) ST.oGo=null;
 let h=dauCap(p,nut)+daiNguon(p)+'<div class="kys">'+kyDong(p,'gk')+kyDong(p,'ck')+'</div>'+vungBand

  /* Việc 2: khối lượt nằm dưới bảng 40 em ⇒ lối cuộn thẳng tới khối */
  +'<button class="it itb" data-a="denkhu" title="Cuộn tới khối Lượt kiểm tra thường xuyên bên dưới bảng"><b>'+nL+'</b> lượt ↓</button></div>'
  +(ST.locTK?'<div class="info fband">🔎 Đang lọc: <b>'+emTK.length+' em có lượt tham khảo</b> — mỗi em có nhiều lượt có điểm hơn '+n+' ô chính thức. Bấm <b>«n tham khảo ›»</b> ở cột TK để chọn điểm nào vào tổng kết. <button class="rolnk" data-a="loctk">✕ Bỏ lọc</button></div>':'');
 const g0=oDK(p,k,'gk',hs[0]), c0=oDK(p,k,'ck',hs[0]);

  +Array.from({length:n},(_,i)=>'<th class="oc">Ô '+(i+1)+'<span>ĐGtx</span></th>').join('')
  +'<th class="tk">TK<span>tham khảo</span></th>'
  +'<th class="dk'+(g0.mo?' mo':'')+'" data-a="dkx" data-v="gk">ĐGgk<span>'+(g0.mo?'✎ nhập tại đây':'🔗 M2.8')+'</span></th>'
  +'<th class="dk'+(c0.mo?' mo':'')+'" data-a="dkx" data-v="ck">ĐGck<span>'+(c0.mo?'✎ nhập tại đây':'🔗 M2.8')+'</span></th>'
  +'<th class="tb">'+(laNX(p.mon)?'Kết quả':'TB môn')+'<span>'+(laNX(p.mon)?'🔗 M3.1':'TT 22 Đ.9')+'</span></th><th class="gc">Ghi chú</th></tr>';
 /* Việc 1 · ca ⑥ — vai không nhập điểm: ô KHÔNG bấm được (không popup, không ô gõ — D3), chỉ xem; nhãn lượt vẫn mở khối lượt chỉ đọc */
 const ro=!ghiDuoc, og=ST.oGo;

    const hl=ST.cur&&o.l&&o.l.id===ST.cur?' hl':'', da=ro?'':' data-o="'+x+'|'+o.k+'"', rc=ro?' ro':'';

     return '<td class="oc go"><input class="ogo" id="ogo" autocomplete="off" placeholder="'+(laNX(p.mon)?'Đ/CĐ':'0–10')+'" title="Enter = lưu · Esc = bỏ'+(l.kieu==='lop'?' · v = vắng':'')+'">'
      +'<span class="src">'+esc(nhanL(l))+(og.bu?' · kiểm tra bù':'')+(chot?' · nhập sau mốc chốt':'')+'</span></td>'}
    if(!o.l){const laCho=o.k===dau&&cho.length;
     const tt=ro?'Ô trống — chưa có lượt nào của em đứng ở ô này'
      :laCho?'Lượt «'+cho[0].ten+'» đã gọi em, chưa nhập — bấm để gõ điểm ngay tại ô'+(chot?' (nhập sau mốc chốt)':'')
      :chot?'Ô trống sau mốc chốt — bấm để kiểm tra bù sau mốc (lượt cá nhân, lý do bắt buộc, nhập sau mốc chốt)'
      :'Ô trống — bấm để tạo lượt kiểm tra ngay tại ô (lượt cá nhân, chọn sẵn em này)';
     return '<td class="oc trong'+(laCho?' cho1':'')+rc+'"'+da+' title="'+esc(tt)+'">—'
      +(laCho?'<span class="src lb chot" data-lb="'+cho[0].id+'" title="Lượt cá nhân đã gọi em, chưa nhập điểm — mở lượt ở khối bên dưới">chờ · '
        +(cho.length>1?cho.length+' lượt':esc(nhanL(cho[0])))+'</span>':'')+'</td>'}
    if(!coGT(o.v)) return '<td class="oc '+(o.vang?'vang':'trong')+hl+rc+'"'+da+' title="'+esc(ro?(o.vang||'Chưa nhập'):o.vang?'Vắng — bấm để nhập điểm kiểm tra bù ngay tại ô':'Lượt đã có, em chưa có điểm — bấm để gõ ngay tại ô')+(chot&&!hb&&!ro?' · nhãn “nhập sau mốc chốt”':'')+'">'+(o.vang?'V':'—')+lb(o.l)+'</td>';
    const choD=dnH.find(z=>z.ci===o.k&&z.buoc==='cho'), sua=dnH.filter(z=>z.ci===o.k&&z.buoc==='xong').pop(), vg=vungCua(p,o.l,x);
    const dot=tk.length?'<i class="tkdot" title="Em có '+tk.length+' lượt khác có thể chọn vào ô — bấm «'+tk.length+' tham khảo ›»"></i>':'';
    if(choD) return '<td class="oc zcho'+hl+rc+'"'+da+' title="Đang có đề nghị '+choD.id+' chờ duyệt">'+f1(o.v)+lb(o.l)+dot+'</td>';
    const cls=vg==='C+'?'zcp':vg==='C'?'zc':vg==='B'?'zb':'';
    const tt=ro?'Chỉ xem — '+TENVUNG[vg]:vg==='C+'?'Vùng C+ — học bạ đã ký: sửa qua bản đính chính (M1.3)':vg==='C'?'Vùng C — bấm để gửi yêu cầu sửa điểm':vg==='B'?'Vùng B — đã công bố: sửa kèm lý do, báo phụ huynh':'Vùng A — đang nhập: sửa tự do';
    return '<td class="oc '+cls+(o.l.kieu==='cn'?' cn':'')+(sua?' dasua':'')+hl+rc+'"'+da+' title="'+tt+(sua?' · đã sửa qua '+sua.id:'')+'"><b>'+f1(o.v)+'</b>'+lb(o.l)+dot+'</td>'}).join('')
   /* Việc 3: «+3» đổi thành nút rõ — hộp «Chọn điểm tổng kết» */
   +'<td class="tk">'+(tk.length?'<button class="tkb'+(ST.cur&&tk.some(l=>l.id===ST.cur)?' hl':'')+'" data-a="em" data-v="'+x+'" title="Chọn điểm nào vào tổng kết, điểm nào là tham khảo">'+tk.length+' tham khảo ›</button>':'')+'</td>'
   +['gk','ck'].map(lo=>{const d=oDK(p,k,lo,x);
     if(d.mo) return '<td class="dk mo"><input class="odk" data-dk="'+lo+'|'+x+'" value="'+(d.vang?'v':f1(d.v))+'" placeholder="—" title="Ghi vào bản ghi kỳ thi của M2.8 · gõ v = vắng thi"></td>';
     return '<td class="dk'+(d.rieng?' rieng':'')+'" data-a="dkc" data-v="'+x+'|'+lo+'" title="'+esc(d.r?d.r.ten+' — '+TT_MON[d.tt]:'Chưa có kỳ thi')+'">'+esc(d.hien)
      +(d.pk?'<span class="src pk">đã phúc khảo</span>':d.ghi?'<span class="src">'+esc(d.ghi)+'</span>':'')+'</td>'}).join('')
   +'<td class="tb">'+(laNX(p.mon)?'<span class="mini">M3.1</span>':tb==null?'<span style="color:var(--ink3)">—</span>':f1(tb))+'</td>'
   +'<td class="gc">'+dnH.slice().reverse().map(z=>'<span class="st2 '+BUOC[z.buoc].c+'" data-dnhs="'+z.id+'" style="cursor:pointer" title="Mở đề nghị '+z.id+'">'
     +(z.buoc==='cho'?'⏳ '+z.id+' chờ duyệt':z.buoc==='xong'?'✓ '+z.id+' đã sửa':'✕ '+z.id+' bị từ chối')+'</span>').join(' ')
   +(th_?' <span class="st2 '+(vangBu(p,x,k)?'v':'w')+'">Thiếu '+th_+' ô</span>':'')
   +(ky?(bk?' <span class="st2 r" title="Dữ liệu đổi '+esc(bk.luc)+' qua '+esc(bk.dn)+'">⚖ Chữ ký mất hiệu lực — dữ liệu đã đổi</span>':' <span class="st2 o">⚖ Đã ký</span>'):'')+'</td></tr>';
 }).join('');
 h+='<div class="tblw"><table class="bd'+(ro?' rotbl':'')+'">'+th+rows+'</table></div>'
  +'<div class="legend"><span><b>8</b><i>HĐ 12/1</i> điểm · lượt đang đứng ở ô <span class="mini">(bấm nhãn lượt → mở lượt ở khối dưới)</span></span><span><b>—</b> ô trống</span><span><b>—</b><i class="chot">chờ · HĐ</i> lượt đã gọi em, chưa nhập</span><span><b>V</b> vắng, chờ kiểm tra bù</span><span><i class="lg tkd"></i> em có lượt tham khảo</span><span><b class="mini">3 tham khảo ›</b> chọn điểm tổng kết</span>'
  +(chot&&!hb?'<span><i class="lg zc"></i> vùng C — bấm để gửi yêu cầu</span><span><i class="lg zcho"></i> đang có đề nghị chờ</span><span><i class="lg dasua"></i> đã sửa qua đề nghị</span>':'')
  +(hb?'<span><i class="lg zcp"></i> vùng C+ — chỉ bản đính chính</span>':'')+(!chot?'<span><i class="lg zb"></i> vùng B — sửa kèm lý do</span>':'')
  +'<span style="margin-left:auto">'+(!ghiDuoc?'Chỉ đọc — ô không bấm được':hb?'Học bạ đã ký — không sửa ở Menu này':chot?'Bấm ô có điểm để gửi yêu cầu sửa · ô có lượt chờ vẫn gõ được · ô trống → <b>kiểm tra bù sau mốc</b>':'Bấm ô trống để <b>tạo lượt tại ô</b> · ô có lượt chờ thì <b>gõ ngay</b> · ô có điểm thì sửa theo vùng')+'</span></div>'
  +'<div class="lgd dnote"><b>Ô là của TỪNG EM, không của cả lớp.</b> Lượt cả lớp đổ vào cùng một ô cho mọi em; lượt cá nhân (hỏi–đáp) tự vào ô trống sớm nhất của chính em được gọi, ô đầy thì thành <b>tham khảo</b>. '
  +'Mỗi em đúng <b>'+n+'</b> ô vào công thức, và <b>không có nút «lấy điểm cao nhất»</b> (§3.2 mục 6). <b>Ô trống không phải điểm 0.</b></div>';
 return h;
}

/* ═══ v3.2 · VIỆC 1 — BẤM Ô ĐGtx: luồng theo trạng thái ô (§5.6). Ca ④ giữ nguyên luồng bốn vùng của P20 (moNhap) ═══ */
function moO(p,x,k){
 const c=caO(p,ST.hk,x,k);
 if(c.ca===6) return;                                               /* ⑥ chỉ xem — ô không có data-o, phòng hờ */
 if(c.ca===4) return moNhap(p,x,c.l);                               /* ④ có điểm → bốn vùng (dòng luật ở đầu hộp) */
 if(hbKy(p)) return moCPlus(p,x,c.ls?c.ls[0]:null);                  /* học bạ đã ký: ô trống cũng là nội dung học bạ */
 if(c.ca===2||c.ca===3) return c.ls.length>1?chonLuotCho(p,x,k,c.ls):goTaiO(p,x,k,c.ls[0].id,c.ca===3);
 /* ⑤ ① — lượt thường khóa sau mốc (§6.0b); ✅ V32-1 chốt 15/9: popup mở ở chế độ «Kiểm tra bù sau mốc» (cùng mã) */
 taoLuot(p,{taiO:{h:x,k},bu:c.sau});                                 /* ① popup «Tạo lượt tại ô» — cùng mã taoLuot */
}
/* ca ② ③ — ô thành ô gõ ngay; cùng luật gõ §5.3 */
function goTaiO(p,x,k,id,bu){
 ST.oGo={h:x,k,id,bu:!!bu,cap:p.lop+'|'+p.mon+'|'+ST.hk}; nhanh=null; render();
}
/* hai lượt cá nhân cùng chờ em ở ô này → hỏi chọn lượt trước (không đoán hộ) */
function chonLuotCho(p,x,k,ls){
 modal('Hai lượt cùng chờ điểm của '+HS[x].n,
  '<div class="info">Em đang được gọi ở <b>'+ls.length+' lượt</b> chưa nhập điểm. Chọn lượt bạn định nhập vào <b>Ô '+(k+1)+'</b>; lượt còn lại vẫn chờ ở ô trống kế tiếp.</div>'
  +'<table class="tb"><tr><th>Lượt</th><th>Tiết</th><th></th></tr>'+ls.map(l=>'<tr><td><b>'+esc(l.ten)+'</b><div class="mini">'+esc(l.loai)+' · lượt cá nhân</div></td><td class="mini">'+esc(tietLb(tietById(l.tiet)))+'</td>'
   +'<td><button class="btn xs p" data-mb="c'+l.id+'">Nhập vào lượt này</button></td></tr>').join('')+'</table>',[['Huỷ',0]]);
 ls.forEach(l=>{mfns['c'+l.id]=()=>{closeM();goTaiO(p,x,k,l.id,false)}});
}
/* Enter trên ô gõ tại chỗ: lưu rồi xuống em kế tiếp đang chờ CÙNG lượt ở cùng cột (nhập nhanh §5.3) */
function luuTaiO(val){
 const og=ST.oGo; if(!og) return; const p=pCur(), k=ST.hk, l=luotById(og.id), x=og.h;
 const g=docGT(val,p,l.kieu==='lop');
 if(g.rong){toast('Ô chưa có gì để lưu — gõ điểm'+(l.kieu==='lop'?' hoặc <b>v</b> = vắng':'')+', hoặc <b>Esc</b> để bỏ');return}
 if(g.loi){toast('⛔ '+g.loi);return}
 const sau=daChot(k,p.lop);
 if(l.kieu==='cn'&&!g.vang){const a=oArr(p.lop,p.mon,k,x); if(og.k>=0&&!a[og.k]&&!a.includes(l.id)) a[og.k]=l.id}   /* ô chờ = ô trống sớm nhất (mục 4) */
 const dat=apDiem(p,l,x,g,sau?'sauChot':'A','',og.bu?(sau?'Kiểm tra bù · nhập sau mốc chốt':'Kiểm tra bù'):sau?'Nhập sau mốc chốt':'Nhập điểm tại ô');
 const hs=hsLop(p.lop); let nx=null;

 else if(s==='v'||s==='V'){delete r.diem[x];if(!r.vang_thi.includes(x))r.vang_thi.push(x);moi='V'}

 else{const v=Number(s);
  if(isNaN(v)||v<0||v>10){toast('⛔ Điểm phải trong khoảng <b>0 – 10</b>');render();return}

/* ═══════════ M2.5 — KHỐI «LƯỢT KIỂM TRA THƯỜNG XUYÊN» DƯỚI BẢNG ĐIỂM (v3.2 — Việc 2: gộp tab cũ vào Feature Bảng điểm môn) ═══════════

 /* sau mốc: lượt thường khóa; còn em có ô trống thì mở lối «Kiểm tra bù sau mốc» (V32-1) — cho buổi bù nhiều em cùng lúc */
 const nBu=chot&&!hbKy(p)?hsLop(p.lop).filter(h=>oTrongDau(p,k,h)>=0).length:0;
 const nut=ghiDuoc?(chot?'<button class="btn sm" disabled title="Đã qua mốc chốt '+dstrY(mocChot(k,p.lop))+' — lượt thường khóa (§6.0b)">＋ Tạo lượt kiểm tra</button>'
   +(nBu?'<button class="btn sm p" data-a="taobu" title="Lượt cá nhân cho em còn ô trống — lý do bắt buộc, nhập sau mốc chốt">✚ Kiểm tra bù sau mốc · '+nBu+' em còn ô trống</button>':'')
  :'<button class="btn sm p" data-a="taoluot">＋ Tạo lượt kiểm tra</button>'):'';

 let h='<div class="khoi'+(dong?' dong':'')+'" id="khoiLuot"><div class="khh"><button class="khtg" data-a="khu" title="'+(dong?'Mở':'Thu')+' khối — nhớ trong phiên">'+(dong?'▸':'▾')+'</button>'
  +'<div class="kht" data-a="khu"><b>Lượt kiểm tra thường xuyên — '+esc(p.lop)+' · '+esc(p.mon)+' · '+(k===1?'HK I':'HK II')+'</b><span class="mini">'+ls.length+' lượt'
  +(ls.some(l=>l.nhap)?' · '+ls.filter(l=>l.nhap).length+' nháp':'')+(x?' · đang mở «'+esc(x.ten)+'» — các ô của lượt được tô trên bảng':'')+'</span></div><span class="sp"></span>'+(dong?'':nut)+'</div>';
 if(dong) return h+'</div>';

  else {const vao=e.filter(h=>oCuaLuot(l,h)>=0).length, tk=e.filter(h=>coGT(l.diem[h])&&oCuaLuot(l,h)<0).length, ch=e.filter(h=>!coGT(l.diem[h])&&!l.vang[h]).length;
   o='<span class="st2 o">'+vao+' vào ô</span>'+(tk?' <span class="st2 v">'+tk+' tham khảo</span>':'')+(ch?' <span class="st2 w">'+ch+' chờ điểm</span>':'')}
  return '<div class="brow'+(ST.cur===l.id?' on':'')+(l.nhap?' nhap':'')+'" data-a="luot" data-v="'+l.id+'"><div class="bdd"><b>'+esc(l.ten)+'</b>'
   +'<div class="sub"><span class="st2 '+(l.kieu==='lop'?'b':'n')+'">'+(l.kieu==='lop'?'Cả lớp':'Cá nhân')+'</span> '+(l.bu?'<span class="st2 v">✚ Bù sau mốc</span> ':'')+esc(tietLb(tietById(l.tiet)))+' · '
   +(l.nhap?'chưa công bố':e.filter(h=>coGT(l.diem[h])).length+'/'+e.length+' em có điểm')+(l.ref?' · 🔗 BTVN '+esc(l.ref):'')+'</div></div>'

  +'<div class="ro dnote" style="margin-bottom:8px"><b>Hai loại lượt.</b> <b>Cả lớp</b> (viết, thực hành, sản phẩm, bài tập cả lớp nộp) — mọi em có điểm hoặc vắng, GV gắn vào một ô. <b>Cá nhân</b> (hỏi–đáp, thuyết trình, bài tập vài em nộp) — điểm của em nào tự vào <b>ô trống sớm nhất của em đó</b>, ô đầy thì thành tham khảo. Cả hai đều gắn một tiết học. Bấm một lượt → các ô của nó được tô trên bảng.</div>'
  +'<div class="stage'+(x?' open':'')+'"><div class="listw">'+(rows||'<div class="empty">Chưa có lượt nào ở '+HK[k].ten+'. '+(ghiDuoc&&!chot?'Bấm <b>＋ Tạo lượt kiểm tra</b>, hoặc bấm thẳng vào một ô trống trên bảng.':'')+'</div>')+'</div>'
  +(x?panelLuot(p,x):'')+'</div></div></div>';

   :'<div class="info">Điểm của em nào tự vào <b>ô trống sớm nhất của em đó</b> theo thứ tự thời gian; em đã đủ '+n+' ô thì lượt này thành <b>tham khảo</b> của em.</div>')

  +(l.ref?'<div class="bph" style="margin-bottom:8px">🔗 Tham chiếu ngược tới BTVN <b>'+esc(l.ref)+'</b>'+(BTVN[l.ref]?' «'+esc(BTVN[l.ref].ten)+'»':'')+' ở M2.3 — M2.3 hiện bản chiếu chỉ đọc «Bài này có lượt kiểm tra liên kết». Điểm BTVN không tự chảy vào ô: điểm ở đây do GV nhập.</div>':'')

  +'</div>'+(ghiDuoc?'<div class="cact">'+(chot?'<button class="btn sm" disabled title="Đã qua mốc chốt">▶ Công bố lượt</button>'

/* ─── gõ điểm trong khung lượt: A · tham khảo · ô trống ⇒ ghi thẳng; B · C · C+ ⇒ mở đúng hộp của P20 ─── */
function suaTu(p,l,x,val){
 const vg=vungCua(p,l,x), cu=l.diem[x], coCu=cu!==undefined;
 if(vg==='C+'){render();return moCPlus(p,x,l)}
 if(vg==='C'&&coCu){render();return formYC(p,x,l,val)}
 if(vg==='B'&&coCu){render();nhanh={p,luot:l.id,i:emCuaLuot(l).indexOf(x),goi:val};return veNhap()}
 const g=docGT(val,p,l.kieu==='lop'); if(g.loi){toast('⛔ '+g.loi);render();return}
 const dat=apDiem(p,l,x,g,vg==='C'?'sauChot':vg,'');
 render(); toast('✓ '+esc(HS[x].n)+' = <b>'+f1(g.rong?'(trống)':g.vang?'V':g.v)+'</b>'+dat+(vg==='C'?' · <b>nhập sau mốc chốt</b>':''));
}

/* ─── TẠO LƯỢT — MỘT hàm cho cả hai lối (v3.2): lớp × môn ĐIỀN SẴN từ dòng sidebar; ngày = ngày của tiết (không nhập tay)
   opt.taiO = {h, k}  → popup rút gọn «Tạo lượt tại ô» (Việc 1 ca ①): Cá nhân · em của dòng · ô vừa bấm · điểm gõ ngay trong popup
   opt.kieu · loai · tiet · ds · oLop · ref · tu  → điền sẵn (lối `Đây là lượt cả lớp →`, deep-link M2.3 `action=tao`)
   Loại luôn ĐỂ TRỐNG trừ khi nơi gọi điền sẵn — GV tự chọn để tránh nhầm (góp ý 1); nút lưu khóa tới khi chọn. ─── */
function taoLuot(p,opt){
 opt=opt||{};
 const k=ST.hk, n=soO(p.lop,p.mon,k), hsL=hsLop(p.lop), taiO=opt.taiO||null, sau=daChot(k,p.lop);
 if(!thayNhap(p)){toast('⛔ Vai của bạn không tạo lượt ở cặp '+esc(p.lop)+' · '+esc(p.mon)+' (§13) — chỉ xem');return}
 /* Sau mốc chốt: lượt thường KHÓA (§6.0b). Ngoại lệ duy nhất — ✅ V32-1 chốt 15/9: lượt «Kiểm tra bù sau mốc» (opt.bu) */
 if(sau&&!opt.bu){toast('⛔ Đã qua mốc chốt '+(k===1?'HK I':'HK II')+' ('+dstrY(mocChot(k,p.lop))+') — không tạo lượt thường (§6.0b); em còn thiếu ô thì dùng <b>Kiểm tra bù sau mốc</b>');return}
 if(opt.bu&&!sau) opt.bu=false;
 if(opt.bu&&hbKy(p)){toast('⛔ Học bạ đã ký — không kiểm tra bù ở đây; đi bản đính chính ở M1.3');return}
 const laGV=t=>!R().gv||R().moiCap||t.gv===R().gv;
 /* Lượt bù: tiết đã dạy của cặp SAU mốc chốt tới hôm nay (có thể đã sang học kỳ sau) — buổi bù diễn ra sau mốc thì tiết cũng sau mốc */

/* ═══════════ M2.5 — NHẬP / SỬA ĐIỂM · BỐN VÙNG · YÊU CẦU SỬA ĐIỂM · KÝ KẾT QUẢ MÔN ═══════════
   ⚠ LUỒNG NÀY LÀ CỦA P20 (demo gửi yêu cầu sửa điểm, 14/9/2026) — P16 chỉ CHUYỂN sang tệp tách và đổi chỗ đọc
   «cột ĐGtx của cả lớp» thành «ô của từng em» (Việc 3). Chữ, hộp thoại, chặn, nhật ký giữ nguyên của P20.
   P16 THÊM: nhánh «⇄ đổi lượt cho ô» (doiO · formDoiO) đi qua đúng các hộp đó; lượt cá nhân tự vào ô trống sớm nhất.
   A  chưa công bố (lượt `Đang nhập`)       : sửa tự do
   B  đã công bố, chưa tới mốc chốt          : tự sửa + BẮT BUỘC lý do + báo phụ huynh
   C  sau mốc chốt (Kỳ × Điểm trường)        : gửi YÊU CẦU SỬA ĐIỂM → duyệt MỘT TẦNG (TTCM hoặc PHT_CM)
   C+ học bạ đã qua tầng PHT/HT              : KHÔNG gửi đề nghị — chỉ đường bản đính chính M1.3
   Ô CÒN TRỐNG sau mốc chốt vẫn nhập được, nhãn `nhập sau mốc chốt` (M10.1 §6.2.5). Audit ghi ở CẢ BỐN vùng. */

function docGT(s,p,choV){
 s=String(s).trim().replace(',','.');
 if(s==='') return {rong:1};
 if(choV&&(s==='v'||s==='V')) return {vang:1};
 if(laNX(p.mon)){const u=s.toUpperCase(); if(u==='Đ'||u==='D') return {v:'Đ'}; if(u==='CĐ'||u==='CD') return {v:'CĐ'}; return {loi:'Môn nhận xét chỉ nhận <b>Đ</b> hoặc <b>CĐ</b>'}}
 const v=Number(s);
 if(isNaN(v)||v<0||v>10) return {loi:'Điểm phải trong khoảng <b>0 – 10</b>'};
 if(Math.round(v*10)!==v*10) return {loi:'Tối đa <b>một chữ số thập phân</b> — 8,75 không hợp lệ'};
 return {v};
}
/* Ghi thật một điểm vào lượt — sau khi vùng đã cho phép. Lượt cá nhân: đặt vào ô trống sớm nhất của em */
function apDiem(p,l,x,g,vung,ly,nhan){
 const cu=l.diem[x]!==undefined?l.diem[x]:l.vang[x]?'V':null;
 if(g.rong){delete l.diem[x];if(l.kieu==='cn')goCaNhan(l,x)}
 else if(g.vang){delete l.diem[x];l.vang[x]='Vắng có phép, chưa kiểm tra bù'}
 else{l.diem[x]=g.v;delete l.vang[x];if(l.kieu==='cn'&&!l.ds.includes(x))l.ds.push(x)}
 let dat='';
 if(l.kieu==='cn'&&!g.rong&&!g.vang){const j=datCaNhan(l,x);dat=j>=0?' → vào <b>Ô '+(j+1)+'</b> (ô trống sớm nhất của em)':' → <b>lượt tham khảo</b> (em đã đủ '+soO(p.lop,p.mon,l.hk)+' ô)'}
 const moi=g.rong?'(trống)':g.vang?'V':g.v, viec=nhan||(vung==='B'&&cu!=null?'✎ Sửa điểm (vùng B)':vung==='sauChot'?'Nhập sau mốc chốt':vung==='TK'?'Nhập điểm · tham khảo':'Nhập điểm');
 l.log.push([LUC(),R().n+' — '+R().cd,viec,HS[x].n+': '+(cu==null?'(trống)':f1(cu))+' → '+f1(moi)+(ly?' · lý do: '+ly:'')]);
 ghi(p,viec+' · '+l.ten,HS[x].n+': '+(cu==null?'(trống)':f1(cu))+' → '+f1(moi)+(ly?' · lý do: '+ly:''));
 return dat;
}

/* v3.2 · Việc 1 ca ④ — DÒNG LUẬT ở đầu mọi hộp sửa: nói thẳng luật đang áp TRƯỚC khi người dùng bấm.
   Góp ý 2 (đã rút) cho thấy người dùng mặc định nghĩ «sửa điểm = xin duyệt» — màn hình phải nói ngược lại ở vùng A · B. Không thêm luật 24 giờ. */
function dongLuat(p,l,h,v){
 v=v||vungCua(p,l,h); const m=l?dstrY(mocChot(l.hk,p.lop)):'';
 const L={A:['a','✎','Chưa công bố — sửa trực tiếp, không cần duyệt.'],
  B:['b','✎','Trước mốc chốt ('+m+') — tự sửa, ghi lý do, phụ huynh nhận thông báo; không cần duyệt.'],
  C:['c','🔒','Đã qua mốc chốt ('+m+') — cần TTCM hoặc PHT_CM duyệt.'],
  'C+':['cp','🔏','Học bạ đã ký — không sửa ở đây; đi bản đính chính ở M1.3 (GVCN đề xuất → PHT_CM duyệt → HT ký).'],
  TK:['a','✎','Lượt tham khảo — không vào công thức, không lên App: sửa trực tiếp, vẫn ghi vết; không cần duyệt.'],
  sauChot:['b','✎','Ô còn trống sau mốc chốt ('+m+') — nhập thẳng, gắn nhãn «nhập sau mốc chốt»; không cần duyệt.'],
  trong:['a','✎','Ô chưa có điểm — nhập thẳng, không cần duyệt.']}[v]||['a','✎',''];
 return '<div class="luat luat-'+L[0]+'"><span>'+L[1]+'</span><b>Luật đang áp:</b> '+L[2]+'</div>';
}

function moNhap(p,h,l){

/* ---- ⇄ ĐỔI LƯỢT CHO Ô của RIÊNG em x (P16 — Việc 3 mục 5) — đổi ô là đổi điểm TB ⇒ đi đúng bốn vùng ---- */
function doiO(p,k,x,kk,idMoi){

 const vet='Ô '+(kk+1)+' của '+HS[x].n+': '+(lCu?'lượt '+nhanL(lCu)+' ('+f1(vCu===undefined?'—':vCu)+')':'trống')+' → lượt '+nhanL(lMoi)+' ('+f1(lMoi.diem[x])+')';
 if(vg==='C+') return moCPlus(p,x,lCu||lMoi);
 if(vg==='C') return formDoiO(p,k,x,kk,lCu,lMoi);
 const ap=ly=>{const j=a.indexOf(idMoi); if(j>=0)a[j]=a[kk]; a[kk]=idMoi;
  ghi(p,'⇄ Đổi lượt cho ô'+(vg==='B'?' (vùng B)':vg==='sauChot'?' (ô trống sau mốc chốt)':''),vet+(ly?' · lý do: '+ly:''));
  lMoi.log.push([LUC(),R().n+' — '+R().cd,'⇄ Đưa vào ô chính thức',vet]); render();
  toast('⇄ '+esc(vet)+(vg==='B'?' · <b>đã báo phụ huynh và học sinh</b>':''))};
 if(vg!=='B') return ap('');
 modal('⇄ Đổi lượt cho ô — '+HS[x].n,
  '<div class="info">'+esc(vet)+'</div><div class="warn">Điểm cũ <b>'+f1(vCu)+'</b> đã hiện trên App — <b>vùng B</b>: bắt buộc lý do, không cần duyệt. Đổi ô đổi điểm TB của em.'
  +'<div class="pnote">📣 Phụ huynh sẽ nhận thông báo điểm của ô đã đổi (điểm cũ → điểm mới) — thông báo bắt buộc.</div></div>'
  +'<div class="fld"><label>Lý do <span class="req">*</span></label><input class="fldi" id="dly" placeholder="Ví dụ: bài thuyết trình phản ánh đúng năng lực hơn lượt hỏi nhanh"></div>',

  +'<table class="tb"><tr><td style="width:120px">Học sinh</td><td><b>'+esc(HS[x].n)+'</b> · '+esc(p.lop)+' · '+esc(p.mon)+' · Ô '+(kk+1)+'</td></tr></table>'

  +'<div class="fld"><label>Lý do <span class="req">*</span></label><textarea class="fldi" id="dly" rows="2" placeholder="Ví dụ: chọn nhầm lượt khi chốt — bài thuyết trình mới là bài đánh giá chính"></textarea></div>'
  +'<div class="fld"><label>Tệp minh chứng <span class="req">*</span></label><div id="mcBox"></div></div>'

  [['Huỷ',0],['✉ Gửi yêu cầu',()=>{

    const d={id:maDN(),d:HOMNAY,hs:x,lop:p.lop,mon:p.mon,hk:k,gv:R().gv,nguoiGui:R().n+' — '+R().cd,loai:'doiO',luot:lCu?lCu.id:null,luotMoi:lMoi.id,ci:kk,

/* ═══════════ M2.5 — ĐỀ NGHỊ SỬA ĐIỂM: chip lọc trên chính tab Bảng điểm môn (P20 — §4.1, không sinh tab mới) ═══════════
   P16 chỉ đổi CHỖ ĐẶT: khi một chip đề nghị đang bật, sidebar chuyển sang chế độ HÀNG ĐỢI của khuôn — dòng đầu «Tất cả»,
   mỗi dòng mang số đề nghị, chọn một lớp / cặp là LỌC danh sách. Nội dung, nút, chặn, «ai duyệt trước» giữ nguyên của P20. */

/* Phạm vi đề nghị theo vai — phạm vi là RÀNG BUỘC DỮ LIỆU, không phải ẩn nút (P20) */
function dnPhamVi(d){
 const r=R();
 if(r.moiCap||r.sc==='school') return true;
 if(r.sc==='group') return (TO[r.to]||[]).includes(d.mon)||d.gv===r.gv;
 if(r.lopCN&&!r.gv) return d.lop===r.lopCN;
 return d.gv===r.gv;
}
const dnHien=()=>DENGHI.filter(d=>hienD(d)&&dnPhamVi(d));
const dnChoToi=()=>co('duyetC')?dnHien().filter(d=>d.buoc==='cho'):[];
const dnCuaToi=()=>co('dexuat')?DENGHI.filter(d=>hienD(d)&&d.gv===R().gv):[];

function chipsDN(){
 const cho=dnChoToi(), toi=dnCuaToi(), all=(co('duyetC')||co('xemall'))?dnHien():[];
 const kq=toi.filter(d=>d.buoc!=='cho').length;
 if(!cho.length&&!toi.length&&!all.length) return '';
 return '<div class="chips dnchips"><button class="chip '+(!ST.loc?'on':'')+'" data-loc="">📋 Bảng điểm</button>'
  +(cho.length?'<button class="chip hot '+(ST.loc==='cho'?'on':'')+'" data-loc="cho">🖊 Chờ tôi duyệt <span class="cnt">'+cho.length+'</span></button>':'')
  +(toi.length?'<button class="chip '+(ST.loc==='toi'?'on':'')+'" data-loc="toi">✉ Đề nghị sửa điểm của tôi <span class="cnt">'+toi.length+'</span>'+(kq?' <span class="st2 n">'+kq+' có kết quả</span>':'')+'</button>':'')
  +(all.length?'<button class="chip '+(ST.loc==='all'?'on':'')+'" data-loc="all">Tất cả đề nghị '+(co('duyetC')&&R().sc==='group'?'của tổ':'trong phạm vi')+' <span class="cnt">'+all.length+'</span></button>':'')+'</div>';
}
function dsDN(c){
 const L=ST.loc==='cho'?dnChoToi():ST.loc==='toi'?dnCuaToi():dnHien();
 return L.filter(d=>!c||c.tatCa||(d.lop===c.lop&&(c.mon==null||d.mon===c.mon)))
  .sort((a,b)=>(a.buoc==='cho'?0:1)-(b.buoc==='cho'?0:1)||b.d-a.d);
}
function viewDN(c){
 const L=dsDN(c);

 if(e.target.id==='btnNote'){const on=document.body.classList.toggle('nn');e.target.classList.toggle('on',!on);e.target.textContent='💡 Ghi chú thiết kế: '+(on?'TẮT':'BẬT');return}
 if(q('[data-wyc]')){chonYC(p);return}
 if((x=q('[data-dnhs]'))){moDN(x.dataset.dnhs);return}
 if((x=q('[data-dn]'))){ST.cur=ST.cur===x.dataset.dn?null:x.dataset.dn;render();return}
 if((x=q('[data-loc]'))){ST.loc=x.dataset.loc||null;ST.cur=null;ST.oGo=null;render();return}
 /* nối hai chiều (Việc 2): bấm nhãn lượt trên ô → cuộn tới khối lượt và mở lượt đó (tô các ô của lượt) */
 if((x=q('[data-lb]'))){ST.cur=x.dataset.lb;ST.khuDong=false;luuKhu();ST.oGo=null;ST.cuon='#khoiLuot';render();return}
 if((x=q('[data-o]'))){const [h,k]=x.dataset.o.split('|');moO(p,h,+k);return}
 const a=q('[data-a]'); if(!a) return;
 const v=a.dataset.v;
 switch(a.dataset.a){
  case 'tab': ST.tab='bang';ST.cur=null;break;
  case 'hk': ST.hk=+v;ST.cur=null;ST.oGo=null;ST.locTK=false;break;
  case 'khu': ST.khuDong=!ST.khuDong;luuKhu();break;
  case 'denkhu': ST.khuDong=false;luuKhu();ST.cuon='#khoiLuot';break;
  case 'loctk': ST.locTK=!ST.locTK;ST.oGo=null;break;
  case 'em': moEm(p,ST.hk,v);return;
  case 'dkx': moDK(p,ST.hk,v);return;
  case 'dkc': {const [h,lo]=v.split('|');moDK(p,ST.hk,lo,h);return}
  case 'lichsu': moLichSu(p);return;
  case 'taoKy': taoKy(v,p);return;
  case 'taoluot': taoLuot(p);return;
  case 'taobu': taoLuot(p,{taiO:{h:null,k:null},bu:true});return;         /* V32-1 — buổi bù nhiều em, chọn em trong popup */
  case 'luot': ST.cur=ST.cur===v?null:v;ST.oGo=null;break;
  case 'lnk': toast('🔗 Deep-link sang <b>'+esc(v)+'</b> — mở sẵn đúng ngữ cảnh, quay lại được M2.5 (D3). M2.5 không ghi vào menu đó.');return;
  default: return;
 }
 render();
});

document.addEventListener('change',e=>{
 const t=e.target, p=pCur();
 if(t.dataset.dk){const [lo,h]=t.dataset.dk.split('|'), hs=hsLop(p.lop), nx=hs[hs.indexOf(h)+1];
  if(nx)ST.focus='[data-dk="'+lo+'|'+nx+'"]'; nhapDK(p,ST.hk,lo,h,t.value);return}
 if(t.dataset.lv){const [id,h]=t.dataset.lv.split('|'), l=luotById(id), e2=emCuaLuot(l), nx=e2[e2.indexOf(h)+1];
  if(nx)ST.focus='[data-lv="'+id+'|'+nx+'"]'; suaTu(p,l,h,t.value);return}
 if(t.dataset.them){const l=luotById(t.dataset.them); if(t.value&&!l.ds.includes(t.value)){l.ds.push(t.value);ST.focus='[data-lv="'+l.id+'|'+t.value+'"]'} render();return}
 if(t.dataset.gan){if(t.value!=='')doiGanCaLop(luotById(t.dataset.gan),+t.value);return}
 if(t.dataset.dua){if(t.value==='')return;const [id,x]=t.dataset.dua.split('|');closeM();doiO(p,ST.hk,x,+t.value,id);return}
 if(t.id==='hdt'){ST.dt=t.value;ST.cur=null;render();return}
 if(t.id==='simChot'){const s=SIM[t.value]; HOMNAY=s.d; ST.cur=null; ST.loc=null; ST.oGo=null; nhanh=null; render();
  toast('🧪 Mô phỏng thời điểm: <b>'+esc(s.t)+'</b> — mốc chốt đọc từ M10.1 theo (Kỳ × Điểm trường); trạng thái kỳ thi M2.8 tự đổi theo');return}
 if(t.id==='simLink'){if(!t.value)return;const qs=t.value;t.value='';moDeepLink(qs,true);return}
});

/* ===== Ô GÕ TẠI CHỖ (Việc 1 ca ② ③) — Enter lưu · Esc bỏ · chặn giá trị sai NGAY KHI GÕ (§5.3) ===== */
document.addEventListener('keydown',e=>{
 if(e.target.id!=='ogo') return;
 if(e.key==='Enter'){e.preventDefault();luuTaiO(e.target.value)}
 else if(e.key==='Escape'){e.preventDefault();ST.oGo=null;render();toast('Đã bỏ — ô giữ nguyên')}
});
document.addEventListener('input',e=>{
 if(e.target.id!=='ogo') return;
 const og=ST.oGo, l=og&&luotById(og.id), g=docGT(e.target.value,pCur(),l&&l.kieu==='lop');
 e.target.classList.toggle('sai',!!g.loi); e.target.title=g.loi?g.loi.replace(/<[^>]+>/g,''):'Enter = lưu · Esc = bỏ';
});
function luuKhu(){try{sessionStorage.setItem('m25.khuDong',ST.khuDong?'1':'0')}catch(e){}}

/* ===== DEEP-LINK VÀO M2.5 — ?ctx=lop|mon&tab=bang|luot&hk=…&return=… (M2.1 bấm tiết · M2.9/T5 · M2.3)
   v3.2: chỉ còn MỘT tab. Đường cũ `tab=luot` VẪN NHẬN — mở bảng điểm, cuộn tới khối lượt; `tiet=` / `luot=` chọn sẵn lượt (từ M2.1);
   `action=tao&loai=…&kieu=ca_lop|ca_nhan&tiet=…&ref=…` mở form tạo lượt điền sẵn (từ M2.3 — Việc 4). Dạng mới: `tab=bang&khu=luot`. ===== */
function moDeepLink(qs,demo){
 const g=k=>{const m=('&'+qs).match(new RegExp('[&?#]'+k+'=([^&#]*)'));return m?decodeURIComponent(m[1].replace(/\+/g,' ')):null};
 const ctx=g('ctx'); if(ctx) sblMoLink(ctx,g('return')||'');
 const hk=g('hk'); if(hk==='1'||hk==='2') ST.hk=+hk;
 ST.tab='bang'; ST.loc=null; ST.cur=null; ST.oGo=null; ST.locTK=false;
 const khu=g('tab')==='luot'||g('khu')==='luot';
 const act=g('action');
 if(khu){ST.khuDong=false;ST.cuon='#khoiLuot';
  const lp=ctx?ctx.split('|'):[], tiet=g('tiet'), id=g('luot');
  const l=id?luotById(id):tiet?LUOT.find(z=>z.tiet===tiet&&z.lop===lp[0]&&z.mon===lp[1]):null;
  if(l&&act!=='tao'){ST.cur=l.id;ST.hk=l.hk}}
 render();
 if(act==='tao'&&ctx){
  const [lop,mon]=ctx.split('|'), p={lop,mon}, ref=g('ref'), kieu=g('kieu')==='ca_nhan'?'cn':g('kieu')==='ca_lop'?'lop':null;
  const tiet=g('tiet'), t=tiet&&tietById(tiet); if(t){const kk=t.d<=HK[1].den+1?1:2; if(ST.hk!==kk){ST.hk=kk;render()}}
  if(!SBL.link||SBL.link.ngoai) return;                                   /* ngoài phạm vi: dải vàng của khuôn đã nói */
  if(!thayNhap(p)){toast('↩ Liên kết mở form tạo lượt — nhưng vai của bạn <b>không tạo lượt</b> ở cặp này (§13); chỉ xem');return}
  if(daChot(ST.hk,lop)){toast('↩ Liên kết mở form tạo lượt — nhưng <b>đã qua mốc chốt</b> '+HK[ST.hk].ten+' ('+dstrY(mocChot(ST.hk,lop))+'): không tạo lượt mới (§6.0b)');return}
  const ds=kieu==='cn'&&ref?btvnNop(ref):null;
  taoLuot(p,{kieu,loai:LOAI_MA[g('loai')]||'',tiet,ref,ds,tu:g('return')});
 }
 if(demo) toast('🔗 Đã mở deep-link: <code>/M2.5?'+esc(qs)+'</code>');
}
/* ô «Thử deep-link» trên thanh đen — preview mở tệp dạng data: nên mất query string. Mã tiết sinh từ dữ liệu ⇒ dựng giá trị lúc chạy */
function initSimLink(){
 const s=$('#simLink'); if(!s) return;
 const tBT=tietGan('9A1','Vật lí',BTVN.BT11.giao), lHD=LUOT.filter(l=>l.lop==='9A1'&&l.mon==='Vật lí'&&l.hk===1).pop();   /* lượt HĐ cuối HK I (Vinh chờ điểm) */
 const O=[['ctx=8A1|Công nghệ&return=M2.1','từ M2.1 — bấm tiết Công nghệ 8A1'],
  ['ctx=9A1|Toán&tab=bang&return=M2.9/T5','từ M2.9/T5 — 9A1 · Toán'],
  ['ctx=8B1|Lịch sử&return=M2.1','ngoài phạm vi GVBM — 8B1 · Lịch sử'],
  ['ctx=9A1|Vật lí&tab=luot&tiet='+(lHD?lHD.tiet:'')+'&return=M2.1','từ M2.1 — tiết có lượt (đường cũ tab=luot)'],
  ['ctx=9A1|Vật lí&tab=luot&action=tao&loai=bai_tap&kieu=ca_nhan&tiet='+(tBT?tBT.id:'')+'&ref=BT11&return=M2.3','từ M2.3 — tạo lượt Bài tập cá nhân (BT11, 8/10 em nộp)'],
  ['ctx=9A1|Vật lí&tab=bang&khu=luot&return=M2.1','dạng mới — tab=bang&khu=luot']];
 s.innerHTML='<option value="">—</option>'+O.map(([v,t])=>'<option value="'+esc(v)+'">'+esc(t)+'</option>').join('');
}

/* ===== KHỞI ĐỘNG ===== */
(function(){
 initSimLink();
 const s=String(location.search||'').replace(/^\?/,'')+'&'+String(location.hash||'').replace(/^#/,'');
 if(/(^|&)ctx=/.test(s)) moDeepLink(s,false);
 else render();
})();
</script>
