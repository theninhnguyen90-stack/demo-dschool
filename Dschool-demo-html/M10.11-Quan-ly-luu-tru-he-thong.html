<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10.11 Quản lý lưu trữ hệ thống — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.cell{width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;text-align:right;font:inherit;font-size:12.5px}
.cell:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:6px;border-radius:1px;display:block}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- phan duoi chep tu khung chung (M6.17) --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.mini{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:12px}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}

/* --- rieng M10.11 Quan ly luu tru he thong --- */
.mu{color:var(--ink3)}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px}
.qwrap{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.qc{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:#f1f5f9;color:#cbd5e1;border:1px solid var(--line)}
.qc.on{background:var(--green-soft);color:var(--green);border-color:#a7f3d0}
.qc.vh{border-style:dashed}

/* o luu tru */
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:11px}
.ocard.w{border-color:#fecaca;box-shadow:inset 3px 0 0 var(--red)}
.ohd{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.olbl{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.obig{font-size:26px;font-weight:800;line-height:1.15}
.obig span{font-size:13px;font-weight:600;color:var(--ink2)}
.ocard.w .obig{color:var(--red)}
.ostat{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.ostat div{display:flex;flex-direction:column;min-width:96px}
.ostat b{font-size:15px;font-variant-numeric:tabular-nums}
.ostat span{font-size:11px;color:var(--ink3)}
.stk{position:relative;display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.stk i{display:block;height:100%}
.stk em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red)}
.omut{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.6}

/* che do */
.chd{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap}
.chd.o{background:var(--green-soft);color:var(--green)}
.chd.b{background:#e0e7ff;color:#3730a3}
.chd.w{background:var(--amber-soft);color:#b45309}
.chd.r{background:var(--red-soft);color:var(--red)}

/* bang theo lop */
.lt2{width:100%;border-collapse:collapse;font-size:12.5px}
.lt2 th{position:sticky;top:0}
.lt2 tr.grow td{background:#f8fafc;border-top:1px solid var(--line2)}
.lt2 tr.rw{cursor:pointer}
.lt2 tr.rw:hover{background:var(--brand-soft)}
.dotc{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:2px;min-width:60px}
.mbar i{display:block;height:100%}

/* tra cuu */
.fbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 0 3px}
.fbar .inp{min-width:280px;flex:1}
.sumline2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);padding:9px 0}
.sumline2 .sp{flex:1}
.ft{width:100%;border-collapse:collapse;font-size:12.5px}
.ft td{padding:7px 9px}
.ft tr.rw{cursor:pointer}
.ft tr.rw:hover{background:var(--brand-soft)}
.ft tr.rw.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.ft .ico{display:inline-block;width:22px}
.ft td.num,.lt2 td.num{white-space:nowrap}
.stage.open .ft .hcol,.stage.open th.hcol{display:none}
.che{color:#7c2d12;font-style:italic;font-weight:600}
.gpl{display:inline-block;background:#f1f5f9;border:1px dashed var(--ink3);border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--ink2)}
.gpl a{color:var(--brand);font-weight:700;cursor:pointer}

/* luot */
.lhd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.lhd h2{font-size:17px}
.kgrid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.kbox{flex:1;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.kbox b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kbox span{font-size:12px;color:var(--ink2)}
.kbox.g{border-left:3px solid var(--green)}
.kbox.r{border-left:3px solid var(--red)}
.kbox.w{border-left:3px solid var(--amber)}
.kbox.b{border-left:3px solid var(--brand)}
.stp.off{opacity:.5;text-decoration:line-through}
.kiem{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px}
.chgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:1000px){.chgrid{grid-template-columns:1fr}}
.chip:disabled{opacity:.55;cursor:not-allowed}

function hanText(cs){
 if(cs.che==='QD') return 'sàn '+(cs.n>=0?cs.n:2)+' năm sau năm của văn bản · cần QĐ hủy';
 if(cs.che!=='SH') return cs.che==='KH'?'vĩnh viễn — không xóa theo hạn':'không có sàn';
 if(!cs.dv) return '⚠ chưa đặt';
 return (cs.n?cs.n+' '+DV[cs.dv]+' sau ':'ngay khi ')+MOC[cs.moc];
}

 for(const f of F){
  if(f.tt==='giai'||f.tt==='cho'||moTrongLuot(f)) continue;
  const L=lop(f.lop); if(!tuDongBat(L)) continue;
  const c=cheDo(f); if(!c.ok||c.qd) continue;          /* tạm giữ · chưa tới hạn · cần QĐ đều rơi ra ở đây */
  ds.push(f); if(ds.length>=CFG.tranTuDong) break;
 }
 return ds;
}

/* LT-10 — máy CHỈ ĐỀ XUẤT lượt tới hạn, người bấm. Gom tệp đủ điều kiện, chưa nằm trong lượt nào, theo lớp × loại × năm học.
   loaiDX dùng chung với chỗ lập lượt từ đề xuất (app.90) — một công thức, hai nơi đọc. */
function loaiDX(f,c){const L=lop(f.lop);
 return f.tt==='mocoi'?'mocoi':c.huy?'bghuy':(f.tt==='cu'||f.tt==='rac')&&L.phu?f.tt:'chinh'}
function khoaDX(f,c){const L=lop(f.lop),loai=loaiDX(f,c);
 return loai==='mocoi'?'mocoi':f.lop+'|'+loai+(loai==='chinh'&&L.cs.moc==='nh'?'|'+f.nam:'')}
function deXuat(){
 const g={};
 for(const f of F){
  if(f.tt==='giai'||f.tt==='cho'||moTrongLuot(f)) continue;
  const c=cheDo(f); if(!c.ok) continue;
  const L=lop(f.lop);
  const loai=loaiDX(f,c), k=khoaDX(f,c);
  const x=g[k]||(g[k]={k,lop:loai==='mocoi'?null:f.lop,loai,nam:loai==='chinh'&&L.cs.moc==='nh'?f.nam:'',n:0,mb:0,m:c.m,qd:false});
  x.n++;x.mb+=f.mb;if(c.qd)x.qd=true;
  const tc=LUOT.find(l=>l.tt==='tu_choi'&&l.ids.includes(f.id));if(tc)x.tuChoi=tc.id;
 }
 return Object.values(g).sort((a,b)=>b.mb-a.mb);
}
function nhanDX(x){
 if(x.loai==='mocoi') return '🧩 Tệp mồ côi — mọi lớp';
 const L=lop(x.lop);
 return L.ma+' · '+L.ten+(x.loai==='cu'?' — phiên bản cũ':x.loai==='rac'?' — thùng rác quá '+CFG.racNgay+' ngày'
  :x.loai==='bghuy'?' — <b>bản ghi chủ đã HỦY</b> ở '+L.menu:'')+(x.nam?' · năm học '+x.nam:'');
}

function phanLoai(lt){

 const duoc=[],chan=[],hoan=[],huy=[],bo=[];
 if(lt.tt==='nhap'){
  for(const id of lt.ids){const f=fById(id);const c=cheDo(f);
   if(f.tt==='giai') chan.push({f,ly:'Đã giải phóng ở lượt '+f.luotGiai});

   else if(f.tt==='cho') chan.push({f,ly:'Đang chờ hủy ở lượt '+f.luot,k:'luot'});
   else if(!c.ok) chan.push({f,ly:c.ly,ngay:c.ngay,k:c.m==='KH'?(c.tt?'ghim':'khoa'):c.chua?'chua':c.ngay?'han':'khac'});
   else duoc.push({f,c});}
 } else {
  lt.loai.forEach(x=>chan.push({f:fById(x.id),ly:x.ly,ngay:x.ngay,k:x.k}));
  for(const id of lt.ids){const f=fById(id);

   else if(lt.kq&&lt.kq.bo.find(b=>b.id===id)) bo.push({f,ly:lt.kq.bo.find(b=>b.id===id).ly});
   else if(lt.tt==='da_huy') huy.push({f});
   else duoc.push({f,c:cheDo(f)});}
 }

}

/* ========== THAO TÁC ========== */
function khoaTep(lt,ids){ids.forEach(id=>{fById(id).luot=lt.id})}
function nhaTep(lt){lt.ids.forEach(id=>{const f=fById(id);if(f.luot===lt.id&&f.tt!=='cho')f.luot=null})}
function vaoChoHuy(lt){
 lt.choDen=cong(HOMNAY,CFG.choHuy,'ngay');
 /* LT-22 — lượt ③ phải hủy xong trong 15 ngày kể từ quyết định: chờ hủy không được vượt mốc đó */
 const h15=hanHuy15(lt); if(h15&&lt.choDen>h15) lt.choDen=h15;
 lt.ids.forEach(id=>{if(lt.hoan.includes(id))return;const f=fById(id);f.tt0=f.tt;f.tt='cho';f.luot=lt.id});
 lt.tt='cho_huy';
}
function kiemGui(lt,p){
 const thieu=[];
 if(!lt.lyDo.trim()) thieu.push('lý do giải phóng');
 if(!p.duoc.length) thieu.push('ít nhất một tệp được giải phóng (mọi tệp đang bị chặn)');
 /* LT-22 — lượt ③ phải có 4 thành phần đầu của hồ sơ hủy trước khi trình Hiệu trưởng ký quyết định */
 if(p.qd){const hs=lt.hs;
  if(!hs.tm.trim()) thieu.push('bản thuyết minh (hồ sơ hủy #2)');
  if(!hs.hd.so.trim()||!hs.hd.ngay) thieu.push('quyết định thành lập Hội đồng xét hủy — số và ngày (#3)');
  if(!hs.hd.tep) thieu.push('bản scan quyết định thành lập Hội đồng (#3)');
  if(!hs.bb.so.trim()||!hs.bb.ngay) thieu.push('biên bản họp Hội đồng xét hủy — số và ngày (#4)');
  if(!hs.bb.tep) thieu.push('bản scan biên bản họp Hội đồng (#4)');
 }
 return thieu;
}
function chotDanhSach(lt,p){
 lt.loai=p.chan.map(x=>({id:x.f.id,ly:x.ly,ngay:x.ngay,k:x.k}));
 lt.ids=p.duoc.map(x=>x.f.id);
}
function guiDuyet(lt){
 const p=phanLoai(lt), thieu=kiemGui(lt,p);
 if(thieu.length){toast('⛔ Chưa gửi được — còn thiếu: <b>'+thieu.join(' · ')+'</b>.');return}
 chotDanhSach(lt,p);khoaTep(lt,lt.ids);lt.tt='cho_duyet';lt.gui=BAYGIO();VER++;
 ghiVet({nd:'Gửi Hiệu trưởng duyệt lượt '+lt.id+' — '+nf(lt.ids.length)+' tệp · '+mb(p.mb)+(lt.loai.length?' · '+lt.loai.length+' tệp bị chặn không vào lượt':'')});
 render();toast('📨 Đã gửi <b>'+lt.id+'</b> tới Hiệu trưởng (việc hiện ở M0.2 · chip Chờ tôi duyệt). '+nf(lt.loai.length)+' tệp bị chặn ghi lại cùng lượt.');
}
function chayThang(lt){
 const p=phanLoai(lt), thieu=kiemGui(lt,p);
 if(!p.chiTD) thieu.push('lượt chỉ gồm tệp ① (đang có tệp ② ③ — phải gửi Hiệu trưởng)');
 if(thieu.length){toast('⛔ Không chạy thẳng được — '+thieu.join(' · ')+'.');return}
 chotDanhSach(lt,p);lt.chayThang=true;vaoChoHuy(lt);VER++;
 ghiVet({nd:'Chạy thẳng lượt ① '+lt.id+' — '+nf(lt.ids.length)+' tệp · '+mb(p.mb)+' · chờ hủy đến '+lt.choDen});
 render();toast('▶ <b>'+lt.id+'</b> vào <b>chờ hủy đến '+k2s(lt.choDen)+'</b> — hoàn tác từng tệp được tới lúc đó. Dung lượng trả lại khi lượt hủy đêm chạy.');
}
function duyet(lt){
 if(!coQ('gp','D')){toast('⛔ <b>4-eye:</b> người lập lượt không tự duyệt — và chức danh <b>Quản trị hệ thống</b> không có quyền Duyệt ở menu này. Hiệu trưởng duyệt (chip <b>Chờ tôi duyệt</b>, việc ở M0.2).');return}
 if(lt.lap.boi===ME().id){toast('⛔ <b>4-eye:</b> bạn là người lập lượt '+lt.id+' — người lập không tự duyệt, kể cả vai Đủ quyền. Đổi sang vai <b>Hiệu trưởng</b> để duyệt.');return}
 /* LT-22 — lượt ③: duyệt chính là ký quyết định hủy */
 if(canHoSo(lt)){
  if(!lt.hs.qd.so.trim()||!lt.hs.qd.ngay){toast('⛔ Lượt ③ — phải ghi <b>số và ngày quyết định hủy</b> (TT 06/2025/TT-BNV Đ.15 k.1) trước khi duyệt.');return}
  if(cong(lt.hs.qd.ngay,15,'ngay')<HOMNAY){toast('⛔ Quyết định '+esc(lt.hs.qd.so)+' ký ngày '+k2s(lt.hs.qd.ngay)+' — <b>đã quá 15 ngày</b> (Đ.15 k.3). Phải ra quyết định mới rồi duyệt lại.');return}
 }
 lt.duyet={boi:ME().id,ngay:BAYGIO(),yk:(lt._yk||'').trim()||'Đồng ý'};vaoChoHuy(lt);VER++;
 ghiVet({nd:'Duyệt lượt '+lt.id+' — '+nf(lt.ids.length)+' tệp vào chờ hủy đến '+lt.choDen});
 render();toast('✓ Đã duyệt <b>'+lt.id+'</b> — chờ hủy đến <b>'+k2s(lt.choDen)+'</b>. Trong '+CFG.choHuy+' ngày, hoàn tác từng tệp được.');
}
function tuChoi(lt){
 if(!coQ('gp','D')){toast('⛔ Chỉ Hiệu trưởng từ chối.');return}
 if(!(lt._yk||'').trim()){toast('⛔ Từ chối phải ghi ý kiến — người lập cần biết làm lại thế nào.');return}
 lt.duyet={boi:ME().id,ngay:BAYGIO(),yk:lt._yk.trim()};lt.tt='tu_choi';nhaTep(lt);VER++;
 ghiVet({nd:'Từ chối lượt '+lt.id+' — '+lt._yk.trim()});render();toast('✕ Đã từ chối <b>'+lt.id+'</b> — tệp trả về như cũ; lượt còn tìm lại được ở chip «Bị từ chối».');
}
function rut(lt){
 if(lt.lap.boi!==ME().id){toast('⛔ Chỉ người lập rút lượt của mình.');return}
 lt.tt='rut';nhaTep(lt);VER++;ghiVet({nd:'Rút lượt '+lt.id});render();toast('Đã rút <b>'+lt.id+'</b> — còn ở chip «Đã rút».');
}
function hoanTac(id){
 const f=fById(id), lt=f&&luotById(f.luot);
 if(!lt||lt.tt!=='cho_huy'){toast('⛔ Tệp không ở trạng thái chờ hủy.');return}
 f.tt=f.tt0||'dung';f.luot=null;lt.hoan.push(id);(lt.hoanLy=lt.hoanLy||{})[id]='Hoàn tác bởi '+ME().ten+' '+k2s(HOMNAY);
 if(lt.hoan.length>=lt.ids.length) lt.tt='hoan_tac';

 toast('↺ Đã hoàn tác <b>'+esc(f.id)+'</b> — nội dung giữ nguyên, tệp về «'+TT_TEP[f.tt][0]+'».');

function hoanCa(lt){
 lt.ids.forEach(id=>{if(lt.hoan.includes(id))return;const f=fById(id);if(f.tt==='cho'){f.tt=f.tt0||'dung';f.luot=null}lt.hoan.push(id)});
 lt.tt='hoan_tac';VER++;ghiVet({nd:'Hoàn tác cả lượt '+lt.id});render();toast('↺ Đã hoàn tác cả lượt <b>'+lt.id+'</b> — còn ở chip «Đã hoàn tác».');
}
/* lượt hủy đêm — hệ thống chạy cho mọi lượt đã hết hạn chờ; KIỂM LẠI từng tệp: thứ đổi trong thời gian chờ thì bỏ qua, nêu lý do */
function chayHuyDem(){
 const truoc=dungMB(); let n=0;
 LUOT.filter(l=>l.tt==='cho_huy'&&l.choDen<=HOMNAY).forEach(lt=>{
  /* LT-22b — hồ sơ hủy chưa đủ bản scan quyết định hủy thì KHÔNG hủy: hủy là hành vi pháp lý, hồ sơ phải đủ trước */
  if(canHoSo(lt)&&!lt.hs.qd.tep){
   lt.thieuScan=HOMNAY;
   ghiVet({boi:'he',ngay:HOMNAY+' 01:00',nd:'Lượt hủy đêm BỎ QUA '+lt.id+' — hồ sơ hủy thiếu bản scan quyết định hủy (TT 06/2025 Đ.15 k.4a)'});
   return;
  }
  lt.thieuScan=null;
  const huy=[],bo=[];let m=0;
  lt.ids.forEach(id=>{if(lt.hoan.includes(id))return;const f=fById(id);
   if(f.doiTrongCho){bo.push({id,ly:f.doiTrongCho});f.tt='dung';f.luot=null;return}
   if(f.tt!=='cho'){bo.push({id,ly:'Tệp không còn ở trạng thái chờ hủy'});return}
   f.tt='giai';f.luotGiai=lt.id;f.ngayGiai=HOMNAY;f.luot=null;huy.push(id);m+=f.mb});
  lt.kq={huy,bo,ngay:HOMNAY+' 01:00',mb:m};lt.tt='da_huy';n++;
  /* LT-22 — lượt ③: máy ghi biên bản bàn giao (#6), sinh biên bản hủy (#7) rồi đóng cả hồ sơ thành một tệp lớp L57 (giữ 20 năm) */
  if(canHoSo(lt)){
   lt.hs.bg.ngay=HOMNAY; lt.hs.bh={ngay:HOMNAY,ma:'BBH-'+lt.id};
   const f={id:'L57-'+lt.id,lop:'L57',ten:'Ho-so-huy-'+lt.id+'.pdf',mb:Math.round((0.6+huy.length/900)*100)/100,
    ngay:HOMNAY+' 01:05',nam:namCua(HOMNAY),boi:lt.duyet?lt.duyet.boi:lt.lap.boi,kenh:'he',
    ban:'M10.11 · '+lt.id,tt:'dung',dan:null,ghim:null};
   f.hash=bam(f.id+f.ten); F.push(f); FM.set(f.id,f); lt.hs.tepHS=f.ten;
   ghiVet({boi:'he',ngay:HOMNAY+' 01:05',nd:'Lập hồ sơ hủy '+lt.hs.bh.ma+' cho lượt '+lt.id+' — 7 thành phần, lưu 20 năm (TT 06/2025 Đ.15 k.4)'});
  }
  ghiVet({boi:'he',ngay:HOMNAY+' 01:00',nd:'Lượt hủy đêm: '+lt.id+' — hủy '+nf(huy.length)+' tệp · '+mb(m)+' · bỏ qua '+bo.length});
 });
 VER++;return {n,truoc,sau:dungMB()};
}
function tua(lt){
 if(lt.choDen>HOMNAY){HOMNAY=lt.choDen;VER++}
 const r=chayHuyDem();
 render();toast('🧪 Tua tới <b>'+k2s(HOMNAY)+'</b> · lượt hủy đêm chạy '+r.n+' lượt — ổ <b>'+gb(r.truoc)+' → '+gb(r.sau)+'</b> (trả lại '+mb(r.truoc-r.sau)+').');
}

/* ========== LT-14 — LƯỢT TỰ ĐỘNG (hệ thống lập) ==========
   Đêm: ① gom tệp tới hạn của các lớp ĐANG BẬT tự động → một lượt do «Hệ thống» lập, vào chờ hủy N ngày (hoàn tác được, có thông báo);
        ② hủy các lượt đã hết hạn chờ. Công tắc ở ⚙ là quyết định của Hiệu trưởng — lượt tự động không hỏi duyệt lại.
   Tệp tạm giữ · chưa tới hạn · lớp ③ · lớp chưa đặt thời hạn KHÔNG bao giờ vào lượt tự động (lọc ở tepTuDong + kiểm lại lúc hủy). */
function gomTuDong(){
 const ds=tepTuDong(); if(!ds.length) return null;
 const lop3=[...new Set(ds.map(f=>f.lop))];
 const lt={id:'GP-TĐ-'+HOMNAY.slice(2,4)+HOMNAY.slice(5,7)+HOMNAY.slice(8,10),ten:'Lượt tự động — '+lop3.join(' · '),
  tieuChi:'Tự động: lớp bật công tắc ('+lop3.map(m=>m+' '+lop(m).ten).join(' · ')+') · tệp đã tới hạn',
  ids:ds.map(f=>f.id),loai:[],lap:{boi:'he',ngay:HOMNAY+' 01:00'},lyDo:'Tự động xóa khi đến hạn — công tắc bật ở ⚙ Cấu hình (Hiệu trưởng)',
  hs:hsMoi(),tt:'cho_huy',tuDong:true,gui:null,duyet:null,choDen:cong(HOMNAY,CFG.choHuy,'ngay'),hoan:[],kq:null};
 ds.forEach(f=>{f.tt0=f.tt;f.tt='cho';f.luot=lt.id});
 LUOT.unshift(lt);
 ghiVet({boi:'he',ngay:HOMNAY+' 01:00',nd:'Lượt tự động '+lt.id+' — gom '+nf(ds.length)+' tệp tới hạn của '+lop3.length+' lớp bật tự động · chờ hủy đến '+lt.choDen+' · đã báo '+CFG.nhan.join(' · ')});
 return lt;
}
function chayDem(){
 const tuD=gomTuDong(), r=chayHuyDem();
 VER++;render();
 toast('🧪 <b>Lượt đêm '+k2s(HOMNAY)+'</b>: '+(tuD?'tự động gom <b>'+nf(tuD.ids.length)+'</b> tệp ('+mb(tuD.ids.reduce((s,id)=>s+fById(id).mb,0))+') vào chờ hủy đến '+k2s(tuD.choDen)+' — hoàn tác được; ':'không có tệp nào tới hạn ở lớp bật tự động; ')
  +'hủy '+r.n+' lượt hết hạn chờ — ổ <b>'+gb(r.truoc)+' → '+gb(r.sau)+'</b>.');
}

/* ════ LT-22 — khối HỒ SƠ HỦY TÀI LIỆU (7 thành phần) ════ */
function oScan(lt,k,dung){
 const v=lt.hs[k];
 if(v.tep) return '<div class="mu" style="font-size:11.5px;margin-top:4px">📎 <b>'+esc(v.tep.ten)+'</b> · '+mb(v.tep.mb)+' <span class="tg c">L57</span>'
  +(dung?' <button class="btn xs" data-goscan="'+k+'">✕ Gỡ</button>':'')+'</div>';
 return dung?'<button class="btn xs" data-taiscan="'+k+'" style="margin-top:4px">📎 Tải bản scan</button>'
  :'<div style="font-size:11.5px;color:var(--red);margin-top:4px">📎 chưa có bản scan</div>';
}
function oHS(lt,k,dung){
 const v=lt.hs[k];
 return '<div class="frow"><div><input class="fldi" data-hs="'+k+'.so" value="'+esc(v.so)+'" placeholder="Số văn bản"'+(dung?'':' disabled')+'></div>'
  +'<div><input type="date" class="fldi" data-hs="'+k+'.ngay" value="'+esc(v.ngay)+'"'+(dung?'':' disabled')+'></div></div>'+oScan(lt,k,dung);
}
function veHoSoHuy(lt,p,dung){
 const han=hanHuy15(lt), xong=lt.tt==='da_huy', hs=lt.hs;
 const tt=k=>{const v=hs[k];
  if(k==='dm') return '<span class="tg g">✓ máy có sẵn</span>';
  if(k==='tm') return hs.tm.trim()?'<span class="tg g">✓ đã có</span>':'<span class="tg r">thiếu</span>';
  if(k==='bh') return v.ma?'<span class="tg g">✓ '+esc(v.ma)+'</span>':'<span class="mu">sinh sau khi hủy</span>';
  if(k==='bg') return v.ngay?'<span class="tg g">✓ '+k2s(v.ngay)+'</span>':'<span class="mu">khi hủy</span>';
  return v.so&&v.tep?'<span class="tg g">✓ '+esc(v.so)+' · 📎</span>':v.so?'<span class="tg b">thiếu bản scan</span>':'<span class="tg r">thiếu</span>'};
 const soTep=lt.tt==='nhap'?p.duoc.length:lt.ids.length-lt.hoan.length, dl=lt.kq?lt.kq.mb:p.mb;
 let h='<div class="card"><div class="ch">📋 Hồ sơ hủy tài liệu — <b>7 thành phần</b> <span class="mu" style="font-weight:400">(TT 06/2025/TT-BNV Đ.15 k.4a · hồ sơ lưu <b>20 năm</b> kể từ ngày hủy — k.4b, thành tệp lớp <b>L57</b>)</span></div>'
  +'<div class="tbx"><table class="ft"><thead><tr><th style="width:24px">#</th><th>Thành phần</th><th>Căn cứ</th><th>Trạng thái</th><th style="min-width:230px">Ghi ở đây</th></tr></thead><tbody>';
 HS_TP.forEach(([k,ten,can,loai,mo],i)=>{
  const o=k==='tm'?(dung?'<textarea class="fldi" rows="2" data-hs="tm" placeholder="vd Tài liệu hết thời hạn bảo quản theo TT 08/2025, không còn giá trị sử dụng…">'+esc(hs.tm)+'</textarea>'
      :'<span style="font-size:12px">'+esc(hs.tm||'—')+'</span>')
   :k==='dm'?'<button class="btn xs" data-xuathsh="'+lt.id+'">⬇ Xuất danh mục</button> <span class="mu" style="font-size:11px">'+nf(soTep)+' tệp · '+mb(dl)+'</span>'
   :k==='qd'?(hs.qd.so?'<b>'+esc(hs.qd.so)+'</b> · '+k2s(hs.qd.ngay)+oScan(lt,'qd',lt.tt==='cho_huy'&&(coQ('gp','D')||coQ('gp','S')))
      :'<span class="mu">Hiệu trưởng ghi khi duyệt lượt</span>')
   :['hd','bb'].includes(k)?oHS(lt,k,dung)
   :k==='bg'?(hs.bg.ngay?k2s(hs.bg.ngay):'<span class="mu">máy ghi khi lượt hủy chạy</span>')
   :(hs.bh.ma?'<b>'+esc(hs.bh.ma)+'</b> · '+k2s(hs.bh.ngay)+'<div class="mu" style="font-size:11px">'+nf(lt.kq?lt.kq.huy.length:0)+' tệp · '+mb(lt.kq?lt.kq.mb:0)+' · có mã băm từng tệp</div>':'<span class="mu">máy sinh sau khi hủy</span>');
  h+='<tr><td>'+(i+1)+'</td><td><b>'+esc(ten)+'</b><div class="mu" style="font-size:11px">'+esc(mo)+'</div></td>'
   +'<td class="mu" style="font-size:11.5px">'+esc(can)+'</td><td>'+tt(k)+'</td><td>'+o+'</td></tr>';
 });
 h+='</tbody></table></div>';
 if(lt.tt==='cho_huy'&&!hs.qd.tep) h+='<div class="danger" style="margin:10px 12px">📎 <b>Chưa hủy được — thiếu bản scan quyết định hủy</b> (#5). Lượt hủy đêm bỏ qua lượt này cho tới khi có bản scan'
  +(lt.thieuScan?' — đêm '+k2s(lt.thieuScan)+' đã bỏ qua một lần':'')+'. Hồ sơ hủy phải đủ 7 thành phần <b>trước khi</b> hủy (TT 06/2025/TT-BNV Đ.15 k.4a).</div>';
 if(han) h+='<div class="'+(lt.tt==='cho_huy'&&han<HOMNAY?'danger':'warn')+'" style="margin:10px 12px">⏱ <b>Hủy trong 15 ngày</b> kể từ quyết định <b>'+esc(hs.qd.so)+'</b> ('+k2s(hs.qd.ngay)+') — hạn <b>'+k2s(han)+'</b>'
  +(lt.tt==='cho_huy'?' · lượt hủy đêm đặt vào <b>'+k2s(lt.choDen)+'</b>'+(lt.choDen>=han?' <span class="mu">(đã rút về đúng hạn)</span>':' ✓ trong hạn'):'')

 else if(!xong) h+='<div class="ro" style="margin:10px 12px">Sau khi hủy, bảy thành phần được đóng thành <b>một tệp hồ sơ hủy</b> (lớp L57) và giữ <b>20 năm</b> — chính M10.11 sinh ra và giữ, không nhờ menu khác.</div>';
 return h+'</div>';
}

  if(pv==='nhay'&&!L.luat) continue;
  quet++;
  if(!f.hong&&hat(f.id+'#quet'+HOMNAY)%3000===0){f.hong='Mã băm lệch so với lúc tải lên (quét '+k2s(HOMNAY)+')';moi++}
 }
 CFG.quet.lanCuoi=HOMNAY;CFGT=null;VER++;
 ghiVet({nd:'Quét toàn vẹn ('+({tat_ca:'tất cả lớp',media:'lớp media',nhay:'lớp có sàn pháp lý'}[pv])+'): '+nf(quet)+' tệp · phát hiện thêm '+moi+' tệp hỏng'});
 render();
 toast('🔍 Quét xong <b>'+nf(quet)+'</b> tệp — phát hiện thêm <b>'+moi+'</b> tệp hỏng'+(moi?', đã báo menu chủ tải lại tệp thay thế (M0.3).':'; tổng đang hỏng '+nf(tepHong().length)+' tệp.'));
}



/* ══════════════ M10.11 — RENDER · SỰ KIỆN · DEEP-LINK ══════════════ */
function render(){
 rolebar(); header(); tabs();
 $('#crumb').innerHTML=ST.ret?'<div class="crumb"><a href="'+ST.ret+'.html">← '+esc(ST.ret)+'</a> <span>mở từ '+esc(ST.ret)+'</span></div>':'';
 $('#content').innerHTML=ST.tab==='tq'?veTQ():ST.tab==='tc'?veTC():ST.tab==='gp'?veGP():veCH();
 $('#btnNote').classList.toggle('on',!document.body.classList.contains('nn'));
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(document.body.classList.contains('nn')?'TẮT':'BẬT');
 const q=$('#qT');if(q) q.onchange=()=>{ST.loc.q=q.value;ST.trang=0;ST.cur=null;render()};
}
function datLoc(o){Object.assign(ST.loc,{nhom:'',lop:'',menu:'',dd:'',tu:'',den:'',nam:'',co:'',boi:'',kenh:'',tt:'',che:'',dan:'',q:''},o);ST.trang=0;ST.cur=null;ST.chon.clear()}
function suKien(t){
 const g=a=>t.closest('['+a+']');
 let x;
 /* tổng quan */
 if((x=g('data-dx'))){const k=x.dataset.dx,d=deXuat().find(y=>y.k===k);if(!d)return;
  const ids=F.filter(f=>{if(f.tt==='giai'||f.tt==='cho'||moTrongLuot(f))return false;const c=cheDo(f);if(!c.ok)return false;
   return khoaDX(f,c)===k}).map(f=>f.id);
  taoLuot(ids,nhanDX(d),'Đề xuất của máy — '+nhanDX(d));return}
 if((x=g('data-lop'))&&ST.tab==='tq'){datLoc({lop:x.dataset.lop});ST.tab='tc';render();return}
 /* ⚠ Cần chú ý → lọc thẳng sang tab 2 */
 if((x=g('data-dico'))){const k=x.dataset.dico;datLoc(k==='kho'?{lop:'L03'}:{tt:k});ST.tab='tc';render();
  if(k==='kho') toast('📦 Lớp L03 — kho cá nhân. Kho của người đã nghỉ phải <b>xử lý xong</b> mới giải phóng được phần còn lại (LT-11).');return}
 if(g('data-dichuadat')){ST.tab='ch';LOPLOC='chua';render();return}
 /* tra cứu */
 if((x=g('data-qtt'))){ST.loc.tt=ST.loc.tt===x.dataset.qtt?'':x.dataset.qtt;ST.trang=0;ST.cur=null;render();return}
 if(g('data-xloc')){datLoc({});render();return}
 if((x=g('data-trang'))){ST.trang+=+x.dataset.trang;render();return}
 if(g('data-chonall')){locTep().forEach(f=>ST.chon.add(f.id));render();toast('☑ Đã chọn <b>'+nf(ST.chon.size)+'</b> tệp — bấm «Lập lượt giải phóng». Tệp bị chặn vẫn vào nháp để thấy lý do, rồi bị loại khi gửi.');return}
 if(g('data-bochon')){ST.chon.clear();render();return}
 if(g('data-laplt')){const L=ST.loc,ids=[...ST.chon];
  const ten=L.lop?lop(L.lop).ten+(L.nam?' · năm học '+L.nam:''):L.tt==='mocoi'?'Tệp mồ côi':'Tệp chọn ở Tra cứu tệp';
  const tc=['lop','nhom','menu','nam','tt','che','dd','co','tu','den','kenh','dan'].filter(k=>L[k]).map(k=>k+'='+L[k]).join(' · ')||'chọn tay';
  taoLuot(ids,ten,'Tiêu chí: '+tc);return}
 if((x=g('data-lap1'))){const f=fById(x.dataset.lap1);taoLuot([f.id],'Một tệp — '+f.id,'Chọn tay từ panel tệp');return}
 if((x=g('data-gogiu'))){moGoGiu(x.dataset.gogiu);return}
 if((x=g('data-mochu'))){const f=fById(x.dataset.mochu);toast('↗ Mở <b>'+esc(f.ban)+'</b> ở '+esc(lop(f.lop).menu)+' — menu chủ tự kiểm quyền của bạn và mở nội dung ở đó (demo: không điều hướng).');return}
 if((x=g('data-golt'))){ST.tab='gp';ST.gpCur=x.dataset.golt;ST.gpXem='duoc';ST.gpTrang=0;render();return}
 if((x=g('data-golop'))){ST.tab='ch';render();moSuaLop(x.dataset.golop);return}
 if(g('data-close')){ST.cur=null;render();return}
 if((x=g('data-xuat'))){moXuat(x.dataset.xuat);return}
 if((x=g('data-f'))&&!t.closest('input')){const id=x.dataset.f;ST.cur=ST.cur===id?null:id;
  const f=fById(id);if(ST.cur&&lop(f.lop).an) AUDIT.unshift({boi:ME().id,ngay:BAYGIO(),muc:3,nd:'Mở siêu dữ liệu tệp '+f.id+' (lớp '+f.lop+' — tên che)'});render();return}
 /* lượt */
 if((x=g('data-gpl'))){ST.gpLoc=x.dataset.gpl;render();return}
 if((x=g('data-lt'))){ST.gpCur=x.dataset.lt;ST.gpXem='duoc';ST.gpTrang=0;render();return}
 if(g('data-gpback')){ST.gpCur=null;render();return}
 if((x=g('data-gpx'))){ST.gpXem=x.dataset.gpx;ST.gpTrang=0;render();return}
 if((x=g('data-gptr'))){ST.gpTrang+=+x.dataset.gptr;render();return}
 if(g('data-dem')){chayDem();return}
 if(g('data-moilt')){modal('＋ Lập lượt giải phóng','<div class="info">Lượt lập từ <b>tệp đã chọn</b>, theo một trong hai lối:<br>① <b>Tổng quan dung lượng → Đề xuất lượt</b> — máy đã gom sẵn tệp đủ điều kiện theo lớp × năm học;<br>'
  +'② <b>Tra cứu tệp</b> — lọc (lớp · năm học · trạng thái · khoảng ngày nhập…) → «Chọn cả n tệp khớp lọc» hoặc tích tay → «🧹 Lập lượt giải phóng».</div>'
  +'<div class="mu">Lượt mới là <b>nháp</b>: màn hình xem trước tách tệp được / bị chặn kèm lý do trước khi gửi.</div>',
  '<button class="btn" data-mb="close">Đóng</button><button class="btn p" data-mb="sangtc">🔎 Sang Tra cứu tệp</button>');return}
 if((x=g('data-gui'))){guiDuyet(luotById(x.dataset.gui));return}
 if((x=g('data-chay'))){chayThang(luotById(x.dataset.chay));return}
 if((x=g('data-duyet'))){duyet(luotById(x.dataset.duyet));return}
 if((x=g('data-tuchoi'))){tuChoi(luotById(x.dataset.tuchoi));return}
 if((x=g('data-rut'))){rut(luotById(x.dataset.rut));return}
 if((x=g('data-xuathsh'))){xuatDanhMuc(luotById(x.dataset.xuathsh));return}
 if((x=g('data-taiscan'))){const lt=luotById(ST.gpCur);if(lt)taiScan(lt,x.dataset.taiscan);return}
 if((x=g('data-goscan'))){const lt=luotById(ST.gpCur);if(lt)goScan(lt,x.dataset.goscan);return}
 if((x=g('data-hoan'))){hoanTac(x.dataset.hoan);return}
 if((x=g('data-hoanca'))){hoanCa(luotById(x.dataset.hoanca));return}
 if((x=g('data-tua'))){tua(luotById(x.dataset.tua));return}
 /* cấu hình */
 if((x=g('data-cam'))){if(x.disabled)return;const d=x.dataset.cam;CFGT.cam=CFGT.cam.includes(d)?CFGT.cam.filter(y=>y!==d):CFGT.cam.concat(d);render();return}
 if((x=g('data-nhan'))){if(x.disabled)return;const d=x.dataset.nhan;CFGT.nhan=CFGT.nhan.includes(d)?CFGT.nhan.filter(y=>y!==d):CFGT.nhan.concat(d);render();return}
 if(g('data-luuch')){luuCH();return}
 if(g('data-boch')){CFGT=null;render();toast('Đã hoàn tác thay đổi chưa lưu.');return}
 if((x=g('data-lloc'))){LOPLOC=x.dataset.lloc;render();return}
 /* ⚙ — công tắc tự động của từng lớp (LT-14) */
 if((x=g('data-tudong'))){if(x.disabled)return;const l=lop(x.dataset.tudong);
  if(!batTuDongDuoc(l)){toast('⛔ Lớp này không bật tự động được — '+lyDoKhongTuDong(l)+'.');return}
  l.cs.tuDong=!l.cs.tuDong;VER++;
  CFG_LS.push({boi:ME().id,ngay:BAYGIO(),nd:'Tự động xóa khi đến hạn — '+l.ma+' '+l.ten+': '+(l.cs.tuDong?'BẬT':'TẮT')});
  ghiVet({nd:(l.cs.tuDong?'Bật':'Tắt')+' tự động xóa khi đến hạn cho lớp '+l.ma});render();
  toast(l.cs.tuDong?'⚡ Đã BẬT tự động cho <b>'+l.ma+'</b> — mỗi đêm hệ thống gom tệp tới hạn thành lượt, vào chờ hủy '+CFG.choHuy+' ngày (hoàn tác được), không hỏi duyệt lại.'
   :'Đã TẮT tự động cho <b>'+l.ma+'</b> — tệp tới hạn chỉ hiện ở Đề xuất lượt.');return}
 if(g('data-sltd')){SL.tuDong=!SL.tuDong;veSuaLop();return}
 if(g('data-quetbat')){if(!coNL('kythuat'))return;CFGT.quet.bat=!CFGT.quet.bat;render();return}
 if((x=g('data-quetpv'))){if(!coNL('kythuat'))return;CFGT.quet.phamVi=x.dataset.quetpv;render();return}
 if(g('data-quetngay')){if(!coNL('kythuat')){toast('⛔ Quét toàn vẹn là việc kỹ thuật — Quản trị hệ thống chạy.');return}quetToanVen();return}
 if((x=g('data-sualop'))){moSuaLop(x.dataset.sualop);return}
}
mfns.bsangtc=()=>{closeM();ST.tab='tc';render()};
function moXuat(tab){
 modal('⬇ Xuất danh sách siêu dữ liệu tệp','<div class="ro">Bản xuất chỉ có <b>siêu dữ liệu</b> (mã · lớp · menu chủ · cỡ · ngày · người tải lên · trạng thái) — <b>không kèm nội dung</b>, tên tệp lớp Own / nhạy cảm vẫn che. Lượt xuất ghi nhật ký mức ②.</div>'
  +'<label class="lbl">Mục đích *</label><select class="fldi" id="mdX"><option value="">— chọn —</option><option>Báo cáo Hiệu trưởng về dung lượng</option><option>Lập kế hoạch mở rộng ổ</option><option>Đối chiếu trước lượt giải phóng</option></select>',
  '<button class="btn" data-mb="close">Bỏ</button><button class="btn p" data-mb="xuatok">⬇ Xuất</button>');
}
mfns.bxuatok=()=>{const v=$('#mdX').value;if(!v){toast('⛔ Bắt buộc chọn mục đích xuất.');return}
 ghiVet({nd:'Xuất siêu dữ liệu '+nf(locTep().length)+' tệp — mục đích: '+v});closeM();toast('⬇ Đã xuất '+nf(locTep().length)+' dòng siêu dữ liệu — nhật ký mức ② ghi kèm mục đích «'+esc(v)+'».')};
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.lc!==undefined){ST.loc[t.dataset.lc]=t.value;if(t.dataset.lc==='nhom')ST.loc.lop='';ST.trang=0;ST.cur=null;render();return}
 if(t.dataset.sx!==undefined){ST.sx=t.value;ST.trang=0;render();return}
 if(t.dataset.ck!==undefined){t.checked?ST.chon.add(t.dataset.ck):ST.chon.delete(t.dataset.ck);render();return}
 if(t.dataset.cktrang!==undefined){locTep().slice(ST.trang*PAGE,(ST.trang+1)*PAGE).forEach(f=>t.checked?ST.chon.add(f.id):ST.chon.delete(f.id));render();return}
 if(t.dataset.sl!==undefined){SL[t.dataset.sl]=t.value;if(t.dataset.sl==='che'||t.dataset.sl==='dv'||t.dataset.sl==='moc')veSuaLop();return}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.cf!==undefined&&CFGT){CFGT[t.dataset.cf]=t.value;return}
 if(t.dataset.cfq!==undefined&&CFGT){CFGT.quet[t.dataset.cfq]=t.value;return}
 if(t.dataset.lf!==undefined){const lt=luotById(ST.gpCur);if(!lt)return;const k=t.dataset.lf;
  if(k==='yk')lt._yk=t.value;else lt[k]=t.value;return}
 /* LT-22 — ô của hồ sơ hủy 7 thành phần */
 if(t.dataset.hs!==undefined){const lt=luotById(ST.gpCur);if(!lt)return;const k=t.dataset.hs;
  if(k==='tm')lt.hs.tm=t.value;else{const[a,b2]=k.split('.');lt.hs[a][b2]=t.value}return}
 if(t.dataset.sl!==undefined&&SL){SL[t.dataset.sl]=t.value;return}
});
/* deep-link D3: ?tab=tq|tc|gp|ch · &lop=Lxx · &ctx=GP-… (&action=duyet) · &return=<menu> · &vai=…
   ctx là một lượt vai không có quyền Xem → không nói nó tồn tại */
(function moTuLienKet(){
 const map={tong_quan:'tq',tra_cuu:'tc',luot:'gp',cau_hinh:'ch',tq:'tq',tc:'tc',gp:'gp',ch:'ch'};
 if(map[QS.get('tab')]) ST.tab=map[QS.get('tab')];
 if(QS.get('return')) ST.ret=QS.get('return');
 if(QS.get('lop')&&lop(QS.get('lop'))){datLoc({lop:QS.get('lop')});ST.tab='tc'}
 const c=QS.get('ctx');
 if(c&&coMenu()&&luotById(c)){ST.tab='gp';ST.gpCur=c}
})();
render();
</script>
