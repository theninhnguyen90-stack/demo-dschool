<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M8.3 Xử lý vi phạm chat — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.lockic{font-size:11px;color:var(--ink3);margin-left:-8px}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:12px;flex-wrap:wrap;line-height:1.6}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber);background:var(--amber-soft);color:#92400e}
.scope.am b{color:#7c2d12}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:230px}
.qf{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;background:#fff;display:inline-flex;align-items:center;gap:6px}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.qf .c{background:var(--bg);color:var(--ink2);font-size:10.5px;font-weight:700;padding:0 6px;border-radius:9px}
.qf.on .c{background:rgba(255,255,255,.28);color:#fff}
.qf .c.al{background:var(--red);color:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1240px){.stage.open .listw{display:none}}

.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow .t1{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.hrow .t2{font-size:11.5px;color:var(--ink3);margin-top:2px}
.gbc{grid-template-columns:1.55fr 1.5fr 1.35fr 1.05fr .95fr}
.stage.open .gbc{grid-template-columns:1.5fr 1.4fr}
.gkc{grid-template-columns:1.6fr 1.35fr 1.25fr 1.1fr 1fr}
.stage.open .gkc{grid-template-columns:1.5fr 1.3fr}
.kx{min-width:0}
.stage.open .kx{display:none}
.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:var(--violet-soft);color:#5b21b6}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2);white-space:nowrap}
.pill.ns{background:var(--violet-soft);border-color:#ddd6fe;color:#5b21b6;font-weight:700}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px;line-height:1.65}
.lock{background:#f1f5f9;border:1px solid var(--line2);color:var(--ink2);padding:9px 12px;border-radius:9px;font-size:12px;line-height:1.65;margin-bottom:12px}
.lock b{color:var(--ink)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph .n{flex:1;min-width:0}
.ph .n h2{font-size:15px;font-weight:700;line-height:1.4}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbody{padding:13px 15px;max-height:calc(100vh - 300px);overflow-y:auto}
.pfoot{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.f{display:grid;grid-template-columns:132px 1fr;gap:11px;align-items:start;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sech{font-size:13px;font-weight:700;margin:15px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.sech:first-child{border-top:none;padding-top:0;margin-top:0}

.msgq{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px}
.msgq .h{font-size:11.5px;color:var(--ink2);font-weight:600;margin-bottom:4px;display:flex;gap:7px;flex-wrap:wrap}
.msgq .h .who{color:var(--ink)}
.msgq .tx{font-size:13px;line-height:1.65;white-space:pre-wrap}
.msgq.bad{background:var(--red-soft);border-color:#fecaca}

.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.g::before{background:var(--green)}.logi.r::before{background:var(--red)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

.gsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:11px}
.gsec h3{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gf{margin-bottom:12px}
.gf label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.gf label b{color:var(--red)}
.gf .hint{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.55}
.ti{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;background:#fff}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;min-height:70px;resize:vertical;font-family:inherit;line-height:1.6}
.ti.err,.ta.err{border-color:var(--red);background:var(--red-soft)}
.ti:disabled,.ta:disabled{background:var(--bg);color:var(--ink2);cursor:not-allowed}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:8px 13px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35}
.sgb b{display:block}
.sgb span{font-size:10.5px;color:var(--ink3)}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.sgb.on span{color:var(--brand)}
.sgb.dg.on{border-color:var(--red);background:var(--red-soft);color:#991b1b}
.sgb:disabled{opacity:.4;cursor:not-allowed;background:var(--bg)}
.sw{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:none}
.sw .tx{flex:1;min-width:0}
.sw .tx b{display:block;font-size:13px}
.sw .tx span{font-size:11.5px;color:var(--ink2);line-height:1.55;display:block;margin-top:2px}
.tg{width:42px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 42px;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--green)}
.tg.on::after{left:21px}
.tg.dis{opacity:.4;cursor:not-allowed}
.chk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:9px;padding:7px 12px;font-size:12.5px;background:#fff;text-align:left}
.chk.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.chk .bx{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:10px;color:#fff;flex:0 0 15px}
.chk.on .bx{background:var(--brand);border-color:var(--brand)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.diff{grid-template-columns:1fr}}
.diffb{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.7;max-height:200px;overflow-y:auto}
.diffb.old{background:var(--red-soft);border-color:#fecaca}
.diffb.new{background:var(--green-soft);border-color:#a7f3d0}
.diffb h5{font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;color:var(--ink2)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:800px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
</style>
</head>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
const dm=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1);
const hm=d=>p2(d.getHours())+':'+p2(d.getMinutes());
const dt2s=d=>hm(d)+' '+dm(d);
const THU=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const thu=d=>THU[d.getDay()];
const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const n3=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const ngay=(a,b)=>Math.round((a-b)/86400000);
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4400)}
function closeModal(){$('#mask').classList.remove('on')}
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f||'<button class="btn" data-x="close">Đóng</button>';$('#mask').classList.add('on');$('#mb').scrollTop=0}
function audit(m){toast('🛡 <b>Đã ghi audit</b> — '+m)}
const HOMNAY=new Date(2026,10,20,9,14);
const D=(ng,h,mi)=>new Date(2026,10,ng,h||0,mi||0);

/* ============ NGUOI ============ */
const NGUOI={
 'Trần Văn Hoàn':{l:'PH',mo:'bố em Trần Bảo Nam',lop:'6A2',dt:'A'},
 'Phạm Văn Cường':{l:'PH',mo:'bố em Phạm Gia Khánh',lop:'9A2',dt:'A'},
 'Đỗ Minh Tuấn':{l:'PH',mo:'bố em Đỗ Bảo Ngân',lop:'7A2',dt:'A'},
 'Lê Thị Hường':{l:'PH',mo:'mẹ em Lê Anh Thư',lop:'6A1',dt:'A'},
 'Nguyễn Bá Long':{l:'PH',mo:'bố em Nguyễn Minh Quân',lop:'8A2',dt:'A'},
 'Vương Thị Nhàn':{l:'PH',mo:'mẹ em Vương Khánh Chi',lop:'6B1',dt:'B'},
 'Trịnh Văn Sơn':{l:'NS',mo:'GVBM Vật lí · chủ nhiệm lớp 8B2',lop:'8B2',dt:'B',cn:['8B2'],bm:['8B1','8B2','9B1']},
 'Hoàng Thị Thu':{l:'NS',mo:'GVCN lớp 6A1 · GVBM Toán',lop:'6A1',dt:'A',cn:['6A1'],bm:['6A2','9A2','9A3']},
 'Ngô Thị Hoa':{l:'PH',mo:'mẹ em Ngô Khánh Linh',lop:'9A2',dt:'A'},

function sapHetHan(k){return k.tt==='hieuluc'&&ngay(k.den,HOMNAY)<=3}
/* Lenh khoa het han thi TU GO — khong ai phai bam */
function tuGo(){KC.forEach(function(k){if(k.tt==='hieuluc'&&k.den<HOMNAY)k.tt='hethan'})}
function khoaHienHanh(t){return KC.find(k=>k.ai===t&&k.tt==='hieuluc')}
function lichSuNguoi(t){
 return {bc:BC.filter(x=>x.bi===t),kc:KC.filter(x=>x.ai===t)};
}
/* Canh bao lam dung nut bao cao — 2 bao cao bi bo qua trong 90 ngay */
function lamDung(nguoiBoi){
 const ds=BC.filter(x=>x.boi===nguoiBoi&&ngay(HOMNAY,x.t)<=90);
 const bq=ds.filter(x=>x.tt==='boqua');
 return bq.length>=2?{tong:ds.length,bq:bq.length}:null;
}

/* ============ SIDEBAR · HEADER ============ */
const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','2'],['M0.3','Thông báo của tôi','3'],['M0.4','Trang cá nhân']]],
 ['hs','👥 Học sinh',[['M1.1','Hồ sơ học sinh'],['M1.7','Lớp học & Chuyển lớp']]],
 ['lop','📚 Lớp học hàng ngày',[['M2.1','Lịch dạy & học'],['M2.2','Sổ đầu bài'],['M2.7','Khen thưởng & Kỷ luật HS']]],
 ['ns','👨‍🏫 Nhân sự',[['M4.1','Hồ sơ nhân sự'],['M4.5','Phân công giảng dạy'],['M4.8','Nghỉ phép']]],
 ['vh','🏫 Vận hành & Dịch vụ',[['M6.8','Sự kiện trường học'],['M6.9','Văn thư — Công văn']]],
 ['gt','💬 Giao tiếp',[['M8.1','Thông báo chủ động'],['M8.2','Nhắn tin'],['M8.3','Xử lý vi phạm chat']]],
 ['qt','⚙️ Quản trị',[['M10.1','Hồ sơ năm học'],['M10.6','Trung tâm cấu hình']]]];
const NAVOK={FULL:'all',HT:'all',PHT_DT:['hs','lop','vh','gt'],GVCN:['hs','lop','gt']};
/* M8.3 AN HAN voi vai khong co quyen X — ngoai le co chu dich cua quy uoc "lam mo" (§3).
   M8.2 an voi vai khong day lop nao (M8.2 §3).                                       */
function hideOf(){
 const h=[];
 if(!R().coMenu)h.push('M8.3');
 if(role==='HT'||role==='FULL')h.push('M8.2');
 return h;
}
function sidebar(){
 const a=NAVOK[role],full=a==='all',hide=hideOf();
 $('#side').innerHTML=NAV.map(function(g){
  const on=full||g[0]===''||a.indexOf(g[0])>=0;
  const items=g[2].filter(it=>hide.indexOf(it[0])<0);
  if(!items.length)return '';
  return '<div class="sgrp">'+g[1]+'</div>'+items.map(function(it){
   const cu=it[0]==='M8.3',nb=cu?chuaXL():(it[2]||0);
   return '<div class="snav '+(cu?'on':'')+' '+(on?'':'off')+'">'+
    '<span style="font-size:10.5px;opacity:.55;min-width:30px">'+it[0]+'</span>'+
    '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+it[1]+'</span>'+
    (nb?'<span class="nb">'+nb+'</span>':'')+'</div>'}).join('')}).join('');
}
function header(){
 const r=R();$('#ava').textContent=r.ava;
 const s=$('#hdt');
 if(r.dt){s.innerHTML='<option>'+DTS[r.dt]+'</option>';s.disabled=true;$('#hlock').textContent='🔒';V.hdt=r.dt}
 else{s.innerHTML='<option value="ALL">Toàn trường</option>'+Object.keys(DTS).map(k=>'<option value="'+k+'">'+DTS[k]+'</option>').join('');
  s.disabled=false;$('#hlock').textContent='';s.value=V.hdt}
 $('#ndot').textContent=chuaXL();$('#ndot').style.display=chuaXL()?'grid':'none';
}

 h+='<div class="tabs">'+ts.map(function(t){

function vAn(){
 return '<div class="tophd"><h1>⚖ Xử lý vi phạm chat</h1><span class="pill">M8.3</span></div>'+

  'Quy ước chung là menu ngoài quyền thì <b>làm mờ</b>. M8.3 là <b>ngoại lệ có chủ đích</b>: làm mờ vẫn để lộ <i>sự tồn tại</i> của một chức năng xử lý vi phạm, đúng cái mà quy tắc R4 muốn tránh khi bắt tách M8.3 khỏi M8.2.<br><br>'+
  'Nhìn thấy dòng chữ mờ <i>“Xử lý vi phạm chat”</i> ngay dưới <i>“Nhắn tin”</i>, phản xạ tự nhiên của giáo viên và phụ huynh là <b>“vậy nhà trường đọc được tin của tôi”</b>. Điều đó <b>không đúng</b> — Ban giám hiệu chỉ thấy đúng những tin người báo cáo đính kèm — nhưng một dòng mờ trên sidebar thì nói ngược lại, và không có chỗ nào giải thích.<br><br>'+
  'Người dùng biết về cơ chế này qua <b>điều khoản đã đọc và đồng ý ở M8.2</b>. Đó mới là chỗ đúng để nói, vì ở đó có đủ ngữ cảnh.'+
  '</div></div></div>'+
  '<div class="ro" style="margin-top:12px">Màn hình này chỉ có trong bản demo để bạn thấy lập luận. Trên hệ thống thật, vai này <b>không nhìn thấy mục M8.3</b> ở sidebar — kiểm tra bằng cách nhìn sang bên trái ngay bây giờ.</div>';
}
function scopeBar(){
 const r=R();
 let h='<div class="scope"><span>⚖</span><span class="sp">Bạn đang xem với vai <b>'+r.n+'</b>. Phạm vi: <code>'+r.sc+'</code>. Thấy <b>'+bcCua().length+' báo cáo</b> và <b>'+kcCua().length+' lệnh khóa</b>. '+r.scT+'</span></div>';
 if(V.tab==='qt')h+='<div class="scope am"><span>⚠</span><span class="sp">Quy tắc chat áp cho <b>TOÀN TRƯỜNG, xuyên năm học</b> — đổi bộ chọn năm học hay điểm trường ở header <b>không</b> làm đổi giá trị ở đây.</span></div>';

/* ============ F1 — BAO CAO VI PHAM ============ */
const CHIPS=[['all','Tất cả'],['moi','Chưa xử lý'],['bosung','Chờ bổ sung'],['nhac','Đã nhắc nhở'],['khoa','Đã khóa'],['boqua','Đã bỏ qua']];
function vBC(){
 const all=bcCua();
 let ds=all.filter(b=>V.chip==='all'||b.tt===V.chip);
 const q=kd(V.q);
 if(q)ds=ds.filter(b=>kd(b.id+' '+b.bi+' '+b.boi+' '+b.lop+' '+b.ly).indexOf(q)>=0);
 ds=ds.slice().sort((a,b)=>b.t-a.t);
 let h='<div class="bar"><input class="inp" id="q" placeholder="Tìm theo mã, người bị báo cáo, người báo cáo, lớp…" value="'+esc(V.q)+'">'+
  CHIPS.map(function(c){
   const n=c[0]==='all'?all.length:all.filter(b=>b.tt===c[0]).length;
   return '<button class="qf '+(V.chip===c[0]?'on':'')+'" data-chip="'+c[0]+'">'+c[1]+
    (n?'<span class="c '+(c[0]==='moi'?'al':'')+'">'+n+'</span>':'')+'</button>'}).join('')+
  '<button class="btn sm" data-x="xuat">⬇ Xuất</button>'+
  '<div class="sum"><span><b>Không có tab “Chờ tôi xử lý”</b> — danh sách gốc đã chứa mọi báo cáo cần xử lý nên chip là đủ (§4.1)</span></div></div>';
 h+='<div class="stage '+(V.pick&&V.kind==='bc'?'open':'')+'"><div class="listw">';
 h+='<div class="hdrow gbc"><div>Báo cáo</div><div>Người bị báo cáo</div><div class="kx">Người báo cáo</div><div class="kx">Bối cảnh · lý do</div><div>Trạng thái</div></div>';
 if(!ds.length)h+='<div class="empty"><b>Không có báo cáo nào</b>Đổi chip lọc hoặc xóa từ khóa tìm kiếm.</div>';
 ds.forEach(function(b){
  const cho=b.tt==='moi'?ngay(HOMNAY,b.t):null;
  h+='<div class="hrow gbc '+(V.pick===b.id?'on':'')+'" data-bc="'+b.id+'">'+
   '<div><div class="t1">'+b.id+'</div><div class="t2">'+dt2s(b.t)+
     (cho!==null?' · <b style="color:var(--red)">chờ '+(cho===0?'hôm nay':cho+' ngày')+'</b>':'')+'</div></div>'+
   '<div><div class="t1">'+esc(b.bi)+(laNS(b.bi)?' <span class="pill ns">NHÂN SỰ</span>':'')+'</div>'+
     '<div class="t2">'+esc(moTa(b.bi))+'</div></div>'+
   '<div class="kx"><div class="t1" style="font-weight:500">'+esc(b.boi)+'</div><div class="t2">'+esc(b.boiV)+'</div></div>'+
   '<div class="kx"><div class="t1" style="font-weight:500">'+(b.boi_canh==='nhom'?'Nhóm lớp '+b.lop:'Cuộc riêng · '+b.lop)+'</div>'+
     '<div class="t2">'+esc(b.ly)+' · '+b.tin.length+' tin đính kèm</div></div>'+
   '<div><span class="st2 '+TTBC[b.tt].c+'">'+TTBC[b.tt].t+'</span></div></div>';
 });
 h+='</div>'+panel()+'</div>';
 return h;
}

/* ============ F3 — KHOA CHAT ============ */
const CHIPK=[['all','Tất cả'],['hieuluc','Đang có hiệu lực'],['sap','Sắp hết hạn'],['hethan','Đã hết hạn'],['gosom','Đã gỡ sớm']];
function vKC(){
 const all=kcCua();
 let ds=V.chipK==='all'?all:V.chipK==='sap'?all.filter(sapHetHan):all.filter(k=>k.tt===V.chipK);
 const q=kd(V.q);
 if(q)ds=ds.filter(k=>kd(k.id+' '+k.ai+' '+k.ly).indexOf(q)>=0);
 ds=ds.slice().sort((a,b)=>b.tu-a.tu);
 let h='<div class="bar"><input class="inp" id="q" placeholder="Tìm theo mã lệnh hoặc tên người bị khóa…" value="'+esc(V.q)+'">'+
  CHIPK.map(function(c){
   const n=c[0]==='all'?all.length:c[0]==='sap'?all.filter(sapHetHan).length:all.filter(k=>k.tt===c[0]).length;
   return '<button class="qf '+(V.chipK===c[0]?'on':'')+'" data-chipk="'+c[0]+'">'+c[1]+
    (n?'<span class="c '+(c[0]==='hieuluc'?'al':'')+'">'+n+'</span>':'')+'</button>'}).join('')+
  '<button class="btn sm p" data-x="khoamoi">＋ Khóa tài khoản</button>'+
  '<div class="sum"><span>Đơn vị một dòng là <b>một lệnh khóa</b>, không phải một người — chuỗi lệnh chính là căn cứ cho lần sau (§4)</span></div></div>';
 h+='<div class="stage '+(V.pick&&V.kind==='kc'?'open':'')+'"><div class="listw">';
 h+='<div class="hdrow gkc"><div>Lệnh khóa</div><div>Người bị khóa</div><div class="kx">Thời hạn</div><div class="kx">Người ra lệnh · nguồn</div><div>Trạng thái</div></div>';
 if(!ds.length)h+='<div class="empty"><b>Không có lệnh khóa nào</b>Đổi chip lọc để xem các lệnh đã hết hạn hoặc đã gỡ sớm.</div>';
 ds.forEach(function(k){
  const con=ngay(k.den,HOMNAY);
  h+='<div class="hrow gkc '+(V.pick===k.id?'on':'')+'" data-kc="'+k.id+'">'+
   '<div><div class="t1">'+k.id+'</div><div class="t2">'+esc(k.ly).slice(0,44)+'…</div></div>'+
   '<div><div class="t1">'+esc(k.ai)+(laNS(k.ai)?' <span class="pill ns">NHÂN SỰ</span>':'')+'</div>'+
     '<div class="t2">'+esc(moTa(k.ai))+'</div></div>'+
   '<div class="kx"><div class="t1" style="font-weight:500">'+k.so+' ngày</div>'+
     '<div class="t2">'+dm(k.tu)+' → '+dm(k.den)+(k.tt==='hieuluc'?' · <b style="color:var(--red)">còn '+con+' ngày</b>':'')+'</div></div>'+
   '<div class="kx"><div class="t1" style="font-weight:500">'+esc(k.boi)+'</div>'+
     '<div class="t2">'+(k.nguon?'từ '+k.nguon:'khóa trực tiếp')+'</div></div>'+
   '<div><span class="st2 '+TTKC[k.tt].c+'">'+TTKC[k.tt].t+'</span>'+(sapHetHan(k)?' <span class="st2 w">sắp hết hạn</span>':'')+'</div></div>';
 });
 h+='</div>'+panel()+'</div>';
 return h;
}
</script>
<script>
"use strict";
/* ============ F2 · F4 — PANEL TRUOT 1:1 ============ */
function panel(){
 if(!V.pick)return '<div class="panel"></div>';
 return V.kind==='bc'?panelBC():panelKC();
}
function panelBC(){
 const b=bcId(V.pick);if(!b)return '<div class="panel"></div>';
 const r=R(),ns=laNS(b.bi),ld=lamDung(b.boi),ls=lichSuNguoi(b.bi);
 let h='<div class="panel"><div class="ph"><div class="n"><h2>'+b.id+' — '+esc(b.ly)+'</h2>'+
  '<div class="m"><span class="st2 '+TTBC[b.tt].c+'">'+TTBC[b.tt].t+'</span>'+
  '<span class="pill">'+(b.boi_canh==='nhom'?'Nhóm lớp '+b.lop:'Cuộc riêng · '+b.lop)+'</span>'+
  '<span class="pill">'+DTS[dtCua(b.lop)]+'</span><span>gửi '+dt2s(b.t)+'</span></div></div>'+
  '<button class="btn sm" data-x="close2">✕</button></div><div class="pbody">';

 /* KHOI 1 — ai bao cao ai */
 h+='<div class="sech">Ai báo cáo ai</div>'+
  '<div class="f"><div class="k">Người bị báo cáo</div><div class="v">'+esc(b.bi)+(ns?' <span class="pill ns">NHÂN SỰ</span>':'')+
   ' <span style="font-weight:400;color:var(--ink2)">— '+esc(moTa(b.bi))+'</span></div></div>'+
  '<div class="f"><div class="k">Người báo cáo</div><div class="v">'+esc(b.boi)+' <span style="font-weight:400;color:var(--ink2)">— '+esc(b.boiV)+'</span></div></div>'+
  '<div class="f"><div class="k">Lý do</div><div class="v">'+esc(b.ly)+'</div></div>'+
  (b.mota?'<div class="f"><div class="k">Mô tả thêm</div><div class="v" style="font-weight:400">“'+esc(b.mota)+'”</div></div>':'');
 if(ld)h+='<div class="warn" style="margin-top:10px">⚠ <b>'+esc(b.boi)+'</b> đã gửi <b>'+ld.tong+' báo cáo</b> trong 90 ngày qua, trong đó <b>'+ld.bq+' báo cáo bị kết luận không có cơ sở</b>. Cân nhắc khi đọc báo cáo này.<br>'+
  '<span style="opacity:.85">Đây là cảnh báo, không phải chặn — người từng báo cáo sai ba lần vẫn có thể đúng ở lần thứ tư (§8.1.3).</span></div>';

 /* KHOI 2 — tin dinh kem, va CHI tin dinh kem */
 h+='<div class="sech">Tin đính kèm <span class="pill">'+b.tin.length+' tin</span></div>';
 b.tin.forEach(function(m){
  h+='<div class="msgq '+(m.bad?'bad':'')+'"><div class="h"><span class="who">'+esc(m.ai)+'</span><span>'+dt2s(m.t)+'</span>'+
   (m.ai===b.bi?'<span class="pill">người bị báo cáo</span>':'')+'</div><div class="tx">'+esc(m.tx)+'</div></div>';
 });
 h+='<div class="lock">🔒 Bạn đang xem <b>đúng những tin người báo cáo đã tích chọn</b>. Hệ thống <b>không có chức năng</b> mở rộng ngữ cảnh, đọc cả cuộc trò chuyện, hay tìm kiếm trong kho tin nhắn — <b>kể cả với nhóm lớp</b>. Cần thêm ngữ cảnh thì dùng <b>📩 Yêu cầu bổ sung</b> ở dưới.</div>';
 if(b.tt==='bosung')h+='<div class="warn">📩 <b>Đã yêu cầu bổ sung ngữ cảnh</b>, đồng hồ chờ đang dừng.<br>Câu hỏi đã gửi: “'+esc(b.hoi)+'”</div>';

 /* KHOI 3 — lich su cua nguoi bi bao cao */
 h+='<div class="sech">Lịch sử của '+esc(b.bi)+'</div>'+
  '<div class="f"><div class="k">Báo cáo trước đó</div><div class="v" style="font-weight:400">'+
   (ls.bc.length>1?('<b>'+(ls.bc.length-1)+'</b> báo cáo khác — '+
     ['khoa','nhac','boqua','moi','bosung'].map(function(k){const n=ls.bc.filter(x=>x.tt===k&&x.id!==b.id).length;
      return n?n+' '+TTBC[k].t.toLowerCase():''}).filter(Boolean).join(' · '))
    :'Không có báo cáo nào khác')+'</div></div>'+
  '<div class="f"><div class="k">Lệnh khóa đã có</div><div class="v" style="font-weight:400">'+
   (ls.kc.length?ls.kc.map(k=>'<button class="rolnk" data-gokc="'+k.id+'">'+k.id+' · '+k.so+' ngày · '+TTKC[k.tt].t+' ↗</button>').join(' ')
    :'Chưa từng bị khóa')+'</div></div>';
 if(ns)h+='<div class="warn" style="margin-top:9px">👨‍🏫 Người bị báo cáo là <b>nhân sự của trường</b>. Khóa chat của giáo viên chạm vào quan hệ lao động và vào việc thực hiện nhiệm vụ được giao — <b>chỉ Hiệu trưởng ra được lệnh</b>, và hệ thống sẽ sinh một dòng nhắc lập hồ sơ ở menu kỷ luật nhân sự (§8.4.5).</div>';

 /* KHOI 4 — khong co nut xoa tin */
 h+='<div class="sech">Vì sao không có nút xóa tin</div>'+
  '<div class="lock">Tin nhắn <b>không xóa được</b>, kể cả bởi Ban giám hiệu. Tin đã nằm trên điện thoại người nhận từ lúc gửi; xóa ở máy chủ chỉ xóa mất <b>bằng chứng</b>, không xóa được cái đã xảy ra. Đây là cam kết đã ghi trong điều khoản mà mọi người dùng đã đồng ý.</div>';

 if(b.ketluan)h+='<div class="sech">Kết luận</div><div class="'+(b.tt==='boqua'?'ro':'okbx')+'">'+esc(b.ketluan)+'</div>';
 if(b.kc)h+='<div class="okbx">🔒 Đã lập lệnh khóa <button class="rolnk" data-gokc="'+b.kc+'">'+b.kc+' ↗</button></div>';

 h+='<div class="sech">Lịch sử thao tác</div><div class="logl">'+
  b.ls.map(function(l){

  '</div>';
 if(KForm.so==='khac')h+='<div style="display:flex;gap:8px;align-items:center;margin-top:8px"><input class="ti" type="number" id="kSo" value="'+(KForm.soKhac||'')+'" placeholder="số ngày" style="max-width:130px"><span style="font-size:12.5px">ngày</span></div>';
 if(!r.vinhVien)h+='<div class="hint">Mức <b>Vĩnh viễn</b> không có trong bộ chọn của bạn — chỉ Hiệu trưởng ra được.</div>';
 h+='</div>';
 if(KForm.vv)h+='<div class="danger"><b>⚠ Khóa vĩnh viễn — cân nhắc kỹ.</b> Khóa vĩnh viễn một phụ huynh nghĩa là <b>cắt vĩnh viễn kênh liên lạc chính thức giữa gia đình và giáo viên chủ nhiệm của con họ</b>. '+
  'Người chịu hậu quả thật là học sinh, không phải người vi phạm — em đó vẫn học ở trường thêm nhiều năm.<br><br>'+
  'Thêm nữa, một lệnh vĩnh viễn là <b>lệnh không ai rà lại</b>: người ra lệnh nghỉ hưu, hiệu trưởng đổi, còn lệnh thì nằm đó.<br><br>'+
  '<b>Đề xuất trong tài liệu (§8.4.4):</b> bỏ mức này, thay bằng <b>trần 90 ngày, gia hạn không giới hạn số lần</b> — kết quả thực tế giống hệt nếu người đó tiếp tục vi phạm, nhưng cứ 90 ngày là có một người phải nhìn lại và ký gia hạn. '+
  '<b>Đang chờ nhà trường chốt.</b> Nếu vẫn dùng mức này, hệ thống sẽ đặt một dòng nhắc rà lại sau 90 ngày.</div>';
 h+='<div class="gf"><label>Lý do <b>*</b></label><textarea class="ta" id="kLy">'+esc(KForm.ly)+'</textarea>'+
  '<div class="hint">⚠ Nội dung này <b>hiện nguyên văn cho người bị khóa</b> trong thông báo và trong dải đỏ ở M8.2. Viết đủ rõ để họ hiểu mình sai ở đâu.</div></div>';
 if(!KForm.bc)h+='<div class="gf"><label>Căn cứ nhận thông tin <b>*</b></label><textarea class="ta" id="kCC">'+esc(KForm.canCu)+'</textarea>'+
  '<div class="hint">Bắt buộc với <b>khóa trực tiếp</b> — đây là trường hợp không có vết nào trong hệ thống, nên phải ghi lại nguồn tin (hotline, biên bản làm việc, họp giao ban…).</div></div>';
 h+='<div class="lock" style="margin-bottom:0">Thông báo gửi người bị khóa sẽ nêu <b>lý do, thời hạn và ngày mở lại</b> — nhưng <b>không nêu tên người báo cáo</b> (§8.2.6).</div>';
 modal('🔒 Lập lệnh khóa chat',h,'<button class="btn" data-x="close">Hủy</button><button class="btn d" id="okKhoa">Lập lệnh khóa</button>');
 $('#okKhoa').onclick=luuKhoa;
}
function luuKhoa(){
 const r=R();
 if(!KForm.bc){const s=$('#kNguoi');KForm.nguoi=s?s.value:KForm.nguoi}
 KForm.ly=$('#kLy')?$('#kLy').value.trim():'';
 if($('#kCC'))KForm.canCu=$('#kCC').value.trim();
 if($('#kSo'))KForm.soKhac=+$('#kSo').value;
 if(!KForm.nguoi){toast('⛔ Chưa chọn người bị khóa');return}
 let so=KForm.vv?9999:(KForm.so==='khac'?KForm.soKhac:KForm.so);
 if(!so||so<1){$('#kSo')&&$('#kSo').classList.add('err');toast('⛔ Chưa nhập số ngày hợp lệ');return}
 if(!KForm.ly){$('#kLy').classList.add('err');toast('⛔ <b>Bắt buộc nhập lý do</b> — nội dung này hiện nguyên văn cho người bị khóa');return}
 if(!KForm.bc&&!KForm.canCu){$('#kCC').classList.add('err');toast('⛔ Khóa trực tiếp <b>bắt buộc ghi căn cứ nhận thông tin</b> — đây là trường hợp không có vết trong hệ thống');return}
 const hh=khoaHienHanh(KForm.nguoi);
 if(hh){closeModal();hopKhoa(null,KForm.nguoi);return}
 const k={id:nextKC(),ai:KForm.nguoi,tu:new Date(HOMNAY),den:KForm.vv?new Date(2099,0,1):new Date(HOMNAY.getTime()+so*86400000),
  so:KForm.vv?'vĩnh viễn':so,ly:KForm.ly,boi:r.me,boiV:r.ct,nguon:KForm.bc,canCu:KForm.canCu,tt:'hieuluc',ls:[]};
 KC.push(k);
 ghiLS(k,'Lập lệnh khóa'+(KForm.bc?' từ báo cáo '+KForm.bc:' trực tiếp')+' — '+(KForm.vv?'VĨNH VIỄN':so+' ngày'));
 k.ls.push({t:new Date(HOMNAY),ai:'Hệ thống',v:'—',hd:'Đã gửi thông báo tới người bị khóa · KHÔNG nêu tên người báo cáo'});
 if(laNS(KForm.nguoi))k.ls.push({t:new Date(HOMNAY),ai:'Hệ thống',v:'—',hd:'Sinh dòng nhắc lập hồ sơ ở menu kỷ luật nhân sự'});
 if(KForm.vv)k.ls.push({t:new Date(HOMNAY),ai:'Hệ thống',v:'—',hd:'Đặt nhắc rà lại lệnh vĩnh viễn sau 90 ngày'});
 if(KForm.bc){const b=bcId(KForm.bc);b.tt='khoa';b.kc=k.id;ghiLS(b,'Kết luận có vi phạm — lập lệnh khóa '+k.id+', '+(KForm.vv?'vĩnh viễn':so+' ngày'))}
 closeModal();V.tab='kc';V.chipK='hieuluc';V.pick=k.id;V.kind='kc';render();
 toast('🔒 Đã lập lệnh <b>'+k.id+'</b> — '+esc(KForm.nguoi)+(KForm.vv?' · vĩnh viễn':' · '+so+' ngày')+(laNS(KForm.nguoi)?' · đã sinh dòng nhắc lập hồ sơ kỷ luật':''));
}

/* ============ SU KIEN ============ */
document.addEventListener('click',function(e){
 const t=e.target.closest('[data-r],[data-tab],[data-chip],[data-chipk],[data-bc],[data-kc],[data-x],[data-bs],[data-nhac],[data-khoa],[data-boqua],[data-gokc],[data-gokc2],[data-gobc],[data-giahan],[data-gosom],[data-kso],[data-tg]');
 if(!t)return;const d=t.dataset;

 if(d.r){role=d.r;V={tab:'bc',chip:'chua',pick:null,kind:'bc',q:'',chipK:'hieuluc',hdt:'ALL'};V.chip='moi';
   document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role));render();return}
 if(d.tab){V.tab=d.tab;V.pick=null;V.q='';render();return}
 if(d.chip){V.chip=d.chip;V.pick=null;render();return}
 if(d.chipk){V.chipK=d.chipk;V.pick=null;render();return}
 if(d.bc){V.pick=V.pick===d.bc?null:d.bc;V.kind='bc';render();return}
 if(d.kc){V.pick=V.pick===d.kc?null:d.kc;V.kind='kc';render();return}
 if(d.gokc){V.tab='kc';V.chipK='all';V.pick=d.gokc;V.kind='kc';render();return}
 if(d.gokc2){closeModal();V.tab='kc';V.chipK='all';V.pick=d.gokc2;V.kind='kc';render();return}
 if(d.gobc){V.tab='bc';V.chip='all';V.pick=d.gobc;V.kind='bc';render();return}

 if(d.x==='close'){closeModal();return}
 if(d.x==='close2'){V.pick=null;render();return}
 if(d.x==='khoamoi'){hopKhoa(null,null);return}
 if(d.x==='xuat'){hopXuat();return}
 if(d.x==='luuTru'){const v=+$('#qtLuu').value;if(!v||v<1){$('#qtLuu').classList.add('err');toast('⛔ Nhập số năm học hợp lệ');return}
   QT.luuTru=v;render();toast('✅ Đã đặt thời hạn lưu trữ <b>'+v+' năm học</b> — cảnh báo NĐ 13/2023 đã tắt');return}
 if(d.x==='suadk'){hopSuaDK();return}
 if(d.tg==='anhNhom'){QT.anhNhom=!QT.anhNhom;render();
   toast(QT.anhNhom?'Đã bật gửi ảnh trong nhóm lớp':'Đã tắt — giáo viên chỉ còn gửi ảnh được trong cuộc riêng');return}
 if(d.kso){
   if(d.kso==='vv'){KForm.vv=true;KForm.so=null}
   else{KForm.vv=false;KForm.so=d.kso==='khac'?'khac':+d.kso}
   KForm.ly=$('#kLy')?$('#kLy').value:KForm.ly;
   if($('#kCC'))KForm.canCu=$('#kCC').value;
   if(!KForm.bc&&$('#kNguoi'))KForm.nguoi=$('#kNguoi').value;
   veHopKhoa();return}

 if(d.bs){const b=bcId(d.bs);
   hopLyDo('📩 Yêu cầu bổ sung ngữ cảnh',
    '<div class="info">Cách sai là cho Ban giám hiệu tự mở rộng ngữ cảnh. Cách đúng là <b>hỏi lại người trong cuộc</b> — quyền quyết định đưa thêm bao nhiêu vẫn nằm ở họ (§6.1).</div>'+
    '<div class="ro">Câu hỏi sẽ gửi tới <b>M0.3 của '+esc(b.boi)+'</b>. Họ mở M8.2, tích thêm tin và gửi bổ sung. Báo cáo chuyển sang <b>Chờ bổ sung</b> và <b>đồng hồ chờ dừng lại</b>.</div>',
    'Câu hỏi gửi người báo cáo',function(v){
     b.tt='bosung';b.hoi=v;ghiLS(b,'Yêu cầu bổ sung ngữ cảnh — đồng hồ chờ đã dừng');
     V.chip='bosung';render();toast('📩 Đã gửi yêu cầu tới <b>'+esc(b.boi)+'</b> — đồng hồ chờ đã dừng');
    });return}
 if(d.nhac){const b=bcId(d.nhac);
   hopLyDo('💬 Gửi nhắc nhở',
    '<div class="ro">Kết luận <b>có vi phạm nhẹ</b> — gửi cảnh báo tới <b>'+esc(b.bi)+'</b>, <b>không khóa</b>. Thông báo <b>không nêu tên người báo cáo</b>.</div>',
    'Nội dung nhắc nhở gửi người vi phạm',function(v){
     b.tt='nhac';b.ketluan=v;ghiLS(b,'Kết luận vi phạm nhẹ — gửi nhắc nhở, không khóa');
     V.chip='nhac';render();toast('💬 Đã gửi nhắc nhở tới <b>'+esc(b.bi)+'</b> — không nêu tên người báo cáo');
    });return}
 if(d.khoa){hopKhoa(bcId(d.khoa),null);return}
 if(d.boqua){const b=bcId(d.boqua);
   hopLyDo('✕ Bỏ qua báo cáo',
    '<div class="warn">Kết luận <b>không có vi phạm</b>. Bản ghi <b>không bị xóa</b> — nó nằm lại ở chip <code>Đã bỏ qua</code>, và chuỗi báo cáo bị bỏ qua của cùng một người chính là <b>dấu hiệu lạm dụng nút báo cáo</b> (§8.1.3).</div>',
    'Lý do bỏ qua',function(v){
     b.tt='boqua';b.ketluan=v;ghiLS(b,'Kết luận không có cơ sở — bỏ qua, có nêu lý do');
     V.chip='boqua';render();toast('✕ Đã bỏ qua <b>'+b.id+'</b> — bản ghi giữ lại, tìm ở chip “Đã bỏ qua”');
    },true);return}
 if(d.giahan){const k=kcId(d.giahan);
   modal('🕐 Gia hạn lệnh '+k.id,
    '<div class="ro">Đang hết hạn ngày <b>'+d2s(k.den)+'</b> (còn '+ngay(k.den,HOMNAY)+' ngày). Gia hạn giữ nguyên một lệnh thay vì lập lệnh mới, để chuỗi lệnh của người này vẫn đọc được thành một mạch.</div>'+
    '<div class="gf"><label>Gia hạn thêm <b>*</b></label><div style="display:flex;gap:8px;align-items:center"><input class="ti" type="number" id="ghSo" value="14" style="max-width:130px"><span style="font-size:12.5px">ngày</span></div></div>'+
    '<div class="gf"><label>Lý do gia hạn <b>*</b></label><textarea class="ta" id="ghLy"></textarea></div>',
    '<button class="btn" data-x="close">Hủy</button><button class="btn d" id="okGH">Gia hạn</button>');
   $('#okGH').onclick=function(){
    const s=+$('#ghSo').value,v=$('#ghLy').value.trim();
    if(!s||s<1){$('#ghSo').classList.add('err');toast('⛔ Nhập số ngày hợp lệ');return}
    if(!v){$('#ghLy').classList.add('err');toast('⛔ Bắt buộc nêu lý do gia hạn');return}
    k.den=new Date(k.den.getTime()+s*86400000);k.so=(typeof k.so==='number'?k.so+s:k.so);
    ghiLS(k,'Gia hạn thêm '+s+' ngày, tới hết '+d2s(k.den)+' — lý do: '+v);
    closeModal();render();toast('🕐 Đã gia hạn <b>'+k.id+'</b> tới '+d2s(k.den));
   };return}
 if(d.gosom){const k=kcId(d.gosom);
   hopLyDo('🔓 Gỡ khóa sớm — '+k.id,
    '<div class="ro">Gỡ trước hạn <b>'+d2s(k.den)+'</b>. Lệnh <b>không bị xóa</b> — nó chuyển sang trạng thái <code>Đã gỡ sớm</code> và vẫn nằm trong chuỗi lịch sử của người này.</div>',
    'Lý do gỡ sớm',function(v){
     k.tt='gosom';k.goNgay=new Date(HOMNAY);k.goBoi=R().me;k.goV=R().ct;k.goLy=v;
     ghiLS(k,'Gỡ khóa sớm — có nêu lý do');
     V.chipK='gosom';render();toast('🔓 Đã gỡ khóa sớm <b>'+k.id+'</b>');
    });return}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){V.q=e.target.value;reRender('#q')}});
document.addEventListener('change',function(e){
 if(e.target.id==='hdt'){V.hdt=e.target.value;V.pick=null;render()}
});

/* ============ XUAT ============ */
function hopXuat(){
 modal('⬇ Xuất danh sách báo cáo',
  '<div class="danger"><b>Bản xuất KHÔNG bao giờ chứa nội dung tin nhắn.</b> Chỉ có mã báo cáo, thời điểm, người liên quan, lý do, kết quả xử lý và người xử lý.<br><br>'+
  'Một tệp Excel chứa nội dung chat của phụ huynh sẽ đi ra khỏi hệ thống kiểm soát ngay khi được tải về, và không có cách nào biết nó dừng lại ở đâu. Nội dung tin <b>chỉ đọc được trên màn hình</b>, trong đúng ngữ cảnh của báo cáo (§8.1.4).</div>'+
  '<div class="gf"><label>Mục đích xuất <b>*</b></label><select class="ti" id="mdX">'+
  ['— Chọn mục đích —','Báo cáo nội bộ','Phục vụ thanh tra','Lưu hồ sơ năm học'].map(x=>'<option>'+x+'</option>').join('')+'</select>'+
  '<div class="hint">Bắt buộc theo NĐ 13/2023. Mỗi lượt xuất ghi audit gồm mục đích.</div></div>'+
  '<div class="ro" style="margin-bottom:0">Phạm vi tệp: <b>'+bcCua().length+' báo cáo</b> trong phạm vi <code>'+R().sc+'</code>.</div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" id="okX">⬇ Xuất tệp</button>');
 $('#okX').onclick=function(){
  const md=$('#mdX').value;
  if(md.indexOf('—')===0){$('#mdX').classList.add('err');toast('⛔ <b>Bắt buộc chọn mục đích</b> trước khi xuất');return}
  closeModal();audit('xuất '+bcCua().length+' báo cáo · mục đích <b>'+esc(md)+'</b> · <b>không kèm nội dung tin nhắn</b>');
 };
}

/* ============ SUA DIEU KHOAN ============ */
function hopSuaDK(){
 modal('✏ Sửa nội dung điều khoản sử dụng',
  '<div class="danger">Đây là ô <b>nguy hiểm nhất</b> của menu. Sửa nội dung thì <b>bắt buộc lên số phiên bản</b> — không có cách nào sửa lặng lẽ. Bản cũ <b>không bị ghi đè</b>, được lưu kèm danh sách ai đã đồng ý bản nào.</div>'+
  '<div class="gf"><label>Nội dung điều khoản</label><textarea class="ta" id="dkNd" style="min-height:150px">'+esc(QT.dk.nd)+'</textarea></div>'+
  '<div style="display:flex;gap:9px;flex-wrap:wrap">'+
  '<div class="gf" style="flex:1;min-width:160px"><label>Phiên bản mới <b>*</b></label><input class="ti" id="dkV" placeholder="hiện tại: '+QT.dk.v+'"></div>'+
  '<div class="gf" style="flex:1;min-width:160px"><label>Ngày hiệu lực <b>*</b></label><input class="ti" type="date" id="dkNgay" value="2026-12-01"></div></div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" id="okDK">Xem trước hệ quả</button>');
 $('#okDK').onclick=function(){
  const nd=$('#dkNd').value.trim(),v=$('#dkV').value.trim(),ngayHL=$('#dkNgay').value;
  if(nd===QT.dk.nd){toast('Nội dung chưa thay đổi');return}
  if(!v||v===QT.dk.v){$('#dkV').classList.add('err');toast('⛔ <b>Sửa nội dung thì bắt buộc lên số phiên bản</b> — không có cách nào sửa lặng lẽ');return}
  if(!ngayHL){$('#dkNgay').classList.add('err');toast('⛔ Bắt buộc chọn ngày hiệu lực');return}
  modal('So sánh hai bản điều khoản',
   '<div class="diff"><div class="diffb old"><h5>Bản '+esc(QT.dk.v)+' — sẽ lưu lại, không ghi đè</h5>'+esc(QT.dk.nd).replace(/\n/g,'<br>')+'</div>'+
   '<div class="diffb new"><h5>Bản '+esc(v)+' — hiệu lực '+ngayHL+'</h5>'+esc(nd).replace(/\n/g,'<br>')+'</div></div>'+
   '<div class="warn" style="margin-top:12px"><b>'+n3(QT.dk.tong)+' người dùng sẽ phải đồng ý lại</b> trước khi gõ tin tiếp theo. '+
   'Số người đã đồng ý bản cũ đặt lại về 0 cho bản mới.</div>'+
   '<div class="lock" style="margin-bottom:0">Nhắc lại nguyên tắc: mỗi dòng trong điều khoản phải <b>trỏ tới một chức năng có thật đang chạy</b>. Nếu bản mới hứa một cơ chế bảo vệ chưa dựng, hoặc dọa một quyền giám sát không tồn tại, thì đó là nói sai với người dùng (§8.5.1).</div>',
   '<button class="btn" data-x="close">Hủy</button><button class="btn d" id="okDK2">Ban hành bản '+esc(v)+'</button>');
  $('#okDK2').onclick=function(){
   QT.dkCu.push({v:QT.dk.v,ngay:QT.dk.ngay,nd:QT.dk.nd,dongY:QT.dk.dongY});
   QT.dk={v:v,ngay:ngayHL,nd:nd,dongY:0,tong:QT.dk.tong};
   closeModal();render();
   toast('📜 Đã ban hành <b>'+esc(v)+'</b> — '+n3(QT.dk.tong)+' người phải đồng ý lại. Bản cũ đã lưu, không ghi đè.');
  };
 };
}
$('#mask').addEventListener('click',function(e){if(e.target===this)closeModal()});
V.chip='moi';
render();
</script>
