<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M7.3 Điều chỉnh & Hoàn tiền — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:12px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink2)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:222px;flex:0 0 222px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:5px}
.crumb button{color:var(--brand);font-weight:600}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;overflow-x:auto}
.tab1{padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1 .c{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .c{background:var(--brand);color:#fff}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:240px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:9px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap;align-items:center}
.sum b{color:var(--ink)}
.chip{border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12px;background:#fff;white-space:nowrap}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:8px 12px;border-radius:9px;font-size:12.5px;margin-bottom:9px;display:flex;gap:8px;align-items:flex-start}
.kybar{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:9px;font-size:12.5px;margin-bottom:9px;display:flex;gap:8px;align-items:flex-start}
.cbbar{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:8px 12px;border-radius:9px;font-size:12.5px;margin-bottom:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage{display:flex;gap:13px;align-items:flex-start}
.stage .listw{flex:1;min-width:0}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grph{padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink2);display:flex;gap:9px;align-items:center;cursor:pointer;flex-wrap:wrap}
.grph:hover{background:var(--brand-soft)}
.grph .ar{color:var(--ink3);width:11px;font-size:11px}
.grph .gs{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink2)}
.grph.lv2{padding-left:26px;background:#fcfdff}
.row{border-bottom:1px solid var(--line);padding:10px 13px;cursor:pointer}
.row:hover{background:var(--brand-soft)}
.row.on{background:#eff6ff}
.rh{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.rh b{font-size:13.5px}
.rmeta{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.money.due{color:var(--red)}
.money.mut{color:var(--ink3);font-weight:400}
.strike{text-decoration:line-through;color:var(--ink3)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.wrapx{overflow-x:auto}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#f8fafc}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:flex-start;flex-wrap:wrap}
.ph h2{font-size:15.5px;font-weight:700}
.ph .m{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:14px 15px;max-height:calc(100vh - 210px);overflow-y:auto}
.sech2{font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 7px}
.sech2:first-child{margin-top:0}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.ok{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:11px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.ct2{font-size:11px;color:var(--ink3);font-family:ui-monospace,monospace;background:var(--bg);padding:2px 6px;border-radius:5px;display:inline-block}

.nh4{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:11px}
.nbox{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:var(--surface)}
.nbox .v{font-size:22px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.nbox .l{font-size:11.5px;color:var(--ink2);font-weight:600;min-height:30px}
.nbox .s{font-size:10.5px;color:var(--ink3);margin-top:4px}
.nbox.n1{background:var(--green-soft);border-color:#a7f3d0}
.nbox.n2{background:#eff6ff;border-color:#bfdbfe}
.nbox.n3{background:var(--amber-soft);border-color:#fde68a}
.nbox.n4{background:var(--red-soft);border-color:#fecaca}
.nbox.n5{background:#f8fafc}

.stepl{display:flex;gap:0;margin:10px 0 14px;flex-wrap:wrap}
.stp{flex:1;min-width:140px;border:1px solid var(--line);padding:8px 11px;font-size:12px;background:#fff;text-align:left}
.stp:first-child{border-radius:9px 0 0 9px}
.stp:last-child{border-radius:0 9px 9px 0}
.stp+.stp{border-left:none}
.stp b{display:block;font-size:12.5px}
.stp.done{background:var(--green-soft);border-color:#a7f3d0;color:#065f46}
.stp.now{background:var(--brand-soft);border-color:#bfdbfe;color:#1e40af}
.stp .n{font-size:10.5px;color:var(--ink3)}

.tl{border-left:2px solid var(--line);margin-left:7px;padding-left:15px}
.tli{position:relative;padding:7px 0;font-size:12.5px}
.tli::before{content:"";position:absolute;left:-21px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.tli.w::before{background:var(--amber)}.tli.r::before{background:var(--red)}.tli.g::before{background:var(--green)}
.tli b{display:block;font-weight:600}
.tli .mm{color:var(--ink3);font-size:11.5px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:900px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column}
.modal.sm{width:620px}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{margin-bottom:10px;font-size:12.5px;font-weight:700}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px;font-weight:400}
.res{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.resh{padding:8px 12px;font-size:12.5px;font-weight:700}
.resh.ok{background:var(--green-soft);color:#065f46}
.resh.skip{background:var(--amber-soft);color:#92400e;border-top:1px solid var(--line)}
.resb{padding:8px 12px;font-size:12.5px}
.resb .rr{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.resb .rr:last-child{border-bottom:none}
.resb .rr b{min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.blk{background:var(--red-soft);border:1px solid #fecaca;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-bottom:11px}
.blk b{color:#991b1b}
.blk .li{display:flex;gap:8px;align-items:baseline;padding:4px 0;color:#991b1b}

.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 11px;font-size:12.5px;margin-bottom:11px}
.kv .k{color:var(--ink3)}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.cb{background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:7px;padding:3px 9px;font-size:11.5px;margin-left:10px}
.cb.on{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:34px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}

.dsg{display:none;background:#fdf4ff;border:1px solid #f0abfc;color:#86198f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:10px}
body.showdsg .dsg{display:block}
.dsg b{color:#701a75}

.dotstrip{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;margin-bottom:11px}
.dotc{flex:0 0 auto;min-width:212px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left}
.dotc:hover{border-color:var(--brand);background:var(--brand-soft)}
.dotc.nhap{background:var(--amber-soft);border-color:#fde68a}
.dotc b{display:block;font-size:12.5px}
.dotc .m{font-size:11px;color:var(--ink2);margin-top:3px}
.dotc .m2{font-size:11px;color:var(--ink3);margin-top:2px}

.mgline{font-size:11.5px;color:var(--ink2);background:#f8fafc;border-left:2px solid var(--violet);padding:5px 9px;margin-top:4px;border-radius:0 6px 6px 0;line-height:1.55}
.mgline .bo{color:var(--ink3);display:block;margin-top:2px}
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;margin-bottom:11px}
.qhs{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;cursor:pointer;text-align:left}
.qhs:hover{border-color:var(--brand);background:var(--brand-soft)}
.qhs b{font-size:13px}
.qhs .m{font-size:11.5px;color:var(--ink2);margin-top:2px}
.menhgia{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:7px;margin-top:8px}
.mgi{border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:11.5px;background:#fff}
.mgi .l{color:var(--ink3);font-size:10.5px}
.mgi input{width:100%;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.mgi .t{font-size:11px;color:var(--ink2);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.gdc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:#fff}
.gdc .hd2{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.gdc .noi{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink2);background:var(--bg);padding:4px 8px;border-radius:6px;margin:6px 0}
.gsug{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:12px;flex-wrap:wrap}
.gsug .rk{font-size:10px;font-weight:800;background:#e0e7ff;color:#3730a3;padding:1px 6px;border-radius:5px}
.wq{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.wq:hover{background:var(--brand-soft)}
.wq.on{background:#eff6ff}
.wq .ic{font-size:17px;flex:0 0 22px}
.wq b{font-size:13px}
.wq .m{font-size:11.5px;color:var(--ink3);margin-top:2px}
.doc{border:1px solid var(--line2);border-radius:7px;padding:20px 24px;font-size:12px;line-height:1.75;background:#fff}
.doc .c{text-align:center}
.doc .c.b{font-weight:800;font-size:14px;margin:4px 0}
.doc .c.s{font-size:11px;color:var(--ink2);margin-bottom:12px}
.doc .sig{display:flex;justify-content:space-around;text-align:center;margin-top:20px;font-size:11.5px}
.hint{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.5}
.vbar{display:flex;gap:0;margin:9px 0 12px;flex-wrap:wrap}
.vst{flex:1;min-width:120px;border:1px solid var(--line);padding:7px 10px;font-size:11.5px;background:#fff;text-align:center}
.vst:first-child{border-radius:9px 0 0 9px}.vst:last-child{border-radius:0 9px 9px 0}
.vst+.vst{border-left:none}
.vst b{display:block;font-size:12px}
.vst.done{background:var(--green-soft);border-color:#a7f3d0;color:#065f46}
.vst.now{background:var(--brand-soft);border-color:#bfdbfe;color:#1e40af;font-weight:700}
.vst.skip{opacity:.45}
.fgrid{display:grid;grid-template-columns:170px 1fr;gap:7px 12px;font-size:12.5px;align-items:start}
.fgrid .k{color:var(--ink3);padding-top:3px}
.fgrid .hint{margin-top:2px}
.mcrow{display:grid;grid-template-columns:1fr 1fr 120px 1fr;gap:7px;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:center}
.mcrow.h{font-weight:700;color:var(--ink3);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.pbadge{font-size:9.5px;font-weight:800;background:#ede9fe;color:#5b21b6;padding:1px 6px;border-radius:4px}
.mocg{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:11px;background:var(--surface)}
.mocg .gh{padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;display:flex;gap:9px;align-items:center}
.mocr{display:flex;gap:10px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap;font-size:12.5px}
.mocr:last-child{border-bottom:none}
.mocr:hover{background:var(--brand-soft)}
.mocr.on{background:#eff6ff}
.mocr .lo{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.mocr .lo.dau{background:#e0e7ff;color:#3730a3}
.mocr .lo.cuoi{background:#fef3c7;color:#92400e}
.dk{font-size:11.5px;padding:2px 8px;border-radius:5px;font-weight:600;white-space:nowrap}
.dk.ok{background:var(--green-soft);color:#065f46}
.dk.no{background:var(--red-soft);color:#991b1b}
.cfgbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:12px}
.cfgi{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:var(--surface)}

/* Ca xử lý theo bảng 6 ô của §6.4 */
function caDC(d){
 const thu=d.thu||0, tang=d.moi-d.cu;
 if(tang>0){
  if(thu===0&&!d.hanQua) return {k:'sua',t:'Cập nhật thẳng hóa đơn'};
  return {k:'phu',t:'Phát hành hóa đơn phụ',so:tang};
 }
 if(thu===0) return d.moi===0?{k:'huy',t:'Hóa đơn Đã hủy theo phiếu'}:{k:'sua',t:'Cập nhật thẳng hóa đơn'};
 if(d.moi>=thu) return {k:'sua',t:'Cập nhật thẳng hóa đơn'};
 return {k:'sodu',t:'Ghi CÓ số dư tạm giữ',so:thu-d.moi};
}
/* Toàn bộ phần thừa là TIỀN GIA ĐÌNH — hóa đơn chưa từng chứa tiền ngân sách.
   Phần hỗ trợ ghi nhận thừa đi về sổ QTNS (Khoản × Kỳ × Điểm trường), không vào ví của em. */
function thuaTach(d){
 const thu=d.thu||0;
 return {gd:Math.max(0,thu-d.moi),ns:0};
}
/* chênh lệch hỗ trợ ngân sách sinh ra từ dòng điều chỉnh — đi về M7.4, KHÔNG vào sổ số dư */
const nsThua=d=>{const ns=d.ns||0; if(!ns||d.moi>=d.cu) return 0;
 return Math.max(0,ns-(d.cu>0?Math.round(ns*d.moi/d.cu):0));};
function ttSau(d){
 const c=caDC(d);
 if(c.k==='huy') return 'huy';
 if(c.k==='phu') return d.hdTT;          /* hóa đơn gốc không đổi */
 if(c.k==='sodu') return 'du';
 const moi=d.moi, thu=d.thu||0;
 if(moi===0) return 'huy';
 if(thu>=moi) return 'du';
 if(thu>0) return 'thieu';
 return 'chua';
}
const thuaDong=d=>Math.max(0,(d.thu||0)-d.moi);
const thieuDong=d=>Math.max(0,d.moi-(d.thu||0));
const tangDong=d=>Math.max(0,d.moi-d.cu);
const dcThua  =p=>(p.dong||[]).reduce((a,d)=>a+thuaTach(d).gd,0);
const dcThuaNS=p=>(p.dong||[]).reduce((a,d)=>a+thuaTach(d).ns,0);
const dcPhu   =p=>(p.dong||[]).filter(d=>caDC(d).k==='phu');
function btTong(p){
 let gd=0,ns=0,khong=0,dnGD=0;
 (p.bt||[]).forEach(b=>{gd+=(b.chotGD||0);ns+=(b.dnNS||0);dnGD+=(b.dnGD||0);
  khong+=Math.max(0,(b.gd-(b.dungGD||0))-(b.chotGD||0));});
 return {gd,ns,khong,dnGD};
}
function htTong(p){
 if(p.hl) return p.con.filter(c=>c.tt!=='klh').length*p.hl.dg;
 if(p.tongChi!=null) return p.tongChi;
 return (p.hs?sdGD(p.hs):0)+btTong(p).gd;
}

/* ==================== MÀN HÌNH PHIẾU HOÀN TIỀN ==================== */
const BUOCHT=[['Lập phiếu'],['Duyệt &amp; ký quyết định ⚖'],['Chờ chi'],['Đã chi'],['Hoàn tất']];
const ORD={nhap:0,cho_duyet:1,cho_chi:2,ngoai:2,da_chi:3,hoantat:4};
function stepsHT(p){
 const idx=ORD[p.tt];
 let h='<div class="steps">';
 BUOCHT.forEach((b,i)=>{
  const cls=p.tt==='huy'?(i===0?'done':'skip'):(p.tt==='ngoai'&&i===2?'stop':(i<idx?'done':(i===idx?'now':'')));
  let m='';
  if(i===0) m=p.lap.luc;
  if(i===1&&p.ht) m=p.ht.luc+(p.ht.ky?' ⚖':' (bỏ qua ký số)');
  if(i===2&&p.tt==='ngoai') m='hẹn '+p.ngoaiHen;
  if(i===3&&p.chi) m=p.chi.luc;
  if(i===4&&p.hoantat) m=p.hoantat.luc;
  h+='<div class="stp2 '+cls+'"><div class="n">BƯỚC '+(i+1)+'</div><div class="t">'+b[0]+'</div>'+(m?'<div class="m2">'+m+'</div>':'')+'</div>';
 });
 if(p.tt==='huy') h+='<div class="stp2 stop"><div class="n">DỪNG</div><div class="t">Đã hủy</div><div class="m2">'+p.huy.luc+'</div></div>';
 return h+'</div>';
}

 if(p.ht) h+='<div class="tli'+(p.chi||p.huy?'':' w')+'"><b>Duyệt và ký quyết định '+p.ht.so+'</b><div class="mm">'+esc(p.ht.by)+' · '+p.ht.luc+' · '+

 h+='<div class="listw">';
 p.con.forEach(c=>{const hs=HSC(c.hs);

   '<span class="money">'+M(c.so)+'</span>'+
   (c.tt==='chi'?'<span class="st2 o">Đã chi</span><span class="hint">'+esc(c.chi.ten)+' ('+c.chi.qh+') · '+c.chi.luc+'</span>'

    :'<span class="st2 n">Chờ chi</span>')+
   (c.tt==='cho'&&can('chi')?(p.tt==='ngoai'
     ?'<button class="btn xs" data-x="chibl" data-i="'+p.id+'">Chi</button>'

 if(x==='httra'){const p=PHTS.find(z=>z.id===i);p.tt='nhap';render();

 if(x==='chiok'){const p=PHTS.find(z=>z.id===i), hs=HSC(p.hs);

   p.nguoiNhan={ten,qh:'được ủy quyền',cccd:'—'};}

 if(x==='chibl'){toast('⛔ Phiếu đang ở <b>⏸ Chờ thu hồi từ bên ngoài</b> — tiền chưa về trường thì chưa chi được. Xử lý thu hồi trước.');return;}

    '<div style="margin-top:8px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn sm p" data-x="dl" data-m="M7.2">↗ Mở M7.2 · tab Chứng từ điện tử</button>'+

   return;}
  p.tt='hoantat';p.hoantat={luc:HOM+' '+gioNay()};render();
  toast('✓ Phiếu <b>'+p.id+'</b> đã <b>Hoàn tất</b>.');return;}
 if(x==='ctxong2'){const dc=PDC.find(z=>z.id===i);dc.dong.forEach(d=>{if(d.ct)d.ctXong=1;});
  closeM();toast('✓ Giả lập: đã phát hành chứng từ thay thế và gửi Mẫu 04/SS-HĐĐT. Bấm lại <b>Hoàn tất phiếu</b>.');render();return;}
 if(x==='hthuy'){const p=PHTS.find(z=>z.id===i);

 if(x==='kybc'){

   'Mở lại về sau thì hiện dải <i>“đã phát sinh thêm X từ đó tới nay”</i> — không có dải này thì người đọc bản đã ký tưởng số sai.</div>',

 if(x==='kybcok'){closeM();toast('✓ Đã ký báo cáo kỳ '+S.kytk+'.');return;}

document.addEventListener('input',e=>{
 const d=e.target.dataset||{};
 if(d.x==='setmoi'){const p=PDC.find(z=>z.id===S.sc);p.dong[+d.i].moi=num(e.target.value);
  const sel=e.target.selectionStart;render();
  const el2=document.querySelector('[data-x="setmoi"][data-i="'+d.i+'"]');
  if(el2){el2.focus();el2.setSelectionRange(el2.value.length,el2.value.length);}return;}
 if(d.x==='setchot'){const p=PHTS.find(z=>z.id===S.sc);p.bt[+d.i].chotGD=num(e.target.value);return;}
 if(d.x==='hlset'){const w=S.nw;const f=d.f;
  if(f==='cu'||f==='moi') w[f]=num(e.target.value); else w[f]=e.target.value;
  if(f==='ma'||f==='dt'){w.cu=GIA[w.dt][w.ma]||0;}
  if(f==='ma'||f==='dt'||f==='ky'){render();}
  return;}
 if(e.target.id==='dgtxt'){const p=PDC.find(z=>z.id===S.sc);p.dg=e.target.value;return;}
 if(e.target.id==='hldg'){S.nw.dg=e.target.value;return;}
});
document.addEventListener('change',e=>{
 if(e.target.id==='dtsel'){DTCUR=e.target.value;S.screen=null;render();return;}
 if(e.target.id==='kytk'){S.kytk=e.target.value;render();return;}
 if(e.target.id==='lysel'){const p=PDC.find(z=>z.id===S.sc);p.ly=e.target.value;render();return;}
 if(e.target.dataset&&e.target.dataset.x==='hlset'){
  const w=S.nw,f=e.target.dataset.f;w[f]=e.target.value;
  if(f==='ma'||f==='dt')w.cu=GIA[w.dt][w.ma]||0;
  render();return;}
 if(e.target.id==='nam'){toast('Demo chỉ có dữ liệu năm học 2026-2027.');e.target.value='2026-2027';return;}
});
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeM();});
render();
</script>
