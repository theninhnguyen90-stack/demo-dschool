<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10.5 Tài khoản &amp; Bảo mật — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.main{flex:1;padding:12px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.lk{opacity:.6;cursor:help;background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:8px 0 0;flex-wrap:wrap;align-items:flex-end}
.tab1{padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:6px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tfil{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:5px;flex-wrap:wrap}

.scope{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:7px 12px;font-size:12px;color:var(--ink2);margin:8px 0 9px;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.inp{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:#fff;min-width:180px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hrow{display:grid;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:1.9fr 1.15fr 1.1fr 1.3fr 1.5fr}
.stage.open .hrow{grid-template-columns:1.9fr 1.2fr}
.stage.open .hcol{display:none}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.warn{background:#fffdf5}
.hdrow{display:grid;gap:9px;padding:7px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:1.9fr 1.15fr 1.1fr 1.3fr 1.5fr}
.stage.open .hdrow{grid-template-columns:1.9fr 1.2fr}
.stage.open .hdrow div.hcol{display:none}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:31px;height:31px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 31px}
.ava2.ph{background:#fce7f3;color:#9d174d}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}
.st2.gr{background:#f1f5f9;color:#64748b}

.ph2{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph2 .n h2{font-size:15px;font-weight:700}
.ph2 .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:13px 15px;max-height:calc(100vh - 220px);overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.f{display:grid;grid-template-columns:140px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:12.5px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2)}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.rolnk.rd{color:#991b1b;background:var(--red-soft);border-color:#fecaca}
.rolnk.am{color:#92400e;background:var(--amber-soft);border-color:#fde68a}
.sech{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.blk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12.5px}
.blk .ic{flex:0 0 16px;color:var(--ink3)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.din{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px;min-height:52px;resize:vertical}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:10px}

.pol{display:grid;grid-template-columns:1fr 150px;gap:11px;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
.pol:last-child{border-bottom:none}
.pol .d{font-size:11.5px;color:var(--ink3);margin-top:2px}
.pol input[type=number]{width:78px;border:1px solid var(--line2);border-radius:7px;padding:5px 8px}
.sw{width:42px;height:23px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;flex:0 0 42px}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}
.sw.on i{left:21px}
.sw.dis{opacity:.4;cursor:not-allowed}

.rolebar{background:#0f172a;color:#cbd5e1;padding:7px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.noacc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px;text-align:center}
.noacc h3{font-size:17px;margin-bottom:9px}
.noacc p{color:var(--ink2);font-size:13px;max-width:560px;margin:0 auto 9px}
/* TKCT-1A (24/9/2026) — tab ① thêm cột «App liên kết» (6 cột); tab ② giữ 5 cột */
.hrow.nsg,.hdrow.nsg{grid-template-columns:1.8fr 1.05fr 1.1fr 1.25fr 1.15fr 1.1fr}
/* TKPH-1A (25/9/2026) — tab ② «Liên kết App phụ huynh»: QR mô phỏng */
.lpqr{display:grid;grid-template-columns:repeat(11,12px);grid-template-rows:repeat(11,12px);border:8px solid #fff;outline:1px solid var(--line)}
.lpqr i{display:block}
.st2+.st2{margin-left:2px}
</style>
</head>

  <b>Chức danh:</b>

  <div class="logo"><span class="mark">DS</span> Dschool</div>

<script>

const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const p2=n=>String(n).padStart(2,'0');
const HOMNAY=new Date(2026,7,29);
const d2s=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();

const ngay=(a,b)=>Math.round((s2d(b)-s2d(a))/86400000);
const truoc=n=>{const d=new Date(HOMNAY);d.setDate(d.getDate()-n);return d2s(d)};
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},3800)}
function closeModal(){$('#mask').classList.remove('on')}
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}
function dlink(m,l){return '<button class="rolnk" data-x="dl" data-m="'+m+'">↗ '+(l||m)+'</button>'}
const vt=t=>{const w=String(t).trim().split(/\s+/);return (w[w.length-2]||'').charAt(0)+(w[w.length-1]||'').charAt(0)};

const NAV=[['NHÂN SỰ',[['M4.1','Hồ sơ nhân sự'],['M4.2','Biến động nhân sự'],['M4.3','Chức danh & Điểm công tác'],['M4.5','Phân công giảng dạy']]],
 ['QUẢN TRỊ',[['M10.1','Hồ sơ năm học'],['M10.2','Cơ cấu tổ chức'],['M10.4','Chức danh & Phân quyền'],
 ['M10.5','Tài khoản & Bảo mật'],['M10.7','Nhật ký hệ thống'],['M10.8','Đồng bộ CSDL ngành']]]];

 {id:'N04',ten:'Phạm Thị Hoa',    ma:'NS004', u:'NS004',dt:'DT3',cd:['PHT phụ trách điểm trường','Tổ phó chuyên môn'],tt:'hd', dn:2},

 {id:'N06',ten:'Trần Thị Bích',   ma:'NS006', u:'NS006',dt:'DT1',cd:[],                                     tt:'nghi',dn:241,lyDo:'Nghỉ hưu — quyết định 92/QĐ-NTT ngày 01/01/2026'},
 {id:'N07',ten:'Trịnh Thị Vân',   ma:'NS007', u:'NS007',dt:'DT1',cd:['Kế toán'],                           tt:'hd', dn:0},
 {id:'N08',ten:'Đỗ Thị Lan',      ma:'NS008', u:'NS008',dt:'DT1',cd:['Văn thư'],                           tt:'hd', dn:1},

 {id:'N11',ten:'Bùi Văn Sơn',     ma:'NS011', u:'NS011',dt:'DT1',cd:['Tổ trưởng chuyên môn','GVCN'],      tt:'khoa',dn:12,lyDo:'Nghi lộ mật khẩu — người dùng báo',boi:'Hồ Thị Cẩm (IT_Admin)',tuNgay:truoc(12)},
 {id:'N12',ten:'Ngô Thị Thu',     ma:'NS012', u:'NS012',dt:'DT1',cd:['Tổ trưởng chuyên môn','GVBM'],       tt:'hd', dn:0},

 {id:'N14',ten:'Lý Thị Nga',      ma:'NS014', u:'NS014',dt:'DT2',cd:['Tổ trưởng chuyên môn','GVCN'],       tt:'hd', dn:1},
 {id:'N15',ten:'Phan Văn Tùng',   ma:'NS015', u:'NS015',dt:'DT1',cd:['Tổng phụ trách Đội','GVBM'],        tt:'hd', dn:2},

 return a.map(l=>'<span class="st2 '+(l.tt==='hieu_luc'?'o':'gr')+'" title="'+esc(l.tk)+' · '+LPNGUON[l.nguon]+(l.tt==='da_khoa'?' · đang khóa':'')+'">'+(l.tt==='da_khoa'?'🔒 ':'')+LPQH[l.qh]+'</span>').join(' ')}
function lpLinkCell(h){const k=lpLinkCua(h.id),n=t=>k.filter(x=>x.tt===t).length,r=[];
 if(n('cho_dung'))r.push('<span class="st2 b">'+n('cho_dung')+' chờ dùng</span>');
 if(n('cho_duyet'))r.push('<span class="st2 v">'+n('cho_duyet')+' chờ duyệt</span>');
 if(n('het_han'))r.push('<span class="st2 w">'+n('het_han')+' hết hạn</span>');
 return r.join(' ')||'<span style="color:var(--ink3)">—</span>'}
function lpDau(h){const r=[];if(LPGC[h.id])r.push('<span title="Có ghi chú của học sinh">📝</span>');
 if(lpSdtDoi(h))r.push('<span class="st2 w">⚠ SĐT đổi</span>');if(lpNgoai(h))r.push('<span class="st2 v">🟠 ngoài hồ sơ</span>');
 if(h.tt==='roi')r.push('<span class="st2 gr">đã rời trường</span>');
 if(lpDangKhoa(h))r.push('<span class="st2 gr">🔒 đang khóa</span>');if(lpDangAn(h))r.push('<span class="st2 n" title="Cờ của phụ huynh — trường chỉ đọc">🙈 PH đang ẩn</span>');return r.join(' ')}
function lpTab(){
 if(!lpCo('x'))return '<div class="noacc"><h3>🚫 '+esc(R().ten)+' không có quyền ở tab này</h3></div>';
 const a=lpLoc();
 let h='<div class="stage'+(lpCur?' open':'')+'"><div class="listw">'+
  '<div class="hdrow"><div>Học sinh</div><div>Liên kết</div><div class="hcol">Link đã phát</div><div class="hcol">SĐT hồ sơ 🔗 M1.1</div><div class="hcol">Dấu</div></div>';
 if(!a.length)h+='<div class="empty">Không có học sinh nào khớp bộ lọc.</div>';
 const row=x=>'<div class="hrow'+(lpCur===x.id?' on':'')+(lpChuaLk(x)?' warn':'')+'" data-x="lpMo" data-hs="'+x.id+'">'+
   '<div class="who2"><div class="ava2">'+esc(vt(x.ten))+'</div><div class="i"><b>'+esc(x.ten)+'</b><span>'+x.ma+' · lớp '+x.lop+'</span></div></div>'+
   '<div style="font-size:11.5px">'+lpQhCell(x)+'</div>'+
   '<div class="hcol" style="font-size:11.5px">'+lpLinkCell(x)+'</div>'+
   '<div class="hcol mono" style="font-size:11px">'+['cha','me','giam_ho'].map(k=>x.sdt[k]?(k==='cha'?'C ':k==='me'?'M ':'GH ')+lpChe(x.sdt[k][1]):'').filter(Boolean).join('<br>')+'</div>'+
   '<div class="hcol" style="font-size:11.5px">'+lpDau(x)+'</div></div>';
 if(q){a.forEach(x=>{h+=row(x)})}
 else Object.keys(DT).forEach(d=>{const b=a.filter(x=>x.dt===d);if(!b.length)return;
  h+='<div class="grow">'+DT[d]+'<span class="ct">'+b.length+' học sinh</span></div>';
  b.map(x=>x.lop).filter((v,i,s)=>s.indexOf(v)===i).sort().forEach(l=>{
   h+='<div class="grow" style="background:#fff;font-weight:600;color:var(--ink2);padding-left:24px">Lớp '+l+'</div>';
   b.filter(x=>x.lop===l).forEach(x=>{h+=row(x)})})});
 h+='</div>'+(lpCur?lpPanel():'')+'</div>';
 return h}

/* ===== PANEL MỘT HỌC SINH (tầng 2) ===== */
function lpPanel(){
 const x=lpHs(lpCur),f=(k,v)=>'<div class="f"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
 let h='<div class="panel"><div class="ph2"><div class="n"><h2>'+esc(x.ten)+'</h2><div class="m"><span class="pill">'+x.ma+'</span><span class="pill">lớp '+x.lop+'</span><span class="pill">'+DT[x.dt]+'</span>'+
  (x.tt==='roi'?'<span class="st2 gr">đã rời trường — '+esc(x.roi)+'</span>':'<span class="st2 o">đang học</span>')+'</div></div>'+
  '<div class="spacer"></div><button class="btn sm" data-x="lpDong">✕</button></div><div class="pbody">';
 if(x.tt==='roi')h+='<div class="ro">Em đã rời trường ⇒ liên kết chuyển <b>chỉ đọc</b> <i>(học bạ · giấy tờ · lịch sử tài chính)</i>, ⛔ ngắt — §4.3 · <code>HDLP</code> ③. ⛔ Tạo link mới cho em đã rời trường.</div>';
 if(LPGC[x.id]&&lpDocGC())h+='<div class="danger">📝 <b>Em này có ghi chú</b> — đọc thẻ ④ trước khi cấp link. Tạo link sẽ bắt tích «đã đọc ghi chú».</div>';
 /* ① SĐT hồ sơ */
 h+='<div class="card"><div class="ch">① SĐT trong hồ sơ 🔗 chỉ đọc<span class="sp" style="flex:1"></span>'+dlink('M1.1','sửa ở M1.1')+'</div>';
 ['cha','me','giam_ho'].forEach(k=>{const o=x.sdt[k];
  if(!o){h+=f(LPQH[k],'<span style="color:var(--ink3)">— ô trống</span>');return}
  const da=lpDaLkSo(x.id,o[1]),song=lpLinkCua(x.id).filter(l=>l.sdt===o[1]&&(l.tt==='cho_dung'||l.tt==='cho_duyet'))[0];
  let nut='';
  if(da)nut='<span class="st2 o">✓ đã liên kết</span>';
  else if(lpKhoaSo(x.id,o[1]))nut='<span class="st2 gr">🔒 liên kết đang khóa — mở / ngắt ở thẻ ②</span>';
  else if(x.tt!=='hoc')nut='';
  else if(lpCo('t'))nut='<button class="btn xs p" data-x="lpTao" data-hs="'+x.id+'" data-qh="'+k+'">🔗 Tạo link</button>'+(song?' <span class="st2 b">có link '+LPLINKTT[song.tt][0]+' — tạo mới sẽ hủy link cũ</span>':'');
  h+=f(LPQH[k],esc(o[0])+' · <span class="mono">'+lpChe(o[1])+'</span> '+nut)});
 h+='</div>';
 /* ② Liên kết */
 const lk=LPLK.filter(l=>l.hs===x.id);
 h+='<div class="card"><div class="ch">② Liên kết<span class="sp" style="flex:1"></span><span class="st2 n">'+lpLkSong(x.id).length+'</span></div>';
 if(!lk.length)h+='<div style="padding:10px 12px;color:var(--ink3);font-size:12.5px">Chưa có tài khoản App nào liên kết với em này.</div>';
 lk.forEach(l=>{const kem=LPLINK.filter(k=>k.ngatKem===l.id&&k.tt==='cho_dung')[0];
  h+='<div class="f"><div class="k">'+LPQH[l.qh]+'</div><div class="v"><b>'+esc(l.tk)+'</b> <span class="mono">'+lpChe(l.sdt)+'</span>'+
   ' <span class="st2 n">'+LPNGUON[l.nguon]+'</span> <span class="st2 '+LPLKTT[l.tt][1]+'">'+LPLKTT[l.tt][0]+'</span>'+
   '<span style="font-weight:400;color:var(--ink3);font-size:11.5px">từ '+l.tu+(l.chiDoc?' · chỉ đọc từ '+esc(l.chiDoc):'')+'</span>'+
   (l.ly?'<div style="font-weight:400;font-size:11.5px;color:var(--ink2);width:100%">Lý do: <i>'+esc(l.ly)+'</i></div>':'')+
   (l.ngat?'<div style="font-weight:400;font-size:11.5px;color:var(--red);width:100%">Ngắt '+l.ngat.luc+' · '+esc(l.ngat.boi)+' · '+({doi_tai_khoan:'đổi tài khoản',tai_khoan_da_xoa:'tài khoản App đã xóa (công ty báo)'}[l.ngat.ly]||'nhà trường ngắt')+(l.ngat.ghi?' — <i>'+esc(l.ngat.ghi)+'</i>':'')+'</div>':'')+
   (l.tt==='da_khoa'&&l.khoa?'<div style="font-weight:400;font-size:11.5px;color:var(--ink2);width:100%">🔒 Khóa '+l.khoa.luc+' · '+esc(l.khoa.boi)+' · lý do <b>nội bộ</b>: <i>'+esc(l.khoa.ly)+'</i> <span class="st2 gr">⛔ lên App</span></div>':'')+
   ((l.tt==='hieu_luc'||l.tt==='chi_doc')&&LPAN[l.id]?'<div style="width:100%"><span class="st2 n" title="Cờ an_tren_app của phụ huynh — lưu ở liên kết; trường chỉ đọc, ⛔ nhật ký (HDLP ⑧b)">🙈 Phụ huynh đang ẩn em này trên App — từ '+LPAN[l.id]+' · vẫn tính «đã liên kết»</span></div>':'')+
   (kem?'<div style="width:100%"><span class="st2 w">⏳ sẽ ngắt khi link '+kem.ma+' được dùng</span></div>':'')+
   ((l.tt==='hieu_luc'||l.tt==='chi_doc')&&lpCo('s')?' <button class="btn xs" data-x="lpKhoa" data-lk="'+l.id+'">🔒 Khóa</button>':'')+
   (l.tt==='da_khoa'&&lpCo('s')?' <button class="btn xs p" data-x="lpMoKhoa" data-lk="'+l.id+'">🔓 Mở khóa</button>':'')+
   ((l.tt==='hieu_luc'||l.tt==='chi_doc'||l.tt==='da_khoa')&&lpCo('s')?' <button class="btn d xs" data-x="lpNgat" data-lk="'+l.id+'">⛓ Ngắt liên kết</button>':'')+
   (l.tt!=='da_ngat'?' <button class="btn xs" data-x="lpXoaTK" data-lk="'+l.id+'" title="Demo — mô phỏng phía công ty (HDLP ⑧c)">▶ Mô phỏng: công ty báo tài khoản đã xóa</button>':'')+'</div></div>'});
 h+='</div>';
 /* ③ Link đã phát */
 const ks=lpLinkCua(x.id);
 h+='<div class="card"><div class="ch">③ Link đã phát<span class="sp" style="flex:1"></span><span class="st2 n">'+ks.length+'</span></div>';
 if(!ks.length)h+='<div style="padding:10px 12px;color:var(--ink3);font-size:12.5px">Chưa phát link nào.</div>';
 ks.forEach(k=>{const b=[];
  if(k.tt==='cho_dung'){b.push('<button class="btn xs" data-x="lpQR" data-k="'+k.id+'">👁 Xem QR</button>','<button class="btn xs" data-x="lpChep" data-k="'+k.id+'">⧉ Chép link</button>');
   if(lpCo('t'))b.push('<button class="btn xs" data-x="lpHuy" data-k="'+k.id+'">✕ Hủy</button>');
   b.push('<button class="btn xs" data-x="lpDung" data-k="'+k.id+'" title="Demo — mô phỏng phía App">▶ Mô phỏng: phụ huynh xác nhận</button>')}
  if(k.tt==='cho_duyet'&&lpCo('d'))b.push('<button class="btn xs p" data-x="lpDuyet" data-k="'+k.id+'">✓ Duyệt</button>','<button class="btn xs" data-x="lpTuChoi" data-k="'+k.id+'">✕ Từ chối</button>');
  if((k.tt==='het_han'||k.tt==='huy')&&lpCo('t')&&x.tt==='hoc'&&!(k.sdt&&lpDaLkSo(x.id,k.sdt))&&k.nguon!=='tai_cho')b.push('<button class="btn xs" data-x="lpCapLai" data-k="'+k.id+'">↻ Cấp lại</button>');
  h+='<div class="f"><div class="k"><span class="mono">'+k.ma+'</span></div><div class="v"><span class="st2 '+LPLINKTT[k.tt][1]+'">'+LPLINKTT[k.tt][0]+'</span>'+
   ' <span class="st2 n">'+LPNGUON[k.nguon]+'</span> <span class="mono">'+(k.sdt?lpChe(k.sdt):'không gắn số')+'</span>'+
   '<span style="font-weight:400;color:var(--ink3);font-size:11.5px">tạo '+k.tao+' · hạn '+k.het+' · '+esc(k.boi||'')+'</span>'+
   (k.ly?'<div style="font-weight:400;font-size:11.5px;color:var(--ink2);width:100%">Lý do: <i>'+esc(k.ly)+'</i></div>':'')+
   (k.ngatKem?'<div style="width:100%"><span class="st2 w">kèm ngắt liên kết cũ khi được dùng</span></div>':'')+
   (b.length?'<div style="width:100%;display:flex;gap:5px;flex-wrap:wrap">'+b.join('')+'</div>':'')+'</div></div>'});
 h+='</div>';
 /* ④ Ghi chú */
 const g=LPGC[x.id];
 if(!lpDocGC())h+='<div class="card"><div class="ch">④ Ghi chú của học sinh</div><div class="ro" style="margin:9px 12px">🔒 Ghi chú chỉ <b>Văn thư · Hiệu trưởng · PHT phụ trách điểm trường</b> đọc <i>(HDLP bản 2 ⑩ — U-1)</i>. '+esc(R().ten)+' ⛔ thấy nội dung.</div></div>';
 else h+='<div class="card"><div class="ch">④ Ghi chú của học sinh <span class="st2 gr">chỉ VT · HT · PHT phụ trách điểm trường đọc</span></div><div style="padding:9px 12px;font-size:12.5px">'+
  (g?'<div>'+esc(g.nd)+'</div><div style="color:var(--ink3);font-size:11.5px;margin-top:4px">Sửa '+g.luc+' · '+esc(g.boi)+(g.ls.length?' · '+g.ls.length+' bản trước':'')+'</div>'+
   (g.ls.length?'<div style="margin-top:6px;font-size:11.5px;color:var(--ink2)"><b>Lịch sử</b><br>'+g.ls.map(o=>o.luc+' · '+esc(o.boi)+': <s>'+esc(o.nd)+'</s>').join('<br>')+'</div>':'')
   :'<span style="color:var(--ink3)">Không có ghi chú.</span>')+
  '<div style="font-size:11.5px;color:var(--ink3);margin-top:6px">⛔ lên App · ⛔ vào báo cáo · ⛔ vào tệp xuất · ⛔ chiếu sang M1.1</div></div>'+
  (lpCo('s')?'<div class="cact"><button class="btn xs" data-x="lpGC" data-hs="'+x.id+'">✎ '+(g?'Sửa':'Thêm')+' ghi chú</button></div>':'')+'</div>';
 /* ⑤ Thao tác khác */
 if(x.tt==='hoc'&&lpCo('t'))h+='<div class="card"><div class="ch">⑤ SĐT không có trong hồ sơ</div><div class="cact">'+
  '<button class="btn xs" data-x="lpTC" data-hs="'+x.id+'">✍ Link thủ công</button><button class="btn xs" data-x="lpTaiCho" data-hs="'+x.id+'">🎫 Mã tại chỗ</button>'+
  '<span style="font-size:11.5px;color:var(--ink2)">Lý do <b>bắt buộc</b>'+(LPDUYET?' · link thủ công <b>chờ HT / PHT duyệt</b>':' · công tắc duyệt đang <b>tắt</b>')+'</span></div></div>';
 /* ⑥ Lịch sử */
 const ls=LPLOG.filter(o=>o.hs===x.id);
 if(ls.length)h+='<div class="card"><div class="ch">⑥ Lịch sử</div><div style="padding:8px 12px;font-size:11.5px;color:var(--ink2)">'+
  ls.map(o=>o.gio+' · <b>'+LPSK[o.sk]+'</b> · '+esc(o.ai)+(o.them?' · <i>'+esc(o.them)+'</i>':'')).join('<br>')+'</div></div>';
 return h+'</div></div>'}

/* ===== HỘP TẠO LINK — dùng chung ba đường ===== */
function lpKhoiGC(hs){const g=LPGC[hs];if(!g)return '';
 return '<div class="danger">📝 <b>Ghi chú của học sinh</b><div style="margin-top:5px">'+esc(g.nd)+'</div>'+
  '<label style="display:flex;gap:7px;align-items:center;margin-top:8px;font-weight:700"><input type="checkbox" id="lpDaDoc"> Tôi đã đọc ghi chú của học sinh</label>'+
  '<div style="font-weight:400;font-size:11.5px;margin-top:4px">Đây là <b>cảnh báo, ⛔ không phải chặn</b> — trường ⛔ có thẩm quyền tước quyền của cha mẹ; người cấp link đọc rồi tự quyết, và <b>có vết</b> mình đã đọc.</div></div>'}
function lpDaDocOk(hs){if(!LPGC[hs])return true;const c=$('#lpDaDoc');return !!(c&&c.checked)}
function lpHuyCu(hs,sdt){LPLINK.filter(k=>k.hs===hs&&k.sdt===sdt&&(k.tt==='cho_dung'||k.tt==='cho_duyet')).forEach(k=>{k.tt='huy';lpGhi(hs,'huy_link','thay bằng link mới · '+k.ma)})}
function lpTaoLink(hs,nguon,sdt,o){o=o||{};
 if(sdt)lpHuyCu(hs,sdt);
 const cho=(nguon==='thu_cong'&&LPDUYET);
 const k={id:'lk-'+(++LPSEQ),hs:hs,ma:lpMa(),nguon:nguon,sdt:sdt||null,tao:d2s(HOMNAY),het:nguon==='tai_cho'?d2s(HOMNAY)+' +15 phút':lpSau(7),
  tt:cho?'cho_duyet':'cho_dung',boi:lpAi(),ly:o.ly||'',ngatKem:o.ngatKem||'',tk:o.tk||''};
 if(LPGC[hs]){k.daDoc={boi:lpAi(),luc:lkGio()};lpGhi(hs,'doc_ghi_chu','trước khi tạo link '+k.ma)}
 LPLINK.push(k);
 lpGhi(hs,'tao_link',{ho_so_cha:'đường ① · SĐT cha',ho_so_me:'đường ① · SĐT mẹ',ho_so_giam_ho:'đường ① · SĐT giám hộ',thu_cong:'đường ② link thủ công',tai_cho:'đường ③ mã tại chỗ'}[nguon]+(o.ly?' · lý do: '+o.ly:'')+(cho?' · chờ duyệt':''));
 return k}
function lpLkCuCungQh(hs,qh,sdt){return LPLK.filter(l=>l.hs===hs&&l.tt==='hieu_luc'&&l.qh===qh&&l.sdt!==sdt)[0]}
function mLpTao(hs,qh){const x=lpHs(hs),o=x.sdt[qh],cu=lpLkCuCungQh(hs,qh,o[1]);
 modal('🔗 Tạo link liên kết — '+esc(x.ten)+' · '+LPQH[qh],
  lpKhoiGC(hs)+
  '<div class="info">Link gắn <b>một học sinh × một SĐT</b>: <b>'+esc(o[0])+'</b> · <span class="mono">'+o[1]+'</span> <i>(ô '+LPQH[qh]+' trong hồ sơ)</i>. '+
  'Chỉ tài khoản App <b>đúng số này</b> đổi được. Hạn <b>7 ngày</b>, <b>dùng một lần</b>.</div>'+
  (cu?'<div class="warn">Em đang có liên kết <b>'+LPQH[qh]+'</b> với tài khoản <b>'+esc(cu.tk)+'</b> · SĐT <span class="mono">'+lpChe(cu.sdt)+'</span> — khác số hồ sơ hiện tại.'+
   '<label style="display:flex;gap:7px;align-items:center;margin-top:6px;font-weight:700"><input type="checkbox" id="lpNgatKem" checked> Ngắt liên kết cũ SĐT '+lpChe(cu.sdt)+' khi link mới được dùng</label>'+
   '<div style="font-size:11.5px;margin-top:3px">Ngắt <b>đúng lúc link mới đổi thành công</b>, ⛔ lúc tạo — ⛔ có khoảng trống không ai xem được <i>(HDLP ⑤ mục 3)</i>.</div></div>':'')+
  '<div class="ro">🛑 Hệ thống <b>⛔ tự gửi</b> SMS / Zalo. Tạo xong: chép link, cho quét QR, hoặc xuất / in để trường tự gửi.</div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="lpTaoOk" data-hs="'+hs+'" data-qh="'+qh+'">🔗 Tạo link</button>')}
function mLpTC(hs){const x=lpHs(hs);
 modal('✍ Link thủ công — '+esc(x.ten),
  lpKhoiGC(hs)+
  '<div class="info">Cho <b>SĐT KHÔNG có trong hồ sơ</b> — bố mẹ làm xa, người trông em <i>(PH9)</i>. Căn cứ của trường là <b>văn thư xác minh trực tiếp</b> + <b>lý do</b> <i>(TK-0b)</i>.</div>'+
  '<label class="lbl">SĐT <b>*</b></label><input class="din" id="lpSdt" placeholder="09…">'+
  '<label class="lbl">Họ tên người nhận</label><input class="din" id="lpTen">'+
  '<label class="lbl">Lý do — đã xác minh thế nào <b>*</b></label><textarea class="ta" id="lpLy"></textarea>'+
  (LPDUYET?'<div class="warn">⚙ Công tắc duyệt đang <b>BẬT</b> ⇒ link sinh ở <b>chờ duyệt</b>; HT hoặc PHT phụ trách điểm trường duyệt rồi mới dùng / xuất được.</div>'
   :'<div class="ro">⚙ Công tắc duyệt đang <b>TẮT</b> <i>(mặc định)</i> ⇒ link dùng được <b>ngay</b>.</div>'),
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="lpTCOk" data-hs="'+hs+'">✍ Tạo link thủ công</button>')}
function mLpTaiCho(hs){const x=lpHs(hs);
