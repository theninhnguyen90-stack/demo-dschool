<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10.5 Tài khoản &amp; Bảo mật — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.main{flex:1;padding:12px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.lk{opacity:.6;cursor:help;background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:8px 0 0;flex-wrap:wrap;align-items:flex-end}
.tab1{padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:6px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tfil{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:5px;flex-wrap:wrap}

.scope{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:7px 12px;font-size:12px;color:var(--ink2);margin:8px 0 9px;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.inp{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:#fff;min-width:180px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hrow{display:grid;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:1.9fr 1.15fr 1.1fr 1.3fr 1.5fr}
.stage.open .hrow{grid-template-columns:1.9fr 1.2fr}
.stage.open .hcol{display:none}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.warn{background:#fffdf5}
.hdrow{display:grid;gap:9px;padding:7px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:1.9fr 1.15fr 1.1fr 1.3fr 1.5fr}
.stage.open .hdrow{grid-template-columns:1.9fr 1.2fr}
.stage.open .hdrow div.hcol{display:none}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:31px;height:31px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 31px}
.ava2.ph{background:#fce7f3;color:#9d174d}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}
.st2.gr{background:#f1f5f9;color:#64748b}

.ph2{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph2 .n h2{font-size:15px;font-weight:700}
.ph2 .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:13px 15px;max-height:calc(100vh - 220px);overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.f{display:grid;grid-template-columns:140px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:12.5px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2)}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.rolnk.rd{color:#991b1b;background:var(--red-soft);border-color:#fecaca}
.rolnk.am{color:#92400e;background:var(--amber-soft);border-color:#fde68a}
.sech{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.blk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12.5px}
.blk .ic{flex:0 0 16px;color:var(--ink3)}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.din{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px;min-height:52px;resize:vertical}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:10px}

.pol{display:grid;grid-template-columns:1fr 150px;gap:11px;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
.pol:last-child{border-bottom:none}
.pol .d{font-size:11.5px;color:var(--ink3);margin-top:2px}
.pol input[type=number]{width:78px;border:1px solid var(--line2);border-radius:7px;padding:5px 8px}
.sw{width:42px;height:23px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;flex:0 0 42px}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}
.sw.on i{left:21px}
.sw.dis{opacity:.4;cursor:not-allowed}

.rolebar{background:#0f172a;color:#cbd5e1;padding:7px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.noacc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px;text-align:center}
.noacc h3{font-size:17px;margin-bottom:9px}
.noacc p{color:var(--ink2);font-size:13px;max-width:560px;margin:0 auto 9px}
</style>
</head>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>

</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Tài khoản &amp; Bảo mật</h1><div class="spacer"></div>
      <button class="btn sm" data-x="ghiChu">💡 Ghi chú thiết kế</button>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const p2=n=>String(n).padStart(2,'0');
const HOMNAY=new Date(2026,7,29);
const d2s=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
const s2d=s=>{const a=s.split('/').map(Number);return new Date(a[2],a[1]-1,a[0])};
const ngay=(a,b)=>Math.round((s2d(b)-s2d(a))/86400000);
const truoc=n=>{const d=new Date(HOMNAY);d.setDate(d.getDate()-n);return d2s(d)};
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},3800)}
function closeModal(){$('#mask').classList.remove('on')}
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}
function dlink(m,l){return '<button class="rolnk" data-x="dl" data-m="'+m+'">↗ '+(l||m)+'</button>'}
const vt=t=>{const w=String(t).trim().split(/\s+/);return (w[w.length-2]||'').charAt(0)+(w[w.length-1]||'').charAt(0)};

const NAV=[['NHÂN SỰ',[['M4.1','Hồ sơ nhân sự'],['M4.2','Biến động nhân sự'],['M4.3','Chức danh & Điểm công tác'],['M4.5','Phân công giảng dạy']]],
 ['QUẢN TRỊ',[['M10.1','Hồ sơ năm học'],['M10.2','Cơ cấu tổ chức'],['M10.4','Chức danh & Phân quyền'],
 ['M10.5','Tài khoản & Bảo mật'],['M10.7','Nhật ký hệ thống'],['M10.8','Đồng bộ CSDL ngành']]]];

/* ===== NHÂN SỰ + TÀI KHOẢN ===== */

let NS=[
 {id:'N01',ten:'Nguyễn Thị Hạnh', ma:'NS001', u:'NS001',dt:'DT1',cd:['Hiệu trưởng'],                     tt:'hd', dn:0},
 {id:'N02',ten:'Trần Văn Minh',   ma:'NS002', u:'NS002',dt:'DT1',cd:['Phó HT Chuyên môn','GVBM'],         tt:'hd', dn:0},
 {id:'N03',ten:'Lê Văn Dũng',     ma:'NS003', u:'NS003',dt:'DT2',cd:['PHT phụ trách điểm trường'],        tt:'hd', dn:1},
 {id:'N04',ten:'Phạm Thị Hoa',    ma:'NS004', u:'NS004',dt:'DT3',cd:['PHT phụ trách điểm trường','Tổ phó chuyên môn'],tt:'hd', dn:2},
 {id:'N05',ten:'Hoàng Văn Nam',   ma:'NS005', u:'NS005',dt:'DT1',cd:['Tổ chức nhân sự'],                   tt:'hd', dn:0},
 {id:'N06',ten:'Trần Thị Bích',   ma:'NS006', u:'NS006',dt:'DT1',cd:[],                                     tt:'nghi',dn:241,lyDo:'Nghỉ hưu — quyết định 92/QĐ-NTT ngày 01/01/2026'},
 {id:'N07',ten:'Trịnh Thị Vân',   ma:'NS007', u:'NS007',dt:'DT1',cd:['Kế toán'],                           tt:'hd', dn:0},
 {id:'N08',ten:'Đỗ Thị Lan',      ma:'NS008', u:'NS008',dt:'DT1',cd:['Văn thư'],                           tt:'hd', dn:1},

 {id:'N12',ten:'Ngô Thị Thu',     ma:'NS012', u:'NS012',dt:'DT1',cd:['Tổ trưởng chuyên môn','GVBM'],       tt:'hd', dn:0},

 {id:'N14',ten:'Lý Thị Nga',      ma:'NS014', u:'NS014',dt:'DT2',cd:['Tổ trưởng chuyên môn','GVCN'],       tt:'hd', dn:1},
 {id:'N15',ten:'Phan Văn Tùng',   ma:'NS015', u:'NS015',dt:'DT1',cd:['Tổng phụ trách Đội','GVBM'],        tt:'hd', dn:2},
 {id:'N16',ten:'Trương Thị Quỳnh',ma:'NS016', u:'NS016',dt:'DT1',cd:['Thư viện'],                          tt:'cho',dn:-1,tao:truoc(38)},

});

 if(t.dataset.pol){POL[t.dataset.pol]=+t.value||0;POLDIRTY[t.dataset.pol]=1;
  const v=t.value,k=t.dataset.pol;render();
  const n=document.querySelector('[data-pol="'+k+'"]');if(n){n.focus();n.value=v}return}
