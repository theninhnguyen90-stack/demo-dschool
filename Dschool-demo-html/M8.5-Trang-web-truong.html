<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M8.5 Trang web trường — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.cell{width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;text-align:right;font:inherit;font-size:12.5px}
.cell:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:6px;border-radius:1px;display:block}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.mini{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:12px}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}


/* ══════════ riêng M8.5 ══════════ */
.mu{color:var(--ink3);font-weight:400}

function d2(s){if(!s)return '';const p=s.slice(0,10).split('-');return (+p[2])+'/'+(+p[1])}
function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function laNLV(x){const w=x.getDay();return w>0&&w<6&&!NGHI.includes(iso(x))}
/* cộng n ngày làm việc (Đ15 k1a — «chậm nhất sau 10 ngày làm việc»), bỏ Thứ Bảy, Chủ nhật, ngày nghỉ M10.9 */
function congNLV(d,n){const x=new Date(d+'T00:00');let k=0;while(k<n){x.setDate(x.getDate()+1);if(laNLV(x))k++}return iso(x)}
/* số ngày làm việc từ a (tính cả a nếu là ngày làm việc) đến b */
function demNLV(a,b){const x=new Date(a+'T00:00'),y=new Date(b+'T00:00');let k=0;while(x<=y){if(laNLV(x))k++;x.setDate(x.getDate()+1)}return k}

 const txt=b.ten+' '+b.tomtat+' '+b.nd;

 if(RE_NS.test(txt))chan.push({ma:'C6',m:'Nội dung có cụm <b>«ngày sinh / sinh ngày»</b> — không đăng ngày sinh học sinh lên web công khai',o:'f-nd'});
 if(['nhap','cho'].includes(b.tt)&&b.lich&&b.lich<NOW)chan.push({ma:'C7',m:'Giờ hẹn đăng <b>'+d2s(b.lich)+'</b> đã qua — chọn lại giờ',o:'f-lich'});
 const tn=tenTrongBai(b);
 if(tn.length)canh.push({ma:'W1',m:'Máy nhận ra <b>'+tn.length+' tên học sinh</b>: '+tn.map(k=>esc(HS[k].ten)).join(', ')+'. <span class="mu">Máy không đọc được tên viết khác, tên trong ảnh chụp văn bản, tên trong tệp đính kèm.</span>'});
 b.tep.forEach(t=>{if(/danh[-_ ]?sach|ket[-_ ]?qua|\bDS\b/i.test(t.ten))canh.push({ma:'W2',m:'Tệp <b>'+esc(t.ten)+'</b> có vẻ là danh sách / kết quả — rà dữ liệu cá nhân trước khi đăng'})});

 return {chan:chan,canh:canh,ten:tn};
}

function dayRa(b,luc){
 if(BN.dich==='goi'){b.tt='xacnhan';ghiLS(b,'Đến giờ đăng — đã dựng gói bài, chờ người dán lên website của trường','sys');return}
 if(!BN.ham){b.tt='dayq';ghiLS(b,'Đến giờ đăng — đường hầm không phản hồi, bài vào hàng đợi chờ đẩy','sys');return}
 b.tt='dang';b.dang=luc||NOW;ghiLS(b,BN.dich==='cms'?'Website của trường trả lời đã tạo bài':'Trang công khai xác nhận đã đăng','sys');
 /* Sửa một bên thì bên kia mang cờ lệch — §13.3 điểm 1 (W7) */
 if(b.lk&&b.v>1){b.lk.lech=HOMNAY;b.lk.mien=null;ghiLS(b,'⚠ Bản trên Bảng tin App '+b.lk.ma+' nay lệch với bản web này','sys')}
 BAI.filter(x=>x.id===b.id&&x.v<b.v&&x.tt==='dang').forEach(x=>{x.tt='thay';x.thayBoi=b.v;ghiLS(x,'Đã thay bằng phiên bản '+b.v+(x.cm==='ck'?' — bản này vào Lưu trữ công khai (Đ15 k2)':''),'sys')});

function coBai(b){

 if(kt.ten.length)f.push('<span class="tg b" title="Có tên học sinh">👤 '+kt.ten.length+' tên HS</span>');
 if(b.muc){const s=ttMuc(muc(b.muc));f.push('<span class="tg '+(s.k==='qh'?'r':'a')+'">📋 '+esc(muc(b.muc).can)+(s.k==='qh'?' · quá hạn':s.k==='cn'?' · hạn '+d2(s.han):'')+'</span>')}
 if(b.ghim&&b.tt==='dang')f.push('<span class="tg a">📌 ghim</span>');
 if(coAnhAn(b)&&b.tt==='dang')f.push('<span class="tg b">🙈 ảnh đã ẩn</span>');
 /* Cờ lệch nằm TRÊN DÒNG, không chỉ trong panel (§13.3 điểm 1 — W7) */
 if(b.lk){f.push('<span class="tg c">⧉ App '+esc(b.lk.ma)+'</span>');
  if(b.lk.lech&&!b.lk.mien)f.push('<span class="tg r">⚠ Bản kia đã đổi '+d2(b.lk.lech)+'</span>');
  if(b.lk.mien)f.push('<span class="tg a">✓ không cần đồng bộ</span>')}
 const bm=banMoi(b);if(bm&&b.tt==='dang')f.push('<span class="tg b">v'+bm.v+' '+ttBai(bm)[0].toLowerCase()+'</span>');
 if(b.v>1&&b.tt!=='dang')f.push('<span class="tg c">phiên bản '+b.v+'</span>');

 return f.join(' ');
}

mfns.bxuatok=()=>{if(!$('#xmd').value){toast('⛔ Chọn mục đích xuất');return}closeM();toast('⬇ Đã xuất — ghi audit: '+esc(ME().ten)+' · mục đích «'+esc($('#xmd').value)+'»')};

/* ══════════════ PANEL MỘT BÀI ══════════════ */
function nguoiDuyet(){return ['duc','lan'].filter(x=>x!==meId()).map(x=>esc(ten(x))+' <span class="mu">('+NG[x].cd+')</span>').join(' · ')}
function panelBai(b){
 const kt=kiemTra(b),toi=b.tacgia===meId(),laD=b.tt==='cho'&&coQ('cho','D')&&!toi;
 let h='<div class="ph"><div class="n"><h2>'+esc(b.ten)+'</h2><div class="m">'+pillTT(b)+'<span class="pill">'+b.id+' · phiên bản '+b.v+'</span><span class="pill">'+esc(tenCM(b.cm))+'</span><span class="pill">'+esc(tenDT(b))+'</span></div></div><div class="spacer"></div><button class="btn sm" data-a="dong">✕</button></div><div class="pbody">';
 if(b.tra&&b.tt==='nhap')h+='<div class="alert r">↩<span class="sp"><b>Bị trả lại</b> — '+esc(ten(b.tra.ai))+', '+d2s(b.tra.luc)+': «'+esc(b.tra.gc)+'»</span></div>';
 if(b.tuchoi)h+='<div class="alert r">✕<span class="sp"><b>Từ chối</b> — '+esc(ten(b.tuchoi.ai))+', '+d2s(b.tuchoi.luc)+': «'+esc(b.tuchoi.ly)+'»</span></div>';
 if(b.go)h+='<div class="alert r">⤓<span class="sp"><b>Đã gỡ khỏi web</b> — '+esc(ten(b.go.ai))+', '+d2s(b.go.luc)+' · lý do <b>'+esc(b.go.ly)+'</b>'+(b.go.ct?': «'+esc(b.go.ct)+'»':'')+'. Bản ghi giữ nguyên ở máy trường; đích đã nhận lệnh xóa.</span></div>';
 if(b.tt==='thay')h+='<div class="ro">Bản này đã được thay bằng <b>phiên bản '+b.thayBoi+'</b>'+(b.cm==='ck'?' — vẫn xem được trên web ở <b>Lưu trữ công khai</b> (Đ15 k2: lưu tối thiểu 5 năm).':'.')+'</div>';
 b.anh.forEach((a,i)=>{if(a.an)h+='<div class="alert w">🙈<span class="sp"><b>Ảnh '+(i+1)+' đã ẩn khỏi web theo phản ánh</b> — '+esc(ten(a.an.ai))+', '+d2s(a.an.luc)+' · nguồn <b>'+esc(a.an.ng)+'</b>'+(a.an.ma?' '+esc(a.an.ma):'')+' · «'+esc(a.an.ly)+'». Muốn thay ảnh khác: <b>✎ Sửa → phiên bản mới</b>.</span></div>'});
 /* ── CẦU SAO CHÉP: bản kia + cờ lệch (§13.3) ── */
 if(b.lk){
  const lech=b.lk.lech&&!b.lk.mien;
  h+='<div class="alert '+(lech?'r':'b')+'">⧉<span class="sp"><b>Bài này có một bản trên Bảng tin App</b> — '+esc(b.lk.ma)+', sao ngày '+d2s(b.lk.ngay)+'. '
   +'Hai bản <b>độc lập</b>: hai vòng đời, hai menu chủ — sao chép không đồng bộ chữ nào.'
   +(lech?' <b>⚠ Bản kia đã đổi ngày '+d2s(b.lk.lech)+'</b> — đọc lại rồi quyết, đừng bấm cho hết cờ.':'')
   +(b.lk.mien?' <span class="mu">✓ Đã đánh dấu không cần đồng bộ — '+esc(ten(b.lk.mien.ai))+', '+d2s(b.lk.mien.ngay)+': «'+esc(b.lk.mien.ly)+'»</span>':'')
   +'</span>'+(R().m86?'<button class="btn xs" data-a="mobtapp" data-v="'+b.k+'">↗ Mở bản trên App</button>':'')
   +(lech&&coQ('web','S')?'<button class="btn xs" data-a="mien" data-v="'+b.k+'">✓ Đánh dấu không cần đồng bộ</button>':'')+'</div>';
  if(b.cm==='ck')h+='<div class="ro">⛔ <b>Bản trên App KHÔNG tính cho nghĩa vụ công khai.</b> TT 09/2024 <b>Đ14 k1</b> gắn nghĩa vụ với <b>cổng thông tin điện tử</b>, và Đ15 k2 đòi giữ ở đó tối thiểu 5 năm — bài trên App sống vài tuần và không phải cổng TTĐT. Trạng thái mục công khai vẫn chỉ đọc bài <b>đang hiển thị trên web</b>.</div>';
 }
 const bm=banMoi(b);
 if(bm&&b.tt==='dang')h+='<div class="alert b">🗘<span class="sp"><b>Phiên bản '+bm.v+'</b> đang ở trạng thái «'+ttBai(bm)[0]+'». Bản này <b>vẫn hiển thị</b> tới khi bản mới được duyệt và đích xác nhận.</span><button class="btn xs" data-a="mo" data-v="'+bm.k+'">Mở v'+bm.v+'</button></div>';
 if(b.v>1&&['nhap','cho'].includes(b.tt)&&banDangHien(b.id))h+='<div class="alert b">🗘<span class="sp">Phiên bản <b>'+b.v+'</b> của một bài <b>đang hiển thị</b> — bản '+banDangHien(b.id).v+' vẫn trên web tới khi bản này được duyệt.</span><button class="btn xs" data-a="mo" data-v="'+banDangHien(b.id).k+'">Mở bản đang hiển thị</button></div>';
 if(b.tt==='dayq')h+='<div class="alert w">⏳<span class="sp"><b>Chờ đẩy</b> — đã duyệt, nhưng đích chưa xác nhận. <b>Chưa tính</b> là đã đăng (kể cả cho mục công khai).</span></div>';
 if(b.tt==='xacnhan')h+='<div class="alert w">📦<span class="sp"><b>Chờ xác nhận đã dán</b> — bộ nối ③: máy không biết bài đã lên website của trường chưa, nên chờ người xác nhận kèm đường dẫn.</span></div>';
 if(b.tt==='cho'&&toi)h+='<div class="alert b">C8<span class="sp">Bạn là <b>người soạn</b> bài này — bài phải do người khác có quyền Duyệt: '+nguoiDuyet()+'.</span></div>';
 if(b.muc){const m=muc(b.muc),s=ttMuc(m);h+='<div class="ro">📋 Bài đáp ứng mục công khai <b>«'+esc(m.ten)+'»</b> — '+esc(m.can)+' TT 09/2024 · mục đang: '+pillMuc(s)+(b.tt==='dang'?' · giữ trên web tới <b>'+d2s(themNam(b.dang,5))+'</b>':'')+'</div>'}

 /* hành động */
 const act=[];
 act.push('<button class="btn sm" data-a="xemweb" data-v="'+b.k+'">👁 Xem như trên web</button>');
 if(b.tt==='nhap'&&toi&&coQ('cua','S')){act.push('<button class="btn sm p" data-a="sua" data-v="'+b.k+'">✎ Sửa</button>','<button class="btn sm" data-a="guiduyet" data-v="'+b.k+'">📨 Gửi duyệt</button>');if(!b.dagui)act.push('<button class="btn sm" data-a="xoa" data-v="'+b.k+'">🗑 Xóa nháp</button>')}
 if(b.tt==='cho'&&toi)act.push('<button class="btn sm" data-a="rut" data-v="'+b.k+'">↩ Rút về nháp</button>');
 if(b.tt==='tuchoi'&&toi&&coQ('cua','T'))act.push('<button class="btn sm" data-a="nhanban" data-v="'+b.k+'">⧉ Nhân bản thành bài mới</button>');
 if(b.tt==='lich'&&coQ('web','S'))act.push('<button class="btn sm" data-a="huylich" data-v="'+b.k+'">⏸ Hủy lịch</button>','<button class="btn sm" data-a="dengio" data-v="'+b.k+'">⏩ Mô phỏng: đến giờ đăng</button>');
 if(b.tt==='xacnhan'&&coQ('web','S'))act.push('<button class="btn sm" data-a="goi" data-v="'+b.k+'">📦 Tải gói bài</button>','<button class="btn sm p" data-a="xacnhan" data-v="'+b.k+'">✓ Xác nhận đã đăng</button>');
 if(b.tt==='dang'){
  if(coQ('web','S'))act.push('<button class="btn sm" data-a="ghim" data-v="'+b.k+'">'+(b.ghim?'📌 Bỏ ghim':'📌 Ghim lên trang chủ')+'</button>');
  if((toi&&coQ('cua','S'))||coQ('web','S'))act.push('<button class="btn sm" data-a="phienban" data-v="'+b.k+'">✎ Sửa → phiên bản mới</button>');
  if(coQ('web','XO'))act.push('<button class="btn sm d" data-a="go" data-v="'+b.k+'">⤓ Gỡ khỏi web</button>');
  if(R().m81)act.push('<button class="btn sm" data-a="baoph" data-v="'+b.k+'">↗ Báo phụ huynh qua App (M8.1)</button>');
  /* ⧉ Cầu sao chép web → App (§13.1). D3: chỉ hiện với vai có T ở m8.6.bai_cua_toi */
  if(R().m86)act.push('<button class="btn sm" data-a="saoapp" data-v="'+b.k+'">⧉ Sao sang Bảng tin App (M8.6)</button>');
  else act.push('<span class="mu" style="align-self:center">🔒 <b>Sao sang Bảng tin App</b> — vai '+esc(R().cd)+' không có quyền Tạo bài ở <b>M8.6</b> nên không hiện đường mở (D3)</span>');
 }
 h+='<div class="cact top">'+act.join('')+'</div>';

 /* quyết định duyệt — ngay trong panel, không chuyển tab */
 if(laD){
  const canTick=kt.ten.length>0,tick=!!ST.ra[b.k],khoa=kt.chan.length||(canTick&&!tick);
  h+='<div class="card apv"><div class="ch">⚖ Quyết định duyệt<span class="sp"></span><span class="mu" style="font-weight:400">người soạn: '+esc(ten(b.tacgia))+' · gửi '+d2s(b.gui)+'</span></div><div class="cb" style="padding:10px 12px">'
   +(canTick?'<label class="kchk tick'+(tick?' on':'')+'" data-a="ra" data-v="'+b.k+'">'+(tick?'☑':'☐')+' Tôi đã rà <b>'+kt.ten.length+' tên học sinh</b> trong bài — việc nêu tên là cần thiết và đúng phạm vi</label>':'')
   +(b.pdc&&canTick?'<div class="mu" style="margin:4px 0 0 22px">Người soạn đã xác nhận bài có tên học sinh khi gửi duyệt.</div>':'')
   +(kt.chan.length?'<div class="mu" style="color:var(--red);margin-top:6px">Nút Duyệt khóa — còn '+kt.chan.length+' điều chặn ở khung «Kiểm tra» bên dưới.</div>':(canTick&&!tick?'<div class="mu" style="margin-top:6px">Nút Duyệt khóa tới khi tích ô rà tên học sinh (C11).</div>':''))
   +'</div><div class="cact"><button class="btn g" data-a="duyet" data-v="'+b.k+'"'+(khoa?' disabled':'')+'>✓ Duyệt'+(b.lich&&b.lich>NOW?' — đăng '+d2s(b.lich):' và đăng ngay')+'</button><button class="btn" data-a="tralai" data-v="'+b.k+'">↩ Trả lại</button><button class="btn" data-a="tuchoi" data-v="'+b.k+'">✕ Từ chối</button></div></div>';
 }

 /* khung xem trước */
 h+='<div class="card"><div class="ch">👁 Xem trước như trên web<span class="sp"></span><span class="mu" style="font-weight:400">'+esc(urlDich())+'</span></div><div class="xtwrap">'+webView(b)+'</div>'+ghiChuXemTruoc(b)+'</div>';

 /* kiểm tra */
 if(['nhap','cho'].includes(b.tt))h+=theKiemTra(b,kt);
 h+=theAnh(b,b.tt==='dang'&&(toi||coQ('web','S')));

 /* thông tin */
 const f=(k,v)=>'<div class="f"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
 let tin=f('Chuyên mục',esc(tenCM(b.cm)));
 tin+=f('Điểm trường liên quan',esc(tenDT(b))+' <span class="mu">— nhãn nội dung, không phải quyền</span>');
 tin+=f('Lịch đăng',b.lich?d2s(b.lich):'Đăng ngay khi được duyệt');
 tin+=f('Ghim',b.ghim?'📌 đến '+d2s(b.ghim.den):'—');
 if(b.nguon)tin+=f('Nguồn','🔗 '+b.nguon.menu+' · '+esc(b.nguon.ma)+' «'+esc(b.nguon.ten)+'» '+(R().m68&&b.nguon.menu==='M6.8'?'<button class="rolnk" data-a="m68" data-v="'+b.nguon.ma+'">↗ Mở sự kiện</button>':''));
 tin+=f('Người soạn',esc(ten(b.tacgia))+' <span class="mu">('+esc(NG[b.tacgia].cd)+')</span>');
 if(b.gui)tin+=f('Gửi duyệt',d2s(b.gui));
 if(b.duyet)tin+=f('Người duyệt',esc(ten(b.duyet.ai))+' · '+d2s(b.duyet.luc));
 if(b.dang)tin+=f('Đích xác nhận đăng',d2s(b.dang)+(b.xn?' · <span class="mu">'+esc(b.xn)+'</span>':''));
 if(b.tep.length)tin+=f('Tệp đính kèm',b.tep.map(t=>'<span class="filec">📄 '+esc(t.ten)+' <span class="mu">'+t.kb+' KB</span> <button class="btn xs" data-a="xemtep" data-v="'+esc(t.ten)+'">👁 Xem</button> <button class="btn xs" data-a="taitep" data-v="'+esc(t.ten)+'">⬇ Tải</button></span>').join(''));
 h+='<div class="card"><div class="ch">Thông tin bài</div><div class="cb">'+tin+'</div></div>';
 h+='<div class="card"><div class="ch">Lịch sử thao tác</div><table>'+b.ls.slice().reverse().map(l=>'<tr><td class="mu" style="white-space:nowrap">'+d2s(l[0])+'</td><td><b>'+esc(ten(l[1]))+'</b> <span class="mu">'+esc(NG[l[1]].cd)+'</span></td><td>'+esc(l[2])+'</td></tr>').join('')+'</table></div>';
 return h+'</div>';
}
function theKiemTra(b,kt,ed){
 let h='<div class="card'+(kt.chan.length?' bad':'')+'"><div class="ch">🛡 Kiểm tra trước khi '+(ed?'gửi duyệt':'đăng')+'<span class="sp"></span>'+(kt.chan.length?'<span class="st2 r">'+kt.chan.length+' chặn</span>':'<span class="st2 o">không có gì chặn</span>')+(kt.canh.length?' <span class="st2 w">'+kt.canh.length+' cảnh báo</span>':'')+'</div><div class="cb">';
 kt.chan.forEach(c=>{h+='<div class="ktr r"><span class="kma">'+c.ma+'</span><span class="sp">'+c.m+'</span></div>'});
 kt.canh.forEach(c=>{h+='<div class="ktr w"><span class="kma">'+c.ma+'</span><span class="sp">'+c.m+'</span></div>'});
 if(!kt.chan.length&&!kt.canh.length)h+='<div class="ktr o">✓ Đủ trường bắt buộc, không có dữ liệu cá nhân máy nhận ra.</div>';
 return h+'</div></div>';
}
/* Ảnh — không kiểm đồng ý trước (E1). Có phản ánh thì ẨN NGAY một ảnh, không cần duyệt: bớt ảnh là giảm phơi nhiễm. */
function theAnh(b,duocAn){
 if(!b.anh.length)return '';
 return '<div class="card"><div class="ch">🖼 Ảnh trong bài<span class="sp"></span><span class="mu" style="font-weight:400">phụ huynh phản ánh ảnh nào thì ẩn ngay ảnh đó — không cần duyệt</span></div><table>'
  +b.anh.map((a,i)=>'<tr class="'+(a.an?'warnrow':'')+'"><td style="width:54px">'+anhHtml(a)+'</td><td><b>Ảnh '+(i+1)+'</b>'+(i===b.dd?' <span class="tg a">ảnh đại diện</span>':'')+'<br><span class="mu">'+esc(a.mo)+'</span></td><td style="white-space:nowrap">'
   +(a.an?'<span class="st2 w">🙈 đã ẩn '+d2(a.an.luc)+'</span>':a.bo?'<span class="st2 n">✂ giữ nội bộ</span>':'<span class="st2 o">lên web</span>')+'</td><td style="white-space:nowrap;text-align:right">'
   +(duocAn&&!a.bo?(a.an?(coQ('web','S')?'<button class="btn xs" data-a="hienlai" data-v="'+b.k+'|'+i+'">↺ Hiện lại</button>':''):'<button class="btn xs d" data-a="anpa" data-v="'+b.k+'|'+i+'">🙈 Ẩn theo phản ánh</button>'):'')+'</td></tr>').join('')+'</table></div>';
}

/* ══════════════ THAO TÁC ══════════════ */
const lay=k=>BAI.find(x=>x.k===k);
ACT.ra=(k,el,e)=>{e.preventDefault();ST.ra[k]=!ST.ra[k];render()};
ACT.anpa=v=>{const [k,i]=v.split('|'),a=lay(k).anh[+i];
 openM('🙈 Ẩn ảnh '+(+i+1)+' khỏi web theo phản ánh','<div style="display:flex;gap:10px;align-items:center">'+anhHtml(a)+'<span>'+esc(a.mo)+'</span></div>'
  +'<p class="mu" style="margin-top:8px">Ẩn <b>ngay</b>, không cần duyệt — bớt một ảnh chỉ làm giảm phơi nhiễm. Ảnh <b>không bị xóa</b>; bài vẫn hiển thị. Muốn thay ảnh khác thì mở phiên bản mới (qua duyệt).</p>'
  +'<label class="lbl">Nguồn phản ánh (bắt buộc)</label><select class="fldi" id="pang"><option value="">— chọn —</option>'+NGUON_PA.map(x=>'<option>'+x+'</option>').join('')+'</select>'
  +'<label class="lbl">Mã phản ánh / người phản ánh</label><input class="fldi" id="pama" placeholder="vd PA-2026-0121 ở M8.4">'
  +'<label class="lbl">Lý do (bắt buộc)</label><textarea class="fldi" id="paly" rows="2"></textarea>'
  /* 🛑 Ngoại lệ DUY NHẤT xuyên hai kênh (§13.4): phơi nhiễm dữ liệu cá nhân không phân biệt kênh.
     Để người xử lý phải nhớ mà đi bấm ở menu thứ hai là đặt cược vào trí nhớ của người đang vội,
     trong khi Luật BVDLCN 91/2025 · NĐ 356/2025 đếm 72 giờ (M8.4 §9.1). Nên mặc định CÓ. */
  +(lay(k).lk?'<div class="alert w" style="margin-top:10px">⧉<span class="sp"><b>Bài này có một bản trên Bảng tin App</b> ('+esc(lay(k).lk.ma)+', đăng '+d2s(lay(k).lk.ngay)+').<label class="kchk"><input type="checkbox" id="paxk" checked> <b>Ẩn luôn ảnh đó bên App</b> — phơi nhiễm dữ liệu cá nhân không phân biệt kênh</label></span></div>':''),
  '<button class="btn" data-mb="close">Hủy</button><button class="btn d" data-mb="anok" data-v="'+v+'">🙈 Ẩn ảnh</button>')};
mfns.banok=el=>{const [k,i]=el.dataset.v.split('|'),b=lay(k),a=b.anh[+i],ng=$('#pang').value,ly=$('#paly').value.trim();
 if(!ng||!ly){toast('⛔ C13 — thiếu '+(!ng?'<b>nguồn phản ánh</b>':'')+(!ng&&!ly?' và ':'')+(!ly?'<b>lý do</b>':''));return}
 a.an={luc:NOW,ai:meId(),ng:ng,ma:$('#pama').value.trim(),ly:ly};
 ghiLS(b,'🙈 Ẩn ảnh '+(+i+1)+' theo phản ánh ('+ng+(a.an.ma?' · '+a.an.ma:'')+') — '+ly);
 const xk=b.lk&&$('#paxk')&&$('#paxk').checked;
 if(xk)ghiLS(b,'⧉ Ẩn luôn ảnh tương ứng trên Bảng tin App '+b.lk.ma+' — lệnh xuyên kênh, ghi ở M8.6');

 if(m.na)return {k:'na'};
 if(m.han==='tuan'){
  /* tuần tới 21–25/9: hạn trước Thứ Bảy 19/9 — tức hết Thứ Sáu 18/9 */
  const toi=BAI.find(b=>b.muc===m.id&&b.tuan==='21–25/9'&&b.tt==='dang'),han='2026-09-18';
  if(toi)return {k:'ok',b:toi};
  return {k:HOMNAY>han?'qh':'chua',han:han,con:demNLV(HOMNAY,han),tuan:'21–25/9',b:baiMuc(m)};
 }
 const b=baiMuc(m);
 if(m.doi&&(!b||b.dang.slice(0,10)<m.doi.luc)){const han=congNLV(m.doi.luc,10);return {k:HOMNAY>han?'qh':'cn',han:han,con:demNLV(HOMNAY,han),b:b}}

}

 const s=ttMuc(m),cho=dangCho(m),lich=BAI.filter(b=>b.muc===m.id).sort((x,y)=>(y.dang||y.gui||y.tao).localeCompare(x.dang||x.gui||x.tao));
 let h='<div class="ph"><div class="n"><h2>'+esc(m.ten)+'</h2><div class="m">'+pillMuc(s)+'<span class="pill">'+esc(m.can)+' TT 09/2024</span>'+(m.neu?'<span class="pill">nếu có</span>':'')+'</div></div><div class="spacer"></div><button class="btn sm" data-a="dong">✕</button></div><div class="pbody">';
 if(s.k==='qh')h+='<div class="alert r">⛔<span class="sp"><b>Quá hạn '+(demNLV(s.han,HOMNAY)-1)+' ngày làm việc.</b> '+(m.doi?'Thay đổi ngày '+d2s(m.doi.luc)+': «'+esc(m.doi.nd)+'» <span class="mu">('+esc(ten(m.doi.ai))+' ghi nhận '+d2s(m.doi.ghi)+')</span> — Đ15 k1a: cập nhật chậm nhất <b>10 ngày làm việc</b> → hạn '+d2s(s.han)+'.':'Hạn công bố '+d2s(s.han)+' (Đ15 k1a).')+'</span></div>';
 if(s.k==='cn')h+='<div class="alert w">⟳<span class="sp"><b>Cần cập nhật</b> — '+d2s(m.doi.luc)+': «'+esc(m.doi.nd)+'» <span class="mu">('+esc(ten(m.doi.ai))+' ghi nhận)</span>. Hạn <b>'+d2s(s.han)+'</b> · còn '+s.con+' ngày làm việc (tính cả hôm nay).</span></div>';
 if(s.k==='chua')h+='<div class="alert b">🗓<span class="sp"><b>Chưa đăng</b>'+(s.tuan?' thực đơn tuần '+s.tuan:'')+' — hạn <b>'+d2s(s.han)+'</b>'+(s.tuan?' (trước Thứ Bảy của tuần trước — Đ15 k1a)':'')+'.</span></div>';
 if(s.k==='na')h+='<div class="ro">Không áp dụng — <b>'+esc(ten(m.na.ai))+'</b> xác nhận '+d2s(m.na.luc)+': «'+esc(m.na.ly)+'». Máy không biết trường có chương trình này hay không, nên đây là ô người xác nhận.</div>';
 if(s.k==='ok'&&m.note)h+='<div class="ro">'+esc(m.note)+'</div>';
 if(cho.length)h+='<div class="alert b">⏳<span class="sp">'+cho.map(b=>'<b>'+b.id+'</b> «'+esc(b.ten)+'» — '+ttBai(b)[0].toLowerCase()).join('<br>')+'<br><span class="mu">Chưa tính là đã đăng tới khi đích xác nhận (§0.2).</span></span><button class="btn xs" data-a="mobai" data-v="'+cho[0].k+'">Mở bài</button></div>';
 const act=[];
 if(s.k!=='na'&&coQ('ck','T')&&!cho.length)act.push('<button class="btn sm p" data-a="soanck" data-v="'+m.id+'">✎ Soạn bài công khai</button>');
 if(s.k!=='na'&&m.han!=='tuan'&&coQ('ck','T'))act.push('<button class="btn sm" data-a="doi" data-v="'+m.id+'">⟳ Ghi nhận có thay đổi</button>');
 if(m.neu&&coQ('ck','D'))act.push('<button class="btn sm" data-a="na" data-v="'+m.id+'">'+(m.na?'↺ Bỏ đánh dấu Không áp dụng':'Đánh dấu Không áp dụng')+'</button>');
 if(act.length)h+='<div class="cact top">'+act.join('')+'</div>';
 const f=(k,v)=>'<div class="f"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
 h+='<div class="card"><div class="ch">Yêu cầu của văn bản</div><div class="cb">'+f('Nội dung',esc(m.ct))+f('Căn cứ',esc(m.can)+' TT 09/2024/TT-BGDĐT')
  +f('Thời điểm',m.han==='tuan'?'Hằng tuần — trước Thứ Bảy của tuần trước (Đ15 k1a)':'Trước 30/6 hằng năm · cập nhật chậm nhất 10 ngày làm việc khi thay đổi (Đ15 k1a)')
  +f('Thời gian trên web','Tối thiểu 5 năm kể từ ngày công bố (Đ15 k2)')+(m.doi?f('Thay đổi gần nhất',dongDoi(m)):'')+'</div></div>';
 h+='<div class="card"><div class="ch">Bài đã gắn mục này</div>'+(lich.length?'<table><tr><th>Bài</th><th>Trạng thái</th><th>Đăng</th><th>Giữ tới</th></tr>'+lich.map(b=>'<tr data-a="mobai" data-v="'+b.k+'" style="cursor:pointer"><td><b>'+b.id+'</b> '+esc(b.ten)+'</td><td>'+pillTT(b)+'</td><td>'+(b.dang?d2s(b.dang).split(' ')[0]:'—')+'</td><td>'+(b.dang?d2s(themNam(b.dang,5)).split(' ')[0]:'—')+'</td></tr>').join('')+'</table>':'<div class="empty">Chưa có bài.</div>')+'</div>';
 return h+'</div>';
}
ACT.mobai=k=>{const b=lay(k);ST.tab=b.tt==='cho'&&b.tacgia!==meId()&&coQ('cho','D')?'cho':(['nhap','tuchoi','cho'].includes(b.tt)?'cua':'web');
 if(ST.tab==='web'){ST.chip.web='all'}if(ST.tab==='cua'){ST.chip.cua='all'}ST.cur=k;ST.q='';render()};
ACT.na=v=>{const m=muc(v);if(m.na){m.na=null;render();return}
 openM('Đánh dấu «Không áp dụng»','<p>Chỉ cho mục <b>"nếu có"</b> — '+esc(m.ten)+'.</p><label class="lbl">Lý do (bắt buộc)</label><textarea class="fldi" id="naly" rows="2"></textarea>','<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="naok" data-m="'+v+'">Xác nhận</button>')};
mfns.bnaok=el=>{const l=$('#naly').value.trim();if(!l){toast('⛔ Lý do là bắt buộc');return}muc(el.dataset.m).na={ai:meId(),luc:HOMNAY,ly:l};closeM();render()};
/* ⟳ Ghi nhận có thay đổi — bắt đầu đồng hồ 10 ngày làm việc (Đ15 k1a). Ngày thay đổi lùi được (ngày ký quyết định). */
ACT.doi=v=>{const m=muc(v);
 openM('⟳ Ghi nhận có thay đổi — '+esc(m.ten),'<p class="mu">Đ15 k1a: nội dung công khai thay đổi thì cập nhật <b>chậm nhất 10 ngày làm việc</b> kể từ ngày thay đổi. Ghi nhận để máy tính hạn; bài cập nhật do bạn viết.</p>'
  +'<label class="lbl">Ngày thay đổi (bắt buộc)</label><input type="date" class="fldi" id="doing" value="'+HOMNAY+'" max="'+HOMNAY+'">'
  +'<label class="lbl">Thay đổi gì (bắt buộc)</label><textarea class="fldi" id="doind" rows="2" placeholder="vd Quyết định bổ nhiệm Phó Hiệu trưởng ngày …"></textarea>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="doiok" data-m="'+v+'">Ghi nhận</button>')};
mfns.bdoiok=el=>{const d=$('#doing').value,n=$('#doind').value.trim();if(!d||!n){toast('⛔ Nhập ngày và nội dung thay đổi');return}
 if(d>HOMNAY){toast('⛔ Ngày thay đổi không được ở tương lai');return}
 const m=muc(el.dataset.m);m.doi={luc:d,nd:n,ai:meId(),ghi:NOW};closeM();
 toast('⟳ Đã ghi nhận — hạn cập nhật <b>'+d2s(congNLV(d,10))+'</b>');render()};
ACT.soanck=v=>{const m=muc(v),id=soMoi();
 const b=Object.assign(JSON.parse(JSON.stringify(TRONG)),{k:id+'/1',id:id,v:1,tacgia:meId(),tao:NOW,cm:'ck',muc:v,ky:KY_NAY,
  ten:m.ten+(m.han==='tuan'?' — tuần 21–25/9/2026':m.doi?' — cập nhật '+d2(HOMNAY)+'/2026':' năm 2026'),
  tomtat:'Công khai theo '+m.can+' Thông tư 09/2024/TT-BGDĐT.',
  nd:'Nội dung cần có theo thông tư: '+m.ct+'.'});
 if(v==='d9k1dd')b.tuan='21–25/9';
 ST.ed={k:null,b:b};ST.tab='cua';ST.cur=null;render()};


/* ══════════════ ⚙ CHUYÊN MỤC & NƠI ĐĂNG ══════════════ */
/* Thứ tự bày = thứ tự đọc: ② trước (mặc định — chốt ① ngày 19/9/2026), rồi ① (phương án phụ) và ③.
   Ba bộ nối là BA TÌNH TRẠNG CỦA TRƯỜNG, không phải ba gói dịch vụ (§0.1). */
const DICH={
 cms:['② Website có sẵn của trường — qua API','Cổng TTĐT do Sở / nhà mạng cấp, CMS có API ghi bài. CMS trả lời đã tạo bài kèm đường dẫn.','mặc định'],
 dschool:['① Trang công khai Dschool','Dùng khi trường CHƯA CÓ website, hoặc muốn bỏ website cũ — một tên miền con cho mỗi trường. Cơ chế và nghĩa vụ không đổi: phụ lục hợp đồng G2, trang công khai xóa thật kể cả bộ nhớ đệm khi nhận lệnh gỡ.','phương án phụ'],
 goi:['③ Xuất gói bài để dán tay','Website có sẵn nhưng không có API — phần lớn cổng TTĐT của trường công là sản phẩm đóng gói, quản trị bằng tay, không cho phần mềm bên thứ ba ghi bài vào. Bỏ ③ thì với đa số trường, bài duyệt xong tắc ở bước cuối. Người dán bài lên rồi xác nhận kèm đường dẫn — máy không tự biết.','luôn dùng được']
};
function viewCh(){
 if(!coQ('ch','X'))return scopeBar('ch')+khongQuyen('ch','Cấu hình chuyên mục và nơi đăng');
 const sua=coQ('ch','S'),suaCM=coQ('ch','T');
 let h=scopeBar('ch','Cấu hình dùng chung toàn trường — không chịu bộ chọn ở header.');
 h+=dnote('Bộ nối là <b>một cấu hình</b>, không phải một hạ tầng (§0.2) — và là <b>ba tình trạng của trường</b>, không phải ba gói dịch vụ: on-premise nói về nơi đặt <b>dữ liệu nghiệp vụ</b>, không nói về nơi đặt <b>trang công khai</b> (§0.1). Đổi đích thì <b>menu không đổi</b>. Ngày đăng luôn là ngày <b>đích xác nhận</b>. Không có ô «chọn người duyệt» ở đây — ai duyệt lấy từ quyền D ở M10.4 (§6).');
 const cho=BAI.filter(b=>b.tt==='dayq').length;
 h+='<div class="card"><div class="ch">① Nơi đăng — bộ nối<span class="sp"></span>'
  +(BN.dich==='goi'?'<span class="st2 n">thủ công</span>':BN.ham?'<span class="st2 o">đường hầm: đang nối</span>':'<span class="st2 r">đường hầm: không phản hồi</span>')+'</div><div class="cb" style="padding:10px 12px">'
  +Object.keys(DICH).map(k=>'<label class="dich'+(BN.dich===k?' on':'')+'"><input type="radio" name="dich" data-a="dich" data-v="'+k+'"'+(BN.dich===k?' checked':'')+(sua?'':' disabled')+'><div><b>'+DICH[k][0]+'</b> <span class="tg '+(k==='cms'?'a':'c')+'">'+DICH[k][2]+'</span><div class="mu">'+DICH[k][1]+'</div><div class="mu">Đích: <b>'+esc(BN.url[k])+'</b></div></div></label>').join('')
  +'<div class="frow" style="margin-top:10px"><div class="ro" style="margin:0">Lần đẩy gần nhất: <b>'+d2s(BN.lan)+'</b> · hàng đợi chờ đẩy: <b>'+cho+'</b> bài</div></div>'
  +(BN.dich!=='goi'?'<label class="kchk" style="margin-top:10px"><input type="checkbox" data-a="ham"'+(BN.ham?'':' checked')+(sua?'':' disabled')+'> <b>Mô phỏng: đường hầm đứt</b> <span class="mu">(demo — bài duyệt xong sẽ vào hàng đợi «Chờ đẩy»; tắt đi thì hàng đợi tự đẩy)</span></label>':'')
  +'<div class="mu" style="margin-top:8px">Không bao giờ rời máy trường: bản nháp · bài chờ duyệt / trả lại / từ chối · ảnh ✂ bỏ ra · ảnh đã ẩn theo phản ánh · vết duyệt · lý do gỡ, lý do ẩn.</div>'
  +'</div></div>';
 h+='<div class="card"><div class="ch">② Chuyên mục<span class="sp"></span>'+(suaCM?'<button class="btn xs" data-a="themcm">＋ Thêm chuyên mục</button>':'')+'</div><table><tr><th>Chuyên mục</th><th>Loại</th><th class="num">Bài đang hiển thị</th><th>Ràng buộc</th><th></th></tr>'
  +CM.map(c=>{const n=BAI.filter(b=>b.cm===c.id&&b.tt==='dang').length;
   return '<tr'+(c.an?' class="rorow"':'')+'><td><b>'+esc(c.ten)+'</b>'+(c.an?' <span class="tg c">đã ẩn</span>':'')+'</td><td>'+(c.he?'<span class="tg a">🔒 hệ thống</span>':'<span class="tg c">trường đặt</span>')+'</td><td class="num">'+n+'</td><td class="mu">'+esc(c.gc||(n?'có bài — không xóa, chỉ ẩn':'—'))+'</td><td style="white-space:nowrap">'
    +(suaCM?'<button class="btn xs" data-a="doiten" data-v="'+c.id+'">Đổi tên hiển thị</button> '+(c.he?'':'<button class="btn xs" data-a="ancm" data-v="'+c.id+'">'+(c.an?'Hiện lại':'Ẩn')+'</button>'):'')+'</td></tr>'}).join('')+'</table></div>';
 h+='<div class="card"><div class="ch">③ Trang chủ</div><div class="cb">'
  +'<div class="f"><div class="k">Trần số bài ghim</div><div class="v"><input class="mini" id="tran" value="'+BN.tran+'"'+(sua||suaCM?'':' disabled')+'> <span class="mu">bài — mặc định 3 (W-G)</span></div></div>'
  +'<div class="f"><div class="k">Chịu trách nhiệm nội dung</div><div class="v">'+esc(TRUONG.pn)+' <span class="rolnk">🔗 người phát ngôn ở M10.2 (Đ4 k6)</span></div></div>'
  +'<div class="f"><div class="k">Người duyệt</div><div class="v"><span class="mu">Không cấu hình ở đây — là vai có quyền <b>D</b> ở tab Chờ tôi duyệt (M10.4), hoặc được ủy quyền ở M0.5.</span></div></div>'
  +'</div></div>';
 return h;
}
ACT.dich=v=>{if(v===BN.dich)return;const n=BAI.filter(b=>b.tt==='dang').length;
 openM('Đổi nơi đăng → '+DICH[v][0],'<div class="alert w">⚠<span class="sp"><b>W5 — bài đang hiển thị ở đích cũ không tự dời.</b> Có '+n+' bài đang hiển thị ở <b>'+esc(BN.url[BN.dich])+'</b>.</span></div>'
  +'<label class="kchk"><input type="checkbox" id="dlai"> Đẩy lại '+n+' bài đang hiển thị sang đích mới (có bảng kết quả từng bài)</label>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="dichok" data-v="'+v+'">Đổi nơi đăng</button>')};
mfns.bdichok=el=>{const cu=BN.dich,v=el.dataset.v,lai=$('#dlai').checked;BN.dich=v;
 if(lai&&v!=='goi'){const ds=BAI.filter(b=>b.tt==='dang');openM('Kết quả đẩy lại sang '+esc(BN.url[v]),'<table><tr><th>Bài</th><th>Kết quả</th></tr>'+ds.map(b=>'<tr class="okrow"><td><b>'+b.id+'</b> '+esc(b.ten)+'</td><td>✓ đích xác nhận</td></tr>').join('')+'</table><p class="mu" style="margin-top:8px">'+ds.length+' thành công · 0 bỏ qua. Đích cũ '+esc(BN.url[cu])+' nhận lệnh gỡ.</p>')}
 else{closeM();toast('Nơi đăng: <b>'+DICH[v][0]+'</b>'+(v==='goi'?' — bài duyệt xong sẽ chờ người xác nhận đã dán':''))}
 render()};
ACT.ham=()=>{BN.ham=BN.ham?0:1;
 if(BN.ham){const ds=BAI.filter(b=>b.tt==='dayq');ds.forEach(b=>dayRa(b));BN.lan=NOW;toast('Đường hầm nối lại — đã đẩy '+ds.length+' bài trong hàng đợi')}
 else toast('⚠ Mô phỏng đường hầm đứt — trang công khai vẫn chạy, bài mới vào hàng đợi');render()};
ACT.themcm=()=>openM('＋ Thêm chuyên mục','<label class="lbl">Tên chuyên mục</label><input class="fldi" id="cmten">','<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="cmok">Thêm</button>');
mfns.bcmok=()=>{const t=$('#cmten').value.trim();if(!t){toast('⛔ Nhập tên');return}CM.push({id:'c'+CM.length,ten:t});closeM();render()};
ACT.doiten=v=>{const c=CM.find(x=>x.id===v);openM('Đổi tên hiển thị','<label class="lbl">Tên hiển thị trên web</label><input class="fldi" id="cmten" value="'+esc(c.ten)+'">'+(c.he?'<p class="mu" style="margin-top:6px">Chuyên mục hệ thống — đổi tên được (Đ14 k1c: cách bố trí do trường quyết), <b>không xóa, không ẩn</b>.</p>':''),'<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="tenok" data-v="'+v+'">Lưu</button>')};
mfns.btenok=el=>{const t=$('#cmten').value.trim();if(!t){toast('⛔ Nhập tên');return}CM.find(x=>x.id===el.dataset.v).ten=t;closeM();render()};
ACT.ancm=v=>{const c=CM.find(x=>x.id===v);c.an=c.an?0:1;toast(c.an?'Đã ẩn «'+esc(c.ten)+'» — không nhận bài mới; bài cũ vẫn hiển thị':'Đã hiện lại');render()};
document.addEventListener('change',e=>{if(e.target.id==='tran'){const n=parseInt(e.target.value,10);if(n>0&&n<10){BN.tran=n;toast('Trần ghim: '+n)}else{toast('⛔ Nhập 1–9');render()}}});


/* ══════════════ RENDER ══════════════ */
function render(){
 rolebar();header();
 if(ST.ed){$('#tabs').innerHTML='';$('#crumb').innerHTML='';$('#h1').textContent='Trang web trường — Soạn bài';$('#content').innerHTML=viewSoan();lamMoiBen();return}
 $('#h1').textContent='Trang web trường';$('#crumb').innerHTML='';
 tabs();
 const v={cho:viewCho,cua:viewCua,web:viewWeb,ck:viewCk,ch:viewCh}[ST.tab];
 $('#content').innerHTML=v();
}
render();
</script>
