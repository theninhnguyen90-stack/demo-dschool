<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}
.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}
.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.crumb button{color:var(--brand);font-weight:600}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}
.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.flab{font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:-3px}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}.tg.v{background:#ede9fe;color:#5b21b6}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}.st2.v{background:#ede9fe;color:#5b21b6}
.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:13px}
.listw table{display:block;overflow-x:auto}
.listw table thead,.listw table tbody{display:table;width:100%}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:175px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}tr.badrow{background:var(--red-soft)}
tr.okrow{background:var(--green-soft)}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}

.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.lgd{display:flex;gap:12px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.empty{padding:32px;text-align:center;color:var(--ink3)}
.mini{font-size:10.5px;color:var(--ink3);font-weight:400}
.nodata{color:var(--red);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:840px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff}
/* dòng thời gian sáu bước */
.steps{display:flex;flex-wrap:wrap;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:13px}
.stp{flex:1;min-width:118px;position:relative;padding:0 8px}
.stp .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
 background:var(--line);color:var(--ink3);margin-bottom:5px}
.stp.done .n{background:var(--green);color:#fff}
.stp.now .n{background:var(--brand);color:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.stp.skip .n{background:#ede9fe;color:#5b21b6}
.stp .t{font-size:11.5px;font-weight:700}
.stp.done .t,.stp.now .t{color:var(--ink)}
.stp .s{font-size:10.5px;color:var(--ink3);margin-top:1px}
.stp::after{content:"";position:absolute;top:12px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:var(--line)}
.stp:last-child::after{display:none}
.stp.done::after{background:var(--green)}
.hd3{display:flex;gap:9px;flex-wrap:wrap}
.mem{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px}
.mem .r{font-size:10.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tt{display:flex;flex-wrap:wrap;gap:5px}
.ttc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
.ttc:hover{border-color:var(--brand)}
.ttc.on.up{background:var(--red-soft);border-color:#fca5a5;color:#991b1b;font-weight:600}
.ttc.on.down{background:var(--green-soft);border-color:#6ee7b7;color:#065f46;font-weight:600}
.clock{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#fff;margin-bottom:12px;flex-wrap:wrap}
.clock.bad{border-color:#fecaca;background:var(--red-soft)}
.clock .big{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.qbar{flex:1;min-width:130px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--brand)}
.qbar i.bad{background:var(--red)}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const HOMNAY=new Date(2026,7,29);
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
const pd=s=>{const[a,b,c]=s.split('/').map(Number);return new Date(c,b-1,a)};
const themNgay=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const themThang=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x};
const cachNgay=(a,b)=>Math.round((b-a)/86400000);
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),5600)}
function closeModal(){$('#mask').classList.remove('on')}
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}

const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','3'],['M0.3','Thông báo'],['M0.4','Trang cá nhân']]],
 ['ns','👨‍🏫 Nhân sự',[['M4.1','Hồ sơ nhân sự'],['M4.2','Biến động nhân sự'],['M4.3','Chức danh & Điểm công tác'],
   ['M4.4','Quản lý giáo viên'],['M4.5','Phân công giảng dạy'],['M4.6','Thời khóa biểu'],
   ['M4.7','Lịch giảng dạy & Dạy thay'],['M4.8','Nghỉ phép'],['M4.9','Chấm công nhân sự'],
   ['M4.10','Khen thưởng & Kỷ luật NS','3'],['M4.11','Chứng thư số']]],
 ['qt','⚙️ Quản trị',[['M10.1','Hồ sơ năm học'],['M10.2','Cơ cấu tổ chức']]],
];

/* ================= NHÂN SỰ ================= */
const NS=[
 {id:12,ma:'BGH01',n:'Trần Văn Hùng',   cd:'HT',   vt:'Hiệu trưởng',            loai:'vc'},
 {id:30,ma:'BGH02',n:'Phạm Đức Thắng',  cd:'PHT',  vt:'Phó Hiệu trưởng',        loai:'vc'},
 {id:41,ma:'NV002',n:'Lê Thị Kim Chi',  cd:'TCNS', vt:'Kế toán — Tổ chức nhân sự',loai:'vc'},
 {id:50,ma:'CD001',n:'Bùi Thị Thu Hà',  cd:'CD',   vt:'Chủ tịch Công đoàn · GV Địa lí',loai:'vc'},
 {id:1, ma:'GV001',n:'Lê Minh Tuấn',    to:'T1',   vt:'GV Toán',                loai:'vc'},
 {id:3, ma:'GV003',n:'Nguyễn Thị Mai',  to:'T2',   vt:'GV Ngữ văn',             loai:'vc'},
 {id:7, ma:'GV007',n:'Ngô Thị Hương',   to:'T3',   vt:'GV Tiếng Anh · TTCM',    loai:'vc'},
 {id:9, ma:'GV009',n:'Đặng Văn Long',   to:'T4',   vt:'GV Vật lí',              loai:'vc'},
 {id:10,ma:'GV010',n:'Cao Thị Nhung',   to:'T4',   vt:'GV Hóa học',             loai:'vc'},
 {id:17,ma:'GV017',n:'Lưu Thị Ngân',    to:'T3',   vt:'GV Tiếng Anh',           loai:'vc'},
 {id:40,ma:'NV001',n:'Ngô Thị Bích',    vt:'Văn thư',                           loai:'vc'},
 {id:42,ma:'NV003',n:'Đỗ Văn Hải',      vt:'Bảo vệ',                            loai:'hdld'},

const ns=id=>NS.find(x=>x.id===id);
const HT_ID=12,TCNS_ID=41,CD_ID=50,PHT_ID=30;
const laQL=p=>['HT','PHT'].includes(p.cd);

/* ================= DANH MỤC (Master) ================= */
/* 4 hình thức kỷ luật VIÊN CHỨC — NĐ 234/2026/NĐ-CP.
   Hạ bậc lương và Giáng chức là hình thức của CÔNG CHỨC, chưa bao giờ áp cho viên chức. */
let HTKL=[
 {ma:'KT',ten:'Khiển trách',    ql:0,thoiHieu:5, ky:'A',mo:'Vi phạm lần đầu, mức độ nhẹ'},
 {ma:'CC',ten:'Cảnh cáo',       ql:0,thoiHieu:10,ky:'A',mo:'Vi phạm nghiêm trọng hoặc tái phạm khiển trách'},
 {ma:'CQ',ten:'Cách chức',      ql:1,thoiHieu:10,ky:'B',mo:'CHỈ áp dụng viên chức quản lý — kéo theo đổi chức danh ở M4.3'},
 {ma:'BTV',ten:'Buộc thôi việc',ql:0,thoiHieu:10,ky:'B',mo:'Vi phạm đặc biệt nghiêm trọng — kéo theo Nghỉ hẳn ở M4.2'},
];
const hkl=ma=>HTKL.find(x=>x.ma===ma);
/* hình thức kỷ luật theo BLLĐ Điều 124 — cho người làm việc theo HĐLĐ */
const HTKL_LD=[{ma:'LD1',ten:'Khiển trách'},{ma:'LD2',ten:'Kéo dài thời hạn nâng lương'},
 {ma:'LD3',ten:'Cách chức'},{ma:'LD4',ten:'Sa thải'}];
/* tình tiết — NĐ 234/2026 lần đầu liệt kê cụ thể */

      <div class="mini" style="margin-top:7px">Bạn ${DOT.some(t=>trongHD(t))
        ?'có tên trong Hội đồng của một số đợt, nhưng chúng chưa tới bước xét duyệt hoặc đã xong.'
        :'chưa có tên trong Hội đồng của đợt nào.'}</div></div></div>`;
 return `<div class="ro">Chỉ hiện <b>đợt mà bạn là thành viên Hội đồng</b> — <b>Quyền duyệt + Scope Own</b>.
   Mỗi dòng là <b>một đề xuất</b>. Vẫn gom theo đợt vì quyết định của hội đồng là <b>quyết định tương đối</b> —
   phải so được người này với người khác trong cùng đợt.</div>
  ${ds.map(t=>{
   const chua=t.dx.filter(x=>x.duyet===undefined||x.duyet===null);
   const xong=t.dx.length-chua.length;
   return `<div class="listw"><div class="ch">${t.ten} <span class="sp"></span>
     <span class="mini">năm học ${t.nam} · ${t.id}</span>
     <span class="st2 ${chua.length?'w':'o'}">${xong}/${t.dx.length} đã xét</span>
     <button class="btn xs" data-x="mo-dot" data-i="${t.id}">Mở đợt</button></div>
    <table><thead><tr><th>Nhân sự</th><th>Hình thức đề xuất</th><th>Lý do đề xuất</th><th>Minh chứng</th><th>Kết quả</th><th></th></tr></thead>
    <tbody>${t.dx.map((x,i)=>`<tr class="${x.duyet===1?'okrow':x.duyet===0?'warnrow':''}">
      <td><b>${ns(x.gv).n}</b><div class="mini">${ns(x.gv).vt}</div>
        ${(()=>{const k=dotKhacCo(x.gv,t.id);return k.length
          ?`<div class="mini" style="color:var(--amber)">⚠ đã được đề xuất ở <b>${k.map(z=>z.ten).join(', ')}</b></div>`:''})()}</td>
      <td>${hkt(x.ma).ten}</td><td style="font-weight:400">${x.ly}</td>
      <td>${x.tep?`📎 <span class="mini">${x.tep}</span>`:'<span class="mini">—</span>'}</td>
      <td>${x.duyet===1?`<span class="st2 o">Duyệt — ${hkt(x.maDuyet||x.ma).ten}</span>`
        :x.duyet===0?`<span class="st2 r">Từ chối</span><div class="mini">${x.lyDuyet||''}</div>`
        :'<span class="st2 b">Chờ xét</span>'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn xs g" data-x="duyet-1" data-i="${i}" data-t="${t.id}">✓ Duyệt</button>
        <button class="btn xs d" data-x="duyet-0" data-i="${i}" data-t="${t.id}">✕ Từ chối</button></td></tr>`).join('')}
    </tbody></table>
    <div class="cact">
      <label class="lbl" style="margin:0">Ngày họp <input class="fs" data-nh="${t.id}" value="${t.ngayHop||d2s(HOMNAY)}" style="width:110px"></label>
      <button class="btn p" data-x="chot-duyet" data-i="${t.id}" ${chua.length?'disabled':''}>Chốt kết quả → Công bố</button>
      ${chua.length?`<span class="mini nodata">Còn <b>${chua.length} người chưa có kết quả</b>: ${chua.map(x=>ns(x.gv).n).join(', ')}</span>`
        :'<span class="mini">Tất cả đã có kết quả — chốt được. Bước công bố do <b>Hiệu trưởng</b> ký ở màn hình đợt.</span>'}</div></div>`}).join('')}`;
}

/* ================= T2 — KHEN THƯỞNG ================= */
function ktTab(){
 if(moDot)return dotTang2();
 const rw=R().kt;
 const ds=KT.filter(k=>{const d=pd(k.ngay);return d>=pd(fTu)&&d<=pd(fDen)});
 const cho=choToiDuyet();
 const dotNam=DOT.filter(t=>t.nam===namHoc).filter(t=>fDot==='huy'?t.huy:!t.huy);
 const bar=`<div class="bar">
   <span class="seg">
     <button class="${ktView==='qd'?'on':''}" data-kv="qd">📄 Theo quyết định</button>
     <button class="${ktView==='ns'?'on':''}" data-kv="ns">👤 Theo nhân sự</button></span>
   <span class="flab">Thống kê từ</span><input class="fs" id="fTu" value="${fTu}" style="width:104px">
   <span class="flab">đến</span><input class="fs" id="fDen" value="${fDen}" style="width:104px">
   <button class="btn xs" data-x="ky-namhoc">Năm học ${namHoc}</button>
   <button class="btn xs" data-x="ky-3nam">3 năm gần nhất</button>
   ${rw?`<button class="btn" data-x="ghi-tren">+ Ghi nhận khen thưởng cấp trên</button>`:''}
   <button class="btn" data-x="xuat">⬇ Xuất</button>
   <div class="sum"><span><b>${ds.length}</b> quyết định trong khoảng</span></div></div>`;
 const locDot=`<div class="bar" style="padding:0 0 9px">
   <span class="flab">Đợt</span>
   <span class="seg">${[['','Đang mở'],['huy','Đã hủy']].map(([k,n])=>
     `<button class="${fDot===k?'on':''}" data-fd="${k}">${n}</button>`).join('')}</span>
   ${cho.length?`<span class="chip" style="background:var(--amber-soft);border-color:#fde68a;color:#92400e">
     ⚠ Có <b>${cho.length} đợt</b> chờ bạn duyệt — xem tab <b>Khen thưởng chờ duyệt</b></span>`:''}</div>`;
 const dotBang=locDot+`<div class="listw"><div class="ch">Đợt khen thưởng — năm học ${namHoc} <span class="sp"></span>
    <span class="mini">ba bước: Đề xuất → Xét duyệt → Công bố</span>
    ${rw?`<button class="btn xs p" data-x="tao-dot">+ Tạo đợt khen thưởng</button>`:''}</div>
   ${dotNam.length?`<table><thead><tr><th>Đợt</th><th>Giai đoạn</th><th>Hội đồng</th><th class="num">Đề xuất</th><th class="num">Duyệt</th><th class="num">Từ chối</th><th>Số QĐ</th><th></th></tr></thead><tbody>
   ${dotNam.map(t=>`<tr class="${cho.includes(t)?'warnrow':''}"><td><b>${t.ten}</b>
       <div class="mini">${t.id} · năm học ${t.nam}</div>
       ${cho.includes(t)?'<div><span class="tg b">chờ bạn duyệt</span></div>':''}</td>
     <td>${gdBadge(t)}</td>
     <td><span class="tg ${trongHD(t)?'a':'c'}">${t.hd.length} người</span>
       ${trongHD(t)?`<div class="mini">${duyetDuocDot(t)?'👉 bạn <b>duyệt được</b>':'bạn là thành viên, <b>không có quyền duyệt</b>'}</div>`:''}</td>
     <td class="num">${t.dx.length}</td>
     <td class="num">${t.dx.filter(x=>x.duyet===1).length}</td>
     <td class="num">${t.dx.filter(x=>x.duyet===0).length}</td>
     <td>${t.soQD||'<span class="mini">—</span>'}</td>
     <td style="text-align:right"><button class="btn xs" data-x="mo-dot" data-i="${t.id}">Mở</button></td></tr>`).join('')}
   </tbody></table>`
    :`<div class="empty">${fDot==='huy'?'Không có đợt nào đã hủy.'
        :`Năm học ${namHoc} chưa có đợt khen thưởng nào.`}
       ${rw?'<br><span class="mini">Bấm <b>+ Tạo đợt khen thưởng</b> để bắt đầu.</span>':''}</div>`}
   <div class="lgd"><span class="chip"><b>Đợt là dữ liệu của TỪNG NĂM HỌC</b> — đổi năm ở đầu trang thì danh sách đổi theo</span>
     <span class="chip">Duyệt được khi <b>có quyền D</b> <b>VÀ</b> <b>có tên trong Hội đồng của đúng đợt đó</b></span>
     <span class="chip">Đợt <b>không xóa</b> — hủy là một trạng thái, lọc lại được</span></div></div>`;
 return bar+dotBang+(ktView==='ns'?bangTheoNS(ds):bangTheoQD(ds));
}
const GD={dexuat:['Đề xuất','b'],xetduyet:['Đã xét duyệt','w'],congbo:['Đã công bố','o']};
const gdBadge=t=>t.huy?'<span class="st2 n">Đã hủy</span>'
 :t.gd==='congbo'&&!t.soQD?'<span class="st2 w">Chờ ký công bố</span>'
 :`<span class="st2 ${GD[t.gd][1]}">${GD[t.gd][0]}</span>`;

function bangTheoQD(ds){
 return `<div class="listw"><div class="ch">Quyết định khen thưởng <span class="sp"></span>
    <span class="mini">mỗi dòng một quyết định · ${fTu} — ${fDen}</span></div>
   ${ds.length?`<table><thead><tr><th>Mã</th><th>Nhân sự</th><th>Hình thức</th><th>Cấp</th><th>Lý do</th><th>Ngày</th><th>Đợt</th></tr></thead><tbody>
   ${ds.map(k=>`<tr><td><b>${k.id}</b></td><td><b>${ns(k.gv).n}</b><div class="mini">${ns(k.gv).vt}</div></td>
     <td>${hkt(k.ma).ten}</td>
     <td>${hkt(k.ma).cap==='noi'?'<span class="tg c">Nội bộ</span>':`<span class="tg a">${k.capTren}</span><div class="mini">${k.soQD||''}</div>`}</td>
     <td style="font-weight:400">${k.ly}</td><td>${k.ngay}</td>
     <td class="mini">${k.dot||'—'}</td></tr>`).join('')}
   </tbody></table>`:'<div class="empty">Không có quyết định nào trong khoảng thời gian đã chọn</div>'}
   <div class="lgd"><span class="chip">Hệ thống <b>chỉ ghi nhận thông tin khen thưởng</b> — không ghi giá trị hay nội dung phần quà</span></div></div>`;
}
function bangTheoNS(ds){
 const nhom={};
 ds.forEach(k=>{(nhom[k.gv]=nhom[k.gv]||[]).push(k)});
 const ids=Object.keys(nhom).sort((a,b)=>nhom[b].length-nhom[a].length);
 return `<div class="ro"><b>Mỗi dòng là MỘT nhân sự</b> với tất cả lần được khen trong khoảng
   <b>${fTu} — ${fDen}</b>. Góc nhìn này trả lời câu hỏi khác hẳn góc nhìn theo quyết định:
   <i>ai được khen nhiều lần, ai chưa từng được khen</i> — cái mà danh sách quyết định không nói ra.</div>
  <div class="listw"><div class="ch">Khen thưởng theo nhân sự <span class="sp"></span>
    <span class="mini">${ids.length}/${NS.length} người có khen thưởng trong khoảng</span></div>
   ${ids.length?`<table><thead><tr><th>Nhân sự</th><th class="num">Số lần</th><th>Các lần được khen</th>
     <th class="num">Nội bộ</th><th class="num">Cấp trên</th></tr></thead><tbody>
   ${ids.map(id=>{const ks=nhom[id].slice().sort((a,b)=>pd(a.ngay)-pd(b.ngay));
     const noi=ks.filter(k=>hkt(k.ma).cap==='noi').length, tren=ks.length-noi;
     return `<tr class="${ks.length>=2?'okrow':''}"><td><b>${ns(+id).n}</b><div class="mini">${ns(+id).vt}</div></td>
      <td class="num"><b>${ks.length}</b></td>
      <td>${ks.map(k=>`<div style="margin-bottom:3px">
        <span class="tg ${hkt(k.ma).cap==='noi'?'c':'a'}">${hkt(k.ma).ten}</span>
        <span class="mini">${k.ngay}${k.capTren?' · '+k.capTren:''} — ${k.ly}</span></div>`).join('')}</td>
      <td class="num">${noi||''}</td><td class="num">${tren||''}</td></tr>`}).join('')}
   </tbody></table>`:'<div class="empty">Không có nhân sự nào được khen trong khoảng thời gian đã chọn</div>'}
   <div class="lgd"><span class="chip">Người có <b>từ 2 lần trở lên</b> tô nền xanh</span>
     <span class="chip"><b>${NS.length-ids.length} người</b> chưa được khen lần nào trong khoảng — con số này chỉ thấy ở góc nhìn theo nhân sự</span></div></div>`;
}

/* ---------- tầng 2: đợt khen thưởng, BA BƯỚC ---------- */
function dotTang2(){
 const t=dot(moDot),rw=R().kt,ky=R().ky,coQuyen=duyetDuocDot(t);
 const soDX=t.dx.length, soOK=t.dx.filter(x=>x.duyet===1).length, soNo=t.dx.filter(x=>x.duyet===0).length;
 const chuaXet=t.dx.filter(x=>x.duyet===undefined||x.duyet===null);
 const cur=t.gd, idx={dexuat:0,xetduyet:1,congbo:2}[cur];
 const steps=[['Đề xuất',`${soDX} người`],
   ['Xét duyệt',soDX?`${soOK} duyệt · ${soNo} từ chối · ${chuaXet.length} chưa xét`:'chưa có đề xuất'],
   ['Công bố',t.soQD?t.soQD:(cur==='congbo'?'chờ ký':'chưa công bố')]];
 const stepHtml=steps.map(([ten,mo],i)=>
   `<div class="stp ${i<idx?'done':i===idx?'now':''}"><div class="n">${i<idx?'✓':i+1}</div>
     <div class="t">${ten}</div><div class="s">${mo}</div></div>`).join('');

 const suaHD=rw&&cur!=='congbo'&&!t.huy;
 const VAI=['Chủ tịch','Ủy viên thường trực','Ủy viên'];
 const bHD=`<div class="listw"><div class="ch">Hội đồng Thi đua khen thưởng <span class="sp"></span>
    <span class="tg ${t.hd.length>=5&&t.hd.length<=7?'a':'b'}">${t.hd.length} thành viên</span>
    ${suaHD?`<button class="btn xs p" data-x="them-hd">+ Thêm thành viên</button>`:''}</div>
   <div style="padding:11px 12px" class="hd3">
    ${t.hd.map((id,i)=>`<div class="mem" style="${id===R().id?'border-color:var(--brand);background:var(--brand-soft)':''}">
      <div class="r">${VAI[Math.min(i,2)]}</div>
      <b>${ns(id).n}</b>${id===R().id?' <span class="tg a">bạn</span>':''}
      <div class="mini">${ns(id).vt}</div>
      <div class="mini">${(ROLE[Object.keys(ROLE).find(k=>ROLE[k].id===id&&k!=='FULL')]||{}).duyetKT
        ?'<span class="tg g">có quyền duyệt</span>':'<span class="tg c">không có quyền duyệt</span>'}</div>
      ${suaHD&&t.hd.length>1?`<button class="btn xs d" data-x="bo-hd" data-i="${id}" style="margin-top:5px">Bỏ</button>`:''}</div>`).join('')}</div>
   ${t.hd.length<5||t.hd.length>7?`<div class="warn" style="margin:0 12px 11px">⚠ Hội đồng đang có <b>${t.hd.length} người</b> —
     thông lệ là <b>5–7 người</b>. <b>Cảnh báo, không chặn</b>: Luật Thi đua khen thưởng 2022 <b>không quy định số lượng</b>,
     nên đây là thông lệ chứ không phải sàn pháp lý — khác hẳn Hội đồng kỷ luật 3 người của NĐ 234/2026.</div>`:''}
   <div class="lgd"><span class="chip">Duyệt được khi <b>có quyền D</b> <b>VÀ</b> <b>có tên ở đây</b> — thiếu một là chỉ xem</span>
     <span class="chip">Sửa được ở bước ① và ②, <b>khóa khi công bố</b> — đổi thành phần sau khi ký là làm sai lệch hồ sơ</span></div></div>`;

 /* ① ĐỀ XUẤT */
 const b1=`<div class="listw"><div class="ch">① Đề xuất <span class="sp"></span>
    ${cur==='dexuat'?'<span class="st2 b">đang ở bước này</span>':'<span class="st2 o">xong</span>'}
    <span class="mini">một đợt có thể đề xuất <b>một hoặc nhiều nhân sự</b></span>
    ${cur==='dexuat'&&rw?`<button class="btn xs p" data-x="them-dx">+ Thêm nhân sự vào đợt</button>`:''}</div>
   ${soDX?`<table><thead><tr><th>Nhân sự</th><th>Hình thức đề xuất</th><th>Lý do đề xuất</th><th>Tệp đính kèm</th>${cur==='dexuat'&&rw?'<th></th>':''}</tr></thead><tbody>
    ${t.dx.map((x,i)=>`<tr><td><b>${ns(x.gv).n}</b><div class="mini">${ns(x.gv).vt}</div></td>
      <td>${hkt(x.ma).ten}</td><td style="font-weight:400">${x.ly}
        ${(()=>{const k=dotKhacCo(x.gv,t.id);return k.length
          ?`<div class="mini" style="color:var(--amber)">⚠ Đã được đề xuất ở <b>${k.map(z=>z.ten).join(', ')}</b> trong cùng năm học</div>`:''})()}</td>
      <td>${x.tep?`📎 <span class="mini">${x.tep}</span>`:'<span class="mini">—</span>'}</td>
      ${cur==='dexuat'&&rw?`<td style="text-align:right">
        <button class="btn xs" data-x="sua-dx" data-i="${i}">✎</button>
        <button class="btn xs d" data-x="bo-dx" data-i="${i}">Bỏ</button></td>`:''}</tr>`).join('')}
   </tbody></table>`
    :'<div class="empty">Chưa có nhân sự nào trong đợt.<br><span class="mini">Bấm <b>+ Thêm nhân sự vào đợt</b> — mỗi người kèm <b>lý do cụ thể</b> và <b>tệp đính kèm nếu cần</b>.</span></div>'}
   ${cur==='dexuat'&&rw?`<div class="cact">
     <button class="btn p" data-x="chot-dx" data-i="${t.id}" ${soDX?'':'disabled'}>Chốt danh sách → Xét duyệt</button>
     ${soDX?`<span class="mini">Chốt xong <b>không thêm bớt người</b> được nữa.</span>`
       :'<span class="mini">Danh sách rỗng — không chuyển bước được.</span>'}</div>`:''}</div>`;

 /* ② XÉT DUYỆT */
 const b2=`<div class="listw"><div class="ch">② Xét duyệt <span class="sp"></span>
    ${cur==='xetduyet'?'<span class="st2 w">đang ở bước này</span>':cur==='congbo'?'<span class="st2 o">xong</span>':'<span class="st2 n">chưa tới</span>'}
    <span class="tg a">Hội đồng Thi đua ${t.hd.length} thành viên</span>
    <span class="mini">duyệt hoặc từ chối <b>từng người</b></span></div>
   ${cur==='dexuat'?'<div class="empty">Chốt danh sách đề xuất ở bước ① trước.</div>'
    :`<table><thead><tr><th>Nhân sự</th><th>Đề xuất</th><th>Kết quả</th><th>Ghi chú</th>${cur==='xetduyet'&&coQuyen?'<th></th>':''}</tr></thead><tbody>
     ${t.dx.map((x,i)=>`<tr class="${x.duyet===1?'okrow':x.duyet===0?'warnrow':''}">
       <td><b>${ns(x.gv).n}</b><div class="mini">${x.ly.slice(0,54)}${x.ly.length>54?'…':''}</div></td>
       <td>${hkt(x.ma).ten}</td>
       <td>${x.duyet===1?`<span class="st2 o">Duyệt — ${hkt(x.maDuyet||x.ma).ten}</span>`
          :x.duyet===0?'<span class="st2 r">Từ chối</span>':'<span class="st2 b">Chưa xét</span>'}</td>
       <td class="mini">${x.duyet===0?(x.lyDuyet||''):x.maDuyet&&x.maDuyet!==x.ma?'<b>Hội đồng đổi hình thức so với đề xuất</b>':''}</td>
       ${cur==='xetduyet'&&coQuyen?`<td style="text-align:right;white-space:nowrap">
         <button class="btn xs g" data-x="duyet-1" data-i="${i}">✓ Duyệt</button>
         <button class="btn xs d" data-x="duyet-0" data-i="${i}">✕ Từ chối</button></td>`:''}</tr>`).join('')}
     </tbody></table>
     ${cur==='xetduyet'?(coQuyen?`<div class="cact">
       <label class="lbl" style="margin:0">Ngày họp <input class="fs" id="dtNgayHop" value="${t.ngayHop||d2s(HOMNAY)}" style="width:110px"></label>
       <button class="btn p" data-x="chot-duyet" data-i="${t.id}" ${chuaXet.length?'disabled':''}>Chốt kết quả → Công bố</button>
       ${chuaXet.length?`<span class="mini nodata">Còn <b>${chuaXet.length} người chưa có kết quả</b>: ${chuaXet.map(x=>ns(x.gv).n).join(', ')}</span>`
         :'<span class="mini">Tất cả đã có kết quả — chốt được.</span>'}</div>`
      :`<div class="cact"><span class="mini">${trongHD(t)
        ?'Bạn <b>có tên trong Hội đồng</b> nhưng <b>không có quyền duyệt</b> ở chức năng này — chỉ xem.'

 /* ③ CÔNG BỐ */
 const b3=`<div class="listw"><div class="ch">③ Công bố <span class="sp"></span>

 const chuaAiXet=!t.dx.some(x=>x.duyet===1||x.duyet===0);
 const thanh=`<div class="bar" style="padding:0 0 11px">
   ${rw&&!t.huy&&cur==='xetduyet'&&chuaAiXet?`<button class="btn" data-x="lui-buoc" data-i="${t.id}">← Quay lại bước Đề xuất</button>`:''}

 return thanh+`<div class="ro"><b>Đợt khen thưởng của năm học ${t.nam}.</b> Ba bước tách bạch —
   Đề xuất → Xét duyệt → Công bố. Mỗi bước <b>chỉ mở khi bước trước có kết quả</b>, đợt đã công bố thì <b>khóa</b>.

  <div class="steps">${stepHtml}</div>${bHD}${b1}${b2}${b3}`;
}

function moThemDX(i){

 const chon=NS.filter(p=>cu?p.id===cu.gv:!daCo.includes(p.id));
 const goiY={7:'Bồi dưỡng đội tuyển học sinh giỏi đạt giải cấp tỉnh',1:'Dạy thay 38 giờ trong năm, sáng kiến xếp loại B',
  10:'Sáng kiến kinh nghiệm cấp tỉnh xếp loại A',17:'Hoàn thành tốt nhiệm vụ được giao',
  41:'Quyết toán đúng hạn 4 quý liên tiếp',3:'Chủ nhiệm lớp tiên tiến'};
 modal(cu?`Sửa đề xuất — ${ns(cu.gv).n}`:'Thêm nhân sự vào đợt khen thưởng',
  `<div class="ro">Một đợt có thể đề xuất <b>một hoặc nhiều nhân sự</b>. Mỗi người kèm
     <b>lý do đề xuất cụ thể</b> và <b>tệp đính kèm nếu cần</b>.</div>
   <label class="lbl">Nhân sự <span style="color:var(--red)">*</span></label>
   <select class="fldi" id="dxGV" ${cu?'disabled':''}>
     ${chon.length?chon.map(p=>`<option value="${p.id}">${p.n} — ${p.vt}</option>`).join('')
       :'<option value="">— đã đưa hết nhân sự vào đợt —</option>'}</select>
   <label class="lbl">Hình thức đề xuất <span style="color:var(--red)">*</span></label>
   <select class="fldi" id="dxMa">${HTKT.filter(h=>h.cap==='noi').map(h=>
     `<option value="${h.ma}" ${cu&&cu.ma===h.ma?'selected':''}>${h.ten}</option>`).join('')}</select>
   <div class="mini" style="margin-top:4px">Chỉ hình thức <b>nội bộ trường</b> — khen thưởng cấp trên do cấp trên quyết,
     ghi nhận riêng ngoài đợt.</div>
   <label class="lbl">Lý do đề xuất <span style="color:var(--red)">*</span></label>
   <textarea class="fldi" id="dxLy" rows="3" placeholder="Thành tích cụ thể, số liệu nếu có">${cu?cu.ly:''}</textarea>
   ${!cu?`<div class="mini" style="margin-top:4px">Gợi ý từ dữ liệu <i>(đánh giá · sáng kiến · số giờ dạy thêm ${dlink('M4.9','M4.9')})</i>:
     <span id="dxGoi"></span></div>`:''}
   <label class="lbl">Tệp đính kèm <span class="mini">— không bắt buộc</span></label>
   <div class="f" style="padding:0"><div class="k"></div><div class="v">
     <button class="btn xs" data-x="dinh-kem-dx">📎 Chọn tệp</button>
     <span id="dxTep" class="mini">${cu&&cu.tep?cu.tep:'chưa có tệp'}</span></div></div>`,
  `<button class="btn" data-x="close">Hủy</button>
   <button class="btn p" data-x="ok-dx" data-i="${i!=null?i:''}" ${chon.length?'':'disabled'}>${cu?'Lưu':'Thêm vào đợt'}</button>`);
 if(!cu)setTimeout(()=>{const sel=$('#dxGV');if(!sel)return;
   const ve=()=>{const g=goiY[+sel.value];$('#dxGoi').innerHTML=g?`<b>${g}</b> <button class="rolnk" data-x="dung-goi">dùng</button>`:'<i>không có gợi ý</i>'};
   sel.onchange=ve;ve()},0);

/* ---------- panel một vụ việc (chi tiết 1:1, không phải không gian nhiều bước) ---------- */
function panelVV(){
 const d=vv(moVV);if(!d)return '';
 const p=ns(d.gv),laLD=p.loai==='hdld';
 const mucs=laLD?[{ma:null,ten:'BLLĐ Điều 123',nam:0.5}]
   :HTKL.filter(h=>!h.ql||laQL(p)).map(h=>({ma:h.ma,ten:h.ten,nam:h.thoiHieu}));
 const nhomMuc=[];
 mucs.forEach(m=>{const g=nhomMuc.find(z=>z.nam===m.nam);g?g.ten.push(m.ten):nhomMuc.push({nam:m.nam,ten:[m.ten],ma:m.ma})});

  ?`<div class="clock"><span>⏳ <b>Thời hiệu ${thoiHieuNam(d)===0.5?'6 tháng':thoiHieuNam(d)+' năm'}</b></span>

     <span class="mini" style="flex:1">Đã ghi kết quả nên thời hiệu chốt theo hình thức đã áp dụng.</span></div>`

       đến khi cấp có thẩm quyền KẾT LUẬN</b> — NĐ 234/2026${laLD?'; HĐLĐ áp <b>BLLĐ Điều 123</b>':''}.</span>

function ghiKQ(d,ma,laLD,o){
 if(laLD){d.ketQua='KT_LD';d.htLD=ma}else d.ketQua=ma;
 d.tangNang=laKyLuat(ma)?ttChon.up.slice():[];
 d.giamNhe=laKyLuat(ma)?ttChon.down.slice():[];
 d.hd=ttChon.hd?[HT_ID,CD_ID,TCNS_ID]:null;
 d.ngayHop=ttChon.hd?(o.nh||d2s(HOMNAY)):null;
 d.bienBan=ttChon.hd?(o.bb||''):'';
 d.ngayQD=o.ngay||d2s(HOMNAY);
 d.nguoiKy=o.ky||ns(HT_ID).n;
 d.lyDo=laKyLuat(ma)?'':(o.ly||'');
 d.tep=o.tep&&o.tep!=='chưa có tệp'?o.tep.replace(/\s*\(\d+ KB\)/,''):null;
 d.hieuLucTu=laKyLuat(ma)?d.ngayQD:null;
}

    `<button class="btn" data-x="close">Hủy</button>
     <button class="btn d" data-x="ok-duyet-0" data-i="${i}" data-t="${t2.id}">✕ Từ chối</button>`);return}
 if(x==='ok-duyet-0'){const t2=dot(t.dataset.t||moDot),x2=t2.dx[+t.dataset.i],ly=$('#dvLy').value.trim();
   if(!ly){toast('⛔ Bắt buộc ghi lý do từ chối — người được đề xuất có quyền biết vì sao');return}
   x2.duyet=0;x2.lyDuyet=ly;delete x2.maDuyet;
   closeModal();render();toast(`Đã từ chối <b>${ns(x2.gv).n}</b> · lý do đã lưu và hiển thị cho người đó`);return}
 if(x==='chot-duyet'){const t2=dot(t.dataset.i);
   if(!duyetDuocDot(t2)){toast('⛔ Chỉ thành viên Hội đồng có quyền duyệt mới chốt được kết quả');return}
   const chua=t2.dx.filter(x2=>x2.duyet===undefined||x2.duyet===null);
   if(chua.length){toast(`⛔ Còn <b>${chua.length} người chưa có kết quả</b>: ${chua.map(x2=>ns(x2.gv).n).join(', ')}`);return}
   const oNH=$('#dtNgayHop')||document.querySelector(`[data-nh="${t2.id}"]`);
   t2.ngayHop=oNH?oNH.value:d2s(HOMNAY);
   t2.gd='congbo';render();
   toast(`Đã chốt xét duyệt ngày ${t2.ngayHop} · <b>${t2.dx.filter(x2=>x2.duyet===1).length} duyệt · ${t2.dx.filter(x2=>x2.duyet===0).length} từ chối</b> · chuyển bước <b>③ Công bố</b>`);return}
 if(x==='cong-bo'){const t2=dot(t.dataset.i),so=$('#dtSoQD').value.trim();
   if(!so){toast('⛔ Bắt buộc có <b>số quyết định</b> — đây là văn bản chính thức của nhà trường');return}
   const duyet=t2.dx.filter(x2=>x2.duyet===1);
   if(!duyet.length){toast('⛔ Không có ai được duyệt — không công bố được');return}
   duyet.forEach(x2=>{const ma=x2.maDuyet||x2.ma;
     KT.push({id:'KT-'+t2.nam.split('-')[1]+'-'+(++ktSeq),gv:x2.gv,ma,nam:t2.nam,ly:x2.ly,
       ngay:d2s(HOMNAY),nguoiKy:ns(HT_ID).n,dot:t2.id})});
   t2.soQD=so;t2.ngayCB=d2s(HOMNAY);render();
   toast(`✍ Đã ký công bố <b>${so}</b> · sinh <b>${duyet.length} quyết định khen thưởng</b> · ghi vào hồ sơ nhân sự M4.1`);return}
 if(x==='ky-namhoc'){const k=khoangNam(namHoc);fTu=k.tu;fDen=k.den;render();
   toast(`Đã lọc thống kê theo <b>năm học ${namHoc}</b>`);return}
 if(x==='ky-3nam'){fTu='01/08/2024';fDen=d2s(HOMNAY);render();
   toast('Đã lọc <b>3 năm gần nhất</b>');return}
 if(x==='ghi-tren'){
   modal('Ghi nhận khen thưởng cấp trên trao',
    `<div class="ro">Hệ thống <b>chỉ ghi nhận</b>. Trường không quyết được ai được Bằng khen Bộ trưởng —
      dựng quy trình duyệt cho nó là <b>giả vờ có thẩm quyền mình không có</b>.</div>
     <label class="lbl">Nhân sự</label>
     <select class="fldi" id="gtGV">${NS.map(p=>`<option value="${p.id}">${p.n} — ${p.vt}</option>`).join('')}</select>
     <label class="lbl">Hình thức</label>
     <select class="fldi" id="gtMa">${HTKT.filter(h=>h.cap==='tren').map(h=>`<option value="${h.ma}">${h.ten}</option>`).join('')}</select>
     <label class="lbl">Cấp trao</label><input class="fldi" id="gtCap" value="Chủ tịch UBND tỉnh">
     <label class="lbl">Số quyết định <span style="color:var(--red)">*</span></label><input class="fldi" id="gtSo" value="">
     <label class="lbl">Thành tích</label><textarea class="fldi" id="gtLy" rows="2"></textarea>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-ghi-tren">Ghi nhận</button>`);return}
 if(x==='ok-ghi-tren'){const so=$('#gtSo').value.trim();
   if(!so){toast('⛔ Bắt buộc có số quyết định của cấp trên — đây là bằng chứng, không phải ghi nhớ nội bộ');return}
   const da=KT.find(k=>k.soQD===so);
   if(da){toast(`⛔ Số quyết định <b>${so}</b> đã ghi nhận cho <b>${ns(da.gv).n}</b> ngày ${da.ngay} — kiểm lại kẻo trùng`);return}
   KT.unshift({id:'KT-'+namHoc.split('-')[1]+'-'+(++ktSeq),gv:+$('#gtGV').value,ma:$('#gtMa').value,nam:namHoc,
     ly:$('#gtLy').value.trim()||'—',ngay:d2s(HOMNAY),capTren:$('#gtCap').value,soQD:so});
   closeModal();render();toast('Đã ghi nhận khen thưởng cấp trên · ghi vào hồ sơ nhân sự M4.1');return}

 /* --- cấu hình --- */
 if(x==='sua-kt'){const h=hkt(t.dataset.i);
   modal('Sửa hình thức khen thưởng — '+h.ten,
    `<label class="lbl">Tên</label><input class="fldi" id="ktTen" value="${h.ten}">
     <div class="ro" style="margin-top:11px">Chỉ sửa được hình thức <b>nội bộ trường</b>.
       Hình thức cấp trên do văn bản của cấp trên quy định.
       <br>Hệ thống <b>không ghi giá trị và nội dung phần quà</b>.</div>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-sua-kt" data-i="${h.ma}">Ghi vào đề xuất</button>`);return}
 if(x==='ok-sua-kt'){const h=hkt(t.dataset.i),ten=$('#ktTen').value.trim();
   if(!ten){toast('⛔ Bắt buộc có tên');return}
   if(ten===h.ten){toast('Không có gì thay đổi');return}
   CFG_CHO.push({id:'CF'+(++cfgSeq),mo:`Sửa tên hình thức: <b>${h.ten}</b> → <b>${ten}</b>`,
     ai:toi().n,ngay:d2s(HOMNAY),fn:()=>{h.ten=ten}});
   closeModal();render();toast('✎ Đã ghi vào đề xuất — <b>chưa có hiệu lực</b>');return}
 if(x==='them-kt'){toast('Mở form thêm hình thức khen thưởng nội bộ — TCNS soạn, Hiệu trưởng duyệt');return}
 if(x==='cfg-gui'){render();toast(`✎ Đã chuyển <b>${CFG_CHO.length}</b> thay đổi sang Hiệu trưởng duyệt`);return}
 if(x==='cfg-ok'){const c=CFG_CHO.find(z=>z.id===t.dataset.i);c.fn();
   CFG_CHO=CFG_CHO.filter(z=>z.id!==c.id);render();toast('✓ Đã duyệt thay đổi cấu hình');return}
 if(x==='cfg-bo'){CFG_CHO=CFG_CHO.filter(z=>z.id!==t.dataset.i);render();toast('Đã bỏ đề xuất');return}

 /* --- xuất --- */
 if(x==='xuat'){
   modal('Xuất dữ liệu',
    `<label class="lbl">Bản xuất</label><select class="fldi" id="xBan">
      <option>Bảng vàng thi đua năm học</option>
      <option>Thống kê khen thưởng, kỷ luật theo năm</option>
      <option data-nc="1">Danh sách kỷ luật chi tiết — <b>chứa dữ liệu nhạy cảm</b></option>
      <option data-ky="1">📄 Báo cáo gửi cơ quan quản lý — cần Hiệu trưởng ký</option></select>
     <label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>
     <select class="fldi" id="xMd"><option value="">— Chọn mục đích —</option>
      <option>Công bố nội bộ trường</option><option>Lưu hồ sơ nhà trường</option>
      <option>Báo cáo Ban giám hiệu</option><option>Báo cáo cơ quan quản lý</option></select>
     <div class="ro" style="margin-top:11px">Mọi lượt xem và xuất hồ sơ kỷ luật <b>ghi audit</b> kèm mục đích,
       người xuất và thời điểm.</div>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-xuat">⬇ Xuất</button>`);return}
 if(x==='ok-xuat'){if(!$('#xMd').value){toast('⛔ Bắt buộc chọn mục đích sử dụng');return}
   const o=$('#xBan').selectedOptions[0];
   if(o.dataset.ky==='1'&&!R().ky){toast('⛔ <b>Báo cáo gửi cơ quan quản lý chỉ Hiệu trưởng ký</b>');return}
   if(o.dataset.nc==='1'&&R().xemKL!=='all'){toast('⛔ Bản xuất này <b>chứa hồ sơ kỷ luật</b> — vai trò của bạn không xem được toàn bộ');return}
   closeModal();
   toast(`⬇ Đã xuất${o.dataset.ky==='1'?' · <b>chữ ký Hiệu trưởng</b>':''}${o.dataset.nc==='1'?' · <b>dữ liệu nhạy cảm — audit ghi riêng</b>':''} · ghi audit kèm mục đích`);return}
});

function render(){
 sidebar();tabs();
 const n=viecCount();
 $('#ndot').textContent=n||'';$('#ndot').style.display=n?'grid':'none';
 $('#topact').innerHTML='';
 let cr='';
 if(moDot&&tab==='kt')cr=`<div class="crumb"><button data-x="ve-kt">← Khen thưởng</button> › <b>${dot(moDot).ten}</b></div>`;
 if(moVV&&tab==='kl'){const d=vv(moVV);
   cr=`<div class="crumb"><button data-x="ve-kl">← Kỷ luật</button> › <b>${d.id} — ${ns(d.gv).n}</b>
     <span class="st2 ${TTVV(d).c}">${TTVV(d).t}</span></div>`}
 $('#crumb').innerHTML=cr;
 $('#h1').textContent=moDot&&tab==='kt'?'Đợt xét thi đua'
   :moVV&&tab==='kl'?'Hồ sơ vụ việc kỷ luật':'Khen thưởng & Kỷ luật nhân sự';
 if(!R().tabs.length){
   $('#content').innerHTML=`<div class="listw" style="margin-top:13px"><div class="empty">
     <b>Vai trò này không truy cập menu M4.10.</b>
     <div class="mini" style="margin-top:9px">Khen thưởng và kỷ luật <b>của chính bạn</b> xem tại
       ${dlink('M0.4','M0.4 Trang cá nhân')} — gồm cả <b>các lần được đề xuất khen thưởng</b> và
       <b>lý do nếu không được thông qua</b>.
       <br>M4.10 là menu của <b>Hiệu trưởng, Tổ chức nhân sự và thành viên Hội đồng</b>.</div></div></div>`;
   return}
 $('#content').innerHTML=scopeBar()+(tab==='duyet'?duyetTab():tab==='kt'?ktTab():tab==='kl'?klTab():cauhinhTab());
}
render();
</script>
</body>
