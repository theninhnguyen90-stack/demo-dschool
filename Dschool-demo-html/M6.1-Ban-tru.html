<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.1 Bán trú — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.mini{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:12px}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}
</style>
</head>
<body class="nn">
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>


<div class="rolebar" id="rolebar"></div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"></select>
  <span class="lockico" id="dtlock"></span>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot" id="ndot">3</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">TĐ</div>
</header>

<div class="wrap">
  <main class="main">
    <div id="crumb"></div>
    <div class="tophd"><h1 id="h1">Bán trú</h1><div class="spacer"></div><span id="topact"></span></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>

/* ========== TIỆN ÍCH ========== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const vn=n=>Number(n).toLocaleString('vi-VN');
const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4200)}
function closeM(){$('#mask').classList.remove('on')}
const mfns={};
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}

const THU=['CN','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const d2k=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const k2d=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const d2s=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
const k2s=k=>d2s(k2d(k));
const kThu=k=>THU[k2d(k).getDay()];
const laCuoiTuan=k=>[0,6].includes(k2d(k).getDay());
const HOMNAY='2026-10-23';               /* Thứ Sáu */
const NGAY_CHOT=['2026-10-22'];          /* ngày đã chốt số báo bếp (vùng B) */

/* ========== DỮ LIỆU NỀN ========== */
const DT={A:'Điểm trường A',B:'Điểm trường B',C:'Điểm trường C'};
const LOP=[

function soBuoiThuc(hs,th){

 const r=rng(hs.id.split('').reduce((a,c)=>a+c.charCodeAt(0),3)*(th==='2026-09'?31:57));

 nd.forEach(k=>{const t=k2d(k).getDay()+1;

  if(r()<0.045)return;              /* ~4,5% buổi nghỉ */
  n++});
 return n;
}

/* Tiền của một HS trong tháng */
/* ───── TIỀN CỦA MỘT HỌC SINH TRONG THÁNG ─────
   Bốn con số phải TÁCH BẠCH, v2.0 gộp nhầm hai cái đầu:
   ① dư đầu kỳ   — tiền thừa tháng trước, KHẤU TRỪ vào số phải đóng tháng này
   ② phải đóng   — số ghi trên thông báo = (buổi dự kiến × đơn giá) − dư đầu kỳ
   ③ đã thanh toán — TIỀN THỰC NHẬN, bản chiếu chỉ đọc từ M7.2
   ④ dư cuối kỳ  — (dư đầu kỳ + đã thanh toán) − (buổi thực tế × đơn giá)
                    dương = hoàn, chuyển sang tháng sau · âm = còn thiếu           */
const TT_TT={du:['Đã đóng đủ','o'],thieu:['Đóng thiếu','w'],chua:['Chưa đóng','r'],mien:['Dư đủ bù — không phải đóng','n']};
const _tc={};
function tienHS(hs,th){
 const key=hs.id+'|'+th+'|'+CFG.cheDoThu; if(_tc[key])return _tc[key];
 const duKien=soBuoiDuKien(hs,th), thuc=soBuoiThuc(hs,th);
 const mg=hs.mg?hs.mg.muc:0, gia=GIA_THU-mg;         /* đơn giá gia đình thực đóng */
 const duDau = th==='2026-09' ? 0 : Math.max(0,tienHS(hs,'2026-09').duCuoi);
 /* thu trước: phát hành theo buổi DỰ KIẾN · thu sau: phát hành theo buổi THỰC TẾ */
 const goc=(CFG.cheDoThu==='truoc'?duKien:thuc)*gia;
 const phaiDong=Math.max(0,goc-duDau);
 /* đã thanh toán — mô phỏng tất định thay cho dữ liệu M7.2 */
 let daTT=0,tt='mien';
 if(phaiDong>0){
  const r=rng(hs.id.split('').reduce((a,c)=>a+c.charCodeAt(0),11)*(th==='2026-09'?17:23))();
  if(r<0.72){daTT=phaiDong;tt='du'}
  else if(r<0.86){daTT=Math.round(phaiDong*0.6/1000)*1000;tt='thieu'}
  else {daTT=0;tt='chua'}
 }
 const phaiThuThuc=thuc*gia;
 const duCuoi=(duDau+daTT)-phaiThuThuc;
 const o={duKien,thuc,mg,gia,duDau,goc,phaiDong,daTT,tt,phaiThuThuc,duCuoi,
  hoan:Math.max(0,duCuoi),thieu:Math.max(0,-duCuoi),conPhaiThu:Math.max(0,phaiDong-daTT)};
 _tc[key]=o; return o;
}
function tongTien(dt,th){
 const o={hs:0,duKien:0,thuc:0,duDau:0,phaiDong:0,daTT:0,conPhaiThu:0,hoan:0,thieu:0,nsHoTro:0,
  n_du:0,n_thieu:0,n_chua:0,n_mien:0};
 LOP.filter(l=>l.dt===dt).forEach(l=>hsCuaLop(l.id).forEach(h=>{
  const d=DANGKY[h.id]; if(d&&d.tt==='huy'&&ngayCuaThang(th)[0]>=d.huyTu) return;
  const t=tienHS(h,th); o.hs++; o.duKien+=t.duKien; o.thuc+=t.thuc;
  o.duDau+=t.duDau; o.phaiDong+=t.phaiDong; o.daTT+=t.daTT; o.conPhaiThu+=t.conPhaiThu;
  o.hoan+=t.hoan; o.thieu+=t.thieu; o.nsHoTro+=t.mg*t.thuc; o['n_'+t.tt]++;
 }));
 return o;
}

 }));

}
function tongLop(lopId,th){

 hsCuaLop(lopId).forEach(h=>{
  const d=DANGKY[h.id]; if(d&&d.tt==='huy'&&ngayCuaThang(th)[0]>=d.huyTu) return;
  const t=tienHS(h,th); o.hs++; o.duDau+=t.duDau; o.phaiDong+=t.phaiDong; o.daTT+=t.daTT;
  o.conPhaiThu+=t.conPhaiThu; o.hoan+=t.hoan; o['n_'+t.tt]++; o.ds.push([h,t]);
 });
 return o;
}

function quyenCham(l,k){
 const r=R(), v=vungCua(k);
 if(v==='C+') return {ok:false,ly:'Tháng '+k.slice(5,7)+'/'+k.slice(0,4)+' đã được Hiệu trưởng ký công bố. Dữ liệu chỉ đọc.'};
 if(v==='C'&&!can('chambu')) return {ok:false,ly:'Tháng đã chốt (vùng C). Chỉ NV bán trú được đề nghị sửa, và phải qua PHT duyệt.'};
 if(v==='B'&&!can('chambu')) return {ok:false,ly:'Ngày '+k2s(k)+' đã chốt số báo bếp (vùng B). Chỉ NV bán trú được sửa kèm lý do.'};
 if(can('chambu')) return {ok:true,nhan:v==='A'?null:'bu'};
 if(!can('cham')) return {ok:false,ly:'Vai <b>'+esc(r.cd)+'</b> không có quyền chấm ăn.'};
 if(l.cham===r.n) return {ok:true};
 if(DUPHONG[l.dt]===r.n){
  const dn=dangNghi(l.cham,k);
  if(dn) return {ok:true,nhan:'thay',vi:'Người chấm chính <b>'+esc(l.cham)+'</b> có đơn nghỉ đã duyệt ('+esc(dn.ly)+', '+esc(dn.ma)+') 🔗 M4.8'};
  if(quaDeadline()&&!CHAM[ckey(k,l.id)]) return {ok:true,nhan:'thay',vi:'Đã quá deadline '+CFG.deadline+' mà lớp chưa có dữ liệu'};
  const con=gio2p(CFG.deadline)-gio2p(simGio);
  return {ok:false,duphong:1,ly:'Người chấm chính là <b>'+esc(l.cham)+'</b> — không có đơn nghỉ ngày '+k2s(k)
   +'. Quyền dự phòng mở lúc <b>'+CFG.deadline+'</b>'+(con>0?', còn <b>'+con+' phút</b>':'')+'.'};
 }
 return {ok:false,ly:'Bạn không được phân công chấm lớp '+l.id+'. Người chấm: <b>'+esc(l.cham)+'</b>'
  +(l.gvcn===r.n?' — bạn là GVCN lớp này nhưng <b>không được phân công chấm</b> (⚙ Cấu hình)':'')+'.'};
}

   RANH GIỚI SỞ HỮU — nhìn thấy được ngay trong cấu trúc màn hình:
   · sub-view «Chốt sổ tháng»      → M6.1 SỞ HỮU. Chỉ SỐ LƯỢNG: số buổi ăn, số suất báo bếp.
   · sub-view «Tình trạng thu tiền» → BẢN CHIẾU CHỈ ĐỌC từ M7.2. Mọi con số tiền do M7.2 tính
                                      và trả về; M6.1 không tính, không sửa, không nhắc nợ.
   Vì sao: nhân đơn giá trở đi thì không còn gì đặc thù bán trú — giống hệt học phí và ngoại khóa.
   Làm riêng ở đây là dựng cỗ máy tài chính thứ hai cho một khoản thu. */
let daXemHD=false;
function veQuyetToan(){
 let h=subtabs([['chot','Chốt sổ tháng'],['thu','Tình trạng thu tiền 🔗M7.2']],ST.sub==='thu'?'thu':'chot');
 return h+(ST.sub==='thu'?veTinhTrangThu():veChotSo());
}

/* ───── SUB-VIEW A · CHỐT SỔ THÁNG — M6.1 sở hữu ───── */
function veChotSo(){
 if(ST.moThang) return veChotChiTiet();
 const d=dtHieuLuc();
 const ds=Object.values(QT).filter(x=>d==='ALL'||x.dt===d);
 let h=scopeBar();
 h+=dnote('Tab này đổi tên từ «Quyết toán tháng» thành <b>Chốt sổ tháng</b>: «quyết toán» là từ của kế toán và hứa nhiều hơn '
  +'thứ menu này nên làm.<br><b>M6.1 chỉ chốt SỐ LƯỢNG</b> — số buổi ăn của từng em, số suất bếp phải nấu. '
  +'Đó là hai con số <b>không menu nào tính hộ được</b>. Nhân đơn giá trở đi là việc của M7.1 và M7.5.');
 h+='<div class="tbw"><div class="tbx"><table><tr><th>Tháng · Điểm trường</th><th class="num">Ngày ăn</th>'
  +'<th class="num">Số buổi ăn (HS)</th><th class="num">Suất báo bếp</th><th>Bàn giao tài chính</th>'
  +'<th>Trạng thái</th><th></th></tr>';
 ds.sort((a,b)=>b.th.localeCompare(a.th)||a.dt.localeCompare(b.dt)).forEach(x=>{
  const [n,c]=TT_QT[x.tt], t=tongTien(x.dt,x.th);
  h+='<tr><td><b>Tháng '+Number(x.th.slice(5,7))+'/'+x.th.slice(0,4)+'</b> — '+DT[x.dt]+'</td>'
   +'<td class="num">'+(x.th==='2026-10'?NGAY_T10_QUA.length+' / 22':ngayCuaThang(x.th).length)+'</td>'
   +'<td class="num"><b>'+vn(t.thuc)+'</b></td>'
   +'<td class="num">'+(x.chi?vn(x.chi.suat):'<span style="color:var(--ink3)">chưa đối soát</span>')+'</td>'
   +'<td>'+(x.bg?'<span class="st2 o">✓ M7.2 · M7.5</span>':'<span class="st2 n">chưa bàn giao</span>')+'</td>'
   +'<td><span class="st2 '+c+'">'+n+'</span></td>'
   +'<td><button class="btn xs" data-qt="'+x.dt+'|'+x.th+'">Mở ▸</button></td></tr>';
 });
 return h+'</table></div></div>';
}
function veChotChiTiet(){
 const x=qtCur(), nt=NHATHAU[x.dt], [tn,tc]=TT_QT[x.tt], t=tongTien(x.dt,x.th);
 let h='<div class="crumb"><a data-back="qt">Bán trú</a> › <a data-back="qt">Chốt sổ tháng</a> › <b>Tháng '
  +Number(x.th.slice(5,7))+'/'+x.th.slice(0,4)+' — '+DT[x.dt]+'</b> <span class="st2 '+tc+'">'+tn+'</span></div>';
 if(x.tt==='daKy') h+='<div class="alert g"><span>✅</span><span class="sp"><b>Hiệu trưởng '+esc(x.ky.ai)+' đã ký Biên bản chốt số buổi ngày '+x.ky.ngay+'.</b> '
   +'Đây là <b>vùng C+</b> — số đã bàn giao sang tài chính, <b>không sửa ngược</b>.</span></div>';
 if(x.tt==='dangchay') h+='<div class="alert w"><span>⏳</span><span class="sp">Tháng chưa kết thúc — mới có <b>'+NGAY_T10_QUA.length+'/22 ngày</b>. Số liệu là <b>tạm tính</b>.</span></div>';
 h+='<div class="steps">'+[['1','Chốt số buổi ăn'],['2','Đối soát với nhà bếp'],['3','Bàn giao sang tài chính']]
  .map(([n,tt])=>'<button class="stp'+(ST.buoc==n?' on':'')+(ST.buoc>n?' done':'')+'" data-buoc="'+n+'">'
   +(ST.buoc>n?'✓':n)+' '+tt+'</button>').join('')+'</div>';
 if(ST.buoc==1) h+=csB1(x,t); else if(ST.buoc==2) h+=csB2(x,t,nt); else h+=csB3(x,t,nt);
 return h;
}
/* Bước 1 — chốt số buổi ăn. Đây là thứ DUY NHẤT chỉ M6.1 tính được. */
function csB1(x,t){
 const nd=ngayCuaThang(x.th).filter(k=>x.th==='2026-09'||k<=HOMNAY);
 let h=dnote('Số buổi ăn là <b>dẫn xuất</b> từ Đăng ký × Đơn nghỉ của từng ngày — không nhập tay ở bất kỳ đâu. '
  +'Ngân sách nhà nước hỗ trợ quyết toán <b>theo số ngày ăn thực tế</b>, nên bước này bắt buộc dù trường thu trước hay thu sau.');
 h+='<div class="bar"><span class="chip">Tổng số buổi ăn <b style="margin-left:4px">'+vn(t.thuc)+'</b></span>'
  +'<span class="chip">'+t.hs+' học sinh</span><div class="spacer"></div>'
  +(can('xuat')?'<button class="btn" id="xuatBuoi">📤 Xuất bảng số buổi theo học sinh</button>':'')+'</div>';
 h+='<div class="tbw"><div class="tbx"><table><tr><th>Ngày</th><th class="num">Suất báo bếp</th><th class="num">Ăn hết</th>'
  +'<th class="num">Ăn ít</th><th class="num">Không ăn</th><th>Ảnh khay</th></tr>';
 let tong=0;
 nd.forEach(k=>{
  const lps=LOP.filter(l=>l.dt===x.dt);
  const suat=lps.reduce((s,l)=>s+hsSuatAn(l.id,k).length,0); tong+=suat;
  let d={het:0,it:0,khong:0},coCham=0;
  lps.forEach(l=>{const m=demMuc(l.id,k);if(m){coCham++;d.het+=m.het;d.it+=m.it;d.khong+=m.khong}});
  const kh=khoiCua(x.dt), anh=kh.filter(y=>ANHKHOI[akey(k,x.dt,y)]).length;
  h+='<tr><td>'+k2s(k)+' <span style="color:var(--ink3);font-size:11px">'+kThu(k).replace('Thứ ','T')+'</span></td>'
   +'<td class="num"><b>'+suat+'</b></td>'
   +'<td class="num">'+(coCham?d.het:'<span style="color:var(--ink3)">—</span>')+'</td>'
   +'<td class="num">'+(coCham?(d.it?'<b style="color:var(--amber)">'+d.it+'</b>':0):'<span style="color:var(--ink3)">—</span>')+'</td>'
   +'<td class="num">'+(coCham?(d.khong?'<b style="color:var(--red)">'+d.khong+'</b>':0):'<span style="color:var(--ink3)">—</span>')+'</td>'
   +'<td>'+(anh?'📷 '+anh+'/'+kh.length+' khối':'<span style="color:var(--ink3)">—</span>')+'</td></tr>';
 });
 h+='<tr class="totrow"><td><b>TỔNG</b></td><td class="num"><b>'+vn(tong)+'</b></td><td colspan="4"></td></tr>';
 h+='</table></div><div class="lgd"><span class="chip">Cột <b>Suất báo bếp</b> là con số bàn giao sang tài chính</span>'
  +'<span class="chip">Ba cột chấm ăn là dữ liệu <b>chăm sóc</b> — nhiều «ăn ít» cùng ngày là tín hiệu về món ăn, không phải về tiền</span></div></div>';
 return h+'<div class="bar"><div class="spacer"></div><button class="btn p" data-buoc="2">Sang bước 2 — Đối soát nhà bếp ▸</button></div>';
}
/* Bước 2 — đối soát SỐ LƯỢNG với nhà bếp. Tiền chi là việc của M7.5. */
function csB2(x,t,nt){
 const suatNT=x.chi?x.chi.suat:null, lech=suatNT==null?null:suatNT-t.thuc;
 let h=dnote('Đối soát ở đây là <b>đối soát số lượng</b>: trường chấm bao nhiêu suất, nhà bếp báo bao nhiêu. '
  +'M7.5 không biết bếp nấu bao nhiêu nên việc này chỉ M6.1 làm được.<br>'
  +'<b>Số tiền chi</b> chỉ hiện để đối chiếu — <b>giao dịch chi do M7.5 ghi</b>, không nhập ở đây.');
 h+='<div class="tbw">'
  +'<div class="kv"><span>Nhà bếp / nhà thầu</span><b>'+esc(nt.ten)+'</b></div>'
  +'<div class="kv"><span>Hợp đồng</span><b>'+esc(nt.hd)+'</b></div>'
  +'<div class="kv"><span>Suất báo bếp — <b>hệ thống tính</b></span><b>'+vn(t.thuc)+' suất</b></div>'
  +'<div class="kv"><span>Suất nhà bếp báo <span style="color:var(--ink3);font-size:11px">nhập từ bảng kê</span></span>'
  +'<b>'+(suatNT==null?'<span style="color:var(--ink3)">chưa nhập</span>':vn(suatNT)+' suất')+'</b></div>'
  +(lech?'<div class="kv" style="background:var(--red-soft)"><span style="color:var(--red)"><b>Lệch</b></span>'
    +'<b style="color:var(--red)">'+(lech>0?'+':'')+lech+' suất</b></div>':'')
  +'<div class="kv tot"><span><b>Số suất kết luận</b> — con số bàn giao</span><b>'+vn(suatNT==null?t.thuc:suatNT)+' suất</b></div>'
  +'</div>';
 h+='<div class="ro" style="margin-top:11px">Quy đổi ra tiền để đối chiếu: <b>'+vn(suatNT==null?t.thuc:suatNT)+'</b> suất × '
  +vn(nt.gia_chi)+'đ = <b>'+vn((suatNT==null?t.thuc:suatNT)*nt.gia_chi)+'đ</b>. '
  +'Đây <b>chỉ là phép nhân để kiểm tra</b> — khoản chi thực tế do <b>M7.5</b> ghi nhận và thanh toán.</div>';
 h+='<div class="card" style="margin-top:12px"><div class="ch">Bảng kê / hóa đơn của nhà bếp</div><div class="cb">'
  +'<div class="f"><div class="k">Tệp đính kèm</div><div class="v">'
  +(x.chi&&x.chi.tep?'📄 '+esc(x.chi.tep)+' <button class="btn xs" id="xemHD">👁 Xem</button><button class="btn xs" id="taiHD">⬇ Tải</button>'
    :'<span style="color:var(--ink3);font-weight:400">Chưa đính kèm</span>')+'</div></div>'
  +'<div class="f"><div class="k">Đối chiếu</div><div class="v"><label style="font-weight:400;display:flex;gap:7px;align-items:center">'
  +'<input type="checkbox" id="tickHD"'+(daXemHD?'':' disabled')+'> Đã đối chiếu bảng kê với số suất hệ thống tính</label>'
  +(daXemHD?'':'<span class="tg b">chỉ bật sau khi đã mở xem tệp</span>')+'</div></div>'
  +'</div><div class="cact">'+(can('quyettoan')?'<button class="btn sm p" id="nhapChi">✏️ Nhập số suất nhà bếp báo</button>':'')+'</div></div>';
 return h+'<div class="bar"><button class="btn" data-buoc="1">◀ Quay lại</button><div class="spacer"></div>'
  +'<button class="btn p" data-buoc="3">Sang bước 3 — Bàn giao ▸</button></div>';
}
/* Bước 3 — bàn giao hai con số sang tài chính. M6.1 dừng ở đây. */
function csB3(x,t,nt){
 const suat=x.chi?x.chi.suat:t.thuc;
 const b=[['NV bán trú trình',!['chotso','dangchay'].includes(x.tt)],['PHT duyệt',['choKy','daKy'].includes(x.tt)],
  ['HT ký Biên bản chốt số buổi',x.tt==='daKy'],['Bàn giao M7.2 · M7.5',!!x.bg]];
 let h='<div class="tbw" style="padding:13px"><div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">'
  +b.map(([n,d],i)=>'<span class="stp '+(d?'done':'')+'">'+(d?'✓':i+1)+' '+n+'</span>'+(i<3?'<span style="color:var(--ink3)">▶</span>':'')).join('')+'</div></div>';
 h+=dnote('M6.1 <b>bàn giao đúng hai con số</b> rồi dừng. Không tính tiền học sinh, không phát hành hóa đơn, '
  +'không ghi giao dịch chi, <b>không xuất file kế toán</b> — M7.5 được giao việc đó trong khung menu, làm ở đây là ra hai tệp cho cùng một tháng.');
 h+='<div class="tbw" style="margin-top:11px"><div class="ch">Hai con số bàn giao</div><div class="cb">'
  +'<div class="f"><div class="k">→ <b>M7.2</b> Khoản thu &amp; Hóa đơn HS</div><div class="v" style="flex-direction:column;align-items:flex-start;gap:3px">'
  +'<b>Số buổi ăn của từng học sinh</b> — '+t.hs+' học sinh · tổng '+vn(t.thuc)+' buổi'
  +'<span style="font-weight:400;font-size:11.5px;color:var(--ink2)">M7.1 nhân đơn giá, trừ miễn giảm, khấu trừ dư, phát hành và thu tiền</span></div></div>'
  +'<div class="f"><div class="k">→ <b>M7.5</b> Thu chi &amp; Báo cáo tài chính</div><div class="v" style="flex-direction:column;align-items:flex-start;gap:3px">'
  +'<b>'+vn(suat)+' suất</b> × '+vn(nt.gia_chi)+'đ theo '+esc(nt.hd)
  +'<span style="font-weight:400;font-size:11.5px;color:var(--ink2)">M7.5 ghi giao dịch chi và xuất file cho phần mềm kế toán</span></div></div>'
  +'</div>'+(x.bg?'<div class="lgd"><span class="chip">✅ Đã bàn giao '+esc(x.bg.luc)+' bởi '+esc(x.bg.ai)+'</span></div>':'')+'</div>';
 h+='<div class="bar"><button class="btn" data-buoc="2">◀ Quay lại</button><div class="spacer"></div>';
 if(['chotso','dangchay'].includes(x.tt)&&can('trinh')) h+='<button class="btn p" id="trinhThang">📨 Trình PHT duyệt</button>';
 else if(x.tt==='choDuyet'&&can('duyetThang')) h+='<button class="btn" id="traLai">↩ Trả lại</button><button class="btn p" id="duyetThang">✅ Duyệt và trình HT ký</button>';
 else if(x.tt==='choKy'&&can('kyThang')) h+='<button class="btn" id="traLai">↩ Trả lại</button><button class="btn p" id="kyThang">🔏 Ký Biên bản chốt số buổi</button>';
 else if(x.tt==='daKy'&&!x.bg&&can('quyettoan')) h+='<button class="btn p" id="banGiao">↗ Bàn giao sang M7.2 và M7.5</button>';
 else if(x.tt==='daKy'&&x.bg) h+='<span class="chip">✅ '+esc(x.ky.ai)+' ký '+x.ky.ngay+(x.ky.kyso?' — có chữ ký số':' — <b>chưa ký số</b>')+'</span>'
   +'<button class="btn" data-lnk="M7.5">↗ Xem khoản chi tại M7.5</button>';
 else h+='<span class="chip">Vai '+esc(R().cd)+' không có quyền ở bước này</span>';
 return h+'</div>';
}

/* ───── SUB-VIEW B · TÌNH TRẠNG THU TIỀN — BẢN CHIẾU CHỈ ĐỌC TỪ M7.2 ───── */
function veTinhTrangThu(){
 const dt=dtThuc(), th=(ST.moThang?ST.moThang.split('|')[1]:'2026-09');
 const x={dt,th}, t=tongTien(dt,th), chip=ST.chipTT||'all';
 let h='<div class="alert b"><span>🔗</span><span class="sp"><b>Toàn bộ số liệu tiền ở màn hình này do M7.2 tính và trả về.</b> '
  +'M6.1 <b>không tính, không sửa, không phát hành, không nhắc nợ</b> — chỉ hiển thị để nhân viên bán trú biết lớp nào chưa đóng mà nhắc giáo viên chủ nhiệm. '
  +'Mọi thao tác đều là deep-link sang M7.2.<br>'
  +'<span style="font-size:11.5px">📌 Dữ liệu lấy <b>tại thời điểm mở màn hình</b> — '+k2s(HOMNAY)+' '+simGio+'. '
  +'Con số có thể khác báo cáo đã ký nếu phụ huynh đóng thêm sau đó.</span></span></div>';
 h+='<div class="bar"><select class="fs" id="thangTT">'
  +['2026-09','2026-10'].map(m=>'<option value="'+m+'"'+(m===th?' selected':'')+'>Tháng '+Number(m.slice(5,7))+'/2026</option>').join('')
  +'</select><span class="chip">'+DT[dt]+'</span><div class="spacer"></div>'
  +'<button class="btn" data-lnk="M7.2">↗ Mở M7.2 để nhắc nợ / thu tiền</button></div>';
 h+=dnote('Đây là <b>phương án giữa</b> đã chốt: giữ bảng chiếu <b>đầy đủ</b> (gồm cả dư và phải đóng) nhưng '
  +'<b>số do M7.2 tính và trả về</b> — vẫn một nguồn sự thật, M6.1 chỉ hiển thị nhiều hơn.<br>'
  +'Cái mất nếu bỏ hẳn: nhân viên bán trú phải mở M7.2 mới biết lớp nào chưa đóng, mà họ thường không có quyền ở đó. '
  +'Cái giữ được: <b>không có con số nào do M6.1 tự tính</b>, nên không thể lệch với tài chính.');
 const oTile=(nhan,gt,mau,phu)=>'<div style="flex:1;min-width:158px;background:var(--surface);border:1px solid var(--line);'
  +'border-left:3px solid '+mau+';border-radius:11px;padding:10px 13px">'
  +'<div style="font-size:11.5px;color:var(--ink2)">'+nhan+'</div>'
  +'<div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px">'+gt+'</div>'
  +(phu?'<div style="font-size:11px;color:var(--ink3);margin-top:1px">'+phu+'</div>':'')+'</div>';
 h+='<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px">'
  +oTile('Khấu trừ từ tháng trước',vn(t.duDau)+'đ','var(--violet)',t.duDau?'M7.2 đã trừ vào số phải đóng':'tháng đầu — chưa có dư')
  +oTile('Tổng phải đóng',vn(t.phaiDong)+'đ','var(--brand)','sau khấu trừ')
  +oTile('Đã thanh toán',vn(t.daTT)+'đ','var(--green)',Math.round(t.daTT/(t.phaiDong||1)*100)+'% số phải đóng')
  +oTile('Chưa thu được',vn(t.conPhaiThu)+'đ','var(--red)',(t.n_thieu+t.n_chua)+' gia đình')
  +oTile('Dư sang tháng sau',vn(t.hoan)+'đ','var(--amber)','M7.2 khấu trừ vào đợt thu kế')
  +'</div>';
 const ch=[['all','Tất cả',t.hs],['chua','Chưa đóng',t.n_chua],['thieu','Đóng thiếu',t.n_thieu],
  ['du','Đã đóng đủ',t.n_du],['mien','Dư đủ bù',t.n_mien]];
 h+='<div class="bar">'+ch.map(([k,n,c])=>'<button class="chip'+(chip===k?' on':'')+'" data-chtt="'+k+'">'+n
   +' <b style="margin-left:4px">'+c+'</b></button>').join('')
  +'<div class="spacer"></div><span class="chip">Công thức và đơn giá thuộc M7.1 <span class="rolnk" data-lnk="M7.1">🔗</span></span></div>';
 h+='<div class="tbw"><div class="tbx"><table style="min-width:880px"><tr>'
  +'<th>Lớp / Học sinh</th><th class="num">Buổi DK</th><th class="num">Buổi TT</th>'
  +'<th class="num">Dư đầu kỳ</th><th class="num">Phải đóng</th><th class="num">Đã thanh toán</th>'
  +'<th>Tình trạng</th><th class="num">Dư cuối kỳ</th></tr>';
 let hienThi=0;
