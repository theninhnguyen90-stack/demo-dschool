<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M5.1 Kế hoạch giảng dạy — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--amber);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--amber);color:#fff}
.totabs{display:flex;gap:4px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-top:none;
 border-radius:0 0 10px 10px;padding:6px 10px 6px 22px;flex-wrap:wrap}
.totabs .lb{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.totab{padding:4px 12px;border-radius:999px;font-size:12.5px;color:var(--ink2);border:1px solid transparent}
.totab:hover{background:#eef2f7}
.totab.on{background:#fff;border-color:var(--brand);color:var(--brand);font-weight:700}
.totab .vt{font-size:10px;opacity:.75;font-weight:400}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.scope.first{margin-top:12px}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber)}
.scope.rd{border-left-color:var(--red)}
.scope.vi{border-left-color:var(--violet)}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.qf{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;background:#fff}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1240px){.stage.open .listw{display:none}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow .ar{color:var(--ink3);font-size:10px;width:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.sub{padding-left:26px}
.hrow.gone{opacity:.6}
.gk{grid-template-columns:1.8fr 1.15fr 1.15fr 1.05fr 1fr 1.05fr 1.5fr}
.stage.open .gk{grid-template-columns:1.7fr 1.2fr}
.stage.open .kx{display:none}
.gr{grid-template-columns:1.5fr .9fr 1.2fr 1.9fr 1.5fr}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.eye{font-size:11px;color:var(--brand);border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:1px 7px}
.eye:hover{background:#e0e7ff}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.bc{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.bc button{color:var(--brand);font-weight:600}
.bc button:hover{text-decoration:underline}
.bc .cur{font-weight:700;color:var(--ink)}
.sumbar{display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;
 padding:9px 13px;flex-wrap:wrap;position:sticky;top:56px;z-index:25}
.mt{font-size:12px;color:var(--ink2);border-right:1px solid var(--line);padding-right:11px;line-height:1.35}
.mt b{display:block;font-size:14px;color:var(--ink);font-weight:700}
.mt.bad b{color:var(--red)}.mt.wr b{color:var(--amber)}.mt.gd b{color:var(--green)}

.wt{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface)}
.wt th{text-align:left;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;
 padding:7px 8px;border-bottom:1px solid var(--line);background:#f8fafc}
.wt td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wt tr.sel td{background:#eff6ff}
.wt tr.hl td{background:#fef08a}
.wt tr.now td{background:#eef2ff;box-shadow:inset 3px 0 0 var(--brand)}
.wt .wk{font-weight:700;white-space:nowrap}
.wt .wk .dd{display:block;font-weight:400;color:var(--ink3);font-size:10.5px}
.wt .wk .hk{font-size:9.5px;font-weight:700;color:var(--ink3)}
.ci{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-size:12.5px;background:transparent}
.ci:hover{border-color:var(--line)}
.ci:focus{border-color:var(--brand);background:#fff;outline:none}
.ci.num{width:52px;text-align:center}
.ci[readonly]{background:#f8fafc;color:var(--ink2);cursor:not-allowed}
.ci[readonly]:hover{border-color:transparent}
.tetrow td{background:#f1f5f9;color:var(--ink2);font-size:11.5px;text-align:center;font-weight:600;padding:7px}
.tdi{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;font-weight:600}
.tdi.tay{color:var(--violet)}
.wtw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;margin-top:9px}
.ptw{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:11px;max-height:70vh}
.ptw th{position:sticky;top:0;z-index:20}
.bulkbar{display:flex;align-items:center;gap:8px;padding:8px 13px;background:#0f172a;color:#fff;font-size:12.5px;flex-wrap:wrap}
.bulkbar .sp{flex:1}
.bulkbar .btn{background:#1e293b;border-color:#334155;color:#e2e8f0}
.bulkbar .btn:hover{background:#334155}
.sech{font-size:13px;font-weight:700;margin:16px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sech .pill{font-weight:400}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:15px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbody{padding:13px 15px;max-height:calc(100vh - 300px);overflow-y:auto}
.pfoot{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}
.f{display:grid;grid-template-columns:148px 1fr;gap:11px;align-items:start;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11.5px;background:#fff;margin:0 4px 4px 0}

.viewer{display:grid;grid-template-columns:1fr 190px;gap:12px}
@media(max-width:760px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:250px;display:grid;place-items:center;position:relative;overflow:hidden}
.vsheet{background:#fff;width:82%;height:88%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:14px 16px;font-size:8.5px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:9.5px;text-align:center;font-weight:800;margin-bottom:6px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:4px 0}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.dtbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.dtbl th{background:#f8fafc;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:700}
.dtbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dtbl .old{background:var(--red-soft);color:#991b1b;border-radius:5px;padding:3px 6px;display:inline-block}
.dtbl .new{background:var(--green-soft);color:#065f46;border-radius:5px;padding:3px 6px;display:inline-block}

.res{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:9px}
.resh{padding:7px 11px;font-size:12px;font-weight:700}
.resh.ok{background:var(--green-soft);color:#065f46}
.resh.sk{background:var(--amber-soft);color:#92400e}
.resh.er{background:var(--red-soft);color:#991b1b}
.resr{padding:6px 11px;font-size:12.5px;border-top:1px solid var(--line);display:flex;gap:9px}
.resr .w{min-width:170px;font-weight:600}
.resr .r{color:var(--ink2);flex:1}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:880px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.blk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.blk:last-child{border-bottom:none}
.blk .ic{flex:0 0 18px;font-size:13px}
.blk .tx{flex:1}
.blk .tx b{display:block}
.stepn{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:12px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--bg);color:var(--ink2)}
.stp.on{background:var(--brand);color:#fff;font-weight:700}
.stp.dn{background:var(--green-soft);color:var(--green);font-weight:600}
.lbl{font-size:12px;color:var(--ink2);display:block;margin:9px 0 3px}
.lbl b{color:var(--red)}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:15px;text-align:center;color:var(--ink3);font-size:12.5px;cursor:pointer}
.drop:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.drop.has{border-style:solid;border-color:var(--green);background:var(--green-soft);color:#065f46;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:8px 13px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35}
.sgb b{display:block}
.sgb span{font-size:10.5px;color:var(--ink3)}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.sgb.on span{color:var(--brand)}

.two{display:grid;grid-template-columns:1fr 300px;gap:12px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.boxh{padding:8px 11px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.boxb{max-height:330px;overflow-y:auto}
.lrow{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center;cursor:pointer}
.lrow:hover{background:var(--brand-soft)}
.lrow.busy{opacity:.6;cursor:not-allowed;background:#fafbfc}
.lrow.busy:hover{background:#fafbfc}
.lrow b{display:block}
.lrow .s{display:block;font-size:10.5px;color:var(--ink3)}
.lrow .rm{color:var(--ink3);font-weight:700;padding:0 5px;cursor:pointer}
.lrow .rm:hover{color:var(--red)}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.r::before{background:var(--red)}.logi.g::before{background:var(--green)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}

/* ================= GDDP-1A — tang ④ chia tiet theo phan · tang ⑤ lich trien khai ================= */
.ptc{display:inline-block;padding:1px 6px;border-radius:9px;background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:600}
.ptc.n{background:#f1f5f9;color:#64748b;font-weight:500}
.phanbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfdff}
.fgh2{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink);margin-bottom:4px}
.fgh2 .sp{flex:1}

 return uniq(a);

function chiaDu(k){const c=chiaEff(k);return !!c&&!c.some(x=>x.tiet==null)}
function tongChia(k){const c=chiaEff(k);return c?c.reduce((a,x)=>a+(x.tiet||0),0):0}

/* Tang ⑤ — lich trien khai phan THEO LOP. Khoa (khgd_id, lop_id, phan_ma);
   mot dong mang MOT DAY DOAN khoang tuan — ✂ Cat phan tai tuan chia doan, KHONG de dong moi */
function lichEff(k,lop){
 const ps=phanKH(k);if(!ps)return [];
 const W=soTuanNam(k),cur=(k.lich&&k.lich[lop])||null;
 return ps.map(function(p){const r=cur&&cur[p.ma];
  return {ma:p.ma,ten:p.ten,stt:r?r.stt:null,khai:!!r,
   doan:(r&&r.doan&&r.doan.length)?r.doan.map(d=>({tu:d.tu,den:d.den,bg:!!d.bg})):[{tu:1,den:W,bg:false}]};
 });
}
function chuaKhaiLich(k){return !(k.lich&&Object.keys(k.lich).length)&&!(k.vong&&k.vong.bang)}

/* Cac phan phu mot TUAN cua mot lop — nguon: bang rai (neu co) hoac bang ⑤ */
function phanTuan(k,lop,w){
 if(k.vong&&k.vong.bang){
  const r=tietRange(k,w),m={};
  for(let i=r[0];i<=r[1];i++){const p=k.vong.bang[i-1];if(p)m[p]=(m[p]||0)+1}
  return Object.keys(m).map(ma=>({ma:ma,stt:m[ma]}));
 }
 return lichEff(k,lop).filter(r=>r.doan.some(d=>d.tu<=w&&w<=d.den))
  .map(r=>({ma:r.ma,stt:r.stt==null?tietTuanCua(k,w):r.stt}));
}
function gomW(ws){/* [1,2,3,7,8] -> "1–3 · 7–8" */
 if(!ws.length)return '';
 const a=ws.slice().sort((x,y)=>x-y),o=[];let tu=a[0],tr=a[0];
 for(let i=1;i<a.length;i++){if(a[i]===tr+1){tr=a[i];continue}o.push(tu===tr?''+tu:tu+'–'+tr);tu=tr=a[i]}
 o.push(tu===tr?''+tu:tu+'–'+tr);return o.join(' · ');
}

/* ----- RANG BUOC 3 — Σ so tiet cac phan = so tiet/nam (CHAN) ----- */
function kiemR3(k){
 if(!nhieuPhan(k))return null;
 const c=chiaEff(k),thieu=c.filter(x=>x.tiet==null);
 if(thieu.length)return {thieu:thieu.map(x=>x.ten)};
 const t=tongChia(k);
 if(k.tietNam!=null&&t!==k.tietNam)return {tong:t,can:k.tietNam,lech:t-k.tietNam,ds:c};
 return null;
}
/* ----- RANG BUOC 4 — KHGD chi gan duoc cac lop CUNG phuong thuc (CHAN) ----- */
function kiemR4(nam,mon,lops){
 if(!mon||lops.length<2)return null;
 const m={};lops.forEach(t=>{const p=ptLop(nam,t,mon);(m[p]=m[p]||[]).push(t)});
 const ks=Object.keys(m);if(ks.length<2)return null;
 ks.sort((a,b)=>m[b].length-m[a].length);
 return {chinh:ks[0],lech:ks.slice(1).map(p=>({pt:p,ten:ptCua(mon,p).ten,lop:m[p]})),nhom:m};
}
/* ----- RANG BUOC 5 — moi TUAN: Σ so_tiet_tuan cac phan phu tuan do = so tiet/tuan cua mon (CHAN) ----- */
function kiemR5(k){
 if(!nhieuPhan(k)||k.t1==null||k.t2==null)return [];
 const W=soTuanNam(k),out=[];
 k.lop.forEach(function(lop){
  const bad={};
  for(let w=1;w<=W;w++){
   const s=phanTuan(k,lop,w).reduce((a,x)=>a+(x.stt||0),0),c=tietTuanCua(k,w);
   if(s!==c){const key=s+'/'+c;(bad[key]=bad[key]||[]).push(w)}
  }
  const ks=Object.keys(bad);
  if(ks.length)out.push({lop:lop,nhom:ks.map(function(key){const p=key.split('/');
   return {co:+p[0],can:+p[1],tuan:gomW(bad[key]),so:bad[key].length}})});
 });
 return out;
}
/* ----- RANG BUOC 6 — khong tron noi tiep voi song song trong cung Lop × Mon (CHAN) ----- */
function kiemR6(k){
 if(!nhieuPhan(k))return [];
 const W=soTuanNam(k),out=[];
 k.lop.forEach(function(lop){
  const a=[],b=[];
  for(let w=1;w<=W;w++){const m=phanTuan(k,lop,w).length;if(m===1)a.push(w);else if(m>1)b.push(w)}
  if(a.length&&b.length)out.push({lop:lop,nt:gomW(a),ss:gomW(b)});
 });
 return out;
}
/* ----- RANG BUOC 9 — mot giao vien khong dung hai cho cung (o lich, tuan). CHAN — cua thu NHAT.
   Nhanh A (moi tuan dung 1 phan) ⇒ tap GV cua o co dung MOT nguoi ⇒ kiem CHINH XAC.
   Nhanh B (nhieu phan mot tuan) ⇒ M5.1 chua biet phan nao vao o nao (M4.6 quyet luc xep)
   ⇒ chi chan ca CHAC CHAN sai; con lai thuoc cua chan THU HAI o M4.6 luc cong bo. ----- */
function coOLich(k){return k.lop.some(l=>TKBO[l+'|'+k.mon])}
function xungDotR9(nam,chiKH){
 const map={};
 KH.filter(z=>z.nam===nam&&!z.go&&z.mon&&z.lop.length&&coOLich(z)).forEach(function(k){
  const W=soTuanNam(k);if(!W||k.t1==null)return;
  k.lop.forEach(function(lop){
   const os=oLich(lop,k.mon);if(!os.length)return;
   for(let w=1;w<=W;w++){
    const gvs=uniq(phanTuan(k,lop,w).map(p=>gvPhan(lop,k.mon,p.ma)).filter(Boolean));
    if(gvs.length!==1)continue;
    os.forEach(function(o){const key=o[0]+'|'+o[1]+'|'+w;
     (map[key]=map[key]||[]).push({lop:lop,mon:k.mon,gv:gvs[0],kh:k.id,o:o,w:w})});
   }
  });
 });
 const raw=[];
 Object.keys(map).forEach(function(key){
  const by={};map[key].forEach(x=>{(by[x.gv]=by[x.gv]||[]).push(x)});
  Object.keys(by).forEach(function(gv){const it=by[gv];if(it.length<2)return;
   raw.push({gv:gv,o:it[0].o,w:it[0].w,lops:uniq(it.map(x=>x.lop)),mons:uniq(it.map(x=>x.mon)),khs:uniq(it.map(x=>x.kh))})});
 });
 const g={};
 raw.forEach(function(r){const kk=r.gv+'|'+r.o[0]+'|'+r.o[1]+'|'+r.lops.join(',');(g[kk]=g[kk]||[]).push(r)});
 return Object.keys(g).map(function(kk){const a=g[kk];
  return {gv:a[0].gv,o:a[0].o,lops:a[0].lops,mons:a[0].mons,khs:uniq([].concat.apply([],a.map(x=>x.khs))),tuan:gomW(a.map(x=>x.w))}})
  .filter(x=>!chiKH||x.khs.indexOf(chiKH)>=0);

/* ----- R14 (CANH BAO, khong chan) — khoang tuan × so tiet/tuan ≠ so tiet cua phan o bang ④ ----- */
function lechTietPhan(k,lop){

 for(let w=1;w<=W;w++)phanTuan(k,lop,w).forEach(x=>{s[x.ma]=(s[x.ma]||0)+(x.stt||0)});
 return ch.filter(p=>p.tiet!=null&&(s[p.ma]||0)!==p.tiet)
  .map(p=>({ma:p.ma,ten:p.ten,co:s[p.ma]||0,can:p.tiet}));
}
/* ----- MO HINH — DAN XUAT tu cach khai, KHONG co o "chon kieu" (HDPC ⑤) ----- */
function moHinh(k){
 if(!nhieuPhan(k))return {k:'nen'};
 if(chuaKhaiLich(k))return {k:'chua'};
 if(kiemR6(k).length)return {k:'tron'};
 const W=soTuanNam(k);let mx=0;
 k.lop.forEach(l=>{for(let w=1;w<=W;w++){const m=phanTuan(k,l,w).length;if(m>mx)mx=m}});
 return mx<=1?{k:'A'}:{k:'B',n:mx};
}
function moHinhLoi(k){
 const m=moHinh(k);
 if(m.k==='nen')return '';
 if(m.k==='chua')return 'Lịch triển khai phần <b>chưa khai</b> — mọi phần đang nhận mặc định <i>cả năm học · bằng số tiết/tuần của môn</i>, nên mỗi tuần đang cộng dư. Khai xong thì mô hình tự hiện ra.';
 if(m.k==='tron')return '⛔ Đang <b>trộn nối tiếp với song song</b> trong cùng Lớp × Môn — ràng buộc 6 chặn lưu.';
 if(m.k==='A')return 'Các phần chạy <b>nối tiếp</b> — mỗi tuần một phần.';
 return 'Các phần chạy <b>song song</b> — mỗi tuần '+m.n+' phần.';

/* ================= VONG LAP → LICH (HDPC ⑤b) ================= */
function ucln(a,b){return b?ucln(b,a%b):a}
function xenKe(ds){/* rai deu cac phan trong mot vong — vi tri, chua phai lich */
 const tong=ds.reduce((a,x)=>a+x.n,0),acc=ds.map(()=>0),o=[];
 for(let i=0;i<tong;i++){let bi=0,bv=-1;
  ds.forEach(function(x,j){const v=(acc[j]+1)/x.n;if(bv<0||v<bv-1e-9){bv=v;bi=j}});
  acc[bi]++;o.push(ds[bi].ma);}
 return o;
}
function sinhVong(k){/* vong NGAN NHAT khop ti le bang ④ */
 const ch=chiaEff(k);if(!ch||ch.some(p=>p.tiet==null||p.tiet<=0))return null;
 let g=ch[0].tiet;ch.forEach(p=>{g=ucln(g,p.tiet)});

function raiVong(k,tuTuan,mat){

  if(i<start){bang.push(cu[i-1]||seq[(i-1)%L]);continue}
  bang.push(seq[((i-1-(mat||0))%L+L*99)%L]);
 }
 k.vong.bang=bang;
 k.vong.moc={ngay:HOMNAY,nguoi:NGUOI,tuTuan:tuTuan||1,mat:mat||0};
 return bang;
}

/* ================= GOI Y LICH XOAY VONG (HDPC ⑤c) ================= */
/* Giai doan CHUNG cho moi lop — bien tuan tinh tu so tiet cac phan theo thu tu mac dinh.
   Moi lop mot HOAN VI khac nhau tren cung bo giai doan ⇒ hinh vuong Latin. */
function giaiDoanChung(k){
 const ch=chiaEff(k);if(!ch||ch.some(p=>p.tiet==null))return null;
 const W=soTuanNam(k),o=[];let w=1,con=0;
 for(let i=0;i<ch.length;i++){
  con=ch[i].tiet;let tu=w;
  while(con>0&&w<=W){con-=tietTuanCua(k,w);w++}
  if(i===ch.length-1)w=W+1;
  o.push({tu:tu,den:Math.min(W,w-1)});

}

 k.lop.forEach(function(lop,i){

 });

  .filter(x=>x.d).sort((a,b)=>a.d.tu-b.d.tu);

/* ----- TINH NHANH (gop y 4) — lech thi canh bao, KHONG chan ----- */
function tinhNhanh(k){
 const n=namBy(k.nam),w1=tuanHK(n,1),w2=tuanHK(n,2);
 const a=k.t1!=null?k.t1*w1.thuc:null,b=k.t2!=null?k.t2*w2.thuc:null;
 const tong=(a!=null&&b!=null)?a+b:null;
 const khung=k.mon&&k.khoi?khungTiet(k.mon,k.khoi):null;
 return {w1:w1,w2:w2,a:a,b:b,tong:tong,
  lech:(tong!=null&&k.tietNam!=null)?tong-k.tietNam:null,
  khung:khung,lechKhung:(khung&&k.tietNam!=null&&k.tietNam!==khung)?k.tietNam-khung:0};
}
function canhBao(k){
 const q=tinhNhanh(k),o=[];
 if(q.lech)o.push({m:'tn',t:'Tính nhanh HK1 + HK2 = <b>'+q.a+' + '+q.b+' = '+q.tong+'</b> tiết, khác số tiết cả năm <b>'+k.tietNam+'</b> (lệch '+(q.lech>0?'+':'')+q.lech+')'});
 if(q.lechKhung)o.push({m:'kh',t:'Số tiết cả năm <b>'+k.tietNam+'</b> lệch khung CT GDPT 2018 của '+monTen(k.mon)+' khối '+k.khoi+' (<b>'+q.khung+'</b> tiết/năm)'});
 return o;
}

/* ----- PHAM VI DU LIEU — to (Group) · diem truong o header la BO LOC ----- */
function curTo(){if(!grp())return V.fTo||'';if(!V.to||!R().to.includes(V.to))V.to=R().to[0];return V.to}
function trongPhamVi(k){
 if(k.nam!==NAMID)return false;
 const t=toCua(k);
 if(grp())return t===curTo();
 if(V.fTo)return t===V.fTo;
 return true;
}
/* KHGD bi trong Diem truong (tu nhan ban) KHONG bi bo loc header cat — no dang can nguoi bo sung */
const quaDt=k=>!HDT||!k.dt||k.dt===HDT;
function baseKH(){return KH.filter(k=>trongPhamVi(k)&&quaDt(k))}
function rowsKH(){
 let r=baseKH();
 if(!V.gone)r=r.filter(x=>!x.go);
 if(V.bs)r=r.filter(canBoSung);
 const f=Object.keys(V.fTT);if(f.length)r=r.filter(x=>V.fTT[tt(x)]);
 const q=kd(V.q);if(q)r=r.filter(x=>kd(x.ten+' '+monTen(x.mon)+' '+x.khoi+' '+x.lop.join(' ')+' '+dtTen(x.dt)).indexOf(q)>=0);
 return r;
}

/* R1 — mot Lop × Mon × Nam hoc thuoc DUNG MOT KHGD (khong ke ban Da go) */
const giuBoi=(nam,mon,lop,tru)=>KH.filter(k=>k.nam===nam&&!k.go&&k.mon===mon&&k.id!==tru&&k.lop.includes(lop))[0];

/* ----- RA SOAT — Lop × Mon ma M4.6 KHONG xep TKB duoc ----- */
function rsRows(){
 const n=NAMC(),out=[];
 n.lop.forEach(function(l){
  if(HDT&&l.dt!==HDT)return;
  l.mon.forEach(function(ma){
   const to=n.to[ma]||null;
   if(grp()&&to!==curTo())return;
   if(!grp()&&V.fTo&&to!==V.fTo)return;
   const k=giuBoi(n.id,ma,l.ten,null);
   if(k){if(thieuTiet(k))out.push({lop:l,mon:ma,to:to,ly:'tiet',kh:k});return}
   const co=KH.filter(z=>z.nam===n.id&&!z.go&&z.mon===ma&&z.dt===l.dt&&z.khoi===l.khoi);
   out.push({lop:l,mon:ma,to:to,ly:co.length?'gan':'khong',kh:co[0]});
  });
 });
 return out.filter(r=>!V.rsGV||gvOf(r.mon,r.lop.ten));
}

   (doiCot?'<div class="blk"><div class="ic">⚠</div><div class="tx"><b>M2.5 · M10.1 ⑥ — số cột ĐGtx</b>'+tietCu[0]+' → '+r.tietNam+' tiết/năm vượt ngưỡng TT 22/2021 ('+cotTX(tietCu[0])+' → '+cotTX(r.tietNam)+' cột). M10.1 hiện cảnh báo lệch cho '+r.lop.length+' lớp — <b>không tự đổi</b> số cột đã cấu hình.</div></div>':''),

 }else if(!k)toast('✅ Đã tạo <b>'+esc(r.ten)+'</b> — '+(tt(r)==='Đang áp dụng'?'<b>Đang áp dụng</b>':'<b>Chưa đủ</b>: thiếu '+esc(thieuGi(r).join(', '))));

 render();

/* =================================================================================
   KE HOACH CHI TIET — N the bai hoc danh so (N = so bai) · man hinh day du + breadcrumb
   the = { ten · (tuy chon, thu gon) tiet · tuan · ycd }   — X2
   ================================================================================= */
const REW=/^\s*(\d+)\s*(?:[–-]\s*(\d+))?\s*$/;
function tuanOf(s){const m=REW.exec(s||'');if(!m)return null;const a=+m[1],b=m[2]?+m[2]:a;return b<a?null:[a,b]}
function padThe(x){if(x.soBai!=null)while(x.the.length<x.soBai)x.the.push({ten:''})}
function demThe(x){return {ten:soThe(x),tiet:x.the.filter(t=>t.tiet).length,tuan:x.the.filter(t=>t.tuan).length,
 ycd:x.the.filter(t=>t.ycd).length,tong:x.the.reduce((s,t)=>s+(t.tiet||0),0),phan:x.the.filter(t=>t.phan&&t.ten).length}}
/* Do phu noi dung theo PHAN — the bai gan duoc vao mot phan (o TUY CHON, khong bat buoc).
   🛑 Doan mang nhan Ban giao o tang ⑤ khong gom the bai va khong tinh vao do phu (rang buoc 10):
   Ban giao khong de them dong o bang ④ nen no khong bao gio xuat hien o day. */
function doPhu(x){
 const c=chiaEff(x);if(!c||c.length<2)return '';
 return '<div class="info" style="margin-top:10px">Độ phủ nội dung theo phần: '+
  c.map(p=>'<b>'+esc(p.ten)+'</b> '+x.the.filter(t=>t.phan===p.ma&&t.ten).length+' thẻ').join(' · ')+
  ' · <b>chưa gắn phần</b> '+x.the.filter(t=>!t.phan&&t.ten).length+' thẻ. <span class="s2">Gắn phần là <b>tùy chọn</b> — dùng cho báo cáo độ phủ, không chặn gì.</span></div>';
}

 padThe(x);
 const ro=!ghi('sua')||x.go,c=demThe(x),n=namBy(x.nam),soTuan=tuanHK(n,1).thuc+tuanHK(n,2).thuc;

 return '<div class="bc"><button data-x="back">Kế hoạch giảng dạy</button> › <button data-x="back">'+toTen(toCua(x))+'</button> › <span class="cur">'+esc(x.ten)+'</span> › <span class="cur">Kế hoạch chi tiết</span></div>'+
  (ro?'<div class="ro">🔒 Chỉ đọc — '+(!can('sua')?'vai '+role+' không có quyền Sửa':x.go?'KHGD Đã gỡ':'năm học '+n.ten+' '+TTNAM[n.tt])+'.</div>':'')+
  '<div class="sumbar"><div class="ctin" id="ctIn">'+sumCT(x,c)+'</div><div style="flex:1"></div>'+
   (!ro&&can('imp')?'<button class="btn sm" data-x="imp">📥 Import Excel</button>':'')+
   (!ro?'<button class="btn sm" data-x="goiYTuan" title="Điền tuần dự kiến cho thẻ có số tiết mà chưa có tuần">↻ Gợi ý tuần từ số tiết</button>':'')+
   '<button class="btn sm" data-x="allOpt">'+(V.allOpt?'⊖ Thu gọn ô tùy chọn':'⊕ Mở ba ô tùy chọn')+'</button>'+

  '<div class="info" style="margin-top:10px">'+(trang==='A'
   ?'✅ Mọi thẻ có <b>tuần dự kiến</b> → <b>M5.2</b> điền sẵn bài của tuần khi tạo giáo án, <b>M2.2</b> cảnh báo lệch tiến độ.'
   :trang==='B'?'Thẻ chưa có tuần dự kiến → <b>M5.2</b> và <b>M2.2</b> <b>lùi về danh sách bài để chọn</b> — không điền sẵn, không cảnh báo lệch tiến độ. Muốn có hai việc đó thì điền ô <b>tuần dự kiến</b> (hoặc số tiết rồi bấm Gợi ý tuần).'
   :'<b>'+c.tuan+'/'+x.soBai+'</b> thẻ có tuần dự kiến — M5.2 điền sẵn bài ở tuần có thẻ, tuần còn lại lùi về danh sách để chọn.')+'</div>'+
  (x.the.some(t=>{const w=tuanOf(t.tuan);return w&&w[1]>soTuan})?'<div class="warn">⚠ Có thẻ có tuần dự kiến vượt <b>'+soTuan+' tuần thực học</b> của năm '+n.ten+' (ô tô đỏ) — <b>cảnh báo, không chặn</b>: Phụ lục I gọi đây là thời điểm <i>dự kiến</i>.</div>':'')+
  (c.tiet===x.soBai&&x.tietNam!=null&&c.tong!==x.tietNam?'<div class="warn">⚠ Tổng tiết trên thẻ <b>'+c.tong+'</b> khác số tiết cả năm của KHGD <b>'+x.tietNam+'</b> — cảnh báo, không chặn.</div>':'')+

/* goi y tuan: cong don so tiet, HK1 theo t1, HK2 theo t2 — chi dien o dang trong */
function goiYTuan(x){
 const n=namBy(x.nam),w1=tuanHK(n,1).thuc;
 if(!x.t1||!x.t2){toast('⚠ Cần <b>số tiết/tuần HK1 và HK2</b> ở KHGD trước');return}
 const cap1=x.t1*w1,wk=a=>a<=cap1?Math.ceil(a/x.t1):w1+Math.ceil((a-cap1)/x.t2);
 let acc=0,dien=0,dung=0;
 for(let i=0;i<x.the.length;i++){const t=x.the[i];
  if(!t.tiet){dung=i+1;break}
  const tu=wk(acc+1),den=wk(acc+t.tiet);acc+=t.tiet;
  if(!t.tuan){t.tuan=tu===den?String(tu):tu+'–'+den;dien++}
 }
 const soTuan=w1+tuanHK(n,2).thuc,tran=x.the.filter(t=>{const w=tuanOf(t.tuan);return w&&w[1]>soTuan}).length;
 lg(x,'Gợi ý tuần dự kiến từ số tiết','Điền '+dien+' thẻ'+(tran?' · '+tran+' thẻ vượt '+soTuan+' tuần':''));
 toast('↻ Đã điền tuần dự kiến cho <b>'+dien+'</b> thẻ'+(dung?' · dừng ở <b>Bài '+dung+'</b> vì thẻ đó chưa có số tiết':'')+' — thẻ đã có tuần giữ nguyên'+
  (tran?'<br>⚠ <b>'+tran+'</b> thẻ vượt '+soTuan+' tuần thực học — tổng tiết trên thẻ lớn hơn số tiết của KHGD':''));
 render();
}

/* doi khop mot KHGD nguon sang nam dich */
function copy1(s,src,dst){
 const th={};let mon=s.mon,dt=s.dt,khoi=s.khoi;const lop=[],bo=[];
 if(mon&&!monNam(dst,mon)){th.mon='mã môn <b>'+mon+'</b> ('+monTen(mon)+') không có trong danh sách môn năm '+dst.ten;mon=null}
 if(dt&&!dst.dts.includes(dt)){th.dt='<b>'+dtTen(dt)+'</b> không có trong năm '+dst.ten+' (điểm trường đã đóng)';dt=null}
 else if(dt&&mon&&!monNam(dst,mon).dts.includes(dt)){th.dt=monTen(mon)+' không áp dụng ở <b>'+dtTen(dt)+'</b> năm '+dst.ten;dt=null}
 if(dt&&khoi&&!khoiCuaDt(dst,dt).includes(khoi)){th.khoi='Khối '+khoi+' không có ở '+dtTen(dt)+' năm '+dst.ten;khoi=null}
 s.lop.forEach(function(t){
  if(!dt){bo.push({t:t,ly:'chưa có điểm trường để đối khớp'});return}
  if(!khoi){bo.push({t:t,ly:'chưa có khối để đối khớp'});return}
  const l=dst.lop.filter(x=>x.ten===t&&x.dt===dt&&x.khoi===khoi)[0];
  if(!l){const ung=dst.lop.filter(x=>x.dt===dt&&x.khoi===khoi&&(!mon||x.mon.includes(mon))&&!s.lop.includes(x.ten)&&!(mon&&giuBoi(dst.id,mon,x.ten,null))).map(x=>x.ten);
   bo.push({t:t,ly:'không có lớp tên «'+t+'» ở '+dtTen(dt)+' × Khối '+khoi+(ung.length?' — lớp cùng khối chưa có KHGD môn này: <b>'+esc(ung.join(', '))+'</b> (đổi tên?)':'')});return}
  if(mon&&!l.mon.includes(mon)){bo.push({t:t,ly:'lớp '+t+' không học '+monTen(mon)+' năm '+dst.ten});return}
  const g=mon?giuBoi(dst.id,mon,t,null):null;
  if(g){bo.push({t:t,ly:'đã thuộc «'+g.ten+'» (R1)',r1:1});return}
  lop.push(t);
 });
 if(bo.length)th.lop=(lop.length?'giữ '+lop.length+'/'+s.lop.length+' lớp; ':'')+'bỏ '+bo.map(b=>'<b>'+esc(b.t)+'</b> — '+b.ly).join('; ');
 const r=addKH(dst,{ten:s.ten,mon:mon,dt:dt,khoi:khoi,lop:lop,khongThe:1,soBai:s.soBai,tietNam:s.tietNam,tt:[s.t1,s.t2],ghiChu:s.ghiChu,tep:[],ngay:HOMNAY,nguoi:NGUOI});
 r.the=s.the.map(t=>Object.assign({},t));
 r.thieuTT=Object.keys(th).length?th:null;
 r.nguonNB={nam:src.ten,ten:s.ten,d:HOMNAY,tep:s.tep.length};
 r.lichSu=[{d:HOMNAY,ng:NGUOI,cd:role,act:'Nhân bản từ năm '+src.ten,
  note:'Nguồn: '+s.ten+(s.tep.length?' · không copy '+s.tep.length+' file đính kèm':'')+(r.thieuTT?' · thiếu '+Object.keys(th).length+' trường':'')}];
 return {r:r,th:th,bo:bo};
}
function chayNB(){
 const src=namBy(NB.src),dst=namBy(NB.dst),ds=nguonNB(),kq={du:[],thieu:[],bq:[],gd:[]};
 const chay=[];
 ds.forEach(function(s){const cu=trungDich(s);
  if(!cu){chay.push(s);return}
  if(NB.quyet[s.id]==='ghide'&&can('ghide')){cu.go=true;lg(cu,'Ghi đè khi nhân bản','Chuyển Đã gỡ — thay bằng bản sao từ năm '+src.ten+' · '+cu.lop.length+' lớp được giải phóng');kq.gd.push(cu);chay.push(s)}
  else kq.bq.push(s);
 });
 chay.forEach(s=>{const o=copy1(s,src,dst);(o.r.thieuTT?kq.thieu:kq.du).push(o)});
 const tep=chay.reduce((a,k)=>a+k.tep.length,0);
 closeModal();V.tab='kh';V.pick=null;V.bs=false;render();

 modal('✅ Nhân bản xong — '+src.ten+' → '+dst.ten,

  '<div class="res"><div class="resh sk">⚠ KHGD tạo THIẾU — '+kq.thieu.length+' · bỏ trống đúng trường không khớp, gắn nhãn Thiếu thông tin</div><div class="rsc">'+
   kq.thieu.map(o=>'<div class="resr"><div class="w">'+esc(o.r.ten)+'</div><div class="r">'+Object.keys(o.th).map(f=>'<div>· <b>'+BB.filter(b=>b[0]===f)[0][1]+'</b>: '+o.th[f]+'</div>').join('')+'</div></div>').join('')+'</div></div>'+
  (kq.bq.length?'<div class="res"><div class="resh er">⏭ Bỏ qua do trùng tên — '+kq.bq.length+'</div><div class="rsc">'+kq.bq.map(s=>'<div class="resr"><div class="w">'+esc(s.ten)+'</div><div class="r">giữ nguyên bản đang có ở '+dst.ten+'</div></div>').join('')+'</div></div>':''),
  '<button class="btn" data-x="close">Đóng</button>'+(kq.thieu.length?'<button class="btn p" data-x="nbLoc">Lọc Cần bổ sung ('+kq.thieu.length+')</button>':''),'lg');
}

function dsTuan(n){

  const all=h.ds.map(w=>({w:w,hk:hk+1})).concat(h.nghi.map(x=>({w:x.w,hk:hk+1,nghi:x.dot})));

}

function dlgView(ten){
 modal('👁 '+esc(ten),'<div class="viewer"><div class="vpage"><div class="vsheet"><h4>KẾ HOẠCH DẠY HỌC</h4>'+
  '<div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>'+
  '<div class="vtool"><button>◀</button><button>1 / 3</button><button>▶</button><button>＋</button><button>－</button></div></div>'+
  '<div class="vmeta"><div class="r"><b>Tên tệp</b>'+esc(ten)+'</div><div class="r"><b>Ghi Audit Log</b>mọi lượt Xem và Tải</div>'+
  '<div style="margin-top:9px"><button class="btn xs" data-x="dl2">⬇ Tải</button></div></div></div>');
}
function dlgXuat(){
 modal('Xuất dữ liệu kế hoạch giảng dạy',
  '<label class="lbl">Xuất cái gì</label><div class="seg"><button class="sgb on"><b>Danh sách KHGD</b><span>phạm vi · số bài · phân phối · trạng thái</span></button>'+
  '<button class="sgb"><b>Một KHGD đầy đủ</b><span>kèm thẻ bài — mẫu Phụ lục I CV 5512</span></button>'+
  '<button class="sgb"><b>Bảng rà soát</b><span>Lớp × Môn đang chặn</span></button><button class="sgb"><b>Tiến độ theo tuần</b><span>dẫn xuất</span></button></div>'+
  '<div class="ro" style="margin-top:12px">M5.1 không chứa dữ liệu cá nhân học sinh — <b>không bắt chọn mục đích</b>. Mọi lượt xuất vẫn <b>ghi Audit Log</b>.</div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="doXuat">⬇ Xuất</button>');
}
const KX=id=>KH.filter(z=>z.id===id)[0];
document.addEventListener('click',function(e){
 const rb=e.target.closest('.rb');
 if(rb){role=rb.dataset.r;document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b===rb));V=V0();LP=null;closeModal();render();return}
 const el=e.target.closest('[data-x]');if(!el)return;
 const x=el.dataset.x,id=el.dataset.i;
 switch(x){
  case 'close':closeModal();break;
  case 'tab':V.tab=el.dataset.t;V.pick=null;V.open=null;V.lich=null;LP=null;render();break;
  case 'totab':V.to=el.dataset.t;V.pick=null;render();break;
  case 'ftt':{const t=el.dataset.t;if(V.fTT[t])delete V.fTT[t];else V.fTT[t]=1;render();break}
  case 'fbs':V.bs=!V.bs;V.pick=null;render();break;
  case 'gone':V.gone=el.checked;render();break;
  case 'rsgv':V.rsGV=!V.rsGV;render();break;
  case 'pick':V.pick=(V.pick===id?null:id);render();break;
  case 'closepick':V.pick=null;render();break;
  case 'open':closeModal();V.open=id;V.pick=null;V.lich=null;render();window.scrollTo(0,0);break;
  case 'back':V.open=null;render();break;
  /* ===== GDDP-1A — tang ④ ⑤ ===== */
  case 'lich':closeModal();moLich(id);break;
  case 'back2':if(LP&&LP.doi&&!confirm('Bản nháp lịch triển khai chưa lưu sẽ mất. Rời màn hình?'))break;
   V.lich=null;LP=null;render();break;
  case 'chiaDeu':{grabForm();const kk=fmK(),ps=phanKH(kk);
   if(!ps||FM.tietNam==null){toast('⚠ Cần <b>số tiết cả năm</b> và danh sách lớp trước');break}
   FM.chia=FM.chia||{};const q=Math.floor(FM.tietNam/ps.length);
   ps.forEach((p,i)=>{FM.chia[p.ma]=q+(i<FM.tietNam-q*ps.length?1:0)});veChia();break}
  case 'catPhan':dlgCat(el.dataset.l,el.dataset.p);break;
  case 'catDo':catDo(el.dataset.l,el.dataset.p);break;
  case 'goDoan':{const r=LP.lich[el.dataset.l][el.dataset.p];r.doan.splice(+el.dataset.j,1);
   if(r.doan.length===1)r.doan[0].bg=false;LP.doi=true;render();break}
  case 'xoayVong':dlgXoay();break;
  case 'xoayAp':xoayAp();break;
  case 'vongLap':dlgVong();break;
  case 'vongSinh':{LP.tmpSeq=sinhVong(lpK())||[];veVongLai();break}
  case 'vongXoa':LP.tmpSeq=[];veVongLai();break;
  case 'vongThem':LP.tmpSeq.push(el.dataset.p);veVongLai();break;
  case 'vongRai':vongRai();break;
  case 'raiLai':dlgRaiLai();break;
  case 'raiLaiDo':raiLaiDo();break;
  case 'boRai':LP.vong=null;LP.doi=true;toast('Đã bỏ bảng rải khỏi bản nháp — quay về khai bằng ô. Bấm <b>💾 Lưu</b> để ghi');render();break;
  case 'luuLich':luuLich();break;
  case 'new':dlgForm(null);break;
  case 'newFor':dlgForm(null,{mon:el.dataset.m,dt:el.dataset.d,khoi:+el.dataset.k,lop:el.dataset.l});break;
  case 'sua':closeModal();dlgForm(id);break;
  case 'ganVao':{dlgForm(id);const l=el.dataset.l;if(!FM.lop.includes(l))FM.lop.push(l);renderForm();
   toast('Đã tích sẵn <b>'+esc(l)+'</b> — bấm <b>Lưu</b> để gán');break}
  case 'pickFromForm':closeModal();V.tab='kh';V.open=null;V.pick=id;render();break;
  case 'fLop':{grabForm();const l=el.dataset.l,i=FM.lop.indexOf(l);if(i>=0)FM.lop.splice(i,1);else FM.lop.push(l);renderForm();break}
  case 'fAll':{grabForm();const n=NAMC();const tr=lopDK(n,FM.dt,FM.khoi).filter(l=>l.mon.includes(FM.mon)&&!giuBoi(n.id,FM.mon,l.ten,FM.id)&&!FM.lop.includes(l.ten)).map(l=>l.ten);
   tr.forEach(t=>FM.lop.push(t));renderForm();toast('Đã chọn thêm <b>'+tr.length+' lớp</b>: '+esc(tr.join(', ')));break}
  case 'fAddTep':grabForm();FM.tep.push({ten:'Can-cu_'+(FM.mon||'KHGD')+'_'+(FM.tep.length+1)+'.pdf',kb:240});renderForm();break;
  case 'fRmTep':grabForm();FM.tep.splice(+el.dataset.n,1);renderForm();break;
  case 'fKhung':{grabForm();const t=khungTiet(FM.mon,FM.khoi);FM.tietNam=t;const a=tietTuan(t);FM.t1=a[0];FM.t2=a[1];renderForm();break}
  case 'fSave':fSave(false);break;
  case 'fSaveCat':fSave(true);break;
  case 'fBack':renderForm();break;
  case 'go':dlgGo(id);break;
  case 'goDo':{const k=KX(id);k.go=true;lg(k,'Gỡ khỏi lưu hành','Không xóa vật lý — chuyển Đã gỡ · '+k.lop.length+' lớp mất căn cứ');closeModal();V.pick=null;
   toast('🗂 Đã chuyển <b>Đã gỡ</b> — tìm lại bằng ô lọc "Đã gỡ"');render();break}
  case 'khoiphuc':khoiPhuc(id);break;
  case 'view':dlgView(el.dataset.f);break;
  case 'dl2':toast('⬇ Đang tải · <b>ghi Audit Log</b>');break;
  case 'xuat':dlgXuat();break;
  case 'doXuat':closeModal();toast('⬇ Đã xuất · <b>ghi Audit Log</b>');break;
  case 'nb':dlgNB();break;
  case 'nbTiep':if(nguonNB().some(trungDich))renderNB2();else chayNB();break;
  case 'nbQ':NB.quyet[id]=el.dataset.v;renderNB2();break;
  case 'nbAll':nguonNB().forEach(s=>{if(trungDich(s))NB.quyet[s.id]=el.dataset.v});renderNB2();break;
  case 'nbBack':renderNB1();break;
  case 'nbChay':chayNB();break;
  case 'nbLoc':closeModal();V.tab='kh';V.bs=true;V.fTT={};V.pick=null;render();break;
  case 'imp':dlgImp();break;
  case 'impTep':{const k=KX(IMP.id),v=el.dataset.v;document.querySelectorAll('[data-x=impTep]').forEach(b=>b.classList.toggle('on',b===el));
   IMP.tep=el.querySelector('b').textContent;IMP.rows=dongMau(k,v==='du'?k.soBai+3:v==='loi'?k.soBai:Math.max(1,k.soBai-2),v==='loi');IMP.chon='cap';impKq();break}
  case 'impChon':IMP.chon=el.dataset.v;impKq();break;
  case 'impGhi':impGhi();break;
  case 'goiYTuan':goiYTuan(KX(V.open));break;
  case 'allOpt':V.allOpt=!V.allOpt;render();break;
  case 'wnow':{const r=document.querySelector('tr.now');if(r)r.scrollIntoView({block:'center',behavior:'smooth'});
   toast(r?'↧ Tuần hiện tại: <b>'+r.querySelector('.wk').firstChild.textContent+'</b>':'Năm học '+NAMC().ten+' không chứa hôm nay ('+d2s(HOMNAY)+')');break}
  case 'dl':toast('↗ Điều hướng tới <b>'+el.dataset.m+'</b> — <code>/'+el.dataset.m+'?ctx='+esc(el.dataset.c)+'&amp;return=M5.1</code>');break;
 }
});
document.addEventListener('input',function(e){
 const t=e.target;
 if(t.id==='q'){V.q=t.value;const p=t.selectionStart;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(p,p)}return}
 if(t.id==='fTen'){FM.ten=t.value;FM.tenSua=1;return}
 if(['fTn','fT1','fT2'].includes(t.id)){grabForm();$('#tnBox').innerHTML=tnBox();veChia();return}
 if(t.dataset.x==='chiaTiet'){const v=t.value===''?null:(parseInt(t.value,10)||0);FM.chia=FM.chia||{};FM.chia[t.dataset.p]=v;
  const p=t.selectionStart;veChia();const n2=document.querySelector('[data-x=chiaTiet][data-p="'+t.dataset.p+'"]');
  if(n2){n2.focus();try{n2.setSelectionRange(p,p)}catch(e){}}return}
 if(t.dataset.x==='lpStt'){lpSet(t.dataset.l,t.dataset.p,'stt',t.value);return}
 if(t.dataset.x==='lpTu'||t.dataset.x==='lpDen'){lpSet(t.dataset.l,t.dataset.p,t.dataset.x==='lpTu'?'tu':'den',t.value,+t.dataset.j);return}
 if(t.dataset.t!=null&&t.dataset.f){
  const k=KX(V.open);if(!k)return;const th=k.the[+t.dataset.t],f=t.dataset.f;
  th[f]=f==='tiet'?(parseInt(t.value,10)||undefined):t.value;
  if(f==='tuan'){const w=tuanOf(t.value),n=namBy(k.nam);t.classList.toggle('bdi',!!t.value&&(!w||w[1]>tuanHK(n,1).thuc+tuanHK(n,2).thuc))}
  $('#ctIn').innerHTML=sumCT(k,demThe(k));
  const c=document.getElementById('the'+t.dataset.t);if(c)c.classList.toggle('trong',!th.ten);
 }
});
document.addEventListener('change',function(e){
 const t=e.target;
 if(t.id==='hnam'){NAMID=t.value;V.pick=null;V.open=null;V.lich=null;LP=null;V.bs=false;render();
  const n=NAMC();toast('Năm học <b>'+n.ten+'</b> · '+TTNAM[n.tt]+(namGhiDuoc(n)?'':' — KHGD <b>chỉ đọc</b> (M10.1 §2.4)'));return}
 if(t.id==='hdt'){HDT=t.value;V.pick=null;render();return}
 if(t.id==='fto'){V.fTo=t.value;V.pick=null;render();return}
 if(t.id==='wmon'){V.wMon=t.value;render();return}
 if(t.id==='nbSrc'){NB.src=t.value;NB.macDinhKhac=false;NB.quyet={};renderNB1();return}
 if(t.id==='fMon'){grabForm();FM.mon=t.value;const mn=monNam(NAMC(),FM.mon);if(!mn||!mn.dts.includes(FM.dt))FM.dt=mn&&mn.dts.length===1?mn.dts[0]:'';
  if(!FM.ten)FM.tenSua=0;if(!FM.id)FM.tietNam=null;khiDoiPhamVi();return}
 if(t.id==='fDt'){grabForm();FM.dt=t.value;if(FM.khoi&&!khoiCuaDt(NAMC(),FM.dt).includes(FM.khoi))FM.khoi=null;khiDoiPhamVi();return}
 if(t.id==='fKhoi'){grabForm();FM.khoi=t.value?+t.value:null;if(!FM.id)FM.tietNam=null;khiDoiPhamVi();return}
 if(['lpStt','lpTu','lpDen'].includes(t.dataset.x)){render();return}
 if(t.dataset.t!=null&&t.dataset.f==='phan'){const k=KX(V.open);if(k){k.the[+t.dataset.t].phan=t.value||undefined;
  lg(k,'Sửa thẻ Bài '+(+t.dataset.t+1),'Phần: '+(t.value?phanTenOf(k.mon,ptKH(k).ma,t.value):'không gắn'));render()}return}
 if(t.dataset.t!=null&&t.dataset.f){const k=KX(V.open);if(k)lg(k,'Sửa thẻ Bài '+(+t.dataset.t+1),t.dataset.f==='ten'?'Tên bài':t.dataset.f==='tiet'?'Số tiết':t.dataset.f==='tuan'?'Tuần dự kiến':'Yêu cầu cần đạt')}
});
$('#mask').addEventListener('click',function(e){if(e.target.id==='mask')closeModal()});

/* ===== Deep-link D3 vao M5.1 — M4.6 quay ve day de sua lich trien khai phan (tang ⑤ la cua M5.1) ===== */
function vaoSau(search){
 const q=new URLSearchParams(search);
 if(q.get('vai')&&ROLE[q.get('vai')]){role=q.get('vai');
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role))}
 if(q.get('action')==='sua_lich_phan'){
  const c=(q.get('ctx')||'').split('|'),k=KX(c[0])||KH.filter(z=>z.ten===c[0])[0];
  if(k&&nhieuPhan(k)){NAMID=k.nam;render();moLich(k.id);
   if(c[1])toast('↗ Vào từ <b>'+esc(q.get('return')||'M4.6')+'</b> cho lớp <b>'+esc(c[1])+'</b> — M5.1 là <b>chủ sở hữu 🔒</b> của lịch triển khai phần. Sửa xong bấm <b>💾 Lưu</b> rồi quay lại '+esc(q.get('return')||'M4.6'));
   else toast('↗ Vào từ <b>'+esc(q.get('return')||'M4.6')+'</b> — M5.1 là <b>chủ sở hữu 🔒</b> của lịch triển khai phần');
   return true}
  toast('⚠ Không tìm thấy KHGD <b>'+esc(c[0]||'')+'</b>, hoặc KHGD đó chỉ có một phần nên không có lịch triển khai');
 }
 render();return false;
}
vaoSau(location.search);
