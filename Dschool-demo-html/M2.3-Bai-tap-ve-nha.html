<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2.3 Bài tập về nhà — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.lockwrap{position:relative;display:inline-flex;align-items:center;gap:5px}
.lockwrap .lk{font-size:11px;color:var(--ink3)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover:not(:disabled){background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:7px 11px;border-radius:9px;font-size:12px;margin:0 0 10px;display:flex;gap:8px;align-items:flex-start}
.scopebar code{background:#e0e7ff;padding:0 4px;border-radius:3px;font-size:11.5px}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.roblk{background:#f8fafc;border:1px dashed var(--line2);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--ink2)}
/* huong dan dung: mot dong, LUON hien. Khac voi .dnote la ly do thiet ke, an duoc. */
.hint{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.55}
.hint b{color:var(--ink2)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink3);padding:8px 13px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:6px}
.rolnk:hover{background:#e0e7ff}
.oldwk{background:#fef3c7;border:1px solid var(--amber);color:#92400e;border-radius:9px;padding:9px 13px;font-size:12.5px;margin-bottom:11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.oldwk .sp{flex:1}

.navbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 10px}
.gsep{flex:1}
.navbar .num{font-size:11.5px;color:var(--ink3)}
.navbar .num b{color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 13px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.sumbar{display:flex;gap:0;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.sumbar .it{padding:7px 15px;border-right:1px solid var(--line);font-size:12px;color:var(--ink2)}
.sumbar .it b{display:block;font-size:17px;color:var(--ink);font-weight:700;line-height:1.25}
.sumbar .it.w b{color:var(--amber)}.sumbar .it.r b{color:var(--red)}.sumbar .it.g b{color:var(--green)}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage.open .listw{flex:1 1 0}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}

/* Header nhom Lop x Mon — bam de mo/thu. Khi THU van phai doc duoc con so,
   neu khong thi thu nhom = giau viec. */
.gh{display:flex;align-items:center;gap:9px;padding:9px 13px 9px 10px;background:#eef2f7;
    border-bottom:1px solid var(--line2);border-left:3px solid var(--brand);cursor:pointer;user-select:none}
.gh:hover{background:#e4ebf3}
.gh .gbtn{border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:7px;
    padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.gh .gbtn:hover{background:var(--brand);color:#fff}
.gh .num{font-size:11.5px;color:var(--ink3);white-space:nowrap}
/* Nhom rong: van co mat, nhung nhat di de khong tranh cho voi nhom co viec */
.gh.rong{background:#fbfcfe;border-left-color:var(--line2)}
.gh.rong .gt{color:var(--ink2);font-weight:700}
.gh.rong:hover{background:#f4f7fb}
.erow{padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink3);background:#fcfdff}
.gh .num b{color:var(--ink2)}
.gh .cv{flex:0 0 15px;font-size:10px;color:var(--ink3);transition:transform .12s}
.gh.on .cv{transform:rotate(90deg)}
.gh .gt{font-size:13px;font-weight:800;color:var(--ink)}
.gh .gt i{font-style:normal;font-weight:600;color:var(--ink2)}
.gh .gs{font-size:11.5px;color:var(--ink3)}
.gh .gb{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.gbar{display:flex;align-items:center;gap:8px;padding:7px 13px;background:#fff;
      border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.gbar b{color:var(--ink2)}
.brow{display:flex;gap:11px;padding:9px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.gh + .brow, .gh + .srow{background:#fcfdff}
.brow:hover{background:var(--brand-soft)}
.brow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.brow.huy{background:#fafafa;opacity:.72}
.brow.huy .bd b{text-decoration:line-through}
.brow .bd{flex:1;min-width:0}
.brow .bd b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bd .sub{font-size:11.5px;color:var(--ink3)}
.brow .pg{flex:0 0 138px}
.brow .pg .lb{font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;gap:9px}
.brow .pg .lb b{color:var(--ink);font-size:12.5px}
.brow .pg .bar{height:8px}
.bar{height:7px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:3px;display:flex}
.bar i{display:block;height:100%}
.brow .rt{flex:0 0 auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:230px}

.srow{display:flex;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.srow:hover{background:var(--brand-soft)}
.srow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.srow .ava{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.srow .bd{flex:1;min-width:0}
.srow .bd b{font-size:13px;display:block}
.srow .bd .sub{font-size:11.5px;color:var(--ink3)}
.srow .rt{flex:0 0 auto;display:flex;gap:5px;align-items:center}

.lrow{display:flex;gap:11px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.lrow:hover{background:var(--brand-soft)}
.lrow .lp{flex:0 0 160px}
.lrow .lp b{font-size:13.5px;display:block}
.lrow .lp span{font-size:11.5px;color:var(--ink3)}
.lrow .num{flex:0 0 80px;text-align:center;font-size:11px;color:var(--ink3)}
.lrow .num b{display:block;font-size:15px;color:var(--ink)}
.lrow .num.r b{color:var(--red)}.lrow .num.w b{color:var(--amber)}.lrow .num.g b{color:var(--green)}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph .n{flex:1;min-width:0}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pnav{display:flex;gap:6px;align-items:center;padding:8px 15px;border-bottom:1px solid var(--line);background:#fafbfc;font-size:12px;color:var(--ink2)}
.pnav .sp{flex:1;text-align:center}
.pbody{padding:14px 15px;max-height:calc(100vh - 260px);overflow-y:auto}
.f{display:grid;grid-template-columns:130px 1fr;gap:11px;align-items:start;padding:7px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.hl{border-color:#fde68a}
.ch{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.card.hl .ch{background:var(--amber-soft);border-bottom-color:#fde68a;color:#92400e}
.ch .sp{flex:1}
.cb{padding:4px 12px}
.cb.p{padding:11px 12px}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

/* xem bai nop */
.viewer{display:grid;grid-template-columns:1fr 176px;gap:12px}
@media(max-width:760px){.viewer{grid-template-columns:1fr}}
.vpage{background:#334155;border-radius:10px;min-height:230px;display:grid;place-items:center;color:#94a3b8;position:relative;overflow:hidden}
.vsheet{background:#fff;width:76%;height:86%;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:12px 14px;font-size:9px;color:#334155;line-height:1.7;overflow:hidden}
.vsheet h4{font-size:10px;font-weight:800;margin-bottom:6px}
.vsheet .ln{height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0}
.vsheet .ln.s{width:60%}
.vtool{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);border-radius:999px;padding:4px 6px;display:flex;gap:3px}
.vtool button{color:#e2e8f0;font-size:11.5px;padding:3px 9px;border-radius:999px}
.vtool button:hover{background:#334155;color:#fff}
.vmeta{font-size:11.5px}
.vmeta .r{padding:6px 0;border-bottom:1px solid var(--line)}
.vmeta .r b{display:block;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.fld label .req{color:var(--red)}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff}
.fldi:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.fldi.err{border-color:var(--red);background:var(--red-soft)}
.mucs{display:flex;gap:6px;flex-wrap:wrap}
.muc{border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:6px 16px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.muc:hover:not(:disabled){background:var(--bg)}
.muc.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.muc.on.no{background:var(--red);border-color:var(--red)}
.muc.on.ok{background:var(--green);border-color:var(--green)}
.drop{border:1.5px dashed var(--line2);border-radius:9px;padding:14px;text-align:center;color:var(--ink3);font-size:12.5px}

table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc}
table.tb td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb tr:last-child td{border-bottom:none}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.ms{position:relative}
.msb{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.msb.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.msb .cnt{background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px}
.msp{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.14);min-width:200px;max-height:250px;overflow-y:auto;z-index:20;display:none;padding:5px}
.msp.on{display:block}
.mso{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
.mso:hover{background:var(--bg)}
.mso input{width:15px;height:15px;flex:0 0 15px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
/* Ghi chu thiet ke: chung giai thich VI SAO, khong phai mot phan man hinh that.
   Mac dinh TAT de nhin dung giao dien nguoi dung se thay. */
body.nn .dnote{display:none!important}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1;margin-left:auto}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:13px;font-size:11px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
</style>
</head>
<body class="nn">
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>


<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="GVBM">GVBM</button>
  <button class="rb" data-r="GVTH">GV Tiểu học</button>
  <button class="rb" data-r="GVCN">GVCN</button>
  <button class="rb" data-r="TTCM">TTCM</button>

/* HANG DOI: quet CA NAM, khong cat theo khoang dang xem (khung-menu §11) */
function choCham(){
 const g=me(); if(!g)return [];
 const out=[];
 BT.filter(x=>x.gv===g&&x.cham&&x.tt!=='nhap').forEach(b=>
   b.subs.filter(s=>!s.cham).forEach(s=>out.push({b,s})));
 /* Thu tu hien thi = thu tu duyet bang nut 'Bai sau ›'. Nhom Lop x Mon la cap NGOAI,
    'sapXep' chi con quyet dinh thu tu BEN TRONG mot nhom. Neu hai thu tu nay lech nhau
    thi bam 'Bai sau' se nhay sang nhom khac roi quay lai — khong ai cham noi kieu do. */
 const inner=(a,b)=> sapXep==='luot'
   ? (a.b.id===b.b.id ? a.s.d-b.s.d : b.b.giao-a.b.giao)
   : a.s.d-b.s.d;
 return out.sort((a,b)=>{
   if(a.b.lop!==b.b.lop) return a.b.lop.localeCompare(b.b.lop,'vi');
   if(a.b.mon!==b.b.mon) return a.b.mon.localeCompare(b.b.mon,'vi');
   return inner(a,b)});
}

/* ===== TRANG THAI DAN XUAT ===== */
function ttBT(b){
 if(b.tt==='nhap') return {k:'nhap',t:'Nháp',c:'n'};
 if(b.tt==='huy')  return {k:'huy', t:'✕ Đã hủy',c:'r'};
 if(HOMNAY>b.han)  return {k:'qua', t:'Quá hạn '+(HOMNAY-b.han)+' ngày',c:'w'};
 return {k:'mo',t:'Đang mở · còn '+(b.han-HOMNAY)+' ngày',c:'o'};
}
/* Nhom hoc sinh. CHOT 27/8/2026: BO co che tach rieng nhom "vang co phep" —
   chap nhan nhac ca em dang om. Doi lai: khong con mot nguong ngam quyet dinh
   ai bi nhac ai khong, va so lieu "chua nop" khop dung voi si so lop.
   So buoi vang van hien o truc Theo hoc sinh de GVCN co ngu canh khi goi gia dinh. */
function nhom(b){
 const hs=hsLop(b.lop), nop=b.subs.map(s=>s.hs);
 return {
  nopChuaCham:b.subs.filter(s=>!s.cham),
  nopDaCham:b.subs.filter(s=>s.cham),
  chuaNop:hs.filter(h=>nop.indexOf(h)<0),
  vang:[]};
}
/* Nguong + so luot dang mo cua mot lop, kem ten lop de dung truc tiep khi canh bao */
function tinhTaiLop(lop){const t=tinhTai(lop); t.lop=lop; return t}
/* Nguong so luot BTVN dang mo cua mot lop */
function nguongLop(lop){const v=CFG.nguong[capHoc(lop)+'-'+buoi(lop)]; return v===undefined?3:v}
/* So luot dang mo (chua toi han) cua mot lop — dem MOI MON, vi hoc sinh chiu tai cua ca lop */
function dangMoLop(lop){return BT.filter(b=>b.lop===lop&&b.tt==='mo'&&b.han>=HOMNAY)}
/* Ba trang thai khoi luong cua mot lop */
function tinhTai(lop){
 const ng=nguongLop(lop), n=dangMoLop(lop).length;
 return {ng,n,vuot:n>=ng, khong:ng===0};
}
/* lop giao vien co the giao bai */

 if(r.sc==='class') return l===r.lopCN;
 if(r.sc==='group') return Object.keys(LOP).includes(l) && GV[LOP[l].cn].to===r.to;

}

   - GV tieu hoc day nhieu mon trong cung mot lop

 hung:[['9A1','Vật lí'],['9A2','Vật lí'],['8A1','Vật lí'],['8B1','Vật lí'],

 chi: [['8A1','Toán'],['9A2','Toán']],

function lopCuaToi(){

/* Toan bo cap (Lop, Mon) giao vien duoc phan cong — day la BO KHUNG cua danh sach,
   khong phai suy ra tu du lieu bai tap da giao. */
function capCuaToi(){
 const g=me(); if(!g) return [];
 return (PC[g]||[]).map(x=>({lop:x[0],mon:x[1]}));
}
const coPhanCong=(lop,mon)=>capCuaToi().some(c=>c.lop===lop&&c.mon===mon);

function monCuaToi(lop){

 return (PC[g]||[]).filter(x=>x[0]===lop).map(x=>x[1]);
}

/* ===== NHOM LOP x MON =====
   GVBM co the kiem nhiem nhieu mon o cung mot lop, va day nhieu lop cung mot mon.
   Don vi lam viec that su cua ho la CAP (Lop, Mon) — giao an, tien do, so diem deu theo cap nay.
   Vi vay danh sach gom theo cap do, khong gom theo rieng lop cung khong gom theo rieng mon. */
function nhomLM(arr,fl,fm,khung){
 const M=new Map();
 /* Dung khung truoc: cap duoc phan cong ma chua giao bai nao van phai co cho dung
    trong danh sach. Neu chi dung tu du lieu thi cap chua giao bai BIEN MAT — ma
    do lai dung la cap giao vien can nhin thay nhat de bat dau giao bai. */
 (khung||[]).forEach(c=>{const k=gk(c.lop,c.mon);
   if(!M.has(k))M.set(k,{k,lop:c.lop,mon:c.mon,items:[]})});
 arr.forEach(x=>{const l=fl(x),m=fm(x),k=gk(l,m);
   if(!M.has(k))M.set(k,{k,lop:l,mon:m,items:[]});
   M.get(k).items.push(x)});
 /* so sanh theo tieng Viet — ten mon co dau, so sanh tho se xep sai (vd "Ngữ văn" / "Ngoại ngữ") */
 return [...M.values()].sort((a,b)=> a.lop!==b.lop
   ? a.lop.localeCompare(b.lop,'vi') : a.mon.localeCompare(b.mon,'vi'));
}
/* Mo hay thu: nguoi dung da bam thi theo nguoi dung, chua bam thi theo CO VIEC HAY KHONG.
   'ep' = tinh huong khong duoc phep thu (dang loc, hoac nhom chua dong dang chon). */
function gOpen(k,coViec,ep){
 if(ep) return true;
 if(gCham.has(sk(k))) return gMo.has(sk(k));
 return !!coViec;
}

function nhomGiao(L){
 const loc = fLOP.size>0 || fTT!=='Tất cả';   /* dang loc thi mo het — loc roi con phai bam mo tung nhom la thua */
 /* Dang loc thi khong keo theo nhom rong: loc la de thu hep, hien them nhom khong khop
    bo loc la di nguoc y dinh cua nguoi dung. */
 const gs=nhomLM(L,x=>x.lop,x=>x.mon, loc?[]:capCuaToi());
 const cc=choCham();
 let moHet=true;
 GBAR={n:gs.length,moHet:true,khoa:loc,
   txt: loc ? 'Đang lọc nên <b>mở sẵn toàn bộ nhóm</b>'
            : 'Nhóm <b>có việc</b> được mở sẵn; nhóm đã xong thì thu lại'};
 const rows=gs.map(g=>{
  const qua=g.items.filter(x=>ttBT(x).k==='qua').length;
  const mo =g.items.filter(x=>ttBT(x).k==='mo').length;
  const ch =cc.filter(q=>q.b.lop===g.lop&&q.b.mon===g.mon).length;
  const cn =g.items.filter(x=>x.tt==='mo').reduce((n,b)=>n+nhom(b).chuaNop.length,0);
  const coViec = qua>0 || ch>0;
  const epMo = loc || (cur&&g.items.some(x=>x.id===cur));   /* dong dang chon thi nhom cua no khong duoc thu */
  const open = gOpen(g.k,coViec,epMo);
  const lock = loc ? 'Đang lọc thì mọi nhóm khớp bộ lọc đều mở — bỏ lọc rồi mới thu nhóm được.'
    : (cur&&g.items.some(x=>x.id===cur)) ? '' : '';
  /* CHI viec phai lam moi duoc to mau. To mau ca nhung con so chi de biet thi
     mat bang toan mau va khong con gi noi len — mau mat tac dung bao dong. */
  const rong=!g.items.length;
  const badges =
    (ch?`<span class="st2 r">${ch} bài chờ chấm</span>`:'')+
    (qua?`<span class="st2 w">${qua} lượt quá hạn</span>`:'')+
    (rong?'':`<span class="num">${mo?`<b>${mo}</b> đang mở · `:''}<b>${cn}</b> HS chưa nộp</span>`)+
    (coPhanCong(g.lop,g.mon)?`<button class="gbtn" data-gnew="${g.k}">+ Giao bài</button>`
      :'<span class="num">Không còn phân công</span>');
  if(!open) moHet=false;
  return ghRow(g,open,badges,rong?'chưa có lượt nào':`${g.items.length} lượt`,lock,rong)+
    (open? (rong?erow(g):g.items.map(brow).join('')) : '');
 }).join('');
 GBAR.moHet=moHet;
 return rows;
}

function grp(title,rows,c,b){
 if(!rows.length) return '';
 return `<div class="grow"><span class="st2 ${c}">${title}</span><span class="ct">${rows.length} em</span></div>`+
  rows.map(([h,sub,sb])=>`<div class="srow" ${sb?`data-sub="${b.id}|${h}"`:''}>
    <div class="ava">${esc(HS[h].n.split(' ').slice(-2).map(x=>x[0]).join(''))}</div>
    <div class="bd"><b>${esc(HS[h].n)}</b><div class="sub">${sub}</div></div>
    <div class="rt">${sb&&!sb.cham&&b.gv===me()&&b.cham?'<button class="btn xs p">📝 Chấm</button>':''}
     ${sb&&sb.cham?'<button class="btn xs">👁 Xem</button>':''}</div></div>`).join('');

/* ---------- TAB 2: cho toi cham ---------- */
function viewCham(){
 const Q=choCham();
 if(!Q.length) return scopeNote()+`<div class="listw"><div class="empty">Không còn bài nào chờ chấm.</div></div>`;
 const key=q=>q.b.id+'|'+q.s.hs;
 if(!curSub||!Q.some(q=>key(q)===curSub)) curSub=key(Q[0]);
 const sel=Q.find(q=>key(q)===curSub);
 const gs=nhomLM(Q,q=>q.b.lop,q=>q.b.mon);
 let h='', moHet=true;
 gs.forEach(g=>{
  const lau=choLau(g.items), tre=g.items.filter(q=>HOMNAY-q.b.han>CFG.nguongCham).length;
  /* Nhom co bai tre han thi KHOA MO — day la hang doi viec, khong phai danh sach tra cuu. */
  const khoaMo = tre>0 || g.items.some(q=>key(q)===curSub);
  /* MAC DINH MO HET. Khac voi tab 1: o day moi dong deu la viec chua lam,
     thu san mot nhom nao do la giau viec ngay tu luc mo man hinh.
     Thu lai la thao tac CO Y cua giao vien de tap trung mot lop mot mon. */
  const open=gOpen(g.k,true,khoaMo);
  const dangCham=g.items.some(q=>key(q)===curSub);
  const lock = tre>0
    ? 'Nhóm này có '+tre+' bài chờ chấm <b>quá '+CFG.nguongCham+' ngày</b> — không thu lại được. Chấm xong thì nhóm tự mở khóa.'
    : dangCham ? 'Bài bạn đang chấm nằm trong nhóm này — thu nhóm lại thì mất chỗ đang đứng. Chuyển sang bài khác rồi thu.'
    : '';
  const badges=`<span class="st2 ${tre?'r':'b'}">${g.items.length} bài chờ chấm</span>`+
    (lau>0?`<span class="st2 ${lau>CFG.nguongCham?'r':'w'}">Chờ lâu nhất ${lau} ngày</span>`:'')+
    (dangCham?'<span class="num">Đang chấm ở đây</span>':'');
  const luots=[...new Set(g.items.map(q=>q.b.id))].length;
  h+=ghRow(g,open,badges,`${luots} lượt bài`,lock);
  if(!open){moHet=false; return}
  let last='';
  g.items.forEach(q=>{
   /* Trong mot nhom van co the nhieu luot bai — CHI hien tieu de luot khi dang sap theo luot.
      Sap theo ngay nop ma van gom luot thi tieu de lap lai lien tuc, vo nghia. */
   if(sapXep==='luot'&&q.b.id!==last){last=q.b.id;
    h+=`<div class="grow"><span>${esc(q.b.td)}</span><span class="ct">hạn ${dstr(q.b.han)}</span></div>`;}
   const cho=HOMNAY-q.b.han;
   h+=`<div class="srow ${key(q)===curSub?'on':''}" data-sub="${key(q)}">
     <div class="ava">${esc(HS[q.s.hs].n.split(' ').slice(-2).map(x=>x[0]).join(''))}</div>
     <div class="bd"><b>${esc(HS[q.s.hs].n)}</b>
      <div class="sub">${(()=>{const t=tietById(q.b.tiet);
        return t?`<span class="st2 b">Tiết ${t.so} · ${dstr(t.d)}</span> `:''})()}${sapXep==='som'?'<b>'+esc(q.b.td)+'</b> · ':''}nộp ${dstr(q.s.d)}${q.s.tre?' · <span class="st2 w">Nộp trễ '+q.s.tre+' ngày</span>':''}</div></div>
     <div class="rt">${cho>CFG.nguongCham?`<span class="st2 r">Chờ chấm ${cho} ngày</span>`
       :cho>0?`<span class="st2 w">Chờ chấm ${cho} ngày</span>`:''}</div></div>`;
  });
 });
 GBAR={n:gs.length,moHet,khoa:0,
   txt:'<b>Mặc định mở hết</b> — mọi dòng ở đây đều là việc chưa làm; nhóm có bài <b>quá ngưỡng</b> thì <b>không thu được</b>'};
 return scopeNote()+
  `<div class="navbar"><span style="font-size:12.5px;color:var(--ink2);font-weight:600">Trong mỗi nhóm:</span>
    <div class="seg"><button class="${sapXep==='som'?'on':''}" data-sx="som">Nộp sớm nhất trước</button>
     <button class="${sapXep==='luot'?'on':''}" data-sx="luot">Gom theo lượt bài</button></div>
    ${gPart()}
    <span class="dnote" style="font-size:11.5px;color:var(--ink3)">${sapXep==='som'
      ?'Danh sách <b>phẳng</b>, tên bài nằm trên từng dòng — công bằng với em nộp đúng hạn'
      :'<b>Tách theo lượt bài</b> — chấm gọn từng lượt rồi chuyển'}</span></div>`+
  `<div class="stage open"><div class="listw">${h}
   <div class="lgd dnote">Chấm xong một bài thì <b>tự nhảy sang bài chưa chấm kế tiếp trong cùng nhóm</b>, hết nhóm mới sang nhóm sau.
     <span style="margin-left:auto">Nút <code>Bài sau ›</code> đi <b>đúng thứ tự đang hiển thị</b> — sang nhóm đang thu thì nhóm đó <b>tự mở</b></span></div>
  </div>${panelCham(sel)}</div>`;
}
function panelCham(q){
 const b=q.b, s=q.s, hs=HS[s.hs];
 const Q=choCham(), key=x=>x.b.id+'|'+x.s.hs, i=Q.findIndex(x=>key(x)===curSub);
 return `<div class="panel"><div class="ph"><div class="n"><h2>${esc(hs.n)}</h2>
   <div class="m"><span class="pill">${esc(hs.lop)}</span><span class="pill">${esc(b.mon)}</span>

function viewTheoDoi(){
 const r=R(), L=scopeBT().filter(b=>b.tt==='mo'||b.tt==='huy'?b.tt==='mo':false);
 const trucs={hs:['👤','Theo học sinh','Em nào đang nợ nhiều bài nhất'],
              lop:['🏫','Theo lớp','Lớp nào nộp bài kém'],
              mon:['📘','Theo môn','Môn nào giao nhiều bài, môn nào không giao']};
 const avail = r.sc==='class'?['hs','mon']:['lop','hs','mon'];
 if(avail.indexOf(truc)<0) truc=avail[0];
 let rows='';
 if(truc==='hs'){
  const lops=r.sc==='class'?[r.lopCN]:[...new Set(L.map(b=>b.lop))];
  const hs=[];lops.forEach(l=>hsLop(l).forEach(h=>hs.push(h)));
  rows=hs.map(h=>{
   const bs=L.filter(b=>b.lop===HS[h].lop);
   const nop=bs.filter(b=>b.subs.some(s=>s.hs===h));
   const tre=nop.filter(b=>b.subs.find(s=>s.hs===h).tre);
   const chuadat=nop.filter(b=>{const s=b.subs.find(x=>x.hs===h);return s.cham&&s.cham.chua});
   const chua=bs.filter(b=>b.nop!=='khong'&&!b.subs.some(s=>s.hs===h)&&(VANG[h]||0)<2);
   return `<div class="lrow"><div class="lp"><b>${esc(HS[h].n)}</b><span>Lớp ${esc(HS[h].lop)}</span></div>
     <div class="num"><b>${bs.length}</b>được giao</div>
     <div class="num g"><b>${nop.length}</b>đã nộp</div>
     <div class="num w"><b>${tre.length}</b>nộp trễ</div>
     <div class="num ${chua.length>=3?'r':''}"><b>${chua.length}</b>chưa nộp</div>
     <div class="num r"><b>${chudat(chuadat)}</b>chưa đạt</div>
     <div class="num"><b>${VANG[h]||0}</b>buổi vắng</div></div>`}).join('');
 } else if(truc==='lop'){
  /* Lay danh sach lop tu PHAM VI, khong tu du lieu bai tap. Lop bi chan giao bai
     se khong co luot nao — neu lay tu du lieu thi lop do BIEN MAT khoi bang, va
     nguoi quan ly doc su vang mat do thanh "thieu du lieu" chu khong phai "dung luat". */
  const lops=[...new Set([...Object.keys(LOP).filter(inScopeLop),...L.map(b=>b.lop)])].sort();
  rows=lops.map(l=>{const bs=L.filter(b=>b.lop===l),ss=LOP[l].ss;
   if(tinhTai(l).khong&&!bs.length)
    return `<div class="lrow" style="cursor:default;background:#fafafa">
      <div class="lp"><b>Lớp ${l}</b>
       <span>${capHoc(l)==='TH'?'Tiểu học':capHoc(l)} · ${HE[LOP[l].he].n} · GVCN ${esc(GV[LOP[l].cn].n)}</span></div>
      <div class="num" style="flex:1;text-align:left;color:var(--ink2);font-size:12px">
       <b style="display:inline;font-size:12px">Không có lượt bài nào — có thể là đúng chủ ý.</b>
       Hệ 2 buổi/ngày, ngưỡng khuyến nghị <b>0 lượt</b> theo Chỉ thị 5105. Lớp vẫn <b>hiện ở đây</b> để dòng trống
       không bị đọc nhầm là thiếu dữ liệu.</div>
      <div class="num"><b>0</b>ngưỡng</div></div>`;
   const canNop=bs.filter(b=>b.nop!=='khong');
   const tong=canNop.length*ss, nop=canNop.reduce((n,b)=>n+b.subs.length,0);
   return `<div class="lrow"><div class="lp"><b>Lớp ${l}</b>
     <span>${capHoc(l)==='TH'?'Tiểu học':capHoc(l)} · ${HE[LOP[l].he].n} · GVCN ${esc(GV[LOP[l].cn].n)}</span></div>
    <div class="num"><b>${bs.length}</b>lượt đang mở</div>
    <div class="num"><b>${[...new Set(bs.map(b=>b.mon))].length}</b>môn giao bài</div>
    <div class="num g"><b>${tong?Math.round(nop/tong*100):0}%</b>tỷ lệ nộp</div>
    <div class="num ${tinhTai(l).vuot?'w':''}"><b>${tinhTai(l).n}/${tinhTai(l).ng}</b>đang mở / ngưỡng</div></div>`}).join('');
 } else {
  const mons=[...new Set(L.map(b=>b.mon))].sort();
  rows=mons.map(m=>{const bs=L.filter(b=>b.mon===m);
   return `<div class="lrow"><div class="lp"><b>${esc(m)}</b><span>${[...new Set(bs.map(b=>GV[b.gv].n))].join(', ')}</span></div>
    <div class="num"><b>${bs.length}</b>lượt đang mở</div>
    <div class="num"><b>${[...new Set(bs.map(b=>b.lop))].length}</b>lớp</div>
    <div class="num"><b>${bs.filter(b=>b.cham).length}</b>có chấm</div></div>`}).join('');
 }
 return scopeNote()+
  `<div class="chips">${avail.map(k=>`<button class="chip ${truc===k?'on':''}" data-truc="${k}">${trucs[k][0]} ${trucs[k][1]}</button>`).join('')}
    <span style="font-size:11.5px;color:var(--ink3);align-self:center;margin-left:6px">Trả lời câu hỏi: <i>"${trucs[truc][2]}"</i></span></div>`+
  (truc==='hs'?`<div class="ro dnote">Cột <b>buổi vắng</b> tách riêng để <b>không nhắc nhầm</b> em đang nghỉ có phép —
    số liệu đọc từ M2.9/T2 và M2.4. Dữ liệu tab này <b>tự chảy sang Báo cáo học tập tuần (M2.9/T6)</b>.</div>`:'')+
  `<div class="listw">${rows||'<div class="empty">Không có dữ liệu trong phạm vi.</div>'}
    <div class="lgd dnote">Ba trục <b>cùng dữ liệu, khác đơn vị dòng chính</b> — nên là bộ chuyển trục trong một tab, không phải ba tab.</div></div>`;
}
const chudat=a=>a.length;

let mfns={};

 $('#mh').innerHTML=title; $('#mb').innerHTML=body; mfns={};

   if(fn)mfns['b'+i]=fn;

/* ===== WIRE ===== */
function wire(){
 document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;cur=null;render()});
 document.querySelectorAll('[data-bt]').forEach(el=>el.onclick=()=>{cur=(cur===el.dataset.bt)?null:el.dataset.bt;render()});
 document.querySelectorAll('[data-sub]').forEach(el=>el.onclick=e=>{e.stopPropagation();
   const [bid,hid]=el.dataset.sub.split('|'); const b=byId(bid), s=b.subs.find(x=>x.hs===hid);
   if(!s){toast('Học sinh này chưa nộp bài — không có gì để chấm');return}
   if(b.gv!==me()){toast('👁 Xem bài ở chế độ chỉ đọc · giáo viên chủ nhiệm và BGH <b>không chấm hộ</b>');return}
   window.__dg=s.cham?s.cham.dg:null; window.__dgErr=0;
   curSub=el.dataset.sub; tab='cham'; cur=null; render();});
 document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{if(el.dataset.nav){curSub=el.dataset.nav;window.__dg=null;window.__dgErr=0;render()}});
 document.querySelectorAll('[data-dg]').forEach(el=>el.onclick=()=>{window.__dg=el.dataset.dg;window.__dgErr=0;render()});
 document.querySelectorAll('[data-truc]').forEach(el=>el.onclick=()=>{truc=el.dataset.truc;render()});
 document.querySelectorAll('[data-kh]').forEach(el=>el.onclick=()=>{khoang=el.dataset.kh;cur=null;render()});
 document.querySelectorAll('[data-sx]').forEach(el=>el.onclick=()=>{sapXep=el.dataset.sx;curSub=null;render()});
 document.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{
   const k=el.dataset.g;
   /* Lat theo trang thai DANG HIEN tren man hinh, khong lat theo gMo:
      nhom dang mo do mac dinh thi gMo chua he chua no — lat theo gMo se ra "mo" lan nua,
      bam mot cai khong thay gi doi. */
   const dangMo=el.classList.contains('on');
   gCham.add(sk(k));
   if(dangMo) gMo.delete(sk(k)); else gMo.add(sk(k));
   /* Dong chi tiet dang mo truoc: neu khong, nhom bi ep mo vi chua dong dang chon
      -> bam thu ma khong thu duoc, nguoi dung tuong hong. */
   if(tab==='giao'&&cur&&byId(cur)&&gk(byId(cur).lop,byId(cur).mon)===k) cur=null;
   render()});
 document.querySelectorAll('[data-glock]').forEach(el=>el.onclick=()=>toast('🔒 '+el.dataset.glock));
 /* Nut nam TRONG header nhom: phai chan su kien noi len, khong thi bam Giao bai lai thu nhom */
 document.querySelectorAll('[data-gnew]').forEach(el=>el.onclick=e=>{e.stopPropagation();
   const [lop,mon]=el.dataset.gnew.split('|'); giaoBai(lop,mon)});
 document.querySelectorAll('[data-gall]').forEach(el=>el.onclick=()=>{
   const mo=el.dataset.gall==='mo';
   document.querySelectorAll('[data-g]').forEach(z=>{const k=sk(z.dataset.g);
     gCham.add(k); mo?gMo.add(k):gMo.delete(k)});
   render()});
 document.querySelectorAll('[data-ng]').forEach(el=>el.onchange=()=>{CFG.nguong[el.dataset.ng]=+el.value;render();
   toast('Đã đổi ngưỡng — <b>chưa có hiệu lực</b> cho tới khi Hiệu trưởng duyệt')});
 document.querySelectorAll('[data-cfg]').forEach(el=>el.onchange=()=>{CFG[el.dataset.cfg]=el.checked?1:0;render()});
 document.querySelectorAll('[data-ms]').forEach(el=>el.onclick=e=>{e.stopPropagation();
   const p=$('#msp-'+el.dataset.ms),was=p.classList.contains('on');
   document.querySelectorAll('.msp').forEach(z=>z.classList.remove('on')); if(!was)p.classList.add('on')});
 document.querySelectorAll('[data-msv]').forEach(el=>el.onchange=()=>{

    thì tỷ lệ nộp, số em chưa nộp và ô "thuộc tiết nào" đều mất nghĩa.<br>
    <b>Hàng rào chạy ngay ở bước chọn lớp</b>, không đợi tới lúc bấm Lưu —
    để giáo viên soạn xong cả bài rồi mới báo "lớp này không được giao" là lãng phí công của họ.</div></div>

        nên hệ thống <b>không hiện lối tạo tiết</b> để khỏi dẫn bạn tới màn hình bị từ chối.</span></div>`}
   </div>
  ${!ts.length?'':`
  <div class="fld"><label>Bước 4 · Tiêu đề <span class="req">*</span></label>
   <input class="fldi" id="gtd" placeholder="Ví dụ: Bài 3 — làm bài 3.4 đến 3.7"></div>

    <select class="fldi" id="ghan">${(()=>{const ks=[1,2,3,4,5,7], base=tiet?tiet.d:HOMNAY;

    <div class="hint">Đếm từ <b>ngày của tiết</b>, không từ hôm nay.</div>

function act(a,id){
 if(a==='close'){cur=null;render();return}
 if(a==='dando'){danDo((lopCuaToi().filter(l=>tinhTai(l).khong)[0])||lopCuaToi()[0]);return}
 if(a==='m21'){toast('↗ Mở <b>M2.1 Lịch dạy &amp; học</b> — xem lịch dạy của bạn (chỉ đọc)');return}
 if(a==='m22'){const b=byId(cur), t=b&&tietById(b.tiet);
   toast('↗ Mở <b>M2.2 Sổ đầu bài</b> đúng tiết '+(t?tietLb(t).replace(/<[^>]+>/g,''):'')+
     ' — <code>/M2.2?ctx='+(t?t.id:'')+'&action=xem&return=M2.3</code>');return}

 if(a==='luucham'){

  const [bid,hid]=curSub.split('|'); const b=byId(bid), s=b.subs.find(x=>x.hs===hid);
  s.cham={dg:window.__dg,nx:nx||'Đạt yêu cầu.',chua:window.__dg==='Chưa đạt'?1:0};
  b.log.push([dstr(HOMNAY)+' 10:05',GV[me()].n,'Chấm bài',HS[hid].n+' — '+window.__dg]);
  window.__dg=null; window.__dgErr=0;
  const Q=choCham(); curSub=Q.length?Q[0].b.id+'|'+Q[0].s.hs:null;
  render();
  toast('✓ Đã lưu · học sinh và phụ huynh thấy <b>bài nộp + ảnh chữa + nội dung chữa + nhận xét</b> trên App'+
    (Q.length?' · đã sang bài kế tiếp':' · <b>hết bài chờ chấm</b>'));
  return}

 if(a==='giaobai'){const b=byId(cur); b.tt='mo';
   b.log.push([dstr(HOMNAY)+' 10:05',GV[me()].n,'Giao bài','Thông báo tới '+LOP[b.lop].ss+' học sinh và phụ huynh']);
   render(); toast('✓ Đã giao bài · thông báo tới học sinh và phụ huynh'); return}

 if(a==='xoa'){const b=byId(cur);
   modal('🗑 Xóa bài Nháp',

     <div class="ro dnote"><b>Bài đã giao thì KHÔNG xóa được</b>, chỉ <b>Hủy</b> có lý do — vì học sinh đã nhận thông báo,
      có em đã làm và nộp. Xóa đi thì bài nộp đi đâu, và tỷ lệ nộp của lớp trong báo cáo sai.</div>`,
    [['Hủy',0],['🗑 Xóa',()=>{BT.splice(BT.indexOf(b),1);cur=null;closeM();render();toast('Đã xóa bài Nháp')}]]);
   return}

 if(a==='huy'){const b=byId(cur);
   modal('✕ Hủy bài đã giao',
    `<div class="warn"><b>Hủy KHÔNG xóa bài.</b> Học sinh và phụ huynh <b>vẫn thấy</b> kèm dòng
      <i>"Giáo viên đã hủy bài này"</i>, và ${b.subs.length} bài đã nộp <b>vẫn được giữ</b>.
      Bộ lọc trạng thái có nhóm <b>Đã hủy</b> để tra lại.</div>
     <div class="fld"><label>Lý do hủy <span class="req">*</span></label>
      <textarea class="fldi" id="hly" rows="3" placeholder="Học sinh và phụ huynh sẽ đọc được lý do này"></textarea></div>`,
    [['Hủy',0],['✕ Xác nhận hủy',()=>{
      const v=$('#hly').value.trim(); if(!v){toast('⛔ Lý do hủy là bắt buộc');return}
      b.tt='huy'; b.lydo=v;
      b.log.push([dstr(HOMNAY)+' 10:05',GV[me()].n,'✕ Hủy bài',v]);
      closeM(); render(); toast('✕ Đã hủy · thông báo tới học sinh và phụ huynh · bài nộp vẫn giữ');
    }]]);
   return}

 if(a==='sua'){const b=byId(cur);
   modal('✎ Sửa bài đã giao',
    `${b.subs.length?`<div class="warn">⚠ Đã có <b>${b.subs.length} em nộp bài</b>.
      Sửa đề bài thì hệ thống <b>gửi lại notification</b> báo đề đổi — đề bài đổi mà học sinh không biết là bất công.</div>`:''}
     <div class="ro dnote">Chỉ sửa được <b>trong 24h</b> kể từ lúc giao.</div>
     <div class="fld"><label>Tiêu đề</label><input class="fldi" value="${esc(b.td)}"></div>
     <div class="fld"><label>Nội dung</label><textarea class="fldi" rows="3">${esc(b.nd)}</textarea></div>`,
    [['Hủy',0],['Lưu',()=>{b.log.push([dstr(HOMNAY)+' 10:05',GV[me()].n,'✎ Sửa bài',
       b.subs.length?'Đã gửi lại thông báo tới '+b.subs.length+' em đã nộp':'']);
      closeM();render();toast('Đã lưu'+(b.subs.length?' · <b>đã gửi lại thông báo</b> báo đề bài đổi':''))}]]);
   return}

 if(a==='ngung'){const b=byId(cur); b.ngung=1;
   b.log.push([dstr(HOMNAY)+' 10:05',GV[me()].n,'⏸ Ngừng nhận bài','Chốt danh sách trước khi chữa bài chung']);
   render(); toast('⏸ Đã ngừng nhận bài · dùng để chốt danh sách trước khi chữa bài chung');return}

 if(a==='nhac'){const b=byId(cur), n=nhom(b);
   modal('🔔 Nhắc học sinh chưa nộp',
    `<div class="info">Gửi thông báo tới <b>${n.chuaNop.length} học sinh</b> và phụ huynh của các em.</div>
     <div class="roblk dnote">Danh sách này gồm <b>mọi em chưa nộp</b>, kể cả em đang nghỉ có phép —
      chốt 27/8/2026, bỏ cơ chế tách nhóm. Trước khi gửi, giáo viên tự rà lại là đủ;
      để hệ thống tự loại thì phải có một ngưỡng ngầm quyết định thay giáo viên.</div>
     <table class="tb"><tr><th>Sẽ gửi tới</th><th style="width:120px">Buổi vắng trong kỳ</th></tr>
      ${n.chuaNop.map(h=>`<tr><td>${esc(HS[h].n)}</td>
        <td>${VANG[h]?`<span class="st2 w">${VANG[h]} buổi</span>`:'<span style="color:var(--ink3)">—</span>'}</td></tr>`).join('')
        ||'<tr><td colspan="2" style="color:var(--ink3)">Không còn em nào chưa nộp.</td></tr>'}</table>`,
    [['Hủy',0],['🔔 Gửi nhắc',()=>{closeM();
      toast('Đã gửi nhắc tới '+n.chuaNop.length+' học sinh và phụ huynh')}]]);
   return}

 if(a==='nhacgv'){const b=byId(cur);
   modal('🔔 Nhắc giáo viên bộ môn',
    `<div class="info">Gửi tới <b>${esc(GV[b.gv].n)}</b> kèm liên kết mở đúng lượt giao bài này.</div>
     <div class="ro dnote"><b>Giáo viên chủ nhiệm và ban giám hiệu không chấm hộ.</b>
      Chọn mức đánh giá là <b>nhận định chuyên môn về môn học đó</b>. Cùng cơ chế với M2.2 và M2.5.</div>
     <div class="fld"><label>Nội dung</label><textarea class="fldi" rows="3"
       placeholder="Ví dụ: lớp còn 22 bài chưa chấm sau hạn nộp 5 ngày"></textarea></div>`,
    [['Hủy',0],['Gửi',()=>{closeM();toast('Đã gửi tới '+GV[b.gv].n+' · ghi audit')}]]);
   return}

 if(a==='m25'){
   modal('↗ Tạo lượt Kiểm tra thường xuyên tại M2.5',
    `<div class="info">Chuẩn deep-link: <code>/M2.5?action=tao&amp;lop=…&amp;mon=…&amp;ref=${esc(cur||'')}&amp;return=M2.3</code></div>
     <div class="warn"><b>BTVN không có điểm số — đây là ràng buộc cứng của cả module.</b><br>
      Cho nhập điểm ngay trong BTVN thì điểm đó nằm ngoài mọi lượt kiểm tra:
      <b>không đếm được vào số lượt ĐGtx tối thiểu</b> theo TT 22/2021, và công thức tính trung bình môn ở M3.1
      không biết xếp nó vào loại nào.</div>
     <table class="tb"><tr><th></th><th>M2.3 sở hữu</th><th>M2.5 sở hữu</th></tr>
      <tr><td>Bản chất</td><td>Bài luyện tập</td><td><b>Lượt kiểm tra chính thức</b> có tên, có mã</td></tr>
      <tr><td>Kết quả</td><td>Mức theo cấp học + nhận xét</td><td><b>Điểm thang 10</b></td></tr>
      <tr><td>Vào tính điểm môn</td><td>Không</td><td><b>Có</b> — M3.1</td></tr>
      <tr><td>Liên kết</td><td>Hiển thị <b>bản chiếu chỉ đọc 🔗</b></td><td><b>Sở hữu</b> tham chiếu tới bài BTVN</td></tr>
     </table>`,
    [['Đóng',0]]);return}

 /* Audit khong duoc dung lai o mot cai toast roi bien mat: phai ghi vao Lich su
    cua chinh luot bai, de sau nay tra cuu duoc ai da xem bai lam cua hoc sinh nao. */
 if(a==='xemtep'||a==='taitep'){const b=byId(cur);
   ghiLog(b, a==='xemtep'?'👁 Xem tệp đề bài':'⬇ Tải tệp đề bài', b.tep||'');
   toast(a==='xemtep'?'👁 Mở tệp đề bài ngay trong màn hình · <b>đã ghi Lịch sử</b>'
                     :'⬇ Tải tệp đề bài · <b>đã ghi Lịch sử</b>');
   render(); return}
 if(a==='taibai'){const q=choCham().find(x=>x.b.id+'|'+x.s.hs===curSub)||null;
   const b=q?q.b:byId(cur);
   if(b) ghiLog(b,'⬇ Tải bài làm', q?HS[q.s.hs].n:'');
   toast('⬇ Tải bài làm · <b>đã ghi Lịch sử</b> — dữ liệu cá nhân trẻ em, NĐ 13/2023');
   render(); return}
 if(a==='guicfg'){toast('Đã gửi Hiệu trưởng duyệt · chính sách <b>chưa có hiệu lực</b>');return}
 if(a==='duyetcfg'){toast('✓ Đã duyệt · chính sách có hiệu lực ngay');return}
 if(a==='xuat'){
   modal('⬇ Xuất báo cáo bài tập về nhà',
    `<div class="ro dnote">Bản xuất có <b>tên học sinh và bài làm</b> → dữ liệu cá nhân trẻ em,
      <b>bắt buộc chọn mục đích xuất</b>, ghi audit — NĐ 13/2023.</div>
     <div class="fld"><label>Mục đích xuất <span class="req">*</span></label>
      <select class="fldi"><option>Sinh hoạt lớp</option><option>Họp phụ huynh</option>
       <option>Họp giao ban chuyên môn</option><option>Rà khối lượng bài giữa các môn</option></select></div>
     <table class="tb"><tr><th>Bản xuất</th><th>Dùng khi nào</th><th></th></tr>
      <tr><td><b>Tình hình nộp bài theo lớp</b></td><td>Họp giao ban, sinh hoạt lớp</td><td><button class="btn xs">Excel</button></td></tr>
      <tr><td><b>Danh sách học sinh chưa nộp</b></td><td>GVCN in ra nhắc trực tiếp</td><td><button class="btn xs">PDF</button></td></tr>
      <tr><td><b>Thống kê BTVN theo môn</b></td><td>PHT_CM rà khối lượng bài giữa các môn</td><td><button class="btn xs">Excel</button></td></tr>
      <tr><td><b>Bài nộp và phần chữa của một học sinh</b></td><td>Trao đổi với phụ huynh</td><td><button class="btn xs">PDF</button></td></tr>
     </table>`,[['Đóng',0]]);return}
 toast('Thao tác demo');
}

render();
</script>
