  const ds=nhomDaChon(ch); if(!ds.length) return;
  const k=chanKN();
  if(k&&!k.mvp){ modal('🔴 Chưa '+(ch==='keo'?'kéo về':'đẩy lên')+' được — kết nối '+KN[kn].ten,

    '<button class="btn" onclick="dong()">Đóng</button><button class="btn p" onclick="dong();doiTab(1)">→ Tab Kết nối</button>'); return }

  let ghide=0, mal=0, rui=[];
  ds.forEach(function(g){const d=DC[g.id]; if(d){ghide+=d.lech; mal+=d.maLech; (d.ruiro||[]).forEach(r=>{if(r[1]>=2)rui.push([g.ten,r])})}});

  if(ch==='keo'){
    let b='<div class="note n-d" style="margin:0 0 11px;font-size:13px"><b>Xác nhận tải dữ liệu từ CSDL ngành và GHI ĐÈ lên dữ liệu trên hệ thống?</b></div>';
    b+='<dl class="kv" style="padding:0 0 10px"><dt>Nhóm dữ liệu</dt><dd>'+ds.map(g=>'<b>'+esc(g.ten)+'</b>').join(' → ')+
       ' <span class="mut">(đã sắp theo thứ tự phụ thuộc)</span></dd>'+
       '<dt>Số bản ghi sẽ bị <b>ghi đè</b></dt><dd class="risk3"><b>'+so(ghide)+' bản ghi</b></dd>'+
