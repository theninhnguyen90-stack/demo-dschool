/* ═══════════ 🆕 §3.8 — HÀM TRẠNG THÁI HỌC SINH ═══════════
   Mốc học kỳ đọc từ M10.1 mục ① — BỐN mốc bắt buộc của bước ①.
   ⛔ KHÔNG suy học kỳ từ tháng cố định: mỗi trường một mốc, và khung thời gian
   năm học do UBND tỉnh quyết định (M10.1 §15). */
const MOC_HK={nam:'2026-2027', bd1:'2026-09-05', kt1:'2027-01-15', bd2:'2027-01-25', kt2:'2027-05-28'};
const TEN_KY={k1:'kỳ 1', k2:'kỳ 2', he:'trong hè'};
function kyCua(ngay){
  if(!ngay) return null;
  if(ngay < MOC_HK.bd1) return 'he';
  if(ngay <= MOC_HK.kt1) return 'k1';
  if(ngay < MOC_HK.bd2) return 'k1';   /* nghỉ giữa hai kỳ — em CHƯA HỌC NGÀY NÀO của kỳ 2 */
  if(ngay <= MOC_HK.kt2) return 'k2';
  return 'he';
}
function trangThaiNganh(tt, ngay){
  if(tt==='Đang học'||tt==='Chờ đồng bộ CSDL ngành'||tt==='Chờ chuyển đi') return {ok:1, gt:'Đang học'};
  if(tt==='Đã tốt nghiệp') return {ok:0, loai:'tnghiep',
    ly:'Cổng KHÔNG CÓ giá trị «Đã tốt nghiệp» — quá trình học kết thúc bằng xét tốt nghiệp ở M3.4. ⛔ Không im lặng bỏ qua: dòng này ở đây để giải thích chênh lệch sĩ số.'};
  if(tt==='Chờ xếp lớp') return {ok:0, loai:'chualop',
    ly:'Chưa có lớp thì không gắn được vào đâu — lớp là KHÓA NEO khi đẩy (§3.1). Xếp lớp ở M1.9 rồi đẩy lại là hết.'};
  const k=kyCua(ngay);
  if(!k) return {ok:0, loai:'sk',
    ly:'Thiếu «Ngày trạng thái» — không suy được học kỳ. ⛔ Không lấy ngày chạy phiên thay, ⛔ không mặc định «Đang học».'};
  if(tt==='Đã chuyển đến') return {ok:1, gt:'Chuyển đến '+TEN_KY[k]};
  if(tt==='Đã chuyển đi')  return {ok:1, gt:'Chuyển đi '+TEN_KY[k]};
  if(tt==='Đã thôi học'||tt==='Đóng hồ sơ tạm') return {ok:1, gt:'Thôi học '+TEN_KY[k]};
  if(tt==='Đang bảo lưu'){
    if(k==='he') return {ok:0, loai:'onhan',
      ly:'Cổng chỉ có «Nghỉ học xin học lại kỳ 1» và «kỳ 2» — KHÔNG có giá trị cho thời điểm trong hè. ⛔ Không ép về kỳ 1 cho có.'};
    return {ok:1, gt:'Nghỉ học xin học lại '+TEN_KY[k]};
  }
  return {ok:0, loai:'onhan', ly:'Trạng thái «'+tt+'» chưa có ô nhận nào ở cổng — ⛔ không đoán.'};
}

 ok    :{ten:'Đang hoạt động', cls:'ok',  chay:1, mo:'Xác thực thành công · phiên gần nhất 24/08/2026'},
 mvp   :{ten:'Chưa có API (MVP)', cls:'warn', chay:2, mo:'Cơ chế MVP — thao tác được tới bước xác nhận, bước cuối hiện thông báo',
         thieu:'API CSDL ngành chưa mở. Mọi luồng vẫn dựng đủ để chạy thử; bước gửi thật sẽ hoàn thiện ở giai đoạn 2.'},
 chua  :{ten:'Chưa khai báo', cls:'bad', chay:0, mo:'Chưa có tài khoản kết nối',
         thieu:'Thiếu: mã trường CSDL ngành · tài khoản kết nối · mật khẩu.'},
 sai   :{ten:'Sai xác thực', cls:'bad', chay:0, mo:'Tài khoản hoặc mật khẩu không đúng',
         thieu:'CSDL ngành trả về: “Thông tin đăng nhập không hợp lệ”. Nhập lại mật khẩu ở tab Kết nối.'},
 han   :{ten:'Hết hạn', cls:'bad', chay:0, mo:'Tài khoản kết nối hết hiệu lực từ 01/08/2026',
         thieu:'Tài khoản kết nối đã hết hiệu lực. Liên hệ Sở GDĐT gia hạn, rồi cập nhật lại ở tab Kết nối.'},
 tuchoi:{ten:'Sở từ chối', cls:'bad', chay:0, mo:'Xác thực được nhưng bị từ chối quyền ghi',
         thieu:'CSDL ngành trả về: “Tài khoản không có quyền ghi cho mã trường 79012345”. Cần Sở cấp lại quyền.'}};

let vai='FULL', kn='ok', tab=1, tick={}, xem=null, htDuyet=false;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const so=n=>n.toLocaleString('vi-VN');
function toast(h){const e=document.getElementById('tt');e.innerHTML=h;e.classList.add('on');
  clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove('on'),5600)}
function modal(t,b,f){document.getElementById('mh').innerHTML=t;document.getElementById('mb').innerHTML=b;
  document.getElementById('mf').innerHTML=f;document.getElementById('mdl').classList.add('on');
  document.getElementById('ov').classList.add('on')}
function dong(){document.getElementById('mdl').classList.remove('on');document.getElementById('ov').classList.remove('on')}

/* ═══════════ THANH KẾT NỐI ═══════════ */
function veConn(){
  const k=KN[kn];
  let h='<div class="conn '+k.cls+'">'+(k.chay===1?'🟢':k.chay===2?'🟡':'🔴')+
    ' <b>Kết nối CSDL ngành: '+k.ten+'</b> <span style="opacity:.85">· '+esc(k.mo)+'</span>'+
    '<span style="opacity:.7">· mã trường <span class="mono">79012345</span> · chế độ <b>1 Trường ↔ 1 mã</b></span>'+
    '<span class="r">';
  if(k.chay!==1) h+='<button class="btn" onclick="doiTab(1)">→ Tab Kết nối</button>';
  h+='</span></div>';
  document.getElementById('connbar').innerHTML=h;
}
/* nut van HIEN khi ⛔, va neu chinh xac thieu gi (§4) */
function chanKN(){
  const k=KN[kn];
  if(k.chay===1) return null;
  if(k.chay===2) return {mvp:1,msg:k.thieu};
  return {msg:k.thieu};
}

/* ═══════════ TABS ═══════════ */
const TENTAB={1:'🔌 Kết nối',2:'📥 Kéo về',3:'📤 Đẩy lên',4:'Việc chưa xong',5:'Lịch sử',6:'Xuất dữ liệu'};
function veTabs(){
  let h='';
  for(let i=1;i<=6;i++){
    const on=coTab(i);
    let nhan=TENTAB[i];
    if(i===4) nhan+=' <span class="tag t-r">'+VIEC.length+'</span>';
    h+='<button id="tb'+i+'" '+(tab===i?'class="on"':'')+(on?'':' disabled')+' onclick="doiTab('+i+')">'+nhan+'</button>';
  }
  document.getElementById('tabs').innerHTML=h;
}
function doiTab(t){ if(!coTab(t))return; tab=t; xem=null; htDuyet=false; ve() }

/* ═══════════ TAB 1 — KẾT NỐI ═══════════ */
function tab1(){
  const q=R().kn;
  let h='<div class="note n-i">Mọi thao tác kéo · đẩy · gọi dịch vụ đều <b>treo vào trạng thái kết nối</b>. Vì thế thanh trạng thái nằm ở <b>mọi tab</b>, không giấu trong tab cấu hình.</div>';
  h+='<div class="sec"><h3>Khai báo kết nối<span class="r">'+(q?'':'🔒 chỉ Quản trị hệ thống sửa được')+'</span></h3><dl class="kv">'+
   '<dt>Mã trường CSDL ngành</dt><dd class="mono">79012345 <span class="mut">(TT 42/2021)</span></dd>'+
   '<dt>Chế độ mapping</dt><dd><b>1 Trường ↔ 1 mã</b> <span class="mut">· Legacy (1 điểm trường ↔ 1 mã) dùng khi Sở chưa xử lý sáp nhập</span><br>'+
     '<span class="mut">→ quyết định <b>phạm vi phiên = School</b>; xử lý Việc chưa xong = Branch</span></dd>'+
   '<dt>Cơ quan quản lý</dt><dd>Sở GDĐT tỉnh · cấp xã <span class="mut">⚠ cấu hình được, không hard-code — TT 13/2025 + TT 26/2025 đang chuyển tiếp tới 28/02/2027, Phòng GDĐT cấp huyện không còn</span></dd>'+
   '<dt>Tài khoản kết nối</dt><dd class="mono">thcs.79012345</dd>'+
   '<dt>Mật khẩu / khóa bí mật</dt><dd class="mono">•••••••••••• <span class="mut">· cập nhật 02/08/2026</span><br>'+
     '<b style="color:#b91c1c">🔒 Ghi được, KHÔNG đọc lại được — kể cả Quản trị hệ thống.</b> <span class="mut">Đổi thì nhập lại toàn bộ.</span></dd>'+
   '</dl><div style="padding:0 10px 10px">'+
   '<button class="btn'+(q?'':' lock')+'" onclick="'+(q?'suaKN()':'khoaKN()')+'">'+(q?'✎ Cập nhật kết nối':'🔒 Vì sao không sửa được')+'</button> '+
   '<button class="btn" onclick="thuKN()">⇄ Thử kết nối</button></div></div>';

  h+='<div class="sec"><h3>Danh mục dịch vụ tính toán<span class="r">hệ thống gửi input → CSDL ngành trả kết quả</span></h3>'+
   '<table><thead><tr><th style="width:230px">Dịch vụ</th><th style="width:210px">Input gửi lên</th><th style="width:190px">Kết quả trả về</th>'+
   '<th style="width:150px">Chế độ</th><th>Lần gọi gần nhất</th></tr></thead><tbody>';
  DV.forEach(function(d){
    h+='<tr><td><b>'+esc(d.ten)+'</b>'+(d.ghi?'<br><span class="mut">'+esc(d.ghi)+'</span>':'')+'</td>'+
       '<td class="mut">'+esc(d.inp)+'</td><td class="mut">'+esc(d.out)+'</td>'+
       '<td><span class="tag '+(d.che==='ct'?'t-r':'t-n')+'">'+(d.che==='ct'?'Chính thức':'Tham khảo')+'</span>'+
       '<br><button class="btn" style="margin-top:4px;padding:2px 7px" onclick="doiChe(\''+d.id+'\')">đổi chế độ</button></td>'+
       '<td class="mut">'+esc(d.lan)+' '+(KN[kn].chay?'<br><button class="btn" style="margin-top:4px;padding:2px 7px" onclick="goiDV(\''+d.id+'\')">▶ Gọi thử</button>':'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="note n-w"><b>Rủi ro hai nguồn sự thật.</b> Nếu CSDL ngành tính điểm tổng kết thì <b>M1.6 tính để làm gì</b> — hai nơi cùng tính một con số là hai nguồn sự thật, đúng thứ D1 cấm. Nên chế độ là <b>cấu hình theo từng dịch vụ</b>, và <b>mặc định là <code>Tham khảo</code></b>: để <code>Chính thức</code> làm mặc định thì một dịch vụ khai báo cẩu thả có thể <b>ghi đè điểm tổng kết cả trường</b> mà không ai kịp nhận ra.</div>';
  return h;
}
function khoaKN(){modal('🔒 Vì sao chức danh này không sửa được kết nối',
 '<div class="note n-i" style="margin:0 0 10px">Đây là <b>tài khoản của TRƯỜNG trên hệ thống của Bộ</b>, không phải một tài khoản nội bộ.</div>'+
 '<p>Người cầm được nó có thể <b>ghi vào dữ liệu ngành dưới danh nghĩa trường</b> — và audit của Bộ sẽ chỉ về trường, không chỉ về cá nhân.</p>'+
 '<p style="margin-top:9px">Chức danh sửa được: <b>Quản trị hệ thống</b>. Hiệu trưởng <b>xem được</b> để biết trạng thái, nhưng không sửa.</p>',
 '<button class="btn" onclick="dong()">Đóng</button>')}
function suaKN(){modal('✎ Cập nhật kết nối',
 '<div class="note n-d" style="margin:0 0 10px"><b>Bản demo không chứa thông tin xác thực thật.</b> Màn hình thật sẽ có ô nhập mật khẩu; giá trị đã lưu <b>không bao giờ hiện lại</b>, kể cả cho người đang nhập.</div>'+
 '<dl class="kv" style="padding:0"><dt>Mã trường CSDL ngành</dt><dd class="mono">79012345</dd>'+
 '<dt>Tài khoản kết nối</dt><dd class="mono">thcs.79012345</dd>'+
 '<dt>Mật khẩu mới</dt><dd class="mono">(ô nhập — để trống thì giữ nguyên)</dd></dl>'+
 '<p class="mut" style="margin-top:10px">Thay đổi ghi audit <b>mức ② Quan trọng</b> ở M10.7.</p>',
 '<button class="btn" onclick="dong()">Hủy</button><button class="btn p" onclick="dong();toast(\'Đã ghi audit mức ② — đổi khai báo kết nối. Mật khẩu không hiện lại ở bất kỳ đâu.\')">Lưu</button>')}
function thuKN(){const k=KN[kn];
 if(k.chay===1) toast('✅ Kết nối tới CSDL ngành thành công · mã trường 79012345 · quyền đọc và ghi.');
 else toast('🔴 <b>Không kết nối được.</b> '+esc(k.thieu||k.mo));}
function doiChe(id){
  const d=DV.filter(x=>x.id===id)[0];
  if(d.che==='ct'){ d.che='tk'; ve(); toast('Đã chuyển «'+esc(d.ten)+'» về chế độ <b>Tham khảo</b>. Kết quả trả về chỉ hiện để đối chiếu, không ghi vào dữ liệu nghiệp vụ.'); return }
  if(!R().duyet){ modal('⛔ Bật chế độ Chính thức cần Hiệu trưởng duyệt',
    '<div class="note n-w" style="margin:0 0 10px">Chức danh <b>'+esc(R().ten)+'</b> không có quyền <code>D</code> ở Feature này.</div>'+
    '<p>Chế độ <b>Chính thức</b> nghĩa là kết quả CSDL ngành trả về sẽ <b>ghi đè kết quả nội bộ</b> của menu chủ. Với «'+esc(d.ten)+'» thì đó là dữ liệu đi vào <b>học bạ</b>, vào <b>xét lên lớp</b>, vào <b>xét tốt nghiệp</b>.</p>'+
    '<p style="margin-top:9px">Vì thế nó cần <b>Hiệu trưởng duyệt</b>, và mỗi lần bật đều ghi audit mức ②.</p>',
    '<button class="btn" onclick="dong()">Đóng</button>'); return }
  modal('⚠ Bật chế độ CHÍNH THỨC cho «'+esc(d.ten)+'»',
   '<div class="note n-d" style="margin:0 0 10px"><b>Kết quả CSDL ngành trả về sẽ GHI ĐÈ kết quả nội bộ.</b> Menu chủ <b>'+esc(d.out)+'</b> sẽ không còn là nguồn sự thật cho phép tính này.</div>'+
   '<dl class="kv" style="padding:0"><dt>Input gửi lên</dt><dd>'+esc(d.inp)+'</dd><dt>Kết quả trả về</dt><dd>'+esc(d.out)+'</dd>'+
   '<dt>Menu chủ bị ghi đè</dt><dd>M1.6 Tổng kết và xếp loại</dd></dl>'+
   '<p class="mut" style="margin-top:10px">Ghi audit <b>mức ②</b> ở M10.7, kèm tên người duyệt.</p>',
   '<button class="btn" onclick="dong()">Hủy</button><button class="btn d" onclick="batCT(\''+id+'\')">Duyệt bật Chính thức</button>')}
function batCT(id){const d=DV.filter(x=>x.id===id)[0];d.che='ct';dong();ve();
  toast('Đã bật <b>Chính thức</b> cho «'+esc(d.ten)+'» · người duyệt: '+esc(R().ten)+' · đã ghi audit mức ②.')}
function goiDV(id){const d=DV.filter(x=>x.id===id)[0];
  const k=chanKN();
  if(k&&!k.mvp){ toast('🔴 <b>Chưa gọi được dịch vụ.</b> '+esc(k.msg)); return }
  if(k&&k.mvp){ toast('🟡 <b>MVP:</b> '+esc(k.msg)); return }
  if(d.che==='tk') toast('▶ Đã gọi «'+esc(d.ten)+'» · nhận kết quả cho 1.284 bản ghi. Chế độ <b>Tham khảo</b> — kết quả hiện cạnh số nội bộ, <b>báo lệch 7 bản ghi</b>, không ghi vào dữ liệu nghiệp vụ.');
  else toast('▶ Đã gọi «'+esc(d.ten)+'» · chế độ <b>Chính thức</b> — đã ghi đè kết quả nội bộ 1.284 bản ghi. Đã ghi audit mức ②.');}

/* ═══════════ TAB 2 & 3 — KÉO VỀ / ĐẨY LÊN ═══════════ */
function tabChieu(ch){
  const keo=ch==='keo';
  const co=keo?R().keo:R().day;
  let h='<div class="note '+(keo?'n-w':'n-i')+'">'+
    (keo?'<b>📥 Kéo về — CSDL ngành được ưu tiên tin tưởng.</b> Dữ liệu Sở sẽ <b>ghi đè</b> dữ liệu hệ thống ở những nhóm được chọn.'
        :'<b>📤 Đẩy lên — Hệ thống được ưu tiên tin tưởng.</b> Dữ liệu mới nhất trên hệ thống sẽ được gửi lên CSDL ngành.')+
    ' Độ mịn kiểm soát là <b>NHÓM DỮ LIỆU</b>: không muốn động vào cái gì thì <b>không tick nhóm đó</b>.</div>';

  /* ── BCM9-2C: một dòng DẪN sang báo cáo đối chiếu ──────────────────────
     Báo cáo «trường ↔ Sở lệch ở đâu» (BC-QT-02) ở lại `M9.1` tab 🧾 —
     nó đọc SÁU menu nên là cross-nhóm (N3), và đặt một bản sao trong M10.8
     để đối chiếu chính M10.8 là một vòng. Ở đây chỉ dẫn đường, ⛔ không
     nhân bản bảng, ⛔ không thêm Feature.                                 */
  if(!keo) h+='<div class="note n-i">🧾 <b>Trước khi bấm Đẩy lên:</b> chạy '+
    '<b>Đối chiếu trước khi gửi Sở</b> để xem trường nào còn lệch, hồ sơ nào bị chặn. '+
    'Báo cáo đó ở <a href="#" onclick="toast(\'↗ Deep-link: /M9.1?tab=doi_chieu&amp;return=M10.8 — demo một tệp không mở được menu khác, nhưng đường dẫn là đường dẫn thật.\');return false"><b>↗ M9.1 › tab 🧾 Đối chiếu trước khi gửi Sở</b></a>. '+
    '<span class="mut">Còn lệch thì đây là <b>cảnh báo, không chặn</b> — xem M10.8 §15.</span></div>';

  h+='<div class="bar"><b>Chọn nhóm dữ liệu</b> <span class="mut">(chọn nhiều được — hệ thống tự sắp theo thứ tự phụ thuộc)</span>'+
     '<span class="rs" id="rs"></span></div>';
  h+='<table><thead><tr><th style="width:34px"></th><th style="width:250px">Nhóm dữ liệu</th><th style="width:120px">Menu chủ</th>'+
     '<th style="width:110px">Số bản ghi</th><th style="width:160px">'+(keo?'Kéo về':'Đẩy lên')+' gần nhất</th><th>'+(keo?'Kéo về thì chuyện gì xảy ra':'Ghi chú')+'</th></tr></thead><tbody>';
  NHOM.forEach(function(g){
    const dung = keo?g.keo:g.day;
    const quyen = duocNhom(g.id);
    const bat = dung && quyen && co;
    h+='<tr>'+
     '<td>'+(bat?'<input type="checkbox" class="chk" '+(tick[g.id]?'checked':'')+' onchange="tickNhom(\''+g.id+'\',this.checked)">'
                :'<span title="không chọn được">—</span>')+'</td>'+
     '<td><b>'+esc(g.ten)+'</b><br><span class="mut">'+esc(g.mo)+'</span></td>'+
     '<td class="mut">'+esc(g.mn)+'</td>'+
     '<td>'+so(g.n)+'</td><td class="mono">'+esc(g.lan)+'</td><td>';
    if(!dung) h+='<span class="tag t-r">⛔ chỉ đẩy, không kéo</span>'+
      (g.nhaycam?' <span class="tag t-y">🔒 dữ liệu nhạy cảm của trẻ em</span>':'')+
      '<br><span class="mut">'+esc(g.lydo)+'</span>';
    else if(!quyen) h+='<span class="tag t-n">ngoài phạm vi chức danh</span><br><span class="mut">Tổ chức nhân sự chỉ thao tác nhóm <b>Danh sách nhân sự</b>.</span>';
    else if(!co) h+='<span class="tag t-n">chức danh không có quyền '+(keo?'kéo về':'đẩy lên')+'</span>';
    else if(keo){
      const d=DC[g.id]; if(d&&d.ruiro.length){
        h+=d.ruiro.map(r=>'<span class="risk'+r[1]+'">'+(r[1]===3?'🔴':r[1]===2?'🟡':'🟢')+' '+esc(r[0])+'</span> <span class="mut">'+esc(r[2])+'</span>').join('<br>');
      } else h+='<span class="mut">—</span>';
    } else if(g.nhaycam) h+='<span class="tag t-y">🔒 Luật BVDLCN 91/2025</span> '+
      '<span class="mut">Đẩy nhóm này là một <b>lượt XUẤT dữ liệu cá nhân nhạy cảm của trẻ em</b> — '+
      'ghi audit ở <b>cả hai nơi</b>: lịch sử phiên ở đây và <b>nhật ký truy cập M6.6 tab 7</b>. '+
      '⛔ Nhóm máu · dị ứng · bệnh nền · liên hệ khẩn cấp <b>KHÔNG nằm trong tải trọng</b>.</span>';
    else if(g.moi) h+='<span class="tag t-g">🆕 nhóm mới — HDCS ④</span><br>'+
      '<span class="mut">Đơn vị dòng: <b>'+esc(g.donvi)+'</b> · khóa đối khớp: <b>'+esc(g.khoa)+'</b> · phụ thuộc: <b>'+esc(g.phuthuoc)+'</b><br>'+
      '★ Xem trước <b>hiện ĐẦY ĐỦ TỪNG DÒNG</b> — ⛔ không áp luật «dừng ở mức đếm» của nhóm Sức khỏe.</span>';
    else h+='<span class="mut">Dữ liệu hệ thống là bản được gửi lên.</span>';
    h+='</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="bar" style="border-top:1px solid #e3e8ef;border-bottom:none">'+
     '<button class="btn" id="bXem" onclick="xemTruoc(\''+ch+'\')">👁 Xem trước</button>'+
     '<button class="btn p" id="bChay" onclick="xacNhan(\''+ch+'\')">'+(keo?'📥 Kéo về':'📤 Đẩy lên')+'</button>'+

  /* 🆕 20/9/2026 — §6.5: đường kéo THỨ HAI, ⛔ KHÔNG phải nhóm dữ liệu thứ mười.

/* ═══════════ 🆕 20/9/2026 — DỰNG BỐN BẢNG ÁNH XẠ (CSDL-2A) ═══════════ */
const HANG={dx:['dẫn xuất','t-b'], ax:['ánh xạ','t-n'], ko:['⛔ không có ô nhận','t-r']};

/* ══ §3.1 — thứ tự phụ thuộc. Hai nhóm mới treo vào «Cơ cấu tổ chức»,
   ⛔ KHÔNG treo vào «Hồ sơ học sinh»: đơn vị dòng của chúng là ĐƠN VỊ, không phải người.
   «CSVC công trình» treo thêm vào «Danh mục lớp» vì dòng 1 của ma trận đọc số lớp. ══ */
const PHU_THUOC={lop:['cc'], ns:['cc'], hs:['cc','lop','ns'], kq:['hs'], skhoe:['hs'], vb:['hs'],
                 dkdb:['cc'], csvc:['cc','lop']};
const nhomTen=id=>{const g=NHOM.filter(x=>x.id===id)[0]; return g?g.ten:id};
/* đã đồng bộ THÀNH CÔNG theo ĐÚNG CHIỀU đang chạy — kéo về xong không thay cho đẩy lên */
const daDongBo=(id,ch)=>LS.some(p=>p.ch===ch && p.ok===1 && String(p.nh).indexOf(nhomTen(id))>=0);
function canhBaoPhuThuoc(ds,ch){
  const chon={}; ds.forEach(g=>chon[g.id]=1);
  const r=[];
  ds.forEach(function(g){
    (PHU_THUOC[g.id]||[]).forEach(function(d){
      if(chon[d] || daDongBo(d,ch)) return;
      r.push([g.ten, nhomTen(d)]);
    });
  });
  return r;
}
function khoiCanhBao(ds,ch){
  const cb=canhBaoPhuThuoc(ds,ch); if(!cb.length) return '';
  return '<div class="note n-w" style="margin:10px">⚠ <b>Cảnh báo thứ tự phụ thuộc — ⛔ KHÔNG CHẶN.</b><br>'+
   cb.map(x=>'· Nhóm <b>'+esc(x[0])+'</b> phụ thuộc <b>'+esc(x[1])+'</b>, mà nhóm ấy <b>chưa từng '+(ch==='keo'?'kéo về':'đẩy lên')+' thành công</b>.').join('<br>')+
   '<br><span class="mut">Vẫn chạy được: có trường đã nhập tay đủ cơ cấu trên cổng rồi (§3.1). Nhưng đây đúng là nguyên nhân của lượt đẩy bị Sở từ chối '+
   'với lý do «mã lớp không tồn tại» — xem tab <b>Việc chưa xong</b>.</span></div>';
}
function bangAnhXa(ten, donvi, khoa, rows){
  let n=0; rows.forEach(r=>{ if(r.length>1) n++ });
  let h='<div class="sec" style="margin:0 10px 10px"><h3>Ánh xạ trường ↔ trường — '+ten+
    '<span class="r">'+n+' dòng · đơn vị dòng: <b>'+donvi+'</b> · khóa đối khớp: <b>'+khoa+'</b></span></h3>'+
    '<div class="note n-w" style="margin:10px"><b>Ba luật áp cho MỌI dòng:</b> '+

function chay(ch){
  const ds=nhomDaChon(ch), k=chanKN();
  dong();
  if(k&&k.mvp){ toast('🟡 <b>MVP — dừng ở đây.</b> '+esc(k.msg)); return }
  const id='P-'+(900+LS.length);
  if(ch==='keo'){
    let ghide=0,mal=0; ds.forEach(g=>{const d=DC[g.id]; if(d){ghide+=d.lech;mal+=d.maLech}});
    LS.unshift({id:id,t:'29/08/2026 09:30',u:R().ten,ch:'keo',nh:ds.map(g=>g.ten).join(' · '),ng:'API',n:ghide,
      kq:'Áp dụng — ghi đè '+so(ghide)+' bản ghi'+(mal?', '+mal+' lệch mã → Việc chưa xong':''),ok:1,ht:1});
    toast('✅ Đã kéo về · ghi đè <b>'+so(ghide)+'</b> bản ghi'+(mal?' · <b>'+mal+'</b> lệch mã định danh <b>không ghi đè</b>, đã chuyển sang Việc chưa xong':'')+
          ' · <b>hoàn tác được 7 ngày</b> ở tab Lịch sử.');
  } else {
    const n=ds.reduce((a,g)=>a+g.n,0);
    LS.unshift({id:id,t:'29/08/2026 09:30',u:R().ten,ch:'day',nh:ds.map(g=>g.ten).join(' · '),ng:'API',n:n,
      kq:R().duyet?'Đã đẩy — Sở nhận '+so(n)+' bản ghi':'Chờ Hiệu trưởng duyệt',ok:R().duyet?1:2,ht:0});
    if(!R().duyet)
      VIEC.unshift({loai:'duyet',ob:'Phiên '+id+' · '+ds.map(g=>g.ten).join(' · '),
        ct:so(n)+' bản ghi · người gửi: '+R().ten+' · 29/08/2026 09:30',
        ly:'Đẩy lên CSDL ngành cần Hiệu trưởng DUYỆT trước — không phải ký số. Phiên đang treo, chưa gửi gì lên Sở.',
        ai:'HT', pid:id});
    toast(R().duyet?'✅ Đã đẩy <b>'+so(n)+'</b> bản ghi lên CSDL ngành.'
                   :'📨 Đã gửi Hiệu trưởng duyệt — <b>chưa đẩy gì cả</b>. Việc đang chờ ở tab <b>Việc chưa xong</b>.');
  }
  tick={}; ve();
}

    '⛔ không một trường nào của hồ sơ nhân sự trỏ vào một lớp. Sơ đồ vẽ thành chuỗi tuyến tính nên đọc nhầm được, '+
    'và đọc nhầm thì hoặc <b>sửa luồng cho khớp sơ đồ</b>, hoặc <b>chặn nhầm lượt kéo nhân sự</b> vì «chưa có lớp».<br>'+
    '⟹ Nhân sự <i>(bước 4)</i> và Danh mục lớp <i>(bước 8b③)</i> là <b>hai nhánh song song</b>.</div>';

  /* §6.6 — hai ca */
  h += rong
    ? '<div class="note n-g">✅ <b>Kho RỖNG TUYỆT ĐỐI</b> — nhóm đang kéo có <b>0 bản ghi</b> ⇒ ⛔ <b>không có gì để trùng</b> ⇒ '+
      '<b>cho tạo hàng loạt</b>, nút <b>Chọn tất cả</b> sống. Hộp xác nhận nêu <b>số bản ghi sẽ tạo · nguồn · thời điểm chốt dữ liệu của cổng</b>; '+
      'ghi thành <b>một phiên</b> có hoàn tác 7 ngày.<br>'+
      '🛑 Điều kiện đọc theo <b>TỪNG NHÓM</b>: trường đã nạp nhân sự bằng Excel ở bước 4 thì kho <b>nhân sự</b> có dữ liệu, '+
      'kho <b>học sinh</b> vẫn rỗng — lượt kéo học sinh ấy <b>vẫn được tạo hàng loạt</b>.<br>'+
      '⚠ «Rỗng tuyệt đối» ⛔ <b>không phải</b> «rỗng sau bộ lọc» — đếm toàn bộ, ⛔ không đếm theo điểm trường hay năm học đang chọn.</div>'
    : '<div class="note n-w">🔴 <b>Kho đã có dữ liệu</b> — nhóm có <b>≥ 1 bản ghi</b> ⇒ áp <b>§6.7 chống tạo trùng hàng loạt</b>. '+
      'Rủi ro lớn nhất đúng lúc này: hệ thống có hồ sơ <b>thiếu mã định danh</b>, lượt kéo thấy các em đó là <b>«chỉ có ở CSDL ngành»</b>, '+
      'một cú <b>Chọn tất cả</b> sinh ra <b>hàng nghìn hồ sơ trùng</b> — mỗi em <b>một bản có điểm không mã</b> và <b>một bản có mã trống rỗng</b>.</div>';

  h += '<div style="margin-top:8px"><button class="btn p" onclick="xemLuotKeo108()">👁 Xem trước lượt kéo «Hồ sơ học sinh» đầu tiên</button></div>';
  return h + '</div></div>';
}

function datKho(v){ KHO_KT = v; ve(); }

/* ───── màn xem trước: hai ca khác hẳn nhau ───── */
function xemLuotKeo108(){
  const rong = KHO_KT === 'rong';
  let b;
  if (rong){
    b = '<div class="note n-g" style="margin:0 0 10px">✅ <b>Kho học sinh RỖNG TUYỆT ĐỐI</b> — 0 bản ghi. '+
      'Mọi dòng đều là <b>➕ chỉ có ở CSDL ngành</b>, và ⛔ <b>không có hồ sơ nào để trùng</b>.</div>'+
      '<dl class="kv"><dt>Sẽ tạo</dt><dd><b>'+so(KT_MOI + KT_KHOP.length)+'</b> hồ sơ học sinh</dd>'+
      '<dt>Nguồn</dt><dd>CSDL ngành GD&ĐT · mã trường <span class="mono">79.01.0123456789012345</span></dd>'+
      '<dt>Thời điểm chốt dữ liệu của cổng</dt><dd class="mono">23/09/2026 06:00</dd>'+
      '<dt>Hoàn tác</dt><dd><b>7 ngày</b> — bỏ qua bản ghi đã bị sửa tay sau phiên, và nêu đích danh</dd></dl>'+
      '<div class="note n-i" style="margin:10px 0 0">Nút <b>Chọn tất cả</b> <b>sống</b> ở ca này — ⛔ và chỉ ở ca này.</div>';
  } else {
    b = '<div class="note n-w" style="margin:0 0 10px">🔴 <b>3 dòng khớp gần đúng với hồ sơ đang có mà THIẾU MÃ.</b> '+
      'Nút <b>Chọn tất cả</b> <b>bị vô hiệu hóa</b> ở nhóm dòng này.</div>'+
      '<div class="note n-i" style="margin:0 0 10px"><b>Luật khớp</b> <i>(bê nguyên M1.5 §7.11.1)</i>: '+
      '<b>khớp chắc</b> = họ tên (bỏ dấu, chuẩn hóa khoảng trắng) + ngày sinh trùng · '+
      '<b>khớp nghi ngờ</b> = họ tên trùng + cùng khối.</div>'+
      '<table><thead><tr><th>Dòng của cổng</th><th>Khớp với hồ sơ đang có</th><th style="width:250px">Thao tác</th></tr></thead><tbody>'+
      KT_KHOP.map(function(x){
        return '<tr><td><b>'+esc(x.ten)+'</b><br><span class="mut">'+esc(x.ns)+' · '+esc(x.khoi)+' · mã '+esc(x.ma)+'</span></td>'+
          '<td><span class="tag '+(x.muc==='chac'?'t-y':'t-n')+'">⇄ khớp '+(x.muc==='chac'?'chắc':'nghi ngờ')+'</span><br>'+
          '<b>'+esc(x.hs.ma)+'</b> · '+esc(x.hs.lop)+' · <b>'+x.hs.diem+' đầu điểm</b> · <span class="tag t-r">THIẾU MÃ</span></td>'+
          '<td><button class="btn p" onclick="ganMa108(\''+x.hs.ma+'\')">⇄ Gán mã vào hồ sơ đang có</button> '+
          '<button class="btn" onclick="taoMoi108(\''+esc(x.ten)+'\',\''+x.hs.ma+'\','+x.hs.diem+')">+ Tạo hồ sơ mới</button></td></tr>';
      }).join('')+
      '<tr><td colspan="3" class="mut">… và <b>'+so(KT_MOI)+'</b> dòng ⛔ <b>không khớp ai</b> — tick chọn bình thường, '+
      'nút <b>Chọn tất cả</b> của <i>nhóm này</i> vẫn sống.</td></tr>'+
      '</tbody></table>'+
      '<div class="note n-d" style="margin:10px 0 0">⛔ <b>Đối khớp gần đúng ⛔ KHÔNG bao giờ tự áp dụng</b> <i>(§8.1)</i> — '+
      'nhưng nó <b>phải được đề xuất</b>: lỗi trùng hồ sơ sinh ra chính từ chỗ người dùng <b>không biết là đang có hồ sơ khớp</b>.<br>'+
      '🔑 Nút chính là <b>Gán mã</b> vì hồ sơ ấy <b>trống mã</b>, và §1.4 cho phép <b>nhận mã từ CSDL ngành</b> — '+
      'đó là <b>ngoại lệ duy nhất</b> mà mã định danh tham gia đồng bộ.</div>';
  }
  modal('👁 Xem trước — lượt kéo «Hồ sơ học sinh» đầu tiên', b,
    '<button class="btn" onclick="dong()">Đóng</button>'+
    (rong ? '<button class="btn p" onclick="dong();toast(\'Đã tạo <b>'+so(KT_MOI + KT_KHOP.length)+'</b> hồ sơ trong MỘT phiên — hoàn tác 7 ngày\')">📥 Tạo hàng loạt</button>' : ''));
}

function ganMa108(ma){
  dong();
  toast('⇄ Đã gán mã định danh vào hồ sơ <b>'+esc(ma)+'</b> — ⛔ không tạo hồ sơ mới, ⛔ không mất một đầu điểm nào');
}
function taoMoi108(ten, ma, diem){
  modal('⚠ Tạo hồ sơ MỚI cho «'+esc(ten)+'»?',
   '<div class="note n-w" style="margin:0 0 10px">Hệ thống <b>đang có</b> một hồ sơ khớp gần đúng. Tạo mới nghĩa là '+
   '<b>hai hồ sơ cho một em</b>: một bản <b>có điểm, không mã</b> và một bản <b>có mã, trống rỗng</b>.</div>'+
   '<table><tr><th>Hồ sơ đang có</th><th>Dòng của CSDL ngành</th></tr>'+
   '<tr><td><b>'+esc(ma)+'</b><br>'+esc(ten)+'<br><b>'+diem+' đầu điểm</b><br><span class="tag t-r">THIẾU MÃ</span></td>'+
   '<td><b>chưa có trong hệ thống</b><br>'+esc(ten)+'<br>0 đầu điểm<br><span class="tag t-y">có mã định danh</span></td></tr></table>'+
   '<div class="note n-d" style="margin:10px 0 0">Trùng họ tên và ngày sinh là <b>chuyện có thật</b>, nên ⛔ không chặn cứng — '+
   'nhưng phải nói ra, và người bấm phải <b>nhận trách nhiệm bằng lời</b>.</div>',
   '<button class="btn" onclick="dong()">Quay lại</button>'+
   '<button class="btn p" onclick="dong();toast(\'Đã tạo hồ sơ mới — audit ghi <b>lời xác nhận hai em khác nhau</b>\')">'+
   'Tôi xác nhận đây là hai học sinh khác nhau</button>');
}

ve();
</script>
