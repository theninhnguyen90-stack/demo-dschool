      dong: dtCo.map(d => ({ id: d, ten: DT[d], phu: ds.filter(l => l.dt === d).length + ' lớp', lops: ds.filter(l => l.dt === d).map(l => l.id) })),
      o: (d, c) => CT.doc('KQ.06', PV.thamSo({ dsLop: d.lops, cap }), c.khoa || undefined),
      tongRieng: c => c.khoa ? null : CT.doc('KQ.06', PV.thamSo({ dsLop: ds.map(l => l.id), cap })),
      link: d => ({ menu: 'M3.4', ctx: 'tab=thcs&dt=' + d.id, nhan: 'hồ sơ xét — ' + DT[d.id] })
    });
    /* THCS xét TỐI ĐA HAI LẦN (`M3.4` §2.2) — biểu phải nói ra cả hai lần,
       vì một em để lại lần hai thì lần một của em ấy vẫn đã diễn ra.
       🛑 Đơn vị ở đây là LƯỢT XÉT: hai dòng ⛔ không cộng lại thành học sinh. */
    if (cap === 'THCS') khoi.push({
      tieuDe: 'Theo lần xét công nhận — ' + tenKhoi(kc), ma: 'KQ.06', chip: 'TON',
      moTaKy: PV.moTaChot() + ' · đơn vị: lượt xét', tenCotDau: 'Lần xét', nguon: ngn, tong: false,
      cot: [
        { khoa: 'duXet', ten: 'Dự xét', donVi: 'lượt', kieu: 'so', nguon: ngn },
        { khoa: 'congNhan', ten: 'Được công nhận', donVi: 'lượt', kieu: 'so', nguon: ngn },
        { khoa: 'conLai', ten: 'Để lại', donVi: 'lượt', kieu: 'so', nguon: ngn, canhBao: k => k.giaTri > 0 }
      ],
      dong: [
        { id: 'lan1', ten: 'Lần thứ nhất', phu: ky ? 'đã họp ' + k2s(ky.ngayKy) : '—', li: 1 },
        { id: 'lan2', ten: 'Lần thứ hai', phu: 'M3.4 §2.2 — tối đa hai lần', li: 2 }
      ],
      o: (d, c) => {
        const tham = PV.thamSo({ dsLop: ds.map(l => l.id), cap });
        if (c.khoa === 'conLai') {
          const a = CT.doc('KQ.06', tham, 'lan' + d.li + 'DuXet'), b = CT.doc('KQ.06', tham, 'lan' + d.li + 'CongNhan');
          if (a.canhBao) return a;
          return Object.assign({}, a, {
            ten: 'Để lại sau lần xét thứ ' + d.li, giaTri: (a.giaTri || 0) - (b.giaTri || 0),
            ghiChu: 'Dự xét <b>' + (a.giaTri || 0) + '</b> − được công nhận <b>' + (b.giaTri || 0) + '</b>.'
          });
        }
        return CT.doc('KQ.06', tham, 'lan' + d.li + (c.khoa === 'duXet' ? 'DuXet' : 'CongNhan'));
      },
      link: d => ({ menu: 'M3.4', ctx: 'tab=thcs&lan=' + d.li, nhan: 'hồ sơ lần xét thứ ' + d.li })
    });
  });
  /* Khối chữ ký: phần DỮ LIỆU (quyết định · người ký · biên bản) là dữ liệu
     của biểu, không phải chữ giải thích — nên nó đứng ở khối riêng; chỉ câu
     ranh giới một dòng nằm ở `.kyro`. */
  const chuKy = '<div class="kysta"><b>⚖ Trạng thái ký — thuộc M3.4</b>'
    + (ky ? '<div>' + esc(ky.quyetDinh) + ' · ký bởi <b>' + esc(ky.nguoiKy) + '</b> ngày ' + k2s(ky.ngayKy) + '</div>'
      + '<div>📄 ' + esc(ky.bienBan) + (ky.conLai ? ' · <b>' + esc(ky.conLai) + '</b>' : '') + '</div>'
      : '<div>Chưa có quyết định công nhận nào cho năm học này.</div>')
    + '</div>'
    + '<div class="kyro">🛑 Ký là năng lực <b>D</b> — nhóm 📊 không có ô <code>D</code>. '
    + dl('M3.4', 'tab=thcs&viec=ky', 'Ký tại M3.4') + '</div>';
  return daiPV() + daiNam(true) + PV.chotNgay() + PV.daiCanhBao()
    + KB.K6({
      khoi,
      oChuaAnhXa: [{ o: 'Chia theo dân tộc · diện chính sách', ly: 'M3.4 chưa trả về hai chiều này' }],
      chuKy
    })
    + dnote('Danh sách dự xét do <b>M3.3</b> kết luận và Hiệu trưởng đã ký công bố — <b>tab này không xét lại điều kiện lên lớp</b>.<br>'
      + 'Cấp trường không đào tạo thì <b>không tồn tại</b> trong dữ liệu trả về, ⛔ không phải làm mờ (tiền lệ <code>GY18-F</code> · <code>M3.4</code> §2.1). '
      + 'Trường nhiều cấp thì mỗi cấp <b>một khối riêng</b>, ⛔ không gộp tỉ lệ — hai cấp có hai căn cứ pháp lý khác nhau.<br>'
      + 'Đây là báo cáo loại <b>A</b>: khi phiên <code>4A</code> dựng <code>M9.9</code>, tab này nối thêm nút '
      + '<b>📤 Phát hành</b> ghi vào <code>m9.9.so_phat_hanh</code>. Trước đó, ba thứ thay cho snapshot là '
      + '<i>Chốt tại ngày</i> · dải cảnh báo · đóng dấu vào tệp xuất (kiến trúc §8.2).');
}

/* ══════════════ TAB 5 · 🛡 TIẾN ĐỘ CHỐT & KÝ HỌC BẠ ════════════════════
   `BC-KQ-06` — khuôn `K9`. 🛑 Đây là báo cáo VỀ DỮ LIỆU, không phải về học
   sinh: dòng là LỚP, và mỗi ô hỏng phải bấm được về đúng chỗ sửa.
   Hai cột chữ ký có MỐC RIÊNG: học bạ ký theo NĂM, nên ở giữa học kỳ I của
   năm đang chạy chúng ghi «chưa có dữ liệu», ⛔ không ghi 0.                */
function veTab5() {
  if (tabTrong('hoc_ba')) return khoiKhoaTab('hoc_ba');
  const ds = lopPV();
  const cot = [
    { khoa: 'daChot', ten: 'Đã chốt', donVi: 'học bạ', kieu: 'so', nguon: 'm3.1.chot_tong_ket_theo_lop', canhBao: k => k.giaTri === 0 },
    { khoa: 'choGVCN', ten: 'Chờ GVBM · GVCN ký', donVi: 'chữ ký', kieu: 'so', nguon: 'm1.3.chot_hoc_ba_theo_nam', chuThich: 'Đếm CHỮ KÝ, không đếm MÔN — M1.3 §3.1b', canhBao: k => k.giaTri > 0 },
    { khoa: 'choHT', ten: 'Chờ PHT · HT ký', donVi: 'học bạ', kieu: 'so', nguon: 'm1.3.chot_hoc_ba_theo_nam', canhBao: k => k.giaTri > 0 },
    { khoa: 'thieuDiem', ten: 'Thiếu điểm', donVi: 'môn', kieu: 'so', nguon: 'm3.1.chot_tong_ket_theo_lop', canhBao: k => k.giaTri > 0 },
    { khoa: 'dinhChinh', ten: 'Có đính chính sau chốt', donVi: 'yêu cầu', kieu: 'so', nguon: 'm3.1.chot_tong_ket_theo_lop', canhBao: k => k.giaTri > 0 }
  ];
  const linkCua = (khoa, d) => {
    if (khoa === 'thieuDiem') {
      const mon = (MON_THIEU[d.id] || [])[0];
      return mon ? { menu: 'M2.5', ctx: 'ctx=' + d.id + '|' + encodeURIComponent(mon) + '&action=chot', nhan: 'ô điểm ' + d.id + ' · ' + mon } : null;
    }
    if (khoa === 'daChot') return { menu: 'M3.1', ctx: 'tab=chot&lop=' + d.id, nhan: 'chốt tổng kết lớp ' + d.id };
    if (khoa === 'dinhChinh') return { menu: 'M3.1', ctx: 'tab=chot&lop=' + d.id + '&loc=dinhchinh', nhan: 'yêu cầu đính chính của ' + d.id };
    return { menu: 'M1.3', ctx: 'tab=chot_nam&lop=' + d.id + (khoa === 'choHT' ? '&viec=ky' : ''), nhan: 'phiên ký lớp ' + d.id };
  };
  /* mỗi CỘT mang deep-link riêng — `KB` hỏi `cot.link(dong)` trước `kb.link`,
     vì «chỗ sửa» của ô thiếu điểm (M2.5, theo lớp × môn) khác hẳn «chỗ sửa»
     của ô thiếu chữ ký (M1.3, phiên ký của lớp). */
  cot.forEach(c => { c.link = d => linkCua(c.khoa, d) });
  const bang = KB.K9({
    tieuDe: 'Tiến độ chốt và ký học bạ theo lớp', ma: 'LB.01', chip: 'TON',
    moTaKy: PV.moTaChot() + ' · ' + N().ten + ' · ' + N().ky, tenCotDau: 'Lớp',
    nguon: 'm1.3.chot_hoc_ba_theo_nam', cot,
    dong: ds.map(l => ({ id: l.id, ten: l.id, phu: DT[l.dt] + ' · GVCN ' + l.gvcn + ' · sĩ số ' + l.ss })),
    o: (d, c) => c.khoa === 'thieuDiem'
      ? CT.doc('LB.02', PV.thamSo({ dsLop: [d.id] }))
      : CT.doc('LB.01', PV.thamSo({ dsLop: [d.id] }), c.khoa),
    duoiBang: '<div class="ro">Mỗi ô hỏng bấm được về <b>đúng chỗ sửa</b>: thiếu điểm → ô điểm ở <b>M2.5</b> theo <i>lớp × môn</i>; '
      + 'thiếu chữ ký → phiên ký ở <b>M1.3</b>; chưa chốt → <b>M3.1</b>.</div>'
  });
  return daiPV() + daiTo() + PV.chotNgay() + PV.daiCanhBao()
    + (N().hienHanh ? '<div class="pvmc">Học bạ ký theo <b>NĂM</b> ⇒ hai cột chữ ký chưa tới hạn.</div>' : '')
    + bang
    + '<div class="ro">🛑 Cột <b>Chờ GVBM · GVCN ký</b> đếm <b>CHỮ KÝ</b>, không đếm <b>MÔN</b>.</div>'
    + dnote('Môn có nhiều giáo viên cùng dạy thì mỗi <b>phần</b> một chữ ký (<b>TT 22/2021</b>, Phụ lục · Sổ theo dõi mục 3): '
      + 'lớp 10 môn có thể cần 13 chữ ký, và panel nêu đích danh <i>phần</i> còn thiếu. '
      + '🛑 Chuỗi ký <b>không</b> khóa vào «giáo viên chủ trì» — từ đó không có trong TT 22/2021.<br>'
      + 'Tab này là báo cáo <b>về dữ liệu</b>, không phải về học sinh — nên dòng là <b>lớp</b> và không có một cái tên học sinh nào trên bảng. '
      + 'Nó khác <b>M5.9</b> ở kỳ và ở dòng: <code>M5.9</code> hỏi <i>«ai đang chậm tuần này»</i>, tab này hỏi <i>«tới ngày chốt, còn thiếu gì»</i>.<br>'
      + 'Lớp <b>chưa tới kỳ chốt</b> KHÔNG vào mẫu số của <code>LB.01</code>: lớp chưa phải làm thì không phải là lớp chậm.');
}

/* ══════════════════════════ VẼ LẠI ════════════════════════════════════ */
function ve() {
  KB.moi();
  rolebar(); header(); tabs();
  if (!R().tab.length) {
    $('#content').innerHTML = '<div class="noaccbox big">🔒 <b>Vai ' + esc(R().cd) + ' không có Feature nào của M9.2.</b><br>'
      + 'Bảng chuẩn quyền <b>không có dòng nào</b> cho chức danh này ở năm Feature — '
      + '<b>không có dòng nghĩa là không có quyền</b>. Kết quả của lớp mình dạy xem ở <b>M2.5</b>, '
      + 'kỳ thi ở <b>M2.8</b>: ' + dl('M2.5', '', 'Mở M2.5') + ' ' + dl('M2.8', '', 'Mở M2.8') + '</div>';
    $('#topact').innerHTML = '';
    return;
  }
  const t = TAB.find(x => x.ma === ST.tab) || TAB[0];
  $('#h1').textContent = 'Báo cáo Kết quả & cuối năm';
  $('#crumb').innerHTML = '<div class="crumb">📊 Báo cáo &amp; thống kê <span>›</span> <b>Kết quả &amp; cuối năm</b> '
    + '<span>›</span> ' + esc(t.nhan.replace(/^\d+ · /, ''))
    + '<span class="pill">' + t.bc + '</span><span class="pill">loại ' + t.loai + '</span><span class="pill">khuôn ' + t.k + '</span></div>';
  $('#topact').innerHTML = XU.veNut();
  $('#content').innerHTML = PV.daiMau()
    + (ST.tab === 'xep_loai' ? veTab1() : ST.tab === 'ky_thi_dinh_ky' ? veTab2()
      : ST.tab === 'len_lop' ? veTab3() : ST.tab === 'tot_nghiep' ? veTab4() : veTab5());
}

/* ══════════════════════════ NỐI DÂY ═══════════════════════════════════ */
KB.datMenu(MENU_NAY);
KB.noiQuyen(f => coXD(f), f => NGUON[f] || { menu: '?', ten: f });
PV.noiVeLai(ve);
PV.doiTab = t => { if (coTab(t)) ST.tab = t };
XU.noiBoiCanh(() => {
  const t = TAB.find(x => x.ma === ST.tab) || TAB[0];
  const ky = ST.tab === 'ky_thi_dinh_ky' ? PV.moTaChot() + ' · ' + PV.moTaKhoang() : PV.moTaChot();
  const maCT = ST.tab === 'xep_loai' ? 'KQ.01' : ST.tab === 'ky_thi_dinh_ky' ? 'KQ.09'
    : ST.tab === 'len_lop' ? 'KQ.03' : ST.tab === 'tot_nghiep' ? 'KQ.06' : 'LB.01';
  const kb = CT.khaiBao(maCT);
  return {
    truong: 'THCS Nguyễn Tất Thành',
    baoCao: 'Báo cáo Kết quả & cuối năm — ' + t.nhan.replace(/^\d+ · /, '').replace('🛡 ', '') + ' (' + t.bc + ')',
    menu: MENU_NAY, nguoi: R().n, chucDanh: R().cd, ky: ky + ' · ' + N().ten,
    phamVi: tenPhamVi(),
    toanTruong: LOP.reduce((a, l) => a + l.ss, 0),
    tongPhamVi: lopPV().reduce((a, l) => a + l.ss, 0),
    donVi: 'học sinh',
    quyTac: (kb.quyTacDem.tinhVao || []).concat((kb.quyTacDem.khongTinh || []).map(x => 'KHÔNG tính: ' + x)),
    truong_du_lieu: TRUONG_XUAT[ST.tab],
    soDong: soDongChiTiet()
  };
});
/* ── năm danh sách trường của mức 2 — mỗi tab một bộ ────────────────────
   Năm tab lấy năm loại bản ghi khác nhau nên trường cá nhân cũng khác. Một
   danh sách dùng chung thì người xuất tab 5 vẫn phải bỏ chọn một trường
   không có trong bảng họ đang xem.
   ⚠ Tab 5 là báo cáo VỀ DỮ LIỆU: mức 2 của nó là danh sách LỚP, không có họ
   tên học sinh nào — nên nó là bảng duy nhất không mang trường nhạy cảm.   */
const TRUONG_XUAT = {
  xep_loai: [
    { khoa: 'ma', ten: 'Mã học sinh', batBuoc: true },
    { khoa: 'ten', ten: 'Họ và tên', batBuoc: true, nhay: true },
    { khoa: 'lop', ten: 'Lớp' },
    { khoa: 'ht', ten: 'Xếp loại kết quả học tập' },
    { khoa: 'rl', ten: 'Xếp loại kết quả rèn luyện' },
    { khoa: 'gt', ten: 'Giới tính', nhay: true, macDinh: false },
    { khoa: 'dtoc', ten: 'Dân tộc', nhay: true, macDinh: false }
  ],
  ky_thi_dinh_ky: [
    { khoa: 'sbd', ten: 'Số báo danh', batBuoc: true },
    { khoa: 'ten', ten: 'Họ và tên', batBuoc: true, nhay: true },
    { khoa: 'lop', ten: 'Lớp · môn' },
    { khoa: 'diem', ten: 'Điểm bài thi' },
    { khoa: 'dgtx', ten: 'ĐGtx trung bình cùng kỳ' }
  ],
  len_lop: [
    { khoa: 'ma', ten: 'Mã học sinh', batBuoc: true },
    { khoa: 'ten', ten: 'Họ và tên', batBuoc: true, nhay: true },
    { khoa: 'lop', ten: 'Lớp' },
    { khoa: 'kl', ten: 'Kết luận cuối năm' },
    { khoa: 'he', ten: 'Kết quả rèn luyện hè' },
    { khoa: 'lydo', ten: 'Lý do chưa kết luận', nhay: true, macDinh: false }
  ],
  tot_nghiep: [
    { khoa: 'ma', ten: 'Mã học sinh', batBuoc: true },
    { khoa: 'ten', ten: 'Họ và tên', batBuoc: true, nhay: true },
    { khoa: 'ns', ten: 'Ngày sinh · nơi sinh', nhay: true },
    { khoa: 'lop', ten: 'Lớp' },
    { khoa: 'kq', ten: 'Kết quả công nhận' },
    { khoa: 'so', ten: 'Số hiệu bằng · số vào sổ gốc', macDinh: false }
  ],
  hoc_ba: [
    { khoa: 'lop', ten: 'Lớp', batBuoc: true },
    { khoa: 'gvcn', ten: 'Giáo viên chủ nhiệm' },
    { khoa: 'chot', ten: 'Đã chốt · chờ ký' },
    { khoa: 'thieu', ten: 'Chữ ký còn thiếu (môn · phần · giáo viên)' },
    { khoa: 'dc', ten: 'Đính chính sau chốt' }
  ]
};
const soDongChiTiet = () => ST.tab === 'hoc_ba' ? lopPV().length : lopPV().reduce((a, l) => a + l.ss, 0);

KB.gan(); PV.gan(); XU.gan();

document.addEventListener('click', e => {
  const r = e.target.closest('[data-r]');
  if (r) { role = r.getAttribute('data-r'); ST.dt = 'ALL'; moTab(tabMacDinh()); ve(); return }
  const t = e.target.closest('[data-t]');
  if (t) { moTab(t.getAttribute('data-t')); ve(); return }
  const k = e.target.closest('[data-kt]');
  if (k) { ST.kyThi = k.getAttribute('data-kt'); ve(); return }
  if (e.target.closest('#btnNote')) { ST.note = !ST.note; ve(); return }
  const d = e.target.closest('[data-dl]');
  if (d) {
    const m = d.getAttribute('data-dl'), q = d.getAttribute('data-dlq') || '';
    toast('↗ Deep-link sang <b>' + esc(m) + '</b> — <code>?' + esc(q) + '</code><br>'
      + '<i>Demo một tệp: không mở được menu khác, nhưng đường dẫn là đường dẫn thật.</i>');
  }
});
$('#hdt').addEventListener('change', e => { ST.dt = e.target.value; ve() });
$('#hnam').addEventListener('change', e => { ST.nam = e.target.value; ve() });

function toast(h) {
  const t = $('#toast'); t.innerHTML = h; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 4200);
}

/* ── công cụ nghiệm thu: đo MẬT ĐỘ CHỮ GIẢI THÍCH (`nh9` §9.1, ngưỡng ≤ 20%) */
function doMatDoChu() {
  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(n => { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = { tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
window.doMatDoChu = doMatDoChu;

ST.tab = tabMacDinh();
ve();
</script>
