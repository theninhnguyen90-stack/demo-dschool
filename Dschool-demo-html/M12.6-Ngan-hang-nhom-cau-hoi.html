<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M12.6 Ngân hàng nhóm câu hỏi — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.cell{width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;text-align:right;font:inherit;font-size:12.5px}
.cell:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:6px;border-radius:1px;display:block}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}



/* ══════════════ GIAO DIỆN TÁM DẠNG CÂU — đi cùng app.11-dang-cau.js (tệp nền, chép nguyên byte) ══════════════
   Tiền tố .dc- — không đụng lớp của style.css. Dùng biến màu của style.css (--brand · --green · --red · --amber · --line…). */
.dc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:0 0 10px;font-size:13.5px;line-height:1.55}
.dc-dau{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px;font-size:12px;color:var(--ink2)}
.dc-stt{color:var(--ink);font-size:13px}
.dc-sp{flex:1}
.dc-bd{display:inline-flex;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:11px;color:var(--ink2);white-space:nowrap}
.dc-bd-dang{background:var(--brand-soft);border-color:#bfdbfe;color:#1e40af}
.dc-bd-cu{background:var(--amber-soft);border-color:#fde68a;color:#92400e}
.dc-diem{font-weight:700;color:var(--ink);white-space:nowrap}
.dc-hd{font-style:italic;color:var(--ink3)}
.dc-nd{white-space:pre-wrap;margin:2px 0 8px;color:var(--ink)}
.dc-lb{font-size:12px;font-weight:600;color:var(--ink2);margin:9px 0 4px}
.dc-mo{font-size:11.5px;color:var(--ink3);font-weight:400}
.dc-lg{background:#f8fafc;border-left:3px solid var(--green);border-radius:6px;padding:6px 10px;margin-top:8px;font-size:12.5px;color:var(--ink2);white-space:pre-wrap}
.dc-ok{color:var(--green);font-weight:700;font-size:12px;white-space:nowrap}
.dc-ko{color:var(--red);font-weight:700;font-size:12px}
.dc-cho{color:var(--amber);font-weight:700}
/* phương án */
.dc-pa{display:flex;flex-direction:column;gap:4px}
.dc-op{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
label.dc-op{cursor:pointer}
label.dc-op:hover{border-color:var(--line2);background:#f8fafc}
.dc-op input{margin:0}
.dc-op.dc-chon{border-color:var(--brand);background:var(--brand-soft)}
.dc-op.dc-dung{border-color:#a7f3d0;background:var(--green-soft)}
.dc-op.dc-sai{border-color:#fecaca;background:var(--red-soft)}
.dc-chu{flex:0 0 auto;min-width:20px;height:20px;border-radius:50%;background:var(--bg);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2);padding:0 4px}
.dc-em{font-size:11.5px;color:var(--ink2);white-space:nowrap}
/* bảng đúng/sai · ghép nối · bảng chấm */
.dc-ds,.dc-gnb{border-collapse:collapse;width:100%;font-size:13px}
.dc-ds td,.dc-ds th,.dc-gnb td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:middle}
.dc-ds th{font-size:11px;color:var(--ink3);font-weight:600;background:#f8fafc}
.dc-ds tr.dc-dung td{background:#f6fdf9}

/* ══════════ HL-Z ⑦ — LỊCH SỬ SỬA (Z-1 · Z-2): hợp đồng dùng chung cho M12.2 · M12.5 · M12.6 · M12.7 ══════════
   Câu lẻ và nhóm câu đều KHÔNG có phiên bản. Mỗi phần tử suaDoi mang mảng `doi` [{k, cu, moi}] trên các trường nội dung. */
const NOIDUNG_CAU=['nd','pa','da','loiGiai','kxao','md','bs','mach','nguon','tep'];
const TEN_TRUONG_CAU={nd:'Nội dung',pa:'Phương án',da:'Đáp án',loiGiai:'Lời giải',kxao:'Không xáo phương án',md:'Mức độ',bs:'Nút Bộ sách',mach:'Nút Mạch',nguon:'Nguồn',tep:'Tệp đính kèm',
 nguLieu:'Ngữ liệu',nguonLoai:'Loại nguồn ngữ liệu',nguonCt:'Chi tiết nguồn',con:'Câu con',ten:'Tên nhóm'};
const saoChep=x=>x==null?null:JSON.parse(JSON.stringify(x));
/* rỗng · false · [] coi như chưa có — tránh ghi lịch sử «tệp đính kèm — → —» */
const chuanGT=v=>v==null||v===''||v===false||(Array.isArray(v)&&!v.length)?null:v;
const khacGT=(a,b)=>JSON.stringify(chuanGT(a))!==JSON.stringify(chuanGT(b));
const soSanhND=(cu,moi,truong)=>(truong||NOIDUNG_CAU).filter(k=>k in moi&&khacGT(cu[k],moi[k])).map(k=>({k,cu:saoChep(cu[k]),moi:saoChep(moi[k])}));
function giaTriTruong(k,v,dang){
 if(v==null||v==='') return '—';
 if(k==='md') return tenMD(v); if(k==='bs'||k==='mach') return nutById(v)?nutById(v).ten:v; if(k==='nguon') return tenNguon(v); if(k==='kxao') return v?'có':'không';
 if(k==='nguonLoai') return (NGUON_NL[v]||{ten:v}).ten;
 if(k==='con') return Array.isArray(v)?v.length+' câu con':String(v);
 if(k==='tep') return Array.isArray(v)?(v.length?v.map(t=>(t&&t.ten)||t).join(', '):'—'):String(v);
 if(k==='da'){if(dang==='nlc') return 'ABCDEFGH'[v]||'—'; if(dang==='ds') return v.map(x=>x?'Đ':'S').join(' '); if(dang==='sx'||dang==='kt') return v.map(i=>i==null?'—':i+1).join('-');
  return Array.isArray(v)?v.map(x=>[].concat(x).join(' / ')).join(' | '):String(v)}
 if(k==='pa'){if(Array.isArray(v)) return v.map(p=>Array.isArray(p)?p.join(' → '):p).join(' · '); if(v.o) return v.o.join(' / ')+': '+v.the.join(', ')}
 return String(v);
}
function moTaDoi(d,dang){
 const T=(TEN_TRUONG_CAU[d.k]||d.k).toLowerCase();
 if(d.k==='pa'&&Array.isArray(d.cu)&&Array.isArray(d.moi)&&d.cu.length===d.moi.length&&['nlc','ds','sx'].includes(dang)){
  const nh=i=>dang==='nlc'?'phương án '+'ABCDEFGH'[i]:dang==='ds'?'ý '+'abcd'[i]+')':'mục '+(i+1);
  return d.cu.map((x,i)=>x!==d.moi[i]?nh(i)+' «'+ngan(x,40)+'» → «'+ngan(d.moi[i],40)+'»':null).filter(Boolean).join('; ');
 }
 if(chuanGT(d.cu)==null) return 'thêm '+T+' «'+ngan(giaTriTruong(d.k,d.moi,dang),48)+'»';
 if(chuanGT(d.moi)==null) return 'bỏ '+T+' «'+ngan(giaTriTruong(d.k,d.cu,dang),48)+'»';
 if(d.k==='nd'||d.k==='loiGiai'||d.k==='nguLieu') return T+' «'+ngan(d.cu,48)+'» → «'+ngan(d.moi,48)+'»';
 return T+' «'+ngan(giaTriTruong(d.k,d.cu,dang),40)+'» → «'+ngan(giaTriTruong(d.k,d.moi,dang),40)+'»';
}
const tomTatDoi=(e,dang)=>e.doi.map(d=>moTaDoi(d,dang)).join(' · ');
/* nội dung NGAY TRƯỚC lần sửa thứ i — đi ngược từ bản hiện hành */
function truocLanSua(x,i){const b=Object.assign({},x); for(let j=(x.suaDoi||[]).length-1;j>=i;j--) x.suaDoi[j].doi.forEach(d=>{b[d.k]=saoChep(d.cu)}); return b}

   b.pa=p.map(i=>c.pa[i]); b.da=c.da==null?null:p.indexOf(c.da); b.hv=p}
  else if(c.dang==='kt'&&c.pa){const n=c.pa.the.length,p=xd?xao(day(n),hatCon(h,'the|'+c.id)):day(n);
   b.pa={o:c.pa.o.slice(),the:p.map(i=>c.pa.the[i])}; b.da=c.da?p.map(i=>c.da[i]):null; b.hv=p}
  else if(c.dang==='gn'&&c.pa){const n=c.pa.length,L=xd?xao(day(n),hatCon(h,'trai|'+c.id)):day(n);
   let R=xao(day(n),hatCon(h,'phai|'+c.id)), da=L.map(i=>R.indexOf(i));
   if(n>1&&da.every((x,i)=>x===i)){R=R.slice(1).concat(R[0]);da=L.map(i=>R.indexOf(i))}   /* không để cặp đúng thẳng hàng */
   b.pa=L.map(i=>c.pa[i][0]); b.phai=R.map(j=>c.pa[j][1]); b.da=da; b.hv=L; b.hvPhai=R}
  return b;
 }

 /* ── chấm một câu trên BẢN HIỂN THỊ ── */
 function chamBan(b,tl,diem,tc){
  tc=tc||{}; const toiDa=diem==null?1:+diem;
  const toanCau=tc.toanCau!=null?tc.toanCau:toanCauCua(b.dang);   /* N-5 — mặc định đọc DANG[].toanCau của app.10 */
  const R={toiDa,tuCham:true,diem:0,dung:false,soDung:0,soY:1,chiTiet:null,boTrong:false,choCham:false};
  const theoPhan=(ct)=>{R.chiTiet=ct;R.soY=ct.length;R.soDung=ct.filter(Boolean).length;R.dung=R.soDung===R.soY;
   R.diem=toanCau?(R.dung?toiDa:0):r2(toiDa*R.soDung/R.soY)};
  switch(b.dang){
   case 'nlc': R.boTrong=tl==null; R.dung=tl!=null&&+tl===b.da; R.soDung=R.dung?1:0; R.diem=R.dung?toiDa:0; break;
   case 'ds': {const a=tl||[]; R.boTrong=b.da.every((_,i)=>a[i]==null);
    R.chiTiet=b.da.map((d,i)=>a[i]!=null&&+a[i]===+d); R.soY=4; R.soDung=R.chiTiet.filter(Boolean).length; R.dung=R.soDung===4;
    const bang=tc.bangDS||BANG_DS; R.diem=r2(toiDa*(bang[R.soDung]||0)); break}
   case 'tln': R.boTrong=trong(tl); R.dung=khop(tl,b.da||[]); R.soDung=R.dung?1:0; R.diem=R.dung?toiDa:0; break;
   case 'dk': {const a=tl||[]; R.boTrong=(b.da||[]).every((_,i)=>trong(a[i])); theoPhan((b.da||[]).map((d,i)=>khop(a[i],d))); break}
   case 'kt': {const a=tl||[]; R.boTrong=(b.da||[]).every((_,i)=>a[i]==null); theoPhan((b.da||[]).map((d,i)=>a[i]!=null&&+a[i]===d)); break}
   case 'gn': {const a=tl||[]; R.boTrong=(b.da||[]).every((_,i)=>a[i]==null); theoPhan((b.da||[]).map((d,i)=>a[i]!=null&&+a[i]===d)); break}
   case 'sx': R.boTrong=!tl; R.dung=!!tl&&tl.length===b.da.length&&tl.every((x,i)=>+x===b.da[i]); R.soDung=R.dung?1:0; R.diem=R.dung?toiDa:0; break;
   default: /* tl — và dạng mới trường tự thêm: không tự chấm tới khi có quy tắc chấm (§4.3) */
    R.tuCham=false; R.diem=null; R.dung=null; R.choCham=true;
    R.boTrong=!tl||(trong(tl.chu)&&!(tl.anh||[]).length);
  }
  return R;
 }
 const cham=(c,tl,diem,tc)=>chamBan(hienThi(c,tc),tl,diem,tc);

 /* ── trả lời mẫu (display space) — M12.7 sinh bài làm mô phỏng; bảng thử chấm dùng ── */
 function traLoiDung(c,tc){

 }
 function traLoiGia(c,tc,hat,p){
  const b=hienThi(c,tc), r=prng(hat>>>0), dung=()=>r()<p;
  const saiSo=x=>{const s=String([].concat(x)[0]);return /^[-−]?\d+([.,]\d+)?$/.test(s.trim())?String(+s.replace(',','.').replace('−','-')+1+Math.floor(r()*4)).replace('.',','):'(không nhớ)'};
  switch(b.dang){
   case 'nlc': {if(dung()) return b.da; const k=day(b.pa.length).filter(i=>i!==b.da); return k[Math.floor(r()*k.length)]}

   case 'tln': return dung()?b.da[0]:saiSo(b.da[0]);

   case 'kt': return b.da.map(d=>dung()?d:(d+1)%b.pa.o.length);
   case 'gn': {const a=b.da.slice(); for(let i=0;i<a.length-1;i++) if(!dung()){const t=a[i];a[i]=a[i+1];a[i+1]=t;i++} return a}
   case 'sx': {if(dung()) return b.da.slice(); const a=b.da.slice(); const i=Math.floor(r()*(a.length-1)); const t=a[i];a[i]=a[i+1];a[i+1]=t; return a}
   default: return {chu:'Bài làm của học sinh (mô phỏng).',anh:r()<0.4?['anh-bai-lam-1.jpg']:[]};
  }
 }

 /* ── kiểm một câu — lỗi chặn lưu · cảnh báo mềm ── */
 function kiemCau(c){
  const L=[],W=[]; if(!c||!c.dang) return {loi:['Chưa chọn dạng câu'],canhBao:[]};
  const trung=(ds,ten)=>{const m={};ds.forEach((x,i)=>{const k=chuanHoa(x);if(!k) return;if(m[k]!=null) L.push(ten(i)+' trùng '+ten(m[k]));else m[k]=i})};
  if(c.dang==='dk'){if(!demO(c.nd)) L.push('Nội dung chưa có ô trống '+O+' — bấm «Chèn ô trống»');
   if(trong(String(c.nd||'').replace(/\[___\]/g,''))) L.push('Nội dung câu hỏi đang trống')}
  else if(trong(c.nd)) L.push('Nội dung câu hỏi đang trống');
  const pa=c.pa||[];
  switch(c.dang){
   case 'nlc': if(pa.length<2) L.push('Cần ít nhất 2 phương án');
    pa.forEach((p,i)=>{if(trong(p)) L.push('Phương án '+CHU[i]+' đang trống')}); trung(pa,i=>'Phương án '+CHU[i]);
    if(!(Number.isInteger(c.da)&&c.da>=0&&c.da<pa.length)) L.push('Chưa chọn phương án đúng');
    if(pa.length&&pa.length!==4) W.push('CV 7991 dùng 4 phương án — câu này có '+pa.length); break;
   case 'ds': if(pa.length!==4) L.push('Câu đúng / sai phải có đúng 4 ý (CV 7991) — đang có '+pa.length);
    pa.forEach((p,i)=>{if(trong(p)) L.push('Ý '+chuY(i)+') đang trống')});
    pa.forEach((_,i)=>{const d=(c.da||[])[i];if(d!==0&&d!==1) L.push('Ý '+chuY(i)+') chưa chọn Đúng / Sai')}); break;
   case 'tln': {const d=c.da||[]; if(!d.length) L.push('Cần ít nhất một đáp án chấp nhận');
    d.forEach((x,i)=>{if(trong(x)) L.push('Đáp án chấp nhận thứ '+(i+1)+' đang trống')});
    const m={}; d.forEach((x,i)=>{const k=chuanHoa(x); if(!k) return; if(m[k]!=null) W.push('«'+x+'» và «'+d[m[k]]+'» giống nhau sau chuẩn hóa — chỉ cần một'); else m[k]=i}); break}
   case 'dk': {const n=demO(c.nd),d=c.da||[]; if(n&&d.length!==n) L.push('Có '+n+' ô trống nhưng '+d.length+' đáp án');
    d.forEach((x,i)=>{if(!x||(Array.isArray(x)?!x.filter(y=>!trong(y)).length:trong(x))) L.push('Ô trống '+(i+1)+' chưa có đáp án')}); break}
   case 'kt': {const o=(c.pa&&c.pa.o)||[],t=(c.pa&&c.pa.the)||[],d=c.da||[];
    if(o.length<2) L.push('Cần ít nhất 2 nhóm'); o.forEach((x,i)=>{if(trong(x)) L.push('Tên nhóm '+(i+1)+' đang trống')});
    if(t.length<2) L.push('Cần ít nhất 2 thẻ'); t.forEach((x,i)=>{if(trong(x)) L.push('Thẻ '+(i+1)+' đang trống')});
    trung(t,i=>'Thẻ «'+t[i]+'»');
    t.forEach((x,i)=>{if(!(Number.isInteger(d[i])&&d[i]>=0&&d[i]<o.length)) L.push('Thẻ «'+(x||i+1)+'» chưa chọn nhóm đúng')});
    o.forEach((x,j)=>{if(!d.includes(j)) W.push('Nhóm «'+(x||j+1)+'» chưa có thẻ nào')}); break}
   case 'gn': if(pa.length<2) L.push('Cần ít nhất 2 cặp');
    pa.forEach((p,i)=>{if(trong(p[0])||trong(p[1])) L.push('Cặp '+(i+1)+' còn thiếu vế')});
    trung(pa.map(p=>p[0]),i=>'Vế trái «'+pa[i][0]+'»'); trung(pa.map(p=>p[1]),i=>'Vế phải «'+pa[i][1]+'»'); break;
   case 'sx': {const d=c.da||[]; if(pa.length<2) L.push('Cần ít nhất 2 mục');
    pa.forEach((p,i)=>{if(trong(p)) L.push('Mục '+(i+1)+' đang trống')}); trung(pa,i=>'Mục «'+pa[i]+'»');
    if(d.length!==pa.length||d.slice().sort((a,b)=>a-b).some((x,i)=>x!==i)) L.push('Thứ tự đúng chưa hợp lệ');
    else if(pa.length>1&&d.every((x,i)=>x===i)) L.push('Thứ tự hiển thị trùng thứ tự đúng — lộ đáp án (bấm «Trộn lại»)'); break}
   case 'tl': if(trong(c.loiGiai)) W.push('Nên có hướng dẫn chấm — người chấm và người duyệt dựa vào đó'); break;
   default: W.push('Dạng «'+tenDangDC(c.dang)+'» chưa có quy tắc chấm — máy không tự chấm');
  }
  return {loi:L,canhBao:W};
 }

 /* ── trải đề thành danh sách câu — xáo câu theo hạt: nhóm là một khối, câu con xáo trong nhóm ── */
 function xepDe(de,tc){
  tc=tc||{}; const h=tc.hat||0, tt=tc.khoa||de.id;
  const tra=id=>typeof cauById==='function'?cauById(id):null, traN=id=>typeof nhomById==='function'?nhomById(id):null;
  let dv=(de.ds||[]).map((x,i)=>{
   if(x.n){const nh=traN(x.n);return {loai:'nhom',nhom:nh,them:x.them,khoi:x.ph!=null?'ph'+x.ph:'nhom',
    con:nh.con.map((c,j)=>({cau:c,diem:(x.d||[])[j]}))}}
   const c=tra(x.c); return {loai:'cau',cau:c,diem:x.d,them:x.them,khoi:x.ph!=null?'ph'+x.ph:(c?c.dang:'?')};
  });
  if(tc.xaoCau){
   const doan=[]; dv.forEach(u=>{const cu=doan[doan.length-1]; if(tc.giuPhan!==false&&cu&&cu[0].khoi===u.khoi) cu.push(u); else if(tc.giuPhan===false&&cu) cu.push(u); else doan.push([u])});
   dv=[].concat(...doan.map((d,i)=>xao(d,hatCon(h,'cau|'+de.id+'|'+i))));
   dv.forEach(u=>{if(u.loai==='nhom') u.con=xao(u.con,hatCon(h,'nhom|'+u.nhom.id))});
  }
  const ra=[]; let stt=0;
  dv.forEach(u=>{
   if(u.loai==='cau') ra.push({stt:++stt,loai:'cau',cau:u.cau,diem:u.diem,them:u.them,nhom:null,dauNhom:false,khoa:tt+'.'+u.cau.id});
   else u.con.forEach((x,j)=>ra.push({stt:++stt,loai:'con',cau:x.cau,diem:x.diem,them:u.them,nhom:u.nhom,dauNhom:j===0,khoa:tt+'.'+x.cau.id}));
  });
  return ra;
 }
 function tongKet(ds,tc){
  tc=tc||{}; let diem=0,toiDa=0,soDung=0,cho=0;
  ds.forEach(x=>{toiDa+=x.toiDa||0; const v=x.cuoi!==undefined?x.cuoi:x.diem; if(v==null) cho++; else diem+=v; if(x.dung===true) soDung++});
  const tong=tc.tong!=null?tc.tong:toiDa;
  const r={diem:r2(diem),toiDa:r2(toiDa),thang10:quyThang10(diem,tong),soDung,soCau:ds.length,choCham:cho};
  r.chu=tc.tieuHoc?'Đúng '+soDung+'/'+ds.length+' câu'+(cho?' · '+cho+' câu chờ chấm':'')
   :so(r.thang10)+' điểm (thang 10)'+(cho?' · '+cho+' câu tự luận chờ chấm':'');
  return r;
 }
 function chamDe(de,tlm,tc){
  tc=tc||{}; tlm=tlm||{};
  const kq=xepDe(de,tc).map(x=>{
   let c=x.cau; const dm=tc.daMoi&&tc.daMoi[c.id]; if(dm) c=Object.assign({},c,{da:dm});
   const r=chamBan(hienThi(c,tc),tlm[c.id],x.diem,tc), tay=tc.diemTay&&tc.diemTay[c.id];
   r.cuoi=tay!=null?+tay:r.diem; if(tay!=null){r.tay=true; if(!r.tuCham) r.dung=+tay>=r.toiDa}
   r.choCham=r.cuoi==null;                      /* ⑧ (M12.7 N#3): choCham đi theo ĐIỂM CUỐI — câu tự luận đã có điểm tay không còn chờ chấm */
   return Object.assign({id:c.id,stt:x.stt,them:x.them,dinhChinh:!!dm},r);
  });
  return {cau:kq,tong:tongKet(kq,{tieuHoc:tc.tieuHoc,tong:de.tong})};
 }

   case 'gn': h+='<div class="dc-lb">Các cặp ghép <span class="dc-mo">— nhập đúng cặp trên cùng dòng; khi làm bài cột phải luôn được xáo</span></div>'+n.pa.map((p,i)=>'<div class="dc-row"><input class="dc-in" data-dc-f="gnT.'+i+'" value="'+E(p[0])+'" placeholder="Vế trái"><span class="dc-mui">⟶</span><input class="dc-in" data-dc-f="gnP.'+i+'" value="'+E(p[1])+'" placeholder="Vế phải">'+(n.pa.length>2?x(i,'gn'):'')+'</div>').join('')+them('gn','Thêm cặp'); break;
   case 'sx': h+='<div class="dc-lb">Các mục theo THỨ TỰ ĐÚNG</div><ol class="dc-sxl">'+n.muc.map((p,i)=>'<li class="dc-sxm" draggable="true" data-dc-keo="'+i+'" data-dc-tha="'+i+'"><input class="dc-in" data-dc-f="sx.'+i+'" value="'+E(p)+'"><button class="dc-mb" data-dc-a="len" data-dc-i="'+i+'"'+(i?'':' disabled')+'>↑</button><button class="dc-mb" data-dc-a="xuong" data-dc-i="'+i+'"'+(i<n.muc.length-1?'':' disabled')+'>↓</button>'+(n.muc.length>2?x(i,'sx'):'')+'</li>').join('')+'</ol>'+them('sx','Thêm mục')
    +'<div class="dc-cn"><span class="dc-lb">Học sinh thấy theo thứ tự:</span> '+n.hv.map(j=>'<span class="dc-chip">'+E(n.muc[j]||'…')+'</span>').join(' ')+' <button class="dc-add" data-dc-a="tron">↻ Trộn lại</button></div><div class="dc-mo">Thứ tự hiển thị trộn một lần lúc soạn và giữ nguyên — bài sắp xếp không bao giờ xáo khi giao.</div>'; break;

  }
  if(['nlc','kt','gn'].includes(n.dang)) h+='<label class="dc-ck"><input type="checkbox" data-dc-f="kxao"'+(n.kxao?' checked':'')+'> Không xáo phương án khi giao bài <span class="dc-mo">(phương án có thứ tự tăng dần, «cả A và B đều đúng»…)</span></label>';
  h+='<div class="dc-lb">'+(n.dang==='tl'?'Hướng dẫn chấm':'Lời giải')+' <span class="dc-mo">(tùy chọn'+(n.dang==='tl'?' — nên có':'')+')</span></div><textarea class="dc-ta" rows="2" data-dc-f="loiGiai">'+E(n.loiGiai)+'</textarea>';
  h+='<div class="dc-ft"><button class="dc-add" data-dc-a="xemTruoc">'+(st.xt?'▲ Ẩn xem trước':'👁 Xem trước như học sinh')+'</button><span class="dc-sp"></span><span class="dc-mo">Chấm: '+E(chuCham(n.dang))+'</span></div>';
  if(st.xt){const c=cauTu(n); h+='<div class="dc-xt">'+(kiemCau(c).loi.length?'<div class="dc-mo">Câu chưa đủ trường — xem trước có thể thiếu.</div>':'')+veLamMoi(c,k+'~xt')+'</div>'}
  return h;
 }
 function veSoan(k,c,tc){
  let st=ST[k]; if(!st||st.cheDo!=='soan'||tc.moi) st=ST[k]={cheDo:'soan',nh:nhapTu(c||{}),tc,loi:null,xt:false};
  else st.tc=tc;

 }
 function veLamMoi(c,k){ST[k]={cheDo:'lam',b:anDapAn(hienThi(c,{})),tc:{},traLoi:null,chonThe:null};return veLam(k)}
 const anDapAn=b=>{const x=Object.assign({},b);delete x.da;delete x.loiGiai;delete x.hv;delete x.hvPhai;return x};
 function chuyenDang(n,d){const m=nhapTu({dang:d,nd:n.dang==='dk'?n.nd.replace(/\[___\]/g,'…'):n.nd,loiGiai:n.loiGiai}); m.id=n.id; return m}

 /* ── lối vào chính ── */
 function ve(c,cheDo,tc){
  tc=Object.assign({},tc||{}); const k=tc.khoa||((c&&c.id)||'moi')+'-'+cheDo;
  if(cheDo==='soan') return veSoan(k,c,tc);

   if(!st||st.cheDo!=='lam'||tc.moi) ST[k]={cheDo:'lam',b:anDapAn(hienThi(c,tc)),tc,traLoi:tc.traLoi!==undefined?sao(tc.traLoi):null,chonThe:null};
   else {const tl=st.traLoi; st.tc=tc; st.traLoi=tl}
   return veLam(k);
  }
  if(cheDo==='cham'){
   const cu=ST[k]&&ST[k].cheDo==='cham'&&!tc.moi?ST[k]:null;
   ST[k]={cheDo:'cham',b:hienThi(c,tc),tc,traLoi:sao(tc.traLoi),diemTay:cu?cu.diemTay:(tc.diemTay!=null?+tc.diemTay:null),deMay:cu?cu.deMay:!!tc.deMay};
   return veCham(k);
  }
  return veXem(c,tc,k);
 }

 function veNguLieu(nh){return '<div class="dc-nl"><div class="dc-nlt">📄 '+E(nh.ten||'Ngữ liệu')+'</div><div class="dc-nlv">'+E(nh.nguLieu||'')+'</div>'

 /* ── dựng lại một khối · phát sự kiện ──
    Ô chữ KHÔNG dựng lại lúc «change» (rời ô): rời ô bằng cách bấm một nút thì khối bị thay giữa mousedown và mouseup — mất cú bấm.
    Chỗ cần dựng lại khi gõ (số ô trống của điền khuyết, tên nhóm kéo thả, mục sắp xếp) thì dựng ngay lúc gõ và trả lại con trỏ. */
 const timKhoi=k=>[...document.querySelectorAll('[data-dc-k]')].find(x=>x.dataset.dcK===k);
 function veLai(k){
  const st=ST[k]; if(!st) return; const el=timKhoi(k); if(!el) return;
  const ae=document.activeElement; let sel=null,s0=0,s1=0;
  if(ae&&el.contains(ae)&&ae.dataset&&(ae.dataset.dcF||ae.dataset.dcL||ae.dataset.dcC)){
   const ds=ae.dataset; sel=ds.dcF?'[data-dc-f="'+ds.dcF+'"]':ds.dcC?'[data-dc-c="'+ds.dcC+'"]':'[data-dc-l="'+ds.dcL+'"]'+(ds.dcI!=null?'[data-dc-i="'+ds.dcI+'"]':'');
   try{s0=ae.selectionStart;s1=ae.selectionEnd}catch(_){}}
  el.outerHTML=st.cheDo==='lam'?veLam(k):st.cheDo==='cham'?veCham(k):vo(k,'soan',st.nh.dang,thanSoan(k,st));
  if(sel){const n=timKhoi(k), x=n&&n.querySelector(sel); if(x){x.focus(); try{if(s0!=null) x.setSelectionRange(s0,s1)}catch(_){}}}
 }
 function phat(k){const st=ST[k]; if(!st) return;
  document.dispatchEvent(new CustomEvent('dc:doi',{detail:{khoa:k,cheDo:st.cheDo,traLoi:st.cheDo==='lam'?sao(st.traLoi):undefined,
   cham:st.cheDo==='cham'?layCham(k):undefined,nhap:st.cheDo==='soan'?st.nh:undefined}}))}
 const khoaCua=el=>{const w=el.closest&&el.closest('[data-dc-k]');return w?w.dataset.dcK:null};

 /* LÀM — nhập liệu */
 function lamNhap(k,st,t,laChange){
  const l=t.dataset.dcL, i=+t.dataset.dcI, b=st.b, chon=t.type==='radio'||t.tagName==='SELECT'||t.type==='file';
  if(chon&&!laChange) return;
  if(!chon&&laChange) return;
  if(l==='nlc') st.traLoi=+t.value;
  else if(l==='ds'){const a=st.traLoi||[null,null,null,null]; a[i]=+t.value; st.traLoi=a}
  else if(l==='tln') st.traLoi=t.value;
  else if(l==='dk'){const a=st.traLoi||Array(demO(b.nd)).fill(''); a[i]=t.value; st.traLoi=a}
  else if(l==='gn'){const a=st.traLoi||b.pa.map(()=>null); a[i]=t.value===''?null:+t.value; st.traLoi=a}
  else if(l==='tl'){const v=st.traLoi||{chu:'',anh:[]}; v.chu=t.value; st.traLoi=v}
  else if(l==='anh'){const v=st.traLoi||{chu:'',anh:[]}; [...(t.files||[])].forEach(f=>v.anh.push(f.name)); st.traLoi=v; veLai(k)}
  if(chon&&l!=='anh') veLai(k);
  phat(k);
 }
 /* SOẠN — nhập liệu */
 function soanNhap(k,st,t,laChange){
  const [f,is]=t.dataset.dcF.split('.'), i=+is, n=st.nh, chon=t.type==='radio'||t.type==='checkbox'||t.tagName==='SELECT';
  if(chon!==laChange) return;                        /* ô chữ: xử lý lúc gõ · lựa chọn: xử lý lúc change */
  let dung=chon;
  if(f==='nd'){n.nd=t.value; if(n.dang==='dk'&&demO(n.nd)!==n.da.length){dongBoO(n); dung=true}}
  else if(f==='loiGiai') n.loiGiai=t.value;
  else if(f==='kxao') n.kxao=t.checked;
  else if(f==='da') n.da=+t.value;
  else if(f==='pa') n.pa[i]=t.value;
  else if(f==='ds') n.da[i]=+t.value;
  else if(f==='tln'||f==='dk') n.da[i]=t.value;
  else if(f==='o'){n.pa.o[i]=t.value; dung=true}
  else if(f==='the') n.pa.the[i]=t.value;
  else if(f==='theo') n.da[i]=t.value===''?null:+t.value;
  else if(f==='gnT') n.pa[i][0]=t.value;
  else if(f==='gnP') n.pa[i][1]=t.value;
  else if(f==='sx'){n.muc[i]=t.value; dung=true}
  if(dung) veLai(k);
  phat(k);
 }
 /* CHẤM — điểm tay */
 function chamNhap(k,st,t,laChange){
  const d=st.tc.diem!=null?+st.tc.diem:1;
  if(t.dataset.dcC==='dat'){if(!laChange) return; st.diemTay=t.value===''?null:t.value==='1'?d:0; st.deMay=st.kq&&st.kq.tuCham?true:st.deMay; veLai(k); phat(k); return}
  if(laChange) return;
  const v=String(t.value).trim().replace(',','.');
  if(v===''){st.diemTay=null} else if(!isNaN(+v)){st.diemTay=Math.max(0,Math.min(d,+v))} else return;
  const el=timKhoi(k), o=el&&el.querySelector('.dc-cuoi'), c=layCham(k);   /* sửa tại chỗ — không dựng lại khối đang gõ */
  if(o) o.innerHTML=c.cuoi==null?'<span class="dc-cho">chờ chấm</span>':so(c.cuoi);
  phat(k);
 }
 function hanhDong(k,st,a){
  const v=a.dataset.dcV, i=+a.dataset.dcI;
  if(st.cheDo==='lam'){
   if(st.tc.chiDoc) return;
   const b=st.b;
   if(a.dataset.dcA==='the'){st.chonThe=st.chonThe===i?null:i; veLai(k); return}
   if(a.dataset.dcA==='vung'){if(st.chonThe==null) return; const t=st.traLoi||b.pa.the.map(()=>null); t[st.chonThe]=+v<0?null:+v; st.traLoi=t; st.chonThe=null; veLai(k); phat(k); return}
   if(a.dataset.dcA==='len'||a.dataset.dcA==='xuong'){const t=st.traLoi||day(b.pa.length), j=a.dataset.dcA==='len'?i-1:i+1; if(j<0||j>=t.length) return;
    const x=t[i];t[i]=t[j];t[j]=x; st.traLoi=t; veLai(k); phat(k); return}
   if(a.dataset.dcA==='anhDemo'){const t=st.traLoi||{chu:'',anh:[]}; t.anh.push('anh-bai-lam-'+(t.anh.length+1)+'.jpg'); st.traLoi=t; veLai(k); phat(k); return}
   if(a.dataset.dcA==='boAnh'){const t=st.traLoi; if(t){t.anh.splice(i,1); veLai(k); phat(k)} return}
   return;
  }
  if(st.cheDo==='cham'){
   if(a.dataset.dcA==='deMay'){st.deMay=!st.deMay; if(!st.deMay) st.diemTay=null; veLai(k); phat(k)}
   return;
  }
  /* soan */
  const n=st.nh;
  switch(a.dataset.dcA){
   case 'dang': if(n.dang!==v){st.nh=chuyenDang(n,v); st.loi=null} break;
   case 'them':
    if(v==='pa'&&n.pa.length<6) n.pa.push(''); else if(v==='tln') n.da.push(''); else if(v==='o') n.pa.o.push('');
    else if(v==='the'){n.pa.the.push(''); n.da.push(null)} else if(v==='gn') n.pa.push(['','']); else if(v==='sx'){n.muc.push(''); tronSx(n)} break;
   case 'bot':
    if(v==='pa'){n.pa.splice(i,1); if(n.da===i) n.da=null; else if(n.da>i) n.da--}
    else if(v==='tln') n.da.splice(i,1);
    else if(v==='o'){n.pa.o.splice(i,1); n.da=n.da.map(x=>x==null?null:x===i?null:x>i?x-1:x)}
    else if(v==='the'){n.pa.the.splice(i,1); n.da.splice(i,1)}
    else if(v==='gn') n.pa.splice(i,1);
    else if(v==='sx'){n.muc.splice(i,1); tronSx(n)} break;
   case 'len': case 'xuong': {const j=a.dataset.dcA==='len'?i-1:i+1; if(j<0||j>=n.muc.length) return; const x=n.muc[i];n.muc[i]=n.muc[j];n.muc[j]=x;
    if(n.hv.every((y,p)=>y===p)) tronSx(n); break}
   case 'tron': tronSx(n); break;
   case 'chenO': {const ta=[...document.querySelectorAll('[data-dc-k]')].find(x=>x.dataset.dcK===k); const el=ta&&ta.querySelector('[data-dc-f="nd"]');
    const p=el?el.selectionStart:n.nd.length; n.nd=n.nd.slice(0,p)+O+n.nd.slice(p); dongBoO(n); break}
   case 'xemTruoc': st.xt=!st.xt; break;
   default: return;
  }
  veLai(k); phat(k);
 }

 /* ── nghe sự kiện — ủy quyền trên document, chỉ phần tử data-dc-* ── */
 document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('[data-dc-a]'); if(!a||a.disabled) return;
  const k=khoaCua(a), st=k&&ST[k]; if(!st) return;
  if(a.tagName==='BUTTON') e.preventDefault();
  hanhDong(k,st,a);
 });
 const nhan=laChange=>e=>{
  const t=e.target; if(!t.dataset) return; const k=khoaCua(t), st=k&&ST[k]; if(!st) return;
  if(t.dataset.dcL&&st.cheDo==='lam') lamNhap(k,st,t,laChange);
  else if(t.dataset.dcF&&st.cheDo==='soan') soanNhap(k,st,t,laChange);
  else if(t.dataset.dcC&&st.cheDo==='cham') chamNhap(k,st,t,laChange);
 };
 document.addEventListener('input',nhan(false));
 document.addEventListener('change',nhan(true));
 /* kéo thả — thẻ (kt) vào nhóm · đổi chỗ mục (sx, cả lúc làm và lúc soạn); bấm-rồi-bấm thay được cho mọi thao tác kéo */
 let keo=null;
 document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-dc-keo]'); if(!t) return; const k=khoaCua(t); if(!k||!ST[k]) return;
  keo={k,i:+t.dataset.dcKeo}; try{e.dataTransfer.setData('text/plain',String(keo.i));e.dataTransfer.effectAllowed='move'}catch(_){} });
 document.addEventListener('dragover',e=>{const t=e.target.closest&&e.target.closest('[data-dc-tha]'); if(t&&keo&&khoaCua(t)===keo.k) e.preventDefault()});
 document.addEventListener('drop',e=>{const t=e.target.closest&&e.target.closest('[data-dc-tha]'); if(!t||!keo) return; const k=khoaCua(t); if(k!==keo.k){keo=null;return}
  e.preventDefault(); const st=ST[k], j=+t.dataset.dcTha, i=keo.i; keo=null;
  if(st.cheDo==='lam'&&st.b.dang==='kt'){if(st.tc.chiDoc) return; const a=st.traLoi||st.b.pa.the.map(()=>null); a[i]=j<0?null:j; st.traLoi=a; st.chonThe=null}
  else if(st.cheDo==='lam'&&st.b.dang==='sx'){if(st.tc.chiDoc) return; const a=st.traLoi||day(st.b.pa.length); const [x]=a.splice(i,1); a.splice(j,0,x); st.traLoi=a}
  else if(st.cheDo==='soan'&&st.nh.dang==='sx'){const m=st.nh.muc; const [x]=m.splice(i,1); m.splice(j,0,x); if(st.nh.hv.every((y,p)=>y===p)) tronSx(st.nh)}
  else return;
  veLai(k); phat(k);
 });

 /* ── đọc kết quả ── */
 function traLoi(k){const st=ST[k];return st&&st.cheDo==='lam'?sao(st.traLoi):undefined}
 function laySoan(k){
  const st=ST[k]; if(!st||st.cheDo!=='soan') return {ok:false,cau:null,loi:['Không có form soạn với khóa «'+k+'»'],canhBao:[]};
  const c=cauTu(st.nh), kq=kiemCau(c); st.loi=kq; veLai(k);
  return {ok:!kq.loi.length,cau:c,loi:kq.loi,canhBao:kq.canhBao};
 }
 function layCham(k){
  const st=ST[k]; if(!st||st.cheDo!=='cham') return null;
  const d=st.tc.diem!=null?+st.tc.diem:1, kq=st.kq||chamBan(st.b,st.traLoi,d,st.tc);
  const theoMay=kq.tuCham&&!st.deMay, cuoi=theoMay?kq.diem:st.diemTay;
  return {diemMay:kq.diem,diemTay:st.diemTay,deMay:!!st.deMay,cuoi,toiDa:d,
   dung:theoMay?kq.dung:(st.diemTay==null?null:st.diemTay>=d),choCham:cuoi==null};
 }
 function xoa(k){if(k&&k.endsWith('*')){const p=k.slice(0,-1);Object.keys(ST).forEach(x=>{if(x.startsWith(p)) delete ST[x]})} else delete ST[k]}

 return {ve,veNhom,veNguLieu,traLoi,laySoan,layCham,xoa,
  cham,chamDe,xepDe,tongKet,hienThi,traLoiDung,traLoiGia,kiemCau,coDapAn:c=>!kiemCau(c).loi.length,
  xao,hatCon,chuanHoa,quyThang10,so,BANG_DS,BANG_DS_GHI,DANG_TT,dsDang,coBoMay,chuCham,toanCauCua,_st:ST};
})();


/* ══════════════ M12.6 NGÂN HÀNG NHÓM CÂU HỎI — QUYỀN · DỮ LIỆU RIÊNG · QUY TẮC ══════════════
   Chủ (D1) của NHÓM CÂU và CÂU CON (kiến trúc quy tắc 1). Câu con không đứng riêng: không có bản ghi ở M12.5, không vào đề lẻ.

   ✏ trên dòng đi thẳng vào màn soạn — không qua panel. Đề dùng nhóm: chỉ ĐẾM + liên kết lọc sang M12.2. */
const timChuoi=n=>[n.id,n.ten,n.nguLieu,chuoiNguon(n),tenNS(n.tg)].concat(n.con.map(c=>c.nd+' '+JSON.stringify(c.pa||''))).join(' ');
const CHIP1=[['all','Tất cả'],['toi','Của tôi'],['cs','Được chia sẻ với tôi'],['cho','Chờ duyệt'],['tralai','Bị trả lại'],['bl','⚑ Bị báo cáo']];
function chipOK(n,c){
 switch(c||ST.chip){
  case 'toi': return laTG(n);
  case 'cs': return !laTG(n);
  case 'cho': return n.tt==='cho'||!!(n.banCho&&n.banCho.tt==='cho');
  case 'tralai': return n.tt==='tralai'||!!(n.banCho&&n.banCho.tt==='tralai');
  case 'bl': return biBaoCao(n);
  default: return true;
 }
}
const hopLoc=n=>(ST.mon==='ALL'||n.mon===ST.mon)&&(ST.khoi==='ALL'||n.khoi===+ST.khoi);
function locNhom(chip,boNgung){
 const q=kd(ST.q.trim());
 /* C4 — nhóm «Đã hủy» ẩn khỏi danh sách mặc định nhưng CÓ bộ lọc tìm lại (chip «✕ Gồm nhóm đã hủy») */
 return NHOM.filter(n=>thayND(n)&&hopLoc(n)&&(boNgung||ST.ngung||!n.ngung)&&(boNgung||ST.huy||!daHuy(n))&&chipOK(n,chip)&&(!q||kd(timChuoi(n)).includes(q)));
}

function veNganHang(){
 if(!can('xem')&&!can('xem_truong')) return khongCoQuyen('Ngân hàng nhóm câu hỏi','Nhóm menu Học liệu số hóa dùng sáu chức danh GVBM · GVCN · TTCM · TPCM · PHT_CM · HT <i>(kiến trúc §9 — HL-9)</i>.');
 const ds=locNhom(), sel=ST.sel&&nhomById(ST.sel);
 const soNg=NHOM.filter(n=>thayND(n)&&hopLoc(n)&&n.ngung).length;
 let h=scopeBar(moTaPhamVi()+' <b>Ngân hàng xuyên năm</b> — không chịu bộ chọn năm học, điểm trường.');
 h+=dnote('Nhóm câu = <b>một thực thể</b>: ngữ liệu chung + câu con <b>thuộc nhóm</b> — câu con không có bản ghi ở M12.5, không vào đề lẻ <i>(quy tắc 1)</i>. '
  +'Cột <b>Câu con theo mức độ × dạng</b> là con số M12.3 dùng khi kiểm đủ câu từng ô <i>(quy tắc 8 — nhóm đếm theo câu con)</i>. '
  +'Đề dùng nhóm chỉ hiện <b>số đếm + liên kết</b> sang M12.2 — không liệt kê đề ở đây <i>(bài học M12.4)</i>.');
 const vtg=viecTacGia();                                   /* BCHL-3A — dải đón việc từ kết luận của M12.4 */
 if(vtg.length) h+=veDaiViecToi(vtg);
 const mons=[...new Set(NHOM.map(n=>n.mon))];
 h+='<div class="bar"><input class="inp" id="qnh" placeholder="🔍 Tìm mã, tên, ngữ liệu, nội dung câu con…" value="'+esc(ST.q)+'">'
  +'<select class="fs" id="cmon"><option value="ALL">Mọi môn</option>'+mons.map(m=>'<option value="'+m+'"'+(ST.mon===m?' selected':'')+'>'+esc(MON[m].ten)+'</option>').join('')+'</select>'
  +'<select class="fs" id="ckhoi"><option value="ALL">Mọi khối</option>'+KHOI.map(k=>'<option value="'+k+'"'+(String(ST.khoi)===String(k)?' selected':'')+'>Khối '+k+'</option>').join('')+'</select>'
  +'<span class="spacer"></span><button class="btn sm" id="btnTK">📊 Thống kê</button><button class="btn sm" id="btnXuat">⬇ Xuất</button>'
  +'<button class="btn sm p" id="btnTao">＋ Tạo nhóm câu</button></div>';
 h+='<div class="bar" style="padding-top:0">'+CHIP1.map(([k,t])=>'<button class="chip'+(ST.chip===k?' on':'')+'" data-chip="'+k+'">'+t+' <b>'+locNhom(k).length+'</b></button>').join('')
  +'<button class="chip'+(ST.ngung?' on':'')+'" data-ngungchip="1">⏸ Gồm nhóm ngưng dùng ('+soNg+')</button>'
  +'<button class="chip'+(ST.huy?' on':'')+'" data-huychip="1">✕ Gồm nhóm đã hủy ('+NHOM.filter(n=>thayND(n)&&hopLoc(n)&&daHuy(n)).length+')</button></div>';
 /* gom theo môn – khối — tự phẳng hóa khi đang tìm */
 const nhomTheo={}; ds.forEach(n=>{(nhomTheo[n.mon+'|'+n.khoi]=nhomTheo[n.mon+'|'+n.khoi]||[]).push(n)});
 const an=NHOM.filter(n=>!thayND(n)&&hopLoc(n)&&!n.ngung&&(can('xem')||can('xem_truong')));
 an.forEach(n=>{if(!ST.q&&ST.chip==='all') nhomTheo[n.mon+'|'+n.khoi]=nhomTheo[n.mon+'|'+n.khoi]||[]});
 const khoaNhom=Object.keys(nhomTheo).sort();
 let list='<div class="hdrow nrow"><span>Nhóm câu · ngữ liệu</span><span class="hcol">Câu con theo mức độ × dạng</span><span class="hcol">Gắn cây</span><span>Phạm vi · trạng thái</span><span class="hcol">Đề dùng</span><span></span></div>';
 if(ST.q){list+=ds.length?ds.map(veDong).join(''):'<div class="empty">Không có nhóm khớp «'+esc(ST.q)+'».</div>'}
 else if(!khoaNhom.length) list+='<div class="empty">Không có nhóm trong bộ lọc này.</div>';
 else khoaNhom.forEach(k=>{
  const [m,kh]=k.split('|'), arr=nhomTheo[k];
  list+='<div class="grph"><span>'+esc(MON[m].ten)+' '+kh+'</span><span class="cnt">'+(arr.length?arr.length+' nhóm · '+arr.reduce((s,n)=>s+n.con.length,0)+' câu con':'không có nhóm vai này xem được')+'</span></div>';
  list+=arr.map(veDong).join('');
  if(ST.chip==='all') list+=dongChiDem(an.filter(n=>n.mon===m&&n.khoi===+kh));
 });
 list+='<div class="lgd"><span>🖼 hình · 🔊 âm thanh kèm ngữ liệu <i>(HL-10)</i></span><span>✍ tự soạn · 📜 hết thời hạn bảo hộ · 📘 trích SGK <i>(HL-12)</i></span><span>Thao tác hiện rõ khi rê chuột lên dòng</span></div>';
 h+='<div class="stage'+(sel?' open':'')+'"><div class="listw">'+list+'</div><div class="panel">'+(sel?veChiTiet(sel):'')+'</div></div>';
 return h;
}
function moTaPhamVi(){
 if(role==='FULL') return 'Demo thấy <b>mọi nhóm</b> — kể cả «Chỉ tôi» của người khác <i>(vai thật chỉ thấy số lượng)</i>.';
 if(!can('xem')) return 'Thấy <b>ngân hàng chung đã duyệt</b> <i>(chia sẻ Tổ / Toàn trường)</i>; nhóm đang chờ duyệt và nhóm dùng riêng chỉ hiện <b>số lượng</b>.';
 const D=can('duyet_all')?'toàn trường':can('duyet_to')?'môn của '+esc(TO[R().to].ten):'';
 return 'Thấy <b>nhóm của mình</b> + nhóm <b>được chia sẻ dùng</b> <i>(Tổ chuyên môn '+(R().to?'«'+esc(TO[R().to].ten)+'»':'—')+' · Toàn trường — đã duyệt · chia sẻ đích danh)</i>'
  +(D?' + <b>mọi nhóm chia sẻ trong phạm vi bạn duyệt</b> <i>('+D+' — chờ duyệt · đã duyệt · bị trả lại)</i>':'')+'. Chia sẻ chỉ trao <b>quyền dùng</b>.';
}
/* dòng «chỉ số lượng» — nhóm trong ngân hàng mà vai không xem được nội dung (TC-13 của M12.4) */
function dongChiDem(an){
 if(!an.length) return '';
 const d={toi:0,nguoi:0,chua:0,to:0}; an.forEach(n=>d[lyDoAn(n)]++);
 const t=[d.toi?d.toi+' «Chỉ tôi» của người khác':'',d.nguoi?d.nguoi+' chia sẻ đích danh người khác':'',d.chua?d.chua+' chưa duyệt':'',d.to?d.to+' chia sẻ trong tổ khác':''].filter(Boolean).join(' · ');
 return '<div class="chidem" data-chidem="1">🔒 <b>+ '+an.length+' nhóm · '+an.reduce((s,n)=>s+n.con.length,0)+' câu con</b> trong ngân hàng không hiện với vai này — '+t
  +'. <i>Chỉ số lượng — không xem được nội dung (TC-13 của M12.4). Số này vẫn tính trong 📊 Thống kê «Toàn ngân hàng».</i></div>';
}
function iconNL(n){return '📄'+(n.tep.some(t=>t.loai==='hinh')?' 🖼':'')+(n.tep.some(t=>t.loai==='am')?' 🔊':'')}
function chipNguon(n){
 if(!n.nguonLoai) return '<span class="tg r" title="Bắt buộc trước khi nhóm rời «Chỉ tôi»">⚠ Chưa ghi nguồn ngữ liệu</span>';
 return '<span class="tg '+(n.nguonLoai==='sgk'?'b':'c')+'" title="'+esc(chuoiNguon(n))+(n.nguonLoai==='sgk'?' — dùng cho đề kiểm tra của trường ở mức cần thiết (NĐ 17/2023 Đ.26); không đi theo gói trao đổi ra ngoài trường (F-4)':'')+'">'
  +NGUON_NL[n.nguonLoai].ic+' '+esc(NGUON_NL[n.nguonLoai].ten)+'</span>';
}
function chipCay(id,loai){
 if(!id) return '<span class="cnt0">'+(loai==='bs'?'📘':'🧭')+' chưa gắn</span>';
 const nut=nutById(id); if(!nut) return '<span class="cnt0">'+esc(id)+'</span>';
 return '<span class="caylk" title="'+esc(duongDan(id))+'">'+(loai==='bs'?'📘 ':'🧭 ')+esc(nut.ten)+(ngungThuc(id)?' <span class="tg b">⏸</span>':'')+'</span>';
}
/* ★ BCHL-1A — BA trục độc lập trên một dòng: trạng thái DUYỆT · cờ ⚑ BỊ BÁO CÁO · trạng thái cuối ĐÃ HỦY */
function nhanTT(n){
 let h='<span class="pill">'+esc(PHAM_VI[n.pv])+'</span> <span class="st2 '+TT_CLS[n.tt]+(daHuy(n)?' mo':'')+'">'+TT_DUYET[n.tt]+'</span>';
 if(daHuy(n)) h+=' <span class="st2 r" title="'+esc(n.huy.ly)+'">'+TEN_HUY+'</span>';
 if((n.suaDoi||[]).length) h+=' <span class="tg c" title="Lịch sử sửa — nhóm không có phiên bản (Z-2)">✎ '+n.suaDoi.length+' lần sửa</span>';
 if(nhomSuaSauKhiVaoDe(n)) h+=' <span class="tg a" title="Đề đang dùng nhóm hiện cảnh báo">⚠ sửa sau khi vào đề</span>';
 if(n.banCho) h+=' <span class="st2 '+(n.banCho.tt==='cho'?'b':'r')+'">✎ bản sửa '+(n.banCho.tt==='cho'?'chờ duyệt':'bị trả lại')+'</span>';
 if(biBaoCao(n)) h+=' <span class="st2 r" title="'+esc(tenLyDo(n.bl.lyDo)+' — '+n.bl.ly)+'">'+TEN_CO+'</span>';
 if(dxCayCho(n).length) h+=' <span class="tg b" title="Đề xuất sửa phân loại đã chuyển sang M12.4 — không bật cờ, không chặn nhóm vào đề mới (C5)">🌳 đề xuất sửa phân loại</span>';
 if(n.ngung) h+=' <span class="st2 n">⏸ Ngưng dùng</span>';
 return h;
}
function oDe(n){
 const ds=deCoNhom(n.id); if(!ds.length) return '<span class="cnt0">—</span>';
 const dd=ds.filter(d=>deDaSuDung(d.id)).length;
 return lienKet('M12.2','tab=ngan_hang_de&nhom='+n.id,ds.length+' đề'+(dd?' · '+dd+' đã dùng':''));
}
function veDong(n){
 const snip=n.nguLieu.replace(/\s+/g,' ').slice(0,90)+(n.nguLieu.length>90?'…':'');
 const cls=(ST.sel===n.id?' on':'')+(ST.hl===n.id?' hlr':'')+(n.ngung?' ngr':'')+(n.bl?' bad':'')+(n.tt==='tralai'?' warnl':'');
 return '<div class="hrow nrow'+cls+'" data-row="'+n.id+'">'
  +'<div class="ncell"><div><b class="mcode">'+n.id+'</b> <span class="nten">'+esc(n.ten)+'</span></div>'
  +'<div class="nsub">'+iconNL(n)+' '+esc(snip)+'</div><div class="nsub">'+chipNguon(n)+' <span class="cnt0">· '+esc(tenNS(n.tg))+'</span></div></div>'
  +'<div class="hcol"><div class="nsub" style="margin:0 0 3px"><b>'+n.con.length+' câu con</b></div><div class="dms">'+chipsDem(n.con)+'</div></div>'
  +'<div class="hcol ncay">'+chipCay(n.bs,'bs')+chipCay(n.mach,'mach')+'</div>'
  +'<div>'+nhanTT(n)+'</div>'
  +'<div class="hcol">'+oDe(n)+'</div>'
  +'<div class="racts">'
  /* C4 — nhóm Đã hủy chỉ còn một thao tác: đọc */
  +(daHuy(n)?'<button class="ib" data-mo="'+n.id+'" title="Xem — nhóm Đã hủy chỉ còn đọc">👁</button>'
  :'<button class="ib" data-mo="'+n.id+'" title="Xem nhóm">👁</button>'
  +'<button class="ib" data-ed="'+n.id+'" title="Soạn / sửa nhóm">✏</button>'
  +'<button class="ib" data-pv="'+n.id+'" title="Đổi phạm vi chia sẻ">⇄</button>'
  +'<button class="ib" data-bl="'+n.id+'" title="Báo cáo">⚑</button>'
  +'<button class="ib" data-nb="'+n.id+'" title="Nhân bản thành nhóm của tôi">⎘</button>'
  +(n.ngung?'<button class="ib" data-dunglai="'+n.id+'" title="Dùng lại">▶</button>':'<button class="ib" data-ngung="'+n.id+'" title="Ngưng dùng">⏸</button>')
  +'<button class="ib'+(vuongXoa(n).length?' dis':'')+'" data-xoa="'+n.id+'" title="Xóa (chỉ nhóm Riêng chưa vào đề nào)">🗑</button>')
  +'</div></div>';
}

 if(h&&h.quat){let a=-Math.PI/2; const cx=110,cy=110,r=95;

/* so sánh bản chờ với bản hiện hành — theo id câu con */
function soSanh(n){
 const cu=n.con, moi=n.banCho.nd.con, L=[];
 if(n.nguLieu!==n.banCho.nd.nguLieu) L.push('<li>Ngữ liệu <b>đổi</b></li>');
 if(JSON.stringify(n.tep)!==JSON.stringify(n.banCho.nd.tep)) L.push('<li>Tệp kèm ngữ liệu <b>đổi</b></li>');
 moi.forEach((c,i)=>{const o=cu.find(x=>x.id===c.id); if(!o) L.push('<li><ins>＋ Thêm</ins> câu '+(i+1)+' <span class="mcode">'+c.id+'</span> · '+esc(tenMD(c.md))+' · '+esc(tenDang(c.dang))+'</li>');
  else if(JSON.stringify(o)!==JSON.stringify(c)) L.push('<li>✎ Sửa câu '+(i+1)+' <span class="mcode">'+c.id+'</span></li>')});
 cu.forEach(c=>{if(!moi.find(x=>x.id===c.id)) L.push('<li><s>✕ Bỏ</s> <span class="mcode">'+c.id+'</span></li>')});
 if(cu.map(c=>c.id).filter(id=>moi.find(x=>x.id===id)).join()!==moi.map(c=>c.id).filter(id=>cu.find(x=>x.id===id)).join()) L.push('<li>↕ Đổi thứ tự câu con</li>');
 return '<div class="card" style="margin-top:10px"><div class="ch">So với nội dung đang phục vụ</div><div class="cb diff2"><ul>'+(L.join('')||'<li>Không đổi nội dung</li>')+'</ul>'
  +'<div style="padding:4px 12px 8px">Ma trận đếm: <b>'+cu.length+' → '+moi.length+' câu con</b></div></div></div>';
}

 };

/* ══ BCHL-3A — một dòng kết luận của `M12.4` cho bản ghi `DXBC-` (cùng bộ chữ với `M12.5`) ══

   `Đã áp dụng` là chỗ gắn đã sẵn sàng · `✕ Không áp dụng` là tin cho người báo, tác giả không phải làm gì. */
function ketLuanDX(d,ban){
 if(d.tt==='cho') return ' <span class="st2 w">Chờ M12.4 kết luận</span>';

  +(d.duyet.ly?' — «'+esc(d.duyet.ly)+'»':'')+(dxDaXong(d,ban)?' <span class="st2 o">tác giả đã đổi chỗ gắn</span>':' <b>tác giả chưa đổi chỗ gắn</b>');
 if(d.tt==='apdung'){const nt=d.duyet&&d.duyet.nutTao;
  return ' <span class="st2 o">＋ Đã thành nút mới và đã áp dụng</span> — nút <b>'+esc(nt&&nutById(nt)?duongDan(nt):(nt||'—'))+'</b>, '
   +esc(tenAi(d.duyet.ai))+' · '+k2s(d.duyet.luc)+(dxDaXong(d,ban)?' <span class="st2 o">đã gắn</span>':' <b>chưa gắn vào nút này</b>');}

 return '';
}

function lyDoKhongSua(n){
 /* C4 — nhóm Đã hủy là trạng thái CUỐI: không sửa, không xóa, không dùng lại */
 if(daHuy(n)) return 'Nhóm ở trạng thái cuối <b>Đã hủy</b> <i>('+esc(tenNS(n.huy.ai))+' · '+k2s(n.huy.luc)+' — «'+esc(n.huy.ly)+'»)</i>. '

 if(!can('sua')) return 'Vai <b>'+esc(R().cd)+'</b> chỉ có quyền <b>Xem</b> ở ngân hàng nhóm câu.';
 if(!laTG(n)&&role!=='FULL') return 'Nhóm của <b>'+esc(tenNS(n.tg))+'</b>. Chia sẻ chỉ trao <b>quyền dùng</b> — xem · đưa vào đề của mình · nhân bản — '
  +'<b>không trao sửa</b> <i>(quy tắc 5)</i>. Thấy sai thì <b>⚑ Báo cáo</b>; muốn chỉnh cho mình thì <b>⎘ Nhân bản</b> thành nhóm của bạn.';
 if(n.ngung) return 'Nhóm đang <b>ngưng dùng</b> — bấm <b>▶ Dùng lại</b> trước khi sửa.';
 return null;

/* ── LƯU — kiểm, rồi quyết định phiên bản cho cả nhóm ── */
function luuSoan(xacNhan){
 const ed=ST.ed, L=[], con=[];
 if(!ed.ten.trim()) L.push('<b>Tên nhóm</b> đang trống');
 if(!ed.nguLieu.trim()&&!ed.tep.length) L.push('<b>Ngữ liệu</b> trống — cần văn bản hoặc ít nhất một tệp hình / âm thanh');
 if(ed.con.length<2) L.push('Nhóm cần <b>ít nhất 2 câu con</b> — một câu thì soạn ở <b>M12.5</b> (câu lẻ)');
 ed.con.forEach((x,i)=>{
  const r=DC.laySoan(khoaCon(ed,x.id));
  if(!x.md) L.push('Câu '+(i+1)+' <span class="mcode">'+x.id+'</span>: chưa chọn <b>mức độ</b> — ma trận M12.3 đếm theo mức độ');
  if(!r.ok) L.push('Câu '+(i+1)+' <span class="mcode">'+x.id+'</span>: '+r.loi.length+' chỗ chưa đủ — '+r.loi.map(esc).join('; '));
  else {const c=Object.assign({id:x.id,dang:r.cau.dang,md:x.md,nd:r.cau.nd},r.cau.pa!=null?{pa:r.cau.pa}:{},r.cau.da!=null?{da:r.cau.da}:{},r.cau.loiGiai?{loiGiai:r.cau.loiGiai}:{},r.cau.kxao?{kxao:true}:{}); con.push(c)}
 });
 if(ed.pv!=='toi'){const t=thieuNguon(ed); if(t.length) L.push('⛔ <b>Nguồn ngữ liệu là trường bắt buộc khi nhóm rời «Chỉ tôi»</b> <i>(phạm vi đang chọn: '+PHAM_VI[ed.pv]+' — HL-12)</i>: '+t.join('; ')
  +' <a class="lk" data-vaonguon="1">→ tới ô Nguồn</a>')}
 if(ed.pv==='nguoi'&&!ed.chiaSe.length) L.push('Phạm vi «Người cụ thể» — chọn <b>ít nhất một người</b>');
 if(L.length){ed.loi=L; render(); window.scrollTo(0,0); return}
 ed.loi=null;
 const nd={nguLieu:ed.nguLieu,tep:sao(ed.tep),con};
 const meta={ten:ed.ten.trim(),mon:ed.mon,khoi:ed.khoi,bs:ed.bs||null,mach:ed.mach||null,nguonLoai:ed.nguonLoai,nguonCt:ed.nguonCt.trim(),nguonNam:ed.nguonNam,pv:ed.pv,chiaSe:ed.pv==='nguoi'?ed.chiaSe.slice():[]};
 if(ed.moi) return taoMoi(ed,nd,meta);
 const n=nhomById(ed.id), ndCu=n.banCho?n.banCho.nd:layND(n), doi=ndKhac(ndCu,nd);
 const daDung=deDaDungCoNhom(n.id), vaoDe=deCoNhom(n.id), phucVu=n.tt==='duyet'&&chiaSeRong(n.pv);
 const kieu=!doi?'meta':phucVu?'cho':'taicho';                /* Z-2: không còn nhánh 'ver' — nhóm sửa tại chỗ */
 const thuHep=chiaSeRong(n.pv)&&!chiaSeRong(meta.pv), khac=thuHep?deChuaDung(n.id).filter(d=>d.tg!==n.tg):[];
 if(!xacNhan&&(kieu==='cho'||vaoDe.length||khac.length)){
  const chuaDung=deChuaDung(n.id);
  let b='';
  if(daDung.length) b+='<div class="warn">🗂 Nhóm <b>'+n.id+'</b> đang nằm trong <b>'+daDung.length+' đề đã sử dụng</b>'
   +' — '+daDung.map(d=>'<b>'+d.id+'</b>'+(d.daIn?' (đã in '+k2s(d.inLuc)+')':' (đã giao)')).join(' · ')
   +'. Nhóm <b>không có phiên bản</b> (chốt 16/9/2026): đề đó dựng theo <b>nội dung mới</b> và hiện <b>cảnh báo «nhóm đã được sửa …»</b>; '
   +'đề <b>đã in</b> thì bản giấy là nội dung trước lần sửa. Lần sửa này <b>ghi vào lịch sử sửa</b>.</div>';
  if(vaoDe.length&&!daDung.length) b+='<div class="ro">Nhóm đã vào <b>'+vaoDe.length+' đề</b> — lần sửa này ghi vào <b>lịch sử sửa</b>, đề hiện cảnh báo.</div>';
  if(kieu==='cho') b+='<div class="info">✎ Nhóm đang <b>Đã duyệt · '+PHAM_VI[n.pv]+'</b> → lần sửa thành <b>bản sửa chờ duyệt</b>; <b>nội dung hiện hành tiếp tục phục vụ</b> người khác tới khi bản sửa được duyệt <i>(kiến trúc §4.2)</i>. Người duyệt: '+nguoiDuyetDuKien(n)+'.</div>';
  b+='<div class="ro">Thay đổi: <b>'+ndCu.con.length+' → '+con.length+' câu con</b>'+(ndCu.nguLieu!==nd.nguLieu?' · ngữ liệu đổi':'')+'. Đề <b>chưa sử dụng</b> có nhóm: <b>'+chuaDung.length+'</b>'
   +(chuaDung.length?' — trỏ bản mới nhất, M12.2 hiện nhãn «nhóm đã đổi — xem lại» và phải đặt lại điểm nếu số câu con đổi':'')+'.</div>';
  if(khac.length) b+='<div class="warn">⚠ Thu hẹp phạm vi — nhóm đang nằm trong <b>'+khac.length+' đề chưa sử dụng của người khác</b>; họ sẽ không thêm được nhóm vào đề mới, đề đã có giữ nhóm.</div>';
  mfns.bluuxn=()=>{closeM();luuSoan(true)};
  return modal('💾 Lưu nhóm '+n.id+' — lần sửa này làm gì',b,'<button class="btn" data-mb="close">Quay lại sửa</button><button class="btn p" data-mb="luuxn">Xác nhận lưu</button>');
 }
 const ct=[];
 if(kieu==='taicho'){                                        /* Z-2 — sửa tại chỗ, ghi lịch sử nếu nhóm đã vào đề */
  const dsDoi=doiNhom(layND(n),nd);
  Object.assign(n,sao(nd)); if(n.banCho){n.banCho=null}
  if(vaoDe.length&&dsDoi.length){n.suaDoi.push({luc:GIO_NAY,ai:role,ly:(ed.lySua||'').trim(),doi:dsDoi});
   ct.push('sửa tại chỗ — ghi lịch sử sửa; '+vaoDe.length+' đề hiện cảnh báo')}
  else ct.push('sửa nội dung tại chỗ — nhóm chưa vào đề nào, chỉ ghi nhật ký');
  if(n.bl){n.blDaXuLy.push(Object.assign({},n.bl,{ketQua:'Đã sửa '+k2s(GIO_NAY)+' — sửa tại chỗ',xlAi:role,xlLuc:GIO_NAY})); n.bl=null; ct.push('báo lỗi chuyển «Đã sửa»')}}
 if(kieu==='cho'){n.banCho={tt:'cho',luc:GIO_NAY,ai:role,ly:(ed.lySua||'').trim(),nd:sao(nd)}; if(n.bl) n.bl.sua={luc:GIO_NAY};
  ct.push('bản sửa chờ duyệt — nội dung hiện hành tiếp tục phục vụ')}
 const pvCu=n.pv, ttCu=n.tt;
 Object.assign(n,meta); n.nguLieuNguon=chuoiNguon(n);
 if(chiaSeRong(n.pv)&&(ttCu==='rieng'||ttCu==='tralai'||(ttCu==='duyet'&&pvCu!==n.pv&&chiaSeRong(pvCu)))){n.tt='cho';n.guiLuc=GIO_NAY;n.traLai=null;ct.push('gửi duyệt — '+PHAM_VI[n.pv])}
 else if(chiaSeRong(n.pv)&&ttCu==='duyet'&&!chiaSeRong(pvCu)){n.tt='cho';n.guiLuc=GIO_NAY;ct.push('gửi duyệt — '+PHAM_VI[n.pv])}
 if(!chiaSeRong(n.pv)&&n.tt!=='rieng'){n.tt='rieng';n.banCho=null;ct.push('thu hẹp phạm vi → '+PHAM_VI[n.pv]+' — không cần duyệt')}
 if(n.banCho&&n.banCho.tt==='tralai'&&kieu!=='cho'){n.banCho.tt='cho';n.banCho.luc=GIO_NAY}
 if(pvCu!==n.pv) ct.push('phạm vi '+PHAM_VI[pvCu]+' → '+PHAM_VI[n.pv]);
 ghiLS(n,'Sửa nhóm',ct.join(' · ')||'sửa thông tin');
 DC.xoa('sn.'+n.id+'*'); ST.ed=null; ST.sel=n.id; ST.hl=n.id; ST.ngung=ST.ngung||n.ngung;
 toast('✓ Đã lưu <b>'+n.id+'</b>'+(ct.length?' — '+esc(ct[0]):''));
 render();
}

function suKienSoan(t){
 const ed=ST.ed, b=k=>{const x=t.closest('[data-'+k+']'); return x?x.dataset[k]:null}; let v;
 if(b('edthem')){let i=ed.con.length+1; while(ed.con.find(c=>c.id===ed.id+'.'+i)||ed.goc.find(c=>c.id===ed.id+'.'+i)||false) i++;
  ed.con.push({id:ed.id+'.'+i,md:''}); render(); const c=$$('.concard'); if(c.length) c[c.length-1].scrollIntoView({block:'center'}); return true}
 if((v=b('edbo'))!=null){const x=ed.con[+v]; if(ed.con.length<=2){toast('Nhóm cần ít nhất 2 câu con — thêm câu khác trước khi bỏ câu này.');return true}
  mfns.bbocon=()=>{closeM(); ed.con.splice(+v,1); DC.xoa(khoaCon(ed,x.id)); render()};
  modal('Bỏ câu con '+x.id+'?',(ed.goc.find(c=>c.id===x.id)?'<div class="warn">Câu con này có trong bản đang lưu — bỏ là <b>đổi nội dung nhóm</b>; nếu nhóm bị đề đã sử dụng ghim thì lưu sẽ sinh phiên bản mới, đề cũ giữ câu này.</div>':'')+'Nội dung đã soạn của câu này sẽ mất.',
   '<button class="btn" data-mb="close">Giữ lại</button><button class="btn d" data-mb="bocon">Bỏ câu con</button>'); return true}
 if((v=b('edlen'))!=null){const i=+v; if(i>0){const x=ed.con[i];ed.con[i]=ed.con[i-1];ed.con[i-1]=x;render()} return true}
 if((v=b('edxuong'))!=null){const i=+v; if(i<ed.con.length-1){const x=ed.con[i];ed.con[i]=ed.con[i+1];ed.con[i+1]=x;render()} return true}
 if((v=b('eddang'))){ed.moDang=ed.moDang||[]; ed.moDang.includes(v)?ed.moDang.splice(ed.moDang.indexOf(v),1):ed.moDang.push(v); render(); return true}
 if((v=b('edtep'))){const so=ed.tep.length+1; ed.tep.push(v==='hinh'?{ten:'hinh-ngu-lieu-'+so+'.png',loai:'hinh',kb:220}:{ten:'bai-nghe-'+so+'.mp3',loai:'am',kb:3450}); render(); return true}
 if((v=b('edbotep'))!=null){ed.tep.splice(+v,1); render(); return true}
 if(b('vaonguon')){const el=$('#edNguon'); if(el){el.scrollIntoView({block:'center'}); el.classList.add('nhay')} return true}
 if(t.id==='edLuu'){luuSoan(false);return true}
 if(t.id==='edHuy'){huySoan();return true}
 return false;
}

/* máy kiểm trước khi duyệt — chạy lại mỗi lần mở */
function mayKiem(n,loai){
 const nd=loai==='sua'?n.banCho.nd:layND(n), L=[];
 const thieuDa=nd.con.filter(c=>!DC.coDapAn(c)), thieuMd=nd.con.filter(c=>!c.md);

 L.push(thieuMd.length?['x','Câu con chưa có mức độ: '+thieuMd.map(c=>c.id).join(', ')]:['o','Mọi câu con có mức độ — M12.3 đếm được']);
 const tn=thieuNguon(n); L.push(tn.length?['x','Nguồn ngữ liệu: '+tn.join('; ')]:['o','Nguồn ngữ liệu: '+esc(chuoiNguon(n))]);

  +'<i>(NĐ 17/2023 Đ.26 k1a)</i>: người duyệt tự đọc đoạn trích, <b>máy không đặt ngưỡng</b> <i>(F-4 — phương án B)</i>. Nhóm này không đi theo gói trao đổi ra ngoài trường']);
 L.push(n.bs||n.mach?['o','Gắn cây: '+[n.bs?'Bộ sách':'',n.mach?'Mạch':''].filter(Boolean).join(' + ')]:['w','Chưa gắn cây nào — ma trận M12.3 sẽ không đếm nhóm này <i>(quy tắc 7)</i>']);

 return L;
}

/* ── DUYỆT · TRẢ LẠI ── */
function lyDoKhongDuyet(n){
 if(laTG(n)) return 'Bạn là <b>tác giả</b> của nhóm '+n.id+' — tác giả không tự duyệt <i>(quy tắc 6 — 4-eye)</i>. Nhóm chuyển '+nguoiDuyetDuKien(n)+'.';
 if(!coQuyenDuyet(n)) return can('duyet_to')?'Nhóm môn <b>'+esc(MON[n.mon].ten)+'</b> ngoài môn của <b>'+esc(TO[R().to].ten)+'</b> — phạm vi duyệt của TTCM là <b>Group = môn của tổ</b>.'
  :'Vai <b>'+esc(R().cd)+'</b> không có quyền <b>Duyệt</b> ở ngân hàng nhóm câu — người duyệt: '+nguoiDuyetDuKien(n)+'.';
 return null;
}
function duyet(k,loat){
 const [loai,id]=k.split(':'), n=nhomById(id), ly=lyDoKhongDuyet(n);
 if(ly) return loat?ly:chan('Không duyệt được',ly);
 if(loai==='moi'&&n.tt!=='cho') return loat?'Nhóm không còn chờ duyệt':toast('Nhóm '+id+' không còn chờ duyệt.');
 if(loai==='sua'&&!(n.banCho&&n.banCho.tt==='cho')) return loat?'Không còn bản sửa chờ duyệt':toast('Không còn bản sửa chờ duyệt.');
 const mk=mayKiem(n,loai).filter(x=>x[0]==='x');
 if(mk.length){const t='Máy kiểm không đạt: '+mk.map(x=>x[1]).join('; '); if(loat) return t;
  return chan('Máy kiểm không đạt — chưa duyệt được',t+'<br>Trả lại để tác giả bổ sung.','<button class="btn p" data-tralai="'+k+'">↩ Trả lại (lý do có sẵn)</button>')}
 if(loai==='moi'){n.tt='duyet'; n.duyet={ai:role,luc:GIO_NAY}; n.traLai=null; ghiLS(n,'Duyệt','chia sẻ '+PHAM_VI[n.pv])}
 else {
  /* Z-2: duyệt bản sửa = ghi đè nội dung hiện hành + ghi một dòng LỊCH SỬ SỬA (có hiệu lực lúc duyệt) */
  const vaoDe=deCoNhom(n.id), bc=n.banCho, dsDoi=doiNhom(layND(n),bc.nd);
  Object.assign(n,sao(bc.nd)); n.banCho=null; n.duyet={ai:role,luc:GIO_NAY};
  if(vaoDe.length&&dsDoi.length) n.suaDoi.push({luc:GIO_NAY,ai:bc.ai,guiLuc:bc.luc,ly:bc.ly||'',doi:dsDoi,duyet:{ai:role,luc:GIO_NAY}});
  ghiLS(n,'Duyệt bản sửa','có hiệu lực'+(vaoDe.length?' — ghi lịch sử sửa, '+vaoDe.length+' đề hiện cảnh báo':''));
  if(n.bl&&n.bl.sua){n.blDaXuLy.push(Object.assign({},n.bl,{ketQua:'Đã sửa — bản sửa được duyệt '+k2s(GIO_NAY),xlAi:role,xlLuc:GIO_NAY})); n.bl=null; ghiLS(n,'Đóng báo lỗi','Đã sửa')}
 }
 if(loat) return null;
 ST.cd=null; ST.cdChon.delete(k); toast('✓ Đã duyệt <b>'+id+'</b>'+(loai==='sua'?' — bản sửa thành nội dung hiện hành':'')); render();
}

function moTraLai(k){

 modal('↩ Trả lại '+(loai==='moi'?'nhóm':'bản sửa')+' '+id,'<div id="tlLoi"></div><label class="lbl" style="margin-top:0">Lý do <span class="req">*</span></label><textarea class="fldi" id="tlLy" rows="3">'+esc(goiY)+'</textarea>'
  +(loai==='sua'?'<div class="path">Trả lại bản sửa: <b>nội dung hiện hành vẫn phục vụ</b>; tác giả sửa tiếp bản sửa đó.</div>':''),
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="tlxn">↩ Trả lại</button>');
}

  laTG(n)?'<button class="btn p" data-pv="'+id+'">⇄ Phạm vi</button>':'');

 mfns.bthxn=()=>{const v=($('#thLy')||{}).value||'';

  closeM(); n.tt='tralai'; n.traLai={ai:role,luc:GIO_NAY,ly:v.trim(),thuHoi:true}; n.duyet=null;
  ghiLS(n,'Thu hồi duyệt',v.trim()); ST.hl=id; ST.cd=null;
  toast('↩ Đã thu hồi duyệt <b>'+id+'</b> — nhóm về «Bị trả lại», không ai dùng được nữa'); render()};
