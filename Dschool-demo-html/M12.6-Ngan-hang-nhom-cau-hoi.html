/* ── BÁO LỖI — chỉ đích danh câu con (hoặc ngữ liệu) ── */
let BLF=null;
/* ══ ⚑ BÁO CÁO NHÓM — sáu loại lỗi + hai loại ngữ liệu riêng của nhóm (F-10) · ghi chú ≤ 200 ký tự (BCHL-1A) ══ */
function moBaoLoi(id){
 const n=nhomById(id);
 if(!can('bao_loi')) return chan('Không báo cáo được','Vai <b>'+esc(R().cd)+'</b> chỉ có quyền <b>Xem</b>. Báo cáo là việc của giáo viên dùng nhóm <i>(quy tắc 6)</i>.');
 if(daHuy(n)) return chan('Nhóm đã hủy','Nhóm <b>'+id+'</b> ở trạng thái cuối <b>Đã hủy</b> ('+k2s(n.huy.luc)+' — «'+esc(n.huy.ly)+'») — không còn vào đề mới, không cần báo cáo nữa.');
 if(laTG(n)) return chan('Đây là nhóm của bạn','Thấy sai trong nhóm của chính mình thì <b>✏ Sửa</b> — nhóm chia sẻ thì lần sửa thành <b>bản sửa chờ duyệt</b>. Không cần báo cáo.','<button class="btn p" data-ed="'+id+'">✏ Sửa</button>');
 if(n.tt!=='duyet'&&chiaSeRong(n.pv)) return chan('Nhóm chưa được duyệt','Nhóm đang <b>'+TT_DUYET[n.tt]+'</b> — chưa ai dùng được. Người duyệt dùng <b>↩ Trả lại</b> có lý do, không phải báo cáo.');
 if(n.bl) return chan('Nhóm đang bị báo cáo','<b>'+esc(tenLyDo(n.bl.lyDo))+'</b> — «'+esc(n.bl.ly)+'» · '+esc(tenAi(n.bl.ai))+' · '+k2s(n.bl.luc)+'. Mỗi nhóm một báo cáo mở; người xử lý kết luận xong mới báo tiếp.');
 BLF={id,lyDo:'',ly:'',doi:new Set(),loi:null}; veBaoLoi();
}
function veBaoLoi(){
 const n=nhomById(BLF.id);
 modal('⚑ Báo cáo nhóm '+n.id+' — '+esc(n.ten),(BLF.loi?'<div class="danger">⛔ '+BLF.loi.join('<br>⛔ ')+'</div>':'')
  +'<label class="lbl" style="margin-top:0">Loại lỗi <span class="req">*</span> <span class="cnt0">sáu loại + hai loại ngữ liệu riêng của nhóm · danh mục 🔗 M12.5 ⚙ ③</span></label><select class="fldi" id="blLyDo"><option value="">— chọn —</option>'
  +LY_DO_BL.map(x=>'<option value="'+x.id+'"'+(BLF.lyDo===x.id?' selected':'')+'>'+esc(x.ten)+(x.dt==='cay'?' — '+TEN_DT.cay:'')+'</option>').join('')+'</select>'
  +(veCayKT(BLF.lyDo)?'<div class="ro" style="margin-top:6px">🔀 Loại phân loại nằm ở <b>cấp nhóm</b> <i>(câu con không gắn cây riêng — §3.1)</i> nên <b>không phải chỉ đích danh câu con</b>. '
   +'Báo cáo này <b>không bật cờ ⚑</b>, <b>không chặn nhóm vào đề mới</b> — nó sinh một đề xuất sửa cây gửi <b>M12.4</b> <i>(C5)</i>.</div>':'')
  +'<label class="lbl"'+(veCayKT(BLF.lyDo)?' style="opacity:.45"':'')+'>Chỉ đích danh chỗ có vấn đề <span class="req">*</span> <span class="cnt0">ít nhất một — tác giả sửa đúng chỗ</span></label><div class="bldoi"'+(veCayKT(BLF.lyDo)?' style="opacity:.45"':'')+'>'
  +'<label class="kchk"><input type="checkbox" data-bldoi="_nl"'+(BLF.doi.has('_nl')?' checked':'')+'> 📄 <b>Ngữ liệu</b> <span class="cnt0">'+esc(n.nguLieu.slice(0,60))+'…</span></label>'
  +n.con.map((c,i)=>'<label class="kchk"><input type="checkbox" data-bldoi="'+c.id+'"'+(BLF.doi.has(c.id)?' checked':'')+'> <b>Câu '+(i+1)+'</b> <span class="mcode">'+c.id+'</span> · '+esc(tenDang(c.dang))+' <span class="cnt0">'+esc(c.nd.slice(0,60))+'</span></label>').join('')
  +'</div><label class="lbl">Ghi chú <span class="req">*</span> <span class="cnt0">tối đa '+GHI_CHU_MAX+' ký tự</span></label><textarea class="fldi" id="blLy" rows="3" maxlength="'+GHI_CHU_MAX+'" placeholder="Sai ở đâu, đúng phải là gì">'+esc(BLF.ly)+'</textarea>'
  +'<div class="path">Gửi tới: '+(veCayKT(BLF.lyDo)?'<b>M12.4</b> — TTCM của tổ quản môn hoặc PHT chuyên môn duyệt đề xuất sửa cây'
   :(chiaSeRong(n.pv)?nguoiDuyetDuKien(n):'tác giả <b>'+esc(tenNS(n.tg))+'</b> <i>(nhóm dùng riêng — không có người duyệt)</i>')+'. Từ lúc gửi, cờ <b>⚑ Bị báo cáo</b> bật: nhóm <b>không vào được đề mới</b> tới khi xử lý; <b>trạng thái duyệt không đổi</b>')+'.</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn d" id="blGui">⚑ Gửi báo lỗi</button>');
}
function guiBaoLoi(){
 const n=nhomById(BLF.id); BLF.lyDo=$('#blLyDo').value; BLF.ly=$('#blLy').value.trim();
 const cay=veCayKT(BLF.lyDo), L=[];
 if(!BLF.lyDo) L.push('Chưa chọn <b>loại lỗi</b> — không phân loại thì không thống kê và không định tuyến được');
 if(!cay&&!BLF.doi.size) L.push('Chưa chỉ <b>câu con nào</b> (hoặc ngữ liệu) có vấn đề — báo chung cả nhóm thì tác giả không biết sửa chỗ nào, người xử lý không kiểm được');
 if(!BLF.ly) L.push('<b>Ghi chú là bắt buộc</b> — chỉ mỗi loại lỗi thì tác giả không biết sai ở chỗ nào');
 else if(BLF.ly.length>GHI_CHU_MAX) L.push('Ghi chú tối đa <b>'+GHI_CHU_MAX+' ký tự</b> — đang '+BLF.ly.length);
 if(L.length){BLF.loi=L; veBaoLoi(); return}
 /* 🔀 C5 — hai loại phân loại đi thẳng sang M12.4, KHÔNG nằm lại hàng đợi nhóm, KHÔNG bật cờ ⚑ */
 if(cay){const d=sinhDeXuatCay(n,BLF.lyDo,BLF.ly,'nhom');
  ghiLS(n,'Đề xuất sửa phân loại',tenLyDo(BLF.lyDo)+' — '+BLF.ly+' → '+d.id);
  closeM(); BLF=null; ST.sel=n.id; render();
  chan('🔀 Đã chuyển sang M12.4 — không vào hàng đợi nhóm','<b>'+esc(tenLyDo(d.tuBaoCao.loaiLoi))+'</b> không phải lỗi của câu mà là <b>nhóm bị gắn nhầm nhánh</b> — việc sửa nằm ở cây kiến thức, chủ là <b>M12.4</b>.'
   +'<br><br>Đã tạo đề xuất <b>'+d.id+'</b> <i>(cây '+(d.cay==='bs'?'Bộ sách':'Mạch kiến thức')+' · nút đang gắn: '+(d.nut?esc(duongDan(d.nut)):'<b>chưa gắn</b>')+')</i>. Người duyệt giữ nguyên: <b>TTCM của tổ quản môn</b> hoặc <b>PHT chuyên môn</b>.'
   +'<br><br>🛑 Nhóm <b>'+n.id+'</b> <b>KHÔNG</b> mang cờ ⚑ và <b>vẫn vào được đề mới</b>: gắn nhầm nhánh không làm câu sai, chỉ làm ma trận đếm lệch <i>(C5)</i>.',
   lienKet('M12.4','tab=de_xuat&return=M12.6','↗ Mở M12.4'));
  return}
 const doi=['_nl'].concat(n.con.map(c=>c.id)).filter(x=>BLF.doi.has(x));
 n.bl={lyDo:BLF.lyDo,ly:BLF.ly,doi,ai:role,luc:GIO_NAY};
 ghiLS(n,'Báo cáo',doi.map(x=>x==='_nl'?'ngữ liệu':x).join(' · ')+' — '+tenLyDo(BLF.lyDo));
 closeM(); BLF=null; toast('⚑ Đã báo cáo <b>'+n.id+'</b> — cờ bật, nhóm không vào được đề mới; trạng thái duyệt vẫn là <b>'+TT_DUYET[n.tt]+'</b>'); render();
}
/* ✓ BÁC BÁO CÁO — giữ nguyên nhóm, GỠ CỜ ⚑; trục duyệt không bị chạm ⇒ nhóm về ĐÚNG trạng thái cũ (C1) */
function moBacBL(id){
 const n=nhomById(id);
 if(!n.bl) return toast('Nhóm không còn báo cáo nào đang mở.');
 if(!xuLyDuocBaoCao(n)) return chan('Không xử lý được báo cáo này',viDaoKhongXuLy(n),laTG(n)?'<button class="btn p" data-ed="'+id+'">✏ Sửa theo báo cáo</button>':'');
 const ttCu=TT_DUYET[n.tt];
 mfns.bbacxn=()=>{const v=($('#bacLy')||{}).value||''; if(!v.trim()){$('#bacLoi').innerHTML='<div class="danger">⛔ Lý do bác là <b>bắt buộc</b> — người báo cần biết vì sao không sửa.</div>';return}
  closeM(); n.blDaXuLy.push(Object.assign({},n.bl,{ketQua:'Bác — '+v.trim(),xlAi:role,xlLuc:GIO_NAY})); n.bl=null; ghiLS(n,'Bác báo cáo',v.trim());
  ST.cd=null; toast('✓ Đã bác báo cáo <b>'+id+'</b> — cờ ⚑ tắt, nhóm về đúng <b>'+ttCu+'</b> (không duyệt lại); vào đề mới được trở lại'); render()};
 modal('✓ Bác báo cáo '+id,'<div class="ro"><b>'+esc(tenLyDo(n.bl.lyDo))+'</b> — «'+esc(n.bl.ly)+'» · '+esc(tenAi(n.bl.ai))+'</div>'
  +'<div class="ro">Bác = <b>giữ nguyên nhóm, gỡ cờ ⚑</b>. Nhóm đang ở trạng thái duyệt <b>'+ttCu+'</b> và sẽ <b>trở về đúng trạng thái đó</b> — '
  +'cờ báo cáo là trục riêng, không chạm vào trục duyệt, nên <b>không phải duyệt lại từ đầu</b> <i>(C1)</i>.</div>'
  +'<div id="bacLoi"></div><label class="lbl">Lý do bác <span class="req">*</span></label><textarea class="fldi" id="bacLy" rows="3"></textarea>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="bacxn">✓ Bác báo cáo</button>');
}
/* ✎ «Sửa rồi gỡ cờ» trên nhóm CHIA SẺ: người xử lý không sửa hộ được (quy tắc 5) ⇒ giao việc sửa cho tác giả,
   cờ ⚑ tự gỡ khi bản sửa được duyệt. Nhóm dùng riêng thì người xử lý chính là tác giả ⇒ đi thẳng vào màn soạn. */
function xacNhanBaoCao(id){
 const n=nhomById(id);
 if(!n||!n.bl) return;
 if(!xuLyDuocBaoCao(n)) return chan('Không xử lý được báo cáo này',viDaoKhongXuLy(n));
 if(laTG(n)||role==='FULL'){closeM(); moSoan(id); return}
 n.bl.xn={ai:role,luc:GIO_NAY}; ghiLS(n,'Xác nhận báo cáo','chuyển tác giả sửa');
 closeM(); ST.cd=null; render();
 toast('✎ Đã chuyển tác giả sửa <b>'+id+'</b> — '+esc(tenNS(n.tg))+' nhận việc; cờ ⚑ còn bật tới khi bản sửa được duyệt.');
}
/* ══ ✕ HỦY NHÓM — kết luận CUỐI của người xử lý báo cáo (C4) ══ */
function moHuyNhom(id){
 const n=nhomById(id);
 if(!n||!n.bl) return toast('Nhóm không có báo cáo nào đang mở — hủy là một KẾT LUẬN của việc xử lý báo cáo, không phải nút dọn kho.');
 if(daHuy(n)) return toast('Nhóm đã hủy rồi.');
 if(!xuLyDuocBaoCao(n)) return chan('Không hủy nhóm được',viDaoKhongXuLy(n));
 const ds=deCoNhom(id), dd=ds.filter(d=>deDaSuDung(d.id));
 mfns.bhuyxn=()=>{const v=($('#huyLy')||{}).value||'';
  if(!v.trim()){$('#huyLoi').innerHTML='<div class="danger">⛔ <b>Lý do hủy là bắt buộc</b> — bản ghi ở lại vĩnh viễn, người tra sau phải đọc được vì sao nó bị hủy.</div>';return}
  closeM();
  n.blDaXuLy.push(Object.assign({},n.bl,{ketQua:'Hủy nhóm — '+v.trim(),xlAi:role,xlLuc:GIO_NAY}));
  n.bl=null; n.banCho=null; n.huy={ai:role,luc:GIO_NAY,ly:v.trim()};
  ghiLS(n,'Hủy nhóm',v.trim());
  ST.cd=null; ST.huy=true; ST.tab='nh'; ST.sel=id; ST.hl=id; render();
  toast('✕ Đã hủy <b>'+id+'</b> — trạng thái cuối. Không xóa khỏi ngân hàng: tìm lại bằng chip <b>✕ Gồm nhóm đã hủy</b>.')};
 modal('✕ Hủy nhóm '+id,'<div class="ro"><b>'+esc(tenLyDo(n.bl.lyDo))+'</b> — «'+esc(n.bl.ly)+'» · '+esc(tenAi(n.bl.ai))+'</div>'
  +'<div class="ro">Hủy là kết luận <b>nhóm hỏng, không sửa được</b>. Sau khi hủy:'
  +'<ul style="margin:6px 0 0 18px"><li><b>Không xóa</b> khỏi ngân hàng — bản ghi ở lại để giải trình đề và bài làm cũ <i>(quy tắc 4)</i>, tìm lại bằng chip <b>✕ Gồm nhóm đã hủy</b>.</li>'
  +'<li><b>Không sửa, không dùng lại</b> — khác hẳn <b>⏸ Ngưng dùng</b> <i>(ngưng là tạm rút một nhóm còn ĐÚNG, ▶ Dùng lại bất cứ lúc nào)</i>.</li>'
  +'<li><b>Không vào đề mới.</b> '+ds.length+' đề đang có nhóm <b>giữ nguyên</b>'+(dd.length?' <i>('+dd.length+' đã sử dụng — không rút nhóm, không hủy lượt: học sinh đã làm rồi, C3)</i>':'')+': '+deDangDung(n)+'</li></ul></div>'
  +'<div id="huyLoi"></div><label class="lbl">Lý do hủy <span class="req">*</span></label><textarea class="fldi" id="huyLy" rows="3" placeholder="Vì sao nhóm này không sửa được"></textarea>',
  '<button class="btn" data-mb="close">Hủy bỏ</button><button class="btn d" data-mb="huyxn">✕ Hủy nhóm</button>');
}

/* ── ⇄ PHẠM VI · 📤 GỬI DUYỆT — nguồn ngữ liệu bắt buộc khi rời «Chỉ tôi» ── */
let PVF=null;
function moPhamVi(id){
 const n=nhomById(id), ly=lyDoKhongSua(n);
 if(ly) return chan('Không đổi phạm vi được',ly);
 PVF={id,pv:n.pv,cs:n.chiaSe.slice()}; vePhamVi();
}
function vePhamVi(){
 const n=nhomById(PVF.id);
 modal('⇄ Phạm vi chia sẻ — '+n.id,'<div class="path" style="margin:0 0 8px">Hiện tại: <b>'+PHAM_VI[n.pv]+'</b> · '+TT_DUYET[n.tt]+'. Chia sẻ chỉ trao <b>quyền dùng</b> — xem · đưa vào đề · nhân bản <i>(quy tắc 5)</i>.</div>'
  +Object.keys(PHAM_VI).map(k=>'<label class="kchk" style="display:flex;margin:6px 0"><input type="radio" name="pvr" value="'+k+'"'+(PVF.pv===k?' checked':'')+'> <b>'+PHAM_VI[k]+'</b> <span class="cnt0">'
   +({toi:'dùng riêng — không duyệt',nguoi:'chia sẻ đích danh — không duyệt',to:'tổ quản môn — phải duyệt',truong:'mọi giáo viên — phải duyệt'})[k]+'</span></label>').join('')
  +(PVF.pv==='nguoi'?'<div class="csw">'+Object.keys(NS).filter(k=>k!=='FULL'&&k!==n.tg).map(k=>'<label class="kchk"><input type="checkbox" data-pvcs="'+k+'"'+(PVF.cs.includes(k)?' checked':'')+'> '+esc(NS[k])+'</label>').join('')+'</div>':'')
  +'<div class="path">Rời «Chỉ tôi» thì <b>nguồn ngữ liệu bắt buộc</b> <i>(HL-12)</i>. Tổ / Toàn trường → gửi duyệt: '+nguoiDuyetDuKien(n)+'.</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" id="pvXN">Áp dụng</button>');
}
function apPhamVi(id,pv,cs){
 const n=nhomById(id);
 if(pv!=='toi'){const t=thieuNguon(n); if(t.length){closeM();
  return chan('Thiếu nguồn ngữ liệu — chưa chia sẻ được','<b>Nguồn ngữ liệu</b> là trường bắt buộc khi nhóm rời «Chỉ tôi» <i>(HL-12)</i> — nhóm '+n.id+' vẫn ở <b>'+PHAM_VI[n.pv]+'</b>.<ul style="margin:6px 0 0 18px">'+t.map(x=>'<li>'+x+'</li>').join('')+'</ul>',
   '<button class="btn p" data-edng="'+id+'|'+pv+'">✏ Mở soạn — điền nguồn</button>')}}
 if(pv==='nguoi'&&!cs.length) return toast('Chọn ít nhất một người để chia sẻ đích danh.');
 if(chiaSeRong(pv)){const mk=mayKiem(n,'moi').filter(x=>x[0]==='x'); if(mk.length){closeM(); return chan('Chưa gửi duyệt được','Máy kiểm không đạt: '+mk.map(x=>x[1]).join('; '),'<button class="btn p" data-ed="'+id+'">✏ Sửa</button>')}}
 const cu=n.pv; closeM();
 if(chiaSeRong(pv)){if(!(n.tt==='duyet'&&cu===pv)){n.tt='cho';n.guiLuc=GIO_NAY;n.traLai=null}}
 else {const khac=deChuaDung(n.id).filter(d=>d.tg!==n.tg); n.tt='rieng'; n.banCho=null; if(khac.length) toast('⚠ Nhóm đang trong '+khac.length+' đề chưa dùng của người khác — đề đó giữ nhóm.')}
 n.pv=pv; n.chiaSe=pv==='nguoi'?cs:[];
 ghiLS(n,'Đổi phạm vi',PHAM_VI[cu]+' → '+PHAM_VI[pv]+(n.tt==='cho'?' · gửi duyệt':''));
 ST.hl=id; toast('⇄ <b>'+id+'</b>: '+PHAM_VI[pv]+(n.tt==='cho'?' — đã gửi duyệt':'')); render();
}
function guiDuyet(id){const n=nhomById(id), ly=lyDoKhongSua(n); if(ly) return chan('Không gửi duyệt được',ly); apPhamVi(id,n.pv,n.chiaSe)}

/* ── ⎘ NHÂN BẢN — cách dùng lại / cắt bớt nhóm của người khác mà không sửa bản của họ (quy tắc 5 · F-7) ── */
function nhanBan(id,moSoanLuon){
 const n=nhomById(id);
 if(!can('tao')) return chan('Không nhân bản được','Vai <b>'+esc(R().cd)+'</b> không có quyền <b>Tạo</b>.');
 if(role!=='FULL'&&!laTG(n)&&!dungDuoc(n,role)) return chan('Không nhân bản được','Chỉ nhân bản nhóm <b>bạn dùng được</b> — của mình, hoặc đã duyệt và chia sẻ tới bạn <i>(quy tắc 5)</i>.');
 if(moSoanLuon===undefined){closeM();
  mfns.bnb1=()=>{closeM();nhanBan(id,false)}; mfns.bnb2=()=>{closeM();nhanBan(id,true)};
  return modal('⎘ Nhân bản '+n.id,'Tạo nhóm mới <b>của bạn</b> ở <b>Chỉ tôi · Riêng</b> từ <b>nội dung hiện hành</b> — ngữ liệu, câu con, nguồn, gắn cây chép theo; <b>nhóm gốc không đổi</b>.'
   +'<div class="path">Muốn dùng một phần ngữ liệu hay vài câu con: nhân bản rồi bỏ câu thừa — câu con vẫn không dùng lẻ <i>(F-7)</i>. Nơi tạo ghi «nhân bản từ '+n.id+'».</div>',
   '<button class="btn" data-mb="close">Hủy</button><button class="btn" data-mb="nb1">⎘ Nhân bản</button><button class="btn p" data-mb="nb2">⎘ Nhân bản và mở soạn</button>');
 }
 const ma=maMoiNhom(), c=sao(n.con).map((x,i)=>Object.assign(x,{id:ma+'.'+(i+1)}));
 const m=Object.assign(sao(MAC_DINH_NHOM),{id:ma,mon:n.mon,khoi:n.khoi,ten:n.ten+' (bản sao)',nguLieu:n.nguLieu,tep:sao(n.tep),nguonLoai:n.nguonLoai,nguonCt:n.nguonCt,nguonNam:n.nguonNam,
  bs:n.bs,mach:n.mach,pv:'toi',tt:'rieng',bl:null,tg:role==='FULL'?'FULL':role,ver:1,nam:NAM_HOC,ngung:false,con:c,noiTao:'nhan_ban:'+n.id,taoLuc:GIO_NAY});
 m.nguLieuNguon=chuoiNguon(m); NHOM.push(m);
 ghiLS(m,'Nhân bản','từ '+n.id); ghiAudit('Nhân bản nhóm',n.id+' → '+ma);
 if(moSoanLuon) return moSoan(ma);
 ST.sel=ma; ST.hl=ma; ST.chip='all'; toast('⎘ Đã tạo <b>'+ma+'</b> từ '+n.id); render();
}

/* ── ⏸ NGƯNG · ▶ DÙNG LẠI · 🗑 XÓA (quy tắc 4) ── */
function moNgung(id){
 const n=nhomById(id);
 if(daHuy(n)) return chan('Nhóm đã hủy','<b>Đã hủy</b> là trạng thái cuối — không ngưng, không dùng lại, không sửa <i>(C4)</i>.');
 if(!can('sua')||(!laTG(n)&&role!=='FULL')) return chan('Không ngưng dùng được',!can('sua')?'Vai chỉ có quyền Xem.':'Chỉ tác giả <b>'+esc(tenNS(n.tg))+'</b> ngưng dùng nhóm của mình <i>(chia sẻ không trao sửa — quy tắc 5)</i>. Thấy sai thì ⚑ Báo cáo.');
 const cd=deChuaDung(id).length;
 mfns.bngxn=()=>{const v=($('#ngLy')||{}).value||''; if(!v.trim()){$('#ngLoi').innerHTML='<div class="danger">⛔ Lý do ngưng dùng là <b>bắt buộc</b>.</div>';return}
  closeM(); n.ngung=true; n.ngungLuc=GIO_NAY; n.lyDoNgung=v.trim(); ghiLS(n,'Ngưng dùng',v.trim()); ST.ngung=true; ST.hl=id; toast('⏸ Đã ngưng dùng <b>'+id+'</b> — bật chip «Gồm nhóm ngưng dùng» để thấy lại'); render()};
 modal('⏸ Ngưng dùng '+id,'<div class="ro">Nhóm ngưng dùng <b>không vào được đề mới</b>; đề đã có giữ nguyên'+(cd?' <i>('+cd+' đề chưa sử dụng có nhóm — M12.2 sẽ nhắc xem lại)</i>':'')+'. Mặc định ẩn khỏi danh sách — chip <b>⏸ Gồm nhóm ngưng dùng</b> tìm lại; <b>▶ Dùng lại</b> bất cứ lúc nào.</div>'
  +'<div id="ngLoi"></div><label class="lbl">Lý do <span class="req">*</span></label><textarea class="fldi" id="ngLy" rows="2"></textarea>','<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="ngxn">⏸ Ngưng dùng</button>');
}
function dungLai(id){const n=nhomById(id); if(!can('sua')||(!laTG(n)&&role!=='FULL')) return chan('Không dùng lại được','Chỉ tác giả dùng lại nhóm của mình.');
 n.ngung=false; ghiLS(n,'Dùng lại',''); ST.hl=id; toast('▶ <b>'+id+'</b> dùng lại'); render()}
function moXoa(id){
 const n=nhomById(id);
 if(!can('xoa')||(!laTG(n)&&role!=='FULL')) return chan('Không xóa được',!can('xoa')?'Vai không có quyền Xóa.':'Chỉ tác giả xóa nhóm của mình.');
 const v=vuongXoa(n);
 if(v.length) return chan('Không xóa được '+id+' — nhóm đã được dùng','<ul style="margin:0 0 6px 18px">'+v.map(x=>'<li>'+x+'</li>').join('')+'</ul>Nhóm đã dùng <b>chỉ ngưng dùng</b> — đề đã sử dụng còn chấm, còn giải trình theo nó; có bộ lọc tìm lại <i>(quy tắc 4)</i>.'
  +(deCoNhom(id).length?'<div style="margin-top:6px">'+lienKet('M12.2','tab=ngan_hang_de&nhom='+id,'↗ Xem đề dùng nhóm ở M12.2')+'</div>':''),
  n.ngung?'':'<button class="btn p" data-ngung="'+id+'">⏸ Ngưng dùng thay</button>');
 mfns.bxoaxn=()=>{closeM(); NHOM.splice(NHOM.indexOf(n),1); ghiAudit('Xóa nhóm',id+' — Riêng, chưa vào đề nào'); if(ST.sel===id) ST.sel=null; toast('🗑 Đã xóa <b>'+id+'</b> — nhật ký giữ dòng vết'); render()};
 modal('🗑 Xóa nhóm '+id+'?','Nhóm <b>Riêng</b>, chưa từng vào đề nào, chưa có phiên bản cũ — xóa hẳn <i>(chú thích kiến trúc §9)</i>. Nhật ký thao tác giữ dòng vết.','<button class="btn" data-mb="close">Hủy</button><button class="btn d" data-mb="xoaxn">🗑 Xóa</button>');
}


/* ══════════════ M12.6 — TAB · RENDER · SỰ KIỆN · DEEP-LINK ══════════════ */
const viecCanLam=()=>viecDuyet().length;
/* Tab 1 hiện với mọi vai (vai không quyền: nội dung nói rõ). Tab 2 «Chờ tôi duyệt» CHỈ HIỆN KHI VAI CÓ VIỆC (quy ước khung — CLAUDE.md). */
function tabsOK(){
 const n=viecCanLam();
 return [['nh','1 · Ngân hàng nhóm câu hỏi']].concat(n?[['cd','2 · Chờ tôi duyệt',n]]:[]);
}
function render(){
 rolebar(); header(); tabs();
 if(ST.ed) $('#crumb').innerHTML='<div class="crumb"><a data-vedanhsach="1">Ngân hàng nhóm câu hỏi</a> › <b>'+(ST.ed.moi?'Tạo nhóm mới '+esc(ST.ed.id):esc(ST.ed.id)+' · Soạn / sửa')+'</b>'
  +(ST.ed.tuDe?' <span class="cnt0">· mở từ đề '+esc(ST.ed.tuDe)+' (M12.2)</span>':'')+'</div>';
 else $('#crumb').innerHTML=ST.ret?'<div class="crumb">'+(DA_DUNG.includes(ST.ret)&&FILE_MENU[ST.ret]
  ?'<a href="'+FILE_MENU[ST.ret]+'?vai='+role+'">← Quay lại '+esc(ST.ret)+'</a>':'<span>← mở từ '+esc(ST.ret)+'</span>')+'</div>':'';
 $('#content').innerHTML=ST.ed?veSoan():ST.tab==='cd'?veChoDuyet():veNganHang();
 $('#btnNote').classList.toggle('on',!document.body.classList.contains('nn'));
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(document.body.classList.contains('nn')?'TẮT':'BẬT');
 if(ST.hl){const r=$('.hrow.hlr'); if(r&&r.scrollIntoView&&!ST._daCuon){r.scrollIntoView({block:'nearest'}); ST._daCuon=true}}
}
function doiTab(t){
 const doiVai=ST.roleCu!==role;
 if(doiVai){ST.roleCu=role; ST.ed=null; ST.sel=null; ST.hl=null; ST.cd=null; ST.cdChon.clear(); ST.chip='all'}
 else if(ST.ed&&t!==ST.tab) ST.ed=null;
 ST.tab=t; ST.cd=null; ST.cdChon.clear(); ST._daCuon=false;
}
function suKien(t,e){
 if(ST.ed&&suKienSoan(t)) return;
 const b=k=>{const x=t.closest('[data-'+k+']'); return x?x.dataset[k]:null};
 let v;
 if(b('vedanhsach')){huySoan();return}
 if((v=b('chip'))){ST.chip=v; ST.sel=null; render(); return}
 if(b('ngungchip')){ST.ngung=!ST.ngung; render(); return}
 if(b('huychip')){ST.huy=!ST.huy; render(); return}
 if((v=b('tk'))){ST.tkMode=v; thongKe(); return}
 if(b('chidem')){toast('Chỉ số lượng — nhóm «Chỉ tôi» / chia sẻ tới người khác không mở được nội dung (TC-13 của M12.4).');return}
 if((v=b('mo'))){ST.sel=v; ST.hl=null; render(); return}
 if(b('dongp')){ST.sel=null; render(); return}
 if((v=b('ed'))){closeM(); moSoan(v); return}
 if((v=b('edng'))){closeM(); const [id,pv]=v.split('|'); moSoan(id,{pv,vao:'nguon',lyDo:'⚠ Nhóm sẽ chia sẻ <b>'+PHAM_VI[pv]+'</b> — điền <b>nguồn ngữ liệu</b> (bắt buộc khi rời «Chỉ tôi») rồi <b>Lưu và gửi duyệt</b>.'}); return}
 if((v=b('pv'))){moPhamVi(v); return}
 if((v=b('gui'))){guiDuyet(v); return}
 if((v=b('bl'))){moBaoLoi(v); return}
 if((v=b('bldoi'))){BLF.doi.has(v)?BLF.doi.delete(v):BLF.doi.add(v); return}
 if(t.id==='blGui'){guiBaoLoi(); return}
 if((v=b('thuhoi'))){closeM(); moThuHoi(v); return}
 if((v=b('bacbl'))){moBacBL(v); return}
 if((v=b('xnbl'))){xacNhanBaoCao(v); return}
 if((v=b('huy'))){closeM(); moHuyNhom(v); return}
 if((v=b('nb'))){nhanBan(v); return}
 if((v=b('ngung'))){closeM(); moNgung(v); return}
 if((v=b('dunglai'))){dungLai(v); return}
 if((v=b('xoa'))){moXoa(v); return}
 if((v=b('duyet'))){closeM(); duyet(v); return}
 if((v=b('tralai'))){closeM(); moTraLai(v); return}
 if((v=b('xemtep'))){xemTep(v); return}
 if((v=b('taitep'))){ghiAudit('Tải tệp ngữ liệu',v); toast('⬇ Tải <b>'+esc(v)+'</b> (demo) — lượt tải ghi nhật ký'); return}
 if((v=b('xemban'))){const [id,x]=v.split('|'); xemBan(id,x); return}
 if((v=b('hs'))){xemNhuHS(v); return}
 if((v=b('pvcs'))){PVF.cs.includes(v)?PVF.cs.splice(PVF.cs.indexOf(v),1):PVF.cs.push(v); return}
 if(t.id==='pvXN'){apPhamVi(PVF.id,PVF.pv,PVF.cs); return}
 /* tab 2 */
 if((v=b('cdchip'))){ST.cdChip=v; ST.cd=null; render(); return}
 const cb=t.closest('[data-cdcb]'); if(cb){const k=cb.dataset.cdcb; cb.checked?ST.cdChon.add(k):ST.cdChon.delete(k); render(); return}
 const ca=t.closest('[data-cdall]'); if(ca){const ds=viecDuyet().filter(x=>x.loai!=='bl'&&(!ST.cdChip||ST.cdChip==='all'||x.loai===ST.cdChip)); if(ca.checked) ds.forEach(x=>ST.cdChon.add(x.k)); else ST.cdChon.clear(); render(); return}
 if((v=b('viec'))){closeM(); ST.tab='cd'; ST.cd=v; render(); return}
 if(b('dongcd')){ST.cd=null; render(); return}
 if(t.id==='btnDuyetLoat'){duyetLoat(); return}
 /* thanh công cụ tab 1 */
 if(t.id==='btnTao'){moSoan(null); return}
 if(t.id==='btnTK'){thongKe(); return}
 if(t.id==='btnXuat'){xuat(); return}
 if(t.id==='taiXuat'){ghiAudit('Xuất danh sách nhóm câu',locNhom().length+' dòng'); closeM(); toast('⬇ Đã tải <b>danh-sach-nhom-cau.xlsx</b> (demo) — ghi nhật ký'); return}
 /* bấm vào dòng (không trúng nút) = mở / đóng panel */
 if((v=b('row'))&&!t.closest('button,a,input,select')){ST.sel=ST.sel===v?null:v; ST.hl=null; render(); return}
}
document.addEventListener('input',e=>{
 if(e.target.id==='qnh'){ST.q=e.target.value; const p=e.target.selectionStart; render(); const el=$('#qnh'); if(el){el.focus();el.setSelectionRange(p,p)}}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='cmon'){ST.mon=t.value; ST.sel=null; render(); return}
 if(t.id==='ckhoi'){ST.khoi=t.value; ST.sel=null; render(); return}
 if(t.name==='pvr'&&PVF){PVF.pv=t.value; vePhamVi(); return}
 if(t.id==='blLyDo'&&BLF){BLF.lyDo=t.value; BLF.ly=($('#blLy')||{}).value||BLF.ly; veBaoLoi(); return}
});
/* ── deep-link D3 vào menu này (kiến trúc §8 · prompt M12.6) ──
   ?ctx={nhóm | câu con}&return=M12.5|M12.2      — mở panel nhóm (câu con: mở nhóm chứa nó)
   ?tab=cho_duyet                                 — M0.2 Việc cần làm
   ?action=tao&ctx=de:{id đề}&return=M12.2        — cửa vào thứ hai (quy tắc 16): nhóm mới «Chỉ tôi · Riêng», nơi tạo = đề */
(function moTuLienKet(){
 const MAP={ngan_hang_nhom_cau:'nh',cho_duyet:'cd',nh:'nh',cd:'cd'};
 const tb=QS.get('tab'), cx=QS.get('ctx')||'', ac=QS.get('action');
 ST.roleCu=role; ST.ret=QS.get('return');
 if(MAP[tb]) ST.tab=MAP[tb];
 let sau=null;
 if(ac==='tao'){
  const idDe=cx.startsWith('de:')?cx.slice(3):null, de=idDe&&deById(idDe);
  if(!de) sau=()=>chan('Không mở được cửa tạo nhóm','Liên kết thiếu đề hợp lệ <i>(ctx=de:{mã đề})</i>.');
  else if(deDaSuDung(idDe)) sau=()=>chan('Đề '+idDe+' đã sử dụng — đóng băng','Đề đã sử dụng không thêm được nhóm <i>(quy tắc 2)</i> — nhân bản đề ở M12.2 rồi tạo nhóm từ bản sao.');
  else if(role!=='FULL'&&de.tg!==role) sau=()=>chan('Không phải đề của bạn','Đề <b>'+idDe+'</b> của '+esc(tenNS(de.tg))+' — chỉ tác giả đề thêm nhóm vào đề.');
  else sau=()=>moSoan(null,{tuDe:idDe,mon:de.mon,khoi:de.khoi});
 } else if(cx){
  const id=cx.split('.')[0], n=nhomById(id);
  if(!n) sau=()=>chan('Không tìm thấy nhóm','Không có nhóm <b>'+esc(cx)+'</b> — có thể đã bị xóa (chỉ nhóm Riêng chưa vào đề nào mới xóa được).');
  else if(thayND(n)){ST.tab='nh'; ST.sel=id; ST.hl=id; if(n.ngung) ST.ngung=true}
  else {const v=viecDuyet().find(x=>x.n.id===id);
   if(v){ST.tab='cd'; ST.cd=v.k}
   else sau=()=>chan('Không xem được nội dung nhóm '+id,'Nhóm <b>'+id+'</b> phạm vi <b>'+PHAM_VI[n.pv]+'</b>'+(n.pv==='toi'?' của '+esc(tenNS(n.tg)):'')+(n.tt!=='duyet'&&chiaSeRong(n.pv)?' · '+TT_DUYET[n.tt]:'')
    +' — vai của bạn chỉ thấy <b>số lượng</b> trong số đếm, không thấy nội dung <i>(TC-13 của M12.4 · quy tắc 5)</i>.');}
 }
 render();
 if(sau) sau();
})();
</script>
