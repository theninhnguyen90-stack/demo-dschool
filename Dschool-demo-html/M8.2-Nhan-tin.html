<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M8.2 Nhắn tin — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.lockic{font-size:11px;color:var(--ink3);margin-left:-8px}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 30px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:12px;flex-wrap:wrap;line-height:1.6}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber);background:var(--amber-soft);color:#92400e}
.scope.am b{color:#7c2d12}
.scope.rd{border-left-color:var(--red);background:var(--red-soft);color:#991b1b}
.scope.rd b{color:#7f1d1d}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:230px}
.qf{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;background:#fff;display:inline-flex;align-items:center;gap:6px}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.qf .c{background:var(--bg);color:var(--ink2);font-size:10.5px;font-weight:700;padding:0 6px;border-radius:9px}
.qf.on .c{background:rgba(255,255,255,.28);color:#fff}
.qf .c.al{background:var(--red);color:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px;line-height:1.6}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2);white-space:nowrap}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.eye{font-size:11px;color:var(--brand);border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:1px 7px}

/* ===== CHAT ===== */
.chatw{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:11px;height:calc(100vh - 268px);min-height:440px}
.cvlist{flex:0 0 38%;max-width:340px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.cvhead{padding:8px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.cvscroll{overflow-y:auto;flex:1}
.cvrow{display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;border-left:3px solid transparent}
.cvrow:hover{background:var(--brand-soft)}
.cvrow.on{background:#eff6ff;border-left-color:var(--brand)}
.cvav{width:36px;height:36px;border-radius:50%;flex:0 0 36px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;background:var(--violet)}
.cvav.g{background:var(--brand);border-radius:11px}
.cvtx{flex:1;min-width:0}
.cvtx .n{font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.cvtx .n .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvtx .s{font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvtx .l{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.cvmeta{text-align:right;flex:0 0 auto;font-size:10.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.unread{background:var(--brand);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center}

.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.chdr{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;background:#fcfdfe}
.chdr .t{flex:1;min-width:0}
.chdr .t b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chdr .t span{font-size:11.5px;color:var(--ink2)}
.pinbar{background:#fffbeb;border-bottom:1px solid #fde68a;padding:6px 13px;font-size:12px;color:#92400e}
.pinbar .pi{display:flex;gap:7px;align-items:center;padding:2px 0;cursor:pointer}
.pinbar .pi .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody{flex:1;overflow-y:auto;padding:13px;background:#f8fafc}
.day{text-align:center;font-size:10.5px;color:var(--ink3);margin:10px 0 8px}
.day span{background:#e2e8f0;padding:2px 11px;border-radius:999px}
.msg{display:flex;margin-bottom:9px;gap:7px}
.msg.me{justify-content:flex-end}
.mav{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;background:var(--ink3);margin-top:14px}
.bwrap{max-width:74%;min-width:0}
.mfrom{font-size:11px;color:var(--ink2);font-weight:600;margin-bottom:2px}
.bub{background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:8px 11px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;position:relative}
.msg.me .bub{background:#dbeafe;border-color:#bfdbfe;border-radius:12px 12px 3px 12px}
.bub.pin{box-shadow:0 0 0 2px #fcd34d}
.mmeta{font-size:10.5px;color:var(--ink3);margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.msg.me .mmeta{justify-content:flex-end}
.mdots{opacity:.55;font-size:12px;color:var(--ink3);padding:0 4px;align-self:center}
.msg:hover .mdots{opacity:1;color:var(--brand)}
.quote{border-left:3px solid var(--brand);background:rgba(29,78,216,.06);border-radius:5px;padding:5px 9px;font-size:11.5px;color:var(--ink2);margin-bottom:6px;white-space:pre-wrap}
.quote b{display:block;font-size:10.5px;color:var(--brand)}
.sysline{text-align:center;font-size:11px;color:var(--ink3);margin:9px 0;line-height:1.6}
.sysline span{background:#e2e8f0;padding:3px 11px;border-radius:999px;display:inline-block;max-width:92%}
.mtep{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;background:#fcfdfe;margin-top:5px}
.mtep .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrep{font-size:10.5px;color:var(--amber);margin-top:3px;font-weight:600}
.cfoot{border-top:1px solid var(--line);padding:9px 13px;background:#fff}
.cbox{display:flex;gap:7px;align-items:flex-end}
.cta{flex:1;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:13px;min-height:38px;max-height:110px;resize:none;font-family:inherit;line-height:1.5}
.cta:focus{border-color:var(--brand);outline:none}
.cta:disabled{background:var(--bg);color:var(--ink3);cursor:not-allowed}
.chint{font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.55}
.chint.am{color:#92400e}
.side2{flex:0 0 300px;border-left:1px solid var(--line);display:none;flex-direction:column;min-width:0}
.chatw.p2 .side2{display:flex}
@media(max-width:1180px){.chatw.p2 .cvlist{display:none}}
@media(max-width:900px){.chatw.open .cvlist{display:none}}
.s2h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#f8fafc;font-weight:700;font-size:13px}
.s2b{overflow-y:auto;flex:1;padding:10px 12px}
.mrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mrow:last-child{border-bottom:none}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .tx span{font-size:11px;color:var(--ink3)}
.mrow.gone{opacity:.55}

.lrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);align-items:center;font-size:13px;border-left:3px solid transparent}
.lrow:hover{background:var(--brand-soft)}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.grow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}
.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:11px}
.gdb{grid-template-columns:2fr 1.5fr .85fr 1.1fr .85fr}
.gnc{grid-template-columns:2fr .95fr 1.25fr .8fr .85fr 1fr}

.gsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:11px}
.gsec h3{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gf{margin-bottom:12px}
.gf label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.gf label b{color:var(--red)}
.gf .hint{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.55}
.ti{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;background:#fff}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;min-height:64px;resize:vertical;font-family:inherit}
.ti.err,.ta.err{border-color:var(--red);background:var(--red-soft)}
.sw{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:none}
.sw .tx{flex:1;min-width:0}
.sw .tx b{display:block;font-size:13px}
.sw .tx span{font-size:11.5px;color:var(--ink2);line-height:1.55;display:block;margin-top:2px}
.tg{width:42px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 42px;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--green)}
.tg.on::after{left:21px}
.tg.dis{opacity:.4;cursor:not-allowed}
.chk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:9px;padding:7px 12px;font-size:12.5px;background:#fff;text-align:left}
.chk.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.chk .bx{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:10px;color:#fff;flex:0 0 15px}
.chk.on .bx{background:var(--brand);border-color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:8px 13px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:760px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 26px rgba(15,23,42,.16);z-index:70;padding:5px;display:none;min-width:210px}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:7px;font-size:12.5px;text-align:left}
.menu button:hover{background:var(--brand-soft)}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu .no{padding:6px 10px;font-size:11px;color:var(--ink3);line-height:1.5}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.rb.dt{border-color:#475569;color:#94a3b8}
.rb.dt.on{background:#fbbf24;color:#0f172a;border-color:#fbbf24}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.tos{max-height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fcfdfe;font-size:13px;line-height:1.75}
.tos h4{font-size:13px;margin:12px 0 5px}
.tos h4:first-child{margin-top:0}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="GVCN">GVCN</button>
  <button class="rb" data-r="GVBM">GVBM</button>
  <button class="rb" data-r="PHT">PHT_CM kiêm GVBM</button>
  <button class="rb" data-r="HT">HT không dạy lớp nào</button>
  <span style="margin-left:12px;padding-left:12px;border-left:1px solid #334155">Tình huống:</span>
  <button class="rb dt on" data-s="binh">Bình thường</button>
  <button class="rb dt" data-s="dieu">Chưa đồng ý điều khoản</button>
  <button class="rb dt" data-s="khoa">Bị khóa gửi tin</button>
  <button class="rb dt" data-s="dem">21:30 — ngoài giờ</button>
  <span class="note">Tin nhắn <b>không sửa, không xóa</b> · học sinh <b>không tham gia</b> chat</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>

 ['hs','👥 Học sinh',[['M1.1','Hồ sơ học sinh'],['M1.7','Lớp học & Chuyển lớp']]],
 ['lop','📚 Lớp học hàng ngày',[['M2.1','Lịch dạy & học'],['M2.2','Sổ đầu bài'],['M2.5','Bảng điểm môn học'],['M2.9','Không gian lớp học']]],
 ['ns','👨‍🏫 Nhân sự',[['M4.1','Hồ sơ nhân sự'],['M4.7','Lịch giảng dạy'],['M4.8','Nghỉ phép']]],
 ['cm','📖 Chuyên môn',[['M5.1','Kế hoạch giảng dạy'],['M5.2','Giáo án']]],
 ['gt','💬 Giao tiếp',[['M8.1','Thông báo chủ động'],['M8.2','Nhắn tin'],['M8.3','Xử lý vi phạm chat']]],
 ['qt','⚙️ Quản trị',[['M10.1','Hồ sơ năm học'],['M10.6','Trung tâm cấu hình']]]];
const NAVOK={FULL:['hs','lop','ns','cm','gt'],GVCN:['hs','lop','ns','gt'],GVBM:['lop','ns','cm','gt'],
 PHT:'all',HT:'all'};
/* M8.3 AN HAN voi giao vien — ngoai le co chu dich cua quy uoc "lam mo" (R4).
   M8.2 khong co trong sidebar cua nguoi khong day lop nao (§3).                    */
/* M8.3 chi thuoc HT va PHT_DT. PHT_CM khong co. Trong demo nay chi vai HT thay. */
function hideOf(){const h=[];if(role!=='HT')h.push('M8.3');if(!coMenu())h.push('M8.2');return h}
function sidebar(){
 const a=NAVOK[role],full=a==='all',hide=hideOf();
 $('#side').innerHTML=NAV.map(function(g){
  const on=full||g[0]===''||a.indexOf(g[0])>=0;
  const items=g[2].filter(it=>hide.indexOf(it[0])<0);
  if(!items.length)return '';
  return '<div class="sgrp">'+g[1]+'</div>'+items.map(function(it){
   const cu=it[0]==='M8.2',nb=cu?tongChuaDoc():(it[2]||0);
   return '<div class="snav '+(cu?'on':'')+' '+(on?'':'off')+'">'+
    '<span style="font-size:10.5px;opacity:.55;min-width:30px">'+it[0]+'</span>'+
    '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+it[1]+'</span>'+
    (nb?'<span class="nb">'+nb+'</span>':'')+'</div>'}).join('')}).join('');
}
function header(){
 const r=R();$('#ava').textContent=r.ava;
 $('#hdt').innerHTML='<option>'+r.dt+'</option>';
 const n=tongChuaDoc();$('#cdot').textContent=n;$('#cdot').style.display=n?'grid':'none';
}
</script>
<script>
"use strict";
/* ============ KHUNG MAN HINH ============ */
function tabsOf(){
 const t=[['cv','Cuộc trò chuyện',tongChuaDoc(),true],['db','Danh bạ',0,false]];
 if(cuCua().length)t.push(['cu','Nhóm lớp năm cũ',cuCua().length,false]);
 t.push(['cd','⚙ Cài đặt chat của tôi',0,false]);
 return t;
}
function render(){
 sidebar();header();
 if(!coMenu()){$('#content').innerHTML=vKhongCoMenu();return}
 if(tinhHuong==='dieu'){$('#content').innerHTML=vChoDongY();return}
 const ts=tabsOf();
 if(!ts.some(x=>x[0]===V.tab))V.tab='cv';
 let h='<div class="tophd"><h1>💬 Nhắn tin</h1><span class="pill">M8.2</span>'+
  '<span class="pill">Không sửa · Không xóa</span><span class="pill">Học sinh không tham gia</span></div>';
 h+='<div class="tabs">'+ts.map(function(t){
   return '<button class="tab1 '+(V.tab===t[0]?'on':'')+'" data-tab="'+t[0]+'">'+t[1]+
    (t[2]?'<span class="b '+(t[3]?'al':'')+'">'+t[2]+'</span>':'')+'</button>'}).join('')+'</div>';
 h+=scopeBar();
 h+=V.tab==='cv'?vCV():V.tab==='db'?vDB():V.tab==='cu'?vCU():vCD();
 $('#content').innerHTML=h;
 const b=$('#cbody');if(b)b.scrollTop=b.scrollHeight;
}
function vKhongCoMenu(){
 return '<div class="tophd"><h1>💬 Nhắn tin</h1><span class="pill">M8.2</span></div>'+
  '<div class="listw" style="padding:0"><div class="empty" style="padding:46px 30px">'+
  '<b>Menu này không có trong sidebar của bạn</b>'+
  '<div style="max-width:620px;margin:0 auto;text-align:left;line-height:1.75">'+
  'Quyền vào M8.2 <b>suy từ phân công giảng dạy ở M4.5</b>, không suy từ chức danh quản lý. '+
  'Bạn hiện <b>không chủ nhiệm lớp nào và không có phân công dạy lớp nào</b> trong năm học 2026-2027, nên không có tư cách tham gia cuộc trò chuyện nào.<br><br>'+
  'Nếu năm sau bạn nhận dạy dù chỉ 2 tiết một tuần, menu này sẽ xuất hiện ngay — với tư cách <b>giáo viên bộ môn của đúng những lớp đó</b>.<br><br>'+
  'Cửa của Ban giám hiệu với mảng chat là <b>M8.3 Xử lý vi phạm chat</b>, gồm hai việc: nhận báo cáo tin vi phạm và khóa quyền gửi tin của tài khoản vi phạm.'+
  '</div></div></div>'+
  '<div class="ro" style="margin-top:12px">Màn hình này chỉ có trong bản demo để bạn thấy hệ quả. Trên hệ thống thật, vai này <b>không nhìn thấy mục M8.2</b> trên sidebar — kiểm tra bằng cách nhìn sidebar bên trái ngay bây giờ.</div>';
}
function scopeBar(){
 const r=R();
 let h='<div class="scope"><span>💬</span><span class="sp">Bạn đang ở M8.2 với tư cách <b>'+r.ct+'</b> — '+r.me+'. Phạm vi: <code>'+r.sc+'</code>. '+r.scT+'</span></div>';
 if(biKhoa())h='<div class="scope rd"><span>🔒</span><span class="sp"><b>Tài khoản của bạn đang bị khóa quyền gửi tin.</b> Lý do: <i>“Nhắn tin nhiều lần ngoài giờ với nội dung không phù hợp”</i> · Thời hạn: <b>7 ngày, tới hết 26/11/2026</b> · Người khóa: <b>Nguyễn Quốc Đạt — Hiệu trưởng</b> (M8.3 — chỉ Hiệu trưởng khóa được tài khoản giáo viên). Bạn <b>vẫn đọc được toàn bộ tin cũ</b>, chỉ không gửi tin mới.</span></div>'+h;
 if(V.tab!=='cu')h+='<div class="scope am"><span>⚠</span><span class="sp">Ba tab <b>Cuộc trò chuyện</b>, <b>Danh bạ</b> và <b>Cài đặt</b> luôn hiển thị <b>năm học hiện hành 2026-2027</b> — bộ chọn năm học ở header không có tác dụng. Nhóm chat năm cũ nằm ở tab riêng. Bộ chọn <b>Điểm trường</b> khóa chỉ đọc trên toàn menu vì phạm vi của bạn là <i>các lớp bạn dạy</i>, không phải một điểm trường.</span></div>';
 return h;
}
function vChoDongY(){
 return '<div class="tophd"><h1>💬 Nhắn tin</h1><span class="pill">M8.2</span></div>'+
  '<div class="listw"><div class="empty" style="padding:46px 30px"><b>Bạn chưa đồng ý điều khoản sử dụng</b>'+
  'Phải đồng ý điều khoản mới dùng được chức năng nhắn tin.<br><br>'+
  '<button class="btn p" data-x="mo-dk">Đọc điều khoản</button></div></div>';
}

/* ============ F1 · F2 · F3 — CUOC TRO CHUYEN ============ */
function vCV(){
 let ds=cvCua();
 if(V.chip==='chuadoc')ds=ds.filter(c=>c.chuadoc>0);
 if(V.chip==='nhom')ds=ds.filter(c=>c.loai==='nhom');
 if(V.chip==='rieng')ds=ds.filter(c=>c.loai==='rieng');
 const q=kd(V.q);
 if(q)ds=ds.filter(c=>kd((c.ten||c.voi)+' '+(c.lop||'')).indexOf(q)>=0);
 if(!V.cv||!ds.some(c=>c.id===V.cv)){const f=ds.slice().sort((a,b)=>(tinCuoi(b)?tinCuoi(b).t:0)-(tinCuoi(a)?tinCuoi(a).t:0))[0];V.cv=f?f.id:null}
 const cur=CV.find(c=>c.id===V.cv);
 const all=cvCua();
 let h='<div class="bar"><input class="inp" id="q" placeholder="Tìm cuộc trò chuyện…" value="'+esc(V.q)+'">'+
  [['all','Tất cả',all.length],['chuadoc','Chưa đọc',all.filter(c=>c.chuadoc>0).length],
   ['nhom','Nhóm lớp',all.filter(c=>c.loai==='nhom').length],['rieng','Cuộc riêng',all.filter(c=>c.loai==='rieng').length]]
  .map(function(c){return '<button class="qf '+(V.chip===c[0]?'on':'')+'" data-chip="'+c[0]+'">'+c[1]+
    (c[2]?'<span class="c '+(c[0]==='chuadoc'?'al':'')+'">'+c[2]+'</span>':'')+'</button>'}).join('')+
  '<div class="sum"><span>Bộ lọc <code>'+(R().lopCN.length?'Class':'Own')+'</code> — bạn <b>không bao giờ</b> thấy cuộc mình không tham gia</span></div></div>';
 h+='<div class="chatw '+(V.p2?'p2':'')+' open">'+cvList(ds)+(cur?khungChat(cur):'<div class="chat"><div class="empty"><b>Không có cuộc trò chuyện nào</b>Đổi chip lọc, hoặc mở một liên hệ từ tab Danh bạ.</div></div>')+
  (V.p2&&cur?panel2(cur):'')+'</div>';
 return h;
}
function cvList(ds){
 const nhom=ds.filter(c=>c.loai==='nhom'),rieng=ds.filter(c=>c.loai==='rieng')
   .sort((a,b)=>(tinCuoi(b)?tinCuoi(b).t:0)-(tinCuoi(a)?tinCuoi(a).t:0));
 let h='<div class="cvlist"><div class="cvscroll">';
 if(nhom.length){h+='<div class="cvhead">Nhóm lớp</div>'+nhom.map(cvRow).join('')}
 if(rieng.length){h+='<div class="cvhead">Cuộc riêng</div>'+rieng.map(cvRow).join('')}
 if(!ds.length)h+='<div class="empty" style="padding:26px 14px">Không có cuộc nào</div>';
 h+='</div></div>';
 return h;
}
function cvRow(c){
 const m=tinCuoi(c),nh=c.loai==='nhom';
 const ten=nh?c.ten:c.voi;
 const p=nh?null:PH.find(x=>x.t===c.voi);
 const nhan=[];
 if(c.mute)nhan.push('🔕');
 if(nh&&c.tat)nhan.push('⏸');
 if(biKhoa())nhan.push('🔒');
 return '<div class="cvrow '+(V.cv===c.id?'on':'')+'" data-cv="'+c.id+'">'+
  '<div class="cvav '+(nh?'g':'')+'">'+(nh?c.lop:vt(c.voi))+'</div>'+
  '<div class="cvtx"><div class="n"><span class="nm">'+esc(ten)+'</span>'+(nhan.length?'<span style="font-size:10px">'+nhan.join('')+'</span>':'')+'</div>'+
  (p?'<div class="s">'+esc(moTaPH(p))+(c.tucach==='GVBM'?' · bạn dạy '+R().mon:'')+'</div>':'<div class="s">'+c.tv+' phụ huynh · bạn là admin</div>')+
  '<div class="l">'+(m?(m.ai===R().me?'Bạn: ':(nh?esc(m.ai.split(' ').pop())+': ':''))+esc(m.tx).slice(0,52):'')+'</div></div>'+
  '<div class="cvmeta"><span>'+(m?gioNgan(m.t):'')+'</span>'+(c.chuadoc?'<span class="unread">'+c.chuadoc+'</span>':'')+'</div></div>';
}
function khungChat(c){
 const nh=c.loai==='nhom',ad=laAdmin(c),me=R().me;
 const p=nh?null:PH.find(x=>x.t===c.voi);
 const gh=nh?ghimCua(c):[];
 let h='<div class="chat"><div class="chdr">'+
  '<div class="cvav '+(nh?'g':'')+'" style="width:32px;height:32px;flex:0 0 32px;font-size:11px">'+(nh?c.lop:vt(c.voi))+'</div>'+
  '<div class="t"><b>'+esc(nh?c.ten:c.voi)+'</b><span>'+(nh?(c.tv+' phụ huynh · '+(ad?'bạn là <b>admin nhóm</b>':'thành viên'))
    :(esc(moTaPH(p))+' · bạn là <b>'+(c.tucach==='GVCN'?'giáo viên chủ nhiệm':'giáo viên bộ môn '+R().mon)+'</b>'))+'</span></div>';
 if(nh)h+='<button class="btn sm" data-x="tv">👥 Thành viên</button>';
 h+='<button class="btn sm" data-x="cvmenu">⋯</button></div>';
 if(nh&&c.tat)h+='<div class="pinbar" style="background:var(--red-soft);border-color:#fecaca;color:#991b1b">⏸ <b>Nhóm đang tạm tắt</b> tới ngày '+d2s(c.tat)+' — phụ huynh không gửi được tin. '+(ad?'Bạn là admin nên <b>vẫn gửi được</b>.':'')+'</div>';
 if(gh.length)h+='<div class="pinbar">'+gh.map(function(m){
   return '<div class="pi" data-toghim="'+m.id+'"><span>📌</span><span class="tx">'+esc(m.tx.replace(/\n/g,' ')).slice(0,86)+'</span>'+
   (ad?'<button class="btn xs" data-boghim="'+m.id+'">Bỏ ghim</button>':'')+'</div>'}).join('')+'</div>';
 h+='<div class="cbody" id="cbody">'+dongTin(c)+'</div>';
 h+=oSoan(c);
 h+='</div>';
 return h;
}
function dongTin(c){
 const me=R().me,nh=c.loai==='nhom';let h='',ngayTruoc='';
 c.msg.forEach(function(m){
  const nd=nhanNgay(m.t);
  if(nd!==ngayTruoc){h+='<div class="day"><span>'+nd+'</span></div>';ngayTruoc=nd}
  if(m.sys){h+='<div class="sysline"><span>'+esc(m.tx)+'</span></div>';return}
  const la=m.ai===me;
  h+='<div class="msg '+(la?'me':'')+'" data-msg="'+m.id+'">';
  if(la)h+='<button class="mdots" data-mm="'+m.id+'">⋯</button>';
  if(!la)h+='<div class="mav">'+vt(m.ai)+'</div>';
  h+='<div class="bwrap">';
  if(!la&&nh)h+='<div class="mfrom">'+esc(m.ai)+'</div>';
  h+='<div class="bub'+(m.ghim?' pin':'')+'">';
  if(m.quote)h+='<div class="quote"><b>'+esc(m.quote.ai)+'</b>'+esc(m.quote.tx).slice(0,120)+'</div>';
  h+=esc(m.tx);
  if(m.tep)h+='<div class="mtep"><span>📎</span><span class="nm">'+esc(m.tep.ten)+'</span><span style="color:var(--ink3);font-size:11px">'+m.tep.kb+'</span>'+
    '<button class="eye" data-xem="'+esc(m.tep.ten)+'">👁 Xem</button><button class="btn xs" data-tai="'+esc(m.tep.ten)+'">⬇</button></div>';
  h+='</div>';
  h+='<div class="mmeta"><span>'+hm(m.t)+'</span>';
  if(m.ghim)h+='<span class="pill">📌 đã ghim</span>';
  if(la&&nh&&m.doc!==undefined)h+='<button class="rolnk" data-doc="'+m.id+'">Đã đọc '+m.doc+'/'+c.tv+'</button>';
  if(la&&!nh)h+='<span>'+(m.doc?'Đã đọc':'Đã nhận')+'</span>';
  h+='</div>';
  if(m.rep)h+='<div class="mrep">⚠ Bạn đã báo cáo tin này · '+m.rep+' · đang chờ xử lý</div>';
  if(!la)h+='</div><button class="mdots" data-mm="'+m.id+'">⋯</button>';else h+='</div>';
  h+='</div>';
 });
 return h;
}
function oSoan(c){
 const nh=c.loai==='nhom',ad=laAdmin(c);
 let khoa=null;
 if(biKhoa())khoa='Tài khoản của bạn đang bị khóa quyền gửi tin tới hết <b>26/11/2026</b>. Bạn vẫn đọc được toàn bộ tin cũ.';
 else if(nh&&c.tat&&!ad)khoa='Nhóm đang tạm tắt tới ngày '+d2s(c.tat)+'.';
 const gio=HOMNAY.getHours(),ngoai=CD.imTuBat&&(gio>=21||gio<6);
 let h='<div class="cfoot">';
 if(V.quote&&!khoa)h+='<div class="quote" style="margin-bottom:7px;display:flex;gap:8px;align-items:flex-start">'+
   '<span style="flex:1;min-width:0"><b>Trích dẫn '+esc(V.quote.ai)+' — để đính chính</b>'+esc(V.quote.tx).slice(0,130)+'</span>'+
   '<button class="btn xs" data-x="bo-quote">✕</button></div>';
 h+='<div class="cbox">'+
  '<button class="btn sm" data-x="dinhkem" '+(khoa?'disabled':'')+' title="Đính kèm tệp hoặc ảnh">📎</button>'+
  '<textarea class="cta" id="cta" placeholder="'+(khoa?'Không gửi được tin':'Nhập tin nhắn…')+'" '+(khoa?'disabled':'')+'></textarea>'+
  '<button class="btn p" data-x="gui" '+(khoa?'disabled':'')+'>Gửi</button></div>';
 if(khoa)h+='<div class="chint" style="color:var(--red);font-weight:600">🔒 '+khoa+'</div>';
 else{
  h+='<div class="chint" id="chint">Tin đã gửi <b>không sửa và không xóa được</b>.'+
   (ngoai?' <span style="color:#92400e">· <b>Ngoài giờ</b> '+(nh?'với <b>34 trong '+c.tv+'</b> phụ huynh — họ':'— người nhận')+' sẽ không bị đánh thức, tin vẫn tới ngay.</span>':'')+'</div>';
  if(nh&&CD.nhacM81)h+='<div class="chint am" id="cnhac" style="display:none">💡 Tin này trông giống một <b>thông báo</b>. Gửi qua <b>M8.1</b> thì có thống kê giao nhận, có tệp lưu lại và tra được ở cấp trường; gửi ở đây thì trôi trong dòng tin. '+
   '<button class="rolnk" data-x="di-m81">↗ Soạn ở M8.1</button> <button class="rolnk" data-x="tat-nhac">Không nhắc nữa</button></div>';
 }
 h+='</div>';
 return h;
}
/* PANEL TRUOT 1:1 — thanh vien nhom / danh sach chua doc */
function panel2(c){
 if(V.p2==='tv'){
  const ds=phCua(c.lop);
  return '<div class="side2"><div class="s2h"><span>👥 Thành viên nhóm</span><span class="pill">'+(c.tv+1)+'</span>'+
   '<button class="btn xs" data-x="dong2" style="margin-left:auto">✕</button></div><div class="s2b">'+
   '<div class="ro" style="margin-bottom:10px">Danh sách này là <b>bản chiếu chỉ đọc 🔗</b> của danh sách lớp. <b>Không có nút thêm hoặc bớt thành viên</b> — mọi biến động do M1.7, M1.5 và M1.6 sinh ra (§8.2.4).</div>'+
   '<div class="mrow"><div class="cvav" style="width:28px;height:28px;flex:0 0 28px;font-size:9.5px;background:var(--brand)">'+vt(c.gv)+'</div>'+
   '<div class="tx"><b>'+esc(c.gv)+'</b><span>Giáo viên chủ nhiệm · admin nhóm</span></div></div>'+
   ds.map(function(p){
    return '<div class="mrow '+(p.roi?'gone':'')+'"><div class="cvav" style="width:28px;height:28px;flex:0 0 28px;font-size:9.5px">'+vt(p.t)+'</div>'+
    '<div class="tx"><b>'+esc(p.t)+'</b><span>'+esc(moTaPH(p))+(p.roi?' · <b style="color:var(--amber)">đã rời — '+esc(p.roi)+'</b>':'')+'</span></div>'+
    (R().lopCN.indexOf(p.lop)>=0?'<button class="rolnk" data-deep="M1.1">↗ M1.1</button>':'')+'</div>'}).join('')+
   '<div class="ro" style="margin-top:10px">Đang hiện <b>'+ds.length+'</b> phụ huynh có tên trong dữ liệu mẫu; nhóm thật có <b>'+c.tv+'</b>.</div>'+
   '</div></div>';
 }
 if(V.p2&&V.p2.indexOf('doc:')===0){
  const m=c.msg.find(x=>x.id===V.p2.slice(4));if(!m)return '';
  return '<div class="side2"><div class="s2h"><span>Chưa đọc</span><span class="pill">'+(c.tv-m.doc)+'/'+c.tv+'</span>'+
   '<button class="btn xs" data-x="dong2" style="margin-left:auto">✕</button></div><div class="s2b">'+
   '<div class="ro" style="margin-bottom:10px">Chỉ liệt kê <b>người chưa đọc</b>, không liệt kê ai đã đọc lúc mấy giờ. Mục đích con số này là <b>đôn đốc</b>, không phải giám sát (§8.2.6). Panel này <b>chỉ admin nhóm thấy</b>.</div>'+

 '<h4>4. Khi bạn báo cáo một tin vi phạm</h4>'+
 '<p>Chính <b>những tin bạn tích chọn đính kèm</b> sẽ được gửi tới Ban giám hiệu để xem xét. Phần còn lại của cuộc trò chuyện thì không.</p>'+
 '<h4>5. Vi phạm quy tắc thì bị khóa quyền gửi tin</h4>'+
 '<p>Ban giám hiệu có thể khóa quyền gửi tin của tài khoản vi phạm, tạm thời hoặc lâu dài. Tài khoản bị khóa <b>vẫn đọc được toàn bộ tin cũ</b>.</p>'+

<script>
"use strict";
const curCV=()=>CV.find(c=>c.id===V.cv);
function reRender(fid){
 render();
 if(fid){const e=document.querySelector(fid);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(_){}}}
}
function closeMenu(){$('#menu').classList.remove('on')}
function openMenu(x,y,html){const m=$('#menu');m.innerHTML=html;m.classList.add('on');
 const w=m.offsetWidth,h=m.offsetHeight;
 m.style.left=Math.min(x,window.innerWidth-w-10)+'px';
 m.style.top=Math.min(y,window.innerHeight-h-10)+'px';}

/* ============ GUI TIN ============ */
function guiTin(){
 const c=curCV();if(!c||biKhoa())return;
 const ta=$('#cta');const tx=(ta.value||'').trim();
 if(!tx){toast('Chưa có nội dung để gửi');return}
 const m={id:'m'+(++MID),ai:R().me,t:new Date(HOMNAY),tx:tx};
 if(c.loai==='nhom')m.doc=0;else m.doc=0;
 if(V.quote)m.quote=V.quote;
 c.msg.push(m);V.quote=null;
 const gio=HOMNAY.getHours(),ngoai=CD.imTuBat&&(gio>=21||gio<6);
 render();
 toast(ngoai?'✅ Đã gửi — <b>ngoài khung giờ im lặng</b>, người nhận không bị đánh thức, tin vẫn tới ngay'
   :'✅ Đã gửi. Tin này <b>không sửa và không xóa được</b> nữa.');
}

/* ============ MENU NGU CANH CUA MOT TIN ============ */
function menuTin(m,c,x,y){
 const ad=laAdmin(c),la=m.ai===R().me;
 let h='<button data-mtx="chep:'+m.id+'">📋 Sao chép</button>'+
  '<button data-mtx="quote:'+m.id+'">💬 Trích dẫn để đính chính</button>';
 if(ad)h+='<button data-mtx="ghim:'+m.id+'">📌 '+(m.ghim?'Bỏ ghim':'Ghim tin này')+'</button>';
 if(!la)h+='<button data-mtx="bao:'+m.id+'">⚠ Báo cáo vi phạm</button>';
 h+='<div class="sep"></div><div class="no">Không có <b>Sửa</b> và <b>Xóa</b> — đây không phải nút bị ẩn, mà là chức năng không tồn tại (NH8.2 §4.4). Gửi nhầm thì dùng <b>Trích dẫn để đính chính</b>.</div>';
 openMenu(x,y,h);
}

/* ============ BAO CAO VI PHAM ============ */
function hopBaoCao(m,c){
 const idx=c.msg.indexOf(m);
 const lan=c.msg.slice(Math.max(0,idx-3),Math.min(c.msg.length,idx+3)).filter(x=>!x.sys);
 const nh=c.loai==='nhom';
 let h='<div class="'+(nh?'ro':'warn')+'">'+(nh
  ?'Đây là <b>nhóm lớp</b> — môi trường bán công khai, mọi thành viên đều đã đọc được tin này.'
  :'Đây là <b>cuộc riêng</b>. Ban giám hiệu <b>không có chức năng đọc</b> cuộc trò chuyện này trên hệ thống — họ sẽ chỉ thấy đúng những tin bạn tích ở dưới (§8.5.1).')+'</div>';
 h+='<div class="gf"><label>Tin đính kèm theo báo cáo <b>*</b></label><div id="bcds">'+
  lan.map(function(x){
   const on=x.id===m.id;
   return '<button class="chk '+(on?'on':'')+'" data-bc="'+x.id+'" style="display:flex;width:100%;margin-bottom:5px;align-items:flex-start">'+
    '<span class="bx">'+(on?'✓':'')+'</span><span style="flex:1;min-width:0"><b style="display:block;font-size:11.5px">'+esc(x.ai)+' · '+hm(x.t)+' '+dm(x.t)+'</b>'+
    '<span style="font-weight:400;color:var(--ink2)">'+esc(x.tx).slice(0,150)+'</span></span></button>'}).join('')+
  '</div><div class="hint">Tin bạn vừa bấm đã được tích sẵn. Tích thêm các tin lân cận nếu cần dựng ngữ cảnh.</div></div>';
 h+='<div class="gf"><label>Lý do <b>*</b></label><select class="ti" id="bcly">'+
  ['— Chọn lý do —','Ngôn từ xúc phạm','Quấy rối, nhắn liên tục','Nội dung không phù hợp','Quảng cáo, spam','Khác']
  .map(x=>'<option>'+x+'</option>').join('')+'</select></div>';
 h+='<div class="gf"><label>Mô tả thêm</label><textarea class="ta" id="bcmt" placeholder="Bắt buộc nếu chọn lý do Khác…"></textarea></div>';
 h+='<div class="'+(nh?'ro':'okbx')+'" style="margin-bottom:0"><b>Ban giám hiệu sẽ chỉ đọc được những tin bạn tích ở trên.</b>'+
  (nh?'':' Phần còn lại của cuộc trò chuyện này nhà trường không có chức năng đọc.')+'</div>';
 modal('⚠ Báo cáo tin nhắn vi phạm',h,
  '<button class="btn" data-x="close">Hủy</button><button class="btn d" id="okBC">Gửi báo cáo tới Ban giám hiệu</button>');
 const chon={};chon[m.id]=true;
 $('#bcds').addEventListener('click',function(e){
  const b=e.target.closest('[data-bc]');if(!b)return;
  const id=b.dataset.bc;chon[id]=!chon[id];
  b.classList.toggle('on',!!chon[id]);b.querySelector('.bx').textContent=chon[id]?'✓':'';
 });
 $('#okBC').onclick=function(){
  const n=Object.keys(chon).filter(k=>chon[k]).length,ly=$('#bcly').value,mt=$('#bcmt').value.trim();
  if(!n){toast('⛔ Phải đính kèm ít nhất một tin');return}
  if(ly.indexOf('—')===0){$('#bcly').classList.add('err');toast('⛔ Phải chọn lý do');return}
  if(ly==='Khác'&&!mt){$('#bcmt').classList.add('err');toast('⛔ Chọn lý do “Khác” thì bắt buộc mô tả thêm');return}
  const ma='BC-2026-'+String(++BCSEQ).padStart(4,'0');
  m.rep=ma;
  BCTOI.push({id:ma,boi:R().me,bi:(c.loai==='nhom'?m.ai:c.voi),lop:c.lop,cv:c.id,msg:m.id,
   t:new Date(HOMNAY),ly:ly,tt:'cho'});
  closeModal();render();
  modal('✅ Đã gửi báo cáo — '+ma,
   '<div class="okbx">Báo cáo <b>'+ma+'</b> đã được gửi tới Ban giám hiệu, kèm <b>'+n+' tin nhắn</b> bạn đã tích. Lý do: <b>'+esc(ly)+'</b>.</div>'+
   '<div class="ro"><b>Không có nút mở M8.3 ở đây.</b> Giáo viên không có quyền <code>X</code> ở menu Xử lý vi phạm chat, nên theo quy ước thì <b>không hiện deep-link</b> — dẫn sang một màn hình bị từ chối còn tệ hơn là không dẫn. Kết quả xử lý sẽ quay về bằng thông báo hệ thống ở <b>M0.3</b>.</div>'+
   '<div class="ro" style="margin-bottom:0"><b>Tin bị báo cáo vẫn còn nguyên trong dòng tin</b> — không ẩn, không làm mờ, không gắn nhãn cho người khác thấy. Báo cáo là một cáo buộc chưa được xét; ẩn tin đi là đã xử người bị báo cáo trước khi có ai đọc (§8.5.3). Chỉ <b>bạn</b> thấy dòng trạng thái mảnh dưới tin đó.</div>');
 };
}

/* ============ MENU CUA MOT CUOC ============ */
function menuCV(c,x,y){
 const ad=laAdmin(c);let h='';
 if(ad){
  h+='<button data-cx="ten">✏ Đổi tên nhóm</button>';
  h+='<button data-cx="'+(c.tat?'mo':'tat')+'">'+(c.tat?'▶ Mở lại nhóm ngay':'⏸ Tắt nhóm tạm thời')+'</button>';

function hopTatNhom(c){
 modal('⏸ Tắt nhóm tạm thời — '+esc(c.ten),
  '<div class="ro">Khi tắt: <b>phụ huynh không gửi được tin</b>, còn bạn là admin thì <b>vẫn gửi được</b>. Mọi người <b>vẫn đọc được</b> toàn bộ tin cũ.<br><br>'+
  'Chọn như vậy vì kỳ nghỉ vẫn có việc phải báo cả lớp; tắt cả hai chiều thì giáo viên buộc phải mở nhóm ra chỉ để gửi một tin rồi tắt lại (§8.2.5).</div>'+
  '<div class="gf"><label>Ngày mở lại <b>*</b></label><input class="ti" type="date" id="tatDen" value="2027-01-05" style="max-width:200px">'+
  '<div class="hint"><b>Không có lựa chọn tắt vô thời hạn.</b> Một nhóm tắt vĩnh viễn mà không ai nhớ chính là một nhóm chết — đến ngày, nhóm tự mở và có dòng hệ thống báo.</div></div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn d" id="okTat">Tắt nhóm</button>');
 $('#okTat').onclick=function(){
  const v=$('#tatDen').value;
  if(!v){$('#tatDen').classList.add('err');toast('⛔ Bắt buộc chọn <b>ngày mở lại</b> — không có lựa chọn tắt vô thời hạn');return}
  const a=v.split('-');c.tat=new Date(+a[0],+a[1]-1,+a[2]);

  closeModal();render();toast('⏸ Đã tắt nhóm tới '+d2s(c.tat));
 };
}
function hopGhim(c,m){
 const gh=ghimCua(c);
 if(gh.length<3){m.ghim=true;render();toast('📌 Đã ghim — thanh ghim đang có '+(gh.length+1)+'/3 tin');return}
 modal('📌 Thanh ghim đã đủ 3 tin',
  '<div class="warn">Thanh ghim là chỗ đọc lướt, ghim mười tin thì không còn là ghim nữa. Chọn <b>bỏ ghim tin nào</b> để nhường chỗ — hệ thống <b>không tự đẩy tin cũ nhất ra</b>, vì bỏ mất một tin ghim mà không ai biết là mất một thông tin quan trọng (§8.2.2).</div>'+
  gh.map(function(x){return '<button class="chk" data-thay="'+x.id+'" style="display:flex;width:100%;margin-bottom:6px;align-items:flex-start">'+
   '<span class="bx"></span><span style="flex:1;min-width:0;font-weight:400">'+esc(x.tx.replace(/\n/g,' ')).slice(0,120)+'</span></button>'}).join(''),
  '<button class="btn" data-x="close">Hủy</button>');
 $('#mb').addEventListener('click',function(e){
  const b=e.target.closest('[data-thay]');if(!b)return;
  const old=c.msg.find(x=>x.id===b.dataset.thay);old.ghim=false;m.ghim=true;
  closeModal();render();toast('📌 Đã bỏ ghim tin cũ và ghim tin mới');
 });

/* ============ DIEU KHOAN ============ */
function hopDieuKhoan(batBuoc){
 modal('📜 Điều khoản sử dụng chức năng Nhắn tin',noiDungDK(),
  (batBuoc?'<button class="btn" id="khongDY">Chưa đồng ý</button>':'<button class="btn" data-x="close">Đóng</button>')+

 if(batBuoc){

document.addEventListener('click',function(e){

 const t=e.target.closest('[data-r],[data-s],[data-tab],[data-chip],[data-cv],[data-cu],[data-mocv],[data-mophu],[data-x],[data-mm],[data-mtx],[data-cx],[data-doc],[data-boghim],[data-toghim],[data-tg],[data-unmute],[data-xem],[data-tai],[data-deep],[data-nhac],[data-xemtin]');
 if(!t)return;const d=t.dataset;

 if(d.r){role=d.r;V={tab:'cv',cv:null,chip:'all',q:'',p2:null,qcu:'',cu:null,quote:null};

 if(d.s){tinhHuong=d.s;HOMNAY=d.s==='dem'?new Date(2026,10,20,21,30):new Date(2026,10,20,9,14);
   document.querySelectorAll('.rb[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===d.s));

   return}
 if(d.tab){V.tab=d.tab;V.q='';V.p2=null;V.cu=null;render();return}
 if(d.chip){V.chip=d.chip;V.p2=null;render();return}

 if(d.mocv){V.tab='cv';V.cv=d.mocv;V.q='';V.p2=null;const c=CV.find(x=>x.id===d.mocv);if(c)c.chuadoc=0;render();return}
 if(d.mophu){

     tucach:r.lopCN.indexOf(p.lop)>=0?'GVCN':'GVBM',mute:false,chuadoc:0,msg:[]};
   CV.push(c);V.tab='cv';V.cv=c.id;V.q='';render();
   toast('💬 Đã mở cuộc riêng với <b>'+esc(p.t)+'</b> — chưa có tin nào');return}
 if(d.cu){V.cu=d.cu;V.qcu='';render();

     '<div class="ro" style="margin-bottom:0">Việc có cho gửi ảnh trong nhóm lớp hay không là <b>điểm còn phải chốt</b> (§11.2 mục 4) — đề xuất là cho, nhưng luôn hiện dòng nhắc này.</div>',
     '<button class="btn" data-x="close">Hủy</button><button class="btn p" id="okTep">Đính kèm</button>');
    $('#okTep').onclick=function(){
     c.msg.push({id:'m'+(++MID),ai:R().me,t:new Date(HOMNAY),tx:'Cô gửi quý phụ huynh tệp đính kèm.',doc:0,

    };

 if(d.x==='bo-quote'){V.quote=null;render();return}
 if(d.x==='tat-nhac'){CD.nhacM81=false;render();toast('Đã tắt gợi ý này vĩnh viễn cho tài khoản của bạn');return}

 if(d.mm){const c=curCV(),m=c.msg.find(x=>x.id===d.mm);const r=t.getBoundingClientRect();

 if(d.mtx){
   const [k,id]=d.mtx.split(':'),c=curCV(),m=c.msg.find(x=>x.id===id);closeMenu();
   if(k==='chep'){toast('📋 Đã sao chép nội dung tin');return}
   if(k==='quote'){V.quote={ai:m.ai,tx:m.tx};render();
     const ta=$('#cta');if(ta)ta.focus();
     toast('💬 Đang trích dẫn — gõ nội dung đính chính rồi gửi. <b>Tin cũ vẫn nguyên</b>, người đọc thấy cả hai.');return}
   if(k==='ghim'){if(m.ghim){m.ghim=false;render();toast('Đã bỏ ghim')}else hopGhim(c,m);return}
   if(k==='bao'){hopBaoCao(m,c);return}
   return}
 if(d.cx){
   const c=curCV();closeMenu();
   if(d.cx==='ten'){
    modal('✏ Đổi tên nhóm','<div class="gf"><label>Tên nhóm</label><input class="ti" id="tenM" value="'+esc(c.ten)+'">'+
     '<div class="hint">Đổi tên sẽ ghi một <b>dòng hệ thống</b> trong dòng tin để mọi thành viên biết.</div></div>',
     '<button class="btn" data-x="close">Hủy</button><button class="btn p" id="okTen">Lưu</button>');
    $('#okTen').onclick=function(){
     const v=$('#tenM').value.trim();if(!v){toast('⛔ Tên nhóm không được để trống');return}
     const cu=c.ten;c.ten=v;
     c.msg.push({id:'m'+(++MID),sys:true,t:new Date(HOMNAY),tx:R().me+' đã đổi tên nhóm từ “'+cu+'” thành “'+v+'”'});
     closeModal();render();toast('✏ Đã đổi tên nhóm');
    };return}
   if(d.cx==='tat'){hopTatNhom(c);return}
   if(d.cx==='mo'){c.tat=null;
    c.msg.push({id:'m'+(++MID),sys:true,t:new Date(HOMNAY),tx:R().me+' đã mở lại nhóm — phụ huynh gửi tin được bình thường'});
    render();toast('▶ Đã mở lại nhóm');return}
   if(d.cx==='mute'){c.mute=!c.mute;render();toast(c.mute?'🔕 Đã tắt tiếng — bạn vẫn nhận tin, chỉ không bị đẩy thông báo':'🔔 Đã bỏ tắt tiếng');return}
   return}
 if(d.doc){V.p2=V.p2==='doc:'+d.doc?null:'doc:'+d.doc;render();return}
 if(d.boghim){const c=curCV(),m=c.msg.find(x=>x.id===d.boghim);m.ghim=false;render();toast('Đã bỏ ghim');return}
 if(d.toghim){const el=document.querySelector('[data-msg="'+d.toghim+'"]');
   if(el){el.scrollIntoView({block:'center'});el.querySelector('.bub').style.outline='2px solid var(--amber)';
    setTimeout(function(){const b=el.querySelector('.bub');if(b)b.style.outline=''},1600)}
   return}
 if(d.tg){
   if(d.tg==='imTuBat'){CD.imTuBat=!CD.imTuBat;render();return}
   if(d.tg==='rieng'){
    const r=R();r.tatBM=!r.tatBM;render();
    toast(r.tatBM?'Đã tắt nhận tin riêng — <b>các cuộc đang có vẫn hoạt động</b>':'Đã bật lại nhận tin riêng');return}
   return}
 if(d.unmute){const c=CV.find(x=>x.id===d.unmute);c.mute=false;render();toast('🔔 Đã bỏ tắt tiếng');return}
 if(d.xem){modal('👁 '+esc(d.xem),
   '<div style="background:#334155;border-radius:10px;padding:20px;display:grid;place-items:center">'+
   '<div style="background:#fff;width:78%;min-height:220px;border-radius:3px;padding:16px 18px;font-size:9px;color:#334155;line-height:1.9">'+
   '<div style="text-align:center;font-weight:800;font-size:11px;margin-bottom:10px">'+esc(d.xem)+'</div>'+
   Array(9).fill('<div style="height:5px;background:#e2e8f0;border-radius:3px;margin:5px 0"></div>').join('')+'</div></div>'+
   '<div class="ro" style="margin-top:10px;margin-bottom:0">Xem <b>ngay trong màn hình</b>, không bắt tải về mở phần mềm khác. Lượt xem này <b>đã ghi audit</b> — chat chứa ảnh và thông tin trẻ em, thuộc NĐ 13/2023.</div>');
   return}
 if(d.tai){audit('tải tệp <b>'+esc(d.tai)+'</b> từ cuộc trò chuyện');return}
 if(d.nhac){toast('Mở cuộc riêng với <b>'+esc(d.nhac)+'</b> để nhắc — trong bản demo chỉ minh họa lối đi');return}
 if(d.deep){modal('↗ Deep-link sang '+d.deep,
   '<div class="ro">Điều hướng tới <code>/m1.1?ctx=hs&return=m8.2</code> — mở hồ sơ học sinh, nơi <b>sở hữu</b> số điện thoại phụ huynh.</div>'+
   '<div class="info" style="margin-bottom:0">Nút này <b>chỉ hiện với vai có quyền X trên học sinh đó</b> — thực tế là giáo viên chủ nhiệm. Đổi sang vai <b>GVBM</b> để thấy nó biến mất (§8.6.2).</div>');
   return}
});
document.addEventListener('input',function(e){
 const id=e.target.id;
 if(id==='q'){V.q=e.target.value;reRender('#q');return}
 if(id==='qcu'){V.qcu=e.target.value;reRender('#qcu');return}
 if(id==='cta'){
  const n=$('#cnhac');
  if(n)n.style.display=e.target.value.length>400?'block':'none';
  return}
});
document.addEventListener('change',function(e){
 const id=e.target.id;
 if(id==='imTu'){CD.imTu=e.target.value;render();return}
 if(id==='imDen'){CD.imDen=e.target.value;render();return}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cta'){e.preventDefault();guiTin()}
});
$('#mask').addEventListener('click',function(e){if(e.target===this)closeModal()});
V.quote=null;
render();
</script>
</body>
</html>
