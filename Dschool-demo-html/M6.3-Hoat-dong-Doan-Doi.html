<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.3 Hồ sơ HS thành viên — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.cell{width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;text-align:right;font:inherit;font-size:12.5px}
.cell:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:6px;border-radius:1px;display:block}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.mini{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:12px}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}
</style>

<script>
/* ══════════════ NỀN CHUNG — NHÓM 🎖 HOẠT ĐỘNG ĐOÀN - ĐỘI ══════════════
   ★ Tệp này CHÉP GIỐNG HỆT ở SÁU thư mục demo-src:
       M6.3-Hoat-dong-Doan-Doi · M6.13-Theo-doi-thi-dua · M6.14-Hoat-dong-va-Su-kien ·
       M6.15-To-chuc-va-Ban-chap-hanh · M6.16-Quan-ly-CLB · M6.17-Quy-hoat-dong
     (tách M6.3 thành ba menu ngày 14/9/2026 — phiên DOT1-P4A; P4B · P4C · P4E chép thêm; PZ sửa chú thích 14/9).
   Sáu demo phải CÙNG lớp, CÙNG học sinh, CÙNG người đăng nhập. Sửa một chỗ thì chép sang năm chỗ kia
   và so mã băm — sáu tệp phải trùng nhau từng byte. Phần riêng của từng menu nằm ở app.20-* trở đi. */

/* ========== TIỆN ÍCH ========== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const vn=n=>Number(n).toLocaleString('vi-VN');
const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4200)}
function closeM(){$('#mask').classList.remove('on')}
const mfns={};
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}
const THU=['CN','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const d2k=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const k2d=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const d2s=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
const k2s=k=>d2s(k2d(k));
const kThu=k=>THU[k2d(k).getDay()];
const HOMNAY='2026-10-23';                 /* Thứ Sáu */
/* deep-link D3 giữa ba menu: ?tab=…&ctx=…&return=…&vai=… — vai đi theo để người rà không phải chọn lại */
const QS=new URLSearchParams(location.search);

/* ========== LỚP ========== */
const DT={A:'Điểm trường A',B:'Điểm trường B',C:'Điểm trường C'};
const LOP=[
 {id:'6A1',dt:'A',khoi:6,gvcn:'Nguyễn Thị Hoa',n:38},{id:'6A2',dt:'A',khoi:6,gvcn:'Lê Văn Minh',n:35},
 {id:'6A3',dt:'A',khoi:6,gvcn:'Vũ Thị Mai',n:31},{id:'7A1',dt:'A',khoi:7,gvcn:'Đặng Thị Hồng',n:33},
 {id:'7A2',dt:'A',khoi:7,gvcn:'Phạm Văn Đức',n:26},{id:'8A1',dt:'A',khoi:8,gvcn:'Ngô Thanh Tùng',n:18},
 {id:'6B1',dt:'B',khoi:6,gvcn:'Hoàng Thị Nhung',n:30},{id:'7B1',dt:'B',khoi:7,gvcn:'Lý Thị Phượng',n:21},
 {id:'9A1',dt:'A',khoi:9,gvcn:'Trần Thị Vân',n:34},{id:'9A2',dt:'A',khoi:9,gvcn:'Bùi Quốc Hải',n:30},
 {id:'9B1',dt:'B',khoi:9,gvcn:'Ngô Thị Lan',n:25}
];
const lopById=id=>LOP.find(l=>l.id===id);

/* ── học sinh (sinh tất định, dùng chung mã với M1.1) ── */
const HO=['Nguyễn','Trần','Lê','Phạm','Hoàng','Đỗ','Vũ','Bùi','Đặng','Ngô','Dương','Lý','Phan','Trịnh'];
const DEM=['Văn','Thị','Minh','Thu','Quốc','Hải','Ngọc','Anh','Đức','Gia','Khánh','Phương','Thanh'];
const TEN=['An','Bình','Chi','Dũng','Giang','Hà','Hùng','Khang','Lan','Mai','Nam','Oanh','Phúc','Quân',
 'Sơn','Trang','Tú','Vy','Yến','Long','Linh','Nhung','Thắng','Kiên','Hạnh','Đạt','Thảo','Duy','Ngân'];
function rng(seed){let s=seed;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}
/* ★ hạt giống theo lớp — BĂM có thứ tự ký tự. Bản trước lấy TỔNG mã ký tự nên 6A3 · 7A2 · 8A1 (cùng tổng 170)
   ra cùng danh sách tên, cùng ngày sinh, cùng số chuyên cần — ba lớp giống hệt nhau. */
const hat=(s,k)=>s.split('').reduce((a,c)=>(a*31+c.charCodeAt(0))%99991,k)+1;
const HSC={};
function hsCuaLop(lopId){
 if(HSC[lopId]) return HSC[lopId];
 const l=lopById(lopId), r=rng(hat(lopId,7)*97), ds=[];
 for(let i=0;i<l.n;i++) ds.push({id:lopId+'-'+i,lop:lopId,dt:l.dt,khoi:l.khoi,
  ten:HO[Math.floor(r()*HO.length)]+' '+DEM[Math.floor(r()*DEM.length)]+' '+TEN[Math.floor(r()*TEN.length)],
  ma:'HS-2026-'+p2(Math.floor(r()*900)+100)+i});
 HSC[lopId]=ds; return ds;
}
const hsById=id=>hsCuaLop(id.split('-')[0]).find(x=>x.id===id);

/* ========== NĂM HỌC & TUẦN ==========
   Sao đỏ chấm theo TUẦN, nên tuần là một thực thể có thật (số hiệu, ngày đầu, ngày cuối).
   Mốc năm học do UBND tỉnh quyết định — tham số, không hard-code. */
const NAMHOC={ten:'2026–2027',khaiGiang:'2026-09-05',tuan1:'2026-09-07',
 hk1:['2026-09-05','2027-01-16'],hk2:['2027-01-17','2027-05-31'],soTuan:35};
function tuanCua(k){const a=k2d(NAMHOC.tuan1), d=k2d(k); return Math.floor((d-a)/(7*864e5))+1}
function ngayDauTuan(n){const d=k2d(NAMHOC.tuan1); d.setDate(d.getDate()+(n-1)*7); return d2k(d)}
function ngayCuoiTuan(n){const d=k2d(ngayDauTuan(n)); d.setDate(d.getDate()+5); return d2k(d)}  /* T2 → T7 */
function ngayTrongTuan(n,thu){const d=k2d(ngayDauTuan(n)); d.setDate(d.getDate()+thu); return d2k(d)} /* thu: 0 = Thứ Hai */
const TUAN_NAY=tuanCua(HOMNAY);
const kyCuaTuan=n=>ngayDauTuan(n)<=NAMHOC.hk1[1]?'hk1':'hk2';
const thangCuaTuan=n=>ngayDauTuan(n).slice(0,7);

/* ========== NGÀY SINH — ĐIỀU KIỆN TUỔI QUYẾT ĐỊNH AI ĐƯỢC KẾT NẠP ==========
   ★ Không suy tuổi từ khối lớp: một lớp 9 có em sinh tháng 1 và em sinh tháng 12. */
const NAMSINH={6:2015,7:2014,8:2013,9:2012};
(function ganNgaySinh(){
 LOP.forEach(l=>{
  const r=rng(hat(l.id,11)*53);
  hsCuaLop(l.id).forEach(h=>{
   const nam=NAMSINH[l.khoi]-(r()<0.06?1:0);          /* vài em học muộn một năm */
   const th=Math.floor(r()*12)+1, ng=Math.floor(r()*27)+1;
   h.ns=nam+'-'+p2(th)+'-'+p2(ng);
  });
 });
})();
function tuoiTai(ns,moc){
 const a=k2d(ns), b=k2d(moc);
 let t=b.getFullYear()-a.getFullYear();
 const m=b.getMonth()-a.getMonth();
 if(m<0||(m===0&&b.getDate()<a.getDate())) t--;
 return t;
}
/* ★ ĐIỀU LỆ, không phải quy ước nội bộ: Đội 9 → hết 15 tuổi · Đoàn từ đủ 15 tuổi + 1 ngày → 30 tuổi */
const duTuoiDoi=(hs,moc)=>{const t=tuoiTai(hs.ns,moc); return t>=9&&t<=15};
function duTuoiDoan(hs,moc){
 const d=k2d(hs.ns); d.setFullYear(d.getFullYear()+15); d.setDate(d.getDate()+1);
 return d2k(d)<=moc && tuoiTai(hs.ns,moc)<=30;
}
function ngayDuTuoiDoan(hs){const d=k2d(hs.ns); d.setFullYear(d.getFullYear()+15); d.setDate(d.getDate()+1); return d2k(d)}

/* ========== TỔ CHỨC: ĐỘI và ĐOÀN — MỘT TRỤC PHẠM VI, không phải bộ lọc ========== */
const TOCHUC={doi:{ten:'Đội TNTP Hồ Chí Minh',ngan:'Đội',icon:'🔴',phutrach:'Tổng phụ trách Đội',
  khoi:[6,7,8],dieule:'Đội viên: thiếu niên từ 9 đến hết 15 tuổi'},
 doan:{ten:'Đoàn TNCS Hồ Chí Minh',ngan:'Đoàn',icon:'🔵',phutrach:'Bí thư Đoàn trường',
  khoi:[9],dieule:'Đoàn viên: từ đủ 15 tuổi + 1 ngày đến 30 tuổi'}};

/* ========== NGƯỜI ĐĂNG NHẬP — cùng người ở cả ba menu ==========
   Năng lực (mảng q) do từng menu gán ở app.20 — cùng một người, mỗi menu một bộ quyền. */
const ROLES={
 FULL:{n:'Trần Minh Đức',cd:'🔓 Đủ quyền (demo)',sc:'School',dt:null,tc:['doi','doan']},
 TPT :{n:'Đỗ Thị Bích Ngọc',cd:'Tổng phụ trách Đội',sc:'School',dt:null,tc:['doi']},
 BTD :{n:'Vũ Đình Trung',cd:'Bí thư Đoàn trường',sc:'School',dt:null,tc:['doan']},
 HT  :{n:'Nguyễn Quang Huy',cd:'Hiệu trưởng',sc:'School',dt:null,tc:['doi','doan']},
 PHT :{n:'Lý Thanh Bình',cd:'PHT Điểm trường A',sc:'Branch',dt:'A',tc:['doi','doan']},
 GVCN:{n:'Nguyễn Thị Hoa',cd:'GVCN 6A1',sc:'Class',dt:'A',lop:['6A1'],tc:['doi','doan']},
 VT  :{n:'Phan Thị Thảo',cd:'Văn thư',sc:'Branch',dt:'A',tc:['doi','doan']}
};
let role='FULL';
if(QS.get('vai')&&ROLES[QS.get('vai')]) role=QS.get('vai');
const R=()=>ROLES[role];
const can=q=>(R().q||[]).includes(q);
const tcCua=()=>R().tc;
const coTC=tc=>tcCua().includes(tc);
const motTC=()=>tcCua().length===1?tcCua()[0]:null;
const dtHieuLuc=()=>R().sc==='School'?ST.dt:R().dt;
const dtThuc=()=>{const d=dtHieuLuc();return d==='ALL'?'A':d};
function lopTrongPhamVi(){
 const r=R();
 if(r.sc==='Class') return LOP.filter(l=>r.lop.includes(l.id));
 const d=dtHieuLuc();
 return LOP.filter(l=>d==='ALL'||l.dt===d);
}
/* sáu menu cùng nhóm + hai menu ngoài nhóm được nhóm deep-link tới — dùng cho D3 (PZ 14/9: gom các dòng các demo tự thêm ở app.20/app.30;
   các dòng tự thêm đó còn để nguyên — gán lại cùng giá trị, vô hại) */
const FILE_MENU={'M6.3':'M6.3-Hoat-dong-Doan-Doi.html','M6.13':'M6.13-Theo-doi-thi-dua.html',
 'M6.14':'M6.14-Hoat-dong-va-Su-kien.html','M6.15':'M6.15-To-chuc-va-Ban-chap-hanh.html','M6.16':'M6.16-Quan-ly-CLB.html',
 'M6.17':'M6.17-Quy-hoat-dong.html','M4.3':'M4.3-Chuc-danh-va-Diem-cong-tac.html','M7.5':'M7.5-Thu-chi-va-Bao-cao-tai-chinh.html'};
function linkMenu(ma,q){return FILE_MENU[ma]+'?'+q+'&vai='+role}

/* ========== KHUNG MÀN HÌNH ========== */
function rolebar(){
 $('#rolebar').innerHTML='<b>Vai trò:</b>'+Object.keys(ROLES).map(k=>
  '<button class="rb'+(k===role?' on':'')+'" data-r="'+k+'">'+esc(ROLES[k].cd)+'</button>').join('')
 +'<span class="simw">Hôm nay (mô phỏng): <b style="color:#e2e8f0">'+kThu(HOMNAY)+' '+k2s(HOMNAY)
 +' — tuần '+TUAN_NAY+'</b></span>'
 +'<button class="ntg" id="btnNote">💡 Ghi chú thiết kế: TẮT</button>';
}
function header(){
 const r=R();
 $('#ava').textContent=r.n.split(' ').slice(-2).map(x=>x[0]).join('');
 const khoa=r.sc!=='School';
 $('#hdt').innerHTML=(r.sc==='School'?'<option value="ALL">Tất cả điểm trường</option>':'')
  +Object.keys(DT).map(d=>'<option value="'+d+'">'+DT[d]+'</option>').join('');
 $('#hdt').value=khoa?(r.dt||'A'):ST.dt; $('#hdt').disabled=khoa;
 $('#dtlock').textContent=khoa?'🔒 khóa theo phạm vi '+r.sc:'';
 const n=viecCanLam();
 $('#ndot').textContent=n||''; $('#ndot').style.display=n?'grid':'none';
}
function tabs(){
 const t=tabsOK();
 if(!t.length){$('#tabs').innerHTML='';ST.tab=null;return}
 if(!t.find(x=>x[0]===ST.tab)) ST.tab=t[0][0];
 $('#tabs').innerHTML=t.map(([k,n,b])=>'<button class="tab1'+(k===ST.tab?' on':'')+'" data-t="'+k+'">'+n
  +(b?'<span class="b r">'+b+'</span>':'')+'</button>').join('');
}
function scopeBar(extra){
 const r=R(), tcs=tcCua().map(t=>TOCHUC[t].icon+' '+TOCHUC[t].ngan).join(' + ');
 if(r.sc==='Class'){
  const l=lopById(r.lop[0]);
  return '<div class="scope"><span>🎨</span><span class="sp">Vai <b>'+esc(r.cd)+'</b> — '+esc(r.n)
   +'. Phạm vi: <b>Class — '+l.id+'</b> ('+hsCuaLop(l.id).length+' học sinh, '+DT[l.dt]+'). '
   +'Dữ liệu lớp khác <b>không có trong kết quả trả về</b>.'+(extra?' '+extra:'')+'</span></div>';
 }
 const pv = r.sc==='School' ? (ST.dt==='ALL'?'School — toàn trường':'School (đang lọc '+DT[ST.dt]+')')
   : 'Branch — '+DT[r.dt];
 return '<div class="scope"><span>🎨</span><span class="sp">Vai <b>'+esc(r.cd)+'</b> — '+esc(r.n)
  +'. Phạm vi: <b>'+pv+'</b> · Tổ chức: <b>'+tcs+'</b>. Thấy <b>'+lopTrongPhamVi().length+' lớp</b>'
  +(motTC()?', và <b>chỉ dữ liệu của '+TOCHUC[motTC()].ngan+'</b> — phần '
    +(motTC()==='doi'?'Đoàn':'Đội')+' <b>không có trong kết quả trả về</b>':'')+'.'
  +(extra?' '+extra:'')+'</span></div>';
}
function dnote(html){return '<div class="dnote">💡 <b>Ghi chú thiết kế.</b> '+html+'</div>'}
function subtabs(list,cur){
 return '<div class="bar" style="padding-bottom:4px">'+list.map(([k,n])=>
  '<button class="chip'+(cur===k?' on':'')+'" data-sub="'+k+'">'+n+'</button>').join('')+'</div>';
}
/* vai không có tab nào ở menu này — nói rõ, không để màn hình trắng */
function khongCoQuyen(tenMenu,lyDo){
 return scopeBar()+'<div class="empty">Vai <b>'+esc(R().cd)+'</b> không có quyền ở menu <b>'+tenMenu+'</b> — '
  +'trên hệ thống thật, menu này <b>không hiện</b> ở sidebar của vai này.'
  +(lyDo?'<div style="font-size:12px;margin-top:6px">'+lyDo+'</div>':'')+'</div>';
}

/* ========== SỰ KIỆN CHUNG — phần riêng của menu nằm trong suKien(t) ========== */
mfns.bclose=()=>closeM();
document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 if(t===$('#mask')){closeM();return}
 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r;doiTab(ST.tab);if(R().sc!=='School'&&R().dt)ST.dt=R().dt;render();return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn');render();return}
 const tb=t.closest('#tabs [data-t]'); if(tb){doiTab(tb.dataset.t);render();return}
 const sb=t.closest('[data-sub]'); if(sb){ST.sub=sb.dataset.sub;render();return}
 suKien(t,e);
});
$('#hdt').onchange=e=>{ST.dt=e.target.value;render()};


/* ══════════════ M6.3 HỒ SƠ HS THÀNH VIÊN — DỮ LIỆU RIÊNG ══════════════
   Sau tách 14/9/2026 (DOT1-P4A) menu này giữ phần KẾT NẠP: sổ đoàn viên — đội viên · đợt kết nạp ·
   đăng ký ứng viên. Giữ mã M6.3 vì trigger ngày kết nạp sang M1.1 và ký số quyết định là hai thứ
   bị tài liệu khác trích dẫn theo mã nhiều nhất. Thi đua → M6.13 · Phong trào → M6.14. */

/* ── YKDD-1D (17/9/2026): vai GVCN 9A2 cho ca DD6 — GVCN nhập hộ mức đề xuất của chi đoàn 9A2 (sinh hoạt ghép 9A1).
   Thêm ở app.20, KHÔNG sửa nền chung (DD-S3 — tiền lệ ROLES.GVPT của M6.16). ── */
ROLES.GVCN9A2={n:'Bùi Quốc Hải',cd:'GVCN 9A2',sc:'Class',dt:'A',lop:['9A2'],tc:['doi','doan']};

/* ── năng lực của từng vai Ở MENU NÀY ── */
/* YKDD-3A (18/9/2026) — sổ kỷ luật Đoàn ở hồ sơ đoàn viên tab 1 (DG-5 C, app.35): hai năng lực nằm trong S của m6.3.doan_vien_doi_vien
   kldKT  — ghi KHIỂN TRÁCH của chi đoàn, nhập hộ theo biên bản (GVCN — Class) · kldBCH — ghi mọi hình thức, hủy do khiếu nại (Bí thư Đoàn trường)
   Căn cứ HD 60-HD/TWĐTN-TCKT mục 24.1b. TPT (trục Đội) không có: Đội không có kỷ luật Đoàn. */
const QALL=['xem','taoDot','suaDot','huyDot','guiDS','rutUV','xetUV','kyQD','hoivien','nguong','xuat','nhapExcel','kldKT','kldBCH'];
const QUYEN={
 FULL:QALL,
 TPT :['xem','taoDot','suaDot','huyDot','guiDS','rutUV','xetUV','hoivien','nguong','xuat','nhapExcel'],
 BTD :['xem','taoDot','suaDot','huyDot','guiDS','rutUV','xetUV','hoivien','nguong','xuat','nhapExcel','kldKT','kldBCH'],
 HT  :['xem','kyQD','hoivien','xuat'],
 PHT :['xem','kyQD','hoivien','xuat'],
 GVCN:['guiDS','rutUV','hoivien','nhapExcel','kldKT'],   /* ma trận §15: GVCN có ID ở tab 3 — bản trước demo thiếu */
 GVCN9A2:['guiDS','rutUV','hoivien','nhapExcel','kldKT'],
 VT  :['xem','guiDS','rutUV','hoivien','xuat','nhapExcel']
};
/* YKDD-3A — vá deep-link L22 (PHIEU-YKDD-2A E2 ②): M0.2 mở tab 4 kèm return=M0.2 ⇒ breadcrumb «← M0.2». Tiền lệ M6.15 · M6.17 — không sửa nền. */
FILE_MENU['M0.2']='M0.2-Viec-can-lam.html';

/* ══════════════ SỔ KỶ LUẬT ĐOÀN — HỒ SƠ ĐOÀN VIÊN Ở TAB 1 · phiên YKDD-3A (18/9/2026) ══════════════
   DG-5 chốt C (anh Ninh 17/9/2026): sổ kỷ luật Đoàn nằm trong HỒ SƠ ĐOÀN VIÊN của tab 1 — menu này đã là chủ TƯ CÁCH đoàn viên
   (kết nạp · số thẻ), khai trừ chấm dứt tư cách đó nên cùng một chủ, không phải đồng bộ hai nơi. Tab 4 ĐỌC sổ (thay N2 «nhập tay trong đợt»).
   Căn cứ HD 60-HD/TWĐTN-TCKT ngày 28/02/2025 (trích ở M6.15 §12): mục 2 — ghi kỷ luật vào sổ của từng đoàn viên ·
   23.2c — khiển trách · cảnh cáo · cách chức (cán bộ đoàn) · khai trừ; khai trừ sau một năm mới xét kết nạp lại ·
   24.1b — chi đoàn quyết định khiển trách; BCH Đoàn cơ sở quyết định cảnh cáo, khai trừ và kỷ luật cán bộ chi đoàn ·
   24.2 — kiểm điểm trước chi đoàn · 25.2 — khiếu nại trong 30 ngày.
   ★ Chỉ ĐOÀN VIÊN HỌC SINH — Đội không có kỷ luật Đoàn; đoàn viên giáo viên không có trong sổ học sinh (M6.15 điểm G ⏳) → tab 4 giữ nhập tay có căn cứ.
   ★ KHÔNG xóa — hủy do khiếu nại là TRẠNG THÁI, bắt lý do; ghi sai thì ĐÍNH CHÍNH có lý do; mọi thao tác vào lịch sử; xem / tải tệp ghi audit (BVDLCN 91/2025).
   ★ Máy KHÔNG tự tính hết hạn kỷ luật — người ghi nhập thời hạn theo quyết định (HD 60 mục 6.1 nhắc thời hạn, không nêu độ dài) ⏳ DG-5a.
   ★ Khai báo bằng var, không const: laHoiVien · ungVienDuDieuKien ở app.20 chạy bộ gieo TRƯỚC tệp này — var được kéo lên đầu kịch bản
     (gen-demo ghép mọi app.*.js thành MỘT thẻ script) nên đọc ra undefined thay vì ném lỗi TDZ. */
var KLD=null;
const HT_KLD={khien_trach:{t:'Khiển trách',nang:1},canh_cao:{t:'Cảnh cáo',nang:2},cach_chuc:{t:'Cách chức',nang:3},khai_tru:{t:'Khai trừ',nang:4}};
const TU_CANH_CAO=['canh_cao','cach_chuc','khai_tru'];   /* «kỷ luật từ cảnh cáo» của HD 33 — cách chức nặng hơn cảnh cáo nên cũng kích hoạt chặn mềm (anh Ninh 18/9) */
const CAP_KLD={chi_doan:'Chi đoàn',bch_doan_truong:'BCH Đoàn trường'};
const TT_KLD={hieu_luc:['Có hiệu lực','r'],da_huy:['Đã hủy do khiếu nại','n']};
const KLD_AUDIT=[];

/* ── dẫn xuất ── */
const kldCuaHS=id=>(KLD||[]).filter(r=>r.hs===id);
const kldById=id=>(KLD||[]).find(r=>r.id===id);
const hieuLucTai=(r,x)=>r.trang_thai==='hieu_luc'&&r.ngay<=x&&(!r.het_han||r.het_han>=x);
/* khai trừ có hiệu lực tại ngày x ⇒ tư cách đoàn viên chấm dứt từ ngày quyết định */
function khaiTruTai(id,x){ if(!KLD) return null; return KLD.find(r=>r.hs===id&&r.hinh_thuc==='khai_tru'&&r.trang_thai==='hieu_luc'&&r.ngay<=x)||null }
function motNamSau(k){const d=k2d(k); d.setFullYear(d.getFullYear()+1); return d2k(d)}
/* HD 60 mục 23.2c — khai trừ sau MỘT NĂM mới xét kết nạp lại, và là ĐỢT KẾT NẠP MỚI (không mở lại bản ghi cũ) */
function xetLaiSauKhaiTru(id,dot){ const kt=dot.tc==='doan'&&khaiTruTai(id,dot.mocTuoi); return !!kt&&dot.mocTuoi>=motNamSau(kt.ngay) }
/* tab 3: em có sổ của tổ chức thì KHÔNG thêm được làm ứng viên — trừ em bị khai trừ đã đủ một năm tính tới ngày kết nạp của đợt */
const chanHV=(id,dot)=>laHoiVien(id,dot.tc)&&!xetLaiSauKhaiTru(id,dot);
/* còn sinh hoạt Đoàn hôm nay = có sổ Đoàn và chưa bị khai trừ */
const dangLaDoanVien=id=>laHoiVien(id,'doan')&&!khaiTruTai(id,HOMNAY);
/* chức vụ đoàn của em — 🔗 M6.15 (bản chiếu CAN_BO_LOP ở app.30); không phụ thuộc trục tổ chức của vai đang xem */
function chucVuDoanHS(id){ for(const l in CAN_BO_LOP) if(CAN_BO_LOP[l].bt===id) return 'Bí thư chi đoàn '+l; return null }
/* cấp có thẩm quyền (HD 60 mục 24.1b): khiển trách đoàn viên thường — chi đoàn (BCH Đoàn trường cũng được);
   cảnh cáo · cách chức · khai trừ, và MỌI kỷ luật cán bộ chi đoàn — chỉ BCH Đoàn trường */
function capHopLe(ht,id){ return ht==='khien_trach'&&!chucVuDoanHS(id)?['chi_doan','bch_doan_truong']:['bch_doan_truong'] }

/* ★ HDDD ⑤ ky_luat_doan — tab 4 ĐỌC ở đây (DG-5 C · khối băm giữ nguyên, sổ điều phối §11).
   Lấy quyết định CÓ HIỆU LỰC ban hành TRONG NĂM HỌC của đợt, hoặc còn hiệu lực tại NGÀY CHỐT đợt (chưa chốt: hôm nay).
   Quyết định đã hủy do khiếu nại KHÔNG tính — hủy là quyết định mất giá trị từ đầu. Nhiều quyết định → lấy hình thức NẶNG NHẤT, báo số còn lại. */
function klDoanTrongDot(id,d){
 if(!KLD) return null;
 const moc=d&&d.chot?d.chot.luc:HOMNAY;
 const ds=kldCuaHS(id).filter(r=>r.trang_thai==='hieu_luc'&&r.ngay<=moc&&((r.ngay>=NAMHOC.hk1[0]&&r.ngay<=NAMHOC.hk2[1])||hieuLucTai(r,moc)))
  .sort((a,b)=>HT_KLD[b.hinh_thuc].nang-HT_KLD[a.hinh_thuc].nang||b.ngay.localeCompare(a.ngay));
 if(!ds.length) return null;
 const r=ds[0];
 return {hinh_thuc:r.hinh_thuc,ngay:r.ngay,can_cu:'Số '+r.so_qd+' — '+CAP_KLD[r.cap],kld_id:r.id,them:ds.length-1};
}

 mfns.bKLDC=()=>{const ly=$('#kcly').value.trim(), moi={so_qd:$('#kcso').value.trim(),ngay:$('#kcng').value,thoi_han:$('#kcth').value.trim(),het_han:$('#kchh').value||null};
  if(ly.length<10){toast('⚠️ Đính chính bắt buộc lý do (≥ 10 ký tự).');return}
  if(!moi.so_qd||!moi.ngay||moi.ngay>HOMNAY||!moi.thoi_han){toast('⚠️ Số quyết định, ngày, thời hạn không được trống.');return}
  const doi=Object.keys(moi).filter(k=>(r[k]||'')!==(moi[k]||'')).map(k=>k+': «'+(r[k]||'—')+'» → «'+(moi[k]||'—')+'»');
  if(!doi.length){toast('Không có gì thay đổi.');return}
  Object.assign(r,moi); r.ls.push([HOMNAY,'Đính chính — '+doi.join(' · '),R().n,ly]); closeM(); toast('✎ Đã đính chính — giá trị cũ ghi ở lịch sử.'); render()};
 modal('✎ Đính chính quyết định '+esc(r.so_qd),
  '<div class="info">Sửa lỗi <b>ghi chép</b> so với văn bản gốc. <b>Hình thức và cấp quyết định không đính chính</b> — quyết định khác là một quyết định khác: hủy (nếu có văn bản) rồi ghi mới. Giá trị cũ giữ ở lịch sử.</div>'
  +'<label class="lbl">Số quyết định</label><input class="fldi" id="kcso" value="'+esc(r.so_qd)+'">'
  +'<label class="lbl">Ngày quyết định</label><input class="fldi" id="kcng" type="date" value="'+r.ngay+'">'
  +'<label class="lbl">Thời hạn theo quyết định</label><input class="fldi" id="kcth" value="'+esc(r.thoi_han)+'">'
  +'<label class="lbl">Hết hạn ngày</label><input class="fldi" id="kchh" type="date" value="'+(r.het_han||'')+'">'
  +'<label class="lbl">Lý do đính chính <span style="color:var(--red)">*</span></label><textarea class="fldi" id="kcly" rows="2"></textarea>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="KLDC">Đính chính</button>');
}
function tepKLD(v,tai){
 const [kid,loai]=v.split('|'), r=kldById(kid), tep=loai==='qd'?r.tep:r.bien_ban.tep;
 KLD_AUDIT.push({luc:HOMNAY,nguoi:R().n,hs:r.hs,tep,hanh_dong:tai?'tai':'xem'});
 if(tai){toast('⬇ Đã tải <b>'+esc(tep)+'</b> — lượt tải <b>ghi audit</b> (dữ liệu cá nhân trẻ em — BVDLCN 91/2025).');render();return}
 modal('👁 '+esc(tep),'<div class="ro" style="height:200px;display:grid;place-items:center">📄 Xem '+(loai==='qd'?'quyết định':'biên bản kiểm điểm')+' ngay trong màn hình (bản mô phỏng)</div>'
  +'<div style="font-size:11.5px;color:var(--ink2);margin-top:6px">Lượt xem đã <b>ghi audit</b>: '+esc(R().n)+' · '+k2s(HOMNAY)+'.</div>','<button class="btn" data-mb="close">Đóng</button>');
 render(); $('#mask').classList.add('on');
}
function suKienKLD(t){
 const g=a=>t.closest('['+a+']'); let x;
 if(x=g('data-hshv')){ST.hsHV=x.dataset.hshv;render();return true}
 if(x=g('data-kldtep')){tepKLD(x.dataset.kldtep,false);return true}
 if(x=g('data-kldtai')){tepKLD(x.dataset.kldtai,true);return true}
 if(x=g('data-kldhuy')){moHuyKLD(x.dataset.kldhuy);return true}
 if(x=g('data-klddc')){moDinhChinhKLD(x.dataset.klddc);return true}
 /* lối từ tab 4: ➕ ghi kỷ luật Đoàn → mở hồ sơ em ở tab 1, nhớ đợt để quay về */
 if(x=g('data-dgkl')){const k=x.dataset.dgkl;
  if(k.startsWith('gv:')){moKyLuat(k);return true}
  ST.tuDG={dot:ST.curDG,cd:ST.cdDG}; ST.tab='hoivien'; ST.hsHV=k; ST.qhv=''; render(); return true}
 if(t.id==='kldGhi'){moGhiKLD(t.dataset.hs);return true}
 if(t.id==='hsDong'){ST.hsHV=null;render();return true}
 if(t.id==='kldVeDG'){const b=ST.tuDG; ST.tab='xeploai'; ST.curDG=b.dot; ST.cdDG=b.cd; ST.sub='dv'; ST.hsHV=null; ST.tuDG=null; render(); return true}
 return false;
}

function veManHinhDot(){
 const d=dotById(ST.curDot), uv=uvCuaDot(d.id).filter(u=>u.tt!=='rut');
 let h='<div class="crumb">'+(ST.ret&&FILE_MENU[ST.ret]?'<a href="'+linkMenu(ST.ret,'from=M6.3')+'">← '+ST.ret+'</a> · ':'')
  +'<a data-back="dot">Xét duyệt &amp; Kết nạp</a> › <b>'+esc(d.ten)+'</b> '
  +'<span class="st2 '+TT_DOT[d.tt][1]+'">'+TT_DOT[d.tt][0]+'</span></div>';
 if(d.tt==='huy') h+='<div class="danger">⛔ <b>Đợt đã hủy</b> ngày '+k2s(d.huy.ngay)+' bởi <b>'+esc(d.huy.boi)
  +'</b>.<br>Lý do: '+esc(d.huy.ly)+'<br><span style="font-size:11.5px">Bản ghi <b>giữ lại</b> cùng '
  +uv.length+' ứng viên đã đăng ký — đó là căn cứ để đợt sau không bỏ sót em nào.</span></div>';
 h+=subtabs([['tt','Thông tin đợt'],['uv','Ứng viên ('+uv.length+')'],['dk','Điều kiện &amp; đủ tuổi']],ST.sub);

 if(r.sc==='Class') return LOP.filter(l=>r.lop.includes(l.id)&&t.khoi.includes(l.khoi));
 const d=dtHieuLuc();
 return LOP.filter(l=>t.khoi.includes(l.khoi)&&(d==='ALL'||l.dt===d));
}
function thanhBuoc(n){
 return '<div class="steps">'+[['① Chọn đợt kết nạp'],['② Chọn lớp'],['③ Danh sách ứng viên']]
  .map(([x],i)=>'<div class="stp'+(i+1<n?' done':i+1===n?' now':'')+'">'+x+'</div>').join('')+'</div>';
}
function veDangKyUV(){
 const moAll=dotMoDangKy();
 const ds=moAll.filter(d=>lopDangKyDuoc(d).length);
 let h=scopeBar();
 if(ST.dkDot&&!ds.find(d=>d.id===ST.dkDot)) ST.dkDot=null;
 /* ── không có đợt nào mở cho phạm vi của người dùng ── */
 if(!ds.length) return h+thanhBuoc(1)+trongKhongCoDot(moAll);

  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px">'

     +'<div class="f"><div class="k">Nhận khối</div><div class="v">'+t.khoi.join(', ')+'</div></div>'
     +'<div class="f"><div class="k">Hạn gửi danh sách</div><div class="v">'+k2s(d.dong)+'</div></div>'
     +'<div class="f"><div class="k">Ngày kết nạp</div><div class="v">'+k2s(d.ketnap)+' <span style="font-weight:400;font-size:11px;color:var(--ink3)">— cũng là mốc xét tuổi</span></div></div>'
     +'<div class="f"><div class="k">Lớp của bạn đã gửi</div><div class="v">'+daGui+'/'+lops.length+'</div></div>'
     +'</div><div class="cact"><button class="btn p" data-dkdot="'+d.id+'">Chọn đợt này ▸</button></div></div>'}).join('')
   +'</div>';
  const khac=moAll.filter(d=>!ds.includes(d));
  if(khac.length) h+='<div class="ro" style="margin-top:11px">Còn <b>'+khac.length+' đợt</b> đang mở nhưng không nhận khối lớp '

 }
 const dot=dotById(ST.dkDot), t=TOCHUC[dot.tc];
 const lops=lopDangKyDuoc(dot);
 if(!ST.dkLop||!lops.find(l=>l.id===ST.dkLop)) ST.dkLop=lops.length?lops[0].id:null;
 h+=thanhBuoc(3);

 h+=dnote('<b>Tab này sở hữu THÀNH VIÊN danh sách</b> — thêm và bớt ứng viên chỉ làm ở đây. '
  +'Tab <b>Xét duyệt &amp; Kết nạp</b> sở hữu <b>kết quả huấn luyện</b>. Một trường dữ liệu chỉ có một chỗ sửa.<br>'

 const l=lopById(ST.dkLop), hs=hsCuaLop(l.id);
 const uvById={}; uvCuaDot(dot.id).filter(u=>hsById(u.hs).lop===l.id).forEach(u=>uvById[u.hs]=u);

 h+='<div class="bar"><b style="font-size:12.5px">③</b>'

  +(themDuoc.length?'<button class="btn p" id="themUV">➕ Thêm ứng viên</button>':'')+'</div>';
 h+='<div class="tbw"><div class="tbx"><table style="min-width:900px"><tr><th>Học sinh</th><th>Ngày sinh</th>'
  +'<th class="num">Tuổi tại '+k2s(dot.mocTuoi)+'</th><th>Tình trạng</th><th>Nguồn</th><th>Người đưa vào</th><th></th></tr>';
 rows.sort((a,b)=>(a.u?0:1)-(b.u?0:1)).forEach(({hs,u,daHV,du,khac,kt})=>{
  let tt,cls='';

   +(u.rutLy?'<div style="font-size:10.5px;color:var(--ink3)">'+esc(u.rutLy)+'</div>':'')}

   +'<div style="font-size:10.5px;color:var(--ink3)">xét kết nạp lại từ '+k2s(motNamSau(kt.ngay))+' — bằng đợt kết nạp mới (HD 60 mục 23.2c)</div>'; cls=' class="rorow"'}
  else if(daHV) {tt='<span class="tg g">'+TOCHUC[dot.tc].icon+' đã là '+(dot.tc==='doi'?'đội viên':'đoàn viên')
   +'</span>'; cls=' class="rorow"'}
  else if(khac) {tt='<span class="tg c">đang là ứng viên của đợt khác</span>'
   +'<div style="font-size:10.5px;color:var(--ink3)">'+esc(khac.ten)+' — '+TT_DOT[khac.tt][0].toLowerCase()+'</div>'; cls=' class="rorow"'}
  else if(!du) {tt='<span class="tg b">chưa đủ tuổi tại mốc xét</span>'
   +(dot.tc==='doan'?'<div style="font-size:10.5px;color:var(--ink3)">đủ tuổi từ '+k2s(ngayDuTuoiDoan(hs))+'</div>':'');
   cls=' class="warnrow"'}
  else tt='<span style="color:var(--ink3)">chưa đăng ký</span>';
  h+='<tr'+cls+'><td><b>'+esc(hs.ten)+'</b> <span style="color:var(--ink3);font-size:11px">'+esc(hs.ma)+'</span></td>'
   +'<td>'+k2s(hs.ns)+'</td><td class="num">'+tuoiTai(hs.ns,dot.mocTuoi)+'</td>'
   +'<td>'+tt+'</td>'
   +'<td>'+(u&&u.nguon?'<span class="tg '+NGUON_UV[u.nguon][1]+'">'+NGUON_UV[u.nguon][0]+'</span>':'—')+'</td>'
   +'<td style="font-size:11.5px;color:var(--ink2)">'+(u?esc(u.boi)+'<div style="font-size:10.5px;color:var(--ink3)">'
     +k2s(u.ngay)+'</div>':'—')+'</td>'
   +'<td>'+(u&&u.tt==='dangky'&&can('rutUV')
     ?'<button class="btn xs d" data-rut="'+u.id+'">Bỏ khỏi danh sách</button>'

     :u&&['dat','khongdat','ketnap'].includes(u.tt)?'<span class="tg c">đã xét — không bớt được</span>':'')
   +'</td></tr>';
 });
 h+='</table></div><div class="lgd">'
  +'<span class="chip">Bỏ khỏi danh sách là <b>rút tên</b>, không xóa bản ghi — vẫn tra ra được và đưa lại được</span>'
  +'<span class="chip">Em <b>đã được xét đạt/chưa đạt</b> thì không bớt ở đây — phải quay lại bước xét</span>'
  +'</div></div>';
 return h;
}
/* ★ Màn hình trống phải TRẢ LỜI ĐƯỢC: vì sao không có gì · lần gần nhất là khi nào · hỏi ai */
function trongKhongCoDot(moAll){
 const r=R();
 const khoiCuaToi=[...new Set(lopTrongPhamVi().map(l=>l.khoi))];
 const tcLienQuan=tcCua().filter(tc=>TOCHUC[tc].khoi.some(k=>khoiCuaToi.includes(k)));
 const ganNhat=dotTrongPhamVi().filter(d=>tcLienQuan.includes(d.tc)&&d.tt!=='mo'&&d.tt!=='huy')
  .sort((a,b)=>(b.dongLuc||b.dong).localeCompare(a.dongLuc||a.dong))[0];
 let h='<div class="tbw"><div class="empty" style="padding:28px 24px;text-align:left;color:var(--ink2);line-height:1.8">'
  +'<div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px">📭 Chưa có đợt kết nạp nào đang mở đăng ký'
  +(moAll.length?' cho khối lớp trong phạm vi của bạn':'')+'</div>'
  +'Tab này chỉ nhận tên khi có một đợt ở trạng thái <b>Đang mở đăng ký</b>. Đợt đã chuyển sang huấn luyện là '
  +'<b>đóng danh sách</b> — muốn đưa thêm em nào thì phải có đợt mới.';
 if(ganNhat) h+='<div style="margin-top:9px">🕘 Đợt gần nhất: <b>'+esc(ganNhat.ten)+'</b> — đóng danh sách ngày <b>'
  +k2s(ganNhat.dongLuc||ganNhat.dong)+'</b>, nay <span class="st2 '+TT_DOT[ganNhat.tt][1]+'">'+TT_DOT[ganNhat.tt][0]+'</span>.</div>';
 h+='<div style="margin-top:6px">👤 Đợt kết nạp do '+tcLienQuan.map(tc=>'<b>'+TOCHUC[tc].phutrach+'</b> ('
  +esc(ROLES[tc==='doi'?'TPT':'BTD'].n)+')').join(' hoặc ')+' mở, ở tab <b>Xét duyệt &amp; Kết nạp</b>.</div>';
 h+=(can('taoDot')?'<div style="margin-top:11px"><button class="btn p" id="sangKetNap">➕ Sang tab Xét duyệt &amp; Kết nạp để mở đợt</button></div>'
  :'<div style="margin-top:6px;font-size:12px;color:var(--ink3)">Bạn không có quyền mở đợt — nếu lớp có em muốn đăng ký, báo người phụ trách ở trên.</div>');
 if(moAll.length) h+='<div class="ro" style="margin-top:12px">Đang có <b>'+moAll.length+' đợt</b> mở cho khối khác: '
  +moAll.map(d=>esc(d.ten)+' — nhận khối '+TOCHUC[d.tc].khoi.join(', ')).join(' · ')+'</div>';
 return h+'</div></div>';
}
function themUV(){
 const dot=dotById(ST.dkDot), l=lopById(ST.dkLop), hs=hsCuaLop(l.id);
 const uvById={}; uvCuaDot(dot.id).forEach(u=>uvById[u.hs]=u);
 const co=hs.filter(x=>!uvById[x.id]&&!chanHV(x.id,dot)&&!dangODotKhac(x.id,dot)
  &&(dot.tc==='doi'?duTuoiDoi(x,dot.mocTuoi):duTuoiDoan(x,dot.mocTuoi)));
 const nguon=R().sc==='Class'?'gvcn':(role==='VT'?'vt':'tpt');
 mfns.bThem=()=>{
  const chon=[...document.querySelectorAll('.uvchk:checked')].map(x=>x.value);
  if(!chon.length){toast('⚠️ Chưa chọn em nào.');return}
  chon.forEach(id=>UNGVIEN.push({id:'UV'+(++SEQ),dot:dot.id,hs:id,boi:R().n,ngay:HOMNAY,tt:'dangky',nx:'',nguon}));
  closeM(); toast('✅ Đã thêm <b>'+chon.length+' ứng viên</b> lớp '+l.id+' vào đợt <b>'+esc(dot.ten)
   +'</b>. Nguồn ghi là <b>'+NGUON_UV[nguon][0]+'</b>.'); render();
 };
 modal('➕ Thêm ứng viên — lớp '+l.id,
  '<div class="info">Đăng ký vào '+TOCHUC[dot.tc].ten+' là <b>tự nguyện</b> theo Điều lệ. '
  +'Hệ thống <b>không tick sẵn em nào</b> — bạn tick đúng những em đã có nguyện vọng.</div>'
  +'<div class="ro">Danh sách đã lọc sẵn: <b>đúng khối</b>, <b>đủ tuổi tại ngày kết nạp '+k2s(dot.mocTuoi)
  +'</b>, <b>chưa là '+(dot.tc==='doi'?'đội viên':'đoàn viên')+'</b>, và <b>chưa có tên trong đợt</b>.</div>'
  +'<div class="bar" style="margin-top:9px"><button class="btn xs" id="tickAll">Chọn tất cả</button>'
  +'<button class="btn xs" id="untickAll">Bỏ chọn</button>'
  +'<span style="font-size:11.5px;color:var(--ink3)">'+co.length+' em thêm được</span></div>'
  +(co.length?'<div style="max-height:280px;overflow:auto">'+co.map(x=>
    '<label class="kchk" style="display:flex;padding:5px 0;border-bottom:1px solid #f1f5f9">'
    +'<input type="checkbox" class="uvchk" value="'+x.id+'"> <b>'+esc(x.ten)+'</b> '
    +'<span style="color:var(--ink3);font-size:11.5px">· '+k2s(x.ns)+' · '+tuoiTai(x.ns,dot.mocTuoi)+' tuổi</span></label>').join('')
   +'</div>':'<div class="empty">Không còn em nào thêm được.</div>')
  +'<div class="ro" style="margin-top:9px">Bản ghi sẽ mang nguồn <b>'+NGUON_UV[nguon][0]+'</b> và tên bạn.</div>',
  '<button class="btn" data-mb="close">Hủy</button>'
  +(co.length?'<button class="btn p" data-mb="Them">Thêm vào danh sách</button>':''));
}
function rutUV(id){

 mfns.bRut=()=>{const ly=$('#rutly').value.trim();
  if(!ly){toast('⚠️ <b>Bắt buộc nêu lý do</b> — gia đình sẽ nhận được thông báo này.');return}

 modal('Bỏ khỏi danh sách — '+esc(hs.ten),
  '<div class="warn">Bản ghi <b>không xóa</b>, chỉ chuyển sang <b>Đã rút tên</b>. Vẫn tra ra được và '
  +'<b>đưa lại vào được</b> khi đợt còn mở đăng ký.<br>'
  +'<span style="font-size:11.5px">Xóa hẳn thì đợt sau không ai biết em này từng đăng ký rồi rút, '
  +'và gia đình hỏi lại thì không có gì để đối chiếu.</span></div>'
  +'<label class="lbl">Lý do <span style="color:var(--red)">*</span></label>'
  +'<select class="fldi" id="rutlydo"><option>Gia đình xin rút</option><option>Em chưa sẵn sàng, xin đợi đợt sau</option>'
  +'<option>Nhập nhầm</option><option>Khác</option></select>'

/* ★ Nhập Excel PHẢI qua bước ĐỐI SOÁT — không bao giờ ghi thẳng. */
function nhapExcel(){
 const dot=dotById(ST.dkDot), l=lopById(ST.dkLop), hs=hsCuaLop(l.id);
 const uvById={}; uvCuaDot(dot.id).forEach(u=>uvById[u.hs]=u);
 const du=x=>dot.tc==='doi'?duTuoiDoi(x,dot.mocTuoi):duTuoiDoan(x,dot.mocTuoi);
 const co=hs.filter(x=>!uvById[x.id]&&!chanHV(x.id,dot)&&!dangODotKhac(x.id,dot)&&du(x));
 const daHV=hs.filter(x=>chanHV(x.id,dot));
 const chuaDu=hs.filter(x=>!chanHV(x.id,dot)&&!du(x));
 const rows=[];
 co.slice(0,6).forEach(x=>rows.push({ten:x.ten,ma:x.ma,hs:x,kq:'ok'}));
 const hvCon=daHV.find(x=>!(dot.tc==='doan'&&khaiTruTai(x.id,dot.mocTuoi)));
 if(hvCon) rows.push({ten:hvCon.ten,ma:hvCon.ma,hs:hvCon,kq:'dahv'});
 /* YKDD-3A: em bị khai trừ chưa đủ một năm — lý do riêng, không ghi nhầm «đã là đoàn viên» */
 const kt=daHV.find(x=>dot.tc==='doan'&&khaiTruTai(x.id,dot.mocTuoi));
 if(kt) rows.push({ten:kt.ten,ma:kt.ma,hs:kt,kq:'khaitru',kt:khaiTruTai(kt.id,dot.mocTuoi)});
 if(chuaDu[0]) rows.push({ten:chuaDu[0].ten,ma:chuaDu[0].ma,hs:chuaDu[0],kq:'chuadu'});
 const oKhac=hs.find(x=>!uvById[x.id]&&dangODotKhac(x.id,dot));
 if(oKhac) rows.push({ten:oKhac.ten,ma:oKhac.ma,hs:oKhac,kq:'khac',dotKhac:dangODotKhac(oKhac.id,dot)});
 rows.push({ten:'Nguyễn Văn Khoa',ma:'HS-2026-9999',hs:null,kq:'khongthay'});
 if(co[0]) rows.push({ten:co[0].ten,ma:co[0].ma,hs:co[0],kq:'trung'});
 const ok=rows.filter(r=>r.kq==='ok');
 const LOI={dahv:'Đã là '+(dot.tc==='doi'?'đội viên':'đoàn viên')+' — không kết nạp lại',
  khac:'Đang là ứng viên của đợt khác còn chạy — một em chỉ ứng tuyển một đợt',

function suKienDG(t){
 const g=(a)=>t.closest('['+a+']');
 let x;
 if(x=g('data-dgdot')){ST.curDG=x.dataset.dgdot;ST.sub='dv';render();return true}
 if(g('data-dgback')){ST.curDG=null;render();return true}
 if(x=g('data-dgcd')){ST.cdDG=x.dataset.dgcd;ST.sub='dv';render();return true}
 if(x=g('data-dgdx')){moDeXuat(x.dataset.dgdx);return true}
 if(x=g('data-dgcnok')){congNhanDV(x.dataset.dgcnok,true);return true}
 if(x=g('data-dgcn')){congNhanDV(x.dataset.dgcn,false);return true}
 if(x=g('data-dgcncd')){congNhanCD(x.dataset.dgcncd);return true}
 if(x=g('data-dgtep')){modal('👁 '+esc(x.dataset.dgtep),'<div class="ro" style="height:180px;display:grid;place-items:center">📄 Xem biên bản ngay trong màn hình (bản mô phỏng)</div>','<button class="btn" data-mb="close">Đóng</button>');return true}
 if(x=g('data-dgkhen')){const [dt,id]=x.dataset.dgkhen.split('|');
  mfns.bKH=()=>{const ly=$('#khly').value.trim(); if(ly.length<10){toast('⚠️ Nêu lý do đề nghị khen (≥ 10 ký tự).');return}
   DE_NGHI_KHEN.push({dot_id:ST.curDG,doi_tuong:dt,id,ly_do:ly,boi:R().n,luc:HOMNAY});
   ghiLS(dgById(ST.curDG),'Danh sách đề nghị khen — thêm '+(dt==='chi_doan'?cdDG(id).ten:tenTho(id))); closeM(); render()};
  modal('➕ Đưa vào danh sách đề nghị khen','<label class="lbl">Lý do đề nghị <span style="color:var(--red)">*</span></label><textarea class="fldi" id="khly" rows="2"></textarea>',
   '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="KH">Đưa vào</button>'); return true}
 if(x=g('data-dgbokhen')){const i=DE_NGHI_KHEN.findIndex(y=>y.id===x.dataset.dgbokhen);
  ghiLS(dgById(ST.curDG),'Danh sách đề nghị khen — bỏ '+DE_NGHI_KHEN[i].id); DE_NGHI_KHEN.splice(i,1); render(); return true}
 const id=t.id;
 if(id==='dgMoDot'){moDotMoi();return true}
 if(id==='dgGui'){guiDeXuat();return true}
 if(id==='dgCNLoat'){congNhanLoat();return true}
 if(id==='dgTraLai'){traLai();return true}
 if(id==='dgChot'){chotDG();return true}
 if(id==='dgXuatKQ'){xuatDG(false);return true}
 if(id==='dgXuatKhen'){xuatDG(true);return true}
 return false;
}


/* ══════════════ M6.3 — TAB · RENDER · SỰ KIỆN ══════════════ */
/* việc còn tồn của CHÍNH vai đang đăng nhập — không đếm việc của người khác */
function viecCanLam(){
 let n=0;
 if(can('xetUV')) n+=dotTrongPhamVi().filter(d=>d.tt==='xet').length;
 if(can('kyQD'))  n+=dotTrongPhamVi().filter(d=>d.tt==='kyduyet').length;
 if(can('guiDS')&&R().lop) n+=dotMoDangKy().filter(d=>TOCHUC[d.tc].khoi.includes(lopById(R().lop[0]).khoi)
  &&!lopDaGui(d.id).includes(R().lop[0])).length;
 n+=viecDG();   /* tab 4 Đánh giá xếp loại — YKDD-1D */
 return n;
}
/* ★ Số hiệu tab GIỮ NGUYÊN giữa các vai: HT thấy «1 · 2», GVCN thấy «1 · 3» — để câu «mở tab 3» nghĩa như nhau.
   ★ GVCN không còn màn hình gộp «Lớp tôi chủ nhiệm» (trùng tên nhóm sidebar mới — tổng quan §7.3):
     GVCN mở tab 1 và tab 3 ở PHẠM VI Class; phần thi đua của lớp nay ở M6.13 cũng phạm vi Class. */
function tabsOK(){
 const out=[], motCN=R().sc==='Class';
 const nDK=motCN?viecCanLam():dotMoDangKy().length;
 if(can('hoivien')) out.push(['hoivien','1 · '+(motTC()?(motTC()==='doi'?'Đội viên':'Đoàn viên'):'Đoàn viên - Đội viên')]);
 const nd=dotTrongPhamVi().filter(choToi).length;
 if(can('xem')) out.push(['ketnap','2 · Xét duyệt &amp; Kết nạp',nd||null]);
 if(can('guiDS')) out.push(['dangky','3 · Đăng ký ứng viên',nDK||null]);
 /* YKDD-1D: tab 4 — chỉ Đoàn (Đội ngoài phạm vi, XL-5) ⇒ vai trục Đội (TPT) không có tab này; số hiệu 4 giữ nguyên với mọi vai */
 if(can('dgXem')&&coTC('doan')) out.push(['xeploai','4 · Đánh giá xếp loại',viecDG()||null]);
 return out;
}
function render(){
 rolebar(); header(); tabs();
 const c=$('#content');
 if(!ST.tab) c.innerHTML=khongCoQuyen('Hồ sơ HS thành viên');
 else if(ST.tab==='hoivien') c.innerHTML=veHoiVien();
 else if(ST.tab==='ketnap') c.innerHTML=veKetNap();
 else if(ST.tab==='xeploai') c.innerHTML=veXepLoai();
 else c.innerHTML=veDangKyUV();
 $('#btnNote').classList.toggle('on',!document.body.classList.contains('nn'));
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(document.body.classList.contains('nn')?'TẮT':'BẬT');
}

 modal('📤 Xuất dữ liệu — bắt buộc chọn mục đích',
  '<div class="warn">Dữ liệu chứa <b>họ tên và ngày sinh học sinh</b> — Luật BVDLCN 91/2025. '

  +'<label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>'

function suKien(t){
 if(suKienKLD(t)) return;  /* sổ kỷ luật Đoàn · hồ sơ đoàn viên — app.35 (chạy TRƯỚC tab 4: lối data-dgkl của tab 4 sang tab 1) */
 if(suKienDG(t)) return;   /* tab 4 — app.60 */
 const cd=t.closest('[data-chdot]'); if(cd){ST.chipDot=cd.dataset.chdot;render();return}
 const ch=t.closest('[data-chhv]'); if(ch){ST.chipHV=ch.dataset.chhv;render();return}
 const dot=t.closest('[data-dot]'); if(dot){ST.tab='ketnap';ST.curDot=dot.dataset.dot;ST.sub='tt';render();return}
 const bk=t.closest('[data-back]'); if(bk){ST.curDot=null;ST.sub='tt';render();return}

 /* thuộc tính HTML bị hạ chữ thường: data-toDK → dataset.todk (bản trước đọc dataset.toDK nên luôn ra undefined) */
 const td=t.closest('[data-todk]'); if(td){ST.tab='dangky';ST.dkDot=td.getAttribute('data-todk');ST.dkLop=null;ST.curDot=null;render();return}
 const rt=t.closest('[data-rut]'); if(rt){rutUV(rt.dataset.rut);return}

  u.tt='dangky';delete u.rutLy;toast('↩️ Đã đưa <b>'+esc(hsById(u.hs).ten)+'</b> lại vào danh sách.');render();return}
 const id=t.id;
 if(id==='doiDot'){ST.dkDot=null;ST.dkLop=null;render();return}
 if(id==='sangKetNap'){ST.tab='ketnap';ST.curDot=null;ST.chipDot='dang';render();return}
 if(id==='themUV'){themUV();return}
 if(id==='nhapExcel'){nhapExcel();return}
 if(id==='tickAll'){$$('.uvchk').forEach(x=>x.checked=true);return}
 if(id==='untickAll'){$$('.uvchk').forEach(x=>x.checked=false);return}
 if(id==='doiNguong'){doiNguong();return}
 if(id==='taoDot'){taoDot();return}
 if(id==='huyDot'){huyDot();return}
 if(id==='dongDK'){dongDK();return}
 if(id==='ketThucHL'){ketThucHL();return}
 if(id==='suaDot'){toast('✏️ Sửa đợt — đổi mốc thời gian sẽ <b>tính lại danh sách đủ tuổi</b> và gửi thông báo cho GVCN.');return}
 if(id==='xongXet'){xongXet();return}
 if(id==='kyQD'){kyQD();return}
 if(['xuatDot','xuatUV','xuatHV'].includes(id)){xuat();return}
}

/* ── deep-link D3 vào menu: ?tab=ketnap&ctx=KN-03&return=M6.14 · ?tab=dangky&ctx=KN-05 ── */

 if(QS.get('vai')&&ROLES[QS.get('vai')]) role=QS.get('vai');

 if(tb==='hoivien'&&cx&&HOIVIEN[cx]) ST.hsHV=cx;
 /* ?tab=xeploai&ctx=DG-2627&cd=CDO-9A2&action=sua|duyet — lối từ M0.2 (YKDD-1D mục E cho 2A) */
 if(tb==='xeploai'&&cx&&dgById(cx)){ST.curDG=cx; if(QS.get('cd')&&cdDG(QS.get('cd'))) ST.cdDG=QS.get('cd'); ST.sub=QS.get('action')==='duyet'&&!QS.get('cd')?'cd':'dv'}
 if(tb==='ketnap'&&cx&&dotById(cx)) ST.curDot=cx;
 if(tb==='dangky'&&cx&&dotById(cx)) ST.dkDot=cx;
 ST.ret=QS.get('return');
 if(R().sc!=='School'&&R().dt) ST.dt=R().dt;
})();
render();
