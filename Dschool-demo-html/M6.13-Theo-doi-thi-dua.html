.wrap{display:flex;min-height:calc(100vh - 56px)}

.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}

.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}

.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}

.stage.open .panel{display:block}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}

.tg.b{background:#fef3c7;color:#92400e}

.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}

.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}

.lpinfo.x{color:var(--red);font-weight:700}

.frow{display:flex;gap:9px;flex-wrap:wrap}

<script>
/* ══════════════ NỀN CHUNG — NHÓM 🎖 HOẠT ĐỘNG ĐOÀN - ĐỘI ══════════════
   ★ Tệp này CHÉP GIỐNG HỆT ở SÁU thư mục demo-src:
       M6.3-Hoat-dong-Doan-Doi · M6.13-Theo-doi-thi-dua · M6.14-Hoat-dong-va-Su-kien ·
       M6.15-To-chuc-va-Ban-chap-hanh · M6.16-Quan-ly-CLB · M6.17-Quy-hoat-dong
     (tách M6.3 thành ba menu ngày 14/9/2026 — phiên DOT1-P4A; P4B · P4C · P4E chép thêm; PZ sửa chú thích 14/9).
   Sáu demo phải CÙNG lớp, CÙNG học sinh, CÙNG người đăng nhập. Sửa một chỗ thì chép sang năm chỗ kia
   và so mã băm — sáu tệp phải trùng nhau từng byte. Phần riêng của từng menu nằm ở app.20-* trở đi. */

/* ========== TIỆN ÍCH ========== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const vn=n=>Number(n).toLocaleString('vi-VN');
const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4200)}
function closeM(){$('#mask').classList.remove('on')}
const mfns={};
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}
const THU=['CN','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const d2k=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const k2d=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const d2s=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
const k2s=k=>d2s(k2d(k));
const kThu=k=>THU[k2d(k).getDay()];
const HOMNAY='2026-10-23';                 /* Thứ Sáu */
/* deep-link D3 giữa ba menu: ?tab=…&ctx=…&return=…&vai=… — vai đi theo để người rà không phải chọn lại */
const QS=new URLSearchParams(location.search);

/* ========== LỚP ========== */
const DT={A:'Điểm trường A',B:'Điểm trường B',C:'Điểm trường C'};
const LOP=[
 {id:'6A1',dt:'A',khoi:6,gvcn:'Nguyễn Thị Hoa',n:38},{id:'6A2',dt:'A',khoi:6,gvcn:'Lê Văn Minh',n:35},
 {id:'6A3',dt:'A',khoi:6,gvcn:'Vũ Thị Mai',n:31},{id:'7A1',dt:'A',khoi:7,gvcn:'Đặng Thị Hồng',n:33},
 {id:'7A2',dt:'A',khoi:7,gvcn:'Phạm Văn Đức',n:26},{id:'8A1',dt:'A',khoi:8,gvcn:'Ngô Thanh Tùng',n:18},
 {id:'6B1',dt:'B',khoi:6,gvcn:'Hoàng Thị Nhung',n:30},{id:'7B1',dt:'B',khoi:7,gvcn:'Lý Thị Phượng',n:21},
 {id:'9A1',dt:'A',khoi:9,gvcn:'Trần Thị Vân',n:34},{id:'9A2',dt:'A',khoi:9,gvcn:'Bùi Quốc Hải',n:30},
 {id:'9B1',dt:'B',khoi:9,gvcn:'Ngô Thị Lan',n:25}
];
const lopById=id=>LOP.find(l=>l.id===id);

/* ── học sinh (sinh tất định, dùng chung mã với M1.1) ── */
const HO=['Nguyễn','Trần','Lê','Phạm','Hoàng','Đỗ','Vũ','Bùi','Đặng','Ngô','Dương','Lý','Phan','Trịnh'];
const DEM=['Văn','Thị','Minh','Thu','Quốc','Hải','Ngọc','Anh','Đức','Gia','Khánh','Phương','Thanh'];
const TEN=['An','Bình','Chi','Dũng','Giang','Hà','Hùng','Khang','Lan','Mai','Nam','Oanh','Phúc','Quân',
 'Sơn','Trang','Tú','Vy','Yến','Long','Linh','Nhung','Thắng','Kiên','Hạnh','Đạt','Thảo','Duy','Ngân'];
function rng(seed){let s=seed;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}
/* ★ hạt giống theo lớp — BĂM có thứ tự ký tự. Bản trước lấy TỔNG mã ký tự nên 6A3 · 7A2 · 8A1 (cùng tổng 170)
   ra cùng danh sách tên, cùng ngày sinh, cùng số chuyên cần — ba lớp giống hệt nhau. */
const hat=(s,k)=>s.split('').reduce((a,c)=>(a*31+c.charCodeAt(0))%99991,k)+1;
const HSC={};
function hsCuaLop(lopId){
 if(HSC[lopId]) return HSC[lopId];
 const l=lopById(lopId), r=rng(hat(lopId,7)*97), ds=[];
 for(let i=0;i<l.n;i++) ds.push({id:lopId+'-'+i,lop:lopId,dt:l.dt,khoi:l.khoi,
  ten:HO[Math.floor(r()*HO.length)]+' '+DEM[Math.floor(r()*DEM.length)]+' '+TEN[Math.floor(r()*TEN.length)],
  ma:'HS-2026-'+p2(Math.floor(r()*900)+100)+i});
 HSC[lopId]=ds; return ds;
}
const hsById=id=>hsCuaLop(id.split('-')[0]).find(x=>x.id===id);

/* ========== NĂM HỌC & TUẦN ==========
   Sao đỏ chấm theo TUẦN, nên tuần là một thực thể có thật (số hiệu, ngày đầu, ngày cuối).
   Mốc năm học do UBND tỉnh quyết định — tham số, không hard-code. */
const NAMHOC={ten:'2026–2027',khaiGiang:'2026-09-05',tuan1:'2026-09-07',
 hk1:['2026-09-05','2027-01-16'],hk2:['2027-01-17','2027-05-31'],soTuan:35};
function tuanCua(k){const a=k2d(NAMHOC.tuan1), d=k2d(k); return Math.floor((d-a)/(7*864e5))+1}
function ngayDauTuan(n){const d=k2d(NAMHOC.tuan1); d.setDate(d.getDate()+(n-1)*7); return d2k(d)}
function ngayCuoiTuan(n){const d=k2d(ngayDauTuan(n)); d.setDate(d.getDate()+5); return d2k(d)}  /* T2 → T7 */
function ngayTrongTuan(n,thu){const d=k2d(ngayDauTuan(n)); d.setDate(d.getDate()+thu); return d2k(d)} /* thu: 0 = Thứ Hai */
const TUAN_NAY=tuanCua(HOMNAY);
const kyCuaTuan=n=>ngayDauTuan(n)<=NAMHOC.hk1[1]?'hk1':'hk2';
const thangCuaTuan=n=>ngayDauTuan(n).slice(0,7);

/* ========== NGÀY SINH — ĐIỀU KIỆN TUỔI QUYẾT ĐỊNH AI ĐƯỢC KẾT NẠP ==========
   ★ Không suy tuổi từ khối lớp: một lớp 9 có em sinh tháng 1 và em sinh tháng 12. */
const NAMSINH={6:2015,7:2014,8:2013,9:2012};
(function ganNgaySinh(){
 LOP.forEach(l=>{
  const r=rng(hat(l.id,11)*53);
  hsCuaLop(l.id).forEach(h=>{
   const nam=NAMSINH[l.khoi]-(r()<0.06?1:0);          /* vài em học muộn một năm */
   const th=Math.floor(r()*12)+1, ng=Math.floor(r()*27)+1;
   h.ns=nam+'-'+p2(th)+'-'+p2(ng);
  });
 });
})();
function tuoiTai(ns,moc){
 const a=k2d(ns), b=k2d(moc);
 let t=b.getFullYear()-a.getFullYear();
 const m=b.getMonth()-a.getMonth();
 if(m<0||(m===0&&b.getDate()<a.getDate())) t--;
 return t;
}
/* ★ ĐIỀU LỆ, không phải quy ước nội bộ: Đội 9 → hết 15 tuổi · Đoàn từ đủ 15 tuổi + 1 ngày → 30 tuổi */
const duTuoiDoi=(hs,moc)=>{const t=tuoiTai(hs.ns,moc); return t>=9&&t<=15};
function duTuoiDoan(hs,moc){
 const d=k2d(hs.ns); d.setFullYear(d.getFullYear()+15); d.setDate(d.getDate()+1);
 return d2k(d)<=moc && tuoiTai(hs.ns,moc)<=30;
}
function ngayDuTuoiDoan(hs){const d=k2d(hs.ns); d.setFullYear(d.getFullYear()+15); d.setDate(d.getDate()+1); return d2k(d)}

/* ========== TỔ CHỨC: ĐỘI và ĐOÀN — MỘT TRỤC PHẠM VI, không phải bộ lọc ========== */
const TOCHUC={doi:{ten:'Đội TNTP Hồ Chí Minh',ngan:'Đội',icon:'🔴',phutrach:'Tổng phụ trách Đội',
  khoi:[6,7,8],dieule:'Đội viên: thiếu niên từ 9 đến hết 15 tuổi'},
 doan:{ten:'Đoàn TNCS Hồ Chí Minh',ngan:'Đoàn',icon:'🔵',phutrach:'Bí thư Đoàn trường',
  khoi:[9],dieule:'Đoàn viên: từ đủ 15 tuổi + 1 ngày đến 30 tuổi'}};

/* ========== NGƯỜI ĐĂNG NHẬP — cùng người ở cả ba menu ==========
   Năng lực (mảng q) do từng menu gán ở app.20 — cùng một người, mỗi menu một bộ quyền. */
const ROLES={
 FULL:{n:'Trần Minh Đức',cd:'🔓 Đủ quyền (demo)',sc:'School',dt:null,tc:['doi','doan']},
 TPT :{n:'Đỗ Thị Bích Ngọc',cd:'Tổng phụ trách Đội',sc:'School',dt:null,tc:['doi']},
 BTD :{n:'Vũ Đình Trung',cd:'Bí thư Đoàn trường',sc:'School',dt:null,tc:['doan']},
 HT  :{n:'Nguyễn Quang Huy',cd:'Hiệu trưởng',sc:'School',dt:null,tc:['doi','doan']},
 PHT :{n:'Lý Thanh Bình',cd:'PHT Điểm trường A',sc:'Branch',dt:'A',tc:['doi','doan']},
 GVCN:{n:'Nguyễn Thị Hoa',cd:'GVCN 6A1',sc:'Class',dt:'A',lop:['6A1'],tc:['doi','doan']},
 VT  :{n:'Phan Thị Thảo',cd:'Văn thư',sc:'Branch',dt:'A',tc:['doi','doan']}
};
let role='FULL';
if(QS.get('vai')&&ROLES[QS.get('vai')]) role=QS.get('vai');
const R=()=>ROLES[role];
const can=q=>(R().q||[]).includes(q);
const tcCua=()=>R().tc;
const coTC=tc=>tcCua().includes(tc);
const motTC=()=>tcCua().length===1?tcCua()[0]:null;
const dtHieuLuc=()=>R().sc==='School'?ST.dt:R().dt;
const dtThuc=()=>{const d=dtHieuLuc();return d==='ALL'?'A':d};
function lopTrongPhamVi(){
 const r=R();
 if(r.sc==='Class') return LOP.filter(l=>r.lop.includes(l.id));
 const d=dtHieuLuc();
 return LOP.filter(l=>d==='ALL'||l.dt===d);
}
/* sáu menu cùng nhóm + hai menu ngoài nhóm được nhóm deep-link tới — dùng cho D3 (PZ 14/9: gom các dòng các demo tự thêm ở app.20/app.30;
   các dòng tự thêm đó còn để nguyên — gán lại cùng giá trị, vô hại) */
const FILE_MENU={'M6.3':'M6.3-Hoat-dong-Doan-Doi.html','M6.13':'M6.13-Theo-doi-thi-dua.html',
 'M6.14':'M6.14-Hoat-dong-va-Su-kien.html','M6.15':'M6.15-To-chuc-va-Ban-chap-hanh.html','M6.16':'M6.16-Quan-ly-CLB.html',
 'M6.17':'M6.17-Quy-hoat-dong.html','M4.3':'M4.3-Chuc-danh-va-Diem-cong-tac.html','M7.5':'M7.5-Thu-chi-va-Bao-cao-tai-chinh.html'};
function linkMenu(ma,q){return FILE_MENU[ma]+'?'+q+'&vai='+role}

/* ========== KHUNG MÀN HÌNH ========== */
function rolebar(){
 $('#rolebar').innerHTML='<b>Vai trò:</b>'+Object.keys(ROLES).map(k=>
  '<button class="rb'+(k===role?' on':'')+'" data-r="'+k+'">'+esc(ROLES[k].cd)+'</button>').join('')
 +'<span class="simw">Hôm nay (mô phỏng): <b style="color:#e2e8f0">'+kThu(HOMNAY)+' '+k2s(HOMNAY)
 +' — tuần '+TUAN_NAY+'</b></span>'
 +'<button class="ntg" id="btnNote">💡 Ghi chú thiết kế: TẮT</button>';
}
function header(){
 const r=R();
 $('#ava').textContent=r.n.split(' ').slice(-2).map(x=>x[0]).join('');
 const khoa=r.sc!=='School';
 $('#hdt').innerHTML=(r.sc==='School'?'<option value="ALL">Tất cả điểm trường</option>':'')
  +Object.keys(DT).map(d=>'<option value="'+d+'">'+DT[d]+'</option>').join('');
 $('#hdt').value=khoa?(r.dt||'A'):ST.dt; $('#hdt').disabled=khoa;
 $('#dtlock').textContent=khoa?'🔒 khóa theo phạm vi '+r.sc:'';
 const n=viecCanLam();
 $('#ndot').textContent=n||''; $('#ndot').style.display=n?'grid':'none';
}
function tabs(){
 const t=tabsOK();
 if(!t.length){$('#tabs').innerHTML='';ST.tab=null;return}
 if(!t.find(x=>x[0]===ST.tab)) ST.tab=t[0][0];
 $('#tabs').innerHTML=t.map(([k,n,b])=>'<button class="tab1'+(k===ST.tab?' on':'')+'" data-t="'+k+'">'+n
  +(b?'<span class="b r">'+b+'</span>':'')+'</button>').join('');
}
function scopeBar(extra){
 const r=R(), tcs=tcCua().map(t=>TOCHUC[t].icon+' '+TOCHUC[t].ngan).join(' + ');
 if(r.sc==='Class'){
  const l=lopById(r.lop[0]);
  return '<div class="scope"><span>🎨</span><span class="sp">Vai <b>'+esc(r.cd)+'</b> — '+esc(r.n)
   +'. Phạm vi: <b>Class — '+l.id+'</b> ('+hsCuaLop(l.id).length+' học sinh, '+DT[l.dt]+'). '
   +'Dữ liệu lớp khác <b>không có trong kết quả trả về</b>.'+(extra?' '+extra:'')+'</span></div>';
 }
 const pv = r.sc==='School' ? (ST.dt==='ALL'?'School — toàn trường':'School (đang lọc '+DT[ST.dt]+')')
   : 'Branch — '+DT[r.dt];
 return '<div class="scope"><span>🎨</span><span class="sp">Vai <b>'+esc(r.cd)+'</b> — '+esc(r.n)
  +'. Phạm vi: <b>'+pv+'</b> · Tổ chức: <b>'+tcs+'</b>. Thấy <b>'+lopTrongPhamVi().length+' lớp</b>'
  +(motTC()?', và <b>chỉ dữ liệu của '+TOCHUC[motTC()].ngan+'</b> — phần '
    +(motTC()==='doi'?'Đoàn':'Đội')+' <b>không có trong kết quả trả về</b>':'')+'.'
  +(extra?' '+extra:'')+'</span></div>';
}
function dnote(html){return '<div class="dnote">💡 <b>Ghi chú thiết kế.</b> '+html+'</div>'}
function subtabs(list,cur){
 return '<div class="bar" style="padding-bottom:4px">'+list.map(([k,n])=>
  '<button class="chip'+(cur===k?' on':'')+'" data-sub="'+k+'">'+n+'</button>').join('')+'</div>';
}
/* vai không có tab nào ở menu này — nói rõ, không để màn hình trắng */
function khongCoQuyen(tenMenu,lyDo){
 return scopeBar()+'<div class="empty">Vai <b>'+esc(R().cd)+'</b> không có quyền ở menu <b>'+tenMenu+'</b> — '
  +'trên hệ thống thật, menu này <b>không hiện</b> ở sidebar của vai này.'
  +(lyDo?'<div style="font-size:12px;margin-top:6px">'+lyDo+'</div>':'')+'</div>';
}

/* ========== SỰ KIỆN CHUNG — phần riêng của menu nằm trong suKien(t) ========== */
mfns.bclose=()=>closeM();
document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 if(t===$('#mask')){closeM();return}
 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r;doiTab(ST.tab);if(R().sc!=='School'&&R().dt)ST.dt=R().dt;render();return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn');render();return}
 const tb=t.closest('#tabs [data-t]'); if(tb){doiTab(tb.dataset.t);render();return}
 const sb=t.closest('[data-sub]'); if(sb){ST.sub=sb.dataset.sub;render();return}
 suKien(t,e);
});
$('#hdt').onchange=e=>{ST.dt=e.target.value;render()};


/* ══════════════ M6.13 THEO DÕI THI ĐUA — DỮ LIỆU RIÊNG ══════════════
   Tách từ M6.3 ngày 14/9/2026 (DOT1-P4A): tab Chấm sao đỏ · Xếp hạng thi đua · ⚙ Cấu hình — giữ mã Feature cũ.
   Thay đổi thật sự khi tách: SAO ĐỎ ĐỌC VI PHẠM TỪ SỔ ĐẦU BÀI (M2.2 F4) — góp ý Đợt 1 mục 10.
   ★ YKDD-1A (17/9/2026): tab đổi nhãn «Chấm nền nếp» (mã m6.3.cham_sao_do giữ) · tab mới «Lịch trực & lực lượng nền nếp»
     (m6.13.lich_truc_luc_luong) · cột lực lượng chấm · tiêu chí tùy chọn «Hoàn thành nhiệm vụ trực tuần» — hợp đồng HDDD ④.
     QUYỀN NHẬP ĐIỂM KHÔNG ĐỔI: GVCN lớp trực KHÔNG có chamSD. Tên biến nội bộ chamSD/chotSD giữ — chỉ đổi chữ hiển thị. */

/* vai thêm ở đây, KHÔNG sửa nền chung (đóng băng — DD-S3): GVCN lớp trực tuần 7 của ca DD1 */
ROLES.GVCN92={n:'Bùi Quốc Hải',cd:'GVCN 9A2 (lớp trực tuần 7)',sc:'Class',dt:'A',lop:['9A2'],tc:['doi','doan']};
/* lichTruc = T·S tab Lịch trực & lực lượng (sinh lịch · đổi lịch · cấu hình vòng · chọn lực lượng) · xuatLich = XD tab đó */
const QALL=['xem','chamSD','chotSD','congboSD','cauhinh','xuat','lichTruc','xuatLich'];
const QUYEN={
 FULL:QALL,
 TPT :['xem','chamSD','chotSD','congboSD','cauhinh','xuat','lichTruc','xuatLich'],
 BTD :['xem','chamSD','chotSD','congboSD','cauhinh','xuat','lichTruc','xuatLich'],
 HT  :['xem','congboSD','xuat'],
 PHT :['xem','congboSD','xuat'],
 GVCN:['xem'],
 GVCN92:['xem'],
 VT  :['xem','chamSD','xuat']
};
Object.keys(ROLES).forEach(k=>ROLES[k].q=QUYEN[k]||[]);

/* ══════════════ TIÊU CHÍ ══════════════
   ★ YKDD-1A: mỗi tiêu chí NHẬP TAY mang «luc» = lực lượng chấm (lop_truc · ban_nen_nep · nguoi_phu_trach — C2-4);
     tiêu chí tự động luc=null (máy đọc số từ menu chủ). Tiêu chí TÙY CHỌN «tr» chỉ áp lớp đang trực, NẰM NGOÀI tổng 100%.

/* ── tính điểm ── */
function diemTC(lop,w,tc){
 if(laAuto(tc)){
  const c=chotCua(w,lopById(lop).dt);
  if(c&&c.snap[lop]&&c.snap[lop][tc]!=null) return c.snap[lop][tc];
  return nguonNay(lop,w,tc);
 }
 const b=CHAM[lop+'|'+w]; return b&&b[tc]!=null?b[tc]:null;
}
/* tổng — DẪN XUẤT theo trọng số; tuần đã chốt dùng TRỌNG SỐ LÚC CHỐT */
function tongDiem(lop,w){
 const b=CHAM[lop+'|'+w]; if(!b) return null;
 const c=chotCua(w,lopById(lop).dt), ts=c?c.ts:null;
 let s=0;
 TIEUCHI.forEach(t=>{const tr=ts?ts[t.id]:(t.tuyChon&&!t.bat?null:t.ts); if(tr==null) return;
  if(t.tuyChon&&!laLopTruc(lop,w)) return;            /* «Hoàn thành nhiệm vụ trực» chỉ áp lớp đang trực */
  const d=diemTC(lop,w,t.id); if(d==null) return;
  s+= t.tuyChon? -((10-d)*tr/100) : t.tru? -(d*tr/100) : d*tr/100});
 return Math.round(s*100)/100;
}
/* cột hiện trên bảng của một tuần — tuần đã chốt theo trọng số ĐÃ CHỤP (tiêu chí tùy chọn tắt lúc chốt thì không hiện) */
function tcHien(w,dt){const c=chotCua(w,dt); return TIEUCHI.filter(t=>!t.tuyChon||(c?c.ts[t.id]!=null:t.bat))}
const daCham=(lop,w)=>!!CHAM[lop+'|'+w];
/* nguồn đổi sau khi chốt — phải nói ra ĐÍCH DANH, không tự sửa bảng đã chốt */
function nguonLech(lop,w){
 const c=chotCua(w,lopById(lop).dt); if(!c||!c.snap[lop]) return null;
 const sn=c.snap[lop], d=[];
 ['cc','yt','vt'].forEach(tc=>{const nay=nguonNay(lop,w,tc);
  if(sn[tc]!=null&&nay!=null&&Math.abs(sn[tc]-nay)>0.05) d.push({tc,chot:sn[tc],nay})});
 const nayIds=vpCua(lop,w).map(v=>v.id);
 const bo=sn.vtDs.filter(id=>!nayIds.includes(id)).map(id=>VPSDB.find(v=>v.id===id));
 const them=nayIds.filter(id=>!sn.vtDs.includes(id)).map(id=>VPSDB.find(v=>v.id===id));
 return d.length||bo.length||them.length?{d,bo,them}:null;
}
/* danh sách vi phạm hiển thị cho một lớp-tuần: tuần đã chốt thì theo BẢN CHỤP, kèm dấu dòng đã đính chính / ghi thêm */
function vpHienThi(lop,w){
 const c=chotCua(w,lopById(lop).dt);
 if(!c||!c.snap[lop]) return vpCua(lop,w).map(v=>({v,trangThai:''}));
 const ids=c.snap[lop].vtDs, out=ids.map(id=>{const v=VPSDB.find(x=>x.id===id);return {v,trangThai:v.dinhChinh?'dinhchinh':''}});
 vpCua(lop,w).filter(v=>!ids.includes(v.id)).forEach(v=>out.push({v,trangThai:'themsau'}));
 return out;
}

/* ── xếp hạng: TRONG TỪNG ĐIỂM TRƯỜNG ── */
function bangTuan(w,dt){
 const ds=LOP.filter(l=>l.dt===dt).map(l=>({lop:l,diem:tongDiem(l.id,w)}));
 const co=ds.filter(x=>x.diem!=null).sort((a,b)=>b.diem-a.diem);
 co.forEach((x,i)=>x.hang=i+1);
 return {co,thieu:ds.filter(x=>x.diem==null).map(x=>x.lop)};
}
function bangKy(tu,den,dt){
 const ds=LOP.filter(l=>l.dt===dt).map(l=>{
  let s=0,n=0,ct=[];
  for(let w=tu;w<=den;w++){const d=tongDiem(l.id,w); ct.push(d); if(d!=null){s+=d;n++}}
  return {lop:l,tb:n?Math.round(s/n*100)/100:null,n,ct};
 });
 const co=ds.filter(x=>x.tb!=null).sort((a,b)=>b.tb-a.tb);
 co.forEach((x,i)=>x.hang=i+1);
 return {co,thieu:ds.filter(x=>x.tb==null).map(x=>x.lop)};
}

   if(lopVaoVong(dt,w,c)){lop=c;p=(p+k+1)%cf.thuTu.length;break}}
  if(lop) LICH[dt+'|'+w]={dt,w,lop,doi:null}; else delete LICH[dt+'|'+w];
 }
}

}

 o3.slice(0,2).forEach(h=>them('doi',h,'Thành viên','Điểm trường B — toàn điểm','Đỗ Thị Bích Ngọc'));
})();

  +'Hệ thống <b>giữ nguyên số đã chốt</b> và <b>không tự sửa bảng</b>.'
  +'<div style="margin-top:6px">'+lech.map(x=>'<div style="font-size:12px">• <b>'+x.l.id+'</b>: '
    +x.d.d.map(y=>tcById(y.tc).ten+' chốt <b>'+y.chot+'</b> → nay <b>'+y.nay+'</b>').join(' · ')
    +x.d.bo.map(v=>'<div style="margin-left:14px">— sổ đầu bài <b>bỏ</b> ghi nhận «'+esc(tenVP(v.ma))+'» của <b>'
      +(v.hs?esc(hsById(v.hs).ten):'cả lớp')+'</b> (tiết '+v.tiet+' '+kThu(ngayVP(v))+' '+k2s(ngayVP(v)).slice(0,5)+', '
      +esc(GV[v.gv][0])+')'+(v.dinhChinh?' — '+esc(v.dinhChinh.ly)+', duyệt '+k2s(v.dinhChinh.ngay):'')+'</div>').join('')
    +x.d.them.map(v=>'<div style="margin-left:14px">— sổ đầu bài <b>ghi thêm</b> «'+esc(tenVP(v.ma))+'» sau khi chốt</div>').join('')
    +'</div>').join('')
  +'</div></div>';
 if(!lopCN) h+='<div class="bar">'
  +'<span class="chip">Đã chấm <b>'+(ls.length-chuaCham.length)+'/'+ls.length+'</b> lớp</span>'
  +(chuaCham.length?'<span class="chip" style="border-color:var(--red);color:var(--red)">Còn thiếu: '
    +chuaCham.map(l=>l.id).join(', ')+'</span>':'')
  +'<div class="spacer"></div>'
  +(can('chotSD')&&!c?'<button class="btn'+(chuaCham.length?'':' p')+'" id="chotTuan">🔒 Chốt tuần '+w+'</button>':'')
  +(can('congboSD')&&c&&!c.congbo?'<button class="btn p" id="congboTuan">📣 Công bố xếp hạng tuần</button>':'')
  +(can('xuat')?'<button class="btn" id="xuatSD">📤 Xuất</button>':'')+'</div>';
 else h+='<div style="height:10px"></div>';
 h+='<div class="tbw"><div class="tbx"><table style="min-width:1180px"><tr><th>Lớp</th>'
  +tcHien(w,dt).map(t=>'<th class="num" style="min-width:74px">'+t.ngan+'<div style="font-weight:400;font-size:10px;color:var(--ink3);text-transform:none">'
    +(t.tru||t.tuyChon?'trừ ':'')+((c&&c.ts[t.id]!=null)?c.ts[t.id]:t.ts)+'%'+(t.tuyChon?' · chỉ lớp trực':'')
    +(t.nguon?'<br>🔗'+t.nguon:'<br>👥 '+esc(tenLucCham(t.luc,dt)))+'</div></th>').join('')
  +'<th class="num">Tổng</th><th class="num">Hạng</th><th>Người chấm</th><th></th></tr>';
 const bang=bangTuan(w,dt);
 const hangCua={}; bang.co.forEach(x=>hangCua[x.lop.id]=x.hang);
 ls.forEach(l=>{
  const b=CHAM[l.id+'|'+w], tong=tongDiem(l.id,w), khoa=!!(c&&c.congbo);
  const truc=laLopTruc(l.id,w);
  h+='<tr'+(!b?' class="badrow"':'')+(ST.ctxLop===l.id?' style="outline:2px solid var(--brand)"':'')+'><td><b>'+l.id+'</b>'
   +(truc?' <span class="tg a" title="máy gắn từ lịch trực">🛡 lớp trực tuần</span>':'')+'<div style="font-size:10.5px;color:var(--ink3)">'
   +esc(l.gvcn)+'</div></td>';
  tcHien(w,dt).forEach(t=>{
   const d=diemTC(l.id,w,t.id);
   if(t.tuyChon&&!truc){h+='<td class="num" style="font-size:10.5px;color:var(--ink3)">không áp</td>';return}
   if(t.nguon) h+='<td class="num ro2"><b>'+(d==null?'—':d)+'</b>'
     +'<div style="font-size:10px;color:var(--ink3)">'+canCuTC(l.id,w,t)+'</div></td>';
   else h+='<td class="num">'+(b?(can('chamSD')&&!khoa
      ?'<input class="cell" data-cell="'+l.id+'|'+t.id+'" value="'+(d==null?'':d)+'" type="number" step="0.5" min="0" max="10"'
       +(t.tuyChon&&d==null?' style="border-color:var(--red)" title="lớp trực chưa được chấm tiêu chí trực"':'')+'>'
      :'<b>'+(d==null?'—':d)+'</b>'):'—')+'</td>';
  });
  h+='<td class="num"><b style="font-size:15px">'+(tong==null?'—':tong)+'</b></td>'
   +'<td class="num">'+(hangCua[l.id]?'<span class="st2 '+(hangCua[l.id]===1?'o':hangCua[l.id]<=3?'b':'n')+'">'
     +hangCua[l.id]+(lopCN?'/'+bang.co.length:'')+'</span>':'—')+'</td>'
   +'<td style="font-size:11.5px;color:var(--ink2)">'+(b?esc(b.boi)+'<div style="font-size:10.5px;color:var(--ink3)">'+b.luc+'</div>':'<span style="color:var(--red)">chưa chấm</span>')+'</td>'
   +'<td>'+(can('chamSD')&&!khoa?'<button class="btn xs'+(b?'':' p')+'" data-cham="'+l.id+'">'
     +(b?'Sửa':'Chấm')+'</button>':'<button class="btn xs" data-cham="'+l.id+'">Xem căn cứ</button>')+'</td></tr>';
 });
 h+='</table></div><div class="lgd">'
  +'<span class="chip">Ô nền xám là <b>số chiếu từ menu khác</b> — sửa ở menu chủ, không sửa ở đây</span>'
  +'<span class="chip" style="border-color:var(--amber);color:#92400e">⚠ Vi phạm <b>đã ghi trong sổ đầu bài</b> không nhập lại ở cột '
  +'<b>VP ngoài giờ</b> — máy không phân biệt được, nhập lại là trừ hai lần</span>'
  +'<span class="chip">🛡 <b>Lớp trực</b> vẫn bị chấm như mọi lớp; «Trực tuần» chỉ áp lớp đó — <b>trừ phần chưa hoàn thành</b>, nằm ngoài tổng 100%</span>'
  +'<span class="chip">Xếp hạng tính <b>trong từng điểm trường</b>'+(lopCN?' — trên cả điểm trường, nhưng điểm của lớp khác không có trong kết quả trả về':'')+'</span>'
  +'</div></div>';
 if(lopCN) h+='<div style="margin-top:12px">'+bangCanCu(R().lop[0],w,true)+'</div>';
 return h;
}
/* bảng căn cứ của MỘT lớp — dùng ở phiếu chấm và ở màn hình GVCN (phạm vi Class) */
function bangCanCu(lop,w,daydu){
 const g=nguonCua(lop,w), vs=vpHienThi(lop,w);
 let h='<div class="tbw" style="margin-bottom:11px"><div class="ch">'+(daydu?'Điểm và căn cứ — lớp '+lop+' · tuần '+w
   :'Ba ô lấy từ menu khác — chỉ đọc')+'<span class="sp"></span><span class="tg c">chỉ đọc</span></div><table>'
  +'<tr><th>Tiêu chí</th><th class="num">Điểm</th><th>Căn cứ</th></tr>';
 const dtl=lopById(lop).dt;
 tcHien(w,dtl).filter(t=>(daydu||t.nguon)&&(!t.tuyChon||laLopTruc(lop,w))).forEach(t=>{
  const d=diemTC(lop,w,t.id);
  h+='<tr'+(t.nguon?' class="rorow"':'')+'><td>'+t.ten+(t.tru||t.tuyChon?' <span class="tg r">trừ '+t.ts+'%</span>':'')
   +(t.nguon?' <span class="tg c">🔗 '+t.nguon+(t.id==='vt'?' F4':'')+'</span>':'')+'</td>'
   +'<td class="num"><b>'+(d==null?'—':d)+'</b></td><td style="font-size:11.5px">';
  /* tuần đã chốt: điểm là SỐ CHỤP, căn cứ là nguồn HIỆN TẠI — lệch thì nói ra ngay tại dòng */
  const doiSauChot=t.nguon&&t.id!=='vt'&&d!=null&&nguonNay(lop,w,t.id)!=null&&Math.abs(d-nguonNay(lop,w,t.id))>0.05
   ?' <span class="tg b">nguồn nay '+nguonNay(lop,w,t.id)+' — điểm giữ số chốt</span>':'';
  if(t.id==='cc') h+=(g?g.pctCC+'% có mặt — vắng '+g.vang+'/'+g.tongLuot+' lượt trong tuần':'—')+doiSauChot;
  else if(t.id==='yt') h+=(g?'Xếp loại tiết: '+moTaTiet(g):'—')+doiSauChot;
  else if(t.id==='vt') h+=vs.length?bangVP(vs):'<span style="color:var(--ink3)">Sổ đầu bài không ghi vi phạm nào trong tuần</span>';
  else h+='<span style="color:var(--ink2)">'+esc(t.mota)+'</span> <span class="tg c">👥 '+esc(tenLucCham(t.luc,dtl))+'</span>';
  h+='</td></tr>';
 });
 if(daydu) h+='<tr class="totrow"><td><b>Tổng</b></td><td class="num"><b style="font-size:15px">'
  +(tongDiem(lop,w)==null?'—':tongDiem(lop,w))+'</b></td><td></td></tr>';
 return h+'</table><div class="lgd"><span class="chip">Sai số ở ô xám thì sửa tại <b>menu chủ</b> — sổ đầu bài sửa sau chốt '
  +'qua <b>đề nghị sửa (M2.2 F6)</b></span></div></div>';
}
function bangVP(vs){
 return '<table class="lt" style="margin-top:2px"><tr><th>Học sinh</th><th>Hành vi</th><th>Tiết</th><th>GV ghi</th><th>Trừ</th></tr>'
  +vs.map(({v,trangThai})=>'<tr'+(trangThai?' style="opacity:.6"':'')+'><td>'+(v.hs?'<b>'+esc(hsById(v.hs).ten)+'</b>':'<span class="tg b">cả lớp</span>')+'</td>'
   +'<td>'+esc(tenVP(v.ma))+' <span style="color:var(--ink3)">'+v.ma+'</span>'
   +(v.gc?'<div style="color:var(--ink3)">'+esc(v.gc)+'</div>':'')
   +(trangThai==='dinhchinh'?'<div><span class="tg r">đã đính chính sau chốt — số chốt vẫn giữ</span></div>':'')
   +(trangThai==='themsau'?'<div><span class="tg b">ghi thêm sau chốt — chưa tính</span></div>':'')+'</td>'
   +'<td>Tiết '+v.tiet+' · '+kThu(ngayVP(v))+' '+k2s(ngayVP(v)).slice(0,5)+'<div style="color:var(--ink3)">'+GV[v.gv][1]+'</div></td>'
   +'<td>'+esc(GV[v.gv][0])+'</td><td class="num"><b>−'+diemTruCua(v.ma)+'</b></td></tr>').join('')
  +'</table>';
}
function moVP(lop){
 const w=ST.tuan, vs=vpHienThi(lop,w);
 modal('🔗 Vi phạm ghi trong sổ đầu bài — '+lop+' · tuần '+w,
  '<div class="ro">Bản chiếu <b>chỉ đọc</b> của M2.2 F4 — mỗi dòng đúng như giáo viên bộ môn đã ghi trong tiết. '
  +'Điểm trừ quy đổi theo bảng <b>hành vi → điểm trừ</b> ở ⚙ Cấu hình; tên hành vi là <b>danh mục của M2.7</b>.</div>'
  +(vs.length?bangVP(vs):'<div class="empty">Sổ đầu bài không ghi vi phạm nào của lớp trong tuần này.</div>')
  +'<div class="lgd" style="padding-left:0"><span class="chip">Tổng quy đổi <b>'+diemTC(lop,w,'vt')+'</b> điểm (tối đa 10) × trọng số trừ '
  +tcById('vt').ts+'%</span></div>',
  '<button class="btn p" data-mb="close">Đóng</button>');
}
function moCham(lopId){
 const w=ST.tuan, b=CHAM[lopId+'|'+w]||{}, c=chotCua(w,lopById(lopId).dt);
 const sua=can('chamSD')&&!(c&&c.congbo), dtl=lopById(lopId).dt, truc=laLopTruc(lopId,w);
 if(!sua){modal('Căn cứ điểm nền nếp — '+lopId+' · tuần '+w,bangCanCu(lopId,w,true),'<button class="btn p" data-mb="close">Đóng</button>');return}
 mfns.bCham=()=>{
  const v={};
  $$('#mb .fldi[id^="c_"]').forEach(el=>{const id=el.id.slice(2), t=tcById(id);
   v[id]=t.tuyChon?(el.value===''?null:Math.max(0,Math.min(10,parseFloat(el.value)||0))):(parseFloat(el.value)||0)});
  CHAM[lopId+'|'+w]={...(CHAM[lopId+'|'+w]||{}),...v,boi:R().n,luc:k2s(HOMNAY)+' 16:30'};
  closeM(); toast('💾 Đã lưu phiếu nền nếp <b>'+lopId+'</b> tuần '+w+' — tổng <b>'+tongDiem(lopId,w)+'</b>. '
   +'Bản ghi mang tên <b>'+esc(R().n)+'</b> (nhập từ phiếu giấy).'
   +(truc?' Lớp đang trực tuần này — vẫn bị chấm như mọi lớp.':'')); render();
 };
 modal('Chấm nền nếp — '+lopId+' · tuần '+w+(truc?' <span class="tg a">🛡 lớp trực tuần</span>':''),
  '<div class="info">Lực lượng chấm (<b>'+esc(tenLucLuong(dtl))+'</b>, lớp trực tuần, người phụ trách) ghi <b>phiếu giấy</b>; bạn nhập lại vào đây. '
  +'Bản ghi mang tên bạn — <b>học sinh không có tài khoản</b>. GVCN lớp trực <b>không nhập</b>, chỉ nộp phiếu tổng hợp.</div>'
  +bangCanCu(lopId,w,false)
  +tcHien(w,dtl).filter(t=>!t.nguon&&(!t.tuyChon||truc)).map(t=>'<label class="lbl">'+t.ten+' <span style="font-weight:400;color:var(--ink3)">— '
    +(t.tru?'điểm TRỪ, ':'')+(t.tuyChon?'TÙY CHỌN, chỉ lớp trực — 10 = hoàn thành đủ, trừ phần thiếu × ':'trọng số ')+t.ts+'% · '
    +'<b>lực lượng chấm: '+esc(tenLucCham(t.luc,dtl))+'</b> · '+esc(t.mota)+'</span></label>'
   +(t.id==='vp'?'<div class="warn" style="margin:4px 0 0;font-size:12px">⚠ Chỉ ghi vi phạm <b>ngoài giờ học</b> (cổng trường, giờ ra chơi, xếp hàng). '
     +'Vi phạm <b>đã có trong sổ đầu bài</b> nằm ở dòng 🔗 M2.2 phía trên — nhập lại ở đây là <b>trừ hai lần</b>, '
     +'và máy <b>không có cách nhận ra</b>.</div>':'')
   +'<input class="fldi" id="c_'+t.id+'" type="number" step="0.5" min="0" max="10" value="'+(b[t.id]!=null?b[t.id]:'')+'">').join(''),
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="Cham">Lưu phiếu</button>');
}
function chotTuan(){
 const dt=dtThuc(), w=ST.tuan, ls=lopTrongPhamVi().filter(l=>l.dt===dt);
 const thieu=ls.filter(l=>!daCham(l.id,w));
 mfns.bChot=()=>{
  const snap={}; LOP.filter(l=>l.dt===dt).forEach(l=>{snap[l.id]=chupSnap(l.id,w)});
  const lt=lichCua(dt,w);
  CHOT[w+'|'+dt]={luc:k2s(HOMNAY)+' 17:00',boi:R().n,ts:trongSo(),snap,congbo:null,nhanLopTruc:lt?lt.lop:null};
  closeM(); toast('🔒 Đã chốt tuần '+w+' — <b>'+DT[dt]+'</b>. Ba số nguồn, danh sách vi phạm sổ đầu bài, trọng số và nhãn <b>lớp trực tuần'
   +(lt?' '+lt.lop:'')+'</b> đã được <b>chụp lại</b>.'); render();
 };
 modal('🔒 Chốt tuần '+w+' — '+DT[dt],
  (thieu.length?'<div class="danger">⛔ Còn <b>'+thieu.length+' lớp chưa chấm</b>: '+thieu.map(l=>l.id).join(', ')
   +'. Chốt bây giờ thì các lớp này <b>không có điểm và không có hạng</b>. Nên chấm nốt trước.</div>'
   :'<div class="okbox">✅ Đã chấm đủ <b>'+ls.length+'/'+ls.length+'</b> lớp.</div>')
  +'<div class="info">Chốt tuần sẽ <b>chụp lại</b> tại thời điểm này: <b>chuyên cần</b> (M2.9/T2), <b>ý thức trong tiết</b> (M2.2), '
  +'<b>danh sách vi phạm ghi trong sổ đầu bài</b> (M2.2 F4), <b>trọng số</b> và nhãn <b>lớp trực tuần'
  +(lichCua(dt,w)?' '+lichCua(dt,w).lop:' (không có)')+'</b> — đổi lịch sau khi chốt không đổi nhãn đã chụp.<br>'
  +'<b>Vì sao phải chụp:</b> đơn xin nghỉ nộp muộn <b>ghi đè điểm danh cũ</b> (M2.4), sổ đầu bài được <b>đính chính</b> sau khi duyệt '
  +'đề nghị sửa (M2.2 F6) — số của tuần đã qua <b>vẫn còn đổi được</b>. Không chụp thì bảng xếp hạng tự đổi sau lưng mọi người.</div>'
  +'<div class="ro">Chốt rồi <b>vẫn sửa được năm ô nhập tay</b>. Chỉ khi <b>công bố</b> thì bảng mới khóa hẳn.</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn '+(thieu.length?'d':'p')+'" data-mb="Chot">'
  +(thieu.length?'Vẫn chốt (thiếu '+thieu.length+' lớp)':'Chốt tuần')+'</button>');
}
/* ★ G28 (App PH-HS, 5/9/2026): App KHÔNG hiển thị sao đỏ — «công bố» nay là mở bảng tuần cho toàn trường
   (GVCN đọc ở M2.9/T6, đọc dưới cờ) và KHÓA bảng; không còn đi tới phụ huynh. Xem M6.13 §F điểm P4A-3. */
function congboTuan(){
 const dt=dtThuc(), w=ST.tuan, c=chotCua(w,dt), b=bangTuan(w,dt);
 mfns.bCB=()=>{c.congbo={ngay:HOMNAY,boi:R().n};closeM();
  toast('📣 Đã công bố xếp hạng tuần '+w+' — <b>'+DT[dt]+'</b>. Bảng đã khóa; GVCN thấy thứ hạng lớp mình ở báo cáo tuần (M2.9/T6).');render()};
 modal('📣 Công bố xếp hạng tuần '+w+' — '+DT[dt],
  '<div class="warn">Công bố là <b>chốt thứ hạng chính thức của tuần</b> cho toàn trường — đọc dưới cờ, GVCN thấy ở báo cáo tuần '
  +'(<b>M2.9/T6</b>). Sau khi công bố, bảng <b>khóa lại</b> — không sửa điểm được nữa, kể cả ô nhập tay.</div>'
  +'<div class="info">Xếp hạng là <b>của LỚP, không phải của từng học sinh</b>. <b>App phụ huynh không hiển thị sao đỏ</b> '
  +'(chốt G28 của App PH-HS, 5/9/2026).</div>'
  +'<div class="tbw"><table><tr><th class="num">Hạng</th><th>Lớp</th><th class="num">Điểm tuần</th></tr>'
  +b.co.map(x=>'<tr'+(x.hang===1?' class="okrow"':'')+'><td class="num"><b>'+x.hang+'</b></td>'
    +'<td>'+x.lop.id+'</td><td class="num"><b>'+x.diem+'</b></td></tr>').join('')
  +(b.thieu.length?'<tr class="warnrow"><td>—</td><td colspan="2">Không có điểm: '
    +b.thieu.map(l=>l.id).join(', ')+'</td></tr>':'')
  +'</table></div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="CB">Công bố</button>');

const KYXH={tuan:'Tuần',thang:'Tháng',hk:'Học kỳ',nam:'Cả năm'};

 if(ST.ky==='tuan') return [w,w,'Tuần '+w];
 if(ST.ky==='thang'){const th=thangCuaTuan(w); let a=w,b=w;
  while(a>1&&thangCuaTuan(a-1)===th)a--; while(b<TUAN_NAY&&thangCuaTuan(b+1)===th)b++;
  return [a,b,'Tháng '+th.slice(5)+'/'+th.slice(0,4)]}
 if(ST.ky==='hk'){const k=kyCuaTuan(w); let a=1,b=TUAN_NAY;
  while(a<TUAN_NAY&&kyCuaTuan(a)!==k)a++; while(b>1&&kyCuaTuan(b)!==k)b--;
  return [a,b,k==='hk1'?'Học kỳ 1':'Học kỳ 2']}
 return [1,TUAN_NAY,'Cả năm học '+NAMHOC.ten];
}

function tinhTong(){

}
