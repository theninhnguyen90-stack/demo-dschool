/* dải giới hạn `H4` — `nh9` §2.8 ghi sẵn. Che đi là GIẢ LÀM SỐ ĐÚNG. */
/* 🆕 21/9/2026 — anh Ninh chốt MỞ LẠI trường ⇒ đây thôi là giới hạn VĨNH VIỄN,
   thành giới hạn TẠM. Dải vẫn hiện và vẫn ⛔ không tắt được: tới khi `M7.4`
   dựng xong thì con số trên màn hình VẪN là tổng cả hai nguồn — đổi chữ mà
   chưa đổi dữ liệu là cách nhanh nhất làm người đọc tưởng số đã tách.      */
function daiH4() {
  return '<div class="canh r">⚠ <code>H4</code> — ✅ <b>chốt 21/9 MỞ LẠI</b> '
    + '<b><code>Nguồn kinh phí</code></b> ở <code>M7.4</code>; <b>chưa dựng</b> nên số dưới đây '
    + 'là <b>tổng cả hai nguồn</b>. ' + dl('M7.4', 'tab=danhmuc') + '</div>';
}
function dongMG(ct, ds) {
  if (ct === 'chinh_sach_mien_giam') {
    const co = {};
    ds.forEach(o => o.dong.forEach(d => { if (d.mg) co[d.mg.k] = 1 }));
    return Object.keys(co).sort().map(k => ({
      id: k, ten: MG[k].ten, phu: 'mã ' + k + ' · áp cho ' + MG[k].ap.join(', '),
      loc: o => o.dong.some(d => d.mg && d.mg.k === k), q: 'cs=' + k
    }));
  }
  if (ct === 'dien_uu_tien') {
    const co = {};
    ds.forEach(o => { const h = HSC(o.hs); (h.dien || []).forEach(x => { co[x] = 1 }) });
    return Object.keys(co).sort().map(x => ({
      id: x, ten: x, loc: o => ((HSC(o.hs) || {}).dien || []).indexOf(x) >= 0, q: 'dien=' + encodeURIComponent(x)
    }));
  }
  return dongTheoChieu(ct, ds);
}

/* ══════════════ TAB 4 · ĐIỀU CHỈNH & HOÀN TIỀN ═════════════════════════
   Khuôn K5 — sổ phiếu, một bản ghi một dòng theo thời gian. LOẠI C: đối
   chiếu hai chiều với sổ thu chi `M7.5`, ⛔ không làm tròn.
   🛑 `kiemSoHieu:false` cho cả hai sổ — CÓ LÝ DO: dải số hiệu phiếu và số
   quyết định là dải DÙNG CHUNG CẢ NĂM, bảng này lọc theo khoảng nên đứt
   quãng là bình thường. Kiểm số hiệu liên tục ở `M7.3`, ⛔ không kiểm trên
   một bản chiếu đã lọc — báo «sổ nhảy số» ở đây là báo động giả.          */
function veTab4() {
  const tu = PV.st.tuNgay, den = PV.st.denNgay > HOMNAY ? HOMNAY : PV.st.denNgay;
  const dcAll = PDC.filter(x => x.ngay >= tu && x.ngay <= den);
  const htAll = PHT.filter(x => x.ngay >= tu && x.ngay <= den);
  const dc = dcAll.filter(trongPV), ht = htAll.filter(trongPV);
  let h = daiPV('phiếu', dc.length + ht.length, dcAll.length + htAll.length) + PV.khoang();

  /* ---------- khối A · tổng hợp theo lý do (loại C, đủ số đồng) ---------- */
  const lyDC = {}; dc.forEach(x => { (lyDC[x.ly] = lyDC[x.ly] || []).push(x) });
  const lyHT = {}; ht.forEach(x => { (lyHT[x.ly] = lyHT[x.ly] || []).push(x) });
  h += KB.K2({
    id: 'ly', tieuDe: 'A · Phân tích theo lý do — điều chỉnh và hoàn tiền',
    ma: 'TC.01', chip: 'PS', moTaKy: PV.moTaKhoang(), tenCotDau: 'Lý do', gomNhom: true,
    dong: Object.keys(lyDC).sort().map(k => ({
      id: k, ten: LY_DC[k], nhom: 'Phiếu điều chỉnh', phu: 'mã ' + k, ds: lyDC[k], loai: 'dc', q: 'tab=dieuchinh&ly=' + k
    })).concat(Object.keys(lyHT).sort().map(k => ({
      id: k, ten: LY_HT[k], nhom: 'Phiếu hoàn tiền', phu: 'mã ' + k, ds: lyHT[k], loai: 'ht', q: 'tab=hoantien&ly=' + k
    }))),
    link: d => ({ menu: 'M7.3', ctx: d.q, nhan: d.loai === 'dc' ? 'Điều chỉnh khoản phải thu' : 'Hoàn tiền' }),
    cot: [
      { khoa: 'so', ten: 'Số phiếu', kieu: 'so', nguon: 'm7.3.thong_ke_xuat_ke_toan' },
      cotTien('tang', 'Điều chỉnh TĂNG', 'm7.3.dieu_chinh_khoan_phai_thu'),
      cotTien('giam', 'Điều chỉnh GIẢM · hoàn', 'm7.3.dieu_chinh_khoan_phai_thu'),
      { khoa: 'cho', ten: 'Còn chờ xử lý', kieu: 'so', nguon: 'm7.3.thong_ke_xuat_ke_toan', canhBao: k => k.giaTri > 0 }
    ],
    o: (d, c) => oLyDo(d, c)
  });

  /* ---------- khối B · sổ phiếu điều chỉnh ---------- */
  if (!coXD('m7.3.dieu_chinh_khoan_phai_thu')) {
    h += '<div class="bg"><div class="bgh"><b>B · Sổ phiếu điều chỉnh khoản phải thu</b></div>'
      + '<div class="noaccbox">🔒 <b>Khối này bị ẩn.</b> Vai <b>' + esc(R().cd) + '</b> không có quyền '
      + '<b>Xuất dữ liệu (XD)</b> ở <b>Điều chỉnh khoản phải thu — M7.3</b>. Có <b>' + dc.length
      + ' phiếu</b> trong khoảng đang xem, không hiện ở đây.</div></div>';
  } else {
    h += KB.K5({
      tieuDe: 'B · Sổ phiếu điều chỉnh khoản phải thu', chip: 'PS', moTaKy: PV.moTaKhoang(),
      kiemSoHieu: false,
      banGhi: dc.map(x => ({
        so: x.id, ngay: k2s(x.ngay),
        noiDung: tenHS(x.hs) + ' · ' + LY_DC[x.ly] + ' — ' + x.dg,
        soTien: (x.so > 0 ? '+' : '') + vnd(x.so),
        nguoiLap: x.lap, nguoiKy: x.ky || '—', tt: TT_DC[x.tt][0]
      })),
      cot: [{ khoa: 'so', ten: 'Mã phiếu' }, { khoa: 'ngay', ten: 'Ngày lập' },
      { khoa: 'noiDung', ten: 'Học sinh · lý do · diễn giải' }, { khoa: 'soTien', ten: 'Số điều chỉnh' },
      { khoa: 'nguoiLap', ten: 'Người lập' }, { khoa: 'nguoiKy', ten: 'Người duyệt' }, { khoa: 'tt', ten: 'Trạng thái' }],
      chuoiTrong: 'Không có phiếu điều chỉnh nào trong khoảng đang xem.',
      duoiBang: '<div class="ro">Phiếu điều chỉnh <b>không ký số</b> — là bút toán nội bộ, không phải văn bản '
        + 'phát hành ra ngoài. Số hiệu đứt quãng ở đây là <b>bình thường</b>: dải mã dùng chung cả năm, bảng đã lọc theo khoảng. '
        + dl('M7.3', 'tab=dieuchinh') + '</div>'
    });
  }

  /* ---------- khối C · sổ phiếu hoàn tiền + trạng thái ký số Nhóm B ---------- */
  h += KB.K5({
    tieuDe: 'C · Sổ phiếu hoàn tiền — quyết định ký số ⚖ Nhóm B', chip: 'PS', moTaKy: PV.moTaKhoang(),
    kiemSoHieu: false,
    banGhi: ht.map(x => ({
      so: x.id, sq: x.so || '⏳ chưa có', ngay: k2s(x.ngay),
      noiDung: tenHS(x.hs) + ' · ' + LY_HT[x.ly] + (x.viSao ? ' — ' + x.viSao : ''),
      soTien: vnd(x.tien), nguoiKy: x.ky || '⏳ chờ duyệt & ký',
      chi: x.chi || (x.henNgay ? '⏸ hẹn ' + k2s(x.henNgay) + ' · ' + x.phuTrach : '—'),
      tt: TT_HT[x.tt][0]
    })),
    cot: [{ khoa: 'so', ten: 'Mã phiếu' }, { khoa: 'sq', ten: 'Số quyết định' }, { khoa: 'ngay', ten: 'Ngày lập' },
    { khoa: 'noiDung', ten: 'Học sinh · lý do' }, { khoa: 'soTien', ten: 'Số tiền hoàn' },
    { khoa: 'nguoiKy', ten: 'Người duyệt & ký ⚖' }, { khoa: 'chi', ten: 'Chi tiền' }, { khoa: 'tt', ten: 'Trạng thái' }],
    chuoiTrong: 'Không có phiếu hoàn tiền nào trong khoảng đang xem.',
    duoiBang: '<div class="kyro">🛑 <b>Ký thuộc <code>M7.3</code></b> — Quyết định hoàn tiền là <b>Nhóm B, bắt buộc ký số</b>, '
      + '<b>PHT_ĐT hoặc HT</b> ký, ai ký trước có hiệu lực. Nhóm 📊 chỉ <b>Xem</b> · <b>Xuất</b>, ⛔ không có nút duyệt nào ở đây. '
      + dl('M7.3', 'tab=hoantien&loc=choduyet') + '</div>'
  });

  /* ---------- đối chiếu hai chiều với sổ thu chi `M7.5` ---------- */
  const daChi = ht.filter(x => ['da_chi', 'hoantat'].includes(x.tt)).reduce((a, x) => a + x.tien, 0);
  const soChi = TC.filter(x => x.dm === 'C-HOAN' && x.tt !== 'nhap' && trongPV(x) && x.ngay >= tu && x.ngay <= den)
    .reduce((a, x) => a + x.so, 0);
  h += daiKhop('Đối chiếu với sổ thu chi M7.5 — khoản mục «Hoàn tiền cho gia đình»',
    daChi, soChi, 'phiếu đã chi', 'bút toán trên sổ',
    TC.filter(x => x.dm === 'C-HOAN' && x.tt !== 'nhap' && trongPV(x) && x.ngay >= tu && x.ngay <= den).length,
    dl('M7.5', 'tab=so&dm=C-HOAN'));

  const cho = ht.filter(x => ['cho_duyet', 'cho_chi', 'choThuHoi'].includes(x.tt));
  if (cho.length) h += '<div class="canh w">🕐 <b>' + cho.length + ' phiếu hoàn tiền chưa xong</b> · tổng <b>'
    + vnd(cho.reduce((a, x) => a + x.tien, 0)) + '</b> — '
    + cho.map(x => x.id + ' <i>' + TT_HT[x.tt][0] + '</i>').join(' · ')
    + '. Tiền chưa ra khỏi két nhưng đã cam kết với gia đình.</div>';

  return h + dnote('Tab này là <b>loại C</b> nên nó phải khớp <b>hai chiều</b>: phiếu ở <code>M7.3</code> ⇄ bút toán ở <code>M7.5</code>. '
    + 'Một phiếu <i>Đã chi</i> mà sổ thu chi không có bút toán tương ứng nghĩa là <b>tiền ra khỏi két mà không có ai ghi</b> — '
    + 'đó là loại lệch chỉ lộ ra khi quyết toán năm, nếu không có dòng đối chiếu này.');
}
function oLyDo(d, c) {
  const ds = d.ds;
  const nen = {
    ma: 'TC.01', o: c.khoa, ten: c.ten + ' — ' + d.ten, donVi: c.donVi || '', loaiSo: 'PS',
    quyTacDem: CT.khaiBao('TC.01').quyTacDem, nguon: ['M7.3'], chieuHopLe: [], canhBao: null,
    veTrai: null, vePhai: null, ghiChu: null
  };
  const ve = x => ({
    id: x.id, ten: tenHS(x.hs) + ' · ' + (d.loai === 'dc' ? LY_DC[x.ly] : LY_HT[x.ly]),
    phu: k2s(x.ngay) + ' · ' + (d.loai === 'dc' ? TT_DC[x.tt][0] : TT_HT[x.tt][0]) + ' · ' + DT[x.dt],
    so: d.loai === 'dc' ? ((x.so > 0 ? '+' : '') + vnd(x.so)) : vnd(x.tien)
  });
  if (c.khoa === 'so') return Object.assign(nen, { giaTri: ds.length, banGhiGoc: ds.map(ve) });
  if (c.khoa === 'cho') {
    const l = ds.filter(x => d.loai === 'dc' ? ['nhap', 'cho'].includes(x.tt) : ['nhap', 'cho_duyet', 'cho_chi', 'choThuHoi'].includes(x.tt));
    return Object.assign(nen, { giaTri: l.length, banGhiGoc: l.map(ve) });
  }
  if (c.khoa === 'tang') {
    const l = d.loai === 'dc' ? ds.filter(x => x.so > 0) : [];
    return Object.assign(nen, { giaTri: l.reduce((a, x) => a + x.so, 0), banGhiGoc: l.map(ve) });
  }
  const l = d.loai === 'dc' ? ds.filter(x => x.so < 0) : ds;
  return Object.assign(nen, {
    giaTri: d.loai === 'dc' ? -l.reduce((a, x) => a + x.so, 0) : l.reduce((a, x) => a + x.tien, 0),
    banGhiGoc: l.map(ve)
  });
}

/* ══════════════ TAB 5 · THU CHI & QUYẾT TOÁN NĂM ═══════════════════════
   Khuôn K6 — biểu CỐ ĐỊNH, ô của biểu ↔ mã chỉ tiêu, ô chưa ánh xạ thì
   NÊU ĐÍCH DANH. LOẠI C, cả hai loài số, ⛔ không làm tròn.
   🛑 ⛔ KHÔNG dựng cơ chế chốt thứ hai. Bản đã ký là bản của `M7.5`; ở đây
   chỉ CHIẾU số đã ký và nói rõ đã phát sinh thêm bao nhiêu kể từ khi ký.  */
function veTab5() {
  const dsTong = TC.filter(x => x.tt !== 'nhap');
  const dsPV = dsTong.filter(trongPV);
  let h = daiPV('giao dịch', dsPV.length, dsTong.length) + PV.chotNgay() + PV.daiCanhBao();

  /* ---------- khối ③ trước: công nợ và nghĩa vụ (TỒN) ---------- */
  const khoiNghiaVu = {
    id: 'nv', tieuDe: '③ Công nợ và nghĩa vụ tại ngày chốt', ma: 'TC.04', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Chỉ tiêu', tong: false,
    dong: [
      { id: 'no', ten: 'Học sinh còn nợ', phu: 'khoản phải thu của trường', k: 'no' },
      { id: 'tho', ten: 'Thu hộ — chưa nộp cho bên thụ hưởng', phu: 'là NGHĨA VỤ, không phải tiền nhàn rỗi', k: 'tho' },
      { id: 'du', ten: 'Số dư đang giữ hộ gia đình', phu: 'là KHOẢN PHẢI TRẢ, không phải khoản thu', k: 'du' }
    ],
    cot: [
      cotTien(null, 'Số tiền', 'm7.5.bao_cao_xuat_ke_toan', { canhBao: k => k.giaTri > 0 }),
      { khoa: 'sl', ten: 'Số lượng', kieu: 'so', nguon: 'm7.5.bao_cao_xuat_ke_toan' }
    ],
    link: d => d.k === 'no' ? { menu: 'M7.2', ctx: 'tab=theodoi&loc=conno', nhan: 'Theo dõi và xác nhận đóng tiền' }
      : d.k === 'du' ? { menu: 'M7.2', ctx: 'tab=thongke&khoi=sodu', nhan: 'Sổ số dư tạm giữ' }
        : { menu: 'M7.5', ctx: 'tab=baocao&khoi=thuho', nhan: 'Báo cáo & Xuất kế toán' },
    o: (d, c) => {
      if (d.k === 'no') return c.khoa === 'sl' ? CT.doc('TC.01', PV.thamSo(), 'soEmConNo') : CT.doc('TC.01', PV.thamSo(), 'conNo');
      if (d.k === 'du') return c.khoa === 'sl' ? null : CT.doc('TC.04', PV.thamSo(), 'soDuGiuHo');
      return c.khoa === 'sl' ? null : CT.doc('TC.04', PV.thamSo(), 'thuHoChuaNop');
    }
  };

  /* ---------- khối ① tổng hợp kỳ theo NHÓM TIỀN (PHÁT SINH) ---------- */
  const sepKy = '<div class="pvcach">Đếm <b>trong khoảng</b> — ⛔ không cộng với khối ③.</div>' + PV.khoang();
  const nhomTen = { A: 'A · Tiền của trường', B: 'B · Tiền thu hộ', C: 'C · Tiền đang giữ hộ gia đình' };
  const khoiKy = {
    id: 'ky', tieuDe: '① Tổng hợp kỳ theo nhóm tiền', ma: 'TC.04', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Nhóm tiền',
    dong: ['A', 'B', 'C'].map(n => ({
      id: n, ten: nhomTen[n], loc: x => DMTC[x.dm].nt === n, q: 'nhomtien=' + n
    })),
    cot: [
      cotTien('thu', 'Thu trong kỳ', 'm7.5.bao_cao_xuat_ke_toan'),
      cotTien('chi', 'Chi trong kỳ', 'm7.5.bao_cao_xuat_ke_toan'),
      { khoa: 'soGiaoDich', ten: 'Số giao dịch', kieu: 'so', nguon: 'm7.5.bao_cao_xuat_ke_toan' }
    ],
    link: d => ({ menu: 'M7.5', ctx: 'tab=so&' + d.q, nhan: 'Sổ thu chi' }),
    o: (d, c) => CT.doc('TC.04', PV.thamSoPS({ loc: d.loc }), c.khoa)
  };

  /* ---------- khối ② theo KHOẢN MỤC ---------- */
  const dmCo = {}; TC.filter(x => x.tt !== 'nhap' && trongPV(x)).forEach(x => { dmCo[x.dm] = 1 });
  const khoiDM = {
    id: 'dm', tieuDe: '② Chi tiết theo khoản mục thu-chi', ma: 'TC.04', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Khoản mục', gomNhom: true,
    dong: Object.keys(dmCo).map(m => ({
      id: m, ten: DMTC[m].ten, nhom: DMTC[m].chieu === 'THU' ? 'Thu' : 'Chi',
      phu: 'mã đối ứng ' + m + ' · nhóm tiền ' + DMTC[m].nt,
      loc: x => x.dm === m, q: 'dm=' + m
    })),
    cot: [
      cotTien(null, 'Số tiền', 'm7.5.bao_cao_xuat_ke_toan'),
      { khoa: 'soGiaoDich', ten: 'Số giao dịch', kieu: 'so', nguon: 'm7.5.bao_cao_xuat_ke_toan' }
    ],
    link: d => ({ menu: 'M7.5', ctx: 'tab=so&' + d.q, nhan: 'Sổ thu chi' }),
    o: (d, c) => CT.doc('TC.04', PV.thamSoPS({ loc: d.loc }), c.khoa || undefined)
  };

  h += KB.K6({
    khoi: [khoiNghiaVu],
    oChuaAnhXa: [
      { o: 'Chênh lệch Thu − Chi', ly: 'CỐ Ý không dựng — chốt I1 của M7.5' },
      { o: 'Tách theo nguồn kinh phí', ly: '✅ chốt 21/9 mở lại trường ở M7.4 — chờ menu chủ dựng' },
      { o: 'Cân đối kế toán · khấu hao TSCĐ', ly: 'ở phần mềm kế toán' }
    ]
  });
  h += sepKy + KB.bang(khoiKy) + KB.bang(khoiDM);

  /* ---------- đối chiếu với menu nhóm ② (ĐỐI CHIẾU, không bàn giao) ---------- */
  h += khoiDoiChieu();

  /* ---------- bản đã ký — số CHỐT CỨNG tại thời điểm ký ---------- */
  h += khoiDaKy();

  return h + dnote('Ô <b>Chênh lệch Thu − Chi</b> cố ý không dựng: cộng ba nhóm tiền thành một «tổng thu» rồi trừ chi ra '
    + 'một con số <b>dương to và vô nghĩa</b> — nguy hiểm nhất khi nó được công bố <i>(chốt <b>I1</b> của <code>M7.5</code>)</i>.<br>'
    + 'Người lập không phải người ký: Kế toán dựng báo cáo, <b>Hiệu trưởng ký</b>, và Kế toán <b>không ký thay được</b> '
    + 'kể cả khi HT vắng. Số đã ký <b>chốt cứng</b> để bản in trên bàn hiệu trưởng khớp với bản trên màn hình.<br>'
    + 'Tab này <b>không phải sổ kế toán của trường</b> và màn hình nói thẳng điều đó. '
    + 'Nếu kế toán tin nó là sổ kế toán, họ sẽ <b>ngừng đối chiếu</b> với phần mềm kế toán, và tới cuối năm hai sổ lệch nhau '
    + 'mà không ai biết từ tháng nào. Cái tab này làm được là <i>bày ra để đối chiếu</i>, không phải <i>thay thế</i>.');
}
/* bảng ba cột `Menu nguồn báo · Đã ghi sổ ở đây · Chênh`, ghép bằng MÃ NGUỒN.
   🛑 Dòng `Cấp gạo` có HAI ĐƠN VỊ KHÁC NHAU ở hai cột ⇒ ⛔ KHÔNG tính ô
   `Chênh`: quy `kg` ra tiền để có một con số chênh là bịa số.             */
function khoiDoiChieu() {
  const tu = PV.st.tuNgay, den = PV.st.denNgay > HOMNAY ? HOMNAY : PV.st.denNgay;
  const d0 = dtHieuLuc();
  const trongDT = dt => d0 === 'ALL' || d0 === dt;
  const soSo = ma => TC.filter(x => x.tt !== 'nhap' && trongPV(x) && x.ngay >= tu && x.ngay <= den

/* ══ TỆP XUẤT ⛔ KHÔNG ĐƯỢC RỘNG HƠN MÀN HÌNH ════════════════════════════
   🛑 Lỗi thật bắt được ngày 21/9/2026 khi chạy vai `KT_HEP` (thiếu `XD` ở
   `m7.1.lich_cong_bo_hang_thang`): màn hình che **36 ô** theo `N5`, nhưng tệp
   xuất **vẫn có trường `Hạn nộp · tuổi nợ`** — đúng dữ liệu vừa bị che. Tức
   `N5` đóng cửa trước rồi cửa sau mở toang.

   Cùng hướng với vế ② luật `XD` theo cột mà anh Ninh chốt cho `BCM9-2B`
   ngày 21/9: **tệp chỉ gồm cột vai ấy xem được, và cuối trang ghi đích danh
   cột bị bỏ cùng menu nguồn còn thiếu quyền**.
   ⚠ Phiên này ⛔ KHÔNG áp vế ① của luật ấy (*nới `xuat` từ «mọi» sang «ít
   nhất một» feature nguồn*): `M9.7` không dùng luật «mọi» — nó khai `xuat`
   theo §5 của prompt. Phạm vi vế ① còn chờ `Z` hòa giải với sổ §5 điểm 2.  */
const truongXuatCuaVai = tab => (TRUONG_XUAT[tab] || []).filter(t => !t.ngn || coXD(t.ngn));
const truongBiBo = tab => (TRUONG_XUAT[tab] || []).filter(t => t.ngn && !coXD(t.ngn));
/* ★ Trường `batBuoc` bị bỏ thì KHÓA HẲN mức 2, ⛔ không xuất bản thiếu cột.
   Một tệp danh sách chi tiết thiếu trường định danh bắt buộc là tệp **không
   tra ngược được** — nó vẫn mang họ tên ra khỏi trường mà không còn cách nào
   đối chiếu lại. Để nó xuất ra còn tệ hơn là không xuất.                  */
const khoaMuc2 = tab => truongBiBo(tab).some(t => t.batBuoc);
const moTaBiBo = tab => truongBiBo(tab).map(t => {
  const m = NGUON[t.ngn] || { menu: '?', ten: t.ngn };
  return t.ten + ' (thiếu XD ở ' + m.ten + ' — ' + m.menu + ')';
});
function soDongChiTiet() {
  const ngay = ngayChot();
  if (ST.tab === 'cham_cong_luong') return NS.filter(nsTrongPV).length;
  if (ST.tab === 'dieu_chinh_hoan_tien') return PDC.filter(trongPV).length + PHT.filter(trongPV).length;
  if (ST.tab === 'thu_chi_quyet_toan') return TC.filter(x => x.tt !== 'nhap' && trongPV(x)).length;
  return HD.filter(o => hdSong(o) && trongPV(o) && daPhatHanh(o.th, ngay)).length;
}

document.addEventListener('click', e => {
  const r = e.target.closest('[data-r]');
  if (r) { role = r.getAttribute('data-r'); PV.st.phanTo = null; moTab(tabMacDinh()); ve(); return }
  const t = e.target.closest('[data-t]');
  if (t) { PV.st.phanTo = null; moTab(t.getAttribute('data-t')); ve(); return }
  if (e.target.closest('#btnNote')) { ST.note = !ST.note; ve(); return }
  const d = e.target.closest('[data-dl]');
  if (d) {
    const m = d.getAttribute('data-dl'), q = d.getAttribute('data-dlq') || '';
    toast('↗ Deep-link sang <b>' + esc(m) + '</b> — <code>?' + esc(q) + '</code><br>'
      + '<i>Demo một tệp: không mở được menu khác, nhưng đường dẫn là đường dẫn thật.</i>');
  }
});
$('#hdt').addEventListener('change', e => { ST.dt = e.target.value; ve() });

function toast(h) {
  const t = $('#toast'); t.innerHTML = h; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 4200);
}

/* ── công cụ nghiệm thu: đo MẬT ĐỘ CHỮ GIẢI THÍCH (`nh9` §9.1, ≤ 20%) ─── */
function doMatDoChu() {
  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(n => { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = { tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
window.doMatDoChu = doMatDoChu;

ST.tab = tabMacDinh();
moTab(ST.tab);
ve();
