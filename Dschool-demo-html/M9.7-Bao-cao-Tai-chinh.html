<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M9.7 Báo cáo Tài chính — Dschool</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
code{font:12px/1.4 Consolas,monospace;background:#f1f5f9;padding:1px 4px;border-radius:4px}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.main{flex:1;padding:14px 18px 60px;min-width:0}
.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb b{color:var(--ink)}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}

.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink3);font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}

/* ─────────── dải giải thích: giữ NGẮN, đếm vào 20% của nh9 §9.1 ─────────── */
.canh{padding:8px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin:9px 0;display:block}
.canh.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.canh.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.canh.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:7px 11px;border-radius:9px;font-size:11.5px;margin:8px 0;line-height:1.55}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin:9px 0}
.empty{padding:30px;text-align:center;color:var(--ink3);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:90;transition:transform .22s;max-width:92vw;line-height:1.55}
.toast.on{transform:translateX(-50%)}
.toast code{background:#1e293b;color:#e2e8f0}

/* ═══════════ PV — phạm vi và thời gian ═══════════ */
.pvbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px 0}
.pvlb{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.pvd{border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12.5px;background:#fff}
.pvthu{font-size:11.5px;color:var(--ink3)}
.pvsep{color:var(--ink3)}
.pvky{display:flex;gap:4px;flex-wrap:wrap;margin-left:6px}
.pvk{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--ink2)}
.pvk:hover{background:var(--bg)}
.pvk.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pvk.cam{opacity:.42;cursor:not-allowed;border-style:dashed}
.pvk i{font-style:normal;color:var(--ink3);font-size:10.5px}
.pvk.on i{color:#dbeafe}
.pvcut{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--ink2);margin:8px 0}
.pvcut i{color:var(--ink3);font-size:11.5px}
.pvmau{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:6px 0 2px}
.pvm{border:1px dashed var(--line2);background:#fff;border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--ink2)}
.pvm.on{background:#eef2ff;border-color:#818cf8;border-style:solid;color:#3730a3;font-weight:700}
.pvm.x{color:var(--red);border-color:#fecaca}
.pvmc{font-size:11px;color:var(--ink3);margin-left:6px}
.pvcach{font-size:11.5px;color:var(--ink3);margin:14px 0 0;border-top:1px dashed var(--line2);padding-top:10px}

/* ═══════════ KB — bảng ═══════════ */
.bg{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0}
.bgh{display:flex;align-items:center;gap:9px;padding:10px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.bgky{font-size:11.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.bgma{font-size:10.5px;font-weight:700;color:var(--violet);background:#f5f3ff;border:1px solid #ddd6fe;border-radius:5px;padding:1px 6px}
.lschip{font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px;white-space:nowrap}
.lschip.ton{background:#e0e7ff;color:#3730a3}
.lschip.ps{background:#fef3c7;color:#92400e}
.lschip.dx{background:#ecfdf5;color:#065f46}
.tbx{overflow-x:auto}
.bgt{width:100%;border-collapse:collapse;font-size:12.5px}
.bgt th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#fbfdff;white-space:nowrap;vertical-align:bottom}
.bgt th i{display:block;font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink3);font-size:9.5px}
.bgt td{padding:5px 9px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.bgt td.num,.bgt th.num{text-align:right;font-variant-numeric:tabular-nums}
.bgt tr:last-child td{border-bottom:none}
.dphu{display:block;font-size:10.5px;color:var(--ink3);font-weight:400}
.nhomrow td{background:#f1f5f9;font-size:10.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;padding:4px 9px}
.tongrow td{background:#f8fafc;font-weight:700;border-top:2px solid var(--line2)}
.tongtru{display:block;font-size:9.5px;font-weight:400;color:var(--amber)}
.dongmo td{opacity:.55}
.badrow td{background:var(--red-soft)}
.bgt.so td{font-size:12px}
.bgid{font-size:10.5px;color:var(--ink3);white-space:nowrap;width:70px}

.oso{border:1px solid transparent;border-radius:6px;padding:2px 7px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:underline dotted var(--line2) 1px;text-underline-offset:3px}
.oso:hover{background:var(--brand-soft);border-color:#bfdbfe;color:var(--brand)}
.oso.odx{color:#065f46}
.oso.ochieu{color:var(--ink2);text-decoration-style:dashed}
.oso.ochieu:hover{color:var(--brand)}
.oso.oxau{color:var(--red)}
.oso.ocb{font-size:10.5px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-color:#fde68a;text-decoration:none}
.oro{color:var(--ink3)}
.noacc{font-size:10.5px;font-weight:700;color:var(--ink3);background:#f1f5f9;border:1px dashed var(--line2);border-radius:6px;padding:2px 7px;display:inline-block}
.noaccbox{padding:12px 14px;background:#f8fafc;border-top:1px dashed var(--line2);font-size:12.5px;line-height:1.65;color:var(--ink2)}
.noaccbox.big{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 22px;margin-top:14px;font-size:13.5px}
.k3sep{font-size:11.5px;color:var(--ink2);background:#fffbeb;border:1px dashed #fbbf24;border-radius:8px;padding:7px 11px;margin:4px 0}
.bvdl{font-size:12px;color:#991b1b;background:var(--red-soft);border:1px solid #fecaca;border-radius:9px;padding:8px 11px;margin:9px 0;line-height:1.6}
.k8h{font-size:16px;font-weight:700;margin:12px 0 6px}
.k8m{margin:10px 0}
.k8nx{font-size:12.5px;line-height:1.7;color:var(--ink2)}

/* khối chữ ký + bản chiếu */
.ky{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0}
.kyh{font-size:13px;font-weight:700;margin-bottom:9px}
.kyds{display:flex;gap:16px;flex-wrap:wrap}
.kyo{font-size:12px;color:var(--ink2);min-width:200px}
.kyl{display:block;border-bottom:1px dotted var(--line2);height:26px;margin-bottom:3px}
.kytt{margin-top:10px;font-size:12.5px}
.kyro{margin-top:9px;font-size:11.5px;color:var(--ink3);line-height:1.55;border-top:1px dashed var(--line);padding-top:8px}
.chieu{border-style:dashed}
.chieuro{padding:9px 13px;font-size:11.5px;color:var(--ink2);background:#f8fafc;border-top:1px dashed var(--line2);line-height:1.6}

/* ═══════════ KB — panel drill-down ═══════════ */
.kbmask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:none;justify-content:flex-end}
.kbmask.on{display:flex}
.kbpanel{background:#fff;width:640px;max-width:96vw;height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(15,23,42,.18)}
.kbh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-size:14px;flex-wrap:wrap}
.kbdong{color:var(--ink2);font-weight:600}
.kbx{font-size:16px;color:var(--ink3);width:30px;height:30px;border-radius:8px}
.kbx:hover{background:var(--bg);color:var(--ink)}
.kbb{padding:14px 16px;overflow-y:auto;flex:1}
.kbso{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:10px}
.kbso i{font-size:12px;font-weight:400;color:var(--ink3);font-style:normal}
.kbcb{font-size:14px;color:var(--amber);font-weight:600}
.kbps{display:flex;align-items:center;gap:12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:10px}
.kbpsl{flex:1}
.kbpsl span{display:block;font-size:11px;color:var(--ink3)}
.kbpsl b{font-size:16px;font-variant-numeric:tabular-nums}
.kbpsc{font-size:11px;color:var(--ink3)}
.kbgc{font-size:12px;color:var(--ink2);background:var(--brand-soft);border:1px solid #bfdbfe;border-radius:8px;padding:7px 11px;margin-bottom:10px;line-height:1.6}
.kbqt{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.kbqth{background:#f8fafc;padding:7px 12px;font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.kbqtv,.kbqtx{padding:9px 12px;font-size:12px;line-height:1.6}
.kbqtv{background:#f6fefb}
.kbqtx{background:#fffafa;border-top:1px solid var(--line)}
.kbqtv b{color:var(--green)}
.kbqtx b{color:var(--red)}
.kbqtv ul,.kbqtx ul{margin:4px 0 0 17px}
.kbqtv li,.kbqtx li{margin-bottom:3px;color:var(--ink2)}
.kbcc{padding:7px 12px;font-size:11.5px;color:#92400e;background:var(--amber-soft);border-top:1px solid var(--line)}
.kbng{padding:7px 12px;font-size:11px;color:var(--ink3);border-top:1px solid var(--line);background:#fbfdff}
.kbbg{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.kblk{display:flex;flex-direction:column;gap:6px;padding-bottom:20px}
.kblkc{font-size:11px;color:var(--ink3);line-height:1.55}

/* ═══════════ XU — xuất hai mức ═══════════ */
.xunut{display:inline-flex;gap:7px;flex-wrap:wrap}
.xu1{background:#fff;border-color:var(--line2)}
.xu2{background:#fff5f5;border-color:#fecaca;color:#991b1b;font-weight:600}
.xu2 i{font-style:normal;font-weight:400;font-size:11px}
.xu2:hover{background:#fee2e2}
.xumask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:none;place-items:center}
.xumask.on{display:grid}
.xumodal{background:#fff;border-radius:13px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.xuh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:9px}
.xub{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.xuf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xtag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.04em}
.xtag.t1{background:#e0e7ff;color:#3730a3}
.xtag.t2{background:#fee2e2;color:#991b1b}
.xcanh{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.xok{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;line-height:1.6}
.xm{margin-bottom:14px}
.xm>b{display:block;font-size:12.5px;margin-bottom:6px}
.xm>b i{font-weight:400;color:var(--ink3);font-size:11.5px;font-style:normal}
.xmd{display:flex;flex-direction:column;gap:4px}
.xr{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.xr:hover{background:var(--bg)}
.xtr{display:flex;gap:8px;flex-wrap:wrap}
.xc{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.xnhay{font-size:9.5px;color:var(--red);background:var(--red-soft);border-radius:4px;padding:0 5px}
.xdau2{font-size:12px;color:var(--ink2);background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.xfile{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.xdau{padding:12px 15px;border-bottom:1px solid var(--line);text-align:center;background:#fbfdff}
.xd1{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.xd2{font-size:15px;font-weight:700;margin:3px 0}
.xd3{font-size:12px;color:var(--ink2)}
.xd4{font-size:11.5px;color:var(--ink3)}
.xbody{padding:22px 15px;text-align:center;color:var(--ink3);font-size:12px;background:#fafbfc}
.xcuoi{padding:10px 15px;border-top:1px solid var(--line);font-size:11px;color:var(--ink2);background:#fbfdff}
.xqt b{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.xqt ul{margin:3px 0 7px 16px}
.xqt li{margin-bottom:2px;line-height:1.5}
.xvet{border-top:1px dashed var(--line);padding-top:6px;color:var(--ink3)}

/* ── M9.7 · BCM9-1F — chỉ MỘT lớp thêm ─────────────────────────────────
   `.noxu` thay chỗ của hai nút xuất khi vai KHÔNG có `XD` ở feature nguồn.
   Ô vẫn chiếm chỗ và NÓI RA, đúng `N5` — ẩn im lặng thì người dùng tưởng
   menu thiếu chức năng thay vì hiểu là mình thiếu quyền.                  */
.noxu{display:inline-block;padding:6px 11px;border:1px dashed var(--line);border-radius:7px;
  font-size:12px;color:var(--mut);background:var(--bg)}
</style>
</head>

<div class="rolebar" id="rolebar"></div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"></select>
  <span class="lockico" id="dtlock"></span>
  <div class="spacer"></div>

</header>

<div class="wrap">
  <main class="main">
    <div id="crumb"></div>
    <div class="tophd"><h1 id="h1">Báo cáo Tài chính</h1><div class="spacer"></div><span id="topact"></span></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script>/* ══════════════════════════════════════════════════════════════════════════
   TỆP NỀN 1/4 CỦA NHÓM 📊 BÁO CÁO — `app.10-nen-chi-tieu.js`  →  xuất ra `CT`
   Hợp đồng 🔒 HDBC · phiên `BCM9-0A` (20/9/2026) · sổ `PROMPT-BCM9-00-SO-DIEU-PHOI.md` §3
   🔄 HDBC v2 · phiên `BCM9-V24` (21/9/2026) — CHỈ THÊM, không đổi hàm nào:
      + 64 chiều phân tổ của 14 phiên vào `CHIEU` (việc 5) · + `VH.05` (việc 7).

   🛑 CHÉP NGUYÊN BYTE sang mọi demo M9.x và mọi tab báo cáo đặt tại menu chủ.
      Sửa một bên thì chép sang mọi bên còn lại, rồi đo lại băm và ghi vào phiếu.
      Lệch một byte = DỪNG, báo người dùng.

   ── Vì sao có tệp này ────────────────────────────────────────────────────

/* ─────────────────── ③ TỪ ĐIỂN CHỈ TIÊU — bộ máy ─────────────────── */
const CT = (function () {
  const D = {};                                          /* mã → khai báo */

  /* ── khai một chỉ tiêu ──────────────────────────────────────────────
     {ma, ten, donVi, loaiSo:'TON'|'PS'|'DAN_XUAT', nguon:['M6.4'],
      chieuHopLe:[…], moc:'yyyy-mm-dd',
      quyTacDem:{tinhVao:[…tiếng Việt…], khongTinh:[…tiếng Việt…]},
      canCu:'…' (tùy chọn — văn bản pháp lý),
      oPhu:{ <khóa ô>: {ten, loaiSo, donVi, moc, quyTacDem} }  (tùy chọn)}

     ★ `oPhu` — vì sao có. Một BẢNG có nhiều cột mà cả bảng chỉ mang MỘT mã
     chỉ tiêu: `CS.05 Tỉ lệ khai thác` bày ra bốn cột (lượt mượn · tiết sử dụng ·
     tỉ lệ · lượt bị từ chối vì trùng). Nguyên tắc số 1 đòi MỌI ô bấm được và
     MỌI ô có quy tắc đếm riêng — nên từng ô con khai quy tắc của nó, thay vì
     đẻ thêm mã chỉ tiêu cho mỗi cột (mã chỉ tiêu là danh mục của cả hệ thống,
     không phải tên cột của một bảng).
     Ô con cũng có `moc` RIÊNG được: sổ mượn phòng bắt đầu chạy sau thời khóa
     biểu, nên «lượt mượn» chưa có dữ liệu trong quãng mà «tiết sử dụng» đã có. */
  function khai(o) {
    if (!o || !o.ma) throw new Error('CT.khai: thiếu mã');
    if (D[o.ma]) throw new Error('CT.khai: mã ' + o.ma + ' đã khai — không khai đè');
    if (!o.quyTacDem || !o.quyTacDem.tinhVao) throw new Error('CT.khai: ' + o.ma + ' thiếu quyTacDem.tinhVao');
    D[o.ma] = Object.assign({ chieuHopLe: [], nguon: [], oPhu: {} }, o, { tinh: null });
    return D[o.ma];
  }

  /* nối phần TÍNH — `app.20` của từng demo gọi, một lần cho mỗi mã.
     fn(thamSo, oPhu) → {giaTri, banGhiGoc:[…], ghiChu} */
  function nguonSo(ma, fn) {
    if (!D[ma]) throw new Error('CT.nguonSo: chưa khai mã ' + ma);
    D[ma].tinh = fn;
  }

  const co = ma => !!D[ma];
  const khaiBao = ma => D[ma] || null;
  const danhSach = () => Object.keys(D).sort();
  const ten = ma => (D[ma] || {}).ten || ma;

  /* chiều hợp lệ — bộ chọn phải hỏi hàm này TRƯỚC khi bày một chiều ra */
  const chieuOK = (ma, chieu) => !!D[ma] && D[ma].chieuHopLe.indexOf(chieu) >= 0;
  const chieuCua = ma => (D[ma] || { chieuHopLe: [] }).chieuHopLe.slice();

  /* mốc dữ liệu sớm nhất của một ô (ô con có mốc riêng thì lấy của ô con) */
  function mocCua(ma, o) {
    const d = D[ma]; if (!d) return null;
    if (o && d.oPhu[o] && d.oPhu[o].moc) return d.oPhu[o].moc;
    return d.moc || null;
  }

  /* ★ «CHƯA CÓ DỮ LIỆU» ≠ 0 ────────────────────────────────────────────
     Một báo cáo ghi 0 cho quãng nhà trường chưa dùng phần mềm là NÓI SAI VỀ
     NHÀ TRƯỜNG: người đọc hiểu là «kỳ đó không có việc gì xảy ra», trong khi
     sự thật là «hệ thống không biết». Hai câu đó khác nhau, và chỉ câu thứ hai
     là đúng. Nên ô ghi «dữ liệu có từ …», không ghi 0. */
  function thieuDuLieu(moc, tham) {
    if (!moc) return null;
    const dau = tham.cheDo === 'chot' ? tham.chotNgay : tham.tuNgay;
    if (!dau || dau >= moc) return null;
    return { ma: 'CHUA_CO_DU_LIEU', moc, chu: 'dữ liệu có từ ' + k2s(moc) };
  }

  /* ── CỔNG DUY NHẤT để một tab lấy một con số ────────────────────────
     CT.doc(ma, {cheDo, chotNgay, tuNgay, denNgay, phamVi, phanTo, loc}, oPhu?)
     → {ma, o, ten, giaTri, donVi, loaiSo, quyTacDem, nguon, chieuHopLe,
        banGhiGoc:[…], canhBao:null|{ma,chu}, ghiChu}                       */
  function doc(ma, tham, o) {
    const d = D[ma];
    if (!d) return loi(ma, o, 'KHONG_CO_MA', 'mã chỉ tiêu «' + ma + '» chưa có trong từ điển');
    const oKhai = o ? d.oPhu[o] : null;
    if (o && !oKhai) return loi(ma, o, 'KHONG_CO_O', 'mã ' + ma + ' không khai ô con «' + o + '»');
    tham = tham || {};
    if (tham.phanTo && !chieuOK(ma, tham.phanTo))
      return loi(ma, o, 'CHIEU_KHONG_HOP_LE',
        'không cắt được ' + ma + ' theo chiều «' + (CHIEU[tham.phanTo] || tham.phanTo) + '»');
    if (!d.tinh) return loi(ma, o, 'CHUA_NOI_NGUON',
      'mã ' + ma + ' đã khai nhưng app.20 chưa gọi CT.nguonSo()');

    const nen = {
      ma, o: o || null,
      ten: oKhai ? oKhai.ten : d.ten,
      donVi: (oKhai && oKhai.donVi) || d.donVi || '',
      loaiSo: (oKhai && oKhai.loaiSo) || d.loaiSo,
      quyTacDem: (oKhai && oKhai.quyTacDem) || d.quyTacDem,
      nguon: d.nguon.slice(), chieuHopLe: d.chieuHopLe.slice(),
      canCu: d.canCu || null
    };
    const thieu = thieuDuLieu(mocCua(ma, o), tham);
    if (thieu) return Object.assign(nen, { giaTri: null, banGhiGoc: [], canhBao: thieu });

    let kq;
    try { kq = d.tinh(tham, o) || {} }
    catch (e) { return loi(ma, o, 'LOI_TINH', String(e && e.message || e)) }
    return Object.assign(nen, {
      giaTri: kq.giaTri == null ? null : kq.giaTri,
      banGhiGoc: kq.banGhiGoc || [],
      ghiChu: kq.ghiChu || null,
      veTrai: kq.veTrai || null, vePhai: kq.vePhai || null,   /* ô dẫn xuất — hai vế của phân số */
      canhBao: kq.canhBao || null
    });
  }

  function loi(ma, o, maLoi, chu) {
    return {
      ma, o: o || null, ten: ten(ma), giaTri: null, donVi: '', loaiSo: 'TON',
      quyTacDem: { tinhVao: ['—'], khongTinh: ['—'] }, nguon: [], chieuHopLe: [],
      banGhiGoc: [], canhBao: { ma: maLoi, chu }
    };
  }

  return { khai, nguonSo, doc, co, khaiBao, danhSach, ten, chieuOK, chieuCua, mocCua, CHIEU };
})();

  let moTaNguon = ma => ({ menu: (ma || '').split('.')[0].toUpperCase().replace('M', 'M'), ten: ma });
  const noiQuyen = (fnQuyen, fnMoTa) => { if (fnQuyen) quyenNguon = fnQuyen; if (fnMoTa) moTaNguon = fnMoTa; };

  /* menu đang đứng — dùng cho `&return=` của mọi deep-link */
  let MENU_NAY = 'M9.x';
  const datMenu = m => { MENU_NAY = m };

  /* ── kho ô đã vẽ: khóa → {ket, cot, dong, kb} ───────────────────────── */
  const O = {};
  let seq = 0;

  /* ───────────────────────── chip loại số ───────────────────────────── */
  const TEN_LOAI = {
    TON: ['TỒN', 'đếm tại một thời điểm — Chốt tại ngày', 'ton'],
    PS: ['PHÁT SINH', 'đếm trong một khoảng — Từ → đến', 'ps'],
    DAN_XUAT: ['DẪN XUẤT', 'tính từ hai số khác — bấm vào ô để xem hai vế', 'dx']
  };
  function chip(loai) {
    const t = TEN_LOAI[loai] || TEN_LOAI.TON;
    return '<span class="lschip ' + t[2] + '" title="' + esc(t[1]) + '">' + t[0] + '</span>';
  }

  /* ───────────────────── định dạng một giá trị ──────────────────────── */
  function soRa(v, kieu) {
    if (v == null) return '—';
    if (kieu === 'tien') return trieu(v);
    if (kieu === 'nghin') return vn(Math.round(v / 1000));
    if (kieu === 'tile') return (Math.round(v * 10) / 10).toLocaleString('vi-VN') + '%';
    if (kieu === 'ngay') return (Math.round(v * 10) / 10).toLocaleString('vi-VN');
    if (kieu === 'chu') return esc(v);
    return vn(v);
  }

  /* ─────────────────────────── vẽ MỘT ô ──────────────────────────────
     Ba đường ra, theo đúng thứ tự ưu tiên:
       ① thiếu `XD` ở feature nguồn  → khối `.noacc`, ô vẫn chiếm chỗ
       ② chưa có dữ liệu cho quãng   → «dữ liệu có từ …», KHÔNG ghi 0
       ③ có số                        → nút bấm được                        */
  function veO(kb, dong, cot, ket) {
    /* v2 · việc 2 — nguồn THEO DÒNG đứng trước nguồn của cột và của bảng */
    const nguon = (dong && dong.nguonDong) || cot.nguon || (kb.nguon || null);
    if (nguon && !quyenNguon(nguon)) {
      const m = moTaNguon(nguon);
      return { html: '<span class="noacc" title="Thiếu quyền Xem (X) ở ' + esc(m.ten) + ' — ' + esc(m.menu) + '">🔒 ẩn</span>', tru: true, khoa: nguon };
    }
    if (!ket) return { html: '<span class="oro">—</span>', tru: false };
    if (ket.canhBao) {
      const cb = ket.canhBao;
      const k = 'o' + (++seq);
      O[k] = { ket, cot, dong, kb };
      const chu = cb.ma === 'CHUA_CO_DU_LIEU' ? cb.chu : cb.chu;
      return {
        html: '<button class="oso ocb" data-kbo="' + k + '">⚠ ' + esc(chu) + '</button>',
        tru: true, khongCo: true
      };
    }
    const k = 'o' + (++seq);
    O[k] = { ket, cot, dong, kb };
    const cls = 'oso' + (cot.kieu === 'tile' || ket.loaiSo === 'DAN_XUAT' ? ' odx' : '')
      + (cot.canhBao && cot.canhBao(ket, dong) ? ' oxau' : '');
    return { html: '<button class="' + cls + '" data-kbo="' + k + '">' + soRa(ket.giaTri, cot.kieu) + '</button>', tru: false };
  }

  /* ══════════════════════ LÕI — dựng một bảng ══════════════════════════
     kb = {khuon, tieuDe, ma, chip, moTaKy, ghiChuKy, cot:[…], dong:[…],
           o:(dong,cot)=>ket, tong:true|false, tongRieng:fn, gomNhom:bool,
           nguon:'m6.4.x', chuoiTrong:'…', duoiBang:'…html…'}              */
  function bang(kb) {
    const cot = kb.cot || [];
    const dong = kb.dong || [];
    const loai = kb.chip || (kb.ma && CT.khaiBao(kb.ma) ? CT.khaiBao(kb.ma).loaiSo : 'TON');
    let h = '<div class="bg" data-bg="' + esc(kb.id || '') + '">';

    /* đầu bảng — tiêu đề · chip loại số · nhãn kỳ */
    h += '<div class="bgh"><b>' + esc(kb.tieuDe || '') + '</b>' + chip(loai)
      + (kb.moTaKy ? '<span class="bgky">' + esc(kb.moTaKy) + '</span>' : '')
      + (kb.ma ? '<span class="bgma" title="' + esc(CT.ten(kb.ma)) + '">' + esc(kb.ma) + '</span>' : '')
      + '<span class="spacer"></span>' + (kb.nutPhai || '') + '</div>';

    if (!dong.length) {
      h += '<div class="empty">' + esc(kb.chuoiTrong || 'Không có dòng nào trong phạm vi đang xem.') + '</div></div>';
      return h;
    }

    const hDau = h.length;                 /* v2 · việc 4 — chỗ cắt nếu cả bảng bị khóa */
    let oKhoa = 0; const nguonKhoa = [];
    h += '<div class="tbx"><table class="bgt"><thead><tr><th>' + esc(kb.tenCotDau || 'Chỉ tiêu') + '</th>';
    cot.forEach(c => h += '<th class="num" title="' + esc(c.chuThich || '') + '">' + esc(c.ten)
      + (c.donVi ? '<i>' + esc(c.donVi) + '</i>' : '') + '</th>');
    h += '</tr></thead><tbody>';

    const tong = cot.map(() => ({ v: 0, co: false, tru: 0, khongCo: 0, gop: [], mau: null }));
    let nhomHienTai = null;

    dong.forEach(d => {
      if (kb.gomNhom && d.nhom && d.nhom !== nhomHienTai) {
        nhomHienTai = d.nhom;
        h += '<tr class="nhomrow"><td colspan="' + (cot.length + 1) + '">' + esc(d.nhom) + '</td></tr>';
      }
      h += '<tr' + (d.mo ? ' class="dongmo"' : '') + '>'
        + '<td>' + (d.bac ? '<span class="bac"></span>' : '') + '<b>' + esc(d.ten) + '</b>'
        + (d.phu ? '<span class="dphu">' + esc(d.phu) + '</span>' : '') + '</td>';
      cot.forEach((c, i) => {
        const ket = kb.o(d, c);
        const r = veO(kb, d, c, ket);
        h += '<td class="num">' + r.html + '</td>';
        if (r.khoa) { oKhoa++; if (nguonKhoa.indexOf(r.khoa) < 0) nguonKhoa.push(r.khoa); }
        if (r.tru) { tong[i].tru++; if (r.khongCo) tong[i].khongCo++; }
        else if (ket && ket.giaTri != null && c.kieu !== 'tile' && c.kieu !== 'ngay' && !c.khongCong) {
          tong[i].v += Number(ket.giaTri); tong[i].co = true;
          tong[i].mau = tong[i].mau || ket;
          tong[i].gop.push({ id: '', ten: d.ten, so: soRa(ket.giaTri, c.kieu) });
        }
      });
      h += '</tr>';
    });

    /* ── v2 · việc 4 — CẢ BẢNG thiếu quyền nguồn ⇒ MỘT dải thay cho N ô ────
       N ô `🔒 ẩn` lặp lại nói N lần cùng một câu, và dòng Tổng «đã trừ N dòng»
       thành một con số không còn gì để trừ. Một dải nói một lần: thiếu quyền
       gì, trên menu nào, và bảng có bao nhiêu dòng không hiện. Chỉ khi MỌI ô
       số của bảng đều bị khóa — khóa một phần thì vẫn là ô `🔒 ẩn` như v1.  */
    if (kb.daiKhoa !== false && cot.length && oKhoa === dong.length * cot.length) {
      h = h.slice(0, hDau) + '<div class="noaccbox kbdai">🔒 <b>Cả bảng bị ẩn</b> — vai đang xem không có quyền '
        + '<b>Xem (X)</b> ở ' + nguonKhoa.map(n => { const m = moTaNguon(n); return '<b>' + esc(m.ten) + ' — ' + esc(m.menu) + '</b>' }).join(' · ')
        + '. Bảng có <b>' + dong.length + ' dòng</b>, không hiện ở đây.</div>';
      if (kb.duoiBang) h += kb.duoiBang;
      return h + '</div>';
    }

    /* ── dòng Tổng — và NÓI RÕ đã trừ bao nhiêu (N5) ─────────────────── */
    if (kb.tong !== false) {
      h += '<tr class="tongrow"><td><b>' + esc(kb.tenTong || 'Tổng') + '</b></td>';
      cot.forEach((c, i) => {
        const t = tong[i];
        let o;
        if (kb.tongRieng && kb.tongRieng(c) != null) {
          const ket = kb.tongRieng(c);
          const r = veO(kb, { id: '_tong', ten: 'Tổng' }, c, ket);
          o = r.html;
        } else if (c.kieu === 'tile' || c.kieu === 'ngay' || c.khongCong) {
          o = '<span class="oro" title="Cột này không cộng dọc được — tỉ lệ và trung vị của cả bảng không phải tổng của các dòng">—</span>';
        } else if (t.co) {
          /* ★ Ô TỔNG CŨNG BẤM ĐƯỢC. Câu hỏi hay bị hỏi nhất về một bảng là
             «tổng này gồm những dòng nào», và nó chính là câu mà tổng phải trả
             lời được — nhất là khi tổng đã bị trừ bớt vì thiếu quyền (N5). */
          const ketT = Object.assign({}, t.mau, {
            ten: 'Tổng — ' + ((t.mau && t.mau.ten) || esc(c.ten)),
            giaTri: t.v, banGhiGoc: t.gop, veTrai: null, vePhai: null,
            ghiChu: 'Cộng <b>' + t.gop.length + ' dòng</b> của bảng'
              + (t.tru ? '; <b>đã trừ ' + t.tru + ' dòng</b> ('
                + (t.tru - t.khongCo ? (t.tru - t.khongCo) + ' thiếu quyền' : '')
                + (t.tru - t.khongCo && t.khongCo ? ' · ' : '')
                + (t.khongCo ? t.khongCo + ' chưa có dữ liệu' : '') + ')' : '') + '.'
          });
          o = veO(kb, { id: '_tong', ten: 'Tổng' }, Object.assign({}, c, { canhBao: null }), ketT).html;
        } else {
          o = '—';
        }
        const ghi = [];
        if (t.tru - t.khongCo > 0) ghi.push('đã trừ ' + (t.tru - t.khongCo) + ' dòng — thiếu quyền');
        if (t.khongCo > 0) ghi.push('đã trừ ' + t.khongCo + ' dòng — chưa có dữ liệu');
        h += '<td class="num">' + o + (ghi.length ? '<span class="tongtru">' + esc(ghi.join(' · ')) + '</span>' : '') + '</td>';
      });
      h += '</tr>';
    }
    h += '</tbody></table></div>';
    if (kb.duoiBang) h += kb.duoiBang;
    h += '</div>';
    return h;
  }

  /* ══════════════════════ CHÍN KHUÔN BIỂU MẪU ══════════════════════════
     Mỗi khuôn là một cách SẮP một bảng, không phải một bộ mã riêng. Chín
     khuôn phủ hết 81 báo cáo của tài liệu 18/9 — mẫu thứ mười chỉ tốn
     một dòng cấu hình (`N8`), không tốn một khuôn.                       */

  /* ── K1 · Bảng phân tổ MỘT chiều ─────────────────────────────────────
     Một chỉ tiêu, cắt theo một chiều. Dòng = giá trị của chiều;
     cột = Số lượng + Tỉ lệ + dòng Tổng.                                 */
  function K1(kb) {
    const tongSo = (kb.dong || []).reduce((a, d) => {
      const k = kb.oSo(d); return a + (k && k.giaTri != null ? Number(k.giaTri) : 0);
    }, 0);
    return bang(Object.assign({}, kb, {
      khuon: 'K1', tenCotDau: kb.tenCotDau || (CT.CHIEU[kb.chieu] || 'Chỉ tiêu'),
      cot: [
        { khoa: 'so', ten: 'Số lượng', donVi: kb.donVi || '', kieu: 'so', nguon: kb.nguon },
        { khoa: 'tl', ten: 'Tỉ lệ', kieu: 'tile', nguon: kb.nguon, khongCong: true }
      ],
      o: (d, c) => {
        const k = kb.oSo(d);
        if (c.khoa === 'so') return k;
        if (!k || k.giaTri == null) return k;
        return Object.assign({}, k, {
          ten: 'Tỉ lệ — ' + k.ten, loaiSo: 'DAN_XUAT', donVi: '%',
          giaTri: tile(Number(k.giaTri), tongSo),
          veTrai: { ten: k.ten + ' của dòng này', giaTri: Number(k.giaTri), donVi: kb.donVi || '' },
          vePhai: { ten: 'Tổng toàn bảng', giaTri: tongSo, donVi: kb.donVi || '' }
        });
      }
    }));
  }

  /* ── K2 · Bảng chéo HAI chiều ────────────────────────────────────────
     Dòng × cột, ô = số (và % nếu có mẫu số rõ). Gom nhóm Điểm trường →
     Khối → Lớp bằng `gomNhom:true` + `dong[].nhom`.                     */
  function K2(kb) { return bang(Object.assign({ gomNhom: true }, kb, { khuon: 'K2' })) }

  /* ── K3 · HAI KHỐI: TỒN + PHÁT SINH ──────────────────────────────────
     🛑 HAI BẢNG TÁCH HẲN, hai nhãn, hai bộ điều khiển thời gian.
     KHÔNG BAO GIỜ cộng chéo hai khối — đó là lỗi nghiệm thu, không phải
     chuyện thẩm mỹ: cộng một số tồn với một số phát sinh ra một con số
     không có nghĩa nào trong đời thật.                                   */
  function K3(kb) {
    return '<div class="k3">'
      + bang(Object.assign({}, kb.khoiTon, { khuon: 'K3', chip: 'TON' }))
      + '<div class="k3sep">🛑 Hai khối dưới đây <b>không cộng chéo</b> — khối trên đếm tại một thời điểm, khối dưới đếm trong một khoảng.</div>'
      + bang(Object.assign({}, kb.khoiPS, { khuon: 'K3', chip: 'PS' }))
      + '</div>';
  }

  /* ── K4 · Lưới người × ngày / danh sách chi tiết ──────────────────────
     Dòng = một người / một học sinh. Luôn kèm dải Luật BVDLCN 91/2025:
     bảng này có HỌ TÊN, nên xuất nó là xuất dữ liệu cá nhân.             */
  function K4(kb) {
    return '<div class="bvdl" data-kbk4="1">⚖ Bảng này có <b>họ tên</b> — xuất ra là <b>xuất dữ liệu cá nhân</b>. '
      + 'Nút <b>Danh sách chi tiết</b> bắt chọn mục đích, chọn trường, đóng dấu tệp và ghi audit '
      + '<i>(Luật BVDLCN 91/2025)</i>.</div>'
      + bang(Object.assign({ tong: false, tenCotDau: 'Họ và tên' }, kb, { khuon: 'K4' }));
  }

  /* ── K5 · Sổ / phiếu ─────────────────────────────────────────────────
     Một bản ghi một dòng, theo thời gian. Bắt buộc: SỐ HIỆU LIÊN TỤC,
     KHÔNG NHẢY SỐ — sổ nhảy số là sổ không dùng được làm căn cứ, nên
     khuôn tự dò và nói ra chỗ đứt.                                       */
  function K5(kb) {
    const ds = kb.banGhi || [];
    let canh = '';
    if (kb.kiemSoHieu !== false && ds.length > 1) {
      const so = ds.map(x => Number(String(x.so || '').replace(/\D/g, ''))).filter(n => !isNaN(n)).sort((a, b) => a - b);
      const dut = [];
      for (let i = 1; i < so.length; i++) if (so[i] - so[i - 1] > 1) dut.push(so[i - 1] + ' → ' + so[i]);
      if (dut.length) canh = '<div class="canh r">⚠ <b>Sổ nhảy số</b> ở ' + dut.length + ' chỗ: ' + esc(dut.join(' · '))
        + '. Sổ có số hiệu đứt quãng thì không dùng làm căn cứ được — kiểm lại ở menu chủ.</div>';
    }
    let h = '<div class="bg"><div class="bgh"><b>' + esc(kb.tieuDe || 'Sổ') + '</b>' + chip(kb.chip || 'PS')
      + (kb.moTaKy ? '<span class="bgky">' + esc(kb.moTaKy) + '</span>' : '') + '</div>' + canh;
    if (!ds.length) return h + '<div class="empty">' + esc(kb.chuoiTrong || 'Sổ chưa có dòng nào trong khoảng đang xem.') + '</div></div>';
    h += '<div class="tbx"><table class="bgt so"><thead><tr>'
      + (kb.cot || [{ khoa: 'so', ten: 'Số hiệu' }, { khoa: 'ngay', ten: 'Ngày' }, { khoa: 'noiDung', ten: 'Nội dung' },
      { khoa: 'nguoiLap', ten: 'Người lập' }, { khoa: 'nguoiKy', ten: 'Người ký' }, { khoa: 'tt', ten: 'Trạng thái' }])
        .map(c => '<th>' + esc(c.ten) + '</th>').join('') + '</tr></thead><tbody>';
    const cot = kb.cot || [{ khoa: 'so' }, { khoa: 'ngay' }, { khoa: 'noiDung' }, { khoa: 'nguoiLap' }, { khoa: 'nguoiKy' }, { khoa: 'tt' }];
    ds.forEach(x => {
      h += '<tr>' + cot.map(c => '<td>' + (c.ve ? c.ve(x) : esc(x[c.khoa] == null ? '—' : x[c.khoa])) + '</td>').join('') + '</tr>';
    });
    h += '</tbody></table></div>' + (kb.duoiBang || '') + '</div>';
    return h;
  }

  /* ── K6 · Biểu CỐ ĐỊNH (của Bộ hoặc của trường ban hành) ──────────────
     Loại A · C — cấu trúc KHÔNG ĐỔI ĐƯỢC. Mỗi ô của biểu phải ánh xạ tới
     một mã chỉ tiêu; ô CHƯA ánh xạ được thì NÊU ĐÍCH DANH, không để trống
     cho người đọc tự đoán. Kèm khối chữ ký + đóng dấu ngày chốt.         */
  function K6(kb) {
    let h = '<div class="k6">';
    (kb.khoi || []).forEach(kh => { h += bang(Object.assign({ khuon: 'K6' }, kh)) });
    const chua = (kb.oChuaAnhXa || []);
    if (chua.length) {
      h += '<div class="canh w"><b>' + chua.length + ' ô của biểu chưa ánh xạ được vào mã chỉ tiêu nào</b> — '
        + 'nêu đích danh ở đây thay vì để trống: ' + chua.map(x => '<b>' + esc(x.o) + '</b> <i>(' + esc(x.ly) + ')</i>').join(' · ')
        + '. Người ký phải biết mình đang ký một biểu còn ô do người điền tay.</div>';
    }
    if (kb.chuKy) h += kb.chuKy;
    h += '</div>';
    return h;
  }

  /* ── K7 · Tệp đối soát cho hệ thống ngoài ─────────────────────────────
     Cột do HỆ ĐÍCH quy định. Bắt buộc kèm BẢNG ĐỐI CHIẾU SỐ TỔNG hai
     chiều TRƯỚC khi tải — và không làm tròn: chênh một đồng vẫn là chênh. */
  function K7(kb) {
    let h = '<div class="k7"><div class="canh b">📤 Cột của bảng này do <b>' + esc(kb.heDich || 'hệ đích')
      + '</b> quy định — Dschool không đổi được. Đối chiếu số tổng trước khi tải.</div>';
    h += bang(Object.assign({ khuon: 'K7', tong: true }, kb));
    if (kb.doiChieu) {
      h += '<div class="bg"><div class="bgh"><b>Đối chiếu số tổng — hai chiều</b>' + chip('TON') + '</div><div class="tbx"><table class="bgt"><thead><tr>'
        + '<th>Chỉ tiêu đối chiếu</th><th class="num">Dschool</th><th class="num">' + esc(kb.heDich || 'Hệ đích') + '</th><th class="num">Chênh</th></tr></thead><tbody>';
      kb.doiChieu.forEach(r => {
        const ch = (r.a == null || r.b == null) ? null : r.a - r.b;
        h += '<tr' + (ch ? ' class="badrow"' : '') + '><td>' + esc(r.ten) + '</td><td class="num">' + vn(r.a)
          + '</td><td class="num">' + (r.b == null ? '—' : vn(r.b)) + '</td><td class="num">'
          + (ch == null ? '—' : (ch === 0 ? '0' : '<b>' + vn(ch) + '</b>')) + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }
    return h + '</div>';
  }

  /* ── K8 · Báo cáo VĂN BẢN (sơ kết · tổng kết · đột xuất) ──────────────
     Căn cứ → phần SỐ (nhúng K1/K2/K3) → nhận xét, phương hướng → chữ ký.
     🛑 Phần số SINH TỪ CHỈ TIÊU, không gõ tay: một báo cáo tổng kết có số
     gõ tay là một báo cáo không ai đối chiếu lại được.                    */
  function K8(kb) {
    let h = '<div class="k8"><div class="k8h">' + esc(kb.tieuDe || 'Báo cáo') + '</div>';

      + ' · cắt được theo ' + (ket.chieuHopLe || []).map(x => esc(CT.CHIEU[x] || x)).join(' · ') + '</div></div>';

    /* ① bản ghi gốc */

    h += '<div class="kbbg"><div class="kbqth">Bản ghi gốc — ' + bg.length + ' dòng</div>';

      h += '</tbody></table></div>';
      if (bg.length > 200) h += '<div class="ro">Hiển thị 200 dòng đầu trên ' + bg.length + '.</div>';
    }
    h += '</div>';

    /* ③ deep-link về menu chủ */
    /* v2 · việc 2 — deep-link THEO DÒNG đứng trước link của cột và của bảng */
    const lk = (d && (typeof d.linkDong === 'function' ? d.linkDong(d) : d.linkDong))

    if (lk) {

  /* gắn một lần — bắt mọi nút ô số trên trang, kể cả ô vẽ sau */
  function gan() {
    if (gan._da) return; gan._da = true;
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-kbo]');
      if (b) { drill(b.getAttribute('data-kbo')); return }
      const dl = e.target.closest('[data-dl]');
      if (dl && $('#kbMask') && $('#kbMask').classList.contains('on')) dong();

  /* dọn kho ô trước mỗi lần vẽ lại — không dọn thì kho phình theo số lần vẽ */
  function moi() { Object.keys(O).forEach(k => delete O[k]); seq = 0; }

  return {
    K1, K2, K3, K4, K5, K6, K7, K8, K9,
    bang, drill, gan, moi, chip, soRa, noiQuyen, datMenu, dong,
    get MENU() { return MENU_NAY }
  };
})();

const PV = (function () {

  /* ───────────────── KỲ BÁO CÁO CHUẨN — `nh9` §4 ─────────────────────

  const KY = {

    cuoi_nam: { ten: '📌 Cuối năm', mo: 'Số liệu chốt bế giảng và phát sinh cả năm học', cheDo: 'ca_hai', ky: 'cuoi_nam' }
  };

  /* ───────────────────────── TRẠNG THÁI ─────────────────────────────── */
  const st = {

    denNgay: HOMNAY,

    phanTo: null,
    mauDangDung: null,
    /* ★ người dùng đã tự đặt khoảng chưa. Mỗi tab có KỲ CHUẨN riêng (`nh9` §4)
       và tab được mở bằng kỳ của nó; nhưng một khi người dùng tự chọn ngày,
       chuyển tab KHÔNG được ghi đè lựa chọn ấy — đổi số dưới tay người đang

    tuTay: false
  };
  /* tab gọi khi mở: đặt khoảng theo kỳ chuẩn của tab, trừ khi người dùng đã tự đặt */
  function khoangMacDinh(maKy) {
    if (st.tuTay || !KY[maKy]) return;
    st.tuNgay = KY[maKy].tu; st.denNgay = KY[maKy].den;

  let veLai = () => { };
  const noiVeLai = fn => { veLai = fn };

  /* tham số truyền cho `CT.doc()` */
  const thamSo = them => Object.assign({
    cheDo: 'chot', chotNgay: st.chotNgay, tuNgay: st.tuNgay, denNgay: st.denNgay,
    phamVi: st.phamVi, phanTo: st.phanTo
  }, them || {});
  const thamSoPS = them => thamSo(Object.assign({ cheDo: 'khoang' }, them || {}));

  const laHomNay = () => st.chotNgay === HOMNAY;
  const moTaChot = () => 'Chốt tại ngày ' + k2s(st.chotNgay);
  const moTaKhoang = () => 'Từ ' + k2s(st.tuNgay) + ' → ' + k2s(st.denNgay);

  /* ══════════════ ① CHỐT TẠI NGÀY — cho số TỒN ══════════════════════

  function daiCanhBao() {

     `268 tài sản · phạm vi Điểm trường A · toàn trường 412`.

  function daiPhamVi(n, donVi, tongToanTruong, tenPhamVi) {

  /* ══════════════ BỘ CHỌN CHIỀU PHÂN TỔ ════════════════════════════════
     🛑 CHẶN NGAY chiều không hợp lệ — không bày ra rồi mới báo lỗi.
     Chiều bị chặn vẫn hiện, mờ đi, kèm lý do: người dùng cần biết vì sao
     không cắt được, chứ không cần một danh sách ngắn hơn.                 */
  function chonChieu(ma, dsChieu) {

      + '<button class="pvk' + (!st.phanTo ? ' on' : '') + '" data-pvct="">Không cắt</button>';
    (dsChieu || hopLe).forEach(c => {

      h += '<button class="pvk' + (st.phanTo === c ? ' on' : '') + (ok ? '' : ' cam') + '"'
        + (ok ? ' data-pvct="' + c + '"' : ' disabled title="' + esc(CT.ten(ma)) + ' không cắt được theo chiều này — từ điển chỉ tiêu không khai nó là chiều hợp lệ"')
        + '>' + esc(CT.CHIEU[c] || c) + (ok ? '' : ' 🚫') + '</button>';
    });

  /* ─────────────────────────── gắn sự kiện ──────────────────────────── */
  function gan() {
    if (gan._da) return; gan._da = true;
    document.addEventListener('change', e => {
      if (e.target.id === 'pvChot') { st.chotNgay = e.target.value || HOMNAY; st.mauDangDung = null; veLai() }
      if (e.target.id === 'pvTu') { st.tuNgay = e.target.value; st.mauDangDung = null; veLai() }
      if (e.target.id === 'pvDen') { st.denNgay = e.target.value; st.mauDangDung = null; veLai() }
    });
    document.addEventListener('click', e => {
      const k = e.target.closest('[data-pvky]');
      if (k) {
        const v = k.getAttribute('data-pvky');

      }
      const h = e.target.closest('[data-pvkh]');
      if (h) { const v = h.getAttribute('data-pvkh'); st.tuNgay = KY[v].tu; st.denNgay = KY[v].den; st.mauDangDung = null; st.tuTay = true; veLai(); return }
      const m = e.target.closest('[data-pvmau]');
      if (m) { napMau(m.getAttribute('data-pvmau')); veLai(); return }
      const c = e.target.closest('[data-pvct]');
      if (c) { st.phanTo = c.getAttribute('data-pvct') || null; veLai(); return }
    });
  }

  return {
    st, KY, MAU, themMau, napMau, gan, noiVeLai, khoangMacDinh,
    chotNgay, khoang, daiCanhBao, daiPhamVi, daiMau, chonChieu,
    thamSo, thamSoPS, moTaChot, moTaKhoang, laHomNay
  };
})();

const XU = (function () {

  /* bối cảnh do `app.20` nối vào: tên trường · người đang xem · tên báo cáo */
  let boiCanh = () => ({

    quyTac: [], banGhiCaNhan: false, truong_du_lieu: []

  const noiBoiCanh = fn => { boiCanh = fn };

  /* ───────────────────── SỔ AUDIT — mọi lượt xuất ─────────────────────
     Ở MVP sổ nằm trong bộ nhớ trang; bản thật ghi vào `M10.7` Nhật ký hệ
     thống. Mã audit in vào CHÍNH TỆP XUẤT — tệp in ra giấy rồi vẫn tra
     ngược được ai xuất, lúc nào, với mục đích gì.                        */
  const AUDIT = [];
  let seqA = 0;

  /* ── v2 · việc 1 — SỔ CHUNG: bản mô phỏng của «ghi vào `M10.7`» ─────────
     Mười tám demo là mười tám tệp riêng, cùng một nguồn gốc trình duyệt, nên
     sổ chung nằm ở `localStorage` dưới một khóa. Đọc/ghi hỏng (chế độ ẩn danh,
     trình duyệt chặn) thì vẫn xuất được — sổ trong trang `AUDIT` còn nguyên;
     chỉ mất phần chuyển sang `M10.7`, và đó là giới hạn của bản demo. */
  const KHOA_SO = 'dschool.bcm9.soAuditXU';
  function docSoChung() {
    try { const s = JSON.parse(localStorage.getItem(KHOA_SO) || '[]'); return Array.isArray(s) ? s : [] }
    catch (e) { return [] }
  }
  function ghiSoChung(dong) {
    try { const s = docSoChung(); s.push(dong); localStorage.setItem(KHOA_SO, JSON.stringify(s)) } catch (e) { }
  }
  /* mã audit duy nhất trên CẢ sổ chung — hai demo cùng ngày không cấp trùng số */
  const maAudit = () => {
    const dau = 'XU-' + HOMNAY.replace(/-/g, '') + '-';
    const daCo = docSoChung().filter(a => String(a.id || '').indexOf(dau) === 0).length;
    seqA = Math.max(seqA, daCo) + 1;
    return dau + p2(seqA);
  };
  const gioNay = () => { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()) };

  /* ── KHUÔN DÒNG của tab ③ `M10.7` (`KT-2`) — TÁM thứ, không thiếu thứ nào:
     ai · chức danh LÚC THAO TÁC · lúc nào · bao nhiêu bản ghi · trường nào ·
     mục đích · menu/tab nguồn · mã audit. Tên trường trùng tên cột của sổ
     `TCDL` ở `M10.7` (`id ngay gio nguoi cd mn ob hv bg tr md dau`) để một
     dòng mới và một dòng đã gieo đọc bằng cùng một hàm; thêm `muc` · `trTen`
     · `mdTen` · `tab` cho những gì sổ cũ không có. */
  function dongAudit(a, bc) {
    return {
      id: a.ma, ngay: a.luc, gio: a.gio, nguoi: a.nguoi, cd: a.chucDanh || '',
      mn: a.menu || '', tab: a.tab || '', ob: a.baoCao || '', hv: 'xuat', muc: a.muc,
      bg: a.soBanGhi == null ? null : a.soBanGhi,

  /* ─────────── MỤC ĐÍCH XUẤT — Luật BVDLCN 91/2025 ────────────────────

    ['xu_ly_su_vu', 'Xử lý một sự vụ cụ thể đang phát sinh']
  ];

  /* ═════════════════════ HAI NÚT — khác chữ, khác màu ═════════════════ */
  function veNut(opt) {

  /* ═════════════════════ CUỐI TRANG ═══════════════════════════════════ */
  function cuoiTrang(bc, ma, mucDich) {
    let h = '<div class="xcuoi"><div class="xqt"><b>Quy tắc đếm</b><ul>';

  /* ═════════════ MỨC 1 · BẢNG TỔNG HỢP — xuất thẳng ═══════════════════
     Chỉ có số ⇒ không phải dữ liệu cá nhân ⇒ không có cổng. Vẫn ghi audit
     đơn giản, vì «ai lấy con số nào đi đâu» là câu hỏi sẽ được hỏi lại.  */
  /* v2 · việc 3 — màn hình đang bày một lưới CÓ HỌ TÊN (`K4`) không?
     Đọc dải `data-kbk4` mà `KB.K4` gắn, và chỉ tính dải ĐANG HIỆN (tab ẩn
     thì không). Bối cảnh `coHoTen` ép tay được: `true` — bảng có tên dù

     họ tên, để nút mức 1 xuất tự do như v1. */
  function dangCoHoTen(bc) {
    if (bc.coHoTen === true || bc.coHoTen === false) return bc.coHoTen;
    return $$('[data-kbk4]').some(n => n.offsetParent !== null);
  }

  function tongHop(themVaoBoiCanh) {
    const bc = Object.assign({}, boiCanh(), themVaoBoiCanh || {});
    /* 🛑 lưới người × ngày có họ tên: «chỉ có số» là câu SAI — mỗi ô là số của

    if (dangCoHoTen(bc)) { chiTiet(themVaoBoiCanh, { tuMuc1: true }); return; }

function mgCho(h, ma, goc, sl) {
  const ok = [];
  Object.keys(MG).forEach(k => {

    m.dien.forEach(d => { if (d === '*TH') { if (h.cap === 'TH') hop = true } else if (h.dien.includes(d)) hop = true });
    if (!hop) return;
    let so = m.kieu === 'ngay' ? m.muc * (sl || 0) : Math.round(goc * m.muc / 100);
    if (so > goc) so = goc;
    ok.push({ k, ten: m.ten, ns: m.ns, so });

}

/* 🔒 `HDDL` (`BCM9-V22`, 21/9/2026) — NGƯỜI đọc tệp dữ liệu mẫu chung `app.19`.
   Trước `V22` menu này gieo 12 người riêng (7 giáo viên của một trường ba cấp)
   ⇒ `CM.04` ở đây 84,1 ⇄ `M9.5` 72,6 dù cùng định nghĩa. Nay MỘT tập người
   với `M9.5` · `M9.4`…: `DLC.nhanSu` — HAI ĐƯỜNG ĐỌC, MỘT TẬP NGƯỜI (`R20`):
   `M9.5` đọc số chốt KPI thẳng ở `M5.5`, menu này đọc qua bảng `M7.6`.
   🔑 Điểm KPI = `DLC.nhanSu[].kpi` — SỐ CHỐT kỳ Quý I, ⛔ không tính lại.
   Phần RIÊNG của `M7.6` (ngày công · phép · tiết… tháng 12/2026) chưa có ở
   `DLC` ⇒ trải theo CHỈ SỐ người trong `DLC` (luật ② `HDDL`), ⛔ không ngẫu
   nhiên. Người tạm nghỉ dài VẪN có dòng (ngày công ít, ốm · chế độ nhiều);
   người biệt phái đi có dòng nhưng ⛔ không chấm công ở trường (ô trống,
   không phải 0).                                                           */
const KY_CC_NGAY = 22;                          /* ngày làm việc tháng 12/2026 — như `NGAYHOC` */
const hatNS = (i, k) => ((i + 1) * 7919 + k * 104729) % 97;
const KYLUAT_NS = { 'Đỗ Văn Trung': { muc: 'Khiển trách', tu: '2026-11-01' } };   /* chiếu `M4.10` — riêng menu này, mục E phiếu `V22` */
const NS = DLC.nhanSu.map((x, i) => {
  const gv = x.viTri === 'Giáo viên' || x.to === 'Ban giám hiệu' ? 1 : 0;
  const cd = x.viTri + (x.chucVu ? ' — ' + x.chucVu : '') + (x.gvcnLop ? ' — GVCN ' + x.gvcnLop : '');
  const kpi = x.kpi ? x.kpi.diem : null, kpiChot = x.kpi ? DLC.moc.kyKpi[0].chot : null;
  const nen = { ma: x.ma, ten: x.ten, cd, to: x.to, dt: x.dt, gv, kpi, kpiChot, kyLuat: KYLUAT_NS[x.ten] || null };
  if (x.trangThai === 'biet_phai_di') return Object.assign(nen, { cd: cd + ' — biệt phái đi, chấm công ở nơi đến',
    cong: null, phep: null, om: null, vuotQuy: null, dinhChinh: null, khongPhep: null, muonN: null, ot: null,
    tietKH: null, tietGiao: null, tietThuc: null, tietVuot: null });
  const nghi = (x.giaiDoan.find(g => g.tt === 'tam_nghi_dai' && g.tu <= '2026-12-31' && g.den >= '2026-12-01'));
  /* ngày nghỉ dài rơi vào tháng 12: trước 21/12 · sau 15/12 … — đếm theo lịch 22 ngày làm việc */
  const omDai = !nghi ? 0 : nghi.tu > '2026-12-01' ? 6 : 12;
  const phep = omDai ? 0 : hatNS(i, 1) % 9 === 0 ? 2 : hatNS(i, 1) % 5 === 0 ? 1 : 0;
  const om = omDai || (hatNS(i, 2) % 13 === 0 ? 2 : 0);
  const khongPhep = omDai ? 0 : hatNS(i, 3) % 23 === 0 ? 1 : 0;
  const tiet = !gv ? null : x.to === 'Ban giám hiệu' ? (x.dinhMucRieng || 0) * 4 : x.moiTuyen ? 36 : 68 + hatNS(i, 7) % 9;
  const giao = tiet == null ? null : tiet + (x.to === 'Ban giám hiệu' || x.moiTuyen ? 0 : (hatNS(i, 8) % 3) * 2);
  const thuc = giao == null ? null : Math.max(0, giao - (omDai ? Math.round(giao * omDai / KY_CC_NGAY) : hatNS(i, 9) % 5));
  return Object.assign(nen, {
    cong: KY_CC_NGAY - phep - om - khongPhep, phep, om, vuotQuy: om > 2 && !omDai ? 1 : 0,
    dinhChinh: hatNS(i, 4) % 11 === 0 ? 1 : 0, khongPhep, muonN: hatNS(i, 5) % 4 === 0 ? hatNS(i, 5) % 3 + 1 : 0,
    ot: gv ? 0 : hatNS(i, 6) % 13, tietKH: tiet, tietGiao: giao, tietThuc: thuc,
    tietVuot: giao == null ? null : Math.max(0, giao - 72)
  });
});

/* ── công cụ chung: hóa đơn tại ngày chốt ─────────────────────────────── */
const hdSong = o => o.tt !== 'huy';
function hdTaiNgay(tham, loc) {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  return HD.filter(o => hdSong(o) && trongPV(o) && daPhatHanh(o.th, ngay) && (!loc || loc(o)));
}
const hdConNo = o => !o.tuChoi && o.thu < o.phai;
const tuoiNo = (o, ngay) => Math.max(0, soNgay(o.han, ngay));
const daiCua = n => n <= 30 ? 'd0' : n <= 60 ? 'd31' : n <= 90 ? 'd61' : 'd90';
const tenHS = m => { const h = HSC(m); return h ? h.ten : m };
const veHD = o => ({
  id: o.id, ten: tenHS(o.hs) + ' · ' + o.lop,
  phu: (o.ma ? KD(o.ma).ten : 'Hóa đơn gộp — ' + o.dong.length + ' khoản') + ' · ' + o.th
    + ' · hạn ' + k2s(o.han) + (o.loai === 'phu' ? ' · HÓA ĐƠN PHỤ' : '') + (o.tuChoi ? ' · đã từ chối đóng (hợp lệ)' : ''),
  so: vnd(o.phai) + (o.thu < o.phai ? ' · đã thu ' + vnd(o.thu) : ' · đủ')
});

CT.nguonSo('TC.01', (tham, o) => {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  if (o === 'thuTrongKhoang' || o === 'gdTrongKhoang') {
    const tu = tham.tuNgay, den = tham.denNgay > HOMNAY ? HOMNAY : tham.denNgay;
    const g = GD.filter(x => x.hd && trongPV(gdPV(x)) && x.ngay >= tu && x.ngay <= den
      && (!tham.loc || tham.loc(x)));
    return {
      giaTri: o === 'gdTrongKhoang' ? g.length : g.reduce((a, x) => a + x.so, 0),
      banGhiGoc: g.map(veGD)
    };
  }
  const ds = hdTaiNgay(tham, tham.loc);
  if (o === 'soHoaDon') return { giaTri: ds.length, banGhiGoc: ds.map(veHD) };
  if (o === 'soChungTu') {
    const g = GD.filter(x => x.hd && ds.some(h => h.id === x.hd));
    return { giaTri: g.length, banGhiGoc: g.map(veGD) };
  }
  if (o === 'tienDaNhan') {
    const g = GD.filter(x => trongPV(gdPV(x)) && x.ngay <= ngay);
    return {
      giaTri: g.reduce((a, x) => a + x.so, 0), banGhiGoc: g.map(veGD),
      ghiChu: 'Gồm <b>' + g.filter(x => !x.hd).length + ' giao dịch chưa khớp</b> — chưa gắn được vào hóa đơn nào.'
    };
  }
  if (o === 'soEmConNo') {
    const em = {}; ds.filter(hdConNo).forEach(x => { em[x.hs] = (em[x.hs] || 0) + (x.phai - x.thu) });
    const ks = Object.keys(em);
    return {
      giaTri: ks.length,
      banGhiGoc: ks.map(k => ({ id: k, ten: tenHS(k), phu: (HSC(k) || {}).lop || '', so: vnd(em[k]) }))
    };
  }
  const v = o === 'daThu' ? ds.reduce((a, x) => a + x.thu, 0)
    : o === 'conNo' ? ds.filter(hdConNo).reduce((a, x) => a + (x.phai - x.thu), 0)
      : ds.reduce((a, x) => a + (x.tuChoi ? 0 : x.phai), 0);
  const ve = o === 'conNo' ? ds.filter(hdConNo) : ds;
  return { giaTri: v, banGhiGoc: ve.map(veHD) };
});
const gdPV = x => ({ dt: x.dt, lop: x.hs ? (HSC(x.hs) || {}).lop : null });
const veGD = x => ({
  id: x.id, ten: x.hd ? (tenHS(x.hs) + ' · ' + x.hd) : '⚠ CHƯA KHỚP — ' + x.noi,
  phu: k2s(x.ngay) + ' · ' + (x.pt === 'mat' ? 'tiền mặt' : 'SePay') + ' · ' + x.by + (x.ly ? ' · ' + x.ly : ''),
  so: vnd(x.so)
});

CT.nguonSo('TC.02', tham => {
  const ds = hdTaiNgay(tham, tham.loc).filter(x => !x.tuChoi);
  const phai = ds.reduce((a, x) => a + x.phai, 0), thu = ds.reduce((a, x) => a + x.thu, 0);
  return {
    giaTri: tile(thu, phai),
    veTrai: { ten: 'Đã thu', giaTri: thu, donVi: 'đồng' },
    vePhai: { ten: 'Phải thu', giaTri: phai, donVi: 'đồng' },
    ghiChu: 'Cộng <b>tử số</b> và <b>mẫu số</b> của ' + ds.length + ' hóa đơn rồi mới chia.',
    banGhiGoc: ds.filter(hdConNo).map(veHD)
  };
});

CT.nguonSo('TC.05', (tham, o) => {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  const ds = hdTaiNgay(tham, tham.loc).filter(hdConNo);
  if (o === 'soEm') {
    const em = {}; ds.forEach(x => { em[x.hs] = 1 });
    return { giaTri: Object.keys(em).length, banGhiGoc: ds.map(x => veTuoi(x, ngay)) };
  }
  if (o === 'tuoiLonNhat') {
    const t = ds.map(x => tuoiNo(x, ngay));
    return {
      giaTri: t.length ? Math.max.apply(null, t) : null,
      banGhiGoc: ds.slice().sort((a, b) => tuoiNo(b, ngay) - tuoiNo(a, ngay)).map(x => veTuoi(x, ngay))
    };
  }
  const loc = o ? ds.filter(x => daiCua(tuoiNo(x, ngay)) === o) : ds;
  return { giaTri: loc.reduce((a, x) => a + (x.phai - x.thu), 0), banGhiGoc: loc.map(x => veTuoi(x, ngay)) };
});
const veTuoi = (o, ngay) => ({
  id: o.id, ten: tenHS(o.hs) + ' · ' + o.lop,
  phu: (o.ma ? KD(o.ma).ten : 'Hóa đơn gộp') + ' · ' + o.th + ' · hạn ' + k2s(o.han)
    + ' · quá <b>' + tuoiNo(o, ngay) + ' ngày</b>',
  so: vnd(o.phai - o.thu)
});

CT.nguonSo('TC.03', (tham, o) => {
  const ds = hdTaiNgay(tham, tham.loc);
  const dong = ds.reduce((a, x) => a.concat(x.dong.filter(d => d.mg)), []);
  if (o === 'soEm') {
    const em = {}; dong.forEach(d => { em[d.hs] = 1 });
    const ks = Object.keys(em);
    return { giaTri: ks.length, banGhiGoc: ks.map(k => ({ id: k, ten: tenHS(k), phu: (HSC(k) || {}).lop + ' · ' + ((HSC(k) || {}).dien || []).join(', '), so: vnd(dong.filter(d => d.hs === k).reduce((a, d) => a + d.mgSo, 0)) })) };
  }
  if (o === 'soLuotDien') {
    const luot = [];
    dong.forEach(d => { const h = HSC(d.hs); (h.dien || []).forEach(x => luot.push({ hs: d.hs, dien: x })) });
    const u = {}; luot.forEach(x => { u[x.hs + '|' + x.dien] = x });
    const ks = Object.keys(u);
    return { giaTri: ks.length, banGhiGoc: ks.map(k => ({ id: k, ten: tenHS(u[k].hs), phu: u[k].dien, so: '1 lượt' })) };
  }
  if (o === 'soKepTran') {
    const kt = dong.filter(d => d.mg && MG[d.mg.k].kieu === 'ngay' && d.mg.so >= d.goc);
    return { giaTri: kt.length, banGhiGoc: kt.map(veMG) };
  }
  return { giaTri: dong.reduce((a, d) => a + d.mgSo, 0), banGhiGoc: dong.map(veMG) };
});
const veMG = d => ({
  id: d.hs + '|' + d.ma + '|' + d.th, ten: tenHS(d.hs) + ' · ' + d.lop,
  phu: KD(d.ma).ten + ' · ' + d.th + ' · ' + (d.mg ? d.mg.ten : '—')
    + (d.mgBo && d.mgBo.length ? ' · bỏ: ' + d.mgBo.map(x => x.ten + ' (' + vnd(x.so) + ')').join(', ') : ''),
  so: vnd(d.mgSo) + ' / gốc ' + vnd(d.goc)
});

/* 🔒 `HDDL` (`V22`) — `HS.06` đọc HỌC SINH của `M1.1` · `M1.2` trong `DLC`, CÙNG tập
   với `M9.8` tab 4: em đang học tại ngày chốt × diện ĐÃ xác nhận tới ngày ấy.
   ⚠ Sổ hóa đơn của tab 1–3 (`HS` mục ⑤, 30 em chép từ `M7.2`) CHƯA nối `DLC`
   — nên `TC.03` còn đếm trên 30 em ấy (mục E của phiếu `V22`).              */
const HS_DLC = DLC.hocSinh.map(x => ({ ma: x.ma, ten: x.ten, lop: x.lop || '', dt: x.dt, k: x.khoi,
  vaoNgay: x.vaoNgay, roiNgay: x.roiNgay, sk: x.suKien, dien: x.dien }));
const dangHocDLC = (h, ngay) => {
  if (!(h.vaoNgay <= ngay)) return false;
  if (h.roiNgay && h.roiNgay <= ngay) return false;
  const bl = h.sk.find(s => s[0] === 'baoluu');
  if (bl && bl[1] <= ngay) { const tn = h.sk.find(s => s[0] === 'tainhap'); if (!(tn && tn[1] <= ngay)) return false }
  return true;
};
CT.nguonSo('HS.06', (tham, o) => {
  const ng = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  const dienTai = h => h.dien.filter(d => d.xacNhan && d.xacNhan <= ng).map(d => d.ten);
  const ds = HS_DLC.filter(h => trongPV(h) && dangHocDLC(h, ng) && (!tham.loc || tham.loc(h)));
  /* V21 (21/9): giá trị chính = LƯỢT DIỆN (em × diện) · số em ở ô `soEm` — định nghĩa của M9.8 (nh9 §2.11) */
  if (o === 'soEm') {
    const co = ds.filter(h => dienTai(h).length);
    return { giaTri: co.length, banGhiGoc: co.map(h => ({ id: h.ma, ten: h.ten, phu: h.lop + ' · ' + dienTai(h).join(', '), so: dienTai(h).length + ' diện' })) };
  }
  const luot = [];
  ds.forEach(h => dienTai(h).forEach(d => { if (!tham.dien || d === tham.dien) luot.push({ h, d }) }));
  return { giaTri: luot.length, banGhiGoc: luot.map(x => ({ id: x.h.ma, ten: x.h.ten, phu: x.h.lop + ' · ' + x.d, so: '1 lượt' })) };
});

CT.nguonSo('TC.04', (tham, o) => {
  const ngay = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay;
  const tu = tham.tuNgay, den = tham.denNgay > HOMNAY ? HOMNAY : tham.denNgay;
  if (o === 'thuHoChuaNop') {
    return {
      giaTri: THUHO.reduce((a, x) => a + (x.daThu - x.daNop), 0),
      banGhiGoc: THUHO.map(x => ({ id: x.ten, ten: x.ten, phu: 'đã thu ' + vnd(x.daThu) + ' · đã nộp ' + vnd(x.daNop) + ' · hạn ' + k2s(x.han), so: vnd(x.daThu - x.daNop) })),
      ghiChu: 'Là <b>nghĩa vụ</b>, không phải tiền nhàn rỗi.'
    };
  }
  if (o === 'soDuGiuHo') {
    const d = BG.filter(x => trongPV(x) && x.duGD > 0 && daPhatHanh(x.th, ngay));
    return {
      giaTri: d.reduce((a, x) => a + x.duGD, 0),
      banGhiGoc: d.map(x => ({ id: x.hs + '|' + x.ma + '|' + x.th, ten: tenHS(x.hs) + ' · ' + x.lop, phu: KD(x.ma).ten + ' · ' + x.th + ' · phát hành ' + x.slPH + ' ' + (KD(x.ma).donvi || '') + ', thực tế ' + x.slTT, so: vnd(x.duGD) })),
      ghiChu: 'Là <b>khoản phải trả</b> của trường, ⛔ không phải khoản thu.'
    };
  }
  const ds = TC.filter(x => x.tt !== 'nhap' && trongPV(x) && x.ngay >= tu && x.ngay <= den
    && (!tham.loc || tham.loc(x)));
  if (o === 'soGiaoDich') return { giaTri: ds.length, banGhiGoc: ds.map(veTC) };
  const loc = o === 'thu' ? ds.filter(x => DMTC[x.dm].chieu === 'THU')
    : o === 'chi' ? ds.filter(x => DMTC[x.dm].chieu === 'CHI') : ds;
  return { giaTri: loc.reduce((a, x) => a + x.so, 0), banGhiGoc: loc.map(veTC) };
});
const veTC = x => ({
  id: x.id, ten: DMTC[x.dm].ten,
  phu: k2s(x.ngay) + ' · ' + DT[x.dt] + ' · nhóm ' + DMTC[x.dm].nt
    + ' · ' + (x.nguon === 'bg' ? '🔗 bàn giao từ ' + x.tuMenu : '✍ nhập tay')
    + (x.maNguon ? ' · mã đối chiếu ' + x.maNguon : '') + (x.ghi ? ' · ' + x.ghi : ''),
  so: (DMTC[x.dm].chieu === 'THU' ? '+' : '−') + vnd(x.so)
});

/* nhân sự KHÔNG có lớp — vai `Class` (GVCN) không có tab 6 nên không đụng
   tới đây; vẫn viết riêng hàm phạm vi để không dùng `trongPV` với một bản
   ghi thiếu trường `lop` rồi ra tập rỗng mà không ai hiểu vì sao.          */
const nsTrongPV = x => { const d = dtHieuLuc(); return d === 'ALL' || x.dt === d };
CT.nguonSo('NS.12', (tham, o) => {
  const ds = NS.filter(x => nsTrongPV(x) && (!tham.loc || tham.loc(x)));
  const key = { cong: 'cong', phep: 'phep', om: 'om', vuotQuy: 'vuotQuy', khongPhep: 'khongPhep', dinhChinh: 'dinhChinh', muonN: 'muonN', ot: 'ot', tietKH: 'tietKH', tietGiao: 'tietGiao', tietThuc: 'tietThuc', tietVuot: 'tietVuot' };
  if (o === 'chuaGhiSo') {
    const gv = ds.filter(x => x.gv);
    const v = gv.reduce((a, x) => a + Math.max(0, x.tietGiao - x.tietThuc), 0);
    return {
      giaTri: v, banGhiGoc: gv.filter(x => x.tietGiao > x.tietThuc).map(x => ({ id: x.ma, ten: x.ten, phu: x.to + ' · giao ' + x.tietGiao + ' · thực dạy ' + x.tietThuc, so: (x.tietGiao - x.tietThuc) + ' tiết' })),
      veTrai: { ten: 'Tiết được giao', giaTri: gv.reduce((a, x) => a + x.tietGiao, 0), donVi: 'tiết' },
      vePhai: { ten: 'Tiết thực dạy đã ghi xong sổ', giaTri: gv.reduce((a, x) => a + x.tietThuc, 0), donVi: 'tiết' }
    };
  }
  const k = key[o] || 'cong';
  const co = ds.filter(x => x[k] != null);
  return {
    giaTri: co.reduce((a, x) => a + x[k], 0),
    banGhiGoc: co.filter(x => x[k] > 0).map(x => ({ id: x.ma, ten: x.ten, phu: x.cd + ' · ' + x.to + ' · ' + DT[x.dt], so: vn(x[k]) }))
  };
});

CT.nguonSo('CM.04', tham => {
  /* `V22`: kỳ KPI đầu tiên chốt ngày `DLC.moc.kyKpi[0].chot` — chốt lùi trước ngày ấy thì
     CHƯA CÓ số chốt nào, ⛔ không trả điểm của kỳ chốt sau (cùng luật với `M9.5`) */
  const ngC = tham.chotNgay > HOMNAY ? HOMNAY : tham.chotNgay, kyK = DLC.moc.kyKpi.filter(k => k.chot <= ngC);
  if (!kyK.length) return { giaTri: null, banGhiGoc: [], ghiChu: 'Tại ngày chốt ' + k2s(ngC) + ' chưa có kỳ KPI nào đã chốt — kỳ đầu tiên chốt ngày '
    + k2s(DLC.moc.kyKpi[0].chot) + '. «Chưa có số» ≠ 0 điểm.' };
  const gv = NS.filter(x => nsTrongPV(x) && x.gv && x.kpi != null && (!tham.loc || tham.loc(x)));
  if (!gv.length) return { giaTri: null, banGhiGoc: [], ghiChu: 'Chưa có điểm KPI đã chốt trong phạm vi đang xem (giáo viên mới tuyển hoặc biệt phái chưa có kỳ nào, hoặc không có giáo viên).' };
  const tb = gv.reduce((a, x) => a + x.kpi, 0) / gv.length;
  return {
    giaTri: Math.round(tb * 10) / 10,
    veTrai: { ten: 'Tổng điểm đã chốt', giaTri: gv.reduce((a, x) => a + x.kpi, 0), donVi: 'điểm' },
    vePhai: { ten: 'Số giáo viên có điểm đã chốt', giaTri: gv.length, donVi: 'người' },
    ghiChu: 'Số <b>đã chốt</b> ở M5.5 ngày ' + k2s(gv[0].kpiChot) + ' — ⛔ không tính lại ở đây (<b>R20</b>). '
      + 'Cùng định nghĩa <code>CM.04</code> với <b>M9.5</b>; menu này đọc <b>qua bảng tổng hợp M7.6</b> (<code>OL-6</code>), M9.5 đọc thẳng M5.5.',
    banGhiGoc: gv.map(x => ({ id: x.ma, ten: x.ten, phu: x.to + ' · chốt ' + k2s(x.kpiChot), so: x.kpi + ' điểm' }))
  };
});

/* ══════════════════════════════════════════════════════════════════════════
   M9.7 — phần riêng ②: KHUNG MÀN HÌNH VÀ SÁU TAB
   Phiên `BCM9-1F` (20/9/2026)

   Sáu Feature — sáu tab, đúng `N2` (một loại báo cáo = một Feature = một TAB):
     ① `m9.1.tai_chinh`              Thực hiện khoản thu          BC-TC-01 · C · K2
     ② `m9.7.cong_no`                Công nợ & tuổi nợ            BC-TC-02 · B→C · K2
     ③ `m9.7.mien_giam`              Miễn giảm & chính sách       BC-TC-03 · B→C · K2
     ④ `m9.7.dieu_chinh_hoan_tien`   Điều chỉnh & hoàn tiền       BC-TC-04 · C · K5
     ⑤ `m9.7.thu_chi_quyet_toan`     Thu chi & quyết toán năm     BC-TC-05 · C · K6
     ⑥ `m9.7.cham_cong_luong`        Chấm công & KPI cho lương    BC-TC-07 · C · K4

   🛑 KHÔNG MỘT NÚT GHI NÀO trên cả sáu tab — nhóm 📊 chỉ `X` và `XD` (`N4`).
      Ký Báo cáo Thu chi năm, ký Quyết định hoàn tiền, gán giao dịch chưa khớp,
      chốt chấm công tháng: tất cả đi qua deep-link về menu chủ.

   🛑 BỐN TAB LOẠI C (1 · 4 · 5 · 6) ⛔ KHÔNG LÀM TRÒN — mọi cột tiền dùng
      `kieu:'so'` để ra đủ số đồng. `kieu:'tien'` của khuôn nền in ra TRIỆU
      (làm tròn tới 0,1 triệu) nên CHỈ được dùng ở tab 2 và tab 3, đúng phần
      «mức 1 rút gọn» — và panel drill-down của hai tab ấy vẫn đủ số đồng.
   ══════════════════════════════════════════════════════════════════════════ */

const TAB = [
  { ma: 'thuc_hien', nhan: '1 · Thực hiện khoản thu', bc: 'BC-TC-01', loai: 'C', k: 'K2', f: 'm9.1.tai_chinh' },
  { ma: 'cong_no', nhan: '2 · Công nợ & tuổi nợ', bc: 'BC-TC-02', loai: 'B→C', k: 'K2', f: 'm9.7.cong_no' },
  { ma: 'mien_giam', nhan: '3 · Miễn giảm & chính sách', bc: 'BC-TC-03', loai: 'B→C', k: 'K2', f: 'm9.7.mien_giam' },
  { ma: 'dieu_chinh_hoan_tien', nhan: '4 · Điều chỉnh & hoàn tiền', bc: 'BC-TC-04', loai: 'C', k: 'K5', f: 'm9.7.dieu_chinh_hoan_tien' },
  { ma: 'thu_chi_quyet_toan', nhan: '5 · Thu chi & quyết toán năm', bc: 'BC-TC-05', loai: 'C', k: 'K6', f: 'm9.7.thu_chi_quyet_toan' },
  { ma: 'cham_cong_luong', nhan: '6 · Chấm công & KPI cho lương', bc: 'BC-TC-07', loai: 'C', k: 'K4', f: 'm9.7.cham_cong_luong' }
];

/* ── TAB MẶC ĐỊNH THEO VIỆC, không theo số thứ tự ────────────────────
   `KT` mở vào tab 1 (việc hằng ngày là theo dõi thực hiện khoản thu);
   `HT` mở vào tab 5 (cuối năm, có bản chờ chính ông ký). Mở vào tab đầu
   cho mọi vai là bắt một nửa người dùng bấm thêm một lần mỗi lần vào menu. */
function tabMacDinh() {
  const co = TAB.filter(t => coTab(t.ma)).map(t => t.ma);
  if (!co.length) return null;
  const uu = { HT: 'thu_chi_quyet_toan', KT: 'thuc_hien', FULL: 'thuc_hien', PHTDT: 'thuc_hien', TCNS: 'cham_cong_luong', VT: 'mien_giam', GVCN: 'cong_no', KT_HEP: 'thuc_hien' }[role];
  return uu && co.indexOf(uu) >= 0 ? uu : co[0];
}

/* ══════════════════════════ KHUNG ══════════════════════════════════════ */
function rolebar() {
  $('#rolebar').innerHTML = '<b>Vai trò:</b>' + Object.keys(ROLES).map(k =>
    '<button class="rb' + (k === role ? ' on' : '') + '" data-r="' + k + '">' + esc(ROLES[k].cd) + '</button>').join('')
    + '<span class="simw">Hôm nay (mô phỏng): <b style="color:#e2e8f0">' + kThu(HOMNAY) + ' ' + k2s(HOMNAY)
    + ' — năm học ' + NAMHOC + '</b></span>'
    + '<button class="ntg' + (ST.note ? ' on' : '') + '" id="btnNote">💡 Ghi chú thiết kế: ' + (ST.note ? 'BẬT' : 'TẮT') + '</button>';
}
function header() {
  const r = R();
  $('#ava').textContent = r.n.split(' ').slice(-2).map(x => x[0]).join('');
  const khoa = r.sc !== 'School';
  $('#hdt').innerHTML = (r.sc === 'School' ? '<option value="ALL">Tất cả điểm trường</option>' : '')
    + Object.keys(DT).map(d => '<option value="' + d + '">' + DT[d] + '</option>').join('');
  $('#hdt').value = khoa ? (r.dt || 'A') : ST.dt;
  $('#hdt').disabled = khoa;
  $('#dtlock').textContent = khoa ? '🔒 khóa theo phạm vi ' + r.sc : '';
}
function tabs() {
  const co = TAB.filter(t => coTab(t.ma));
  if (!co.length) { $('#tabs').innerHTML = ''; return }
  if (!co.find(t => t.ma === ST.tab)) ST.tab = tabMacDinh();
  $('#tabs').innerHTML = co.map(t => '<button class="tab1' + (t.ma === ST.tab ? ' on' : '')
    + '" data-t="' + t.ma + '">' + esc(t.nhan) + '<span class="b">' + t.bc + '</span></button>').join('');
}
/* KỲ CHUẨN của từng tab (`nh9` §4) — áp lúc mở tab, không đè lựa chọn người dùng */
const KY_TAB = {
  thuc_hien: 'cuoi_ky_1', cong_no: 'cuoi_ky_1', mien_giam: 'cuoi_ky_1',
  dieu_chinh_hoan_tien: 'tu_dau_nam', thu_chi_quyet_toan: 'cuoi_ky_1', cham_cong_luong: 'thang_nay'
};
const moTab = t => { ST.tab = t; PV.khoangMacDinh(KY_TAB[t]) };
const dnote = html => ST.note ? '<div class="dnote">💡 <b>Ghi chú thiết kế.</b> ' + html + '</div>' : '';
const ngayChot = () => PV.st.chotNgay > HOMNAY ? HOMNAY : PV.st.chotNgay;
const dl = (m, q) => '<button class="btn xs" data-dl="' + m + '" data-dlq="' + q + '&return=' + MENU_NAY + '">↗ ' + m + '</button>';

/* dải phạm vi — CHỈ hiện khi phạm vi THỰC SỰ cắt bớt (`PV.daiPhamVi`) */
const daiPV = (donVi, trong, tong) => PV.daiPhamVi(trong, donVi, tong, tenPhamVi());

/* cột tiền của bảng LOẠI C — đủ số đồng, ⛔ không làm tròn */
const cotTien = (khoa, ten, nguon, them) => Object.assign(
  { khoa, ten, donVi: 'đồng', kieu: 'so', nguon }, them || {});
/* cột tiền của MỨC 1 (tab 2 · 3) — rút gọn về triệu, panel vẫn đủ đồng */
const cotTrieu = (khoa, ten, nguon, them) => Object.assign(
  { khoa, ten, donVi: 'triệu đ', kieu: 'tien', nguon }, them || {});

/* ── DẢI ĐỐI CHIẾU HAI CHIỀU — bắt buộc của loại C ─────────────────────
   Một dòng `Tổng` không nói gì nếu không có thứ hai để so. Hàm này in ra
   cặp số, SỐ CHỨNG TỪ đã đối chiếu, và nếu lệch thì in con số lệch bằng
   chữ đỏ — ⛔ tuyệt đối không tự cân bằng cho đẹp.                       */
function daiKhop(ten, a, b, tenA, tenB, soCT, nut) {
  const ch = a - b;
  return '<div class="canh ' + (ch ? 'r' : 'o') + '">' + (ch ? '⚠' : '✅') + ' <b>' + esc(ten) + '</b> — '
    + esc(tenA) + ' <b>' + vnd(a) + '</b> · ' + esc(tenB) + ' <b>' + vnd(b) + '</b>'
    + (ch ? ' · <b>LỆCH ' + vnd(Math.abs(ch)) + '</b>' : ' · khớp')
    + (soCT != null ? ' <i>(' + vn(soCT) + ' chứng từ đã đối chiếu)</i>' : '')
    + (nut ? ' ' + nut : '') + '</div>';
}

/* ══════════════ TAB 1 · THỰC HIỆN KHOẢN THU ════════════════════════════
   Khuôn K2 — bảng chéo. LOẠI C: mỗi ô mở panel liệt kê HÓA ĐƠN GỐC, dòng
   `Tổng` đối chiếu hai chiều với sổ giao dịch, ⛔ không làm tròn.
   HAI KHỐI, hai loài số, hai bộ điều khiển thời gian:
     · khối A là TỒN — «tới ngày chốt gia đình đã nộp bao nhiêu»
     · khối B là PHÁT SINH — «trong khoảng ấy tiền về két bao nhiêu»
   Gộp hai khối là cộng một số tồn với một số phát sinh.                   */
function veTab1() {
  const ngay = ngayChot();
  const dsTong = HD.filter(o => hdSong(o) && daPhatHanh(o.th, ngay));
  const dsPV = dsTong.filter(trongPV);
  let h = PV.chotNgay() + PV.daiCanhBao() + daiPV('hóa đơn', dsPV.length, dsTong.length);

  /* ---------- bộ chọn đối tượng dòng ---------- */
  h += PV.chonChieu('TC.01', ['khoan_thu', 'diem_truong', 'lop', 'khoi', 'nhom_tien', 'thang']);
  const ct = PV.st.phanTo || 'khoan_thu';
  const dong = dongTheoChieu(ct, dsPV);

  const cotA = [
    cotTien('phaiThu', 'Phải thu', 'm7.2.thong_ke_thuc_hien_khoan_thu'),
    cotTien('daThu', 'Đã thu', 'm7.2.thong_ke_thuc_hien_khoan_thu'),
    cotTien('conNo', 'Còn nợ', 'm7.2.thong_ke_thuc_hien_khoan_thu', { canhBao: k => k.giaTri > 0 }),
    { khoa: null, ten: 'Tỉ lệ thu', kieu: 'tile', nguon: 'm7.2.thong_ke_thuc_hien_khoan_thu' },
    { khoa: 'soHoaDon', ten: 'Hóa đơn', kieu: 'so', nguon: 'm7.2.thong_ke_thuc_hien_khoan_thu' },
    { khoa: 'soChungTu', ten: 'Chứng từ đã đối chiếu', kieu: 'so', nguon: 'm7.2.theo_doi_xac_nhan_dong_tien' }
  ];
  h += KB.K2({
    id: 'a', tieuDe: 'A · Thực hiện khoản thu tại ngày chốt' + (PV.st.phanTo ? ' — phân tổ theo ' + CT.CHIEU[ct] : ''),
    ma: 'TC.01', chip: 'TON', moTaKy: PV.moTaChot(), tenCotDau: CT.CHIEU[ct] || 'Khoản thu',
    dong, gomNhom: ct === 'lop' && dtHieuLuc() === 'ALL',
    link: d => ({ menu: 'M7.2', ctx: 'tab=theodoi&' + d.q, nhan: 'Theo dõi và xác nhận đóng tiền' }),
    cot: cotA,
    o: (d, c) => c.khoa === null
      ? CT.doc('TC.02', PV.thamSo({ loc: d.loc }))
      : CT.doc('TC.01', PV.thamSo({ loc: d.loc }), c.khoa),
    tongRieng: c => c.khoa === null ? CT.doc('TC.02', PV.thamSo()) : null
  });

  /* ---------- đối chiếu hai chiều với SỔ GIAO DỊCH ---------- */
  const daThu = CT.doc('TC.01', PV.thamSo(), 'daThu');
  const daNhan = CT.doc('TC.01', PV.thamSo(), 'tienDaNhan');
  const soCT = CT.doc('TC.01', PV.thamSo(), 'soChungTu');
  const chuaKhop = GD.filter(x => !x.hd && trongPV(gdPV(x)) && x.ngay <= ngay);
  if (daThu.giaTri != null && daNhan.giaTri != null) {

/* dòng của bảng theo CHIỀU PHÂN TỔ — mỗi dòng mang `loc` lọc hóa đơn và
   `q` là bộ lọc mang theo deep-link (ô nào dẫn về đúng chỗ nào)           */
function dongTheoChieu(ct, ds) {
  if (ct === 'khoan_thu') {
    const co = {};
    ds.forEach(o => o.dong.forEach(d => { co[d.ma] = 1 }));
    return Object.keys(co).map(m => ({
      id: m, ten: KD(m).ten, phu: 'mã ' + m + ' · nhóm tiền ' + KD(m).nhomTien,
      loc: o => o.dong.some(d => d.ma === m), q: 'khoan=' + m
    }));
  }
  if (ct === 'diem_truong') {
    const co = {}; ds.forEach(o => { co[o.dt] = 1 });
    return Object.keys(co).sort().map(d => ({ id: d, ten: DT_DAY[d], loc: o => o.dt === d, q: 'dt=' + d }));
  }
  if (ct === 'lop') {
    const co = {}; ds.forEach(o => { co[o.lop] = 1 });
    return Object.keys(co).sort().map(l => ({
      id: l, ten: 'Lớp ' + l, nhom: DT[LOP[l].dt], phu: 'GVCN ' + LOP[l].gv,
      loc: o => o.lop === l, q: 'lop=' + l
    }));
  }
  if (ct === 'khoi') {
    const co = {}; ds.forEach(o => { co[LOP[o.lop].k] = 1 });
    return Object.keys(co).sort((a, b) => a - b).map(k => ({
      id: k, ten: 'Khối ' + k, loc: o => String(LOP[o.lop].k) === String(k), q: 'khoi=' + k
    }));
  }
  if (ct === 'nhom_tien') {
    const ten = { A: 'A · Tiền của trường', B: 'B · Tiền thu hộ', C: 'C · Tiền đang giữ hộ gia đình' };
    return ['A', 'B', 'C'].map(n => ({
      id: n, ten: ten[n], loc: o => o.dong.some(d => d.nhomTien === n), q: 'nhomtien=' + n
    }));
  }
  const co = {}; ds.forEach(o => { co[o.th] = 1 });
  return THANGS.filter(t => co[t]).map(t => ({
    id: t, ten: t, phu: 'công bố ' + k2s(NGAYCB[t]) + ' · hạn ' + k2s(HANNOP[t]),
    loc: o => o.th === t, q: 'thang=' + mm(t)
  }));
}
function dsThang(tu, den) {
  const r = []; let t = thangCua(tu); const het = thangCua(den); let n = 0;
  while (t <= het && n++ < 24) { r.push(t); const d = k2d(t + '-01'); d.setMonth(d.getMonth() + 1); t = thangCua(d2k(d)) }
  return r;
}
