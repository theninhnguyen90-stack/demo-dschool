<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1.4 Tuyển sinh đầu cấp — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:var(--bg);color:var(--ink2)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;flex:0 0 206px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:4px}
.crumb button{color:var(--brand);font-weight:600}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;overflow-x:auto}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1 .c{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .c{background:var(--brand);color:#fff}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:230px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:9px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap;align-items:center}
.sum b{color:var(--ink)}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12.5px;background:#fff;white-space:nowrap}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.scopebar{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:8px 12px;border-radius:9px;font-size:12.5px;margin-bottom:11px;display:flex;gap:8px;align-items:flex-start}

.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage{display:flex;gap:13px;align-items:flex-start}
.stage .listw{flex:1;min-width:0}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.dcard{border-bottom:1px solid var(--line);padding:13px;cursor:pointer}
.dcard:hover{background:var(--brand-soft)}
.dh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dh b{font-size:14.5px}
.dmeta{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.case{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap}
.case.A{background:#dbeafe;color:#1e40af}.case.B{background:#fce7f3;color:#9d174d}
.case.C{background:#ede9fe;color:#5b21b6}.case.D{background:#ccfbf1;color:#115e59}
.funnel{display:flex;gap:2px;margin-top:9px;height:40px}
.fseg{flex:1;border-radius:6px;padding:4px 8px;font-size:11px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.fseg b{font-size:14px;line-height:1.1}
.fseg span{color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
.fseg.f1{background:#eff6ff}.fseg.f2{background:#ede9fe}.fseg.f3{background:#ecfdf5}.fseg.f4{background:#f8fafc}
.fseg.warnbg{background:var(--amber-soft)}
.dwarn{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.wrapx{overflow-x:auto}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:#ede9fe;color:#5b21b6}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph h2{font-size:16px;font-weight:700}
.ph .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:14px 15px;max-height:calc(100vh - 230px);overflow-y:auto}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.ok{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;margin-left:5px}
.ct2{font-size:11px;color:var(--ink3);font-family:ui-monospace,monospace;background:var(--bg);padding:2px 6px;border-radius:5px;display:inline-block}
.wk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;background:#fff}
.wk:hover{border-color:var(--brand);background:var(--brand-soft)}
.wk.on{border-color:var(--brand);background:#eff6ff}
.wk .ic{font-size:19px;flex:0 0 26px}
.wk .bd{flex:1;min-width:0}
.wk .bd b{display:block;font-size:13.5px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:13px}
.kbox{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.kbox .v{font-size:22px;font-weight:800}
.kbox .l{font-size:11.5px;color:var(--ink3)}

/* phan lop — keo tha */
.plwrap{display:grid;grid-template-columns:340px 1fr;gap:13px;align-items:start}
@media(max-width:980px){.plwrap{grid-template-columns:1fr}}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qh{padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.qi{padding:8px 11px;border-bottom:1px solid #f1f5f9;cursor:grab;font-size:12.5px}
.qi:hover{background:var(--brand-soft)}
.qi.drag{opacity:.4}
.qi .nm{font-weight:600}
.qi .mt{font-size:11px;color:var(--ink3);display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lbox{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface);min-height:150px}
.lbox.over{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.lbh{padding:8px 11px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;display:flex;gap:7px;align-items:center}
.lbb{padding:6px;min-height:110px}
.lbb .drop{color:var(--ink3);text-align:center;padding:26px 6px;font-size:11.5px;border:1.5px dashed var(--line2);border-radius:8px}
.si{background:var(--bg);border-radius:7px;padding:5px 8px;margin-bottom:4px;font-size:12px;display:flex;gap:6px;align-items:center;cursor:grab}
.si .x{margin-left:auto;color:var(--ink3);font-size:13px}
.si .x:hover{color:var(--red)}
.bal{font-size:11px;color:var(--ink3);padding:5px 11px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
.over-ss{color:var(--red);font-weight:700}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:900px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column}
.modal.sm{width:640px}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.cgrp{border:1px solid var(--line);border-radius:9px;margin-bottom:9px;overflow:hidden}
.cgh{padding:7px 11px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
.cgb{padding:5px 11px 9px}
.cko{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12.5px;cursor:pointer}
.cko input{width:15px;height:15px;margin-top:2px;flex:0 0 15px}
.tl{border-left:2px solid var(--line);margin-left:7px;padding-left:15px}
.tli{position:relative;padding:8px 0;font-size:12.5px}
.tli::before{content:"";position:absolute;left:-21px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.tli.w::before{background:var(--amber)}.tli.r::before{background:var(--red)}
.tli b{display:block;font-weight:600}
.tli .mm{color:var(--ink3);font-size:11.5px}
.gtrow{display:grid;grid-template-columns:1.6fr auto 1fr;gap:10px;align-items:center;padding:9px 11px;font-size:12.5px}
.gtrow+.gtrow{border-top:1px solid #f1f5f9}
.gtrow.miss{background:var(--red-soft)}
.gtrow.wait{background:var(--amber-soft)}
.gtrow.ok{background:var(--green-soft)}
.gtrow .nm{font-weight:600}
.gtrow .sub{font-size:11px;color:var(--ink3);font-weight:400}
.gtrow .act{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.liet{color:var(--red);font-weight:800}
td.liet-cell{background:var(--red-soft)}
tr.cut{border-top:2px dashed var(--red)}
.cutlab{font-size:10px;font-weight:800;color:var(--red);background:var(--red-soft);padding:2px 8px;border-radius:5px}
.pkold{color:var(--ink3);text-decoration:line-through;font-size:11px}
.pknew{color:var(--violet);font-weight:800}
.pkbadge{font-size:9px;font-weight:800;background:#ede9fe;color:#5b21b6;padding:1px 5px;border-radius:4px;margin-left:3px}
.dinp{border:1px solid var(--line2);border-radius:6px;padding:3px 5px;width:56px;font-size:12.5px;text-align:center}
.dinp:focus{border-color:var(--brand);outline:none}
.dkbar{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:11px;padding:11px 13px;margin-bottom:12px}
.dkrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.dkchip{background:#fff;border:1px solid #ddd6fe;border-radius:8px;padding:4px 10px;font-size:12px}
.dkchip b{color:#5b21b6}
.prev{background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:11px}
.prev .big{font-size:26px;font-weight:800;line-height:1.1}
.prevrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px}
.inpage{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:22px 26px;font-size:12px;line-height:1.65;color:#0f172a}
.inpage h3{text-align:center;font-size:14px;font-weight:800;margin:0}
.inpage .qh2{text-align:center;font-size:11.5px;margin-bottom:14px}
.inpage table{font-size:11px}
.inpage th,.inpage td{padding:4px 6px}
.sig2{display:flex;justify-content:space-between;margin-top:22px;font-size:11.5px;text-align:center}
.lockbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 13px;border-radius:10px;font-size:12.5px;margin-bottom:12px}
.lockbar.nhap{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.lockbar.chot{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3}
.lockbar.congbo{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.numi{border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:12.5px;width:64px}
.gtsum{display:flex;gap:7px;flex-wrap:wrap;padding:9px 11px;border-top:1px solid var(--line);background:#f8fafc;font-size:11.5px;align-items:center}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:36px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','6'],['M0.3','Thông báo'],['M0.4','Trang cá nhân']]],
 ['hs','👥 Học sinh',[['M1.1','Hồ sơ học sinh'],['M1.2','Đối tượng ưu tiên'],['M1.3','Học bạ điện tử'],
   ['M1.4','Tuyển sinh đầu cấp','x'],['M1.5','Chuyển trường'],['M1.6','Bảo lưu / Tái nhập'],
   ['M1.7','Lớp học & Chuyển lớp']]],
 ['tc','💰 Tài chính',[['M7.1','Danh mục khoản thu'],['M7.2','Theo dõi thực hiện khoản thu'],['M7.3','Điều chỉnh & Hoàn tiền'],['M7.4','Chính sách miễn giảm']]],
 ['ch','⚙️ Cấu hình',[['M10.1','Cấu hình năm học'],['M10.6','Trung tâm cấu hình']]],
];
/* sc: branch | school | own  —  own = chi thay dot co ten minh trong Hoi dong TS */

/* ===== TRANG THAI HO SO LA DAN XUAT, KHONG AI BAM TAY =====
   Nguon su that duy nhat = checklist giay to theo cau hinh cua dot.
   Co file != file hop le -> tach hai tang: MAY dem file, NGUOI doi chieu. */
function gtOf(d){return d.gt||GT_MAC_DINH()}
function hsTT(h,d){
 if(h.tt&&['huy','tuchoi','truot','khong'].includes(h.tt))return [h.tt,HSTT[h.tt][0],HSTT[h.tt][1],{}];
 const req=gtOf(d).filter(g=>g.mem&&g.bb);
 const F=h.files||{}, Y=h.yc||{};
 const thieu=req.filter(g=>!F[g.ten]).map(g=>g.ten);
 const ycdoi=Object.keys(Y);
 const chua=req.filter(g=>F[g.ten]&&!F[g.ten].dc).map(g=>g.ten);
 const info={req:req.length,co:req.length-thieu.length,thieu,ycdoi,chua};
 /* mot ho so co the vua thieu tep vua bi yeu cau doi tep — nhan phai noi du ca hai */
 if(ycdoi.length||thieu.length){const p=[];
  if(thieu.length)p.push('Thiếu '+thieu.length+'/'+req.length+' giấy tờ');
  if(ycdoi.length)p.push('nộp lại '+ycdoi.length);
  return ['bosung',p.join(' · '),'r',info]}
 if(chua.length)return ['cho','Chờ đối chiếu '+chua.length+' giấy tờ','w',info];
 return ['du','✓ Đủ điều kiện nhập học','o',info]}
function cungOf(h,d){
 const req=gtOf(d).filter(g=>g.cung);
 const C=h.cung||{};
 return {req:req.length,co:req.filter(g=>C[g.ten]).length,thieu:req.filter(g=>!C[g.ten]).map(g=>g.ten),ds:req}}

function subDuyet(d){
 const H=d.heSo||{}, ng=d.diemLiet||0;
 let L=xepHang(d).filter(x=>khopTim(x.ma,x.n));
 const cut=70;  /* vach cat theo chi tieu — mau hien quanh hang 65-78 */
 /* --- bo loc --- */
 if(fD.min!=='')L=L.filter(x=>tongDiem(x,d)>=+fD.min);
 if(fD.max!=='')L=L.filter(x=>tongDiem(x,d)<=+fD.max);
 if(fD.liet==='Không có điểm liệt')L=L.filter(x=>!monLiet(x,d).length);
 else if(fD.liet==='Chỉ hồ sơ có điểm liệt')L=L.filter(x=>monLiet(x,d).length);
 if(fD.uu==='Có diện ưu tiên')L=L.filter(x=>x.uu);
 else if(fD.uu==='Không có diện ưu tiên')L=L.filter(x=>!x.uu);
 if(fD.vt==='Trong chỉ tiêu')L=L.filter(x=>x.hang<=cut);
 else if(fD.vt==='Ngoài chỉ tiêu')L=L.filter(x=>x.hang>cut);
 if(fD.tt!=='Tất cả'){const m={'Chờ duyệt':'cho','Đã duyệt trúng tuyển':'trung','Không trúng tuyển':'truot'};
  L=L.filter(x=>x.tt===m[fD.tt])}
 const all=xepHang(d);
 const nTrung=all.filter(x=>x.tt==='trung').length, nLiet=all.filter(x=>monLiet(x,d).length).length;
 const conLai=Math.max(0,d.ct-nTrung);
 const pkCho=PK.filter(x=>x.tt!=='xong').length;
 if(BD.tt==='nhap')return `${caseNote(d)}
  <div class="listw"><div class="empty">
   <div style="font-size:32px;margin-bottom:10px">🔒</div>

   <div style="max-width:560px;margin:0 auto;font-size:12.5px;line-height:1.7">
    Bảng điểm đang ở trạng thái <b>Đang nhập điểm</b> — điểm còn sửa được.<br><br>
    <b>Duyệt trúng tuyển trên một bảng điểm chưa chốt là ra quyết định trên dữ liệu có thể đổi sau lưng.</b>
    Sang tab <b>Kết quả thi</b>, nhập và soát điểm xong thì bấm <b>✓ Duyệt đã nhập xong</b> để mở khóa tab này.
    <div style="margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap">
     <button class="btn p sm" data-st="diem">→ Sang tab Kết quả thi</button>
     ${R().duyetDiem?`<button class="btn sm" data-x="chotso">✓ Duyệt đã nhập xong ngay</button>`:''}</div>
   </div></div></div>`;
 return `${caseNote(d)}
  ${pkCho?`<div class="danger"><b>⚠ Còn ${pkCho} yêu cầu phúc khảo chưa có kết quả.</b>
    Kết quả phúc khảo <b>đổi tổng điểm và đổi thứ hạng toàn đợt</b> — duyệt bây giờ thì một em phúc khảo tăng điểm
    có thể <b>đẩy một em đã duyệt ra khỏi chỉ tiêu</b>, buộc phải hủy quyết định đã ký.<br>
    Nên xử lý xong phúc khảo rồi mới duyệt.
    <div style="margin-top:9px"><button class="btn xs" data-st="pk">→ Sang tab Phúc khảo</button></div></div>`:''}
  <div class="kpi">
   <div class="kbox"><div class="v">${d.ct}</div><div class="l">Chỉ tiêu</div></div>
   <div class="kbox"><div class="v" style="color:var(--green)">${nTrung}</div><div class="l">Đã duyệt trúng tuyển</div></div>
   <div class="kbox"><div class="v">${conLai}</div><div class="l">Suất còn lại</div></div>
   <div class="kbox"><div class="v" style="color:var(--red)">${nLiet}</div><div class="l">Hồ sơ có điểm liệt</div></div></div>
  <div class="ro"><b>Tab này chỉ đọc kết quả thi, không sửa điểm.</b> Bảng điểm đã
   <b>${BDN[BD.tt][0].toLowerCase()}</b>${BD.chotBoi?` bởi ${BD.chotBoi} ngày ${BD.chotNgay}`:''} —
   mọi thay đổi điểm sau đó chỉ qua <b>tab Phúc khảo</b>.</div>

  <div class="dkbar">
   <div class="dkrow"><b style="font-size:13.5px">🎯 Điều kiện trúng tuyển</b>
    ${DKTT.apDung?`<span class="st2 o">Đã áp dụng</span>
      <span style="color:var(--ink3);font-size:11.5px">${DKTT.boi} · ${DKTT.ngay}</span>`
     :`<span class="st2 w">Chưa cấu hình</span>`}
    <span style="flex:1"></span>
    ${R().duyet?`<button class="btn sm p" data-x="cfgdk">${DKTT.apDung?'⚙ Sửa điều kiện và áp lại':'⚙ Cấu hình điều kiện trúng tuyển'}</button>`
     :`<span style="font-size:11.5px;color:var(--ink3)">Chỉ PHT Điểm trường cấu hình điều kiện</span>`}
    ${DKTT.apDung?`<button class="btn sm" data-x="inkq">🖨 In kết quả duyệt</button>`:''}</div>
   ${DKTT.apDung?`<div class="dkrow" style="margin-top:9px">
     <span class="dkchip">Điểm chuẩn <b>${DKTT.tong!==null&&DKTT.tong!==''?(+DKTT.tong).toFixed(2):'không đặt'}</b></span>
     ${MONTHI.map(m=>DKTT.mon[m]!==null&&DKTT.mon[m]!==''?`<span class="dkchip">${m} tối thiểu <b>${(+DKTT.mon[m]).toFixed(2)}</b></span>`:'').join('')}
     <span class="dkchip">Điểm liệt <b>&lt; ${ng.toFixed(1)}</b> — loại trực tiếp</span></div>`
    :`<div style="font-size:12px;color:var(--ink2);margin-top:7px">
      <b>Đây là mục cấu hình riêng, KHÔNG nằm trong Cấu hình đợt tuyển sinh.</b>
      Đợt tuyển sinh có trước và chỉ đặt chỉ tiêu; điều kiện trúng tuyển chỉ quyết được <b>sau khi có kết quả thi</b>,
      dựa trên phổ điểm thực tế so với chỉ tiêu.<br>
      Cấu hình <b>điểm chuẩn</b> và <b>điểm tối thiểu từng môn</b>, hệ thống <b>gợi ý ngay số học sinh thỏa mãn</b>
      trước khi chốt. Áp dụng xong thì mọi em đủ điều kiện chuyển sang <b>Trúng tuyển</b> trong một lượt —
      không phải bấm từng em.</div>`}</div>

  ${!R().duyet?`<div class="warn"><b>Vai trò ${R().n} không có quyền duyệt trúng tuyển.</b>

  <div class="danger"><b>⛔ Điểm liệt loại trực tiếp, bất kể tổng điểm.</b>

   Vì thế bảng hiện <b>đủ điểm từng môn</b> và tô đỏ môn liệt.</div>

  <div class="bar">
   ${oTim('Họ tên thí sinh, SĐT…')}

   <select class="fs" id="duu">${['Tất cả','Có diện ưu tiên','Không có diện ưu tiên'].map(o=>`<option${fD.uu===o?' selected':''}>${o}</option>`).join('')}</select>
   <select class="fs" id="dvt">${['Tất cả','Trong chỉ tiêu','Ngoài chỉ tiêu'].map(o=>`<option${fD.vt===o?' selected':''}>${o}</option>`).join('')}</select>
   <select class="fs" id="dtt">${['Tất cả','Chờ duyệt','Đã duyệt trúng tuyển','Không trúng tuyển'].map(o=>`<option${fD.tt===o?' selected':''}>${o}</option>`).join('')}</select>
   ${fD.min||fD.max||fD.liet!=='Tất cả'||fD.uu!=='Tất cả'||fD.vt!=='Tất cả'||fD.tt!=='Tất cả'
     ?'<button class="btn sm" data-x="dclear">✕ Xóa lọc</button>':''}
   <div class="sum"><span>Hiện <b>${L.length}</b>/${all.length}</span></div></div>

     const lt=monLiet(x,d), tong=tongDiem(x,d);

     return `${catHere?`<tr><td colspan="${5+MONTHI.length}" style="padding:5px 9px;background:var(--red-soft)">
       <span class="cutlab">─── VẠCH CẮT — hết ${cut} suất theo chỉ tiêu ───</span></td></tr>`:''}

       ${lt.length?`<br><span style="font-size:11px;color:var(--red)">liệt ${lt.join(', ')}</span>`:''}</td>
      <td style="text-align:right;white-space:nowrap">
       ${R().duyet&&x.tt==='cho'?`<button class="btn xs g" data-x="duyet1" data-ma="${x.ma}">✓ Duyệt</button>
         <button class="btn xs d" data-x="truot1" data-ma="${x.ma}">✕</button>`

 let right='';
 if(curWk){const i=curWk.indexOf('::'),k=curWk.slice(0,i),id=curWk.slice(i+2);

function panelViec(k,d){

  kypl:'Ký công bố phân lớp',bosung:'Học sinh quá hạn xác nhận'}[k];
 let body='';
 if(k==='duyet')body=subDuyet(d);
 else if(k==='kycb')body=subKQ(d);
 else if(k==='bosung')body=`<div class="danger"><b>${d.quahan} học sinh quá hạn xác nhận.</b>
    <b>Bắt buộc có vết liên hệ</b> trước khi hủy suất.</div>
   <table><tr><th>Học sinh</th><th>Vết liên hệ</th><th></th></tr>
   ${XN.filter(x=>x.tt==='quahan').map(x=>`<tr><td><b>${x.n}</b></td>

    <td style="text-align:right"><button class="btn xs d" data-x="huysuat" data-ma="${x.ma}">✕ Hủy suất</button></td></tr>`).join('')}</table>
   <div style="margin-top:12px"><button class="btn p" data-x="goibosung">📞 Gọi bổ sung — ${d.tt2-d.nh} suất trống</button></div>`;
 else body=`<div class="kpi"><div class="kbox"><div class="v">${d.nh}</div><div class="l">Đã nhập học</div></div>
    <div class="kbox"><div class="v">${d.pl}</div><div class="l">Đã phân lớp</div></div>

   ${d.choxl?`<div class="warn">Còn <b>${d.choxl}</b> học sinh chưa phân lớp — <b>đợt không đóng được</b>.</div>`:''}

    <button class="btn p" data-x="${k==='kypl'?'kypl':'duyetpl'}">${k==='kypl'?'🖊 Ký công bố phân lớp':'✓ Duyệt danh sách'}</button>

 return `<div class="ph"><div><h2>${H}</h2>
   <div class="m"><span class="pill">${d.ten}</span><span class="pill">${d.dt}</span>

  $('#tabs').innerHTML='';

    Chưa mở cổng nhận hồ sơ nên <b>chưa có phễu làm việc</b> — mọi cấu hình còn <b>sửa tự do</b>.

    Sau khi triển khai, <b>Case tuyển sinh, chỉ tiêu và tiêu chí xét bị khóa</b>.</div>` : dotWorkspace();
  return}
 $('#head').innerHTML=`<div class="tophd"><h1>Tuyển sinh đầu cấp</h1></div>`;
 const T=r.chiPhi?['dot','tk']:['dot','lop','tk'];
 if(viec().length)T.push('duyet');
 if(!T.includes(tab))tab=T[0];

 $('#tabs').innerHTML=T.map(t=>`<button class="tab1 ${tab===t?'on':''}" data-t1="${t}">${TABN[t]}

 $('#content').innerHTML= tab==='dot'?tabDot():tab==='lop'?tabLop():tab==='tk'?tabTK():tabDuyet2();

function modal(t,body,btns){$('#mh').innerHTML=t;$('#mb').innerHTML=body;

  el.onclick=()=>{$('#mask').classList.remove('on');if(fn)fn()};$('#mf').appendChild(el)});
 $('#mask').classList.add('on')}

let dragMa=null,dragFrom=null;
function bindDnD(){
 document.querySelectorAll('[data-q]').forEach(el=>{
  el.addEventListener('dragstart',e=>{dragMa=el.dataset.q;dragFrom=el.dataset.from||null;
   el.classList.add('drag');e.dataTransfer.effectAllowed='move'});
  el.addEventListener('dragend',()=>el.classList.remove('drag'));});

function moveTo(ma,from,to){
 const key=plKhoi+'|'+plHe, L=LOPMOI[key], Q=QUEUE[key];
 let hsObj=null;
 if(from){const f=L.find(l=>l.id===from); const i=f.hs.findIndex(h=>h.ma===ma);
  if(i>=0){hsObj=f.hs.splice(i,1)[0]}}
 else{const i=Q.findIndex(h=>h.ma===ma); if(i>=0)hsObj=Q.splice(i,1)[0]}
 if(!hsObj)return;
 const t=L.find(l=>l.id===to);
 if(t.hs.length>=t.max){toast('Lớp '+to+' đã đủ sĩ số tối đa '+t.max+' — cần Hiệu trưởng duyệt ngoại lệ');
  (from?L.find(l=>l.id===from).hs:Q).push(hsObj);render();return}
 t.hs.push(hsObj);render()}

function moveBack(ma,lop){
 const key=plKhoi+'|'+plHe, L=LOPMOI[key], Q=QUEUE[key];
 const l=L.find(x=>x.id===lop); const i=l.hs.findIndex(h=>h.ma===ma);
 if(i>=0){Q.push(l.hs.splice(i,1)[0]);Q.sort((a,b)=>a.ma.localeCompare(b.ma));render()}}

function autoPhan(){
 const key=plKhoi+'|'+plHe, L=LOPMOI[key], Q=QUEUE[key];
 if(!Q.length){toast('Hàng đợi trống');return}
 const src=Q.slice();
 if(RULE.hl)src.sort((a,b)=>b.hl-a.hl);
 /* rai rang cua: cân doi hoc luc + gioi tinh + HS dac biet */
 const dat=[],db=src.filter(h=>h.db),thuong=src.filter(h=>!h.db);
 /* rai kieu ran bo (snake) rieng tung gioi -> can doi ca si so lan gioi tinh lan hoc luc */
 const snake=(arr,off)=>arr.forEach((h,i)=>{
  const vong=Math.floor(i/L.length), pos=i%L.length;
  dat.push([h, vong%2===0 ? pos : L.length-1-pos])});
 if(RULE.gt){snake(thuong.filter(h=>h.gt==='Nam'));snake(thuong.filter(h=>h.gt!=='Nam').reverse())}
 else snake(thuong);
 dat.forEach(([h,idx])=>{let t=L[idx];
  if(t.hs.length>=t.max){t=L.find(l=>l.hs.length<l.max)||t}
  t.hs.push(h)});
 /* HS co nhu cau dac biet xep SAU CUNG vao lop it nguoi nhat -> rai deu that su */
 db.forEach(h=>{const t=L.reduce((a,b)=>b.hs.length<a.hs.length?b:a);t.hs.push(h)});
 QUEUE[key]=[];
 toast(`Đã gợi ý phân ${src.length} học sinh theo tiêu chí: ${[RULE.gt&&'cân đối giới tính',RULE.hl&&'cân đối học lực',RULE.db&&'rải đều HS đặc biệt',RULE.ace==='cung'?'anh chị em cùng lớp':RULE.ace==='tach'?'anh chị em tách lớp':'theo nguyện vọng gia đình'].filter(Boolean).join(' · ')} — vẫn điều chỉnh tay được`);
 render()}
