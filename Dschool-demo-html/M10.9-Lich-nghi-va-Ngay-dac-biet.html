<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10.9 Lịch nghỉ & Ngày đặc biệt — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink3);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--amber);white-space:nowrap}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:222px;flex:0 0 222px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:9px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:18px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:7px 0 0;flex-wrap:wrap;align-items:flex-end}
.tab1{padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tabtools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:5px}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:7px 12px;font-size:12px;color:var(--ink2);margin-top:7px;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber);background:var(--amber-soft)}
.scope.vi{border-left-color:var(--violet)}

.inp{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:#fff;width:150px}
.qf{border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;background:#fff;white-space:nowrap}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.qf.le.on{background:var(--red);border-color:var(--red)}
.qf.kh.on{background:var(--amber);border-color:var(--amber)}
.qf.dx.on{background:#991b1b;border-color:#991b1b}
.qf.sk.on{background:var(--violet);border-color:var(--violet)}

.stage{display:flex;gap:13px;align-items:flex-start;margin-top:8px}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1300px){.stage.open .listw{display:none}}

.grow{display:flex;align-items:center;gap:9px;padding:5px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hdrow{display:grid;gap:9px;padding:6px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.gone{opacity:.5}
.gd{grid-template-columns:1.7fr 1.15fr 1.15fr .85fr 1fr 1.5fr}
.stage.open .gd{grid-template-columns:1.7fr 1.15fr}
.stage.open .kx{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:var(--violet-soft);color:#5b21b6}
.st2.dx{background:#7f1d1d;color:#fff}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.hq{display:inline-flex;gap:4px;font-size:11px}
.hq i{font-style:normal;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#fcfdfe;white-space:nowrap}
.hq i.no{background:var(--red-soft);border-color:#fecaca;color:#991b1b}
.hq i.yes{background:var(--green-soft);border-color:#a7f3d0;color:#065f46}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.empty{padding:34px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:15px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ptabs{display:flex;gap:4px;padding:0 15px;border-bottom:1px solid var(--line);background:#fcfdfe}
.ptab{padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand)}
.pbody{padding:13px 15px;max-height:calc(100vh - 250px);overflow-y:auto}
.f{display:grid;grid-template-columns:150px 1fr;gap:11px;align-items:center;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sech{font-size:13px;font-weight:700;margin:15px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.co{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.co.lock{background:#f8fafc}
.co .h{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;flex-wrap:wrap}
.co .h .sw{margin-left:auto;display:flex;gap:5px}
.swb{border:1px solid var(--line2);border-radius:8px;padding:3px 12px;font-size:12px;background:#fff;font-weight:600}
.swb.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.swb.on.no{background:var(--red);border-color:var(--red)}
.swb:disabled{opacity:.5;cursor:not-allowed}
.co .eff{margin-top:6px;font-size:11.5px;color:var(--ink2);line-height:1.75}
.co .eff b{color:var(--ink)}
.co .eff div{padding-left:14px;text-indent:-14px}

.imp{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.impr{display:grid;grid-template-columns:1fr auto 90px;gap:10px;padding:7px 12px;border-top:1px solid var(--line);font-size:12.5px;align-items:center}
.impr:first-child{border-top:none;background:#f8fafc;font-weight:700;font-size:11px;text-transform:uppercase;color:var(--ink3);letter-spacing:.04em}
.impr .num{font-weight:700;font-size:14px}
.impr.al{background:var(--amber-soft)}
.impr.al .num{color:var(--amber)}

.lbl{font-size:12px;color:var(--ink2);display:block;margin:9px 0 3px}
.lbl b{color:var(--red)}
.din{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:13px;background:#fff;width:100%}
.din.bad{border-color:var(--red);background:var(--red-soft)}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;min-height:52px;resize:vertical;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:8px 12px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35;flex:1;min-width:170px}
.sgb b{display:block}
.sgb span{font-size:10.5px;color:var(--ink3)}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.sgb.on span{color:var(--brand)}
.sgb:disabled{opacity:.45;cursor:not-allowed}
.chkl{display:flex;gap:5px;flex-wrap:wrap}
.chkb{border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12px;background:#fff}
.chkb.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}

/* Lich nam hoc */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px;margin-top:11px}
.mon{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.mon h4{font-size:12.5px;font-weight:700;margin-bottom:6px;display:flex;align-items:center}
.mon h4 span{margin-left:auto;font-weight:400;font-size:10.5px;color:var(--ink3)}
.dw{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:9.5px;color:var(--ink3);text-align:center;margin-bottom:2px;font-weight:700}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dy{aspect-ratio:1;display:grid;place-items:center;font-size:10.5px;border-radius:4px;background:#fff;border:1px solid transparent;position:relative}
.dy.out{color:#e2e8f0}
.dy.cn{background:#f8fafc;color:var(--ink3)}
.dy.le{background:#fecaca;color:#7f1d1d;font-weight:700}
.dy.kh{background:#fed7aa;color:#7c2d12;font-weight:700}
.dy.dx{background:#7f1d1d;color:#fff;font-weight:700}
.dy.sk{background:#ddd6fe;color:#4c1d95;font-weight:700}
.dy.part::after{content:"";position:absolute;top:0;right:0;border-width:0 7px 7px 0;border-style:solid;border-color:transparent #7f1d1d transparent transparent}
.dy.moc{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.dy.hnay{outline:2px solid var(--violet);outline-offset:1px}
.leg{display:flex;gap:11px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:10px;align-items:center}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg em{width:13px;height:13px;border-radius:3px;font-style:normal;display:inline-block;border:1px solid var(--line)}

/* T3 */
.mtxw{overflow-x:auto;border-radius:11px;border:1px solid var(--line);background:#fff;margin-top:10px}
.mtx{width:100%;border-collapse:collapse;font-size:12.5px}
.mtx th,.mtx td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:center;white-space:nowrap}
.mtx th{background:#f8fafc;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3);font-weight:700;position:sticky;top:0}
.mtx td.nm{text-align:left;font-weight:600}
.mtx tr.gr td{background:#f8fafc;font-weight:700;text-align:left;font-size:12px}
.mtx td.bad{color:var(--red);font-weight:700;background:var(--red-soft)}
.mtx td.ok{color:var(--green);font-weight:700}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:880px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.blk:last-child{border-bottom:none}
.blk .ic{flex:0 0 18px;font-size:13px}
.blk .tx{flex:1}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.rb.dt.on{background:#fbbf24;color:#0f172a;border-color:#fbbf24}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.g::before{background:var(--green)}.logi.r::before{background:var(--red)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}
.dnote{font-size:11px;color:var(--violet);background:var(--violet-soft);border:1px dashed #ddd6fe;border-radius:7px;padding:6px 9px;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="HT">Hiệu trưởng</button>
  <button class="rb" data-r="PHT_DT">PHT Đào tạo</button>
  <button class="rb" data-r="VT">Văn thư</button>
  <button class="rb" data-r="GVCN">GVCN</button>
  <button class="rb dt" id="btnNote">💡 Ghi chú thiết kế</button>
  <span class="note">Một đợt nghỉ chạm tới <b>tiết học</b>, <b>suất ăn bán trú</b> và <b>chấm công</b> — ba cờ hệ quả khai tường minh</span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027 · Đang hoạt động</option><option>Năm học 2025-2026 · Đã kết thúc</option></select>
  <select class="sel" id="hdt"></select>
  <span class="lockico" id="dtlock"></span>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot">2</span></button>
  <div class="avatar" id="ava">DQ</div>
</header>

<div class="wrap">
  <main class="main"><div id="content"></div></main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===== M10.9 LICH NGHI & NGAY DAC BIET — demo tai THU HAI 07/09/2026 ===== */
const $=s=>document.querySelector(s);
const HOMNAY=new Date(2026,8,7);
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>d?p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear():'—';
const d2sn=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1);
const D=(dd,mm,yy)=>new Date(yy,mm-1,dd);
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const key=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const THU=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4600)}
function closeModal(){$('#mask').classList.remove('on')}

/* ===== PHAM VI ===== */
function lopTrongPham(d){
 if(d.pham==='tt')return LOP.slice();
 if(d.pham==='dt')return LOP.filter(l=>d.ids.indexOf(l.dt)>=0);
 if(d.pham==='khoi')return LOP.filter(l=>d.ids.indexOf(String(l.khoi))>=0);
 return LOP.filter(l=>d.ids.indexOf(l.id)>=0);
}
function phamTxt(d){
 if(d.pham==='tt')return 'Toàn trường';
 if(d.pham==='dt')return d.ids.map(dtTen).join(', ');
 if(d.pham==='khoi')return 'Khối '+d.ids.join(', ');
 return d.ids.map(i=>{const l=LOP.filter(x=>x.id===i)[0];return l?l.ten:i}).join(', ');
}
/* so ngay HOC (theo NGAYHOC) trong khoang */
function ngayHocTrong(tu,den){
 let n=0,c=new Date(tu);
 while(key(c)<=key(den)){if(NGAYHOC.indexOf(c.getDay())>=0)n++;c.setDate(c.getDate()+1)}
 return n;
}
function anhHuong(d){
 const lops=lopTrongPham(d);
 const nd=ngayHocTrong(d.tu,d.den);
 const hs=lops.reduce((s,l)=>s+l.ss,0);
 const tiet=nd*lops.length*TIET_NGAY;
 const suat=d.hsDen?0:Math.round(nd*hs*TILE_BANTRU);
 const ns=d.nsLam?0:nd;
 return {lop:lops.length,dt:new Set(lops.map(l=>l.dt)).size,hs:hs,ngay:nd,tiet:tiet,suat:suat,ngayCong:ns,
   thuCong:d.pham==='tt'&&nd>3?7:(nd>1?2:0)};
}

/* ===== NGAY NGHI THEO LOP (cho T2, T3) ===== */
function dotApDung(lop){return DOT.filter(d=>!d.huy&&lopTrongPham(d).indexOf(lop)>=0)}
/* S[key] = {loai, full} — full = MOI lop trong pham vi dang xem deu nghi;
   khong full = chi MOT PHAN nghi (vd bao chi ngap 2 diem truong) */
function ngayNghiSet(lops){
 const S={};
 DOT.filter(d=>!d.huy).forEach(function(d){
  const L=lopTrongPham(d);
  const trong=lops.filter(l=>L.indexOf(l)>=0);
  if(!trong.length)return;
  const full=trong.length===lops.length;
  let c=new Date(d.tu);
  while(key(c)<=key(d.den)){
   const k=key(c);
   if(!S[k]||(full&&!S[k].full))S[k]={loai:d.loai,full:full};
   c.setDate(c.getDate()+1)}
 });
 return S;
}
function thucHoc(lop,tu,den){
 const S=ngayNghiSet([lop]);
 let n=0,c=new Date(tu);
 while(key(c)<=key(den)){
  if(NGAYHOC.indexOf(c.getDay())>=0 && !S[key(c)])n++;
  c.setDate(c.getDate()+1)}
 return n;
}

  '<span><em style="background:#ddd6fe"></em>Sự kiện (HS vẫn đến)</span>'+
  '<span><em style="background:#fff;position:relative;overflow:hidden"><i style="position:absolute;top:0;right:0;border-width:0 7px 7px 0;border-style:solid;border-color:transparent #7f1d1d transparent transparent"></i></em>Chỉ MỘT PHẦN phạm vi nghỉ</span>'+
  '<span><em style="border-color:var(--brand);border-width:2px"></em>Mốc năm học (từ '+dlink('M10.1')+')</span></div>';
 return sel+leg+'<div class="cal">'+cells+'</div>'+

   'Thử chọn <b>ĐT Tân Hội</b> — ba ngày sửa hệ thống điện 07–09/9 hiện ra, mà xem ở mức Toàn trường thì không thấy. '+

function oneMonth(m,S,MOC){
 const y=m.getFullYear(),mo=m.getMonth();
 const first=new Date(y,mo,1),last=new Date(y,mo+1,0);
 let off=(first.getDay()+6)%7; /* T2 dau tuan */
 let html='';
 for(let i=0;i<off;i++)html+='<div class="dy out"></div>';
 let hoc=0,nghi=0;
 for(let dd=1;dd<=last.getDate();dd++){
  const c=new Date(y,mo,dd),k=key(c);
  const trongNam=k>=key(NH.tuu)&&k<=key(NH.hk2kt);
  let cls='';
  if(!trongNam)cls='out';
  else if(S[k]&&S[k].full){cls=S[k].loai;if(NGAYHOC.indexOf(c.getDay())>=0)nghi++}
  else if(NGAYHOC.indexOf(c.getDay())<0)cls='cn';
  else {hoc++;if(S[k])cls='part'}
  if(MOC[k])cls+=' moc';
  if(k===key(HOMNAY))cls+=' hnay';
  html+='<div class="dy '+cls+'" title="'+THU[c.getDay()]+' '+d2s(c)+(MOC[k]?' — '+MOC[k]:'')+'">'+dd+'</div>';
 }
 return '<div class="mon"><h4>Tháng '+(mo+1)+'/'+y+'<span>thực học '+hoc+' · nghỉ '+nghi+'</span></h4>'+
  '<div class="dw"><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div></div>'+
  '<div class="dg">'+html+'</div></div>';
}

function tabTH(){

function ktForm(){
 const f=V.form,e=[],c=[];
 if(!f.ten.trim())e.push('Chưa nhập tên đợt');
 if(!f.tu||!f.den)e.push('Chưa nhập đủ khoảng ngày');
 else{
  const tu=new Date(f.tu),den=new Date(f.den);
  if(key(tu)>key(den))e.push('Ngày bắt đầu phải trước hoặc bằng ngày kết thúc');
  if(key(tu)<key(HOMNAY))e.push('<b>Không thể khai báo nghỉ cho ngày đã diễn ra.</b> Ngày '+d2s(tu)+' đã có <b>'+(LOP.length*TIET_NGAY)+' tiết</b> được ghi nhận');
  if(key(den)>key(NH.hk2kt))e.push('Ngày '+d2s(den)+' <b>nằm ngoài năm học '+NH.ten+'</b> (kết thúc '+d2s(NH.hk2kt)+')');
  if(key(tu)<key(NH.tuu))e.push('Ngày '+d2s(tu)+' <b>nằm trước ngày tựu trường</b> '+d2s(NH.tuu));
  /* chong lan */
  const tmp={loai:f.loai,tu:tu,den:den,pham:f.pham,ids:f.ids};
  DOT.filter(d=>!d.huy).forEach(function(d){
   if(key(d.den)<key(tu)||key(d.tu)>key(den))return;
   const A=lopTrongPham(d),B=lopTrongPham(tmp);
   if(!A.some(l=>B.indexOf(l)>=0))return;
   c.push('Chồng lấn với đợt <b>'+esc(d.ten)+'</b> ('+d2s(d.tu)+' → '+d2s(d.den)+')');
  });
 }
 if(f.pham==='dt'&&!f.ids.length)e.push('Chưa chọn điểm trường nào');
 if(LOAI[f.loai].canCu&&!f.canCu.trim())e.push('Loại <b>Nghỉ lễ theo quy định</b> bắt buộc có <b>căn cứ văn bản</b>');
 if(!LOAI[f.loai].canCu&&!f.lyDo.trim())e.push('Chưa nhập lý do');
 return {e:e,c:c};
}

  if(!ly.trim()){toast('⚠ <b>Bắt buộc ghi lý do</b> hủy đợt');return}
  d.huy=true;
  d.ls.push({d:HOMNAY,ng:'Người dùng demo · '+R().ten,t:'Hủy đợt nghỉ',n:'Lý do: '+ly.trim()+' · đã khôi phục tiết và gửi thông báo lại',c:'r'});
  closeModal();V.pick=null;V.qtt.huy=1;render();
  toast('🗑 Đã hủy đợt <b>'+esc(d.ten)+'</b> — bản ghi vẫn tìm lại được qua chip <b>Đã hủy</b>');return}
 if(x==='mXuat'){
  modal('⬇ Xuất dữ liệu — M10.9',
   '<div class="warn">Theo <b>NĐ 13/2023</b>, mọi lượt xuất đều <b>bắt buộc chọn mục đích</b> và ghi Audit Log.</div>'+
   '<label class="lbl">Chọn mẫu</label><div class="seg">'+
   '<button class="sgb on" data-x="mau"><b>Lịch nghỉ cả năm</b><span>Báo cáo Phòng / Sở và niêm yết tại trường</span></button>'+
   '<button class="sgb" data-x="mau"><b>Số ngày thực học theo lớp</b><span>Đối chiếu 35 tuần theo QĐ 2308</span></button></div>'+
   '<label class="lbl">Mục đích xuất <b>*</b></label><div class="chkl">'+
   ['Báo cáo Phòng / Sở GDĐT','Niêm yết tại trường','Lưu trữ nội bộ','Đối chiếu khi thanh tra'].map((m,i)=>
    '<button class="chkb '+(i===0?'on':'')+'" data-x="mucdich">'+m+'</button>').join('')+'</div>',
   '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="doXuat">⬇ Xuất</button>');return}
 if(x==='mau'){document.querySelectorAll('[data-x="mau"]').forEach(b=>b.classList.remove('on'));el.classList.add('on');return}
 if(x==='mucdich'){document.querySelectorAll('[data-x="mucdich"]').forEach(b=>b.classList.remove('on'));el.classList.add('on');return}
 if(x==='doXuat'){closeModal();toast('⬇ Đã xuất. Audit Log ghi kèm <b>mục đích đã chọn</b>');return}
});
document.addEventListener('input',function(ev){
 const t=ev.target;
 if(t.id==='qq'){V.q=t.value;const c=t.selectionStart;render();const q=$('#qq');if(q){q.focus();q.setSelectionRange(c,c)}return}
 if(t.dataset&&t.dataset.f&&V.form){
  const f=t.dataset.f;V.form[f]=t.value;
  if(f==='tu'||f==='den')drawKhai();
 }
});
document.addEventListener('change',function(ev){
 const t=ev.target;
 if(t.id==='hdt'){V.calPham=t.value||'tt';render();return}
 if(t.dataset&&t.dataset.f&&V.form){V.form[t.dataset.f]=t.value}
});

render();
</script>
</body>
