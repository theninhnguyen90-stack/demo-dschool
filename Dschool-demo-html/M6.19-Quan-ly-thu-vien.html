<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.19 Quản lý thư viện — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.mini{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:12px}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}


/* ═════════ M6.19 QUẢN LÝ THƯ VIỆN ═════════ */
.quay{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:12px 0 10px;overflow:hidden}
.quay .qh{display:flex;align-items:center;gap:9px;padding:10px 13px;background:#f8fafc;border-bottom:1px solid var(--line);flex-wrap:wrap}
.quay .qh b{font-size:13.5px}
.quay .qb{padding:11px 13px;display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.4fr);gap:14px}
@media(max-width:1000px){.quay .qb{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.seg button.on{background:var(--brand);color:#fff}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.stt{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.sugg{border:1px solid var(--line);border-radius:9px;margin-top:6px;max-height:230px;overflow-y:auto;background:#fff}
.sugg .si{display:flex;gap:9px;align-items:center;padding:6px 10px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:12.5px}
.sugg .si:hover{background:var(--brand-soft)}
.sugg .si:last-child{border-bottom:none}
.bdcard{border:1px solid #bfdbfe;background:var(--brand-soft);border-radius:10px;padding:9px 11px;font-size:12.5px;margin-top:6px}
.bdcard .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bdcard .mm{color:var(--ink2);margin-top:2px}
.codes{width:100%;min-height:74px;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:13px/1.5 Consolas,"Cascadia Mono",monospace;resize:vertical}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}
.kq{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.kq.ok{background:var(--green-soft);color:var(--green)}
.kq.w{background:var(--amber-soft);color:var(--amber)}
.kq.x{background:var(--red-soft);color:var(--red)}
.kq.n{background:var(--bg);color:var(--ink2)}
tr.xrow td{background:#fff7f7}
tr.wrow td{background:#fffcf2}
tr.dim td{color:var(--ink3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:12px 0 4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.kpi .k{font-size:11px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11px;color:var(--ink3)}
.kpi.r .v{color:var(--red)} .kpi.a .v{color:var(--amber)} .kpi.g .v{color:var(--green)}
.hbar{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0}
.hbar .l{width:150px;flex:0 0 150px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{flex:1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--brand)}
.hbar .n{width:48px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

 const k2=KK[1], r=rng(777);
 const khongThay=[banCua('D48','B',2).ma,banCua('D50','B',1).ma], hongMa=banCua('D56','B',1).ma;
 snapKK(k2).forEach(b=>{

const ST={tab:'muontra',dt:'A',nam:'2026-2027',
 mode:'muon',bdSel:null,bdQ:'',codes:'',chk:null,lyDo:'',
 chipMT:'dangMuon',q:'',curBd:null,

const dtHieuLuc=()=>R().sc==='School'?ST.dt:R().dt;          /* 'A' | 'B' | 'ALL' */
const trongDT=dt=>{const d=dtHieuLuc();return d==='ALL'||d===dt};
const quayDT=()=>{const d=dtHieuLuc();return d==='ALL'?null:d};
function luotTrongPV(){
 const r=R();
 let ds=LUOT.filter(x=>trongDT(x.dt));
 if(r.sc==='Class') ds=ds.filter(x=>x.bd.k==='hs'&&r.lop.includes(bdGet(x.bd).lop));
 return ds;
}
const banTrongPV=()=>BAN.filter(b=>trongDT(b.dt));

/* ---------- lượt mượn — dẫn xuất ---------- */
const moLuot=x=>!x.tra&&!x.huy;
const quaHan=x=>moLuot(x)&&x.han<HOMNAY;
const soNgayTre=x=>moLuot(x)?soNgay(x.han,HOMNAY):soNgay(x.han,x.tra);
const luotMoCuaBan=ma=>LUOT.find(x=>x.ban===ma&&moLuot(x));
const luotMoCuaBd=bd=>LUOT.filter(x=>bdKey(x.bd)===bdKey(bd)&&moLuot(x));
const luotCuaBan=ma=>LUOT.filter(x=>x.ban===ma);

/* ---------- trạng thái bản sách ----------
   Sẵn sàng · Đang mượn · Quá hạn  → DẪN XUẤT từ lượt mượn (không ai bấm)
   Chờ loại                        → bấm tay (báo hỏng / mất) hoặc hệ quả của trả hỏng · báo mất · chốt kiểm kê
   Đã loại                         → CHỈ khi Hiệu trưởng duyệt danh mục thanh lọc */
function ttBan(b){
 if(b.tt==='daLoai') return {k:'daLoai',n:'Đã loại',c:'n'};
 const l=luotMoCuaBan(b.ma);
 if(l) return quaHan(l)?{k:'quaHan',n:'Quá hạn '+soNgayTre(l)+' ngày',c:'r',l}:{k:'dangMuon',n:'Đang mượn',c:'b',l};
 if(b.tt==='choLoai') return {k:'choLoai',n:'Chờ loại — '+(LYDO[b.ly]?LYDO[b.ly].s:'khác'),c:'w'};
 return {k:'sanSang',n:'Sẵn sàng',c:'o'};
}
const stBan=b=>{const t=ttBan(b);return '<span class="st2 '+t.c+'">'+esc(t.n)+'</span>'+(b.hn&&t.k!=='daLoai'?' <span class="tg b" title="'+esc(b.hn)+'">hỏng nhẹ</span>':'')};

/* ---------- hạn trả mặc định — cấu hình loại sách × loại bạn đọc ---------- */
function hanMacDinh(kho,bdK,ngay){
 const v=CFG.han[kho][bdK];
 if(v==='nam') return {loai:'nam',han:NAMHOC[namHocCua(ngay)].kt,ghi:'theo năm học'};
 if(v==null) return {loai:'thuong',han:cong(ngay,14),ghi:'không áp dụng — tạm 14 ngày',canh:1};
 return {loai:'thuong',han:cong(ngay,v),ghi:v+' ngày'};
}

/* ---------- tách chuỗi quét / gõ nhiều mã ---------- */
const tachMa=s=>(s||'').toUpperCase().split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);

/* ---------- kiểm tra MƯỢN — chặn: toàn vẹn dữ liệu · cảnh báo: thẩm quyền của quản thư (khung §15) ---------- */
function kiemMuon(bd,codes,dtQ){
 const ng=bdGet(bd), rows=[], seen=new Set(), canhBd=[];
 const mo=luotMoCuaBd(bd), qh=mo.filter(quaHan);
 if(qh.length) canhBd.push('Đang có <b>'+qh.length+' cuốn quá hạn</b>: '+qh.map(x=>esc(dauById(banByMa(x.ban).dau).ten)+' (quá '+soNgayTre(x)+' ngày)').join('; ')+'.');
 if(ng.tt==='chuyen') canhBd.push('Học sinh <b>đã chuyển trường</b> '+k2s(ng.ttNgay)+' — chỉ nên nhận trả, không nên cho mượn mới.');
 if(ng.tt==='thoi') canhBd.push('Học sinh <b>đã thôi học</b> '+k2s(ng.ttNgay)+'.');
 if(ng.tt==='nghi') canhBd.push('Nhân sự <b>đã nghỉ việc</b> '+k2s(ng.ttNgay)+'.');
 if(bd.k==='hs'&&ng.dt!==dtQ) canhBd.push('Học sinh học ở <b>'+DTN[ng.dt]+'</b>, đang mượn ở quầy '+DTN[dtQ]+' — chỉ để biết, không chặn.');
 let thuong=mo.filter(x=>x.loai==='thuong').length;
 tachMa(codes).forEach(ma=>{
  const row={ma,ok:'ok',ly:[],info:[]};
  if(seen.has(ma)){row.ok='x';row.ly.push('Mã quét trùng trong lượt này — bỏ qua dòng lặp.');rows.push(row);return}
  seen.add(ma);
  const b=banByMa(ma); row.b=b;
  if(!b){row.ok='x';row.ly.push('Không có mã cá biệt <b>'+esc(ma)+'</b> trong sổ đăng ký cá biệt.');rows.push(row);return}
  const d=dauById(b.dau), t=ttBan(b); row.d=d;
  if(b.dt!==dtQ){row.ok='x';row.ly.push('Bản thuộc kho <b>'+DTN[b.dt]+'</b> — quầy đang ở '+DTN[dtQ]+'. Mỗi điểm trường một kho (chốt 4): bản của kho nào cho mượn ở quầy kho đó.');}
  else if(t.k==='daLoai'){const tl=TL.find(x=>x.id===b.tl);row.ok='x';row.ly.push('Bản <b>đã loại khỏi kho</b> — đợt '+b.tl+(tl&&tl.duyet?', QĐ '+tl.duyet.so+' ngày '+k2s(tl.duyet.ngay):'')+'.');}
  else if(t.k==='dangMuon'||t.k==='quaHan'){row.ok='x';row.ly.push('Bản <b>đang cho mượn</b> — lượt '+t.l.id+', '+esc(bdTen(t.l.bd))+' ('+esc(bdNhom(t.l.bd))+'), hạn '+k2s(t.l.han)+'. Ghi trả lượt đó trước.');}
  else if(t.k==='choLoai'&&(b.ly==='mat'||b.ly==='khongThay')){row.ok='x';row.ly.push('Bản đang ghi <b>'+LYDO[b.ly].n.toLowerCase()+'</b>. Cuốn đang trong tay nghĩa là đã tìm thấy: <b>↺ Hoàn về kho</b> ở tab 2 trước (có lý do), rồi mới cho mượn.');}
  else if(t.k==='choLoai'&&b.tl&&(TL.find(x=>x.id===b.tl)||{}).buoc>=2){row.ok='x';row.ly.push('Bản nằm trong danh mục thanh lọc <b>'+b.tl+'</b> đã gửi hội đồng — rút khỏi danh mục trước.');}
  else {
   if(t.k==='choLoai'){row.ok='w';row.ly.push('Bản đang <b>Chờ loại — hỏng</b>'+(b.ev.length?': '+esc(b.ev[b.ev.length-1].n):'')+'. Vẫn cho mượn được nếu anh/chị thấy còn dùng được — ghi lý do.');}
   const h=hanMacDinh(d.kho,bd.k,HOMNAY); row.han=h.han; row.loai=h.loai; row.hanGhi=h.ghi;
   if(h.canh){row.ok='w';row.ly.push('Cấu hình hạn mượn: <b>'+KHO[d.kho].ten+'</b> không áp dụng cho '+bdLoai(bd).toLowerCase()+' — tạm tính 14 ngày.');}
   if(b.hn) row.info.push('Hỏng nhẹ: '+esc(b.hn));
   if(h.loai==='thuong'){thuong++; if(thuong>CFG.toiDa[bd.k]){row.ok='w';row.ly.push('Vượt số cuốn tối đa: đây là cuốn thứ <b>'+thuong+'</b>, cấu hình cho '+bdLoai(bd).toLowerCase()+' là '+CFG.toiDa[bd.k]+' cuốn (không tính SGK/SGV theo năm học).');}}
  }
  rows.push(row);
 });
 return {rows,canhBd};
}

/* ---------- kiểm tra TRẢ ---------- */
function kiemTra(codes,dtQ){
 const rows=[], seen=new Set();
 tachMa(codes).forEach(ma=>{
  const row={ma,ok:'ok',ly:[],kq:'bt',ghi:''};
  if(seen.has(ma)){row.ok='x';row.ly.push('Mã quét trùng trong lượt này.');rows.push(row);return}
  seen.add(ma);
  const b=banByMa(ma); row.b=b;
  if(!b){row.ok='x';row.ly.push('Không có mã cá biệt này trong sổ.');rows.push(row);return}
  row.d=dauById(b.dau);
  if(b.dt!==dtQ){row.ok='x';row.ly.push('Bản thuộc kho <b>'+DTN[b.dt]+'</b> — ghi trả ở quầy '+DTN[b.dt]+'.');rows.push(row);return}
  const l=luotMoCuaBan(ma);
  if(!l){row.ok='x';row.ly.push('Bản <b>không có lượt đang mở</b> — sổ ghi đang ở kho ('+esc(ttBan(b).n)+').');rows.push(row);return}
  row.l=l; rows.push(row);
 });
 return rows;
}

function demoMa(d){
 const ss=BAN.filter(b=>b.dt===d&&ttBan(b).k==='sanSang'&&['STK','STN'].includes(dauById(b.dau).kho));
 const dm=LUOT.find(x=>x.dt===d&&moLuot(x)&&x.loai==='thuong');
 const kh=BAN.find(b=>b.dt!==d&&ttBan(b).k==='sanSang');
 const dl=BAN.find(b=>b.dt===d&&b.tt==='daLoai');
 const cl=BAN.find(b=>b.dt===d&&b.tt==='choLoai'&&b.ly==='hong'&&!b.tl);
 const out=[];
 if(ss.length>1) out.push(['2 mã sẵn sàng',ss[3].ma+', '+ss[7%ss.length].ma]);
 if(dm) out.push(['⛔ bản đang mượn',dm.ban]);
 if(kh) out.push(['⛔ bản kho khác',kh.ma]);
 if(dl) out.push(['⛔ bản đã loại',dl.ma]);
 if(cl) out.push(['⚠ bản chờ loại — hỏng',cl.ma]);
 return out;
}
function demoMaTra(d){

function veBangLuot(x){

 x.forEach(l=>{

 });

/* ---------- thêm vào danh mục — mọi đường vào đi qua MỘT hàm kiểm ---------- */
function themVaoTL(t,mas,lyMacDinh){
 const ok=[],bo=[];
 mas.forEach(ma=>{
  const b=banByMa(ma);
  if(!b){bo.push([esc(ma),'Không có mã này trong sổ đăng ký cá biệt.']);return}
  if(b.dt!==t.dt){bo.push([ma,'Bản thuộc kho <b>'+DTN[b.dt]+'</b> — đợt '+t.id+' chỉ thanh lọc kho '+DTN[t.dt]+'.']);return}
  const l=luotMoCuaBan(ma);
  if(l){bo.push([ma,'⛔ <b>Bản đang cho mượn</b> — lượt '+l.id+', '+esc(bdTen(l.bd))+' ('+esc(bdNhom(l.bd))+'), hạn '+k2s(l.han)+'. Không loại được bản đang nằm ở bạn đọc: nhận trả trước, hoặc ghi <b>Mất khi đang mượn</b> ở tab 1.']);return}
  if(b.tt==='daLoai'){bo.push([ma,'Bản đã loại ở đợt '+b.tl+'.']);return}
  if(b.tl){bo.push([ma,'Bản đã nằm trong danh mục đợt <b>'+b.tl+'</b>.']);return}
  const ly=b.tt==='choLoai'?b.ly:lyMacDinh;
  if(b.tt!=='choLoai'){b.tt='choLoai';b.ly=ly;b.ev.push({luc:HOMNAY,n:'Chờ loại — đưa vào danh mục thanh lọc '+t.id+' ('+LYDO[ly].s+')',boi:R().n})}
  b.tl=t.id; t.ds.push({ma,ly,ht:'thanhLy',kl:null});
  ok.push(['<span class="mono">'+ma+'</span>',esc(dauById(b.dau).ten),esc(LYDO[ly].n)]);
 });
 render(); hopKetQua('Thêm vào danh mục '+t.id,ok,bo,['Mã','Nhan đề','Lý do']);
}

 if(!mau.includes('{DT}')) loi.push('Mẫu mã phải có <b>{DT}</b> — mỗi điểm trường một kho, bỏ {DT} thì số cũ của hai trường trước sáp nhập trùng nhau.');
 const han={};
 $$('[data-cfh]').forEach(e=>{const[k,b]=e.dataset.cfh.split('|'), v=e.value.trim().toLowerCase();
  han[k]=han[k]||{}; han[k][b]=v==='năm'||v==='nam'?'nam':v==='—'||v==='-'||v===''?null:(+v>0?+v:'ERR');
  if(han[k][b]==='ERR') loi.push(KHO[k].ten+' × '+(b==='hs'?'học sinh':'nhân sự')+': «'+esc(e.value)+'» không hợp lệ.')});
 if(loi.length){toast('⛔ Chưa lưu: '+loi.join(' '));return}
 CFG.mauMa=mau; CFG.han=han; CFG.toiDa={hs:+$('#cfTdHs').value||3,ns:+$('#cfTdNs').value||10};
 CFG.giaHan={hs:+$('#cfGhHs').value||7,ns:+$('#cfGhNs').value||14,lan:+$('#cfGhLan').value||2};
 CFG.mauNhac=$('#cfNhac').value; CFG.giuLichSu=+$('#cfGiu').value;
 toast('💾 Đã lưu cấu hình — áp cho lượt mượn <b>từ bây giờ</b>; lượt đang mở giữ hạn cũ. Audit ghi giá trị cũ → mới.'); render();
}
function hopClone(){
 modal('⧉ Lấy cấu hình từ năm học…',
  '<label class="lbl">Năm học nguồn</label><select class="fldi"><option>2025-2026</option></select>'
  +'<div class="stt" style="margin-top:10px">Sẽ lấy</div><div class="ro">② Hạn mượn · số cuốn · gia hạn · ④ Mẫu phiếu nhắc · ⑤ Thời hạn giữ lịch sử</div>'
  +'<div class="stt">Không lấy — và vì sao</div><div class="ro">① Mẫu mã và số tiếp theo — <b>dữ liệu xuyên năm</b>: đổi số chạy là sinh mã trùng · ③ Tiêu chí thanh lọc — <b>lấy từ văn bản</b>, không phải cấu hình năm (khung §19.2 quy tắc 1).</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="clOk">⧉ Lấy</button>');
 mfns.bclOk=()=>{closeM();toast('⧉ Đã lấy 3 khối từ năm học 2025-2026 — giá trị không đổi (hai năm cùng cấu hình). Audit ghi lượt lấy.')};
}

/* ═══════════ RENDER + SỰ KIỆN ═══════════ */

function render(){
 rolebar(); header(); tabs();
 $('#crumb').innerHTML='';
 const c=$('#content');
 if(ST.tab==='muontra')     c.innerHTML=veMuonTra();
 else if(ST.tab==='kho')    c.innerHTML=veKho();
 else if(ST.tab==='kiemke') c.innerHTML=veKiemKe();
 else if(ST.tab==='thongke')c.innerHTML=veThongKe();
 else                       c.innerHTML=veCauHinh();
 const nn=document.body.classList.contains('nn');
 $('#btnNote').classList.toggle('on',!nn);
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(nn?'TẮT':'BẬT');
}
function doiTab(t){ST.tab=t;ST.curBd=null;ST.curDau=null;ST.curDot=null;ST.chk=null;ST.q='';ST.qKho='';ST.qKK='';ST.subKK='dem';ST.chipDem='all'}
const parseBd=v=>{const[k,id]=v.split(':');return {k,id}};
const dotHT=()=>dotById(ST.curDot);

/* ---------- bảng hành động: data-a="tên" data-v="giá trị" ---------- */
const A={
 /* tab 1 */
 mode:v=>{ST.mode=v;ST.chk=null;ST.codes=''},
 goBd:v=>{ST.bdQ=v},
 chonBd:v=>{ST.bdSel=parseBd(v);ST.bdQ='';ST.chk=null},
 boBd:()=>{ST.bdSel=null;ST.chk=null},
 dien:v=>{ST.codes=v;ST.chk=null},
 kiemMuon:()=>{ST.codes=$('#codes').value;if(!tachMa(ST.codes).length){toast('⛔ Chưa có mã cá biệt nào.');return 1}
  ST.chk=Object.assign({mode:'muon'},kiemMuon(ST.bdSel,ST.codes,quayDT()))},
 kiemTra:()=>{ST.codes=$('#codes').value;if(!tachMa(ST.codes).length){toast('⛔ Chưa có mã cá biệt nào.');return 1}
  ST.chk={mode:'tra',rows:kiemTra(ST.codes,quayDT())}},
 ghiMuon:()=>{thucHienMuon();return 1},
 ghiTra:()=>{thucHienTra();return 1},
 capSGK:()=>{hopCapSGK();return 1}, thuSGK:()=>{hopThuSGK();return 1},
 chipMT:v=>{ST.chipMT=v},
 nhac:()=>{hopNhac();return 1},
 xuat:v=>{hopXuat(v);return 1},
 muonCho:v=>{ST.bdSel=parseBd(v);ST.mode='muon';ST.chk=null;ST.curBd=null;ST.codes='';setTimeout(()=>window.scrollTo(0,0),0)},
 giaHan:v=>{hopGiaHan(v);return 1}, traMot:v=>{hopTraMot(v);return 1}, baoMat:v=>{hopBaoMat(v);return 1}, huy:v=>{hopHuy(v);return 1},
 /* tab 2 */
 phieuNhap:v=>{hopPhieuNhap(v||null);return 1}, importX:()=>{hopImport();return 1},
 soTQ:()=>{hopSoTQ();return 1}, soCB:()=>{hopSoCB();return 1},
 loaiKho:v=>{ST.loaiKho=v}, chipKho:v=>{ST.chipKho=v},
 suaDau:v=>{hopSuaDau(v);return 1}, baoHong:v=>{hopBaoHong(v);return 1}, baoMatKho:v=>{hopBaoMatKho(v);return 1},
 hoanVe:v=>{hopHoanVe(v);return 1}, goHn:v=>{goHn(v);return 1}, lsBan:v=>{hopLsBan(v);return 1},
 /* tab 3 */
 moKK:()=>{hopMoKK();return 1}, moTL:()=>{hopMoTL();return 1},
 chipKK:v=>{ST.chipKK=v}, veDs:()=>{ST.curDot=null}, subKK:v=>{ST.subKK=v}, chipDem:v=>{ST.chipDem=v},
 scanKK:()=>{scanKK();return 1}, themThua:()=>{hopThemThua();return 1}, chuaThanhKhong:()=>{hopChuaThanhKhong();return 1}, chotKK:()=>{chotKK();return 1},
 ghiDeAn:()=>{hopGhiDeAn(dotHT());return 1},
 xemTep:()=>{const t=dotHT();modal('👁 Biên bản thẩm định '+t.bb.so,'<div class="ro"><b>👁 Xem đứng trước ⬇ Tải</b>. Bản quét biên bản (mẫu 06a) kèm danh mục đủ điều kiện (mẫu 06b) — '+t.ds.length+' bản, ký bởi Chủ tịch hội đồng và thư ký.</div>'
  +'<div class="tbw"><div class="f"><span class="k">Số</span><span class="v">'+t.bb.so+'</span></div><div class="f"><span class="k">Ngày</span><span class="v">'+k2s(t.bb.ngay)+'</span></div><div class="f"><span class="k">Thành phần</span><span class="v" style="font-weight:400">'+esc(t.hd.tv)+'</span></div></div>',
  '<button class="btn" data-mb="close">Đóng</button><button class="btn p" data-mb="close">⬇ Tải tệp</button>');return 1},
 congBo:()=>{const t=dotHT();t.congBo=HOMNAY;toast('📢 Đã ghi công bố danh mục '+t.id+' tại trụ sở thư viện ngày '+k2s(HOMNAY)+'.')},
 themCho:()=>{const t=dotHT(),m=choLoaiTuDo(t.dt).map(b=>b.ma);if(!m.length){toast('Không có bản Chờ loại nào chưa vào đợt ở kho '+DTN[t.dt]+'.');return 1}themVaoTL(t,m,'hong');return 1},
 themMa:()=>{hopThemMa(dotHT());return 1}, themDau:()=>{hopThemDau(dotHT());return 1},
 guiHD:()=>{hopGuiHD(dotHT());return 1}, ghiHD:()=>{hopGhiHD(dotHT());return 1}, trinhHT:()=>{trinhHT(dotHT());return 1},
 traLai:()=>{hopTraLai(dotHT());return 1}, duyetTL:()=>{hopDuyetTL(dotHT());return 1},
 rutTL:v=>{const t=dotHT(),b=banByMa(v);t.ds=t.ds.filter(r=>r.ma!==v);b.tl=null;b.ev.push({luc:HOMNAY,n:'Rút khỏi danh mục '+t.id,boi:R().n});
  toast('✕ Đã rút <b>'+v+'</b> khỏi danh mục — bản giữ <b>Chờ loại</b>; muốn cho mượn lại thì <b>↺ Hoàn về kho</b> ở tab 2.')},
 /* tab 4 · 5 */
 xuatTK:()=>{toast('⬇ Đã xuất báo cáo định kỳ '+ST.nam+' — chỉ số tổng hợp, không có tên học sinh.');return 1},
 luuCH:()=>{luuCauHinh();return 1}, cloneCH:()=>{hopClone();return 1}
};

/* ---------- kiểm kê: quét · thừa · chốt ---------- */
function scanKK(){
 const k=dotHT(), m=tachMa($('#scanKK').value), s=snapKK(k), ok=[], bo=[];
 if(!m.length){toast('⛔ Chưa có mã nào.');return}
 m.forEach(ma=>{
  const b=s.find(x=>x.ma===ma);
  if(b&&moTai(ma,k.moc)){bo.push([ma,'Bản đang ở bạn đọc tại mốc ('+moTai(ma,k.moc).id+') — máy đã điền, không cần đếm.']);return}
  if(b){k.kq[ma]={v:'coMat'};ok.push(['<span class="mono">'+ma+'</span>',esc(dauById(b.dau).ten),'<span class="kq ok">Có mặt</span>']);return}
  if(!k.thua.some(t=>t.ma===ma)) k.thua.push({ma,ghi:'Quét được khi kiểm đếm '+k2s(HOMNAY)+' — không có trong bản chụp'});
  bo.push([ma,'Không có trong bản chụp sổ của đợt → ghi vào danh sách <b>Thừa</b>'+(banByMa(ma)?' (bản của kho '+DTN[banByMa(ma).dt]+')':' (mã không có trong sổ)')+'.']);
 });
 render(); hopKetQua('Quét kiểm đếm '+k.id,ok,bo,['Mã','Nhan đề','Kết quả']);
}
function hopThemThua(){
 const k=dotHT();
 modal('➕ Ghi nhận bản thừa — '+k.id,'<label class="lbl">Mã trên nhãn (để trống nếu không có)</label><input class="fldi" id="thMa">'
  +'<label class="lbl">Ghi nhận của người kiểm <span style="color:var(--red)">*</span></label><input class="fldi" id="thG" placeholder="Nguồn gốc nghi vấn, vị trí tìm thấy">',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="thOk">Ghi nhận</button>');
 mfns.bthOk=()=>{const g=$('#thG').value.trim(); if(!g){toast('⛔ Thiếu ghi nhận.');return}
  k.thua.push({ma:$('#thMa').value.trim().toUpperCase(),ghi:g}); closeM(); render()};
}
function hopChuaThanhKhong(){
 const k=dotHT(), chua=snapKK(k).filter(b=>!moTai(b.ma,k.moc)&&!k.kq[b.ma]);
 modal('Ghi '+chua.length+' bản chưa đếm là «Không thấy»',
  '<div class="warn">⚠ Thao tác hàng loạt — dùng khi ban kiểm kê <b>đã rà hết kệ</b>. Các dòng này vào tab Chênh lệch; chốt đợt sẽ đưa chúng sang <b>Chờ loại — kiểm kê không thấy</b>.</div>'
  +'<label class="lbl">Giải trình chung (áp cho '+chua.length+' dòng) <span style="color:var(--red)">*</span></label><input class="fldi" id="ctG" placeholder="Đã rà kệ, tủ sách lớp, phòng đọc — không tìm thấy">',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn d" data-mb="ctOk">Ghi «Không thấy»</button>');
 mfns.bctOk=()=>{const g=$('#ctG').value.trim(); if(g.length<8){toast('⛔ Giải trình quá ngắn.');return}
  chua.forEach(b=>k.kq[b.ma]={v:'khongThay',ghi:g}); closeM(); render(); toast('Đã ghi '+chua.length+' dòng «Không thấy» kèm giải trình chung.')};
}
function chotKK(){
 const k=dotHT(), s=snapKK(k), kqOf=b=>moTai(b.ma,k.moc)?'dangMuon':(k.kq[b.ma]?k.kq[b.ma].v:null);
 const chua=s.filter(b=>kqOf(b)===null), thieu=s.filter(b=>['khongThay','hong'].includes(kqOf(b))&&!(k.kq[b.ma].ghi||'').trim());
 if(chua.length||thieu.length){toast('⛔ Còn '+chua.length+' bản chưa đếm và '+thieu.length+' dòng chưa giải trình.');return}
 const ok=[],bo=[];
 s.forEach(b=>{const v=kqOf(b); if(!['khongThay','hong'].includes(v)) return;
  if(b.tt!=='kho'){bo.push([b.ma,'Sổ đã ghi '+esc(ttBan(b).n)+' từ trước — giữ nguyên.']);return}
  if(luotMoCuaBan(b.ma)){bo.push([b.ma,'Đang có lượt mở '+luotMoCuaBan(b.ma).id+' (mượn sau mốc) — không chuyển Chờ loại.']);return}
  const ly=v==='hong'?'hong':'khongThay'; b.tt='choLoai'; b.ly=ly; b.ev.push({luc:HOMNAY,n:'Chờ loại — chốt kiểm kê '+k.id+': '+k.kq[b.ma].ghi,boi:R().n});
  ok.push(['<span class="mono">'+b.ma+'</span>',esc(dauById(b.dau).ten),'Chờ loại — '+LYDO[ly].s]);
 });
 k.tt='daChot'; k.chot=HOMNAY; k.boi=R().n; render();
 hopKetQua('Chốt '+k.id+' — '+k.thua.length+' bản thừa chỉ ghi nhận',ok,bo,['Mã','Nhan đề','Hệ quả']);
}

/* ---------- click ---------- */
mfns.bclose=()=>closeM();
document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 if(t===$('#mask')){closeM();return}
 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r;doiTab(ST.tab);ST.bdSel=null;if(R().sc!=='School')ST.dt=R().dt;else if(ST.dt==='ALL')ST.dt='A';render();return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn');render();return}
 const tb=t.closest('[data-t]'); if(tb){doiTab(tb.dataset.t);render();return}
 const ac=t.closest('[data-a]'); if(ac){if(ac.disabled)return; const f=A[ac.dataset.a]; if(f&&!f(ac.dataset.v)) render(); return}
 const lk=t.closest('[data-lnk]'); if(lk){toast('🔗 Deep-link sang <b>'+esc(lk.dataset.lnk)+'</b> — mở sẵn đúng ngữ cảnh, quay lại được M6.19 (D3). M6.19 không dựng lại việc của menu khác.');return}
 if(t.closest('[data-close]')){ST.curBd=null;ST.curDau=null;render();return}
 const bd=t.closest('[data-bd]'); if(bd){ST.curBd=ST.curBd===bd.dataset.bd?null:bd.dataset.bd;render();return}
 const du=t.closest('[data-dau]'); if(du){ST.curDau=ST.curDau===du.dataset.dau?null:du.dataset.dau;render();return}
 const dt=t.closest('[data-dot]'); if(dt){ST.curDot=dt.dataset.dot;ST.subKK='dem';ST.chipDem='all';ST.qKK='';render();window.scrollTo(0,0);return}
});

/* ---------- change ---------- */
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='hdt'){ST.dt=t.value;ST.curBd=null;ST.curDau=null;ST.curDot=null;ST.chk=null;render();return}
 if(t.id==='hnam'){ST.nam=t.value;render();return}
 if(t.dataset.kq!=null){ST.chk.rows[+t.dataset.kq].kq=t.value;render();return}
 if(t.dataset.kk!=null){const k=dotHT(),m=t.dataset.kk; if(t.value) k.kq[m]=Object.assign(k.kq[m]||{},{v:t.value}); else delete k.kq[m]; render();return}
 const tl=['tly','tht','tkl'].find(x=>t.dataset[x]!=null);
 if(tl){const r=dotHT().ds[+t.dataset[tl]]; r[{tly:'ly',tht:'ht',tkl:'kl'}[tl]]=t.value||null;
  if(tl==='tly'){const b=banByMa(r.ma);b.ly=t.value} render();return}
});

/* ---------- input — ô tìm vẽ lại có giữ con trỏ; ô ghi chú không vẽ lại ---------- */
function giuConTro(id,fn){const p=$('#'+id).selectionStart;fn();render();const n=$('#'+id);if(n){n.focus();n.setSelectionRange(p,p)}}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='bdq'){giuConTro('bdq',()=>ST.bdQ=t.value);return}
 if(t.id==='qmt'){giuConTro('qmt',()=>ST.q=t.value);return}
 if(t.id==='qkho'){giuConTro('qkho',()=>ST.qKho=t.value);return}
 if(t.id==='qkk'){giuConTro('qkk',()=>ST.qKK=t.value);return}
 if(t.id==='codes'){ST.codes=t.value;return}
 if(t.id==='lyDo'){ST.lyDo=t.value;return}
 if(t.dataset.ghi!=null){ST.chk.rows[+t.dataset.ghi].ghi=t.value;return}
 if(t.dataset.kkg!=null){const k=dotHT();k.kq[t.dataset.kkg].ghi=t.value;return}
});

render();
</script>
