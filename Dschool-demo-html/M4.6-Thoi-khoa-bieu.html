<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4.6 Thời khóa biểu — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.flab{font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:-3px}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}.st2.v{background:#ede9fe;color:#5b21b6}

.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:190px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}tr.badrow{background:var(--red-soft)}
tr.grp td{background:#f8fafc;font-weight:700;font-size:11.5px}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.empty{padding:32px;text-align:center;color:var(--ink3)}
.mini{font-size:10.5px;color:var(--ink3);font-weight:400}
.nodata{color:var(--red);font-weight:700}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:800px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}

/* ---------- BÀN XẾP ---------- */
.board{display:flex;gap:13px;align-items:flex-start}
.pool{width:250px;flex:0 0 250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pool .th{padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.pbody{padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.tchip{border:1px solid var(--line2);border-left:3px solid var(--brand);border-radius:9px;padding:6px 9px;font-size:12.5px;background:#fff;cursor:grab}
.tchip:hover{background:var(--brand-soft);border-color:var(--brand)}
.tchip.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.tchip.sel .mini{color:#c7d2fe}
.tchip.done{opacity:.45;border-left-color:var(--green);cursor:default}
.tchip b{display:block}
.gridw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
.tkb{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}
.tkb th{position:sticky;top:0;z-index:2;background:#f8fafc;font-size:11px;padding:8px 6px;text-align:center;text-transform:none;letter-spacing:0}
.tkb td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.tkb td.hr{background:#f8fafc;font-size:10.5px;color:var(--ink3);text-align:center;padding:4px 6px;white-space:nowrap;font-weight:700;position:sticky;left:0;z-index:1}
.tkb tr.buoi td{background:#eef2f7;font-size:10.5px;font-weight:700;color:var(--ink2);text-align:center;padding:3px}
.cell{min-height:60px;padding:5px 6px;font-size:11.5px;line-height:1.35;cursor:pointer;display:flex;flex-direction:column;justify-content:center;position:relative}
.cell:hover{background:var(--brand-soft)}
.cell.has{background:#f8fafc;cursor:default}
.cell.has b{font-weight:700}
.cell.has .g{color:var(--ink2);font-size:11px;font-weight:600;display:block;word-break:break-word}
.cell.has .g2{color:var(--ink3);font-size:10px;display:block}
.cell.bad{background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red)}
.cell.soft{background:var(--amber-soft)}
.cell .x{position:absolute;top:2px;right:3px;font-size:10px;color:var(--red);font-weight:700;display:none}
.cell.has:hover .x{display:block}
.cell.drop{outline:2px dashed var(--brand);outline-offset:-3px;background:var(--brand-soft)}
.cell.co{background:#fafbfc;color:var(--ink3);cursor:default}
.cflist{margin-top:12px}
.cfrow{display:flex;align-items:flex-start;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.cfrow:last-child{border-bottom:none}
.cfrow.h{background:var(--red-soft);color:#991b1b}
.cfrow.s{background:var(--amber-soft);color:#92400e}
.dtb{font-size:9px;font-weight:800;border-radius:4px;padding:0 4px;margin-left:3px;background:#e0e7ff;color:#3730a3}
.dtb.b{background:#fef3c7;color:#92400e}
.bnrow{display:grid;grid-template-columns:2fr 1.1fr 1fr 1fr 1.2fr 1.5fr;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;font-size:12.5px}
.bnrow:last-child{border-bottom:none}
.bnrow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.hdrow{display:grid;grid-template-columns:2fr 1.1fr 1fr 1fr 1.2fr 1.5fr;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.bar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.bar2 i{display:block;height:100%;background:var(--green)}
.bar2 i.w{background:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin:12px 0 0}
.crumb b{color:var(--ink)}
.crumb .bk{border:1px solid var(--line2);border-radius:8px;padding:4px 11px;font-size:12.5px;background:#fff}
.crumb .bk:hover{background:var(--bg)}
.gridcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.gridcard>.ch{padding:8px 12px}
.mini2{font-size:11px;color:var(--ink3)}
.pk{display:flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
.pk:hover{border-color:var(--brand);background:var(--brand-soft)}
.pk.on{border-color:var(--brand);background:var(--brand-soft)}
.pk .sp{flex:1}
.pchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;
 padding:2px 8px;font-size:11.5px;background:#f8fafc;margin:2px 3px 2px 0}
.pchip .x{color:var(--red);font-weight:700;cursor:pointer;font-size:11px}
.timei{width:78px;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums}
.timei:disabled{background:#f1f5f9;color:var(--ink2)}
.sw{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.sw button{padding:3px 10px;font-size:11px;font-weight:700;background:#fff;color:var(--ink3)}
.sw button+button{border-left:1px solid var(--line2)}
.sw button.on.c{background:var(--red);color:#fff}
.sw button.on.m{background:var(--amber);color:#fff}
.sw button:disabled{cursor:not-allowed;opacity:.55}
.dayb{font-size:11.5px;font-weight:700;border:1px solid var(--line2);border-radius:7px;padding:3px 10px;background:#fff;color:var(--ink2)}
.dayb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.numi{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-variant-numeric:tabular-nums}
.numi:disabled{background:#f1f5f9;color:var(--ink2)}

/* ===== GDDP (20/9/2026) — ô gắn PHẦN · người dạy theo giai đoạn ===== */
.cell.has .ph{display:block;font-size:10.5px;font-weight:700;color:var(--brand);line-height:1.3}
.cell.has .ph.gd{color:#7c3aed}
.tchip .phn{font-weight:600;color:var(--brand)}
.tchip.sel .phn{color:#e0e7ff}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="VT">Văn thư</button>
  <button class="rb" data-r="PDT">PHT Điểm trường A</button>
  <button class="rb" data-r="PCM">PHT Chuyên môn</button>
  <button class="rb" data-r="HT">Hiệu trưởng</button>
  <button class="rb" data-r="GV">Giáo viên</button>
  <span class="note">TKB là <b>mẫu tuần</b> — nghiệp vụ hàng ngày đọc <b>Lịch giảng dạy M4.7</b></span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"><option>Toàn trường</option><option>Điểm trường A</option><option>Điểm trường B</option></select>
  <span class="lockico" id="dtlock"></span>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot" id="ndot">3</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">DQ</div>
</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Thời khóa biểu</h1><div class="spacer"></div><span id="topact"></span></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const HOMNAY=new Date(2026,10,28);
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4200)}
function closeModal(){$('#mask').classList.remove('on')}
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}

const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','3'],['M0.3','Thông báo'],['M0.4','Trang cá nhân']]],
 ['lh','📚 Lớp học hàng ngày',[['M2.1','Lịch dạy và học'],['M2.2','Sổ đầu bài']]],
 ['ns','👨‍🏫 Nhân sự',[['M4.1','Hồ sơ nhân sự'],['M4.2','Biến động nhân sự'],['M4.3','Chức danh & Điểm công tác'],
   ['M4.4','Quản lý giáo viên'],['M4.5','Phân công giảng dạy'],['M4.6','Thời khóa biểu','3'],
   ['M4.7','Lịch giảng dạy & Dạy thay'],['M4.8','Nghỉ phép'],['M4.9','Chấm công nhân sự'],
   ['M4.10','Khen thưởng & Kỷ luật NS'],['M4.11','Chứng thư số']]],

 {id:'lienTiep', ten:'Số tiết liên tiếp tối đa của một giáo viên',           loai:'mem', doi:1,v:4},
];
const rb=id=>RB.find(x=>x.id===id);
const laCung=id=>rb(id).loai==='cung';
let NGAYDAY=6;   /* 5 hoặc 6 ngày dạy — của ĐIỂM TRƯỜNG, áp cho mọi bộ giờ */


/* ================= GDDP (20/9/2026) — Ô THỜI KHÓA BIỂU GẮN MỘT PHẦN =================
   Hợp đồng HDPC ⑦ (mô tả §0b). Khối này là BẢN CHIẾU CHỈ ĐỌC — M4.6 không sở hữu
   một trường nào trong đó:
     · danh mục phương thức + phần            🔗 M10.2 ② panel của một môn
     · phương thức của một Lớp × Môn × Năm    🔗 M10.1 ⑥
     · lịch triển khai phần THEO LỚP          🔗 M5.1 ⑤   (🔒 chủ sở hữu — sửa qua deep-link D3)
     · bảng rải vòng lặp ĐÃ ĐÓNG BĂNG         🔗 M5.1 ⑤b
     · ai dạy phần nào                        🔗 M4.5 ⑥
   🛑 KHÔNG có ô «chọn nhánh». Nhánh là DẪN XUẤT từ cách khai ở M5.1 ⑤. */
const SOTUAN_NAM=35;
const PTX={
 'KHTN':{ma:'PT1',ten:'Ba phân môn Lý – Hóa – Sinh',
   phan:[['P1','Vật lí'],['P2','Hóa học'],['P3','Sinh học']]},
 'Lịch sử & Địa lí':{ma:'PT1',ten:'Hai phân môn Lịch sử – Địa lí',
   phan:[['P1','Lịch sử'],['P2','Địa lí']]},
};
const PTLOP={};                                   /* 'lop|mon' -> mã phương thức (mặc định PT0) */
const ptLop=(l,m)=>PTLOP[l+'|'+m]||'PT0';
const chiaPhan=(l,m)=>ptLop(l,m)!=='PT0'&&!!PTX[m];
const phanDs=m=>(PTX[m]?PTX[m].phan:[]).map(x=>({ma:x[0],ten:x[1]}));
const phanTen=(m,p)=>{const a=phanDs(m).find(z=>z.ma===p);return a?a.ten:p};
const ptTen=m=>PTX[m]?PTX[m].ten:'Toàn môn';
/* LICHPHAN['lop|mon'][phan] = {st, doan:[{tu,den,gv,bg}]}  — 🔗 M5.1 ⑤
   st  = so_tiet_tuan.  null ⇒ «bằng số tiết/tuần của môn» (HDPC ⑤ — để trống là MỘT nguồn sự thật)
   bg  = đoạn mang nhãn Bàn giao (M4.5 loai_phan — HDPC ⑥).  🛑 Bàn giao KHÔNG phải dạy thay. */
const LICHPHAN={};
/* RAI['lop|mon'] = ['P1','P1','P2',…] — bảng rải ĐÃ ĐÓNG BĂNG của M5.1 ⑤b, khóa «tiết thứ n
   của môn trong năm → phần». Có bảng này thì KHÔNG menu nào đọc lại vòng lặp. */
const RAI={};
const lpCua=(l,m)=>LICHPHAN[l+'|'+m]||{};
function doanCua(l,m,p,w){const r=lpCua(l,m)[p];if(!r)return null;
 return r.doan.find(d=>d.tu<=w&&w<=d.den)||null}
/* các phần PHỦ một tuần của một lớp — nguồn: bảng rải (nếu có) hoặc bảng ⑤ */
function phanTuan(l,m,w){
 const T=RAI[l+'|'+m];
 if(T){const k=tietSo(lop(l),m)||0,o={};
  for(let i=0;i<k;i++){const ma=T[(w-1)*k+i];if(ma)o[ma]=(o[ma]||0)+1}
  return Object.keys(o).map(ma=>({ma,st:o[ma]}))}
 const L=lpCua(l,m),out=[];
 Object.keys(L).forEach(p=>{if(L[p].doan.some(d=>d.tu<=w&&w<=d.den))
   out.push({ma:p,st:L[p].st==null?(tietSo(lop(l),m)||0):L[p].st})});
 return out;
}
/* ---- NHÁNH là DẪN XUẤT (HDPC ⑦) ----
   nen : môn một phần                                    ⇒ y hệt hôm nay
   B   : mọi tuần > 1 phần VÀ số tiết/tuần mỗi phần KHÔNG ĐỔI qua các tuần
                                                         ⇒ ô gắn phần, cố định cả năm
   A   : còn lại — mỗi tuần đúng 1 phần (nối tiếp), HOẶC song song khai bằng VÒNG LẶP
         (tỉ lệ không chia hết nên số tiết/tuần đổi theo tuần)
                                                         ⇒ ô KHÔNG gắn phần, giải theo NGÀY */
function nhanh(l,m){
 if(!chiaPhan(l,m))return 'nen';
 const T=RAI[l+'|'+m],k=tietSo(lop(l),m)||0;
 if(T){
  /* 🔑 Khai bằng VÒNG LẶP — điều kiện đúng là **từng VỊ TRÍ trong tuần luôn rơi vào cùng
     một phần ở mọi tuần**, tức độ dài vòng chia hết số tiết/tuần. Không được đo bằng
     «mỗi tuần có bao nhiêu tiết của từng phần»: vòng `[A,B,B,A]` với 2 tiết/tuần cho ra
     mỗi tuần đúng 1 A + 1 B ở MỌI tuần, nhưng ô thứ nhất là A ở tuần lẻ và B ở tuần chẵn. */
  if(!k||T.length<k)return 'A';
  for(let r=0;r<k;r++){const p0=T[r];
   for(let w=2;w<=SOTUAN_NAM;w++){const i=(w-1)*k+r;if(i>=T.length)break;
    if(T[i]!==p0)return 'A';}}
  const s={};for(let r=0;r<k;r++)s[T[r]]=1;
  return Object.keys(s).length>1?'B':'A';
 }
 let mx=0,sig=null,deu=true;
 for(let w=1;w<=SOTUAN_NAM;w++){
  const ps=phanTuan(l,m,w);if(!ps.length)continue;
  if(ps.length>mx)mx=ps.length;
  const s=ps.slice().sort((a,b)=>a.ma<b.ma?-1:1).map(p=>p.ma+':'+p.st).join(',');
  if(sig===null)sig=s;else if(s!==sig)deu=false;
 }
 if(mx<=1)return 'A';
 return deu?'B':'A';
}
/* tuần thứ mấy của năm học — NAMHOC.tu là 🔗 M10.1 */
const tuanCua=d=>Math.max(1,Math.min(SOTUAN_NAM,Math.floor((d-pdate(NAMHOC.tu))/604800000)+1));
let TUAN_XEM=tuanCua(HOMNAY);
/* các ô của một Lớp × Môn trong một bộ, sắp theo (thứ, tiết) — thứ tự này chính là thứ tự
   mà bảng rải ⑤b đánh số tiết trong tuần */
const oMon=(b,l,m)=>TKB[b].filter(x=>x.lop===l&&x.mon===m)
  .slice().sort((a,c)=>a.thu-c.thu||a.tiet-c.tiet);
/* PHẦN của một ô ở một TUẦN — nhánh A. Trả {ma,ten,gv,bg} hoặc null. */
function phanCuaO(b,o,w){
 const T=RAI[o.lop+'|'+o.mon];
 if(T){const os=oMon(b,o.lop,o.mon),k=os.length;if(!k)return null;
  const r=os.findIndex(x=>x.thu===o.thu&&x.tiet===o.tiet);if(r<0)return null;
  const ma=T[(w-1)*k+r];if(!ma)return null;
  const d=doanCua(o.lop,o.mon,ma,w);
  return {ma,ten:phanTen(o.mon,ma),gv:d?d.gv:null,bg:d?d.bg:false}}
 const ps=phanTuan(o.lop,o.mon,w);if(ps.length!==1)return null;
 const d=doanCua(o.lop,o.mon,ps[0].ma,w);if(!d)return null;
 return {ma:ps[0].ma,ten:phanTen(o.mon,ps[0].ma),gv:d.gv,bg:d.bg};
}
/* GIÁO VIÊN của một ô ở một TUẦN — nền và nhánh B trả thẳng o.gv (không đổi cả năm) */
function gvO(b,o,w){if(o.gv!=null)return o.gv;const p=phanCuaO(b,o,w);return p?p.gv:null}
const laA=o=>o.gv==null;
/* dãy GIAI ĐOẠN của một ô — gom tuần liền nhau cùng (phần, người) */
function giaiDoanO(b,o){
 const out=[];
 for(let w=1;w<=SOTUAN_NAM;w++){
  const p=phanCuaO(b,o,w),sg=p?p.ma+'|'+p.gv+'|'+(p.bg?1:0):'-';
  const last=out[out.length-1];
  if(last&&last.sg===sg){last.den=w;continue}
  out.push({sg,tu:w,den:w,ma:p?p.ma:null,ten:p?p.ten:'— chưa khai —',
    gv:p?p.gv:null,bg:p?p.bg:false});
 }
 return out;
}
const tenGV=g=>g==null?'chưa có người':ns(g).n;
/* ---- CHU KỲ của một ô (20/9/2026 — anh Ninh chốt `C-1`) ----
   Ô khai bằng VÒNG LẶP có chuỗi (phần, người) LẶP LẠI sau p tuần — p = N / ƯCLN(N, k).
   Gom theo «tuần liền nhau cùng người» ở ca đó cho ra HÀNG CHỤC dòng: ca so le 2 tuần
   một vòng ra 35 dòng, ca Khoa học tự nhiên 45·45·50 ra ~30 dòng cho MỖI ô. Bảng phụ
   bản in và chú giải rê chuột đều vỡ. Nên: có chu kỳ ⇒ gom theo CHU KỲ, không có ⇒ gom
   theo khoảng tuần như cũ (ca nối tiếp không tuần hoàn nên luôn rơi vào nhánh cũ). */
const CHUKY_TRAN=8;                       /* chu kỳ dài hơn thế thì đọc theo chu kỳ cũng rối */
function chuKyO(b,o){
 const sq=[];
 for(let w=1;w<=SOTUAN_NAM;w++){const p=phanCuaO(b,o,w);sq.push(p?p.ma+'|'+p.gv+'|'+(p.bg?1:0):'-')}
 for(let p=1;p<=CHUKY_TRAN;p++){
  let dung=true;
  for(let i=p;i<sq.length;i++)if(sq[i]!==sq[i-p]){dung=false;break}
  if(dung)return p;
 }
 return 0;
}
/* MỐC của một ô — hai dạng, cùng một hàm gọi: theo CHU KỲ hoặc theo KHOẢNG TUẦN */
function mocO(b,o){
 const p=chuKyO(b,o);
 if(!p)return {kieu:'doan',ds:giaiDoanO(b,o).filter(x=>x.ma)};
 const m={},th=[];
 for(let i=1;i<=p;i++){const q=phanCuaO(b,o,i);if(!q)continue;
  const k=q.ma+'|'+q.gv+'|'+(q.bg?1:0);
  if(!m[k]){m[k]={ma:q.ma,ten:q.ten,gv:q.gv,bg:q.bg,vi:[]};th.push(k)}
  m[k].vi.push(i);}
 return {kieu:'chuky',p,ds:th.map(k=>m[k])};
}
const nhanViTri=(p,vi)=>p===1?'mọi tuần'
 :p===2?(vi[0]===1?'tuần lẻ':'tuần chẵn')
 :'tuần '+vi.join(' · ')+' của mỗi chu kỳ '+p+' tuần';
const nhanMoc=(r,x)=>r.kieu==='chuky'?nhanViTri(r.p,x.vi):'tuần '+x.tu+'–'+x.den;
function tipO(b,o){const r=mocO(b,o);
 return r.ds.map(x=>nhanMoc(r,x)+': '+x.ten+' — '+tenGV(x.gv)+(x.bg?' (bàn giao)':'')).join(' · ')}
/* ---- BA NHÃN DẪN XUẤT (anh Ninh chốt `C-1` · 20/9/2026) ----
   🛑 Nhãn, KHÔNG phải trường dữ liệu và KHÔNG phải ô chọn. Tên nói về Ô, không nói về cách
   dạy: Khoa học tự nhiên 45·45·50 về nghiệp vụ LÀ dạy song song, nhưng với thời khóa biểu
   nó hành xử như so le — đặt tên theo cách dạy thì người xếp lịch kỳ vọng sai. */
function nhanKieu(l,m){
 const nh=nhanh(l,m);
 if(nh==='nen')return null;
 if(nh==='B')return {ma:'ss',ten:'Song song — ô cố định',
   mo:'ô <b>gắn phần</b>, người dạy <b>cố định cả năm</b>'};
 if(RAI[l+'|'+m])return {ma:'sl',ten:'So le — ô đổi theo tuần',
   mo:'ô <b>không gắn phần</b>, người dạy <b>đổi theo tuần</b> ⏱ — khai bằng vòng lặp, độ dài vòng <b>không chia hết</b> số tiết/tuần'};
 return {ma:'nt',ten:'Nối tiếp — từng giai đoạn',
   mo:'ô <b>không gắn phần</b>, mỗi phần chạy <b>một khoảng tuần</b> ⏱'};
}
/* dòng 2 và 3 của một ô — §3.1b: TÊN GIÁO VIÊN ĐẦY ĐỦ ở cả bốn góc nhìn */
function motaO(b,o,w){
 if(!laA(o))return (o.phan?`<span class="ph">${phanTen(o.mon,o.phan)}</span>`:'')
   +`<span class="g">${ns(o.gv).n}</span><span class="g2">${o.phong}</span>`;
 const p=phanCuaO(b,o,w),tip=tipO(b,o);
 return `<span class="ph gd" title="${tip}">⏱ ${p?p.ten:'chưa khai lịch'}${p&&p.bg?' 🤝':''}</span>`
  +`<span class="g" title="${tip}">${p?tenGV(p.gv):'—'}</span>`
  +`<span class="g2">${o.phong}</span>`;
}
/* ---- RÀNG BUỘC 9 — CỬA CHẶN THỨ HAI (HDPC ⑨ · M5.1 R18 là cửa thứ nhất) ----
   Một giáo viên không được đứng hai chỗ cùng (ô lịch, tuần). Ở nhánh A người dạy đổi
   theo tuần nên ràng buộc CỨNG §4.1 lúc đặt ô không nhìn thấy — chặn ở đây, lúc công bố. */
function kiemR9(b){
 const map={};
 TKB[b].forEach(o=>{
  for(let w=1;w<=SOTUAN_NAM;w++){
   const g=gvO(b,o,w);if(g==null)continue;
   const k=g+'|'+o.thu+'|'+o.tiet+'|'+w;(map[k]=map[k]||[]).push(o);
  }});
 const raw=[];
 Object.keys(map).forEach(k=>{const it=map[k];if(it.length<2)return;
  const a=k.split('|');
  raw.push({gv:+a[0],thu:+a[1],tiet:+a[2],w:+a[3],
    lops:[...new Set(it.map(x=>x.lop))].sort(),mons:[...new Set(it.map(x=>x.mon))]})});
 const g2={};
 raw.forEach(r=>{const kk=r.gv+'|'+r.thu+'|'+r.tiet+'|'+r.lops.join(',');(g2[kk]=g2[kk]||[]).push(r)});
 return Object.keys(g2).map(kk=>{const a=g2[kk];
  return {gv:a[0].gv,thu:a[0].thu,tiet:a[0].tiet,lops:a[0].lops,mons:a[0].mons,
    tuan:gomTuan(a.map(x=>x.w))}});
}
function gomTuan(ws){
 const a=[...new Set(ws)].sort((x,y)=>x-y),o=[];let tu=a[0],tr=a[0];
 for(let i=1;i<a.length;i++){if(a[i]===tr+1){tr=a[i];continue}o.push(tu===tr?''+tu:tu+'–'+tr);tu=tr=a[i]}
 o.push(tu===tr?''+tu:tu+'–'+tr);return o.join(' · ');
}
/* ---- C-2 (anh Ninh chốt 20/9/2026) — PHÉP KIỂM GIẢI NGƯỜI THEO TUẦN, chặn ngay lúc đặt ô ----
   Ô nhánh A không mang người dạy, nên ba phép kiểm neo vào giáo viên ở §4.1 không thấy gì.
   Nay máy giải người cho TỪNG TUẦN của năm học rồi so với các ô khác ở cùng ô lịch.
   🔑 Thuật toán xếp tự động §5 KHÔNG đổi một dòng: nó vốn đã bỏ qua ô có vi phạm CỨNG,
      nên chỉ cần phép kiểm trả thêm vi phạm là Greedy TỰ TRÁNH.
   🛑 Cửa chặn thứ hai lúc công bố (§6.3b · kiemR9) GIỮ NGUYÊN — hai cửa ở hai đầu, vì
      lịch triển khai phần và phân công còn sửa được SAU khi thời khóa biểu đã xếp xong. */
function dungHaiTuan(b,lId,m,t,n,gvCo){
 const oSlot=TKB[b].filter(x=>x.thu===t&&x.tiet===n&&x.lop!==lId);
 /* Ô đang đặt CÓ người cố định ⇒ §4.1 đã dò hết ô cũng có người; chỉ còn phải dò các ô
    nhánh A ở cùng chỗ. Ô đang đặt KHÔNG có người ⇒ phải dò mọi ô. */
 const canDo=gvCo!=null?oSlot.filter(x=>x.gv==null):oSlot;
 if(!canDo.length)return null;
 const gia={lop:lId,thu:t,tiet:n,mon:m,gv:gvCo==null?null:gvCo,phan:null,phong:phongCho(lId,m)};
 /* Với vòng lặp đã rải, phần của một ô phụ thuộc THỨ TỰ ô trong tuần, nên ô nhánh A phải
    được tính trên đúng bộ ô sẽ có SAU khi đặt — đưa ô giả vào bộ rồi mới giải. */
 const them=gvCo==null;
 if(them)TKB[b].push(gia);
 const hit={};
 try{
  for(let w=1;w<=SOTUAN_NAM;w++){
   const g=gvCo!=null?gvCo:gvO(b,gia,w);
   if(g==null)continue;
   for(const x of canDo){
    if(gvO(b,x,w)!==g)continue;
    const k=g+'|'+x.lop;
    if(!hit[k])hit[k]={gv:g,lop:x.lop,mon:x.mon,ws:[],
      phan:them?phanCuaO(b,gia,w):phanCuaO(b,x,w),beno:!them};
    hit[k].ws.push(w);
   }
  }
 } finally { if(them){const i=TKB[b].indexOf(gia);if(i>=0)TKB[b].splice(i,1)} }
 const ks=Object.keys(hit);
 return ks.length?ks.map(k=>({...hit[k],tuan:gomTuan(hit[k].ws)})):null;
}
/* ---- RÀNG BUỘC 10 — nhánh B: số ô gán cho mỗi phần = so_tiet_tuan của phần đó ---- */
function kiemR10(b){
 const out=[];
 LOP.filter(coCauHinh).forEach(l=>monCuaLop(l).forEach(m=>{
  if(nhanh(l.id,m)!=='B')return;
  const L=lpCua(l.id,m);
  phanDs(m).forEach(p=>{
   const can=L[p.ma]?(L[p.ma].st==null?tietSo(l,m):L[p.ma].st):0;
   const co=TKB[b].filter(x=>x.lop===l.id&&x.mon===m&&x.phan===p.ma).length;
   if(co!==can)out.push({lop:l.id,mon:m,phan:p.ten,co,can});
  });
 }));
 return out;
}
/* môn chia phần của một lớp — dùng cho dải nói ra mình đang đụng gì (§3c.5) */
const monChiaPhan=l=>monCuaLop(lop(l)).filter(m=>chiaPhan(l,m));

/* ================= DỮ LIỆU MẪU — bộ ca PC1 … PC6 (§7 sổ điều phối) =================
   Ô thời khóa biểu và người dạy theo phần khớp với demo M5.1 (PHIEU-GDDP-1A mục E8). */
(function(){
 const P=(l,m)=>{PTLOP[l+'|'+m]='PT1'};
 const L=(l,m,o)=>{LICHPHAN[l+'|'+m]=o};
 const D=(tu,den,gv,bg)=>({tu,den,gv,bg:!!bg});

 /* --- PC2 · PC15 — B SONG SONG chia hết: KHTN khối 6, 4 tiết/tuần = Lý 2 · Hóa 1 · Sinh 1 --- */

/* tiết cần xếp của một lớp — ĐÂY LÀ DANH SÁCH ĐẦU VÀO của bàn xếp và của Greedy §5.
   🔑 GDDP: cả cụm chỉ đổi ĐÚNG HÀM NÀY ở phía thuật toán.
     Trước — một dòng cho mỗi `Lớp × Môn`,        n  tiết/tuần
     Sau   — nhánh B: một dòng cho mỗi `Lớp × Môn × Phần`, nᵢ tiết/tuần (Σ nᵢ = n)
             nhánh nền và nhánh A: GIỮ NGUYÊN một dòng cho mỗi `Lớp × Môn`
   Vòng lặp Greedy, phép kiểm xung đột và bảng kết quả KHÔNG đổi một dòng nào. */
const coNguoiA=(l,m)=>Object.keys(lpCua(l,m)).some(p=>lpCua(l,m)[p].doan.some(d=>d.gv!=null));
function canXep(b,lId){
 const L=lop(lId);if(!coCauHinh(L))return[];
 const out=[],dem=(m,p)=>TKB[b].filter(x=>x.lop===lId&&x.mon===m&&(p?x.phan===p:true)).length;
 monCuaLop(L).forEach(m=>{
  const nh=nhanh(lId,m),khgd=coKHGD(L,m);
  if(nh==='B'){const LP=lpCua(lId,m);
   phanDs(m).forEach(p=>{const r=LP[p.ma];if(!r)return;
    const g=r.doan[0]?r.doan[0].gv:null;if(g==null)return;
    out.push({mon:m,phan:p.ma,pten:p.ten,gv:g,can:(r.st==null?tietSo(L,m):r.st),
      da:dem(m,p.ma),khgd})});
   return}
  if(nh==='A'){if(!coNguoiA(lId,m))return;
   out.push({mon:m,phan:null,pten:null,gv:null,A:1,can:tietSo(L,m),da:dem(m),khgd});return}
  const g=gvCua(lId,m);if(!g)return;
  out.push({mon:m,phan:null,pten:null,gv:g,can:tietSo(L,m),da:dem(m),khgd});
 });
 return out;
}

/* phần đã khai mà CHƯA có người — báo tại chỗ, đích danh (khuôn §3.1 «thiếu dữ liệu báo tại chỗ») */
function phanKhongGV(lId){

 monCuaLop(lop(lId)).forEach(m=>{if(nhanh(lId,m)==='nen')return;

/* ================= XẾP TỰ ĐỘNG (Greedy) ================= */
function greedy(b,ds,ghiLog){
 const ok=[],bo=[];
 ds.forEach(lId=>{
  canXep(b,lId).forEach(x=>{
   if(!x.khgd){bo.push([lId+' · '+x.mon,'Chưa phân kế hoạch giảng dạy — không biết xếp mấy tiết']);return}
   let con=x.can-x.da;
   for(const t of THU2()) for(const n of KHUNG.map(k=>k.n)){
    if(con<=0)break;
    const k=kiemDat(b,lId,x.mon,x.gv,t,n);
    if(k.cung.length)continue;
    if(TKB[b].some(y=>y.lop===lId&&y.thu===t&&y.mon===x.mon))continue; /* mềm: 1 tiết/môn/ngày */
    TKB[b].push({lop:lId,thu:t,tiet:n,mon:x.mon,gv:x.gv,phan:x.phan||null,phong:phongCho(lId,x.mon)});
    ok.push([lId+' · '+x.mon+(x.pten?' · '+x.pten:''),thuTen(t)+' tiết '+n]);con--;
   }
   if(con>0)bo.push([lId+' · '+x.mon,`Còn ${con} tiết — không còn slot nào thoả ràng buộc cứng`]);
  });
 });
 return {ok,bo};
}
const phongCho=(lId,m)=>{const L=lop(lId),ph=MONPHONG[m];
 if(!ph)return L.phong;
 return ph.find(p=>p.startsWith(L.dt==='Điểm trường A'?'P':'B'))||ph[0]};

/* GDDP — một ô có làm ai đó đứng HAI chỗ cùng (ô lịch, tuần) không.
   Dùng để dọn tay bộ đang áp dụng; rẻ hơn kiemR9 vì chỉ xét đúng một ô lịch. */
function dungHai(b,o,t,n){
 const gia={lop:o.lop,thu:t,tiet:n,mon:o.mon,gv:o.gv,phan:o.phan,phong:o.phong};
 for(let w=1;w<=SOTUAN_NAM;w++){
  const g=gvO(b,gia,w);if(g==null)continue;
  if(TKB[b].some(x=>x!==o&&x.thu===t&&x.tiet===n&&gvO(b,x,w)===g))return true;
 }
 return false;
}
/* Dọn xung đột nhánh A bằng cách DỜI Ô — đúng thao tác mà người xếp lịch làm tay trên bàn xếp
   sau khi cửa chặn thứ hai nêu đích danh. Ở demo, đây là bước dựng dữ liệu: bộ ĐANG ÁP DỤNG
   phải là một bộ đã sạch, còn bộ nháp B2 thì cố ý để bẩn cho ca PC16. */
function donR9(b,gioiHan){
 let doi=0;
 for(let lap=0;lap<(gioiHan||60);lap++){
  const vp=kiemR9(b);if(!vp.length)return doi;
  const v=vp[0],lopDoi=v.lops[v.lops.length-1];
  const i=TKB[b].findIndex(x=>x.lop===lopDoi&&x.thu===v.thu&&x.tiet===v.tiet);
  if(i<0)return -1;
  const o=TKB[b][i];TKB[b].splice(i,1);
  let dat=false;
  for(const t of THU2()){if(dat)break;
   for(const n of TIETKH.map(k=>k.n)){
    if(TKB[b].some(x=>x.lop===lopDoi&&x.thu===t&&(x.tiet===n||x.mon===o.mon)))continue;
    if(kiemDat(b,lopDoi,o.mon,o.gv,t,n).cung.length)continue;
    if(dungHai(b,o,t,n))continue;
    o.thu=t;o.tiet=n;TKB[b].push(o);dat=true;doi++;break;
   }}
  if(!dat){TKB[b].push(o);return -1}
 }
 return doi;
}

(function(){

})();

/* ===== KGLH-1G — B4: bộ ĐÃ CÔNG BỐ hẹn 07/12/2026 =====
   Kế thừa bộ đang áp dụng rồi đổi CÓ CHỦ Ý một ít ô, để DIFF (HDTKB ③) ra một tập
   HẸP và đọc được: vài lớp, vài giáo viên — không phải cả trường.
   Đây chính là điều khối ⑤ của hợp đồng phải chứng minh: báo thừa là một dạng báo sai. */
TKB.B4=TKB.B1.map(x=>({...x}));
(function(){

 TKB.B4.forEach(o=>{if(o.gv===4&&o.lop==='9A2')o.gv=13});
 /* ② đổi CHỖ: dời hai ô của 7A1 sang ô trống khác — chỉ nhận nước đi KHÔNG sinh vi phạm cứng,
    vì bộ này là bộ ĐÃ CÔNG BỐ, phải ký lại được (ràng buộc 12) */
 let doi=0;
 for(const o of TKB.B4.filter(x=>x.lop==='7A1')){
  if(doi>=2)break;
  const cu={thu:o.thu,tiet:o.tiet};
  const i=TKB.B4.indexOf(o);TKB.B4.splice(i,1);
  let dat=false;
  for(const th of THU2()){if(dat)break;
   for(const n of TIETKH.map(k=>k.n)){
    if(th===cu.thu&&n===cu.tiet)continue;
    if(TKB.B4.some(x=>x.lop==='7A1'&&(x.thu===th&&x.tiet===n||x.thu===th&&x.mon===o.mon)))continue;
    if(kiemDat('B4','7A1',o.mon,o.gv,th,n).cung.length)continue;
    o.thu=th;o.tiet=n;dat=true;break;
   }}
  TKB.B4.push(o);
  if(dat)doi++;else{o.thu=cu.thu;o.tiet=cu.tiet}
 }
 /* ③ đổi PHÒNG: một ô của 8A1 sang phòng cùng điểm trường KHÔNG ai dùng ở đúng ô lịch đó */
 const z=TKB.B4.find(x=>x.lop==='8A1'&&x.phong);
 if(z){const dtz=lop('8A1').dt;
  const pk=PHONG.find(p=>laPhongDay(p)&&p.dt===dtz&&p.ma!==z.phong
    &&!TKB.B4.some(x=>x.phong===p.ma&&x.thu===z.thu&&x.tiet===z.tiet));
  if(pk)z.phong=pk.ma}
})();

/* ⚙ §8.3 — tham số của TOÀN TRƯỜNG. Bề mặt tiêu thụ (M2.1, HDTTL khối ⑤, App)
   KHÔNG có mốc riêng. Ngưỡng còn treo: điểm 1G-P1 = 1C-P1, một câu hỏi hai phiếu. */

/* HDTKB ③ — phạm vi bị chạm là DIFF ô-theo-ô, khóa (lớp, thứ, tiết), ba trường so:
   môn · giáo viên · phòng. ⛔ KHÔNG bắn toàn trường. */
function diffBo(idMoi,idCu){
 const key=o=>o.lop+'|'+o.thu+'|'+o.tiet;
 const A={},B={};
 (TKB[idCu]||[]).forEach(o=>A[key(o)]=o);
 (TKB[idMoi]||[]).forEach(o=>B[key(o)]=o);
 const oLop={},oGv={};
 const cham=(o,n)=>{if(!o)return;oLop[o.lop]=(oLop[o.lop]||0)+n;
   const g=o.gv!=null?o.gv:null;if(g!=null)oGv[g]=(oGv[g]||0)+n};
 Object.keys({...A,...B}).forEach(k=>{
  const a=A[k],b=B[k];
  if(a&&b&&a.mon===b.mon&&a.gv===b.gv&&a.phong===b.phong)return;   /* không lệch */
  if(a&&b){cham(a,1);if(a.gv!==b.gv)cham(b,1);return}
  cham(a||b,1);
 });
 return {
  lop:Object.keys(oLop).sort().map(id=>({id,n:oLop[id]})),
  gv:Object.keys(oGv).map(Number).sort((x,y)=>x-y).map(id=>({id,ten:(ns(id)||{}).n||('GV '+id),n:oGv[id]}))
 };
}

 const pool=`<div class="pool"><div class="th">Tiết chưa xếp — lớp ${curLop}</div>

/* selMon mang khóa `mon|phan` — phần rỗng nghĩa là ô không gắn phần (nền · nhánh A) */
const selM=()=>selMon?selMon.split('|')[0]:null;
const selP=()=>selMon?(selMon.split('|')[1]||null):null;
const gvDat=(l,m,p)=>{const nh=nhanh(l,m);
 if(nh==='nen')return gvCua(l,m);
 if(nh==='A')return null;                       /* ô không mang người — giải theo NGÀY */

function datTiet(t,n){
 const b=moBan;if(!selMon){toast('Chọn một môn ở khối bên trái trước');return}

    <div class="ro">Ràng buộc <b>cứng</b> thì chặn. Ràng buộc <b>mềm</b> chỉ cảnh báo — phân loại khai ở tab ⚙.</div>`,
   `<button class="btn" data-x="close">Đóng</button>`);return}
 if(k.mem.length){

     — ${g==null?'⏱ người dạy theo giai đoạn':ns(g).n}</div>

    <button class="btn p" data-x="ok-dat" data-k="${t}|${n}">Vẫn đặt</button>`);return}
 doDat(t,n);
}
function doDat(t,n){

 TKB[b].push({lop:curLop,thu:t,tiet:n,mon:m,gv:g,phan:p,phong:phongCho(curLop,m)});

 const r=canXep(b,curLop).find(x=>x.mon===m&&(x.phan||'')===(p||''));
 if(conThieu(b,curLop)===0||(r&&r.da>=r.can))selMon=null;
 closeModal();render();
 toast(`✓ Đặt <b>${m}${p?' · '+phanTen(m,p):''}</b> vào ${thuTen(t)} tiết ${n} · phòng ${phongCho(curLop,m)}`
  +(g==null?' · <b>người dạy giải theo NGÀY</b> ở M4.7 ⏱':''));
}

/* liệt kê vi phạm của cả một bộ — dùng cho dải cảnh báo ở tab 1 và tab 2 */
function viPham(b,loc){
 const out=[];
 TKB[b].forEach(o=>{
  if(loc&&!loc(o))return;
  const save=TKB[b];TKB[b]=save.filter(x=>x!==o);
  const k=kiemDat(b,o.lop,o.mon,o.gv,o.thu,o.tiet);TKB[b]=save;
  k.cung.forEach(c=>out.push({m:'h',lop:o.lop,khi:thuTen(o.thu)+' tiết '+o.tiet,t:c}));
  k.mem.forEach(c=>out.push({m:'s',lop:o.lop,khi:thuTen(o.thu)+' tiết '+o.tiet,t:c}));
 });
 return out;
}
function thongKe(b){
 const can=LOP.filter(coCauHinh).reduce((a,l)=>a+canXep(b,l.id).reduce((x,y)=>x+y.can,0),0);
 const da=TKB[b].length;let cung=0,mem=0;
 TKB[b].forEach(o=>{const tmp=TKB[b].filter(x=>x!==o);const save=TKB[b];TKB[b]=tmp;
  const k=kiemDat(b,o.lop,o.mon,o.gv,o.thu,o.tiet);TKB[b]=save;cung+=k.cung.length;mem+=k.mem.length});
 return {can,da,thieu:Math.max(0,can-da),cung,mem};
}

     const sep=i>0&&KHUNG[i-1].b!==k.b?`<tr class="buoi"><td colspan="${THU2().length+1}">— nghỉ trưa —</td></tr>`:'';
     return sep+`<tr><td class="hr">Tiết ${k.n}<div class="mini">${k.bd}</div></td>

       return `<td><div class="cell ${os.length?'has':'co'}">${os.map(noi).join('<hr style="border:0;border-top:1px solid var(--line)">')}</div></td>`}).join('')}</tr>`}).join('')}

function apdungTab(){

 if(!B) return `<div class="empty">Chưa có bộ thời khóa biểu nào đang áp dụng.<br>

 if(r.pv==='own'){xemGoc='gv';xemAi=String(r.gvid)}

 /* cảnh báo vi phạm của bộ đang áp dụng, trong phạm vi lọc */
 const vp=viPham(b,o=>ls.some(l=>l.id===o.lop));
 const vh=vp.filter(x=>x.m==='h'),vs=vp.filter(x=>x.m==='s');
 const canh=(vh.length||vs.length)?`<div class="alerts" style="display:flex;flex-direction:column;gap:7px;margin-bottom:11px">
   ${vh.length?`<div class="danger" style="margin:0">⛔ <b>${vh.length} vi phạm ràng buộc CỨNG</b> trong bộ đang áp dụng —
     ${vh.slice(0,3).map(x=>`<b>${x.lop}</b> ${x.khi}`).join(' · ')}${vh.length>3?` · và ${vh.length-3} chỗ khác`:''}.
     <button class="btn xs" data-x="xem-vp" data-m="h">Xem tất cả</button></div>`:''}
   ${vs.length?`<div class="warn" style="margin:0">⚠ <b>${vs.length} vi phạm ràng buộc mềm</b> — không chặn, nhưng nên rà lại.
     <button class="btn xs" data-x="xem-vp" data-m="s">Xem tất cả</button></div>`:''}</div>`
  :`<div class="okbox">✓ Bộ đang áp dụng <b>không vi phạm ràng buộc nào</b> trong phạm vi đang lọc.</div>`;

 const bar=`<div class="bar">
   <span class="flab">Điểm trường</span>
   <select class="fs" id="fdt" ${r.pv==='branch'?'disabled':''}>
     <option ${curDT==='Toàn trường'?'selected':''}>Toàn trường</option>
     ${DTS.map(d=>`<option ${curDT===d?'selected':''}>${d}</option>`).join('')}</select>
   <span class="flab">Khối</span>
   <select class="fs" id="fkhoi"><option value="">Mọi khối</option>
     ${khoi.map(k=>`<option value="${k}" ${fKhoi===String(k)?'selected':''}>Khối ${k}</option>`).join('')}</select>
   <span class="seg">
     ${r.pv==='own'?'':`<button class="${xemGoc==='lop'?'on':''}" data-xg="lop">🏫 Theo lớp</button>`}
     <button class="${xemGoc==='gv'?'on':''}" data-xg="gv">👤 Theo giáo viên</button>
     ${r.pv==='own'?'':`<button class="${xemGoc==='phong'?'on':''}" data-xg="phong">🚪 Theo phòng</button>`}</span>
   <span class="flab">Tuần</span>
   <select class="fs" id="ftuan">${Array.from({length:SOTUAN_NAM},(_,i)=>i+1)
     .map(w=>`<option value="${w}" ${w===TUAN_XEM?'selected':''}>Tuần ${w}${w===tuanCua(HOMNAY)?' — tuần này':''}</option>`).join('')}</select>
   ${co('xuat')?`<button class="btn" data-x="xuat">⬇ Xuất</button>`:''}
   <div class="sum"><span>Bộ <b>${B.ten}</b> · áp dụng từ ${B.tu}</span>
     <span class="mini2">${B.ky||''}</span></div></div>`;

 const ro=`<div class="ro">Màn hình này <b>chỉ xem</b> — bộ đang áp dụng không sửa trực tiếp.
   Muốn đổi thì sang tab <b>Quản lý thời khóa biểu</b>, tạo bộ mới bằng <b>Sao chép</b> rồi công bố thay thế.</div>`;

 /* GDDP §3.6 — BẢN IN có bảng phụ «Người dạy theo giai đoạn» ở cuối tờ.
    🛑 Không nhét nhiều tên vào ô: môn 4 phần sẽ vỡ bố cục. */
 const oA=TKB[b].filter(x=>ls.some(l=>l.id===x.lop)&&laA(x));
 const bangPhu=oA.length?`<div class="listw" style="margin-top:12px"><div class="ch">Người dạy theo giai đoạn
    <span class="sp"></span><span class="mini">${oA.length} ô có người dạy đổi theo thời gian — bảng phụ này đi kèm bản in</span></div>
   <table><thead><tr><th>Lớp</th><th>Ô lịch</th><th>Môn</th><th>Kiểu</th><th>Giai đoạn</th><th>Phần</th><th>Người dạy</th></tr></thead><tbody>
   ${oA.slice().sort((a,c)=>a.lop<c.lop?-1:a.lop>c.lop?1:a.thu-c.thu||a.tiet-c.tiet)
     .map(o=>{const r=mocO(b,o),kb=nhanKieu(o.lop,o.mon);
      return r.ds.map((x,i)=>
       `<tr><td>${i?'':'<b>'+o.lop+'</b>'}</td><td>${i?'':thuTen(o.thu)+' tiết '+o.tiet}</td>

         <td>${tenGV(x.gv)}</td></tr>`).join('')}).join('')}
   </tbody></table>
   <div class="lgd"><span class="chip">🤝 <b>Bàn giao</b> là một ĐOẠN của phần — <b>không phải dạy thay</b> (M4.7 §4.6)</span>
    <span class="chip"><b>Nối tiếp</b> đọc theo <b>khoảng tuần</b> · <b>So le</b> đọc theo <b>chu kỳ</b> — hai cách gom khác nhau, cùng một bảng</span></div></div>`:'';

 let than='';
 if(xemGoc==='lop'){
  than=ls.map(l=>luoi(b,`Lớp <b>${l.id}</b>`,
    (t,n)=>TKB[b].filter(x=>x.lop===l.id&&x.thu===t&&x.tiet===n),
    o=>`${o.mon}${motaO(b,o,TUAN_XEM)}`,
    `<span class="mini2">${l.cap} · ${l.dt} · ${l.ss} HS · phòng ${l.phong}</span>`)).join('')
   ||'<div class="empty">Không có lớp nào khớp bộ lọc</div>';
 } else {
  const ds=xemGoc==='gv'
   ? [...new Set(TKB[b].map(x=>gvO(b,x,TUAN_XEM)).filter(g=>g!=null))].map(g=>[String(g),ns(g).n])

  const dsl=r.pv==='own'?ds.filter(x=>x[0]===String(r.gvid)):ds;
  if(!dsl.some(x=>x[0]===xemAi)) xemAi=dsl[0]?dsl[0][0]:null;
  const oc=(t,n)=>TKB[b].filter(x=>x.thu===t&&x.tiet===n)
    .filter(x=>xemGoc==='gv'?String(gvO(b,x,TUAN_XEM))===xemAi:x.phong===xemAi);
  const nhanP=o=>{if(!laA(o))return o.phan?`<span class="ph">${phanTen(o.mon,o.phan)}</span>`:'';
    const p=phanCuaO(b,o,TUAN_XEM);
    return `<span class="ph gd" title="${tipO(b,o)}">⏱ ${p?p.ten:'chưa khai lịch'}${p&&p.bg?' 🤝':''}</span>`};
  const noi=o=>xemGoc==='gv'
   ? `${o.lop}<span class="dtb ${lop(o.lop).dt==='Điểm trường B'?'b':''}">${dtMa[lop(o.lop).dt]}</span><span class="g">${o.mon}</span>${nhanP(o)}<span class="g2">${o.phong}</span>`
   : `${o.lop}<span class="g">${o.mon}</span>${nhanP(o)}<span class="g2">${tenGV(gvO(b,o,TUAN_XEM))}</span>`;
  than=`<div class="bar" style="padding-top:0">
     <select class="fs" id="fxem">${dsl.map(([v,n])=>`<option value="${v}" ${xemAi===v?'selected':''}>${n}</option>`).join('')}</select>
     ${xemGoc==='gv'?'<span class="mini">Gộp cả hai điểm trường — ô mang nhãn điểm trường · lịch của <b>tuần '+TUAN_XEM+'</b></span>':''}</div>`
   +luoi(b,xemGoc==='gv'?`Giáo viên <b>${xemAi?ns(+xemAi).n:''}</b>`:`Phòng <b>${xemAi||''}</b>`,oc,noi);
 }
 return bar+ro+canh+than+bangPhu;
}

let pkMon=null,pkTam=[];
function moChonPhong(m){

}
function veChonPhong(){
 const dsDT=[...new Set(PHONG.map(p=>p.dt))];
 modal(`Chọn phòng chuyên dụng — môn ${pkMon}`,
  `<div class="info">Danh mục phòng lấy từ <b>M6.4 Cơ sở vật chất</b> — M4.6 chỉ <b>đọc và đặt chỗ</b>,
    không tạo phòng. Thiếu phòng thì khai báo ở M6.4 rồi quay lại.</div>
   <input class="fldi" id="pkQ" placeholder="Tìm theo tên hoặc mã phòng…" value="">
   <div id="pkList" style="margin-top:11px">${veDsPhong('')}</div>`,
  `<button class="btn" data-x="close">Hủy</button>
   ${dlink('M6.4','Khai báo phòng mới tại M6.4','phong')}
   <button class="btn p" data-x="ok-phong">Lưu ${pkTam.length} phòng</button>`);
 setTimeout(()=>{const q=$('#pkQ');if(q)q.oninput=()=>{$('#pkList').innerHTML=veDsPhong(q.value)}},0);
}
function veDsPhong(q){
 const kq=x=>(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const k=kq(q);
 const ds=PHONG.filter(p=>laPhongDay(p)&&(!k||kq(p.ten).includes(k)||kq(p.ma).includes(k)));
 const nLoc=PHONG.filter(p=>!laPhongDay(p)).length;
 const locNote=nLoc?`<div class="mini2" style="margin-top:8px">Đã lọc bỏ <b>${nLoc}</b> phòng ở nội trú (M6.4) — không phải phòng dạy (PK-6).</div>`:'';
 const nhom={};ds.forEach(p=>{(nhom[p.dt]=nhom[p.dt]||[]).push(p)});
 if(!ds.length)return '<div class="empty" style="padding:18px">Không có phòng nào khớp</div>'+locNote;
 return locNote+Object.keys(nhom).map(d=>`<div class="mini" style="margin:9px 0 5px;font-weight:700">${d}</div>`
  +nhom[d].map(p=>`<div class="pk ${pkTam.includes(p.ma)?'on':''}" data-pk="${p.ma}">
     <input type="checkbox" ${pkTam.includes(p.ma)?'checked':''} style="pointer-events:none">
     <div class="sp"><b>${p.ten}</b> <span class="mini2">${p.ma}</span>
       <div class="mini2">${p.loai} · sức chứa ${p.sc}</div></div>
     ${p.loai==='Phòng bộ môn'?'<span class="tg a">bộ môn</span>':'<span class="tg c">phòng học</span>'}</div>`).join('')).join('');
}

  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role));

  /* ⑤ RÀNG BUỘC CỨNG §4.1 — gọi THẲNG kiemDat(), ⛔ không có phép kiểm thứ hai để nới */
  let o=null;
  if(!chan.length&&L&&L.dt===dt){
   const phanMa=nh==='B'?(phanDs(mon).find(x=>chuan(x.ten)===chuan(phanTep))||{}).ma:null;
   const g=gvDat(lId,mon,phanMa);
   const k=kiemDat(bo,lId,mon,g,thu,tiet);
   k.cung.forEach(m0=>chan.push(m0));
   k.mem.forEach(m0=>canh.push(m0+' — <i>ràng buộc mềm, ghi được</i>'));
   /* ⑥ nhánh A: cột Giáo viên dùng làm PHÉP KIỂM, ⛔ không làm dữ liệu ghi */
   if(!chan.length&&g==null&&gvTep){
    const ai=nguoiTuan(lId,mon,w).map(x=>ns(x)?ns(x).n:'?');
    if(ai.length&&!ai.some(n0=>chuan(n0)===chuan(gvTep))) canh.push(
      `Tệp ghi <b>${gvTep}</b>; lịch triển khai phần của M5.1 cho <b>tuần ${w}</b> là
       <b>${ai.join(' · ')}</b> — ô vẫn ghi <b>không mang người</b>, hai bên ⛔ không tự sửa cho nhau`);
   }
   if(!chan.length){
    o={lop:lId,thu,tiet,mon,gv:g,phan:phanMa,phong:phongCho(lId,mon)};
    TKB[bo].push(o);
   }
  }
  out.push({d,r,muc:chan.length?'chan':(canh.length?'canh':'ok'),ly:chan.length?chan:canh,o});
 });
 TKB[bo]=luu;                          /* trả lại — ⛔ soát KHÔNG ghi */
 return {tep:tepId,bo,dt,rows:out,
   chan:out.filter(x=>x.muc==='chan').length,
   canh:out.filter(x=>x.muc==='canh').length,
   ok:out.filter(x=>x.muc==='ok').length};
}

  `<button class="btn" data-x="dl" data-m="M10.1" data-c="tab=nam_hoc&o=ngay_bat_dau_van_hanh">↗ M10.1 — Ngày bắt đầu vận hành</button>
   <button class="btn" data-x="close">Đóng</button>`);
}

function kyDung(){
 const B=ban(ktBo);if(B){B.tt='apdung';B.tu=MOC_VH;B.ky='Trần Văn Hùng · 23/09/2026'}
 render();
 modal('✓ Đã đóng băng thành lịch',
  `<div class="okbox">Bộ <b>${B?B.ten:''}</b> → <b>Đang áp dụng</b> từ <b>${MOC_VH}</b>.
   M4.7 đã sinh lịch giảng dạy từ mốc ấy đến hết năm học.
   Từ đây <b>mọi menu đọc BẢNG</b>; công cụ xếp tự động của M4.6 <b>chỉ dùng cho kỳ sau</b>.</div>
   <div class="warn">🛑 <b>Lượt công bố này ⛔ KHÔNG sinh một sự kiện <code>HDTKB</code> nào.</b>
   Phạm vi người nhận của kênh báo trước là <b>DIFF ô-theo-ô với bộ đang áp dụng</b>
   (<code>HDTKB</code> ③) — mà ở đây <b>chưa từng có bộ đang áp dụng</b>.
   DIFF với một bộ <b>không tồn tại</b> là <b>không xác định</b>, ⛔ không phải «toàn bộ ô»:
   đọc theo kiểu «toàn bộ» thì cả trường nhận một tin
   <i>«thời khóa biểu của bạn đã thay đổi»</i> trong khi <b>chưa từng có lịch nào để đổi</b>.
   ⇒ Đây là <b>cách đọc đúng công thức đã có</b>, ⛔ không phải một ngoại lệ mới —
   khối 🔒 <code>HDTKB</code> <b>0 byte đổi</b>.</div>`,
  `<button class="btn" data-x="close">Đóng</button>`);
}

function hopDieuKien(){
 const dt=dtLo(),ls=LOP.filter(l=>l.dt===dt&&coCauHinh(l));
 const apd=BAN.find(B=>B.tt==='apdung');
 const co1=l=>apd?TKB[apd.id].some(x=>x.lop===l.id):false;
 const thieu=ls.filter(l=>!co1(l));
 return modal(`Điều kiện xong của bước <code>B11</code> — hạng <b>M</b> (máy kết luận)`,
  `<div class="ro">⛔ Cụm <code>KTLD</code> ⛔ không định nghĩa lại điều kiện — kiến trúc §7.1 đã chốt:
   <i>«Mọi lớp có thời khóa biểu đã đóng băng cho tuần hiện hành; mọi môn của lớp có KHGD và có phân công»</i>.
   Ba vế, <b>ba menu chủ</b>.</div>
   <table><thead><tr><th>Vế</th><th>Menu chủ</th><th>Máy đọc gì</th><th></th></tr></thead><tbody>
   <tr><td><b>Thời khóa biểu đã đóng băng</b></td><td><b>M4.6</b> — vế của menu này</td>
    <td>Mỗi <code>Lớp × Điểm trường</code> có <b>đúng một bộ «Đang áp dụng»</b> phủ tuần chứa
     <b>${MOC_VH}</b>, và bộ ấy <b>0 tiết chưa xếp · 0 vi phạm cứng</b>
     <div class="mini">⇒ chính là cửa chặn công bố đã có (ràng buộc 12), ⛔ không thêm phép kiểm nào</div></td>
    <td><span class="st2 ${thieu.length?'r':'o'}">${thieu.length?'còn '+thieu.length+' lớp':'đủ'}</span></td></tr>
   <tr><td>Mọi môn có KHGD</td><td>M5.1</td><td>⛔ M4.6 <b>chỉ đọc để nói thiếu gì</b></td>
    <td><button class="rolnk" data-x="dl" data-m="M5.1">↗ M5.1</button></td></tr>
   <tr><td>Mọi môn có phân công</td><td>M4.5</td><td>⛔ M4.6 ⛔ không kết luận thay</td>
    <td><button class="rolnk" data-x="dl" data-m="M4.5">↗ M4.5</button></td></tr>
   </tbody></table>
   ${thieu.length?`<div class="warn"><b>Còn thiếu:</b> ${thieu.map(l=>l.id).join(' · ')}
     — câu này chính là <code>moTaThieu()</code> mà khung luồng in ra.</div>`:''}
   <div class="danger">🛑 <b>Một TIỀN ĐỀ của <code>B11</code> chưa có chỗ trong bảng 14 bước:</b>
   <b>⚙ khung tiết học</b> của mỗi điểm trường (§8.1c — danh sách bộ giờ phủ kín năm học).
   ⛔ Không có nó thì một dòng <code>lớp × thứ × tiết</code> ⛔ <b>không có nghĩa</b> — «tiết 6» là tiết nào?
   <code>M10.1</code> F6 mục 6 đã bắt nó, nhưng <b>bắt ở CUỐI</b>.
   ⇒ <code>moTaThieu()</code> của <code>B11</code> nêu vế này <b>trước</b> — xem phiếu mục <code>P</code>.</div>
   <div class="ro">Khớp với <b>M10.1 F6 mục 9</b> <i>«Thời khóa biểu đã công bố — lớp chưa có TKB — ⛔»</i>:
   cùng một phép đếm, ⛔ hai nơi không được ra hai con số.</div>`,
  `<button class="btn" data-x="close">Đóng</button>`);
}

/* ------------------------------------------------------------------ sự kiện */
document.addEventListener('click',e=>{
 if(e.target.matches('input,select,textarea'))return;
 const t=e.target.closest('[data-x]');if(!t)return;
 const x=t.dataset.x;
 if(x==='kt-tt'){ktTT=ktTT==='dang_khoi_tao'?'dang_van_hanh':'dang_khoi_tao';render();return}
 if(x==='kt-mau'){hopMau();return}
 if(x==='kt-dk'){hopDieuKien();return}
 if(x==='kt-nap'){hopChonTep();return}
 if(x==='kt-tep'){
  const tp=t.dataset.t;
  if(tp!=='ok'){hopTuChoi(tp);return}
  let bo=t.dataset.b;
  if(bo==='__moi__'){bo='KT'+(++ktSeq);
   BAN.unshift({id:bo,ten:'Bảng đang chạy — nạp từ Excel '+dtLo(),tt:'nhap',tu:MOC_VH,
     ghi:`Lô ${MAU} · bước B11 của luồng khởi tạo lần đầu.`});
   TKB[bo]=[];}
  ktKQ=soat(tp,bo);hopDoiChieu();return}
 if(x==='kt-lop'){hopCapLop();return}
 if(x==='kt-ghi'){ghiLo();return}
 if(x==='kt-bo-qua'){toast('⬇ Đã tải <b>bo-qua.xlsx</b> — đúng hình dạng mẫu + cột <code>Lý do bị bỏ qua</code>');return}
 if(x==='kt-ky'){hopKy();return}
 if(x==='kt-ky-som'){kySom();return}
 if(x==='kt-ky-dung'){kyDung();return}
});

/* ------------------------------------------------- mở rộng bằng cách GÁN LẠI render */
const _veGoc=render;
render=function(){
 _veGoc.apply(null,arguments);
 if(tab==='ql'&&!moBan){const c=$('#content');if(c)c.insertAdjacentHTML('afterbegin',dai())}
};

})();
render();
</script>
