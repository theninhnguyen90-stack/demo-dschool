<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4.6 Thời khóa biểu — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.flab{font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:-3px}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}
.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}.st2.v{background:#ede9fe;color:#5b21b6}

.listw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:190px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}tr.badrow{background:var(--red-soft)}
tr.grp td{background:#f8fafc;font-weight:700;font-size:11.5px}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.empty{padding:32px;text-align:center;color:var(--ink3)}
.mini{font-size:10.5px;color:var(--ink3);font-weight:400}
.nodata{color:var(--red);font-weight:700}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:800px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}
.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}

/* ---------- BÀN XẾP ---------- */
.board{display:flex;gap:13px;align-items:flex-start}
.pool{width:250px;flex:0 0 250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pool .th{padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.pbody{padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.tchip{border:1px solid var(--line2);border-left:3px solid var(--brand);border-radius:9px;padding:6px 9px;font-size:12.5px;background:#fff;cursor:grab}
.tchip:hover{background:var(--brand-soft);border-color:var(--brand)}
.tchip.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.tchip.sel .mini{color:#c7d2fe}
.tchip.done{opacity:.45;border-left-color:var(--green);cursor:default}
.tchip b{display:block}
.gridw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
.tkb{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}
.tkb th{position:sticky;top:0;z-index:2;background:#f8fafc;font-size:11px;padding:8px 6px;text-align:center;text-transform:none;letter-spacing:0}
.tkb td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.tkb td.hr{background:#f8fafc;font-size:10.5px;color:var(--ink3);text-align:center;padding:4px 6px;white-space:nowrap;font-weight:700;position:sticky;left:0;z-index:1}
.tkb tr.buoi td{background:#eef2f7;font-size:10.5px;font-weight:700;color:var(--ink2);text-align:center;padding:3px}
.cell{min-height:60px;padding:5px 6px;font-size:11.5px;line-height:1.35;cursor:pointer;display:flex;flex-direction:column;justify-content:center;position:relative}
.cell:hover{background:var(--brand-soft)}
.cell.has{background:#f8fafc;cursor:default}
.cell.has b{font-weight:700}
.cell.has .g{color:var(--ink2);font-size:11px;font-weight:600;display:block;word-break:break-word}
.cell.has .g2{color:var(--ink3);font-size:10px;display:block}
.cell.bad{background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red)}
.cell.soft{background:var(--amber-soft)}
.cell .x{position:absolute;top:2px;right:3px;font-size:10px;color:var(--red);font-weight:700;display:none}
.cell.has:hover .x{display:block}
.cell.drop{outline:2px dashed var(--brand);outline-offset:-3px;background:var(--brand-soft)}
.cell.co{background:#fafbfc;color:var(--ink3);cursor:default}
.cflist{margin-top:12px}
.cfrow{display:flex;align-items:flex-start;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.cfrow:last-child{border-bottom:none}
.cfrow.h{background:var(--red-soft);color:#991b1b}
.cfrow.s{background:var(--amber-soft);color:#92400e}
.dtb{font-size:9px;font-weight:800;border-radius:4px;padding:0 4px;margin-left:3px;background:#e0e7ff;color:#3730a3}
.dtb.b{background:#fef3c7;color:#92400e}
.bnrow{display:grid;grid-template-columns:2fr 1.1fr 1fr 1fr 1.2fr 1.5fr;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center;font-size:12.5px}
.bnrow:last-child{border-bottom:none}
.bnrow.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.hdrow{display:grid;grid-template-columns:2fr 1.1fr 1fr 1fr 1.2fr 1.5fr;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.bar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.bar2 i{display:block;height:100%;background:var(--green)}
.bar2 i.w{background:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin:12px 0 0}
.crumb b{color:var(--ink)}
.crumb .bk{border:1px solid var(--line2);border-radius:8px;padding:4px 11px;font-size:12.5px;background:#fff}
.crumb .bk:hover{background:var(--bg)}
.gridcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.gridcard>.ch{padding:8px 12px}
.mini2{font-size:11px;color:var(--ink3)}
.pk{display:flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
.pk:hover{border-color:var(--brand);background:var(--brand-soft)}
.pk.on{border-color:var(--brand);background:var(--brand-soft)}
.pk .sp{flex:1}
.pchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;
 padding:2px 8px;font-size:11.5px;background:#f8fafc;margin:2px 3px 2px 0}
.pchip .x{color:var(--red);font-weight:700;cursor:pointer;font-size:11px}
.timei{width:78px;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums}
.timei:disabled{background:#f1f5f9;color:var(--ink2)}
.sw{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.sw button{padding:3px 10px;font-size:11px;font-weight:700;background:#fff;color:var(--ink3)}
.sw button+button{border-left:1px solid var(--line2)}
.sw button.on.c{background:var(--red);color:#fff}
.sw button.on.m{background:var(--amber);color:#fff}
.sw button:disabled{cursor:not-allowed;opacity:.55}
.dayb{font-size:11.5px;font-weight:700;border:1px solid var(--line2);border-radius:7px;padding:3px 10px;background:#fff;color:var(--ink2)}
.dayb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.numi{width:74px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-variant-numeric:tabular-nums}
.numi:disabled{background:#f1f5f9;color:var(--ink2)}
</style>
</head>

<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="VT">Văn thư</button>
  <button class="rb" data-r="PDT">PHT Điểm trường A</button>
  <button class="rb" data-r="PCM">PHT Chuyên môn</button>
  <button class="rb" data-r="HT">Hiệu trưởng</button>
  <button class="rb" data-r="GV">Giáo viên</button>
  <span class="note">TKB là <b>mẫu tuần</b> — nghiệp vụ hàng ngày đọc <b>Lịch giảng dạy M4.7</b></span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"><option>Năm học 2026-2027</option><option>Năm học 2025-2026</option></select>
  <select class="sel" id="hdt"><option>Toàn trường</option><option>Điểm trường A</option><option>Điểm trường B</option></select>
  <span class="lockico" id="dtlock"></span>
  <div class="spacer"></div>
  <button class="icobtn">🔔<span class="dot" id="ndot">3</span></button>
  <button class="icobtn">💬<span class="dot">2</span></button>
  <div class="avatar" id="ava">DQ</div>
</header>

<div class="wrap">
  <main class="main">
    <div class="tophd"><h1>Thời khóa biểu</h1><div class="spacer"></div><span id="topact"></span></div>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

  <div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf" id="mf"></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const HOMNAY=new Date(2026,10,28);
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4200)}
function closeModal(){$('#mask').classList.remove('on')}
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}

const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','3'],['M0.3','Thông báo'],['M0.4','Trang cá nhân']]],
 ['lh','📚 Lớp học hàng ngày',[['M2.1','Lịch dạy và học'],['M2.2','Sổ đầu bài']]],
 ['ns','👨‍🏫 Nhân sự',[['M4.1','Hồ sơ nhân sự'],['M4.2','Biến động nhân sự'],['M4.3','Chức danh & Điểm công tác'],
   ['M4.4','Quản lý giáo viên'],['M4.5','Phân công giảng dạy'],['M4.6','Thời khóa biểu','3'],
   ['M4.7','Lịch giảng dạy & Dạy thay'],['M4.8','Nghỉ phép'],['M4.9','Chấm công nhân sự'],
   ['M4.10','Khen thưởng & Kỷ luật NS'],['M4.11','Chứng thư số']]],
 ['vh','🏫 Vận hành',[['M6.4','Cơ sở vật chất']]],
 ['qt','⚙️ Quản trị',[['M10.2','Cơ cấu tổ chức'],['M10.6','Trung tâm cấu hình']]],
];

/* ================= VAI TRÒ =================
 viec: xep · auto · duyet · ky · capnhat(⚙) · dichuyen · xuat */

const oCua=(b,lId,t,n)=>TKB[b].find(x=>x.lop===lId&&x.thu===t&&x.tiet===n);
const gvSlot=(b,g,t,n)=>TKB[b].filter(x=>x.gv===g&&x.thu===t&&x.tiet===n);
function kiemDat(b,lId,m,g,t,n){
 const L=lop(lId),cung=[],mem=[];
 const day=(id,msg)=>{(laCung(id)?cung:mem).push(msg)};
 if(oCua(b,lId,t,n)) day('lop2tiet',`Lớp ${lId} đã có tiết ở ${thuTen(t)} tiết ${n}`);
 const trung=gvSlot(b,g,t,n);
 if(trung.length){
  const kh=trung.find(x=>lop(x.lop).dt!==L.dt);
  if(kh) day('crossDT',`${ns(g).n} đang dạy <b>${kh.lop}</b> ở <b>${lop(kh.lop).dt}</b> cùng ${thuTen(t)} tiết ${n} — <b>hai điểm trường cùng lúc</b>`);
  else   day('gv2lop', `${ns(g).n} đang dạy lớp <b>${trung[0].lop}</b> cùng ${thuTen(t)} tiết ${n}`);
 }
 const ph=MONPHONG[m];
 if(ph){const p0=phongCho(lId,m);
  const bn=TKB[b].find(x=>x.thu===t&&x.tiet===n&&x.phong===p0&&x.lop!==lId);
  if(bn) day('phong',`Phòng <b>${p0}</b> đã bị lớp ${bn.lop} dùng ở ${thuTen(t)} tiết ${n}`);
 }
 TKB[b].filter(x=>x.gv===g&&x.thu===t).forEach(x=>{
  const dtX=lop(x.lop).dt; if(dtX===L.dt)return;
  const can=dcPhut(dtX,L.dt); if(!can)return;
  const [a1,a2]=x.tiet<n?[x,{tiet:n}]:[{tiet:n},x];
  if(!tiet(a1.tiet)||!tiet(a2.tiet))return;
  const nghi=phut(tiet(a2.tiet).bd)-phut(tiet(a1.tiet).kt);
  if(nghi<can) day('dichuyen',
   `Không kịp di chuyển: ${ns(g).n} có tiết ${a1.tiet} ở <b>${x.tiet<n?dtX:L.dt}</b> (kết thúc ${tiet(a1.tiet).kt})
    rồi tiết ${a2.tiet} ở <b>${x.tiet<n?L.dt:dtX}</b> (bắt đầu ${tiet(a2.tiet).bd}) — chỉ có <b>${nghi} phút</b>, cần <b>${can} phút</b>`);
 });
 const cungMon=TKB[b].filter(x=>x.lop===lId&&x.thu===t&&x.mon===m);
 if(cungMon.some(x=>Math.abs(x.tiet-n)===1)) day('lienNhau',`Hai tiết ${m} liền nhau trong ${thuTen(t)}`);
 if(rb('tietCuoi').ds.includes(m)&&n>=KHUNG.filter(k=>k.b==='C').slice(-1).map(k=>k.n)[0]-0)
   day('tietCuoi',`${m} xếp vào tiết cuối buổi chiều`);
 const lt=TKB[b].filter(x=>x.gv===g&&x.thu===t).map(x=>x.tiet).concat(n).sort((a,b)=>a-b);
 let run=1,mx=1;for(let i=1;i<lt.length;i++){run=lt[i]===lt[i-1]+1?run+1:1;mx=Math.max(mx,run)}
 if(mx>rb('lienTiep').v) day('lienTiep',`${ns(g).n} dạy ${mx} tiết liên tiếp trong ${thuTen(t)} (trần ${rb('lienTiep').v})`);
 return {cung,mem};
}
/* tiết cần xếp của một lớp */
function canXep(b,lId){
 const L=lop(lId);if(!coCauHinh(L))return[];
 return monCuaLop(L).map(m=>{const g=gvCua(lId,m);
  const da=TKB[b].filter(x=>x.lop===lId&&x.mon===m).length;
  return {mon:m,gv:g,can:tietSo(L,m),da,khgd:coKHGD(L,m)}}).filter(x=>x.gv);
}
const monKhongGV=lId=>monCuaLop(lop(lId)).filter(m=>!gvCua(lId,m));
const conThieu=(b,lId)=>canXep(b,lId).reduce((a,x)=>a+Math.max(0,x.can-x.da),0);

/* ================= XẾP TỰ ĐỘNG (Greedy) ================= */
function greedy(b,ds,ghiLog){
 const ok=[],bo=[];
 ds.forEach(lId=>{
  canXep(b,lId).forEach(x=>{
   if(!x.khgd){bo.push([lId+' · '+x.mon,'Chưa phân kế hoạch giảng dạy — không biết xếp mấy tiết']);return}
   let con=x.can-x.da;
   for(const t of THU2()) for(const n of KHUNG.map(k=>k.n)){
    if(con<=0)break;
    const k=kiemDat(b,lId,x.mon,x.gv,t,n);
    if(k.cung.length)continue;
    if(TKB[b].some(y=>y.lop===lId&&y.thu===t&&y.mon===x.mon))continue; /* mềm: 1 tiết/môn/ngày */
    TKB[b].push({lop:lId,thu:t,tiet:n,mon:x.mon,gv:x.gv,phong:phongCho(lId,x.mon)});
    ok.push([lId+' · '+x.mon,thuTen(t)+' tiết '+n]);con--;
   }
   if(con>0)bo.push([lId+' · '+x.mon,`Còn ${con} tiết — không còn slot nào thoả ràng buộc cứng`]);
  });
 });
 return {ok,bo};
}
const phongCho=(lId,m)=>{const L=lop(lId),ph=MONPHONG[m];
 if(!ph)return L.phong;
 return ph.find(p=>p.startsWith(L.dt==='Điểm trường A'?'P':'B'))||ph[0]};

       <table style="margin-top:6px"><thead><tr><th>Lớp · Môn</th><th>Lý do</th></tr></thead><tbody>
       ${r.bo.map(z=>`<tr><td><b>${z[0]}</b></td><td>${z[1]}</td></tr>`).join('')}</tbody></table></div>`:''}
     <div class="ro" style="margin-top:11px"><b>Chỉ điền vào ô trống</b> — không đụng phần đã xếp tay.
      Tự động mà không nói mình đã làm gì thì người dùng phải rà lại tay toàn bộ.</div>`,
    `<button class="btn p" data-x="close">Đóng</button>`);return}

 /* --- T2 --- */
 if(t.dataset.ban&&!x){moBan=t.dataset.ban;selMon=null;render();return}
 if(x==='mo-bo'){moBan=t.dataset.b;selMon=null;render();return}
 if(x==='ve-ql'){moBan=null;selMon=null;render();return}
 if(x==='tao-trang'){
   const id='B'+(BAN.length+1+Math.floor(Math.random()*900));
   BAN.push({id,ten:'Bộ mới — '+d2s(HOMNAY),tt:'nhap',tu:d2s(HOMNAY),ghi:'Tạo trắng, chưa xếp tiết nào'});
   TKB[id]=[];moBan=id;render();
   toast('+ Đã tạo <b>bộ trắng</b> — chưa có tiết nào, dùng ⚡ Xếp tự động hoặc kéo thả từng lớp');return}
 if(x==='clone'){
   const g=ban(t.dataset.b),id='B'+(BAN.length+1+Math.floor(Math.random()*900));
   BAN.push({id,ten:g.ten+' — bản sao',tt:'nhap',tu:d2s(HOMNAY),ghi:'Sao chép từ '+g.ten});
   TKB[id]=TKB[g.id].map(z=>({...z}));moBan=id;render();
   toast(`⧉ Đã sao chép <b>${g.ten}</b> thành bộ nháp mới (${TKB[id].length} tiết) · bản gốc giữ nguyên`);return}
 if(x==='xoa-bo'){const B=ban(t.dataset.b);
   modal('Xóa bộ thời khóa biểu',
    `<div class="warn">Xóa <b>${B.ten}</b> và toàn bộ <b>${TKB[B.id].length} tiết</b> đã xếp trong đó.</div>
     <div class="ro">Chỉ xóa được bộ ở trạng thái <b>Nháp</b>. Bộ đã công bố hoặc đã kết thúc
      <b>không xóa được</b> — giữ để đối chiếu với Lịch giảng dạy và chấm công.</div>`,
    `<button class="btn" data-x="close">Hủy</button>
     <button class="btn d" data-x="ok-xoa-bo" data-b="${B.id}">Xóa</button>`);return}
 if(x==='ok-xoa-bo'){const id=t.dataset.b,n=ban(id).ten;
   BAN=BAN.filter(z=>z.id!==id);delete TKB[id];if(moBan===id)moBan=null;closeModal();render();
   toast(`Đã xóa bộ <b>${n}</b>`);return}
 if(x==='xem-vp'){moViPham(t.dataset.m);return}
 if(x==='trinh'){ban(t.dataset.b).tt='cho';render();toast('Đã trình duyệt — chờ Phó HT Điểm trường');return}
 if(x==='duyet'){ban(t.dataset.b).tt='duyet';render();toast('✓ Đã duyệt — chờ Hiệu trưởng ký công bố');return}
 if(x==='ky'){moKy(t.dataset.b);return}
 if(x==='doi-chieu'){moDoiChieu(t.dataset.b);return}
 if(x==='ok-ky'){const B=ban(t.dataset.b),ngay=$('#kyNgay')?$('#kyNgay').value:B.tu;
   B.ky='Trần Văn Hùng · '+d2s(HOMNAY);B.tu=ngay;
   const luon=$('#kyNgay')&&$('#kyLuon')&&$('#kyLuon').checked;
   if(luon){const cu=banApDung();
     if(cu){cu.tt='ketthuc';cu.ketNgay=d2s(HOMNAY)}
     B.tt='apdung';}
   else B.tt='congbo';
   closeModal();moBan=null;render();
   toast(luon
    ? `✍ Đã công bố <b>${B.ten}</b> · <b>thay thế bộ đang áp dụng ngay</b> · bộ cũ chuyển <b>Đã kết thúc</b> · Lịch giảng dạy M4.7 sinh lại, giữ nguyên 37 tiết đã can thiệp tay`
    : `✍ Đã công bố <b>${B.ten}</b> · <b>hẹn áp dụng từ ${ngay}</b> · đến ngày đó tự thay bộ hiện hành`);return}
 if(x==='huy-cb'){const B=ban(t.dataset.b);B.tt='duyet';B.ky=null;render();
   toast(`↩ Đã hủy công bố <b>${B.ten}</b> — bộ đang áp dụng giữ nguyên`);return}
 if(x==='so-sanh'){
   modal('So sánh bản nháp',
    `<table><thead><tr><th>Bản</th><th>Trạng thái</th><th class="num">Đã xếp</th>
      <th class="num">Chưa xếp</th><th class="num">Vi phạm cứng</th><th class="num">Vi phạm mềm</th></tr></thead><tbody>
     ${BAN.map(B=>{const s=thongKe(B.id);
       return `<tr class="${s.cung?'badrow':''}"><td><b>${B.ten}</b></td><td>${stBAN[B.tt][0]}</td>
        <td class="num">${s.da}/${s.can}</td><td class="num">${s.thieu}</td>
        <td class="num">${s.cung}</td><td class="num">${s.mem}</td></tr>`}).join('')}</tbody></table>
     <div class="ro" style="margin-top:11px">Chọn bản có <b>vi phạm cứng bằng 0</b> và <b>vi phạm mềm thấp nhất</b>.
      Bản còn vi phạm cứng <b>không ký được</b>.</div>`,
    `<button class="btn p" data-x="close">Đóng</button>`);return}

 /* --- T4 ⚙ cấu hình --- */
 if(t.dataset.rbl){
   const [id,l]=t.dataset.rbl.split('|'),r=rb(id);
   if(!r.doi){toast('⛔ Ràng buộc này không đổi được — vi phạm vật lý, không phải lựa chọn của trường');return}
   r.loai=l;render();
   toast(`Ràng buộc <b>${r.ten}</b> nay là <b>${l==='cung'?'CỨNG — hệ thống CHẶN':'MỀM — chỉ cảnh báo'}</b>`);return}
 if(t.dataset.ngay){
   const d=+t.dataset.ngay;
   if(d===5){const n=Object.keys(TKB).reduce((a,k)=>a+TKB[k].filter(z=>z.thu===7).length,0);
     if(n){modal('⛔ Không bỏ được Thứ 7',
       `<div class="danger">Đang có <b>${n} tiết</b> xếp vào Thứ 7 ở các bản thời khóa biểu.
         Bỏ ngày dạy thì những tiết đó <b>mất chỗ mà không ai biết</b>.</div>
        <div class="ro">Gỡ hết tiết Thứ 7 ở bàn xếp trước, rồi mới đổi số ngày dạy.</div>`,
       `<button class="btn" data-x="close">Đóng</button>`);return}}
   NGAYDAY=d;render();toast(`Số ngày dạy: <b>${d} ngày</b> · lưới xếp cập nhật ngay`);return}
 if(x==='them-tiet'){
   const b0=t.dataset.b,mx=Math.max(...KHUNG.map(k=>k.n));
   const last=KHUNG.filter(k=>k.b===b0).slice(-1)[0];
   const bd=last?themPhut(last.kt,5):(b0==='S'?'07:00':'13:30');
   KHUNG.push({n:mx+1,b:b0,bd,kt:themPhut(bd,45)});
   KHUNG.sort((a,b)=>(a.b===b.b?0:a.b==='S'?-1:1)||a.n-b.n);
   render();toast(`+ Thêm <b>tiết ${mx+1}</b> buổi ${b0==='S'?'sáng':'chiều'} · ${bd} → ${themPhut(bd,45)}`);return}
 if(x==='xoa-tiet'){
   const n=+t.dataset.n;
   const d=Object.keys(TKB).reduce((a,k)=>a+TKB[k].filter(z=>z.tiet===n).length,0);
   if(d){modal('⛔ Không xóa được tiết này',
     `<div class="danger">Tiết ${n} đang được dùng ở <b>${d} chỗ</b> trong các bản thời khóa biểu.</div>
      <div class="ro">Gỡ hết tiết đó ở bàn xếp trước. Xóa thẳng thì <b>mất tiết mà không ai biết</b> —
       đúng kiểu lỗi chỉ phát hiện khi giáo viên đến lớp.</div>`,
     `<button class="btn" data-x="close">Đóng</button>`);return}
   KHUNG=KHUNG.filter(k=>k.n!==n);render();toast(`Đã xóa tiết ${n} khỏi khung`);return}
 if(x==='ky-khung'){BANHANH=d2s(HOMNAY);render();
   toast('✍ Đã ký ban hành khung tiết học · Ký số Nhóm A · ghi audit và đồng bộ M4.11');return}
 if(x==='them-mp'){const m=$('#mpMon').value;if(!m)return;
   MONPHONG[m]=[];render();moChonPhong(m);
   toast(`Môn <b>${m}</b> nay cần phòng chuyên dụng — chọn phòng từ danh mục M6.4`);return}
 if(x==='chon-phong'){moChonPhong(t.dataset.m);return}
 if(t.dataset.pk){const p=t.dataset.pk;
   const i=pkTam.indexOf(p); i<0?pkTam.push(p):pkTam.splice(i,1);
   veChonPhong();return}
 if(x==='ok-phong'){
   if(!pkTam.length){toast('⛔ Chọn ít nhất một phòng, hoặc bỏ môn này khỏi danh sách cần phòng chuyên dụng');return}
   MONPHONG[pkMon]=pkTam.slice();closeModal();render();
   toast(`✓ Môn <b>${pkMon}</b> dùng ${pkTam.length} phòng: ${pkTam.join(', ')} · mọi tiết của môn đổi phòng theo`);return}
 if(x==='bo-phong'){const m=t.dataset.m;
   MONPHONG[m]=MONPHONG[m].filter(p=>p!==t.dataset.p);render();
   toast(`Đã bỏ phòng <b>${t.dataset.p}</b> khỏi môn ${m}`);return}
 if(x==='xoa-mp'){delete MONPHONG[t.dataset.m];render();
   toast(`<b>${t.dataset.m}</b> nay dùng phòng cố định của lớp, không kiểm trùng phòng nữa`);return}

 if(x==='xuat'){
   modal('Xuất thời khóa biểu',
    `<label class="lbl">Bản xuất</label><select class="fldi">
      <option>TKB theo lớp — bản dán bảng tin</option><option>TKB cá nhân từng giáo viên</option>
      <option>TKB theo phòng học</option><option>Tổng hợp toàn trường</option></select>
     <label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>
     <select class="fldi" id="mdx"><option value="">— Chọn mục đích —</option>
      <option>Dán bảng tin lớp</option><option>Phát cho giáo viên</option>
      <option>Báo cáo Phòng · Sở Giáo dục</option><option>Lưu hồ sơ nhà trường</option></select>
     <div class="ro" style="margin-top:11px">Mọi lượt xuất <b>ghi audit</b> kèm mục đích, người xuất và thời điểm.</div>`,
    `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-xuat">⬇ Xuất</button>`);return}
 if(x==='ok-xuat'){if(!$('#mdx').value){toast('⛔ Bắt buộc chọn mục đích sử dụng trước khi xuất');return}
   closeModal();toast('⬇ Đã xuất · ghi audit kèm mục đích, người xuất và thời điểm');return}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fkhoi'){fKhoi=el.value;render();return}
 if(el.id==='fdt'){curDT=el.value;selMon=null;render();return}
 if(el.id==='flop'){curLop=el.value;selMon=null;render();return}
 if(el.id==='fxem'){xemAi=el.value;render();return}
 if(el.id==='hdt'){if(el.value!=='Toàn trường')curDT=el.value;render();return}
 if(el.dataset.dc){DICHUYEN[el.dataset.dc]=+el.value;render();toast('Đã đổi thời gian di chuyển — mọi ràng buộc tính lại');return}
 if(el.dataset.rbv){rb(el.dataset.rbv).v=+el.value;render();
   toast('Đã đổi trần — mọi tiết đã xếp tính lại vi phạm mềm');return}
 if(el.dataset.rbds){rb(el.dataset.rbds).ds=el.value.split(',').map(x=>x.trim()).filter(Boolean);render();
   toast('Đã đổi danh sách môn tránh tiết cuối');return}
 if(el.dataset.kt){const[n,w]=el.dataset.kt.split('|');const k=tiet(+n);
   if(!/^\d{1,2}:\d{2}$/.test(el.value)){toast('⛔ Giờ phải theo dạng HH:MM');render();return}
   k[w]=el.value;render();
   toast(`Tiết ${n} nay ${k.bd} → ${k.kt} · <b>ràng buộc thời gian di chuyển tính lại</b>`);return}
});
/* kéo thả */
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-tm]');
 if(!c)return;selMon=c.dataset.tm;e.dataTransfer.setData('text/plain',selMon)});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-o]');if(!c)return;
 e.preventDefault();c.classList.add('drop')});
document.addEventListener('dragleave',e=>{const c=e.target.closest('[data-o]');if(c)c.classList.remove('drop')});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-o]');if(!c)return;
 e.preventDefault();c.classList.remove('drop');const[a,b]=c.dataset.o.split('|');datTiet(+a,+b)});

function render(){
 sidebar();tabs();
 $('#topact').innerHTML=co('xuat')?'<button class="btn" data-x="xuat">⬇ Xuất</button>':'';
 const n=BAN.filter(b=>b.tt==='nhap'||b.tt==='cho').length;
 $('#ndot').textContent=n||'';$('#ndot').style.display=n?'grid':'none';
 $('#content').innerHTML=scopeBar()+(tab==='apdung'?apdungTab():tab==='ql'?(moBan?xepTab():qlTab()):cfTab());
}
render();
</script>
</body>
</html>
