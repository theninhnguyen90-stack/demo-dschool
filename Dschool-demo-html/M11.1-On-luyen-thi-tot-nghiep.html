/* đối chiếu — CHƯA GHI GÌ. Trả {bo, hop, doi, canh} */
function doiChieu(tep){
 const bo=[], hop=[], theoMa={}, map=Object.fromEntries(COT_MON);
 const cotLa=tep.cot.filter(c=>!map[c]);
 tep.rows.forEach(r=>(theoMa[r.ma]=theoMa[r.ma]||[]).push(r));
 tep.rows.forEach(r=>{
  const h=hsByMa(r.ma), cung=theoMa[r.ma];
  if(!h) return bo.push({r,lyDo:'Mã HS không có trong hồ sơ học sinh của trường (M1.1)'});
  if(!h.lop.startsWith('12')) return bo.push({r,lyDo:'Không có trong khối 12 — em thuộc lớp '+h.lop});
  if(cung.length>1){
   const giong=cung.every(x=>x.tick.slice().sort().join()===r.tick.slice().sort().join());
   if(giong&&cung[0]!==r) return bo.push({r,lyDo:'Trùng dòng — giống hệt dòng '+cung[0].dong+', bỏ dòng sau'});
   if(!giong) return bo.push({r,lyDo:'Trùng mã HS, khác môn (dòng '+cung.map(x=>x.dong).join(', ')+') — bỏ cả hai, giữ đăng ký đang dùng'});
  }
  if(!r.tick.length) return bo.push({r,lyDo:'Không tích môn nào — muốn thôi ôn thì dùng «Rút môn ôn» (có lý do), không xóa bằng tệp'});
  const la=r.tick.filter(c=>!map[c]);
  if(la.length) return bo.push({r,lyDo:'Tích cột «'+la.join(', ')+'» — không thuộc danh mục môn thi TT 24/2024'+(la.includes('GDCD')?' (nay là «GDKT&PL»)':'')+'; mẫu phiếu cũ'});
  const ms=r.tick.map(c=>map[c]), khongDay=ms.filter(m=>!MON[m].day);
  if(khongDay.length) return bo.push({r,lyDo:'Môn «'+khongDay.map(m=>MON[m].ten).join(', ')+'» trường không dạy ở lớp 12 — không mở được lớp ôn'});
  hop.push({h:h.id,mon:MON_THU_TU.filter(m=>ms.includes(m))});
 });
 const doi=hop.filter(x=>DK[x.h].mon.slice().sort().join()!==x.mon.slice().sort().join()).map(x=>({h:x.h,cu:DK[x.h].mon.slice(),moi:x.mon}));
 const canh=hop.filter(x=>x.mon.filter(m=>MON[m].thi==='tc').length>2||!x.mon.includes('toan')||!x.mon.includes('van'));
 return {tep,bo,hop,doi,canh,cotLa};
}

/* ═══════════ M11.1 — TAB «CHIA LỚP THEO MÔN» (RIÊNG, thay app.50 thi đầu vào của M11.2) ═══════════
   Đơn vị dòng: MÔN của một đợt. Gợi ý số lớp = trần(số em ôn ÷ sĩ số tối đa của đợt) — là GỢI Ý, người phụ trách chốt.
   Chia học sinh vào lớp: mặc định ⏳ GIỮ HỌC SINH CÙNG LỚP CHÍNH KHÓA vào cùng lớp ôn — ít tổ hợp chéo thì ô trống
   chung của lớp ôn nhiều hơn, TKB dễ xếp (M11.1 §4). Năng lực: chiaLop · chotSoLop · tvThem · tvRoi */

/* ---------- danh sách ôn — GỢI Ý từ môn đăng ký thi, trừ em đã rút (TT 29/2024: tự nguyện) ---------- */
/* môn em ĐĂNG KÝ ÔN (không phải môn thi chính thức — xem THI_CT 🔗 M3.4) */
const monOn=h=>DK[h]?DK[h].mon:[];
const rutCua=(h,m,k)=>RUT.find(x=>x.hs===h&&x.mon===m&&x.tt==='rut'&&(!k||x.ngay<=k));
function dsOn(m,k){return HS12().filter(h=>monOn(h.id).includes(m)&&!rutCua(h.id,m,k)).map(h=>h.id)}
const goiYSoLop=(n,cap)=>n?Math.ceil(n/cap):0;
const lopMonDot=(d,m)=>LOP.filter(l=>l.dot===d&&l.mon===m&&!l.huy);
/* thành viên đang học của một em ở môn m trong đợt d */
const tvMonDot=(h,m,d)=>THANH_VIEN.filter(t=>t.hs===h&&t.tt==='hoc'&&(l=>l&&l.dot===d&&l.mon===m&&!l.huy)(lopById(t.lop)));

/* việc của một môn trong một đợt — DẪN XUẤT, không có cờ lưu */
function viecMon(d,m){
 const dot=dotById(d), on=dsOn(m), ls=lopMonDot(d,m), xong=HOMNAY>dot.den;
 if(!ls.length||xong) return {chuaLop:[],lech:[],ls,on};
 const chuaLop=on.filter(h=>!tvMonDot(h,m,d).length);
 const lech=[]; ls.forEach(l=>tvHoc(l.id).forEach(t=>{if(!on.includes(t.hs)&&!GIU[t.hs+'|'+l.id]) lech.push({hs:t.hs,lop:l.id})}));
 return {chuaLop,lech,ls,on};
}
function lyDoLech(h,m){
 const r=rutCua(h,m); if(r) return 'đã rút môn ôn '+k2n(r.ngay)+' — '+r.lyDo;
 const b=DK_BAN.find(x=>x.id===(DK[h]||{}).ban);
 return 'không còn đăng ký ôn '+MON[m].ten+(b?' theo bản «'+b.ten+'»':'');
}

/* ---------- THUẬT TOÁN CHIA ---------- cach: 'giuLop' (mặc định ⏳) · 'deu' (trộn theo tên — để so sánh)
   giuLop: nhóm theo lớp CK, nhóm lớn trước; cả nhóm vào lớp ôn đang ít em nhất nếu còn vừa sĩ số tối đa,
   không vừa thì chia từng em vào lớp còn chỗ ít em nhất (tách nhóm là phương án cuối). */
function chiaNhom(ds,k,cap,cach){
 const lop=Array.from({length:Math.max(1,k)},()=>[]), it=()=>lop.reduce((bi,x,i)=>x.length<lop[bi].length?i:bi,0);
 if(cach==='deu'){
  const tenGoi=h=>kd(tenHS(h).split(' ').pop()+' '+tenHS(h));
  ds.slice().sort((a,b)=>tenGoi(a)<tenGoi(b)?-1:1).forEach((h,i)=>lop[i%lop.length].push(h));

  Object.keys(g).sort((a,b)=>g[b].length-g[a].length||(a<b?-1:1)).forEach(c=>{
   const i=it(); if(lop[i].length+g[c].length<=cap){lop[i].push(...g[c]);return}
   g[c].forEach(h=>{let j=-1;lop.forEach((x,ii)=>{if(x.length<cap&&(j<0||x.length<lop[j].length))j=ii});lop[j<0?it():j].push(h)});
  });
 }

}

   Chép từ khuôn v1.1 (14/9/2026) · M11.1 thay ống kính «Kết quả theo môn» bằng SO SÁNH CÁC LẦN THI THỬ; ống kính số buổi dạy giữ nguyên. Hai ống kính: Kết quả theo môn · Số buổi dạy của giáo viên.
   Ranh giới: menu này sở hữu SỐ BUỔI ĐÃ DẠY; M7.6 sở hữu QUY ĐỔI và TIỀN (như M6.1 §8.1).
   Năng lực: xuat · chotBuoi */

function veBaoCao(){
 let h=scopeBar()+'<div class="bar">'+[['mon','Kết quả theo môn'],['gv','Số buổi dạy của giáo viên']].map(([k,n])=>
  '<button class="chip'+(ST.bcSub===k?' on':'')+'" data-a="bc.sub" data-v="'+k+'">'+n+'</button>').join('')
  +'<span style="flex:1"></span>'+(can('xuat')?'<button class="btn sm" data-a="bc.xuat">⬇ Xuất báo cáo</button>':'')+'</div>';
 return h+(ST.bcSub==='mon'?veBCMon():veBCGV());
}

/* M11.1 — ống kính «Kết quả theo môn» SO SÁNH CÁC LẦN THI THỬ. Dòng = lớp ôn, gom theo môn (dòng môn = cộng mọi lớp).
   Điểm thi thử CHỈ thống kê; so sánh giữa các lần — KHÔNG xếp loại học sinh. */
const BANG_PB=[['≥ 8',x=>x>=8],['5 – dưới 8',x=>x>=5&&x<8],['dưới 5',x=>x<5]];
function tkLop(l){
 const tv=tvCua(l.id), hoc=tv.filter(t=>t.tt==='hoc'), ids=hoc.map(t=>t.hs);
 const cc=ids.map(h=>chuyenCan(l.id,h).pt).filter(x=>x!=null);
 return {hoc:hoc.length,roi:tv.length-hoc.length,day:buoiCua(l.id).filter(daDiemDanh).length,ids,cc};
}
const baiLan=(l,n)=>BAI_KT.find(x=>x.lop===l.id&&x.lan===n);
const tb=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
/* điểm của một nhóm em ở lần n — trên mọi lớp ls */
function diemLan(ls,n,ids){const out=[];ls.forEach(l=>{const b=baiLan(l,n);if(!b)return;(ids||tvHoc(l.id).map(t=>t.hs)).forEach(h=>{const v=DIEM[b.id]&&DIEM[b.id][h];if(v!=null&&tvHoc(l.id).some(t=>t.hs===h))out.push({h,v})})});return out}
/* chênh lệch ghép cặp — chỉ em có điểm cả lần đầu và lần cuối */
function chenh(ls,a,b){const x=diemLan(ls,a), y=new Map(diemLan(ls,b).map(z=>[z.h,z.v]));const d=x.filter(z=>y.has(z.h)).map(z=>y.get(z.h)-z.v);return d.length?{d:tb(d),n:d.length}:null}
function oPB(vs){
 const n=vs.length; if(!n) return '<span class="mini">chưa có điểm</span>';
 const c=BANG_PB.map(([,f])=>vs.filter(f).length);
 return '<div class="pbar pb2">'+c.map((x,i)=>x?'<i class="'+'abc'[i]+'" style="width:'+(x*100/n)+'%" title="'+BANG_PB[i][0]+': '+x+' em"></i>':'').join('')+'</div>';
}
function veBCMon(){
 const all=lopTrongPV().filter(l=>!l.huy), dots=[...new Set(all.map(l=>l.dot))];
 if(!dots.length) return '<div class="empty">Không có lớp ôn nào trong phạm vi ở năm học này.</div>';
 if(!dots.includes(ST.bcDot)) ST.bcDot=dots.find(d=>BAI_KT.some(b=>lopById(b.lop).dot===d))||dots[0];
 const ls=all.filter(l=>l.dot===ST.bcDot), lans=[...new Set(BAI_KT.filter(b=>ls.some(l=>l.id===b.lop)).map(b=>b.lan))].sort();
 const dau=lans[0], cuoi=lans[lans.length-1];
 let h='<div class="alert b">🔒<span class="sp"><b>Điểm thi thử — chỉ thống kê.</b> Không vào M2.5 · M3.1 · học bạ · CSDL ngành, <b>không phải điểm thi tốt nghiệp (M3.4)</b>. '
  +'Bảng <b>so sánh giữa các lần</b> — không xếp loại học sinh.</span></div>';
 if(dots.length>1) h+='<div class="bar">'+dots.map(d=>'<button class="chip'+(d===ST.bcDot?' on':'')+'" data-a="bc.dot" data-v="'+d+'">'+esc(dotById(d).ten)+'</button>').join('')+'</div>';
 if(!lans.length) h+='<div class="hint">Đợt này chưa có lần thi thử nào có điểm.</div>';
 h+='<div class="tbw tbx"><table><tr><th>Môn · lớp ôn</th><th>GV</th><th class="num">Đang học / đã rời</th><th class="num">Buổi đã dạy</th><th class="num">Chuyên cần TB</th>'
  +lans.map(n=>'<th class="num">TB lần '+n+'</th>').join('')+(lans.length>1?'<th class="num">Chênh lần '+dau+' → '+cuoi+'</th>':'')+'<th style="min-width:150px">Phân bố lần '+(cuoi||'—')+'</th></tr>';
 MON_THU_TU.forEach(m=>{
  const lm=ls.filter(l=>l.mon===m); if(!lm.length) return;
  const ids=lm.flatMap(l=>tvHoc(l.id).map(t=>t.hs)), cc=lm.flatMap(l=>tkLop(l).cc), ch=lans.length>1?chenh(lm,dau,cuoi):null;
  h+='<tr class="grp"><td><b>'+esc(MON[m].ten)+'</b> <span class="mini">'+lm.length+' lớp</span></td><td></td><td class="num"><b>'+ids.length+'</b></td><td></td>'
   +'<td class="num">'+(cc.length?Math.round(tb(cc))+'%':'—')+'</td>'+lans.map(n=>'<td class="num"><b>'+f1(tb(diemLan(lm,n).map(z=>z.v)))+'</b></td>').join('')
   +(lans.length>1?'<td class="num">'+(ch?'<b class="'+(ch.d>=0?'okt':'red')+'">'+(ch.d>=0?'+':'')+f1(ch.d)+'</b>':'—')+'</td>':'')+'<td>'+oPB(diemLan(lm,cuoi).map(z=>z.v))+'</td></tr>';
  lm.forEach(l=>{
   const t=tkLop(l), c2=lans.length>1?chenh([l],dau,cuoi):null;
   h+='<tr class="rowlk'+(ST.bcLop===l.id?' selrow':'')+'" data-a="bc.lop" data-v="'+l.id+'"><td style="padding-left:22px">'+esc(l.ten)+' <span class="mini">'+esc(compLop(t.ids))+'</span></td>'
    +'<td>'+esc(tenGV(l.gv))+'</td><td class="num">'+t.hoc+' / '+t.roi+'</td><td class="num">'+t.day+' / '+l.soBuoi+'</td>'
    +'<td class="num'+(t.cc.length&&tb(t.cc)<CFG.nguongCC?' red':'')+'">'+(t.cc.length?Math.round(tb(t.cc))+'%':'—')+'</td>'
    +lans.map(n=>'<td class="num">'+f1(tb(diemLan([l],n).map(z=>z.v)))+'</td>').join('')
    +(lans.length>1?'<td class="num">'+(c2?(c2.d>=0?'+':'')+f1(c2.d):'—')+'</td>':'')+'<td>'+oPB(diemLan([l],cuoi).map(z=>z.v))+'</td></tr>';
  });
 });
 h+='</table><div class="lgd"><span><i class="lg a"></i>≥ 8</span><span><i class="lg b"></i>5 – dưới 8</span><span><i class="lg c"></i>dưới 5</span>'
  +'<span>Chênh = trung bình (lần cuối − lần đầu) của <b>em có điểm cả hai lần</b></span><span>Bấm một lớp để xem từng em</span></div></div>';
 const l=ST.bcLop&&lopById(ST.bcLop);
 if(l&&ls.includes(l)){
  h+='<div class="tbw" style="margin-top:12px"><div class="ch">'+esc(l.ten)+' — từng học sinh</div><table><tr><th>Học sinh</th><th>Lớp CK</th><th class="num">Chuyên cần</th>'
   +lans.map(n=>'<th class="num">Lần '+n+' 🔒</th>').join('')+(lans.length>1?'<th class="num">Chênh</th>':'')+'<th class="num">'+esc(MON[l.mon].ten)+' lớp 11 🔗 M3.1</th><th>Trạng thái</th></tr>';
  tvCua(l.id).forEach(t=>{const hs=hsById(t.hs), c=chuyenCan(l.id,t.hs), v=lans.map(n=>{const b=baiLan(l,n);return b&&DIEM[b.id]?DIEM[b.id][t.hs]:null});
   const a=v[0], z=v[v.length-1];
   h+='<tr'+(t.tt==='roi'?' class="mo"':'')+'><td>'+esc(hs.ten)+'</td><td>'+hs.lop+'</td><td class="num'+(c.pt!=null&&c.pt<CFG.nguongCC?' red':'')+'">'+(c.pt==null?'—':c.pt+'%')+'</td>'
    +v.map(x=>'<td class="num">'+f1(x)+'</td>').join('')+(lans.length>1?'<td class="num">'+(a!=null&&z!=null?(z-a>=0?'+':'')+f1(z-a):'—')+'</td>':'')
    +'<td class="num"><span class="ro1">'+f1(hs.ck[l.mon])+'</span></td><td>'+(t.tt==='hoc'?'Đang học':'Đã rời '+k2n(t.roi.ngay))+'</td></tr>'});
  h+='</table></div>';
 }
 return h;
}
ON['bc.dot']=v=>{ST.bcDot=v;ST.bcLop=null;render()};

/* các tháng có buổi của năm đang xem */
function thangCuaNam(){
 const s=new Set(); lopTrongPV().forEach(l=>{let k=l.tu;while(k<=l.den){s.add(thang(k));k=addD(k,28)}s.add(thang(l.den))});
 return [...s].sort();
}
const tenThang=ym=>'Tháng '+(+ym.slice(5))+'/'+ym.slice(0,4);

function soBuoiGV(ym){
 const out={};
 lopTrongPV().forEach(l=>buoiCua(l.id).forEach(b=>{
  if(!daDiemDanh(b)||(ym!=='all'&&thang(b.ngay)!==ym)) return;
  const o=out[b.gv]=out[b.gv]||{buoi:0,tiet:0,lop:{},thay:0};
  o.buoi++;o.tiet+=BXL.soTiet(b.tu,b.den);o.lop[l.id]=(o.lop[l.id]||0)+1;if(b.gv!==l.gv)o.thay++;
 }));
 return out;
}

function veBCGV(){
 const ths=thangCuaNam();
 if(!ths.length) return '<div class="empty">Không có lớp bồi dưỡng nào trong phạm vi ở năm học này.</div>';
 if(!ths.includes(ST.bcThang)&&ST.bcThang!=='all') ST.bcThang=ths.find(t=>t===thang(HOMNAY))||ths[0];
 const ym=ST.bcThang, sb=soBuoiGV(ym), chot=ym!=='all'&&CHOT_THANG[ym];
 let h='<div class="alert b">💰<span class="sp"><b>Chỉ đếm buổi và tiết</b> — M7.6 nhận ở <b>cột riêng</b>, quy đổi và chi trả ở M7.6 <span class="tg g">✅ phương án A — chốt 14/9</span></span></div>'
  +'<div class="dnote"><b>Vì sao không có tiền ở đây.</b> Ranh giới như M6.1 §8.1: menu nghiệp vụ sở hữu SỐ LƯỢNG, cụm tài chính sở hữu TIỀN. Dạy thêm trong trường không thu tiền học sinh (TT 29/2024 Đ.5) — chi phí trả GV đi từ ngân sách, quy đổi theo quy chế chi tiêu nội bộ ở M7.6.</div>';
 h+='<div class="bar">'+ths.map(t=>'<button class="chip'+(ym===t?' on':'')+'" data-a="bc.thang" data-v="'+t+'">'+tenThang(t)+(CHOT_THANG[t]?' 🔒':'')+'</button>').join('')
  +'<button class="chip'+(ym==='all'?' on':'')+'" data-a="bc.thang" data-v="all">Cả năm học</button><span style="flex:1"></span>'
  +(ym!=='all'&&can('chotBuoi')?'<button class="btn p sm" data-a="bc.chot" data-v="'+ym+'">'+(chot?'🔁 Chốt lại ':'🔒 Chốt ')+tenThang(ym)+' → M7.6</button>':'')+'</div>';
 if(chot) h+='<div class="ro">🔒 '+tenThang(ym)+' đã chốt <b>'+chot.luc+'</b> bởi '+esc(chot.boi)+' — M7.6 đang giữ số liệu của lần chốt đó.</div>';
 const gvs=Object.keys(sb);
 if(!gvs.length) return h+'<div class="empty">Chưa có buổi nào đã dạy trong '+(ym==='all'?'năm học':tenThang(ym).toLowerCase())+'.</div>';
 h+='<div class="tbw"><table><tr><th>Giáo viên</th><th>Lớp</th><th class="num">Số buổi đã dạy</th><th class="num">Số tiết</th><th class="num">Trong đó dạy thay</th>'+(ym!=='all'?'<th>Đã gửi M7.6</th>':'')+'</tr>';
 gvs.forEach(g=>{const o=sb[g], gui=chot&&chot.ds[g], lech=chot&&(!gui||gui.buoi!==o.buoi||gui.tiet!==o.tiet);
  h+='<tr'+(lech?' class="warnrow"':'')+'><td><b>'+esc(tenGV(g))+'</b><div class="mini">'+esc(GV[g].to)+'</div></td><td>'+Object.keys(o.lop).map(id=>esc(tenLop(id))+' ('+o.lop[id]+')').join(', ')+'</td>'
   +'<td class="num"><b>'+o.buoi+'</b></td><td class="num">'+o.tiet+'</td><td class="num">'+(o.thay||'—')+'</td>'
   +(ym!=='all'?'<td>'+(chot?(lech?'⚠ đã gửi <b>'+(gui?gui.buoi+' buổi · '+gui.tiet+' tiết':'0')+'</b> — số liệu đổi sau khi chốt, cần chốt lại':'✅ '+gui.buoi+' buổi · '+gui.tiet+' tiết'):'<span class="mini">chưa chốt</span>')+'</td>':'')+'</tr>'});
 return h+'</table><div class="lgd"><span>Buổi tính cho <b>người thực dạy</b> — buổi dạy thay tính cho người đứng lớp</span><span>Buổi đã xếp nhưng chưa điểm danh <b>không tính</b></span></div></div>';
}

 render();toast('🔒 Đã chốt <b>'+tenThang(v)+'</b> — '+Object.keys(ds).length+' giáo viên. <b>M7.6</b> nhận ở <b>cột riêng «buổi bồi dưỡng/ôn luyện»</b> (chưa quy đổi); M11.1 không tính tiền.');

 };

  +'<div style="flex:1"><label class="lbl">Số tiết liền nhau mỗi buổi</label><input class="fldi" id="cPh" value="'+l.soTiet+'"></div></div>'
  +'<div class="mini" style="margin-top:4px">Giảm số buổi chỉ bỏ được buổi cuối <b>chưa xếp</b>. Buổi đã dạy không bao giờ bị bỏ. Đổi số tiết thì khung tiết bồi dưỡng phải còn đủ tiết liền nhau.</div>'
  +'<label class="lbl">Dàn ý nội dung từng buổi</label>'+Array.from({length:l.soBuoi},(_,i)=>'<div class="dyrow"><span>Buổi '+(i+1)+'</span><input class="fldi" id="dy'+i+'" value="'+esc(DAN_Y[v][i]||'')+'"></div>').join(''),
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="ch">Lưu</button>');

/* SCOPE CỨNG — lớp ngoài phạm vi KHÔNG có trong dữ liệu trả về (không phải ẩn nút) */
function lopTrongPV(){
 const r=R();
 let ls=LOP.filter(l=>dotById(l.dot).nam===ST.nam);
 if(r.sc==='School'&&ST.dt!=='ALL') ls=ls.filter(l=>l.dt===ST.dt);
 if(r.sc==='Branch') ls=ls.filter(l=>l.dt===r.dt);
 if(r.sc==='Group') ls=ls.filter(l=>MON[l.mon].to===r.to);
 if(r.sc==='Own') ls=ls.filter(l=>l.gv===r.gv||BUOI.some(b=>b.lop===l.id&&b.gv===r.gv));
 if(r.sc==='Class') ls=ls.filter(l=>THANH_VIEN.some(t=>t.lop===l.id&&hsById(t.hs).lop===r.lop));
 return ls;
}

}

 const r=R(), ls=lopTrongPV(), nam=ST.nam!==NAM_HIEN?' · <b>năm học '+ST.nam+' — chỉ xem</b>':'';
 const pv={School:'School — '+(ST.dt==='ALL'?'toàn trường':DT[ST.dt]),Branch:'Branch — '+DT[r.dt],Group:'Group — tổ '+r.to,
  Own:'Lớp mình dạy',Class:'Class — học sinh lớp '+r.lop}[r.sc];
 return '<div class="scope"><b>👁 Phạm vi:</b> '+esc(pv)+' · <b>'+ls.length+'</b> lớp ôn'+nam
  +(r.sc==='Class'?' · <b>chỉ đọc lớp ôn</b>':'')+'<span class="sp"></span>'+(extra||'')+'</div>';
}
function crumb(t){$('#crumb').innerHTML=t?'<div class="crumb">'+t+'</div>':''}

function rolebar(){
 $('#rolebar').innerHTML='<b>Chức danh:</b>'+Object.keys(ROLES).map(k=>
  '<button class="rb'+(k===role?' on':'')+'" data-r="'+k+'">'+esc(ROLES[k].cd)+'</button>').join('')
  +'<span class="simw">Hôm nay (mô phỏng): <b style="color:#fff">'+kThu(HOMNAY)+' '+k2s(HOMNAY)+'</b></span>'
  +'<button class="simtg'+(SIM.tkb2?'':' off')+'" data-a="sim.tkb">🔀 M4.6 bộ TKB 2 từ 19/04: '+(SIM.tkb2?'BẬT':'TẮT')+'</button>'
  +'<button class="simtg'+(SIM.m34?'':' off')+'" data-a="sim.m34">🔗 M3.4 danh sách dự thi: '+(SIM.m34?'ĐÃ CÓ':'CHƯA CÓ')+'</button>'
  +'<button class="ntg" id="btnNote">💡 Ghi chú thiết kế: TẮT</button>';
}

function header(){
 const r=R();
 $('#ava').textContent=r.n.split(' ').slice(-2).map(x=>x[0]).join('');
 const khoa=r.sc==='Branch'||r.sc==='Own'||r.sc==='Class'||r.sc==='Group';
 $('#hdt').innerHTML='<option value="ALL">Tất cả điểm trường</option>'+Object.keys(DT).map(d=>'<option value="'+d+'">'+DT[d]+'</option>').join('');
 $('#hdt').value=r.sc==='Branch'?r.dt:ST.dt; $('#hdt').disabled=khoa;
 $('#dtlock').textContent=khoa?'🔒 khóa theo phạm vi '+r.sc:'';
 $('#hnam').value=ST.nam;
 const v=demViec();
 const n=v.dd+v.tr; $('#ndot').textContent=n||''; $('#ndot').style.display=n?'grid':'none';
 $('#topact').innerHTML='<button class="btn sm" data-a="audit">🕘 Nhật ký thao tác</button>';
}

/* đếm việc MỘT lần mỗi lượt vẽ — header và thanh tab dùng chung */
let _viec=null;
function demViec(){
 if(_viec) return _viec;
 const ls=lopTrongPV(), v={dd:0,tr:0,cx:0,lech:0,chuaLop:0,chuaTao:0};
 ls.filter(l=>!l.huy).forEach(l=>{const x=viecLop(l);v.dd+=x.chuaDD.length;v.tr+=x.trung.length;v.cx+=x.chuaXep.length});
 if(ST.nam===NAM_HIEN){
  const r=R(), ms=MON_THU_TU.filter(m=>MON[m].day&&(r.sc!=='Group'||MON[m].to===r.to));
  DOT.filter(d=>d.nam===ST.nam&&!d.huy&&HOMNAY<=d.den).forEach(d=>ms.forEach(m=>{
   const x=viecMon(d.id,m); v.chuaLop+=x.chuaLop.length; v.lech+=x.lech.length; if(!x.ls.length&&x.on.length) v.chuaTao++}));
 }
 return _viec=v;
}

/* MỌI TAB HIỆN VỚI MỌI VAI — phạm vi dữ liệu mới theo vai (CLAUDE.md · khung-menu §14.4) */
function tabs(){
 const v=demViec();
 const T=[['lop','1 · Lớp ôn luyện',v.dd,'r'],['dk','2 · Đăng ký môn ôn',v.lech,'r'],['chia','3 · Chia lớp theo môn',v.chuaLop+v.lech+v.chuaTao,v.lech?'r':''],
  ['xep','4 · Xếp lịch buổi học',v.tr+v.cx,v.tr?'r':''],['baocao','5 · Báo cáo kết quả'],['cauhinh','6 · ⚙ Cấu hình']];
 $('#tabs').innerHTML=T.map(([k,n,b,c])=>'<button class="tab1'+(k===ST.tab?' on':'')+'" data-t="'+k+'">'+n
  +(b?'<span class="b '+(c||'')+'">'+b+'</span>':'')+'</button>').join('');
}

/* ═══════════ M11.1 — RENDER + SỰ KIỆN ═══════════ */

function sidebar(){}                                   /* sidebar thuộc demo-html/index.html */

function veXepM111(){
 /* khuôn vẽ tab; M11.1 chèn thẻ «cặp môn chặn nhau» ngay trên bảng kết quả (hoặc trên khay Chưa xếp) */
 let h=veXepLich();
 const ls=lopTrongPV().filter(l=>!l.huy&&l.dot===ST.xDot&&(ST.xLop==='all'||l.id===ST.xLop));
 const the=veCapMon(ls); if(!the) return h;
 const i=h.indexOf('<div class="card kq">'), j=h.indexOf('<div class="tray">'), at=i>=0?i:j;
 return at>=0?h.slice(0,at)+the+h.slice(at):h+the;
}

function render(){
 demXoa(); _viec=null;
 rolebar(); header(); tabs(); crumb('');
 const c=$('#content');
 c.innerHTML=doiNhan(ST.tab==='lop'?veLopList():ST.tab==='dk'?veDK():ST.tab==='chia'?veChia():ST.tab==='xep'?veXepM111():ST.tab==='baocao'?veBaoCao():veCauHinh());
 const cr=$('#crumb'); if(cr.innerHTML) cr.innerHTML=doiNhan(cr.innerHTML);
 const nn=document.body.classList.contains('nn');
 $('#btnNote').classList.toggle('on',!nn);
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(nn?'TẮT':'BẬT');
}

ON['nav.tab']=v=>{closeM();ST.tab=v;ST.lop=null;ST.xSel=null;render()};
ON['sim.tkb']=()=>{SIM.tkb2=!SIM.tkb2;render();
 toast(SIM.tkb2?'🔀 <b>Bộ TKB 2</b> áp dụng từ 19/04: <b>12A1</b> học thêm chiều T6 (tiết 6–8). Các buổi <b>Hóa 1</b> đã xếp vào T6 tiết 8–9 <b>tự hiện ⛔</b> — không tự dời.'
  :'🔀 Tắt bộ TKB 2 — chính khóa về bộ 1. Cảnh báo trên các buổi Hóa 1 <b>biến mất ngay</b>: trùng lịch là trạng thái dẫn xuất, không phải cờ lưu.')};
ON['audit']=()=>modal('🕘 Nhật ký thao tác — M11.1',AUDIT.length?'<table><tr><th>Lúc</th><th>Người</th><th>Việc</th><th>Chi tiết</th></tr>'
 +AUDIT.map(a=>'<tr><td class="nw">'+a.luc+'</td><td>'+esc(a.boi)+'<div class="mini">'+esc(a.vai)+'</div></td><td>'+esc(a.viec)+'</td><td class="mini">'+esc(a.chiTiet)+'</td></tr>').join('')+'</table>'
 :'<div class="empty">Chưa có thao tác nào trong phiên demo này.</div>','<button class="btn" data-mb="close">Đóng</button>');

document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 const a=t.closest('[data-a]'); if(a&&a.dataset.a&&ON[a.dataset.a]){ON[a.dataset.a](a.dataset.v,a);return}
 if(t===$('#mask')){closeM();return}
 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r;ST.lop=null;ST.xSel=null;ST.bcLop=null;ST.dkMon=null;if(R().sc==='Branch')ST.dt=R().dt;render();return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn');render();return}
 const tb=t.closest('[data-t]'); if(tb){ST.tab=tb.dataset.t;ST.lop=null;ST.xSel=null;render();return}
 const lk=t.closest('[data-lnk]'); if(lk){toast('🔗 Deep-link sang <b>'+esc(lk.dataset.lnk)+'</b> — mở sẵn đúng ngữ cảnh, quay lại được M11.1 (<code>D3</code>). M11.1 không ghi vào menu đó.');return}
});

/* ô nhập — điểm thi thử */
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.diem){const[bai,hs]=t.dataset.diem.split('|'), v=t.value.trim();
  if(v===''){if(DIEM[bai])delete DIEM[bai][hs];render();return}
  const n=+v.replace(',','.');if(isNaN(n)||n<0||n>CFG.thang){toast('⛔ Điểm phải từ 0 đến '+CFG.thang+'.');render();return}
  (DIEM[bai]=DIEM[bai]||{})[hs]=n;ghiAudit('Nhập điểm thi thử',bai+' · '+tenHS(hs)+' = '+n);render();return}
 if(t.id==='hnam'){ST.nam=t.value;ST.lop=null;ST.xSel=null;ST.xDot=null;ST.bcThang=null;ST.bcLop=null;ST.bcDot=null;ST.cDot=null;KQ_XEP=null;render();return}
 if(t.id==='hdt'){ST.dt=t.value;render();return}
});

dungDuLieu();
render();
</script>
