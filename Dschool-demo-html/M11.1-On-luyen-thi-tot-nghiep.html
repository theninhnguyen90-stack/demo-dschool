<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M11.1 Ôn luyện thi tốt nghiệp — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}
.hsrow:last-child{border-bottom:none}
.hsrow .av{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.hsrow .nm{min-width:0;flex:1}
.hsrow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .nm span{font-size:10.5px;color:var(--ink3)}
.hsrow.lk{background:#fafbfc}
.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tgl button{padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff}
.tgl button.on{background:var(--green);color:#fff}
.tgl button.on.v{background:var(--red)}
.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stp.done{border-color:#a7f3d0;background:var(--green-soft);color:#065f46}
.stp:disabled{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{background:#f8fafc;font-weight:700}
.qgrp{padding:9px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2)}

/* ═════════ M6.10 KÝ TÚC XÁ ═════════ */
.simtg{display:inline-flex;align-items:center;gap:6px;border:1px solid #475569;border-radius:8px;padding:3px 9px;font-size:11.5px;color:#cbd5e1;background:#1e293b}
.simtg.off{border-color:#b45309;color:#fcd34d}

/* thẻ phòng ở tab 1 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
.pcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer}
.pcard:hover{border-color:var(--brand);box-shadow:0 1px 6px rgba(29,78,216,.10)}
.pcard.sel{border-color:var(--brand);background:var(--brand-soft)}
.pcard.off{opacity:.62;cursor:default}
.pcard.off:hover{border-color:var(--line);box-shadow:none}
.pcard .pn{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px}
.pcard .pm{font-size:11.5px;color:var(--ink3);margin:2px 0 7px}
.bdg{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px;margin:2px 3px 0 0}
.bdg.r{background:var(--red-soft);color:var(--red)}
.bdg.a{background:var(--amber-soft);color:var(--amber)}
.bdg.g{background:var(--green-soft);color:var(--green)}
.bdg.n{background:#f1f5f9;color:var(--ink2)}
.bdg.v{background:#f5f3ff;color:var(--violet)}
.bdg.rr{background:var(--red);color:#fff}

/* cột gợi ý của máy — tầng 2 */
.hint2{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap}
.hint2.in{background:var(--green-soft);color:var(--green)}
.hint2.out{background:var(--red-soft);color:var(--red)}
.hint2.perm{background:var(--brand-soft);color:var(--brand)}
.hint2.none{background:#f1f5f9;color:#64748b}
.dev{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.dev.o{color:var(--red);font-weight:600}
.dev.i{color:var(--green);font-weight:600}
.dev.m{color:var(--ink3)}

/* năm nút trạng thái điểm danh — tô bằng chính màu trạng thái */
.dd{display:inline-flex;gap:3px}
.dd button{width:30px;height:27px;border:1px solid var(--line2);border-radius:7px;background:#fff;font-size:12px;font-weight:700;color:var(--ink2);display:grid;place-items:center}
.dd button:hover{border-color:var(--ink3)}
.dd button.on{color:#fff;border-color:transparent}
.dd button.on[data-s="cm"]{background:var(--green)}
.dd button.on[data-s="vp"]{background:var(--brand)}
.dd button.on[data-s="kp"]{background:var(--red)}
.dd button.on[data-s="vien"]{background:var(--violet)}
.dd button.on[data-s="nha"]{background:#0f766e}
.dd.lk button{opacity:.45;cursor:not-allowed}
.srcline{font-size:10.5px;color:var(--ink3);margin-top:2px}
tr.nocham td{background:#fffbeb}
tr.nocham td:first-child{font-weight:700}
tr.susp td{background:#fef2f2}

/* sơ đồ giường */
.khu{margin-bottom:16px}
.khu>h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px}
.rbox{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px}
.rbox.rep{background:#f8fafc;border-style:dashed}

/* ---------- THÀNH VIÊN — nguon: 'dk' (chia theo đăng ký môn thi, tab 3) · 'tay' (thêm tay) · 'doi' (chuyển theo bản đăng ký mới) ---------- */
const THANH_VIEN=[];
const BUOI=[];
function taoBuoi(lop,so,ngay,tiet,nguon,x){
 const l=LOP.find(z=>z.id===lop), d=tiet?doanTiet(tiet,l.soTiet):null;
 BUOI.push(Object.assign({id:lop+'-'+so,lop,so,ngay,tiet:tiet||null,tu:d?d.tu:null,den:d?d.den:null,phong:l.phong,gv:l.gv,nguon,
  luc:nguon==='may'?'26/02 16:20':null,boi:nguon==='may'?'⚙ Bộ xếp — bấm bởi Vũ Thị Lan':null,lyDo:'',chapNhan:[],ls:[]},x||{}));
}
const DD={};
const BAI_KT=[];
const DIEM={};

/* ---------- THAM SỐ ---------- */
const CFG={tiet:45,tranTiet:2,siSo:45,nghiCung:15,nghiKhac:30,tranhSatGio:true,nguongCC:70,nguongTDV:6.5,thang:10,siSoDot:45};
const SIM={tkb2:true,m34:false};      /* m34: M3.4 đã có danh sách dự thi chính thức (bản chiếu) */
let KQ_XEP=null;
const CHOT_THANG={};

/* ═══════════ DỰNG DỮ LIỆU — chạy một lần trước lần vẽ đầu ═══════════ */
function dungDuLieu(){
 const d=DOT[0], r=rngTao(4242);
 /* 1 · chia lớp giai đoạn 1 bằng đúng thuật toán của tab 3, theo danh sách ôn NGÀY TẠO LỚP (24/02) */
 Object.keys(SPEC_D1).forEach(m=>{
  const spec=SPEC_D1[m], ds=dsOn(m,'2027-02-24'), nhom=chiaNhom(ds,spec.length,d.siSo,'giuLop').lop;
  SO_LOP[d.id+'|'+m]={so:spec.length,boi:'Vũ Thị Lan',luc:'24/02/2027 10:15',lyDo:''};
  spec.forEach(([gv,ph,kh],i)=>{
   const id=m.toUpperCase()+(i+1);
   LOP.push({id,dot:d.id,ten:TEN_NGAN[m]+' '+(i+1),mon:m,khoi:'12',gv,phong:ph,dt:'A',tu:d.tu,den:d.den,soBuoi:9,soTiet:2,
    khung:kh.slice().sort(),kt:{boi:tenGV(gv),luc:'25/02/2027'},vao:'dk',ky:null,huy:null});
   DAN_Y[id]=DY_MON[m].slice(0,9);
   nhom[i].forEach(h=>THANH_VIEN.push({lop:id,hs:h,nguon:'dk',vao:d.tu,boi:'Vũ Thị Lan',tt:'hoc',roi:null}));
  });
 });
 /* em rút Ngữ văn 25/03 — thành viên chuyển Đã rời, bản ghi giữ */
 const rv=THANH_VIEN.find(t=>t.hs==='a6-05'&&lopById(t.lop).mon==='van');
 Object.assign(rv,{tt:'roi',roi:{ngay:'2027-03-25',lyDo:'Rút tự nguyện (TT 29/2024)',ghi:'Đơn ngày 24/03 — em tự ôn với gia sư',boi:'Lê Thị Kim'}});

 /* 2 · buổi — lần xếp tự động 26/02: vị trí đầu tiên trong khung tiết, bỏ tuần có ngày nghỉ */
 LOP.filter(l=>l.dot==='D1').forEach(l=>{
  const vt=BXL.viTri(l); let so=0;
  BXL.tuanCua(l).forEach(w=>{
   if(so>=l.soBuoi) return;
   const v=vt.find(x=>!ngayNghi(addD(w,thuOffset(x.thu))));
   if(!v) return;
   so++; taoBuoi(l.id,so,addD(w,thuOffset(v.thu)),v.tiet,'may');
  });
  for(let s=so+1;s<=l.soBuoi;s++) taoBuoi(l.id,s,null,null,null);
 });
 /* 3 · điểm danh buổi đã qua — trừ Toán 1 buổi 7 (13/04, GV chưa điểm danh) */
 BUOI.forEach(b=>{
  if(!b.ngay||b.ngay>=HOMNAY||b.id==='TOAN1-7') return;
  const l=lopById(b.lop), ds={};
  thanhVienNgay(l.id,b.ngay).forEach(h=>{const x=r(), yeu=hsById(h).nl<5.2;
   ds[h]=x<(yeu?.80:.93)?'cm':x<(yeu?.86:.96)?'mu':x<(yeu?.92:.985)?'vp':'vk'});
  DD[b.id]={boi:tenGV(b.gv),luc:k2n(b.ngay)+' '+(buoiCuaGio(b.tu)==='sang'?'09:4':'16:5')+Math.floor(r()*10),ds};
 });
 /* 4 · thi thử — hai lần đã có điểm; điểm CHỈ thống kê */
 LOP.filter(l=>l.dot==='D1').forEach(l=>{
  [['Thi thử lần 1 — khảo sát đầu đợt','2027-03-06',-0.9],['Thi thử lần 2 — đề chung cụm trường','2027-04-03',-0.45]].forEach(([ten,ngay,lech],j)=>{
   const id='TT'+(j+1)+'-'+l.id; BAI_KT.push({id,lop:l.id,ten,ngay,lan:j+1}); DIEM[id]={};
   thanhVienNgay(l.id,ngay).forEach(h=>{if(r()<.03) return;
    const v=hsById(h).ck[l.mon]+lech+(r()-.5)*1.6;
    DIEM[id][h]=Math.round(Math.min(10,Math.max(0.5,v))*4)/4});
  });
 });
 /* 5 · tháng 3 đã chốt số buổi → M7.6 */
 const ds={};
 BUOI.forEach(b=>{if(!DD[b.id]||thang(b.ngay)!=='2027-03')return;const o=ds[b.gv]=ds[b.gv]||{buoi:0,tiet:0};o.buoi++;o.tiet+=BXL.soTiet(b.tu,b.den)});
 CHOT_THANG['2027-03']={luc:'02/04/2027 16:30',boi:'Vũ Thị Lan',ds};
}

/* ═══════════ KHUÔN — NGUỒN NÉ (bản chiếu chỉ đọc 🔗) ═══════════
   Tệp DÙNG CHUNG · khuôn v1.1 (14/9/2026). Bốn câu hỏi bộ xếp lịch hỏi hệ thống — mỗi câu MỘT hàm, MỘT menu chủ:
     lichChinhKhoa(lớp CK, ngày) → M4.6 mẫu tuần trải ra ngày + biến động M4.7
     lichGV(gv, ngày)            → M4.7 lịch dạy thực tế của giáo viên
     lichPhong(phòng, ngày)      → M4.6 phòng chuyên dụng · M6.4 đặt phòng
     ngayNghi(ngày)              → M10.9
   Menu M11.x KHÔNG ghi vào bất kỳ nguồn nào ở đây. M11.3 (HS ngoài trường) thay
   lichChinhKhoa bằng hàm trả mảng rỗng cho HS ngoài trường — xem mô tả M11.2 §5.9. */

function lichChinhKhoa(lopCK,k){
 const t=thuCua(k), out=[];
 if(t>=1&&t<=5) out.push({tu:'07:00',den:'11:15',nd:'Buổi sáng — tiết 1–5',nguon:'M4.6'});
 TKB_CK.forEach(x=>{
  if(x.lop!==lopCK||x.thu!==t) return;
  if(x.ban==='b2'&&!SIM.tkb2) return;
  if(x.tuNgay&&k<x.tuNgay) return;
  out.push({tu:x.tu,den:x.den,nd:x.nd,nguon:'M4.6',ban:x.ban});
 });
 M47.forEach(x=>{if(x.lop===lopCK&&x.ngay===k) out.push({tu:x.tu,den:x.den,nd:x.nd,nguon:'M4.7'})});
 return out;
}
function lichGV(gv,k){
 return GV_LICH.filter(x=>x.gv===gv&&(x.ngay?x.ngay===k:x.thu===thuCua(k)))
  .map(x=>({tu:x.tu,den:x.den,nd:x.nd,nguon:'M4.7'}));
}
function lichPhong(ph,k){
 return PHONG_LICH.filter(x=>x.ph===ph&&x.thu===thuCua(k)&&(!x.tuan||x.tuan.includes(dauTuan(k))))
  .map(x=>({tu:x.tu,den:x.den,nd:x.nd,nguon:x.nguon||'M6.4'}));
}
const ngayNghi=k=>NGAY_NGHI.find(x=>x.ngay===k);
function ngoaiKhoaCua(hs,k){
 return NGOAI_KHOA.filter(x=>x.hs===hs&&x.thu===thuCua(k)).map(x=>({tu:x.tu,den:x.den,nd:x.nd,nguon:'M6.2'}));
}

/* ═══════════ KHUÔN — truy vấn cơ sở trên ĐỢT · LỚP · THÀNH VIÊN · BUỔI ═══════════
   Tệp DÙNG CHUNG · khuôn v1.1 (14/9/2026). Mọi trạng thái ở đây là DẪN XUẤT — không có nút bấm tay nào đặt chúng. */

/* ---------- khung tiết — một buổi bồi dưỡng = k tiết LIỀN NHAU trong CÙNG một buổi (sáng/chiều) ---------- */
function doanTiet(id,k){
 const i=KHUNG_TIET.findIndex(t=>t.id===id); if(i<0) return null;
 const ds=KHUNG_TIET.slice(i,i+k);
 if(ds.length<k||ds.some(t=>t.buoi!==ds[0].buoi)) return null;
 return {ids:ds.map(t=>t.id),tu:ds[0].tu,den:ds[k-1].den,buoi:ds[0].buoi};
}
function nhanTiet(id,k){
 const d=doanTiet(id,k); if(!d) return '—';
 return 'tiết '+d.ids[0]+(k>1?'–'+d.ids[k-1]:'');
}
const buoiCuaGio=tu=>h2m(tu)<h2m('12:00')?'sang':'chieu';

const dotById=id=>DOT.find(d=>d.id===id);
const lopById=id=>LOP.find(l=>l.id===id);
const buoiById=id=>BUOI.find(b=>b.id===id);
const buoiCua=lop=>BUOI.filter(b=>b.lop===lop).sort((a,b)=>a.so-b.so);
const tenLop=id=>lopById(id).ten;

/* thành viên ĐANG có hiệu lực vào một ngày — em đã rời trước ngày đó không còn tính */
const thanhVienNgay=(lop,k)=>THANH_VIEN.filter(t=>t.lop===lop&&t.vao<=k&&(t.tt==='hoc'||t.roi.ngay>k)).map(t=>t.hs);
const tvCua=lop=>THANH_VIEN.filter(t=>t.lop===lop);
const tvHoc=lop=>THANH_VIEN.filter(t=>t.lop===lop&&t.tt==='hoc');

const daDiemDanh=b=>!!DD[b.id];
/* trạng thái buổi: chuaXep · sapToi · chuaDD (đã tới ngày mà chưa điểm danh) · daDay */
function ttBuoi(b){
 if(!b.ngay) return 'chuaXep';
 if(daDiemDanh(b)) return 'daDay';
 return b.ngay<=HOMNAY?'chuaDD':'sapToi';
}
const TT_BUOI={chuaXep:['Chưa xếp','r'],sapToi:['Sắp tới','n'],chuaDD:['Chưa điểm danh','w'],daDay:['Đã dạy','o']};

function ttDot(d){
 if(d.huy) return ['Đã hủy','n'];
 if(HOMNAY<d.tu) return ['Sắp diễn ra','b'];
 if(HOMNAY>d.den) return ['Đã kết thúc','n'];
 return ['Đang diễn ra','o'];
}
function ttLop(l){
 if(l.huy) return 'huy';
 if(HOMNAY>l.den) return 'ketThuc';
 if(HOMNAY<l.tu) return 'sapMo';
 return 'dangHoc';
}
const TT_LOP={dangHoc:['Đang học','o'],sapMo:['Sắp mở','b'],ketThuc:['Đã kết thúc','n'],huy:['Đã hủy','n']};

/* chuyên cần của một em trong một lớp — dẫn xuất từ điểm danh, KHÔNG có ô nhập tay */
function chuyenCan(lop,hs){
 let co=0,tong=0;
 buoiCua(lop).forEach(b=>{const r=DD[b.id];if(!r||!(hs in r.ds))return;tong++;if(r.ds[hs]==='cm'||r.ds[hs]==='mu')co++});
 return {co,tong,pt:tong?Math.round(co*100/tong):null};
}
/* TB nội bộ — trung bình cộng các bài, thang 10, không hệ số. CHỈ để so sánh trong nhóm */
function tbNoiBo(lop,hs){
 const v=BAI_KT.filter(x=>x.lop===lop).map(x=>DIEM[x.id]&&DIEM[x.id][hs]).filter(x=>x!=null);
 return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;
}

/* ═══════════ KHUÔN — BỘ XẾP LỊCH DÙNG CHUNG (M11.2 §5) ═══════════
   Tệp DÙNG CHUNG · khuôn v1.1 (14/9/2026), không có một dòng giao diện. Hàm thuần trên dữ liệu:
     BXL.xungDot(o)      → mọi va chạm của một buổi đặt vào (ngày, giờ, phòng, GV)
     BXL.xep(o)          → chạy xếp tự động, trả BẢNG KẾT QUẢ HAI PHẦN
     BXL.goiY(lop,b)     → khung khả thi gần nhất cho một buổi không xếp được
     BXL.dangTrung(b)    → buổi đã xếp nhưng nay va chạm (trạng thái DẪN XUẤT)
   Thuật toán là THAM LAM đơn giản — mô tả chỉ chốt LUẬT (L1–L12), không chốt thuật toán.

   Ba mức va chạm (M11.2 §5.3):
     'cung' ⛔ vật lý   — GV trùng · phòng trùng · ngày nghỉ M10.9 · trùng buổi khác của chính lớp.
                         Máy không đặt, người cũng KHÔNG đặt được.
     'hs'   ⛔ học sinh — em vướng chính khóa hoặc đang ở buổi bồi dưỡng khác.
                         Máy không đặt; người đặt được nhưng BẮT BUỘC lý do, danh sách em ghi vào buổi.
     'mem'  ⚠ mềm      — sát giờ · vượt trần tiết/tuần (TT 29) · trùng ngoại khóa · đảo thứ tự dàn ý.
                         Máy tránh nếu có khung khác; người đặt được, cảnh báo + audit. */

const BXL={};

/* số tiết của một khoảng giờ — đếm tiết của KHUNG TIẾT nằm trọn trong khoảng; ngoài khung thì quy phút ra tiết */
BXL.soTiet=(tu,den)=>{const n=KHUNG_TIET.filter(t=>h2m(t.tu)>=h2m(tu)&&h2m(t.den)<=h2m(den)).length;
 return n||Math.ceil((h2m(den)-h2m(tu))/CFG.tiet)};

/* các tuần (thứ Hai) phủ khung ngày của lớp */
BXL.tuanCua=lop=>{const out=[];let w=dauTuan(lop.tu);while(w<=lop.den){out.push(w);w=addD(w,7)}return out};
const thuOffset=t=>t===0?6:t-1;                       /* CN = ngày thứ 7 của tuần */

/* ---------- KHUNG TIẾT BỒI DƯỠNG (§5.1b) ----------
   Ô 'thứ|tiết' của lớp. Một VỊ TRÍ BUỔI = soTiet tiết liền nhau, cùng buổi, TẤT CẢ đều nằm trong khung. */
BXL.viTri=lop=>{
 const out=[], chon=new Set(lop.khung||[]);
 [1,2,3,4,5,6,0].forEach(thu=>KHUNG_TIET.forEach(t=>{
  const d=doanTiet(t.id,lop.soTiet);
  if(d&&d.ids.every(id=>chon.has(thu+'|'+id))) out.push({thu,tiet:t.id,tu:d.tu,den:d.den,buoi:d.buoi});
 }));
 return out;
};
/* các vị trí buổi rơi vào một tuần, trong khung ngày của LỚP */
BXL.khungTuan=(lop,w)=>BXL.viTri(lop).map(v=>({ngay:addD(w,thuOffset(v.thu)),tiet:v.tiet,tu:v.tu,den:v.den,buoi:v.buoi}))
 .filter(s=>s.ngay>=lop.tu&&s.ngay<=lop.den);

/* ô 'thứ|tiết' có bị CHÍNH KHÓA chiếm theo MẪU TUẦN không — dùng cho bộ chọn khung tiết.
   Của ai: lớp chính khóa của thành viên (lớp chưa có thành viên → mọi lớp cùng khối) + GV phụ trách.
   Trả về [{ai, nd, tuNgay}] — tuNgay: chỉ bận TỪ ngày đó (bộ TKB mới) trong khung ngày còn lại của lớp. */
BXL.lopCKCua=lop=>{const tv=tvHoc(lop.id).map(t=>hsById(t.hs).lop);
 return [...new Set(tv.length?tv:HS.filter(h=>h.lop.startsWith(lop.khoi)).map(h=>h.lop))].sort()};
BXL.banTuan=function(lop,thu,id){
 const t=KHUNG_TIET.find(x=>x.id===id), out=[], tu=HOMNAY>lop.tu?HOMNAY:lop.tu;
 BXL.lopCKCua(lop).forEach(lck=>{
  if(thu>=1&&thu<=5&&t.buoi==='sang') {out.push({ai:lck,nd:'Buổi sáng — tiết 1–5',nguon:'M4.6'});return}
  TKB_CK.forEach(x=>{
   if(x.lop!==lck||x.thu!==thu||!giao(t.tu,t.den,x.tu,x.den)) return;
   if(x.ban==='b2'&&!SIM.tkb2) return;
   if(x.tuNgay&&x.tuNgay>lop.den) return;
   out.push({ai:lck,nd:x.nd,nguon:'M4.6',tuNgay:x.tuNgay&&x.tuNgay>tu?x.tuNgay:null,ban:x.ban});
  });
 });
 GV_LICH.forEach(x=>{if(x.gv===lop.gv&&x.thu===thu&&!x.ngay&&giao(t.tu,t.den,x.tu,x.den))
  out.push({ai:'GV '+tenGV(lop.gv),nd:x.nd,nguon:'M4.7'})});
 return out;
};
/* tóm tắt khung đã chọn: 'T5 tiết 6–7 · T7 tiết 2–3' */
BXL.tomTatKhung=lop=>{const v=BXL.viTri(lop);return v.length?v.map(x=>THU[x.thu]+' '+nhanTiet(x.tiet,lop.soTiet)).join(' · '):''};

/* tuần mục tiêu của buổi thứ `so` — dàn đều N buổi lên W tuần, giữ thứ tự dàn ý */
BXL.tuanMucTieu=(lop,so)=>{const W=BXL.tuanCua(lop);return W[Math.min(W.length-1,Math.floor((so-1)*W.length/lop.soBuoi))]};
/* số tiết KẾ HOẠCH của lớp trong một tuần — khi chính cấu hình đã buộc vượt trần */
BXL.tietKeHoach=(lop,w)=>{let n=0;for(let s=1;s<=lop.soBuoi;s++) if(BXL.tuanMucTieu(lop,s)===w) n+=lop.soTiet;return n};

/* tiết của một HỌC SINH trong một MÔN trong một tuần — cộng MỌI lớp nhóm M11.x cùng môn (TT 29) */
BXL.tietTuanHS=(hs,mon,w,boQua)=>BUOI.filter(b=>b.ngay&&b.id!==boQua&&dauTuan(b.ngay)===w
  &&lopById(b.lop).mon===mon&&thanhVienNgay(b.lop,b.ngay).includes(hs))
 .reduce((s,b)=>s+BXL.soTiet(b.tu,b.den),0);

/* o = {lop, bid?, ngay, tu, den, phong, gv} */
BXL.xungDot=function(o){
 const lop=o.lop, out=[], tv=thanhVienNgay(lop.id,o.ngay);
 const nn=ngayNghi(o.ngay);
 if(nn) out.push({muc:'cung',loai:'nghi',ai:[],nd:nn.ten,nguon:'M10.9',key:'nghi'});
 lichGV(o.gv,o.ngay).forEach(x=>{if(giao(o.tu,o.den,x.tu,x.den))
  out.push({muc:'cung',loai:'gv',ai:[tenGV(o.gv)],nd:x.nd+' '+x.tu+'–'+x.den,nguon:x.nguon,key:'gv:'+x.tu})});
 lichPhong(o.phong,o.ngay).forEach(x=>{if(giao(o.tu,o.den,x.tu,x.den))
  out.push({muc:'cung',loai:'phong',ai:[PHONG[o.phong].ten],nd:x.nd+' '+x.tu+'–'+x.den,nguon:x.nguon,key:'ph:'+x.tu})});
 /* các buổi khác của cả nhóm Ôn luyện & bồi dưỡng cùng ngày */
 BUOI.forEach(b=>{
  if(b.ngay!==o.ngay||b.id===o.bid||!giao(o.tu,o.den,b.tu,b.den)) return;
  const l2=lopById(b.lop), nhan=l2.ten+' · buổi '+b.so+' '+b.tu+'–'+b.den;
  if(b.lop===lop.id){out.push({muc:'cung',loai:'lop',ai:[],nd:'Lớp đã có buổi '+b.so+' vào giờ này',nguon:'M11',key:'lop:'+b.id});return}
  if(b.gv===o.gv) out.push({muc:'cung',loai:'gv',ai:[tenGV(o.gv)],nd:'Đang dạy '+nhan,nguon:'M11',key:'gvb:'+b.id});
  if(b.phong===o.phong) out.push({muc:'cung',loai:'phong',ai:[PHONG[o.phong].ten],nd:'Đang dùng cho '+nhan,nguon:'M11',key:'phb:'+b.id});
  const tv2=thanhVienNgay(b.lop,b.ngay), chung=tv.filter(h=>tv2.includes(h));
  if(chung.length) out.push({muc:'hs',loai:'nhom',ai:chung,nd:'Đang học '+nhan,nguon:'M11',key:'hsb:'+b.id+':'+chung.join(',')});
 });
 /* học sinh: chính khóa · sát giờ · ngoại khóa — gom theo lớp chính khóa */
 const ck={}, sat={};
 tv.forEach(h=>{
  const hs=hsById(h), nghi=hs.dt===lop.dt?CFG.nghiCung:CFG.nghiKhac;
  lichChinhKhoa(hs.lop,o.ngay).forEach(x=>{
   const k=hs.lop+'|'+x.tu+'|'+x.den;
   if(giao(o.tu,o.den,x.tu,x.den)){(ck[k]=ck[k]||{x,lop:hs.lop,ai:[]}).ai.push(h);return}
   const gap=h2m(x.den)<=h2m(o.tu)?h2m(o.tu)-h2m(x.den):h2m(x.tu)-h2m(o.den);
   if(gap>=0&&gap<nghi) (sat[k]=sat[k]||{x,lop:hs.lop,ai:[],gap,nghi}).ai.push(h);
  });
  ngoaiKhoaCua(h,o.ngay).forEach(x=>{if(giao(o.tu,o.den,x.tu,x.den))
   out.push({muc:'mem',loai:'nk',ai:[h],nd:x.nd+' '+x.tu+'–'+x.den,nguon:'M6.2',key:'nk:'+h})});
 });
 Object.values(ck).forEach(g=>out.push({muc:'hs',loai:'ck',ai:g.ai,lopCK:g.lop,
  nd:g.lop+' — '+g.x.nd+' '+g.x.tu+'–'+g.x.den+(g.x.ban==='b2'?' · '+BAN_TKB.b2:''),nguon:g.x.nguon,
  key:'ck:'+g.lop+':'+g.x.tu+':'+g.ai.join(',')}));
 Object.values(sat).forEach(g=>out.push({muc:'mem',loai:'sat',ai:g.ai,lopCK:g.lop,
  nd:g.lop+' — '+g.x.nd+' '+g.x.tu+'–'+g.x.den+' · chỉ còn '+g.gap+' phút, cần '+g.nghi,nguon:g.x.nguon,key:'sat:'+g.lop+':'+g.x.tu}));
 /* trần tiết/tuần — theo HỌC SINH × MÔN × TUẦN */
 const w=dauTuan(o.ngay), them=BXL.soTiet(o.tu,o.den);
 const vuot=tv.filter(h=>BXL.tietTuanHS(h,lop.mon,w,o.bid)+them>CFG.tranTiet);
 if(vuot.length){
  const t=Math.max(...vuot.map(h=>BXL.tietTuanHS(h,lop.mon,w,o.bid)))+them;
  out.push({muc:'mem',loai:'tran',ai:vuot,nd:'Tuần '+k2n(w)+'–'+k2n(addD(w,6))+': '+t+' tiết '+MON[lop.mon].ten+
   '/tuần, trần '+CFG.tranTiet+' tiết',nguon:'TT 29/2024 Đ.5',key:'tran:'+w});
 }
 /* thứ tự dàn ý — buổi k không đứng trước buổi k−1 */
 if(o.bid){
  const b=buoiById(o.bid), bs=buoiCua(lop.id);
  const truoc=bs.find(x=>x.so===b.so-1&&x.ngay), sau=bs.find(x=>x.so===b.so+1&&x.ngay);
  if((truoc&&truoc.ngay>o.ngay)||(sau&&sau.ngay<o.ngay))
   out.push({muc:'mem',loai:'thutu',ai:[],nd:'Đảo thứ tự dàn ý — buổi '+b.so+' rơi '+(truoc&&truoc.ngay>o.ngay?'trước buổi '+(b.so-1):'sau buổi '+(b.so+1)),nguon:'M11',key:'tt'});
 }
 return out;
};

BXL.cua=b=>{const l=lopById(b.lop);return BXL.xungDot({lop:l,bid:b.id,ngay:b.ngay,tu:b.tu,den:b.den,phong:b.phong,gv:b.gv})};
/* va chạm CHƯA ai chấp nhận — chấp nhận ghi theo key lúc đặt tay */
BXL.moi=b=>b.ngay?BXL.cua(b).filter(x=>!b.chapNhan.includes(x.key)):[];
/* đã xếp · chưa diễn ra · có ⛔ chưa ai chấp nhận. Tính lại mỗi lần vẽ — KHÔNG lưu cờ */
BXL.dangTrung=b=>!!b.ngay&&b.ngay>=HOMNAY&&!daDiemDanh(b)&&BXL.moi(b).some(x=>x.muc!=='mem');
BXL.coDinh=b=>!!b.ngay&&(b.nguon==='tay'||b.ngay<=HOMNAY||daDiemDanh(b));

BXL.mayDuoc=(iss,choVuotTran)=>!iss.some(x=>x.muc!=='mem'||(x.loai==='sat'&&CFG.tranhSatGio)||(x.loai==='tran'&&!choVuotTran));

/* nhãn một vị trí buổi: 'T5 19/11 tiết 6–7 (13:30–15:05)' */
BXL.nhan=(ngay,tiet,tu,den,k)=>kThu(ngay)+' '+k2n(ngay)+' '+(tiet?nhanTiet(tiet,k)+' ('+tu+'–'+den+')':tu+'–'+den);

function datBuoi(b,s,nguon,lyDo,chapNhan,ghi){
 const k=lopById(b.lop).soTiet, cu=b.ngay?BXL.nhan(b.ngay,b.tiet,b.tu,b.den,k):'chưa xếp';
 Object.assign(b,{ngay:s.ngay,tiet:s.tiet||null,tu:s.tu,den:s.den,phong:s.phong||b.phong,gv:s.gv||b.gv,nguon,lyDo:lyDo||'',chapNhan:chapNhan||[],
  luc:k2n(HOMNAY)+' '+GIO,boi:nguon==='may'?'⚙ Bộ xếp — bấm bởi '+R().n:R().n});
 b.ls.push({luc:b.luc,boi:b.boi,nd:(nguon==='may'?'⚙ ':'✎ ')+cu+' → '+BXL.nhan(s.ngay,s.tiet,s.tu,s.den,k)+(lyDo?' · lý do: '+lyDo:'')+(ghi||'')});
}

/* o = {lops:[id], pham:'chua'|'trung'|'lai'} */
BXL.xep=function(o){
 const kq={luc:k2n(HOMNAY)+' '+GIO,boi:R().n,pham:o.pham,lop:[]};
 o.lops.map(lopById).sort((a,b)=>tvHoc(b.id).length-tvHoc(a.id).length).forEach(lop=>{
  const r={lop:lop.id,da:[],khong:[],giu:{tay:0,qua:0,yen:0},khung:BXL.tomTatKhung(lop)};
  /* L0 — chưa có khung tiết bồi dưỡng thì không có chỗ nào để đặt: không chạy, nói rõ */
  if(!BXL.viTri(lop).length){r.chuaKhung=true;kq.lop.push(r);return}
  const can=[];
  buoiCua(lop.id).forEach(b=>{
   if(BXL.coDinh(b)){r.giu[b.nguon==='tay'&&b.ngay>HOMNAY&&!daDiemDanh(b)?'tay':'qua']++;return}
   if(!b.ngay||o.pham==='lai'||(o.pham==='trung'&&BXL.dangTrung(b))) can.push(b); else r.giu.yen++;
  });
  can.forEach(b=>{if(b.ngay) b.ls.push({luc:k2n(HOMNAY)+' '+GIO,boi:'⚙ Bộ xếp',nd:'Gỡ khỏi '+kThu(b.ngay)+' '+k2n(b.ngay)+' để xếp lại'});b.ngay=null;b.tiet=null;b.tu=null;b.den=null});
  can.forEach(b=>{
   const w=BXL.tuanMucTieu(lop,b.so), choVuot=BXL.tietKeHoach(lop,w)>CFG.tranTiet;
   const truoc=buoiCua(lop.id).filter(x=>x.ngay&&x.so<b.so).pop();
   const thu=BXL.khungTuan(lop,w).filter(s=>s.ngay>HOMNAY).map(s=>{
    const sl=Object.assign({},s,{phong:lop.phong,gv:b.gv});
    return {s:sl,iss:BXL.xungDot({lop,bid:b.id,ngay:s.ngay,tu:s.tu,den:s.den,phong:lop.phong,gv:b.gv})};
   });
   const duoc=thu.filter(t=>BXL.mayDuoc(t.iss,choVuot)).sort((x,y)=>
    x.iss.length-y.iss.length||((truoc&&thuCua(truoc.ngay)===thuCua(x.s.ngay))?0:1)-((truoc&&thuCua(truoc.ngay)===thuCua(y.s.ngay))?0:1)
    ||(x.s.ngay<y.s.ngay?-1:1));
   if(duoc.length){datBuoi(b,duoc[0].s,'may');r.da.push({b:b.id,mem:duoc[0].iss})}
   else r.khong.push({b:b.id,tuan:w,thu,goiY:null,choVuot,qua:w<dauTuan(HOMNAY)});
  });
  /* gợi ý tính SAU khi đã đặt hết — tính giữa chừng thì gợi ý đúng khung buổi sau sắp chiếm */
  r.khong.forEach(k=>k.goiY=BXL.goiY(lop,buoiById(k.b)));
  kq.lop.push(r);
 });
 KQ_XEP=kq;
 ghiAudit('Chạy xếp tự động',kq.lop.map(r=>tenLop(r.lop)+': xếp '+r.da.length+', không xếp được '+r.khong.length).join(' · '));
 return kq;
};

/* khung khả thi gần nhất (không ⛔) quanh tuần mục tiêu — chỉ là GỢI Ý cho người xếp */
BXL.goiY=function(lop,b){
 const W=BXL.tuanCua(lop), ti=W.indexOf(BXL.tuanMucTieu(lop,b.so)), c=[];
 W.forEach((w,i)=>BXL.khungTuan(lop,w).filter(s=>s.ngay>HOMNAY).forEach(s=>{
  const iss=BXL.xungDot({lop,bid:b.id,ngay:s.ngay,tu:s.tu,den:s.den,phong:lop.phong,gv:b.gv});
  if(!iss.some(x=>x.muc!=='mem')) c.push({s:Object.assign({},s,{phong:lop.phong,gv:b.gv}),iss,d:Math.abs(i-ti)});
 }));
 c.sort((x,y)=>x.d-y.d||x.iss.length-y.iss.length||(x.s.ngay<y.s.ngay?-1:1));
 return c[0]||null;
};

/* gom va chạm để hiển thị: một dòng mỗi nguồn, học sinh nêu đích danh */
BXL.moTa=function(x){
 const ic=x.muc==='mem'?'⚠':'⛔';
 let ai='';
 if(x.loai==='ck'||x.loai==='nhom'||x.loai==='sat'||x.loai==='tran'||x.loai==='nk')
  ai='<b>'+x.ai.length+' em</b>: '+x.ai.map(h=>esc(tenHS(h))).join(', ')+' — ';
 else if(x.ai.length) ai='<b>'+esc(x.ai.join(', '))+'</b>: ';
 const nhan={nghi:'Ngày nghỉ',gv:'Giáo viên',phong:'Phòng',lop:'Lớp',ck:'Chính khóa',nhom:'Buổi bồi dưỡng khác',sat:'Sát giờ',tran:'Trần tiết/tuần',nk:'Ngoại khóa',thutu:'Thứ tự'}[x.loai];
 return ic+' <span class="tg '+(x.muc==='mem'?'b':'r')+'">'+nhan+'</span> '+ai+esc(x.nd)+' <span class="src">'+esc(x.nguon)+'</span>';
};

/* ═══════════ M11.1 — LỚP HOOK trên khuôn v1.1 (RIÊNG của menu này) ═══════════
   Tệp khuôn app.10 · 20 · 25 · 30 · 35 chép NGUYÊN BYTE từ M11.2. Mọi chỗ M11.1 khác khuôn gắn ở đây, bằng cách
   ghi đè THUỘC TÍNH của BXL / bọc hàm khai báo — không sửa một dòng luật nào:
     ① ĐỆM HIỆU NĂNG — M11.1 có 26 lớp ôn × ~960 thành viên (M11.2 có 3 lớp × 30). Bộ luật tính lại va chạm của
        mọi buổi ở mỗi lượt vẽ (trùng lịch là trạng thái dẫn xuất) → đệm kết quả xungDot trong MỘT lượt vẽ, xóa
        khi dữ liệu đổi. Kết quả giống hệt bản không đệm — chỉ nhanh hơn. Đề xuất đưa vào khuôn v1.2 (phiếu E).
     ② TỪ ĐIỂN NHÃN — chữ "bồi dưỡng" trong app.35 đổi thành "ôn luyện" lúc hiển thị. Đề xuất khuôn v1.2 có NHAN{}.
     ③ BXL.moTa — nhãn va chạm loại 'nhom' là "Lớp ôn khác (chung học sinh)".
     ④ BỘ CHỌN KHUNG TIẾT — ghi chú ⚠ lên ô trống chính khóa nhưng đang là khung của LỚP ÔN KHÁC có chung học sinh.
        Không chặn (lớp kia có thể dời), nhưng người chọn phải thấy trước khi chọn: đây là gốc của "cặp môn chặn nhau". */

/* ---------- ① đệm ---------- */
const DEM={xd:new Map(),tv:new Map(),tuan:null,tat:false,dt:new Map()};
function demXoa(){DEM.xd.clear();DEM.tv.clear();DEM.tuan=null}
const dauTuanD=k=>{let w=DEM.dt.get(k);if(!w){w=dauTuan(k);DEM.dt.set(k,w)}return w};   /* hàm thuần — đệm vĩnh viễn */
function tvSet(lop,k){const key=lop+'|'+k;let s=DEM.tv.get(key);if(!s){s=new Set(thanhVienNgay(lop,k));DEM.tv.set(key,s)}return s}
function chiSoTuan(){
 if(DEM.tuan) return DEM.tuan;
 const m=new Map();
 BUOI.forEach(b=>{if(!b.ngay)return;const l=lopById(b.lop);if(!l)return;const k=l.mon+'|'+dauTuanD(b.ngay);(m.get(k)||m.set(k,[]).get(k)).push(b)});
 return DEM.tuan=m;
}
/* cùng định nghĩa với khuôn: tiết của MỘT HỌC SINH trong MỘT MÔN trong MỘT TUẦN, cộng mọi lớp nhóm M11.x.
   Mục trong chỉ số được KIỂM LẠI (buổi có thể vừa bị gỡ ngày trong lúc xếp lại) */
BXL.tietTuanHS=(hs,mon,w,boQua)=>(chiSoTuan().get(mon+'|'+w)||[]).reduce((s,b)=>
 b.id!==boQua&&b.ngay&&dauTuanD(b.ngay)===w&&tvSet(b.lop,b.ngay).has(hs)?s+BXL.soTiet(b.tu,b.den):s,0);
const _xungDot=BXL.xungDot;
BXL.xungDot=function(o){
 if(DEM.tat) return _xungDot(o);
 const k=o.lop.id+'|'+(o.bid||'')+'|'+o.ngay+'|'+o.tu+'|'+o.den+'|'+o.phong+'|'+o.gv;
 let r=DEM.xd.get(k); if(!r){r=_xungDot(o);DEM.xd.set(k,r)} return r;
};
const _xep=BXL.xep;
BXL.xep=function(o){demXoa();DEM.tat=true;try{return _xep(o)}finally{DEM.tat=false;demXoa()}};
const _datBuoi=datBuoi;
datBuoi=function(){_datBuoi.apply(null,arguments);demXoa()};
/* mọi thao tác của người bắt đầu bằng một sự kiện — xóa đệm TRƯỚC mọi handler (pha bắt, trên document) */
['click','change','drop'].forEach(ev=>document.addEventListener(ev,demXoa,true));

/* ---------- ② từ điển nhãn ---------- */
const NHAN_M111=[['Khung tiết bồi dưỡng','Khung tiết ôn luyện'],['khung tiết bồi dưỡng','khung tiết ôn luyện'],['khung bồi dưỡng','khung ôn luyện'],
 ['Lớp bồi dưỡng','Lớp ôn'],['lớp bồi dưỡng','lớp ôn'],['Buổi bồi dưỡng','Buổi ôn'],['buổi bồi dưỡng','buổi ôn'],
 ['chưa có thành viên — chốt danh sách trước','chưa có thành viên — chia lớp ở tab 3 trước']];
const doiNhan=s=>NHAN_M111.reduce((a,[x,y])=>a.split(x).join(y),String(s==null?'':s));

/* ---------- ④ bộ chọn khung tiết — ô là khung của lớp ôn khác có chung học sinh ---------- */
function oCuaLopKhac(l){
 const M=new Set(tvHoc(l.id).map(t=>t.hs)), out={};
 if(!M.size) return out;
 LOP.filter(x=>x.id!==l.id&&x.dot===l.dot&&!x.huy).forEach(x=>{
  const chung=tvHoc(x.id).filter(t=>M.has(t.hs)).length; if(!chung) return;
  BXL.viTri(x).forEach(v=>doanTiet(v.tiet,x.soTiet).ids.forEach(id=>{const o=v.thu+'|'+id;(out[o]=out[o]||[]).push({l:x,n:chung})}));
 });
 return out;
}
const _veKT=veKT;
veKT=function(){
 _veKT();
 const k=mfns._kt; if(!k) return;
 const oc=oCuaLopKhac(k.l); let co=0;
 $$('#mb td[data-a="kt.o"]').forEach(td=>{

  td.insertAdjacentHTML('beforeend','<div class="kwn">⚠ '+esc(ds.map(x=>ngan(x.l)+' · '+x.n+' em').join(', '))+'</div>');
 });
 const sum=$('#mb .ktsum');
 if(sum) sum.insertAdjacentHTML('beforeend','<div class="mini">'+(co?'⚠ <b>Ô vàng</b>: trống chính khóa nhưng là khung của <b>lớp ôn khác có chung học sinh</b> — chọn được, nhưng hai lớp sẽ chặn nhau khi xếp (đếm theo từng em).'
  :'Không ô trống nào đang là khung của lớp ôn khác có chung học sinh với lớp này.')+'</div>');
};

/* ═══════════ KHUÔN — TAB «XẾP LỊCH BUỔI HỌC» (giao diện của bộ xếp, M11.2 §8) ═══════════
   Tệp DÙNG CHUNG · khuôn v1.1 (14/9/2026). Cần menu khai sẵn: lopTrongPV() · can(q) · R() · scopeBar(extra) · ST.
   Năng lực dùng: 'xepLich' (chạy máy, chọn khung tiết bồi dưỡng) · 'xepTay' (dời, đặt tay, trả về chưa xếp).
   v1.1 — KHUNG TIẾT BỒI DƯỠNG theo lớp (§5.1b) thay "khung giờ cho phép của đợt"; buổi tính bằng TIẾT. */

const ngan=l=>l.ten.replace(/^HSG /,'');
const mauLop=id=>'l'+(LOP.findIndex(l=>l.id===id)%4);
const THU_TUAN=[1,2,3,4,5,6,0];

function veXepLich(){
 const ls=lopTrongPV().filter(l=>!l.huy);
 if(!ls.length) return scopeBar()+'<div class="empty">Không có lớp bồi dưỡng nào trong phạm vi của bạn ở năm học này.</div>';
 const dots=[...new Set(ls.map(l=>l.dot))];
 if(!dots.includes(ST.xDot)) ST.xDot=dots.find(d=>ttDot(dotById(d))[0]!=='Đã kết thúc')||dots[0];
 const dot=dotById(ST.xDot), lopD=ls.filter(l=>l.dot===dot.id);
 if(ST.xLop!=='all'&&!lopD.find(l=>l.id===ST.xLop)) ST.xLop='all';
 const loc=ST.xLop==='all'?lopD:lopD.filter(l=>l.id===ST.xLop);
 const sel=ST.xSel?buoiById(ST.xSel):null;

 let h=scopeBar('<span>Đợt: <b>'+esc(dot.ten)+'</b> · '+k2s(dot.tu)+' → '+k2s(dot.den)+'</span>');
 h+='<div class="bar">'+(dots.length>1?dots.map(d=>'<button class="chip'+(d===ST.xDot?' on':'')+'" data-a="xep.dot" data-v="'+d+'">'
  +esc(dotById(d).ten)+'</button>').join('')+'<span style="width:10px"></span>':'')
  +'<button class="chip'+(ST.xLop==='all'?' on':'')+'" data-a="xep.lop" data-v="all">Tất cả lớp ('+lopD.length+')</button>'
  +lopD.map(l=>'<button class="chip'+(ST.xLop===l.id?' on':'')+'" data-a="xep.lop" data-v="'+l.id+'"><i class="dotc '+mauLop(l.id)+'"></i>'+esc(ngan(l))+'</button>').join('')
  +'<span class="sp" style="flex:1"></span>'
  +(can('xepLich')?'<button class="btn p sm" data-a="xep.mo">⚙ Xếp tự động…</button>':'<span class="tg c">chỉ xem</span>')
  +'</div>';
 h+='<div class="ktline">'+loc.map(l=>'<span><i class="dotc '+mauLop(l.id)+'"></i><b>'+esc(ngan(l))+'</b> · khung tiết: '
  +(BXL.tomTatKhung(l)?esc(BXL.tomTatKhung(l)):'<span class="red">chưa chọn</span>')
  +' <a class="lk" data-a="kt.mo" data-v="'+l.id+'|xep">🗓 '+(can('xepLich')?'Chọn khung tiết':'Xem khung tiết')+'</a></span>').join('')+'</div>';
 h+=canhBaoTangLop(loc);
 if(KQ_XEP) h+=veKetQuaXep();
 if(sel) h+=veBuoiDangChon(sel);
 h+=veLuoi(dot,loc,sel);
 h+='<div class="dnote"><b>Vì sao lưới là Tuần × Buổi trong ngày.</b> Buổi bồi dưỡng chỉ rơi vào khung tiết đã chọn của lớp — người xếp cần thấy <i>khung nào còn trống tuần nào</i>, '
  +'không cần 30 ô ngày. Bấm ô thì hệ thống chọn <b>tiết bắt đầu tốt nhất</b> trong khung; muốn tiết cụ thể dùng ✎. Cột <b>Ngoài khung</b> giữ buổi đặt tay ngoài khung.</div>';
 return h;
}

/* cảnh báo ở TẦNG LỚP — một sự việc của cả lớp thì nói một lần, không lặp ở từng buổi */
function canhBaoTangLop(ls){
 let h='';
 ls.forEach(l=>{
  const bs=buoiCua(l.id), vt=BXL.viTri(l), mo=ttLop(l)!=='ketThuc';
  if(!tvHoc(l.id).length&&bs.some(b=>!b.ngay)) h+='<div class="alert r">⛔<span class="sp"><b>'+esc(l.ten)+'</b> chưa có thành viên'
   +(l.vao==='thi'?' — kỳ thi đầu vào <b>chưa chốt danh sách</b>':'')+'. Bộ xếp chưa né được học sinh nào nên <b>không chạy cho lớp này</b>.</span>'
   +(l.vao==='thi'?'<button class="btn xs" data-a="nav.tab" data-v="thi">↗ Tab 2 · chốt danh sách</button>':'')+'</div>';
  if(mo&&!vt.length) h+='<div class="alert r">⛔<span class="sp"><b>'+esc(l.ten)+'</b> chưa có <b>khung tiết bồi dưỡng</b> đủ '+l.soTiet+' tiết liền nhau — bộ xếp không có chỗ nào để đặt.</span>'
   +'<button class="btn xs" data-a="kt.mo" data-v="'+l.id+'|xep">🗓 Chọn khung tiết</button></div>';
  /* ô đã chọn nay bị chính khóa chiếm — bộ TKB đổi SAU khi chọn. Không tự bỏ chọn (L8) */
  const xung=(l.khung||[]).filter(o=>{const[t,i]=o.split('|').map(Number);return BXL.banTuan(l,t,i).length});
  if(mo&&xung.length){
   const r=xung.map(o=>{const[t,i]=o.split('|').map(Number),b=BXL.banTuan(l,t,i);
    return THU[t]+' '+nhanTiet(i,1)+': '+b.map(x=>x.ai+(x.tuNgay?' từ '+k2n(x.tuNgay):'')).join(', ')});
   h+='<div class="alert w">⚠<span class="sp"><b>'+esc(l.ten)+'</b>: <b>'+xung.length+' ô</b> khung tiết đã chọn nay trùng chính khóa — '+esc(r.join(' · '))
    +'. Máy không đặt buổi mới vào ngày trùng; ô không tự bỏ chọn.</span><button class="btn xs" data-a="kt.mo" data-v="'+l.id+'|xep">🗓 Sửa khung tiết</button></div>';
  }
  const W=BXL.tuanCua(l).filter(w=>addD(w,6)>HOMNAY), chua=bs.filter(b=>!b.ngay||(b.ngay>HOMNAY&&!BXL.coDinh(b))).length;
  if(mo&&vt.length&&W.length*vt.length<chua) h+='<div class="alert w">⚠<span class="sp"><b>'+esc(l.ten)+'</b>: khung tiết chỉ có <b>'+vt.length+' vị trí/tuần × '+W.length
   +' tuần còn lại = '+vt.length*W.length+'</b> chỗ, cần <b>'+chua+'</b> buổi — chắc chắn có buổi không xếp được.</span></div>';
  const vuot=BXL.tuanCua(l).filter(w=>BXL.tietKeHoach(l,w)>CFG.tranTiet);
  if(vuot.length) h+='<div class="alert w">⚠<span class="sp"><b>'+esc(l.ten)+'</b>: cấu hình <b>'+l.soBuoi+' buổi × '+l.soTiet+' tiết</b> trong <b>'
   +BXL.tuanCua(l).length+' tuần</b> ⇒ <b>'+vuot.length+' tuần</b> có '+Math.max(...vuot.map(w=>BXL.tietKeHoach(l,w)))+' tiết — vượt trần <b>'+CFG.tranTiet
   +' tiết/tuần/môn</b>. <span class="src">TT 29/2024 Đ.5</span> Cảnh báo, không chặn.</span>'
   +'<button class="btn xs" data-a="nav.tab" data-v="cauhinh">⚙ Sửa số buổi</button></div>';
  const tr=bs.filter(BXL.dangTrung);
  if(tr.length) h+='<div class="alert r">⚠<span class="sp"><b>'+esc(l.ten)+'</b>: <b>'+tr.length+' buổi đã xếp nhưng nay va chạm</b> — phát sinh <b>sau</b> khi xếp. '
   +'Máy không tự dời. '+tr.map(b=>'<a class="lk" data-a="xep.chon" data-v="'+b.id+'">buổi '+b.so+' ('+k2n(b.ngay)+')</a>').join(' · ')+'</span>'
   +(can('xepLich')?'<button class="btn xs" data-a="xep.lai" data-v="'+l.id+'">⚙ Xếp lại các buổi đang trùng</button>':'')+'</div>';
 });
 return h;
}

    +(k.qua?' <span class="tg c">tuần đã qua</span>':'')+'</div>';

   else if(k.goiY) h+='<div class="gy">💡 Vị trí khả thi gần nhất: <b>'+BXL.nhan(k.goiY.s.ngay,k.goiY.s.tiet,k.goiY.s.tu,k.goiY.s.den,l.soTiet)+'</b>'

function veBuoiDangChon(b){
 const l=lopById(b.lop), tt=ttBuoi(b), iss=b.ngay?BXL.cua(b):[], coDinh=b.ngay&&(b.ngay<=HOMNAY||daDiemDanh(b));
 const tv=b.ngay?thanhVienNgay(l.id,b.ngay):tvHoc(l.id).map(t=>t.hs);

 let h='<div class="card selc"><div class="ch"><i class="dotc '+mauLop(l.id)+'"></i>Buổi '+b.so+' · '+esc(l.ten)+' · '+esc(DAN_Y[l.id][b.so-1]||'')

 h+='<div class="f"><div class="k">Ngày · tiết · phòng</div><div class="v">'+(b.ngay?BXL.nhan(b.ngay,b.tiet,b.tu,b.den,l.soTiet)+' · '+esc(PHONG[b.phong].ten):'—')+'</div></div>';
 h+='<div class="f"><div class="k">Giáo viên dạy buổi này</div><div class="v">'+esc(tenGV(b.gv))+(b.gv!==l.gv?' <span class="tg b">dạy thay '+esc(tenGV(l.gv))+'</span>':'')+'</div></div>';
 if(b.nguon) h+='<div class="f"><div class="k">Nguồn xếp</div><div class="v">'+esc(b.boi)+' · '+b.luc+(b.lyDo?' · lý do: '+esc(b.lyDo):'')+'</div></div>';
 if(!b.ngay) h+='<div class="f"><div class="k">Va chạm</div><div class="v">Chưa xếp — bấm một ô trên lưới: <b>✓</b> đặt được ngay, <b>⚠</b> đặt được kèm cảnh báo, <b>⛔</b> vướng.</div></div>';
 else if(!iss.length) h+='<div class="f"><div class="k">Va chạm</div><div class="v okt">✅ Không va chạm — đã đối chiếu chính khóa của '+tv.length+' em (M4.6 · M4.7), lịch GV (M4.7), phòng (M6.4), ngày nghỉ (M10.9), ngoại khóa (M6.2)</div></div>';
 else h+='<div class="f"><div class="k">Va chạm hiện tại</div><div class="v col">'+iss.map(x=>'<div>'+BXL.moTa(x)

 h+='</div><div class="cact">';
 if(coDinh) h+='<span class="mini">Buổi '+(daDiemDanh(b)?'đã điểm danh':'đã tới ngày')+' — <b>không dời được</b>. Buổi hoãn thì ghi ở điểm danh, không sửa lịch sử.</span>';
 else if(can('xepTay')){

/* vị trí tốt nhất cho buổi `b` trong một (ngày, buổi trong ngày) — chỉ trong KHUNG TIẾT của lớp */
function totNhat(b,ngay,buoi){
 const l=lopById(b.lop);
 const c=BXL.viTri(l).filter(v=>v.thu===thuCua(ngay)&&v.buoi===buoi).map(v=>{
  const iss=BXL.xungDot({lop:l,bid:b.id,ngay,tu:v.tu,den:v.den,phong:b.phong,gv:b.gv});
  const hang=iss.some(x=>x.muc==='cung')?3:iss.some(x=>x.muc==='hs')?2:iss.length?1:0;
  return {v,iss,hang};
 }).filter(x=>!(b.ngay===ngay&&b.tiet===x.v.tiet));
 c.sort((x,y)=>x.hang-y.hang||x.iss.length-y.iss.length||x.v.tiet-y.v.tiet);
 return c[0]||null;
}
function dauO(t,l){
 const c=t.iss.filter(x=>x.muc==='cung'), hs=t.iss.filter(x=>x.muc==='hs'), m=t.iss.filter(x=>x.muc==='mem'), nt=nhanTiet(t.v.tiet,l.soTiet);
 if(c.length) return '<span class="mk r" title="'+esc(c.map(x=>x.nd).join(' · '))+'">⛔ '+esc({nghi:'ngày nghỉ',gv:'GV bận',phong:'phòng bận',lop:'đã có buổi'}[c[0].loai])+'</span>';
 if(hs.length){const n=new Set(hs.flatMap(x=>x.ai)).size;return '<span class="mk r" title="'+esc(hs.map(x=>x.nd).join(' · '))+'">⛔ '+n+' em vướng · '+nt+'</span>'}
 if(m.length) return '<span class="mk w" title="'+esc(m.map(x=>x.nd).join(' · '))+'">⚠ '+m.length+' · '+nt+'</span>';
 return '<span class="mk g">✓ '+nt+'</span>';
}

function theBuoi(b,sel){
 const l=lopById(b.lop), tr=BXL.dangTrung(b), mem=b.ngay&&BXL.moi(b).some(x=>x.muc==='mem'), dd=daDiemDanh(b);
 const keo=can('xepTay')&&!(b.ngay&&(b.ngay<=HOMNAY||dd));
 return '<span class="bc '+mauLop(l.id)+(sel&&sel.id===b.id?' sel':'')+(tr?' bad':'')+'"'+(keo?' draggable="true"':'')+' data-a="xep.chon" data-v="'+b.id+'" data-drag="'+b.id+'" title="'
  +esc(l.ten+' · buổi '+b.so+' · '+(DAN_Y[l.id][b.so-1]||'')+(b.ngay?' · '+nhanTiet(b.tiet,l.soTiet)+' '+b.tu+'–'+b.den:''))+'">'+esc(ngan(l))+' #'+b.so
  +(b.ngay&&b.tiet?'<i class="tt">'+nhanTiet(b.tiet,l.soTiet).replace('tiết ','t')+'</i>':'')
  +'<i>'+(dd?'✓':b.nguon==='tay'?'✎':b.nguon==='may'?'⚙':'')+(tr?' ⛔':mem?' ⚠':'')+'</i></span>';
}

/* LƯỚI — cột = (thứ, buổi trong ngày) có ít nhất một vị trí trong khung tiết của các lớp đang xem */
function veLuoi(dot,ls,sel){
 const ids=ls.map(l=>l.id), bs=BUOI.filter(b=>ids.includes(b.lop));
 const chua=bs.filter(b=>!b.ngay).sort((a,b)=>a.lop<b.lop?-1:a.lop>b.lop?1:a.so-b.so);
 let h='<div class="tray"><b>Chưa xếp ('+chua.length+')</b>'+(chua.length?chua.map(b=>theBuoi(b,sel)).join(''):'<span class="mini">— mọi buổi đã có ngày</span>')+'</div>';
 const cot=[]; THU_TUAN.forEach(t=>Object.keys(BUOI_NGAY).forEach(bn=>{
  if(ls.some(l=>BXL.viTri(l).some(v=>v.thu===t&&v.buoi===bn))) cot.push({thu:t,buoi:bn});
 }));
 const W=[];let w=dauTuan(dot.tu);while(w<=dot.den){W.push(w);w=addD(w,7)}
 const selMove=sel&&can('xepTay')&&!(sel.ngay&&(sel.ngay<=HOMNAY||daDiemDanh(sel))), sl=sel&&lopById(sel.lop);
 if(!cot.length) return h+'<div class="empty">Chưa lớp nào có khung tiết bồi dưỡng — bấm <b>🗓 Chọn khung tiết</b> ở trên.</div>';
 h+='<div class="tbw tbx"><table class="luoi"><tr><th>Tuần</th>'+cot.map(c=>'<th>'+THU[c.thu]+' · '+BUOI_NGAY[c.buoi]+'</th>').join('')+'<th>Ngoài khung ✎</th></tr>';
 W.forEach((w,i)=>{
  const qua=addD(w,6)<HOMNAY;
  h+='<tr'+(qua?' class="qua"':'')+'><td class="nw"><b>Tuần '+(i+1)+'</b><div class="mini">'+k2n(w)+'–'+k2n(addD(w,6))+'</div></td>';
  const trongTuan=bs.filter(b=>b.ngay&&dauTuan(b.ngay)===w), dung=new Set();
  cot.forEach(c=>{
   const ngay=addD(w,thuOffset(c.thu)), nn=ngayNghi(ngay);
   const o=trongTuan.filter(b=>b.ngay===ngay&&buoiCuaGio(b.tu)===c.buoi&&BXL.viTri(lopById(b.lop)).some(v=>v.thu===c.thu&&v.tiet===b.tiet));
   o.forEach(b=>dung.add(b.id));
   const tn=selMove&&ngay>HOMNAY&&ngay>=sl.tu&&ngay<=sl.den?totNhat(sel,ngay,c.buoi):null;
   h+='<td class="o'+(nn?' nghi':'')+(ngay<=HOMNAY?' da':'')+(tn?' dat':'')+'"'+(tn?' data-a="xep.dat" data-v="'+ngay+'|'+tn.v.tiet+'"':'')
    +' data-drop="'+ngay+'|'+c.buoi+'"><div class="od">'+k2n(ngay)+(nn?' <span class="tg c">'+esc(nn.ten.split(' — ')[0])+'</span>':'')+'</div>'

/* ---------- đặt tay — một phép xét cho mọi lối vào (ô lưới · kéo thả · hộp thoại · gợi ý). s = {ngay, tiet, phong?, gv?} ---------- */
function thuDat(b,s){
 const l=lopById(b.lop), d=doanTiet(s.tiet,l.soTiet);
 if(!d){toast('⛔ Từ '+nhanTiet(s.tiet,1)+' không đủ '+l.soTiet+' tiết liền nhau trong cùng một buổi.');return}
 Object.assign(s,{tu:d.tu,den:d.den}); s.phong=s.phong||b.phong; s.gv=s.gv||b.gv;
 if(s.ngay<=HOMNAY){toast('⛔ Không xếp buổi vào <b>hôm nay hoặc ngày đã qua</b> — buổi đã qua ghi ở điểm danh, không sửa lịch sử.');return}
 if(s.ngay<l.tu||s.ngay>l.den){toast('⛔ Ngày '+k2s(s.ngay)+' nằm ngoài khung ngày của lớp ('+k2s(l.tu)+' → '+k2s(l.den)+').');return}
 const iss=BXL.xungDot({lop:l,bid:b.id,ngay:s.ngay,tu:s.tu,den:s.den,phong:s.phong,gv:s.gv});
 const cung=iss.filter(x=>x.muc==='cung'), hs=iss.filter(x=>x.muc==='hs'), mem=iss.filter(x=>x.muc==='mem');
 const nhan=BXL.nhan(s.ngay,s.tiet,s.tu,s.den,l.soTiet);
 if(cung.length){
  modal('⛔ Không đặt được buổi '+b.so+' vào '+nhan,
   cung.map(x=>'<div class="ln">'+BXL.moTa(x)+'</div>').join('')
   +'<div class="ro" style="margin-top:10px">Đây là ràng buộc <b>vật lý</b> — một người, một phòng không ở hai nơi cùng lúc; ngày nghỉ do <b>M10.9</b> quyết. '
   +'Muốn dùng vị trí này thì xử lý ở nguồn: <a class="lk" data-lnk="M4.7">↗ M4.7</a> · <a class="lk" data-lnk="M6.4">↗ M6.4</a> · <a class="lk" data-lnk="M10.9">↗ M10.9</a>.</div>',
   '<button class="btn" data-mb="close">Đóng</button>');
  return;
 }
 const ngoaiKhung=!BXL.viTri(l).some(v=>v.thu===thuCua(s.ngay)&&v.tiet===s.tiet);
 if(!hs.length&&!mem.length&&!ngoaiKhung){datBuoi(b,s,'tay','',[]);ghiAudit('Dời buổi',l.ten+' buổi '+b.so+' → '+nhan);
  toast('✎ Đã dời <b>buổi '+b.so+'</b> sang <b>'+nhan+'</b> — không va chạm. Thẻ mang dấu ✎, bộ xếp sẽ không đụng tới nữa.');render();return}
 const batBuoc=hs.length||mem.some(x=>x.loai==='tran')||ngoaiKhung;
 mfns.bdat=()=>{
  const ly=($('#lyDat').value||'').trim();
  if(batBuoc&&!ly){$('#lyDat').classList.add('err');$('#lyDatM').textContent='Bắt buộc ghi lý do.';return}
  datBuoi(b,s,'tay',ly,iss.map(x=>x.key),(hs.length?' · chấp nhận '+new Set(hs.flatMap(x=>x.ai)).size+' em vướng':'')+(ngoaiKhung?' · ngoài khung tiết':''));
  ghiAudit('Đặt tay buổi có va chạm',l.ten+' buổi '+b.so+' → '+nhan+' · '+iss.map(x=>x.loai).concat(ngoaiKhung?['ngoaikhung']:[]).join(',')+' · lý do: '+ly);
  closeM();render();
  toast('✎ Đã đặt <b>buổi '+b.so+'</b> vào '+nhan+'. Va chạm và lý do <b>ghi vào buổi + audit</b>'+(hs.length?' — các em vướng sẽ hiện trong điểm danh buổi đó':'')+'.');
 };
 modal('Đặt buổi '+b.so+' · '+esc(l.ten)+' vào '+nhan,
  (ngoaiKhung?'<div class="ln">⚠ <span class="tg b">Ngoài khung tiết</span> Vị trí này không nằm trong khung tiết bồi dưỡng đã chọn của lớp ('+esc(BXL.tomTatKhung(l)||'chưa chọn')+').</div>':'')
  +hs.map(x=>'<div class="ln">'+BXL.moTa(x)+'</div>').join('')+mem.map(x=>'<div class="ln">'+BXL.moTa(x)+'</div>').join('')
  +(hs.length?'<div class="danger" style="margin-top:10px">Các em vướng <b>không thể có mặt</b> ở buổi này. Hệ thống <b>không tự loại</b> em nào khỏi lớp — '
   +'đặt thì danh sách em vướng ghi vào buổi, người điểm danh thấy ngay.</div>':'')
  +(mem.some(x=>x.loai==='tran')?'<div class="warn" style="margin-top:10px">Dạy thêm trong nhà trường: mỗi môn <b>không quá '+CFG.tranTiet+' tiết/tuần</b> — '
   +'<b>TT 29/2024/TT-BGDĐT, Điều 5</b>. Phần mềm <b>cảnh báo, không chặn</b>; quyết định là của nhà trường và được ghi lại.</div>':'')
  +'<label class="lbl">Lý do '+(batBuoc?'<span style="color:var(--red)">*</span>':'(không bắt buộc)')+'</label>'
  +'<textarea class="fldi" id="lyDat" rows="2" placeholder="VD: tuần thi thử cấp tỉnh — dồn hai buổi"></textarea><div class="mini" id="lyDatM" style="color:var(--red)"></div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="dat">Vẫn đặt (✎)</button>');
}

    if(ban.length){const nh=ban.every(b=>b.nd.startsWith('Buổi sáng'))?'chính khóa':[...new Set(ban.map(b=>b.ai))].slice(0,2).join(', ')+(new Set(ban.map(b=>b.ai)).size>2?'…':'');
     return '<td class="kc ban" data-a="kt.o" data-v="'+o+'" title="'+esc(tip)+'">'+esc(nh)+(ban.every(b=>b.tuNgay)?'<div class="mini">từ '+k2n(ban[0].tuNgay)+'</div>':'')+'</td>'}

 let h='<div class="alert b">🔒<span class="sp"><b>Điểm thi thử trong đợt ôn — chỉ để thống kê.</b> Không vào <b>M2.5</b> Bảng điểm · <b>M3.1</b> Tổng kết · <b>học bạ</b> · <b>CSDL ngành</b> · <b>không phải điểm thi tốt nghiệp (M3.4)</b>. '
  +'Thang '+CFG.thang+', không hệ số, không xếp loại.</span>'+(sua?'<button class="btn xs" data-a="nb.them" data-v="'+l.id+'">＋ Lần thi thử</button>':'')+'</div>';
 if(!tv.length) return h+'<div class="empty">Lớp chưa có thành viên.</div>';
 if(!bai.length) h+='<div class="hint">Chưa có lần thi thử nào.</div>';
 h+='<div class="tbw tbx"><table><tr><th>Học sinh</th>'+bai.map(x=>'<th class="num">'+esc(x.ten)+'<div class="mini">'+k2n(x.ngay)+'</div></th>').join('')
  +'<th class="num">TB thi thử</th><th class="num">'+esc(MON[l.mon].ten)+' chính khóa 🔗 M3.1</th></tr>';
 tv.forEach(t=>{
  const hs=hsById(t.hs);
  h+='<tr'+(t.tt==='roi'?' class="mo"':'')+'><td class="nw">'+esc(hs.ten)+(t.tt==='roi'?' <span class="mini">rời '+k2n(t.roi.ngay)+'</span>':'')+'</td>'
   +bai.map(x=>{const v=DIEM[x.id]&&DIEM[x.id][t.hs], duoc=sua&&t.vao<=x.ngay&&(t.tt==='hoc'||t.roi.ngay>x.ngay);
    return '<td class="num">'+(duoc?'<input class="dcell" data-diem="'+x.id+'|'+t.hs+'" value="'+(v==null?'':v)+'">':f1(v))+'</td>'}).join('')
   +'<td class="num"><b>'+f1(tbNoiBo(l.id,t.hs))+'</b></td><td class="num"><span class="ro1">'+f1(hs.ck[l.mon])+'</span></td></tr>';
 });
 return h+'</table><div class="lgd"><span>🔗 Cột cuối là bản chiếu chỉ đọc — chiều ngược lại (điểm nội bộ → chính khóa) <b>không tồn tại</b></span></div></div>';
}

/* GVCN — cùng dữ liệu, đơn vị dòng đổi sang HỌC SINH của lớp mình (tiền lệ M6.2 §4.1) */
/* GVCN — đơn vị dòng là HỌC SINH lớp mình; Toán · Văn · các môn tự chọn em ĐĂNG KÝ ÔN (số môn tùy em): lớp ôn · chuyên cần · thi thử gần nhất */
function veGVCN(){
 const r=R(), ds=HS.filter(h=>h.lop===r.lop);
 const dots=DOT.filter(d=>d.nam===ST.nam&&!d.huy);
 if(!dots.find(d=>d.id===ST.cnDot)) ST.cnDot=(dots.find(d=>ttDot(d)[0]==='Đang diễn ra')||dots[0]||{}).id;
 let h=scopeBar()+'<div class="hint">GVCN không quản lý lớp ôn — màn hình này trả lời <b>em nào của lớp mình đang ôn môn gì, đi học ra sao</b>. '
  +'Ghi em <b>rút môn ôn</b> (đơn của gia đình) ở <a class="lk" data-a="nav.tab" data-v="dk">tab 2</a>.</div>';
 if(dots.length>1) h+='<div class="bar">'+dots.map(d=>'<button class="chip'+(d.id===ST.cnDot?' on':'')+'" data-a="cn.dot" data-v="'+d.id+'">'+esc(d.ten)+'</button>').join('')+'</div>';
 if(!ST.cnDot) return h+'<div class="empty">Chưa có đợt ôn nào ở năm học này.</div>';
 h+='<div class="tbw tbx"><table><tr><th>Học sinh</th><th>Toán</th><th>Ngữ văn</th><th>Môn tự chọn đăng ký ôn</th>'+(SIM.m34?'<th>Môn thi chính thức 🔗 M3.4</th>':'')+'</tr>';
 ds.forEach(hs=>{
  const o=m=>{
   const rt=rutCua(hs.id,m), t=THANH_VIEN.filter(z=>z.hs===hs.id&&(l=>l&&l.dot===ST.cnDot&&l.mon===m)(lopById(z.lop)));
   if(rt) return '<td><b>'+esc(TEN_NGAN[m])+'</b> <span class="tg n" title="'+esc(rt.lyDo+' — '+rt.ghi)+'">rút ôn</span></td>';
   if(!t.length) return '<td><b>'+esc(TEN_NGAN[m])+'</b> <span class="mini">chưa có lớp</span></td>';
   return '<td>'+t.map(z=>{const c=chuyenCan(z.lop,hs.id), b=BAI_KT.filter(x=>x.lop===z.lop&&DIEM[x.id]&&DIEM[x.id][hs.id]!=null).pop();
    return '<b>'+esc(tenLop(z.lop))+'</b>'+(z.tt==='roi'?' <span class="mini">(đã rời)</span>':'')
     +'<div class="mini"><span class="'+(c.pt!=null&&c.pt<CFG.nguongCC?'red':'')+'">'+(c.pt==null?'—':c.pt+'%')+'</span>'+(b?' · '+esc(b.ten.split(' —')[0])+': <b>'+f1(DIEM[b.id][hs.id])+'</b> 🔒':'')+'</div>'}).join('')+'</td>';
  };
  const tc=monOn(hs.id).filter(m=>MON[m].thi==='tc'), cell=m=>monOn(hs.id).includes(m)?o(m):'<td><span class="mini">không đăng ký ôn</span></td>';
  h+='<tr><td class="nw"><b>'+esc(hs.ten)+'</b></td>'+cell('toan')+cell('van')
   +'<td><div class="tcw">'+(tc.map(m=>o(m).replace(/^<td>|<\/td>$/g,'')).map(x=>'<div class="tci">'+x+'</div>').join('')||'<span class="mini">—</span>')+'</div></td>'
   +(SIM.m34?'<td>'+oThiCT(hs.id)+'</td>':'')+'</tr>';
 });
 return h+'</table><div class="lgd"><span>% chuyên cần buổi ôn (đỏ dưới '+CFG.nguongCC+'% — để hỏi thăm)</span><span>🔒 điểm thi thử gần nhất — chỉ thống kê</span></div></div>';
}

ON['lop.dd']=v=>{
 const b=buoiById(v), l=lopById(b.lop), tv=thanhVienNgay(l.id,b.ngay), cu=DD[b.id], ghi=can('diemDanh')&&!l.huy;
 const vuong=new Set(BXL.cua(b).filter(x=>x.muc==='hs').flatMap(x=>x.ai));
 const tam={}; tv.forEach(h=>tam[h]=cu&&cu.ds[h]||'');
 const ve=()=>tv.map(h=>'<div class="ddrow"><span class="nm">'+esc(tenHS(h))+' <span class="mini">'+hsById(h).lop+'</span>'
  +(vuong.has(h)?' <span class="tg r" title="Đã biết khi đặt buổi">⛔ vướng chính khóa</span>':'')+'</span><span class="ddb">'
  +Object.keys(TT_DD).map(k=>'<button data-a="dd.set" data-v="'+h+'|'+k+'" class="'+(tam[h]===k?'on '+k:'')+'"'+(ghi?'':' disabled')+'>'+TT_DD[k][0]+'</button>').join('')+'</span></div>').join('');
 mfns._dd={tam,ve,b};
 const thay=R().gv&&R().gv!==b.gv||(!R().gv&&R().n!==tenGV(b.gv));
 mfns.bddluu=()=>{
  const thieu=tv.filter(h=>!tam[h]);
  if(thieu.length){toast('⛔ Còn <b>'+thieu.length+' em</b> chưa chọn trạng thái: '+thieu.map(h=>esc(tenHS(h))).join(', '));return}
  DD[b.id]={boi:R().n+(thay?' — nhập thay '+tenGV(b.gv):''),luc:k2n(HOMNAY)+' '+GIO,ds:Object.assign({},tam)};
  ghiAudit(cu?'Sửa điểm danh':'Điểm danh',l.ten+' buổi '+b.so+' ('+k2n(b.ngay)+')');
  closeM();render();toast('✅ Đã lưu điểm danh <b>buổi '+b.so+'</b>. Buổi này nay tính là <b>đã dạy</b> cho <b>'+esc(tenGV(b.gv))+'</b> ở báo cáo số buổi dạy.');
 };
 modal('Điểm danh — '+esc(l.ten)+' · buổi '+b.so+' · '+kThu(b.ngay)+' '+k2s(b.ngay)+' '+b.tu,
  (b.ngay<HOMNAY?'<div class="alert w" style="margin-bottom:8px">📅<span class="sp">Đang ghi cho buổi <b>'+k2s(b.ngay)+'</b>, không phải hôm nay.</span></div>':'')
  +(thay&&ghi?'<div class="ro">✍ Bạn đang <b>nhập thay '+esc(tenGV(b.gv))+'</b> — bản ghi mang tên bạn kèm nhãn «nhập thay».</div>':'')
  +(cu?'<div class="mini">Lần ghi trước: '+esc(cu.boi)+' · '+cu.luc+'</div>':'')
  +(ghi?'<div class="bar" style="padding:6px 0"><button class="btn xs" data-a="dd.all">✓ Tất cả có mặt</button><span class="mini">Đi muộn vẫn tính có mặt khi tính chuyên cần.</span></div>':'')
  +'<div id="ddList">'+ve()+'</div>',
  '<button class="btn" data-mb="close">Đóng</button>'+(ghi?'<button class="btn p" data-mb="ddluu">Lưu điểm danh</button>':''));
};
ON['dd.set']=v=>{const[h,k]=v.split('|'),m=mfns._dd;m.tam[h]=m.tam[h]===k?'':k;$('#ddList').innerHTML=m.ve()};
ON['dd.all']=()=>{const m=mfns._dd;Object.keys(m.tam).forEach(h=>{if(!m.tam[h])m.tam[h]='cm'});$('#ddList').innerHTML=m.ve()};

ON['tv.roi']=v=>{
 const[lop,hs]=v.split('|'), t=THANH_VIEN.find(x=>x.lop===lop&&x.hs===hs);
 mfns.broi=()=>{
  const ly=$('#rLy').value, ghi=$('#rGhi').value.trim(), ngay=$('#rNgay').value||HOMNAY;

 };
 modal('Rời lớp — '+esc(tenHS(hs))+' · '+esc(tenLop(lop)),

  +'<label class="lbl">Lý do</label><select class="fldi" id="rLy"><option>Chuyển sang lớp ôn khác cùng môn</option><option>Đổi môn đăng ký ôn</option><option>Rút tự nguyện (TT 29/2024)</option><option>Sức khỏe</option><option>Chuyển trường</option><option>Khác</option></select>'
  +'<label class="lbl">Ghi rõ <span style="color:var(--red)">*</span></label><textarea class="fldi" id="rGhi" rows="2" placeholder="VD: đơn phụ huynh gửi GVCN ngày …"></textarea>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="roi">Xác nhận rời lớp</button>');
};

ON['tv.them']=v=>{
 const l=lopById(v), dang=tvHoc(v).map(t=>t.hs);
 /* M11.1: em ôn môn này mà chưa có lớp ở đợt này đứng đầu; em không thi môn này vẫn thêm được (ôn tự nguyện) */
 const uuTien=h=>monOn(h.id).includes(l.mon)&&!rutCua(h.id,l.mon)&&!tvMonDot(h.id,l.mon,l.dot).length?0:monOn(h.id).includes(l.mon)?1:2;
 const ung=HS.filter(h=>h.lop.startsWith(l.khoi)&&!dang.includes(h.id)).sort((a,b)=>uuTien(a)-uuTien(b));
 mfns.bthem=()=>{
  const chon=$$('#mb input[name=hsm]:checked').map(x=>x.value);
  if(!chon.length){toast('Chọn ít nhất một học sinh.');return}
  const vao=HOMNAY>l.tu?HOMNAY:l.tu;
  chon.forEach(h=>{const cu=THANH_VIEN.find(t=>t.lop===v&&t.hs===h);
   if(cu) Object.assign(cu,{tt:'hoc',roi:null,vao,nguon:'tay',boi:R().n}); else THANH_VIEN.push({lop:v,hs:h,nguon:'tay',vao,boi:R().n,tt:'hoc',roi:null})});
  /* kiểm buổi TƯƠNG LAI đã xếp — em mới vướng buổi nào (L10) */
  const vuong=[];
  buoiCua(v).filter(b=>b.ngay&&b.ngay>=vao).forEach(b=>BXL.cua(b).filter(x=>x.muc!=='mem'&&x.ai.some(a=>chon.includes(a))).forEach(x=>
   vuong.push('Buổi '+b.so+' ('+kThu(b.ngay)+' '+k2n(b.ngay)+') — '+x.ai.filter(a=>chon.includes(a)).map(tenHS).join(', ')+': '+x.nd)));
  ghiAudit('GV thêm học sinh trực tiếp',l.ten+' · '+chon.map(tenHS).join(', '));
  modal('Kết quả thêm học sinh — '+esc(l.ten),
   '<div class="okbox">✅ Đã thêm <b>'+chon.length+' em</b> từ '+k2s(vao)+', đường vào <b>Thêm tay</b> — ghi tên '+esc(R().n)+'.</div>'
   +(vuong.length?'<div class="warn"><b>⚠ '+vuong.length+' buổi đã xếp nay có em mới vướng:</b><br>'+vuong.map(esc).join('<br>')
    +'<br>Hệ thống <b>không tự dời buổi</b> — các buổi này hiện ở chip <b>đang va chạm</b> của tab Xếp lịch.</div>':'<div class="mini">Không em nào vướng buổi đã xếp.</div>'),
   '<button class="btn p" data-mb="close">Đóng</button>');
  render();
 };
 modal('＋ Thêm học sinh vào '+esc(l.ten),
  '<div class="hint">Học sinh khối '+l.khoi+' của trường. Em <b>ôn '+esc(TEN_NGAN[l.mon])+' mà chưa có lớp</b> đứng đầu. Đường vào ghi <b>Thêm tay</b> kèm tên bạn — phân biệt với em được chia theo đăng ký ôn.</div>'
  +'<div style="max-height:320px;overflow:auto;margin-top:8px">'+ung.map(h=>{const khac=THANH_VIEN.filter(t=>t.hs===h.id&&t.tt==='hoc'&&t.lop!==v);
   return '<label class="tick"><input type="checkbox" name="hsm" value="'+h.id+'"> <b>'+esc(h.ten)+'</b> <span class="mini">'+h.lop
    +['<span class="tg b">ôn '+esc(TEN_NGAN[l.mon])+' — chưa có lớp</span>',' · đã có lớp '+esc(TEN_NGAN[l.mon])+' khác',' · <b>chưa đăng ký ôn '+esc(TEN_NGAN[l.mon])+'</b>'][uuTien(h)]
    +(khac.length?' · đang học '+khac.map(t=>esc(tenLop(t.lop))).join(', '):'')+(THANH_VIEN.find(t=>t.hs===h.id&&t.lop===v&&t.tt==='roi')?' · <b>đã từng rời lớp này</b>':'')+'</span></label>'}).join('')+'</div>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="them">Thêm</button>');
};

/* ═══════════ M11.1 — CẶP MÔN CHẶN NHAU (tầng hiển thị trên bảng kết quả của khuôn — không sửa app.30) ═══════════
   Ràng buộc nặng nhất của M11.1: mỗi em học nhiều lớp ôn khác môn cùng lúc, hai lớp ôn có chung học sinh không được
   trùng buổi. Khuôn đã có va chạm loại 'nhom' (⛔ học sinh) và nêu đích danh từng em; ở đây GOM THEO CẶP LỚP ÔN:
   "Hóa 1 × Lý 1 chặn nhau vì 26 em" — rồi chỉ ra ô còn trống cho mọi em của lớp bị chặn. */

const buoiCuaKey=k=>{const m=/^hsb:([^:]+):/.exec(k||'');return m?buoiById(m[1]):null};

/* nguồn: ① bảng kết quả lần chạy gần nhất — buổi KHÔNG xếp được, ở mọi vị trí đã thử · ② buổi đã xếp nay đang trùng */
function capMonChan(ls){
 const ids=new Set(ls.map(l=>l.id)), cap=new Map();
 const ghi=(la,lb,ai,bid)=>{
  const [x,y]=[la,lb].sort(), k=x+'|'+y; let c=cap.get(k);
  if(!c){c={a:lopById(la),b:lopById(lb),em:new Set(),buoi:new Set()};cap.set(k,c)}
  ai.forEach(h=>c.em.add(h)); c.buoi.add(bid);
 };
 if(KQ_XEP) KQ_XEP.lop.forEach(r=>{if(!ids.has(r.lop))return;
  r.khong.forEach(k=>{if(buoiById(k.b).ngay)return;
   k.thu.forEach(t=>t.iss.filter(x=>x.loai==='nhom').forEach(x=>{const b2=buoiCuaKey(x.key);if(b2)ghi(r.lop,b2.lop,x.ai,k.b)}))})});
 ls.forEach(l=>buoiCua(l.id).filter(BXL.dangTrung).forEach(b=>BXL.moi(b).filter(x=>x.loai==='nhom').forEach(x=>{
  const b2=buoiCuaKey(x.key);if(b2)ghi(l.id,b2.lop,x.ai,b.id)})));
 return [...cap.values()].sort((p,q)=>q.em.size-p.em.size);
}

/* vị trí k tiết còn trống cho MỌI em của lớp l: không chính khóa (mẫu tuần, của lớp CK từng em + GV), không là khung
   của lớp ôn khác có chung học sinh, chưa nằm trong khung của l. Kèm ⚠ sát giờ chính khóa. */
function oTrongChoLop(l){
 const oc=oCuaLopKhac(l), cua=new Set(l.khung||[]), out=[], lck=BXL.lopCKCua(l);
 [1,2,3,4,5,6].forEach(thu=>KHUNG_TIET.forEach(t=>{
  const d=doanTiet(t.id,l.soTiet); if(!d) return;
  if(d.ids.some(id=>BXL.banTuan(l,thu,id).length||oc[thu+'|'+id]||cua.has(thu+'|'+id))) return;
  const sat=lck.filter(c=>TKB_CK.some(x=>x.lop===c&&x.thu===thu&&(x.ban!=='b2'||SIM.tkb2)&&h2m(d.tu)-h2m(x.den)>=0&&h2m(d.tu)-h2m(x.den)<CFG.nghiCung));
  out.push({thu,tiet:t.id,nhan:THU[thu]+' '+nhanTiet(t.id,l.soTiet),sat});
 }));
 return out;
}

function veCapMon(ls){
 const ds=capMonChan(ls);
 if(!ds.length) return KQ_XEP?'<div class="capok">🔗 Lần chạy này <b>không có cặp môn nào chặn nhau</b> — các lớp ôn có chung học sinh đã tách được buổi.</div>':'';
 let h='<div class="card capm"><div class="ch">🔗 Cặp môn đang chặn nhau <span class="mini">— hai lớp ôn khác môn có chung học sinh không được trùng buổi</span></div><div class="cb">';
 ds.forEach(c=>{
  const bi=[...c.buoi].map(buoiById), bl=lopById(bi[0].lop), khac=bl.id===c.a.id?c.b:c.a;
  const theoLop={}; c.em.forEach(hh=>{const x=hsById(hh).lop;theoLop[x]=(theoLop[x]||0)+1});
  const o=oTrongChoLop(bl);
  h+='<div class="capr"><div class="caph"><b>'+esc(MON[c.a.mon].ten)+' × '+esc(MON[c.b.mon].ten)+'</b> · '
   +'<i class="dotc '+mauLop(c.a.id)+'"></i>'+esc(c.a.ten)+' × <i class="dotc '+mauLop(c.b.id)+'"></i>'+esc(c.b.ten)
   +' — chặn nhau vì <b class="red">'+c.em.size+' em</b> <span class="mini">('+Object.keys(theoLop).sort().map(x=>x+': '+theoLop[x]).join(' · ')+')</span></div>'
   +'<div class="mini">'+esc(bl.ten)+' vướng ở <b>'+bi.length+' buổi</b>: '+bi.map(b=>'<a class="lk" data-a="xep.chon" data-v="'+b.id+'">#'+b.so+(b.ngay?' '+k2n(b.ngay):' (chưa xếp)')+'</a>').join(' · ')
   +' — khung tiết '+esc(bl.ten)+' ('+esc(BXL.tomTatKhung(bl)||'trống')+') trùng khung '+esc(khac.ten)+' ('+esc(BXL.tomTatKhung(khac))+')</div>'
   +'<div class="gy">💡 Ô còn trống cho cả <b>'+tvHoc(bl.id).length+' em</b> của '+esc(bl.ten)+' và GV '+esc(tenGV(bl.gv))+': '
   +(o.length?o.slice(0,7).map(x=>'<span class="pill">'+esc(x.nhan)+(x.sat.length?' <span class="wt" title="Sát giờ chính khóa '+esc(x.sat.join(', '))+'">⚠ sát giờ</span>':'')+'</span>').join(' '):'<b>không còn ô nào</b> — phải chia lại học sinh giữa hai lớp')
   +(can('xepLich')?' <button class="btn xs" data-a="kt.mo" data-v="'+bl.id+'|xep">🗓 Sửa khung tiết '+esc(bl.ten)+'</button>':'')+'</div></div>';
 });
 return h+'<div class="mini" style="padding:6px 12px 0">Máy không tự đổi khung, không tự chuyển em sang lớp khác (L8) — ô gợi ý đã trừ chính khóa của từng em, GV và khung của mọi lớp ôn có chung học sinh.</div></div></div>';
}

/* ═══════════ M11.1 — TAB «ĐĂNG KÝ MÔN ÔN» (RIÊNG) ═══════════
   Đơn vị dòng: HỌC SINH khối 12. M11.1 SỞ HỮU TRỌN đăng ký môn ôn luyện.
   Đăng ký môn ÔN ≠ đăng ký môn THI: môn thi chính thức em đăng ký trên hệ thống quản lý thi của Bộ (M3.4 theo dõi) —
   em có quyền ôn khác môn thi (chọn ôn X rồi thi Y; thi Anh nhờ miễn thi mà không ôn Anh). Môn thi chỉ CHIẾU 🔗 để tham khảo,
   không bao giờ tự sửa đăng ký ôn hay lớp ôn.
   TT 29/2024 Đ.5 (sửa bởi TT 19/2026): HS cuối cấp tự nguyện đăng ký ôn, nhà trường tổng hợp đăng ký THEO TỪNG MÔN.
   Năng lực: dkImport (ID) · rutOn (S) */

const tenMonNgan=m=>TEN_NGAN[m]||MON[m].ten;
const tcOn=h=>monOn(h).filter(m=>MON[m].thi==='tc');
/* phạm vi dòng của tab — ràng buộc dữ liệu theo vai */
function hsTrongPV(){
 const r=R(); let ds=HS12();
 if(r.sc==='Class') ds=ds.filter(h=>h.lop===r.lop);
 if(r.sc==='Branch') ds=ds.filter(h=>h.dt===r.dt);
 if(r.sc==='Group') ds=ds.filter(h=>monOn(h.id).some(m=>MON[m].to===r.to));
 if(r.sc==='Own'){const ids=new Set(LOP.filter(l=>l.gv===r.gv).flatMap(l=>tvCua(l.id).map(t=>t.hs)));ds=ds.filter(h=>ids.has(h.id))}
 return ds;
}

function lechCua(h){
 const on=new Set(monOn(h).filter(m=>!rutCua(h,m)));
 return THANH_VIEN.filter(t=>t.hs===h&&t.tt==='hoc'&&(l=>l&&!l.huy&&HOMNAY<=dotById(l.dot).den&&!on.has(l.mon)&&!GIU[h+'|'+l.id])(lopById(t.lop)));

/* môn tự chọn THI chính thức ≠ môn tự chọn ÔN — chỉ thông tin, không phải lỗi */

function oThiCT(h){

 return t.map(m=>'<span class="'+(on.includes(m)?'':'tg c')+'" title="'+(on.includes(m)?'thi và ôn':'thi nhưng không đăng ký ôn')+'">'+esc(tenMonNgan(m))+'</span>').join(' + ')

}

   +' <a class="lk" data-a="nav.tab" data-v="chia">↗ Tab 3 · xử lý</a></span>':'')
  +(chuaLop.length?'<span class="vi w">🗓 <b>'+chuaLop.length+' em</b> có môn đăng ký ôn chưa có lớp ở đợt đang xem <a class="lk" data-a="nav.tab" data-v="chia">↗ Tab 3</a></span>':'')+'</div>';

 h+='<div class="bar">'+(dots.length>1?dots.map(d=>'<button class="chip'+(d.id===ST.dkDot?' on':'')+'" data-a="dk.dot" data-v="'+d.id+'">Lớp ôn của: '+esc(d.ten.replace('Ôn thi TN THPT 2027 — ',''))+'</button>').join('')+'<span style="width:10px"></span>':'')

/* ---------- IMPORT — phiếu đăng ký ôn của trường: MỖI MÔN MỘT CỘT, tích 'x' môn em đăng ký ôn ⏳ X3 ---------- */
const COT_MON=[['Toán','toan'],['Ngữ văn','van'],['Tiếng Anh','anh'],['Vật lí','ly'],['Hóa học','hoa'],['Sinh học','sinh'],['Lịch sử','su'],['Địa lí','dia'],['GDKT&PL','ktpl'],['Tin học','tin'],['CN Công nghiệp','cncn'],['CN Nông nghiệp','cnnn']];

function tepMau(){
 /* mẫu cũ của trường còn cột «GDCD» — môn không còn trong danh mục thi TT 24/2024 */
 const cot=COT_MON.map(x=>x[0]).concat(['GDCD']), rows=[]; let n=0;
 const them=(ma,ten,lop,ms,x)=>rows.push(Object.assign({dong:++n,ma,ten,lop,tick:ms},x||{}));

 HS12().forEach(x=>{
  let ms=DK[x.id].mon.slice();
  if(['a5-01','a5-02','a5-03'].includes(x.id)) ms=ms.filter(m=>m!=='dia').concat('ktpl');   /* sau họp PHHS 10/04: bỏ Địa, ôn GDKT&PL */

 });
