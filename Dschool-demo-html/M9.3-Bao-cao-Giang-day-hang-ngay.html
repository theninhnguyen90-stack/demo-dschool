/* ══════════════ TAB 4 · CHẤT LƯỢNG BỘ MÔN ═════════════════════════════
   Khuôn K2 — bảng chéo Lớp × Môn, CHỈ SỐ TỒN (điểm tại ngày chốt).
   🛑 Hai điều dễ sai, cả hai đều nằm ở MẪU SỐ và ở CÁCH ĐẾM Ô.            */
function veTab4() {
  const dsL = dsLop().filter(lopTrongPV);
  const dsM = [];
  dsL.forEach(l => MONLOP[l].forEach(m => {
    if (R().sc === 'Group' && MON[m].to !== R().to) return;
    if (dsM.indexOf(m) < 0) dsM.push(m);
  }));
  let h = daiPV('ô điểm', ODIEM.filter(x => lopTrongPV(x.lop)).length, ODIEM.length);
  h += PV.chotNgay() + PV.daiCanhBao() + daiThieuXD(['m2.5.bang_diem_mon']);
  if (!dsM.length) return h + '<div class="empty">Không có môn nào trong phạm vi đang xem.</div>';

  const dong = dsL.map(l => ({
    id: l, ten: 'Lớp ' + l, nhom: DT[LOP[l].dt], lop: l,
    phu: tenKhoi(l) + ' · ' + capHoc(l)
  })).filter(d => MONLOP[d.lop].some(m => dsM.indexOf(m) >= 0));
  h += KB.K2({
    id: 'kq', tieuDe: 'Điểm trung bình môn theo Lớp × Môn — học kỳ I', ma: 'KQ.07', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Lớp', dong,
    gomNhom: dtHieuLuc() === 'ALL' && R().sc === 'School',
    link: d => ({ menu: 'M2.5', ctx: 'ctx=' + d.lop, nhan: 'Bảng điểm môn' }),
    cot: dsM.map(m => ({
      khoa: m, ten: m, donVi: laNX(m) ? 'nhận xét' : '', kieu: 'so',
      nguon: 'm2.5.bang_diem_mon', khongCong: true
    })),
    o: (d, c) => MONLOP[d.lop].indexOf(c.khoa) < 0
      ? null
      : CT.doc('KQ.07', PV.thamSo({ cap: [{ lop: d.lop, mon: c.khoa }] })),
    tong: false,
    duoiBang: '<div class="ro">🚫 <b>Em miễn học phần</b> <i>(GDTC · GDQP-AN)</i> KHÔNG vào mẫu số. '
      + 'Ô <b>—</b> là môn lớp đó không học, hoặc môn đánh giá bằng <b>nhận xét</b>.</div>'
  });

  /* ---------- khối phụ · ĐỘ PHỦ THEO PHẦN (🔒 `HDPC`) ---------- */
  const capPhan = [];
  dsL.forEach(l => MONLOP[l].forEach(m => {
    if (!coPhan(l, m)) return;
    if (R().sc === 'Group' && MON[m].to !== R().to) return;
    capPhan.push({ lop: l, mon: m });
  }));
  if (capPhan.length) {
    h += KB.bang({
      id: 'phan', tieuDe: 'Khối phụ · Độ phủ của môn NHIỀU PHẦN — ba phần dùng chung một rổ N ô',
      ma: 'KQ.07', chip: 'TON', moTaKy: PV.moTaChot(), tenCotDau: 'Lớp × Môn',
      dong: capPhan.map(c => ({
        id: c.lop + '|' + c.mon, ten: c.lop + ' · ' + c.mon, lop: c.lop, mon: c.mon,
        phu: dsPhan(c.lop, c.mon).map(p => PHAN[p.ma] + ' — ' + gvn(p.gv) + (p.chutri ? ' ⚖ chủ trì' : '')).join(' · ')
      })),
      link: d => ({ menu: 'M2.5', ctx: 'ctx=' + d.lop + '|' + d.mon, nhan: 'Bảng điểm môn' }),
      cot: [
        { khoa: 'soO', ten: 'Ô đã chiếm / rổ N ô', kieu: 'so', nguon: 'm2.5.bang_diem_mon' },
        { khoa: 'soEm', ten: 'Em đã có điểm', kieu: 'so', nguon: 'm2.5.bang_diem_mon' },
        { khoa: 'doPhu', ten: 'Độ phủ', kieu: 'tile', nguon: 'm2.5.bang_diem_mon' },
        { khoa: null, ten: 'ĐTB của cả MÔN', kieu: 'so', nguon: 'm2.5.bang_diem_mon', khongCong: true }
      ],
      o: (d, c) => CT.doc('KQ.07', PV.thamSo({ cap: [{ lop: d.lop, mon: d.mon }] }), c.khoa || undefined),
      tong: false,
      duoiBang: '<div class="ro">⚖ Ô mang <b>phần của LƯỢT đứng ở nó</b>; ba phần <b>chung một rổ N ô</b> '
        + '⇒ đếm theo <b>Ô</b>, ⛔ không cộng theo lượt. Chủ trì <b>tổng hợp</b>, không nhập thay.</div>'
    });
  }
  h += '<div class="canh b">⚖ <b>Không cột «điểm thi đua», không xếp hạng giáo viên</b> — bảng để '
    + '<b>tổ chuyên môn bàn chuyên môn</b> <i>(tinh thần <code>TD-2</code> của <code>M5.9</code>)</i>.</div>';
  return h + dnote('Cắt theo <b>giáo viên dạy</b> thì phải trả lời được «so với cái gì»: '
    + 'một lớp điểm thấp có thể là lớp đầu vào thấp. Ở đây chiều giáo viên chỉ xuất hiện trong khối <b>độ phủ theo phần</b> — '
    + 'nơi câu hỏi là <i>«phần nào đang thiếu ô điểm»</i>, một câu hỏi về <b>tiến độ</b>, không phải về <b>người</b>. '
    + 'Em miễn học phần bị loại khỏi <b>cả tử số lẫn mẫu số</b>, không phải chỉ tử số.');
}

      { khoa: 'dungHan', ten: 'Đúng hạn', kieu: 'so', nguon: 'm2.9.bao_cao_tuan' },
      { khoa: 'tre', ten: 'Publish muộn', kieu: 'so', nguon: 'm2.9.bao_cao_tuan', canhBao: k => k.giaTri > 0 },
      { khoa: 'nhap', ten: 'Đang soạn', kieu: 'so', nguon: 'm2.9.bao_cao_tuan', canhBao: k => k.giaTri > 0 },
      { khoa: 'chua', ten: 'Chưa làm', kieu: 'so', nguon: 'm2.9.bao_cao_tuan', canhBao: k => k.giaTri > 0 },
      { khoa: 'soRieng', ten: 'Lượt nhận xét riêng', donVi: 'chỉ ĐẾM', kieu: 'so', nguon: 'm2.9.bao_cao_tuan' }
    ],

      + '<b>một</b> gia đình <i>(§6.7)</i>. Bản <b>Đang soạn</b> thì phụ huynh <b>chưa thấy gì</b>.</div>'

    canCu: [
      'TT 22/2021 — rèn luyện đánh giá theo HỌC KỲ; ⛔ không xếp loại theo tuần.',
      '`M2.9` §6.1 · §6.5 — sổ liên lạc điện tử; GVCN publish, KHÔNG có bước duyệt.',
      'Luật BVDLCN 91/2025 — nhận xét riêng là dữ liệu cá nhân của chính em đó.'
    ],
    phanSo: phanSo,

/* ══════════════ TAB 6 · ĐƠN NGHỈ CỦA HỌC SINH ═════════════════════════
   Khuôn K5 — sổ. Một bản ghi một dòng, theo thời gian.                    */
function veTab6() {
  const dsD = DON.filter(d => lopTrongPV(d.lop));
  let h = daiPV('đơn nghỉ', dsD.length, DON.length);
  h += PV.khoang() + daiThieuXD(['m2.4.tong_hop_don_nghi', 'm2.4.hs_xin_nghi_ngan_ngay_n', 'm2.4.hs_xin_nghi_dai_ngay_n']);
  const tu = PV.st.tuNgay, den = PV.st.denNgay;
  const ds = dsD.filter(d => d.ngayNop >= tu && d.ngayNop <= den);

  /* ---------- khối tóm tắt theo LOẠI ---------- */
  const LOAI = { ngan: 'Ngắn ngày (≤ ' + N_NGAN + ' ngày học)', dai: 'Dài ngày (> ' + N_NGAN + ')', ratdai: 'Rất dài (> ' + M_RATDAI + ')' };
  h += KB.K1({
    id: 'tt', tieuDe: 'Đơn nghỉ theo loại — phân loại tính tại thời điểm hiển thị', ma: 'CC.02', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Loại đơn', donVi: 'đơn',
    nguon: 'm2.4.tong_hop_don_nghi',
    dong: Object.keys(LOAI).map(k => ({ id: k, ten: LOAI[k] })),
    link: d => ({ menu: 'M2.4', ctx: 'tab=' + (d.id === 'ngan' ? 'ngan_ngay' : 'dai_ngay'), nhan: 'Tổng hợp đơn nghỉ' }),
    oSo: d => {
      const x = ds.filter(y => y.loai === d.id);
      return Object.assign(CT.doc('CC.02', PV.thamSoPS(), 'tuDon'), {
        ten: LOAI[d.id], giaTri: x.length, donVi: 'đơn',
        veTrai: null, vePhai: null,
        ghiChu: 'Đếm <b>NGÀY HỌC</b>, không đếm ngày lịch — nghỉ thứ Sáu → thứ Hai là <b>2 ngày học</b>, không phải 4 <i>(`M2.4` §4.2)</i>.',
        banGhiGoc: x.map(y => ({
          id: y.id, ten: (hsById(y.hs) || {}).n, phu: y.lop + ' · ' + k2s(y.tu) + ' → ' + k2s(y.den)
            + ' · ' + y.ngayLich + ' ngày lịch / ' + y.ngayHoc + ' ngày học · ' + TT_DON[y.tt][0],
          so: y.ngayHoc + ' ngày học'
        }))
      });
    },
    duoiBang: '<div class="ro">📐 <b>N = ' + N_NGAN + '</b> · <b>M = ' + M_RATDAI + '</b> khai ở <code>M2.4 ⚙ Cấu hình</code>; '
      + 'đổi N thì tự chia lại ngay vì phân loại <b>không lưu vào bản ghi</b>.</div>'
  });

  /* ---------- sổ đơn (K5) ---------- */
  h += KB.K5({
    tieuDe: 'Sổ đơn nghỉ của học sinh — theo ngày nộp', chip: 'PS', moTaKy: PV.moTaKhoang(),
    banGhi: ds.slice().sort((a, b) => a.ngayNop < b.ngayNop ? 1 : -1).map(d => ({
      so: d.id, ngay: k2s(d.ngayNop),
      noiDung: (hsById(d.hs) || {}).n + ' · ' + d.lop + ' · ' + k2s(d.tu) + ' → ' + k2s(d.den)
        + ' (' + d.ngayLich + ' ngày lịch · ' + d.ngayHoc + ' ngày học'
        + (d.buoi !== 'ca' ? ' · chỉ buổi ' + (d.buoi === 'sang' ? 'sáng' : 'chiều') : '') + ')'
        + (d.ly ? ' — ' + d.ly : ''),
      nguoiLap: NGUOI[d.nguoiLap] || d.nguoiLap,
      nguoiKy: d.nguoiDuyet ? (NGUOI[d.nguoiDuyet] || gvn(LOP[d.lop].gvcn)) : '—',
      tt: TT_DON[d.tt][0]
    })),
    /* 🛑 `kiemSoHieu:false` — `NP-nn` là MÃ ĐƠN tự sinh, không phải số hiệu
       văn bản. Sổ đang lọc theo khoảng và theo phạm vi thì đứt số là chuyện
       bình thường; bật dò ở đây là báo động giả mỗi lần đổi bộ lọc. */
    kiemSoHieu: false,
    chuoiTrong: 'Không có đơn nào nộp trong khoảng đang xem.',
    duoiBang: '<div class="ro">🛑 <b>Không kiểm số hiệu liên tục</b> — <code>NP-nn</code> là mã đơn tự sinh, không phải số hiệu văn bản. '
      + '⛔ Không nút <b>Duyệt</b> · <b>Từ chối</b> · <b>Kết thúc sớm</b> — cả ba thuộc <code>M2.4</code>. '
      + '<button class="btn xs" data-dl="M2.4" data-dlq="tab=tong_hop&return=' + MENU_NAY + '">↗ M2.4</button></div>'
  });
  const ratdai = ds.filter(d => d.loai === 'ratdai' && donCoHieuLuc(d));
  if (ratdai.length) h += '<div class="canh w">⚠ <b>' + ratdai.length + ' đơn rất dài đã có hiệu lực</b> — '
    + '<code>M2.4</code> §7.3 <b>chỉ GỢI Ý bảo lưu</b>, ⛔ không tự tạo hồ sơ. '
    + '<button class="btn xs" data-dl="M1.5" data-dlq="return=' + MENU_NAY + '">↗ M1.5</button></div>';
  return h + dnote('Sổ này <b>đếm ĐƠN</b>; tab 1 <b>đếm LƯỢT VẮNG</b>. Một đơn 5 ngày sinh 5 lượt vắng, '
    + 'nên hai tab ra hai con số khác nhau là <b>đúng</b>. Và không phải lượt vắng nào cũng có đơn: '
    + 'GVCN ghi thẳng ở <code>M2.9</code> T2 cũng là một nguồn — panel của tab 1 nói rõ từng lượt đến từ đâu.');
}

  };
  $('#content').innerHTML = PV.daiMau() + ve6[ST.tab]();
}

/* ══════════════════════════ NỐI DÂY ═══════════════════════════════════ */
KB.datMenu(MENU_NAY);
KB.noiQuyen(f => coXD(f), f => NGUON[f] || { menu: '?', ten: f });
PV.noiVeLai(ve);
PV.doiTab = t => { if (coTab(t)) ST.tab = t };
/* mẫu định kỳ riêng của nhóm 📚 — vẫn là MỘT DÒNG CẤU HÌNH (`N8`) */

});
XU.noiBoiCanh(() => {
  const t = TAB.find(x => x.ma === ST.tab) || TAB[0];
  const ky = ['chuyen_can', 'so_dau_bai'].includes(ST.tab) ? PV.moTaChot() + ' · ' + PV.moTaKhoang()
    : ST.tab === 'chat_luong_bo_mon' ? PV.moTaChot() : PV.moTaKhoang();
  const maCT = { chuyen_can: 'CC.01', so_dau_bai: 'CC.04', bai_tap_ve_nha: 'BT.02', chat_luong_bo_mon: 'KQ.07', bao_cao_tuan_lop: 'CC.07', don_nghi_hoc_sinh: 'CC.02' }[ST.tab];
  const kb = CT.khaiBao(maCT);
  const dsL = dsLop().filter(lopTrongPV);
  return {
    truong: 'THCS & THPT Nguyễn Tất Thành',
    baoCao: 'Báo cáo Giảng dạy hằng ngày — ' + t.nhan.replace(/^\d+ · /, '') + ' (' + t.bc + ')',
    menu: MENU_NAY, nguoi: R().n, chucDanh: R().cd, ky,
    phamVi: tenPhamVi(),
    toanTruong: HS.length, tongPhamVi: HS.filter(h => lopTrongPV(h.lop)).length,
    donVi: 'học sinh',
    quyTac: (kb.quyTacDem.tinhVao || []).concat((kb.quyTacDem.khongTinh || []).map(x => 'KHÔNG tính: ' + x)),
    /* Danh sách trường của MỨC 2 ĐỔI THEO TAB — sáu tab lấy sáu loại bản ghi */
    truong_du_lieu: TRUONG_XUAT[ST.tab],
    soDong: soDongChiTiet(dsL)
  };
});
/* ── sáu danh sách trường của mức 2 — mỗi tab một bộ ──────────────────
   Sáu tab lấy sáu loại bản ghi khác nhau nên trường cá nhân cũng khác:
   tab 1 · 6 là học sinh, tab 2 là giáo viên, tab 3 là lượt bài, tab 4 là
   ô điểm, tab 5 là lớp. Một danh sách dùng chung thì người xuất tab 2 vẫn
   phải bỏ chọn một trường không có trong bảng họ đang xem.               */
const TRUONG_XUAT = {

    { khoa: 'loai', ten: 'Tách có phép / không phép / đi muộn' },
    { khoa: 'nguon', ten: 'Nguồn từng lượt (đơn nghỉ hay GVCN ghi)' },
    { khoa: 'hoTen', ten: 'Họ tên học sinh', nhay: true, macDinh: false },
    { khoa: 'lyDo', ten: 'Lý do nghỉ', nhay: true, macDinh: false }
  ],
  so_dau_bai: [
    { khoa: 'donVi', ten: 'Tuần · lớp · môn', batBuoc: true },
    { khoa: 'tiet', ten: 'Số tiết theo lịch · đã ghi · chưa ghi', batBuoc: true },
    { khoa: 'tile', ten: 'Tỉ lệ ghi sổ' },
    { khoa: 'nhan', ten: 'Nhãn ghi muộn · ghi trước giờ tiết' },
    { khoa: 'gv', ten: 'Họ tên giáo viên thực dạy', nhay: true, macDinh: false }
  ],
  bai_tap_ve_nha: [
    { khoa: 'cap', ten: 'Lớp × Môn', batBuoc: true },
    { khoa: 'luot', ten: 'Lượt giao · tỉ lệ nộp · tỉ lệ chấm', batBuoc: true },
    { khoa: 'choCham', ten: 'Bài còn chờ chấm' },
    { khoa: 'gv', ten: 'Họ tên giáo viên giao bài', nhay: true, macDinh: false }
  ],
  chat_luong_bo_mon: [
    { khoa: 'cap', ten: 'Lớp × Môn', batBuoc: true },
    { khoa: 'dtb', ten: 'Điểm trung bình môn', batBuoc: true },
    { khoa: 'phan', ten: 'Độ phủ theo phần · rổ N ô' },
    { khoa: 'hoTen', ten: 'Họ tên học sinh và điểm từng em', nhay: true, macDinh: false },
    { khoa: 'gv', ten: 'Họ tên giáo viên giữ phần', nhay: true, macDinh: false }
  ],
  bao_cao_tuan_lop: [
    { khoa: 'lop', ten: 'Lớp × Tuần', batBuoc: true },
    { khoa: 'tt', ten: 'Trạng thái · ngày publish · đúng hạn hay muộn', batBuoc: true },
    { khoa: 'dem', ten: 'Số lượt nhận xét riêng (chỉ ĐẾM)' },
    { khoa: 'gvcn', ten: 'Họ tên GVCN', nhay: true, macDinh: false }
  ],
  don_nghi_hoc_sinh: [
    { khoa: 'ma', ten: 'Mã đơn', batBuoc: true },
    { khoa: 'ngay', ten: 'Ngày nộp · từ → đến · số ngày học', batBuoc: true },
    { khoa: 'tt', ten: 'Loại đơn · trạng thái' },
    { khoa: 'hoTen', ten: 'Họ tên học sinh', nhay: true, macDinh: false },

    { khoa: 'nguoi', ten: 'Người lập · người duyệt', nhay: true, macDinh: false }
  ]
};
const soDongChiTiet = dsL => ST.tab === 'so_dau_bai' ? TIET.filter(trongPV).length
  : ST.tab === 'bai_tap_ve_nha' ? LUOT.filter(trongPV).length
    : ST.tab === 'chat_luong_bo_mon' ? ODIEM.filter(x => lopTrongPV(x.lop)).length
      : ST.tab === 'bao_cao_tuan_lop' ? BCTUAN.filter(b => lopTrongPV(b.lop)).length
        : ST.tab === 'don_nghi_hoc_sinh' ? DON.filter(d => lopTrongPV(d.lop)).length
          : HS.filter(h => lopTrongPV(h.lop)).length;

KB.gan(); PV.gan(); XU.gan();

document.addEventListener('click', e => {
  const r = e.target.closest('[data-r]');
  if (r) { role = r.getAttribute('data-r'); TAB_BI_CHAN = null; PV.st.phanTo = null; moTab(tabMacDinh()); ve(); return }
  const t = e.target.closest('[data-t]');
  if (t) { TAB_BI_CHAN = null; PV.st.phanTo = null; moTab(t.getAttribute('data-t')); ve(); return }
  const b = e.target.closest('[data-btvn]');
  if (b) { ST.dtgLop = b.getAttribute('data-btvn') === 'lop'; PV.st.phanTo = null; ve(); return }
  if (e.target.closest('#btnNote')) { ST.note = !ST.note; ve(); return }
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const m = dl.getAttribute('data-dl'), q = dl.getAttribute('data-dlq') || '';
    toast('↗ Deep-link sang <b>' + esc(m) + '</b> — <code>?' + esc(q) + '</code><br>'
      + '<i>Demo một tệp: không mở được menu khác, nhưng đường dẫn là đường dẫn thật.</i>');
  }
});
$('#hdt').addEventListener('change', e => { ST.dt = e.target.value; ve() });

function toast(h) {
  const t = $('#toast'); t.innerHTML = h; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 4200);
}

/* ── công cụ nghiệm thu: đo MẬT ĐỘ CHỮ GIẢI THÍCH (`nh9` §9.1, ≤ 20%) ──
   ⚠ Khuôn `K8` là **báo cáo VĂN BẢN**: phần `Căn cứ` và phần `Nhận xét và
   phương hướng` là **NỘI DUNG của chính báo cáo** (kiến trúc §4 `K8`), không
   phải chữ giải thích về màn hình. Đếm chúng vào 20% là đo sai thước — một
   báo cáo tổng kết mà bị trừ điểm vì có phần căn cứ thì khuôn `K8` không bao
   giờ đạt ngưỡng. Hàm trả thêm `tiLeGomK8` để người duyệt thấy cả hai số.
   🛑 `K8` là khuôn `0A` dựng mà CHƯA có ca thật — kiến trúc §11 `KT-4` dặn
      phiên đầu dùng tới phải báo lại. Ghi ở mục E · H của phiếu. */
function doMatDoChu() {
  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info,.ranhgioi,.mausolb';
  const noiDungK8 = '.k8m>ul,.k8nx';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(n => { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  let k8 = 0;
  goc.querySelectorAll(noiDungK8).forEach(n => { k8 += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = {
    tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%',
    noiDungK8: k8, tiLeGomK8: Math.round((chu + k8) * 1000 / tong) / 10 + '%'
  };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
window.doMatDoChu = doMatDoChu;

ST.tab = tabMacDinh();
PV.khoangMacDinh(KY_TAB[ST.tab]);
/* deep-link vào: `?vai=<mã vai>&tab=<mã tab>` — tab vai không có thì khối `.noaccbox` */
(function nhanDeepLink() {
  let p; try { p = new URLSearchParams(location.search) } catch (e) { return }
  const v = p.get('vai'), t = p.get('tab');
  if (v && ROLES[v]) { role = v; ST.tab = tabMacDinh(); if (ST.tab) PV.khoangMacDinh(KY_TAB[ST.tab]) }
  if (t) xinMoTab(t);
})();
ve();
</script>
