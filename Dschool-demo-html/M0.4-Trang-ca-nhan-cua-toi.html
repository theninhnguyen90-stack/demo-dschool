<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M0.4 Trang cá nhân của tôi — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--lock:#f1f5f9}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:14px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;outline:2px solid var(--brand);outline-offset:1px}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:13px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:18px 22px 44px;min-width:0}

/* profile card */
.pc{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pc .ph{width:62px;height:62px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;flex:0 0 62px}
.pc .pi{min-width:0;flex:1}
.pc .pi h1{font-size:19px;font-weight:700}
.pc .pi .r{color:var(--ink2);font-size:13px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.ckin{border:1px solid var(--line);border-radius:11px;padding:11px 14px;min-width:250px;background:#fafbfc}
.ckin .s{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.ckin .v{font-size:13.5px;font-weight:600;margin:3px 0 8px}
.ckin .btns{display:flex;gap:7px}

.body{display:flex;gap:16px;margin-top:16px;align-items:flex-start}
.subnav{width:230px;flex:0 0 230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:74px}
.sgrp2{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:11px 10px 4px}
.sn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink2);cursor:pointer;margin-bottom:1px}
.sn:hover{background:var(--bg)}
.sn.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.sn .w{margin-left:auto;background:var(--amber);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center}
.pane{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.ch{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ch h3{font-size:14.5px;flex:1}
.cb{padding:15px 16px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 3-tier fields */
.tier{margin-bottom:16px}
.tl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.tl.t1{color:var(--green)}.tl.t2{color:var(--amber)}.tl.t3{color:var(--ink3)}
.tl .exp{font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--ink3)}
.f{display:grid;grid-template-columns:190px 1fr auto;gap:12px;align-items:center;padding:9px 11px;border-radius:9px;margin-bottom:5px;font-size:13px;border:1px solid transparent}
.f.t1{background:#fff;border-color:var(--line)}
.f.t2{background:var(--amber-soft);border-color:#fde68a}
.f.t3{background:var(--lock);border-color:var(--line)}
.f .k{color:var(--ink2);font-size:12.5px;display:flex;align-items:center;gap:6px}
.f .v{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.f.t3 .v{color:var(--ink2);font-weight:500}
.f input.ed{width:100%;border:1px solid var(--brand);border-radius:7px;padding:5px 8px;font-size:13px}
.pending{font-size:11px;background:#fff;border:1px solid var(--amber);color:var(--amber);padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.st{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
.st.w{background:var(--amber-soft);color:var(--amber)}
.st.o{background:var(--green-soft);color:var(--green)}
.st.n{background:var(--bg);color:var(--ink2)}
.st.r{background:var(--red-soft);color:var(--red)}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:14px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi b{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em}
.kpi span{font-size:11.5px;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1.35;border-radius:7px;border:1px solid var(--line);padding:4px 5px;font-size:10.5px;background:#fff}
.cal .d b{display:block;font-size:11.5px}
.cal .d.ok{background:var(--green-soft);border-color:#a7f3d0}
.cal .d.late{background:var(--amber-soft);border-color:#fde68a}
.cal .d.off{background:var(--bg);color:var(--ink3)}
.cal .d.abs{background:#eff6ff;border-color:#bfdbfe}
.cal .d.unpaid{background:var(--red-soft);border-color:#fca5a5}
.cal .d.miss{background:#fff7ed;border-color:#fdba74;
 background-image:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(234,88,12,.13) 4px,rgba(234,88,12,.13) 8px)}
.cal .d.fut{background:#fff;color:var(--ink3);border-style:dashed}
.cal .d.now{background:#fff;border:2px solid var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cal .d.trip{background:#f5f3ff;border-color:#ddd6fe}
.lg{display:flex;gap:6px;align-items:center}
.lg i{width:13px;height:13px;border-radius:4px;border:1px solid var(--line2);display:inline-block}
.subj{font-size:11px;background:#dbeafe;border:1px solid #bfdbfe;color:#1e40af;border-radius:999px;padding:2px 9px;font-weight:600}
.ac{position:relative}
.aclist{position:absolute;left:0;right:0;top:calc(100% + 3px);background:#fff;border:1px solid var(--line2);
 border-radius:9px;box-shadow:0 8px 22px rgba(15,23,42,.13);max-height:220px;overflow-y:auto;z-index:5;display:none}
.aclist.on{display:block}
.aci{padding:8px 11px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.aci:last-child{border-bottom:none}
.aci:hover,.aci.hi{background:var(--brand-soft)}
.aci b{display:block;font-size:13px}
.aci .m2{color:var(--ink3);font-size:11.5px;display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
.aci .tag2{background:var(--bg);border-radius:4px;padding:0 5px;font-weight:600;color:var(--ink2)}
.acnone{padding:12px;text-align:center;color:var(--ink3);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mini{border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12.5px}
.mini .t{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:4px}

.sub{font-size:11.5px;color:var(--ink3);line-height:1.55}
.empty{padding:18px;text-align:center;color:var(--ink3);font-size:12.5px;background:#f8fafc;border:1px dashed var(--line2);border-radius:9px;line-height:1.6}
.tuchoi{background:var(--red-soft);border:1px solid #fca5a5;color:#991b1b;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6;margin:6px 0 4px}
.alert{background:var(--red-soft);border:1px solid #fca5a5;color:#991b1b;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65}
.ok2{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.65}
.chips{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.klr{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
.klr.het{opacity:.74}
.klh{display:flex;align-items:center;gap:9px;padding:11px 13px;background:#f8fafc;cursor:pointer;font-size:13px}
.klh:hover{background:var(--bg)}
.klh .cx{color:var(--ink3);font-size:11px}
.klb{padding:13px;border-top:1px solid var(--line)}
.ul{margin:4px 0 0 16px;line-height:1.65}
.hs{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.hs:last-of-type{border-bottom:none}
.hs>span{flex:1}
.pv{border:1px solid var(--line2);border-radius:9px;background:#fff;padding:20px 24px;font-size:12.5px;line-height:1.8;max-height:330px;overflow-y:auto}
.pv .c{text-align:center}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:540px;max-width:93vw;max-height:84vh;display:flex;flex-direction:column}
.mh{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:16px 18px;overflow-y:auto;font-size:13px}
.mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px}
.fld textarea{min-height:70px;resize:vertical}
.drop{border:1.5px dashed var(--line2);border-radius:9px;padding:16px;text-align:center;color:var(--ink3);font-size:12.5px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 16px;display:flex;align-items:center;gap:9px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 11px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}

/* ===== GY18-C (18/9/2026) — dai chip chuc danh kiem nhiem tren the dau trang (M0.4 §2.2b) ===== */
.pill.b{font-weight:700;color:var(--ink);background:var(--surface);border-color:var(--line2)}
.knw{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%;margin-top:6px}
.knw .lb{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.kn{font-size:11px;background:#f5f3ff;border:1px solid #ddd6fe;color:#5b21b6;border-radius:999px;
 padding:2px 9px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.kn i{font-style:normal;font-weight:400;opacity:.8}
.kn.mo{background:var(--bg);border-color:var(--line);color:var(--ink3);font-weight:500}
.kn.cho{background:#fff7ed;border-color:#fdba74;color:#c2410c}
.kn.tam{background:var(--amber-soft);border-color:var(--amber);color:#92400e;cursor:pointer}
.kn.more{background:var(--surface);border-color:var(--line2);color:var(--ink2);font-weight:500;cursor:pointer}
.kn.more:hover,.kn.tam:hover{box-shadow:0 0 0 3px var(--brand-soft)}
.srcn{font-size:12px;color:var(--ink3)}

/* ===== MYC-1B (21/9/2026) — nhóm HỒ SƠ dựng lại theo M4.1 (app.40-ho-so.js) ===== */
.f{grid-template-columns:230px 1fr auto}
.f .k{flex-wrap:wrap}
.f .gk{flex-basis:100%;font-size:11px;color:var(--ink3);font-weight:400;line-height:1.45}
.f.dx{background:#fff;border:1px dashed var(--line2)}
.f.dx .v{font-weight:500}
.f .a{text-align:right}
.f.nhay{box-shadow:0 0 0 3px #bfdbfe}
.srcx{font-size:11.5px;color:var(--ink3)}
.miss{color:var(--red);font-weight:600}
.mt{font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px}
.mt.m1{background:var(--red-soft);color:var(--red)}
.mt.m2{background:var(--amber-soft);color:#b45309;border:1px solid #fde68a}
.mt.m3{background:var(--bg);color:var(--ink3)}
.dcw{font-size:10.5px;font-weight:600;color:#b45309;background:var(--amber-soft);border:1px solid #fde68a;border-radius:5px;padding:0 5px;white-space:nowrap}
.dcok{font-size:10.5px;color:var(--green);background:var(--green-soft);border-radius:5px;padding:0 5px}
.knt{font-size:11.5px;background:#f5f3ff;border:1px solid #ddd6fe;color:#5b21b6;border-radius:999px;padding:1px 8px;font-weight:600}
.lnk{color:var(--brand);font-size:11.5px;text-decoration:underline;margin-left:4px}
.subh{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.subh:first-child{margin-top:0}
.hsk{cursor:pointer}.hsk:hover{background:#f8fafc}.hsk h3{flex:0 1 auto}
.cx{color:var(--ink3);font-size:11px;width:10px}
.lg1{color:var(--green);font-weight:600}.lg2{color:#b45309;font-weight:600}.lg3{color:var(--ink2);font-weight:600}.lg4{color:var(--brand);font-weight:600}
/* bảng */
.bg{border:1px solid #fde68a;border-radius:9px;margin-bottom:8px;overflow:hidden}
.bg.t3{border-color:var(--line)}
.bgh{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--amber-soft);font-size:12.5px}
.bg.t3 .bgh{background:var(--lock)}
.bge{padding:9px 11px;font-size:12.5px}
.tb{font-size:12px}.tb td,.tb th{padding:6px 8px}
/* khối còn thiếu */
.thieu .ch{flex-wrap:wrap}.thieu .ch h3{flex:1 1 auto}
.tsum{font-size:13.5px;margin-bottom:8px}.tsum .do{color:var(--red);font-weight:700}
.tg{border:1px solid var(--line);border-radius:9px;margin-bottom:6px;overflow:hidden}
.tg.r{border-color:#fca5a5}
.tgh{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;font-size:13px;background:#f8fafc}
.tg.r .tgh{background:var(--red-soft)}
.tgb{padding:4px 11px 8px}
.tgr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.tgr:last-child{border-bottom:none}
.dh{font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.dh.r{background:var(--red);color:#fff}.dh.w{background:var(--amber-soft);color:#b45309;border:1px solid #fde68a}
.dh.b{background:var(--brand-soft);color:var(--brand)}.dh.n{background:var(--bg);color:var(--ink3);border:1px solid var(--line)}
.m3l{margin-top:9px;font-size:12px;color:var(--ink3)}.m3l b{color:var(--ink2)}
/* địa chỉ hai chế độ */
.dctg{display:flex;gap:6px;margin-bottom:6px}
.dcg{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;margin-bottom:5px}
.dcg select,.dcg input{border:1px solid var(--brand);border-radius:7px;padding:5px 7px;font-size:12.5px;min-width:0}
.goiy{margin-top:6px;background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6}
.kng{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:12.5px}
/* đợt rà soát */
.st.b2{background:var(--brand-soft);color:var(--brand)}
.dotm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.nsum{font-size:12px;background:#f5f3ff;border:1px solid #ddd6fe;color:#5b21b6;border-radius:8px;padding:3px 10px}
.bkm{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px;font-size:12.5px}
.bkh{font-size:13px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:220px 1fr;gap:3px 12px;font-size:12.5px;margin-bottom:5px}
.kv span{color:var(--ink3)}
.xn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin-top:6px}
.bkta{width:100%;border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:12.5px;min-height:34px;resize:vertical}
.bkf{display:flex;gap:8px;align-items:center;margin-top:12px}

function bKLmot(k){
 const p=P[role], het=hetHL(k), con=conHL(k), kn=knCua(k), ckn=conKN(k), mo=klMo===k.so;
 const ttHL=het?'<span class="st n">Đã hết hiệu lực</span>'
   :`<span class="st r">Đang có hiệu lực</span><span class="sub">còn ${con} ngày</span>`;
 let khoiKN;
 if(kn){khoiKN=`<div class="ok2"><b>✓ Đã ghi nhận khiếu nại</b> ngày ${typeof kn.ngay==='string'&&kn.ngay.indexOf('-')>0?fdt(kn.ngay):kn.ngay} · gửi ${kn.noiNhan}
   <div style="margin-top:5px">${kn.noiDung}</div>
   <div class="sub" style="margin-top:5px">Hệ thống <b>chỉ lưu mốc thời gian và nội dung</b>. Việc giải quyết thực hiện ngoài phần mềm theo Luật Khiếu nại hoặc khởi kiện hành chính.</div></div>`}
 else{
  const canhBao = ckn<0
   ? `<div class="warn" style="margin:0 0 9px">Đã <b>quá thời hiệu khiếu nại lần đầu</b> ${cnga(themNgay(k.ngayNhan,THKN(p)),HOMNAY)} ngày.
      Bạn vẫn ghi nhận được — thời gian ốm đau, thiên tai, đi công tác hoặc học tập ở xa <b>không tính vào thời hiệu</b>, phần mềm không có cách nào tự biết điều đó.</div>`
   : `<div class="${ckn<=5?'alert':'warn'}" style="margin:0 0 9px">Thời hiệu khiếu nại lần đầu <b>còn ${ckn} ngày</b> — hết ngày ${fdd(themNgay(k.ngayNhan,THKN(p)))}.
      ${p.loai==='hdld'
        ? 'Nhân sự <b>hợp đồng lao động</b>: <b>180 ngày</b> kể từ ngày nhận quyết định — Điều 7 NĐ 24/2018/NĐ-CP.'
        : '<b>Viên chức</b>: <b>15 ngày</b> kể từ ngày nhận quyết định — Điều 48 Luật Khiếu nại 2011.'}</div>`;
  khoiKN=canhBao+`<button class="btn p" data-kn="${k.so}">📨 Ghi nhận khiếu nại</button>`}
 return `<div class="klr ${het?'het':''}">
  <div class="klh" data-kl="${k.so}">
   <span class="cx">${mo?'▾':'▸'}</span>
   <b>${k.ht}</b><span class="sub">${k.so} · ký ngày ${fdt(k.ngayQD)}</span>
   <span style="flex:1"></span>${ttHL}
   ${kn?'<span class="st w">Đang có khiếu nại</span>':''}
  </div>
  ${mo?`<div class="klb">
   <div class="grid2" style="margin-bottom:11px">
    <div class="mini"><div class="t">Hành vi vi phạm</div>${k.hanhVi}
      <div class="sub" style="margin-top:5px">Ngày vi phạm ${fdt(k.ngayViPham)} · nguồn phát hiện: ${k.nguon}</div></div>
    <div class="mini"><div class="t">Căn cứ pháp lý</div>${k.canCu}</div>
   </div>
   <div class="grid2" style="margin-bottom:11px">
    <div class="mini"><div class="t">Tình tiết tăng nặng</div>
      ${k.tangNang.length?'<ul class="ul">'+k.tangNang.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<span class="sub">Không có</span>'}</div>
    <div class="mini"><div class="t">Tình tiết giảm nhẹ</div>
      ${k.giamNhe.length?'<ul class="ul">'+k.giamNhe.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<span class="sub">Không có</span>'}</div>
   </div>
   <div class="mini" style="margin-bottom:11px"><div class="t">Hội đồng / cuộc họp xử lý</div>
     ${k.hoiDong} · họp ngày ${fdt(k.ngayHop)}
     <div class="sub" style="margin-top:5px">Hệ thống <b>không hiển thị danh sách thành viên và lá phiếu</b> — kết quả của hội đồng là kết quả tập thể.</div></div>
   <div class="mini" style="margin-bottom:11px"><div class="t">Hồ sơ vụ việc</div>
     ${k.hoSo.map(h=>`<div class="hs"><span>${h[1]==='qd'?'📕':h[1]==='gt'?'✍️':'📄'} ${h[0]}</span>
       <button class="btn sm" data-xem="${h[0]} — ${k.so}">👁 Xem</button>
       <button class="btn sm" data-tai="${h[0]}">⬇ Tải</button></div>`).join('')}
     <div class="sub" style="margin-top:6px">Mọi lần xem và tải đều ghi audit theo Luật BVDLCN 91/2025/QH15.</div></div>
   <div class="mini" style="margin-bottom:11px"><div class="t">Hiệu lực</div>
     Từ ${fdt(k.hieuLucTu)} · <b>12 tháng</b> · ${het?`đã hết hiệu lực ngày ${fdd(them12(k.hieuLucTu))}`:`còn <b>${con} ngày</b>, tự chấm dứt ${fdd(them12(k.hieuLucTu))}`}
     <div class="sub" style="margin-top:5px">Hết hiệu lực <b>tự chấm dứt, không cần văn bản riêng</b> (NĐ 234/2026/NĐ-CP). Đây là trạng thái suy ra từ ngày quyết định — không có nút bấm để chuyển.</div></div>
   ${daDoc[k.so]?`<div class="sub" style="margin-bottom:9px">🕘 Bạn mở quyết định này lần đầu lúc <b>${daDoc[k.so]}</b> — mốc này được ghi audit vì nó là căn cứ cho ngày bắt đầu tính thời hiệu khiếu nại.</div>`:''}
   ${khoiKN}
   ${coM410()?`<div style="margin-top:10px"><button class="btn sm" data-go="M4.10">🔗 Mở hồ sơ vụ việc tại M4.10</button></div>`:''}
  </div>`:''}</div>`}

function bKL(t){
 if(!t.kl.length)return `<div class="cb"><div class="empty">✓ Bạn <b>không có</b> quyết định kỷ luật nào trong hồ sơ.
   <div class="sub" style="margin-top:5px">Mục này vẫn hiển thị khi rỗng — để bạn tự kiểm tra được khi cần nộp hồ sơ thi đua hoặc bổ nhiệm.</div></div></div>`;
 const ds=t.kl.filter(k=>klLoc==='all'||(klLoc==='hl'?!hetHL(k):hetHL(k)));
 const loc=[['all','Tất cả',t.kl.length],['hl','Đang có hiệu lực',t.kl.filter(k=>!hetHL(k)).length],
   ['het','Đã hết hiệu lực',t.kl.filter(k=>hetHL(k)).length]];
 return `<div class="cb">
  <div class="chips">${loc.map(l=>`<button class="chip ${klLoc===l[0]?'on':''}" data-klloc="${l[0]}">${l[1]} (${l[2]})</button>`).join('')}</div>
  ${ds.length?ds.map(bKLmot).join(''):'<div class="empty">Không có bản ghi nào ở bộ lọc này.</div>'}
  <div class="sub" style="margin-top:10px">Bản ghi hết hiệu lực <b>không bị xóa</b> — vẫn tìm được bằng bộ lọc, vì <i>"từng bị và đã hết hiệu lực"</i> khác với <i>"chưa bao giờ bị"</i>.</div>
 </div>`}

 const v=p.v[f.k]||[], y=ycCho(f.k), ap=f.nh&&f.ap&&f.ap(p);
 const nutThem=f.t===3?'':y?`<span class="pending" title="${y.moi}">Đang chờ duyệt · ${y.id}</span>`
  :`<button class="btn sm" data-hs-dn="${f.k}">＋ Đề nghị thêm dòng</button>`;
 let head,rows;
 if(f.k==='giadinh'||f.k==='giadinhvc'){head=['Quan hệ','Họ và tên','Năm sinh','Nghề nghiệp','Nơi công tác','Tình trạng chính trị','Quê quán','Nơi cư trú','Trong / ngoài nước'];rows=v}
 else if(f.k==='dienbien'){head=['Tháng/năm','Mã số','Bậc · hệ số','Ngày hưởng'];rows=v}
 else if(f.k==='qtct'){head=['Thời gian','Chức danh, chức vụ','Đơn vị công tác'];rows=v}
 else if(f.k==='b323'){head=['Từ – Đến','Tên cơ sở đào tạo','Loại','Chứng chỉ được cấp','Nguồn dòng'];rows=v.map(r=>[r.tu,r.co,r.loai,r.vb,hsNg(r.ng)])}
 else if(f.k==='b321'){head=['Từ – Đến','Tên cơ sở đào tạo','Chuyên ngành','Hình thức đào tạo','Văn bằng, trình độ','Nguồn dòng'];rows=v.map(r=>[r.tu,r.co,r.cn,r.ht,r.vb,hsNg(r.ng)])}
 else if(f.k==='b322'){head=['Từ – Đến','Tên cơ sở đào tạo','Hình thức đào tạo','Văn bằng được cấp','Nguồn dòng'];rows=v.map(r=>[r.tu,r.co,r.ht,r.vb,hsNg(r.ng)])}
 else if(f.k==='b326'){head=['Từ – Đến','Tên cơ sở đào tạo','Ngoại ngữ / tiếng dân tộc','Chứng chỉ được cấp','Điểm số',HL_TH,'Nguồn dòng'];rows=v.map(r=>[r.tu,r.co,r.cn,r.vb,r.diem||'',hlO(r),hsNg(r.ng)])}
 else if(f.k==='b325'){head=['Từ – Đến','Tên cơ sở đào tạo','Chứng chỉ được cấp',HL_TH,'Nguồn dòng'];rows=v.map(r=>[r.tu,r.co,r.vb,hlO(r),hsNg(r.ng)])}
 else {head=['Từ – Đến','Tên cơ sở đào tạo','Chứng chỉ được cấp','Nguồn dòng'];rows=v.map(r=>[r.tu,r.co,r.vb,hsNg(r.ng)])}
 const trong=!rows.length;
 return `<div class="bg ${f.t===3?'t3':'t2'}" id="hsf-${f.k}"><div class="bgh"><b>${f.t===3?'🔒':'📝'} ${f.n}</b> ${mucTag(f,p)}
   <span style="flex:1"></span>${nutThem}</div>
  ${trong?`<div class="bge">${ap?'<span class="miss">Chưa có dòng nào</span> — nhóm «'+f.nh+'» tính bảng này là <b>thiếu</b> (mức ② áp cho «có ít nhất một dòng»)'
     :'<span class="sub">Không có dòng nào — bảng này chỉ có dòng khi có sự kiện, không có là «không có», không phải «thiếu»</span>'}</div>`
  :`<table class="tb"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`}
  ${HL_BANG.includes(f.k)?`<div class="sub" style="margin-top:5px">Cột <b>Hiệu lực đến</b> là cột <b>nội bộ của Dschool</b> — ⛔ không in lên mẫu 38 mục, HS01, HS02. Để trống = chứng chỉ không có hạn.
    Còn ≤ ${HL_NGUONG} ngày thì dòng mang nhãn «⚠ sắp hết hạn» và bạn nhận một việc ở <b>M0.2</b>; qua ngày thì nhãn «Đã hết hạn» ở lại trên dòng. Ngày mới (thi lại, gia hạn) khai bằng <b>📝 Đề nghị thêm dòng</b>.</div>`:''}</div>`}
/* ---- MYC-2B (chốt #25) — cột NỘI BỘ «Hiệu lực đến» của bảng 32.5 · 32.6 (chủ: M4.1 §6.2.1p — M0.4 chỉ chiếu, ghi qua đề nghị như mọi ô).
   Trống = không có hạn. ≤ 60 ngày ⇒ «sắp hết hạn» (cùng nhịp «hợp đồng còn 60 ngày» của M4.1 §6.3.3); qua ngày ⇒ «đã hết hạn», ⛔ không biến mất.
   Dòng Hệ thống cấp (🔗 M5.6) chỉ đọc — cả cột này. */
const HL_BANG=['b325','b326'], HL_NGUONG=60;
const HL_TH='<span title="Cột nội bộ của Dschool — không in lên mẫu 38 mục / HS01 / HS02">Hiệu lực đến <i class="sub">(nội bộ)</i></span>';
function hlTT(hl){if(!hl)return null;const n=hsCach(hsHom(),hsPd(hl));return {n,sap:n>=0&&n<=HL_NGUONG,het:n<0}}
function hlO(r){if(!r.hl)return '<span class="sub">không có hạn</span>';const s=hlTT(r.hl);   /* chữ nhãn theo đúng M4.1 §6.2.1p.8 */
 return s.het?`<span class="st n">Đã hết hạn ${r.hl}</span>`:`${r.hl} ${s.sap?`<span class="st w">⚠ sắp hết hạn — còn ${s.n} ngày</span>`:''}`
  +(r.ng.startsWith('🔗')?' <span class="sub" title="Dòng Hệ thống cấp — cả cột Hiệu lực đến chỉ đọc">🔒</span>':'')}
const hsNg=ng=>ng.startsWith('🔗')?`<span class="st n" title="Dòng do đợt của M5.6 sinh — không sửa, không xóa ở hồ sơ">${ng} · Hệ thống cấp</span>`:`<span class="sub">${ng}</span>`;

/* ---- ô dẫn xuất của khối Học vấn: suy từ bảng, không có ô nhập ---- */
const BAC_VB=['TSKH','Tiến sĩ','Chuyên khoa II','Thạc sĩ','Chuyên khoa I','Đại học','Cao đẳng','Trung cấp','Sơ cấp'];
function hsDx(k,p){const v=p.v;
 if(k==='dxcm'){const r=(v.b321||[]).slice().sort((a,b)=>BAC_VB.indexOf(a.vb)-BAC_VB.indexOf(b.vb))[0];return r?r.vb+' — '+r.cn:null}
 if(k==='dxllct'){const r=(v.b322||[])[0];return r?r.vb:null}
 if(k==='dxqlnn'){const r=(v.b323||[]).filter(x=>x.loai==='Quản lý nhà nước')[0];return r?r.vb:null}
 if(k==='dxtin'){const r=(v.b325||[]).slice(-1)[0];return r?r.vb:null}
 if(k==='dxnn'){const r=(v.b326||[]).filter(x=>!x.dt).slice(-1)[0];return r?r.cn+' · '+r.vb:null}
 if(k==='dxdt'){return (v.b326||[]).some(x=>x.dt)?'Có':(v.b326?'Không':null)}
 if(k==='dxanqp'){const r=(v.b324||[]).slice(-1)[0];return r?'Có — '+r.tu:null}
 return v[k]}

/* ===== KHỐI «HỒ SƠ CỦA TÔI CÒN THIẾU» — đầu mục F1 (MYC-3: đếm theo NHÓM, bấm mở mới thấy từng trường) ===== */
let hsThieuMo=new Set();
/* MYC-2B (chốt #27) — nhóm nào cũng đã thành việc V4 «Hồ sơ của bạn quá hạn bổ sung: N nhóm» ở M0.2 của CHÍNH CHỦ:
   nhóm có ít nhất một trường TẦNG 1 · 2 còn thiếu, CHÍNH trường ấy đã quá hạn, và CHƯA có yêu cầu Chờ duyệt trên nó.
   Tầng 3 / dẫn xuất ⛔ không đếm (chính chủ không làm gì được — việc ấy là của TCNS, V2). Luật giống hệt hàm v4() của demo M0.2. */
const hsLamDuoc=(f,p)=>(f.t===1||f.t===2)&&!ycCho(f.k)&&hsHan(f,p)&&hsCach(hsHom(),hsHan(f,p))<0;
function hsV4(p,m){return m.nhom.filter(g=>g.ds.some(f=>hsLamDuoc(f,p)))}
const hsLinkM02=()=>`M0.2-Viec-can-lam.html?${hsPk()==='VIET'?'':`vai=${hsPk()}&`}tab=viec&xem=${hsNgay}`;   /* MYC-3A: demo M0.2 chưa có vai Đặng Quốc Việt (PHIEU-MYC-3A E) */
function hsKhoiThieu(){const p=hsP(),m=hsMuc(),dot=hsDotMo(p),v4=hsV4(p,m).map(g=>g.n);
 const nutTheoTang=f=>{const y=ycCho(f.k);
  if(y)return `<span class="pending">Đang chờ duyệt · ${y.id}</span>`;
  if(f.t===1)return `<button class="btn sm p" data-hs-ngay="${f.k}">✎ Sửa ngay</button>`;
  if(f.t===2)return `<button class="btn sm" data-hs-dn="${f.k}">${f.kieu==='bang'?'📝 Đề nghị thêm dòng':'📝 Đề nghị cập nhật'}</button>`;
  return f.capboi?'<span class="srcx">Cơ quan quản lý cấp — Tổ chức nhân sự ghi khi có số, bạn không cần làm gì</span>'
   :'<span class="srcx">Do nhà trường quản lý — liên hệ Tổ chức nhân sự</span>'};
 const dong=g=>{const mo=hsThieuMo.has(g.n);
  return `<div class="tg ${g.nhan.c}"><div class="tgh" data-hs-tg="${g.n}"><span class="cx">${mo?'▾':'▸'}</span>
    <b>${g.n}</b><span class="sub">thiếu ${g.ds.length} mục</span><span style="flex:1"></span>
    <span class="dh ${g.nhan.c}">${g.nhan.c==='r'?'🔴 ':''}${g.nhan.t}</span></div>
   ${v4.includes(g.n)?`<div class="m02">🔔 Việc này cũng đã vào <a class="lnk" href="${hsLinkM02()}">Việc cần làm</a> của bạn</div>`
    :g.nhan.c==='r'?`<div class="m02 x">Không vào Việc cần làm của bạn — ${g.ds.some(f=>(f.t===1||f.t===2)&&ycCho(f.k))?'đề nghị của bạn đang chờ Tổ chức nhân sự duyệt':'trường quá hạn do nhà trường quản lý; Tổ chức nhân sự nhận việc này, bạn không cần làm gì'}</div>`:''}
   ${mo?`<div class="tgb">${g.ds.map(f=>`<div class="tgr"><span>${f.t===2?'📝':f.t===1?'✎':'🔒'} ${f.n}</span>
     <span class="sub">${hsHan(f,p)?'hạn '+hsFd(hsHan(f,p)):'chưa tới hạn'} · ${f.dh(p).map(x=>x==='30'?'⏱ 30 ngày từ ngày tạo hồ sơ':'⏱ theo Đợt rà soát').join(' · ')}</span>
     <span style="flex:1"></span>${nutTheoTang(f)}</div>`).join('')}</div>`:''}</div>`};
 const nguMoc=dot?`Đợt <b>${dot.id}</b> đang mở — hạn khai <b>${dot.han}</b>`
  :p.vc||p.cs?'Chưa có Đợt rà soát nào đang mở có tên bạn — các nhóm theo đợt hiện <b>chưa tới hạn</b>':'Bạn không thuộc diện viên chức, không thuộc diện khai CSDL ngành';
 return `<div class="card thieu" id="hsThieu"><div class="ch"><h3>📋 Hồ sơ của tôi còn thiếu</h3>
   <span class="sub">Ngày xem (demo):</span>${Object.keys(HS_NGAY).map(k=>`<button class="chip ${hsNgay===k?'on':''}" data-hs-ngayxem="${k}" title="${HS_NGAY[k].nh}">${HS_NGAY[k].s}</button>`).join('')}</div>
  <div class="cb">
   <div class="sub" style="margin-bottom:9px">${nguMoc}. Hồ sơ của bạn được tạo trên hệ thống ngày ${p.tao} — nhóm «Giấy tờ nội bộ» tính hạn <b>30 ngày</b> từ ngày ấy.</div>
   ${m.m1.length?`<div class="alert" style="margin-bottom:10px">⛔ <b>Thiếu thông tin định danh</b> — ${m.m1.map(f=>f.n).join(' · ')}. Đây là hồ sơ nhập trước khi có luật ba mức; liên hệ Tổ chức nhân sự.</div>`:''}
   ${m.nhom.length
    ? `<div class="tsum">Thiếu <b>${m.nhom.length} nhóm</b>: ${m.nhom.map(g=>`<span class="${g.nhan.c==='r'?'do':''}">${g.n}</span>`).join(' · ')}</div>
       ${v4.length?`<div class="m02 top">🔔 <b>«Hồ sơ của bạn quá hạn bổ sung: ${v4.length} nhóm»</b> đã vào <a class="lnk" href="${hsLinkM02()}">Việc cần làm (M0.2)</a> —
        chỉ đếm nhóm có trường bạn <b>tự sửa</b> hoặc <b>đề nghị</b> được; nhóm chỉ còn trường nhà trường quản lý là việc của Tổ chức nhân sự.</div>`:''}${m.nhom.map(dong).join('')}`
    : `<div class="ok2">✓ <b>Hồ sơ của bạn đã đủ</b> — không còn nhóm nào ở mức «cần bổ sung sớm» áp cho bạn.</div>`}
   ${m.m3.length?`<div class="m3l">● <b>Nên bổ sung</b> (không tính là thiếu): ${m.m3.map(x=>x.f.n+(x.ly==='chưa khai'?'':' — '+x.ly)).join(' · ')}</div>`:''}
   <div class="sub" style="margin-top:8px">Chỉ tính các trường <b>áp cho bạn</b> (diện làm việc: <b>${p.v.dien}</b> · ${p.cs?'thuộc':'<b>không</b> thuộc'} diện khai CSDL ngành · nhóm ${p.nhom}).
    Nhóm quá hạn thì đỏ; nhóm theo Đợt rà soát khi chưa có đợt là «chưa tới hạn». Nút đi theo tầng: ✎ sửa ngay · 📝 đề nghị · 🔒 nhà trường quản lý.</div>
  </div></div>`}

/* ===== F1 — THÔNG TIN CÁ NHÂN ===== */
function F1(){const p=hsP();HS_VE=new Set();
 const khoiHien=KHOI.filter(k=>k[0]!=='GD'||p.nhom===2);
 const tieuDe=k=>`<div class="ch hsk" data-hs-khoi="${k[0]}"><span class="cx">${hsMo.has(k[0])?'▾':'▸'}</span><h3>${k[1]}</h3><span class="sub">${k[2]}</span></div>`;
 const noiDung=id=>{
  if(id==='NK')return hsNhatKy(p);
  const ds=FD.filter(f=>f.b===id);
  if(id==='B')return ds.map(f=>hsBang(f,p)).join('')+'<div class="sub" style="margin-top:6px">Thêm, sửa thành viên đi qua <b>đề nghị cập nhật</b> kèm minh chứng. Thành viên đã mất ⛔ không xóa dòng — đề nghị đánh dấu «Đã mất».</div>';
  if(id==='HV')return ds.filter(f=>f.kieu!=='bang'&&f.t!=='dx').map(f=>hsO(f,p)).join('')+ds.filter(f=>f.kieu==='bang').map(f=>hsBang(f,p)).join('')
   +'<div class="subh">Ô dẫn xuất — không có ô nhập, sai thì sửa ở bảng</div>'+ds.filter(f=>f.t==='dx').map(f=>{f.d.forEach(x=>HS_VE.add(x));const v=hsDx(f.k,p);
     return `<div class="f dx"><div class="k">🔗 ${f.n}</div><div class="v">${v||'<span class="sub">Chưa có</span>'}</div><div class="a"><span class="srcx">${f.src}</span></div></div>`}).join('')
   +`<div class="info" style="margin:10px 0 0">Khối này <b>thay mục «Văn bằng & chứng chỉ» cũ</b> của trang cá nhân — không còn hai danh sách văn bằng.
     Dòng tự khai đi qua <b>đề nghị cập nhật</b> kèm minh chứng là chính tấm bằng; dòng <b>Hệ thống cấp</b> do đợt của M5.6 sinh, không sửa, không xóa ở đây.
     <button class="btn sm" data-x="xuat" style="margin-left:6px">⬇ Xuất danh sách văn bằng của tôi</button></div>`;
  const sub=[...new Set(ds.map(f=>f.s||''))];
  return sub.map(s=>(s?`<div class="subh">${s}</div>`:'')+ds.filter(f=>(f.s||'')===s).map(f=>f.kieu==='bang'?hsBang(f,p):hsO(f,p)).join('')).join('')};
 const phan=khoiHien.map(k=>`<div class="card">${tieuDe(k)}${hsMo.has(k[0])?`<div class="cb">${noiDung(k[0])}</div>`:''}</div>`).join('');
 return hsQuayLai()+hsKhoiThieu()
  +`<div class="card"><div class="cb" style="padding-bottom:12px">
    ${role!=='GVBM'&&role!=='TQ'&&role!=='VIET'?`<div class="sub" style="margin-bottom:8px">Demo: mục Hồ sơ của vai này <b>mượn hồ sơ mẫu Lê Hoàng Minh</b> (NS-0142) — cùng khuôn «mượn dữ liệu» của F6 · F9.</div>`:''}
    <div class="info" style="margin:0">Trang cá nhân là <b>personal view</b> — không sở hữu dữ liệu. Mọi lượt ghi gọi API của <b>M4.1</b>, audit <code>nguồn_thao_tác = M0.4</code>.
     Ba tầng: <span class="lg1">✎ tự sửa ngay</span> · <span class="lg2">📝 đề nghị cập nhật (Tổ chức nhân sự duyệt)</span> · <span class="lg3">🔒 nhà trường quản lý</span> · <span class="lg4">🔗 dẫn xuất — chỉ đọc, ghi nguồn</span>.
     Mức: <span class="mt m1">①</span> bắt buộc · <span class="mt m2">②</span> cần bổ sung sớm · <span class="mt m3">③</span> nên có.
     <div style="margin-top:6px"><button class="btn sm" data-hs-tatca="1">Mở hết khối</button> <button class="btn sm" data-hs-tatca="0">Thu hết</button></div></div></div></div>`
  +phan}

function dcDo(s){const t=Object.keys(DM_TINH).find(t=>s.includes(t.replace(/^(Thành phố|Tỉnh) /,'')));
 if(!t)return {ok:0,ly:'Máy không dò được tên tỉnh nào trong chuỗi — giữ chế độ tự do là hợp lệ.'};
 const x=DM_TINH[t].find(x=>s.includes(x.replace(/^(Phường|Xã) /,'')));
 if(!x)return {ok:0,ly:`Máy chỉ dò được <b>${t}</b>, không khớp xã / phường nào của danh mục hiện hành. Địa chỉ ghi theo đơn vị hành chính <b>đã giải thể</b> thì <b>để nguyên là đúng</b> — ép chọn mã hiện hành là ghi sai lịch sử.`};
 const core=x.replace(/^(Phường|Xã) /,''),ct=s.slice(0,s.indexOf(core)).replace(/[,\s]+$/,'');
 return {ok:1,tinh:t,xa:x,ct}}

let dnSeq=170, dnLoc='all', dnMo=null, dnView='ds', dnForm=null;

/* ---- HDNP ③ — hàm hiệu lực: mọi chỗ đọc hiệu lực đi qua đây ---- */
const coHieuLuc=(don,ngay)=>don.trang_thai==='co_hieu_luc'&&don.ngay.some(n=>n.ngay===ngay&&!n.da_rut);

/* ---- HDNP ④ — vùng thu hồi, máy tính cho TỪNG NGÀY ---- */
function dnVung(don,n){
 if(don.trang_thai!=='co_hieu_luc')return 1;          /* chưa có hiệu lực ⇒ chưa có gì chảy sang M4.7/M4.9 */
 if(dnP(n.ngay)<DN_D0)return 3;                        /* ngày đã qua: đã có kết luận chấm công ở M4.9 */
 const ts=dnTiet(role,n.ngay,n.buoi);
 if(ts.length&&dnGio(n.ngay,ts[0].tiet)<=DN_NOW)return 3;  /* tiết đầu của ngày đã bắt đầu */
 if(ts.some(t=>t.dayThay!==undefined))return 2;       /* có tiết đã xếp người dạy thay */
 return 1;
}
function dnVungLyDo(don,n){
 const v=dnVung(don,n),ts=dnTiet(role,n.ngay,n.buoi);
 if(v===3)return dnP(n.ngay)<DN_D0?'ngày đã qua — đã có kết luận chấm công ở M4.9'
   :`tiết ${ts[0].tiet} (${ts[0].gio}) lớp ${ts[0].lop} đã bắt đầu`;
 if(v===2){const x=ts.filter(t=>t.dayThay!==undefined);
   return `${x.length} tiết đã xếp người dạy thay${x[0].dayThay?' — '+x[0].dayThay:''}`}
 return don.trang_thai==='co_hieu_luc'?(ts.length?'nhu cầu dạy thay chưa xếp người':'không có tiết dạy trong ngày'):'đơn chưa có hiệu lực — chưa chảy sang M4.7 / M4.9';
}
const dnSatGio=n=>{const ts=dnTiet(role,n.ngay,n.buoi);return ts.length&&(dnGio(n.ngay,ts[0].tiet)-DN_NOW)/36e5<DN_SATGIO};
const VI={1:'⚪',2:'🟡',3:'🔴'};

/* ---- quỹ nghỉ hằng năm — công thức chung M4.8 §2 ---- */
const dnBLLD=p=>12+Math.floor((p.tn||0)/5);
const dnHe=p=>p.ng?DN_HE_TUAN*5:0;
const dnQuy=p=>Math.max(0,dnBLLD(p)-dnHe(p));
const dnSoNgay=d=>d.ngay.filter(n=>!n.da_rut).reduce((s,n)=>s+(n.buoi==='ca_ngay'?1:.5),0);
const dnDaDung=()=>dsDon().filter(d=>d.trang_thai==='co_hieu_luc'&&loaiN(d.loai).quy).reduce((s,d)=>s+dnSoNgay(d),0);
const dnThieuHS=d=>loaiN(d.loai).giay&&!d.ho_so.length&&!['nhap','da_rut'].includes(d.trang_thai);

/* ---- «Đơn này sẽ đến tay» — danh sách do M4.8 §4 sinh, M0.4 chỉ chiếu ---- */
function dnDenTay(loaiMa,tiets,soNgay){
 const p=P[role],l=loaiN(loaiMa),pdt=p.dtr==='B'?'PHT phụ trách Điểm trường B':'Phạm Đức Thắng — PHT Điểm trường A';
 const dongY=l.co_che==='can_thoa_thuan'?[pdt,'Trần Văn Hùng — Hiệu trưởng']:[];
 const biet=[[pdt,'M4.8 — đơn của người thuộc điểm trường mình (neo NGƯỜI)']];
 [...new Set(tiets.map(t=>t.toMa).filter(Boolean))].forEach(t=>biet.push([TTCM_TEN[t]+' — TTCM '+TO_TEN[t],'M4.7 tab Giáo viên vắng — chỉ lát tiết của tổ mình (neo TIẾT)']));
 [...new Set(tiets.map(t=>t.dt))].filter(x=>x!==p.dtr).forEach(x=>biet.push([x==='B'?'PHT phụ trách Điểm trường B':'Phạm Đức Thắng — PHT Điểm trường A','M4.7 — tiết thuộc lớp điểm trường mình']));
 if(tiets.length)biet.push(['Vũ Thị Thanh — PHT chuyên môn','M4.7 — toàn trường']);
 biet.push(['Trần Văn Hùng — Hiệu trưởng','M4.8 Tổng hợp — toàn trường'],['Ngô Thị Hạnh — Tổ chức nhân sự','M4.8 Tổng hợp · hồ sơ đính kèm'],[DN_NVCC+' — phụ trách chấm công','M4.9 — ngày công']);
 const ky=(l.co_che==='ghi_nhan_quyet_dinh'||soNgay>7)?'Trần Văn Hùng — Hiệu trưởng ký quyết định (Nhóm B, bắt buộc)':null;
 return {dongY,biet,ky};
}
function dnDenTayHTML(x){
 return `<div class="mini" style="margin-bottom:11px"><div class="t">📬 Đơn này sẽ đến tay</div>
  ${x.dongY.length?`<div style="margin-bottom:6px"><b>Người có thể đồng ý</b> <span class="sub">(một người đồng ý là đủ)</span>: ${x.dongY.join(' · ')}</div>`:''}
  ${x.ky?`<div style="margin-bottom:6px"><b>Quyết định:</b> ${x.ky}</div>`:''}
  <div><b>Người cần biết</b> — không ai phải bấm gì:</div>
  <ul class="ul" style="margin:4px 0 0">${x.biet.map(b=>`<li>${b[0]} <span class="sub">· ${b[1]}</span></li>`).join('')}</ul>
  <div class="sub" style="margin-top:6px">Danh sách do <b>M4.8 §4</b> sinh theo điểm trường của bạn và tổ/lớp của từng tiết — không có ai «duyệt» đơn.</div></div>`}

/* ---- nhãn ---- */
const TT_TEN={nhap:['Nháp','n'],cho_dong_y:['Chờ đồng ý','w'],co_hieu_luc:['Có hiệu lực','o'],khong_dong_y:['Không đồng ý','r'],da_rut:['Đã rút','n']};
function dnNhan(d){
 const a=[];
 if(d.nhan.includes('nhap_ho'))a.push(`<span class="st w" title="Người khác nhập đơn này thay bạn — kiểm tra lại, sai thì báo Văn thư / TCNS">✍ nhập hộ</span>`);
 if(d.nhan.includes('bao_muon'))a.push('<span class="st r">báo muộn</span>');
 if(d.nhan.includes('vuot_quy'))a.push('<span class="st r">vượt quỹ</span>');
 if(dnThieuHS(d))a.push('<span class="st w">thiếu hồ sơ</span>');
 if(d.de_nghi_doi_ngay&&d.trang_thai==='co_hieu_luc')a.push('<span class="st w">↩ đề nghị đổi ngày</span>');
 if(d.ngay.some(n=>n.sat_gio))a.push('<span class="st r">sát giờ</span>');
 return a.join(' ');
}
function dnDayThay(d){
 if(['nhap','cho_dong_y','khong_dong_y'].includes(d.trang_thai))return '<span class="sub">—</span>';
 let tong=0,co=0;
 if(d.ngay.every(n=>dnP(n.ngay)<DN_D0))return '<span class="sub">Đã qua</span>';
 d.ngay.filter(n=>!n.da_rut||n.giu_nguoi_day_thay).forEach(n=>dnTiet(role,n.ngay,n.buoi).forEach(t=>{tong++;if(t.dayThay!==undefined)co++}));
 if(!tong)return '<span class="sub">Không có tiết</span>';
 return `<span class="st ${co===tong?'o':'w'}">${co}/${tong} tiết đã có người</span>`;
}
const dnNgayTxt=d=>{const a=d.ngay[0].ngay,b=d.ngay[d.ngay.length-1].ngay;
 return (a===b?dnThu(a):a.slice(0,5)+' – '+b)+(d.ngay.length===1&&d.ngay[0].buoi!=='ca_ngay'?` <span class="st n">${BUOI_TEN[d.ngay[0].buoi]}</span>`:'')};

/* ===================== F7 = mục «Đơn nghỉ phép» (F6 của tài liệu) ===================== */
function F7(){return dnView==='soan'?dnSoan():dnDanhSach()}

function dnDanhSach(){
 const p=P[role],ds=dsDon(),quy=dnQuy(p),dung=dnDaDung();
 /* đơn nhận đề nghị đổi ngày: đơn còn hiệu lực và còn ngày chưa rút. KHÔNG có cờ «đã xem» — HDNP ② không có trường đó (phiếu P) */
 const cho=ds.filter(d=>d.de_nghi_doi_ngay&&d.trang_thai==='co_hieu_luc'&&d.ngay.some(n=>!n.da_rut)).length;
 const loc=[['all','Tất cả'],['nhap','Nháp'],['cho_dong_y','Chờ đồng ý'],['co_hieu_luc','Có hiệu lực'],['khong_dong_y','Không đồng ý'],['da_rut','Đã rút']];
 const hien=ds.filter(d=>dnLoc==='all'||d.trang_thai===dnLoc);
 return `<div class="card"><div class="ch"><h3>🏖️ Đơn nghỉ phép của tôi</h3>
  <span class="sub" style="margin-left:6px"><code>m0.4.don_nghi_cua_toi</code> · Own</span><div class="spacer"></div>
  <button class="btn sm" data-dnxuat="1">⬇ Xuất</button>
  <button class="btn p sm" id="dnTao" data-dntao="">＋ Xin nghỉ phép</button></div><div class="cb">
  <div class="info"><b>Đơn nghỉ của nhân sự không có bước duyệt.</b> Gửi là <b>có hiệu lực</b> — trừ loại nghỉ không hưởng lương cần <b>một người đồng ý</b>.
   Ngày có hiệu lực tự chảy sang <b>M4.7</b> (nhu cầu dạy thay) và <b>M4.9</b> (Vắng có phép). Muốn thôi nghỉ thì <b>Rút đơn</b> — máy xét từng ngày.
   <div class="sub" style="margin-top:4px">Phạm vi: chỉ đơn của chính bạn — <b>kể cả đơn người khác nhập hộ cho bạn</b> (mang nhãn <b>nhập hộ</b>). Hôm nay của mục này: <b>${dnNowS}</b>.</div></div>
  ${cho?`<div class="warn">↩ Bạn có <b>${cho} đơn nhận đề nghị đổi ngày</b>. Đơn <b>vẫn có hiệu lực</b> — chỉ bạn quyết rút hay giữ.</div>`:''}
  <div class="kpi">
   <div><b>${Math.max(0,quy-dung)}</b><span>Quỹ nghỉ hằng năm còn lại <span class="sub">(${quy} − ${dung} đã dùng / đã đăng ký)</span></span></div>
   <div><b>${ds.filter(d=>d.trang_thai==='co_hieu_luc'&&d.ngay.some(n=>!n.da_rut&&dnP(n.ngay)>=DN_D0)).length}</b><span>Đơn có hiệu lực sắp tới / hôm nay</span></div>
   <div><b>${ds.filter(d=>d.trang_thai==='cho_dong_y').length}</b><span>Đơn chờ đồng ý</span></div>
   <div><b style="color:${cho?'var(--amber)':'inherit'}">${cho}</b><span>Đơn nhận đề nghị đổi ngày</span></div></div>
  <div class="sub" style="margin:-4px 0 12px">Quỹ = max(0, ${dnBLLD(p)} ngày theo BLLĐ Đ.113–114 − ${dnHe(p)} ngày nghỉ hè thực hưởng${p.ng?` (${DN_HE_TUAN} tuần, khai ở M10.1)`:''}) — <b>công thức chung M4.8 §2</b>${p.ng&&!quy?'; nhà giáo nghỉ hè đủ 8 tuần thì nghỉ hè đã bao gồm nghỉ hằng năm (NĐ 93/2026)':''}.</div>
  <div class="chips">${loc.map(l=>`<button class="chip ${dnLoc===l[0]?'on':''}" data-dnloc="${l[0]}">${l[1]} (${l[0]==='all'?ds.length:ds.filter(d=>d.trang_thai===l[0]).length})</button>`).join('')}</div>
  </div><div class="cb" style="padding:0;border-top:1px solid var(--line)">
  ${hien.length?`<table><tr><th>Mã · loại</th><th>Ngày nghỉ</th><th>Số ngày</th><th>Trạng thái</th><th>Nhãn</th><th>Dạy thay <span class="sub">🔗 chỉ đọc</span></th><th>Thao tác</th></tr>
  ${hien.map(d=>dnDong(d)).join('')}</table>`
  :`<div class="cb"><div class="empty">${ds.length?'Không có đơn nào ở bộ lọc này.':'Bạn chưa có đơn nghỉ nào. Bấm <b>＋ Xin nghỉ phép</b> để gửi đơn đầu tiên.'}</div></div>`}
  </div></div>`}

function dnNut(d){
 const b=[];
 if(d.trang_thai==='nhap')b.push(`<button class="btn sm p" data-dnsua="${d.id}">Sửa · gửi</button>`,`<button class="btn sm" data-dnxoa="${d.id}">Xóa nháp</button>`);
 if(['co_hieu_luc','cho_dong_y'].includes(d.trang_thai)&&d.ngay.some(n=>!n.da_rut&&dnP(n.ngay)>=DN_D0))b.push(`<button class="btn sm" data-dnrut="${d.id}">Rút đơn</button>`);
 if(['khong_dong_y','da_rut'].includes(d.trang_thai)||d.de_nghi_doi_ngay)b.push(`<button class="btn sm" data-dnmoi="${d.id}">Gửi đơn mới</button>`);
 return b.join(' ')||'—';
}
function dnDong(d){
 const tt=TT_TEN[d.trang_thai],mo=dnMo===d.id;
 return `<tr style="cursor:pointer;${mo?'background:#f8fafc':''}" data-dnmo="${d.id}">

  <td>${dnNgayTxt(d)}<div class="sub">${d.ngay.map(n=>`<span title="${n.ngay}">${n.da_rut?'<s>'+n.ngay.slice(0,5)+'</s>':VI[dnVung(d,n)]+' '+n.ngay.slice(0,5)}</span>`).join(' ')}</div></td>
  <td>${dnSoNgay(d)||0}${d.ngay.some(n=>n.da_rut)&&d.trang_thai!=='da_rut'?`<div class="sub">rút ${d.ngay.filter(n=>n.da_rut).length} ngày</div>`:''}</td>
  <td><span class="st ${tt[1]}">${tt[0]}</span>${d.quyet_dinh&&!d.quyet_dinh.da_ky_luc?'<div class="sub">🔏 quyết định chờ ký</div>':''}</td>

  <td>${dnDayThay(d)}</td>
  <td style="white-space:nowrap">${dnNut(d)}</td></tr>
  ${mo?`<tr><td colspan="7" style="background:#f8fafc;padding:12px 14px">${dnChiTiet(d)}</td></tr>`:''}`}

function dnChiTiet(d){
 const l=loaiN(d.loai),tiets=d.ngay.flatMap(n=>dnTiet(role,n.ngay,n.buoi));
 const ddn=d.de_nghi_doi_ngay&&d.trang_thai==='co_hieu_luc';
 return `
 ${ddn?`<div class="warn" style="border-width:2px"><b>↩ Đề nghị đổi ngày</b> — ${d.de_nghi_doi_ngay.boi} · ${d.de_nghi_doi_ngay.luc}
   <div style="margin:6px 0;padding:7px 10px;background:#fff;border-radius:7px;color:var(--ink)"><b>Lý do:</b> ${d.de_nghi_doi_ngay.ly_do}</div>
   Đơn <b>vẫn có hiệu lực</b> cho tới khi <b>chính bạn</b> rút. Lãnh đạo và tổ trưởng không hủy được đơn nghỉ của người khác.

    <span class="sub">Không làm gì = giữ nguyên đơn.</span></div></div>`:''}
 ${d.khong_dong_y?`<div class="alert" style="margin-bottom:11px"><b>✕ Không đồng ý</b> — ${d.khong_dong_y.boi} · ${d.khong_dong_y.luc}<div style="margin-top:4px"><b>Lý do:</b> ${d.khong_dong_y.ly_do}</div></div>`:''}
 <div class="grid2" style="margin-bottom:11px">
  <div class="mini"><div class="t">Đơn</div><b>${l.ten}</b>
   <div class="sub">Cơ chế lúc gửi: <code>${d.co_che_luc_gui||l.co_che}</code> — ${CO_CHE_TEN[d.co_che_luc_gui||l.co_che]}</div>
   <div style="margin-top:5px">Lý do: ${d.ly_do}</div>
   <div class="sub" style="margin-top:4px">${d.gui_luc?`Gửi ${d.gui_luc} · ${d.kenh}`:'Chưa gửi — chỉ bạn thấy nháp'}</div>
   ${d.nguoi_nhap_ho?`<div class="warn" style="margin:7px 0 0;padding:7px 10px">✍ <b>Nhập hộ</b> bởi <b>${d.nguoi_nhap_ho.ten}</b> lúc ${d.nguoi_nhap_ho.luc} · căn cứ: <b>${d.can_cu_nhan_don}</b>.
     <div class="sub">Không có vòng xác nhận — nhãn này là cách duy nhất để bạn phát hiện đơn nhập sai. Sai thì báo Văn thư / TCNS.
     Người nhập hộ chỉ rút được ngày ⚪ (ở M4.8); bạn rút được ⚪ và 🟡.</div></div>`:''}
   ${d.bao_vang?`<div class="sub" style="margin-top:6px">⚡ Đã có báo vắng ${d.bao_vang.id}: ${d.bao_vang.boi} · ${d.bao_vang.luc} · ${d.bao_vang.kenh} — <b>máy đã ghép</b> với đơn này.</div>`:''}</div>
  <div class="mini"><div class="t">Từng ngày · vùng thu hồi lúc ${dnNowS}</div>
   ${d.ngay.map(n=>`<div style="padding:3px 0;border-bottom:1px dashed var(--line)">${n.da_rut
     ?`<s>${dnThu(n.ngay)}</s> <span class="st n">đã rút</span> <span class="sub">${n.rut_luc} · ${n.rut_boi}${n.ly_do_rut?' · «'+n.ly_do_rut+'»':''}${n.giu_nguoi_day_thay?' · giữ người dạy thay':''}${n.sat_gio?' · sát giờ':''}</span>`
     :`${VI[dnVung(d,n)]} <b>${dnThu(n.ngay)}</b> ${n.buoi!=='ca_ngay'?BUOI_TEN[n.buoi]:''} <span class="sub">— ${dnVungLyDo(d,n)} · ${coHieuLuc(d,n.ngay)?'có hiệu lực':'chưa có hiệu lực'}</span>`}</div>`).join('')}
  </div></div>
 <div class="mini" style="margin-bottom:11px"><div class="t">Tiết bị ảnh hưởng · tình trạng dạy thay — 🔗 M4.7, chỉ đọc</div>
  ${tiets.length?`<table style="font-size:12px"><tr><th>Ngày</th><th>Tiết</th><th>Lớp</th><th>Môn</th><th>Tình trạng</th></tr>
   ${tiets.map(t=>{const n=d.ngay.find(x=>x.ngay===t.ngay),rut=n.da_rut&&!n.giu_nguoi_day_thay;
    return `<tr><td>${dnThu(t.ngay)}</td><td>${t.tiet} · ${t.gio}</td><td>${t.lop} <span class="st n">ĐT ${t.dt}</span></td><td>${t.mon}</td>
     <td>${rut?'<span class="sub">ngày đã rút — tiết trả về bạn</span>':['nhap','cho_dong_y','khong_dong_y'].includes(d.trang_thai)?'<span class="sub">chưa sinh nhu cầu (đơn chưa có hiệu lực)</span>'
      :t.dayThay!==undefined?`<span class="st o">đã có người${t.dayThay?' · '+t.dayThay:''}</span>${n.giu_nguoi_day_thay?' <span class="sub">giữ người khi rút</span>':''}`:dnGio(t.ngay,t.tiet)<=DN_NOW?'<span class="sub">đã diễn ra — xem ở M4.7</span>':'<span class="st w">chờ M4.7 xếp người</span>'}</td></tr>`}).join('')}</table>
   <div class="sub" style="margin-top:5px">Bạn không xếp người — người điều hành ở M4.7 làm. <button class="btn sm" data-go="M2.1">↗ Xem lịch ở M2.1</button></div>`
  :`<div class="sub">${P[role].teach?'Không có tiết dạy nào trong những ngày này':'Bạn không có phân công giảng dạy'} — đơn <b>không phát sinh nhu cầu dạy thay</b> và <b>không xuất hiện ở M4.7</b>.</div>`}</div>
 ${d.de_xuat?`<div class="mini" style="margin-bottom:11px"><div class="t">Đề xuất người dạy thay</div><b>${d.de_xuat.ten}</b><div style="margin-top:3px">Ghi chú thỏa thuận: <i>«${d.de_xuat.ghi_chu}»</i></div>
   <div class="sub">Ghi chú hiện nguyên văn cho người dạy thay ở M2.1 — họ nhớ ra lời đã nhận, hoặc phát hiện ngay nếu chưa từng nhận.</div></div>`:''}
 ${d.quyet_dinh?`<div class="mini" style="margin-bottom:11px"><div class="t">🔏 Quyết định</div>${d.quyet_dinh.da_ky_luc?`<span class="st o">Đã ký</span> ${d.quyet_dinh.da_ky_luc}`
   :'<span class="st w">Chờ Hiệu trưởng ký (Nhóm B)</span> <span class="sub">— đơn đã có hiệu lực; ký chậm không chặn nghỉ, chỉ chặn chốt lương</span>'}</div>`:''}
 <div class="mini" style="margin-bottom:11px"><div class="t">Hồ sơ đính kèm — dữ liệu sức khỏe (Luật BVDLCN 91/2025)</div>
  ${d.ho_so.length?d.ho_so.map(h=>`<div class="hs"><span>📄 ${h}</span><button class="btn sm" data-dnhsxem="${h}">👁 Xem</button><button class="btn sm" data-tai="${h}">⬇ Tải</button></div>`).join('')
   :`<span class="sub">Chưa có tệp.</span>`}
  ${dnThieuHS(d)?`<div class="warn" style="margin:7px 0 0">Loại <b>${l.ten}</b> cần hồ sơ đính kèm — đơn <b>vẫn có hiệu lực</b>, chỉ mang nhãn <b>thiếu hồ sơ</b>. Người ốm hôm nay chưa thể có giấy khám hôm nay.
    <div style="margin-top:6px"><button class="btn sm p" data-dnbs="${d.id}">📎 Bổ sung hồ sơ</button></div></div>`:''}
  <div class="sub" style="margin-top:5px">Chỉ bạn, Tổ chức nhân sự và người đồng ý (nếu có) xem được. Mỗi lượt xem và tải đều ghi audit.</div></div>
 <div class="mini"><div class="t">Nhật ký đơn</div>${d.nhat_ky.map(x=>`<div class="sub" style="padding:2px 0">🕘 <b>${x[0]}</b> — ${x[1]}</div>`).join('')}</div>`}

/* ===================== SOẠN ĐƠN ===================== */
function dnFormMoi(ngay,tu){
 const p=P[role],d0=ngay&&dnOK(ngay)?ngay:dnS(dnThem(DN_D0,1));
 return {id:null,loai:p.ng?'OM':'PN',tu:tu?tu.ngay[0].ngay:d0,den:tu?tu.ngay[tu.ngay.length-1].ngay:d0,buoi:'ca_ngay',
  ly_do:tu?tu.ly_do:'',de_xuat:null,ghi_chu:'',ho_so:[],tuDeepLink:!!ngay};
}
function dnNgayKhoang(f){
 if(!dnOK(f.tu)||!dnOK(f.den))return [];
 const a=dnP(f.tu),b=dnP(f.den),out=[];
 for(let d=a;d<=b&&out.length<200;d=dnThem(d,1))if(d.getDay()!==0)out.push(dnS(d));
 return out;
}
function dnKiem(f){
 const p=P[role],l=loaiN(f.loai),ngay=dnNgayKhoang(f),mot=ngay.length===1,buoi=mot?f.buoi:'ca_ngay';
 const chan=[],canh=[];
 if(!dnOK(f.tu)||!dnOK(f.den))chan.push('Ngày chưa đúng dạng dd/mm/yyyy');
 else if(dnP(f.den)<dnP(f.tu))chan.push('«Đến ngày» đứng trước «Từ ngày»');
 else if(!ngay.length)chan.push('Khoảng ngày chỉ gồm Chủ nhật — không có ngày làm việc nào');
 if(!f.ly_do.trim())chan.push('Chưa nhập lý do nghỉ');
 if(f.de_xuat&&!f.ghi_chu.trim())chan.push(`Đã điền người dạy thay (${f.de_xuat}) nhưng chưa có ghi chú thỏa thuận — ai đã hỏi ai, bằng cách nào, khi nào`);
 const trung=ngay.filter(s=>dsDon().some(d=>d.id!==f.id&&(coHieuLuc(d,s)||(d.trang_thai==='cho_dong_y'&&d.ngay.some(n=>n.ngay===s&&!n.da_rut)))));
 if(trung.length)chan.push(`Ngày ${trung.map(s=>s.slice(0,5)).join(', ')} đã nằm trong một đơn khác của bạn (có hiệu lực hoặc chờ đồng ý) — rút đơn đó hoặc chọn ngày khác`);
 const tiets=ngay.flatMap(s=>dnTiet(role,s,buoi));
 const soNgay=mot&&buoi!=='ca_ngay'?.5:ngay.length;
 const nhan=[];
 if(ngay.length){const t0=tiets.length?dnGio(tiets[0].ngay,tiets[0].tiet):dnP(ngay[0]);
  if(t0<=DN_NOW){nhan.push('bao_muon');canh.push('Ngày nghỉ đầu tiên đã bắt đầu — đơn <b>vẫn được ghi nhận</b>, mang nhãn <b>báo muộn</b> và vào hàng đợi ngoại lệ của M4.9')}}
 if(l.quy){const con=dnQuy(p)-dnDaDung();if(soNgay>con){nhan.push('vuot_quy');canh.push(`Quỹ nghỉ hằng năm còn <b>${Math.max(0,con)}</b> ngày, đơn này <b>${soNgay}</b> ngày — đơn <b>vẫn được nhận</b>, mang nhãn <b>vượt quỹ</b> (chảy sang M4.9 · M7.6)`)}}
 if(l.giay&&!f.ho_so.length)canh.push(`Loại <b>${l.ten}</b> cần hồ sơ đính kèm — gửi được, đơn mang nhãn <b>thiếu hồ sơ</b> tới khi bạn bổ sung`);
 if(ngay.length>30)canh.push('Đơn trên 30 ngày — cân nhắc thủ tục <b>Tạm nghỉ</b> ở M4.2 (hệ thống gợi ý, bạn quyết)');
 return {l,ngay,buoi,tiets,soNgay,chan,canh,nhan};
}
function dnSoan(){
 const f=dnForm,p=P[role],k=dnKiem(f),den=dnDenTay(f.loai,k.tiets,k.soNgay);
 const canTT=k.tiets.some(t=>t.dayThay===undefined&&dnGio(t.ngay,t.tiet)>DN_NOW);
 return `<div class="card"><div class="ch"><button class="btn sm" data-dnve="1">← Đơn nghỉ phép của tôi</button>

    <div class="sub" style="margin-top:4px">${CO_CHE_TEN[k.l.co_che]}</div></div>
   <div class="fld"><label>Từ ngày</label><input id="dnTu" value="${f.tu}" placeholder="dd/mm/yyyy"></div>
   <div class="fld"><label>Đến ngày</label><input id="dnDen" value="${f.den}" placeholder="dd/mm/yyyy"></div>
  </div>
  ${k.ngay.length===1?`<div class="fld"><label>Phạm vi trong ngày <span class="sub">(nghỉ nửa ngày chỉ áp cho đơn đúng MỘT ngày — M4.8 §4b)</span></label>

function dnDocForm(){const f=dnForm;if(!f)return;
 const v=id=>{const e=document.getElementById(id);return e?e.value:null};
 if(v('dnLoai')!==null)f.loai=v('dnLoai'); if(v('dnTu')!==null)f.tu=v('dnTu'); if(v('dnDen')!==null)f.den=v('dnDen');
 if(v('dnLy')!==null)f.ly_do=v('dnLy'); if(v('dnGhiChu')!==null)f.ghi_chu=v('dnGhiChu');
}
function dnLuu(kieu){
 dnDocForm();const f=dnForm,k=dnKiem(f);
 if(kieu==='gui'&&k.chan.length){pane();toast('Chưa gửi được — '+k.chan[0]);return}
 if(kieu==='nhap'&&(!dnOK(f.tu)||!dnOK(f.den)||!k.ngay.length)){toast('Nháp cũng cần khoảng ngày hợp lệ');return}
 const l=k.l,d=f.id?donId(f.id):{id:'NP-2026-'+(++dnSeq),nhat_ky:[]};
 Object.assign(d,{loai:f.loai,ly_do:f.ly_do,kenh:'Web',nguoi_nhap_ho:null,can_cu_nhan_don:null,
  de_xuat:f.de_xuat?{ten:f.de_xuat,ghi_chu:f.ghi_chu}:null,ho_so:f.ho_so.slice(),de_nghi_doi_ngay:null,
  ngay:k.ngay.map(s=>mk(s,k.buoi))});
 if(kieu==='nhap'){d.trang_thai='nhap';d.co_che_luc_gui=null;d.nhan=[];d.quyet_dinh=null;d.gui_luc=null;
  d.nhat_ky.push([dnNowS,'Bạn lưu nháp — chưa ai thấy']);}
 else{d.trang_thai=l.co_che==='can_thoa_thuan'?'cho_dong_y':'co_hieu_luc';d.co_che_luc_gui=l.co_che;d.nhan=k.nhan;d.gui_luc=dnNowS;
  d.quyet_dinh=(l.co_che==='ghi_nhan_quyet_dinh'||k.soNgay>7)?{can_ky:true,da_ky_luc:null}:null;
  d.nhat_ky.push([dnNowS,`Bạn gửi đơn — co_che_luc_gui = ${l.co_che} ⇒ ${d.trang_thai==='co_hieu_luc'?'có hiệu lực ngay':'chờ một người đồng ý'}`]);}
 if(!f.id)dsDon().unshift(d);
 dnView='ds';dnForm=null;dnMo=d.id;dnLoc='all';pane();
 toast(kieu==='nhap'?'Đã lưu nháp '+d.id
  :d.trang_thai==='co_hieu_luc'?`Đã gửi ${d.id} — có hiệu lực ngay${k.tiets.length?' · nhu cầu dạy thay đã sang M4.7':''} · M4.9 ghi Vắng có phép theo ngày`
  :`Đã gửi ${d.id} — chờ một người đồng ý (PHT điểm trường hoặc Hiệu trưởng)`);
}

function dnRutMo(id,chiNgay){
 const d=donId(id),con=d.ngay.filter(n=>!n.da_rut);
 const html=`<div class="info" style="margin-bottom:10px">Máy xét <b>từng ngày</b> theo hệ quả đã phát sinh — bạn chỉ chọn ngày muốn rút. <b>Tick hết = rút cả đơn.</b></div>
  <table style="font-size:12.5px"><tr><th></th><th>Ngày</th><th>Vùng</th><th>Hệ quả nếu rút</th></tr>
  ${con.map(n=>{const v=dnVung(d,n),sg=v===2&&dnSatGio(n),ts=dnTiet(role,n.ngay,n.buoi).filter(t=>t.dayThay!==undefined),ten=ts.length?(ts[0].dayThay||'người dạy thay'):'';
   return `<tr style="${v===3?'opacity:.6':''}"><td><input type="checkbox" class="dnck" data-ng="${n.ngay}" data-v="${v}" ${v===3?'disabled':(!chiNgay||chiNgay===n.ngay)?'checked':''}></td>
    <td><b>${dnThu(n.ngay)}</b></td><td>${VI[v]}</td>
    <td>${v===1?'<span class="sub">M4.7 xóa nhu cầu dạy thay, không báo ai · không cần lý do</span>'
     :v===2?`M4.7 <b>gỡ phân công ${ten}</b> (${ts.map(t=>'tiết '+t.tiet).join(', ')}) cùng giao dịch, báo đích danh qua M2.1${sg?' · <span class="st r">sát giờ</span> <span class="sub">(< '+DN_SATGIO+' giờ trước tiết đầu — không chặn, báo đỏ)</span>':''}
       <div style="margin-top:4px"><label style="font-size:12px"><input type="checkbox" class="dngiu" data-ng="${n.ngay}"> Giữ nguyên người dạy thay <span class="sub">— ${ten} vẫn dạy; bạn đi làm, ngày này <b>không</b> Vắng có phép</span></label></div>`
     :`<span style="color:var(--red)">Không rút được — ${dnVungLyDo(d,n)}.</span> <span class="sub">Chỉ người phụ trách chấm công <b>${DN_NVCC}</b> đính chính ở M4.9 (bắt buộc lý do, audit); tháng đã chốt thì đi đề nghị sửa sau chốt (M4.9 §6.3).</span>`}</td></tr>`}).join('')}
  </table>
  <div class="fld" style="margin-top:10px"><label>Lý do rút <span id="dnLyBat" class="sub">(bắt buộc khi có ngày 🟡)</span></label><textarea id="dnLyRut" rows="2" placeholder="VD: Việc gia đình xong sớm, đi dạy lại được"></textarea></div>
  <div id="dnRutLoi"></div>
  <div class="sub">🛑 Rút đơn <b>không bao giờ xóa tiết đã dạy</b> — tiết của người dạy thay giữ nguyên chủ. Không có «đơn điều chỉnh»: muốn đổi ngày thì rút rồi gửi đơn mới.</div>`;
 modal('Rút đơn '+d.id+' — '+loaiN(d.loai).ten,html,()=>dnRutXacNhan(id),'Rút đơn');
 if(!con.some(n=>dnVung(d,n)!==3)){$('#mok').disabled=true;
  $('#dnRutLoi').innerHTML=`<div class="alert" style="margin:8px 0">Mọi ngày còn lại của đơn đều ở vùng 🔴 — <b>không ngày nào rút được</b>. Nếu bạn thực tế đã đi làm, báo <b>${DN_NVCC}</b> (phụ trách chấm công) đính chính ở M4.9.</div>`}
 else $('#mok').disabled=false;
}
function dnRutXacNhan(id){
 const d=donId(id),ly=($('#dnLyRut').value||'').trim();
 const chon=[...document.querySelectorAll('.dnck')].filter(x=>x.checked&&!x.disabled).map(x=>x.dataset.ng);
 const giu=new Set([...document.querySelectorAll('.dngiu')].filter(x=>x.checked).map(x=>x.dataset.ng));
 if(!chon.length){$('#dnRutLoi').innerHTML='<div class="alert" style="margin:8px 0">Chưa chọn ngày nào để rút.</div>';return false}
 if(chon.some(s=>dnVung(d,d.ngay.find(n=>n.ngay===s))===2)&&!ly){$('#dnRutLoi').innerHTML='<div class="alert" style="margin:8px 0">Có ngày 🟡 (đã xếp người dạy thay) — <b>bắt buộc nhập lý do</b>: lý do đi kèm thông báo tới người bị hủy.</div>';$('#dnLyRut').focus();return false}
 const ok=[],bo=[];
 d.ngay.filter(n=>!n.da_rut).forEach(n=>{
  const v=dnVung(d,n),ts=dnTiet(role,n.ngay,n.buoi).filter(t=>t.dayThay!==undefined),ten=ts.length?(ts[0].dayThay||'người dạy thay'):'';
  if(v===3){bo.push([n.ngay,v,`Không rút — ${dnVungLyDo(d,n)}. Ngày này vẫn <b>có hiệu lực</b>. Đính chính: <b>${DN_NVCC}</b> — phụ trách chấm công, ở M4.9 (lý do + audit).`]);return}
  if(!chon.includes(n.ngay)){bo.push([n.ngay,v,'Giữ nguyên — bạn không chọn ngày này.']);return}
  const sg=v===2&&dnSatGio(n);
  Object.assign(n,{da_rut:true,rut_luc:dnNowS,rut_boi:'Bạn',ly_do_rut:ly||null,giu_nguoi_day_thay:v===2&&giu.has(n.ngay),sat_gio:sg&&!giu.has(n.ngay)});
  let hq;
  if(v===1)hq='M4.7 xóa nhu cầu dạy thay — không báo ai. M4.9 bỏ Vắng có phép.';
  else if(giu.has(n.ngay))hq=`Giữ nguyên <b>${ten}</b> dạy ${ts.map(t=>'tiết '+t.tiet).join(', ')}. Bạn đi làm — M4.9 <b>không</b> ghi Vắng có phép ngày này.`;
  else{ts.forEach(t=>delete DAY_THAY[role+'|'+t.ngay+'|'+t.tiet]);
   hq=`M4.7 gỡ phân công <b>${ten}</b> (${ts.map(t=>'tiết '+t.tiet).join(', ')}) cùng giao dịch · đã báo đích danh qua M2.1 kèm lý do «${ly}»${sg?' · <span class="st r">sát giờ</span> báo đỏ':''}. Tiết trả về bạn.`}
  ok.push([n.ngay,v,hq]);
 });
 if(d.ngay.every(n=>n.da_rut))d.trang_thai='da_rut';
 d.nhat_ky.push([dnNowS,`Bạn rút ${ok.length} ngày (${ok.map(x=>VI[x[1]]+' '+x[0].slice(0,5)).join(', ')})${bo.filter(x=>x[1]===3).length?' · '+bo.filter(x=>x[1]===3).length+' ngày 🔴 không rút':''}`]);
 dnMo=id;pane();
 $('#mh').textContent='Kết quả rút đơn '+d.id;
 $('#mb').innerHTML=`<div class="ok2" style="margin-bottom:10px"><b>✅ Đã rút — ${ok.length} ngày</b>
   <table style="font-size:12.5px;margin-top:6px">${ok.map(x=>`<tr><td style="white-space:nowrap">${VI[x[1]]} <b>${dnThu(x[0])}</b></td><td>${x[2]}</td></tr>`).join('')}</table></div>
  <div class="${bo.length?'warn':'sub'}"><b>⏭ Không rút — ${bo.length} ngày</b>
   ${bo.length?`<table style="font-size:12.5px;margin-top:6px">${bo.map(x=>`<tr><td style="white-space:nowrap">${VI[x[1]]} <b>${dnThu(x[0])}</b></td><td>${x[2]}</td></tr>`).join('')}</table>`:''}</div>
  <div class="sub" style="margin-top:8px">Trạng thái đơn: <b>${TT_TEN[d.trang_thai][0]}</b>${d.trang_thai==='da_rut'?' — mọi ngày đã rút':' — đơn chỉ sang «Đã rút» khi mọi ngày đã rút'}.</div>`;
 $('#mno').style.display='none';$('#mok').disabled=false;$('#mok').textContent='Đóng';
 $('#mok').onclick=()=>$('#mask').classList.remove('on');
 toast(`Đã rút ${ok.length} ngày · không rút ${bo.length} ngày`);
 return false;
}

/* ---------- nam khoi + dong cuoi muc ---------- */
function nvKhoi(){
 const p = P[role];
 if(!p.teach) return `<div class="card"><div class="cb nvft">
   Bạn <b>không có phân công giảng dạy</b> trong năm học này, nên năm khối nhiệm vụ giảng dạy
   — <i>tiết chưa ghi sổ đầu bài · bài tập về nhà chưa chấm · lượt giao bài quá hạn · ô điểm còn thiếu · buổi chưa điểm danh</i>
   — <b>ẩn hẳn</b>, đúng luật «mục tự ẩn theo dữ liệu» (§2.1). <b>Ẩn không phải vì chức danh bị chặn quyền</b>:
   không có dữ liệu nào để chiếu thì không dựng khối rỗng.
   Đây là chỗ khác với <b>NV-1</b> — <i>rỗng</i> là <b>có tư cách mà hết việc</b> (khối vẫn hiện, ghi «đã xong»),
   còn <i>ẩn</i> là <b>không có tư cách</b>.</div></div>`;
 const cn = nvCN();
 return nvA() + nvB() + nvC() + nvD() + nvE()
  + `<div class="card"><div class="cb nvft">
     <b>Kiêm nhiệm không sinh thêm khối nào ở đây.</b> Bí thư Đoàn, Tổ trưởng chuyên môn, Thư ký hội đồng… là <b>tư cách</b>,
     không phải <b>khâu nhập liệu giảng dạy</b> — tải công tác của các tư cách đó đọc ở mục <b>Phân công &amp; Lịch dạy</b>.
     Mục này chỉ gánh <b>năm khâu mà M5.9 theo dõi, cộng chấm công</b>.
     ${cn ? '' : '<br>Khối <b>Buổi lớp tôi chưa điểm danh</b> <b>ẩn</b> vì bạn <b>chưa được phân công lớp chủ nhiệm nào</b> trong năm học này — không có lớp thì không có buổi để điểm danh.'}
     <br>🛑 Giáo viên <b>không có ô quyền nào ở M5.9 Theo dõi hoạt động giảng dạy</b>: phần «của tôi» nằm đúng ở đây.
     Một menu giám sát mà người bị giám sát cũng vào được thì rất dễ trượt thành nơi so kè.</div></div>`;
}
