<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M6.4 Danh mục & Kiểm kê — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:14px 18px 44px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:220px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}
.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.65;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px;line-height:1.6}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1320px){.stage.open .listw{display:none}}

.grph{display:flex;align-items:center;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.grph .cnt{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
.grph .arw{font-size:10px;color:var(--ink3)}

.hdrow,.hrow{display:grid;gap:9px;padding:9px 13px;align-items:center;font-size:13px;grid-template-columns:1.25fr 1.5fr 1.75fr .8fr .75fr}
.hdrow{background:#fbfdff;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hrow.warnl{border-left-color:var(--amber)}
.stage.open .hdrow,.stage.open .hrow{grid-template-columns:1.25fr 1.7fr}
.stage.open .hcol{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
/* ★ KHÔNG neo chiều cao vào 100vh: trong khung nhúng hoặc màn hình thấp,
   calc(100vh - 215px) ra 0 và THÂN PANEL BỊ NÉN SẠCH — nội dung vẫn nằm
   trong DOM nhưng không ai nhìn thấy. Mốc cố định thì luôn đúng, và panel
   vẫn tự cuộn bên trong thay vì kéo dài trang ra vài nghìn pixel. */
.pbody{padding:13px 15px;max-height:760px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:180px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.ro2{background:#f8fafc}
tr.rorow{background:#f8fafc}
tr.okrow{background:var(--green-soft)}
tr.totrow{background:#f1f5f9;font-weight:600}
.cell{width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;text-align:right;font:inherit;font-size:12.5px}
.cell:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stp{flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--ink3)}
.stp.done{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.stp.now{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.stp.off{opacity:.45}
.spark{display:flex;gap:2px;align-items:flex-end;height:24px}
.spark i{width:6px;border-radius:1px;display:block}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

.lt{width:100%;border-collapse:collapse;font-size:11.5px}
.lt th{background:var(--bg);text-align:left;padding:5px 8px;font-size:10.5px;color:var(--ink3);border:1px solid var(--line)}
.lt td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.lt td.d{width:46px;font-weight:700;background:#fafbfc;text-align:center}
.blk{display:inline-block;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.blk.ck{background:#e0e7ff;color:#3730a3}
.blk.nk{background:var(--green-soft);color:var(--green)}
.blk.moi{background:#f1f5f9;color:var(--ink2);border:1px dashed var(--ink3)}
.blk.x{background:var(--red-soft);color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset}
.blk.s{background:var(--amber-soft);color:var(--amber);box-shadow:0 0 0 1.5px var(--amber) inset}
.lichpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:5px}
.lprow{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.lprow:last-child{border-bottom:none}
.lprow.on{background:#f8fafc}
.lpd{display:flex;align-items:center;gap:6px;width:96px;font-weight:600;cursor:pointer;flex:none}
.lprow:not(.on) .lpd{color:var(--ink3);font-weight:400}
.lpsep{color:var(--ink3)}
.lpt:disabled{background:#f8fafc;color:#cbd5e1}
.lpinfo{font-size:11px;margin-left:auto;text-align:right;line-height:1.4}
.lpinfo.x{color:var(--red);font-weight:700}
.lpinfo.s{color:var(--amber);font-weight:700}
.lpinfo.o{color:var(--green)}
.frow{display:flex;gap:9px;flex-wrap:wrap}
.frow>div{flex:1;min-width:130px}
.kchk{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12.5px}
tr.badrow{background:var(--red-soft)}
tr.totrow td{background:#f8fafc;font-weight:700}
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbx{overflow-x:auto}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:820px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px;line-height:1.65}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.ntg{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.ntg:hover{background:#1e293b;color:#fff}
.ntg.on{background:#fbbf24;color:#3b2a05;border-color:#fbbf24;font-weight:700}
.simw{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;margin-left:auto}
.simw select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:11.5px}
/* Ghi chu thiet ke: giai thich VI SAO, khong phai mot phan man hinh that. Mac dinh TAT. */
body.nn .dnote{display:none!important}
.dnote{background:#fffbeb;border:1px dashed #fbbf24;color:#78350f;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:11px}
.dnote b{color:#78350f}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(110px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:9px;flex-wrap:wrap}
.crumb a{color:var(--brand);cursor:pointer;font-weight:600}

/* --- rieng M6.1 --- */
.daybar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;flex-wrap:wrap;margin-bottom:10px}
.daybar .dt{font-weight:700;font-size:14px;min-width:190px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);flex:1;min-width:180px}
.pbar i{display:block}
.pbar i.a{background:var(--green)}
.pbar i.b{background:var(--amber)}
.pbar i.c{background:var(--line2)}
.pbar i.d{background:var(--red)}
.pleg{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;align-items:center}
.pleg s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.hsrow{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:13px}

.tgl{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}

.tgl button.on{background:var(--green);color:#fff}

.tgl button:disabled{opacity:.45;cursor:not-allowed}
.src{font-size:10.5px;color:var(--ink3);flex:0 0 auto;max-width:250px}
.aller{color:var(--red);font-size:12px;cursor:help}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px}
.stp.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ★ LỌC KHI MƯỢN — môn → khối → bài. Trả BA nhóm, vì chúng trả lời ba câu khác nhau:
   theoBai   — loại được gắn đúng bài / đúng môn-khối đang lọc
   theoMon   — loại phục vụ CẢ MÔN (không riêng bài)
   dungChung — loại dùng cho MỌI MÔN (máy chiếu, laptop) — hiện riêng, không trộn vào kết quả chính */
function locLoai(mon,khoi,bai){
 const coMon=l=>monCuaLoai(l);
 if(!mon) return {theoBai:LOAITB.slice(),theoMon:[],dungChung:[]};
 const hopBai=l=>baiCuaLoai(l).some(id=>{const b=baiById(id);
  return bai?id===bai:(b.mon===mon&&(!khoi||b.khoi.includes(+khoi)))});
 const theoBai=LOAITB.filter(hopBai);
 const theoMon=LOAITB.filter(l=>!theoBai.includes(l)&&l.monChung.includes(mon));
 const dungChung=LOAITB.filter(l=>coMon(l).includes('ALL'));
 return {theoBai,theoMon,dungChung};
}

}

/* ── DỮ LIỆU đã dời vào tệp nền chung app.10-nen-chung-csvc.js (YK01-Z1, 16/9/2026) ──
   SAN.A · SAN.B (cờ khongLapTB) · loại chamcong · LOAICC · PTCC · HEARTBEAT_CC · BAYGIO_CC ·
   10 tài sản TS-26-71…80 · vá đợt kiểm kê đang đếm · DIEMCC_CHIEU · diemCCPhong · diemCCTS · laCC.
   Lý do: M6.11 nay cần chính những dữ liệu đó (báo hỏng từ M4.9 · chặn lệnh điều chuyển).
   Tệp này chỉ giữ phần RIÊNG của M6.4: ba con số · tình trạng dẫn xuất · chặn thanh lý / đổi vị trí · vẽ. */

/* ══════════════ BA CON SỐ — PHẢI KHỚP M4.9 §4f.7b ══════════════
   N/M       = phòng ĐO ĐƯỢC đã có điểm chấm công
   chưa lắp  = phòng đo được CHƯA có điểm chấm công — TẠM THỜI, NẰM TRONG mẫu số M
   không đo  = địa điểm mang cờ khongLapTB — VĨNH VIỄN, 🛑 NGOÀI mẫu số
   «Đo được» = phòng DẠY HỌC (học thường · bộ môn) · ĐANG SỬ DỤNG · không mang cờ.
   Vì sao lọc «đang sử dụng»: phòng Đang sửa / Đóng cửa không có tiết (M4.6 đã được báo), nên không có gì
   để đo — để trong mẫu số thì tỉ lệ tụt vì một lý do chẳng liên quan gì tới việc lắp thiết bị.
   Mở lại phòng thì nó tự về mẫu số (dẫn xuất, không ai phải nhớ). Hội trường · thư viện · y tế · bếp · kho:
   không có tiết dạy — không thuộc bài toán chấm công tiết, cũng KHÔNG phải «không đo được». */
const LOAI_DAY=['hoc','bomon'];
function vaiTroCC(p){
 if(p.khongLapTB) return 'khongdo';
 if(!LOAI_DAY.includes(p.loai)) return 'ngoai';
 if(p.tt!=='dung') return 'tamngung';
 return diemCCPhong(p.id)?'co':'chua';
}
function baSoCC(dt){
 const ps=PHONG.filter(p=>dt==='ALL'||p.dt===dt);
 const o={n:0,m:0,chua:0,khongdo:0,tamngung:0};
 ps.forEach(p=>{const v=vaiTroCC(p);
  if(v==='co'){o.n++;o.m++} else if(v==='chua'){o.chua++;o.m++}
  else if(v==='khongdo') o.khongdo++; else if(v==='tamngung') o.tamngung++;});
 return o;
}
const nhanCheDoCC=o=>o.n===0?['Chỉ nguồn khai báo','n']:o.n>=o.m?['Thiết bị toàn phần','o']
 :['Đang triển khai ('+Math.round(o.n/o.m*100)+'%)','w'];

/* ══════════════ TÌNH TRẠNG THIẾT BỊ — khuôn M6.7 §2.6 ══════════════
   «Mất kết nối» là DẪN XUẤT từ lần kết nối cuối (không ai đánh dấu, không tắt được bằng sửa dòng).
   «Bảo trì» là NGƯỜI TUYÊN BỐ (tt='baotri' ở hồ sơ tài sản) — và nó ĐÈ lên suy luận của máy.
   «Hỏng» do phiếu báo hỏng ở M6.11 quyết định (quy tắc sẵn có của M6.4). */
const phutGiua=(a,b)=>{const f=s=>{const[d,h]=s.split(' ');return k2d(d).getTime()+(+h.slice(0,2)*60+ +h.slice(3,5))*60000};
 return Math.round((f(b)-f(a))/60000)};
function ttCC(t){
 const c=t.cc;
 if(t.tt==='thanhly') return {k:'thanhly',n:'Đã thanh lý',c:'n'};
 if(t.tt==='hong') return {k:'hong',n:'Hỏng — theo phiếu M6.11',c:'r',nguon:'phiếu báo hỏng'};
 if(t.tt==='baotri') return {k:'baotri',n:'Bảo trì',c:'w',nguon:'người tuyên bố'};
 if(!c.vanHanh) return {k:'chualap',n:'Chưa lắp đặt',c:'n',nguon:'chưa đưa vào vận hành'};
 if(!c.lanCuoi) return {k:'chuaketnoi',n:'Chưa kết nối lần nào',c:'w',nguon:'máy tự suy'};
 const tre=phutGiua(c.lanCuoi,BAYGIO_CC);
 if(tre>HEARTBEAT_CC) return {k:'offline',n:'Mất kết nối',c:'r',nguon:'máy tự suy — '+tre+' phút không có tín hiệu',tre};
 return {k:'hoatdong',n:'Hoạt động',c:'o',nguon:'máy tự suy'};
}

/* ══════════════ CHẶN THANH LÝ / ĐIỀU CHUYỂN ══════════════
   Thiết bị ĐANG là điểm chấm công thì không cho thanh lý, không cho đổi vị trí, không cho đề xuất điều chuyển.
   Không chặn thì: tài sản rời sổ / rời phòng, còn M4.9 vẫn nghĩ phòng đó có thiết bị → mọi tiết ở đó rơi vào
   «Thiết bị ngừng» — một hàng đợi đầy việc mà không ai hiểu vì sao, và không ai ở M4.9 biết cái máy đã đi đâu.
   Trả về null nếu không chặn; ngược lại trả về câu nêu CHÍNH XÁC còn thiếu gì + nơi xử lý. */
function chanCC(t,viec){
 if(!laCC(t)) return null;
 const d=diemCCTS(t.id); if(!d) return null;
 const ph=phongById(d.phong);

/* Loại địa điểm KHÔNG phải công trình xây dựng ⇒ không khai cấp, không vào bộ lọc «chưa khai». */
const CT_MIEN=['ngoaitroi'];
const capCTApDung=ph=>!CT_MIEN.includes(ph.loai);

/* ══════════════ ② LOẠI ĐỊA ĐIỂM MỚI — NHÀ CÔNG VỤ CHO GIÁO VIÊN ══════════════
   Thuộc NHÓM ĐỊA ĐIỂM, không phải phòng học:
     ⛔ không vào phép đếm phòng học nào (dòng 2 và 2b của báo cáo đếm riêng),
     ⛔ không vào DINHMUC nên khối 2 tab ⚙ không sinh dòng định mức cho nó,
     ⛔ không mang cờ chấm công, không vào mẫu số ba con số (không thuộc LOAI_DAY).
   Có Cấp công trình như mọi địa điểm khác — cổng hỏi «nhà công vụ kiên cố hay tạm». */
LOAIP.congvu='Nhà công vụ cho giáo viên';
/* ★ CT-3 ✅ anh Ninh chốt 19/9/2026: TÁCH — «Phòng học thường» và «Phòng bộ môn» là HAI dòng chỉ tiêu.
   Lý do tách là SUẤT ĐẦU TƯ KHÁC NHAU (một phòng bộ môn Lý–Hóa đắt hơn hẳn một phòng học thường),
   nên tách luôn cả cặp dòng nhu cầu đầu tư — giữ chung một ô kinh phí thì tách mất ý nghĩa.
   Tách ra thì lúc đẩy lên cổng CỘNG LẠI được; gộp rồi thì KHÔNG tách ra được (M10.8 — phiếu §E.2). */
const LOAI_HOC_THUONG=['hoc'];    /* dòng 2  */
const LOAI_BO_MON=['bomon'];      /* dòng 2b */
const LOAI_CONGVU='congvu';

/* ══════════════ ③ DÃY NHÀ — đơn vị để đặt cấp công trình HÀNG LOẠT ══════════════
   Trường khai một lượt theo dãy chứ không đi từng phòng: cả dãy được xây cùng một đợt,
   cùng một hồ sơ thiết kế, nên cùng một cấp. Đi từng phòng là 20 lần bấm cho một sự thật. */
const DAYNHA={
 'A1'   :{ten:'Dãy A — tầng 1 khu chính', dt:'A'},
 'A2'   :{ten:'Dãy A — tầng 2 phòng bộ môn', dt:'A'},
 'A3'   :{ten:'Dãy A — tầng 3 hội trường · thư viện', dt:'A'},
 'AP'   :{ten:'Khu phụ trợ — bếp bán trú', dt:'A'},
 'B1'   :{ten:'Dãy B — nhà chính', dt:'B'},
 'B-C4' :{ten:'Dãy B — nhà cấp 4 (dựng sau sáp nhập)', dt:'B'},

/* ══════════════ ④ VÁ DỮ LIỆU ĐỊA ĐIỂM ĐANG CÓ ══════════════
   capCT = null ⇒ «chưa khai» (không chặn gì cả, chỉ mang nhãn ⚠ và có bộ lọc tìm lại).
   Ca mẫu C7: điểm trường B có dãy cấp 4 ba phòng (B-101 · B-102 · B-104), hai phòng bộ môn
   CHƯA KHAI (B-201 · B-202), và hai phòng nhà công vụ nhờ mượn của Nhà văn hóa xã. */
const CT_SEED={
 'A-101':['kiencuo','A1'], 'A-102':['kiencuo','A1'], 'A-103':['kiencuo','A1'], 'A-104':['kiencuo','A1'],
 'A-201':['kiencuo','A2'], 'A-202':['kiencuo','A2'], 'A-203':['kiencuo','A2'], 'A-204':['kiencuo','A2'],
 'A-301':['kiencuo','A3'], 'A-302':['kiencuo','A3'],
 'A-B01':['bankc'  ,'AP'],
 'B-201':[null     ,'B1'],   /* ⚠ chưa khai — cột phụ của báo cáo */
 'B-202':[null     ,'B1'],   /* ⚠ chưa khai */
 'B-103':['bankc'  ,'B1'],
 'B-101':['cap4'   ,'B-C4'], 'B-102':['cap4','B-C4'], 'B-104':['cap4','B-C4']};
PHONG.forEach(p=>{

 p.capCT = s ? s[0] : null;
 p.day   = s ? s[1] : null;

});

/* ── ba địa điểm nhà công vụ (ca C7) ──
   B-NCV1 là nhà của trường; B-NCV2 · B-NCV3 mượn của Nhà văn hóa xã — đúng cảnh thật của
   trường vùng khó: không đủ nhà công vụ thì mượn phòng của xã cho giáo viên ở. */
PHONG.push(
 {id:'B-NCV1',ten:'Nhà công vụ số 1',dt:'B',tang:1,loai:LOAI_CONGVU,succhua:0,dt2:36,tb:[],tt:'dung',
  capCT:'bankc',day:'B-NCV',donViChoMuon:'',ghichu:'Hai phòng ở khép kín — giáo viên điểm trường B'},
 {id:'B-NCV2',ten:'Phòng ở mượn số 1',dt:'B',tang:1,loai:LOAI_CONGVU,succhua:0,dt2:24,tb:[],tt:'dung',
  capCT:'nhomuon',day:'B-NVH',donViChoMuon:'Nhà văn hóa xã Tân Lập',
  ghichu:'Mượn theo văn bản số 42/UBND-VH ngày 15/8/2026 của UBND xã Tân Lập'},
 {id:'B-NCV3',ten:'Phòng ở mượn số 2',dt:'B',tang:1,loai:LOAI_CONGVU,succhua:0,dt2:24,tb:[],tt:'dung',
  capCT:'nhomuon',day:'B-NVH',donViChoMuon:'Nhà văn hóa xã Tân Lập',
  ghichu:'Mượn theo văn bản số 42/UBND-VH ngày 15/8/2026 của UBND xã Tân Lập'});

/* ── tra cứu ── */
const capCTCua=ph=>ph&&ph.capCT?CAPCT[ph.capCT]:null;

/* ══════════════ ⑤ SỐ LỚP — DẪN XUẤT TỪ M10.1 ③ ══════════════
   Bản chiếu chỉ đọc. Con số lấy đúng demo M10.1 (40 lớp · 3 điểm trường: NTT 21 · VL 12 · TH 7).
   ⚠ Mã điểm trường của hai demo khác nhau (M6.4 dùng A·B·C, M10.1 dùng NTT·VL·TH) — cùng loại
     lệch đã ghi ở YK01-D3 với mã phòng; ở đây ánh xạ A↔NTT · B↔VL · C↔TH.
   ⛔ KHÔNG có ô nhập: số lớp là của M10.1, gõ lại ở đây thì hai menu sẽ kể hai con số. */
const SOLOP_M101={A:21,B:12,C:7};
const soLopCua=dt=>dt==='ALL'?Object.keys(SOLOP_M101).reduce((a,k)=>a+SOLOP_M101[k],0):(SOLOP_M101[dt]||0);

/* ══════════════ ⑥ SỔ NHU CẦU ĐẦU TƯ — TRƯỜNG «THẬT», NGƯỜI NHẬP ══════════════
   Yearly: khai lại mỗi năm học, vì nhu cầu đầu tư là con số của MỘT năm.
   nguon = nhãn xuất xứ của khối số này (khai tay · kế thừa từ năm nào). */
const NAMBC=['2026-2027','2025-2026'];
const oTrong=()=>({phNhuCau:0,phKinhPhi:0,bmNhuCau:0,bmKinhPhi:0,cvNhuCau:0,cvKinhPhi:0,gc:'',nguon:null});
const BCCT={};
NAMBC.forEach(n=>{BCCT[n]={};Object.keys(DT).forEach(d=>BCCT[n][d]=oTrong())});
Object.assign(BCCT['2026-2027'].B,{phNhuCau:3,phKinhPhi:1800,bmNhuCau:1,bmKinhPhi:700,cvNhuCau:1,cvKinhPhi:450,
 gc:'Ba phòng dãy cấp 4 đã nứt tường, dự toán theo suất đầu tư phòng học kiên cố (600 tr/phòng). '
   +'Phòng bộ môn Lý – Hóa cần 700 tr vì kèm hệ thống điện, nước và tủ hút.',
 nguon:'khai tay — Trịnh Văn Khánh · 05/12/2026'});
Object.assign(BCCT['2025-2026'].A,{phNhuCau:1,phKinhPhi:600,nguon:'khai tay — Lý Thanh Bình · 12/09/2025'});
Object.assign(BCCT['2025-2026'].B,{phNhuCau:2,phKinhPhi:1200,nguon:'khai tay — Trịnh Văn Khánh · 12/09/2025'});
const bcO=(nam,dt)=>BCCT[nam][dt]||(BCCT[nam][dt]=oTrong());
function bcGop(nam,dt){
 if(dt!=='ALL') return bcO(nam,dt);
 const o=oTrong(), ds=Object.keys(DT);
 ds.forEach(d=>{const x=bcO(nam,d);o.phNhuCau+=x.phNhuCau;o.phKinhPhi+=x.phKinhPhi;
  o.bmNhuCau+=x.bmNhuCau;o.bmKinhPhi+=x.bmKinhPhi;
  o.cvNhuCau+=x.cvNhuCau;o.cvKinhPhi+=x.cvKinhPhi});
 o.nguon='cộng từ '+ds.filter(d=>bcO(nam,d).nguon).length+' điểm trường';
 return o;
}

/* ══════════════ ⑦ ĐẾM THEO CẤP CÔNG TRÌNH ══════════════
   Trả về {tong, kiencuo, bankc, cap4, nhomuon, chuaKhai}.
   ★ tong = kiencuo + bankc + cap4 + nhomuon + chuaKhai — CHƯA KHAI LÀ MỘT CỘT RIÊNG,
     không dồn vào cột nào. Xem lý do ở lyDoChuaKhai(). */
function demCap(ds){
 const o={tong:ds.length,chuaKhai:0};
 CAPCT_KEY.forEach(k=>o[k]=0);
 ds.forEach(p=>{if(p.capCT) o[p.capCT]++; else o.chuaKhai++});
 return o;
}
function chiTieuBC(nam,dt){
 const ps=PHONG.filter(p=>dt==='ALL'||p.dt===dt);
 const hoc=ps.filter(p=>LOAI_HOC_THUONG.includes(p.loai));
 const bm =ps.filter(p=>LOAI_BO_MON.includes(p.loai));
 const cv =ps.filter(p=>p.loai===LOAI_CONGVU);
 const o=bcGop(nam,dt);
 return {hoc:demCap(hoc),bm:demCap(bm),cv:demCap(cv),soLop:soLopCua(dt),nhap:o,
  soHoc:hoc.length,soBM:bm.length,soCV:cv.length};
}

/* ══════════════ ⑨ Ô CẤP CÔNG TRÌNH TRONG DANH SÁCH PHÒNG (tab 1) ══════════════ */

  const pv=$('#hlPV').value, cap=$('#hlCap').value, don=$('#hlDon').value.trim();

 };
 modal('🏗 Đặt cấp công trình hàng loạt',

 mfns.bBC=()=>{

  if(vuot.length&&!gc){

 const ids=Object.keys(k.snap), dem=Object.keys(k.kq).length;
 const o={tong:ids.length,dem,chuaDem:ids.length-dem,thua:(k.thua||[]).length,
  giaSo:ids.reduce((a,id)=>a+k.snap[id].gia,0)};
 Object.keys(KQ_KK).forEach(x=>o[x]=0);
 Object.keys(k.kq).forEach(id=>o[k.kq[id].kq]++);
 o.lech=o.thieu+o.saiphong+o.hong+o.dathanhly+o.thua;
 return o;
}
/* ★ Dòng chênh lệch PHẢI có giải trình trước khi ký — Đ.40 k.3 buộc xác định nguyên nhân.
   «Thiếu» mà không nêu nguyên nhân là ghi nhận một mất mát không ai chịu trách nhiệm. */
function kkThieuGiaiTrinh(k){
 return Object.keys(k.kq).filter(id=>k.kq[id].kq!=='khop'&&!(k.kq[id].gc||'').trim());
}
/* ★ MÁY GIẢI THÍCH TRƯỚC KHI NGƯỜI VIẾT «MẤT».
   Một tài sản đếm không thấy có thể đã ĐIỀU CHUYỂN đi sau mốc kiểm kê — hệ thống biết
   điều đó, nên phải nói ra thay vì để người ta ghi vào biên bản là thất thoát. */
function goiYNguyenNhan(k,tsId){
 const t=tsById(tsId); if(!t) return null;
 const dc=DIEUCHUYEN.filter(d=>d.ts===tsId&&d.tt==='hoantat'&&d.ngayXong>k.moc)[0];
 /* đọc 🔗 lệnh điều chuyển của M6.11 — kiểm kê KHÔNG ghi gì sang đó */
 if(dc) return 'Đã <b>điều chuyển sang '+DT[dc.dich]+'</b> ngày '+k2s(dc.ngayXong)
  +' — <b>sau mốc kiểm kê</b> '+k2s(k.moc)+' <i>(lệnh '+dc.id+' · 🔗 M6.11)</i>. Không phải mất mát.';
 const dcCho=dcDangChay(tsId);
 if(dcCho) return 'Đang có <b>lệnh điều chuyển '+dcCho.id+'</b> <i>(🔗 M6.11)</i> sang '+DT[dcCho.dich]
  +' ở trạng thái «'+TT_DC[dcCho.tt][0]+'» — có thể tài sản đã được chuyển đi trước khi hoàn tất thủ tục.';
 if(t.tt==='thanhly') return 'Sổ ghi <b>đã thanh lý</b> — nếu vẫn còn trong sổ tài sản thì phải <b>ghi giảm</b>.';
 if(!t.phong) return 'Tài sản <b>di động, không cố định ở phòng nào</b> — kiểm tra danh sách mượn ở <b>M6.5</b> trước khi kết luận thiếu.';
 return null;
}

function gomDT(ds, layDT, veDong, colspan, phang){

    +' <span style="font-weight:400;color:var(--ink3)">· '+n+' dòng</span></td></tr>'}
  h+=veDong(x);
 });
 return h;
}

  +(ls.length?'<div class="warn"><b>'+ls.length+' loại</b> đang gắn bài này: '+ls.map(l=>esc(l.ten)).join(' · ')
   +'. Gắn <b>giữ nguyên</b> — chỉ bài rời khỏi bộ lọc mượn ở M6.5; hiện lại là trở về như cũ.</div>':'')
  +'<label class="lbl">Lý do ẩn <span style="color:var(--red)">*</span></label><input class="fldi" id="lyAn">',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="AnBai">Ẩn bài</button>');
}


/* ══════════════ RENDER ══════════════ */
function render(){
 rolebar(); header(); tabs();
 const c=$('#content');
 let h=daiDeepLink();
 if(ST.tab==='phong') h+=vePhong();
 else if(ST.tab==='taisan') h+=veTaiSan();
 else if(ST.tab==='kiemke') h+=veKiemKe();
 else if(ST.tab==='dotms') h+=veMuaSam();
 else if(ST.tab==='baocaoct') h+=veBaoCaoCT();   /* CSDL-1F — tab 4b */
 else h+=veCauHinh();
 c.innerHTML=h;
 if(ST.tab==='cauhinh') gCfg();
 $('#btnNote').classList.toggle('on',!document.body.classList.contains('nn'));
 $('#btnNote').textContent='💡 Ghi chú thiết kế: '+(document.body.classList.contains('nn')?'TẮT':'BẬT');
}
function doiTab(t){ST.tab=t;ST.curP=null;ST.curTS=null;ST.curKK=null;ST.curDot=null;ST.sub='dem'}
function gCfg(){
 const g=(id,f)=>{const el=$(id); if(el) el.onchange=()=>{f(el.value);render();
  toast('⚙️ Đã đổi tham số — số liệu liên quan <b>tính lại ngay</b>.')}};
 g('#cfNguong',v=>CFG.nguongHT=+v); g('#cfBH',v=>CFG.canhBaoBH=+v); g('#cfNguongKy',v=>CFG.nguongKy=+v);
 const lm=$('#locMonCH'); if(lm) lm.onchange=()=>{ST.locMonCH=lm.value;render()};
}
function xuat(){
 modal('📤 Xuất dữ liệu — bắt buộc chọn mục đích',
  '<div class="warn">Dữ liệu tài sản là <b>số liệu kế toán</b>. Mọi lượt xuất <b>ghi audit</b> và '
  +'<b>bắt buộc chọn mục đích</b>.</div>'
  +'<label class="lbl">Nội dung xuất</label><select class="fldi"><option>Danh mục phòng</option>'
  +'<option>Danh mục tài sản theo điểm trường</option><option>Bảng kiểm kê một đợt</option>'
  +'<option>Bảng chênh lệch kiểm kê</option><option>Đợt mua sắm — danh sách mục và ý kiến ngân sách</option></select>'
  +'<div style="font-size:11.5px;color:var(--ink3);margin-top:4px">Lịch sử điều chuyển và sổ sửa chữa xuất ở <b>M6.11</b>.</div>'
  +'<label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>'
  +'<select class="fldi"><option>Đối chiếu với sổ tài sản cố định</option><option>Báo cáo cơ quan quản lý cấp trên</option>'
  +'<option>Báo cáo nội bộ nhà trường</option><option>Lưu trữ hồ sơ năm</option></select>'
  +'<label class="lbl">Định dạng</label><select class="fldi"><option>Excel (.xlsx)</option><option>PDF</option></select>',
  '<button class="btn" data-mb="close">Hủy</button><button class="btn p" data-mb="close">Xuất và ghi audit</button>');
}

/* ══════════════ SỰ KIỆN ══════════════ */
mfns.bclose=()=>closeM();
document.addEventListener('click',e=>{
 const t=e.target;
 const mb=t.closest('[data-mb]'); if(mb){const f=mfns['b'+mb.dataset.mb]; f?f():closeM(); return}
 if(t===$('#mask')){closeM();return}
 const dl=t.closest('[data-dl]'); if(dl){moMenu(dl.dataset.dl,dl.dataset.dlq);return}
 const rb=t.closest('.rb'); if(rb){role=rb.dataset.r;doiTab(ST.tab);if(R().sc!=='School'&&R().dt)ST.dt=R().dt;render();return}
 if(t.id==='btnNote'){document.body.classList.toggle('nn');render();return}
 const tb=t.closest('#tabs [data-t]'); if(tb){doiTab(tb.dataset.t);render();return}
 const sb=t.closest('[data-sub]'); if(sb){ST.sub=sb.dataset.sub;render();return}
 const cp=t.closest('[data-chp]'); if(cp){ST.chipP=cp.dataset.chp;render();return}
 const ct=t.closest('[data-chts]'); if(ct){ST.chipTS=ct.dataset.chts;render();return}
 const ck=t.closest('[data-chkk]'); if(ck){ST.chipKK=ck.dataset.chkk;render();return}
 const lk=t.closest('[data-lokk]'); if(lk){ST.lockk=lk.dataset.lokk;render();return}
 const ts=t.closest('[data-ts]'); if(ts){ST.tab='taisan';ST.curTS=ts.dataset.ts;render();return}
 const tl=t.closest('[data-tsl]'); if(tl){ST.tab='taisan';ST.curTS=tl.dataset.tsl;render();return}
 const kk=t.closest('[data-kk]'); if(kk){ST.curKK=kk.dataset.kk;ST.sub='dem';render();return}
 const bk=t.closest('[data-back]'); if(bk){const v=bk.dataset.back;
  if(v==='ts')ST.curTS=null; else if(v==='phong')ST.curP=null; else if(v==='ms')ST.curDot=null; else ST.curKK=null; render();return}
 /* tab 4 · Đợt mua sắm */
 const gm=t.closest('[data-gom]'); if(gm){closeM();gomVaoDot(gm.dataset.gom);return}
 const bx=t.closest('[data-botkhoi]'); if(bx){botKhoiDot(bx.dataset.botkhoi);return}
 const xd=t.closest('[data-xldot]'); if(xd){ST.tab='dotms';ST.curDot=xd.dataset.xldot;render();return}
 const gn=t.closest('[data-guins]'); if(gn){guiNganSach(gn.dataset.guins);return}
 const nsb=t.closest('[data-ns]'); if(nsb){ghiNganSach(nsb.dataset.ns);return}
 const kyb=t.closest('[data-kydot]'); if(kyb){kyDot(kyb.dataset.kydot);return}
 const tdb=t.closest('[data-tcdot]'); if(tdb){tcDot(tdb.dataset.tcdot);return}
 const ycb=t.closest('[data-yc]'); if(ycb){chiTietDX(ycb.dataset.yc);return}
 if(t.id==='taoDot'){const le=dxChoGom(); if(le.length) gomVaoDot(le[0].id); return}
 const sp=t.closest('[data-suaphong]'); if(sp){suaPhong(sp.dataset.suaphong);return}
 const pg=t.closest('[data-phong]'); if(pg){ST.tab='phong';ST.curP=pg.dataset.phong;render();return}
 /* YK01-D — nút điều chuyển bị chặn vì thiết bị đang là điểm chấm công: bấm thì NÓI RA vì sao + nơi gỡ */
 const cb=t.closest('[data-cc]'); if(cb){const x=chanCC(tsById(cb.dataset.cc),'Đề xuất điều chuyển');
  if(x) modal('⛔ Đề xuất điều chuyển bị chặn','<div class="danger">'+x.html+'</div>','<button class="btn p" data-mb="close">Đã hiểu</button>');return}
 /* CSDL-1F — tab 4b Báo cáo thực trạng công trình */
 if(t.id==='hangLoat'){datHangLoat();return}
 if(t.id==='bcNhap'){nhapBC();return}
 if(t.id==='bcKeThua'){keThuaBC();return}
 if(t.id==='xuatBC'){xuat();return}
 const dmc=t.closest('[data-dm]'); if(dmc){suaDM(dmc.dataset.dm);return}
 /* tab 5 · khối 1b · 1c — thiết bị theo môn & bài (DOT1-P2B) */
 const slt=t.closest('[data-sualtb]'); if(slt){ST.fl=null;suaLoai(slt.dataset.sualtb);return}
 const chb=t.closest('[data-chbai]'); if(chb){ST.chipBai=chb.dataset.chbai;render();return}
 const sbi=t.closest('[data-suabai]'); if(sbi){ST.fb=null;formBai(sbi.dataset.suabai);return}
 const abi=t.closest('[data-anbai]'); if(abi){anBai(abi.dataset.anbai);return}
 if(t.id==='themBaiR'){ST.fb=null;formBai(null);return}
 if(t.id==='capNhatDMBo'){
  toast('↗ Deep-link <b>/m10.8?nhom=dm_tbtt&amp;action=keo&amp;return=M6.4</b> — kéo nhóm «Danh mục thiết bị dạy học tối thiểu». '
   +'Chưa khai báo kết nối thì M10.8 nói rõ <i>«cần kết nối CSDL ngành trước»</i>; danh mục đang là <b>'+esc(DM_BO_NGUON.trangThai)+'</b>.');return}
 const dm=t.closest('[data-dem]'); if(dm){ghiDem(dm.dataset.dem);return}
 if(t.id==='suaTS'){suaTS();return}
 if(t.id==='taoKK'){taoKK();return}
 if(t.id==='themThua'){themThua();return}
 if(t.id==='kyKK'){kyKK();return}
 if(t.id==='nhapTS'){nhapTS();return}
 if(t.id==='ktDoiSoat'){const k=kkById(ST.curKK);k.tt='doisoat';
  toast('➡️ Đã chuyển sang <b>Kế toán đối chiếu</b>. Kế toán sẽ thấy ở badge trên tab.');render();return}
 if(t.id==='ktXong'){const k=kkById(ST.curKK), yk=$('#ykkt')?$('#ykkt').value.trim():'';
  if(!yk){toast('⚠️ <b>Bắt buộc nêu ý kiến đối chiếu</b> — ý kiến này đi vào biên bản kiểm kê.');return}
  k.doisoat={boi:R().n,luc:k2s(HOMNAY),yk};k.tt='choky';
  toast('✅ Đã ghi ý kiến đối chiếu và <b>trình Hiệu trưởng ký</b>.');render();return}
 if(t.id==='themPhong'){themPhong();return}
 if(t.id==='themTS'){themTSMoi();return}
 if(t.id==='themTB'){themTB();return}
 if(t.id==='layCH'){layCauHinh();return}
 if(t.id==='themDM'){toast('➕ Thêm dòng định mức — mở một loại phòng ở bảng trên rồi thêm dòng trong đó.');return}
 if(['xuatP','xuatTS','xuatKK'].includes(t.id)){xuat();return}
});
$('#hdt').onchange=e=>{ST.dt=e.target.value;render()};
document.addEventListener('change',e=>{if(e.target.id==='bcNam'){ST.namBC=e.target.value;render()}});
document.addEventListener('input',e=>{
 const id=e.target.id, map={qp:'q',qts:'qts',qkk:'qkk'};
 if(map[id]){ST[map[id]]=e.target.value;const p=e.target.selectionStart;render();
  const el=$('#'+id); if(el){el.focus();el.setSelectionRange(p,p)}}
});

/* ── nhận deep-link từ M6.11 (hoặc menu khác): ?tab=…&ctx=…&return=…&vai=…&dt=… ── */
(function nhanDeepLink(){
 const v=THAM.get('vai'); if(v&&ROLES[v]) role=v;
 const d=THAM.get('dt'); if(d&&(d==='ALL'||DT[d])) ST.dt=d;
 if(R().sc!=='School'&&R().dt) ST.dt=R().dt;
 const tab=THAM.get('tab'), ctx=THAM.get('ctx'), act=THAM.get('action');
 if(['phong','taisan','kiemke','dotms','baocaoct','cauhinh'].includes(tab)) ST.tab=tab;
 if(ctx&&tsById(ctx)){ST.tab='taisan';ST.curTS=ctx}
 else if(ctx&&phongById(ctx)){ST.tab='phong';ST.curP=ctx}
 else if(ctx&&dotById(ctx)){ST.tab='dotms';ST.curDot=ctx}
 render();
 /* từ M6.5: ?tab=dotms&ctx=YC-xx&action=gom → mở sẵn hộp «Đưa vào đợt»; không action thì mở chi tiết đề xuất */
 /* từ M6.5 (bộ lọc môn/bài): ?tab=cauhinh&ctx=LTB-xx → mở sẵn hộp sửa loại · ctx=BB-xx → lọc môn của bài */
 if(ctx&&ltbById(ctx)&&can('cauhinh')){ST.tab='cauhinh';render();ST.fl=null;suaLoai(ctx);return}
 if(ctx&&baiById(ctx)&&can('cauhinh')){ST.tab='cauhinh';ST.locMonCH=baiById(ctx).mon;
  ST.chipBai=baiById(ctx).an?'an':'all';render();return}
 const dx=ctx&&DEXUAT_MS.find(y=>y.id===ctx);
 if(dx){ST.tab='dotms'; if(R().sc==='School') ST.dt=dx.dt; render();
  if(act==='gom'&&toiGomDuoc(dx)) gomVaoDot(ctx); else chiTietDX(ctx)}
})();
</script>
