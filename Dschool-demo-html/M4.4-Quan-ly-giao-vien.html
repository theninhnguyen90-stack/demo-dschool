<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4.4 Quản lý giáo viên — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink2);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--ink3)}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:212px;flex:0 0 212px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .nb{margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;line-height:15px}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:15px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.act{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:12px 0 0;flex-wrap:wrap}
.tab1{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.r{background:var(--red);color:#fff}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:12px 0 0;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}

.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 0}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:13px;background:#fff;min-width:230px}
.fs{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.sum{display:flex;gap:13px;font-size:12px;color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.sum b{color:var(--ink)}

.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.alert{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600}
.alert .sp{flex:1;font-weight:400}
.alert .sp b{font-weight:700}
.alert.w{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e}
.alert.r{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b}
.alert.g{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46}
.alert.b{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af}

.stage{display:flex;gap:13px;align-items:flex-start}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1180px){.stage.open .listw{display:none}.stage.open .panel{flex:1}}

.hrow{display:grid;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px;
 grid-template-columns:1.7fr 1.15fr 2fr 1.15fr}
.stage.open .hrow{grid-template-columns:1.7fr 1.6fr}
.stage.open .hcol{display:none}
.stage.open .hcol.keep{display:block}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.bad{border-left-color:var(--red);background:#fffafa}
.hdrow{display:grid;gap:9px;padding:8px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
 grid-template-columns:1.7fr 1.15fr 2fr 1.15fr}
.stage.open .hdrow{grid-template-columns:1.7fr 1.6fr}
.stage.open .hdrow div{display:none}
.stage.open .hdrow div.kc{display:block}
.who2{display:flex;gap:9px;align-items:center;min-width:0}
.ava2{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.ava2.non{background:#fee2e2;color:#991b1b}
.who2 .i{min-width:0}
.who2 .i b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 .i span{font-size:11px;color:var(--ink3)}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ava3{width:50px;height:50px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-size:17px;font-weight:700;flex:0 0 50px}
.ph .n h2{font-size:16px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.pbody{padding:14px 15px;max-height:calc(100vh - 230px);overflow-y:auto}

.card{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.card.bad{border-color:#fecaca}
.ch{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;flex-wrap:wrap}
.ch .sp{flex:1}
.cb{padding:4px 0}
.f{display:grid;grid-template-columns:185px 1fr;gap:11px;align-items:start;padding:7px 12px;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cact{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap;align-items:center}
.tg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tg.a{background:#e0e7ff;color:#3730a3}
.tg.b{background:#fef3c7;color:#92400e}
.tg.c{background:var(--bg);color:var(--ink2)}
.tg.g{background:var(--green-soft);color:var(--green)}
.tg.r{background:var(--red-soft);color:var(--red)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warnrow{background:var(--amber-soft)}
tr.badrow{background:var(--red-soft)}
tr.grp td{background:#f8fafc;font-weight:700;font-size:11.5px}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.okbox{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:760px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fldi{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-top:4px}
.lbl{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:11px}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--ink3)}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink2)}

/* --- rieng M4.4 --- */
.mon{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
 background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3}
.mon.kn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.mon .dm{font-size:9px;opacity:.75}
.khoi{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.mtx{overflow-x:auto}
.mtx table{font-size:12px;min-width:760px}
.mtx th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:96px;padding:6px 3px;text-align:left;vertical-align:bottom;font-size:11px;text-transform:none;letter-spacing:0}
.mtx th.tog{background:#eef2ff;color:#3730a3}
.mtx td.c{text-align:center;cursor:pointer;padding:5px;user-select:none}
.mtx td.c:hover{background:var(--brand-soft)}
.mtx td.c.g0{color:#e2e8f0}
.mtx td.c.g1{color:var(--brand);font-weight:800}
.mtx td.c.g2{color:var(--amber);font-weight:800}
.mtx td.c.lock{background:#f8fafc;color:#e2e8f0;cursor:not-allowed}
.mtx td.nm{white-space:nowrap;font-weight:600}
.mtx tr.zero td.nm{color:var(--red)}
.kbox{display:flex;gap:5px;flex-wrap:wrap}
.kb{font-size:11px;font-weight:700;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;background:#fff;color:var(--ink2)}
.kb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.kb:disabled{opacity:.45;cursor:not-allowed}
.dmv{font-variant-numeric:tabular-nums;font-weight:700}
.dmv.ex{color:var(--amber)}
.numi{width:64px;text-align:right;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-variant-numeric:tabular-nums}
.numi:disabled{background:#f1f5f9;color:var(--ink2)}
.src{font-size:10.5px;color:var(--ink3)}
</style>
</head>

  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>

</div>

<script>
const $=s=>document.querySelector(s);
const HOMNAY=new Date(2026,7,27);
const p2=n=>String(n).padStart(2,'0');
const d2s=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
const kd=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4000)}
function closeModal(){$('#mask').classList.remove('on')}
function modal(t,b,f){$('#mh').innerHTML=t;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#mask').classList.add('on')}

const NAV=[
 ['','🏠 Trung tâm điều hành',[['M0.1','Bảng điều khiển'],['M0.2','Việc cần làm','4'],['M0.3','Thông báo'],['M0.4','Trang cá nhân']]],
 ['hs','👥 Học sinh',[['M1.7','Lớp học'],['M1.1','Hồ sơ học sinh']]],
 ['lh','📚 Lớp học hàng ngày',[['M2.9','Không gian lớp học'],['M2.1','Sổ đầu bài']]],
 ['ns','👨‍🏫 Nhân sự',[['M4.1','Hồ sơ nhân sự'],['M4.2','Biến động nhân sự'],['M4.3','Chức danh & Điểm công tác'],
   ['M4.4','Quản lý giáo viên','4'],['M4.5','Phân công giảng dạy'],['M4.6','Thời khóa biểu'],
   ['M4.7','Lịch giảng dạy & Dạy thay'],['M4.8','Nghỉ phép'],['M4.9','Chấm công nhân sự'],
   ['M4.10','Khen thưởng & Kỷ luật NS'],['M4.11','Chứng thư số']]],
 ['qt','⚙️ Quản trị',[['M10.2','Cơ cấu tổ chức'],['M10.4','Chức danh & Phân quyền'],['M10.7','Nhật ký hệ thống'],['M10.8','Đồng bộ CSDL ngành']]],
];

/* ================= VAI TRÒ =================
 viec: mon · khoi · dinhmuc · template · duyetNgoaiLe · kyBanHanh · import · xuat */
const ROLE={
 FULL:{n:'Đủ quyền — rà luồng nghiệp vụ',menu:'all',ava:'DQ',pv:'school',
   viec:['mon','dinhmuc','capTay','template','duyetNgoaiLe','kyBanHanh','import','xuat'],
   mchu:['M4.3','M4.5','M4.1','M10.2','M4.2','M4.9','M10.4']},
 PCM:{n:'Nguyễn Thị Lan — Phó HT Chuyên môn',menu:'all',ava:'NL',pv:'school',
   viec:['mon','dinhmuc','capTay','template','import','xuat'],mchu:['M4.3','M4.5','M4.1','M10.2','M4.9']},
 TTCM:{n:'Lê Minh Tuấn — Tổ trưởng Tổ Toán — Tin',menu:['','lh','ns','hs'],ava:'LT',pv:'to',to:'T1',
   viec:['mon','xuat'],dexuat:1,mchu:['M4.5','M10.2']},

   const c=capLop(l);s[c]=(s[c]||0)+(TIET[c][m]||0)}));

  ks.sort((a,b)=>s[b]-s[a]);
  const tie=ks.length>1&&s[ks[0]]===s[ks[1]];
  return {cap:ks[0],src:'Suy từ phân công — '+ks.map(k=>k+' '+s[k]+' tiết').join(' · '),tie,chi:s};

 return {cap:null,src:'Chưa có phân công ở M4.5 — phải khai báo tay',tie:0};
}

    <div class="ro">Phải <b>miễn nhiệm Tổ trưởng</b> ở M4.3 trước, rồi mới gỡ môn.</div>`,
   `<button class="btn" data-x="close">Đóng</button>
    <span style="margin-right:auto"></span>${dlink('M4.3','Miễn nhiệm Tổ trưởng tại M4.3','tt')}`);
  return;
 }
 if(dd.length&&!force){
  modal('⚠ Người này đang được phân công dạy môn đó',
   `<div class="warn"><b>${p.n}</b> đang dạy <b>${m}</b> ở <b>${dd.length} lớp</b>: ${dd.join(', ')}.<br><br>
     Gỡ môn thì các phân công đó <b>vẫn còn</b> nhưng người dạy không còn được phép dạy môn ấy —
     M4.5 sẽ hiện cảnh báo trên từng lớp.</div>
    <div class="ro">Cùng nguyên tắc với M4.3 §6.2.3: <b>cảnh báo có xác nhận</b>, không chặn cứng.
     Chặn cứng sẽ deadlock vì M4.5 có thể cần chỉ định người thay trước.</div>`,
   `<button class="btn" data-x="close">Hủy — sang M4.5 gỡ phân công trước</button>
    <button class="btn d" data-x="go-mon" data-gv="${id}" data-mon="${m}" data-force="1">⚠ Vẫn gỡ</button>`);
  return;
 }
 delete p.mon[m];delete p.khoi[m];closeModal();render();
 toast(`Đã gỡ môn <b>${m}</b> khỏi ${p.n}${dd.length?` · ${dd.length} phân công ở M4.5 nay mang cảnh báo`:''}${
   toCua(p).includes(t)?'':` · rời ${TO[t]}`}`);
}
function moThemMon(id){
 const p=ns(id),con=MONS.filter(m=>!p.mon[m]);
 modal(`Gán môn được phép dạy — ${p.n}`,
  `<label class="lbl">Môn</label><select class="fldi" id="nmMon">${
    con.map(m=>`<option>${m}</option>`).join('')}</select>
   <label class="lbl">Mức độ</label><select class="fldi" id="nmMuc">
     <option value="1">Chuyên môn chính</option><option value="2">Dạy kiêm nhiệm</option></select>
   <label class="lbl">Căn cứ</label><select class="fldi" id="nmCC">
     <option>Bằng cấp chuyên ngành</option><option>Chứng chỉ bồi dưỡng</option><option>Quyết định phân công của trường</option></select>
   <div class="info" style="margin-top:11px">Chỉ hiện môn <b>thuộc danh mục môn áp dụng</b> của cấp học trường đang có — nguồn M10.2.
     Gán xong, người này <b>tự động thuộc tổ phụ trách môn đó</b>.</div>`,
  `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-mon" data-gv="${id}">Gán môn</button>`);
}
function moCapTay(id){
 const p=NS.find(z=>z.id===id),c=capGV(p);
 modal(`Cấp học tính định mức — ${p.n}`,
  `<div class="info">Trường liên cấp có <b>ba khung chuẩn cùng lúc</b> (Tiểu học 23 · THCS 19 · THPT 17).
    Cấp học của một giáo viên quyết định khung chuẩn áp cho họ — và qua đó quyết định <b>thù lao vượt giờ</b> ở M4.9.</div>
   <div class="ro">Đang xác định theo: <b>${c.src}</b>${c.tie?' — <b style="color:var(--red)">hai cấp bằng số tiết, không có quy tắc chọn</b>':''}</div>
   <div class="ro">Bước <b>suy từ khối phụ trách</b> đã bỏ 28/8/2026: khối lớp phụ trách nay thuộc <b>M4.5</b>,
    mà M4.4 là <b>điều kiện cần</b> của M4.5 nên không được đọc ngược. Thay bằng khai báo tay ở đây.</div>
   <label class="lbl">Cấp học tính định mức</label>
   <select class="fldi" id="ctNew">
     <option value="">— Để hệ thống suy từ phân công —</option>
     ${Object.keys(CFG.chuan).map(k=>`<option ${p.capTay===k?'selected':''}>${k}</option>`).join('')}</select>`,
  `<button class="btn" data-x="close">Hủy</button>
   <button class="btn p" data-x="ok-cap-tay" data-gv="${id}">Lưu</button>`);
}
function moGhiDe(id){
 const p=ns(id),d=dinhMuc(p);
 modal(`Ghi đè định mức — ${p.n}`,
  `<div class="info">Định mức đề xuất <b>${d.dx} tiết/tuần</b> = khung chuẩn ${d.chuan}
    ${d.giam.length?'− '+d.giam.map(x=>x[0]+' '+x[1]).join(' − '):''}.
    Máy đề xuất, người quyết — nhưng ghi đè phải nêu lý do và cần Hiệu trưởng duyệt.</div>
   <label class="lbl">Định mức áp dụng <span style="color:var(--red)">*</span></label>
   <input class="fldi" id="gdV" type="number" value="${d.ad}">
   <label class="lbl">Lý do ngoại lệ <span style="color:var(--red)">*</span></label>
   <textarea class="fldi" id="gdL" rows="3" placeholder="Nêu rõ căn cứ — đây là con số quyết định thù lao vượt giờ…"></textarea>`,
  `<button class="btn" data-x="close">Hủy</button>
   ${d.ex?`<button class="btn" data-x="bo-ghide" data-gv="${id}">↩ Bỏ ngoại lệ, dùng template</button>`:''}
   <button class="btn p" data-x="ok-ghide" data-gv="${id}">Lưu ngoại lệ</button>`);
}

/* ================= SỰ KIỆN ================= */
document.addEventListener('click',e=>{
 if(e.target.matches('input,select,textarea'))return;
 const t=e.target.closest('[data-r],[data-tab],[data-x],[data-gv],[data-cell]');
 if(!t)return;
 const x=t.dataset.x;

 if(t.dataset.r){role=t.dataset.r;cur=null;q='';fTo='';fMon='';fTT='';mtx=0;
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.r===role));
  $('#ava').textContent=R().ava;render();return}
 if(t.dataset.tab){tab=t.dataset.tab;cur=null;render();return}
 if(x==='close'||x==='close-panel'){if(x==='close')closeModal();else{cur=null;render()}return}
 if(x==='dl'){closeModal();toast(`↗ Mở <b>${t.dataset.m}</b>${t.dataset.c?` · ngữ cảnh <code>${t.dataset.c}</code>`:''} · có nút quay lại M4.4`);return}
 if(x==='loc'){tab='mon';fTT=t.dataset.v;mtx=0;cur=null;render();toast('Đã đặt bộ lọc — không mở màn hình khác');return}
 if(x==='tog-mtx'){mtx=!mtx;cur=null;render();return}

 /* --- ma trận: đổi mức độ --- */
 if(t.dataset.cell){
  const [id,m]=t.dataset.cell.split('|'),p=ns(+id),v=p.mon[m]||0;
  if(v===0){p.mon[m]=1;p.khoi[m]=[];render();toast(`✓ ${p.n} — <b>${m}</b> chuyên môn chính · tự thuộc ${TO[MON[m].to]}`)}
  else if(v===1){p.mon[m]=2;render();toast(`${p.n} — <b>${m}</b> chuyển sang <b>dạy kiêm nhiệm</b>`)}
  else thuGoMon(+id,m);
  return}

 if(x==='them-mon'){moThemMon(+t.dataset.gv);return}
 if(x==='ok-mon'){
  const p=ns(+t.dataset.gv),m=$('#nmMon').value,mu=+$('#nmMuc').value;
  p.mon[m]=mu;p.khoi[m]=[];closeModal();render();
  toast(`✓ Gán <b>${m}</b> cho ${p.n} · tự thuộc ${TO[MON[m].to]} · nay xuất hiện trong ô chọn ứng viên ở M4.5`);return}
 if(x==='go-mon'){thuGoMon(+t.dataset.gv,t.dataset.mon,t.dataset.force);return}

 if(x==='cap-tay'){moCapTay(+t.dataset.gv);return}
 if(x==='ok-cap-tay'){const p=NS.find(z=>z.id===+t.dataset.gv),v=$('#ctNew').value;
  if(v)p.capTay=v; else delete p.capTay;
  closeModal();render();
  toast(v?`✓ ${p.n} — cấp học tính định mức khai báo <b>${v}</b>`
        :`${p.n} — trở lại <b>suy từ phân công</b>`);return}
 if(x==='ghide'){moGhiDe(+t.dataset.gv);return}
 if(x==='ok-ghide'){
  const p=ns(+t.dataset.gv),v=+$('#gdV').value,l=$('#gdL').value.trim();
  if(!l){toast('⛔ Bắt buộc nêu lý do ngoại lệ — đây là con số quyết định thù lao vượt giờ');return}
  p.dmGhiDe=v;p.lyDo=l;p.duyetNgoaiLe=null;closeModal();render();
  toast(`Đã ghi đè định mức ${p.n} = <b>${v} tiết/tuần</b> · cờ <b>Có ngoại lệ</b> · chờ Hiệu trưởng duyệt`);return}
 if(x==='bo-ghide'){const p=ns(+t.dataset.gv);delete p.dmGhiDe;delete p.lyDo;delete p.duyetNgoaiLe;
  closeModal();render();toast(`${p.n} trở lại <b>định mức theo template</b>`);return}
 if(x==='duyet-nl'){const p=ns(+t.dataset.gv);p.duyetNgoaiLe='Hiệu trưởng duyệt · '+d2s(HOMNAY);render();
  toast(`✓ Đã duyệt ngoại lệ định mức của ${p.n} · ghi audit`);return}

 if(x==='mo-monkhuyet'){
  const mk=monKhongAiDay();
  modal('Môn không có giáo viên nào dạy được',
   `<div class="danger">Mỗi môn dưới đây <b>không có ai trong trường được phép dạy</b>. Mọi lớp áp dụng môn đó
     sẽ thiếu giáo viên ở M4.5 và <b>không xếp được Thời khóa biểu đủ tiết</b>.</div>
    <table><thead><tr><th>Môn</th><th>Cấp áp dụng</th><th>Tổ phụ trách</th><th class="num">Lớp bị ảnh hưởng</th></tr></thead><tbody>
    ${mk.map(m=>`<tr class="badrow"><td><b>${m}</b></td><td>${MON[m].cap.join(', ')}</td><td>${TO[MON[m].to]}</td>
      <td class="num">${MON[m].cap.includes('THCS')?7:0}${MON[m].cap.includes('THPT')?'+3':''} lớp</td></tr>`).join('')}
    </tbody></table>
    <div class="ro" style="margin-top:11px">Hai hướng xử lý: <b>gán môn cho giáo viên hiện có</b> ở tab này,
     hoặc <b>tuyển bổ sung</b> — đây chính là đầu vào kế hoạch tuyển dụng.</div>`,
   `<button class="btn" data-x="close">Đóng</button>${dlink('M4.2','Kế hoạch tuyển dụng M4.2','tuyendung')}`);return}
 if(x==='mo-lech'){
  const lc=lechMonChinh();
  modal('Lệch giữa Môn dạy chính và tập môn được phép dạy',
   `<div class="warn"><code>Môn dạy chính</code> ở <b>M4.1 hồ sơ nhân sự</b> là trường <b>một giá trị</b>, dùng để
     <b>đồng bộ CSDL ngành</b> (TT 42/2021). Menu này giữ <b>cả tập</b> môn được phép dạy.
     Hai trường không gộp được, nhưng phải khớp nhau.</div>
    <table><thead><tr><th>Giáo viên</th><th>Môn dạy chính (M4.1)</th><th>Môn được phép dạy (M4.4)</th></tr></thead><tbody>
    ${lc.map(p=>`<tr class="warnrow"><td><b>${p.n}</b></td><td style="color:var(--red)">${p.monChinh}</td>
      <td>${monCua(p).join(', ')||'—'}</td></tr>`).join('')}
    </tbody></table>
    <div class="ro" style="margin-top:11px">Hệ thống <b>không tự sửa bên nào</b> — chỉ cảnh báo. Sửa sai bên nào là quyết định của người dùng.</div>`,
   `<button class="btn" data-x="close">Đóng</button>${dlink('M4.1','Sửa Môn dạy chính tại M4.1','monchinh')}`);return}


 if(x==='import'){
  modal('Import Excel — môn được phép dạy',
   `<div class="ro">Import <b>bắt buộc qua bước đối soát</b>. Không bao giờ ghi thẳng.</div>
    <div class="okbox">✓ <b>9 dòng</b> hợp lệ, sẽ được ghi</div>
    <div class="danger"><b>Chặn cứng — 2 dòng</b>
     <table style="margin-top:6px"><thead><tr><th>Dòng</th><th>Nội dung</th><th>Lý do</th></tr></thead><tbody>
      <tr><td>4</td><td>NS-2026-0999 · Toán</td><td><b>Mã nhân sự không tồn tại</b></td></tr>
      <tr><td>7</td><td>NS-2018-0064 · Sinh học</td><td><b>Môn ngoài danh mục áp dụng</b> năm 2026-2027</td></tr>
     </tbody></table></div>
    <div class="warn"><b>Cảnh báo mềm — 1 dòng</b><br>
     Dòng 11: NS-2017-0052 · Tin học — người này <b>đã có môn này</b>, import sẽ ghi đè mức độ</div>`,
   `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-import">Ghi 9 dòng hợp lệ</button>`);return}
 if(x==='ok-import'){closeModal();
  modal('Kết quả import',
   `<div class="okbox">✓ Đã ghi <b>9 dòng</b>.</div>
    <div class="warn"><b>Bỏ qua 2 dòng:</b><br>Dòng 4 — mã nhân sự không tồn tại<br>Dòng 7 — môn ngoài danh mục áp dụng</div>
    <div class="ro">Bảng kết quả tách rõ dòng thành công và dòng bị bỏ, kèm lý do — không phải một câu thông báo.</div>`,
   `<button class="btn p" data-x="close">Đóng</button>`);return}

 if(x==='ky-bh'){
  const cm=chuaGanMon();
  if(cm.length){
   modal('⛔ Không ký ban hành được',
    `<div class="danger"><b>Còn ${cm.length} giáo viên chưa gán môn được phép dạy:</b><br>
      ${cm.map(p=>`· <b>${p.n}</b> (${p.ma})`).join('<br>')}</div>
     <div class="ro">Ban hành một bảng định mức trong đó có người <b>chưa dạy được môn nào</b> nghĩa là
      bảng đó chưa phản ánh thực tế — và những người này cũng chưa xuất hiện ở M4.5.</div>`,
    `<button class="btn" data-x="close">Đóng — gán môn trước</button>`);return}
  BANHANH=d2s(HOMNAY);closeModal();render();
  toast('✍ Đã ký ban hành bảng định mức · Ký số Nhóm A · ghi audit và đồng bộ M4.11');return}
 if(x==='luu-cfg'){
  modal('Xác nhận lưu template',
   `<div class="warn">Sẽ tính lại định mức cho <b>${NS.filter(p=>!p.bgh).length} giáo viên</b>.</div>
    ${coNgoaiLe().length?`<div class="info"><b>${coNgoaiLe().length} người có ngoại lệ KHÔNG bị ghi đè</b> —
      ${coNgoaiLe().map(p=>p.n).join(', ')}. Ngoại lệ đã qua Hiệu trưởng duyệt, một lần sửa template không được xoá nó.</div>`:''}`,
   `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-cfg">Lưu và tính lại</button>`);return}
 if(x==='ok-cfg'){closeModal();render();toast('✓ Đã lưu template · đã tính lại định mức · người có ngoại lệ giữ nguyên');return}

 if(x==='xuat'){
  modal('Xuất dữ liệu',
   `<label class="lbl">Bản xuất</label><select class="fldi">
     <option>Danh sách năng lực giảng dạy</option><option>Bảng định mức đầu năm</option>
     <option>Danh sách định mức ngoại lệ</option></select>
    <label class="lbl">Mục đích sử dụng <span style="color:var(--red)">*</span></label>
    <select class="fldi" id="mdx"><option value="">— Chọn mục đích —</option>
     <option>Phát cho tổ chuyên môn</option><option>Báo cáo Phòng · Sở Giáo dục</option>
     <option>Lập kế hoạch tuyển dụng</option><option>Căn cứ tính thù lao vượt giờ</option></select>
    <div class="ro" style="margin-top:11px">Mọi lượt xuất <b>ghi audit</b> kèm mục đích, người xuất và thời điểm.</div>`,
   `<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="ok-xuat">⬇ Xuất</button>`);return}
 if(x==='ok-xuat'){if(!$('#mdx').value){toast('⛔ Bắt buộc chọn mục đích sử dụng trước khi xuất');return}
  closeModal();toast('⬇ Đã xuất · ghi audit kèm mục đích, người xuất và thời điểm');return}

 if(t.dataset.gv&&!x){cur=+t.dataset.gv;tab='mon';mtx=0;render();return}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fto'){fTo=el.value;render();return}
 if(el.id==='fmon'){fMon=el.value;render();return}
 if(el.id==='ftt'){fTT=el.value;render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render();
 const el=$('#q');if(el){el.value=q;el.focus();el.setSelectionRange(q.length,q.length)}}});

function render(){
 sidebar();tabs();
 $('#topact').innerHTML=(co('xuat')?'<button class="btn" data-x="xuat">⬇ Xuất</button>':'');
 const n=chuaGanMon().length+monKhongAiDay().length+choDuyetNgoaiLe().length;
 $('#ndot').textContent=n||'';$('#ndot').style.display=n?'grid':'none';
 $('#content').innerHTML=scopeBar()+(tab==='mon'?monTab():tab==='dm'?dmTab():cfTab());
}
render();
</script>
</body>
</html>
