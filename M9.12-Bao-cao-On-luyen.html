   🛑 Khối A có HAI CỘT RIÊNG cho môn ÔN và môn THI. Đây không phải chuyện
   trình bày: hai cột là hai thực thể, hai chủ dữ liệu, và chúng ĐƯỢC PHÉP
   khác nhau (`M11.1` §3.1). Gộp lại thành một cột là ghi tên em vào lớp em
   không đăng ký — trái TT 29/2024 Đ.5.                                    */
function veTab1() {
  const dot = M111_DOT[0];
  let h = '';

  /* năm học khác 2026-2027: `M11.1` không có dữ liệu — nói ra, ⛔ không vẽ bảng 0 */
  if (ST.nam !== '2026-2027') {
    return '<div class="canh r">📭 <b>Chưa có dữ liệu ôn luyện thi tốt nghiệp cho năm học ' + esc(ST.nam) + '.</b> '
      + '<code>M11.1</code> bắt đầu có sổ từ năm học 2026-2027. <b>«Chưa có dữ liệu» không phải là 0 lớp</b> — '
      + 'hai câu đó khác nhau, và chỉ câu thứ nhất là đúng.</div>';
  }

  h += PV.chotNgay() + daiHaiDongHo();

  /* chip đợt ôn */
  h += '<div class="pvbar"><span class="pvlb">📋 Đợt ôn</span>'
    + M111_DOT.map(d => '<button class="pvk' + (d.id === ST.dotOn ? ' on' : '') + '" data-dot="' + d.id + '">'
      + esc(d.ten) + ' <i>' + k2s(d.tu) + ' → ' + k2s(d.den) + '</i></button>').join('')
    + '</div>';
  if (ST.dotOn !== 'D1') {
    const d2 = M111_DOT.find(x => x.id === ST.dotOn);
    h += '<div class="canh n">📭 <b>Đợt «' + esc(d2.ten) + '» chưa có lớp ôn nào.</b> '
      + 'Đợt bắt đầu ' + k2s(d2.tu) + ' và số kế hoạch còn là <i>' + esc(d2.qd) + '</i>. '
      + 'Chưa mở lớp <b>không phải là 0 học sinh đăng ký</b>.</div>';
    return h;
  }

  /* 🔗 M3.4 — hai mốc của CHÍNH ngày chốt, ⛔ không phải một công tắc riêng.
     Danh sách dự thi chỉ tồn tại sau khi hệ thống của Bộ khóa đăng ký (17h
     05/5/2027). Chốt sớm hơn mốc ấy thì hai cột bên phải ghi «dữ liệu có từ
     05/05/2027» — ⛔ không ghi 0; chốt sau mốc thì chúng ra số thật. Cùng một
     bảng, hai thời điểm, hai câu trả lời đều đúng. */
  const sauM34 = PV.st.chotNgay >= M111_MOC_M34;
  h += '<div class="pvbar"><span class="pvlb">🔗 M3.4 · môn thi</span>'
    + '<button class="pvk' + (!sauM34 ? ' on' : '') + '" data-moc="' + M111_CHUP + '">Trước khi khóa đăng ký</button>'
    + '<button class="pvk' + (sauM34 ? ' on' : '') + '" data-moc="' + M111_DOT[0].den + '">Sau khi khóa đăng ký</button>'
    + '<span class="pvthu">Bộ khóa đăng ký dự thi <b>17h 05/5/2027</b></span></div>';

  h += daiThieuQuyen(['m11.1.bao_cao']) + daiOL5();

  /* môn có mặt trên bảng — môn có lớp ôn hoặc có người đăng ký, và trong phạm vi vai */
  const mons = M111_MON_TT.filter(m => monTrongPV(m) && (m111LopCua(m).length || m111DsOn(m).length));
  const monTong = M111_MON_TT.filter(m => m111LopCua(m).length || m111DsOn(m).length);
  h += daiPV('môn ôn', mons.length, monTong.length);

  const dong = mons.map(m => ({
    id: m, ten: M111_MON[m].ten,
    phu: (M111_MON[m].thi === 'bb' ? 'môn bắt buộc' : 'môn tự chọn') + ' · tổ ' + (TO_CUA_MON[m] || '—')
  }));
  if (!dong.length) {
    return h + '<div class="empty">Không có môn nào thuộc phạm vi ' + esc(tenPhamVi()) + '.</div>';
  }
  const tsO = (ma, mon, o) => CT.doc(ma, PV.thamSo({ ng: 'm111', mon, nam: ST.nam }), o);
  const psO = (ma, mon, o) => CT.doc(ma, PV.thamSoPS({ ng: 'm111', mon, nam: ST.nam }), o);

  /* ---------- khối A · TỒN — đăng ký ---------- */
  const cotA = [
    { khoa: 'lop', ten: 'Lớp ôn', donVi: 'lớp', kieu: 'so', nguon: 'm11.1.bao_cao' },
    { khoa: 'on', ten: 'HS đăng ký ÔN', donVi: 'học sinh', kieu: 'so', nguon: 'm11.1.bao_cao', khongCong: true },
    { khoa: 'thi', ten: 'HS đăng ký THI 🔗 M3.4', donVi: 'học sinh', kieu: 'so', nguon: 'm11.1.bao_cao', khongCong: true },
    { khoa: 'khac', ten: 'Ôn khác môn thi', kieu: 'so', nguon: 'm11.1.bao_cao', khongCong: true }
  ];
  const khoiA = {
    id: 'a', tieuDe: 'A · Đăng ký ôn theo môn — và môn thi chính thức', ma: 'OL.02', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Môn ôn', cot: cotA, dong: dong, gomNhom: false,
    link: d => ({ menu: 'M11.1', ctx: 'tab=dang_ky&mon=' + d.id, nhan: 'Đăng ký môn ôn' }),
    o: (d, c) => c.khoa === 'lop' ? CT.doc('OL.01', PV.thamSo({ ng: 'm111', mon: d.id, nam: ST.nam }))
      : c.khoa === 'on' ? tsO('OL.02', d.id)
        : c.khoa === 'thi' ? tsO('OL.02', d.id, 'thiMon')
          : tsO('OL.02', d.id, 'onKhacThi'),
    /* 🛑 Dòng Tổng của ba cột đếm người là SỐ NGƯỜI KHÁC NHAU, ⛔ không phải
       tổng cộng dọc — một em ôn bốn môn nằm ở bốn dòng. */
    tongRieng: c => {
      if (c.khoa !== 'on' && c.khoa !== 'thi' && c.khoa !== 'khac') return null;
      if (!coXD('m11.1.bao_cao')) return null;
      const em = {}; let luot = 0;
      mons.forEach(m => {
        const ds = c.khoa === 'on' ? m111DsOn(m)
          : c.khoa === 'thi' ? m111DsThi(m)
            : m111OnKhacThi(m).map(x => x.hs);
        luot += ds.length;
        ds.forEach(h => em[h] = 1);
      });
      if (c.khoa !== 'on' && PV.st.chotNgay < M111_MOC_M34) return null;
      const ten = c.khoa === 'on' ? 'Số em có đăng ký ôn ít nhất một môn'
        : c.khoa === 'thi' ? 'Số em có tên trong danh sách dự thi'
          : 'Số em có ít nhất một môn ôn khác môn thi';
      return demNguoi(ten, Object.keys(em),
        'Khối 12 có <b>' + Object.keys(M111_HS).length + ' em</b>.', luot);
    },
    duoiBang: roNeu(['m11.1.bao_cao'], '<div class="ro">🛑 <b>Môn ÔN ≠ môn THI</b> — hai thực thể, <b>được phép khác nhau</b>.</div>')
      + dnote('<b>Đăng ký ÔN</b> là nguyện vọng ôn của em, tự nguyện theo <b>TT 29/2024 Đ.5</b>, do <code>M11.1</code> sở hữu. '
        + '<b>Đăng ký THI</b> là môn em thi trong kỳ thi tốt nghiệp, đăng ký trên hệ thống của Bộ, do <code>M3.4</code> sở hữu. '
        + 'Hai bên khác nhau là chuyện có thật: em đổi môn thi phút chót, em có IELTS được miễn thi Ngoại ngữ nên <b>thi</b> Anh '
        + 'mà <b>không ôn</b> Anh. Hệ thống không bắt hai bên khớp và không sửa bên nào theo bên nào — dùng môn thi làm danh sách '
        + 'ôn là <b>ghi tên em vào lớp em không đăng ký</b>. Hai cột đứng cạnh nhau <b>không có nghĩa là trừ được cho nhau</b>: '
        + 'cột <i>Ôn khác môn thi</i> đếm <b>hai chiều</b> nên nó không bằng hiệu hai cột bên trái.')
  };

  /* ---------- khối B · PHÁT SINH — dạy và thi thử ---------- */
  const cotB = [
    { khoa: 'buoi', ten: 'Buổi đã dạy', donVi: 'buổi', kieu: 'so', nguon: 'm11.1.bao_cao' },
    { khoa: 'kh', ten: 'Kế hoạch', donVi: 'buổi', kieu: 'so', nguon: 'm11.1.bao_cao' },
    { khoa: 'cc', ten: 'Tỉ lệ dự học', kieu: 'tile', nguon: 'm11.1.bao_cao', khongCong: true },
    { khoa: 'l1', ten: 'Thi thử lần 1 · ĐTB', kieu: 'ngay', nguon: 'm11.1.bao_cao', khongCong: true },
    { khoa: 'l2', ten: 'Thi thử lần 2 · ĐTB', kieu: 'ngay', nguon: 'm11.1.bao_cao', khongCong: true },
    { khoa: 'ch', ten: 'Chênh lần 1 → lần 2', kieu: 'ngay', nguon: 'm11.1.bao_cao', khongCong: true }
  ];
  const khoiB = {
    id: 'b', tieuDe: 'B · Dạy và kết quả thi thử của đợt ' + dot.id, ma: 'OL.04', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Môn ôn', cot: cotB, dong: dong,
    link: d => ({ menu: 'M11.1', ctx: 'tab=bao_cao&mon=' + d.id, nhan: 'Báo cáo kết quả' }),
    o: (d, c) => c.khoa === 'buoi' ? psO('OL.04', d.id)
      : c.khoa === 'kh' ? psO('OL.04', d.id, 'keHoach')
        : c.khoa === 'cc' ? psO('OL.03', d.id)
          : c.khoa === 'l1' ? psO('OL.05', d.id, 'dau')
            : c.khoa === 'l2' ? psO('OL.05', d.id, 'cuoi')
              : psO('OL.05', d.id, 'chenh'),
    duoiBang: roNeu(['m11.1.bao_cao'], '<div class="ro">🛑 Ô điểm trống ⛔ <b>không phải 0</b>. Cột <b>Chênh</b> ghép cặp từng em.</div>')
      + dnote('Em chưa là thành viên lúc thi thử, hoặc em vắng buổi ấy: ô để trống và <b>em không có trong mẫu số</b> của lần đó. '
        + 'Cột <b>Chênh</b> là trung bình của hiệu <b>tính trên từng em</b>, chỉ với em có điểm <b>cả hai</b> lần — '
        + '⛔ không phải hiệu của hai trung bình, vì một em vắng một lần là đủ làm con số đó lệch. '
        + '🔒 Điểm thi thử là <b>điểm nội bộ, chỉ để thống kê</b>: không vào <code>M2.5</code>, không vào học bạ, '
        + 'không vào CSDL ngành, và <b>không phải</b> điểm thi tốt nghiệp (<code>M11.1</code> §2.1).')
  };
  h += KB.K3({ khoiTon: khoiA, khoiPS: khoiB });
  return h;
}

/* ══════════════ TAB 2 · BỒI DƯỠNG & ĐÀO TẠO HSG ═══════════════════════
   Gộp HAI menu nguồn `M11.2` (cấp trường) + `M11.3` (cấp tỉnh) vào một tab —
   `N6` cho phép, vì cùng người đọc và cùng kỳ. Nhưng cột `Cấp` phải TÁCH RÕ:
   hai cấp khác nhau ở chỗ ai chọn người, ai trả công, và ai là chủ dữ liệu
   cá nhân của các em. Cộng chung một dòng là xóa mất cả ba khác biệt ấy.   */
const CAP_BD = [
  { id: 'truong', ng: 'm112', ten: '🏫 Cấp trường — lớp bồi dưỡng của trường', nguon: 'm11.2.bao_cao', menu: 'M11.2' },
  { id: 'tinh', ng: 'm113', ten: '🏛 Cấp tỉnh — đội tuyển do Sở triệu tập', nguon: 'm11.3.bao_cao', menu: 'M11.3' }
];
function veTab2() {
  let h = PV.chotNgay() + PV.daiCanhBao()
    + daiThieuQuyen(CAP_BD.map(c => c.nguon)) + daiOL5();

  /* dòng = Môn, gom nhóm theo CẤP */
  const dong = [];
  CAP_BD.forEach(c => {
    const ds = c.ng === 'm112' ? M112_LOP : M113_LOP;
    const dot = (c.ng === 'm112' ? M112_DOT : M113_DOT).find(x => x.nam === ST.nam);
    const mons = [];
    if (dot) ds.forEach(l => { if (l.dot === dot.id && mons.indexOf(l.mon) < 0) mons.push(l.mon) });
    if (!mons.length) {
      dong.push({
        id: c.id + '|_', nhom: c.ten, cap: c.id, ng: c.ng, mon: null, nguon: c.nguon,
        ten: 'Không có lớp nào trong năm học ' + ST.nam,
        phu: 'chưa mở lớp — không phải 0 học sinh'
      });
      return;
    }
    mons.forEach(m => {
      if (!monTrongPV(m)) return;
      dong.push({
        id: c.id + '|' + m, nhom: c.ten, cap: c.id, ng: c.ng, mon: m, nguon: c.nguon,
        ten: tenMon(m),
        phu: (dot ? dot.ten : '') + (c.ng === 'm113' ? ' · ' + dot.vb : '')
      });
    });
  });
  const tong = dong.length;
  if (!tong) return h + '<div class="empty">Không có lớp bồi dưỡng nào trong phạm vi ' + esc(tenPhamVi()) + '.</div>';

  const oTS = (d, ma, o) => d.mon == null ? null : CT.doc(ma, PV.thamSo({ ng: d.ng, mon: d.mon, nam: ST.nam }), o);
  const oPS = (d, ma, o) => d.mon == null ? null : CT.doc(ma, PV.thamSoPS({ ng: d.ng, mon: d.mon, nam: ST.nam }), o);

  /* ---------- khối A · TỒN ---------- */
  const cotA = [
    { khoa: 'lop', ten: 'Lớp', donVi: 'lớp', kieu: 'so' },
    { khoa: 'hs', ten: 'HS bồi dưỡng', donVi: 'học sinh', kieu: 'so', khongCong: true },
    { khoa: 'ng', ten: 'Trong đó ngoài trường', kieu: 'so', khongCong: true },
    { khoa: 'dt', ten: 'Đã vào đội tuyển 🔗 M11.4', kieu: 'so', khongCong: true }
  ];
  const khoiA = {
    id: 'a', tieuDe: 'A · Lớp và học sinh theo cấp', ma: 'OL.02', chip: 'TON',
    moTaKy: PV.moTaChot(), tenCotDau: 'Môn', cot: cotA, dong: dong, gomNhom: true,
    link: d => d.mon == null ? null : ({ menu: d.ng === 'm112' ? 'M11.2' : 'M11.3', ctx: 'tab=lop&mon=' + d.mon, nhan: d.ng === 'm112' ? 'Lớp bồi dưỡng' : 'Lớp đào tạo' }),
    o: (d, c) => {
      if (d.mon == null) return null;
      if (!coXD(d.nguon)) return { giaTri: null, canhBao: { ma: 'THIEU_QUYEN', chu: 'thiếu XD ở ' + NGUON[d.nguon].menu } };
      return c.khoa === 'lop' ? CT.doc('OL.01', PV.thamSo({ ng: d.ng, mon: d.mon, nam: ST.nam }))
        : c.khoa === 'hs' ? oTS(d, 'OL.02')
          : c.khoa === 'ng' ? oTS(d, 'OL.02', 'ngoaiTruong')
            : oTS(d, 'OL.02', 'doiTuyen');
    },
    /* cùng lý do với tab 1: cộng dọc số học sinh qua các môn ra LƯỢT, không ra NGƯỜI */
    tongRieng: c => {
      if (c.khoa !== 'hs') return null;
      const em = {}; let luot = 0;
      dong.forEach(d => {
        if (d.mon == null || !coXD(d.nguon)) return;
        const ls = d.ng === 'm112' ? m112LopCua(ST.nam, d.mon) : m113LopCua(ST.nam, d.mon);
        ls.forEach(l => tvNgay(l, PV.st.chotNgay).forEach(t => { luot++; em[d.ng + '|' + t.hs] = 1 }));
      });
      return demNguoi('Số em đang bồi dưỡng ở ít nhất một lớp', Object.keys(em),
        'Đếm riêng theo cấp — một em vừa học lớp của trường vừa ở đội tuyển tỉnh là <b>hai hồ sơ khác nhau</b>.', luot);
    },
    duoiBang: roNeu(['m11.2.bao_cao', 'm11.3.bao_cao'], '<div class="ro">🛑 Hai <b>cấp</b> tách hẳn, ⛔ không cộng chéo.</div>')
      + dnote('⚖ Báo cáo này <b>không bày tên học sinh của trường khác</b>. Lớp <b>cấp trường</b> (<code>M11.2</code>) chỉ nhận học sinh của trường, vào lớp bằng thi đầu vào hoặc do giáo viên '
        + 'phụ trách thêm. Lớp <b>cấp tỉnh</b> (<code>M11.3</code>) là đội tuyển <b>do Sở triệu tập bằng quyết định</b>, phần lớn '
        + 'thành viên là <b>học sinh của trường khác</b> — trường này chỉ là nơi tổ chức dạy. Hai cấp khác nhau ở chỗ ai chọn người, '
        + 'ai trả công, và <b>ai là chủ dữ liệu cá nhân của các em</b>; cộng chung một dòng là xóa cả ba khác biệt ấy. '
        + 'Tên các em ngoài trường không hiện ở đây kể cả với vai có mức từng em — menu nguồn cần tên để khai báo và liên kết '
        + 'hồ sơ, một bản báo cáo thì không (<b>Luật BVDLCN 91/2025</b>, tối thiểu hóa). Đây là chỗ <code>M9.12</code> '
        + '<b>chặt hơn</b> <code>M11.3</code>, cố ý.')
  };

  /* ---------- khối B · PHÁT SINH ---------- */
  const cotB = [
    { khoa: 'buoi', ten: 'Buổi đã dạy', donVi: 'buổi', kieu: 'so' },
    { khoa: 'kh', ten: 'Kế hoạch', donVi: 'buổi', kieu: 'so' },
    { khoa: 'qh', ten: 'Đã tới ngày, chưa điểm danh', kieu: 'so', canhBao: k => k.giaTri > 0 },
    { khoa: 'cc', ten: 'Tỉ lệ dự học', kieu: 'tile', khongCong: true },
    { khoa: 'ch', ten: 'Chênh bài đầu → bài cuối', kieu: 'ngay', khongCong: true },
    { khoa: 'dv', ten: 'Thi đầu vào', donVi: 'học sinh', kieu: 'so', khongCong: true }
  ];
  const khoiB = {
    id: 'b', tieuDe: 'B · Dạy, dự học và kết quả trong khoảng', ma: 'OL.04', chip: 'PS',
    moTaKy: PV.moTaKhoang(), tenCotDau: 'Môn', cot: cotB, dong: dong, gomNhom: true,
    link: d => d.mon == null ? null : ({ menu: d.ng === 'm112' ? 'M11.2' : 'M11.3', ctx: 'tab=bao_cao&mon=' + d.mon, nhan: 'Báo cáo kết quả' }),
    o: (d, c) => {
      if (d.mon == null) return null;
      if (!coXD(d.nguon)) return { giaTri: null, canhBao: { ma: 'THIEU_QUYEN', chu: 'thiếu XD ở ' + NGUON[d.nguon].menu } };
      return c.khoa === 'buoi' ? oPS(d, 'OL.04')
        : c.khoa === 'kh' ? oPS(d, 'OL.04', 'keHoach')
          : c.khoa === 'qh' ? oPS(d, 'OL.04', 'chuaDD')
            : c.khoa === 'cc' ? oPS(d, 'OL.03')
              : c.khoa === 'ch' ? oPS(d, 'OL.05', 'chenh')
                : oPS(d, 'OL.05', 'dauVao');
    },
    duoiBang: roNeu(['m11.2.bao_cao', 'm11.3.bao_cao'], '<div class="ro">🛑 <b>«Chưa điểm danh» ≠ «không dạy»</b> — hai cột riêng.</div>')
      + dnote('⛔ <b>Không có ô tiền nào</b> trên tab này. Cột <i>Buổi đã dạy</i> chỉ đếm buổi <b>đã có bản ghi điểm danh</b>; buổi đã tới ngày mà chưa ai điểm danh đứng ở '
        + 'cột riêng, vì đó là <b>việc còn dở của giáo viên</b> chứ không phải một buổi không diễn ra. '
        + 'Số buổi đã chốt của từng giáo viên đi thẳng sang <code>M7.6</code> theo <code>OL-6</code>: Kế toán đọc con số '
        + '<b>đã chốt</b> ở chỗ của mình, không vào menu nghiệp vụ để tra — phía nhận <code>M7.6</code> <b>chưa dựng</b> '
        + '(<code>PHIEU-BCM9-3B.md</code> mục H). Cột <i>Thi đầu vào</i> trống ở nhiều dòng, và <b>mỗi dòng trống một lý do</b>: '
        + 'lớp Hóa nhận thành viên do giáo viên thêm trực tiếp; lớp cấp tỉnh do Sở triệu tập; lớp Toán 12 <b>đã thi mà chưa chốt '
        + 'danh sách</b>. Ba câu ấy dẫn tới ba việc khác nhau — bấm vào ô để đọc lý do.')
  };
  h += KB.K3({ khoiTon: khoiA, khoiPS: khoiB });
  return h;
}

/* ══════════════ TAB 3 · THÀNH TÍCH HỌC SINH GIỎI ══════════════════════
   Nguồn `M11.4`. Chỉ có số PHÁT SINH (giải đạt được trong một năm học), nên
   một bảng `K2` — dòng = Môn, gom nhóm theo CẤP, cột = từng loại giải.
   Đây là báo cáo loại B dùng cho thi đua, ĐỒNG THỜI là số liệu loại A phải
   công khai kết quả năm học trước (**TT 09/2024 Đ.9 k.2**) — vì vậy bộ chọn
   năm học ở đầu trang phải lùi được về năm trước, và nó lùi được.         */
function veTab3() {
  let h = '';
  /* số của một NĂM HỌC, không phải của một ngày ⇒ không dùng `Chốt tại ngày` */
  h += '<div class="pvbar"><span class="pvlb">🗓 Năm học</span>'
    + ['2026-2027', '2025-2026'].map(n => '<button class="pvk' + (ST.nam === n ? ' on' : '') + '" data-nam="' + n + '">'
      + n + (n === NAMHOC ? ' <i>(hiện hành)</i>' : ' <i>(năm trước)</i>') + '</button>').join('')
    + '</div>';
  if (ST.nam !== NAMHOC) {
    h += '<div class="canh w">🕐 <b>Đang xem năm học ' + esc(ST.nam) + ', không phải năm hiện hành.</b> '
      + 'Đây là số liệu dùng để <b>công khai kết quả năm học trước</b> theo <b>TT 09/2024/TT-BGDĐT Điều 9 khoản 2</b>. '
      + '<button class="btn xs" data-nam="' + NAMHOC + '">↩ Về năm hiện hành</button></div>';
  }
  h += daiThieuQuyen(['m11.4.thong_ke']) + daiOL5();

  const dong = [];
  M114_CAP_TT.forEach(cap => {
    const mons = [];
    M114_DOI.forEach(d => {
      const k = M114_KY.find(x => x.id === d.ky);
      if (k && k.nam === ST.nam && k.cap === cap && mons.indexOf(d.mon) < 0) mons.push(d.mon);
    });
    if (!mons.length) {
      dong.push({
        id: cap + '|_', nhom: M114_CAP[cap], cap, mon: null,
        ten: 'Không có kỳ thi cấp này trong năm học ' + ST.nam,
        phu: 'trường không dự kỳ nào ở cấp này — không phải 0 giải'
      });
      return;
    }
    mons.forEach(m => {
      if (!monTrongPV(m)) return;
      const k = M114_KY.find(x => x.nam === ST.nam && x.cap === cap);
      dong.push({
        id: cap + '|' + m, nhom: M114_CAP[cap], cap, mon: m, ten: tenMon(m),
        phu: k ? 'thi ' + k2s(k.ngayThi) + (k.qd ? ' · QĐ ' + k.qd : ' · chưa có QĐ công nhận') : ''
      });
    });
  });

  const o = (d, oPhu) => d.mon == null ? null : CT.doc('KQ.08', PV.thamSoPS({ cap: d.cap, mon: d.mon, nam: ST.nam }), oPhu);
  const cot = [
    { khoa: 'duthi', ten: 'Số HS dự thi', donVi: 'học sinh', kieu: 'so', nguon: 'm11.4.thong_ke' },
    { khoa: 'nhat', ten: 'Nhất', kieu: 'so', nguon: 'm11.4.thong_ke' },
    { khoa: 'nhi', ten: 'Nhì', kieu: 'so', nguon: 'm11.4.thong_ke' },
    { khoa: 'ba', ten: 'Ba', kieu: 'so', nguon: 'm11.4.thong_ke' },
    { khoa: 'kk', ten: 'KK', kieu: 'so', nguon: 'm11.4.thong_ke' },
    { khoa: 'tong', ten: 'Tổng giải', donVi: 'giải', kieu: 'so', nguon: 'm11.4.thong_ke' },
    { khoa: 'tile', ten: 'Tỉ lệ đạt giải', kieu: 'tile', nguon: 'm11.4.thong_ke', khongCong: true },
    { khoa: 'cho', ten: 'Chờ đối chiếu QĐ', kieu: 'so', nguon: 'm11.4.thong_ke', canhBao: k => k.giaTri > 0 }
  ];
  h += KB.K2({
    id: 'tt', tieuDe: 'Thành tích học sinh giỏi năm học ' + ST.nam + ' — theo cấp và môn', ma: 'KQ.08', chip: 'PS',
    moTaKy: 'Cả năm học ' + ST.nam, tenCotDau: 'Môn', cot: cot, dong: dong, gomNhom: true,
    link: d => d.mon == null ? null : ({ menu: 'M11.4', ctx: 'tab=thong_ke&cap=' + d.cap + '&mon=' + d.mon, nhan: 'Thống kê thành tích' }),
    o: (d, c) => c.khoa === 'duthi' ? o(d, 'duThi')
      : c.khoa === 'tile' ? o(d, 'tile')
        : c.khoa === 'cho' ? o(d, 'choDoiChieu')
          : c.khoa === 'tong' ? o(d)
            : o(d, c.khoa),
    duoiBang: roNeu(['m11.4.thong_ke'], '<div class="ro">🛑 Chỉ đếm giải <b>đã đối chiếu QĐ</b> ⇒ tỉ lệ là <b>mức sàn</b>.'
      + daiGioiHanQG() + '</div>')
      + dnote('Kết quả gõ tay từ bảng tin của Sở thường có <b>trước</b> quyết định công nhận vài ngày và <b>có thể sai tên</b>; '
        + 'nếu nó chảy thẳng vào bảng thi đua thì con số của trường mang một giải không có thật (<code>M11.4</code> §2.4 — '
        + 'máy đếm ≠ người đối chiếu). Giải chưa đối chiếu nằm ở cột <i>Chờ đối chiếu QĐ</i> và <b>vẫn ở mẫu số</b> của tỉ lệ. '
        + '🛑 Bảng này <b>không xếp hạng học sinh, không xếp hạng giáo viên</b> — nó gom theo cấp và môn; hồ sơ thành tích của '
        + 'một em hay của một giáo viên bồi dưỡng là việc của <code>M11.4</code> tab 3. '
        + 'Căn cứ giới hạn cấp quốc gia: ' + esc(M114_GH_QG.canCu) + '.')
  });
  return h;
}
/* ⚠ Giới hạn dự thi cấp quốc gia là của ĐƠN VỊ DỰ THI, ⛔ KHÔNG phải chỉ tiêu
   của trường. Trường chỉ ĐỀ CỬ; trường khác trong tỉnh cũng đề cử, nên chỉ tiêu
   thực của trường THẤP HƠN con số trên văn bản. Dán con số 10 lên màn hình mà
   không nói câu này là để người đọc tưởng trường được cử 10 em. */
function daiGioiHanQG() {
  const coQG = M114_KY.some(k => k.nam === ST.nam && k.cap === 'qg');
  if (!coQG) return '';
  return ' ⚠ Giới hạn <b>' + M114_GH_QG.so + ' thí sinh/môn</b> cấp QG là của <b>'
    + esc(M114_GH_QG.dvdt) + '</b> (đơn vị dự thi), ⛔ <b>không phải của trường</b>.';
}

/* ══════════════════════════ VẼ ════════════════════════════════════════ */
function ve() {
  KB.moi();
  rolebar(); header(); tabs();
  const co = TAB.filter(t => coTab(t.ma));
  if (!co.length) {
    $('#content').innerHTML = '<div class="noaccbox">🔒 <b>Vai «' + esc(R().cd) + '» không có Feature nào ở menu này</b>, '
      + 'nên trên bản thật menu <b>không nằm trong danh sách menu</b> của họ.</div>';
    return;
  }
  const t = TAB.find(x => x.ma === ST.tab);
  $('#h1').textContent = 'Báo cáo Ôn luyện & bồi dưỡng';
  $('#crumb').innerHTML = '';
  $('#topact').innerHTML = coXuat()
    ? XU.veNut({ coChiTiet: xemEm() })
    : '<span class="noacc" title="Thiếu quyền Xuất dữ liệu (XD) ở mọi menu nguồn của tab này">🔒 không xuất được</span>';
  $('#content').innerHTML =
    '<div class="tabhd"><b>' + esc(t.nhan.replace(/^\d+ · /, '')) + '</b>'
    + '<span class="bgma">' + t.bc + '</span>'
    + '<span class="bgky">Loại ' + t.loai + ' · khuôn ' + t.k + '</span></div>'
    + (ST.tab === 'on_thi_tn' ? veTab1() : ST.tab === 'boi_duong_hsg' ? veTab2() : veTab3());
}
PV.noiVeLai(ve);

/* ── bối cảnh cho hai nút xuất — đầu trang và cuối trang của tệp xuất ──── */
XU.noiBoiCanh(() => {
  const t = TAB.find(x => x.ma === ST.tab) || TAB[0];
  const ma = ST.tab === 'thanh_tich' ? 'KQ.08' : ST.tab === 'on_thi_tn' ? 'OL.02' : 'OL.01';
  const kb = CT.khaiBao(ma);
  return {
    truong: 'THCS & THPT Nguyễn Tất Thành',
    baoCao: 'Báo cáo Ôn luyện & bồi dưỡng — ' + t.nhan.replace(/^\d+ · /, '') + ' (' + t.bc + ')',
    ky: ST.tab === 'thanh_tich' ? 'Cả năm học ' + ST.nam
      : ST.tab === 'on_thi_tn' ? PV.moTaChot() + ' · ' + PV.moTaKhoang() + ' · ảnh chụp M11.1 tại ' + k2s(M111_CHUP)
        : PV.moTaChot() + ' · ' + PV.moTaKhoang(),
    nguoi: R().n, chucDanh: R().cd,
    phamVi: tenPhamVi(),
    donVi: 'môn',
    quyTac: (kb.quyTacDem.tinhVao || []).concat((kb.quyTacDem.khongTinh || []).map(x => 'KHÔNG tính: ' + x)),
    truong_du_lieu: TRUONG_XUAT[ST.tab],
    soDong: soDongChiTiet()
  };
});
/* ── ba danh sách trường của mức 2 — mỗi tab một bộ ────────────────────
   Mức 2 của ba tab lấy ba loại bản ghi khác nhau, nên trường cá nhân cũng khác.
   🛑 `OL-5`: vai không có mức từng học sinh thì nút mức 2 KHÔNG hiện, và gói
   xuất không kèm bảng từng em — nếu không thì ranh giới ấy chỉ là lớp sơn. */
const TRUONG_XUAT = {
  on_thi_tn: [
    { khoa: 'hs', ten: 'Họ và tên học sinh', batBuoc: true, nhay: true },
    { khoa: 'lop', ten: 'Lớp chính khóa', batBuoc: true },
    { khoa: 'monOn', ten: 'Môn đăng ký ÔN' },
    { khoa: 'monThi', ten: 'Môn đăng ký THI (🔗 M3.4)' },
    { khoa: 'cc', ten: 'Chuyên cần (có mặt / phải dự)' },
    { khoa: 'diem', ten: 'Điểm thi thử từng lần 🔒', nhay: true, macDinh: false }
  ],
  boi_duong_hsg: [
    { khoa: 'hs', ten: 'Họ và tên học sinh', batBuoc: true, nhay: true },
    { khoa: 'truong', ten: 'Trường · lớp', batBuoc: true },
    { khoa: 'cap', ten: 'Cấp · môn · lớp bồi dưỡng' },
    { khoa: 'vao', ten: 'Ngày vào lớp · ngày rời' },
    { khoa: 'cc', ten: 'Chuyên cần (có mặt / phải dự)' },
    { khoa: 'diem', ten: 'Điểm nội bộ từng bài 🔒', nhay: true, macDinh: false }
  ],
  thanh_tich: [
    { khoa: 'hs', ten: 'Họ và tên học sinh', batBuoc: true, nhay: true },
    { khoa: 'lop', ten: 'Lớp', batBuoc: true },
    { khoa: 'ky', ten: 'Kỳ thi · cấp · môn' },
    { khoa: 'giai', ten: 'Loại giải · điểm' },
    { khoa: 'qd', ten: 'Quyết định công nhận · người đối chiếu' }
  ]
};
function soDongChiTiet() {
  if (ST.tab === 'thanh_tich') {
    let n = 0;
    M114_TT.forEach(t => {
      const d = M114_DOI.find(x => x.id === t.doi), k = d && M114_KY.find(x => x.id === d.ky);
      if (k && k.nam === ST.nam && monTrongPV(d.mon)) n++;
    });
    return n;
  }
  if (ST.tab === 'on_thi_tn') return M111_LOP.filter(l => monTrongPV(l.mon)).reduce((s, l) => s + l.hs.length, 0);
  let n = 0;
  M112_LOP.concat(M113_LOP).forEach(l => { if (monTrongPV(l.mon)) n += (l.hs || []).length });
  return n;
}

KB.gan(); PV.gan(); XU.gan();

document.addEventListener('click', e => {
  const r = e.target.closest('[data-r]');
  if (r) { role = r.getAttribute('data-r'); PV.st.tuTay = false; moTab(tabMacDinh()); ve(); return }
  const t = e.target.closest('[data-t]');
  if (t) { moTab(t.getAttribute('data-t')); ve(); return }
  const d = e.target.closest('[data-dot]');
  if (d) { ST.dotOn = d.getAttribute('data-dot'); ve(); return }
  const n = e.target.closest('[data-nam]');
  if (n) { ST.nam = n.getAttribute('data-nam'); ve(); return }
  const mc = e.target.closest('[data-moc]');
  if (mc) { PV.st.chotNgay = mc.getAttribute('data-moc'); PV.st.tuTay = true; ve(); return }
  if (e.target.closest('#btnNote')) { ST.note = !ST.note; ve(); return }
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const m = dl.getAttribute('data-dl'), q = dl.getAttribute('data-dlq') || '';
    toast('↗ Deep-link sang <b>' + esc(m) + '</b> — <code>?' + esc(q) + '</code><br>'
      + '<i>Demo một tệp: không mở được menu khác, nhưng đường dẫn là đường dẫn thật.</i>');
  }
});
$('#hnam').addEventListener('change', e => {
  ST.nam = (e.target.value || '').replace('Năm học ', '');
  ve();
});

function toast(h) {
  const t = $('#toast'); t.innerHTML = h; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 4200);
}

/* ── công cụ nghiệm thu: đo MẬT ĐỘ CHỮ GIẢI THÍCH (`nh9` §9.1, ngưỡng ≤ 20%)
   Gọi `doMatDoChu()` trong console. Đếm ký tự của mọi khối giải thích chia cho
   ký tự của toàn màn hình đang hiện.                                       */
function doMatDoChu() {
  /* BCM9-Z 21/9/2026 · V18 (chốt Đ8): bỏ .noaccbox khỏi chữ giải thích — dòng «đã trừ N — thiếu quyền» là THÔNG TIN VẬN HÀNH (sổ §2), sửa MỘT LƯỢT cả 16 demo. */
  const giai = '.canh,.ro,.dnote,.bvdl,.k3sep,.pvmc,.tongtru,.chieuro,.kyro,.pvcach,.info';
  const goc = $('#content');
  const tong = (goc.innerText || '').replace(/\s+/g, ' ').trim().length;
  let chu = 0;
  goc.querySelectorAll(giai).forEach(n => { chu += (n.innerText || '').replace(/\s+/g, ' ').trim().length });
  const r = { tong, chuGiaiThich: chu, tiLe: Math.round(chu * 1000 / tong) / 10 + '%' };
  console.log('Mật độ chữ giải thích —', ST.tab, r);
  return r;
}
window.doMatDoChu = doMatDoChu;

ST.tab = tabMacDinh();
moTab(ST.tab);
ve();
</script>
</body>
</html>
