/* ══════════════ VẼ TAB ═══════════════════════════════════════════════════ */
function veBaoCaoVanThu() {
  if (!BCN) return '<div class="empty">Đang nạp nền báo cáo…</div>';
  var PV = BCN.PV, KB = BCN.KB, CT = BCN.CT;
  KB.moi();   /* dọn kho ô trước mỗi lần vẽ — không dọn thì kho phình theo số lần vẽ */
  var h = BC.daiRanh('Sổ công văn Đến · Đi',
    'văn bản số 125 đi đâu rồi, ai đang giữ',
    'tháng này bao nhiêu văn bản, bao nhiêu quá hạn')
    + BC.daiNgoaiLe(bcVTNgoaiLe())
    + BC.ghiChu('Tab <b>chỉ đọc</b> của nhóm 📊 — chỉ <code>X</code> <code>XD</code>, '
      + 'không nút ghi nào kể cả với vai Đủ quyền; mọi ô số bấm được về bản ghi gốc, '
      + 'quy tắc đếm và chỗ sửa. Cấp số, chỉ định người xử lý, ký: ở sáu tab bên cạnh.')
    + PV.daiMau() + PV.khoang() + PV.chotNgay() + PV.daiCanhBao();

  /* ── KHỐI A · PHÁT SINH — số văn bản theo chiều đang chọn ─────────────── */
  var chieu = PV.st.phanTo || 'thang';
  h += PV.chonChieu('VH.05',
    ['thang', 'so_van_ban', 'loai_van_ban', 'muc_khan', 'co_quan_doi_tac', 'don_vi_soan']);

  h += KB.K1({
    id: 'a', tieuDe: 'A · Văn bản phát sinh trong khoảng', ma: 'VH.05', chip: 'PS',
    moTaKy: PV.moTaKhoang(), donVi: 'văn bản', nguon: 'm6.9.so_cong_van_den',
    tenCotDau: BCN.CHIEU[chieu], chieu: chieu,
    dong: bcVTDongA(chieu),
    oSo: function (d) { return CT.doc('VH.05', PV.thamSoPS({ loc: d.loc, phanTo: chieu })) },
    link: function (d) { return d.link },
    duoiBang: '<div class="ro">⛔ Hai chiều 🚫 chỉ có ở <b>một</b> cuốn sổ — lọc trong từng sổ ở tab 2 · 3.</div>'
  });

  /* ── KHỐI B · TỒN — quá hạn xử lý tại ngày chốt ───────────────────────── */
  h += KB.K1({
    id: 'b', tieuDe: 'B · Công văn Đến quá hạn xử lý', ma: 'VH.08', chip: 'TON',
    moTaKy: PV.moTaChot(), donVi: 'văn bản', nguon: 'm6.9.so_cong_van_den',
    tenCotDau: 'Trạng thái xử lý', chieu: 'trang_thai_xu_ly',
    dong: [
      { id: 'moi', ten: TT_DEN.moi[0], loc: function (x) { return x.tt === 'moi' }, link: { menu: 'M6.9', ctx: 'tab=den&chip=quahan', nhan: 'Sổ công văn Đến — chip ⏰ Quá hạn' } },
      { id: 'dachidinh', ten: TT_DEN.dachidinh[0], loc: function (x) { return x.tt === 'dachidinh' }, link: { menu: 'M6.9', ctx: 'tab=den&chip=quahan', nhan: 'Sổ công văn Đến — chip ⏰ Quá hạn' } },
      { id: 'dangxuly', ten: TT_DEN.dangxuly[0], loc: function (x) { return x.tt === 'dangxuly' }, link: { menu: 'M6.9', ctx: 'tab=den&chip=quahan', nhan: 'Sổ công văn Đến — chip ⏰ Quá hạn' } }
    ],
    /* ⚠ `phanTo` khai ĐÍCH DANH cho từng khối: `PV.st.phanTo` là của bộ chọn
       ở khối A, và `CT.doc` CHẶN chiều không hợp lệ — để nó chảy sang đây thì
       cả khối B ra lỗi «không cắt được theo chiều Tháng». Chặn đúng, truyền sai. */
    oSo: function (d) { return CT.doc('VH.08', PV.thamSo({ loc: d.loc, phanTo: 'trang_thai_xu_ly' })) },
    link: function (d) { return d.link }
  });

  /* ── KHỐI C · PHÁT SINH — lượt ký, và lượt ký THAY ────────────────────── */
  h += KB.K1({
    id: 'c', tieuDe: 'C · Lượt ký văn bản Đi', ma: 'VH.09', chip: 'PS',
    moTaKy: PV.moTaKhoang(), donVi: 'lượt ký', nguon: 'm6.9.uy_quyen_ky',
    tenCotDau: 'Người ký', dong: bcVTDongC(),
    oSo: function (d) { return CT.doc('VH.09', PV.thamSoPS({ loc: d.loc, phanTo: null })) },
    link: { menu: 'M6.9', ctx: 'tab=uq', nhan: 'Ủy quyền ký' }
  });

  /* ── KHỐI D · K5 — hai cuốn sổ đăng ký ────────────────────────────────── */
  h += bcVTSo();
  return h;
}

/* dòng của khối A theo chiều đang chọn */
function bcVTDongA(chieu) {
  var lkDen = { menu: 'M6.9', ctx: 'tab=den&chip=all', nhan: 'Sổ công văn Đến' };
  var lkDi = { menu: 'M6.9', ctx: 'tab=di&chip=all', nhan: 'Sổ công văn Đi' };
  var lkTra = { menu: 'M6.9', ctx: 'tab=tra', nhan: 'Tra cứu — gộp hai sổ' };

  if (chieu === 'so_van_ban') return [
    { id: 'den', ten: 'Sổ công văn Đến', phu: 'số Đến là số nội bộ của trường', loc: function (r) { return r.so === 'den' }, link: lkDen },
    { id: 'di', ten: 'Sổ công văn Đi', phu: 'số hiệu theo thể thức NĐ 30/2020', loc: function (r) { return r.so === 'di' }, link: lkDi }
  ];
  if (chieu === 'loai_van_ban') return Object.keys(LOAIVB).map(function (k) {
    return {
      id: k, ten: LOAIVB[k].ten, loc: function (r) { return r.x.loai === k }, link: lkTra
    };
  });
  if (chieu === 'muc_khan') return Object.keys(KHAN).map(function (k) {
    return {
      id: k, ten: KHAN[k][0], phu: k === 'thuong' ? 'gồm cả văn bản Đi (sổ Đi không có mức khẩn)' : '',
      loc: function (r) { return r.so === 'den' ? r.x.khan === k : k === 'thuong' }, link: lkTra
    };
  });
  /* mặc định: tháng — dựng từ chính khoảng đang xem, không cứng 12 dòng */
  var PV = BCN.PV, ds = [], t = BCN.thangCua(PV.st.tuNgay), het = BCN.thangCua(PV.st.denNgay);
  var dem = 0;
  while (t <= het && dem++ < 24) {
    (function (thang) {
      ds.push({
        id: thang, ten: BCN.tenThang(thang),
        loc: function (r) { return BCN.thangCua(r.so === 'den' ? r.x.ngayNhan : r.x.ngayKy) === thang },
        link: lkTra
      });
    })(t);
    var y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)) + 1;
    if (m > 12) { m = 1; y++ }
    t = y + '-' + BCN.p2(m);
  }
  return ds;
}

/* dòng của khối C — từng quyết định ủy quyền + người có thẩm quyền ký */
function bcVTDongC() {
  var ds = UYQUYEN.map(function (u) {
    return {
      id: u.id, ten: tenNS(u.cho) + ' — ký thay',
      phu: u.id + ' · ' + u.loai.map(function (l) { return LOAIVB[l].ten }).join(', ')
        + ' · ' + BCN.k2s(u.tu) + ' → ' + BCN.k2s(u.den),
      loc: function (x) {
        return x.nguoiKy === u.cho && x.ngayKy >= u.tu && x.ngayKy <= u.den && u.loai.indexOf(x.loai) >= 0;
      }
    };
  });
  var nguoiUQ = UYQUYEN.map(function (u) { return u.cho });
  ds.push({
    id: '_tq', ten: 'Người có thẩm quyền ký', phu: 'ký trực tiếp, không qua ủy quyền',
    loc: function (x) { return nguoiUQ.indexOf(x.nguoiKy) < 0 }
  });
  return ds;
}

/* ── KHỐI D · hai cuốn sổ (`K5`) ──────────────────────────────────────────
   Khuôn `K5` tự dò SỐ HIỆU ĐỨT QUÃNG và hiện dải đỏ. Đây đúng là phép kiểm
   mà `M6.9` §2.3 dựng cả cơ chế hủy-giữ-chỗ để vượt qua: hủy đăng ký thì
   dòng vẫn nằm đúng số của nó, nên sổ không có lỗ trống. Bảng này là chỗ
   chứng minh điều đó bằng máy, không bằng lời hứa.                         */
function bcVTSo() {
  var PV = BCN.PV, KB = BCN.KB, esc = BCN.esc;
  var laDen = BCVT.so === 'den';
  var chon = '<div class="pvbar"><span class="pvlb">📚 Cuốn sổ</span>'
    + '<button class="pvk' + (laDen ? ' on' : '') + '" data-bcso="den">Sổ công văn Đến</button>'
    + '<button class="pvk' + (laDen ? '' : ' on') + '" data-bcso="di">Sổ công văn Đi</button></div>';

  var ds, cot;
  if (laDen) {
    ds = denTrongPhamVi().filter(function (x) {
      return x.ngayNhan >= PV.st.tuNgay && x.ngayNhan <= PV.st.denNgay;
    }).sort(function (a, b) { return a.soDen - b.soDen }).map(function (x) {
      return {
        so: x.soDen, ma: maDen(x), ngay: BCN.k2s(x.ngayNhan), soGoc: x.soGoc,
        cq: x.cq, trich: docDuocMat(x) ? x.trich : trichAn,
        tt: TT_DEN[x.tt][0], huy: x.tt === 'huy'
      };
    });
    cot = [
      { khoa: 'ma', ten: 'Số Đến' }, { khoa: 'ngay', ten: 'Ngày nhận' },
      { khoa: 'soGoc', ten: 'Số hiệu gốc' }, { khoa: 'cq', ten: 'Cơ quan gửi' },
      {
        khoa: 'trich', ten: 'Trích yếu',
        ve: function (x) { return (x.huy ? '<span class="oro">' : '') + esc(x.trich) + (x.huy ? '</span>' : '') }
      },
      { khoa: 'tt', ten: 'Trạng thái' }
    ];
  } else {
    ds = diTrongPhamVi().filter(function (x) {
      return x.ngayKy && x.ngayKy >= PV.st.tuNgay && x.ngayKy <= PV.st.denNgay && x.so != null;
    }).sort(function (a, b) { return a.so - b.so }).map(function (x) {
      return {
        so: x.so, ma: soHieuCua(x), ngay: BCN.k2s(x.ngayKy), loai: LOAIVB[x.loai].ten,
        dv: DONVI[x.dv], trich: x.trich, nguoiKy: tenNS(x.nguoiKy), tt: TT_DI[x.tt][0]
      };
    });
    cot = [
      { khoa: 'ma', ten: 'Số hiệu' }, { khoa: 'ngay', ten: 'Ngày ký' },
      { khoa: 'loai', ten: 'Loại' }, { khoa: 'dv', ten: 'Đơn vị soạn' },
      { khoa: 'trich', ten: 'Trích yếu' }, { khoa: 'nguoiKy', ten: 'Người ký' },
      { khoa: 'tt', ten: 'Trạng thái' }
    ];
  }

  return chon + bcVTKiemSo(laDen) + KB.K5({
    tieuDe: 'D · ' + (laDen ? 'Sổ đăng ký văn bản ĐẾN' : 'Sổ đăng ký văn bản ĐI'),
    /* 🛑 `kiemSoHieu:false` — KHÔNG phải vì bỏ phép kiểm, mà vì đổi chỗ chạy nó.
       `KB.K5` dò đứt số trên đúng mảng được truyền vào; mảng ở đây đã bị cắt
       theo KHOẢNG NGÀY, mà số Đến cấp theo thứ tự ĐĂNG KÝ chứ không theo ngày
       nhận — nên một khoảng hẹp bao giờ cũng "thiếu" vài số và khuôn sẽ báo
       nhảy số OAN. Phép kiểm thật chạy trên TOÀN SỔ của năm, ở dải ngay trên. */
    chip: 'PS', moTaKy: PV.moTaKhoang(), banGhi: ds, cot: cot, kiemSoHieu: false,
    chuoiTrong: 'Không có văn bản nào vào sổ trong khoảng đang xem.',
    duoiBang: '<div class="ro">' + (laDen
      ? 'Dòng <b>đã hủy</b> vẫn nằm đúng số của nó, in mờ — bộ đếm <b>không lùi</b>.'
      : 'Chỉ văn bản <b>đã cấp số</b>: số cấp sau khi ký <i>(NĐ 30/2020 Đ.15)</i>.')
      + '</div>'
  });
}


/* ── PHÉP KIỂM SỐ HIỆU LIÊN TỤC — chạy trên TOÀN SỔ CỦA NĂM ───────────────
   `NĐ 30/2020` Đ.15: số và ký hiệu là **duy nhất trong một năm**. Câu hỏi mà
   phép kiểm này trả lời là câu của cả cuốn sổ — «sổ năm 2026 có chỗ nào đứt
   số không» — nên nó KHÔNG được chạy trên đoạn đang hiện trên màn hình.
   Chạy trên đoạn thì mỗi lần đổi khoảng lại ra một kết luận khác về cùng một
   cuốn sổ, và cả ba kết luận đều sai.                                      */
function bcVTKiemSo(laDen) {
  var so = laDen
    ? denTrongPhamVi().map(function (x) { return x.soDen })
    : diTrongPhamVi().filter(function (x) { return x.so != null }).map(function (x) { return x.so });
  so = so.filter(function (n) { return typeof n === 'number' }).sort(function (a, b) { return a - b });
  if (!so.length) return '';
  var dut = [];
  for (var i = 1; i < so.length; i++) if (so[i] - so[i - 1] > 1) dut.push(so[i - 1] + ' → ' + so[i]);
  var ten = laDen ? 'Sổ Đến' : 'Sổ Đi';
  var day = !can('xemAll')
    ? ' <i>— vai của bạn chỉ thấy một phần sổ, nên phép kiểm này không kết luận được cho cả sổ.</i>'
    : '';
  if (!can('xemAll'))
    return '<div class="ro">🔢 <b>' + ten + '</b> — không kiểm được số hiệu liên tục' + day + '</div>';
  return dut.length
    ? '<div class="canh r">⚠ <b>' + ten + ' năm ' + NAM + ' nhảy số</b> ở ' + dut.length + ' chỗ: '
      + BCN.esc(dut.join(' · ')) + '. Sổ có số hiệu đứt quãng thì không dùng làm căn cứ được.</div>'
    : '<div class="ro">🔢 <b>' + ten + ' năm ' + NAM + ': ' + so.length + ' số, liên tục '
      + so[0] + '→' + so[so.length - 1] + ', không đứt.</b> <i>Phép kiểm chạy trên cả sổ, không trên khoảng đang xem.</i></div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   `M6.9` — KHỞI ĐỘNG TAB BÁO CÁO · `BCM9-3C` (20/9/2026)

   Tệp này sắp CUỐI CÙNG (`app.95-…`) là có chủ ý: `app.js` của `M6.9` gọi
   `render()` ở dòng cuối của nó, tức TRƯỚC khi khung nền chạy. Lần vẽ đầu ấy
   không hỏng — `veBaoCaoVanThu()` thấy `BCN` còn rỗng thì trả về một dòng
   «đang nạp» — nhưng nó cũng chưa vẽ được bảng. Vẽ lại ở đây là xong.
   ══════════════════════════════════════════════════════════════════════════ */

(function bcVTKhoiDong() {
  bcVTChieu();
  bcVTKhaiMa();
  bcVTNoiNguon();

  /* KỲ CHUẨN của tab (`nh9` §4): `BC-VH-09` là báo cáo NĂM, nên mở bằng
     «từ đầu năm học tới hôm nay», không phải «tháng này». Đặt MỘT LẦN lúc nạp —
     đặt lại ở mỗi lần vẽ thì ngày người dùng tự gõ bị đè ngay sau khi gõ. */
  BCN.PV.khoangMacDinh('tu_dau_nam');

  BC.ganChung({
    menu: 'M6.9',
    veLai: render,
    coXD: bcVTCoXD,
    moTaNguon: function (f) { return BCVT_NGUON[f] || { menu: 'M6.9', ten: f } },
    boiCanh: bcVTBoiCanh,
    nhay: bcVTNhay
  });

  /* đổi cuốn sổ ở khối D */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-bcso]');
    if (!b) return;
    BCVT.so = b.getAttribute('data-bcso');
    render();
  });

  render();
})();

/* ── deep-link trong chính `M6.9`: mở đúng tab, đúng chip ─────────────────
   Đây là phần lãi của `N11`: con số nằm ngay cạnh cuốn sổ sinh ra nó, nên
   «4 văn bản quá hạn» đi tới danh sách bốn văn bản ấy bằng MỘT cú bấm. */
function bcVTNhay(q) {
  var p = {};
  (q || '').split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  if (p.tab) ST.tab = p.tab;
  ST.cur = null; ST.curDi = null;
  if (p.chip) { ST.chip = p.chip; ST.chipDi = p.chip }
  render();
  toast('↗ Đã mở <b>' + esc(CHIP_DEN[p.chip] || 'danh sách') + '</b> trong sổ — '
    + 'cùng bộ lọc với ô số bạn vừa bấm.');
}
</script>
