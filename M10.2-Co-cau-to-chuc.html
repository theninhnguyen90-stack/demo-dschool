<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10.2 Thông tin trường — Dschool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--line2:#cbd5e1;
 --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--brand:#1d4ed8;--brand-soft:#eff6ff;
 --red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
 --green:#059669;--green-soft:#ecfdf5;--violet:#7c3aed;--violet-soft:#f5f3ff}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

.hdr{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 15px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.school{color:var(--ink2);font-size:12.5px;border-left:1px solid var(--line);padding-left:13px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;background:#fff}
.sel:disabled{background:#f1f5f9;color:var(--ink3);cursor:not-allowed}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;font-size:15px}
.icobtn:hover{background:var(--bg)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.lockico{font-size:11px;color:var(--amber);white-space:nowrap}

.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{width:222px;flex:0 0 222px;background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.sgrp{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 5px}
.snav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:12.5px;margin-bottom:1px}
.snav:hover{background:var(--bg)}
.snav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav.off{opacity:.34;pointer-events:none}
.main{flex:1;padding:7px 18px 40px;min-width:0}

.tophd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;font-weight:700}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#1e40af}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:7px 0 0;flex-wrap:wrap;align-items:flex-end}
.tab1{padding:8px 9px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:6px}
.tab1.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab1 .b{background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px}
.tab1.on .b{background:var(--brand);color:#fff}
.tab1 .b.al{background:var(--red);color:#fff}
.tabtools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:5px}

.scope{display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);
 border-radius:9px;padding:6px 12px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.scope b{color:var(--ink)}
.scope .sp{flex:1}
.scope.am{border-left-color:var(--amber);background:var(--amber-soft)}
.scope.rd{border-left-color:var(--red);background:var(--red-soft)}
.scope.vi{border-left-color:var(--violet)}

.inp{border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font-size:12.5px;background:#fff;width:126px}
.qf{border:1px solid var(--line2);border-radius:999px;padding:3px 9px;font-size:11.5px;background:#fff;white-space:nowrap}
.qf.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}

.stage{display:flex;gap:13px;align-items:flex-start;margin-top:8px}
.listw{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.stage.open .panel{display:block}
@media(max-width:1300px){.stage.open .listw{display:none}}

.grow{display:flex;align-items:center;gap:9px;padding:5px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;flex-wrap:wrap}
.grow.k2{padding-left:26px;background:#fcfdfe;font-size:12px}
.grow .ct{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;display:flex;gap:10px}
.hdrow{display:grid;gap:9px;padding:6px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.hrow{display:grid;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;border-left:3px solid transparent;font-size:13px}
.hrow:hover{background:var(--brand-soft)}
.hrow.on{background:#eff6ff;border-left-color:var(--brand)}
.hrow.gone{opacity:.5}
.hrow.sub{padding-left:32px}
.glop{grid-template-columns:.85fr .7fr .95fr 1.05fr 1.2fr 1fr 1.3fr}
.stage.open .glop{grid-template-columns:.9fr 1.1fr}
.gdt{grid-template-columns:1.5fr 1fr .95fr .85fr 1.2fr .95fr 1fr}
.stage.open .gdt{grid-template-columns:1.5fr 1fr}
.ghe{grid-template-columns:1.3fr 1.7fr .7fr .8fr 1fr}
.ghe.c{grid-template-columns:1.35fr 1.15fr 1.25fr .6fr .8fr .85fr}
.gmon{grid-template-columns:1.95fr .9fr .75fr .9fr 1.15fr .9fr}
/* dong chu thich he qua, nam NGAY DUOI dong mon Cua truong */
.subwarn{padding:6px 13px 8px 30px;border-bottom:1px solid var(--line);background:var(--amber-soft);
 color:#92400e;font-size:11.5px;line-height:1.5}
/* dai canh bao dat TREN danh sach cua mot tab */
.warnbar{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;border-radius:9px;
 padding:8px 12px;font-size:12.5px;line-height:1.5;margin-bottom:9px}
/* hai con so tach nhau — bao nhieu mon THUC SU vao hoc ba */
.splitbar{display:flex;gap:22px;flex-wrap:wrap;padding:7px 12px;margin-top:7px;background:#f8fafc;
 border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--ink2)}
.gto{grid-template-columns:1.5fr 2fr .85fr 1.15fr .8fr .9fr}
.dnum{border:1px solid var(--line2);border-radius:7px;padding:3px 7px;font-size:13px;width:56px;text-align:center;background:#fff}
.dnum:focus{border-color:var(--brand);outline:none}
.locrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:5px 13px;background:#f8fafc;border-bottom:1px solid var(--line)}
.stage.open .kx{display:none}

.st2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
.st2.o{background:var(--green-soft);color:var(--green)}
.st2.w{background:var(--amber-soft);color:var(--amber)}
.st2.r{background:var(--red-soft);color:var(--red)}
.st2.n{background:var(--bg);color:var(--ink2)}
.st2.b{background:#e0e7ff;color:#3730a3}
.st2.v{background:var(--violet-soft);color:#5b21b6}
.pill{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.mas{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:#e0e7ff;color:#3730a3;white-space:nowrap}
.yr{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.rolnk{font-size:10px;font-weight:700;color:var(--brand);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.rolnk:hover{background:#e0e7ff}
.rolnk.off{color:var(--ink3);background:var(--bg);border-color:var(--line);cursor:not-allowed}
.ss{font-variant-numeric:tabular-nums;white-space:nowrap}
.ss b{font-size:13.5px}
.ss .gc{color:var(--violet);font-weight:700;font-size:11.5px}
.ss.full b{color:var(--red)}

.info{background:var(--brand-soft);border:1px solid #bfdbfe;color:#1e40af;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.warn{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.danger{background:var(--red-soft);border:1px solid #fecaca;color:#991b1b;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.okbx{background:var(--green-soft);border:1px solid #a7f3d0;color:#065f46;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.ro{background:#f8fafc;border:1px solid var(--line);color:var(--ink2);padding:8px 11px;border-radius:9px;font-size:12px;margin-bottom:11px}
.empty{padding:34px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:5px;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:9px}
.card h3{font-size:13.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.f{display:grid;grid-template-columns:170px 1fr;gap:11px;align-items:center;padding:6px 0;font-size:13px}
.f+.f{border-top:1px solid #f1f5f9}
.f .k{color:var(--ink2);font-size:12.5px}
.f .v{font-weight:600;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sech{font-size:13px;font-weight:700;margin:15px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bhtree{font-size:12.5px;color:var(--ink2);line-height:1.9;padding-left:16px;border-left:2px solid var(--line);margin-top:4px}
.bhtree b{color:var(--ink)}

.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph .n h2{font-size:15px;font-weight:700}
.ph .n .m{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbody{padding:13px 15px;max-height:calc(100vh - 250px);overflow-y:auto}
.pfoot{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--line);background:#fcfdfe;flex-wrap:wrap}

.lbl{font-size:12px;color:var(--ink2);display:block;margin:9px 0 3px}
.lbl b{color:var(--red)}
.din{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:13px;background:#fff;width:100%}
.din:disabled{background:#f1f5f9;color:var(--ink3)}
.ta{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;min-height:52px;resize:vertical;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.chkl{display:flex;gap:5px;flex-wrap:wrap}
.chkb{border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12px;background:#fff}
.chkb.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.chkb:disabled{opacity:.4;cursor:not-allowed}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sgb{border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:12.5px;background:#fff;text-align:left;line-height:1.35;flex:1;min-width:190px}
.sgb b{display:block}
.sgb span{font-size:10.5px;color:var(--ink3)}
.sgb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.sgb.on span{color:var(--brand)}
.sgb:disabled{opacity:.45;cursor:not-allowed}

.imp{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.impr{display:grid;grid-template-columns:1fr auto 74px;gap:10px;padding:7px 12px;border-top:1px solid var(--line);font-size:12.5px;align-items:center}
.impr:first-child{border-top:none;background:#f8fafc;font-weight:700;font-size:11px;text-transform:uppercase;color:var(--ink3);letter-spacing:.04em}
.impr .num{font-weight:700;font-size:14px}
.impr.bad{background:var(--red-soft)}.impr.bad .num{color:var(--red)}
.impr.al{background:var(--amber-soft)}.impr.al .num{color:var(--amber)}

.res{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:9px}
.resh{padding:7px 11px;font-size:12px;font-weight:700}
.resh.ok{background:var(--green-soft);color:#065f46}
.resh.sk{background:var(--amber-soft);color:#92400e}
.resr{padding:6px 11px;font-size:12.5px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
.resr .w{min-width:215px;font-weight:600}
.resr .r{color:var(--ink2);flex:1;min-width:170px}
.prev{max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;background:#fcfdfe;display:flex;gap:5px;flex-wrap:wrap}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;place-items:center}
.mask.on{display:grid}
.modal{background:#fff;border-radius:13px;width:880px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.mb{padding:15px 18px;overflow-y:auto;font-size:13px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.blk:last-child{border-bottom:none}
.blk .ic{flex:0 0 18px;font-size:13px}
.blk .tx{flex:1}

.rolebar{background:#0f172a;color:#cbd5e1;padding:8px 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.rolebar b{color:#fff}
.rb{border:1px solid #334155;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e1}
.rb:hover{background:#1e293b;color:#fff}
.rb.on{background:#fff;color:#0f172a;border-color:#fff;font-weight:700}
.rb.dt.on{background:#fbbf24;color:#0f172a;border-color:#fbbf24}
.note{margin-left:auto;color:#64748b;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;z-index:80;transition:transform .22s;max-width:92vw}
.toast.on{transform:translateX(-50%)}
.logl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.logi{position:relative;padding:7px 0;font-size:12.5px}
.logi::before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logi.w::before{background:var(--amber)}.logi.g::before{background:var(--green)}.logi.r::before{background:var(--red)}
.logi b{display:block;font-weight:600}
.logi .mm{color:var(--ink3);font-size:11.5px}
.dnote{font-size:11px;color:var(--violet);background:var(--violet-soft);border:1px dashed #ddd6fe;border-radius:7px;padding:6px 9px;margin-top:8px;line-height:1.6}

/* ===== v3.0 Thong tin truong — bang danh muc mon + hai cot the ===== */
.grid2.wide{grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.grid2.wide{grid-template-columns:1fr}}
.sub{font-size:11.5px;color:var(--ink3);font-weight:400}
.locrow2{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:7px 12px;background:#f8fafc;border-bottom:1px solid var(--line)}
.tbw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{background:#f8fafc;color:var(--ink3);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tb .c{text-align:center}
.tb .k{width:34px;font-variant-numeric:tabular-nums}
.tb .dim{color:var(--line2)}
.tb tbody tr[data-x]{cursor:pointer}
.tb tbody tr[data-x]:hover{background:var(--brand-soft)}
.tb tbody tr.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--brand)}
.tb tbody tr.gone{opacity:.55}
.tb tr.grp td{background:#f8fafc;font-weight:700;font-size:12px;padding:5px 10px}
.tb.sm td,.tb.sm th{padding:4px 7px}
.stage.open .listw .tb .k,.stage.open .listw .tb th.k{display:none}
.stage.open .listw .tb th[colspan]{display:none}
.stage.open .listw .tb td:nth-child(3),.stage.open .listw .tb th:nth-child(3){display:none}
.stage.open .locrow2 .sub[title]{display:none}
.locrow2 .qf{padding:2px 9px}
.locrow2 .inp{padding:3px 9px}

/* ===== CSDL-1A (19/9/2026) ===== */
.hint{font-size:11.5px;color:var(--ink2);font-weight:400;margin-top:3px;line-height:1.45}
.muted{color:var(--ink3);font-weight:400}
.f .v .hint b{color:var(--ink)}

/* --- cum GDDP (20/9/2026): bang phuong thuc trong panel tang 2 cua mot mon --- */
.tb.sm.ptb{table-layout:fixed}
.tb.sm.ptb th:nth-child(1),.tb.sm.ptb td:nth-child(1){width:32%}
.tb.sm.ptb th:nth-child(2),.tb.sm.ptb td:nth-child(2){width:32%}
.tb.sm.ptb th:nth-child(3),.tb.sm.ptb td:nth-child(3){width:19%}
.tb.sm.ptb th:nth-child(4),.tb.sm.ptb td:nth-child(4){width:17%}
.tb.sm.ptb td:nth-child(2) .chip{margin:1px 2px}
</style>
</head>
<body>
<script>/* sidebar da chuyen ve index.html — node an giu cho JS cu khong vo */
(function(){var n=document.createElement("nav");n.id="side";n.style.display="none";document.documentElement.appendChild(n)})();</script>

<div class="rolebar">
  <b>Chức danh:</b>
  <button class="rb on" data-r="FULL">🔓 Đủ quyền (demo)</button>
  <button class="rb" data-r="HT">Hiệu trưởng</button>
  <button class="rb" data-r="PHT_CM">PHT Chuyên môn</button>
  <button class="rb" data-r="IT_Admin">IT Admin</button>
  <button class="rb" data-r="PHT_DT">PHT Đào tạo</button>
  <button class="rb" data-r="TCNS">Tổ chức nhân sự</button>
  <button class="rb dt" id="btnNote">💡 Ghi chú thiết kế</button>
  <span class="note">Master — không thuộc năm học nào · cấu hình theo năm ở <b>M10.1</b></span>
</div>

<header class="hdr">
  <div class="logo"><span class="mark">DS</span> Dschool</div>
  <div class="school">THCS &amp; THPT Nguyễn Tất Thành</div>
  <select class="sel" id="hnam"></select>
  <select class="sel" id="hdt"></select>
  <span class="lockico" id="dtlock"></span>

ACT.luuTruong=function(){

 /* CSDL-1A — kiem + ghi bon khoi moi TRUOC khi dong modal; tra ve chuoi ⛔ thi khong luu gi ca */
 const loi=luuCSDL();if(loi){toast(loi);return}
 const cu=TRUONG.ten;TRUONG.ten=t;TRUONG.sdt=$('#stSdt').value;TRUONG.email=$('#stMail').value;
 logTruong('Sửa thông tin trường',cu!==t?'Tên: '+cu+' → '+t:'Liên hệ · định danh · địa bàn · pháp lý · đất đai');
 closeModal();render();
 const cb=V.canhBao||[];V.canhBao=[];
 toast(cb.length?'Đã lưu — <b>'+cb.length+' cảnh báo, không chặn</b>:<br>'+cb.join('<br>')
   :'Đã lưu · không cần ký số — chỉ Audit (§8)');
};

ACT.coChuyen=function(el){
 if(!can('suaTruong')){el.checked=TRUONG.chuyen;toast('Vai <b>'+esc(R().ten)+'</b> không sửa được Thông tin trường');return}
 if(!TRUONG.chuyen){TRUONG.chuyen=true;logTruong('Bật cờ Trường chuyên','');render();
  toast('Đã bật cờ <b>Trường chuyên</b> — M10.1 ② hiện cột Môn chuyên của hệ; trần sĩ số lớp chuyên về <b>35</b> (TT 05/2023)');return}
 el.checked=true;
 /* R5 (R33 cu) — tat co khi con he mang mon chuyen: DOC DU LIEU M10.1 cua moi nam con ghi duoc */
 const aff=namMo().map(n=>({n:n,he:heChuyenNam(n)})).filter(x=>x.he.length);
 if(!aff.length){TRUONG.chuyen=false;logTruong('Tắt cờ Trường chuyên','');render();toast('Đã tắt cờ <b>Trường chuyên</b>');return}
 modal('⚠ Tắt cờ Trường chuyên — R5',
  '<div class="warn">Còn <b>hệ đào tạo mang môn chuyên</b> ở hồ sơ năm học đang mở. Tắt cờ thì các hệ đó <b>mất ý nghĩa</b>.</div>'+
  '<div class="sech">Ảnh hưởng — đọc từ M10.1 🔗</div>'+
  aff.map(x=>'<div class="blk"><div class="ic">▸</div><div class="tx">Hồ sơ <b>'+x.n.ten+'</b> '+stTT(x.n.tt)+'<br>'+x.he.map(h=>'<b>'+esc(HEM[h].ten)+'</b> — môn chuyên '+esc(monTen(HEM[h].mc))+', '+
   x.n.lop.filter(l=>l.he===h).map(l=>l.ten).join(' · ')).join('<br>')+'<br>⇒ <b>'+x.n.lop.filter(l=>HEM[l.he].mc).length+' lớp</b> đổi trần sĩ số từ <b>35</b> <i>(TT 05/2023)</i> lên <b>45</b> <i>(TT 15/2026)</i> '+
   dlink('M10.1','M10.1 ② hệ','ctx='+x.n.id+'&muc=2')+' '+dlink('M10.1','M10.1 ③ lớp','ctx='+x.n.id+'&muc=3')+'</div></div>').join('')+
  '<div class="ro" style="margin-top:10px"><b>Cảnh báo, không chặn</b> — chuyển đổi mô hình đi kèm một quyết định hành chính mà phần mềm không có quyền cản. Năm đã khóa sổ, đã kết thúc giữ nguyên.</div>'+
  '<label class="lbl">Lý do <b>*</b></label><textarea class="ta" id="lyDoCh"></textarea>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="doTatChuyen">Vẫn tắt</button>');
};
ACT.doTatChuyen=function(){
 const ld=$('#lyDoCh');if(!ld||!ld.value.trim()){toast('⚠ <b>Bắt buộc ghi lý do</b> — R5');return}

};

/* ----- R15: Loai truong vs co Truong chuyen — ⚠ canh bao, KHONG chan ----- */
function canhBaoLoai(){
 if(TRUONG.loaiTruong==='chuyen'&&!TRUONG.chuyen)
  return '<b>Loại trường</b> = <i>Chuyên</i> nhưng cờ <b>Trường chuyên</b> đang <b>tắt</b> — cờ mới là tư cách pháp lý theo TT 05/2023. Kiểm tra lại quyết định thành lập. <b>Không chặn</b> (R15)';
 if(TRUONG.chuyen&&TRUONG.loaiTruong!=='chuyen')
  return 'Cờ <b>Trường chuyên</b> đang bật nhưng <b>Loại trường</b> = <i>'+esc(LOAITRUONG[TRUONG.loaiTruong])+'</i> — hợp lệ nếu mẫu biểu của Sở yêu cầu thế. <b>Không chặn</b> (R15)';
 return '';
}

/* ----- luu bon khoi moi: goi tu ACT.luuTruong. Tra ve chuoi loi (⛔) hoac '' ----- */
function luuCSDL(){
 const g=id=>{const e=$('#'+id);return e?e.value.trim():null};
 const n=id=>{const v=g(id);return v===''||v==null?null:(/^\d+$/.test(v)?parseInt(v,10):NaN)};
 /* --- R13: ma so thue 10 hoac 13 chu so — CHAN --- */
 const mst=g('stMST');
 if(mst!=null){
  const s=mst.replace(/[\s-]/g,'');
  if(s&&!/^\d{10}(\d{3})?$/.test(s))return '⛔ <b>Mã số thuế</b> phải có <b>10 hoặc 13 chữ số</b> (R13) — đang có '+s.replace(/\D/g,'').length+' chữ số';
  TRUONG.maSoThue=mst;
 }
 /* --- R14: doi ma dinh danh — canh bao, KHONG kiem 20 chu so --- */
 const ddtc=g('stDDTC'),dddt=g('stDDDT'),doiMa=[];
 if(ddtc!=null&&ddtc!==TRUONG.maDDTC){doiMa.push('mã định danh tổ chức: '+TRUONG.maDDTC+' → '+ddtc);TRUONG.maDDTC=ddtc}
 if(dddt!=null&&dddt!==TRUONG.maDDDT){doiMa.push('mã định danh điện tử: '+TRUONG.maDDDT+' → '+dddt);TRUONG.maDDDT=dddt}
 /* --- cac so nam: khong phai so => chan; lon hon nam nay => ⚠ (R16) --- */
 const NAMF=[['stNamTL','namTL','Năm thành lập'],['stCQGNam','cqgNam','Năm đánh giá chuẩn QG'],
  ['stTuDGNam','tuDGNam','Năm tự đánh giá'],['stDKNgoai','dkNgoaiNam','Năm đăng ký đánh giá ngoài'],
  ['stNgoaiNam','ngoaiNam','Năm đánh giá ngoài']];
 const canhBao=[];
 for(const f of NAMF){
  const v=n(f[0]);if(v!==null&&isNaN(v))return '⛔ <b>'+f[2]+'</b> phải là số năm';
  TRUONG.pl[f[1]]=v;
  if(namTuongLai(v))canhBao.push('⚠ <b>'+f[2]+' = '+v+'</b> lớn hơn năm hiện tại '+NAMNAY+' (R16)');
 }
 /* --- dien tich --- */
 const dat=n('stDatM2'),xd=n('stXdM2');
 if(dat!==null&&isNaN(dat))return '⛔ <b>Diện tích đất</b> phải là số';
 if(xd!==null&&isNaN(xd))return '⛔ <b>Diện tích xây dựng</b> phải là số';
 TRUONG.dt.dat=dat;TRUONG.dt.xd=xd;
 if(dat!=null&&xd!=null&&xd>dat)canhBao.push('⚠ <b>Diện tích xây dựng vượt diện tích đất</b> — thường là đã gõ nhầm tổng diện tích sàn (R18)');
 /* --- con lai --- */
 if(g('stFax')!=null)TRUONG.fax=g('stFax');
 if(g('stLoai')!=null)TRUONG.loaiTruong=g('stLoai');
 if(g('stSoQD')!=null)TRUONG.pl.soQD=g('stSoQD');
 if(g('stCQG')!=null)TRUONG.pl.cqgMuc=g('stCQG');
 if(g('stKV')!=null)TRUONG.khuVuc=g('stKV');
 ['cqgDeNghi','tuDG','ngoaiDat','coChiBo'].forEach((k,i)=>{
  const id=['stCQGDN','stTuDG','stNgoaiDat','stChiBo'][i],v=g(id);if(v!=null)TRUONG.pl[k]=v});
 Object.keys(CVTEN).forEach(k=>{const v=g('stCV_'+k);if(v!=null)TRUONG.cv[k]=v});
 thuNhatForm();
 /* --- R17 --- */
 if(TRUONG.pl.ngoaiDat==='c'&&TRUONG.pl.tuDG!=='c')
  canhBao.push('⚠ <b>Đạt đánh giá ngoài nhưng chưa đạt tự đánh giá</b> — thứ tự đúng là tự đánh giá trước, đánh giá ngoài sau (R17)');
 /* --- R15 --- */
 if(canhBaoLoai())canhBao.push('⚠ <b>Loại trường</b> và cờ <b>Trường chuyên</b> đang lệch nhau (R15)');
 if(doiMa.length)logTruong('Đổi mã định danh',doiMa.join(' · '),'w');
 if(canhBao.length)logTruong('Cảnh báo khi lưu',canhBao.length+' cảnh báo — không chặn','w');
 V.canhBao=canhBao;
 return '';
}

  if(!V.ng[nguonMon(m)])return false;
  if(!V.tt[m.ngung?'ngung':'dung'])return false;
  return !q||(m.ten+' '+m.ma).toLowerCase().indexOf(q)>=0;
 });
}

const chuanHoa=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]/g,'');
ACT.doTaoMon=function(el){
 const ma=$('#tmMa').value.trim().toUpperCase(),ten=$('#tmTen').value.trim();
 if(!ma||!ten){toast('⛔ Thiếu <b>'+(!ma?'mã môn':'tên môn')+'</b> — R8');return}
 if(monM(ma)){toast('⛔ Mã <b>'+esc(ma)+'</b> đã có trong danh mục ('+esc(monTen(ma))+') — R8');return}
 /* R8 — ten trung mon CHUAN: canh bao mem, vi tao mon rieng trung ten se tu mang Cua truong va KHONG vao hoc ba */
 const tr=MON.filter(m=>!m.cua&&chuanHoa(m.ten)===chuanHoa(ten))[0];
 if(tr&&!el.dataset.ok){el.dataset.ok='1';el.textContent='Vẫn tạo';
  $('#mb').insertAdjacentHTML('afterbegin','<div class="danger">⚠ <b>Nghi trùng môn chuẩn</b> — danh mục đã có <b>'+esc(tr.ten)+'</b> ('+tr.ma+', CT GDPT). Có phải bạn định <b>bật môn chuẩn đó</b> ở M10.1 ④? '+
   'Tạo môn riêng trùng tên thì nó <b>tự mang Của trường</b> và <b>không vào học bạ</b>. Bấm <b>Vẫn tạo</b> nếu đúng là môn khác.</div>');return}
 const cap=$('#tmCap').value,t=parseInt($('#tmTiet').value,10)||35,ti={};CAPK[cap].forEach(k=>{ti[k]=t});
 const m={ma:ma,ten:ten,cua:1,nhom:{[cap]:'ct'},tiet:ti,kdg:$('#tmKdg').value,tao:{k:'m102',ai:nguoiLog(),ngay:HOMNAY,hs:''},ls:[]};
 m.ls.push({d:HOMNAY,ng:nguoiLog(),t:'Tạo tại M10.2',n:'Nguồn chương trình = Của trường (dẫn xuất)'+(tr?' · đã bỏ qua cảnh báo nghi trùng '+tr.ten:'')});
 MON.push(m);V.pick=ma;V.tt.dung=1;V.ng.truong=1;closeModal();render();
 toast('Đã tạo <b>'+esc(ten)+'</b> — Của trường · chưa dạy ở năm nào. Bật cho năm học ở M10.1 ④');

 modal('✎ Sửa môn — '+esc(m.ten),'<div class="warn">⚠ Trường <b>Master</b> — áp cho mọi năm học (R3).</div>'+
  '<div class="grid2"><div><label class="lbl">Tên môn <b>*</b></label><input class="din" id="smTen" value="'+esc(m.ten)+'"></div>'+
  '<div><label class="lbl">Kiểu đánh giá mặc định</label><select class="din" id="smKdg"><option value="ds"'+(m.kdg==='ds'?' selected':'')+'>Điểm số</option><option value="nx"'+(m.kdg==='nx'?' selected':'')+'>Nhận xét</option></select>'+
  '<div class="sub">chỉ áp cho lần cấu hình sau — lớp đã cấu hình giữ nguyên (R12)</div></div>'+
  '<div><label class="lbl">Số tiết/năm dự kiến <span class="sub">(mọi khối '+capsMon(m).join(', ')+')</span></label><input class="din" id="smTiet" value="'+m.tiet[k0]+'">'+
  '<div class="sub">đổi ngưỡng 35 / 70 thì đổi số cột ĐGtx mặc định (R11)</div></div></div>',
  '<button class="btn" data-x="close">Hủy</button><button class="btn p" data-x="doSuaMon" data-m="'+m.ma+'">Lưu</button>');
};
ACT.doSuaMon=function(el){
 const m=monM(el.dataset.m),ten=$('#smTen').value.trim(),kdg=$('#smKdg').value,t=parseInt($('#smTiet').value,10);
 if(!ten||!t){toast('⛔ Thiếu tên hoặc số tiết');return}
 const k0=khoiMon(m)[0],tCu=m.tiet[k0],moi=Object.assign({},m,{tiet:{},kdg:kdg});khoiMon(m).forEach(k=>{moi.tiet[k]=t});
 /* R11 — so cot DGtx mac dinh doi: lop dung MAC DINH o nam con ghi duoc tu tinh lai */
 const doi=[];namMo().forEach(n=>lopHoc(n,m.ma).forEach(l=>{const a=cotTx(m,l.khoi),b=cotTx(Object.assign({},m,{tiet:moi.tiet}),l.khoi);if(a!==b)doi.push({n:n,l:l,a:a,b:b})}));
 const giam=doi.filter(x=>x.b<x.a&&x.l.diem);
 if(giam.length){modal('⛔ Không đổi được số tiết — R11','<div class="danger"><b>Giảm số cột ĐGtx ở lớp đã có điểm.</b> '+tCu+' → '+t+' tiết/năm làm mặc định giảm từ <b>'+giam[0].a+'</b> xuống <b>'+giam[0].b+'</b> cột ở: '+
   giam.map(x=>'<b>'+x.l.ten+'</b> ('+x.n.ten+')').join(' · ')+' — cột thứ '+giam[0].a+' đã có điểm ở M2.5.</div>'+
   '<div class="ro">Lối ra: ở '+dlink('M10.1','M10.1 ⑥ lớp '+giam[0].l.ten,'ctx='+giam[0].n.id+'&muc=6&lop='+encodeURIComponent(giam[0].l.ten))+' ghi tay <b>'+giam[0].a+' cột</b> cho lớp đó (kèm lý do) — lớp không còn đi theo mặc định, rồi quay lại đổi số tiết.</div>');return}
 if(doi.length&&!el.dataset.ok){el.dataset.ok='1';el.textContent='Vẫn lưu';

 logMon(m,'Ngưng dùng phương thức '+p.ma,ly,'w');closeModal();render();
 toast('Đã ngưng <b>'+esc(p.ten)+'</b> — vẫn hiện trong panel, không hiện ở ô chọn của M10.1 ⑥');
};
ACT.ptDungLai=function(el){
 const m=monM(el.dataset.m),p=ptM(m.ma,el.dataset.p);
 p.tt='dung';p.ls.push({d:HOMNAY,ng:nguoiLog(),t:'Dùng lại',n:''});
 logMon(m,'Dùng lại phương thức '+p.ma,'');render();toast('Đã mở lại <b>'+esc(p.ten)+'</b> — chọn được ở M10.1 ⑥');
};


/* =================================================================================
   SU KIEN + DEEP-LINK VAO M10.2
   /M10.2?tab=truong|danh_muc_mon[&ma={ma_mon}][&action=tao]&return={menu-goc}
   Duong dan CU toi tab ②–⑥ (da doi sang M10.1) -> dai "da doi" kem deep-link dung muc M10.1
   ================================================================================= */
ACT.close=function(){closeModal()};
ACT.tab=function(el){V.tab=el.dataset.t;V.pick=null;render()};
ACT.dl=function(el){moMenu(el.dataset.m,el.dataset.q)};
ACT.boCu=function(){V.cu=null;render()};
ACT.quayVe=function(){
 const q='ctx='+(THAM.get('rctx')||V.nam)+(THAM.get('rmuc')?'&muc='+THAM.get('rmuc'):'')+'&vai='+role;
 location.href=TEP_MENU['M10.1']+'?'+q;
};
document.addEventListener('click',function(ev){
 const rb=ev.target.closest('.rb');
 if(rb&&rb.dataset.r){role=rb.dataset.r;$$('.rb[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===role));
  closeModal();render();toast('Đang xem với vai trò <b>'+esc(R().ten)+'</b> — '+R().dai);return}
 if(ev.target.closest('#btnNote')){ghiChu=!ghiChu;$('#btnNote').classList.toggle('on',ghiChu);render();return}
 const el=ev.target.closest('[data-x]');if(!el)return;
 if(el.tagName==='INPUT'&&el.type==='checkbox'){ev.preventDefault();}
 const f=ACT[el.dataset.x];if(f)f(el,ev);
});
document.addEventListener('input',function(ev){
 const t=ev.target;
 if(t.id==='qq'){V.q=t.value;const c=t.selectionStart;render();const q=$('#qq');if(q){q.focus();q.setSelectionRange(c,c)}}
});
document.addEventListener('change',function(ev){
 const t=ev.target;
 if(t.id==='hnam'){V.nam=t.value;render();const n=namBy(V.nam);
  toast('Menu Master — dữ liệu <b>không đổi</b>. Chỉ phần dẫn xuất đọc lại hồ sơ <b>'+n.ten+'</b> ('+TT[n.tt][0]+')');}
});

/* ----- nap tham so URL ----- */
(function(){
 const vai=({IT:'IT_Admin'})[THAM.get('vai')]||THAM.get('vai');if(vai&&ROLE[vai]){role=vai;$$('.rb[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===role))}
 const ctx=THAM.get('ctx')||THAM.get('rctx');if(ctx){const n=namBy(ctx)||NAM.filter(x=>x.ten===ctx)[0];if(n)V.nam=n.id}
 const tab=(THAM.get('tab')||'').toLowerCase();
 /* tab cu da doi: ma → [ten tab cu, muc M10.1] */
 const CU={diem_truong:['② Điểm trường',[2]],'2':['② Điểm trường',[2]],he_dao_tao:['③ Hệ đào tạo',[2]],he:['③ Hệ đào tạo',[2]],'3':['③ Hệ đào tạo',[2]],
  danh_muc_lop:['④ Danh mục lớp',[3]],lop:['④ Danh mục lớp',[3]],'4':['④ Danh mục lớp',[3]],
  mon_hoc:['⑤ Môn học (môn áp dụng)',[4,6]],mon:['⑤ Môn học (môn áp dụng)',[4,6]],'5':['⑤ Môn học (môn áp dụng)',[4,6]],
  to_chuyen_mon:['⑥ Tổ chuyên môn',[5]],to:['⑥ Tổ chuyên môn',[5]],'6':['⑥ Tổ chuyên môn',[5]]};
 if(tab==='danh_muc_mon')V.tab='mon';
 else if(CU[tab])V.cu={tab:tab,ten:CU[tab][0],muc:CU[tab][1]};
 const ma=(THAM.get('ma')||'').toUpperCase();
 if(ma&&monM(ma)){V.tab='mon';V.pick=ma;if(monM(ma).ngung)V.tt.ngung=1}
 render();
 if(THAM.get('action')==='tao'&&V.tab==='mon'&&can('mon'))ACT.mTaoMon();
})();
</script>
